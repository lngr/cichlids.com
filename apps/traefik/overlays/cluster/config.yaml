apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  valuesContent: |
    deployment:
      replicas: 1
    service:
      type: LoadBalancer
      spec:
        externalTrafficPolicy: Local
    ports:
      web:
        exposedPort: 80
      websecure:
        exposedPort: 443
    providers:
      file:
        enabled: true
        content: |
          http:
            routers:
              https-redirect:
                entryPoints:
                - web
                rule: '!PathPrefix(`/.well-known/acme-challenge/`)'
                priority: 2147483646
                middlewares:
                - https-redirect
                service: noop@internal
            middlewares:
              tailnet-only:
                ipAllowList:
                  sourceRange:
                  - 100.64.0.0/10
                  - fd7a:115c:a1e0::/48
              https-redirect:
                redirectScheme:
                  scheme: https
                  permanent: true

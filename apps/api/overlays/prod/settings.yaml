apiVersion: v1
kind: ConfigMap
metadata:
  name: api-settings
data:
  ASPNETCORE_ENVIRONMENT: Production
  Authentication__Authority: https://auth.cichlids.com/realms/cichlids
  Authentication__Audience: cichlids-api
  Authentication__RequireHttpsMetadata: 'true'
  DataProtection__KeyRingPath: /keys
  WebSession__SecureCookies: 'true'
  ObjectStorage__ServiceUrl: https://nbg1.your-objectstorage.com
  ObjectStorage__Region: nbg1
  ObjectStorage__Bucket: REPLACE_WITH_PROD_MEDIA_BUCKET
  ObjectStorage__PublicBaseUrl: https://REPLACE_WITH_PROD_MEDIA_BUCKET.nbg1.your-objectstorage.com
  ObjectStorage__ForcePathStyle: 'false'
  OutboxDispatcher__Enabled: 'false'
  WebPush__Enabled: 'false'
  ASPNETCORE_FORWARDEDHEADERS_ENABLED: 'true'
  FeatureFlags__discover-activity: 'false'

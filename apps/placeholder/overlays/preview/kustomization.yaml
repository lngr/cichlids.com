apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
patches:
- target:
    kind: Ingress
    name: placeholder
  patch: |
    - op: replace
      path: /spec/rules/0/host
      value: pr-0.dev.cichlids.com
    - op: replace
      path: /spec/tls/0/hosts/0
      value: pr-0.dev.cichlids.com

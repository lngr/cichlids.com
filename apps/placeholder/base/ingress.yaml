apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: placeholder
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - placeholder.invalid
    secretName: placeholder-tls
  rules:
  - host: placeholder.invalid
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: placeholder
            port:
              number: 80

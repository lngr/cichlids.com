apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
patches:
- target:
    kind: Deployment
    name: barman-cloud
  patch: "- op: add\n  path: /spec/template/spec/containers/0/resources\n  value:\n\
    \    requests: {cpu: 50m, memory: 128Mi}\n    limits: {cpu: 500m, memory: 256Mi}\n"
resources:
- ../../base

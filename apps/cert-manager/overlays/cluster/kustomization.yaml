apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- issuers.yaml
configMapGenerator:
- name: acme-settings
  namespace: cert-manager
  literals:
  - email=acme@cichlids.com
generatorOptions:
  disableNameSuffixHash: true
replacements:
- source:
    kind: ConfigMap
    name: acme-settings
    fieldPath: data.email
  targets:
  - select:
      kind: ClusterIssuer
    fieldPaths:
    - spec.acme.email

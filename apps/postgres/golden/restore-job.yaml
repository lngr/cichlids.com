apiVersion: batch/v1
kind: Job
metadata:
  name: golden-snapshot
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: golden-snapshot
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: restore
        image: ghcr.io/lngr/cichlids-golden-snapshot:1
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        envFrom:
        - configMapRef:
            name: golden-snapshot
        - secretRef:
            name: golden-reader
        env:
        - name: GOLDEN_TARGET_DSN
          valueFrom:
            secretKeyRef:
              name: postgres-app
              key: uri
        - name: GOLDEN_ENVIRONMENT
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
            ephemeral-storage: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
            ephemeral-storage: 2Gi

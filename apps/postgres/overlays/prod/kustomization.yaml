apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cichlids-prod
metadata:
  annotations:
    cichlids.com/stateful: 'true'
patches:
- path: backup-patch.yaml
- path: storage-patch.yaml
- target:
    kind: Cluster
    name: postgres
  patch: |
    apiVersion: postgresql.cnpg.io/v1
    kind: Cluster
    metadata:
      name: postgres
    spec:
      managed:
        roles:
        - name: keycloak
          ensure: present
          login: true
          passwordSecret:
            name: keycloak-db
resources:
- ../../base
- object-store.yaml
- scheduled-backups.yaml
- ../../keycloak

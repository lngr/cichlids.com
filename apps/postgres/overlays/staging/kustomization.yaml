apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cichlids-staging
metadata:
  annotations:
    cichlids.com/stateful: 'true'
resources:
- ../../base
- ../../golden
- ../../keycloak
patches:
- target:
    kind: Cluster
    name: postgres
  patch: |
    apiVersion: postgresql.cnpg.io/v1
    kind: Cluster
    metadata:
      name: postgres
    spec:
      managed:
        roles:
        - name: keycloak
          ensure: present
          login: true
          passwordSecret:
            name: keycloak-db

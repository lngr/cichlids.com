apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  annotations: null
  finalizers: null
spec:
  inheritedMetadata: null
  storage:
    size: 1Gi
    pvcTemplate:
      resources:
        requests:
          storage: 1Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 768Mi

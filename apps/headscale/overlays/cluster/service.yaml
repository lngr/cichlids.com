apiVersion: v1
kind: Service
metadata:
  name: headscale
spec:
  type: ClusterIP
  selector:
    app: headscale
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: headscale-stun
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: headscale
  ports:
  - name: stun
    protocol: UDP
    port: 3478
    targetPort: stun

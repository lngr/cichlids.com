apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    cichlids.com/stateful: "true"
namespace: headscale
resources:
- namespace.yaml
- storage.yaml
- workload.yaml
- service.yaml
- ingress.yaml
configMapGenerator:
- name: headscale
  files:
  - config.yaml
  - backup.py

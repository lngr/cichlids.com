apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- upstream.yaml
patches:
- target:
    kind: Namespace
  patch: |
    - op: add
      path: /metadata/annotations
      value:
        argocd.argoproj.io/sync-options: Prune=false,Delete=false
        argocd.argoproj.io/sync-wave: "-3"

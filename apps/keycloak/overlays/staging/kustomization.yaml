apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cichlids-staging
resources:
- ../../base
configMapGenerator:
- name: keycloak-realm
  files:
  - cichlids-realm.json
patches:
- target:
    kind: Deployment
    name: keycloak
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: keycloak
    spec:
      template:
        spec:
          containers:
          - name: keycloak
            env:
            - name: KC_HOSTNAME
              value: https://auth.staging.cichlids.com
- target:
    kind: Ingress
    name: keycloak
  patch: |
    - op: replace
      path: /spec/rules/0/host
      value: auth.staging.cichlids.com
    - op: replace
      path: /spec/tls/0/hosts/0
      value: auth.staging.cichlids.com

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - auth.cichlids.invalid
    secretName: keycloak-tls
  rules:
  - host: auth.cichlids.invalid
    http:
      paths:
      - path: /realms/cichlids
        pathType: Prefix
        backend:
          service:
            name: keycloak
            port:
              number: 8080
      - path: /resources/
        pathType: Prefix
        backend:
          service:
            name: keycloak
            port:
              number: 8080
      - path: /js/
        pathType: Prefix
        backend:
          service:
            name: keycloak
            port:
              number: 8080

apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-realm-apply
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-realm-apply
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: render
        image: python:3.13.7-alpine3.22@sha256:9ba6d8cbebf0fb6546ae71f2a1c14f6ffd2fdab83af7fa5669734ef30ad48844
        command:
        - python3
        - /scripts/render-realm.py
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 64Mi
        volumeMounts:
        - name: realm
          mountPath: /realm
          readOnly: true
        - name: scripts
          mountPath: /scripts
          readOnly: true
        - name: rendered
          mountPath: /rendered
          readOnly: false
        - name: smtp
          mountPath: /smtp
          readOnly: true
        - name: providers
          mountPath: /providers
          readOnly: true
        - name: bff
          mountPath: /bff
          readOnly: true
      containers:
      - name: apply
        image: quay.io/adorsys/keycloak-config-cli:6.5.1-26@sha256:1b22dfaa9ae0c71f74b0342f9221a6510f272da5def683dbba26a98e6b1b1411
        env:
        - name: KEYCLOAK_URL
          value: http://keycloak:8080
        - name: KEYCLOAK_AVAILABILITYCHECK_ENABLED
          value: 'true'
        - name: KEYCLOAK_AVAILABILITYCHECK_TIMEOUT
          value: 120s
        - name: IMPORT_FILES_LOCATIONS
          value: /rendered/cichlids-realm.json
        - name: IMPORT_CACHE_ENABLED
          value: 'false'
        - name: IMPORT_REMOTESTATE_ENABLED
          value: 'false'
        - name: IMPORT_VARSUBSTITUTION_ENABLED
          value: 'false'
        - name: LOGGING_LEVEL_ROOT
          value: warn
        - name: LOGGING_LEVEL_HTTP
          value: 'off'
        - name: LOGGING_LEVEL_REALMCONFIG
          value: 'off'
        - name: IMPORT_MANAGED_CLIENT
          value: no-delete
        - name: IMPORT_MANAGED_ROLE
          value: no-delete
        - name: IMPORT_MANAGED_IDENTITYPROVIDER
          value: no-delete
        - name: IMPORT_MANAGED_CLIENTSCOPE
          value: no-delete
        - name: IMPORT_MANAGED_COMPONENT
          value: no-delete
        - name: IMPORT_MANAGED_SUBCOMPONENT
          value: no-delete
        - name: IMPORT_MANAGED_REQUIREDACTION
          value: no-delete
        - name: IMPORT_MANAGED_AUTHENTICATIONFLOW
          value: no-delete
        - name: IMPORT_MANAGED_GROUP
          value: no-delete
        - name: IMPORT_MANAGED_CLIENTSCOPEMAPPING
          value: no-delete
        - name: IMPORT_MANAGED_IDENTITYPROVIDERMAPPER
          value: no-delete
        - name: IMPORT_MANAGED_CLIENTAUTHORIZATIONRESOURCES
          value: no-delete
        - name: IMPORT_MANAGED_CLIENTAUTHORIZATIONPOLICIES
          value: no-delete
        - name: IMPORT_MANAGED_CLIENTAUTHORIZATIONSCOPES
          value: no-delete
        - name: KEYCLOAK_USER
          valueFrom:
            secretKeyRef:
              name: keycloak-admin
              key: username
        - name: KEYCLOAK_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-admin
              key: password
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: rendered
          mountPath: /rendered
          readOnly: true
      volumes:
      - name: realm
        configMap:
          name: keycloak-realm
      - name: scripts
        configMap:
          name: keycloak-renderer
      - name: rendered
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi
      - name: smtp
        secret:
          secretName: keycloak-smtp
          optional: false
      - name: providers
        secret:
          secretName: keycloak-providers
          optional: true
      - name: bff
        secret:
          secretName: keycloak-web-bff
          optional: true

name: exposure-watch

on:
  schedule:
    - cron: '17 5 1 * *'
  workflow_dispatch:

permissions: {}

jobs:
  public-exposure:
    name: Backups and media originals are private
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Probe anonymously over HTTPS
        run: node tools/check-public-exposure.mjs

name: CI

# Hard green gate (ADR-0003, ADR-0005): no merge without green suites.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  adr-index:
    name: ADR index up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Check ADR index
        run: python3 tools/generate_adr_index.py --check

  story-test-binding:
    name: Story-to-test binding (Definition of Done)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Self-test of the check
        run: node --test tools/check-story-test-binding.test.mjs
      - name: Enforce story-to-test binding (ADR-0015)
        run: node tools/check-story-test-binding.mjs

  toolchain:
    name: Toolchain pinned and present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install pinned core toolchain
        run: bash tools/install-toolchain.sh
      - name: Verify core toolchain
        run: ./tools/verify-toolchain.sh core

  secrets-scan:
    name: No plaintext secrets committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Self-test of the secret detector
        run: python3 tools/check-no-plaintext-secrets.py --self-test
      - name: Scan tracked files for plaintext secrets
        run: python3 tools/check-no-plaintext-secrets.py
      - name: Pre-push secret-scan hook is wired
        run: |
          python3 tools/check-git-hooks.py --self-test
          python3 tools/check-git-hooks.py

  infra-validate:
    name: OpenTofu foundation validates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned core toolchain
        run: bash tools/install-toolchain.sh
      - name: Check formatting
        run: tofu fmt -check -recursive infra
      - name: Validate foundation tier
        run: |
          tofu -chdir=infra/foundation init -backend=false
          tofu -chdir=infra/foundation validate
      - name: Validate backup tier
        run: |
          tofu -chdir=infra/backup init -backend=false
          tofu -chdir=infra/backup validate
      - name: Foundation guardrails (ADR-0014 Layer 1)
        run: python3 infra/foundation/guardrails_test.py
      - name: Backup guardrails (ADR-0014 Layer 1)
        run: python3 infra/backup/guardrails_test.py
      - name: Project separation (ADR-0017)
        run: |
          python3 tools/check-project-separation.py --self-test
          python3 tools/check-project-separation.py
      - name: Remote state backend present (ADR-0016)
        run: |
          python3 tools/check-remote-state-backend.py --self-test
          python3 tools/check-remote-state-backend.py

  # Further required jobs land with the application code and complete the green gate
  # from ADR-0003 / ADR-0005. Each verifies its own toolchain scope
  # (tools/verify-toolchain.sh backend or e2e) as part of the job:
  #   - backend:     unit + integration tests (.NET, ADR-0002); scope backend
  #   - client-core: typecheck + lint + unit (TypeScript)
  #   - e2e:         Maestro against the fully started stack (ADR-0004, ADR-0006),
  #                  the same suite for the native app and the web channel; scope e2e

name: CI

# Hard green gate (ADR-0003, ADR-0005): no merge without green suites.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  adr-index:
    name: adr-index
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"
      - name: Check ADR index
        run: python3 tools/generate_adr_index.py --check

  story-test-binding:
    name: story-test-binding
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - name: Self-test of the check
        run: node --test tools/check-story-test-binding.test.mjs
      - name: Enforce story-to-test binding (ADR-0015)
        run: node tools/check-story-test-binding.mjs

  manifests:
    name: manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - name: Install YAML parser
        run: python3 -m pip install PyYAML==6.0.3
      - name: Install pinned core toolchain
        run: bash tools/install-toolchain.sh
      - name: Render and validate manifests offline
        run: ./tools/check-cluster-manifests.sh

  toolchain:
    name: toolchain
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - name: Install pinned core toolchain
        run: bash tools/install-toolchain.sh
      - name: Validate Renovate configuration
        run: npx --yes --package renovate@44.156.1 renovate-config-validator --strict renovate.json5
      - name: Install YAML parser
        run: python3 -m pip install PyYAML==6.0.3
      - name: Delivery contracts
        run: python3 tools/test-delivery.py
      - name: Workflow lint
        run: actionlint
      - name: Verify core toolchain
        run: ./tools/verify-toolchain.sh core

  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"
      - name: Install pinned core toolchain
        run: bash tools/install-toolchain.sh
      - name: Install YAML parser
        run: python3 -m pip install PyYAML==6.0.3
      - name: Test and enforce encrypted Kubernetes Secret manifests
        run: |
          python3 tools/check-secret-manifests.test.py
          python3 tools/check-secret-manifests.py
      - name: Install checksum-pinned KSOPS
        run: bash tools/install-ksops.sh
      - name: Round-trip the test-only SOPS age fixture through KSOPS
        run: python3 tools/test-sops-roundtrip.py
      - name: Pre-push hook behaves as specified
        run: bash tools/test-pre-push-hook.sh
      - name: Scan the working tree with gitleaks
        run: gitleaks dir . --config .gitleaks.toml --redact --verbose
      - name: Scan the full history with gitleaks
        run: gitleaks git . --config .gitleaks.toml --redact --verbose
      - name: Pre-push secret-scan hook is wired
        run: |
          python3 tools/check-git-hooks.py --self-test
          python3 tools/check-git-hooks.py

  keycloak-realm:
    name: Keycloak realm files carry no dev setting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"
      - name: Self-test of the realm check
        run: python3 tools/check-keycloak-realm.py --self-test
      - name: Check the staging and production realm files
        run: python3 tools/check-keycloak-realm.py

  # Story: task-3.30
  stack-bootstrap:
    name: Local stack bootstrap script
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"
      - name: Postgres wait and legacy stack default of bootstrap.sh
        run: python3 app/stack/bootstrap_test.py

  infra-validate:
    name: infra-validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - name: Exposure probe self-test
        run: node tools/check-public-exposure.mjs --self-test
      - name: Install YAML parser
        run: python3 -m pip install PyYAML==6.0.3
      - name: Install pinned core toolchain
        run: bash tools/install-toolchain.sh
      - name: Check formatting
        run: tofu fmt -check -recursive infra
      - name: Validate platform tier
        run: |
          tofu -chdir=infra/platform init -backend=false
          tofu -chdir=infra/platform validate
      - name: Validate backup tier
        run: |
          tofu -chdir=infra/backup init -backend=false
          tofu -chdir=infra/backup validate
      - name: Validate app tier
        run: |
          tofu -chdir=infra/app init -backend=false
          tofu -chdir=infra/app validate
      - name: Platform guardrails (ADR-0014 Layer 1)
        run: |
          python3 infra/platform/guardrails_test.py --self-test
          python3 infra/platform/guardrails_test.py
      - name: Backup guardrails (ADR-0014 Layer 1)
        run: |
          python3 infra/backup/guardrails_test.py --self-test
          python3 infra/backup/guardrails_test.py
          python3 tools/verify-backup-writer-policy.test.py
          bash -n tools/verify-backup-writer-policy.sh
      - name: App guardrails (ADR-0014 Layer 2)
        run: |
          python3 infra/app/guardrails_test.py --self-test
          python3 infra/app/guardrails_test.py
      - name: Render Argo CD KSOPS bootstrap and check the install contract
        run: python3 infra/app/ksops_test.py
      - name: Check bootstrap and KSOPS shell syntax
        run: bash -n infra/app/scripts/install-argocd.sh tools/install-ksops.sh
      - name: Project separation (ADR-0017)
        run: |
          python3 tools/check-project-separation.py --self-test
          python3 tools/check-project-separation.py
      - name: Remote state backend present (ADR-0016)
        run: |
          python3 tools/check-remote-state-backend.py --self-test
          python3 tools/check-remote-state-backend.py
      - name: Destroy-gate policy unit tests (ADR-0014 Layer 3)
        run: conftest verify -p policy

  # Story: task-2.28
  # The e2e job runs the web write specs; maestro runs the native Android flows.
  # The seeded Playwright smoke (TASK-2.24) and lint have separate coverage requirements.
  backend:
    name: backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install the pinned .NET SDK
        run: |
          bash tools/install-dotnet.sh
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
      - name: Verify backend toolchain
        run: ./tools/verify-toolchain.sh backend
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('app/api/**/*.csproj', 'app/api/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Build
        run: dotnet build app/api/Cichlids.sln -c Release
      - name: Test
        run: >
          dotnet test app/api/Cichlids.sln -c Release --no-build
          --logger trx --logger "console;verbosity=normal"
          --results-directory TestResults --blame-hang-timeout 10m
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-test-results
          path: TestResults

  client-core:
    name: client-core
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Build client-core
        working-directory: app
        run: pnpm --filter @cichlids/client-core build
      - name: Typecheck
        working-directory: app
        run: pnpm -r typecheck
      - name: Unit tests
        working-directory: app
        run: pnpm -r test

  maestro:
    name: maestro (${{ matrix.locale }})
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        locale: [en-US, de-DE]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      EXPO_NO_TELEMETRY: "1"
      CICHLIDS_WRITE_PUBLIC_HOST: "10.0.2.2"
      MAESTRO_REPORT_DIR: ${{ github.workspace }}/maestro-reports
      MAESTRO_DEVICE_LOCALE: ${{ matrix.locale }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Install the pinned .NET SDK
        run: |
          bash tools/install-dotnet.sh
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
      - name: Install pinned Maestro
        run: |
          source tools/toolchain.versions
          curl --fail --location --retry 3 "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_MIN}/maestro.zip" -o /tmp/maestro.zip
          mkdir -p "$HOME/.local"
          unzip -q /tmp/maestro.zip -d "$HOME/.local"
          echo "$HOME/.local/maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.local/maestro/bin/maestro" --version
      - name: Start services and the isolated write stack
        run: |
          app/stack/services-up.sh --wait-realm
          app/mobile/e2e/write-stack.sh up
          node app/mobile/e2e/maestro/seed.mjs
      - name: Build an Android debug APK with embedded JavaScript
        run: app/mobile/e2e/maestro/build-android.sh
      - name: Run every native flow
        uses: reactivecircus/android-emulator-runner@69c8581131285561115a2e413eb0037446bdc2d6 # v2.35.0
        with:
          api-level: 35
          system-image-api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disable-spellchecker: true
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: app/mobile/e2e/maestro/run-android.sh
      - name: Collect stack logs
        if: always()
        run: |
          mkdir -p maestro-reports
          cp /tmp/cichlids-write-stack/api.log /tmp/cichlids-write-stack/web.log maestro-reports/ || true
          docker compose -f app/stack/compose.yaml logs > maestro-reports/compose.log 2>&1 || true
      - name: Upload Maestro reports and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: maestro-${{ matrix.locale }}
          path: maestro-reports
          retention-days: 7
      - name: Stop the isolated write stack
        if: always()
        run: app/mobile/e2e/write-stack.sh down
      - name: Stop compose services
        if: always()
        run: docker compose -f app/stack/compose.yaml down -v

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Start Postgres, RustFS and Keycloak
        run: app/stack/services-up.sh
      - name: Install the pinned .NET SDK
        run: |
          bash tools/install-dotnet.sh
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
      - name: Verify backend toolchain
        run: ./tools/verify-toolchain.sh backend
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('app/api/**/*.csproj', 'app/api/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        working-directory: app/mobile
        run: pnpm exec playwright install --with-deps chromium
      - name: Wait for the cichlids realm
        run: app/stack/services-up.sh --wait-realm
      - name: Run the write E2E specs
        run: pnpm --dir app/mobile run e2e:write
      - name: Collect logs
        if: failure()
        run: |
          mkdir -p e2e-logs
          cp /tmp/cichlids-write-stack/api.log /tmp/cichlids-write-stack/web.log e2e-logs/ || true
          docker compose -f app/stack/compose.yaml logs > e2e-logs/compose.log 2>&1 || true
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-logs
          path: e2e-logs
      - name: Stop the compose stack
        if: always()
        run: docker compose -f app/stack/compose.yaml down -v

  # Story: TASK-2.11
  infra-policy:
    name: infra-policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install pinned core toolchain
        run: bash tools/install-toolchain.sh
      - name: Policy fixtures
        run: conftest verify -p policy
      - name: App tier plan and policy gate
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          TF_VAR_ssh_private_key: ${{ secrets.CICHLIDS_APP_SSH_PRIVATE_KEY }}
          TF_VAR_database_volume_id: ${{ vars.CICHLIDS_DATABASE_VOLUME_ID }}
          TF_VAR_node_ipv4: ${{ vars.CICHLIDS_NODE_IPV4 }}
          TF_VAR_node_host_key: ${{ vars.CICHLIDS_NODE_HOST_KEY }}
          TF_VAR_state_encryption_passphrase: ${{ secrets.CICHLIDS_APP_STATE_PASSPHRASE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CICHLIDS_S3_PRIMARY_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CICHLIDS_S3_PRIMARY_SECRET_KEY }}
        run: |
          tofu -chdir=infra/app init -input=false
          tofu -chdir=infra/app plan -input=false -lock-timeout=5m -out=tfplan
          tofu -chdir=infra/app show -json tfplan > infra/app/plan.json
          conftest test infra/app/plan.json -p policy/destroy_gate.rego

  required:
    name: required
    if: ${{ always() }}
    needs: [adr-index, story-test-binding, manifests, toolchain, secrets-scan, keycloak-realm, stack-bootstrap, infra-validate, infra-policy, backend, client-core, e2e, maestro]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          results = json.loads(os.environ['RESULTS'])
          allowed_skips = {'maestro'} if os.environ['EVENT_NAME'] == 'pull_request' else set()
          bad = {name: job['result'] for name, job in results.items()
                 if job['result'] != 'success' and not (name in allowed_skips and job['result'] == 'skipped')}
          print(f"required: {len(results)} jobs; unsuccessful={bad}")
          sys.exit(bool(bad))
          PYTHON

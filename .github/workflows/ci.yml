name: CI

# Hard green gate (ADR-0003, ADR-0005): no merge without green suites.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  adr-index:
    name: ADR index up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Check ADR index
        run: python3 tools/generate_adr_index.py --check

  story-test-binding:
    name: Story-to-test binding (Definition of Done)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Self-test of the check
        run: node --test tools/check-story-test-binding.test.mjs
      - name: Enforce story-to-test binding (ADR-0015)
        run: node tools/check-story-test-binding.mjs

  manifests:
    name: Cluster manifests and environment safeguards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install YAML parser
        run: python3 -m pip install PyYAML==6.0.3
      - name: Install pinned core toolchain
        run: bash tools/install-toolchain.sh
      - name: Render and validate manifests offline
        run: ./tools/check-cluster-manifests.sh

  toolchain:
    name: Toolchain pinned and present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install pinned core toolchain
        run: bash tools/install-toolchain.sh
      - name: Verify core toolchain
        run: ./tools/verify-toolchain.sh core

  secrets-scan:
    name: No plaintext secrets committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install pinned core toolchain
        run: bash tools/install-toolchain.sh
      - name: Install YAML parser
        run: python3 -m pip install PyYAML==6.0.3
      - name: Test and enforce encrypted Kubernetes Secret manifests
        run: |
          python3 tools/check-secret-manifests.test.py
          python3 tools/check-secret-manifests.py
      - name: Install checksum-pinned KSOPS
        run: bash tools/install-ksops.sh
      - name: Round-trip the test-only SOPS age fixture through KSOPS
        run: python3 tools/test-sops-roundtrip.py
      - name: Pre-push hook behaves as specified
        run: bash tools/test-pre-push-hook.sh
      - name: Scan the working tree with gitleaks
        run: gitleaks dir . --config .gitleaks.toml --redact --verbose
      - name: Scan the full history with gitleaks
        run: gitleaks git . --config .gitleaks.toml --redact --verbose
      - name: Pre-push secret-scan hook is wired
        run: |
          python3 tools/check-git-hooks.py --self-test
          python3 tools/check-git-hooks.py

  keycloak-realm:
    name: Keycloak realm files carry no dev setting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Self-test of the realm check
        run: python3 tools/check-keycloak-realm.py --self-test
      - name: Check the staging and production realm files
        run: python3 tools/check-keycloak-realm.py

  # Story: task-3.30
  stack-bootstrap:
    name: Local stack bootstrap script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Postgres wait and legacy stack default of bootstrap.sh
        run: python3 app/stack/bootstrap_test.py

  infra-validate:
    name: OpenTofu tiers validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install YAML parser
        run: python3 -m pip install PyYAML==6.0.3
      - name: Install pinned core toolchain
        run: bash tools/install-toolchain.sh
      - name: Check formatting
        run: tofu fmt -check -recursive infra
      - name: Validate platform tier
        run: |
          tofu -chdir=infra/platform init -backend=false
          tofu -chdir=infra/platform validate
      - name: Validate backup tier
        run: |
          tofu -chdir=infra/backup init -backend=false
          tofu -chdir=infra/backup validate
      - name: Validate app tier
        run: |
          tofu -chdir=infra/app init -backend=false
          tofu -chdir=infra/app validate
      - name: Platform guardrails (ADR-0014 Layer 1)
        run: python3 infra/platform/guardrails_test.py
      - name: Backup guardrails (ADR-0014 Layer 1)
        run: python3 infra/backup/guardrails_test.py
      - name: App guardrails (ADR-0014 Layer 2)
        run: |
          python3 infra/app/guardrails_test.py --self-test
          python3 infra/app/guardrails_test.py
      - name: Render Argo CD KSOPS bootstrap and check the install contract
        run: python3 infra/app/ksops_test.py
      - name: Check bootstrap and KSOPS shell syntax
        run: bash -n infra/app/scripts/install-argocd.sh tools/install-ksops.sh
      - name: Project separation (ADR-0017)
        run: |
          python3 tools/check-project-separation.py --self-test
          python3 tools/check-project-separation.py
      - name: Remote state backend present (ADR-0016)
        run: |
          python3 tools/check-remote-state-backend.py --self-test
          python3 tools/check-remote-state-backend.py
      - name: Destroy-gate policy unit tests (ADR-0014 Layer 3)
        run: conftest verify -p policy/destroy_gate.rego -p policy/destroy_gate_test.rego

  # Story: task-2.28
  # Not covered by CI: the seeded Playwright smoke (TASK-2.24), the Maestro flows (TASK-2.25) and a
  # lint step (no lint script exists). The e2e job runs the web write specs and verifies the
  # backend toolchain scope, not the Android scope.
  backend:
    name: Backend build and tests (.NET, Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned .NET SDK
        run: |
          bash tools/install-dotnet.sh
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
      - name: Verify backend toolchain
        run: ./tools/verify-toolchain.sh backend
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('app/api/**/*.csproj', 'app/api/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Build
        run: dotnet build app/api/Cichlids.sln -c Release
      - name: Test
        run: >
          dotnet test app/api/Cichlids.sln -c Release --no-build
          --logger trx --logger "console;verbosity=normal"
          --results-directory TestResults --blame-hang-timeout 10m
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: TestResults

  client-core:
    name: Frontend typecheck and unit tests (client-core, mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Build client-core
        working-directory: app
        run: pnpm --filter @cichlids/client-core build
      - name: Typecheck
        working-directory: app
        run: pnpm -r typecheck
      - name: Unit tests
        working-directory: app
        run: pnpm -r test

  e2e:
    name: Playwright write tests (compose stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Start Postgres, RustFS and Keycloak
        run: app/stack/services-up.sh
      - name: Install the pinned .NET SDK
        run: |
          bash tools/install-dotnet.sh
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
      - name: Verify backend toolchain
        run: ./tools/verify-toolchain.sh backend
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('app/api/**/*.csproj', 'app/api/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        working-directory: app/mobile
        run: pnpm exec playwright install --with-deps chromium
      - name: Wait for the cichlids realm
        run: app/stack/services-up.sh --wait-realm
      - name: Run the write E2E specs
        run: pnpm --dir app/mobile run e2e:write
      - name: Collect logs
        if: failure()
        run: |
          mkdir -p e2e-logs
          cp /tmp/cichlids-write-stack/api.log /tmp/cichlids-write-stack/web.log e2e-logs/ || true
          docker compose -f app/stack/compose.yaml logs > e2e-logs/compose.log 2>&1 || true
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: e2e-logs
      - name: Stop the compose stack
        if: always()
        run: docker compose -f app/stack/compose.yaml down -v

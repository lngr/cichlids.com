name: CI

# Hartes Gruen-Gate (ADR-0003, ADR-0005): kein Merge ohne gruene Suiten.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  adr-index:
    name: ADR-Index aktuell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: ADR-Index pruefen
        run: python3 tools/generate_adr_index.py --check

  story-test-binding:
    name: Story↔Test-Bindung (Definition of Done)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Selbsttest des Checks
        run: node --test tools/check-story-test-binding.test.mjs
      - name: Story↔Test-Bindung erzwingen (ADR-0015)
        run: node tools/check-story-test-binding.mjs

  # Mit dem Anwendungscode kommen weitere required Jobs hinzu und vervollstaendigen das
  # Gruen-Gate aus ADR-0003 / ADR-0005:
  #   - backend:     Unit- + Integrationstests (.NET, ADR-0002)
  #   - client-core: Typecheck + Lint + Unit (TypeScript)
  #   - e2e:         Maestro gegen den real hochgefahrenen Stack (ADR-0004, ADR-0006),
  #                  dieselbe Suite fuer native App und Web-Kanal

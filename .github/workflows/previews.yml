name: Preview admission
on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled, closed, ready_for_review, converted_to_draft]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: preview-admission
  cancel-in-progress: false
jobs:
  admission:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { reconcilePreviews } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/tools/preview-admission.mjs`));
            const admitted = await reconcilePreviews(github, context.repo);
            core.info(`Admitted previews: ${admitted.join(', ')}`);

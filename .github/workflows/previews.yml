name: Preview admission
on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled, closed, ready_for_review, converted_to_draft]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pull-requests: read
concurrency:
  group: preview-admission
  cancel-in-progress: false
jobs:
  admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v8
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { reconcilePreviews } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/tools/preview-admission.mjs`));
            const admitted = await reconcilePreviews(github, context.repo);
            core.info(`Admitted previews: ${admitted.join(', ')}`);

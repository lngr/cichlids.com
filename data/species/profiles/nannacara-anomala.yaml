  predation:
    value: 1
    confidence: low
    rationale: "The species is a micropredator of worms, small crustaceans and insect larvae (FishBase, Seriously Fish). In feeding trials of the Surinamese swamp study it ate eggs and larvae of armoured catfish, and a specialist article warns that dwarf shrimps and the fry of other fish near a breeding pair are at risk. No source reports that it hunts fish beyond fry. All four votes chose level 1: fry and fish up to about 2 cm are taken when the chance arises. Some evidence entries describe level 0 because they only list invertebrate food; they do not contradict the risk to fry. The confidence follows the vote count."
    sources:
    - kind: literature
      title: "Mol, J. H. A. (1995). Interspecific competition, predation, and the coexistence of three closely related neotropical armoured catfishes (Siluriformes, Callichthyidae). PhD thesis, Wageningen University"
      url: "https://doi.org/10.18174/210491"

  problems:
    text: "Most problems come from the social set-up. Several males in a small tank leave a subordinate that is chased and stressed, and a guarding female can harass tankmates or injure the male in a tank without room to retreat. Dwarf cichlids react badly to nitrite, high nitrate and medication, so heavy stocking and neglected water changes cause trouble sooner than with larger cichlids. Common cichlid ailments such as intestinal nematodes (Camallanus), fin and mouth rot and fungal infections occur, and a swollen belly or stringy white faeces is a reason to consult an experienced keeper or a vet. Farm-bred fish are used to moderately hard tap water, and soft, acid water is needed only for a deliberate breeding attempt with wild-type stock. Juveniles of N. anomala and N. aureocephalus look alike, so stocks from different sources can be mixed up, and because the two are so closely related, a cross is plausible even though none is reported."

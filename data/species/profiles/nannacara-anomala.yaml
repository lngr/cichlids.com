  temperatureC:
    value:
      min: 24
      max: 28
    confidence: medium
    rationale: "Field readings place the species in warm lowland water: morning values of 24.2 to 27.8 C with an afternoon peak of 28.8 C in the coastal swamps of Suriname (Mol 1995), 24.4 to 28.6 C in shaded forest tributaries of the Suriname River (Mol et al. 2007), about 26 C on average in a blackwater creek with the species near the Demerara, and a single morning reading of 24.8 C in the Nassau foothill creek. Hobby texts on the wild water give 24 to 28 C. All four votes agree within one degree (checker-a proposed 23 to 28 C), so the tally decides 24 to 28 C unanimously. The wider source range reaches from 22.2 C, the coolest of seven Guiana Shield streams of the RAP survey, of which only the lowland creek yields the species, to the peak of 28.8 C; the FishBase line of 22 to 25 C comes from an aquarium handbook and belongs to the tolerance."

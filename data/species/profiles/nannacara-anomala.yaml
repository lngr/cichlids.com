  ph:
    value:
      min: 4.4
      max: 6.4
    confidence: medium
    rationale: "The coastal swamp at Lelydorp, where the species is among the most common fishes, measured pH 4.2 to 5.75 (Mol 1995). The Suriname water resources assessment puts savanna belt blackwater creeks usually below 5.0 and fresh swamps of the inner coastal plain below 5.5, and shaded forest streams of Suriname read 5.5 to 6.9. Hobby texts give 3.9 to 6.3 for the wild water without a measurement. The proposals were 4.2 to 6.3 (generator, tiebreaker-1), 4.5 to 6.5 (checker-c, tiebreaker-2) and 4.5 to 7.0 (checker-a, checker-b); the first four agree and form a qualified majority of 4 of 6 votes, whose median range is 4.4 to 6.4. The sources reach wider, from 3.75 to 7.65 in French Guiana rainforest streams that are not specific to the species and up to 7.0 in a pH paper reading at the Nassau foothill creek and 7.5 in outer coastal swamps mixed with sea water, outside the freshwater habitat of the species. The FishBase line of 6.0 to 8.0 is an aquarium value. The decided range is plausible for the acid blackwater and swamp habitat."
    sources:

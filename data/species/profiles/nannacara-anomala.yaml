      confidence: medium
      rationale: "Care sources agree on a span from 22 C to 25 to 28 C: 22 to 25 C (FishBase, Maidenhead Aquatics, AquaInfo), 22 to 26 C (UK Aquarist), 22 to 27 C (Seriously Fish), 23 to 27 C (Steenfott Aquatics), 22 to 28 C (Aqualog, Cichlidamerique, FishProfiles) and 24 to 28 C (Fischlexikon, Aquajoy). Keepers spawn the species at 24 to 26 C and a laboratory stock bred at 26 C. All four votes proposed 22 to 28 C, a unanimous decision that contains the natural range. A keeper report of fish that survived a brief drop to about 18 C describes a short accident, not a range for years, and stays outside."

partners:
  suitable:
  - species: Hemigrammus unilineatus
    reason: A schooling tetra of the same Guianan swamps that swims in the upper layers and keeps away from the caves on the bottom.
    condition: A school of six or more in a planted tank of at least 80 cm.
  - species: Carnegiella strigata
    reason: A calm hatchetfish of the surface that hobby references name as a companion for this dwarf cichlid.
    condition: "A tight lid, because hatchetfish jump."
  - species: Pyrrhulina filamentosa
    reason: A small characin of the Guianan coastal waters that stays in the upper and middle layers and is too quick to be harassed.
  - species: Small surface-dwelling tetras
    reason: Schooling tetras of the upper layers do not compete for caves and are too large to be eaten.
    condition: Adult size of 3 cm or more.
  - species: Apistogramma cacatuoides
    reason: A keeper reports both species breeding in one planted tank without lasting trouble.
    condition: A tank of 100 cm or more with separate caves and lines of sight broken by plants and wood.
  unsuitable:
  - species: Nannacara aureocephalus
    reason: "The sister species, with the same chromosome number and juveniles that cannot be told apart from those of N. anomala. No cross is reported, but the close relationship makes one plausible, and an importer and AquaInfo advise against raising the two together."
  - species: Crenicichla saxatilis
    reason: A pike cichlid of the same region that eats small fish and would kill an adult of 5 to 8 cm or its brood.
  - species: Astronotus ocellatus
    reason: "A large, heavy cichlid that bullies and injures a dwarf cichlid in any home tank."
  - species: Rocio octofasciata
    reason: "A robust, aggressive Central American cichlid that overpowers the much smaller golden dwarf cichlid."
  - species: Neocaridina davidi
    reason: Dwarf shrimps and their young are the kind of small invertebrate prey this micropredator hunts.
profile:
  overview:
    text: "Nannacara anomala, the golden dwarf cichlid or goldeneye cichlid, is a small cichlid of the Guianas. Charles Tate Regan described it in 1905 from the Essequibo River in Guyana, and the Catalog of Fishes lists it as a valid species of the genus Nannacara. Males are larger and more colourful than females, with metallic green and blue scales on a brown body and long dorsal and anal fins, while females are yellowish with a dark band along the side. Aquarists value it as hardy, easy to feed and willing to breed, and most fish in the trade are bred on commercial farms. Its main drawback is the fierce brood defence of the female, which can unsettle a community tank while she guards eggs or fry."
    sources:
    - kind: catalog-of-fishes

    rationale: "The Catalog of Fishes gives Guianan rivers of Guyana, Suriname and French Guiana with the Essequibo as type locality, and the Cichlid Room Companion names the same three countries with creeks, floodplains and marshes as habitat. FishBase and Seriously Fish describe the range from the Aruka River in Guyana east to the lower Marowijne in Suriname, and the FishBase country list marks the French Guiana records as misidentifications. Field records from the coastal swamps near Paramaribo (Mol 1995), a lowland creek at the foot of the Nassau Mountains and a blackwater creek near the Demerara confirm the lowland habitat. All four agents agree on the continent and the Guianan lowlands; checker-c leaves French Guiana out of the region. The region follows the documented range and names the Marowijne border, because the French Guiana records are doubtful but the border river itself is part of the range. No lake of the waterbody table applies."

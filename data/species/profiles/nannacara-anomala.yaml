  aggressionConspecific:
    value: 3
    confidence: medium
    rationale: "Male contests escalate from tail beating to mouth wrestling in behaviour studies (Enquist and Jakobsson 1986), and a subordinate male in a small tank hides in female colours. After spawning the female drives the male away; keepers on The Krib and Apistogramma.com and a French specialist article report badly injured or killed males or females in small tanks, and Seriously Fish asks for a sub-territory of about 40 by 40 cm per female. Generator, checker-a and checker-b chose level 3; checker-c chose level 2, arguing that injuries are rare with the right ratio and space. The repeated reports of injuries under too little space fit level 3."

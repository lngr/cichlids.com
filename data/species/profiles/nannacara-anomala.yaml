  socialBehavior:
    text: "Males form a dominance order. Their fights begin with tail beating and escalate to mouth wrestling, and body size decides most of them. In a small tank a second male is chased until it hides or takes on the colours of a female. After spawning the female attacks the male and drives him away from the clutch; in a small tank she can injure him badly, while in a large tank he is tolerated at the edge of her territory. A male visits the territories of several females, and each female raises her own brood. One male with two or more females is the usual group, and two males need a tank of 100 cm or more with plenty of structure. Outside breeding the fish is peaceful towards other species."
    sources:

  note: "The Catalog of Fishes lists Nannacara anomala Regan 1905 as valid, with syntypes from the Essequibo River in Guyana and a range in Guianan rivers of Guyana, Suriname and French Guiana. The legacy name equals the valid name. Nannacara taenia Regan 1912 was treated as a possible synonym by Kullander and Nijssen (1989), but the catalog keeps it as a valid species of the lower Amazon, so it is not a synonym here. Fish sold as N. anomala are sometimes confused with the very similar N. aureocephalus."

  compatibility:
    text: "The golden dwarf cichlid is peaceful towards other species for most of the time and fits a community of calm, small fish. Good partners live in the upper water layers, such as hatchetfish and small tetras, because the cichlid claims the bottom and its caves. Fish small enough to be eaten, such as fry, dwarf shrimps and tetras under about 2 cm, are at risk, and large or robust cichlids bully it. A female with eggs or fry attacks anything that comes close, including bottom dwellers such as Corydoras that search for eggs, so tankmates need room to retreat and the tank needs plants and wood that break lines of sight. Other bottom-dwelling dwarf cichlids compete for the same caves and fit only in a tank of 100 cm or more. The sister species N. aureocephalus has the same chromosome number and looks the same as a juvenile. No cross of the two is reported, but their close relationship makes one plausible, so the stocking planner treats them as a presumed hybrid pair, and hobby sources advise keeping them apart."

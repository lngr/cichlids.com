    rationale: "The proposals were 8 and 5.5 cm (generator, checker-a), 7 and 5 cm (checker-b) and 7.5 and 4.5 cm (checker-c) for male and female, with medians of 7.75 and 5.25 cm. Most care sources give males 7 to 8 cm total length (Maidenhead Aquatics 7, Tropical Fish Hobbyist 7.5, Aqualog, Aquarium Glaser, Fischlexikon and Steenfott Aquatics 8), and the scientific 5.6 cm standard length (FishBase, after Kullander) equals about 7 cm total length; Seriously Fish lists 7.6 cm standard length. Figures of 9 to 10 cm (Cichlidamerique, AquaInfo, Fishipedia, a forum post) are single maxima. For females the sources give 6 (Aqualog), 5.5 (Steenfott), 5 (Fischlexikon, UK Aquarist), about 4 (Tropical Fish Hobbyist, Aquarium Glaser) and 3.5 cm (FishProfiles), with a median of 5 cm. The typical adult male reaches 8 cm and the female 5 cm."

  breeding:
    value: cave-spawner
    confidence: medium
    rationale: "The female lays her eggs on a hard surface in a sheltered place and guards eggs and fry alone. Keepers report spawning in caves, flowerpots, coconut shells and hollows of wood (Apistogramma.com, Cichlidamerique, The Krib, Aquajoy), and Seriously Fish advises wood as spawning sites. The Cichlid Room Companion classes the breeding mode as open substrate, a laboratory stock used stones and coconut shells, and UK Aquarist and a keeper report on Cichlid-Forum describe spawns on flat surfaces or beside a pot. Generator, checker-a and checker-b chose cave-spawner, checker-c open-substrate-spawner. The hidden sites that most keepers report fit cave-spawner; the Cichlid Room Companion classification is the main dissent."

  sizeAndGrowth:
    text: "The species stays small. Museum males measure about 5.6 cm standard length, and well-fed aquarium males reach about 8 cm total length, while females stay at about 5 cm. Eggs hatch after two to four days, and the larvae grow quickly: in a laboratory at 26 degrees C they grew from 3.7 mm at hatching to about 9.6 mm after 18 days, when the first scales formed. Young fish mature at around three months, although the first clutches of such young females are small. Aquarium fish live for about four to six years; sources give between three and eight years."

      rationale: "Care sources split into a soft-water group with upper limits of 8 to 10 dGH (Seriously Fish 3 to 8, Maidenhead Aquatics up to 8, my-fish.org 3 to 8, Fischlexikon 2 to 10, AquaInfo 5 to 10) and a wider group of 12 to 15 dGH (Steenfott Aquatics 3 to 12, Tropical Freshwater Fish 3 to 14, UK Aquarist 2 to 15, Aquajoy 5 to 15, Fishipedia 3 to 15). FishBase and Aquatic Community list 5 to 19 dGH, and Cichlidamerique 8 to 20 dGH while advising below 10 dGH for a natural set-up. Keepers spawned the species at 5 and 13 dGH and a laboratory stock at 2 dGH. The proposals were 0.5 to 10 (generator), 0 to 12 (checker-a, tiebreaker-2), 0 to 10 (checker-c), 0 to 14 (tiebreaker-1) and 0.3 to 15 dGH (checker-b); five of six agree, a qualified majority with the median range 0 to 12 dGH. The wider source range reaches 19 to 20 dGH, but no source shows long-term health at that hardness."

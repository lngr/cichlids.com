  habitat:
    text: "The golden dwarf cichlid lives in the coastal lowlands of north-eastern South America, from the Aruka River in Guyana east to the lower Marowijne River on the border of Suriname and French Guiana. The Catalog of Fishes also names French Guiana, but FishBase treats the records from there as misidentifications. The fish is common in flooded coastal savannas and in swamps with sedges, cattail and floating plants, and it also lives along the shallow, sheltered edges of small creeks with leaf litter and fallen branches, including a blackwater creek near the Demerara and a lowland creek below the Nassau Mountains. Near Paramaribo it ranks among the most frequent fishes of the swamps, together with Polycentrus schomburgkii and Krobia guianensis. The water is warm, very soft and acidic: the swamps measured pH 4.2 to 5.75, a conductivity of 65 to 165 microsiemens per centimetre and morning temperatures of 24 to 28 degrees C, and the blackwater creeks of the savanna belt are usually below pH 5."

  ghDgh:
    value:
      min: 0
      max: 3
    confidence: low
    rationale: "No hardness titration exists from a site of the species. The Suriname water resources assessment measured 5.4 to 9.0 mg/L as calcium carbonate in lowland creek and river water, which is 0.3 to 0.5 dGH, and calls the coastal swamps soft (below about 3.4 dGH). The Lelydorp swamp had 65 to 165 uS/cm, foothill streams 23 to 44 uS/cm and a Demerara creek with the species 10 to 15 mg/L of dissolved solids, all of which point to very soft water; hobby texts state below 1 dGH. The proposals 0.5 to 3, 0 to 2, 0.3 to 2 and 0 to 3 dGH agree within 2 dGH, and the tally decides 0 to 3 dGH unanimously. The FishBase figure of 5 to 19 dGH is an aquarium value. The range rests on conductivity and one soft-water class, so the confidence is low."
    sources:
    - kind: literature
      title: "Mol, J. H. A. (1995). Interspecific competition, predation, and the coexistence of three closely related neotropical armoured catfishes (Siluriformes, Callichthyidae). PhD thesis, Wageningen University"

  breeding:
    text: "Breeding is simple. The female chooses a dark, sheltered spot such as a cave, a flowerpot, the space under a root or a hollow stone, cleans it and lays 50 to 300 eggs, the number depending on her size; some females use a flat stone or a vertical piece of slate instead. When ready to spawn she shows a chequerboard pattern. She guards the eggs alone and chases the male away. The eggs hatch after two to four days, depending on temperature, and she moves the wrigglers into pits that she digs nearby, sometimes several times. The young swim freely after five to seven days, and she leads them for a month or longer, using her pattern as a signal. A laboratory stock spawned at pH 7.0, 2 dGH and 26 degrees C, so softer and more acid water is an option, not a requirement."

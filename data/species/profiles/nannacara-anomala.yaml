    rationale: "No source reports a cross of N. anomala with another species, neither from the wild nor from a tank, and the Catalog of Fishes, FishBase, Seriously Fish and the public part of the Cichlid Room Companion say nothing about hybrids. Generator, checker-a, checker-b and tiebreaker-1 voted for no group, a qualified majority of 4 of 6 votes for the empty list; checker-c and tiebreaker-2 proposed the pair nannacara-anomala-aureocephalus with the basis presumed. The adjudicator overrides the tally and decides the pair, because the rubric accepts a very close relationship as the basis of a presumed group and this relationship is well supported. A molecular and cytogenetic study places N. anomala and N. aureocephalus as sister species of one clade, both with a diploid number of 44 chromosomes. The importer Aquarium Glaser and AquaInfo report that juveniles of the two cannot be told apart with certainty and that the species occur next to each other and locally together in the Guianas, and both advise strongly against growing up young of the two species in one tank, since the stocks mix easily. A dwarf cichlid author on The Krib keeps look-alike stocks from different sources apart for the same reason, and Fishipedia warns in general terms against mixing species of the genus. No actual cross of the two species is reported, neither from the wild nor from an aquarium, so the basis is presumed and the stocking planner shows a caution rather than a warning. A forum guess that an Asian ornamental line descends from this species and Andinoacara pulcher offers no evidence and forms no group. The verification records the conservative reading, the group named by 2 of 6 votes, and the confidence is low because the group rests on relationship and warnings, not on an observed cross."

  sexing:
    text: "Males are larger and more colourful, with metallic green and blue on the flanks and long, pointed dorsal and anal fins that are dark and finely spotted. Females stay smaller, are yellowish to clay brown and carry a dark band along the side, which turns into a chequerboard pattern when they are ready to spawn. Juveniles of both sexes look alike. Young females can show the band from about the fourth week. A subordinate male kept with a dominant one can resemble a female in colour and size, and he develops into a normal male within weeks once the dominant male is removed. The scales of N. anomala have dark centres with light edges, the reverse of the similar N. aureocephalus."

    rationale: "Each female claims a patch of about 40 by 40 cm around her cave (Seriously Fish), and the male may defend a larger area around several females (FishBase). Generator and checker-a set breedingOnly to false, checker-b and checker-c to true. Maidenhead Aquatics, Aquajoy and AquaInfo tie the territorial behaviour to breeding, while Seriously Fish lists the species as territorial without restriction, Cichlidamerique describes a small territory held all the time and strongest when spawning, and the German references give every fish its own cave as a retreat; males also keep a dominance order outside spawning. The territory is small and is not limited to breeding, which is the more cautious reading for a stocking plan."

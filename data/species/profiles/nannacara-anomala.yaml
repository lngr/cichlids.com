  husbandry:
    text: "A tank of 80 cm length and about 100 litres holds one male with two females, and a single pair manages in about 60 cm. A bottom of fine sand, dense planting along the edges, roots and several caves such as flowerpots, coconut shells or hollow stones give every female a retreat of her own. Subdued light and floating plants suit the species, and it leaves plants alone. The habitat water is soft and acid at 24 to 28 degrees C, and the species stays healthy over a wider span of 22 to 28 degrees C, pH 4.4 to 7.5, up to about 12 dGH and 7 dKH. Clean, oxygen-rich water with regular partial water changes matters more than exact values, because dwarf cichlids react badly to nitrite, high nitrate and medication."

  lifespanYears:
    value:
      min: 4
      max: 6
    confidence: low
    rationale: "Few sources give an age. Fischlexikon and Cichlidamerique state about 3 years on average and 3 to 4 years at most, while the aggregator pages Aquajoy and Fishipedia give 5 to 8 and 8 years. The proposals were 3 to 5 years (generator, checker-a) and 5 to 8 years (checker-b, checker-c), with medians of 4 and 6.5 years. The range of 4 to 6 years follows the medians; the upper value is rounded down because the better documented sources stay at 3 to 4 years. The evidence is thin."

  diet:
    text: "In the wild the golden dwarf cichlid picks small invertebrates from the bottom and from plants: worms, small crustaceans and insect larvae. In the aquarium it accepts nearly every food. Frozen and live bloodworm, brine shrimp, mosquito larvae and Cyclops make a good base, and a small meaty pellet or flake serves as the staple. Some vegetable matter, such as spirulina flakes, rounds out the diet. Juveniles start on newly hatched brine shrimp and Cyclops nauplii. No source reports a sensitivity to protein-rich food, but a varied diet in modest portions keeps the fish in good shape."

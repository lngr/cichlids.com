      confidence: "low"
      rationale: "All four proposals are 21 to 29 C and the tally is unanimous at low confidence. AquaInfo
        recommends 22 to 26 C; FishProfiles and the Nordic register give 23 to 28 C; Interaquaristik gives 24
        to 28 C; Einrichtungsbeispiele gives 24 to 26 C; Ron's 74 to 84 F converts to 23.3 to 28.9 C.
        Inclusion of the entire natural lake interval requires the wider 21 to 29 C result. Its seasonal
        endpoints are not demonstrated as constant multi-year aquarium conditions. About 24 to 26 C has better
        routine-care support."

      rationale: "Generator and checker-b and checker-c propose 7.5 to 8.6; checker-a proposes the wider envelope
        7.4 to 8.6. The 0.1 lower-bound difference is within the agreement threshold, so the tally takes the
        agreeing median minimum of 7.5 and maximum of 8.6 with unanimous verification. FishProfiles supports
        7.5 to 8.6; AquaInfo and the Nordic register recommend 7.5 to 8.5. Ron's wider lower extension is 7.4
        to 8.4 and Malawi.si gives the wider upper extension 7.6 to 8.7; neither endpoint replaces the decided

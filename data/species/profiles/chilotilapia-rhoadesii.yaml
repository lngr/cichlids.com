  sexing:
    text: "Size and adult display color help distinguish the sexes after maturation. The male usually grows larger
      and develops a blue sheen with red fin details; females remain more silvery and can show dark lines.
      Subordinate males may retain a female-like appearance and some males color late. A juvenile's muted
      coloration therefore does not establish that it is female. The plain pattern assigned here describes the
      displaying male; subdued adults can retain horizontal markings."

  breeding:
    text: "The female incubates eggs and young in her mouth. Species accounts describe release after roughly three
      weeks; this is an approximate schedule rather than a fixed deadline. Reproductive males prepare and
      defend a substrate site. Give a holding female refuge from courtship pressure and plan space for the
      brood before attempting to raise it. AquaInfo describes early foods such as Artemia nauplii and finely
      divided dry food. Maternal mouthbrooding does not imply a lasting pair bond."
    sources:

        accessed: "2026-10-13"
  sizeAndGrowth:
    text: "Plan adult stocking around 30 cm males and females up to about 25 cm. Smaller published figures include
      FishBase's 22.5 cm male or unsexed record and FishProfiles' 23 cm estimate for both sexes. Larger
      sex-specific care recommendations are more useful for allocating an adult home. The selected female size
      is the upper endpoint of a reported 20 to 25 cm interval. No dependable age-to-length schedule or
      species-specific longevity series was found; the 8 to 10 year estimate has low confidence."

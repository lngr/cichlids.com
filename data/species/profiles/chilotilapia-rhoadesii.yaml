  problems:
    text: "Crowding and repeated social exclusion can impair feeding even before wounds become visible. Confirm
      water quality and food access when a fish withdraws or loses condition. Stable chemistry matters more
      than repeatedly adjusting water toward a tolerance endpoint. The 70 cm footprint and lifespan estimate
      remain inferences; the temperature extremes and KH extension lack species-specific long-term trials.
      Absence of a special dietary bloat flag does not rule out illness. A soft-bottom layout and a workable
      response to escalating male pressure are central to maintenance."
    sources:
      - kind: "literature"
        title: "Hill: Your fish houses, Mike Bonnick. Practical Fishkeeping"

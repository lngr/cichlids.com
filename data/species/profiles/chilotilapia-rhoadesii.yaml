  socialBehavior:
    text: "One male with three females is the recommended adult aquarium unit. Natural schools and reports of
      multi-male aquaria do not remove captive male rivalry. A reproductive male can sustain pressure on
      rivals and females when space or refuges are inadequate. The large breeding-territory classification is
      a cautious allocation of aquarium space; no source measures its boundary. Watch whether each fish can
      feed and rest away from the male and retain a practical means of separation."
    sources:
      - kind: "database"
        title: "Roder and Bandhauer: Chilotilapia rhoadesii, Malawi-Guru species directory"

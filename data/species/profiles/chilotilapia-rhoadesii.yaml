  temperatureC:
    value:
      min: 21
      max: 29
    confidence: "high"
    rationale: "Retain the decided lake interval of 21 to 29 C. Eccles reports 21 C inshore cooling and about 27 C
      in the upper layer; FAO compiles 23 to 25 C surface readings; Vollmer describes summer water near 28 C
      and winter water below 24 C; Branchu measures 22.8 to 25.4 C in one northern-basin campaign. These
      observations cover different seasons and depths. The upper 29 C endpoint is inherited from the lake
      decision and its cited Ngochera campaign, not independently remeasured here. Only the thesis abstract
      was readable through its repository; the 1999 chapter has no DOI usable by fetch-oa, so neither supplies
      newly extracted numerical evidence."

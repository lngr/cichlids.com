  compatibility:
    text: "Mixed Malawi keeping is supported when adults have adequate room and compatible food needs. Large
      haplochromines from the genera suggested by Malawi-Guru are conditional companions rather than
      guarantees for every size and stocking arrangement. Allow extra space beyond the four-fish species
      minimum and account for each companion's own predation. Fry and tiny fish can be taken opportunistically
      at the decided level 1; regular hunting of mouth-sized fish is not established. Cheilochromis euchilus
      is excluded here because the decided pairwise hybrid group carries a presumed crossing caution and
      similar-looking fish can attract aggression. That caution follows close genomic relationship rather than
      a verified cross."
    sources:
      - kind: "literature"
        title: "Hulsey et al. (2018). Phylogenomics of a putatively convergent novelty: did hypertrophied lips evolve
          once or repeatedly in Lake Malawi cichlid fishes?"

  husbandry:
    text: "Provide at least 1000 litres with 250 cm length for one male and three females. This profile also
      allows 70 cm from front to back as an inferred turning and floor-space dimension. Preserve substantial
      fine sand area and use stable stones to divide sight lines and provide several retreat routes. Strong
      filtration and regular partial water replacement should match the waste load. About 24 to 26 C is a
      well-supported routine temperature. The decided tolerances are 21 to 29 C with pH 7.5 to 8.6 and GH 3 to
      15 dGH and KH 5 to 12 dKH; their endpoints are estimates and the full temperature interval includes
      seasonal lake extremes."
    sources:
      - kind: "literature"
        title: "Hill: Your fish houses, Mike Bonnick. Practical Fishkeeping"
        url: "https://www.practicalfishkeeping.co.uk/features/your-fish-houses-mike-bonnick/"

partners:
  suitable:
    - species: "Dimidiochromis compressiceps"
      reason: "An adult Malawi hap from a companion genus suggested by Malawi-Guru with broadly compatible
        animal-based feeding."
      condition: "Size-matched adults and extra room beyond the species minimum; assess the companion's own
        predation and breeding pressure."
    - species: "Nimbochromis livingstonii"
      reason: "A large robust hap from a suggested companion genus that can fit an appropriately planned Malawi
        adult community."
      condition: "Additional territory and refuge space; adult sizes must prevent either fish from becoming prey."
    - species: "Aristochromis christyi"
      reason: "A large Malawi species from a suggested companion genus with compatible broad water chemistry."
      condition: "A substantially larger community aquarium with adult size matching and provision for the
        companion's predation and aggression."
  unsuitable:
    - species: "Cheilochromis euchilus"
      reason: "Shares the decided presumed pairwise hybrid group and is a close look-alike relative that may attract
        territorial conflict; a verified cross has not been found."
    - species: "Aulonocara maylandi"
      reason: "A smaller and quieter peacock is a poor planning choice beside a substantial reproductive male
        because of displacement and food-access risk."
    - species: "Labeotropheus fuelleborni"
      reason: "Algae-focused feeding and strong rock territoriality complicate matching its needs with an animal-fed
        soft-bottom hap."
    - species: "Paracheirodon innesi"
      reason: "Very small fish face opportunistic predation and stress as well as mismatched Malawi water chemistry."
profile:
  overview:
    text: "A snail-rich bottom is the center of this large Malawi cichlid's feeding ecology. Chilotilapia
      rhoadesii uses a specialized biting apparatus to exploit molluscs and is classified here as an
      invertivore. Displaying males become blue with red fin accents; females and less dominant fish remain
      less conspicuous. Adult keeping calls for considerable floor space and management of breeding pressure.
      Its requirements make it demanding for a beginner even though food acceptance is generally
      straightforward."
    sources:
      - kind: "catalog-of-fishes"
        title: "Eschmeyer's Catalog of Fishes: Chilotilapia, updated 21 September 2026"
        url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Ch\
          ilotilapia"
        accessed: "2026-10-13"
      - kind: "literature"
        title: "Feeding ecology underlies the evolution of cichlid jaw mobility (2018). Evolution."
        url: "https://doi.org/10.1111/evo.13518"
        accessed: "2026-10-13"
      - kind: "database"
        title: "FishBase species summary: Chilotilapia rhoadesii"
        url: "https://www.fishbase.se/summary/Chilotilapia-rhoadesii.html"
        accessed: "2026-10-13"
      - kind: "database"
        title: "Nordiska Ciklidsallskapet species register: Chilotilapia rhoadesii"
        url: "https://ciklid.org/artregister/art.php?ID=598"
        accessed: "2026-10-13"
      - kind: "database"
        title: "Roder and Bandhauer: Chilotilapia rhoadesii, Malawi-Guru species directory"
        url: "https://malawi-guru.de/chilotilapia-rhoadesii-buntbarsch-verzeichnis/"
        accessed: "2026-10-13"
  habitat:
    text: "Lake Malawi is the principal native waterbody and FishBase also records the upper Shire River. The
      species searches fine sediment and muddy bottoms in both shallow and deeper lake habitat; specialist
      accounts extend its distribution beyond older southern-lake records. A broad sand area represents this
      habitat in an aquarium. The decided natural values are 21 to 29 C with pH 7.7 to 8.6 and GH 3 to 5 dGH
      and aquarium KH 5 to 8 dKH. Lake alkalinity and general hardness must be considered separately."
    sources:
      - kind: "literature"
        title: "Branchu et al. (2010). Hydrochemistry (major and trace elements) of Lake Malawi (Nyasa), Tanzanian
          Northern Basin: local versus global considerations"
        url: "https://doi.org/10.5194/hessd-7-4371-2010"
        accessed: "2026-10-13"
      - kind: "literature"
        title: "Vanden Bossche, J.-P. and Bernacsek, G. M. (1990). Source book for the inland fishery resources of
          Africa, Vol. 1, CIFA Technical Paper 18/1, FAO. Lake Malawi/Nyasa: physical and chemical data after
          Jackson et al. (1963) and Talling and Talling (1965)."
        url: "https://www.fao.org/4/t0473e/T0473E05.htm"
        accessed: "2026-10-13"
      - kind: "literature"
        title: "Eccles, D. H. (1974). An outline of the physical limnology of Lake Malawi (Lake Nyasa). Limnology and
          Oceanography 19(5), 730-742 (abstract)."
        url: "https://doi.org/10.4319/lo.1974.19.5.0730"
        accessed: "2026-10-13"
      - kind: "literature"
        title: "Vollmer et al. (2005). Deep-water warming trend in Lake Malawi, East Africa"
        url: "https://doi.org/10.4319/lo.2005.50.2.0727"
        accessed: "2026-10-13"
      - kind: "database"
        title: "FishBase species summary: Chilotilapia rhoadesii"
        url: "https://www.fishbase.se/summary/Chilotilapia-rhoadesii.html"

        - "chilotilapia-rhoadesii-cheilochromis-euchilus"
      rationale: "Generator and checker-a propose an empty list. Checker-b and checker-c and both tie-breakers
        propose the pairwise chilotilapia-rhoadesii-cheilochromis-euchilus group; the tally selects it by
        qualified majority of four out of six at low confidence. Hulsey and colleagues recover the sister pair
        with 98 percent quartet support and Masonick and colleagues recover it from coding and noncoding
        genome data. Shared authorship limits complete independence. The rubric permits presumed groups from a
        very close relationship; neither study verifies a named cross and the 2018 introgression tests lose
        significance after multiple-comparison correction. Malawi.si's warning about other Chilotilapia is
        interpreted using the historical euchilus label recorded by the catalog. The 2008 simulated-cross
        paper does not establish empirical crossability and adds no further groups."

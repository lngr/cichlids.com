  diet:
    text: "Use complete carnivore-cichlid pellets as the dietary base with aquatic snails and appropriate portions
      of mussel flesh or shrimp or insect larvae for variety. FishBase records gastropods in the natural diet
      and functional studies identify a mollusc specialist. Acceptance of mixed pellets or plant ingredients
      does not make it primarily an omnivore in the ecological rubric. Animal protein fits this diet; the
      profile does not establish a special protein-triggered bloat tendency. Avoid excessive portions and
      check that subordinate fish obtain food. Ornamental snails and shrimp are prey rather than suitable
      companions."
    sources:
      - kind: "literature"
        title: "Feeding ecology underlies the evolution of cichlid jaw mobility (2018). Evolution."
        url: "https://doi.org/10.1111/evo.13518"

  breeding:
    value: maternal-mouthbrooder
    confidence: high
    rationale: >-
      All sources agree on a maternal mouthbrooder. The male courts at a sloping rock or sand cone,
      fertilises each egg at its base, and the female takes the eggs into her mouth and carries
      them for about three weeks (Seriously Fish, Practical Fishkeeping, Fishkeeper, Tropical Fish
      Hobbyist); the Cichlid Room Companion confirms the maternal mouthbrooding.
    sources:

  predation:
    value: 3
    confidence: medium
    rationale: >-
      Fish are the main food of this species in nature, which is level 3 of the rubric. FishBase
      lists fish as its only recorded food after the original description and estimates a trophic
      level of 4.2; Gerlai (2007) calls it a large piscivore; Seriously Fish, Practical Fishkeeping
      and Tropical Fish Hobbyist describe a hunter of small fish and of the young of other cichlids
      such as Copadichromis and Protomelas, and a feeding trial treats it as a carnivorous species.
      The Cichlid Room Companion classes it as a predator. In the aquarium it lives well on pellets
      and frozen food and leaves adult tankmates of similar size alone, but Fishkeeper, LiveAquaria
      and Tropical Fish Hobbyist warn that clearly smaller fish are eaten, and Aquarium Glaser
      describes it snapping up small fish and shrimp that digging cichlids stir up. Its prey are
      mostly young fish rather than adults, and no stomach content study quantifies the share of
      fish, which keeps the confidence at medium.
    sources:
      - *fb
      - &fbfood
        kind: database
        title: FishBase food items, Sciaenochromis fryeri
        url: https://www.fishbase.se/TrophicEco/FoodItemsList.php?vstockcode=49795&genus=Sciaenochromis&species=fryeri
        accessed: 2026-10-12
      - &gerlai
        kind: literature
        title: Gerlai, R. (2007). Mate choice and hybridization in Lake Malawi cichlids, Sciaenochromis fryeri and Cynotilapia afra. Ethology 113(7), 673-685 (abstract).
        url: https://doi.org/10.1111/j.1439-0310.2007.01372.x
        accessed: 2026-10-12

        note: males of all morphs blue, differing only in the fins
      - source: *tfh
        value: {baseColors: [blue], pattern: plain}
        note: white dorsal stripe in many males, red or orange fin accents
      - source: *pfk
        value: {baseColors: [blue, white], pattern: plain}
        note: older males with a white dorsal surface
      - source: *fk
        value: {baseColors: [blue, white], pattern: plain}
        note: white blaze in southern populations only
      - source: *afp
        value: {baseColors: [blue], pattern: plain}
        note: iridescent blue all over, coloured anal fin

  feedingSpeed:
    value: normal
    confidence: medium
    rationale: >-
      A hunting hap that takes prepared food readily but does not rush it like mbuna: Aquarium
      Glaser reports that fast mbuna outcompete it at feeding time and leave it underfed. Among
      calm haps it takes its share at a normal pace.
    sources:
      - *glaser
      - *tfh
    evidence:
      - source: *glaser
        value: normal
        note: loses food to fast mbuna
      - source: *tfh
        value: normal
        note: not a picky eater

  minTank:
    value: {volumeL: 300, lengthCm: 150, depthCm: 50}
    confidence: medium
    rationale: >-
      For one male with three or more females the sources ask for about 265 to 305 litres:
      Seriously Fish gives a base of 150 by 45 cm (about 304 litres), Fishkeeper at least 150 cm
      length, Tropical Fish Hobbyist at least 284 litres with 125 by 50 cm and 180 cm as ideal,
      LiveAquaria 265 litres. The species swims strongly and males reach 16 cm, so 150 cm length,
      50 cm front-to-back depth and about 300 litres are taken. Smaller figures of 60 to 250 litres
      in shop sheets ignore the adult size and the harem.
    sources:
      - *sf
      - *fk
      - *tfh
      - *la
      - *ecured

  coloration:
    value:
      baseColors: [blue]
      pattern: plain
    confidence: high
    rationale: >-
      Adult males are an even, intense metallic blue over the whole body (Seriously Fish, Tropical
      Fish Hobbyist, Practical Fishkeeping, Fishkeeper). Many males carry a white blaze from the
      snout along the back, which widens with age and is bred for in the Iceberg line, but it is
      absent in northern populations and young males, so blue is the one dominant colour. The anal
      fin shows yellow, orange or red accents depending on origin. No source describes bars on
      adult males; faint bars belong to females and juveniles.
    sources:
      - *sf
      - *tfh
      - *pfk
      - *fk
      - *glaser
      - *afp

    value: {min: 8, max: 12}
    confidence: low
    rationale: >-
      Only one shop care sheet gives a figure, 10 to 12 years; Malawi haps of this size commonly
      live about 8 to 10 years in the aquarium. The range covers both and needs confirmation.
    sources:

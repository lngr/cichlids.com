  habitatZones:
    value: [rock, sand]
    confidence: high
    rationale: >-
      Lives in the intermediate zone where the rocky shore gives way to sand, at 10 to 40 m depth
      (FishBase, Seriously Fish, Fishkeeper, Practical Fishkeeping); the Cichlid Room Companion
      also gives an intermediate habitat. The tank needs rock piles with caves next to open sand
      and swimming space.
    sources:

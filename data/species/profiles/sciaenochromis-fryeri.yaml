  disagreements:
    - field: taxonomy.legacyNames
      proposals:
        - {by: generator, value: [Sciaenochromis fryeri]}
        - {by: checker-a, value: [Sciaenochromis fryeri]}
        - {by: checker-b, value: [Sciaenochromis fryeri, Sciaenochromis ahli, Haplochromis ahli]}
      decision: [Sciaenochromis fryeri]
      rationale: >-
        Legacy entry 504 lists only Sciaenochromis fryeri; Sciaenochromis ahli is a separate valid
        species with its own legacy entry 502. The misapplied trade name is explained in the
        taxonomy note.
    - field: features.origin.value.waterbody
      proposals:
        - {by: generator, value: Lake Malawi}
        - {by: checker-a, value: Lake Malawi}
        - {by: checker-b, value: lake-malawi}
      decision: Lake Malawi
      rationale: Both spellings name the same entry of the water body table; the name form is used, as in the other proposals.
    - field: features.origin.value.localities
      proposals:
        - {by: generator, value: [Mbenji Island, Chinyankwazi Island, Chinyamwezi Island, Taiwan Reef]}
        - {by: checker-a, value: [Mbenji Island, Taiwan Reef, Chinyankwazi Island, Chinyamwezi Island]}
        - {by: checker-b, value: [Mbenji Island]}
      decision: [Mbenji Island, Chinyankwazi Island, Chinyamwezi Island, Taiwan Reef]
      rationale: >-
        The type locality comes from the Catalog of Fishes; FishBase names the three other sites,
        and checker-b mentions them in its own rationale.
    - field: features.ph.tolerance
      proposals:
        - {by: generator, value: {min: 7.5, max: 8.8}}
        - {by: checker-a, value: {min: 7.5, max: 8.8}}
        - {by: checker-b, value: {min: 7.0, max: 8.8}}
        - {by: tiebreaker-1, value: {min: 7.6, max: 8.8}}
        - {by: tiebreaker-2, value: {min: 7.2, max: 8.8}}
      decision: {min: 7.5, max: 8.8}
      rationale: >-
        Decided by the vote count (qualified majority, 4 of 5 within 0.3 pH); the median of the
        agreeing bounds is 7.5 to 8.8. The lower value of checker-b rests on short trials and a
        blog range.
    - field: features.maxSizeCm
      proposals:
        - {by: generator, value: {male: 16, female: 13}}
        - {by: checker-a, value: {male: 16, female: 13}}
        - {by: checker-b, value: {male: 17, female: 13}}
      decision: {male: 16, female: 13}
      rationale: >-
        Practical Fishkeeping, Fishkeeper and Aquarium Glaser put aquarium males at about 15 cm and
        only Tropical Fish Hobbyist goes to 17 to 20 cm; 20 cm figures are maximum records. 16 cm
        is the typical well-kept male.
    - field: features.predation
      proposals:
        - {by: generator, value: 3}
        - {by: checker-a, value: 3}
        - {by: checker-b, value: 2}
        - {by: tiebreaker-1, value: 3}
        - {by: tiebreaker-2, value: 3}
      decision: 3
      rationale: >-
        Decided by the vote count (qualified majority, 4 of 5). The sources agree that fish are the
        main natural food, which is the level 3 criterion; checker-b chose level 2 because the prey
        are mostly young fish.
    - field: features.diet.value.foods
      proposals:
        - {by: generator, value: [small fish and cichlid fry (wild), insect larvae and crustaceans, cichlid pellets and flakes, "frozen mysis, krill and brine shrimp"]}
        - {by: checker-a, value: [pellets and flakes for carnivorous cichlids, "frozen mysis, krill and brine shrimp", small pieces of fish or shrimp]}
        - {by: checker-b, value: [live fish fry, frozen mysis and krill, prawn, cichlid pellets]}
      decision: [small fish and cichlid fry (wild), insect larvae and crustaceans, cichlid pellets and flakes, "frozen mysis, krill and brine shrimp"]
      rationale: >-
        Type and bloat sensitivity agree in all votes; the vote count takes the food list of the
        first agreeing vote, which separates the natural diet from aquarium foods. Live fish fry
        is not recommended as aquarium food.
    - field: features.territory
      proposals:
        - {by: generator, value: {size: small, breedingOnly: true}}
        - {by: checker-a, value: {size: small, breedingOnly: true}}
        - {by: checker-b, value: {size: small, breedingOnly: false}}
      decision: {size: small, breedingOnly: true}
      rationale: >-
        Seriously Fish, Fishkeeper and Tropical Fish Hobbyist tie the defended spot to spawning, and
        Fishkeeper calls the species solitary; no source reports a territory held outside
        breeding.
    - field: features.social
      proposals:
        - {by: generator, value: {structure: harem, ratio: 3}}
        - {by: checker-a, value: {structure: harem, ratio: 4}}
        - {by: checker-b, value: {structure: harem, ratio: 3}}
      decision: {structure: harem, ratio: 3}
      rationale: >-
        The minimum figures of the sources are two, three and four females per male; three is
        their middle and the figure of Seriously Fish. The higher ideal figures are named in the
        rationale and the text.
    - field: features.coloration
      proposals:
        - {by: generator, value: {baseColors: [blue, white], pattern: bars}}
        - {by: checker-a, value: {baseColors: [blue], pattern: plain}}
        - {by: checker-b, value: {baseColors: [blue], pattern: plain}}
      decision: {baseColors: [blue], pattern: plain}
      rationale: >-
        All sources describe an evenly blue male; the bars of the generator rest only on general
        knowledge and belong to females and juveniles. The white blaze is missing in northern
        populations and young males, so it is no dominant colour.
    - field: features.minTank
      proposals:
        - {by: generator, value: {volumeL: 300, lengthCm: 150, depthCm: 50}}
        - {by: checker-a, value: {volumeL: 300, lengthCm: 150, depthCm: 50}}
        - {by: checker-b, value: {volumeL: 300, lengthCm: 150, depthCm: 45}}
      decision: {volumeL: 300, lengthCm: 150, depthCm: 50}
      rationale: >-
        Seriously Fish gives 45 cm and Tropical Fish Hobbyist 50 cm as minimum depth; the deeper
        value suits a strong swimmer of 16 cm and matches two of the three proposals.
    - field: features.lifespanYears
      proposals:
        - {by: generator, value: {min: 8, max: 12}}
        - {by: checker-a, value: {min: 8, max: 10}}
        - {by: checker-b, value: {min: 8, max: 10}}
      decision: {min: 8, max: 12}
      rationale: >-
        The checkers' range rests only on general knowledge; the one written figure (10 to 12 years,
        Aquarium Fish Paradise) reaches higher, so the range covers both.

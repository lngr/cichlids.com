  hybridGroups:
    value: [sciaenochromis-fryeri-aulonocara, sciaenochromis-fryeri-cynotilapia-afra]
    confidence: medium
    rationale: >-
      Two presumed groups apply. Seriously Fish and Fishkeeper report males breeding with or
      courting Aulonocara females without naming a peacock species, which gives the group
      sciaenochromis-fryeri-aulonocara. Gerlai (2007) reports spawning and fertile offspring of S.
      fryeri and Cynotilapia afra in a captive mate-choice study, but it is unclear whether the fish
      could choose partners of their own species, so the two-member group
      sciaenochromis-fryeri-cynotilapia-afra is presumed (only the abstract was readable).
    sources:
      - *cof
      - *gerlai
      - *sf
      - *fk

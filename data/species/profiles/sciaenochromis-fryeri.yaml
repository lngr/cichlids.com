  beginnerSuitability:
    value: moderate
    confidence: medium
    rationale: >-
      Hardy, easy to feed and easy to breed, but it needs a large tank, a harem and tankmates chosen
      with care because of its predation and its readiness to cross with other blue species.
      Seriously Fish rates it moderate and the Cichlid Room Companion places it with intermediate
      aquarists; LiveAquaria calls it easy, and Tropical Fish Hobbyist recommends it as a first
      African cichlid given a large tank.

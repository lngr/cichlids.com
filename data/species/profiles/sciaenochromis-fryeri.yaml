schemaVersion: 1
id: sciaenochromis-fryeri
legacyIds: [504]
status: described

taxonomy:
  validName: Sciaenochromis fryeri
  genus: Sciaenochromis
  species: fryeri
  author: Konings, 1993
  source: &cof
    kind: catalog-of-fishes
    title: Eschmeyer's Catalog of Fishes, species list of the genus Sciaenochromis (Sciaenochromis fryeri Konings 1993, current status valid)
    url: https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Sciaenochromis
    accessed: 2026-10-12
  synonyms: []
  legacyNames:
    - Sciaenochromis fryeri
  note: >-
    The Catalog of Fishes lists Sciaenochromis fryeri Konings 1993 as valid, with Mbenji Island in
    Lake Malawi as type locality and holotype MRAC 92.146.P.4; Konings described it in
    Sciaenochromis, so the author stands without parentheses. The catalog records no synonym for
    it. For decades the trade sold this fish as "Haplochromis ahli" or "Sciaenochromis ahli", and
    many hobby texts still do. That name belongs to a separate valid species of the same genus,
    Sciaenochromis ahli (Trewavas 1935), a replacement name for Haplochromis serranoides Ahl 1926
    and a legacy entry of its own (502). The trade name is a misidentification, not a synonym, and
    is therefore not listed under synonyms. The genus holds four valid species: S. ahli,
    S. benthicola, S. fryeri and S. psammophilus.


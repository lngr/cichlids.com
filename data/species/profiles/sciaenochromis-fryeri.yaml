  diet:
    value:
      type: piscivore
      bloatSensitive: false
      foods:
        - small fish and cichlid fry (wild)
        - insect larvae and crustaceans
        - cichlid pellets and flakes
        - frozen mysis, krill and brine shrimp
    confidence: medium
    rationale: >-
      Small fish, above all the young of other cichlids, make up most of the natural diet
      (FishBase, Gerlai 2007, Seriously Fish, Practical Fishkeeping, Tropical Fish Hobbyist), and
      the Cichlid Room Companion confirms the predatory feeding type. In the aquarium the species
      takes carnivore pellets, flakes and frozen crustaceans readily. A feeding trial found 39 to
      40 percent dietary protein best for juveniles (Güroy et al. 2008), and no source reports the
      bloat problems known from algae-grazing mbuna, so the species is not bloat-sensitive.
      LiveAquaria files it as an omnivore, which describes what it accepts in the tank rather than
      its natural food. Seriously Fish advises against mammal meat.
    sources:
      - *fb
      - *gerlai
      - *sf
      - *pfk
      - *tfh
      - *fk
      - *gueroy

        note: five to seven females per male
      - source: *fk
        value: {structure: harem, ratio: 3}
        note: several females per male, or a single fish

  speciesOnly:
    value: false
    confidence: high
    rationale: >-
      A classic member of the mixed community of Malawi haps. Seriously Fish names Nimbochromis
      venustus, Cyrtocara moorii, Protomelas and Copadichromis as good companions, Fishkeeper adds
      Dimidiochromis, Fossorochromis and Synodontis, Practical Fishkeeping recommends other fish of
      the rock-sand margin, and Tropical Fish Hobbyist calls the list of possible tankmates long.
      A species tank is recommended only for breeding.
    sources:
      - *sf
      - *fk
      - *pfk
      - *tfh

partners:
  suitable:
    - species: Cyrtocara moorii
      reason: Calm hap of similar size from the sand zone; different colour pattern and too large to be prey.
    - species: Nimbochromis venustus
      reason: Robust hap of the same habitat that holds its own and does not resemble the blue males.
      condition: Tank of at least 180 cm, as N. venustus grows larger.
    - species: Protomelas taeniolatus
      reason: Medium-sized hap of the rock-sand margin with a comparable temperament.
    - species: Copadichromis borleyi
      reason: Peaceful open-water hap of similar size; adults are too large to be prey.
    - species: Dimidiochromis compressiceps
      reason: Large, calm predatory hap that Fishkeeper names as a companion; neither species fits into the other's mouth as adults.
      condition: Tank of at least 180 cm and no small fish in the community.
    - species: Synodontis catfish
      reason: Robust bottom-dwelling catfish that use other zones of the tank and are ignored by the haps.
      condition: Species of similar adult size; the cuckoo catfish S. multipunctatus lays its eggs among the spawn of mouthbrooders and is better left out of a breeding tank.
  unsuitable:
    - species: Aulonocara
      reason: Males court and spawn with peacock females and may kill the peacock males to reach them; the blue peacock males are also treated as rivals.
    - species: Cynotilapia afra
      reason: A captive study reports spawning and fertile offspring between the two species, and its hectic activity unsettles the hap.
    - species: Sciaenochromis ahli
      reason: Congener whose blue males look almost identical; the males fight as rivals, and the two cannot be told apart reliably in the trade.
    - species: Pseudotropheus saulosi
      reason: Small, hectic mbuna; juveniles and small adults are prey, and the busy mbuna keep the hap stressed.
    - species: Lake Malawi mbuna
      reason: Fast feeders that leave the hap underfed, constant aggression in the rockwork stresses it, and their fry are eaten.

profile:
  overview:
    text: >-
      The electric blue hap is one of the most popular Lake Malawi cichlids and has been sold for
      decades under the wrong name "ahli". The true Sciaenochromis ahli is a different, rarely
      seen species; the brilliant blue fish in shops is S. fryeri, described by Ad Konings in 1993
      and named in honour of the British biologist Geoffrey Fryer. Mature males glow in a deep
      metallic blue, often with a white blaze along the back, while females stay plain silver. In
      the lake it is a stalking predator of small fish, yet in the aquarium it settles into a
      mixed group of calm haps without much trouble. It needs a long tank, a harem of females and
      tankmates that are neither prey nor blue look-alikes. Kept this way it is hardy, easy to
      feed and breeds readily, which makes it a good choice for keepers with some experience of
      Malawi cichlids.
    sources:
      - *cof
      - *sf
      - *pfk
      - *fk
      - kind: website
        title: Wikipedia, Sciaenochromis fryeri (etymology after the ETYFish Project)
        url: https://en.wikipedia.org/wiki/Sciaenochromis_fryeri
        accessed: 2026-10-12
  habitat:
    text: >-
      The species lives only in Lake Malawi, where it occurs along much of the shoreline but is
      never common. Its home is the transition zone where boulders end and sand begins, usually
      between 10 and 40 metres deep. Here it patrols just above the bottom and hunts the young of
      other cichlids that hide between the rocks, and it follows larger digging cichlids to snap
      up the small fish and shrimp they stir up. The lake water is warm (about 21 to 29 C), soft
      with 3 to 5 dGH and moderately alkaline with a pH of 7.7 to 8.6, buffered by bicarbonate at
      5 to 8 dKH. Known sites include Mbenji Island, where the type specimens come from, Taiwan
      Reef and the Chinyankwazi and Chinyamwezi islands in the south.
    sources:
      - *fb
      - *sf
      - *fk
      - *glaser
      - *branchu
      - *fao
  sizeAndGrowth:
    text: >-
      Wild type specimens reach about 11.5 cm standard length, roughly 14 cm total length. In the
      aquarium males usually grow to about 15 to 16 cm, and single large males are reported at up
      to 20 cm; females stay around 12 to 13 cm. Shops mostly sell juveniles of 4 to 5 cm, which
      grow quickly on a protein-rich diet. Young males show the first blue patches at about 5 to
      7 cm, and the dark adult blue develops at around 10 cm. With age dominant males become
      darker and their white blaze, where present, widens. Plan the tank for the adult size from
      the start.
    sources:
      - *fb
      - *pfk
      - *tfh
      - *fk
      - *afp
  husbandry:
    text: >-
      A group of one male and three or more females needs a tank of at least 150 cm length, 50 cm
      depth and about 300 litres; 180 cm is better. Build stable rock piles with caves and a few
      flat, sloping stones, and leave a wide area of open sand in front for swimming. Rocks must
      sit directly on the glass so digging cannot topple them. Keep the water clean with strong
      filtration and regular large water changes, at 24 to 27 C and a stable pH around 8. A stable,
      well-buffered alkaline pH matters more than the exact total hardness, and moderately hard tap
      water is tolerated well. A dark substrate brings out the colour of the males.
    sources:
      - *sf
      - *fk
      - *tfh
      - *la
  socialBehavior:
    text: >-
      Males cannot share a normal tank peacefully: the strongest takes over and drives the others
      into hiding, and a male in breeding mood presses a single female hard. One male with three to
      six females is the standard setup, and a second male only works in very large tanks with
      several sight barriers. Towards other species it is fairly calm and mostly chases fish away
      from its spawning rock. It does treat blue fish of similar shape as rivals and may court
      females of other genera. Outside spawning it roams the rock-sand edge and claims no fixed
      area.
    sources:
      - *sf
      - *pfk
      - *tfh
      - *fk
      - *a13937
  diet:
    text: >-
      In the lake this hap feeds mostly on small fish, especially the young of other cichlids, and
      adds insect larvae and small crustaceans. In the aquarium it accepts nearly any food. A good
      cichlid pellet or flake for carnivores makes a sound staple, completed by frozen mysis,
      krill and brine shrimp. Plant matter is not needed. Live feeder fish are unnecessary and can
      bring disease into the tank, and mammal meat such as beef heart should be avoided. Fast
      mbuna eat the food before it reaches the hap, which is one more reason to keep it with calm
      haps. Feed adults once or twice a day in amounts they finish within a few minutes.
    sources:
      - *fb
      - *sf
      - *fk
      - *glaser
      - *gueroy
  breeding:
    text: >-
      Breeding is easy in a harem tank. The male intensifies his colour and chooses a sloping
      stone, or in the lake builds a cone of sand against a rock, and displays to the females
      there. The female lays her eggs one by one on the slope; the male fertilises them at the
      bottom of the stone before she picks them up. A brood holds about 30 to 70 eggs, rarely
      more. The female carries them for about three weeks without eating and then releases
      free-swimming young that take brine shrimp nauplii and fine powdered food at once. Move a
      holding female only with care, as stress can make her spit or swallow the brood, and protect
      the fry from the adults.
    sources:
      - *sf
      - *pfk
      - *fk
      - *tfh
  sexing:
    text: >-
      Adult fish are easy to sex. Males are a vivid metallic blue over the whole body, often with
      a white stripe from the snout along the back and dorsal fin, and with a yellow, orange or red
      anal fin depending on origin. Females are silver to grey with faint dark bars and at most a
      light blue sheen when mature. Juveniles all look alike; young males show the first blue
      patches at about 5 to 7 cm. Watching the group for a while also helps, as the future male
      dominates early.
    sources:
      - *pfk
      - *tfh
      - *fk
      - *afp
  compatibility:
    text: >-
      The best tankmates are calm haps of similar size from the sand and rock margin, such as
      Cyrtocara moorii, Protomelas, Copadichromis and, in a big tank, the larger Nimbochromis and
      Dimidiochromis, plus robust Synodontis catfish. Small fish, juveniles and fry will be hunted.
      Avoid mbuna, which outcompete the hap at feeding time and keep it stressed. Be careful with
      blue species: males treat blue males as rivals and court foreign females, and crosses with
      Aulonocara females and with Cynotilapia afra are reported, so peacocks and other blue Malawi
      cichlids do not belong in its tank. Do not keep it with the look-alike S. ahli, and never mix
      different colour forms of S. fryeri, as they interbreed.
    sources:
      - *sf
      - *fk
      - *pfk
      - *tfh
      - *glaser
      - *gerlai
  problems:
    text: >-
      The most common mistake is keeping it as a pair or with several males in a small tank, which
      ends in exhausted females or beaten males. Mixing it with similarly blue species leads to
      fights and hybrid offspring, which must never be passed on. Because fry and small fish are
      prey, a community breeding tank loses most young. Like all Malawi cichlids it reacts to
      nitrate build-up and falling pH with dull colours and a higher risk of infections, so large
      regular water changes matter. Mammal meat is hard to digest and overfeeding strains the gut,
      and feeder fish can carry parasites. Kept with fast mbuna it often goes hungry and loses
      condition.
    sources:
      - *sf
      - *pfk
      - *fk
      - *glaser
      - *mk


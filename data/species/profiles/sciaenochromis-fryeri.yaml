  ph:
    value: {min: 7.7, max: 8.6}
    confidence: high
    rationale: >-
      Lake Malawi endemic; the surface water of the lake has a pH of 7.7 to 8.6 (Jackson et al.
      1963 in the FAO source book). Branchu et al. measured 7.5 to 8.5 over the whole water column,
      the lower values belonging to deep water below the depths the species uses.
    sources: *lakesources
    evidence:
      - source: *fao
        value: {min: 7.7, max: 8.6}
        note: lake surface water
      - source: *branchu
        value: {min: 7.5, max: 8.5}
        note: whole water column, lower values in deep water
    verification:
      method: waterbody
      waterbody: lake-malawi
    tolerance:
      value: {min: 7.5, max: 8.8}
      confidence: medium
      rationale: >-
        Care sheets for this species agree on alkaline water: Seriously Fish 7.6 to 8.8 with 8.2 to
        8.5 for breeding, Fishkeeper 7.5 to 8.5, Tropical Fish Hobbyist and LiveAquaria 7.8 to 8.6,
        Practical Fishkeeping 8.0 or more. The range 7.5 to 8.8 spans these sheets and contains the
        lake range. A 3-month trial on electric blue haps (sold as S. ahli, which in the trade means
        this species) started at pH 8.7 and rose with zeolite without harming growth, which supports
        the upper end. Lower values are documented only briefly: juveniles grew for 12 weeks at
        pH 7 plus or minus 0.5 in a feeding trial, and an archive member keeps the species from 7.2
        upward; neither shows health over years, so they do not lower the bound.
      sources:
        - *sf
        - *fk
        - *tfh
        - *la

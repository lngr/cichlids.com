  territory:
    value: {size: small, breedingOnly: true}
    confidence: medium
    rationale: >-
      A male claims a spawning site only when ready to breed: in the lake a cone of sand piled
      against a rock with a crater on top, in the tank usually a sloping rock that he cleans and
      defends (Seriously Fish, Fishkeeper, Tropical Fish Hobbyist). Fishkeeper describes the
      species as solitary by nature; outside spawning it roams the rock-sand margin without a fixed
      area. The defended spot around the spawning rock is small.
    sources:

  aggressionConspecific:
    value: 3
    confidence: medium
    rationale: >-
      Males do not tolerate rivals in tanks of normal size: Tropical Fish Hobbyist reports the
      dominant male turning on subdominant males unless several large territories exist, and
      Seriously Fish advises a single male except in very large tanks. Males also court females
      hard, so several females per male are needed to spread the pressure (Seriously Fish,
      Practical Fishkeeping, Fishkeeper). Injuries follow from too little space or a wrong sex
      ratio, which is level 3. Keepers in the archive find the species territorial but not
      unusually aggressive in a properly stocked large tank.
    sources:
      - *sf
      - *tfh
      - *pfk
      - *fk
      - &a13937
        kind: archive
        title: cichlids.com forum thread 13937
        url: https://www.cichlids.com/disc/read.php?2,13937
        accessed: 2026-10-12
      - &a14205
        kind: archive
        title: cichlids.com forum thread 14205
        url: https://www.cichlids.com/disc/read.php?2,14205
        accessed: 2026-10-12
    evidence:
      - source: *sf
        value: 3
        note: one male only unless the tank is very large; males harass females
      - source: *tfh
        value: 3
        note: dominant male very aggressive towards other males
      - source: *pfk
        value: 3
        note: a single female gets harassed, several males fight
      - source: *fk
        value: 3
        note: one male with a harem
      - source: *a13937
        value: 3
        note: resident male kept newcomers pressed into a corner
      - source: *a14205
        value: 2
        note: member experience in a 325 litre tank

  aggressionHeterospecific:
    value: 2
    confidence: medium
    rationale: >-
      Towards other species it is moderate: Seriously Fish calls it robust but not especially
      aggressive, and Tropical Fish Hobbyist places it in the middle of the cichlid spectrum; both
      name many Malawi haps as tankmates. It does target similarly coloured fish, and Fishkeeper
      reports males that drive off or kill Aulonocara males to court their females. LiveAquaria
      rates it aggressive, while keepers in the archive find it calm in mixed hap tanks. Chasing
      from its spot without regular injuries in a suitable tank is level 2.
    sources:
      - *sf
      - *tfh
      - *fk
      - *la

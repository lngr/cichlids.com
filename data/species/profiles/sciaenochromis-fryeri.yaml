  social:
    value: {structure: harem, ratio: 3}
    confidence: medium
    rationale: >-
      Kept as one male with several females. The minimum figures range from two (Practical
      Fishkeeping) over three (Seriously Fish) to four females per male (Tropical Fish Hobbyist);
      the ideal figures are higher, about six (Practical Fishkeeping), five to seven (LiveAquaria)
      and eight or more (Tropical Fish Hobbyist). Three females per male is the middle of the
      minimum figures; more females spread the courtship pressure better but are often hard to
      obtain because the trade offers more males.
    sources:
      - *sf
      - *pfk
      - *tfh
      - *la
      - *fk

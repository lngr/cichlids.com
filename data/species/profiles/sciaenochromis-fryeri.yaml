  ghDgh:
    value: {min: 3, max: 5}
    confidence: high
    rationale: >-
      Lake Malawi endemic; the lake is soft water. Calcium and magnesium in the upper 50 m of the
      north basin give 4.2 to 4.6 dGH (Branchu et al. 2010), and the titrations of the 1960s
      compiled by the FAO give 3.2 to 4.9 dGH. The buffering of the lake comes mainly from
      bicarbonate balanced by sodium, not from calcium and magnesium.
    sources: *lakesources
    evidence:
      - source: *branchu
        value: {min: 4.2, max: 4.6}
        note: north basin, upper 50 m, October 1993
      - source: *fao
        value: {min: 3.2, max: 4.9}
        note: titrations of the 1960s
    verification:
      method: waterbody
      waterbody: lake-malawi
    tolerance:
      value: {min: 3, max: 25}
      confidence: low
      rationale: >-
        Seriously Fish gives 10 to 25 dGH and Fishkeeper accepts up to 25 degrees, so the hobby
        agrees on 25 dGH as the upper end; one general page names 14 dGH. The lower bounds of the
        care sheets reflect the widespread belief that Malawi water is hard, which confuses hardness
        with alkalinity. The wild fish live permanently at 3 to 5 dGH, so the tolerance starts at
        the lake value. No source tests the species in soft aquarium water with a high carbonate
        hardness, so the range needs confirmation.
      sources:
        - *sf
        - *fk
        - *branchu
        - *fao
        - *ecured
      evidence:
        - source: *sf
          value: {min: 10, max: 25}
          note: aquarium recommendation
        - source: *fk
          value: {max: 25}
          note: states only an upper limit
        - source: *branchu
          value: {min: 4.2, max: 4.6}
          note: lake water, lower end of the tolerance
        - source: *fao
          value: {min: 3.2, max: 4.9}
          note: hardness the wild fish live in
        - source: *ecured
          value: {max: 14}
          note: states only an upper limit
      verification:
        method: unanimous
        votes: {agree: 3, total: 3}

  khDkh:
    value: {min: 5, max: 8}
    confidence: high
    rationale: >-
      Lake Malawi endemic; the alkalinity of 2.33 to 2.46 meq/L in the Branchu profiles and 2.00 to
      2.59 meq/L in Jackson et al. (1963) gives 5 to 8 dKH. Carbonate hardness exceeds total
      hardness because sodium balances part of the bicarbonate.
    sources: *lakesources
    evidence:
      - source: *branchu
        value: {min: 6.5, max: 6.9}
        note: alkalinity 2.33 to 2.46 meq/L
      - source: *fao
        value: {min: 5.6, max: 7.3}
        note: alkalinity 2.00 to 2.59 meq/L
    verification:
      method: waterbody
      waterbody: lake-malawi
    tolerance:
      value: {min: 5, max: 15}
      confidence: low
      rationale: >-
        Only LiveAquaria names a carbonate hardness for this species, 10 to 15 dKH. Seriously Fish
        and the zeolite trial give no dKH; their pH ranges of 7.6 to 8.8 and about 8.7 imply well
        buffered water but no exact figure. The tolerance runs from the lake value of 5 dKH up to the
        highest husbandry recommendation. With a single direct figure the range needs confirmation.
      sources:
        - *la
        - *branchu
        - *fao
        - *sf
        - *oz
        - *ecured
      evidence:
        - source: *la
          value: {min: 10, max: 15}
          note: aquarium recommendation
        - source: *branchu
          value: {min: 6.5, max: 6.9}
          note: lake water, lower end of the tolerance
        - source: *fao
          value: {min: 5.6, max: 7.3}
          note: carbonate hardness the wild fish live in
        - source: *sf
          value: {min: 5, max: 15}
          note: no dKH stated; inferred from pH 7.6 to 8.8 and 10 to 25 dGH
        - source: *oz
          value: {min: 5, max: 15}
          note: no dKH stated; inferred from a stable pH of about 8.7
        - source: *ecured
          value: {max: 14}
          note: carbonate hardness said to lie a little below 14 degrees
      verification:
        method: unanimous
        votes: {agree: 3, total: 3}


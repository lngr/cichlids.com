      high confidence. Plisnier's surface means for calcium and magnesium convert to approximately 11.1 to
      11.5 dGH using Ca/7.14 + Mg/4.34; the rounded lake synthesis also incorporates the cited north-basin
      chemistry and earlier measurements. The higher GH values in aquarium profiles describe husbandry
      recommendations and do not redefine the natural water.

  sexing:
    text: "Adult size and behaviour help sex a group, but neither should be used alone. Specialist accounts
      describe grey males and more colourful females with yellow to copper abdominal tones; other care sheets
      give less consistent colour differences. A dark dorsal mark can occur in immature males and may weaken
      later, so the presence of a spot alone is insufficient. Identification is especially important because
      similar small lamprologines have been confused in the trade and in hobby reports."
    sources:

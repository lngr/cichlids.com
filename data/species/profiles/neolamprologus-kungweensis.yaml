    rationale: "The settled tally fixes natural lake pH at 8.4 to 9.4 with waterbody verification and high
      confidence. Plisnier et al. measured 8.47 to 9.40 at 40 m in the northern basin over an annual cycle.
      The older FAO source book gives 7.3 to 7.8, but that conflicts with the modern station series and the
      lake's substantial alkalinity; its historical figure is retained as dissenting evidence rather than used
      to alter the settled range."

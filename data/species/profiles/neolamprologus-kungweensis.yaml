  problems:
    text: "Two recurring risks are shelter competition and a layout that leaves little fine substrate for
      excavation. Inspect subordinate fish for loss of feeding access, repeated pursuit and damage after
      disputes. Secure heavy decorations so digging cannot undermine them and protect filter intakes from
      shifted substrate. Maintain clean, oxygenated water without sudden chemical changes. Conflicting hobby
      descriptions and an archive report about mistaken identification also caution against assigning sex or
      planning a community from a trade name alone."

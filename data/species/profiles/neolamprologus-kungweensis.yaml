    tolerance:
      value:
        min: 10
        max: 28
      confidence: low
      rationale: "Retain the tally's median of 10 to 28 dGH with low confidence and 3 agreeing votes out of 6.
        Generator, checker-b and checker-c propose 10 to 30; checker-a, tiebreaker-1 and tiebreaker-2 propose
        10 to 25. The median upper endpoint is 27.5, rounded to 28, and no qualified majority settles 25
        versus 30. Seriously Fish recommends 10 to 25, Aqua-Fish gives the wider upper range of 15 to 30, and
        FishProfiles gives 28 to 35 dGH; the decided ceiling is below both latter ceilings, and their complete
        values remain in evidence. General guidance of 8 to 20 from Tanganyika.si and 5 to 20 from JBL is less
        species-specific; the aquarium reading of 14 dGH establishes only one keeping point. The median is
        plausible as broad hard-water husbandry, but it is a voting compromise rather than a tested biological
        limit. Natural 10 to 13 dGH remains contained."

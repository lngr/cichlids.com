              note: "Secondarily preoccupied name, replaced by Lamprologus kungweensis Poll 1956."
            - name: Lamprologus kungweensis Poll 1956
              note: Original combination; FishBase and Seriously Fish still use this genus.
        - by: checker-b
          value:
            - name: Lamprologus kungweensis
              note: Earlier genus combination retained by FishBase and much aquarium literature.
            - name: "Lamprologus ocellatus Poll, 1952"
              note: Replaced because the name was preoccupied by Julidochromis ocellatus.
        - by: checker-c
          value:
            - name: Lamprologus ocellatus
              note: Replacement name preoccupied by Julidochromis ocellatus.
      decision:
        - name: Lamprologus kungweensis
          note: Original generic combination published by Poll in 1956; still used by FishBase and some recent
            literature.
        - name: "Lamprologus ocellatus Poll, 1952"
          note: The preoccupied name replaced in 1956. This is not the separate species described by Steindachner in
            1909.
      rationale: "All full runs agree on the valid species, author and genus. Normalize the older combination and
        qualify Poll's preoccupied ocellatus with author and year; omission of that qualification could
        identify the separate Steindachner species. Checker-c omitted the original generic combination, which
        the Catalog confirms."

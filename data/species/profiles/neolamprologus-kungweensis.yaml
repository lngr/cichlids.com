    tolerance:
      value:
        min: 23
        max: 29
      confidence: low
      rationale: "Retain the tally's unanimous decision of 23 to 29 C and low confidence. Generator and checker-b
        propose 23 to 29 C, checker-a 22 to 29 C, and checker-c 21 to 29 C; the tally counts agreement within
        its temperature threshold. The midpoint of the four lower proposals is 22.5 C, rounded to 23 C by the
        tally. Seriously Fish and Aqua-Fish recommend 23 to 27 C and Zoopet 23 to 26 C, while FishProfiles
        gives the wider lower reach of 21 to 27 C. The decision does not adopt that cooler lower endpoint and
        extends the care-sheet upper endpoints to contain the measured natural range. Its equality to the
        natural range results from those two operations, not evidence of failure at 22 C; endpoint health data
        are absent and normal keeping should remain near the middle."

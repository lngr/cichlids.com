  compatibility:
    text: "A larger Tanganyika aquarium can combine the pair with peaceful fish using higher water levels or a
      separate rocky area. Paracyprichromis, Cyprichromis and small Julidochromis are conditional options
      whose own space requirements must also be met. The 68 L pair minimum is not a community recommendation.
      Forceful shell-territory holders may displace this species, and large predators can threaten its smaller
      members. No hybrid group is assigned: the forum question about N. calliurus produced no documented
      cross, and hybridization reported in other lamprologines cannot be transferred to kungweensis."
    sources:
      - kind: database
        title: "Seriously Fish: Lamprologus kungweensis"

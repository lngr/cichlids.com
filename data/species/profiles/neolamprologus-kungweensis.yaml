  sizeAndGrowth:
    text: "Use approximately 7.5 cm for adult males and 5 cm for females as working aquarium maxima. These medians
      reconcile estimates that vary substantially by source and do not imply a measured growth curve. FishBase
      records 8 cm total length for males or unsexed fish; this cannot establish an 8 cm female maximum.
      Sex-specific hobby estimates range from 7/3 cm to 6/5 cm. The available lifespan estimate is 5 to 8
      years, with low confidence."

  breeding:
    text: "The selected category is cave-spawner, reflecting reproduction in enclosed burrows within soft
      sediment. Aquarium accounts also describe spawning in shells, and specialist guidance mentions short
      tubes as substitute sites. Offer several options without sacrificing diggable substrate. Reports differ
      on how eggs and larvae are shared between the parents, so avoid assuming that every pair will follow the
      same sequence. Protect the nest from competing bottom fish and offer very small live foods when the
      young begin feeding."

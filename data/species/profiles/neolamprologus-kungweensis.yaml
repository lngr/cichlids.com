partners:
  suitable:
    - species: Paracyprichromis brieni
      reason: "Uses higher water levels and rock faces, reducing direct competition for the burrowing area."
      condition: Use a longer aquarium with a well-established shoal and separate bottom territories.
    - species: Cyprichromis leptosoma
      reason: A midwater shoaler has less direct competition for burrow sites and bottom territory.
      condition: A substantially larger tank than the species minimum is needed for the shoal.
    - species: Julidochromis transcriptus
      reason: A small rock-associated species can occupy a different niche if rockwork is kept apart from the
        burrowing area.
      condition: Provide distinct rock and sandy-bottom zones with sight-line breaks.
  unsuitable:
    - species: Altolamprologus calvus
      reason: Its predatory mouth and much larger adult size put small kungweensis and fry at risk.
    - species: Neolamprologus ocellatus
      reason: "A forceful shell-territory holder may monopolize the shells and burrowing edge, displacing the
        smaller kungweensis."
    - species: Lepidiolamprologus hecqui
      reason: Larger shell-associated adults can dominate the bottom and outcompete kungweensis for shelter and food.
profile:
  overview:
    text: "Neolamprologus kungweensis is a small Tanganyika cichlid whose digging behaviour deserves as much
      attention as its shelter. Its familiar shell-dweller label can be misleading: natural-history accounts
      describe nests excavated in fine sediment, while shells serve as alternative sites in aquariums. A
      compatible pair with separate retreats is the recommended unit here. Published care accounts disagree
      about social arrangements and adult dimensions, so provenance and identification matter when choosing
      stock."
    sources:
      - kind: catalog-of-fishes

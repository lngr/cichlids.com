  husbandry:
    text: "Provide at least 68 L with a 75 by 30 cm base for the recommended pair. Keep biological filtration and
      surface gas exchange effective, while allowing quieter areas around the substrate and retreats. The
      natural lake ranges are 23 to 29 C, pH 8.4 to 9.4, 10 to 13 dGH and 15 to 20 dKH. The decided aquarium
      tolerances are 23 to 29 C, pH 7.5 to 9.4, 10 to 28 dGH and 10 to 24 dKH, all with low confidence. These
      broad intervals are provisional compatibility bounds rather than targets for routine fluctuations. The
      middle of the narrower published temperature recommendations, about 25 to 26 C, is a practical steady
      setting. Monitor GH separately from alkalinity and match replacement water to the established aquarium."
    sources:
      - kind: literature
        title: "Plisnier, P.-D., Langenberg, V., Mwape, L., Chitamwembwa, D., Tshibangu, K. and Coenen, E. (1996).

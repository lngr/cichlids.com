  diet:
    text: "Feed small live or frozen invertebrates such as Artemia and daphnia, with suitable prepared food only
      where it is accepted. Natural food records emphasize zooplankton and small animals exposed during
      excavation. This supports an invertivore diet and predation level 0, while incidental loss of very small
      fry remains possible. No reviewed source establishes a special bloat-related protein restriction. Modest
      portions and removal of leftovers help keep the digging areas clean."

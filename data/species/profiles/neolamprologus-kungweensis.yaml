  socialBehavior:
    text: "Start with a compatible male and female, giving each a retreat and enough open bottom to avoid constant
      contact. Natural-history material supports pair formation, while some care sheets recommend a male with
      several females or a small group. The pair recommendation therefore remains moderately certain. Shelter
      defence persists outside spawning, and additional same-sex adults can compete strongly. Persistent
      pursuit or a fish that cannot leave cover calls for a change in layout or separation."

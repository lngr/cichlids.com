    tolerance:
      value:
        min: 10
        max: 24
      confidence: low
      rationale: "Retain the tally's median of 10 to 24 dKH with low confidence and 3 agreeing votes out of 6.
        Generator proposes 15 to 30; checker-a and tiebreaker-1 propose 10 to 22; checker-b and checker-c
        propose 10 to 25; tiebreaker-2 proposes 10 to 20. The medians are 10 and 23.5, with the latter rounded
        to 24. No source establishes species-specific long-term KH endpoints: Tanganyika.si gives general
        Tanganyika aquarium guidance of 11 to 22, JBL gives 7 to 20 for Malawi and Tanganyika together, and
        one aquarium account records 10. Seachem explains buffering separately from GH but provides no species
        KH limit; the archived JBL product pages contain notification text only. The wider run proposals
        reaching 25 and 30 are inferences, not measured source ranges, and the median excludes their upper
        ends. The natural 15 to 20 range is contained. The decision is a plausible provisional buffering
        interval, not a conversion of GH into KH or proof that fish fail outside it."

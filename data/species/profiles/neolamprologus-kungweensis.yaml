  habitat:
    text: "Records extend from Kungwe Bay toward Bujumbura and Kalemie, with Kiriza also represented in specialist
      locality material. The fish is associated with muddy lake bottoms, where narrow openings reveal its
      burrows. Shells occur at some sites but do not define every occupied patch. Fine sand is the practical
      substrate category for an aquarium; allow a deep diggable layer and several sheltered retreats. Marginal
      rocks can interrupt sight lines without replacing the open bottom."

    rationale: "The settled tally fixes natural alkalinity at 15 to 20 dKH with high confidence; no verification
      object is attached to this natural feature. Plisnier reports bicarbonate of 5.6 to 6.2 meq/L plus a
      smaller carbonate contribution, and the FAO source book gives 6.71 meq/L total alkalinity, equivalent to
      about 18.8 dKH. These measurements underlie the rounded lake range. Aquarium KH measures
      acid-neutralizing capacity and can exceed calcium-magnesium hardness; GH and KH are not interchangeable.
      Cohen's existing archived citation is retained from the inputs, but fetch-oa did not provide an
      open-access full text for a fresh check."

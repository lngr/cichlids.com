  breeding:
    text: "Females incubate the brood in their mouths. Read care accounts commonly describe release around three weeks, with variation between reports. A holding female needs refuge from renewed courtship. Borstein removed developing young after twelve days, which is an intervention record rather than the normal release time. Released young can receive finely divided prepared food and newly hatched brine shrimp in a protected grow-out setting."

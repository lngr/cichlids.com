    text: "Plan for typical aquarium maxima near 25 cm for males and 20 cm for females, with less certainty about the female figure. Wild standard-length measurements exclude the tail and cannot be compared directly with aquarium total length. Borstein recorded rapid juvenile growth and explicitly recommended larger quarters as the fish matured. An 8 to 12 year lifespan is a secondary husbandry estimate without verified age records."

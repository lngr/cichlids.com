  compatibility:
    text: "Use similar-sized Malawi companions with restrained behaviour and compatible feeding needs. Cyrtocara moorii, Copadichromis borleyi and Otopharynx lithobates are conditional husbandry candidates in a larger community, rather than guaranteed pairings. Avoid persistent bullies such as Melanochromis auratus and protect fry and very small fish. No hybrid group is supported for milomo in this adjudication; missing named crossing records do not establish reproductive isolation."

      rationale: "Generator and tiebreaker-2 propose 3 to 20 dGH; checker-a, checker-b, checker-c and tiebreaker-1 propose 3 to 25 dGH. Qualified-majority verification is 4 of 6 and retains 3 to 25 dGH with medium confidence. Seriously Fish gives 10 to 25 dGH, whereas Coburg and the Aquarium Wiki give 10 to 20, Rybicky 4 to 22 and Einrichtungsbeispiele 5 to 15. The lower endpoint includes measured lake water rather than imposing the care sheets lower limits. Fishkeeper states an upper limit of 25 without specifying a minimum; its evidence is therefore not support for zero dGH. This is a recommendation envelope without chronic-exposure trials."

  ghDgh:
    value:
      min: 3
      max: 5
    confidence: "high"
    rationale: "The binding natural range is 3 to 5 dGH with high confidence. FAO calcium and magnesium records yield approximately 3.2 to 4.9 dGH across the two historical datasets. Branchu upper-50-m concentrations yield about 4.2 to 4.6 dGH using Ca mg/L divided by 7.14 plus Mg mg/L divided by 4.34. The rounded lake interval preserves these measurements; the harder aquarium intervals belong in tolerance."

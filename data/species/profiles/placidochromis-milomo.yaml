  problems:
    text: "Two practical concerns are inadequate adult swimming room and overfeeding a fish with a strong appetite. Bullying can prevent quieter individuals from eating even when the dominant fish appears healthy. Monitor condition and breathing alongside water quality, and keep ammonia and nitrite undetectable. Reduced lip prominence in captive fish is reported and by itself does not establish illness."

  husbandry:
    text: "Allow at least 700 L with a 200 x 60 cm footprint for one adult male and three females. The
        depth is a planning inference; a mixed community needs more space. Place stable rock refuges
        around a clear swimming route and retain sand between them. Maintain established filtration
        and good oxygenation. A steady 24 to 26 C is a practical routine target. The catalog
        tolerances are 21 to 29 C, pH 7.5 to 8.8, GH 3 to 25 dGH and KH 5 to 15 dKH; they are
        recommendation envelopes with uncertain limits rather than optimal targets throughout. Test
        GH and KH separately."

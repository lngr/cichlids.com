  diet:
    text: "Aquatic arthropods are the principal recorded wild prey, with fry taken occasionally. Use complete cichlid pellets, small crustaceans and insect larvae, with some spirulina-containing food as variety. The invertivore classification follows natural feeding rather than acceptance of mixed aquarium rations. Vigorous appetite supports a provisional hasty feeding grade, so check access for quieter fish and avoid excessive portions. No special high-protein bloat sensitivity is established, although the false flag does not imply immunity to digestive illness."

    confidence: "high"
    rationale: "The binding lake decision is 21 to 29 C with high confidence. Eccles reports southeastern inshore cooling to 21 C and upper-layer water near 27 C in May; Vollmer documents seasonal upper-water variation, and the FAO compilation gives an older 23 to 25 C snapshot. These studies cover different seasons and depths rather than a fixed aquarium target. The complete lake envelope is retained, including its 29 C upper endpoint; the Ngochera dissertation was read at abstract level only, so no endpoint is attributed to that abstract."

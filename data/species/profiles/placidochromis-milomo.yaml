      decision:
        min: 5
        max: 15
      rationale: "No qualified majority settles the 6 proposals. generator proposes 5 to 15; checker-a
        proposes 5 to 15; checker-b proposes 5 to 10; checker-c proposes 5 to 20; tiebreaker-1
        proposes 5 to 20; tiebreaker-2 proposes 5 to 15 (dKH). The rounded median of all minima and
        all maxima is 5 to 15 dKH. This contains natural 5 to 8 without widening. Confidence is low.
        JBL gives 5 to 10 for a Malawi aquarium; wider recommendations are OATA 10 to 15, Sera
        instructions reproduced by ATZ 10 to 15, Aquarium.org.il 12 to 20 and Il Mio Acquario 8 to
        18. The latter is genus-level guidance and the Israeli field does not explicitly spell out
        degrees. These recommendations explain the wider proposals without establishing a milomo
        physiological ceiling. The natural 5 to 8 dKH remains included. Monks's unavailable account
        supplies no numerical support. The median is plausible because it contains natural buffering
        and reaches the common 10 to 15 dKH aquarium recommendation."

partners:
  suitable:
    - species: "Cyrtocara moorii"
      reason: "Comparatively restrained Malawi hap with sufficient adult size and a compatible invertebrate-based feeding routine."
      condition: "Use a community larger than the milomo minimum, with open sand and swimming room for both social units; watch blue male rivalry."
    - species: "Copadichromis borleyi"
      reason: "A relatively peaceful Malawi zooplankton feeder whose adult size and feeding needs can suit a restrained hap community."
      condition: "Choose mature fish and a visibly different male color form; provide space for both female groups and separate spawning sites in a larger community tank."
    - species: "Otopharynx lithobates"
      reason: "A relatively mild Malawi hap that can share alkaline water and animal-focused aquarium foods."
      condition: "Use established adults in a larger community, preserve rock refuges, and watch feeding access and breeding pursuit."
  unsuitable:
    - species: "Melanochromis auratus"
      reason: "Persistent aggression can overwhelm a comparatively mild milomo even though water requirements overlap."
    - species: "Maylandia zebra"
      reason: "Territorial mbuna behavior and the more plant-focused feeding requirement make routine community keeping a poor fit."
    - species: "Paracheirodon simulans"
      reason: "Very small body size creates prey risk, and its soft, acidic community setting is incompatible with routine Malawi husbandry."
profile:
  overview:
    text: "Milomo is a large Malawi haplochromine recognized for its enlarged lips and blue adult-male coloration over a barred body. Lip development varies in captivity. The accepted name remains Placidochromis milomo Oliver, 1989; Super VC-10 is a trade name. Nuclear genomic work places it among non-mbuna despite its rocky feeding habitat. Abactochromis labrosus and the separately sampled Mbenji fatlip should not be identified as milomo merely because their lips are enlarged."

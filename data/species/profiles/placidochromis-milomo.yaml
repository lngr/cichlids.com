  habitat:
    text: "The feeding habitat is sediment-coated rock with nearby sandy transition areas. FishBase records depths of 4 to 35 m and southern Malawi shores plus Nkhata Bay; genomic collections add several southern islands. Natural lake values are 21 to 29 C, pH 7.7 to 8.6, GH 3 to 5 dGH and KH 5 to 8 dKH. Modest calcium-magnesium hardness can coexist with alkaline, buffered water."

  socialBehavior:
    text: "The recommended one-male, three-female unit spreads courtship attention and avoids routine competition between males. It is an aquarium arrangement rather than a permanent wild harem. Displays and chasing can increase during spawning, with a localized breeding site rather than a lasting large territory. Adult milomo is usually restrained toward other species. Persistent hiding or missed feeding indicates that space or social arrangements need attention."

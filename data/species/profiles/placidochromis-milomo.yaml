  sexing:
    text: "Mature dominant males generally develop more blue coloration and grow larger; females retain quieter bars. Extended fins can help, but subordinate males and juveniles may resemble females. Judge mature fish over time rather than relying on one photograph or the absence of blue. Lip prominence varies with development and feeding conditions and is not a reliable sex indicator."

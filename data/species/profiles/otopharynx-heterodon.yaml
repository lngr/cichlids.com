        The agreeing proposals were 4 to 15 (generator, checker-a, tiebreaker-1), 4 to 14
        (checker-b) and 5 to 15 (tiebreaker-2); checker-c proposed 4 to 20 and dissents on the
        ceiling. No source states a carbonate hardness for this species or its congeners, so the
        range is derived: from the pH tolerance of 7.4 to 8.6, which needs a steady buffer, from the
        GH advice of FishBase, from the OATA care sheet for Malawi cichlids (10 to 15 dKH) and from
        forum keepers who run Malawi tanks at about 4 to 15 dKH. The tolerance is wider than the
        natural 5 to 8 dKH on both sides and needs confirmation."

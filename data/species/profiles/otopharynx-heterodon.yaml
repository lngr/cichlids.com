  breeding:
    text: "The species is a maternal mouthbrooder. The male chooses a spot on sand or between rocks,
      depending on the population, and courts with spread fins and trembling swimming. The female
      lays about 20 to 60 small eggs, takes them into her mouth and the male fertilises them as she
      collects them. The eggs hatch after three to four days and the female releases the fry after
      about 20 to 21 days. Adult fish eat fry in a community tank, so a quiet tank with sand and a
      hiding place helps if fry are wanted. Move the female there at around 18 days and return her
      once she has released the young. Feed the fry crushed flake and newly hatched brine shrimp."
    sources:

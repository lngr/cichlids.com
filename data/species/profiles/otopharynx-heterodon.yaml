  diet:
    text: "In the lake the fish feeds opportunistically on edible material in the sediment and in debris
      drifting just above the bottom, and it sifts sand while doing so. In the tank it accepts flake
      and pellet food readily. Offer a good cichlid pellet as the staple and add frozen mysis, brine
      shrimp or krill several times a week. It eats at an ordinary pace, so keep it away from hasty
      feeders that clear the tank first. Feed small portions once or twice a day and avoid fatty
      foods. Nothing indicates that the species tends to bloat."
    sources:
      - kind: database
        title: "FishBase: Otopharynx heterodon summary"
        url: "https://www.fishbase.se/summary/Otopharynx-heterodon.html"
        accessed: 2026-10-17

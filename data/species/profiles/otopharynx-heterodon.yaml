  khDkh:
    value:
      min: 5
      max: 8
    confidence: high
    rationale: "Lake Malawi endemic, so the natural range is the lake range of 5 to 8 dKH. Alkalinity of
      2.33 to 2.46 meq/L in the north basin profiles of Branchu et al. (2010) corresponds to 6.5 to
      6.9 dKH, and 2.00 to 2.59 meq/L in the 1960s survey compiled by FAO to 5.6 to 7.3 dKH. Sodium
      balances part of the bicarbonate, so the carbonate hardness of the lake exceeds its total
      hardness."

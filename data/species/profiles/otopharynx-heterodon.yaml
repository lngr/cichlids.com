  habitat:
    text: "The species lives throughout Lake Malawi and is recorded from Monkey Bay, Nkhata Bay,
      Chilumba and Likoma Island. It prefers sediment-rich ground, often in deeper water, and also
      uses the intermediate zone where rock meets sand. Lake Malawi water is soft and alkaline: 21
      to 29 C, pH 7.7 to 8.6, 3 to 5 dGH and 5 to 8 dKH. Many care sheets call the lake hard water,
      but the mineral hardness is low and it is the carbonate buffering that is high. In the tank
      the fish needs fine sand to sift, rock piles for cover and open water above them."
    sources:
      - kind: database
        title: "FishBase: Otopharynx heterodon summary"
        url: "https://www.fishbase.se/summary/Otopharynx-heterodon.html"
        accessed: 2026-10-17

  maxSizeCm:
    value:
      male: 15
      female: 12
    confidence: medium
    rationale: "The proposals were male 15 cm and female 12 cm (generator, checker-b, checker-c) and
      male 14 cm and female 12 cm (checker-a); the median is 15 and 12 cm. FishBase records 12.8 cm
      total length for a male or unsexed wild fish, Malawi Mayhem gives 10 to 13 cm, Wet Spot 13 cm,
      FishFish 12 cm, AquaInfo and Ciklider.se about 13 cm for wild males and up to 15 cm in tanks
      with females near 12 cm, malawi.si up to 17 cm for males and 14 cm for females, and Aquahaus
      Gaus 12 to 20 cm without sexes. The decided values follow the aquarium figures of AquaInfo and
      Ciklider.se, which lie inside the source range and below the upper figures of malawi.si and
      Aquahaus Gaus."

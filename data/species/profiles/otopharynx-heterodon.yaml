    confidence: high
    rationale: "Endemic to Lake Malawi. The Catalog of Fishes gives Monkey Bay as the type locality of
      Haplochromis heterodon, FishBase lists Chilumba, Nkhata Bay, Likoma Island and Monkey Bay, the
      Cichlid Room Companion shows a male from Lupingu on the Tanzanian shore and malawi.si
      documents the sites Mphanga Rocks and Ngwasi and describes the species as widespread around
      the lake. All four runs agree on the lake; the locality lists differ only in length, so they
      are merged. The Tanzanian trade form sold as 'Big Spot Tanzania' is a related but separate
      form according to Cichlid News and adds no locality to this species."

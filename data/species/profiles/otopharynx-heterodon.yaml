  hybridGroups:
    value:
      - otopharynx
    confidence: low
    rationale: "The tally decides the group otopharynx unanimously (4 of 4 votes) with low confidence.
      The curated group lists O. heterodon among the described Otopharynx species with the basis
      presumed. Its support is a general hobby warning about crosses within the genus, given by
      French Wikipedia and Fishipedia for O. tetraspilus; no source reports a cross involving O.
      heterodon itself. Females of several Otopharynx species are silvery with three dark spots and
      look much alike, which makes mispairing plausible. A post in the cichlids.com forum archive
      considers Otopharynx unlikely to cross with peacocks, which concerns other genera and does not
      contradict the warning within the genus."

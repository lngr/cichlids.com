  socialBehavior:
    text: "The species is calm and rarely territorial outside the breeding season. Males hold a small
      spawning site while courting, and because males compete for females the usual advice is one
      male with several females. Several males need a large tank with plenty of rockwork. Towards
      other species the fish mostly ignores tankmates or shows briefly at those that come close to
      its spawning site. Rowdy mbuna harass it and suppress male colour, so peaceful partners work
      best. Unlike the look-alike sp. 'heterodon likoma', it does not build bowers."
    sources:
      - kind: website
        title: "AquaInfo: Otopharynx heterodon"

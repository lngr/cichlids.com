  note: "The Catalog of Fishes (online version of 21 September 2026) gives the status Valid as
    Otopharynx heterodon (Trewavas 1935), filed under the original name Haplochromis heterodon with
    a lectotype chosen by Eccles and Trewavas (1989); the list of the genus Haplochromis holds no
    separate valid entry. The legacy name equals the valid name. Undescribed relatives traded under
    related names, such as Otopharynx sp. 'heterodon nankumba', sp. 'heterodon likoma', sp.
    'heterodon boadzulu' and sp. 'big spot Tanzania', are separate forms in the Cichlid Room
    Companion and Cichlid News and are not part of this species."

  minTank:
    value:
      volumeL: 325
      lengthCm: 130
      depthCm: 50
    confidence: medium
    rationale: "The proposals were 325 L at 130 x 50 cm (generator), 300 L at 130 x 45 cm (checker-a)
      and 350 L at 130 x 50 cm (checker-b, checker-c). The median volume is 337.5 L, the length is
      130 cm in every run and the median depth is 50 cm. A tank of 130 x 50 x 50 cm holds 325 L, so
      the volume follows these dimensions. For one male with three females the sources give 189 to
      190 L (Malawi Mayhem), 250 L (Ciklider.se), 300 L (Wet Spot), 350 L at 130 cm (malawi.si) and
      500 L for one male with three to five females (Aquahaus Gaus); AquaInfo asks for at least 150
      cm of length for a harem. The decided tank lies between the 300 L and 350 L figures and below
      the largest recommendations."

  husbandry:
    text: "Keep one male with three to five females in a tank at least 130 cm long. A tank of 130 x 50 x
      50 cm, about 325 litres, suits such a group; sources range from 250 to 500 litres. Use fine
      sand, because the fish sift it for food, and build rock piles with caves at the sides so that
      females can retreat and the male can court, leaving open water in front. Care sheets recommend
      about 23 to 28 C and pH 7.4 to 8.5. The fish copes with hardness from soft lake water up to
      about 23 dGH, and a carbonate hardness of about 4 to 15 dKH keeps the pH stable. Steady
      conditions, strong filtration and regular partial water changes suit the fish. Sturdy plants
      such as Anubias survive if they are secured."

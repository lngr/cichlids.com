  compatibility:
    text: "Good partners are peaceful Lake Malawi haplochromines and peacocks such as Aulonocara and
      Mylochromis, utaka such as Copadichromis borleyi, and gentle mbuna such as Labidochromis
      caeruleus in a roomy tank. Avoid robust zebra mbuna and Melanochromis, which harass the fish,
      and avoid species that need soft, acidic water. Other Otopharynx species are poor choices
      because the males treat them as rivals and hobby sources warn that members of the genus may
      cross. This warning is general and no cross of O. heterodon is documented. Adults of any
      species may eat fry of their tankmates."

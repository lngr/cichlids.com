    tolerance:
      value:
        min: 21
        max: 30
      confidence: low
      rationale: "The tally decides 21 to 30 C unanimously (4 of 4 votes) with low confidence. The
        proposals were 20 to 30 (generator, checker-b) and 21 to 29 (checker-a, checker-c); the
        median of the minima rounds to 21 and the median of the maxima is 30. Care sources for the
        species recommend 23 to 27 C (FishBase, Ciklider.se), 23 to 28 C (FishFish), 24 to 27 C (Wet
        Spot) and 24 to 26 C (Aquahaus Gaus), and congener sheets for O. lithobates give 24 to 27 C
        and 25 C. The decided range is wider than every care recommendation because it contains the
        natural lake range of 21 to 29 C; the upper degree beyond the lake maximum rests on the
        general practice of keeping Malawi haplochromines in heated tanks and on no species report,
        hence the low confidence. The extremes describe short phases, not a permanent setting."

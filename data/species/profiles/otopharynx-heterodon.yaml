  temperatureC:
    value:
      min: 21
      max: 29
    confidence: high
    rationale: "Lake Malawi endemic, so the natural range is the lake range of 21 to 29 C, decided by
      the water body. Eccles (1974) reports about 27 C in the upper 60 m in May and 21 C in cool
      inshore water of the windy season, Vollmer et al. (2005) give 23.5 to about 28 C for the
      epilimnion from winter to summer, Branchu et al. (2010) measured 22.8 to 25.4 C from 240 m to
      the surface in the north basin, and the FAO source book gives 23 to 25 C at the surface. The
      FishBase range of 23 to 27 C is an aquarium recommendation inside the lake range and belongs
      to the tolerance."

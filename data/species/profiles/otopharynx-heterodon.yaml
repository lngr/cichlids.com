  problems:
    text: "Typical mistakes are housing the fish with aggressive mbuna, offering coarse gravel that
      prevents sifting, and keeping several males in a small tank. Poor water quality and unstable
      conditions stress Malawi haplochromines and make disease more likely, so regular water changes
      matter. Rich or fatty foods can cause digestive trouble, although no special bloat sensitivity
      is reported for this species. A brooding female stops eating and needs calm surroundings.
      Wild-caught fish can carry parasites, and the species is sold under names that resemble those
      of undescribed look-alikes, so check the label before buying."

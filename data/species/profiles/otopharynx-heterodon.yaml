partners:
  suitable:
    - species: Aulonocara stuartgranti
      reason: Peacocks are peaceful sand-zone fish of a similar size and share the water values.
      condition: Tank of at least 130 cm with open sand.
    - species: Mylochromis
      reason: Calm Malawi haplochromines named by AquaInfo as good partners.
      condition: Choose species of a similar size.
    - species: Copadichromis borleyi
      reason: Peaceful mid-water utaka that does not compete for the sand floor.
      condition: Keep the group large enough to spread male rivalry.
    - species: Labidochromis caeruleus
      reason: "One of the gentler mbuna, so it does not suppress the colour of the males."
      condition: Tank of at least 150 cm with plenty of rock.
  unsuitable:
    - species: Maylandia zebra
      reason: "Zebra mbuna are hasty, territorial and harass calm haps, which suppresses male colour and
        takes food."
    - species: Melanochromis auratus
      reason: "A very aggressive mbuna that bullies slow, peaceful tankmates."
    - species: Otopharynx tetrastigma
      reason: "A close relative with similar looks; the males are rivals, and hobby sources warn that
        species of the genus may cross."
    - species: Symphysodon aequifasciatus
      reason: "Discus need soft, acidic water and warmer conditions than the alkaline water of this
        species."
profile:
  overview:
    text: "Otopharynx heterodon is a haplochromine cichlid of Lake Malawi that Ethelwynn Trewavas
      described from Monkey Bay as Haplochromis heterodon. Hobbyists call it the royal blue hap.
      Adult males are metallic blue shading into yellow, while females and young fish are silvery
      with big dark flank spots. It belongs to the sand and rock community of non-mbuna fish and is
      calm compared with most Malawi cichlids. Dealers offer wild-caught and captive-bred fish. The
      large-spotted Tanzanian fish traded as Otopharynx sp. 'big spot Tanzania' is a related but
      separate form, and some dealers sell it under the name of this species. Several undescribed
      look-alikes carry the name heterodon with a locality tag. They are separate forms and are not
      covered by this profile."
    sources:
      - kind: catalog-of-fishes
        title: "Eschmeyer's Catalog of Fishes, species of the genus Otopharynx (entry Haplochromis
          heterodon)"

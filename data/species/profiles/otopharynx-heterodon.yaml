      rubric describes the adult male, which malawi.si, Ciklider.se, AquaInfo and FishFish show as
      light metallic blue shading into yellow towards the belly, with a dark stripe through the eye,
      darker vertical bands and up to three dark flank spots. The silver colour belongs to females
      and juveniles and is left out. Bars and spots together give the pattern mixed."

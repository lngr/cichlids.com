  sizeAndGrowth:
    text: "Males reach about 15 cm in the aquarium and females about 12 cm. FishBase gives 12.8 cm total
      length as the largest recorded size, one site puts wild males near 13 cm and another reports
      males of up to 17 cm. Plan for 15 cm males and slightly smaller females. Juveniles look plain
      and the colour of males develops with maturity. With good care the fish lives about 7 to 9
      years according to a species article."
    sources:

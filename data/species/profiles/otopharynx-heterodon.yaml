  sexing:
    text: "Adult males are light metallic blue shading into yellow, with dark bars, a black stripe
      through the eye and large dark spots on the flank. Females and juveniles are silvery or sandy
      with three large black spots, among them a big rectangular one above the pectoral fin. Males
      grow larger than females by about 3 cm. Young fish are hard to sex and are often sold unsexed,
      so a group of six to eight juveniles is the usual way to obtain both sexes."
    sources:

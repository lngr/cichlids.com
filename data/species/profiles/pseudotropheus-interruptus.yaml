  husbandry:
    text: "For one male with three females, use at least 275 litres with a length of 120 cm and depth of 45 cm.\
      \ The footprint is a practical synthesis of care recommendations rather than a measured biological threshold.\
      \ Secure rocks against digging and arrange multiple retreats with interrupted sightlines. Add further space\
      \ for a mixed community; Malawi-Guru recommends 450 litres and 150 cm for that situation. Stable water, aeration,\
      \ effective filtration and regular partial changes support the group. The provisional tolerance envelopes\
      \ are 21 to 30 C, pH 7.5 to 8.8, GH 3 to 15 dGH and KH 5 to 14 dKH; their endpoints are not preferred operating\
      \ targets."
    sources:
    - kind: database

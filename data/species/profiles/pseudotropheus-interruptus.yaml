      rationale: "The settled median decision is 3 to 15 dGH with low confidence because six votes do not produce\
        \ a qualified majority. Generator and tiebreaker-1 proposed 3 to 18; checker-a and tiebreaker-2 proposed\
        \ 3 to 15; checker-b and checker-c proposed 3 to 12. All minima are 3 and the median maximum is 15. Malawi.si\
        \ independently recommends 3 to 15 for Malawi aquaria. Wider evidence remains visible: OATA and Acuario\
        \ Adictos give 12 to 18, Fischlexikon 5 to 20 with 5 to 12 preferred, De Coulon 14 to 22, and Seriously\
        \ Fish 10 to 25 for related johannii only. Those are care recommendations rather than controlled interruptus\
        \ tolerance studies. The Atlas ceiling of 214 ppm is about 12 dGH only if interpreted as CaCO3 equivalent;\
        \ it provides no lower limit. The selected median is a practical synthesis and does not establish harm above\
        \ 15."

  problems:
    text: "Persistent hiding, damaged fins, missed meals or declining condition can indicate that an individual\
      \ cannot escape social pressure. Review the group and the available retreats when those signs develop. Protein-heavy\
      \ feeding and overfeeding are poor matches for this grazer, although swelling alone does not diagnose the\
      \ illness hobbyists call Malawi bloat. Water quality and oxygen supply also matter in a busy rocky aquarium.\
      \ Maintain a regular testing and maintenance routine and investigate sustained changes in appetite or breathing.\
      \ The water tolerances are low-confidence syntheses of keeping advice, so stable conditions near ordinary\
      \ recommendations are preferable to deliberately testing their extremes."
    sources:
    - kind: database
      title: "Malawi-Guru: Pseudotropheus interruptus species account"
      url: "https://malawi-guru.de/pseudotropheus-interruptus-mbuna-datenbank/"
      accessed: '2026-10-13'
      archived: malawi-guru.de/pseudotropheus-interruptus-mbuna-datenbank/2026-10-14T215231Z

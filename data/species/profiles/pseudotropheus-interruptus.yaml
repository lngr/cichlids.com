      \ cm; checker-c 300 L, 120 by 50 cm. Component medians are 275 L, 120 cm length and 42.5 cm depth. Retain\
      \ 275 L and 120 cm for one male with three females; round depth to 45 cm for a practical rockwork footprint.\
      \ Malawi.si recommends 250 L and Malawi-Guru 300 L at 120 cm, while De Coulon independently gives 120 cm.\

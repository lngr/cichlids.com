      archived: malawi.si/malawibylocations/chiwi_rocks/slides/pseudotropheus_interruptus__chiwi_rocks_.html/2026-10-14T215223Z
  sexing:
    text: "Mature males usually become dark blue to almost black, with pale blue spots arranged along the flank.\
      \ Females and young fish are typically yellow or yellow-orange. Horizontal rows can appear as broken stripes,\
      \ explaining conflicting descriptions of the pattern. Juvenile colour and shop labels alone are poor guarantees\
      \ of sex or species, and De Coulon notes that older females may develop some male-like markings. Confirm the\
      \ identity of stock before interpreting colour changes as evidence of sex. The colour feature intentionally\
      \ describes adult males and therefore excludes the yellow of females and juveniles."
    sources:

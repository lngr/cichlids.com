  sizeAndGrowth:
    text: "Typical adult aquarium planning values are about 10 cm for males and 9 cm for females. The female estimate\
      \ is less secure. Wild-size accounts are smaller, while Malawi.si notes aquarium fish above 10 cm in both\
      \ sexes and Abysse gives an unsexed 12 cm adult figure. Those reports explain why body size should be treated\
      \ as an expectation rather than a strict cap. Around 5 to 8 years is a provisional lifespan estimate, supported\
      \ only by care-sheet figures and broader mbuna experience. Avoid excessive feeding to force growth; adult\
      \ territorial space remains necessary even for small fish."
    sources:
    - kind: database

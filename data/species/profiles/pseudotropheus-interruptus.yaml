    rationale: "The tally retains 5 to 8 dKH without a verification object for this natural feature. Historical\
      \ alkalinity compiled by FAO converts to about 5.6 to 7.3 dKH and Branchu measurements to about 6.5 to 6.9\
      \ dKH. These studies support the rounded lake envelope. Alkalinity and calcium-magnesium hardness vary independently,\
      \ so KH is not calculated from GH."

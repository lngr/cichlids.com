      \ not a measured minimum. The inherited Atlas reference to 284 L and 122 by 46 cm is kept, although its readable\
      \ prose supplies only a length near 119 cm. A mixed mbuna community needs extra space; Malawi-Guru recommends\
      \ 450 L and 150 cm for that use."

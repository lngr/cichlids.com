  compatibility:
    text: "Consider other robust mbuna with a comparable grazing diet and distinct appearance, in a larger aquarium\
      \ with separate retreats. The partner examples are planning candidates rather than verified guarantees of\
      \ coexistence. Slower or less assertive fish can lose access to food or shelter, and meat-dependent companions\
      \ make the feeding plan difficult. Similar blue and black striped species, especially johannii and cyaneorhabdos,\
      \ add both rival recognition and presumed crossing concerns. The melanochromis group remains presumed: broad\
      \ hobby warnings and close relationship support caution, while no reviewed record establishes an interruptus\
      \ cross with each member. Keep that evidence limit separate from the clear need to manage territorial aggression."

partners:
  suitable:
  - species: Labidochromis caeruleus
    reason: A possible Malawi mbuna companion with a broadly compatible plant-rich feeding plan.
    condition: Inferred candidate only; use a larger mixed tank with separate retreats and monitor harassment of
      the less assertive fish.
  - species: Iodotropheus sprengerae
    reason: Different adult appearance and a broadly compatible grazing diet make this a possible candidate.
    condition: Inferred candidate only; provide additional space and shelter and monitor the less assertive group.
  - species: Cynotilapia zebroides
    reason: A possible robust rocky-habitat companion with a different principal male pattern.
    condition: Inferred candidate only; allow independent territories in a larger community and retain a plant-rich
      shared staple.
  unsuitable:
  - species: Pseudotropheus johannii
    reason: Similar male patterning can provoke rivalry; the shared melanochromis group adds presumed crossing risk
      without a verified named-pair report.
  - species: Pseudotropheus cyaneorhabdos
    reason: Similar striped adults belong to the same presumed crossing group and may be mistaken for rivals or
      breeding partners.
  - species: Maylandia lombardoi
    reason: Its substantial territorial aggression can overwhelm the planned interruptus harem; this is a behavioral
      planning inference.
  - species: Aulonocara stuartgranti
    reason: Differences in feeding needs and territorial behavior make this a poor match for an assertive grazing
      mbuna group.
profile:
  overview:
    text: "A group of Pseudotropheus interruptus combines yellow females with dark blue males whose pale flank markings\
      \ break into rows of spots. This Lake Malawi mbuna spends much of its time grazing rocky surfaces. Its small\
      \ adult size does not make it a quiet community fish: males defend space and can repeatedly chase rivals or\
      \ females. Plan around one male with three females, ample retreats and a plant-rich staple. Maternal mouthbrooding\
      \ is the reproductive mode. The fish remains sold under Melanochromis interruptus, its original scientific\
      \ combination, and can be confused with related striped mbuna."
    sources:
    - kind: database
      title: "Cichlid Room Companion: Pseudotropheus interruptus"
      url: "https://cichlidae.com/species.php?id=Z-0gdzpkUxHrCDnXJw83cg"

      accessed: '2026-10-15'
      archived: decoulon.ch/bourse/kiosk/fiches/pseudotroph_interruptus.html/2026-10-14T215922Z
  diet:
    text: "Feed chiefly for an algae-grazing mbuna. Algae, diatoms and the associated biofilm form the natural staple,\
      \ with small invertebrates swallowed alongside the growth on rocks. In the aquarium, use suitable plant-rich\
      \ prepared food in measured portions. Occasional small invertebrate foods can provide variety, but a rich\
      \ animal-based staple conflicts with the adopted feeding category. The bloat-sensitive flag records a husbandry\
      \ precaution about excessive protein, not proof from a clinical study of this species. Leftover food also\
      \ burdens water quality, so observe how much the fish actually consume."
    sources:
    - kind: database

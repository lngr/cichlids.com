  hybridGroups:
    value:
    - melanochromis
    confidence: low
    rationale: "The qualified-majority tally retains melanochromis with four of six votes and low confidence. Generator\
      \ and checker-b proposed no group; checker-a, checker-c, tiebreaker-1 and tiebreaker-2 proposed melanochromis.\
      \ The empty proposals emphasize the absence of a named interruptus cross. Malawi.si describes close relatives\
      \ including johannii and cyaneorhabdos; Seriously Fish and Tropical Fish Hobbyist give broad warnings for\
      \ the historical Melanochromis grouping, and Fishkeeper explicitly places interruptus in that historical set.\
      \ This supports a presumed extension of the existing group, not documented crosses with each member. Archive\
      \ discussions concern identification and trade confusion rather than parentage. The revision and CRC provide\
      \ taxonomic or ecological context, not a crossing experiment; claims that the public CRC page itself names\
      \ the close-relative set could not be confirmed."

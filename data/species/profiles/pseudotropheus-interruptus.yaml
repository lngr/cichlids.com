  habitat:
    text: "Lake Malawi is its only native lake. Records include Chizumulu, nearby rocky sites and the type locality\
      \ off Likoma; Malawi.si distinguishes later introductions at Nkhata Bay and Thumbi West. FishBase places it\
      \ among large stones and slabs at depths of 5 to 12 m. The adopted natural lake envelope is 21 to 29 C, pH\
      \ 7.7 to 8.6, GH 3 to 5 dGH and KH 5 to 8 dKH. Limnological studies show why alkaline water need not have\
      \ high calcium and magnesium hardness. These broad seasonal lake ranges do not describe every reef at every\
      \ moment."

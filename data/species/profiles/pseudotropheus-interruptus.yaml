  breeding:
    text: The female incubates the clutch in her mouth after spawning among the rocks. Malawi.si reports roughly
      10 to 30 eggs and about 20 days of brooding; these are reported observations rather than promises for every
      female or temperature. A holding female may take little food and needs shelter from continued male attention.
      The male does not maintain a lasting pair bond. Breeding stock should have a secure identity because similar
      striped mbuna can be confused in shops. The listed crossing group reflects presumed risk from close relationships
      and general warnings; a named interruptus cross has not been verified in the reviewed material.
    sources:
    - kind: database
      title: "Cichlid Room Companion: Pseudotropheus interruptus"
      url: "https://cichlidae.com/species.php?id=Z-0gdzpkUxHrCDnXJw83cg"

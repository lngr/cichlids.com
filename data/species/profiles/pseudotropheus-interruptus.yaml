      \ give 12 to 18, Fischlexikon 5 to 20 with 5 to 12 preferred, De Coulon 14 to 22, and Seriously Fish 10 to\
      \ 25 for related johannii only. Those are care recommendations rather than controlled interruptus tolerance\
      \ studies. The Atlas ceiling of 214 ppm is about 12 dGH only if interpreted as CaCO3 equivalent; it provides\
      \ no lower limit. The selected median is a practical synthesis and does not establish harm above 15."

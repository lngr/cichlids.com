    rationale: "Generator and checker-c select blue-black males with stripes; checker-b selects blue-black with\
      \ spots; checker-a adds yellow and selects mixed. The rubric records adult males, so female and juvenile yellow\
      \ is excluded. Malawi.si describes pale blue spots in horizontal rows on a dark breeding male, and De Coulon\
      \ describes the same dotted rows. Spots is the closest literal pattern, while the stripe proposals capture\
      \ their horizontal arrangement. Archive descriptions of broken lines and checkerboard markings are retained\
      \ as variation and identification uncertainty."

      accessed: '2026-10-13'
      archived: ornamentalfish.org/what-we-do/advice-information/care-sheets/caresheets-tropical-freshwater-fish/how-to-look-after-african-malawi-cichlids/2026-10-14T094603Z
  socialBehavior:
    text: "Use a harem of one male and three females as the normal adult unit. Males maintain small rocky territories\
      \ beyond spawning, with stronger chasing during courtship. Females need routes to withdraw without being trapped\
      \ in a single visible refuge. Some keepers use five to seven females, while specialist species guidance also\
      \ supports two or three; the larger ratio is not an established requirement. More than one male calls for\
      \ additional independent rocky areas and more room. Compatible other mbuna are possible, but the species is\
      \ neither a schooling fish nor a permanently bonded pair."
    sources:

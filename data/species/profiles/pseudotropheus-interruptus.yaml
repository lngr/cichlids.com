  temperatureC:
    value:
      min: 21
      max: 29
    confidence: high
    rationale: "The settled tally retains the natural Lake Malawi envelope of 21 to 29 C with waterbody verification.\
      \ Branchu measured 22.8 to 25.4 C in one northern-basin profile; FAO compiles 23 to 25 C surface readings,\
      \ Vollmer describes seasonal cooling and summer water near 28 C, and Ngochera and Bootsma report surface temperatures\
      \ reaching 29 C. These individual surveys do not replace the broader seasonal lake envelope. Eccles is retained\
      \ as the historical cold-season reference, but its DOI page is blocked and fetch-oa reports no open access,\
      \ so no newly read full-text measurement is claimed."

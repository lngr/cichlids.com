  maxSizeCm:
    value:
      male: 25
      female: 19
    confidence: medium
    rationale: "The proposals for males were 25 cm (generator, checker-a, checker-b) and 28 cm (checker-c), with\
      \ a median of 25 cm. AquaInfo cites wild fish to about 20 cm and aquarium reports up to 30 cm, FishBase gives\
      \ 30 cm total length, Fishipedia an average of 20 and a maximum of 25 cm, and keeper threads report males\
      \ of 28 to 30 cm after several years; the Cichlid-Forum entry gives 33 cm and a dealer 14 inches (36 cm),\
      \ both above what other sources report. A typical well kept male of 25 cm sits inside these values; 30 cm\
      \ and more are record sizes. No source measures females, which all describe as clearly smaller; the proposals\
      \ of 18 (generator, checker-a) and 20 cm (checker-b, checker-c) give a median of 19 cm, an estimate. Wild\
      \ adults of a Morelos laboratory study measured only 10 to 12 cm."

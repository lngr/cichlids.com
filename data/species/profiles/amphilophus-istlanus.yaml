  habitat:
    text: "The species inhabits flowing rivers and streams of the Pacific drainage of southern-central Mexico, from\
      \ the Armería and Coahuayana systems through the Balsas basin to Guerrero and east to Puebla. Typical sites\
      \ on the Amacuzac lie at about 770 to 960 m and have gravel, stones and rock with riffles, runs and pools;\
      \ aquatic plants are scarce. The water is warm and alkaline: site means of 21 to 28.5 C and pH 7.8 to 8.8\
      \ in the Amacuzac, and 27 to 31 C with pH 7.5 to 8.5 in the neighbouring Nexpa basin. It is also very hard\
      \ and rich in calcium sulphate and bicarbonate, with an average total hardness of about 31 dGH and a carbonate\
      \ hardness of about 13 dKH. The lower Amacuzac carries exceptional gypsum water with site means up to about\
      \ 78 dGH and single readings above 90 dGH, and a reading of 65 dGH was taken at Tehuixtla; such values lie\
      \ far outside aquarium practice. A different habitat is the Las Estacas spring system in Morelos, which stays\
      \ at 22 to 24 C and pH close to 7 and has dense beds of Vallisneria and Cabomba. Summer rains raise the rivers\
      \ sharply and scour the bed, so breeding takes place in the dry season."
    sources:

  ghDgh:
    value:
      min: 6
      max: 33
    confidence: low
    rationale: "The votes formed two camps and no qualified majority (generator 6 to 16, checker-a 6 to 15, checker-b\
      \ 9 to 35, checker-c 5 to 30, tiebreaker-1 8 to 36, tiebreaker-2 6 to 35), so the tally took the median of\
      \ all minima and all maxima, 6 to 33 dGH, with low confidence. The median follows the larger camp, which rests\
      \ on direct measurements: total hardness in the Amacuzac averages 546 mg/L as calcium carbonate (31 dGH),\
      \ the upstream site Dos Bocas averages 163 mg/L (9 dGH), the monthly means run from 22 to 36 dGH, and wild\
      \ fish were collected in water of 150 mg/L (8.4 dGH). The softer camp relied on calcium in the Nexpa waters\
      \ (about 2.5 to 21 dGH), the Alto Balsas basins (2.1 to 31 dGH) and the Ayuquila (mostly 4.7 to 19 dGH). FishBase\
      \ and AquaInfo give 3 to 5 dGH from an aquarium atlas, which contradicts the field data, and Fishipedia 10\
      \ to 25 dGH. The wider source range reaches from about 2 dGH in mountain headwaters to 65 dGH at Tehuixtla\
      \ and site means of up to 78 dGH (single readings 93 dGH) in the gypsum rich lower Amacuzac; the profile habitat\
      \ describes these exceptional reaches."

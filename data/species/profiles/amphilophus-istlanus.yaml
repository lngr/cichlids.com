  suitable:
    - species: Rocio octofasciata
      reason: "The Jack Dempsey is a robust Central American cichlid of similar size, which a dealer names as a\
        \ tankmate."
      condition: Tank of 240 cm or more with several separate rock structures.
    - species: Herichthys cyanoguttatus
      reason: "The Texas cichlid is a sturdy Mexican cichlid of comparable size and temper, named as a tankmate\
        \ by a dealer."
      condition: Tank of 240 cm or more; both species claim territories.
    - species: Pterygoplichthys pardalis
      reason: "This armoured catfish lives beside the species in the Amacuzac, and its armour and size protect it\
        \ from bites."
      condition: Adult catfish of 25 cm or more with hiding places away from the nest site.
  unsuitable:
    - species: Amatitlania nigrofasciata
      reason: "The convict cichlid competes for shelter and nest sites, and in the Amacuzac it drives the native\
        \ fish into hiding and costs it feeding time."
    - species: Xiphophorus hellerii
      reason: "A keeper reports swordtails hunted and killed, and a fish of 25 cm swallows tankmates of this size."
    - species: Symphysodon aequifasciatus
      reason: "Discus are slow, timid feeders of soft acidic water and would be bullied by this territorial cichlid."
    - species: Amphilophus trimaculatus
      reason: "A large, territorial relative of similar build; the aquarium literature reports crosses of the two\
        \ species."
    - species: Amphilophus citrinellus
      reason: "Another large, territorial Amphilophus is a rival of similar shape and shares the presumed crossing\
        \ group of the genus."
profile:
  overview:
    text: "Amphilophus istlanus is a large cichlid of the Mexican Pacific slope and the only native cichlid of the\
      \ Río Balsas basin. Hobbyists know it under the old name Cichlasoma istlanum and as the Red Side Cichlid;\
      \ a Mexican author called it the living diamond of the Balsas. Breeding adults are yellowish with dark bars\
      \ on the back, a chequered belly of blue scales edged in red, and red and blue lines in the fins. It is a\
      \ territorial open substrate spawner that needs a long tank with stones and sand and is aggressive towards\
      \ its own kind and other fish. The species is rare in the trade, and keepers report difficult pairing and\
      \ intestinal disease in old aquarium lines, so it suits experienced keepers of large cichlids. In its rivers,\
      \ pollution and introduced fishes such as convict cichlids, tilapia and sailfin catfish put it under pressure."
    sources:
      - kind: catalog-of-fishes

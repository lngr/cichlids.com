  - name: Red
    kind: color-morph
    note: keepers and dealers separate a red and a green morph
features:
  origin:
    value:
      continent: North America
      region: "Pacific slope of southern-central Mexico: Río Balsas basin and neighbouring Pacific drainages from\
        \ Colima to Guerrero and Puebla"
      waterbody: null
      localities:
        - "Río Ixtla at Puente de Ixtla, Morelos (type locality)"
        - "Río Amacuzac, Morelos"
        - "Río Yautepec and the Las Estacas spring system (El Borbollón), Morelos"
        - "Sierra de Huautla streams, Morelos"
        - "Río Huámito near La Huacana, Michoacán"
        - "Río Cutzamala, Michoacán"
        - "Lower Río Balsas and Río Tepalcatepec, Michoacán and Guerrero"
        - "Río del Oro, Balsas tributary"
        - "Tlapa, Guerrero"
        - "Río Ayuquila-Armería, Jalisco and Colima"
        - Río Coahuayana drainage (Río Terrero)
        - "Río Papagayo, Guerrero (eastern limit)"
    confidence: high
    rationale: "The Catalog of Fishes describes an endemic of the Mexican Pacific slope from Colima south to Guerrero\
      \ and east to Puebla, with the type locality in the Balsas basin, and FishBase and the Cichlid Room Companion\
      \ agree. Field surveys confirm populations in the Amacuzac, Yautepec, Cutzamala, Sierra de Huautla, lower\
      \ Balsas and Ayuquila-Armería systems and in the Las Estacas spring of Morelos; the Cichlid Room Companion\
      \ shows a male from the Coahuayana drainage, and AquaInfo places the eastern limit at the Río Papagayo, where\
      \ A. trimaculatus takes over. Within the Balsas basin it is the only native cichlid. Generator, checker-a\
      \ and checker-b chose the continent North America after the Catalog wording (southern North America); checker-c\
      \ chose Central America after FishBase and hobby usage. The taxonomic authority decides, so the value is North\
      \ America. Generator placed the El Borbollón spring in Puebla, but it belongs to the Las Estacas system of\
      \ Morelos as checker-b lists it. No lake of the waterbody table applies."

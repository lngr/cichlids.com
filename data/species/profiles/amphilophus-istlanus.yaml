  problems:
    text: "Intestinal disease is the best known health problem, mainly in old aquarium lines: young fish of a few\
      \ months can die in numbers and adults remain prone. Breeders connect it with stress, crowding, cool water\
      \ and live foods such as mosquito larvae and tubifex. Wild fish from the Río del Oro are reported to be hardier\
      \ than long bred stock. The second main cause of losses is fighting, because a pair that seems settled can\
      \ turn on each other without warning; a divider at hand protects the female. Clean water, warm temperatures,\
      \ insect based foods from reliable sources and quarantine of new fish reduce the risks."
    sources:

  aggressionConspecific:
    value: 4
    confidence: medium
    rationale: "Generator, checker-a and checker-c chose level 4, checker-b level 3. Keepers report sudden deaths\
      \ among adults without visible build up, one account describes a single fish that removed its tankmates one\
      \ by one, another reports males killing females after spawning, and the Cichlid-Forum entry advises a divider\
      \ even in a tank of 180 cm to protect the female. Staged contests show that males escalate quickly to biting.\
      \ Juveniles live peacefully in groups, but mature fish match the rubric description of level 4: partners and\
      \ rivals are killed or badly injured without a large tank, separation or experience. Level 3 remains possible\
      \ for a well matched pair in a very large tank, so confidence is medium."
    sources:
      - kind: literature
        title: "Aggressiveness overcomes body-size effects in contests between native and invasive cichlid fishes\

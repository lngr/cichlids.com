  socialBehavior:
    text: "Young fish forage in small groups and get along, but mature fish become strongly territorial. In staged\
      \ contests males escalated to biting and the larger native male always won. Keepers report sudden deaths among\
      \ adults without warning signs and females killed by their mates after spawning, so many introduce a pair\
      \ through a divider. Adults form monogamous pairs. Towards other species the fish defends a wide area; it\
      \ beat larger convict cichlids in laboratory contests, although in the river the pressure of invasive cichlids\
      \ makes it hide more and feed less. Tankmates must be large and robust. A tank of 180 cm suits one pair, while\
      \ a small group needs about 250 cm and many hiding places."
    sources:
      - kind: literature
        title: "Aggressiveness overcomes body-size effects in contests between native and invasive cichlid fishes\
          \ (Ethology, 2024)"

  sizeAndGrowth:
    text: "Wild adults stay at about 20 cm, while well kept aquarium males reach about 25 cm; FishBase and aquarium\
      \ reports mention 30 cm, which is exceptional. Females remain clearly smaller, at around 19 cm. Mature males\
      \ develop a pronounced nuchal hump, strongest in the presence of other males. Wild adults used in a laboratory\
      \ study in Morelos measured only 10 to 12 cm. Juveniles grow quickly on insect based food and prefer water\
      \ about two degrees warmer than adults."

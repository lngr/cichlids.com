  temperatureC:
    value:
      min: 21
      max: 30
    confidence: medium
    rationale: "Five of six votes agree within one degree (checker-a 22 to 30, checker-b 21 to 29, checker-c 20\
      \ to 30, tiebreaker-1 and tiebreaker-2 21 to 30), a qualified majority; the decided range is the median of\
      \ these bounds. The generator proposed 24 to 30. A year round survey of seven Amacuzac sites gives site means\
      \ of 21.0 to 28.5 C and monthly means of 21.4 to 28.6 C. The Las Estacas spring, where the species is native,\
      \ stays at 22 to 23.7 C, waters of the Nexpa and Sierra de Huautla area measured 27 to 31 C, wild fish were\
      \ collected at about 28 C, and the Ayuquila (upper Armería) has seasonal means of 19.6 to 23.6 C with dry\
      \ season peaks near 29 C. FishBase gives 24 to 28 C from aquarium literature. The decided range is narrower\
      \ than the single readings of the Amacuzac survey, 16.8 to 34.1 C on cold winter mornings and at shallow sun\
      \ heated sites, and than the Alto Balsas survey (11 to 28.2 C), whose cold values come from mountain streams\
      \ above the range of the species."

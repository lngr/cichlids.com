  breeding:
    text: "The species spawns on open substrate. In the wild a pair chooses a calm stretch of river, cleans the\
      \ base of an overhanging stone and digs a pit there; the female lays about 500 small eggs, which the male\
      \ fertilises. She guards the clutch while he patrols nearby and occasionally takes over. Depending on temperature\
      \ the eggs hatch in two to four days, the larvae are moved into pits, and the fry swim free about five days\
      \ later, guided by both parents. Wild fish breed in the dry season, since summer floods destroy broods; in\
      \ aquaculture trials females spawned more than 1000 eggs every few weeks. Females prefer dominant males in\
      \ experiments, and pair aggression makes a divider and plenty of cover useful."
    sources:

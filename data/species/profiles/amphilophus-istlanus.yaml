schemaVersion: 1
id: amphilophus-istlanus
legacyIds:
  - 694
status: described
taxonomy:
  validName: Amphilophus istlanus
  genus: Amphilophus
  species: istlanus
  author: "(Jordan & Snyder, 1899)"
  synonyms:
    - name: Heros istlanus
      note: "original combination of Jordan and Snyder 1899; type locality Río Ixtla at Puente de Ixtla, Balsas\
        \ basin, Morelos"
    - name: Cichlasoma istlanum
      note: "long used combination (Conkel 1993, Page et al. 2013), treated by Kullander 2003 as incertae sedis\
        \ in Cichlasoma; the legacy catalog name"
    - name: Cichlasoma istlana fusca
      note: "de Buen 1946, Río Huámito near La Huacana, Michoacán; the green form described as a subspecies, listed\
        \ in the legacy catalog as Cichlasoma fusca"
    - name: Cichlasoma leonhardschultzei
      note: "Ahl 1935, Tlapa, Guerrero; originally spelled leonhard-schultzei in the subgenus Parapetenia"
    - name: Heros mento
      note: "Vaillant and Pellegrin 1902, Río Negro, southern Mexico"
    - name: Nandopsis istlana
      note: earlier genus placement (Burgess 2000)
    - name: Parapetenia istlana
      note: earlier genus placement (Hernández-Rolón 1990)
  legacyNames:
    - Cichlasoma istlanum
  note: "The Catalog of Fishes treats Amphilophus istlanus as valid, following Říčan et al. 2016, Page et al. 2023\
    \ and Fricke et al. 2024, and lists Heros mento, Cichlasoma istlana fusca and Cichlasoma leonhardschultzei as\
    \ synonyms. The species list of the legacy genus Cichlasoma holds no own record for it, since the Catalog files\
    \ the name under Amphilophus. FishBase and the Cichlid Room Companion use the same valid name, while much hobby\
    \ literature and the cichlids.com archive use Cichlasoma istlanum. A secondary summary of Říčan et al. 2016\
    \ links the species to a possible ancient hybrid origin; the name is valid either way."

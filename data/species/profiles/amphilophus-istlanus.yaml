      \ and tiebreaker-2 7 to 23, checker-c 6 to 20), so the tally took the median of all minima and all maxima,\
      \ 7 to 22 dKH, with low confidence. Alkalinity in the Amacuzac has site means of 134 to 410 mg/L as calcium\

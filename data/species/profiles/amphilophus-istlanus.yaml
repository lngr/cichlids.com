  sexing:
    text: "Mature males are larger, grow a clear nuchal hump and show more blue on the lower body. Females stay\
      \ smaller and look more contrasting, with red dominating below. Researchers sex live fish by the shape of\
      \ the genital papilla. Juveniles are hard to tell apart, so keepers raise a group of young fish to obtain\
      \ a pair and move the others before they mature."
    sources:

  aggressionHeterospecific:
    value: 3
    confidence: medium
    rationale: "All four agents chose level 3. In staged contests wild fish beat larger invasive convict cichlids\
      \ by biting more often, a dealer warns against timid or less robust tankmates, Fishipedia reports fierce fights\
      \ with other territorial species, and a keeper kept a male with larger cichlids in a tank of about 180 cm.\
      \ AquaInfo calls mixing with other large cichlids possible, though unnatural. The species attacks beyond its\
      \ own area, so tankmates need comparable size and robustness. In the Amacuzac, pressure from invasive cichlids\
      \ makes the native fish hide longer and feed less, which shows that it does not dominate every larger fish."
    sources:

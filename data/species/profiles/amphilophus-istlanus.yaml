    verification:
      method: qualified-majority
      votes:
        agree: 5
        total: 6
    tolerance:
      value:
        min: 20
        max: 32
      confidence: medium
      rationale: "All four votes agree within one degree (generator 21 to 32, checker-a and checker-b 20 to 32,\
        \ checker-c 20 to 31), so the tolerance is unanimous at 20 to 32 C. Care sheets give 21 to 28 C (Imperial\
        \ Tropicals), 23 to 27 C (Cichlid-Forum) and 24 to 28 C (Fishipedia, FishBase); AquaInfo gives 24 to 32\
        \ C and argues that the species is usually kept too cold. In a thermal gradient adults chose 29 to 33 C\
        \ with a growth optimum near 29.5 C, and a research group holds wild fish at 27 C for weeks. Avoidance in\
        \ the gradient began below 17.5 C and above 37.3 C; these are short term limits and stay outside the long\
        \ term range. The rivers cool to about 17 to 21 C in winter, which supports the lower end."

    rationale: "Four of six votes (checker-a, checker-b, checker-c, tiebreaker-2) chose the genus group amphilophus\
      \ plus the pair amphilophus-istlanus-trimaculatus, a qualified majority. The genus group lists every valid\
      \ Amphilophus on a presumed basis, after a breeder warning that A. lyonsi may cross with congeners, and the\
      \ Catalog of Fishes places A. istlanus in that genus. The pair rests on AquaInfo, which states that the aquarium\
      \ literature reports hybrids of A. istlanus and A. trimaculatus and advises against keeping them together;\
      \ no parents, offspring or free choice of partners are described, and the ranges of the two species meet at\
      \ most near the Río Papagayo, so the pair is presumed. The generator proposed the genus group alone. Tiebreaker-1\
      \ proposed a pair with Parachromis managuensis from labelled photographs in the Binns hybrid encyclopedia;\
      \ no other vote named it, so it is not part of the decision. The idea that A. istlanus itself arose from an\
      \ ancient cross of the A. trimaculatus and Mayaheros beani lineages, raised by a secondary summary of Říčan\
      \ et al. 2016, a dealer and a forum, concerns its ancestry and gives no tank cross. Confidence is low because\
      \ both groups rest on hobby statements without documented crosses."

  feedingSpeed:
    value: normal
    confidence: low
    rationale: "All four agents chose normal. No source states the pace of feeding. Wild fish forage in small groups\
      \ over sand, biting and sifting, and are most active early in the morning; keepers describe young fish as\
      \ shy until about 15 cm and report no rushing at food. A normal pace like that of other Central American river\
      \ cichlids of this size is inferred, with low confidence."

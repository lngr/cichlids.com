  compatibility:
    text: "Only large, robust fish hold their own with this cichlid. A dealer names Jack Dempseys and Texas cichlids\
      \ for large tanks, and armoured sailfin catfish share its river. Convict cichlids are poor company, since\
      \ they compete for shelter and nest sites. Small fish such as swordtails are hunted, and timid cichlids are\
      \ bullied. Other Amphilophus are rivals of similar shape and belong to a presumed crossing group of the genus,\
      \ and the aquarium literature reports crosses with the three-spot cichlid A. trimaculatus. A pair with tankmates\
      \ needs well over 180 cm and separate rock structures that break the line of sight."
    sources:

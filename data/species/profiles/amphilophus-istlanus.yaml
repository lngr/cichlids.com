  diet:
    text: "In the river the species is an insect specialist: mayfly nymphs, caddisfly larvae and blackfly larvae\
      \ make up most of its food, with snails, beetles, algae and the odd small fish as minor items. It feeds near\
      \ the bottom, taking mouthfuls of sand and sifting them. In the aquarium a varied carnivore menu of frozen\
      \ insect larvae and crustaceans and good sinking pellets works well, with live food only from clean sources.\
      \ Breeders avoid red mosquito larvae and tubifex, which they link to intestinal disease in old aquarium lines.\
      \ Several small meals a day and the removal of leftovers keep the water clean."
    sources:

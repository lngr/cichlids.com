      \ median of all minima and all maxima, 7.2 to 8.8, with low confidence. The proposals form two views: river\
      \ water of the Amacuzac with site means of 7.8 to 8.8 and an overall mean of 8.4, and the near neutral Las\
      \ Estacas spring (6.87 to 7.06) and a reading of 6.9 at Tehuixtla. Other rivers of the range fit the alkaline\
      \ view: Nexpa and Huautla waters 7.5 to 8.5, the Ayuquila-Armería basin 7.34 to 8.43, the Apatlaco seasonal\
      \ means 7.4 to 8.6, and wild fish were collected at 8.1. FishBase gives 8.0 as a lower limit from aquarium\
      \ literature. The median range covers the typical river values; the wider source range runs from 6.9 in the\
      \ spring and at Tehuixtla to single readings of 9.4 in the dry season at sites with soap inputs, and the Alto\
      \ Balsas survey reports isolated extremes of 4.0 and 9.1 at polluted sites."

  husbandry:
    text: "One adult pair needs a tank of at least 180 cm and about 500 litres, furnished with stones, flat rocks\
      \ and overhangs over sand or fine gravel and with shelter on both sides so that a harassed fish can withdraw.\
      \ Plants are optional. The natural water is 21 to 30 C, pH 7.2 to 8.8 and hard; in the aquarium the fish stays\
      \ healthy at about 20 to 32 C, pH 6.5 to 8.8, 3 to 35 dGH and 3 to 23 dKH. Breeders recommend the warm half\
      \ of that span, around 26 to 30 C, because cool water is linked to intestinal disease, and adults chose about\
      \ 30 C in a thermal gradient. Strong filtration and frequent water changes matter, since stress and crowding\
      \ also favour the disease."

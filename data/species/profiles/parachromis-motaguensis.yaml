  husbandry:
    text: "For an established adult pair, provide at least 720 litres and 200 cm length, with about 60 cm\
      \ front-to-back space. Volume and length follow the Nordic association; depth is an inferred\
      \ layout dimension. Use securely supported rocks and anchored timber to interrupt sight lines\
      \ while preserving a swimming route. Sand allows digging, and plants may be moved or damaged.\
      \ Provide strong biological filtration, removal of accumulated waste, oxygenation and regular\
      \ water changes matching the established conditions. Around 26 C is well supported for routine\
      \ maintenance. Published keeping envelopes are 20 to 30 C, pH 6 to 8.5, GH 4 to 20 dGH and a\
      \ particularly uncertain KH estimate of 3 to 15 dKH. Their endpoints are not all confirmed by\
      \ multi-year observations. The KH interval is the rounded median of six proposals; river\
      \ alkalinity and care-sheet recommendations support a provisional buffering envelope, and its\
      \ upper bound is not a demonstrated injury threshold. Fit a secure cover and have a rigid\
      \ divider and alternative accommodation ready before placing adults together."

  maxSizeCm:
    value:
      male: 30
      female: 26
    confidence: medium
    rationale: "All four agents proposed 30 cm males. Female proposals were generator 25 cm, checker-a 22 cm,\
      \ checker-b 26 cm and checker-c 26 cm, yielding a median of 25.5 cm. The final female value is 26 cm because\
      \ Beerlink's NVC account provides an explicit adult figure of about 26 cm, whereas 22 cm is an unsupported\
      \ estimate and 25 cm comes from retail advice. FishBase and Artigas Azas corroborate 30 cm total length\
      \ for males. Seriously Fish's 30.5 cm standard length is retained but is not silently equated with total\
      \ length. FishProfiles gives 30 cm for both sexes and the retailer gives a 35 cm male; these broader figures\
      \ do not outweigh the sex-specific adult account for typical aquarium planning. Kutty's 25 cm male and 15\
      \ cm female were growing individuals, not lifetime maxima."

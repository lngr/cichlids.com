    kind: locality
    note: Locality-labelled adult illustrated on the public CRC page; maintain source documentation for captive
      stock.
  - name: "Rio Copan, Honduras"
    kind: locality
    note: Locality photographs listed in the cichlid association register; not a separate taxon.

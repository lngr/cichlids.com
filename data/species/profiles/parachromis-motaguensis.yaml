  compatibility:
    text: "The speciesOnly flag is false because specialist accounts permit mixed keeping under restricted conditions.\
      \ For the recommended adult pair, dedicated accommodation remains the practical choice: an actively breeding\
      \ pair can injure much larger fish. Conditional companion examples concern one nonbreeding adult in a substantially\
      \ larger aquarium, with distinct retreats, comparable body sizes, monitoring and immediate removal capacity.\
      \ Association guidance calls for at least 300 cm length when additional fish are present. Small livebearers\
      \ and tetras are prey, and weaker cichlids can lose access to food and territory. The decided hybrid groups\
      \ concern dovii, tetracanthus, managuensis, urophthalmus and festae, each on presumed evidence without independently\
      \ verified free partner choice. A favorable general tankmate account does not remove a hybrid warning. Salvini\
      \ cross reports remain in the evidence but the two differently ordered proposed ids were not selected by\
      \ the tally. Juvenile coexistence or overlap in nature is insufficient evidence for adult safety in confinement."

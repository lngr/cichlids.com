  synonyms:
    - name: Heros motaguensis
      note: Original combination.
    - name: Cichlasoma motaguense
      note: Historical generic combination listed in the catalog.
  legacyNames:
    - Parachromis motoguensis
  note: "The Catalog of Fishes accepts Parachromis motaguensis (Gunther, 1867), originally described as Heros\
    \ motaguensis. The legacy epithet motoguensis is a spelling error. The original journal volume is dated 1866\
    \ but the accepted publication year is 1867. Cichlasoma motaguense is a verified historical combination. Checker-a's\
    \ proposed Herichthys motaguense was not confirmed by the authoritative entry and is not adopted as an established\
    \ synonym."

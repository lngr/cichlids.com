taxonomy:
  validName: Parachromis motaguensis
  genus: Parachromis
  species: motaguensis
  author: "(Günther, 1867)"
  source:
    kind: catalog-of-fishes
    title: "Eschmeyer's Catalog of Fishes, Parachromis species list, updated 21 September 2026"
    url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Parachromis"

  diet:
    text: "Adult fish hunt smaller fish and also take insects and crustaceans. The compatibility category is piscivore,\
      \ supported by CRC, while the husbandry diet should provide varied animal-based nutrition. Use a complete\
      \ carnivore pellet as the foundation, with appropriate portions of shrimp, krill, insects, earthworms or\
      \ occasional fish flesh. NVC reports some plant material in stomach contents without establishing a herbivorous\
      \ requirement. Predation risk persists even when meals are adequate. Routine reliance on feeder fish is\
      \ unnecessary and introduces avoidable nutritional and health uncertainty. The adult feeding-speed decision\
      \ is normal because the Nordic account describes comparatively restrained feeding. No specific protein-sensitive\
      \ herbivore bloat syndrome is established, but poor water quality and unsuitable feeding can still cause\
      \ digestive illness."

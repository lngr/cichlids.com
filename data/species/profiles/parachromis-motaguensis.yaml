  ph:
    value:
      min: 6.2
      max: 8.5
    confidence: low
    rationale: "The tally selects pH 6.2 to 8.5 by qualified majority, with low confidence. Generator, checker-b,\
      \ checker-c and both tiebreakers proposed 6.2 to 8.5; checker-a proposed 6.5 to 8.0. Acahuapa middle and\
      \ upper station means cover 6.2 to 8.0 and the whole basin covers 6.2 to 8.5, but catches are not resolved\
      \ to every chemical endpoint. Motagua monitoring supports an alkaline center around 7.45 to 8.32, while\
      \ Artigas Azas reports habitat pH 7 to 8.5. FishBase gives 7 to 8. The narrower decision excludes the wider\
      \ NVC habitat claim of 8 to 9 because no station series substantiates 9 as typical. Cabassi et al. measured\
      \ 8.79 to 8.80 in upper Coatepeque water; that hydrothermal lake is described separately as exceptional\
      \ habitat. Aquarium recommendations remain evidence but do not determine the natural range."

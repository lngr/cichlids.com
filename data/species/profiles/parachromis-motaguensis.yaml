  breeding:
    text: "An established pair deposits eggs on a firm surface and both sexes guard the eggs and young. Fully\
      \ grown females can produce broods approaching two thousand eggs; smaller or inexperienced fish may produce\
      \ much less. Kutty and NVC report hatching after roughly three days and free swimming several days later,\
      \ while Seriously Fish gives a longer hatch interval. Temperature and individual circumstances therefore\
      \ matter more than a fixed timetable. Appropriate small fry foods and grow-out capacity are necessary. Older\
      \ offspring may be excluded when a new brood starts, and unequally sized youngsters can prey on one another.\
      \ Parental defence can make routine tank access difficult, and the partners still need a means of separation."

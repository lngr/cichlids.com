  khDkh:
    value:
      min: 4
      max: 12
    confidence: low
    rationale: "The tally selects 4 to 12 dKH with low confidence, without a natural KH verification object. Generator\
      \ proposed 3 to 12, checker-a 4 to 12, checker-b 4 to 13 and checker-c 4 to 10. These bounds agree within\
      \ the tally's KH threshold, and their median is 4 to 12. The best numerical basis is Motagua alkalinity:\
      \ INSIVUMEH's 2003 range of 78.33 to 223.60 mg/L CaCO3 equals 4.39 to 12.53 dKH, using 17.848 mg/L per degree.\
      \ Alkalinity is an aquarium KH equivalent rather than a separate measurement of every carbonate species.\
      \ The bulletin repeats some numbers under bicarbonate and contains analytical inconsistencies, and no fish\
      \ census accompanied the monitoring. The wider 2002 Motagua series of 3.67 to 14.29 dKH and Puente Orellana's\
      \ 5.89 to 12.61 are retained; 4 to 12 is a typical working range rather than a boundary for all native waters.\
      \ Generator and checker-c estimates and checker-a's conductivity-derived claim remain visibly provisional.\
      \ No conversion from GH, pH or salinity is accepted. Coatepeque's reported bicarbonate maximum is equivalent\
      \ to about 16.4 dKH and belongs to its exceptional habitat description."

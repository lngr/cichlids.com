  temperatureC:
    value:
      min: 21
      max: 30
    confidence: medium
    rationale: "The qualified-majority tally selects 21 to 30 C with medium confidence and four agreeing votes\
      \ out of six. Generator proposed 20 to 30; checker-a 25 to 30; checker-b 21 to 30; checker-c 21 to 29; tiebreaker-1\
      \ 21 to 31.1; tiebreaker-2 21 to 30. The 2002 Motagua series gives 21.4 to 28.7 C and NVC reports 21 to\
      \ 26 C for habitat, while FishBase gives 25 to 30. Acahuapa middle and upper assemblage stations average\
      \ 26.1 to 28.5 C, without exact capture chemistry for each individual. The narrower decided range excludes\
      \ the wider pooled Motagua extrema of 18.3 to 32.2 C, the 2003 monitoring range of 22.9 to 32.2 and the\
      \ whole Acahuapa basin's 26.1 to 31.1 because these do not establish typical occupied microhabitats at every\
      \ endpoint. Kutty and Aquatic Community mention cooling to 20 C, which remains evidence for occasional conditions.\
      \ Aquarium recommendations do not substitute for natural measurements."

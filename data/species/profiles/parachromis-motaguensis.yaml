  problems:
    text: "The principal risks are crowding, incompatible adults and delayed separation after aggression begins.\
      \ A familiar pair can become unsafe, and robust companions may also be seriously injured during brood defence.\
      \ Check that each fish can feed, retreat and move without sustained pursuit. Small tankmates can be eaten\
      \ before obvious territorial fighting starts. Secure covers, stable furnishings and maintained filtration\
      \ reduce additional preventable losses. Persistent appetite changes, rapid breathing, wounds or unusual\
      \ waste require checking water conditions and the social situation and obtaining qualified help when necessary.\
      \ The species tolerates variable chemistry, but pollution, heavy organic loading and harassment remain harmful.\
      \ Uncertain hardness endpoints should be treated as evidence limits rather than exact physiological cutoffs."

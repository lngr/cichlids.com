  coloration:
    value:
      baseColors:
        - yellow
        - brown
        - green
      pattern: mixed
    confidence: medium
    rationale: "Generator proposed green, yellow, brown and black; checker-a grey, green and red; checker-b yellow,\
      \ brown, green and blue; checker-c yellow, brown and green. All selected a mixed pattern. NVC's sex-specific\
      \ description supports a yellow-brown male with green iridescence, residual bands and fine spots. Those\
      \ dominant body colors are adopted. Localized blue around the head and dark markings do not need to be dominant\
      \ base colors; female red or orange breeding colors are not transferred into the adult-male signature. Seriously\
      \ Fish independently describes the greener, paler male. Retail sexing claims reversing this contrast are\
      \ not followed."

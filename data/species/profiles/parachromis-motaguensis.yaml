    tolerance:
      value:
        min: 3
        max: 15
      confidence: low
      rationale: "No qualified majority settles the 6 proposals. generator proposes 3 to 12; checker-a\
        \ proposes 3 to 16; checker-b proposes 4 to 20; checker-c proposes 2 to 12; tiebreaker-1\
        \ proposes 3 to 13; tiebreaker-2 proposes 3 to 20 (dKH). The rounded median of all minima and\
        \ all maxima is 3 to 15 dKH. This contains natural 4 to 12 without widening. Confidence is\
        \ low. Aquarium.org.il reports the wider KH range 10 to 20 without methods or chronic\
        \ outcomes. The generic Parachromis overview gives 2 to 8, and the Hungarian page gives 6 to\
        \ 12 while confusing the fish with a Cuban common name. Motagua field alkalinity extends to\
        \ 12.53 dKH in 2003 and 14.29 in the broader 2002 series, with Puente Orellana at 5.89 to\
        \ 12.61; these wider native measurements remain evidence but do not independently establish\
        \ years of aquarium health. The median upper edge is not a demonstrated injury threshold.\
        \ Monks supports buffered and mildly brackish keeping without numerical KH limits. GH\
        \ recommendations and brackish occurrence do not establish KH tolerance. The median is\
        \ plausible as a provisional buffering envelope around native-river alkalinity and broad care\
        \ advice; GH-derived estimates do not establish KH."

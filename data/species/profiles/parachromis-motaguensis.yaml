  habitat:
    text: "The best-supported range includes the Atlantic Motagua drainage of Guatemala and Honduras and Pacific\
      \ drainages from the Naranjo to the Choluteca through El Salvador. Acahuapa field collections confirm occurrence\
      \ in a Salvadoran river basin. Rocks, submerged timber and sandy substrate provide shelter and hunting positions.\
      \ The species also occurs in lakes, and both the taxonomic catalog and FishBase record brackish occurrence.\
      \ Monks includes it among Central American cichlids suitable for mildly brackish conditions, but the evidence\
      \ does not establish a numerical lifetime salinity limit or a need for added salt. Ordinary river chemistry\
      \ is represented provisionally by 21 to 30 C, pH 6.2 to 8.5, GH 4 to 10 dGH and KH equivalent 4 to 12 dKH.\
      \ Motagua monitoring was not paired with fish captures, and Acahuapa chemistry describes stations rather\
      \ than individual catches. Coatepeque is a distinct hydrothermal habitat: Cabassi and colleagues measured\
      \ upper-water temperatures of 24.6 to 24.7 C, pH 8.79 to 8.80 and calcium and magnesium consistent with\
      \ about 22.1 to 24.0 dGH at 0 to 25 m. Their reported bicarbonate maximum of 358 mg/L is equivalent to about\
      \ 16.4 dKH, without establishing a complete upper-water KH interval. These exceptional lake values stay\
      \ outside the typical chemistry and aquarium tolerances; they are not targets to recreate. The lake study\
      \ supplies this evidence directly, rather than the internal waterbody table."

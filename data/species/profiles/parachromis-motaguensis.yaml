  sexing:
    text: "Adult males are usually larger, with a yellow-brown body, green iridescence and fine spots extending\
      \ over the body and fins. Females commonly retain stronger dark bands and can show vivid orange or red,\
      \ especially in Red Tiger stock. The popular red coloration is therefore not a dependable sign of a male.\
      \ Color contrast and body size become clearer with maturity; young fish are harder to sex reliably. The\
      \ greener, paler male description is supported by specialist accounts and outweighs retail advice that reverses\
      \ the usual contrast. Locality names such as Rio Blanco or Rio Copan should remain attached to documented\
      \ stock rather than being inferred from appearance."

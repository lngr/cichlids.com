partners:
  suitable:
    - species: Cincelichthys bocourti
      reason: NVC includes this species among successful combinations with similarly sized robust cichlids; aggression
        still makes the outcome conditional.
      condition: "One nonbreeding motaguensis, aquarium at least 300 cm long, separate retreats and immediate\
        \ separation capacity."
    - species: Amphilophus citrinellus
      reason: "NVC reports this combination, but both adults can retaliate and cause serious injury."
      condition: "One nonbreeding motaguensis, comparable adult sizes and at least 300 cm tank length, with monitoring\
        \ and separate accommodation."
  unsuitable:
    - species: Parachromis dovii
      reason: Presumed captive crossing plus extreme adult size and aggression.
    - species: Nandopsis tetracanthus
      reason: Presumed pairwise crossing and severe territorial competition.
    - species: Parachromis managuensis
      reason: "Captive offspring reports support a presumed hybrid risk, alongside potential serious injuries."
    - species: Mayaheros urophthalmus
      reason: Presumed offspring reports create a hybrid warning despite NVC listing a successful general companion
        combination.
    - species: Mesoheros festae
      reason: "Labelled captive crosses support a presumed hybrid risk, with substantial aggression as an additional\
        \ concern."
    - species: Poecilia reticulata
      reason: Adult guppies remain small enough to be swallowed and are prey.
    - species: Thorichthys aureus
      reason: Regional co-occurrence does not protect a less robust fish from repeated attacks by a confined adult
        pair.
profile:
  overview:
    text: "Parachromis motaguensis is a large Central American predator sold as the Motagua cichlid, false yellowjacket\
      \ or red tiger motaguense. The legacy catalog spelling motoguensis refers to this species and is a spelling\
      \ error. Typical adult males reach about 30 cm total length and females about 26 cm. A compatible pair offers\
      \ conspicuous courtship and biparental brood care, but even a pair that has lived together for years can\
      \ suffer a fatal attack. The adult aquarium, observation and immediate separation capacity are central to\
      \ successful keeping. Red Tiger is a trade color form; it is not by itself proof of hybrid ancestry or a\
      \ collecting locality."

    tolerance:
      value:
        min: 6
        max: 8.5
      confidence: medium
      rationale: "All four complete-profile proposals are pH 6.0 to 8.5, which the tally retains with unanimous\
        \ verification and medium confidence. Seriously Fish recommends 6 to 8 and Artigas Azas recommends chemistry\
        \ consistent with his habitat account of 7 to 8.5. The combined keeping envelope contains the natural\
        \ decision. Neutral to moderately alkaline conditions have stronger routine support than either endpoint.\
        \ NVC's wider habitat report of 8 to 9 does not establish long-term aquarium health at 9, and Coatepeque's\
        \ exceptional pH is not an aquarium target."

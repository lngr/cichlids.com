  sizeAndGrowth:
    text: "Plan for a male around 30 cm and a female around 26 cm total length. The female figure follows the\
      \ sex-specific NVC account; an aquarium pair observed at 25 and 15 cm was still growing. Published figures\
      \ in standard length exclude the tail and cannot be substituted unchanged for total length. Young fish can\
      \ reproduce well before reaching adult size, so breeding in a small aquarium does not demonstrate adequate\
      \ adult space. Growth depends on food, water quality and social access to both. The provisional lifespan\
      \ estimate is 9 to 13.5 years, derived from care-sheet estimates ranging from 8 to 15, rather than a documented\
      \ lifetime study."

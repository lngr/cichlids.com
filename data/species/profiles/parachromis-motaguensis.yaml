  ghDgh:
    value:
      min: 4
      max: 10
    confidence: medium
    rationale: "The tally selects 4 to 10 dGH by qualified majority, with medium confidence. Generator proposed\
      \ 9 to 20; checker-a proposed 6 to 16; checker-b, checker-c and both tiebreakers proposed 4 to 10. INSIVUMEH\
      \ total-hardness titrations in the Motagua are preferable to unsited environmental summaries: the 2003 series\
      \ of 76.54 to 172.66 mg/L CaCO3 converts to 4.29 to 9.68 dGH, and the 2002 Puente Orellana series converts\
      \ to 3.99 to 7.18 dGH. NVC independently summarizes habitat GH as 4 to 10. FCG and the USAC report partly\
      \ repeat INSIVUMEH data rather than providing independent sampling. The wider pooled Motagua range of 2.49\
      \ to 9.97 includes a softer Concua reading without simultaneous species capture data. FishBase's wider 9\
      \ to 20 environmental range and the interpreted 10 to 20 attached by checker-a to PFK's qualitative description\
      \ remain in evidence. Conductivity cannot establish GH. Coatepeque Ca and Mg yield 22.1 to 24.0 dGH in upper\
      \ lake water, an exceptional hydrothermal setting described in the habitat section rather than a typical\
      \ aquarium reference."

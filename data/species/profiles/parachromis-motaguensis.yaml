    tolerance:
      value:
        min: 20
        max: 30
      confidence: medium
      rationale: "All four complete-profile proposals are 20 to 30 C, retained by the unanimous tally with medium\
        \ confidence. Seriously Fish supports this keeping interval; Artigas Azas gives 24 to 30 and prefers about\
        \ 26 C, while the Nordic association gives 24 to 28 and NVC favors cooler maintenance up to about 26.\
        \ The tally range contains the natural 21 to 30 decision. These are husbandry recommendations rather than\
        \ multi-year trials at both endpoints, so routine maintenance near 26 C is better supported than permanent\
        \ exposure to an extreme."

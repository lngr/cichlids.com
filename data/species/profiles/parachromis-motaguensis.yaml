  socialBehavior:
    text: "The recommended social unit is a compatible male and female, with the option of keeping one adult separately.\
      \ Both parents defend the brood, while unrelated adults are territorial rivals. Pair familiarity does not\
      \ guarantee continued safety: Kutty described a fatal attack on a female after years of cohabitation. Sustained\
      \ pursuit, damaged fins, persistent hiding or loss of access to food require prompt physical separation.\
      \ Aggression occurs outside spawning and becomes especially extensive during brood care. A harem or an arbitrary\
      \ group of adults is not supported. These are level 4 risks toward both conspecifics and other fish, including\
      \ companions too large to be swallowed."

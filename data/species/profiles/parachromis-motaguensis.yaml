  hybridGroups:
    value:
      - mayaheros-urophthalmus-parachromis-motaguensis
      - mesoheros-festae-parachromis-motaguensis
      - nandopsis-tetracanthus-parachromis-motaguensis
      - parachromis-dovii-motaguensis
      - parachromis-managuensis-motaguensis
    confidence: low
    rationale: "The conservative tally selects five pairwise ids with low confidence and votes 2 of 6. Generator\
      \ and checker-c proposed dovii and tetracanthus; checker-a proposed those plus managuensis; checker-b proposed\
      \ dovii alone. Tiebreaker-1 proposed those three plus urophthalmus, festae and trichromis-salvini-parachromis-motaguensis.\
      \ Tiebreaker-2 proposed those three plus urophthalmus, festae and parachromis-motaguensis-trichromis-salvini.\
      \ Thus the union of ids named by at least two runs contains dovii, tetracanthus, managuensis, urophthalmus\
      \ and festae. The two differently ordered salvini ids each have only one vote and are not selected, although\
      \ they describe the same parental pair; their evidence is retained rather than silently renaming ids or\
      \ changing the tally. Binns labels direct captive offspring for the selected pairs. A 2012 MonsterFishKeepers\
      \ account reports hatched managuensis x motaguensis fry; a 2021 Capital Cichlid Association forum account\
      \ reports an accidental Mayan cross and fertile hybrid descendants; a public breeder history additionally\
      \ claims the Cuban cross. None establishes independently tested parentage or access to conspecific mates.\
      \ All five groups are presumed. Multiple Binns galleries are one compilation, and compound crosses do not\
      \ establish transitive crossing among their ancestral species."

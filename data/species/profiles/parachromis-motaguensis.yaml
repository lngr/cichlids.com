    confidence: high
    rationale: "The Catalog of Fishes and FishBase identify a Central American species centered on the Atlantic\
      \ Motagua drainage of Guatemala and Honduras. FishBase also includes Pacific drainages from the Naranjo\
      \ to the Choluteca through El Salvador. Alvarez and colleagues collected it in the Acahuapa basin. The catalog\
      \ additionally names Nicaragua without resolving the status of individual populations and identifies southern\
      \ Mexican occurrence as introduced. Freshwater and brackish occurrence is supported, but neither establishes\
      \ numerical salinity, GH or KH limits. No listed waterbody supplies this profile's natural chemistry."

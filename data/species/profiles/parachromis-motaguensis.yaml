    value: normal
    confidence: medium
    rationale: "Generator, checker-b and checker-c proposed normal; checker-a proposed hasty. The Nordic register\
      \ specifically describes restrained feeding and little tendency to monopolize all offered food. This species-specific\
      \ adult observation outweighs a general inference from predatory feeding or eager acceptance of pellets.\
      \ NVC's ambush description is consistent with normal but does not establish the food-competition disadvantage\
      \ needed for slow."

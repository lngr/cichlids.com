  disagreements:
    - field: features.predation
      proposals:
        - {by: generator, value: 1}
        - {by: checker-a, value: 1}
        - {by: checker-b, value: 0}
        - {by: checker-c, value: 1}
        - {by: tiebreaker-1, value: 1}
      decision: 1
      rationale: >-
        Decided by the vote count, qualified majority of 4 of 5. Fish remains, eggs and larvae in
        the stomachs of introduced fish (Herder et al. 2022), fry in a biocover-feeding congener and
        hobby reports of eaten fry support level 1; no source reports hunting of larger fish.
    - field: features.diet
      proposals:
        - {by: generator, value: {type: aufwuchs, bloatSensitive: true}}
        - {by: checker-a, value: {type: omnivore, bloatSensitive: true}}
        - {by: checker-b, value: {type: aufwuchs, bloatSensitive: true}}
        - {by: checker-c, value: {type: aufwuchs, bloatSensitive: true}}
        - {by: tiebreaker-1, value: {type: aufwuchs, bloatSensitive: true}}
      decision: {type: aufwuchs, bloatSensitive: true}
      rationale: >-
        Decided by the vote count, qualified majority of 4 of 5. Wild stomach contents and the genus
        review show a biocover grazer; animal food is only a supplement.
    - field: features.hybridGroups
      proposals:
        - {by: generator, value: [melanochromis]}
        - {by: checker-a, value: [melanochromis]}
        - {by: checker-b, value: []}
        - {by: checker-c, value: [melanochromis]}
        - {by: tiebreaker-1, value: [melanochromis]}
      decision: [melanochromis]
      rationale: >-
        Decided by the vote count, qualified majority of 4 of 5. The proposals also differed on the
        scope of the new group: the generator named M. auratus, M. chipokae and M. loriae, checker-a
        added the striped species now in Pseudotropheus by hobby usage, checker-c asked for current
        valid names only, and tiebreaker-1 proposed all valid Melanochromis. Because every warning
        is phrased for the genus and none names a single species, the group takes all 15 valid
        Melanochromis species and no Pseudotropheus species.
    - field: features.ghDgh.tolerance
      proposals:
        - {by: generator, value: {min: 3, max: 25}}
        - {by: checker-a, value: {min: 3, max: 25}}
        - {by: checker-b, value: {min: 3, max: 15}}
        - {by: checker-c, value: {min: 3, max: 25}}
        - {by: tiebreaker-1, value: {min: 3, max: 25}}
      decision: {min: 3, max: 25}
      rationale: >-
        Decided by the vote count, qualified majority of 4 of 5. Most care sheets allow up to 25
        dGH; the lower FishBase limit of 15 stands alone.
    - field: features.khDkh.tolerance
      proposals:
        - {by: generator, value: {min: 5, max: 12}}
        - {by: checker-a, value: {min: 5, max: 12}}
        - {by: checker-b, value: {min: 5, max: 14}}
        - {by: checker-c, value: {min: 5, max: 10}}
      decision: {min: 5, max: 12}
      rationale: >-
        Decided by the vote count as unanimous, 4 of 4, because all bounds lie within 2 dKH of the
        decided range; the upper bound follows The Tropical Tank.
    - field: features.origin.value
      proposals:
        - {by: generator, value: {region: Lake Malawi, localities: [Monkey Bay, Jalo Reef to Crocodile Rocks, southern end, south-eastern coast to Nkhomo Reef, Thumbi East Island]}}
        - {by: checker-a, value: {region: Lake Malawi, localities: [Monkey Bay, Jalo Reef to Crocodile Rocks, southern end, south-eastern coast to Nkhomo Reef, Domwe Island]}}
        - {by: checker-b, value: {region: Lake Malawi, localities: [Nkhomo Reef, Crocodile Rocks, Jalo Reef, Monkey Bay, southwestern shore]}}
        - {by: checker-c, value: {region: Southern and western Lake Malawi, localities: [Monkey Bay, Jalo Reef, Crocodile Rocks, Nkhomo Reef]}}
      decision: {region: Lake Malawi, localities: [Monkey Bay (type locality), Jalo Reef southward along the western coast to Crocodile Rocks, Southern end of the lake, South-eastern coast north to Nkhomo Reef]}
      rationale: >-
        The region names the lake as the schema asks. The localities follow the Catalog of Fishes
        and Seriously Fish; the single island names of the generator and checker-a are not stated
        in any source read, the Markert et al. abstract naming only a 42 km stretch of the southern
        shore, so they are left out.
    - field: features.maxSizeCm
      proposals:
        - {by: generator, value: {male: 12, female: 10}}
        - {by: checker-a, value: {male: 11, female: 9}}
        - {by: checker-b, value: {male: 12, female: 10}}
        - {by: checker-c, value: {male: 12, female: 10}}
      decision: {male: 12, female: 10}
      rationale: >-
        Three votes and two care sheets that separate the sexes give 12 and 10 cm; the 11 cm
        standard length of Seriously Fish corresponds to about 13 cm total length, so 11 and 9 cm
        understate well-kept aquarium fish.
    - field: features.aggressionHeterospecific
      proposals:
        - {by: generator, value: 3}
        - {by: checker-a, value: 3}
        - {by: checker-b, value: 3}
        - {by: checker-c, value: 4}
      decision: 3
      rationale: >-
        Most care sheets keep it successfully with robust, differently coloured mbuna, which is
        level 3; only TFH Magazine describes attacks on any tankmate, which checker-c followed.
    - field: features.coloration.value.baseColors
      proposals:
        - {by: generator, value: [black, blue]}
        - {by: checker-a, value: [black, blue, white]}
        - {by: checker-b, value: [black, blue]}
        - {by: checker-c, value: [black, blue]}
      decision: [black, blue]
      rationale: >-
        The pale stripes of the male range from bluish white to turquoise; blue covers them, and
        black and blue dominate the adult male.
    - field: features.minTank
      proposals:
        - {by: generator, value: {volumeL: 240, lengthCm: 120, depthCm: 45}}
        - {by: checker-a, value: {volumeL: 200, lengthCm: 120, depthCm: 45}}
        - {by: checker-b, value: {volumeL: 205, lengthCm: 120, depthCm: 45}}
        - {by: checker-c, value: {volumeL: 400, lengthCm: 150, depthCm: 50}}
      decision: {volumeL: 240, lengthCm: 120, depthCm: 45}
      rationale: >-
        Three votes and most sources agree on a 120 x 45 cm base for the harem; 240 litres adds a
        margin over the absolute minimum of about 205 litres. The 400 litre and 150 cm figures of
        AquaInfo and Malawi.si apply to mixed communities and appear in the husbandry text and the
        partner conditions.
    - field: features.lifespanYears
      proposals:
        - {by: generator, value: {min: 7, max: 9}}
        - {by: checker-a, value: {min: 5, max: 9}}
        - {by: checker-b, value: {min: 5, max: 9}}
        - {by: checker-c, value: {min: 5, max: 10}}
      decision: {min: 5, max: 10}
      rationale: >-
        The range covers all stated values of the hobby and retail sources, from about five years
        to the ten years of AquaInfo; confidence stays low.
    - field: features.beginnerSuitability
      proposals:
        - {by: generator, value: moderate}
        - {by: checker-a, value: demanding}
        - {by: checker-b, value: moderate}
        - {by: checker-c, value: demanding}
      decision: demanding
      rationale: >-
        Seriously Fish, TFH Magazine and Oliver explicitly advise beginners against the species,
        and conspecific aggression level 4 requires experience by definition; only a retailer calls
        it a beginner fish.

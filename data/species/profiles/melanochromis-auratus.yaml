  aggressionHeterospecific:
    value: 3
    confidence: medium
    rationale: >-
      Three of four votes chose level 3; checker-c chose level 4. The male attacks other fish well
      beyond a spawning site and can stop other species from breeding, so tankmates must be robust
      mbuna of similar size; peaceful haplochromines such as peacocks and utaka are unsuitable
      (Seriously Fish, Fishkeeper). TFH Magazine describes males that attack any tankmate, even much
      larger fish, and prefers a species tank, which points towards level 4. Seriously Fish,
      Fishkeeper, AquaInfo, The Tropical Tank and Malawi.si, however, keep it in mixed communities
      of robust, differently coloured mbuna, and Malawi.si finds it less hostile to other species
      than to its own. Level 3 reflects this established mixed-mbuna practice; the compatibility
      check already demands comparable size and robustness from tankmates at this level.

  ghDgh:
    value: {min: 3, max: 5}
    confidence: high
    verification:
      method: waterbody
      waterbody: lake-malawi
    rationale: >-
      Lake Malawi endemic; the natural range is the total hardness of the lake water. Calcium and
      magnesium measured in the upper 50 m of the north basin (Branchu et al. 2010) give 4.2 to 4.6
      dGH, and the titrations of the 1960s compiled by FAO give 3.2 to 4.9 dGH, so the range is 3
      to 5 dGH. Care sheets that ask for 10 dGH or more describe aquarium practice, not the
      habitat. All four votes proposed this range.
    sources:
      - *branchu
      - *fao
    evidence:
      - source: *branchu
        value: {min: 4.2, max: 4.6}
        note: computed from calcium and magnesium of the upper 50 m
      - source: *fao
        value: {min: 3.2, max: 4.9}
        note: computed from 1960s titrations
    tolerance:
      value: {min: 3, max: 25}
      confidence: medium
      verification:
        method: qualified-majority
        votes: {agree: 4, total: 5}
      rationale: >-
        Four of five votes proposed 3 to 25 dGH; checker-b proposed 3 to 15 dGH. The lower bound is
        the hardness of the lake, in which the species lives all its life; Garnelio and Aquarium
        Ratgeber also start at 3 dGH. For the upper bound Seriously Fish, Tropical Freshwater Fish
        and AquaInfo give 10 to 25 dGH and Fishkeeper allows up to 25; FishProfiles stops at 20,
        MadPeces and FishBase at 15 and Aquarium Ratgeber at 12. Many of these sheets treat Lake
        Malawi as hard water and so confuse hardness with alkalinity, but none reports harm in hard
        tap water up to 25 dGH, which mbuna keepers widely use. The care sheets give ranges without
        long-term data, so the confidence is medium.
      sources:
        - *sf
        - *fk
        - *tff
        - *aquainfo
        - *fb
        - &fp
          kind: database
          title: "FishProfiles.com: Melanochromis auratus"

  temperatureC:
    value: {min: 21, max: 29}
    confidence: high
    verification:
      method: waterbody
      waterbody: lake-malawi
    rationale: >-
      Lake Malawi endemic, so the natural range is the measured range of the lake. Eccles (1974)
      reports 21 C inshore in the south-east arm during the cool, windy season and about 27 C in the
      upper 60 m by May; Vollmer et al. (2005) give winter epilimnion values near 23.5 C and summer
      surface water of about 28 C; a 2013 campaign (Ngochera 2018) measured 24 to 29 C. Together
      these span 21 to 29 C. All four votes proposed this range.
    sources:
      - &eccles
        kind: literature
        title: >-
          Eccles, D. H. (1974). An outline of the physical limnology of Lake Malawi (Lake Nyasa).
          Limnology and Oceanography 19(5), 730-742 (abstract).
        url: https://doi.org/10.4319/lo.1974.19.5.0730
        accessed: 2026-10-12

          accessed: 2026-10-13
        - *ratgeber
        - *branchu
        - *fao
        - &madpeces
          kind: website
          title: "MadPeces (retailer): Melanochromis auratus, product page with husbandry sheet"
          url: https://madpeces.com/es/ciclidos-africanos/265-melanochromis-auratus.html
          accessed: 2026-10-13
        - *garnelio
      evidence:
        - source: *sf
          value: {min: 10, max: 25}
          note: aquarium recommendation
        - source: *tff
          value: {min: 10, max: 25}
          note: aquarium recommendation, 20 named as ideal
        - source: *aquainfo

partners:
  suitable:
    - species: Labeotropheus fuelleborni
      reason: Robust, larger rock-dwelling mbuna with the same grazing diet and water needs; its shape and colours differ from M. auratus.
      condition: Tank of at least 150 cm with many caves; only one male of each species.
    - species: Maylandia estherae
      reason: Sturdy, similarly sized mbuna that holds its own against M. auratus, eats the same plant-based food and lacks the striped pattern.
      condition: Only one Maylandia species with it; tank of at least 150 cm.
    - species: Maylandia callainos
      reason: Plain blue robust mbuna of similar size and diet that does not resemble M. auratus.
      condition: Do not combine with other Maylandia; tank of at least 150 cm.
    - species: Synodontis multipunctatus
      reason: Bottom-dwelling catfish that lives below the rock zone and is ignored by most mbuna; accepts hard alkaline water.
      condition: Keep in a group with enough hiding places.
  unsuitable:
    - species: Melanochromis chipokae
      reason: Closely related look-alike of the same hybrid group that may cross with M. auratus; both are extremely aggressive and fight to the death.
    - species: Other Melanochromis species
      reason: All valid Melanochromis belong to the same hybrid group, and the hobby warns that they cross with M. auratus.
    - species: Pseudotropheus johannii
      reason: Same hybrid group; males are dark with light horizontal stripes like M. auratus males and are attacked as rivals.
    - species: Aulonocara
      reason: Peaceful peacock cichlids are harassed and cannot breed; they also need more protein-rich food.
    - species: Copadichromis
      reason: Peaceful open-water utaka are chased constantly and stressed.
    - species: Labidochromis caeruleus
      reason: Yellow, more peaceful mbuna that resembles the golden females and is a frequent target.
    - species: Mikrogeophagus ramirezi
      reason: Small, peaceful South American cichlid for soft water; it would be injured and the water needs differ.

profile:
  overview:
    text: >-
      The golden mbuna is one of the best-known rock cichlids from Lake Malawi and has been a
      staple of the trade for decades. Juveniles and females are bright golden yellow with black,
      white-edged horizontal stripes, while a dominant male turns almost into the photographic
      negative: dark brown to black with pale blue, whitish or yellowish stripes. It stays fairly
      small at about 10 to 12 cm, is hardy and cheap, and that combination tempts many beginners.
      The catch is its temper. Males are among the most intolerant mbuna and often kill rival
      males and unwilling females in tanks that are too small or too open, which makes it a fish
      for experienced keepers. With a large tank full of caves, a harem of females and robust,
      differently coloured mbuna as company, it can be a lively and rewarding fish for keepers who
      plan around its aggression.
    sources:
      - *sf
      - *tfh
      - *fb
      - *oliver
  habitat:
    text: >-
      Melanochromis auratus is endemic to Lake Malawi. It occurs along much of the western shore
      from Jalo Reef down to Crocodile Rocks, around the southern end of the lake and a short way
      up the south-eastern coast to Nkhomo Reef; the type specimen came from Monkey Bay. It lives
      on rocky shores, reefs and around islands, including rock areas with a layer of sediment.
      Its populations are strongly tied to these rock patches, and stretches of sand or deep water
      between them limit exchange between neighbouring populations. The lake water is warm (about
      21 to 29 C), moderately alkaline (pH 7.7 to 8.6) and rather soft, with 3 to 5 dGH and 5 to 8
      dKH. Fish sold today are almost always aquarium bred, and released fish have established
      populations in Mexico, Indonesia and Hong Kong.
    sources:
      - *cof
      - *sf
      - *markert
      - *fao
      - *branchu
  sizeAndGrowth:
    text: >-
      Adult males usually reach about 11 to 12 cm in the aquarium, females stay smaller at around 9
      to 10 cm. Reports of larger fish exist, but they are exceptional. Young males can start to
      change into the dark male colours at around 5 cm, depending on their rank. A dominant male
      can lose his dark colours and return to yellow when he is stressed or loses his position,
      and old females may darken and resemble males. Hobby sources give a lifespan of about five to
      ten years in good care; scientific data are lacking.
    sources:
      - *fb
      - *sf
      - *tff
      - *aquainfo
      - *wde
      - *paulista
  husbandry:
    text: >-
      Plan a tank of at least 120 x 45 cm and about 240 litres for one male and four females, and
      150 cm or more if other mbuna join them. Build stable rock piles from the floor to near the
      surface with many caves and broken sight lines, set directly on the tank bottom so digging
      fish cannot topple them, and use sand as substrate. Strong filtration and frequent partial
      water changes keep nitrate low. The fish tolerates a fairly wide range of water: 21 to 29 C,
      pH 7.5 to 8.8, 3 to 25 dGH and 5 to 12 dKH are survivable long term, with a pH around 8 and 24
      to 27 C as a comfortable middle. Many keepers stock mbuna tanks densely so that aggression is
      spread over many fish, which only works with very good filtration.
    sources:
      - *sf
      - *fk
      - *tt
      - *tfh
      - *aquainfo
  socialBehavior:
    text: >-
      This mbuna lives in a strict hierarchy. One male dominates and shows the dark colours, while
      subordinate males stay yellow and are chased relentlessly; in most home tanks only one male
      survives. Keep a single male with at least three, better four or more, females so that his
      courtship is spread over several fish. Females are quarrelsome as well, form their own pecking
      order and may turn dark and take over the male role when no male is present. The male claims
      most of the rockwork and attacks other fish far beyond a single cave, especially fish that
      look like rivals. Dense rockwork, many hiding places and a well-stocked community of robust
      mbuna help to keep injuries rare.
    sources:
      - *sf
      - *tfh
      - *nelissen
      - *fk
      - *oliver
  diet:
    text: >-
      In the lake the golden mbuna grazes the algal film on rocks and eats the small animals that
      live in it, and it also feeds opportunistically in the territories of other fish. In the
      aquarium the main food should be plant based: spirulina flakes or pellets for mbuna, and
      blanched vegetables such as spinach or cucumber. Small amounts of frozen or live food, for
      example mysis or mosquito larvae, are a welcome extra, especially to condition females, but
      should not dominate the diet. Feed small portions once or twice a day so that every fish gets
      a share without leftovers. Fatty, protein-heavy food such as beef heart or large amounts of
      bloodworm is best avoided because of the risk of bloat.
    sources:
      - *fb
      - *fbdiet
      - *tfh
      - *sf
      - *fk
      - *gt
      - *pfk
  breeding:
    text: >-
      Breeding is easy in principle but risky because of the male's aggression. Use a species tank
      with one male and several females and plenty of caves, flat stones and patches of sand. The
      male cleans a spawning site and drives ripe females there; the female lays her eggs in small
      batches, picks them up at once and collects sperm from the male. She carries the brood in her
      mouth for about three weeks without eating, then releases fully formed young, which she still
      takes back into her mouth for some days when danger threatens. Clutches are small, up to about
      40 eggs. Brooding females should not be moved too early, because stress can make them spit or
      eat the brood. The fry take newly hatched brine shrimp and fine flakes from the start.
    sources:
      - *sf
      - *fk
      - *fb
      - *wde
  sexing:
    text: >-
      Adult males are easy to tell apart once they have reached dominance: their body turns dark
      brown to black with light bluish, white or yellowish stripes, while females keep the golden
      base colour with black stripes. The colour change can happen within days when a young male
      rises in rank. Males also grow larger. Subordinate males, however, may keep the yellow
      juvenile colours for a long time, so a group bought as yellow fish often contains several
      males. Old females sometimes darken and look like males, and a female kept without a male may
      take on male colours. Venting is the only reliable method for young fish.
    sources:
      - *sf
      - *fk
      - *tfh
      - *wde
  compatibility:
    text: >-
      Combine the golden mbuna only with robust rock-dwelling mbuna of similar or larger size that
      look different, for example Labeotropheus or plain blue or orange Maylandia. Avoid all other
      Melanochromis, because they may cross with it and fight fiercely, and avoid species whose
      males are dark with light horizontal stripes, such as Pseudotropheus johannii. Yellow mbuna
      like Labidochromis caeruleus are frequent targets because they resemble the golden females.
      Peaceful Malawi haplochromines such as peacocks and utaka, and small or slow cichlids from
      other regions, suffer badly in its presence. The fish eats fry and very small fish when it
      can, but it is no hunter of larger fish. Its plant-based diet also fits other grazing mbuna
      better than protein-hungry species.
    sources:
      - *sf
      - *sfc
      - *tt
      - *tfh
      - *oliver
      - *aquainfo
  problems:
    text: >-
      The most common mistake is buying a group of yellow juveniles for a small community tank.
      As they mature, the dominant male kills rival males and harasses females to death, and
      peaceful tankmates stop eating or breeding. Too few females, too few caves and open tanks make
      this worse. Feeding too much protein-rich food can trigger bloat, an often fatal intestinal
      problem of grazing mbuna that shows as a swollen belly, loss of appetite and white, stringy
      faeces; a plant-based diet and moderate portions help to prevent it. Poor water quality from
      dense stocking without enough filtration and water changes is another frequent cause of
      losses. Mixing with other Melanochromis leads to hybrids that should not be passed on.
    sources:
      - *sf
      - *tfh
      - *fk
      - *pfk

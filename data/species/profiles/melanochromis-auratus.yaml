schemaVersion: 1
id: melanochromis-auratus
legacyIds: [366]
status: described

taxonomy:
  validName: Melanochromis auratus
  genus: Melanochromis
  species: auratus
  author: (Boulenger, 1897)
  source: &cof
    kind: catalog-of-fishes
    title: "Eschmeyer's Catalog of Fishes, species of the genus Melanochromis"
    url: https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Melanochromis
    accessed: 2026-10-13
  synonyms:
    - name: Chromis auratus
      note: Original combination of Boulenger (1897); type locality Monkey Bay on the west coast of Lake Malawi. The Cichlid Room Companion spells it Chromis aurata.
    - name: Tilapia aurea
      note: Combination used by Goren (1974) according to the Catalog of Fishes.
    - name: Pseudotropheus auratus
      note: Combination of older aquarium literature; the Catalog of Fishes keeps no separate entry for it.
  legacyNames:
    - Melanochromis auratus
  note: >-
    The Catalog of Fishes lists Melanochromis auratus (Boulenger 1897) as valid, so the legacy name
    is the valid name; the Cichlid Room Companion agrees. Several striped mbuna once placed in
    Melanochromis (johannii, cyaneorhabdos, interruptus, perileucos and others) are valid in
    Pseudotropheus according to the same catalog. Introduced populations exist in Morelos
    (Mexico), Sulawesi (Indonesia) and Hong Kong.

names:
  trade:
    en: [Golden mbuna, Auratus cichlid, Golden cichlid, Malawi golden cichlid, Turquoise-gold cichlid]
    de: [Türkisgoldbarsch]
    es-419: [Mbuna dorado, Cíclido caramelo]

variants:
  - name: Amelanistic morph
    kind: color-morph
    note: >-
      Aquarium-bred form without the dark stripes and markings, caused by a recessive loss of the
      second exon of the pigment gene oca2 (Kratochwil et al. 2019).
  - name: Dominant male colouration with yellow or turquoise stripes
    kind: color-morph
    note: Hobby profiles report that the light stripes of dominant males vary between pale yellow, white and turquoise blue.

features:
  origin:
    value:
      continent: Africa
      region: Lake Malawi
      waterbody: Lake Malawi
      localities:
        - Monkey Bay (type locality)
        - Jalo Reef southward along the western coast to Crocodile Rocks
        - Southern end of the lake
        - South-eastern coast north to Nkhomo Reef
    confidence: high
    rationale: >-
      Endemic to Lake Malawi (Catalog of Fishes, FishBase). The Catalog of Fishes gives Monkey Bay on
      the west coast as type locality; Seriously Fish describes a range along the western shore from
      Jalo Reef to Crocodile Rocks, around the southern end and up the lower east coast to Nkhomo
      Reef. Markert et al. sampled nine rock populations along 42 km of the southern shore.
      Populations in Mexico, Indonesia and Hong Kong go back to released aquarium fish and do not
      change the origin.

  khDkh:
    value: {min: 5, max: 8}
    confidence: high
    verification:
      method: waterbody
      waterbody: lake-malawi
    rationale: >-
      Lake Malawi endemic; the natural range is the carbonate hardness of the lake. Alkalinity of
      2.33 to 2.46 meq/L in the Branchu et al. (2010) profiles and 2.00 to 2.59 meq/L after Jackson
      et al. (1963) convert to 6.5 to 6.9 and 5.6 to 7.3 dKH, so the range is 5 to 8 dKH. Sodium
      balances part of the bicarbonate, which is why carbonate hardness exceeds total hardness in
      this lake. All four votes proposed this range.
    sources:
      - *branchu
      - *fao
    evidence:
      - source: *branchu
        value: {min: 6.5, max: 6.9}
        note: computed from alkalinity profiles
      - source: *fao
        value: {min: 5.6, max: 7.3}
        note: computed from 1960s alkalinity data
    tolerance:
      value: {min: 5, max: 12}
      confidence: low
      verification:
        method: unanimous
        votes: {agree: 4, total: 4}
      rationale: >-
        The four votes proposed 5 to 12 (generator, checker-a), 5 to 14 (checker-b) and 5 to 10 dKH
        (checker-c); their bounds lie within 2 dKH of 5 to 12, so they count as agreeing. Few
        husbandry sources give a carbonate hardness for this species: The Tropical Tank asks for at
        least 6 and ideally 10 to 12 dKH, MadPeces for 6 to 10 dKH, and Aquarium Ratgeber prints 3
        to 12 in a row labelled KH but with a GH unit. A retailer sheet gives 0 to 8 dKH, which
        contradicts its own pH advice and is not followed. The tolerance spans the lake minimum to
        the upper care-sheet value; the thin evidence keeps the confidence low.
      sources:
        - *tt
        - *ratgeber
        - *branchu
        - *fao
        - *madpeces
        - *garnelio
      evidence:
        - source: *tt
          value: {min: 6, max: 12}
          note: aquarium recommendation, 10 to 12 as ideal
        - source: *madpeces
          value: {min: 6, max: 10}
          note: retailer care sheet
        - source: *ratgeber
          value: {min: 3, max: 12}
          note: KH row printed with a GH unit, read as dKH
        - source: *garnelio
          value: {min: 0, max: 8}
          note: retailer care sheet, internally inconsistent
        - source: *branchu
          value: {min: 6.5, max: 6.9}
          note: lake water in which the species lives permanently
        - source: *fao
          value: {min: 5.6, max: 7.3}
          note: lake water in which the species lives permanently


  aggressionConspecific:
    value: 4
    confidence: high
    rationale: >-
      All sources rank it among the most aggressive mbuna towards its own kind, and all four votes
      chose level 4. A dominant male usually kills rival males once they colour up and may kill
      females that are not ready to spawn when they cannot escape; Seriously Fish expects
      subdominant males to die even in large tanks (also Oliver, TFH Magazine, Fishkeeper,
      Malawi.si). Females form a strict hierarchy of their own (Nelissen 1985) and can turn
      aggressive and take on male colours. Keeping it needs a harem, many caves and experience.

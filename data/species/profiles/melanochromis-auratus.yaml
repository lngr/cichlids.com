  predation:
    value: 1
    confidence: medium
    verification:
      method: qualified-majority
      votes: {agree: 4, total: 5}
    rationale: >-
      Four of five votes chose level 1; checker-b chose level 0. The species is mainly a grazer of
      the rock biocover (FishBase, Konings and Stauffer 2012) with a mouth built for algae, unlike
      the fry-hunting congeners (Seriously Fish on M. chipokae). Genner and Turner describe it as a
      roaming opportunist that forages in the territories of other mbuna and list fry among the
      foods of mbuna. Herder et al. (2022) found fish remains, fish eggs and larvae among a broad
      range of items in the stomachs of golden cichlids introduced to Lake Poso, and hobby sheets
      (FishProfiles, Aquarismo Paulista) note that small fish and newborn fry are eaten when met.
      Konings and Stauffer report cichlid fry in stomachs of the biocover-feeding congener M.
      loriae. A tank study shows it hunts mosquito larvae almost as eagerly as a betta, which
      underlines its readiness to take small live prey. No source reports that it hunts fish of
      any size, so level 2 is excluded; it takes fry and very small fish when the chance arises.
    sources:
      - &gt
        kind: literature
        title: >-
          Genner, M. J. and Turner, G. F. (2005). The mbuna cichlids of Lake Malawi: a model for
          rapid speciation and adaptive radiation. Fish and Fisheries 6(1), 1-34.
        url: https://doi.org/10.1111/j.1467-2679.2005.00173.x
        accessed: 2026-10-13
      - &herder
        kind: literature
        title: >-
          Herder, F. et al. (2022). More non-native fish species than natives, and an invasion of
          Malawi cichlids, in ancient Lake Poso, Sulawesi, Indonesia. Aquatic Invasions 17(1)
          (abstract).
        url: https://doi.org/10.3391/ai.2022.17.1.05
        accessed: 2026-10-13
      - *ks
      - *fb
      - *sf
      - &sfc
        kind: database
        title: "Seriously Fish: Melanochromis chipokae"
        url: https://www.seriouslyfish.com/species/melanochromis-chipokae/
        accessed: 2026-10-13
      - *fp
      - *tt
      - &hd
        kind: literature
        title: >-
          Prasetiyanti, N., Ningrum, P. and Pujiati, R. (2026). Comparative predation efficiency of
          betta fish (Betta splendens) and golden cichlid (Melanochromis auratus) against Aedes
          aegypti larvae. Health Dynamics 3(2), 74-79 (abstract).
        url: https://doi.org/10.33846/hd30205
        accessed: 2026-10-13
      - *paulista

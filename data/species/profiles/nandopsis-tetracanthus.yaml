      url: "https://www.multihobby.net/?p=11898"
      archived: multihobby.net/_root/q-25d30a83/2026-10-14T101701Z
  diet:
    text: "Use a varied omnivorous diet built around a quality cichlid pellet, supplemented with shrimp, worms or\
      \ aquatic insect larvae and some plant-containing food. Natural food records include small fish, so prepared\
      \ feeding does not make small tankmates safe. One first-hand account describes adults rushing at food; portions\
      \ and access for other fish deserve attention. The profile does not assign a specific high-protein bloat flag,\
      \ but that is no claim of immunity from digestive problems."

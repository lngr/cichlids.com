  habitat:
    text: "Native records include Cuban streams, lakes, vegetated wetlands and brackish river mouths. Vegetation\
      \ provides cover, while firm surfaces and a usable floor matter for foraging and reproduction. Garbe reported\
      \ this species in an eastern mountain tributary at 21 C, pH 8.5, 13 dGH and 9 dKH. The displayed natural ranges\
      \ combine that collecting evidence with regional river and reservoir chemistry, mostly without fish observations\
      \ at the sampling points. Their low confidence reflects that limitation; the voted temperature range of 22\
      \ to 30 C does not encompass every reported field reading. Brackish extremes and degraded deep reservoir layers\
      \ are excluded."
    sources:
    - kind: "literature"
      title: "Werner (2013). Not Just a Phantom: The Jotura From Cuba. Cichlid News."
      url: "https://www.cichlidnews.com/issues/2013jan/Xwerner.html"

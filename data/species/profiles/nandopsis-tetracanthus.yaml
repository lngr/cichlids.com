  socialBehavior:
    text: "Compatible adults form pairs, while other mature conspecifics can become targets. Remove surplus fish\
      \ when a pair starts driving them into corners. Breeding increases defence, but adults also need territorial\
      \ boundaries outside spawning. A female should not be assumed safe merely because a male has accepted her\
      \ before. Persistent pursuit, injury or loss of access to food requires separation. Keep refuges usable for\
      \ both partners and make a divider or spare housing practical before difficulties arise."
    sources:
    - kind: "database"
      title: "de Lange. Nandopsis tetracanthus, Cuban Cichlid. AquaInfo"
      accessed: "2026-10-13"

  sizeAndGrowth:
    text: "Plan for males reaching about 30 cm total length and females about 20 cm. The female estimate applies\
      \ a reported size proportion and is not a measured maximum. Other aquarium accounts describe smaller adults,\
      \ so these are planning estimates rather than guaranteed sizes. FishBase reports 20 cm standard length, which\
      \ excludes the tail. A group of juveniles will need a new arrangement once pairs form and start excluding\
      \ other fish."

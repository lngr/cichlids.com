  husbandry:
    text: "The selected minimum for one established adult pair is 900 L gross with a 250 by 60 cm footprint, based\
      \ on a tank 60 cm high. Provide secure large shelters, interrupted sight lines and enough open floor for the\
      \ adults to move between refuges. Digging can loosen decor and uproot plants. Strong filtration, surface movement\
      \ and regular water changes are important for these large feeders. Freshwater maintenance does not require\
      \ added salt. The decided tolerances are 21 to 30 C, pH 6 to 9, GH 3 to 26 dGH and KH 3 to 21 dKH; their outer\
      \ limits are less established than routine interior conditions. About 24 to 26 C and pH 7 to 8 have better\
      \ agreement among the main care sources. GH and alkalinity must be measured separately."
    sources:
    - kind: "literature"
      title: "Clarke. Nandopsis (Cichlasoma) tetracanthus. Practical Fishkeeping"
      accessed: "2026-10-13"

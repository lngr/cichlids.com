  breeding:
    text: "Both adults care for adhesive eggs on a cleaned firm surface. A sheltered pot may be used, but exposed\
      \ stones are also reported, so the breeding strategy is open-substrate spawning rather than obligatory cave\
      \ use. Clutches are often several hundred eggs, with substantial variation among reports. Defence of eggs\
      \ and young can disrupt an otherwise workable mixed aquarium. Once fry feed independently they need suitably\
      \ small foods and their own growing space. Plan housing for surplus young before repeated spawning."

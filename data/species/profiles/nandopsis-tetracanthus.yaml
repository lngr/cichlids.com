  problems:
    text: "Insufficient retreat space and keeping surplus adults after pair formation are common causes of injury\
      \ and sustained stress. Digging can destabilize shelters, and a previously tolerated companion may be attacked\
      \ during reproduction. An eager appetite makes overfeeding easy. Monitor water quality and social access when\
      \ a fish stops feeding, breathes abnormally or loses condition; these signs do not identify a specific disease.\
      \ Quarantine new fish and obtain qualified assessment for persistent health problems. Published lifespan figures\
      \ are approximate, with 8 to 12 years used here at low confidence."
    sources:

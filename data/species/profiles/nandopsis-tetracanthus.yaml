  sexing:
    text: "Adult males are generally larger and more robust, and may develop a slight forehead swelling and longer\
      \ fins. Females can show darker markings, particularly near reproduction. These traits vary with age and condition,\
      \ making young fish difficult to sex confidently. The genital papilla is easier to assess near spawning. A\
      \ male and female sold together are not necessarily compatible partners."
    sources:

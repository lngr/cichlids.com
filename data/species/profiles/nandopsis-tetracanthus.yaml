    rationale: "generator proposes 25.3 to 29.5; checker-a proposes 21 to 29; checker-b proposes 22.6 to 30; checker-c\
      \ proposes 21 to 31; tiebreaker-1 proposes 21 to 29.5; tiebreaker-2 proposes 22.6 to 29.5. The tally selects\
      \ the median of all minima and maxima, rounded to whole degrees, because no qualified majority settles the\
      \ natural interval. The resulting 22 to 30 C is a provisional regional summary, not the full measured envelope.\
      \ Garbe found this species at 21 C in a Rio Sagua tributary, while the eastern-reservoir study measured 23\
      \ to 31 C, so the wider source envelope of 21 to 31 C remains visible in evidence. Hanabanilla surface water\
      \ measured 25.3 to 29.5 C and shallow San Juan water 22.6 to 28.4 C. Except for the collecting report, these\
      \ measurements were not paired with identified fish. FishBase gives 24 to 30 C from an aquarium reference\
      \ and does not independently determine natural endpoints. The El Cacao paper cited by checker-a could not\
      \ be independently read through the permitted full-text route and is excluded from evidence."

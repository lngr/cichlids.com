  compatibility:
    text: "A dedicated pair aquarium is the most manageable arrangement, although the species-only flag is false\
      \ because published husbandry permits some robust large companions. Named safe pairings are not established\
      \ well enough here to promise success. Any mixed setup needs more room than the pair minimum, independent\
      \ retreats and the ability to remove fish. Small tetras and dwarf cichlids face predation and territorial\
      \ injury. Ten separate presumed crossing risks are retained, including ambiguous convict labels and domestic\
      \ Flowerhorn and blood-parrot lines. These reports do not prove free-choice mating or crossability between\
      \ every other partner in the list."

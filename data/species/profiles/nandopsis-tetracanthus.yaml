      \ safe named pairing."
    condition: "A larger tank than the adult-pair minimum, separate territories, similarly sized adults and immediate\
      \ separation available; compatibility can fail during breeding."
  - species: "Large armored catfish"
    reason: "Species-specific husbandry accounts consider large catfish possible, without verifying a particular\
      \ catfish species."
    condition: "A larger mixed setup with independent shelters and close observation; small individuals are prey\
      \ and large adults can be attacked."
  unsuitable:
  - species: "Paracheirodon innesi"
    reason: "Small adult tetras fall within the prey-size risk of a 30 cm level-2 predator."
  - species: "Apistogramma cacatuoides"
    reason: "Small dwarf cichlids lack the size and robustness required against these adult territorial fish."
  - species: "Nandopsis haitiensis"
    reason: "A weak reported cross gives a presumed pairwise risk, in addition to incompatible territorial behavior."
  - species: "blood parrot cichlid"
    reason: "Named Cuban x blood-parrot offspring are reported without verified mate-choice circumstances, giving\
      \ a presumed crossing risk."
profile:
  overview:
    text: "Nandopsis tetracanthus is the Cuban cichlid or biajaca, a pale fish marked with dark spots and connected\
      \ patches. It is native to Cuba and retains its legacy genus name. Cuba also has Nandopsis ramsdeni, so the\
      \ biajaca is not its only native cichlid. The recommended adult social unit is a compatible pair, with enough\
      \ space to retreat and a practical way to separate incompatible fish. Juveniles should be bought with their\
      \ eventual size and housing already in mind."
    sources:
    - kind: "catalog-of-fishes"
      title: "Eschmeyer's Catalog of Fishes: species of Nandopsis, updated 21 September 2026"
      accessed: "2026-10-13"
      url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Nandopsis"
      archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-ee194369/2026-10-14T101657Z

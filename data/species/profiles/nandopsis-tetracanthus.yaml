  note: "The Catalog retains Nandopsis tetracanthus as valid, so the legacy and current genus queries are identical.\
    \ It recognizes Nandopsis ramsdeni as another native Cuban species. Historical Cuban subspecies are synonyms\
    \ in the Catalog; CRC retains older subspecies labels. Acara cubensis is included only as an unavailable name,\
    \ and Chromis fuscomaculatus is an alternate historical spelling of the synonym listed here.
    The legacy catalog also held the species under Cichlasoma tetracanthus, and that entry maps to this profile."

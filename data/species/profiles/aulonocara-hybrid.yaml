partners:
  suitable:
    - species: Labidochromis caeruleus
      reason: Calm mbuna of similar size with a different colour pattern; does not provoke the peacock males.
      condition: Tank of at least 120 cm; OB lines carry mbuna genes, so watch for crosses and remove doubtful fry.
    - species: Copadichromis borleyi
      reason: Mid-water planktivore that uses another tank zone and has a different body shape.
      condition: Tank of at least 150 cm.
    - species: Cyrtocara moorii
      reason: Peaceful sand-dwelling haplochromine of moderate temperament with the same water needs.
      condition: Tank of at least 150 cm.
    - species: Placidochromis electra
      reason: Calm, sand-oriented Malawi haplochromine that tolerates peacock males.
      condition: Tank of at least 150 cm.
  unsuitable:
    - species: Aulonocara stuartgranti
      reason: Crosses with the hybrids; the pure line is lost and males fight as rivals.
    - species: Aulonocara jacobfreibergi
      reason: Crosses with the hybrids; females of both are hard to tell apart.
    - species: Aulonocara baenschi
      reason: Crosses with the hybrids; the pure line is lost.
    - species: Melanochromis auratus
      reason: Very aggressive mbuna that harasses the calmer peacocks.
    - species: Tropheus moorii
      reason: Lake Tanganyika aufwuchs feeder with different water needs; it needs a species tank and a low-protein diet.
profile:
  overview:
    text: This entry covers the colourful peacock hybrids sold in the trade under names such as OB peacock, Calico, Dragon Blood, Strawberry, Red peacock or Fire Fish. None of them occurs in nature. They were created in captivity by crossing Aulonocara with each other and with other Lake Malawi cichlids, most likely blotched mbuna and possibly haplochromines, followed by years of line breeding. As a result, the lines differ in colour and temperament, and two fish of the same batch can look quite different. In shape and feeding they resemble true peacocks. They are hardy and bright, but they must never be kept with described Aulonocara species, because they cross with them and spoil pure lines. Their offspring cannot be passed on as a pure species.
    sources:
      - kind: literature
        title: Schäfer, F. (2021). Aulonocara 'Dragon Blood'. Aquarium Glaser fish archive
        url: https://aquariumglaser.de/en/fish-archives/aulonocara-dragon-blood-2
        archived: aquariumglaser.de/en/fish-archives/aulonocara-dragon-blood-2/2026-10-14T094617Z
        accessed: 2026-10-12
      - kind: database
        title: Fishkeeper (Maidenhead Aquatics) fish databank, Hybrid Peacock (Aulonocara sp.)
        url: https://www.fishkeeper.co.uk/fish/freshwater/cichlids/calico-peacock
        archived: fishkeeper.co.uk/fish/freshwater/cichlids/calico-peacock/2026-10-14T094618Z
        accessed: 2026-10-12
      - kind: literature
        title: Elieson, M. The OB Peacock. Cichlid-Forum.com article library (archived copy)
        url: https://web.archive.org/web/20160308032736/http://www.cichlid-forum.com/articles/ob_peacock.php
        archived: web.archive.org/web/20160308032736/http_/www.cichlid-forum.com/articles/ob_peacock.php/2026-10-14T094619Z
        accessed: 2026-10-12
  habitat:
    text: The hybrids have no natural range; they are bred on fish farms and by hobbyists. Their ancestors live in Lake Malawi, mainly in the transition zone between rocky shores and open sand, where peacocks hover above the bottom in search of small invertebrates. The lake water is warm, clear and moderately alkaline, with a pH of about 7.7 to 8.6, a low total hardness of 3 to 5 dGH and a somewhat higher carbonate hardness of 5 to 8 dKH. Temperatures range from 21 to 29 C. These are the reference values for the hybrids as well.
    sources:
      - kind: literature
        title: "Branchu, P., Bergonzini, L., Ambrosi, J.-P., Cardinal, D., Delalande, M., Pons-Branchu, E. et al. (2010). Hydrochemistry (major and trace elements) of Lake Malawi (Nyasa), Tanzanian Northern Basin: local versus global considerations. Hydrology and Earth System Sciences Discussions 7, 4371-4409."
        url: https://hess.copernicus.org/preprints/7/4371/2010/hessd-7-4371-2010.pdf
        archived: hess.copernicus.org/preprints/7/4371/2010/hessd-7-4371-2010.pdf/2026-10-14T094507Z
        accessed: 2026-10-12
      - kind: literature

  predation:
    value: 1
    confidence: medium
    rationale: The parent Aulonocara are benthic micropredators that detect insect larvae, crustaceans and molluscs in the sand, and the field study of the genus adds that small fish may be taken as well (Grant et al. 1987). The hybrids keep this way of feeding (Aquarium Glaser, Fishkeeper). FishBase lists only invertebrates for A. stuartgranti and A. baenschi, which on its own would mean level 0, but adults take fry and very small fish when they get the chance, which is why breeders raise peacock fry apart from the adults (archive). No source reports hunting of larger fish, so level 1 applies. Lines with more haplochromine or mbuna ancestry may behave differently; no source documents this.

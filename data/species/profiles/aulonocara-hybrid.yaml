    value: maternal-mouthbrooder
    confidence: high
    rationale: Like all Aulonocara, the hybrids are maternal mouthbrooders. The male digs a pit or cleans a flat stone, the female takes the eggs into her mouth right after laying and they are fertilised there while she nibbles at the egg spots on the male's anal fin; she carries the brood for about three to four weeks. The hybrids are fertile and breed readily, also with other peacocks.

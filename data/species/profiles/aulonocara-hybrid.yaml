    confidence: high
    rationale: "Hybrids take the habitat values of their parent species. The Aulonocara parents and, in the OB lines, the mbuna parents are endemic to Lake Malawi, so the value is the measured lake range: about 21 C in cool-season inshore water (Eccles 1974), 23.5 C in the winter epilimnion and up to 28 to 29 C in summer surface water (Vollmer et al. 2005 and later campaigns)."

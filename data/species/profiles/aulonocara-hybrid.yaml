  problems:
    text: "The main risk lies in keeping them with pure peacocks: the resulting offspring are hybrids that often end up in shops without being labelled. A frequent keeping mistake is a tank with many males and few females, which leads to fighting. Overfeeding, especially with rich food, together with poor water quality, can trigger bloat, which shows as a swollen belly, loss of appetite and white stringy faeces; frequent water changes and moderate feeding help prevent it. Hybrids of uncertain background vary in temperament, so a new batch should be watched closely."

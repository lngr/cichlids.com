  aggressionConspecific:
    value: 2
    confidence: medium
    rationale: Males form a clear hierarchy, chase rival males and press females, and the dominant male suppresses the colour of the others. With one male and four or more females in a large tank injuries are rare (Seriously Fish for the parent species, Fishkeeper, LiveAquaria for the OB line), which is level 2. The hybrid lines are livelier than pure peacocks, which Fishkeeper attributes to mbuna genes, and individual males reach level 3, especially with too many males or too few females (Aquarium Glaser, LiveAquaria for Dragon Blood, archive).

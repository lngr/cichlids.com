  compatibility:
    text: "Good tankmates are calm Malawi cichlids of similar size with different colours and body shapes, such as Labidochromis caeruleus, Cyrtocara moorii, Copadichromis borleyi or Placidochromis electra. Never combine them with described Aulonocara species: the females look alike, the fish cross readily and the pure lines are lost. OB lines carry mbuna genes and can cross with mbuna as well, so mbuna tankmates should differ clearly in pattern and doubtful fry should not be passed on. Very aggressive mbuna such as Melanochromis auratus harass them. Cichlids from other lakes, such as Tropheus, need different water and food."
    sources:

  sexing:
    text: Adult males are larger, brighter and show longer, pointed dorsal and anal fins with egg spots on the anal fin. Females are smaller with rounded fins. In blotched lines both sexes can show the blotch pattern, and in albino lines such as Strawberry or Dragon Blood the females may show pinkish or reddish tones, which makes sexing harder than in pure peacocks. Venting is the most reliable method.
    sources:

    tolerance:
      value:
        min: 21
        max: 29
      confidence: medium
      rationale: Aquarium ranges for the parent species and the hybrid lines lie between 22 and 29 C. FishBase gives 22 to 26 C for A. stuartgranti and A. baenschi, 23 to 27 C for A. hansbaenschi and 24 to 26 C for A. jacobfreibergi; Seriously Fish gives 23 to 29 C for A. stuartgranti and 25 to 29 C for A. jacobfreibergi and A. baenschi. For the hybrids themselves Fishkeeper gives 22 to 26 C and LiveAquaria about 23 to 28 C; OATA gives 23 to 27 C for Malawi cichlids in general. The tolerance has to contain the natural lake range of 21 to 29 C. The lower bound rests on cool-season lake water only, since no aquarium source goes below 22 C, and no source supports keeping the fish above 29 C for years. Confidence is medium because the sources agree only roughly and none studies the hybrids over years.

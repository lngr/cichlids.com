  note: "Collective entry for the man-made peacock hybrids of the trade: OB (orange blotch) and Calico peacocks, Dragon Blood, Strawberry, Red or Tangerine peacocks, Fire Fish and similar lines, including albino forms. They are no taxon, have no valid scientific name and no wild population. The Catalog of Fishes lists only the described Aulonocara species, all endemic to Lake Malawi. Trade accounts name A. stuartgranti, A. baenschi and A. jacobfreibergi as the usual Aulonocara parents and a blotched mbuna, possibly with a haplochromine, for the OB lines, but no line has a documented pedigree, so no parent ids are given."

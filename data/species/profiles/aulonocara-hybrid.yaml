  diet:
    value:
      type: invertivore
      bloatSensitive: false
      foods:
        - fine sinking pellets and granules
        - flake food with Spirulina
        - frozen Mysis, Artemia and mosquito larvae
        - some vegetable matter
    confidence: medium
    rationale: The parent species sift the sand for small invertebrates (FishBase, Seriously Fish, Grant et al. 1987), and the hybrids feed the same way (Aquarium Glaser), so the type is invertivore. Fishkeeper, LiveAquaria and AquariumSource call peacocks omnivores because they accept mixed prepared food; that describes the aquarium menu, not the feeding type. AquariumSource warns of Malawi bloat from excess meaty food, but no reliable source describes peacocks as prone to bloat the way aufwuchs grazers are, so the flag is not set. Moderate feeding with some plant-based food stays advisable, above all for OB lines with mbuna ancestry.

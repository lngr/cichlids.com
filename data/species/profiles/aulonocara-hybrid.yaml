  sizeAndGrowth:
    text: Adult males of most lines reach about 12 to 14 cm and females stay at about 10 cm, which matches the medium-sized Aulonocara species. Some lines remain smaller, others grow to 15 cm. The fish grow quickly when fed well, and males start to show colour at a few centimetres. Full colour, however, takes a year or more and is strongest in the dominant male. Juveniles of many lines look plain grey or pinkish, and blotched lines show their pattern early.
    sources:
      - kind: database
        title: Fishkeeper (Maidenhead Aquatics) fish databank, Hybrid Peacock (Aulonocara sp.)

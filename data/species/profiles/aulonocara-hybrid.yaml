  ghDgh:
    value:
      min: 3
      max: 5
    confidence: high
    rationale: "Hybrids take the habitat values of their Lake Malawi parent species. The lake is soft water: calcium and magnesium give 4.2 to 4.6 dGH in the upper 50 m of the north basin (Branchu et al. 2010) and 3.2 to 4.9 dGH in the titrations of the 1960s (Jackson et al. 1963, Talling and Talling 1965, compiled by FAO). Care sheets that call for 10 to 25 dGH describe aquarium practice and confuse hardness with alkalinity; they are no source for habitat values."

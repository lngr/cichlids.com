  breeding:
    text: Breeding works like in pure peacocks. The male digs a shallow pit or cleans a flat stone and displays to the females. A willing female circles with him, lays a few eggs at a time and picks them up at once; the eggs are fertilised in her mouth while she nibbles at the egg spots on the male's anal fin. She carries the brood for about three to four weeks without eating much. Moving her to a separate tank before release raises the number of surviving fry. The offspring are hybrids and should be sold as such.
    sources:
      - kind: database
        title: Fishkeeper (Maidenhead Aquatics) fish databank, Hybrid Peacock (Aulonocara sp.)

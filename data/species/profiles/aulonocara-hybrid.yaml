variants:
  - name: OB peacock (orange blotch)
    kind: color-morph
    note: Blotched or marbled pattern on an orange, yellow, blue or pinkish ground; females also blotched.
  - name: Calico peacock
    kind: color-morph
    note: Trade name for heavily blotched OB lines.
  - name: Dragon Blood
    kind: color-morph
    note: Salmon-coloured juveniles; adult males red with blue freckle-like markings and blue fin edges.
  - name: Strawberry peacock
    kind: color-morph
    note: Pink to red line, often albino with red eyes.
  - name: Red peacock (also sold as Ruby Red, Tangerine)
    kind: color-morph
    note: Orange to red lines without blotches.
  - name: Fire Fish
    kind: color-morph
    note: Red to orange line traded under this name by importers.

    tolerance:
      value:
        min: 5
        max: 15
      confidence: low
      rationale: Few sources state a carbonate hardness; Seriously Fish, FishBase and Fishkeeper give none. OATA recommends 10 to 15 dKH for Malawi cichlids, LiveAquaria 10 to 15 dKH for the OB peacock and 10 to 20 dKH for Dragon Blood, a German retailer 6 to 30 dKH for a red line, and two peacock care guides 4 to 6 dKH. The lower bound is the natural 5 dKH, which the tolerance has to contain; below that the pH of a stocked tank becomes unstable, so the single figure of 4 is not adopted. The upper bound of 15 dKH follows OATA and the OB care sheet; the higher figures come from single retailers. An archive tank with peacocks ran at 9 dKH. Confidence is low because only a handful of sources give numbers and they differ widely.

  socialBehavior:
    text: Males are territorial and claim a spawning site, from which they drive away rivals and fish of similar shape and colour. Females live in a loose group. With one male and several females in a large enough tank, chasing remains mostly harmless. Too many males, or too few females, lead to constant fighting and stressed fish. Because some lines carry mbuna ancestry, individuals can be noticeably more aggressive than pure peacocks, and the temperament of a given batch is hard to predict.
    sources:
      - kind: database
        title: Fishkeeper (Maidenhead Aquatics) fish databank, Hybrid Peacock (Aulonocara sp.)

      confidence: low
      rationale: "The proposals in vote order are 3 to 20, 3 to 25, 3 to 25, 3 to 25 and 3 to 20 dGH.
        No qualified majority exists. The median bounds give 3 to 25 dGH with low confidence
        and contain the natural ancestral range of 3 to 5 dGH without widening. Care-sheet
        minima of 6 to 12 do not establish a requirement for high total hardness, because
        the wild ancestors inhabit softer, alkaline water. Seriously Fish gives 10 to 25 dGH
        for the parent species and Fishkeeper up to 25 for hybrids. Other source maxima are
        15 in FishBase for A. hansbaenschi, Fishipedia and one OB retailer sheet, 18 in
        OATA, 19 in FishBase for A. jacobfreibergi, 20 in OB retailer sheets, and 30 in
        FishBase for A. baenschi and A. maylandi and a red-line retailer sheet. These upper
        limits have a median of 20 across the care sources, but the vote median is 25.
        Keeping at 20 to 25 dGH is plausible from the sources allowing it, although
        long-term endpoint outcomes are undocumented. An archive peacock tank runs at 13
        dGH."

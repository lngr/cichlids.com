  husbandry:
    text: A tank of 120 cm length with a base depth of at least 45 cm suits one male with four or more females; groups with several males need a larger tank. Use fine sand, since peacocks sift the bottom for food, and build stable rock piles that leave open sand between them. Good filtration and regular water changes keep nitrate low. The fish do well at 24 to 28 C and pH 7.5 to 8.6; a carbonate hardness of 5 to 15 dKH keeps the pH stable, and the total hardness does not need to exceed 20 dGH, so moderately hard tap water usually works well. Dark substrate and some shade bring out the colours better than bright white sand.
    sources:
      - kind: database
        title: Fishkeeper (Maidenhead Aquatics) fish databank, Hybrid Peacock (Aulonocara sp.)
        url: https://www.fishkeeper.co.uk/fish/freshwater/cichlids/calico-peacock

  khDkh:
    value:
      min: 5
      max: 8
    confidence: high
    rationale: Hybrids take the habitat values of their Lake Malawi parent species. Alkalinity of 2.33 to 2.46 meq/L (Branchu et al. 2010) and 2.00 to 2.59 meq/L (Jackson et al. 1963, compiled by FAO) corresponds to 5.6 to 7.3 dKH, so the lake range is 5 to 8 dKH. Carbonate hardness exceeds total hardness because sodium balances part of the bicarbonate.
    sources:
      - kind: literature
        title: "Branchu, P., Bergonzini, L., Ambrosi, J.-P., Cardinal, D., Delalande, M., Pons-Branchu, E. et al. (2010). Hydrochemistry (major and trace elements) of Lake Malawi (Nyasa), Tanzanian Northern Basin: local versus global considerations. Hydrology and Earth System Sciences Discussions 7, 4371-4409."

  diet:
    text: In nature their ancestors pick small invertebrates from the sand. In the aquarium these hybrids take almost any food. A good base is a quality sinking pellet or granule for Malawi cichlids, complemented by flake food containing Spirulina. Frozen Mysis, Artemia or mosquito larvae add variety. Feed small portions once or twice a day rather than large meals, because overfeeding protein-rich food can cause digestive problems. Some vegetable matter in the diet helps keep the fish in good condition.

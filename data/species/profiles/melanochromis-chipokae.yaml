      decision:
        continent: Africa
        region: Lake Malawi
        waterbody: lake-malawi
        localities:
          - Chidunga Rocks near Chipoka
      rationale: "The Catalog of Fishes and the 2012 redescription locate this Lake Malawi endemic at
        Chidunga Rocks near Chipoka. The redescription found it only at that reef and rejected the
        older identification from Mumbo and Thumbi West. Malawi Mayhem lists additional islands and
        Aqua-Pedia lists Mphanga, but neither outweighs the examined material and species-specific
        field account."

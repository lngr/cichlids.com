  territory:
    value:
      size: large
      breedingOnly: false
    confidence: medium
    rationale: "Generator and checker-a proposed a large permanent territory; checker-b and checker-c
      proposed a small breeding-only territory. The rubric concerns adults in an aquarium. Seriously
      Fish describes sustained territorial dominance beyond a spawning spot, and NVC explicitly
      distinguishes permanent aquarium territories from weak breeding-related wild territoriality.
      The large permanent value therefore wins. Konings and Stauffer encountered no territorial
      males in the lake, but absence of that behavior in wild observations does not define the
      confined aquarium footprint."

      rationale: "The qualified-majority tally selects piscivore with bloatSensitive false at medium
        confidence: generator, checker-b, checker-c and tiebreaker-1 proposed this combination;
        checker-a and tiebreaker-2 proposed invertivore with the same false flag. The exact decided
        food list is retained. CRC explicitly identifies piscivory, whereas the 2012 redescription
        and its FishBase summary emphasize larger invertebrates and treat fish prey as uncertain.
        Seriously Fish describes fry, crustaceans and algae; Maidenhead, Fishipedia, Malawi-Guru and
        Aqua-Pedia describe mixed feeding. Oliver reports mixed stomach contents from fish
        identified as M. cf. chipokae at Thumbi West, but the revision questions that
        identification, so those data cannot settle the true Chidunga species diet. The false flag
        is an inference from animal-prey feeding and husbandry advice, not immunity to bloat. The
        dissenting Aqua-Pedia protein-related bloat warning is retained; no controlled
        species-specific feeding trial resolves it."

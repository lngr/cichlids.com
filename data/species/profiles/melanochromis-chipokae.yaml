  habitat:
    text: "Chidunga Rocks near Chipoka in southwestern Lake Malawi is the confirmed locality in the
      modern redescription. The reef reaches roughly 6 to 7 m depth, and fish move through the
      transition between rock and sand. Older accounts using similar fish from other islands need
      caution because their identification was questioned in the revision. Lake studies describe low
      calcium-and-magnesium hardness alongside moderate alkalinity. The natural values here combine
      measured lake conditions and should not be mistaken for aquarium recommendations from care
      sheets."

      decision:
        min: 5
        max: 14
      rationale: "The median tally selects 5 to 14 dKH at low confidence. Generator proposed 5 to 18,
        checker-a 5 to 15, checker-b and checker-c each 5 to 8, tiebreaker-1 5 to 12, and
        tiebreaker-2 5 to 20 dKH. No proposal reaches a qualified majority: the minimum median is 5
        and the maximum median is 13.5, rounded to 14. This avoids allowing the narrowest proposal
        to turn the natural 8 dKH upper bound into an unsupported aquarium ceiling. It contains the
        natural 5 to 8 interval and remains plausible in alkaline Malawi aquaria. Wider
        recommendations are Aqua-Pedia 10 to 18 dKH and Malawi-Guru 6 to 20 dKH; JBL recommends 5 to
        10 dKH. A chipokae aquarium reports 10 dKH, and Practical Fishkeeping reports 12 dKH supply
        water in an established Malawi fish house without identifying chipokae there. Another 10 dKH
        aquarium history includes later unexplained losses, so it does not verify long-term health.
        No experiment establishes 14 as a true upper limit. GH-only figures on Seriously Fish and
        Maidenhead are retained as inherited evidence with an explicit qualification and are never
        converted into KH."

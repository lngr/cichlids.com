  predation:
    value: 3
    confidence: low
    rationale: "The conservative tally fixes level 3 at low confidence. Generator and checker-a proposed
      1, checker-b proposed 3, checker-c proposed 2, tiebreaker-1 proposed 3, and tiebreaker-2
      proposed 1. No level obtained the required four agreeing votes, so the rule selects the
      highest proposed risk. CRC explicitly classifies piscivory, and NVC and Malawi.si describe
      small-fish feeding, which make level 3 plausible. Seriously Fish identifies fry, while Konings
      and Stauffer observed invertebrate searching and left fish consumption uncertain; FishBase
      repeats that observation rather than supplying an independent field study. Neither stomach
      proportions nor a prey-size threshold are established. Aggression and fish deaths in forum
      accounts are not proof of consumption."

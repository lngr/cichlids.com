  note: "The Catalog of Fishes accepts Melanochromis chipokae Johnson, 1975 in its original genus. No
    genus transfer is required. The generator listed Pseudotropheus chipokae as an obsolete trade
    combination, but the read Catalog does not list it as a synonym, so it is not promoted to an
    accepted synonym. Melanochromis loriae is a distinct species; the 2012 revision explains
    confusion caused by interchanged original photographs."

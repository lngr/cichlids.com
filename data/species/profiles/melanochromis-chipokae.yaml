    rationale: "The settled natural interval is 3 to 5 dGH. Historical calcium and magnesium
      concentrations compiled by FAO give approximately 3.2 to 4.9 dGH, while Branchu Table 2 gives
      approximately 4.2 to 4.6 dGH in the upper 50 m. These measured ions support soft lake water.
      FishBase lists the wider 7 to 18 dH interval and care sources recommend up to 25 dGH; neither
      is substituted for natural lake chemistry."

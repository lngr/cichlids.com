    tolerance:
      value:
        min: 21
        max: 29
      confidence: medium
      rationale: "Generator, checker-a, checker-b and checker-c all proposed 21 to 29 C, and the unanimous
        tally retains it at medium confidence. The species-specific care interval is 24 to 28 C on
        Seriously Fish, 24 to 26 C on Maidenhead, and 24 to 27 C on Aqua-Pedia; Aquaryus gives 21 to
        26 C. The decided interval is widened to include the settled natural lake range, not derived
        from a long-term endpoint trial. Stable mid-twenties husbandry is supported more directly
        than continuous exposure to either endpoint."

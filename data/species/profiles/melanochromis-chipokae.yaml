  problems:
    text: "Social stress is the best-supported recurring problem. Persistent hiding, missed meals,
      damaged fins and repeated pursuit can precede severe injury or death. The absolute minimum
      aquarium and minimum female ratio do not guarantee that every individual will coexist.
      Chemistry can also be misunderstood: general hardness describes calcium and magnesium, while
      carbonate hardness here follows alkalinity, so a GH care figure cannot establish a KH limit.
      The 5 to 14 dKH tolerance is a low-confidence median of proposals, not a demonstrated
      physiological boundary. Longevity is also uncertain, with a provisional estimate of 5 to 8
      years."

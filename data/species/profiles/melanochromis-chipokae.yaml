  khDkh:
    value:
      min: 5
      max: 8
    confidence: high
    rationale: "The settled natural interval is 5 to 8 dKH at high confidence, without a verification
      object. Historical lake alkalinity compiled by FAO converts to about 5.6 to 7.3 dKH and
      Branchu profiles to about 6.5 to 6.9 dKH. The range rounds the combined measurements outward.
      Bicarbonate also balances sodium, so this alkalinity-derived value can exceed
      calcium-and-magnesium GH."

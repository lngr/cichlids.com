      proposed 15 and 13 cm. The sex-specific medians are 12 and 10 cm and are retained as
      provisional typical adult estimates. Fishipedia independently gives a 12 cm dominant-male
      maximum, while FishBase, Seriously Fish and Malawi.si give 12 cm standard length, which
      excludes the tail. Maidenhead gives 14 cm without a measuring method and NVC reports aquarium
      fish reaching 17 cm, so larger full-length adults are possible. No source establishes a female
      maximum: 10 cm is an estimate from the smaller female size, not a measured limit. Some
      inherited evidence pairs append an estimated female figure to an unsexed or male measurement."

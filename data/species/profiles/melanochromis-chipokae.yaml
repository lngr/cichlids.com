  sexing:
    text: "Breeding males combine a blue-black body with pale blue horizontal bands and a blue dorsal
      region. Females and young fish are mainly yellow with dark bands; immature or subordinate
      males can retain this appearance. That overlap makes visual sexing uncertain before maturity.
      Females also resemble some other striped mbuna, including Melanochromis auratus. Chipokae has
      a relatively pointed snout, and its tail striping extends across more of the fin, but
      identification should consider several characters and the provenance of the fish together."
    sources:

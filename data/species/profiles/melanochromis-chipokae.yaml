  socialBehavior:
    text: "Aquarium territoriality can be much stronger than the behavior reported from the lake. A male
      may dominate a substantial part of the tank continuously, harassing rival males and courting
      females persistently. One male with at least three females is the minimum recommended
      arrangement in this profile; another care source prefers five or more females. No ratio
      guarantees safety. A fish that stays hidden, loses access to food or develops injuries needs
      prompt attention and a way to escape sustained contact. Several adult males create a
      particularly serious risk."

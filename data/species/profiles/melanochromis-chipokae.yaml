  husbandry:
    text: "The decided minimum is approximately 205 L with a 120 by 45 cm footprint for one male and at
      least three females. It is an absolute floor from a species-specific care account;
      recommendations of 150 cm length or 500 L reflect the additional room other specialists
      prefer. Build stable rock cover with several escape routes and gaps that interrupt sightlines,
      leaving sand between the structures. Maintain oxygenation and consistent water quality. The
      natural lake ranges and aquarium tolerance intervals serve different purposes; neither makes
      abrupt changes or crowding harmless."
    sources:

  diet:
    text: "For planning, the decided diet is piscivore with a broader food list that includes
      invertebrates and algae. CRC labels it piscivorous, but the species-specific field revision
      describes hunting larger invertebrates and leaves small-fish feeding uncertain. An older mixed
      stomach sample concerns fish from a locality whose identification was later questioned. Offer
      varied suitable prepared and frozen foods with a supplementary plant component. The false
      bloat-sensitivity flag means that an unusual protein-related susceptibility is not established
      for this species; it does not mean digestive illness cannot occur."

  aggressionConspecific:
    value: 4
    confidence: high
    rationale: All four complete runs select level 4. Seriously Fish and Maidenhead describe potentially
      fatal aggression against rival males and unreceptive females even when routine care is
      otherwise appropriate. Forum experiences support severe risk but do not establish a lower safe
      severity. Wild observations of nonterritorial individuals do not override the aquarium
      social-risk evidence.

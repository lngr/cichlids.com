partners:
  suitable:
    - species: Robust Lake Malawi mbuna with compatible animal-food requirements
      reason: "Species-specific care literature allows similarly sized robust mbuna with a different
        pattern, but it does not verify a safe named pairing."
      condition: "Assess adult size, diet and hybrid groups individually; provide more room for a
        community than the minimum harem footprint and a way to separate targeted fish."
  unsuitable:
    - species: Melanochromis auratus
      reason: "Shares the presumed melanochromis hybrid group and similar striped appearance, with
        substantial aggression risk."
    - species: Labidochromis caeruleus
      reason: "Its comparatively mild behavior makes it vulnerable to persistent harassment, even when
        water requirements overlap."
    - species: Aulonocara stuartgranti
      reason: "The calmer peacock temperament is poorly matched to aggressive chipokae, as
        species-specific care guidance and archive experience warn."
profile:
  overview:
    text: "The strongest challenge with Melanochromis chipokae is managing its relationships with other
      fish. A dominant adult may seriously injure rivals and females, so this is a demanding species
      despite familiar Malawi water requirements. Mature males develop blue-black bodies with
      contrasting horizontal bands; yellow females and young males look very different. The current
      accepted genus remains Melanochromis. This profile treats its feeding as piscivorous for
      compatibility planning, while keeping the uncertainty about how much fish it eats visible."
    sources:
      - kind: catalog-of-fishes
        title: "Eschmeyer's Catalog of Fishes: species in Melanochromis"
        url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=specie\
          s&genus=Melanochromis"
        accessed: 2026-10-13
        archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-47778a91/2026-10-14T101529Z
      - kind: database

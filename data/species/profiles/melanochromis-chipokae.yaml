  compatibility:
    text: "A mixed aquarium is possible only with robust fish of comparable adult size and a different
      appearance. The decided predation level is 3 as a conservative low-confidence choice, so small
      fish and fry remain potential prey even though the exact natural diet is unresolved. Peaceful
      peacocks, utaka and mild mbuna are poor matches for its aggression. Other members of the
      melanochromis hybrid group also bring presumed crossing risk. Candidate companions need
      compatible feeding requirements as well as matching water tolerances; temperament alone does
      not establish a safe combination."

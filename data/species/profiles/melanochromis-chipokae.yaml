  minTank:
    value:
      volumeL: 205
      lengthCm: 120
      depthCm: 45
    confidence: medium
    rationale: "Generator proposed 500 L with a 160 by 60 cm footprint; checker-a, checker-b and
      checker-c proposed 205 L with a 120 by 45 cm footprint. The separate medians are therefore 205
      L, 120 cm and 45 cm. Seriously Fish explicitly supplies that footprint and approximate volume
      as an absolute minimum and recommends one male with at least three females. Maidenhead gives
      at least four feet in length; its volume and depth were inferred in inherited evidence. Malawi
      Mayhem gives 50 US gallons, about 189 L, without a footprint. Wider recommendations are
      retained: Malawi.si gives 500 L, NVC at least 150 cm length, and Cichlid Atlas about 80 to 90
      US gallons and a six-foot-class length, approximately 303 to 341 L and 183 cm. The more
      detailed high-trust minimum is selected; the minimum is not a guarantee for multiple males or
      an arbitrary community."

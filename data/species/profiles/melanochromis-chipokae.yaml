  sizeAndGrowth:
    text: "The retained typical adult estimates are 12 cm for males and 10 cm for females. The female
      maximum is provisional, and several databases express the male figure as standard length,
      excluding the tail. Other husbandry accounts give 14 cm and aquarium individuals up to 17 cm,
      so a larger adult is possible. Young and subordinate males may remain in the yellow pattern
      for some time. Growth or color alone therefore does not establish sex or justify adding
      another apparent female to a group."

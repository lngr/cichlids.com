  temperatureC:
    value:
      min: 21
      max: 29
    confidence: high
    rationale: "The settled lake decision is 21 to 29 C at high confidence. It combines seasonal and
      spatial Lake Malawi observations described by Eccles, Vollmer and colleagues, and the Ngochera
      dissertation, rather than a species-specific experiment at Chidunga Rocks. The historical FAO
      surface record is narrower at 23 to 25 C. The inherited attribution of the complete interval
      to Branchu is a compilation, not a direct temperature range measured in that paper. The Eccles
      full text was refused as not open access by fetch-oa and its DOI landing page returned HTTP
      403; its inherited bibliographic citation is retained as offline, while directly read seasonal
      evidence comes from Vollmer and the FAO compilation."

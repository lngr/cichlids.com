  breeding:
    text: "The female incubates eggs and developing young in her mouth. Aquarium accounts describe
      spawning near a prepared substrate site, followed by roughly three weeks of maternal care and
      release of free-swimming fry. The male contributes no mouthbrooding care. Courtship can injure
      a female that does not spawn, which makes shelter and escape routes essential even in a
      breeding setup. Moving a holding female can also disturb the brood. Hybrid risk remains
      relevant when similar Melanochromis are present, although the group warning is presumed rather
      than a verified named cross."

  compatibility:
    text: "Calm adults with compatible warm, soft-water care requirements are the best candidates for a spacious\
      \ community. Mesonauta insignis and Biotodoma wavrini were observed with this species, while angelfish were\
      \ reported from deeper shared pools. Such co-occurrence identifies possible companions but does not prove\
      \ aquarium compatibility. Allow separate cover and space beyond the pair minimum. Tiny fish can be eaten opportunistically,\
      \ and habitual fin nippers threaten the trailing fins. Strongly aggressive cichlids or large predators can\
      \ cause serious problems. Breeding adults may exclude tankmates from a large area, so an established community\
      \ can require separation. No supported hybrid group is recorded; that evidence gap does not guarantee reproductive\
      \ isolation."
    sources:
    - kind: literature
      title: "Gay (2009). Habitat Expert: Acarichthys heckeli. Practical Fishkeeping, November 2009"

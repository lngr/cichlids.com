  problems:
    text: "The most serious keeping mistake is judging adult behavior from a peaceful juvenile group. Aggression\
      \ can damage fins or isolate a weaker partner before it becomes obvious during feeding. Digging can undermine\
      \ decorations and uproot plants, so check the layout regularly. Poor water maintenance increases the risk\
      \ of damaged skin and fins, head erosion and poor growth. Very warm water also demands careful oxygenation.\
      \ Introduce new fish through quarantine and investigate changes in appetite, breathing or body condition.\
      \ These signs warrant a water-quality check and qualified help rather than an assumed diagnosis."

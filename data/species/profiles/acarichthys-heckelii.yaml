  sexing:
    text: "Appearance alone is unreliable in young fish. A mature female in reproductive condition often has a fuller\
      \ body; males may grow larger and develop longer fin extensions. These tendencies overlap and are not precise\
      \ measurements. Vivid color or a single long streamer does not reliably establish sex. Assess mature fish\
      \ over time, combining body shape with reproductive behavior. The equal 20 cm planning maxima in the features\
      \ reflect the available aquarium size evidence, not a claim that males and females have identical growth."
    sources:

    rationale: "All four runs assign cave-spawner. Gay describes reproductive pairs in excavated bank burrows; Seriously\
      \ Fish and Bednarczuk describe enclosed nesting chambers and biparental care; FishBase records hole nesting.\
      \ Aquarium pots or other enclosed cavities can provide substitute spawning sites. CRC independently verifies\
      \ the classification but is not its origin. This is substrate spawning inside shelter, rather than mouthbrooding."

  husbandry:
    text: "The planning minimum is 450 litres with a floor around 150 by 60 cm for one established compatible adult\
      \ pair. A group or a mixed community needs appreciably larger quarters. Fine sand permits excavation; wood,\
      \ stable caves and robust plants attached to furnishings can divide sightlines and shelter weaker fish. Leave\
      \ open swimming space above the bottom and secure heavy decorations against digging. Use a mature biological\
      \ filter, effective waste removal and quiet resting areas. Around 26 to 29 C and pH 6 to 7.2 have stronger\
      \ routine husbandry support than the broad tolerance endpoints. The recorded 24 to 32 C, pH 4.5 to 8, GH 0\
      \ to 12 and KH 0 to 8 tolerances include provisional habitat extensions. Their edges are uncertain and do\
      \ not establish healthy maintenance for years at every endpoint."

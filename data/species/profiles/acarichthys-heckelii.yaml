  socialBehavior:
    text: "Adult group keeping and reproductive pairing are both reported. This profile uses a naturally compatible\
      \ pair for its minimum tank recommendation; it does not suggest that two unfamiliar adults will reliably accept\
      \ one another. Raising juveniles together can reveal partners, but their selection group requires much more\
      \ space. Published group guidance includes five to six adults in a 160 by 70 by 60 cm aquarium, while another\
      \ account begins partner selection with eight or more juveniles. Adult rivals or even a partner can face severe\
      \ attacks despite earlier calm behavior. Divide sightlines, provide escape routes and keep separation facilities\
      \ available. Repeated pursuit, feeding exclusion or persistent hiding calls for prompt intervention."
    sources:

  habitat:
    text: "The species occurs through lowland Amazon drainages and the Essequibo system of Guyana, with further\
      \ records in Suriname. Floods connect rivers, lakes and marginal forest or savannah habitats. Direct collecting\
      \ observations place it among submerged wood in quiet Rio Negro margins and pools; native surveys also record\
      \ it near vegetation and in floodplain lakes. The natural values here are provisional regional summaries:\
      \ 26 to 32 C, pH 4.6 to 8.0, 0 to 2 dGH and 0 to 3 dKH. Many readings are network measurements or seasonal\
      \ means rather than chemistry taken beside identified fish. Near-zero hardness denotes dilute water at coarse\
      \ resolution. Singapore populations are introduced and do not define these native ranges."
    sources:

    tolerance:
      value:
        min: 24
        max: 32
      confidence: low
      rationale: "The tally fixes 24 to 32 C by qualified majority, 4 of 6 votes, with low confidence. Generator,\
        \ checker-b, checker-c and tiebreaker-1 proposed 24 to 32 C; checker-a 24 to 29.5 C; tiebreaker-2 24 to\
        \ 30 C. Seriously Fish supports 24 to 30 C, Fishkeeper 24 to 29 C, AquariumDomain about 25.6 to 30 C, AquaInfo\
        \ 23 to 26 C and the Nordic register 23 to 30 C. The selected lower bound excludes the cooler 23 C recommendations\
        \ because broader corroboration begins at 24 C. The upper bound is provisionally extended to contain the\
        \ decided natural range; no cited source demonstrates healthy aquarium maintenance for years at 32 C. Prado\
        \ pooled field readings reach 32.9 C, a wider source range, but do not establish long-term aquarium health\
        \ or this species at the maximum. About 26 to 29 C has stronger routine support than either outer endpoint."

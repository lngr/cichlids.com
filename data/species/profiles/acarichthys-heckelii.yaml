  ghDgh:
    value:
      min: 0
      max: 2
    confidence: low
    rationale: "The tally fixes 0 to 2 dGH with unanimous agreement under its 2 dGH comparison threshold, at low\
      \ confidence. Generator and checker-b proposed 0 to 2; checker-a 0.5 to 3; and checker-c 0.1 to 2 dGH. Brito\
      \ seasonal calcium and magnesium means convert to about 0.31 to 1.14 dGH, using Ca/7.14 + Mg/4.34 with concentrations\
      \ in mg/L. Aprile and Darwich extrema give a bounding estimate of 0.80 to 1.67 dGH, and Oltman measured 12\
      \ to 27 mg/L hardness as CaCO3, or 0.67 to 1.51 dGH. The FAO compilation independently gives 0.1 to 1.78 dGH\
      \ in relevant regional waters. Zero is coarse rounding of very dilute water, not a measured absence of calcium\
      \ or magnesium. Checker-a proposed the wider 0.5 to 3 interval partly from conductivity, which cannot independently\
      \ determine GH; the measured-ion evidence supports the tally decision. These are regional proxies rather than\
      \ contemporaneous capture-site hardness measurements. FishBase has an incomplete 18 dH entry without a usable\
      \ field context."
    sources:
    - kind: literature

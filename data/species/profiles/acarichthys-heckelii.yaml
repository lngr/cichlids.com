      max: 12
    rationale: "The tally fixes 0 to 12 dGH with unanimous agreement under its comparison threshold and low confidence.\
      \ Generator and checker-b proposed 0 to 12; checker-a 0.5 to 12; checker-c 0.1 to 12 dGH. Seriously Fish gives\

  minTank:
    value:
      volumeL: 450
      lengthCm: 150
      depthCm: 60
    confidence: medium
    rationale: "Generator proposes 450 L with a 150 by 60 cm base; checker-a 300 L and 150 by 45 cm; checker-b 672\
      \ L and 160 by 70 cm; checker-c 400 L and 150 by 50 cm. The adopted 450 L, 150 by 60 cm recommendation is\
      \ a cautious synthesis for the selected compatible adult pair, adding escape and cover space to Seriously\
      \ Fish marginal pair base of 150 by 45 cm. FishFish explicitly recommends 450 L for two fish and gives a 150\
      \ by 50 by 60 cm example; 60 cm front-to-back depth is an adjudicator allowance rather than a published universal\
      \ threshold. Aquatic Arts allows about 284 to 341 L for a pair, the Nordic register 375 L with 150 cm length,\
      \ and Zierfische-Direkt inconsistently gives 400 and 450 L. Bednarczuk 160 by 70 by 60 cm, about 672 L gross,\
      \ concerns five to six adults and cannot be compared as a pair minimum. AquaInfo recommends the longer 180\
      \ cm aquarium. Communities and selection groups need materially more space than this minimum, and no dimension\
      \ guarantees partner safety."

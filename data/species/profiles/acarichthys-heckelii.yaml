  khDkh:
    value:
      min: 0
      max: 3
    confidence: low
    rationale: "The tally fixes the natural range at 0 to 3 dKH with low confidence; this plain fact deliberately\
      \ has no verification object. Generator and checker-b proposed 0 to 3; checker-a 0.5 to 2.5; and checker-c\
      \ 0 to 2 dKH. Brito seasonal bicarbonate means span 12.2 to 58.4 mg/L, equivalent to 0.56 to 2.68 dKH using\
      \ HCO3/21.8. Oltman bicarbonate measurements give 0.73 to 1.47 dKH, and Camara dos Reis measured Curuai alkalinity\
      \ corresponding to 0.61 to 1.26 dKH. Caraballo compiles Negro alkalinity below 0.05 meq/L and Solimoes 0.5\
      \ to 0.6 meq/L, or below 0.14 and 1.4 to 1.68 dKH. Regional low buffering plus outward rounding supports the\
      \ selected envelope. Zero denotes negligible buffering at this resolution. GH and conductivity were not converted\
      \ into KH, and the studies do not establish every endpoint at an occupied site."

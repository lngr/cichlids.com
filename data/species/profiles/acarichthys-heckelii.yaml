  diet:
    text: "Use a varied diet of small prepared omnivore foods, suitable frozen invertebrates and some vegetable-containing\
      \ food. Their adult body size does not mean they require large prey. Spread portions where both fish can reach\
      \ them and remove excess food before it degrades the water. Vegetable components complement insect larvae\
      \ and small crustaceans; a meat-only menu misses part of the reported feeding pattern. The profile does not\
      \ identify a specific high-protein bloat tendency, but that is not permission to overfeed. Watch body condition\
      \ and feeding access over time."

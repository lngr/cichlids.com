  temperatureC:
    value:
      min: 26
      max: 32
    confidence: low
    rationale: "The tally requires a median decision of 26 to 32 C with 2 of 6 votes agreeing and low confidence.\
      \ Generator and checker-b proposed 28 to 32 C; checker-a 25 to 29.5 C; checker-c 26.5 to 32 C; tiebreaker-1\
      \ 25 to 32 C; and tiebreaker-2 25 to 30 C. The median lower bound is 25.75 C, rounded to 26, and the median\
      \ upper bound is 32 C. This statistical synthesis is not a pair of directly observed species endpoints. Gay\
      \ observed occupied Negro margins at 28 to 30 C; Frois measured 25.2 to 29.4 C across a stream network that\
      \ included the species; Brito measured seasonal layer means of 28.3 to 31.7 C. Prado reported the wider pooled\
      \ range of 28.2 to 32.9 C, but captures of this species were confined to flooding and cannot be matched to\
      \ the hottest reading. Affonso reported an even wider regional range of 26.5 to 34.7 C without confirming\
      \ this species at those stations. Neither warmer extreme is a proven species exposure, and the selected lower\
      \ bound omits some cooler surveyed water. FishBase 23 to 26 C comes from an aquarium atlas and is excluded\
      \ as field evidence."

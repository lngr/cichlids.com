  breeding:
    text: "Wild reproduction takes place in a chamber reached through a dug tunnel, sometimes with more than one\
      \ entrance. A female prepares the nesting area and recruits a mate. The parents protect the brood and the\
      \ surrounding space. In aquariums, a roomy enclosed pot or similar stable cave can substitute for the natural\
      \ burrow. Successful spawning still depends on compatible adults and adequate space. Brood size varies considerably\
      \ between reports. Avoid forcing dramatic changes in heat or chemistry as a shortcut, because courtship itself\
      \ can expose a partner to serious injury."
    sources:
    - kind: literature
      title: "Gay (2009). Habitat Expert: Acarichthys heckeli. Practical Fishkeeping, November 2009"

  sizeAndGrowth:
    text: "Use 20 cm for either sex as the typical adult planning maximum in this profile. Larger published figures\
      \ of 23.5 to about 25 cm remain relevant when leaving spare space. Sources disagree about length convention,\
      \ and 20 cm standard length excludes the tail. No robust aquarium growth series establishes a precise difference\
      \ between male and female maxima. Young fish develop their fin streamers and adult colors gradually. Plan\
      \ the adult aquarium from the outset; restricted space and neglected water quality can interfere with growth.\
      \ Longevity estimates are weak, with species care sheets suggesting roughly six to ten years."

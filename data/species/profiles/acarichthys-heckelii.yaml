  note: "The Catalog confirms the valid legacy combination and authorship in 1849. Acara heckelii is the original\
    \ combination; Acara subocularis and Geophagus thayeri are junior synonyms. Checker-a includes authors and years\
    \ in its synonym strings; the other runs use bare names, which are retained consistently here. CRC displays\
    \ 1848 in its heading but cites the 1849 original publication; the Catalog takes priority. The Singapore ecology\
    \ paper DOI 10.1007/s10641-013-0201-z was unavailable through the permitted open-access route in the input research\
    \ and supplies no full-text evidence."

partners:
  suitable:
  - species: Mesonauta insignis
    reason: A calm companion recorded alongside the species in Rio Negro collecting observations.
    condition: "Large community beyond the pair minimum, matched adult sizes and separate cover."
  - species: Biotodoma wavrini
    reason: A relatively quiet co-occurring cichlid suited to soft water and fine substrate.
    condition: A larger footprint with separate territories; observe especially during breeding.
  - species: Pterophyllum scalare
    reason: Adult angelfish are a plausible upper-water companion; Gay reported angelfish in shared pools without
      identifying their species.
    condition: "Tall, spacious aquarium with adult companions, no fin nipping and room outside the acara breeding\
      \ territory."
  unsuitable:
  - species: Amphilophus labiatus
    reason: Strong aggression risks injury and chronic displacement of the threadfin acara.
  - species: Puntigrus tetrazona
    reason: Fin-nipping behavior puts the long streamers at risk.
  - species: Potamotrygon motoro
    reason: Stingrays can prey on these cichlids at night even after apparently peaceful coexistence.
  - species: Hyphessobrycon amandae
    reason: "Small adults approach the opportunistic prey size, so predation risk remains."
profile:
  overview:
    text: "The threadfin acara offers long fin streamers and a changing mix of reflective colors as it matures.\
      \ It is the only recognized species of Acarichthys and belongs to the South American cichlids commonly associated\
      \ with eartheaters. Expect an active digger that also explores above the bottom. Adults can share a spacious\
      \ aquarium with selected peaceful fish, but their behavior toward their own species deserves special attention.\
      \ An apparently calm youngster can become a dangerous breeding adult. Albino fish are a color form of the\
      \ same species."
    sources:
    - kind: catalog-of-fishes

  social:
    value:
      structure: pair
    confidence: medium
    rationale: "Generator, checker-a and checker-c propose pair; checker-b group with at least six adults. Gay observes\
      \ reproductive pairs, Seriously Fish explicitly supplies a pair footprint, and Fishkeeper suggests selecting\
      \ partners from eight or more juveniles before removing surplus fish where needed. Bednarczuk instead recommends\
      \ very large quarters for five to six adults, and Aquatic Arts describes loose groups. These accounts establish\
      \ both pairing and group behavior. A compatible adult pair is selected as the minimum planning unit, not as\
      \ a claim that the species is solitary outside reproduction. A maintained adult group remains possible in\
      \ a substantially larger aquarium, with individual separation sometimes still necessary."

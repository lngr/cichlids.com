    - field: features.minTank
      proposals:
        - by: generator
          value:
            volumeL: 2000
            lengthCm: 300
            depthCm: 100
        - by: checker-a
          value:
            volumeL: 1000
            lengthCm: 250
            depthCm: 60
        - by: checker-b
          value:
            volumeL: 4200
            lengthCm: 400
            depthCm: 140
        - by: checker-c
          value:
            volumeL: 1500
            lengthCm: 250
            depthCm: 60
      decision: *a63
      rationale: "Component medians of the proposals are 1750 L, 275 cm long and 80 cm front-to-back. Generator
        proposes 2000/300/100, checker-a 1000/250/60, checker-b 4200/400/140 and checker-c 1500/250/60. Retain
        the 1750 L volume median, supported as a planning floor above the explicit 1500 L recommendations of
        Zoopet and Tanganyika.si. Adopt Zoopet's stated 300 cm length rather than the 275 cm median; infer 100
        cm depth for a 70 cm male to turn and a compatible pair to move apart, rather than the unsupported 60
        cm depth in two proposals. No consulted source directly specifies a depth, so every numerical depth in
        inherited evidence is an agent estimate. Seriously Fish supplies only a 200 cm threshold and
        public-aquarium guidance, not a volume. The general pages offer 757 to about 1200 L, while Atlas
        repeats roughly 4164 L or more for pairs; these remain cited. Natural territories of at least 5 square
        metres favor more space, but do not directly demonstrate a universal 4200 L minimum. This
        low-confidence lower bound is for one established pair without tankmates, with separation capacity and
        excellent filtration; it is not a guarantee of pair compatibility."
    - field: features.lifespanYears
      proposals:
        - by: generator
          value:
            min: 12
            max: 20
        - by: checker-a
          value:
            min: 5
            max: 10
        - by: checker-b
          value:
            min: 10
            max: 15
        - by: checker-c
          value:
            min: 10
            max: 15
      decision: *a64
      rationale: "The proposal median is 10 to 15 years: generator proposes 12 to 20, checker-a 5 to 10 and
        checker-b and checker-c 10 to 15. The longer proposals rely on model estimates without
        species-specific longevity records. Aquariumpro explicitly gives 5 to 10 years and Fish Laboratory
        says up to 10 years; these weak but species-specific reports support 5 to 10 rather than a maximum
        above the largest sourced age. Retain every longer estimate as evidence but use 5 to 10 with low
        confidence. Reports of prolonged parental fasting and possible post-breeding death do not establish
        obligatory one-time breeding or a fixed aquarium lifespan."

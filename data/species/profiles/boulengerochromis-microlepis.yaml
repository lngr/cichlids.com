    - field: features.temperatureC.tolerance
      proposals:
        - by: generator
          value:
            min: 23
            max: 29
        - by: checker-a
          value:
            min: 22
            max: 29
        - by: checker-b
          value:
            min: 22
            max: 30
        - by: checker-c
          value:
            min: 23
            max: 29
      decision: *a55
      rationale: "Tally decides 23 to 29 C with unanimous verification under the one-degree agreement rule,
        confidence medium. Generator and checker-c propose 23 to 29 C, checker-a 22 to 29 C and checker-b 22
        to 30 C. The tally combines agreeing endpoints and contains the full natural range. Seriously Fish and
        Fish Laboratory recommend 24 to 28 C, Zoopet 23 to 26 C and Tropical Fish Site 25 to 26 C; Aquariumpro
        gives a wider 22 to 28 C, retained as evidence. The final band excludes its unsupported cooler margin
        and checker-b's inferred 30 C. Equality with the natural range is a planning estimate, not evidence of
        physiological failure outside it; choose stable conditions rather than cycling between endpoints."

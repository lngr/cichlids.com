        cichlid."
profile:
  overview:
    text: "A Tanganyika endemic and one of the largest living cichlids, Boulengerochromis microlepis develops into
      a powerful fish predator. It combines wide-ranging adult foraging with pair formation and extensive
      parental care. Keeping it requires a purpose-built installation and experience with large predatory
      fish."
    sources:
      - *a10
      - *a41
      - *a2
  habitat:
    text: "The species occurs around Lake Tanganyika, including sandy shores, rocky transitions and open water.
      Young fish use shallow nursery areas; adults also travel inshore to feed, so shallow-water use is not
      confined to spawning. Bayona found vegetation at some shoreline sites, without demonstrating a need for
      planted aquaria. Regional lake conditions are 23 to 29 C, pH 8.4 to 9.4, GH 10 to 13 dGH and KH 15 to 20
      dKH, based on the cited limnological studies."
    sources:
      - *a34
      - *a10
      - *a40
      - *a21
      - *a22
      - *a23
      - *a24
      - *a25
      - *a26
      - *a32
      - *a9
  sizeAndGrowth:
    text: "Plan for typical adult total lengths around 70 cm in males and 50 cm in females, with larger
      individuals possible. The sex-specific estimate comes from specialist guidance; the 80 cm FishBase
      figure is a recorded maximum and the 45 to 55 cm Seriously Fish figure uses standard length. Juveniles
      grow rapidly, so their small sale size is not a useful guide to permanent housing. Claims around 90 cm
      are retained in the evidence but do not define typical aquarium adults."
    sources:
      - *a36
      - *a10
      - *a2
      - *a34
      - *a20
      - *a32
  husbandry:
    text: "The provisional lower bound for one established adult pair is 1750 L with a 300 cm length and 100 cm
      front-to-back depth. Published recommendations vary greatly and the depth is inferred, so more space may
      be needed for particular fish. Provide a long swimming lane, sand and securely supported rocks that
      divide sightlines without blocking movement. Use strong biological filtration, oxygenation and
      substantial regular water changes. Keep conditions stable within the recorded tolerances and have a
      separate enclosure available if the pair becomes incompatible."
    sources:
      - *a10
      - *a11
      - *a33
      - *a16
      - *a18
      - *a19
      - *a20
      - *a36
      - *a14
      - *a46
      - *a39
      - *a17
      - *a9
  socialBehavior:
    text: "A compatible pair is the recommended adult unit. Young groups may appear tolerant before maturity, then
      suffer serious aggression and deaths as rivals develop. Small foraging groups in the lake do not
      establish that a permanent group is safe in a pair-sized aquarium. Breeding adults defend a large area
      and can exclude other fish from it."
    sources:
      - *a10
      - *a36
      - *a40
      - *a43
      - *a46
      - *a33
      - *a41
  diet:
    text: "Adults feed principally on fish; younger specimens use a broader range of foods, including
      invertebrates. Offer an appropriate varied carnivore diet and check that each animal actually accepts
      prepared foods rather than assuming pellet feeding is assured. Aquatic frozen foods and suitable whole
      prey can contribute to that diet. Routine use of feeder fish adds avoidable disease and nutritional
      risks. There is no demonstrated protein-sensitive bloat tendency of the kind represented by the
      compatibility flag."
    sources:
      - *a10
      - *a34
      - *a40
      - *a11
      - *a18
      - *a41
  breeding:
    text: "The pair spawns on an exposed surface or in a prepared substrate depression, and both parents defend
      the eggs and young. Published accounts describe broods numbering in the thousands and care lasting many
      months. Larvae may be moved between pits before free swimming. Breeding therefore demands space for
      defense and a plan for the offspring. Reports of parents fasting and sometimes dying after care do not
      prove that every fish breeds only once."
    sources:
      - *a10
      - *a40
      - *a43
      - *a11
      - *a2
  sexing:
    text: "Males generally grow larger than females, but size is an unreliable guide in young fish of different
      ages or growth histories. Nonbreeding adults are often silvery green with dark lateral spots; breeding
      fish develop stronger yellow or gold tones. Reports differ about how obvious the color differences
      between sexes are, and these tones also change with reproductive state. Do not treat a minor color or
      size difference as proof of a compatible pair."
    sources:
      - *a34
      - *a36
      - *a10
      - *a46
      - *a48
      - *a32
      - *a33
  compatibility:
    text: "Most ordinary Tanganyika community fish are potential prey, including small rock dwellers, shell
      dwellers and slender open-water species. Conditional mixed keeping is possible in much larger
      installations, so the species-only flag is false. Seriously Fish names large Cyphotilapia as potential
      companions, but brood defense can still make a mixed display fail. The pair minimum does not include
      room for additional large fish. Shared lake origin alone does not establish a safe pairing with other
      giant predators."
    sources:
      - *a10
      - *a36
      - *a40
      - *a46
      - *a33
  problems:
    text: "Predictable failures include buying juveniles without adult housing, leaving maturing rivals together,
      poor waste control and allowing small tankmates to become prey. Even an established pair needs
      monitoring and a practical separation option. The provisional lifespan of 5 to 10 years rests on general
      husbandry pages, with no strong longevity records found; longer model estimates remain in the evidence.
      Stable water quality and careful observation are more useful than assuming a precise age or a guaranteed
      bond."
    sources:
      - *a10

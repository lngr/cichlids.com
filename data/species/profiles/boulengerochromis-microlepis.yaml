  ghDgh:
    value:
      min: 10
      max: 13
    confidence: high
    rationale: "The decided natural range is 10 to 13 dGH for Lake Tanganyika. Plisnier (1996, second annual
      cycle) reports surface Ca 10.9 to 11.6 mg/L and Mg 41.2 to 43.2 mg/L, giving about 11.1 to 11.5 dGH at
      paired stations. The older Ca 9.8 and Mg 43.3 mg/L compilation gives about 11.35 dGH; inherited Cohen
      evidence gives 12.2 dGH. These support the regional rounded interval; aquarium advice as wide as 8 to 25
      dGH is a tolerance recommendation, not natural chemistry."
    sources:

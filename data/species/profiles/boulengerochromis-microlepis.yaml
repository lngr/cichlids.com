  ph:
    value:
      min: 8.4
      max: 9.4
    confidence: high
    rationale: "The decided natural range is 8.4 to 9.4 for Lake Tanganyika. Plisnier et al. (1996) report 8.47 to
      9.40 at 40 m over an annual cycle. The older FAO compilation gives the wider and markedly lower lake
      interval 7.3 to 7.8; it conflicts with the modern observations and strong alkalinity and is retained
      only as dissenting evidence. FishBase gives a lower bound of 9.0, not a complete range. The inherited
      8.47 to 9.40 attribution to Cohen is corrected in its evidence note; Cohen full text could not be
      obtained through the permitted OA route and was not independently reread."

        - by: checker-c
          value:
            type: piscivore
            bloatSensitive: false
            foods:
              - fish
              - crustaceans
      decision: *a60
      rationale: "All runs propose piscivore and bloatSensitive false; tally decides those values and the
        generator's food list with unanimous verification, confidence high. Their different food lists
        describe juvenile foods, natural prey and prepared aquarium foods, not a disagreement about adult
        fish-eating. Bayona's lake stomach contents and the 2014 study outweigh Fish Laboratory's general
        omnivore label. The FishBase diet page gives 94 percent shrimp and 6 percent fish from Beaufort, North
        Carolina, an ecologically mismatched locality for this lake endemic; it remains cited without
        overriding lake evidence. Fish Laboratory lists bloat among generic diseases, but gives no evidence of
        the protein-related dietary sensitivity meant by the rubric. Prepared food acceptance varies,
        especially with age."
    - field: features.aggressionHeterospecific
      proposals:
        - by: generator
          value: 2
        - by: checker-a
          value: 3
        - by: checker-b
          value: 3
        - by: checker-c
          value: 2
      decision: 2
      rationale: "Generator and checker-c propose 2; checker-a and checker-b propose 3. The latter rationales
        describe excluding fish from a breeding territory, not persistent attacks beyond it. Seriously Fish
        explicitly describes limited aggression toward fish too large to swallow outside that context.
        Territorial chasing fits level 2 literally; predation on smaller fish is represented separately by
        level 3 predation. A large pair may still occupy nearly all of an inadequate enclosure."

            - species: Lates angustifrons
              reason: A large Tanganyika predator with matching water chemistry and a body size that reduces prey risk.
              condition: Only in a public aquarium with a much larger footprint than the stated minimum.
      decision: *a65
      rationale: "The generator names Cyphotilapia frontosa, Bathybates fasciatus and Lates angustifrons. The read
        specialist care account explicitly supports Cyphotilapia only as conditional companions; no consulted
        care source demonstrates the two other proposed pairings. Remove those unsupported positive
        recommendations; the ecological paper also identifies large Lates as potential predators. The
        generator's consulted sources remain cited."

    - field: features.maxSizeCm
      proposals:
        - by: generator
          value:
            male: 60
            female: 50
        - by: checker-a
          value:
            male: 70
            female: 60
        - by: checker-b
          value:
            male: 70
            female: 50
        - by: checker-c
          value:
            male: 70
            female: 50
      decision: *a59
      rationale: "The proposal median is 70 cm male and 50 cm female: generator gives 60/50, checker-a 70/60 and
        checker-b and checker-c 70/50. Tanganyika.si explicitly reports typical adults at 70/50 cm total
        length, supporting the median. Seriously Fish gives 45 to 55 cm standard length, which cannot be
        compared directly with total length; FishBase's 80 cm TL is a record, not a typical female maximum.
        Bayona's 80 cm angler record and 70 cm survey maximum are not sex-specific. The Atlas account instead
        repeats average sizes near 50/39 cm, not typical maxima. Tropical Fish Site's 90/70 cm and forum
        estimates around 91 cm are retained but not used for typical aquarium adults."

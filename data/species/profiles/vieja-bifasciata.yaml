        accessed: "2026-10-13"
      - kind: "database"
        title: "Nordiska Ciklidsallskapet: Vieja bifasciata species register"
        url: "https://ciklid.org/artregister/art.php?ID=551"
        archived: ciklid.org/artregister/art.php/q-763f3d2e/2026-10-14T103724Z
        accessed: "2026-10-13"
  sexing:
    text: "Mature males usually grow larger and show stronger coloration and a steeper forehead; older males may
      develop a pronounced hump. These differences are unreliable in juveniles and vary with locality and
      social condition. A presumed sex difference cannot guarantee a compatible pair. Keep locality and
      identity records with breeding stock, since superficially similar Vieja and provisional forms complicate
      identification."
    sources:
      - kind: "database"
        title: "Seriously Fish: Vieja bifasciata"

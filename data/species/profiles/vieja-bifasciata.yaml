  temperatureC:
    value:
      min: 23
      max: 32
    confidence: "low"
    rationale: "The tally fixes 23 to 32 C by the rounded median of six lower and upper bounds, with no qualified
      majority. The lower endpoint is a regional habitat proxy, not a capture-linked physiological limit.
      Soria-Reinoso et al. measured 20.8 to 29.8 C, Cruz-Leyva et al. report site means of 28.3 to 30.2 C, and
      Frias-Quintana et al. collected voucher-identified juveniles at a mean of 32.1 C with SD 0.5 C. The SD
      is not an observed minimum-to-maximum range. Wider measurements include 26 to 33 C in rainy-season
      Centla lagoons, pooled 27 to 35 C in the dry season including saline stations, and 22.96 to 33.88 C in
      the lower Usumacinta study. These wider source ranges are not replaced by the median. Exact occupancy at
      their extremes remains uncertain. Beerlink's secondary 38.6 C account lacks independently verified
      measurement context and is not adopted. Proposals: generator 28.3 to 32.1; checker-a 25 to 32; checker-b
      26 to 33; checker-c 20.8 to 32.1; tiebreaker-1 20.8 to 32.1; tiebreaker-2 20.8 to 30.2."

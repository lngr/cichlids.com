      majority: three of six votes have that exact set. Generator proposes melanurus only, checker-a none,
      checker-b and both tiebreakers all six shorter IDs, and checker-c the same parental pairs under six
      different IDs containing a second vieja segment. IDs named by at least two votes form the conservative
      union; checker-c's alternative IDs are not created as duplicates. Each group concerns bifasciata and one
      named partner and has basis presumed. Binns Hybrid Encyclopedia labels all six captive parental pairs
      without verified pedigrees, original breeding locations or demonstrated access to conspecific mates.
      Beerlink gives a broad congener warning and specifically discusses melanurus and intermediate wild
      phenotypes attributed to Artigas Azas; the jaw study supports close relationships to breidohri and
      hartwegi but reports no crosses. Reliable independent offspring reports are missing for several pairs.
      Synspilum is normalized to melanurus through the Catalog. Ambiguous Coatzacoalcos, Red Isletas and
      compound offspring labels establish no additional pair, and crossability is not inferred transitively.

        url: "https://doi.org/10.22201/ib.20078706e.2022.93.3861"
        archived: doi.org/10.22201_ib.20078706e.2022.93.3861/2026-10-13T210740Z
        accessed: "2026-10-13"
  problems:
    text: "Persistent pursuit or confinement to a corner warrants separation; extra feeding does not resolve
      partner incompatibility. Digging may destabilize ornaments, while a large appetite places substantial
      demand on filtration and maintenance. Check water quality and social interactions when behavior changes.
      Neither regional field extremes nor short feeding experiments establish healthy lifelong aquarium
      endpoints. The 5 to 8 year lifespan entry is a cautious husbandry estimate, with longer survival
      possible and no reliable species-specific maximum-age study."

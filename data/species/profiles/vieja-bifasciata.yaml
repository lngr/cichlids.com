        archived: aquainfo.nl/en/article/vieja-bifasciata/2026-10-14T103717Z
        accessed: "2026-10-13"
  diet:
    text: "Choose a complete staple with a substantial vegetable component and modest invertebrate supplements.
      The species processes mixed food but usually grazes plant material and detritus. Predation level 1
      allows opportunistic fry consumption; it does not describe a dedicated fish hunter. No established
      species-specific protein-induced bloat syndrome supports setting the flag true. That uncertainty and a
      short laboratory feeding trial do not justify an animal-heavy lifelong diet."
    sources:

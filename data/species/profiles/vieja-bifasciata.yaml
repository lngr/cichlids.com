  sizeAndGrowth:
    text: "Use about 30 cm for males and 25 cm for females as provisional typical aquarium planning sizes. The
      female figure is an estimate, and some stocks become substantially larger; reports reach 35 to 40 cm for
      males, sometimes involving fish identified only as cf. bifasciata. Standard-length records do not
      measure the tail-inclusive aquarium size. A modest juvenile needs permanent adult housing arranged
      before its growth and territorial behavior intensify."

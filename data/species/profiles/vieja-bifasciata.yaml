      rationale: "The tally fixes 2 to 20 dKH by qualified majority, five of six votes under its range agreement
        threshold, with low confidence. Generator proposes 2 to 8; checker-a 4 to 18; checker-b 5 to 20;
        checker-c and both tiebreakers 2 to 20. The commercial Fish Farmer's Daughter listing states KH 5 to
        20 without a defined degree scale or duration. Il Mio Acquario gives a wider-at-the-lower-edge 2 to 8
        dKH for the genus and includes bifasciata, but its taxonomic history is inaccurate. Beerlink and
        Seriously Fish discuss chemical flexibility without numeric KH limits. Their qualitative accounts
        count as context only; two reliable independent species-specific numeric long-term KH sources were not
        obtained. The 2 to 20 envelope contains natural KH 5 to 11, but neither endpoint is independently
        validated for years of maintenance. Proposals: generator 2 to 8; checker-a 4 to 18; checker-b 5 to 20;

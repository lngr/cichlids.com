  breeding:
    text: "Both parents tend a brood laid on an exposed firm surface, then move larvae among shallow excavations
      before free swimming. Timing and clutch size depend on conditions and adult size. Offer suitably small
      fry food while maintaining water quality. Spawning can expand territorial defense and destabilize the
      pair, so monitor both parents as well as the brood and arrange space for growing young before
      encouraging reproduction."

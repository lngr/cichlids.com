  habitat:
    text: "Native records center on the Atlantic-slope Grijalva and Usumacinta systems in Mexico and Guatemala,
      with adjacent Candelaria records. Vegetated margins and soft bottoms supply grazing opportunities and
      cover. Natural values here are the tally decisions: 23 to 32 C, pH 7.2 to 8.3, GH 9 to 20 and KH 5 to
      11. Regional studies include wider conditions and often do not verify the species at each chemistry
      station. These intervals are provisional summaries, not complete distribution limits."
    sources:

  khDkh:
    value:
      min: 5
      max: 11
    confidence: "low"
    rationale: "The tally chooses a rounded median interval of 5 to 11 dKH from six proposals, with low
      confidence; this plain natural-water fact intentionally has no verification object. Direct alkalinity
      means of 128 to 135 mg/L as CaCO3 give 7.2 to 7.6 dKH, and the Centla survey's 116 to 198 mg/L give 6.5
      to 11.1 dKH. The wider 3.3 to 11.3 proposal from checker-c and both tiebreakers is inferred from
      Soria-Reinoso et al. DIC of 15.59 to 48.27 mg C/L and pH 7.3 to 8.3, using approximate
      bicarbonate-dominated equilibrium and unpaired extrema. It is not a titrated KH range. Checker-a uses a
      still wider regional-lake bicarbonate interpretation of about 5 to 21 dKH to propose 6 to 16, without
      species-specific river measurements. The median does not encompass those wider estimates or demonstrate
      their biological limits. GH is not used as KH. Proposals: generator 7.2 to 7.6; checker-a 6 to 16;
      checker-b 6.5 to 11.1; checker-c 3.3 to 11.3; tiebreaker-1 3.3 to 11.3; tiebreaker-2 3.3 to 11.3."
    sources:

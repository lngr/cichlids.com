  socialBehavior:
    text: "Established adults may injure a partner, especially when readiness to breed differs. A compatible pair
      is the catalog planning unit, rather than a promise that any male and female will accept each other.
      Refuge areas and daily attention remain necessary. Raising juveniles together can produce a
      self-selected pair, but surplus adults require other accommodation. Mixed-age communities appear in
      specialist accounts without a dependable minimum adult group number."
    sources:
      - kind: "database"
        title: "Seriously Fish: Vieja bifasciata"
        url: "https://www.seriouslyfish.com/species/vieja-bifasciata/"
        archived: seriouslyfish.com/species/vieja-bifasciata/2026-10-14T103724Z

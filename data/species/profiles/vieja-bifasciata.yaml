  note: "The Catalog of Fishes directly confirms Vieja bifasciata as valid, with authority (Steindachner, 1864).
    The current and legacy genus are identical, so the Vieja query covers both. The public CRC page verifies
    the name and a Chacamax locality photograph but exposes no feeding, habitat or breeding summaries; it
    supplies no feature origin. Synspilum names used for a crossing partner refer to Vieja melanurus. Searches
    of the cichlids.com archive under bifasciata found no posts, while bifasciatum and bifasciatus returned
    relevant historical threads."

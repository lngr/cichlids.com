  husbandry:
    text: "For a compatible adult pair, the selected minimum is 700 L with 200 cm length and 60 cm front-to-back
      space. Place secure wood and stones to break sight lines and provide several escape routes over soft
      substrate. Keep separation equipment ready and maintain effective filtration with regular water changes.
      The decided tolerance envelopes are 23 to 32 C, pH 7 to 8.5, GH 9 to 23 and KH 2 to 20. Their weakly
      supported edges are not permanent maintenance targets; around 27 to 28 C has clearer agreement among
      species care recommendations."

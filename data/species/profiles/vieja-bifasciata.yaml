      decision: 1
      rationale: "Tally method qualified-majority; 4 agreeing of 6 votes. The tally fixes level 1 by qualified
        majority, four of six votes, with low confidence. Frias-Quintana et al. include small fish larvae in a
        joint dietary account of bifasciata and melanurus; Decoulon independently warns of consumption of
        smaller fish. These support occasional fry feeding, not routine piscivory or a measured 2 cm prey

profile:
  overview:
    text: "A bonded pair can become incompatible with little warning, which makes separation space central to
      keeping this cichlid. Vieja bifasciata develops conspicuous red, blue and yellow coloring as it matures,
      with dark markings that vary among locality stocks. The current genus remains Vieja. It is an
      experienced-keeper species whose attractive adult appearance comes with substantial space and
      observation demands."
    sources:
      - kind: "database"
        title: "Seriously Fish: Vieja bifasciata"
        url: "https://www.seriouslyfish.com/species/vieja-bifasciata/"
        archived: seriouslyfish.com/species/vieja-bifasciata/2026-10-14T103724Z
        accessed: "2026-10-13"

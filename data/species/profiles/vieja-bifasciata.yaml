        archived: aquainfo.nl/en/article/vieja-bifasciata/2026-10-14T103717Z
        accessed: "2026-10-13"
  compatibility:
    text: "Communities require comparable-sized robust residents and an aquarium substantially larger than the
      pair minimum. Small or timid fish face harassment and possible consumption, and every candidate remains
      conditional on actual behavior. Six pairwise presumed crossing cautions concern breidohri, fenestrata,
      hartwegi, maculicauda, melanurus and zonata. They rest chiefly on unverified captive labels and
      specialist warnings rather than established free-choice parentage. No all-to-all crossing group or
      transitive ancestry claim follows from these pairs."
    sources:
      - kind: "database"

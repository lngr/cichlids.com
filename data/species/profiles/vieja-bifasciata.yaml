    confidence: "high"
    rationale: "The proposals share the same native Atlantic-slope core but name different localities. The Catalog
      and FishBase support southern Mexico and northern Guatemala. Beerlink adds Candelaria records and
      locality stocks; fish surveys record the species in San Pedro wetlands and the Lacantun sub-basin. These
      compatible localities are combined, excluding introduced populations. No curated lake waterbody applies
      to this river-distributed species."

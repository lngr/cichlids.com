    tolerance:
      value:
        min: 23
        max: 32
      confidence: "low"
      rationale: "The tally conservatively intersects the six proposed tolerance envelopes at 25 to 30.2 C, then
        expands the result to 23 to 32 C to contain the decided natural interval. This is an algorithmic
        planning envelope with low confidence, not two independent demonstrations of healthy aquarium survival
        for years at both edges. Care recommendations are Seriously Fish 27 to 29, Zoopet 24 to 28, Aqua-Fish
        22 to 28, Aquarismo Paulista 26 to 30 and Fishkeeper 24 to 30 C. The Nordic summary gives 25 to 30
        while its narrative gives 22 to 28. The 2025 aquaculture review gives a wider group-level 24 to 32 C
        range including bifasciata, not a species-specific longevity trial. Wider vote envelopes and regional
        field observations are retained as evidence of uncertainty. The 32.1 C capture mean cannot establish
        chronic tolerance, and about 27 to 28 C has the clearest overlap among the species care
        recommendations. Proposals: generator 22 to 32.1; checker-a 24 to 32; checker-b 25 to 33; checker-c
        20.8 to 32.1; tiebreaker-1 20.8 to 32.1; tiebreaker-2 20.8 to 30.2."

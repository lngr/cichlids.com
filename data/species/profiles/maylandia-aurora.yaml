    decision:
      volumeL: 250
      lengthCm: 120
      depthCm: 45
    rationale: "The generator proposes 200 L at 100 by 40 cm, checker-a 150 L at 120 by 40 cm, checker-b 300 L at 120 by 45 cm and checker-c 300 L at 120 by 50 cm. Component medians are 250 L, 120 cm length and 42.5 cm depth. The volume matches Aqua-Pedia and the length matches the roughly four-foot recommendation of Fishkeeper and Aquadiction; depth is rounded to a practical 45 cm footprint for a male and three females, rock shelters and a sand margin. The depth remains an inferred layout allowance. Smaller published recommendations include 110 L from Aqua-Fish, 190 L from Malawi Mayhem and the Nordic register headline of 200 L at 100 cm. Malawi.si and AquariumLesson recommend 300 L; the Nordic explanatory text also recommends more than 250 L for mbuna. Those larger options provide additional layout and stocking room, but do not establish that a carefully arranged 250 L species harem is inadequate. A mixed-species community requires additional space."

    - by: checker-b
      value: demanding
    - by: checker-c
      value: moderate
    decision: moderate
    rationale: "Generator and checker-b propose demanding; checker-a and checker-c propose moderate. The high-trust public CRC classification places the species at an intermediate aquarium level, which maps most closely to moderate. Aqua-Fish excludes complete beginners and Aquadiction rates it intermediate to advanced. A stable harem, secure rockwork and observation of aggression require some Malawi experience, but these sources do not establish the exceptional difficulty implied by demanding."

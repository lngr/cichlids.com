  temperatureC:
    value:
      min: 21
      max: 29
    confidence: high
    rationale: "The natural 21 to 29 C range is the Lake Malawi seasonal and inshore synthesis. Eccles supplies the cool inshore endpoint in the inherited synthesis, Vollmer and colleagues describe summer surface temperatures near 28 C and cooler winter water, and the 2013 campaign reported in Ngochera supplies the upper endpoint. The FAO compilation itself reports only 23 to 25 C, not the complete synthesis. FishBase's 24 to 26 C is a narrower species summary. The settled lake range is retained unchanged. Eccles could not be reopened: the DOI page returned HTTP 403 and the full-text tool reports no open-access copy. Its inherited citation is retained with offline true; the range remains the settled lake synthesis."

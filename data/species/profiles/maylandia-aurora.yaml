  khDkh:
    value:
      min: 5
      max: 8
    confidence: high
    rationale: "The natural 5 to 8 dKH range is the rounded lake alkalinity synthesis. Branchu and colleagues report about 2.33 to 2.46 meq/L, or 6.5 to 6.9 dKH, and Jackson's measurements compiled by FAO give 2.00 to 2.59 meq/L, or about 5.6 to 7.3 dKH. The wider rounded range is retained. Sodium bicarbonate contributes alkalinity without increasing calcium-magnesium hardness, so KH can exceed GH here. This natural fact intentionally has no verification object."

    rationale: "Generator and checker-c propose 8 to 10 years, checker-a 6 to 10 and checker-b 5 to 10. Their component medians give 7 to 10 years. Aqua-Fish, Aquadiction and AquariumLesson support only an upper expectation near ten years; none establishes seven as a measured lower endpoint. The lower value is therefore a planning estimate and the confidence stays low. Inherited ranges in evidence include the agents' inferred minima and are labelled accordingly."
  - field: features.beginnerSuitability
    proposals:

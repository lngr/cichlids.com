    - *id010
    - *id015
    - *id014
  breeding:
    text: "The female incubates the brood in her mouth and carries the parental care without assistance from the male. Courtship occurs at a defended site, which may be beside or beneath a rock where sand has been moved. Eggs are laid in small batches and collected by the female during the spawning sequence; the male's fin display helps bring milt close to her mouth. FishBase records clutches of 40 to 70 eggs, while aquarium accounts vary with female size and conditions. Incubation and release timing also differ among reports, commonly taking several weeks overall. Holding females need sheltered routes and should not be forced to compete continually with an actively courting male."
    sources:
    - *id052
    - *id002
    - *id018
    - *id062
    - *id053
    - *id054
    - *id020
    - *id021
    - *id051
    - *id007
    - *id056
    - *id015
  sexing:
    text: "The usual adult Likoma male has blue across the upper body and golden yellow on the lower head and breast, with yellow in the fins. Vertical bars may be faint. Mature females are less colorful and usually smaller, with brownish or grey-blue tones. Males from Mbweca and Tumbi Point can have a browner back, so locality affects appearance. Juveniles and subordinate males can be difficult to distinguish from females by color alone. Females of related aurora-group species are also similar. A locality label and a known breeding history are more informative than assuming every dull fish is a female aurora."
    sources:
    - *id002
    - *id003
    - *id048
    - *id018
    - *id005
    - *id021
    - *id022
    - *id007
    - *id049
    - *id008
    - *id010
    - *id061
  compatibility:
    text: "Select other mbuna with similar feeding needs and enough resilience to use their own shelters. Labidochromis caeruleus and Iodotropheus sprengerae are possible companions because their adult appearance differs from the Likoma male, but success depends on the individuals and additional tank space. A group of Pseudotropheus acei needs a larger mixed aquarium with swimming room. Other Maylandia carry the presumed crossing caution, and blue-barred look-alikes also attract rival-directed aggression. A forum keeper reported an aurora and red-zebra cross without documenting partner choice. Avoid delicate or timid cichlids that cannot feed normally around territorial mbuna, and do not treat a list of possible companions as a guarantee."
    sources:
    - *id018
    - *id019

  sizeAndGrowth:
    text: "Use about 12 cm for a typical adult male maximum and 10 cm for a female when planning the aquarium. These are aquarium total-length estimates supported by the locality account. FishBase's 8.7 cm male and 8.0 cm female maxima are standard lengths and exclude the tail. Larger aquarium individuals are occasionally reported, so the planning values are not absolute growth ceilings. Juveniles give little indication of the adult male's full color. Good care may allow a lifespan approaching ten years; the numerical seven-to-ten-year range is a cautious planning estimate, with a poorly documented lower endpoint."
    sources:

    - *id055
    - *id065
    - *id014
  diet:
    text: "Its natural feeding equipment and field accounts identify aurora as an aufwuchs grazer. Algae and the material growing with them form the center of that niche, with suspended food and small animal items contributing opportunistically. A plant-rich mbuna food and suitable vegetable ingredients make a practical aquarium staple. Readily accepting animal foods does not justify a protein-heavy menu. Husbandry sources warn of bloat associated with rich feeding and overfeeding. Offer portions the fish can consume promptly and check that subordinate females get their share. The omnivore label used by some care pages describes feeding breadth, while the compatibility diet category reflects the dominant grazing requirement."
    sources:
    - *id052
    - *id002
    - *id018
    - *id019

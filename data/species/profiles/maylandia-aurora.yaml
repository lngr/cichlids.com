  note: "The Catalog of Fishes is the naming authority for this profile and accepts Maylandia aurora (Burgess, 1976). The Maylandia and legacy Pseudotropheus genus queries were both checked; the latter currently has no aurora entry. CRC uses Metriaclima aurora. Stauffer and colleagues (2026), https://doi.org/10.3390/taxonomy6010003, argue that Maylandia is unavailable, but this disagreement does not change the catalog-based valid name used here. Likoma is the probable type locality. The separate sources and archive references are retained under origin."

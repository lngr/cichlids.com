  husbandry:
    text: "For one male and at least three females, plan a tank of at least 250 litres with a footprint about 120 cm long and 45 cm deep. The depth is a layout allowance for retreats and sand around the rocks. Some specialist accounts recommend 300 litres, which gives more flexibility; extra species require extra space. Place stable rock structures securely before adding sand, since males may excavate beneath them. Arrange several escape routes so a fish can leave the dominant male's view. Maintain effective biological filtration and regular water changes. Published aquarium temperatures mostly lie around 24 to 28 C; the broader tolerance includes natural seasonal extremes and is less certain at its ends. Stable alkaline water matters more than repeatedly adjusting minerals to an exact figure."
    sources:
    - *id018
    - *id019

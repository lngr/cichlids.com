      value:
        min: 21
        max: 29
      confidence: low
      rationale: "Proposals are generator 21 to 30; checker-a 21 to 29; checker-b 21 to 29; checker-c 21 to 29. The tally treats these as agreement within its one-degree threshold and selects 21 to 29 C with low confidence. Aqua-Fish and AquariumLesson recommend 24 to 27 C, Fishkeeper 24 to 26 C, Aqua-Pedia 24 to 28 C and the Nordic register 23 to 28 C. These central recommendations are widened to contain the complete natural range; they do not demonstrate that every seasonal extreme is equally suitable for continuous aquarium exposure. The generator's extra degree to 30 C has no species-specific long-term support. This provisional tolerance equals the natural range because no stronger endpoint evidence is available, not because failure outside it has been demonstrated."

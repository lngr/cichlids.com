  problems:
    text: "Persistent social pressure can become a health problem before obvious injuries appear. Watch females and subordinate fish for poor feeding, prolonged hiding or repeated pursuit. Too few females and limited escape routes concentrate that pressure. Heavy rocks placed insecurely above sand can shift when a male digs. Rich feeding, uneaten food and deteriorating water quality add avoidable stress to an algae-grazing mbuna. Use the published water ranges as planning guidance, not an invitation to make abrupt chemistry changes. Swelling or loss of appetite needs an assessment of both husbandry and illness; the bloat flag does not identify the cause of an individual case."

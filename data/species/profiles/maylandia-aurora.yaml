  socialBehavior:
    text: "A fixed aquarium harem helps distribute courtship pressure among several females, although wild mating is polygynandrous rather than a permanent family bond. Rival adult males can fight persistently, and a female with no refuge may also suffer repeated pursuit. Territory centers are relatively small rock sites, but rock cover must allow subordinate fish to move between them. Expect chasing of other fish near the male's patch, especially from similarly colored males. This does not mean every robust mbuna is excluded. Observe access to food and resting places after introductions, because a fish that stays hidden continually may be under more pressure than brief chases suggest."
    sources:
    - *id002
    - *id018
    - *id019
    - *id003
    - *id020
    - *id021
    - *id022
    - *id051
    - *id049
    - *id010

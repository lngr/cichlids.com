partners:
  suitable:
  - species: Labidochromis caeruleus
    reason: A possible robust Malawi companion with a predominantly yellow adult appearance distinct from the blue-and-gold aurora male; individual territorial behavior still matters.
    condition: "Use a larger mixed aquarium than the 250 litre species-harem minimum, with separate sheltered areas and observation of feeding access."
  - species: Iodotropheus sprengerae
    reason: A possible algae-oriented Malawi companion with rusty coloration distinct from the aurora male; smaller individuals need effective refuges.
    condition: "Use a larger mixed aquarium than the 250 litre species-harem minimum, with separate sheltered areas and observation of feeding access."
  - species: Pseudotropheus acei
    reason: "This active, robust mbuna is usually blue with yellow fins rather than aurora's barred blue-and-gold pattern."
    condition: "Use a larger mixed aquarium than the 250 litre species-harem minimum, with separate sheltered areas and observation of feeding access."
  unsuitable:
  - species: Maylandia zebra
    reason: It shares the presumed Maylandia hybrid group and its barred blue appearance can provoke rival-directed aggression.
  - species: Melanochromis auratus
    reason: Its persistent aggression can overwhelm a territorial harem species in a mixed tank.
  - species: Aulonocara baenschi
    reason: "It is a less robust, open-water-feeding Malawi cichlid that is likely to be harassed in a rocky mbuna setup."
profile:
  overview:
    text: "A male Maylandia aurora brings blue and gold to the rockwork, but its behavior shapes the aquarium as much as its color. This Lake Malawi mbuna defends a feeding and spawning site and needs companions chosen for their resilience and appearance. One male with at least three females is the recommended starting unit. It suits keepers with some experience of Malawi social behavior. Pseudotropheus aurora is the older catalog name, and Metriaclima aurora remains common in specialist sources. The accepted name here follows the Catalog of Fishes despite continuing disagreement over the genus."
    sources:
    - *id001
    - *id002
    - *id018
    - *id052
    - *id063
  habitat:
    text: "Likoma Island is central to this species' identity and is its probable type locality. FishBase and specialist locality records extend its distribution to other island and Mozambican shore sites. Some southern populations, including Thumbi West and Otter Point, were introduced within Lake Malawi. The fish uses the boundary between rock and sand, with many observations from shallow water and records extending to about 12 m. Dominant males occupy rock surfaces or excavated sites at rock bases. Other adults and juveniles also gather outside defended patches. Lake Malawi has alkaline water with relatively little calcium and magnesium. Its carbonate alkalinity can exceed its general hardness because those measurements describe different dissolved components."
    sources:
    - *id002
    - *id052
    - *id011
    - *id012
    - *id001

    rationale: "Generator, checker-a and checker-c propose level 2; checker-b proposes level 1 from the Malawi.si description of tolerance toward other mbuna. Fishkeeper also calls it moderately aggressive and emphasizes stronger reactions toward similar males, while Aqua-Fish reports territorial aggression toward other fish. Localized territorial chasing fits level 2 better than displays alone. These accounts do not justify attacks throughout the tank at level 3 when the social unit and footprint are suitable."

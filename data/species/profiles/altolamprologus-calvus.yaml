  socialBehavior:
    text: The calvus is a quiet, solitary hunter that moves slowly through the rockwork. Towards other
      species of similar size it is unusually tolerant and mostly defends its shelter by displaying;
      its thick, rough-edged scales make it a poor target for attackers. Among themselves the fish
      form an order of rank, and females in particular chase smaller rivals from their caves. A pair
      is the usual social unit, best formed by raising several juveniles together; a male with three
      or four females also works in a larger tank. A breeding pair becomes noticeably more
      territorial and may need a tank of its own. Plenty of caves and broken lines of sight keep
      disputes harmless.

  compatibility:
    text: The calvus suits a Lake Tanganyika community with calm, medium-sized fish such as
      Julidochromis, the larger Neolamprologus species, adult Cyprichromis and Synodontis catfish.
      Every fish small enough to fit into its mouth is at risk, especially shell-dwellers like
      Neolamprologus multifasciatus or Neolamprologus ocellatus, and fry of tankmates are taken from
      their hiding places. On the other hand, the calvus is shy and slow at feeding, so hectic,
      aggressive fish such as Malawi mbuna or Tropheus suppress it and also need a different diet.
      Keep only one colour form to avoid crosses between forms, and do not combine it with A.
      compressiceps, which competes for the same caves and niche.

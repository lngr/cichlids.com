partners:
  suitable:
    - species: Julidochromis regani
      reason: Rock-dwelling Tanganyika cichlid of similar size and calm to moderate temperament that uses
        other parts of the rockwork; too large to be eaten as an adult.
    - species: Cyprichromis leptosoma
      reason: Peaceful open-water group fish of the same lake that uses the upper water layer and leaves
        the rock bottom to the calvus.
      condition: Only adult fish of 8 cm or more; small juveniles are prey.
    - species: Synodontis multipunctatus
      reason: Robust Tanganyika catfish that ignores the calvus and is too large and well armoured to be
        prey.
    - species: Neolamprologus sexfasciatus
      reason: Tanganyika rock dweller of similar size and water needs; strong enough not to be bullied and
        too large to be eaten.
      condition: Tank of at least 150 cm with separate cave zones.
  unsuitable:
    - species: Neolamprologus multifasciatus
      reason: Shell-dweller of about 3 to 4.5 cm that fits into the mouth of an adult calvus and is hunted.
    - species: Neolamprologus ocellatus
      reason: Small shell-dweller that is eaten; the hobby names shell-dwellers as typical calvus victims.
    - species: Maylandia zebra
      reason: Hasty, aggressive Malawi mbuna that bullies the shy calvus away from food and needs a
        plant-based diet.
    - species: Tropheus moorii
      reason: Restless, aggressive aufwuchs grazer that suppresses the calvus at feeding and needs a
        low-protein diet that conflicts with the meaty food of the calvus.
    - species: Altolamprologus compressiceps
      reason: Congener with the same body plan and niche; the two compete for caves and resemble each
        other, and the hobby advises against mixing Altolamprologus species and forms.
profile:
  overview:
    text: "Altolamprologus calvus is one of the most striking cichlids of Lake Tanganyika: a tall,
      extremely flat-sided fish with a pointed head, a large mouth and a pattern of glittering white
      spots. The species name is Latin for bald and refers to a scaleless area on the head between
      the eyes. In the lake it slides sideways into narrow crevices to catch shrimps, small
      crustaceans and fry. In the aquarium it is a slow, calm fish that minds its own business
      towards anything too big to swallow, which makes it a classic member of Tanganyika community
      tanks. Several colour forms exist, from black with white pearls to pale and yellow fish. It
      grows very slowly, needs stable hard, alkaline water and patient keepers, and every small fish
      in the tank is potential food."
    sources:

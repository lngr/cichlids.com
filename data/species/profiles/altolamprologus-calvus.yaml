  beginnerSuitability:
    value: moderate
    confidence: high
    rationale: All files agree. The species is calm and hardy once settled, but wild fish react badly to
      changes in water chemistry, new fish hide for weeks, it must not share a tank with small fish
      and it needs calm tankmates. Seriously Fish rates it moderate and not a beginner fish,
      Fishkeeper notes that it tolerates poor water badly, and the Cichlid Room Companion places it
      at intermediate level. Only the LiveAquaria product page calls the care easy.

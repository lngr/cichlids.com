  breeding:
    value: cave-spawner
    confidence: high
    rationale: All files agree. The female chooses a crevice, shell or small pot whose opening is too
      narrow for the male, lays up to about 200 eggs inside and guards them; the male releases sperm
      at the entrance and defends the area around it. The Cichlid Room Companion classifies the
      species as a cave-breeding substrate spawner. Shells are accepted as caves, which is why some
      care sheets call it a shell spawner.

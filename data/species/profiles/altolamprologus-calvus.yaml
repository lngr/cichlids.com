  diet:
    text: "In nature the calvus is a specialised hunter of shrimps and other small crustaceans, which it
      picks out of crevices, and it also takes fish eggs and fry. In the aquarium it needs meaty
      food: frozen mysis, krill, brine shrimp and mosquito larvae, plus sinking carnivore pellets or
      granules. Many fish accept dried food, but on its own it does not keep females in breeding
      condition. Feed small portions so that the slow calvus actually gets its share before faster
      tankmates; with hasty fish in the tank, place food close to its caves. Avoid foods made from
      mammal meat."

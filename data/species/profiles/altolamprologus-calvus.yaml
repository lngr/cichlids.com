  temperatureC:
    value:
      min: 23
      max: 29
    confidence: high
    rationale: "Lake Tanganyika endemic, so the natural temperature is the measured range of the lake.
      Hourly buoy readings at Mpulungu in the south, close to the range of this species, span about
      24 to 29 C, and the southern basin is cooler and more variable from June to September because
      of upwelling: 23 to 29 C. The species lives in the upper rocky zone down to about 30 to 40 m,
      inside the measured water column."

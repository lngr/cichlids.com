    tolerance:
      value:
        min: 23
        max: 29
      confidence: medium
      rationale: "All three votes agree on 23 to 29 C. Care sources place the species between about 23 and
        28 C: FishBase and Fishkeeper give 23 to 25 C, Seriously Fish and LiveAquaria 24 to 27 C,
        Guidarium and a retailer guide 24 to 28 C, and a Tanganyika specialist site recommends 25 to
        26 C and warns that long spells at 30 C or more are dangerous. The upper end of 29 C is the
        natural lake maximum, which a tolerance has to contain; no husbandry source recommends
        keeping the species permanently that warm, so the warm end is less certain than the cool
        end. Stable temperature matters more than the exact value."

  diet:
    value:
      type: invertivore
      bloatSensitive: false
      foods:
        - shrimps
        - small crustaceans
        - insect larvae
        - fish fry
        - frozen mysis and krill
        - frozen brine shrimp
        - carnivore pellets
    confidence: high
    rationale: All three votes agree. Field data and databases describe a specialised hunter of atyid
      shrimps and other small crustaceans that also takes fish fry (Koblmüller et al. 2017 after
      several field studies, Spreitzer et al. 2011 for the genus, FishBase); the Cichlid Room
      Companion confirms crustacean feeding. In the aquarium it takes meaty live and frozen foods
      such as mysis, krill, brine shrimp and mosquito larvae and sinking carnivore pellets; dried
      food is often refused or not enough on its own to bring females into breeding condition. As a
      protein eater it is not prone to bloat on such a diet, and keepers in the archive report that
      bloat is rare in this species; overfeeding still harms water quality.

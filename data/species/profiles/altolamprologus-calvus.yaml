  predation:
    value: 2
    confidence: low
    rationale: "Decided by the conservative rule of the vote count, because no value reached a qualified
      majority. The votes split 3 to 2: the generator, checker-a and tiebreaker-1 proposed level 2,
      checker-b and tiebreaker-2 proposed level 1, and the conservative rule takes the higher level
      with low confidence. The split reflects two kinds of evidence. In the wild the diet is mainly
      atyid shrimps, with other small arthropods and fish fry on the side (Koblmüller et al. 2017,
      summarising field studies; FishBase names only shrimps and other crustaceans; Spreitzer et al.
      2011 call the genus a specialised atyid shrimp feeder); on its own this points to level 1.
      Hobby sources warn about small fish such as shell-dwellers: Seriously Fish describes a
      predator of eggs, fry and small fish that leaves alone only fish too large for its mouth,
      Fishkeeper and the Cichlid-Forum article rule out shell-dwellers and juveniles as tankmates,
      Guidarium expects every fish that fits into its mouth to be eaten, the Cichlid Room Companion
      lists it as crustacean eater and piscivore, and a keeper in the cichlids.com archive reports a
      pair eating many guppies. Adult shell-dwellers of 3 to 5 cm exceed the 2 cm limit of level 1,
      so level 2 keeps them out of a calvus tank in the compatibility check. Fish are not a main
      food, so level 3 does not apply. No stomach-content data for A. calvus itself were found."

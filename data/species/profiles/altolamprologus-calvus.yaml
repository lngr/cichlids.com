  sizeAndGrowth:
    text: "Males typically reach 13 to 14 centimetres in the aquarium, females stay clearly smaller at
      about 10 centimetres. The difference matters for breeding, because the female needs a cave
      that only she can enter. Growth is remarkably slow: young fish may need half a year to reach
      about four centimetres and around two years to become sexually mature. Buyers should therefore
      expect small, inconspicuous juveniles to take several years to develop their full height and
      colour. Males become taller-bodied with age and grow longer fins. Wild-caught adults are more
      expensive but show their final appearance right away."

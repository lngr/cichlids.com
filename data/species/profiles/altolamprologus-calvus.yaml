  breeding:
    text: Breeding works best with a pair that formed on its own. The female selects a cave, crevice,
      shell or small pot with an opening too narrow for the male and lays up to about 200 eggs on
      its inner surface. The male releases his sperm at the entrance, and both fan it inside with
      their fins. The female then cares for the eggs and larvae while the male guards the
      surroundings. The larvae hatch after about two days and swim freely about eight to ten days
      later; newly hatched brine shrimp and microworms are suitable first foods. Remove the male or
      the young before they swim freely, because he may eat them. Sort the fry by size as they grow,
      since larger siblings can prey on smaller ones.

    - name: Lamprologus calvus
      note: Original combination of Poll (1978), with the type locality Chipimbi on the south-western
        coast of Lake Tanganyika, Zambia.
    - name: Neolamprologus calvus
      note: Combination used in parts of the hobby literature; Fishkeeper lists it as a synonym. The
        Catalog of Fishes places the species in Altolamprologus.
  legacyNames:
    - Altolamprologus calvus
  note: "The Catalog of Fishes lists Lamprologus calvus Poll 1978 as valid in Altolamprologus,
    following Maréchal and Poll (1991), Poll and Gosse (1995) and Konings (2015, 2019). The genus
    holds three valid species: A. calvus, A. compressiceps and A. fasciatus. A dwarf shell-dwelling
    form traded as Altolamprologus sp. 'shell' or 'Sumbu shell' is an ecotype related to A.
    compressiceps (Koblmüller et al. 2017) and does not belong to this species. FishBase and the
    Cichlid Room Companion use the same valid name."

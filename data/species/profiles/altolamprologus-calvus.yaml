      waterbody: Lake Tanganyika
      localities:
        - Chipimbi (type locality, Zambia)
        - Kasaba (Zambia)
        - Chaitika (Zambia)
        - Chisanse (Zambia)
        - Kabemba
        - Moliro (DR Congo)
    confidence: high
    rationale: All sources agree that the species is endemic to Lake Tanganyika and restricted to its
      south-western part along the Zambian and southern Congolese coasts, where it lives together
      with A. compressiceps. The type locality is Chipimbi in Zambia. The Lufubu estuary between
      Kasaba and Chaitika separates two genetically distinguishable groups (Koblmüller et al. 2017).
      Chisanse and Kabemba are known from the trade names of locality forms (Fishkeeper), and Moliro
      is named as a source of exported fish (Elieson).

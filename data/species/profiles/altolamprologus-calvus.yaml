  feedingSpeed:
    value: slow
    confidence: medium
    rationale: The calvus is a shy, deliberate hunter that fixes its prey before striking and often
      ignores dried food. Fishkeeper and Seriously Fish warn that vigorous tankmates such as mbuna
      outcompete and bully it, and new fish often hide for weeks before feeding freely, so it tends
      to lose food to faster fish.

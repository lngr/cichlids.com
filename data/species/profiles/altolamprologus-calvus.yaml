  problems:
    text: The most common mistake is to add small fish or shell-dwellers, which the calvus eventually
      eats. Another is to keep it with boisterous or fast-feeding species, so that the shy fish
      loses weight because it rarely gets food. Wild imports are sensitive to sudden changes in pH,
      hardness or temperature and to poor water quality, so large or unmatched water changes and an
      unstable buffer are risky. Newly added fish hide for weeks; overfeeding them out of worry
      spoils the water and can trigger bloat in tankmates. Mixing colour forms leads to unwanted
      crosses. Breeding males may eat their own fry. Because growth is slow, patience is needed
      before a group of juveniles pairs off.

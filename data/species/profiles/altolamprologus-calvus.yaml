  sexing:
    text: Adult males are clearly larger than females, taller in the body and carry longer fins. Females
      stay compact, which allows them to fit into caves that the male cannot enter. In some forms
      the female keeps a more barred pattern while the male turns darker, so that its white spots
      stand out. Juveniles are hard to sex because growth is so slow; buying a small group and
      letting a pair form is more reliable than trying to pick sexes. Wild-caught adults can be
      sexed by size alone once both sexes are present.

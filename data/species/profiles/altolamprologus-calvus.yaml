  husbandry:
    text: "A pair needs a tank of about 200 litres and 100 centimetres length; in a community setup, a
      longer tank is better. Build stacks of rock with many narrow gaps and caves, and add a few
      snail shells or small pots that a female can use as a breeding cave. A sand bottom, ideally
      with some coral sand or aragonite to support the buffer, completes the setup; a dark substrate
      brings out the contrast of black forms. Keep the water hard and alkaline, around pH 8 to 9, 24
      to 27 C, about 10 to 20 dGH and 10 to 20 dKH, and above all stable. Change water regularly in
      modest amounts with matched temperature and pH, because wild fish react badly to sudden
      chemical changes. Give new fish time: they often hide for weeks."
    sources:

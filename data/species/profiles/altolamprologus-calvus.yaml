    tolerance:
      value:
        min: 7.8
        max: 9.4
      confidence: medium
      rationale: "All three votes agree within 0.3 pH: the generator and checker-a proposed 7.8 to 9.4 and
        checker-b 7.5 to 9.4, and the vote count decided 7.8 to 9.4. Husbandry sources ask for
        alkaline water: FishBase and Fishkeeper give pH 8.0 to 9.0, LiveAquaria and Guidarium 7.8 to
        9.0, Seriously Fish 7.5 to 9.0 with 8.0 to 8.5 for breeding, a Tanganyika specialist site
        8.0 to 9.5, and a general Tanganyika husbandry article sets 7.8 as the lower limit. The
        lower bound of 7.8 is the median of these values; wild fish react badly to changes in water
        chemistry, so values near the bottom suit tank-bred fish rather than fresh imports. The
        upper bound is the natural lake maximum."

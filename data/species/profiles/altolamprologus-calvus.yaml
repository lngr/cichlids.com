  hybridGroups:
    value: [altolamprologus, altolamprologus-calvus-julidochromis-transcriptus]
    confidence: medium
    rationale: >-
      No independently verified source documents a cross with A. compressiceps, and the aquarium
      account involving another species is unverified. The presumed group altolamprologus rests on
      the very recent split of the two species,
      which leaves neither monophyletic (Koblmüller et al. 2017), and on hobby advice not to breed
      them together; their stable coexistence in the lake argues for a caution rather than a
      warning. The curated group file defines altolamprologus-calvus-julidochromis-transcriptus as

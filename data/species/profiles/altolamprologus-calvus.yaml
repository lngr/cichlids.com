  habitat:
    text: The species is endemic to the south-western part of Lake Tanganyika, along the coasts of
      Zambia and the southern Democratic Republic of the Congo, with the type locality at Chipimbi.
      It lives only over rocky ground, mostly in shallow water but down to about 30 to 40 metres,
      often a short distance above the stones. There it shares its range with its close relative A.
      compressiceps. Different stretches of coast hold their own colour forms. The lake water is
      warm (23 to 29 C), strongly alkaline (pH 8.4 to 9.4) and hard, with about 10 to 13 dGH and 15
      to 20 dKH, and its chemistry varies little over the year.

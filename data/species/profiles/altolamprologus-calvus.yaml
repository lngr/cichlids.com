  ph:
    value:
      min: 8.4
      max: 9.4
    confidence: high
    rationale: "Lake Tanganyika endemic, so the natural pH is the measured range of the lake: about 8.8
      to 9.2 at the surface and 8.47 to 9.40 at 40 m over an annual cycle at three stations, with
      8.66 to 9.12 at Mpulungu in the south. Deep water with a lower pH reaches the surface at the
      end of the dry season: 8.4 to 9.4."

  temperatureC:
    value:
      min: 27
      max: 32
    confidence: low
    rationale: 'generator proposed {"min": 28, "max": 30}; checker-a proposed {"min": 26, "max": 32}; checker-b
      proposed {"min": 26.5, "max": 31}; checker-c proposed {"min": 28, "max": 32}; tiebreaker-1 proposed {"min":
      26.5, "max": 34.8}; tiebreaker-2 proposed {"min": 28, "max": 32}. The tally applies the median method because
      no qualified majority resolves the thermal envelope. The median lower bound is 27.25 C and the median upper
      bound is 32 C; whole-degree rounding gives the fixed 27 to 32 C decision with low confidence. This is a working
      regional habitat summary, not the union of all measured extremes. Torres-Bejarano and colleagues measured
      the wider 26.5 to 34.8 C envelope in Yahuarcaca, with this species independently recorded there by Prieto-Piraquive
      and colleagues. Affonso and colleagues report regional Mamiraua surface water around 26.5 to 33.9 C; identified
      fish were not paired with each reading. Bittencourt and colleagues supply a closer species-linked Fortaleza
      main-channel range of 27.8 to 28.5 C. Queiroz main-channel measurements are 28.9 to 30.1 C, Brito seasonal
      depth means span 28.3 to 31.7 C, and Zell Solimoes seasonal values are 28 to 31 C. Sampling depths, seasons
      and fish-station linkage differ. FishBase environmental temperatures derive from husbandry literature and
      do not establish natural field endpoints. The 34.5 C Queiroz observation is from Aiapua in the Purus tributary
      set, not a Solimoes main-channel station.'

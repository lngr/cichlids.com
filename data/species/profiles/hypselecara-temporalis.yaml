  sizeAndGrowth:
    text: 'Allow roughly 30 cm for a large aquarium male and up to about 25 cm for a female. Some sex-specific care
      records give females 20 cm, while others permit 25; the larger allowance reduces the chance of planning around
      a fish that later outgrows its space. These values are practical adult estimates, not exact growth cutoffs.
      Published standard-length and total-length records cannot be compared directly. Lifespan estimates span about
      eight to twelve years, without a tracked survival study. A small shop specimen therefore calls for a long-term
      adult aquarium plan.'

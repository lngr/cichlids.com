  khDkh:
    value:
      min: 0
      max: 3
    confidence: low
    rationale: 'generator proposed {"min": 0, "max": 3}; checker-a proposed {"min": 0.5, "max": 2.5}; checker-b
      proposed {"min": 0, "max": 2}; checker-c proposed {"min": 0, "max": 5}. The tally unanimously agrees within
      the 2 dKH threshold and rounds the agreeing endpoint medians to 0 and 3; the natural KH fact has no verification
      object. Convert bicarbonate alkalinity using dKH = HCO3 mg/L / 21.8, or total alkalinity expressed as CaCO3
      using mg/L / 17.848. Queiroz provides effectively zero to 1.70 dKH across the Solimoes and tributaries, Brito
      seasonal depth means give 0.56 to 2.68, and the dos Reis Curuai measurements give about 0.61 to 1.26. The
      decided range is narrower than JBL regional tests of 0 to 5 dKH and Souto regional alkalinity of about 0.24
      to 4.85 dKH. These field proxies are not direct assays of every occupied microhabitat and do not quantify
      organic buffering separately.'

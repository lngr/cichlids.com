        genus recommendation rather than 10; checker-a GH-based inference is not accepted as a KH measurement. The
        genus sheet combines two species and the website mislabels the origin, so neither establishes an experimentally
        tested multi-year boundary. Near-zero alkalinity is included to contain native regional conditions. The
        generator 0 to 4 proposal relies partly on an AquaInfo Geophagus account at 4 dKH that merely lists this
        species as a companion. A forum spawn at KH 12 does not justify widening the long-term band. Two independent
        strong species-specific chronic KH studies were not found; native alkalinity papers contextualize the lower
        endpoint and do not constitute captive tolerance trials.'

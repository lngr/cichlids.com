  sexing:
    text: 'Adult males often grow larger and may develop a more conspicuous forehead and longer fin extensions.
      These tendencies do not reliably sex every juvenile or establish that two purchased adults will form a compatible
      pair. Colour changes with development and condition, so colour alone is weak evidence. Identification comes
      first: coryphaenoides has different typical body proportions and flank-blotch placement. A trustworthy collection
      history and several clear adult views are more useful than a shared trade name or one stressed photograph.'

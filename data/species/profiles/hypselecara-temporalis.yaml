  husbandry:
    text: 'Use at least 450 litres and a footprint around 150 by 60 cm for one compatible adult pair, with useful
      water height around 50 cm. This recommendation is cautious but not unanimous: published advice ranges from
      about 243 litres to a 200 cm aquarium, and mixed communities need extra room. Arrange large smooth shelters
      and broken sight lines while preserving turning and swimming space. Keep a secure cover, effective biological
      filtration and good surface oxygenation. Routine water around 26 to 28 C and mildly acidic to neutral pH is
      better supported than continuous maintenance at the outer tolerance limits. Prepare replacement water consistently
      and monitor pH where buffering is low.'

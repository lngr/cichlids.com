partners:
  suitable:
  - species: Heros efasciatus
    reason: A calm deep-bodied adult severum can share compatible warm soft water.
    condition: Use a substantially larger community aquarium than the 450 L pair minimum and provide separate retreats.
  - species: Uaru amphiacanthoides
    reason: Calm adults have suitable size and broadly compatible water needs.
    condition: Meet the Uaru social and feeding needs and allow generous space beyond the chocolate pair minimum.
  - species: Geophagus altifrons
    reason: Appropriately sized adults offer a generally calm benthic companion group.
    condition: Provide room for the eartheater group and both species breeding territories; juveniles small enough
      to swallow are unsuitable.
  - species: Metynnis argenteus
    reason: A school of large deep-bodied adults can occupy open swimming space.
    condition: Use adults too large to swallow in a much larger community aquarium; account for the full school
      and plant consumption.
  unsuitable:
  - species: Paracheirodon innesi
    reason: Small slender adults fall within the level-2 mouth-sized prey risk.
  - species: Poecilia reticulata
    reason: Small slender fish and their fry are vulnerable to predation; usual mineral requirements also differ.
  - species: Parachromis dovii
    reason: Adult size and severe aggression create a substantial injury and intimidation risk.
  - species: Maylandia lombardoi
    reason: Strong territorial behaviour and contrasting water preferences make the combination unsuitable.
profile:
  overview:
    text: 'A chocolate cichlid is a substantial South American fish whose usually quiet behaviour can conceal adult
      space and predation needs. Plan for a compatible pair, a male around 30 cm and a female allowed up to about
      25 cm. Adults can show brown, green and red tones, with markings changing as the fish matures or becomes aroused.
      Chocolate cichlid and emerald cichlid are both used for Hypselecara temporalis. Hypselecara coryphaenoides
      is a separate valid species that shares confusing trade names, so reliable identification matters before using
      these care figures.'

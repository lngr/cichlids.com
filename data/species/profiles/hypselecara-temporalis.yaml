  diet:
    text: 'Use a mixed prepared diet suitable for large cichlids, supplemented with measured portions of invertebrate
      foods and plant-containing foods. Published records include insects, other invertebrates and plant material;
      seasonal insect dominance does not establish a fish-specialist diet. Level-2 predation means mouth-sized companions
      remain at risk even when the cichlid readily eats pellets. Live feeder fish are unnecessary. No specialized
      high-protein bloat restriction has been established, but this does not rule out digestive disease from unsuitable
      feeding or poor conditions. Check each fish receives food and keep portions appropriate to its body condition.'

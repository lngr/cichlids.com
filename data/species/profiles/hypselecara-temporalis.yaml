  maxSizeCm:
    value:
      male: 30
      female: 25
    confidence: medium
    rationale: 'Generator and checker-b proposed 30 cm male and 20 cm female; checker-a proposed 28 and 22; checker-c
      proposed 30 and 25. Retain 30 and 25 as a cautious typical adult aquarium planning maximum. Guidarium explicitly
      lists a 30 cm standard adult and a 25 cm female; DRTA independently gives 30 and 25, though it is a low-weight
      website. Aquavipare and FishFish both give 30 and 20 but closely matching descriptions weaken their independence.
      FishProfiles gives 28 for each sex despite describing larger males. Seriously Fish gives an unsexed 30 cm
      SL and FishBase a 30 cm TL biology record and common 22 cm TL; SL and TL are not interchangeable. The wider
      unsexed 30 cm ceilings in some sources do not establish a sex-specific 30 cm female maximum. No tracked sex-specific
      growth series was found, so 25 is a practical allowance rather than an exact biological cutoff.'

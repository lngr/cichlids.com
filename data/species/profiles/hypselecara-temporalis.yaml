    confidence: high
    rationale: 'The four complete inputs agree on South America and an Amazonian range, while their regional wording
      and selected localities differ. The Catalog and FishBase establish the principal river distribution; the Yahuarcaca
      diet study directly records the fish there, and the FishBase entry for Zuchi and colleagues records Catalao.
      The final wording combines these supported river and floodplain records. It does not transfer Orinoco records
      or water requirements from H. coryphaenoides. The ICMBio SALVE record independently confirms broad Brazilian
      river occurrence, distinguishes the flank mark from coryphaenoides and reports insect feeding in the Araguaia
      and omnivory in the Tocantins. It also flags unresolved species-complex questions, so this profile does not
      claim that every locality stock is taxonomically uniform.'

  habitat:
    text: 'The range covers the Amazon river landscape and adjacent Amapa and Oyapock drainages. Records include
      river margins and floodplain lakes with slow water, roots and other shelter. The natural planning values are
      27 to 32 C, pH 5.9 to 7.6, GH 0 to 3 dGH and KH 0 to 3 dKH. They summarize several regional datasets rather
      than a complete species-specific habitat survey. Yahuarcaca profiles reach the wider 26.5 to 34.8 C range,
      and some regional chemical observations also extend outside the selected bands. Natural turbidity or low dissolved
      oxygen should not be reproduced as aquarium maintenance targets.'
    sources:

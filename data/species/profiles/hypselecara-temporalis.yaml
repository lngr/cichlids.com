  - name: Cichlasoma hellabrunni
    note: 'Junior synonym, Ladiges 1942.'
  legacyNames:
  - Hypselecara temporalis
  note: 'The Catalog of Fishes accepts Hypselecara temporalis (Günther, 1862) and separately accepts H. coryphaenoides
    (Heckel, 1840). The latter is neither a synonym nor a colour form of temporalis; Cichlasoma arnoldi, Chuco axelrodi
    and Heros niger belong to its synonymy and are excluded here. Acara (Heros) crassa is the catalog spelling behind
    the shortened Acara crassa proposal. The legacy and current genera are both Hypselecara. CRC public taxonomy
    agrees but its detailed ecology and breeding account were unavailable without a subscription. The ICMBio SALVE
    record mentions a possible unresolved species complex without replacing the accepted name. Shared trade names
    and assertions of complete geographic separation are not diagnostic proof.'

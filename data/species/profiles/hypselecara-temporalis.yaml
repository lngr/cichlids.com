  predation:
    value: 2
    confidence: medium
    rationale: 'Five of six votes agree on level 2 by qualified majority; checker-a proposed 1. Guidarium explicitly
      ties loss of companions to mouth size, while Aquavipare and FishFish warn about smaller companions and the
      Nordic register confirms very small fish are eaten. These accounts support the mouth-sized-prey warning rather
      than an unsupported universal 2 cm limit. Published field feeding emphasizes insects rather than fish, so
      this is not a fish-specialist classification. Consumption frequency and maximum prey length have not been
      measured. Retailer and general hobby accounts are supplementary websites, and similar wording in Aquavipare
      and FishFish limits their independence. Aquarismo Paulista also excludes companions small enough to be swallowed;
      it is a general hobby website, with no measured predation trial.'

  beginnerSuitability:
    value: moderate
    confidence: medium
    rationale: 'All four complete proposals are moderate. The Nordic register assigns intermediate difficulty, while
      general care ratings range from easy to unsuitable for inexperienced keepers. Flexible feeding and usually
      calm behaviour ease maintenance, but large adult size, substantial waste output, warm-water filtration and
      brood defence require preparation. Moderate reflects those practical demands rather than a claim of specialized
      care.'

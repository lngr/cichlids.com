    tolerance:
      value:
        min: 24
        max: 32
      confidence: low
      rationale: 'generator proposed {"min": 24, "max": 30}; checker-a proposed {"min": 24, "max": 30}; checker-b
        proposed {"min": 25, "max": 31}; checker-c proposed {"min": 24, "max": 32}. All four proposals agree within
        1 C under the tally rule. The agreeing median before natural-range containment is 24 to 31 C after rounding;
        the upper endpoint is widened to 32 C to contain the fixed natural range. Seriously Fish and FishProfiles
        recommend 25 to 30 C, TropicalFreshwaterFish 25 to 29, and the Nordic register 25 to 27. Fish Laboratory
        reaches 24 C; the Bulgarian encyclopedia lists 24 to 32 but partly cites Seriously Fish, so it is not an
        independent chronic-temperature study. The tally therefore retains low confidence. Routine maintenance around
        26 to 28 C has stronger support than permanent 32 C. The wider DRTA website recommendation of 20 to 30 C
        is not adopted as a demonstrated healthy long-term lower limit.'

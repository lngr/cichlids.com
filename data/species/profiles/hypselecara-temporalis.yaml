  problems:
    text: 'Crowding adults, unstable water preparation, inadequate filtration and small companions are preventable
      sources of trouble. A secure cover and smooth shelters reduce injury risk during sudden movement. Observe
      breathing, appetite, body condition and access to food rather than using a colour change alone as a diagnosis.
      Bittencourt and colleagues found parasites in a sampled wild temporalis, supporting careful quarantine of
      new arrivals. The decided aquarium tolerance bands are 24 to 32 C, pH 5.0 to 7.6, GH 0 to 12 dGH and KH 0
      to 8 dKH. Temperature at 32 C and the whole KH band have weak long-term support; a range endpoint is not a
      preferred routine target.'

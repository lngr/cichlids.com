  socialBehavior:
    text: 'A compatible pair is the recommended adult unit. Extra unpaired adults can become competitors, and a
      pair bond does not guarantee lasting tolerance in a cramped aquarium. The conspecific and heterospecific aggression
      settings are both 2: recurrent social chasing and breeding-territory exclusion matter even though quiet adults
      often coexist with larger calm fish. The large breeding-only territory is an inferred precaution, without
      a measured radius. Watch that neither partner nor another resident loses sustained access to food or shelter.
      A community needs enough room for neighbours to withdraw from the brood area.'

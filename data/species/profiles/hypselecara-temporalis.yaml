  breeding:
    text: 'Both parents care for eggs attached to an exposed surface, often an upright stone or piece of wood. Pits
      and sheltered depressions can receive the brood after the original deposition, so an occupied pit need not
      be the egg site. This is open substrate spawning; transporting larvae briefly in the mouth does not make it
      mouthbrooding. Courtship and brood care can increase territorial exclusion, so other residents need retreat
      space. Early attempts may fail. If young are raised, offer suitably small food after free swimming and plan
      adequate separate growing space.'

  ghDgh:
    value:
      min: 0
      max: 3
    confidence: low
    rationale: 'generator proposed {"min": 0.1, "max": 2.5}; checker-a proposed {"min": 0.5, "max": 2.5}; checker-b
      proposed {"min": 0.1, "max": 2.5}; checker-c proposed {"min": 0, "max": 5}; tiebreaker-1 proposed {"min":
      0.1, "max": 2}; tiebreaker-2 proposed {"min": 0.1, "max": 3.2}. The tally records qualified-majority agreement
      of all six votes within its 2 dGH comparison threshold and rounds the median endpoints to 0 and 3. Low confidence
      is retained because many measurements are regional proxies. Hardness is calculated from dissolved calcium
      and magnesium as dGH = Ca mg/L / 7.14 + Mg mg/L / 4.34, never from conductivity. Queiroz paired values yield
      about 0.09 to 2.30 dGH, Horbe and Santos about 0.16 to 0.82, and Brito seasonal mean pairs about 0.31 to 1.14.
      Aprile and Darwich ion ranges give an enclosing 0.80 to 1.67 envelope whose independent extrema need not coincide.
      The fixed upper bound is narrower than Souto paired main-channel data reaching 3.15 dGH and JBL field tests
      spanning 1 to 5 dGH. FishBase 0.3 to 20 dH is a broader compilation with husbandry provenance, not a comparable
      field series. Zero is rounded effectively negligible hardness, not pure deionized water.'

  compatibility:
    text: 'Choose calm adult companions that cannot fit in the chocolate cichlid mouth and that share suitable warm-water
      conditions. Adult severums, Uaru, an appropriately sized eartheater group or large silver dollars are possibilities
      when their own social needs fit a substantially larger community aquarium. Small tetras, guppies and similarly
      slender fish remain predation risks. Highly aggressive large cichlids can intimidate or injure chocolates.
      Species-only maintenance is unnecessary, but brood defence still requires escape space. The decided hybrid-group
      list is empty with low confidence; it records insufficient supported crossing evidence rather than proof that
      the congener cannot cross.'

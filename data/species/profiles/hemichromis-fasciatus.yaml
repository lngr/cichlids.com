  khDkh:
    value:
      min: 1
      max: 3
    confidence: "medium"
    rationale: "The settled tally selects the rounded 1 to 3 dKH band with medium confidence; this natural KH fact
      carries no verification object. Wanzum alkalinity means convert to about 1.20 to 1.27 dKH and Volta
      tributary alkalinity to 1.98 to 3.01 dKH using 17.848 mg/L as CaCO3 per degree. FAO bicarbonate data
      imply a wider regional envelope of 0.92 to 3.21 dKH; Osse reports 6 to 48 mg/L alkalinity in the
      discussion, about 0.34 to 2.69 dKH, with the abstract instead starting at 8 mg/L. The decided band omits
      their low and high margins because the tally rounds the agreeing proposals, not because harm outside it
      is established. Checker-a's 3 to 15 dKH proposal combines unmeasured river inference with Bosumtwi. Its
      lake alkalinity of about 14.7 to 17.2 dKH, the CSIR mean equivalent of 24.61 dKH and the gas-profile
      paper's cited equivalent of 28.9 dKH describe exceptional sodium-rich closed-basin water and remain
      outside the representative river band. KH is an alkalinity equivalent, not a conversion from
      conductivity or GH."

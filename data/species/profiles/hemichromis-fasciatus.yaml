  predation:
    value: 3
    confidence: "high"
    rationale: "The qualified majority selects rubric level 3, with five votes for 3 and checker-a proposing 2.
      CRC independently identifies piscivory, while the Ayame 2 stomach study finds fish supplying 82.82
      percent of prey mass and 53.44 percent of relative importance, including fish dominance in the larger
      size class. This directly establishes a principal fish-prey strategy. Ehuikro instead has 77.88 percent
      insect biomass and only secondary fish prey in the largest sampled class; Mankessim and Eleyele also
      show substantial non-fish feeding. Those population and size differences remain in the evidence. The
      tally's high confidence applies to demonstrated substantial piscivory, not uniform fish dominance at
      every locality; deaths of large tankmates alone establish aggression rather than ingestion."

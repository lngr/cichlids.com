        archived: "cichlidatlas.com/species/hemichromis-fasciatus/2026-10-15T093709Z"
  compatibility:
    text: "A dedicated aquarium for one compatible adult pair is the selected routine recommendation. Small fishes
      can be eaten and substantial cichlids can be injured or killed. Some specialist accounts describe large
      catfish or other robust companions in substantially larger aquaria, including mixed setups of at least
      about 800 litres, but those exceptions do not establish routinely suitable partners. No heterospecific
      is listed as a standard recommendation. The empty hybrid-group list means that no supported named
      crossing group is identified; it is not evidence of reproductive isolation, and frempongi is a synonym
      rather than a second species."
    sources:

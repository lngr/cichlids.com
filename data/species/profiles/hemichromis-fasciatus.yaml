    confidence: "medium"
    rationale: "The five-to-one qualified majority selects piscivore with bloatSensitive false; checker-a instead
      proposes omnivore. Ayame fish biomass and the CRC classification fit the rubric's principal-food
      category. Ehuikro supports local invertivory despite the authors' broader omnivore label, Mankessim
      combines invertebrates and fish, and Eleyele includes abundant plant material. These are substantive
      ecological differences rather than grounds for treating every population as an obligate fish feeder.
      Offer a varied animal-rich diet using the foods in the decided tally. No read study tests special
      protein-related bloat susceptibility; false is an inference from feeding ecology and husbandry, not
      evidence of immunity to digestive disease. Ayame's speculative mouthbrooding explanation is rejected
      independently of its measured prey results."

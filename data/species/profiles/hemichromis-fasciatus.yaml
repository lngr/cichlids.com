  ghDgh:
    value:
      min: 1
      max: 3
    confidence: "medium"
    rationale: "The qualified-majority tally selects 1 to 3 dGH from five of six agreeing proposals. Measured
      Volta total hardness of 17.4 to 44.1 mg/L as CaCO3 converts to about 0.98 to 2.47 dGH, and Wanzum
      station means of 25.66 to 29.68 mg/L convert to 1.44 to 1.66 dGH. FAO Volta calcium and magnesium
      extrema imply about 1.03 to 3.07 dGH. The selected whole-degree band is narrower than the regional Osse
      measurements, 0.45 to 3.14 dGH, and excludes the provisional Okpara ion-derived envelope of 0.40 to 0.75
      dGH; independent ion extrema need not coincide. These low readings remain evidence of geographical
      variation. Checker-a proposed 4 to 10 dGH from conductivity and the Bosumtwi population, but
      conductivity does not uniquely determine GH. Bosumtwi seasonal total hardness of about 6.5 to 7.0 dGH
      describes a different closed-basin setting. The CSIR abstract reports internally inconsistent hardness
      and cation means, so neither derived mean sets the river endpoints. FishBase's upper value of 15 dH is
      not treated as a measured native range."

  breeding:
    text: "The fish lays adhesive eggs on a cleaned exposed surface such as stone or wood. Both parents
      participate in defending the brood, and newly hatched young may be moved to depressions in the
      substrate. Keep the spawning area sheltered and provide space beyond the nest so that a partner can
      escape attention. Female aggression can intensify after fertilization, making interrupted sight lines
      particularly useful. Free-swimming fry accept suitably small foods such as newly hatched Artemia.
      Provide growing space before raising a large brood because juvenile territorial conflict can cause
      losses."
    sources:

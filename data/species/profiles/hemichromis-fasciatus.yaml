partners:
  suitable: []
  unsuitable:
    - species: "Pelvicachromis pulcher"
      reason: "Small adults and juveniles face severe territorial harassment and possible predation; routine mixed
        keeping conflicts with the dedicated adult-pair recommendation."
    - species: "Paracheirodon innesi"
      reason: "Its small adult size makes it prey for a full-grown banded jewelfish."
    - species: "Maylandia lombardoi"
      reason: "The legacy report under the synonym frempongi includes deaths of kenyi cichlids; robust body size
        does not ensure safety."
    - species: "Hemichromis elongatus"
      reason: "A similarly marked territorial predator is a strong rival, and routine mixed keeping is not
        recommended."
profile:
  overview:
    text: "Five dark flank markings distinguish this large jewel cichlid from the smaller red jewels of
      Rubricatochromis. Hemichromis fasciatus combines active predation with extensive territorial defence and
      attentive parental care. Its size and potential for serious attacks make it a demanding fish for a
      spacious dedicated aquarium. Plan around one compatible adult pair and access to physical separation.
      The name Hemichromis frempongi refers to the Bosumtwi population within the same accepted species."

  husbandry:
    text: "Allow at least 720 litres, 200 cm length and about 60 cm depth for a compatible adult pair. Secure wood
      and rocks so that each fish can retreat beyond the other's view, while retaining open swimming space and
      fine substrate for digging. A divider or separate aquarium is essential when compatibility breaks down.
      Provide effective biological filtration, surface movement and regular waste removal. Ordinary routine
      care around 24 to 27 C has stronger husbandry support than permanent use of the warmest field readings.
      Keep chemistry stable. The broad tolerance endpoints, especially KH, include inference and do not
      identify equally well-tested targets throughout each interval."
    sources:
      - kind: "database"

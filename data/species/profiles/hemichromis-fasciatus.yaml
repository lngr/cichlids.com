        - by: "tiebreaker-1"
          value: false
        - by: "tiebreaker-2"
          value: true
      decision: true
      rationale: "Tally decision using conservative, 3 of 6 agreeing votes. The tally applies the conservative rule
        to a three-to-three split and selects true with low confidence. Generator, checker-a and tiebreaker-1
        propose false, emphasizing specialist recommendations for large catfish or other robust companions.
        Checker-b, checker-c and tiebreaker-2 propose true, emphasizing the usual dedicated aquarium
        recommendation for an adult or compatible pair. Aquarist Atlas and the Bulgarian account prefer
        species housing, while AKVARISTA permits robust mixed stocking in at least about 800 litres and
        Fishkeeping News names large catfish. The breeder account and the legacy frempongi thread report
        serious losses among substantial companions. With no qualified majority, the flag records the
        conservative routine recommendation; the contrary mixed-tank reports remain evidence and do not
        justify a list of routinely suitable partners. It does not recommend an adult group or imply that
        partners within a pair are automatically safe."

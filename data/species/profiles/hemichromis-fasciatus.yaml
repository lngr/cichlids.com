  note: "The Catalog of Fishes supplies the valid name and the authorship Peters, 1857. CRC uses 1858, which is
    retained as a source discrepancy rather than adopted. Legacy 562, Hemichromis frempongi, and legacy 561,
    Hemichromis fasciatus, represent the same accepted species. The synonymy preserves the Bosumtwi population
    within this profile without generalizing its unusual water chemistry to river populations."

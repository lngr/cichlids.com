  problems:
    text: "Inadequate space and a breakdown in pair compatibility are major causes of injury. Repeated hiding,
      damaged fins or exclusion from meals warrant checking both social pressure and water quality. Heavy
      animal-food feeding adds waste, so remove leftovers and maintain filtration. Quarantine additions and
      avoid unexamined feeder fish. Low-buffer water can develop unstable pH; GH does not measure that
      buffering. Loss of appetite, abnormal breathing or swelling requires investigation rather than assuming
      a single species-specific disease."
    sources:
      - kind: "website"
        title: "AKVARISTA.cz: Hemichromis fasciatus"

    confidence: "high"
    rationale: "The Catalog of Fishes places the accepted species in West Africa. FishBase supports the
      Senegal-to-Chad region and littoral river and lagoon habitats, while the Senegal field study confirms
      the western end. Modern identification separates similar five-spotted species, so the older Nile, upper
      Zambezi, Congo and other Central or southern African records cited by checker-a and hobby accounts do
      not define the core distribution. The Bosumtwi population belongs here through the Catalog synonymy.
      Regional chemical analogues such as Osse River are not presented as confirmed collection localities."

  sexing:
    text: "Mature males generally grow larger and appear more robust. Females carrying eggs can look fuller
      through the abdomen, and fin extension may differ between adults. Colour and fin shape alone do not
      reliably establish sex in young fish. Two fish believed to be opposite sexes can nevertheless be
      incompatible; their behaviour and access to separation determine whether a pair can be maintained
      safely."
    sources:

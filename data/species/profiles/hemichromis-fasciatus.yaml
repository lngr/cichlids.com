    tolerance:
      value:
        min: 1
        max: 10
      confidence: "low"
      rationale: "The qualified-majority tally decides 1 to 10 dKH with low confidence. Proposals are generator 0.5
        to 10, checker-a 2 to 18, checker-b 0 to 10, checker-c 0.5 to 10, tiebreaker-1 0.3 to 10 and
        tiebreaker-2 0.5 to 10 dKH. Five agreeing proposals have a lower median of 0.5, rounded by the tally
        to 1. No read source states a measured species-specific chronic KH interval. The working tolerance is
        inferred from ordinary-water keeping, mildly acidic to alkaline pH advice and soft through moderately
        hard GH recommendations; neither pH nor GH uniquely determines KH. It contains the decided natural
        band and extends above it without copying it as a physiological limit. The low river alkalinity
        measurements remain evidence rather than proof of captive failure below 1 dKH. The wider 2 to 18
        proposal and Bosumtwi alkalinity equivalents of 14.7 to 17.2, 24.61 and 28.9 dKH concern exceptional
        lake chemistry, not a general river-stock aquarium requirement. The 10 dKH upper endpoint needs direct
        keeping evidence."

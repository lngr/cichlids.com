  temperatureC:
    value:
      min: 25
      max: 30
    confidence: "medium"
    rationale: "The settled tally gives 25 to 30 C by unanimous agreement within the 1 C comparison threshold,
      using whole-degree rounding of agreeing endpoints. Okpara directly reports 25 to 30.1 C, so the decided
      maximum is slightly narrower than that measured range. The Volta upper-water depth means span 29.4 to 31
      C and are retained even though 31 C exceeds the selected typical range. Ehuikro, Ofin, Wanzum and
      Mankessim corroborate warm river and reservoir conditions. FishBase gives 23 to 25 C from an aquarium
      reference, as the US Fish and Wildlife Service explains, rather than a field series. Bosumtwi seasonal
      means of 29.8 to 32.3 C and its 32 C epilimnetic measurement describe an exceptional closed-basin
      population. Ohana measurements of 31.7 to 35 C are regional context with uncertain attribution to this
      species. Neither exceptional site expands the representative river range."

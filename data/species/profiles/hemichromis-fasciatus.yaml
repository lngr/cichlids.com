  sizeAndGrowth:
    text: "A male aquarium planning maximum of about 25 cm is supported by species registers and care accounts.
      Females are smaller, but the 20 cm female maximum is an estimate because reliable sex-specific aquarium
      maxima are scarce. Standard length omits the tail and cannot be equated directly with total length.
      FishBase records 21 cm standard length and a 26.5 cm total-length maximum; neither replaces the typical
      aquarium estimate. Juveniles can become reproductively active well before their final size. An 8 to 10
      year lifespan is a provisional planning interval around an approximate care-sheet estimate, not a
      measured survival distribution."

  socialBehavior:
    text: "Pairs defend substantial areas, but a pair bond does not guarantee safety. Introductions and changes
      around spawning can trigger serious attacks by either partner. Separate fish when persistent chasing
      prevents feeding or leaves one confined to a refuge. Visual barriers should permit escape into another
      part of the aquarium. Unrelated adults are not a peaceful group, and juveniles can also fight or
      cannibalize weaker siblings. A dedicated aquarium reduces conflict with other species but does not
      remove partner risk."
    sources:
      - kind: "website"

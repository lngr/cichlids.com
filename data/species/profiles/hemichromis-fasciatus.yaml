        archived: "necichlids.org/single-post/2017/06/21/wild-caught-hemichromis-fasciatus-bonding/2026-10-15T093859Z"
  diet:
    text: "Use suitable carnivore pellets with varied aquatic insect foods, crustaceans and modest portions of
      fish flesh. Small fishes are vulnerable prey, although live feeder fish are unnecessary. The piscivore
      classification reflects CRC and the Ayame population, where fish supply most ingested prey mass. Ehuikro
      fish instead eat predominantly insects, while other studies find mixed diets. This ecological
      flexibility supports variety rather than exclusive fish feeding. The false bloat-sensitivity flag is
      inferred from feeding ecology and does not mean freedom from digestive disease. Feed measured portions
      and check that both members of the pair obtain food."
    sources:

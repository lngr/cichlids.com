  ph:
    value:
      min: 6.4
      max: 8.1
    confidence: "medium"
    rationale: "The settled unanimous tally selects pH 6.4 to 8.1 from the closely agreeing proposals. Okpara
      directly measures those endpoints, corroborated centrally by Wanzum, Mankessim, Ofin and Ehuikro. The
      adopted range is narrower at the acidic end than the Osse regional analogue, pH 6.2 to 7.5, and slightly
      below the Ehuikro maximum of 8.13. FAO regional Volta pH 6.8 to 8.5 and Tano pH 6.9 to 9.0 are broader
      context without paired species identifications and do not define this fish's typical range. Bosumtwi pH
      8.3 to 8.8 in the seasonal study and about 9.1 in the gas-profile study are exceptional lake conditions.
      FishBase supplies only a lower pH bound of 7.0; checker-a's filled upper endpoints remain identifiable
      as inferences in evidence."

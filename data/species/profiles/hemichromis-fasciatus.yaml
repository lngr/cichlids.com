  habitat:
    text: "The species occupies West African river margins, floodplain waters, reservoirs and coastal lagoons.
      Vegetated edges and open water both occur among sampled habitats. Okpara measurements span 25 to 30.1 C
      and pH 6.4 to 8.1; Volta and Wanzum data support dilute freshwater with modest buffering. The
      representative profile ranges summarize these river conditions rather than every locality. Lake Bosumtwi
      in Ghana, home of the population named frempongi, is an exceptional closed basin: one seasonal study
      reports 29.8 to 32.3 C, pH 8.3 to 8.8, about 6.5 to 7.0 dGH and alkalinity equivalent to 14.7 to 17.2
      dKH. A separate depth-profile study measures epilimnetic pH near 9.1 and cites alkalinity equivalent to
      about 28.9 dKH; the CSIR abstract reports mean pH 8.85 and an alkalinity equivalent near 24.61 dKH, with
      inconsistent hardness and cation results. These separate datasets describe the lake without establishing
      a single pooled chemistry range or aquarium targets for river stocks. Older Central and southern African
      records require caution because similar five-spotted species complicate identification."
    sources:

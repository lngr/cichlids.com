    tolerance:
      value:
        min: 6
        max: 8.1
      confidence: "medium"
      rationale: "The qualified majority decides pH 6.0 to 8.1, with five proposals matching this range and
        checker-a proposing 6.0 to 8.8. NCS gives 6.0 to 7.5, AKVARISTA 7.0 to 8.0, and the Bulgarian summary
        and breeding section 6.0 to 8.0, with routine care at 6.5 to 7.5. Atlas has care advice of 6.5 to 8.0
        as well as an ecological summary reported by checker-b as 6.4 to 8.1. Okpara supports extending the
        upper aquarium endpoint to the natural maximum of 8.1. Midgley's older general advice of 6.0 to 7.0 is
        narrower and remains dissenting evidence. The chosen interval is narrower than the Bosumtwi-based 6.0
        to 8.8 proposal and excludes the lake's pH 8.3 to 8.8 seasonal observations and approximately 9.1
        epilimnion, which do not establish long-term aquarium limits for river stocks. FAO regional Volta 6.8
        to 8.5 and Tano 6.9 to 9.0 are contextual field ranges rather than species-specific captive trials.
        The exact chronic endpoints remain uncertain."

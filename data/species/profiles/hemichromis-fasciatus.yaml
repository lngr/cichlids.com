      value:
        min: 23
        max: 31
      confidence: "low"
      rationale: "The unanimous tally decides 23 to 31 C from proposals of 22 to 31 C by generator and checker-c and
        23 to 31 C by checker-a and checker-b; the lower agreeing median of 22.5 C rounds to 23 C. NCS
        recommends 23 to 28 C, AKVARISTA 23 to 26 C and the Bulgarian account 24 to 28 C. The adopted interval
        is narrower at the cool end than the 22 to 26 C Einrichtungsbeispiele advice and the generic 22 to 28
        C jewel-cichlid sheet. Its warm endpoint exceeds routine care advice but contains the natural 25 to 30
        C tally range and the 30.1 C Okpara observation. The Volta depth means reach 31 C. Healthy lifelong
        captive maintenance at the warm endpoint is not established, so confidence remains low and routine
        keeping near 24 to 27 C is better supported."

    tolerance:
      value:
        min: 1
        max: 15
      confidence: "low"
      rationale: "The qualified-majority tally decides 1 to 15 dGH with low confidence. Proposals are generator 1 to
        16, checker-a 2 to 15, checker-b 0.4 to 15, checker-c 1 to 20, tiebreaker-1 0.4 to 16 and tiebreaker-2
        1 to 15 dGH. Five proposals agree within the comparison tolerance; their endpoint medians round to 1
        and 15. FishBase supplies only the 15 dH upper boundary. This decision is narrower at the hard end
        than Einrichtungsbeispiele's 4 to 16 dGH, the Bulgarian routine range of 6 to 20 and its breeding
        range of 4 to 18. The 1 dGH lower boundary is inferred from native dilute water and contains the
        settled natural 1 to 3 dGH band; the softer Osse 0.45 to 3.14 dGH and Okpara ion-derived 0.40 to 0.75
        dGH evidence remain retained. Exact lifelong performance at either endpoint is not tested. Qualitative
        descriptions of Bosumtwi as hard water cannot supply numerical GH bounds."

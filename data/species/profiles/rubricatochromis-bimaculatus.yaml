        proposed {\"min\":0.3,\"max\":18}; checker-c proposed {\"min\":0.1,\"max\":18}. The tally considers
        all four proposals unanimous within 2 dGH and uses median bounds, rounded to integers, giving 0 to 18
        dGH. Seriously Fish and Aqua-Fish recommend 4 to 18 dGH; FishProfiles and FishBase give 4 to 16,
        Fischlexikon 4 to 12 and Fishkeeping 5 to 15. The upper bound follows the broader established care
        interval instead of the generator's narrower 16 dGH choice. The lower bound is rounded from small
        positive proposals and extended to include the decided very-soft natural proxy; it is not a tested
        zero-mineral husbandry condition. Field proxies do not establish long-term tolerance. Different trade
        species may underlie the care sheets, so the entire containing range remains low confidence."

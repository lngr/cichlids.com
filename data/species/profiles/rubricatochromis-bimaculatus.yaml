  ghDgh:
    value:
      min: 0
      max: 1
    confidence: "low"
    rationale: "generator proposed {\"min\":0.1,\"max\":1}; checker-a proposed {\"min\":1,\"max\":4}; checker-b
      proposed {\"min\":0.3,\"max\":1}; checker-c proposed {\"min\":0.1,\"max\":1}; tiebreaker-1 proposed
      {\"min\":0.6,\"max\":1.2}; tiebreaker-2 proposed {\"min\":0,\"max\":2}. The tally classifies all six
      proposals as agreeing under the 2 dGH bound tolerance and uses their median bounds rounded to integers,
      resulting in 0 to 1 dGH with qualified-majority verification and low confidence. The permissive
      comparison accepts checker-a's much higher 1 to 4 dGH estimate; agreement therefore does not mean six
      identical measurements. Liberian raw surface-water hardness reported by Earthtime is about 0.50 to 0.90
      dGH, and paired Matambo calcium and magnesium give about 0.37 to 0.54 dGH. Marvoe monitoring gives an
      estimated 0.14 to 0.81 dGH subject to detection limits, and the Whein creek table reports about 0.56
      dGH. Gasior's 20 ppm hardness converts conditionally to 1.12 dGH, above the decided upper bound, while
      the AKA bertholdi record gives GH 0.6 without a pinpointed locality. Zero is a rounding outcome, not a
      proven zero-hardness habitat. Conductivity and TDS cannot uniquely determine GH; checker-a's conversion
      is rejected, and RETRAP magnesium without calcium gives only a partial contribution. FishBase's much
      wider 4 to 16 dH is husbandry-derived. These regional proxies are not species collection measurements;
      report evidence is restricted to the indexed passages available, and the generator's 2015 Marvoe
      calculation could not be independently retrieved."

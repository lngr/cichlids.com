  sizeAndGrowth:
    text: "Plan space for adults approaching 13 cm. The same allowance is used for males and females because the
      published separate sizes are inconsistent and a verified Liberian sex-specific growth series is
      unavailable. FishBase gives an unsexed captive maximum of 12 cm, whereas FishProfiles lists 13 cm for
      each sex. Historical standard-length maxima are not directly interchangeable with total aquarium
      lengths. Five to ten years is a rough planning horizon drawn from conflicting care-sheet estimates, not
      a measured lifespan distribution."

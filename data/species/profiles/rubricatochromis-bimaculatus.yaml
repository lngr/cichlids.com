      rationale: "generator proposed {\"min\":22,\"max\":28}; checker-a proposed {\"min\":21,\"max\":28}; checker-b
        proposed {\"min\":22,\"max\":29}; checker-c proposed {\"min\":21,\"max\":28.3}. The tally treats the
        four proposals as unanimous within the 1 C bound tolerance and takes median bounds of 22 to 28 C.
        Seriously Fish, Fishkeeping and Aqua-Fish give this same aquarium interval. Broader published guidance
        is retained explicitly: AquaExperience's summary lists 22 to 30 C although its setup text gives 24 to
        28 C; FishProfiles gives 21 to 25 C and breeding at 27 C. The final interval does not claim that the
        omitted extremes are lethal. It contains the decided natural proxy but lacks multi-year health records
        for securely identified Liberian fish, so confidence remains low."

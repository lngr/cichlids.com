  husbandry:
    text: "One compatible adult pair should have at least 200 litres with a base about 120 cm long and 40 cm deep.
      This is a cautious space recommendation rather than an experimentally tested threshold. Arrange stable
      wood and stones to interrupt sight lines and provide multiple escape routes. Firm egg-laying surfaces
      and robust or attached plants can share the layout with fine substrate for digging. Maintain clean,
      well-oxygenated water and shelter from excessive current. Care sheets support an aquarium interval of 22
      to 28 C, pH 5.9 to 7.8 and GH 0 to 18 dGH, with KH 0 to 8 dKH much less securely supported. The very
      soft lower extensions are habitat-based estimates rather than proven long-term captive limits. Keep a
      spare aquarium or divider ready and avoid using uncertain endpoints as routine targets."
    sources:
      - kind: "database"

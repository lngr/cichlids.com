  beginnerSuitability:
    value: "demanding"
    confidence: "low"
    rationale: "The generator proposes demanding; checker-a, checker-b and checker-c propose moderate, consistent
      with the public Cichlid Room Companion intermediate rating. Seriously Fish advises against beginners and
      describes lethal pairing failures. Retain demanding as a cautious recommendation because a keeper must
      recognize incompatible pairs and separate them promptly; ordinary food and water requirements alone do
      not remove this risk. The moderate proposals and the current intermediate rating remain credible
      alternatives. This decision concerns practical aggression management and uncertain identification, not
      demonstrated chemical fragility, and confidence stays low."

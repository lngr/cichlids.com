partners:
  suitable:
    - species: "Phenacogrammus interruptus"
      reason: "Adult Congo tetras are a conditional option named in legacy jewel care accounts. This combination is
        not verified for the revised Liberian species."
      condition: "A substantially larger aquarium than the 200 L pair minimum with separate swimming space and
        refuge areas; companions may need removal immediately when brood defense begins."
    - species: "Synodontis species of suitable adult size"
      reason: "Legacy care databases allow robust catfish, but this is a genus-level option rather than a proven
        species-specific pairing."
      condition: "A substantially larger aquarium with catfish refuges outside the pair territory and separate
        feeding opportunities; reassess at spawning."
  unsuitable:
    - species: "Paracheirodon innesi"
      reason: "Small adult size creates mouth-sized-prey risk and provides little resistance to brood-care attacks."
    - species: "Mikrogeophagus ramirezi"
      reason: "A small and comparatively vulnerable territorial cichlid can be injured or excluded from food and
        shelter by the jewel pair."
    - species: "Rubricatochromis guttatus"
      reason: "A similar red jewel creates rivalry and belongs to the same presumed hybrid group; trade labels do
        not reliably establish species identity."
    - species: "Neolamprologus multifasciatus"
      reason: "Small adults face predation and territorial injury. Its specialized shell habitat and strongly
        alkaline natural-water preferences also differ from the intended creek aquarium."
profile:
  overview:
    text: "Rubricatochromis bimaculatus is the valid name of the Liberian jewel cichlid catalogued historically as
      Hemichromis bimaculatus. Rubricatochromis was established in 2022; the 2026 revision clarified the
      restricted Liberian species and restored R. fugax for the Sierra Leone form. True bimaculatus is
      relatively slender and usually lacks the dense reflective body dots familiar from shop jewels. A common
      name or red coloration cannot identify it reliably. This profile follows the described species while
      treating older trade-name husbandry as provisional evidence."
    sources:
      - kind: "catalog-of-fishes"

        County. The 2026 revision directly lists preserved material from Joe Town, Yanokala and Sanoyah in
        Bong County and multiple Sinoe County sites. These verified counties and named Bong sites are
        retained. Geebo-Dugbe drainage labels are omitted because the revision treatment does not attach them
        explicitly to the specimens. Older broader country lists are superseded by the revision and current
        Catalog."
    - field: "features.maxSizeCm"
      proposals:
        - by: "generator"
          value:
            male: 13
            female: 13
        - by: "checker-a"
          value:
            male: 12
            female: 10
        - by: "checker-b"
          value:
            male: 12
            female: 10
        - by: "checker-c"
          value:
            male: 12
            female: 10
      decision:
        male: 13
        female: 13
      rationale: "The generator proposes 13 cm for both sexes; checker-a, checker-b and checker-c propose 12 cm
        males and 10 cm females. FishProfiles explicitly gives 13 cm for each sex, FishBase reports an unsexed
        captive maximum of 12 cm, and Aqua-Fish gives a combined 10 to 13 cm aquarium interval with larger
        males. Retain 13 cm for both sexes as a cautious adult space estimate rather than inventing a measured
        10 cm female ceiling. The wider 15 cm SL in Seriously Fish and 15 cm maximum in Fishkeeping are
        historical maxima with uncertain identity and length conventions; SL must not be silently equated with
        total length. No typical adult size series for sexed, identified Liberian fish was found."
    - field: "features.aggressionHeterospecific"
      proposals:
        - by: "generator"
          value: 4
        - by: "checker-a"
          value: 3
        - by: "checker-b"
          value: 4
        - by: "checker-c"
          value: 4
      decision: 4
      rationale: "The generator, checker-b and checker-c propose level 4; checker-a proposes level 3 from
        conditional robust tankmate recommendations and milder behavior outside spawning. Seriously Fish
        explicitly warns that brood defense may kill remaining tankmates, while Fishkeeping requires their
        removal at spawning. Level 4 captures this recurring danger to companions under the recommended paired
        social unit. It is not an assertion of constant attacks. Historical trade identity and limited reports
        of authenticated Liberian fish cap confidence at medium."

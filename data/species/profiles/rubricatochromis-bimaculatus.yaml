  note: "The Catalog of Fishes lists Rubricatochromis bimaculatus (Gill, 1862) as valid and confines its current
    distribution to inland Liberia. The genus was erected in 2022; the 2026 revision retained this combination
    and separated Sierra Leone fish as R. fugax. Both the Hemichromis and Rubricatochromis Catalog lists were
    consulted. R. fugax, R. cristatus, R. guttatus and R. stellifer are distinct species rather than current
    synonyms of bimaculatus. Many trade fish and historical biological records bearing the legacy name concern
    other red jewels. This profile represents the described Liberian species; the legacy entry is not
    reclassified as a hybrid."

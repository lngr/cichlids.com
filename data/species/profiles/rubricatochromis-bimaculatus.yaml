    rationale: "generator proposed {\"min\":22.5,\"max\":26.4}; checker-a proposed {\"min\":24,\"max\":27};
      checker-b proposed {\"min\":25,\"max\":29}; checker-c proposed {\"min\":23,\"max\":28.3}; tiebreaker-1
      proposed {\"min\":23,\"max\":28}; tiebreaker-2 proposed {\"min\":23,\"max\":28}. The tally uses
      qualified-majority agreement, 4 of 6 votes, and the median bounds of that agreeing set to retain 23 to
      28 C. Gasior reports 23 to 24 C in shaded Juarzon and Greenville streams; the LIBCOF database records 25
      C at Wayla and 28 C at Karmoh. These are regional killifish localities without confirmed R. bimaculatus.
      Wider regional readings include LIBCOF flowing waters at 25 to 29 C and a drying pool at 32.1 C; Tengbeh
      et al. compile 23.00 to 28.23 C across mixed sampling settings. Neither warmer extremes nor the Ivorian
      Banco and Cavally station means establish this species' endpoints. Cheke et al. also report cooler Bong
      Hills streams at 22.5 to 24.5 C. Thus the decided range is a representative regional proxy, not the
      complete measured habitat range. FishBase's 21 to 23 C is traced to aquarium literature and cannot
      supply natural bounds. No occupied-locality seasonal series was found; low confidence is retained."

        alongside implausible social advice. The retail/blog pages are websites, and no second reliable
        numerical husbandry source confirms the full interval. The literature evidence below is field
        alkalinity, not an aquarium health trial. Eight is a cautious practical ceiling relative to the wider
        10 and below-12 guidance; zero follows habitat inclusion rather than demonstrated long-term care.
        Tally confidence remains low."

  predation:
    value: 2
    confidence: "low"
    rationale: "generator proposed 2; checker-a proposed 1; checker-b proposed 2; checker-c proposed 2;
      tiebreaker-1 proposed 2; tiebreaker-2 proposed 2. Five of six votes support level 2, so
      qualified-majority verification is retained. AquaExperience warns about vulnerable small tankmates;
      Aquarist Atlas describes animal feeding that includes tiny fish; FishBase prey records and historical
      care pages also include fish. These accounts support a cautious mouth-sized-prey risk, but none measures
      regular whole-fish consumption or a prey-size limit in verified Liberian specimens. Checker-a's level 1
      is plausible for occasional fry consumption, but the tally selects level 2 to cover larger swallowable
      companions. Ghanaian FishBase records fall outside the revised native range. Territorial injury is not
      evidence of feeding, and no source establishes fish as the main diet needed for level 3. Retailer and
      general hobby claims receive website weight. Confidence remains low."

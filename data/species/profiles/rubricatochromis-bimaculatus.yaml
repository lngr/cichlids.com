  habitat:
    text: "Identified museum material comes from Bong and Sinoe counties in Liberia. Forest association is
      supported by the revision, with sediment-bottomed channels and vegetated shelter described in older
      ecological accounts. The natural working ranges are 23 to 28 C, pH 5.9 to 6.9, GH 0 to 1 dGH and
      alkalinity equivalent to KH 0 to 2 dKH. They are assembled from regional water observations, not a
      survey of water collected alongside identified fish. Rounded zeros and excluded regional extremes should
      not be interpreted as precise habitat limits. Shade, fine substrate and sheltered areas among wood and
      planting suit the intended aquarium."

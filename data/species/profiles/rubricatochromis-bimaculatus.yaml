          - "black"
        pattern: "spots"
      rationale: "The generator, checker-b and checker-c propose brown, red and black with spots; checker-a omits
        black from the dominant colors. The 2026 revision directly describes a brown resting ground color that
        becomes red during territorial or reproductive activity, together with black flank and caudal marks.
        FishBase independently records dark lateral blotches, so black is retained. Iridescent head/body dots
        are scarce or absent in true bimaculatus, although some male fins carry a few. Dense turquoise
        spangling in old trade accounts is not the identification template. Mark visibility changes with
        state; spot count alone is inadequate."
    - field: "features.feedingSpeed"
      proposals:
        - by: "generator"
          value: "normal"
        - by: "checker-a"
          value: "hasty"
        - by: "checker-b"
          value: "normal"
        - by: "checker-c"
          value: "normal"
      decision: "normal"
      rationale: "The generator, checker-b and checker-c propose normal; checker-a proposes hasty solely from model
        knowledge. FishProfiles describes ordinary food acceptance and occasional guarding but does not
        establish indiscriminate rushing until all food is gone. Normal is retained as the least speculative
        working category. Neither competitive feeding speed nor feeding time has been measured for identified
        Liberian pairs, so confidence remains low."
    - field: "features.minTank"
      proposals:
        - by: "generator"
          value:
            volumeL: 200
            lengthCm: 120
            depthCm: 40
        - by: "checker-a"
          value:
            volumeL: 150
            lengthCm: 100
            depthCm: 40
        - by: "checker-b"
          value:
            volumeL: 180
            lengthCm: 120
            depthCm: 40
        - by: "checker-c"
          value:
            volumeL: 180
            lengthCm: 120
            depthCm: 40
      decision:
        volumeL: 200
        lengthCm: 120
        depthCm: 40
      rationale: "For one established adult pair, the generator proposes 200 L with a 120 by 40 cm base; checker-a
        proposes 150 L and 100 by 40 cm; checker-b and checker-c propose 180 L and 120 by 40 cm. Fischlexikon
        gives at least 200 L for a pair, Seriously Fish gives 120 by 30 cm and about 108 L, and AquaExperience
        recommends 180 to 240 L with a 100 to 120 cm long side. TropicalFreshwaterFish recommends about 190 L
        and 122 cm for larger adults. Retain the generator's 200 L and 120 by 40 cm base as a cautious
        planning minimum that allows shelter and escape routes. The 40 cm depth is an adjudicated design
        margin, not a published physiological threshold. Companions need substantially greater space, and even
        the minimum cannot make an incompatible pair safe."
    - field: "features.lifespanYears"
      proposals:
        - by: "generator"
          value:
            min: 5
            max: 10
        - by: "checker-a"
          value:
            min: 5
            max: 8
        - by: "checker-b"
          value:
            min: 4
            max: 6
        - by: "checker-c"
          value:
            min: 8
            max: 10
      decision:
        min: 5
        max: 10
      rationale: "The generator proposes 5 to 10 years, checker-a 5 to 8 from model knowledge, checker-b 4 to 6 and
        checker-c 8 to 10. Aqua-Fish estimates about five years and Fishkeeping eight to ten; these
        independent structured accounts support a broad five-to-ten-year planning horizon. Garnelio's wider
        lower extension to four years concerns mixed-label retail stock and has less weight. AquaExperience
        gives five to eight. No identified Liberian cohort or survival series was found; the decided interval
        is an approximate aquarium estimate rather than a guaranteed minimum or species longevity limit."
    - field: "features.beginnerSuitability"
      proposals:
        - by: "generator"
          value: "demanding"
        - by: "checker-a"
          value: "moderate"
        - by: "checker-b"
          value: "moderate"
        - by: "checker-c"
          value: "moderate"
      decision: "demanding"
      rationale: "The generator proposes demanding; checker-a, checker-b and checker-c propose moderate, consistent
        with the public Cichlid Room Companion intermediate rating. Seriously Fish advises against beginners
        and describes lethal pairing failures. Retain demanding as a cautious recommendation because a keeper
        must recognize incompatible pairs and separate them promptly; ordinary food and water requirements
        alone do not remove this risk. The moderate proposals and the current intermediate rating remain
        credible alternatives. This decision concerns practical aggression management and uncertain
        identification, not demonstrated chemical fragility, and confidence stays low."
    - field: "features.ghDgh.evidence"
      proposals:
        - by: "checker-a"
          value: "GH inferred from conductivity and total dissolved solids"
        - by: "checker-b"
          value: "GH measured by titration or calculated from paired Ca and Mg"
        - by: "checker-c"
          value: "GH calculated from Ca and Mg with detection-limit qualifications"
      decision: "Retain measured/ion-based regional evidence and label the conductivity-derived claim as rejected;
        preserve the tally decision exactly."
      rationale: "Conductivity and total dissolved solids do not uniquely specify calcium and magnesium hardness.
        Regional evidence is not a collecting-site measurement for verified Liberian bimaculatus."

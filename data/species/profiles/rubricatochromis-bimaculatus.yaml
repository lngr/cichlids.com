  problems:
    text: "Pair incompatibility and sudden reproductive aggression are the main practical concerns described in
      care literature. Watch for a fish losing access to food or shelter, persistent pursuit and fresh wounds.
      Clear sight lines and insufficient cover can leave no usable escape route despite adequate nominal
      volume. Digging can displace plants and undermine unsecured structures. Water quality, oxygenation and
      social pressure should be checked when activity or feeding changes. At very low buffering, pH stability
      deserves close monitoring. Uncertain trade identity and provisional tolerance endpoints are reasons to
      follow the fish's established conditions and response carefully."

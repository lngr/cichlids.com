  sexing:
    text: "Species identification comes before sexing. The revision distinguishes true bimaculatus using a
      combination of body proportions and marking details, including a solidly dark flank blotch and sparse
      reflective body dots. Marks can fade, so counting spots alone is unreliable. Older aquarium accounts
      associate males with somewhat longer fin tips and females with a fuller body when carrying eggs; these
      tendencies do not securely sex every juvenile or red jewel species. A compatible self-selected pair is
      more useful for husbandry than an unsupported sex assignment based on color."
    sources:
      - kind: "literature"
        title: "Lamboj, A. and Koblmüller, S. (2026). Who Is Who in Rubricatochromis Lamboj & Koblmüller, 2022
          (Cichliformes, Cichlidae): Taxonomic Revision with Description of Four New Species and Revalidation

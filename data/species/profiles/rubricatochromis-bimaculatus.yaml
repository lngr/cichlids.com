  khDkh:
    value:
      min: 0
      max: 2
    confidence: "low"
    rationale: "generator proposed {\"min\":1.1,\"max\":2.3}; checker-a proposed {\"min\":0.5,\"max\":2};
      checker-b proposed {\"min\":0.3,\"max\":1.5}; checker-c proposed {\"min\":0,\"max\":1.2}. All four
      proposals agree within the tally's 2 dKH bound tolerance; their median bounds rounded to integers give 0
      to 2 dKH at low confidence. The natural khDkh fact intentionally carries no verification object. This is
      an alkalinity-equivalent habitat proxy, not a carbonate-speciation measurement. Yando alkalinity of 20
      to 40 mg/L conditionally converts to 1.12 to 2.24 dKH, which extends above the decided upper bound;
      RETRAP explicitly reports CaCO3-equivalent alkalinity corresponding to 1.126 to 1.826 dKH. Other
      regional excerpts support lower buffering: Earthtime gives roughly 0.80 to 1.41 dKH, Matambo 0.38 to
      0.51, Marvoe 0.17 to 1.12 and Whein creek a reported zero test result of unspecified precision. Organic
      buffering may contribute to total alkalinity. The Nero conductivity/pH inference is rejected. No study
      confirms this species at its measurement stations, and the DOI-less reports were available only as
      indexed excerpts."

      rationale: "generator proposed {\"min\":5.9,\"max\":7.8}; checker-a proposed {\"min\":6,\"max\":7.8};
        checker-b proposed {\"min\":5.8,\"max\":7.8}; checker-c proposed {\"min\":5,\"max\":7.8}; tiebreaker-1
        proposed {\"min\":6,\"max\":7.8}; tiebreaker-2 proposed {\"min\":5,\"max\":7.8}. Qualified-majority
        agreement of 4 of 6 gives pH 5.9 to 7.8. Seriously Fish and Aqua-Fish recommend 6.0 to 7.8;
        Fishkeeping gives 6.0 to 7.6 and FishProfiles 6.5 to 7.5. The lower edge below 6.0 is a small inferred
        extension, not a demonstrated long-term captive limit. Checker-c and tiebreaker-2 propose the wider
        5.0 to 7.8 by incorporating acidic regional field water; the other proposals begin at 5.8, 5.9 or 6.0.
        The tally retains the near-6.0 cluster and the exact median/rounding outcome. Regional water
        measurements, including LIBCOF's lower readings, do not demonstrate years of aquarium health there.
        The range contains the decided natural pH proxy, and low confidence is retained for the unresolved
        trade identities."

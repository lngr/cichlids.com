        archived: fishprofiles.com/profiles/freshwater/cichlids/hemichromis_bimaculatus/2026-10-14T103037Z
        accessed: "2026-10-13"
  diet:
    text: "The decided diet category is invertivore because the available natural-food accounts chiefly describe
      insects and small crustaceans. Acceptance of vegetable supplements and mixed prepared foods explains why
      several aquarium accounts instead call these jewels omnivores. Offer a complete suitable cichlid food
      with varied invertebrate foods such as Artemia, Daphnia and aquatic insect larvae. Small fish are
      potential prey, so the compatibility profile uses predation level 2; this does not mean that fish
      dominate the natural diet. No distinctive sensitivity to a protein-related bloat syndrome is
      established, and the false flag does not imply protection from ordinary digestive disease."

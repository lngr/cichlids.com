  compatibility:
    text: "The speciesOnly flag is false because established care databases allow some mixed-tank options. At the
      minimum aquarium size, keep the compatible pair as the planned adult unit. Adult Congo tetras or
      suitably robust catfish are conditional candidates in a substantially larger aquarium, with refuge space
      and the ability to remove them at spawning. Small schooling fish and delicate territorial cichlids face
      predation or serious attack. Other Rubricatochromis add rivalry and presumed crossing risk. The curated
      genus group rests on general aquarium warnings, not a confirmed free-choice cross of the restricted
      Liberian species."
    sources:
      - kind: "literature"
        title: "Horvath. The stunning cichlid of Lake Turkana. Practical Fishkeeping."

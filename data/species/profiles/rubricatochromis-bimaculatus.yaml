  ph:
    value:
      min: 5.9
      max: 6.9
    confidence: "low"
    rationale: "generator proposed {\"min\":5.9,\"max\":7.8}; checker-a proposed {\"min\":6,\"max\":7.2};
      checker-b proposed {\"min\":5.8,\"max\":6.8}; checker-c proposed {\"min\":5,\"max\":6.9}; tiebreaker-1
      proposed {\"min\":6,\"max\":6.9}; tiebreaker-2 proposed {\"min\":5,\"max\":6.9}. No candidate reached
      the required qualified majority, so the tally takes the median of all six lower bounds and all six upper
      bounds, rounded to one decimal, giving pH 5.9 to 6.9 with low confidence. The 3 of 6 agreement count
      describes the leading cluster, not a majority for the final range. This avoids intersecting disparate
      proxies into an artificially small interval. Gasior gives 6.0 to 6.5 and LIBCOF includes Wayla at 6.86.
      Wider field observations remain visible: Marvoe Creek spans 5.0 to 6.4, selected LIBCOF sites 5.0 to
      6.86, other LIBCOF forest microhabitats reach 4.3, and RETRAP surface samples span 7.08 to 7.79. Yando's
      table gives 5.9 and 6.1 while its narrative gives 6.2 to 6.9. None supplies identified fish at the
      measured sites. The Nero River result is an abundance-weighted optimum for an older Ivorian
      identification, not a measured Liberian range. These competing regional settings do not establish
      physiological endpoints; reports without a DOI were checked only through accessible indexed excerpts,
      not full-text retrieval."

  socialBehavior:
    text: "A compatible pair is the adult social unit. A juvenile group can be used temporarily to let a pair
      form, provided the remaining fish can then be moved. Combining two adult strangers can leave the weaker
      fish seriously injured or dead. Readiness to reproduce may differ between partners, so even an
      established pair needs observation. Both adults should be able to feed and leave cover; persistent
      confinement or damage requires separation. Large territorial defenses recur during brood care and can
      make a formerly workable arrangement unsafe."
    sources:
      - kind: "database"
        title: "Seriously Fish: Hemichromis bimaculatus, Jewel Cichlid"
        url: "https://www.seriouslyfish.com/species/hemichromis-bimaculatus/"

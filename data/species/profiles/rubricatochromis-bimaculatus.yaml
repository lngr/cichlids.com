  breeding:
    text: "Pairs attach eggs to an exposed firm surface and guard the brood together. Larvae may be moved into
      shallow substrate pits before swimming freely. Cover and multiple spawning surfaces provide options, but
      they do not eliminate partner aggression. Remove threatened companions promptly as defense escalates.
      Historical accounts give several hundred eggs and short hatch times, but those precise figures are not
      established for authenticated Liberian bimaculatus. Small fry foods can include newly hatched Artemia
      when the young are ready to feed."

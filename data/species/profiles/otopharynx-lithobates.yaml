  predation:
    value: 1
    confidence: medium
    rationale: >-
      Decided unanimously by the vote count (3 of 3). In the lake the species does not hunt fish:
      the describer found stomachs filled almost entirely with planktonic crustaceans, and Cleaver
      et al. (2009) and FishBase describe a picker of particles and droppings on the rock surface,
      which Cleaver et al. contrast explicitly with the piscivorous cave dweller Stigmatochromis
      modestus. Konings, as reported by the describer, saw the Maleri population stalk small mbuna,
      and Seriously Fish warns that small fish are eaten in the aquarium. Fry and fish up to about
      2 cm are therefore at risk when the chance arises, while larger fish are not hunted: level 1.
    sources:
      - *cleaver
      - *fishbase
      - *sf
      - *oliver
      - *fk
      - *guidarium
    evidence:
      - source: *cleaver
        value: 0
        note: feeds on morsels and droppings, unlike the fish-eating Stigmatochromis modestus
      - source: *fishbase
        value: 0
        note: droppings and edible morsels from the substrate; no fish named in the biology
      - source: *sf
        value: 1
        note: small fish are eaten in the aquarium
      - source: *oliver
        value: 1
        note: reports Konings' observation of the Maleri population stalking small mbuna; own stomach data show plankton
      - source: *fk
        value: 0
        note: peaceful community fish; no mention of eating fish
      - source: *guidarium
        value: 1
        note: flagged as fry predator
    verification:
      method: unanimous
      votes: {agree: 3, total: 3}

  diet:
    value:
      type: invertivore
      bloatSensitive: false
      foods:
        - zooplankton (copepods, cladocerans)
        - particles, detritus and fish droppings picked from rock
        - small invertebrates
        - flake and small pellets
        - frozen brine shrimp, mysis, krill and mosquito larvae
    confidence: low
    rationale: >-
      The five votes split 3 to 2: the generator, checker-b and tiebreaker-1 proposed omnivore,
      checker-a and tiebreaker-2 proposed invertivore, all with bloatSensitive false. With no
      qualified majority, the conservative rule of the vote count applies and takes the stricter
      of the proposed types, which is invertivore; hence the low confidence. The field data support
      both readings. After Oliver (1984, on the describer's website) the stomachs of wild fish held
      almost only whole planktonic crustaceans, mainly diaptomid copepods with the cladoceran
      Diaphanosoma, and the fish picked single plankters from the water. Konings (1990, via FishBase),
      Cleaver et al. (2009) and FishBase describe it as a scavenger of morsels, detritus and
      droppings of mainly herbivorous fish and of the cave catfish Bagrus meridionalis, picked from
      the rock surface; Practical Fishkeeping calls it a detritus feeder and the FishBase food items
      list detritus, small benthic invertebrates and fish. The Cichlid Room Companion summary
      (detritivorous and planktivorous) confirms both components. In the aquarium it takes flake
      and small pellets as well as the live and frozen animal food that Seriously Fish recommends
      as the bulk of the diet. No source links the species to bloat, so it is not marked
      bloat-sensitive.
    sources:
      - *oliver
      - *cleaver
      - *fishbase
      - &fbfood
        kind: database
        title: "FishBase food items: Otopharynx lithobates"
        url: https://www.fishbase.se/TrophicEco/FoodItemsList.php?vstockcode=2401&genus=Otopharynx&species=lithobates
        accessed: 2026-10-13
      - *pfk
      - *sf
      - *fishipedia
      - *fishprofiles
      - &crc
        kind: database
        title: "Cichlid Room Companion: Otopharynx lithobates, public summary (verification only)"
        url: https://cichlidae.com/species.php?id=uiYH-ApXpzK7H4RkbSXASA
        accessed: 2026-10-13
      - *fk
      - *glaser
    evidence:
      - source: *oliver
        value: {type: invertivore}
        note: stomachs of wild fish almost entirely planktonic crustaceans, copepods dominant
      - source: *cleaver
        value: {type: omnivore}
        note: scavenges morsels and droppings of other fish from rock

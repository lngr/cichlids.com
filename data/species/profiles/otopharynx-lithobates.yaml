schemaVersion: 1
id: otopharynx-lithobates
legacyIds:
  - 426
status: described
taxonomy:
  validName: Otopharynx lithobates
  genus: Otopharynx
  species: lithobates
  author: Oliver, 1989
  source: &cof
    kind: catalog-of-fishes
    title: "Eschmeyer's Catalog of Fishes, species of Otopharynx (entries lithobates and walteri)"
    url: https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Otopharynx
    accessed: 2026-10-13
  synonyms:
    - name: Otopharynx walteri Konings, 1990
      note: >-
        Described from Nakantenga Island in the Maleri Islands. Cleaver et al. (2009) placed it in
        the synonymy of O. lithobates because its measurements and counts lie entirely within the
        range of O. lithobates; the Catalog of Fishes follows them and notes that Konings (2016)
        treats the Maleri population as a subspecies.
  legacyNames:
    - Otopharynx lithobates
  note: >-
    Valid as Otopharynx lithobates Oliver 1989 in the Catalog of Fishes; described by Oliver in
    Eccles and Trewavas (1989) from Thumbi Island West. The trade names "red top Aristochromis" and
    "Aristochromis lombardoi" are misleading: the species is only distantly related to Aristochromis
    christyi. Ribbink et al. (1983) called it "Cyrtocara red dorsal". These are informal names, not
    nomenclatural synonyms.

    - field: features.maxSizeCm
      proposals:
        - by: generator
          value: {male: 15, female: 10}
        - by: checker-a
          value: {male: 16, female: 10}
        - by: checker-b
          value: {male: 16, female: 10}
      decision: {male: 16, female: 10}
      rationale: >-
        FishBase, Seriously Fish, Fishipedia, FishProfiles and Fishkeeper all name 16 cm for males,
        and Fishipedia ties it to dominant males of the aquarium. The generator's 15 cm rests on
        reading 16 cm as an upper value and on Practical Fishkeeping; with five sources on 16 cm
        that figure is the typical size of well-grown males, not a record.
    - field: features.diet
      proposals:
        - by: generator
          value: {type: omnivore, bloatSensitive: false}
        - by: checker-a
          value: {type: invertivore, bloatSensitive: false}
        - by: checker-b
          value: {type: omnivore, bloatSensitive: false}
        - by: tiebreaker-1
          value: {type: omnivore, bloatSensitive: false}
        - by: tiebreaker-2
          value: {type: invertivore, bloatSensitive: false}
      decision: {type: invertivore, bloatSensitive: false}
      rationale: >-
        Decided by the vote count (conservative). The votes split 3 to 2 between omnivore and
        invertivore, so no qualified majority exists; the conservative rule takes the stricter type,
        invertivore. Oliver found plankton in the stomachs, while Konings, Cleaver et al. (2009) and
        FishBase report droppings and detritus picked from rock.
    - field: features.diet.value.foods
      proposals:
        - by: generator
          value: [zooplankton (copepods, cladocerans), particles and fish droppings picked from rock, small invertebrates, flake and small pellets, "frozen brine shrimp, mysis and mosquito larvae"]
        - by: checker-a
          value: [zooplankton (copepods, cladocerans), small invertebrates, detritus and fish faeces, cichlid pellets and flakes, "frozen brine shrimp, mysis and mosquito larvae"]
        - by: checker-b
          value: [frozen mysis, krill, brine shrimp, mosquito larvae, live foods]
        - by: tiebreaker-1
          value: [faeces of herbivorous cichlids and other detritus, small benthic invertebrates, zooplankton, fry and small fish]
        - by: tiebreaker-2
          value: [zooplankton, copepods, frozen foods, live foods, cichlid pellets]
      decision: [zooplankton (copepods, cladocerans), "particles, detritus and fish droppings picked from rock", small invertebrates, flake and small pellets, "frozen brine shrimp, mysis, krill and mosquito larvae"]
      rationale: >-
        The lists describe the same natural and aquarium foods in different detail; they are
        merged. Fry and small fish are left out of the food list because they are an occasional
        catch, covered by the predation level.
    - field: features.aggressionHeterospecific
      proposals:
        - by: generator
          value: 2
        - by: checker-a
          value: 1
        - by: checker-b
          value: 1
      decision: 1
      rationale: >-
        The describer, Seriously Fish, Fishkeeper, Fishipedia and Practical Fishkeeping all call it
        relatively peaceful or not aggressive, and Seriously Fish keeps it even with rainbowfish.
        The chasing the generator weighed happens only around the spawning site, which the
        territory feature (small, breeding only) already covers.
    - field: features.coloration
      proposals:
        - by: generator
          value: {baseColors: [blue, yellow], pattern: mixed}
        - by: checker-a
          value: {baseColors: [blue, yellow], pattern: mixed}
        - by: checker-b
          value: {baseColors: [blue, yellow, orange], pattern: mixed}
      decision: {baseColors: [blue, yellow], pattern: mixed}
      rationale: >-
        Blue and sulphur yellow dominate the common trade form; orange-red belongs to the Domwe
        Island form and white to the Mumbo and Maleri forms, which the variants record.
    - field: features.minTank
      proposals:
        - by: generator
          value: {volumeL: 200, lengthCm: 120, depthCm: 45}
        - by: checker-a
          value: {volumeL: 240, lengthCm: 120, depthCm: 45}
        - by: checker-b
          value: {volumeL: 216, lengthCm: 120, depthCm: 45}
      decision: {volumeL: 240, lengthCm: 120, depthCm: 45}
      rationale: >-
        All agree on 120 by 45 cm. The volume depends only on the assumed height; about 240 litres
        matches a usual tank of this footprint and lies in the middle of the recommendations, which
        range from 150 to 400 litres.
    - field: features.lifespanYears
      proposals:
        - by: generator
          value: {min: 6, max: 10}
        - by: checker-a
          value: {min: 8, max: 10}
        - by: checker-b
          value: {min: 6, max: 10}
      decision: {min: 8, max: 10}
      rationale: >-
        The only sources that state a lifespan give 8 years (Fishipedia) and 8 to 10 years (a shop
        care guide); the lower bound of 6 years rested on model knowledge alone.
    - field: features.beginnerSuitability
      proposals:
        - by: generator
          value: easy
        - by: checker-a
          value: easy
        - by: checker-b
          value: moderate
      decision: easy
      rationale: >-
        The describer names it one of the best choices for beginners with Malawi cichlids, and
        Seriously Fish and Fishipedia rate it easy. Only the Cichlid Room Companion, which serves
        for verification, places it at the intermediate level.

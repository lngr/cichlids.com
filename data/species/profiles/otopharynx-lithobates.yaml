partners:
  suitable:
    - species: Cyrtocara moorii
      reason: Peaceful hap of similar habits; keepers report long-term success with both together.
      condition: Tank of at least 150 cm because C. moorii grows larger.
    - species: Labidochromis caeruleus
      reason: Calm mbuna that eats a similar mix of animal food, flake and pellets; the describer names
        it as a suitable companion.
    - species: Iodotropheus sprengerae
      reason: Small, fairly peaceful mbuna that the describer recommends as a tankmate.
    - species: Aulonocara stuartgranti
      reason: Peaceful peacock cichlid that uses the sand and open water near the rocks; Fishkeeper lists
        Aulonocara as suitable.
    - species: Copadichromis borleyi
      reason: Peaceful plankton-feeding hap of similar size that swims in open water rather than in the
        caves.
    - species: Synodontis njassae
      reason: Robust Lake Malawi catfish of the same water; Fishkeeper names Synodontis as tankmates.
  unsuitable:
    - species: Melanochromis auratus
      reason: Aggressive mbuna that harasses calmer haps; sources advise against boisterous mbuna.
    - species: Maylandia zebra
      reason: Boisterous, territorial mbuna that competes for the same caves and stresses this calmer hap.
    - species: Chindongo demasoni
      reason: Very aggressive small mbuna that defends caves fiercely and suits only mbuna-only tanks.
    - species: Tropheus moorii
      reason: Tanganyika aufwuchs grazer with a low-protein diet that is best kept alone; different water
        and food.
    - species: Paracheirodon innesi
      reason: Small soft-water tetra that would be eaten and needs quite different water.
    - species: Otopharynx spelaeotes
      reason: Closest relative, morphologically almost indistinguishable from O. lithobates; no cross is
        documented, but mixing them invites mix-ups of the females.
profile:
  overview:
    text: Otopharynx lithobates is a medium-sized haplochromine from the rocky southern shores of Lake
      Malawi and one of the few haps that live among boulders and caves rather than over open sand.
      The species name refers to its life among stones. Breeding males are blue and carry a bright
      blaze on the forehead and along the dorsal fin, which is sulphur yellow, orange-red or white
      depending on the population. The best-known trade form comes from Zimbawe Rock, usually
      spelled 'Zimbabwe Rock', and older dealers sold the fish as 'Red Top Aristochromis' although
      it is only distantly related to Aristochromis. Females and young fish are silvery grey with
      the three dark spots typical of the genus. It counts among the calmer Malawi haps, accepts
      ordinary aquarium food and breeds readily, which makes it a good first hap. It needs company
      of similar temperament rather than boisterous mbuna.
    sources:
      - *oliver
      - *sf
      - *fk
      - *cleaver
  habitat:
    text: "The species is known only from a small part of the southern lake: the islands around the
      Nankumba Peninsula such as Thumbi West, Thumbi East, Mumbo and Domwe, the reef Zimbawe Rock,
      Monkey Bay, the Maleri Islands and the islands Chinyamwezi and Chinyankwazi. Most or all
      populations lie inside Lake Malawi National Park. It lives over rocky and mixed rock-sand
      shores and uses caves and crevices as shelter, feeding ground and spawning site, from just
      below the surface to at least 20 m. The lake water is soft but alkaline and well buffered:
      about 3 to 5 dGH, 5 to 8 dKH and pH 7.7 to 8.6, with temperatures between 21 and 29 C over the
      year. In the aquarium the fish does well in harder water as long as pH and carbonate hardness
      stay high and stable."
    sources:
      - *cleaver
      - *oliver
      - *sf
      - *fk
      - *branchu
      - *fao
  sizeAndGrowth:
    text: Males grow clearly larger than females. Well-grown aquarium males reach about 16 cm total
      length, while females stay around 10 cm. Wild fish are smaller; the largest specimens measured
      for the 2009 revision had about 10.7 cm standard length, roughly 13 to 14 cm including the
      tail. Females become sexually mature at only about 5 cm, so a young group may start to breed
      long before the fish are fully grown. Only the dominant male develops full breeding colour;
      subordinate males stay greyish and can look like females until they get the chance to take
      over a territory.
    sources:
      - *fishbase
      - *sf
      - *fishipedia
      - *cleaver
      - *oliver
  husbandry:
    text: A tank of about 120 cm length and 240 litres suits one male with three females; larger tanks
      allow more females or a second male. Build stable rock piles from the bottom up with many
      caves and crevices, and leave open sand and swimming space between them. Make sure the rocks
      rest on the glass so that digging cannot topple them. Plants are optional; hardy species such
      as Anubias and Vallisneria are left alone. Aim for pH 7.8 to 8.5 and 24 to 27 C, buffer soft
      tap water with suitable salts or a carbonate substrate, and keep hardness within about 3 to 25
      dGH. Good filtration and a partial water change of about 20 to 30 percent every week keep
      nitrate low and the pH stable.
    sources:
      - *sf
      - *pfk
      - *oliver
      - *oata
      - *fk
      - *seachem
  socialBehavior:
    text: This is a harem species. One male with at least three females spreads his courtship over
      several fish, so no single female is chased too much. When several males share a tank, one
      becomes dominant, colours up fully and does most of the spawning; a second male works only in
      a large tank with plenty of visual barriers. Outside spawning the fish are calm and spend much
      time close to the rocks, often inside or near caves. A breeding male claims a cave or flat
      stone and keeps other fish away from it, but he rarely pursues them through the whole tank.
      Towards other species of similar size the fish is tolerant, which makes it a good member of a
      peaceful Malawi community.
    sources:
      - *sf
      - *fishipedia
      - *oliver
      - *fk
      - *thread13953
  diet:
    text: In the lake the species feeds in two ways. It picks single zooplankton animals, mainly
      copepods and small water fleas, from the water near the rocks, and it scavenges particles from
      the rock surface, often the droppings of plant-eating fish and of the large catfish Bagrus
      meridionalis. Because the sources weigh these two parts differently, the catalog classes it
      cautiously as an invertebrate feeder. In the aquarium it is easy to feed. A quality flake or
      small pellet for omnivorous cichlids works well as staple food, supplemented with frozen brine
      shrimp, mysis, mosquito larvae or krill for larger fish. Feed small portions once or twice a
      day rather than one large meal.
    sources:
      - *oliver
      - *cleaver
      - *fishbase
      - *pfk
      - *sf
      - *fk
  breeding:
    text: O. lithobates is a female mouthbrooder and breeds readily in the aquarium. The male cleans a
      flat stone in a sheltered spot or a cave floor and displays in full colour to lure females. A
      ready female lays a few eggs at a time; the pair circles and she takes the eggs into her
      mouth, where they are fertilised. A brood holds about 25 to 50 eggs. The female carries them
      for three to four weeks without eating and then releases free-swimming fry that take newly
      hatched brine shrimp at once. Stressed females may spit or swallow the brood, so move a
      holding female only if she is harassed. Some breeders strip the fry after two to three weeks
      for a higher yield.
    sources:
      - *sf
      - *fk
      - *fws
  sexing:
    text: Adult males are larger and, when dominant, show the blue body and the bright blaze on head and
      dorsal fin. Adult males lack the egg spots on the anal fin that many other Malawi haps show,
      so these are no help for sexing. Females remain grey to silvery with three dark blotches on
      the flank and stay noticeably smaller. Young fish and suppressed males look like females, and
      reliable sexing of juveniles is difficult. Venting by an experienced keeper or waiting until
      the first males colour up is the safest way to set up a harem.
    sources:
      - *oliver
      - *cleaver
      - *sf
      - *fk
  compatibility:
    text: "Choose calm Lake Malawi fish of similar size: peaceful haps such as Cyrtocara moorii or
      Copadichromis borleyi, Aulonocara peacocks, mild mbuna such as Labidochromis caeruleus or
      Iodotropheus sprengerae, and Synodontis catfish. Aggressive mbuna such as Melanochromis or
      Maylandia species compete for the same caves and keep this hap stressed and pale. Fish below
      about 2 cm and fry of tankmates may be eaten. Keep only one locality form per tank so that the
      colour forms stay pure, and do not combine it with its close relative O. spelaeotes, whose
      females look the same. Tanganyika grazers such as Tropheus need their own tank."
    sources:
      - *sf
      - *pfk
      - *oliver
      - *cleaver
      - *fk
      - kind: archive
        title: cichlids.com forum thread 10457
        url: https://www.cichlids.com/disc/read.php?1,10457
        accessed: 2026-10-13
      - *thread14109
      - kind: archive
        title: cichlids.com forum thread 15767
        url: https://www.cichlids.com/disc/read.php?2,15767
        accessed: 2026-10-13
  problems:
    text: The most frequent mistake is mixing this calm hap with aggressive mbuna, which leads to
      constant hiding, faded colours and injured females. Keeping one male with only one female has
      a similar effect, because the female takes all of his courtship. Soft tap water without
      buffering lets the pH drop over time, and heavy feeding with rare water changes raises
      nitrate; both stress Malawi cichlids and make them prone to disease. No source links this
      species to bloat, but overfeeding with rich frozen food strains the digestion of any Malawi
      cichlid, so keep portions small and varied. Holding females spit their brood when chased or
      moved roughly. Crossing locality forms produces fish of unclear origin that should not be
      sold under a locality name.
    sources:
      - *sf
      - *oliver
      - *oata
      - *fk

    kind: locality
    note: Sulphur-yellow blaze on head and dorsal fin; the most sought-after form, usually traded as
      'Zimbabwe Rock' or 'Z-Rock'.
  - name: Domwe Island
    kind: locality
    note: Males with an orange-red dorsal fin and blaze.
  - name: Mumbo Island
    kind: locality
    note: Males with a white dorsal fin and blaze.
  - name: Maleri Islands (Nakantenga)
    kind: locality
    note: White-blazed population described as Otopharynx walteri, a synonym.
  - name: Thumbi West Island
    kind: locality
    note: Type locality.
  - name: Chinyamwezi Island
    kind: locality
    note: Males with white and yellow in the dorsal fin and a faint blaze.

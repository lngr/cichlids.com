  ph:
    value: {min: 7.7, max: 8.6}
    confidence: high
    rationale: >-
      Lake Malawi endemic; the surface water of the lake has a pH of 7.7 to 8.6 (Jackson et al.
      1963 in the FAO source book). Branchu et al. (2010) measured 7.5 to 8.5 over the whole water
      column, the lower values belonging to deep water the species does not use.
    sources: *lakesources
    evidence:
      - source: *fao
        value: {min: 7.7, max: 8.6}
        note: lake surface water
      - source: *branchu
        value: {min: 7.5, max: 8.5}
        note: whole water column, lower values in deep water
    verification:
      method: waterbody
      waterbody: lake-malawi
    tolerance:
      value: {min: 7.5, max: 8.8}
      confidence: medium
      rationale: >-
        Seriously Fish gives 7.6 to 8.8 and 8.2 to 8.5 for breeding, Fishkeeper 7.5 to 8.5 and the
        OATA sheet for Malawi cichlids 8.0 to 8.6; Aquarium Glaser warns against a pH below 8 for long
        periods. Fishipedia's aquarium value of 7.2 to 8.0 contradicts its own habitat value of 7.5
        to 8.5 and is not followed. The consistent care sheets together span 7.5 to 8.8, which
        contains the lake range. Decided unanimously by the vote count (3 of 3 within 0.3 pH; median
        of the agreeing bounds).
      sources:
        - *sf
        - *oata
        - *oatapdf
        - *fishipedia
        - *fk
        - &glaser
          kind: website
          title: "Aquarium Glaser (wholesaler): Otopharynx lithobates (Frank Schaefer, 2017)"
          url: https://www.aquariumglaser.de/en/tag/lithobates-en/
          accessed: 2026-10-13
      evidence:
        - source: *sf
          value: {min: 7.6, max: 8.8}
          note: aquarium recommendation, 8.2 to 8.5 for breeding
        - source: *oata
          value: {min: 8.0, max: 8.6}
          note: Malawi cichlids as a group, not species-specific
        - source: *oatapdf
          value: {min: 8.0, max: 8.6}
          note: Malawi cichlids as a group, not species-specific
        - source: *fishipedia
          value: {min: 7.2, max: 8.0}
          note: aquarium value; the same sheet gives 7.5 to 8.5 for the habitat
        - source: *fk
          value: {min: 7.5, max: 8.5}
          note: aquarium recommendation
      verification:
        method: unanimous
        votes: {agree: 3, total: 3}

  ghDgh:
    value: {min: 3, max: 5}
    confidence: high
    rationale: >-
      Lake Malawi endemic; the calcium and magnesium of the lake correspond to 3.2 to 4.9 dGH in the
      1960s titrations (Jackson et al. 1963, Talling and Talling 1965) and 4.2 to 4.6 dGH in the
      upper 50 m of the north basin (Branchu et al. 2010). Care sheets that call the lake water
      hard confuse hardness with alkalinity.
    sources: *lakesources
    evidence:
      - source: *fao
        value: {min: 3.2, max: 4.9}
        note: calculated from lake calcium and magnesium
      - source: *branchu
        value: {min: 4.2, max: 4.6}
        note: north basin, upper 50 m
    verification:
      method: waterbody
      waterbody: lake-malawi
    tolerance:
      value: {min: 3, max: 25}
      confidence: medium
      rationale: >-
        Care sheets ask for harder water than the lake: Seriously Fish 10 to 25 dGH, Fishkeeper up
        to 25, Guidarium 10 to 25, FishProfiles 9 to 15, Fishipedia 8 to 15 and the OATA group sheet
        12 to 18 dGH, while Seachem recommends 4 to 8 dGH for Malawi tanks. Their lower limits of 8
        to 12 dGH follow the hobby habit of hardening Malawi water; the fish lives permanently in the
        lake at 3 to 5 dGH, so the tolerance starts at the natural minimum. The upper bound is the
        25 dGH that two care sheets accept, as long as carbonate hardness keeps the pH alkaline.
        Decided by qualified majority: four votes (generator, checker-a, tiebreaker-1,
        tiebreaker-2) proposed 3 to 25 dGH and checker-b proposed 3 to 20 dGH.
      sources:
        - *sf
        - *oata
        - *oatapdf
        - *fishipedia
        - *fishprofiles
        - *branchu
        - *fao
        - *fk
        - &guidarium
          kind: website
          title: "Guidarium: Sulphur Crest Lithobates (Otopharynx lithobates)"
          url: https://guidarium.com/fishes/sulphur-crest-lithobates
          accessed: 2026-10-13
        - &seachem
          kind: website
          title: "Seachem Laboratories: Cichlid Lake Salt (product page with recommended GH per lake)"
          url: https://www.seachem.com/cichlid-lake-salt.php
          accessed: 2026-10-13
      evidence:
        - source: *sf
          value: {min: 10, max: 25}
          note: aquarium recommendation, unit given as degrees of hardness
        - source: *oata
          value: {min: 12, max: 18}
          note: Malawi cichlids as a group, not species-specific
        - source: *oatapdf
          value: {min: 12, max: 18}
          note: Malawi cichlids as a group, not species-specific
        - source: *fishipedia
          value: {min: 8, max: 15}
          note: aquarium recommendation
        - source: *fishprofiles
          value: {min: 9, max: 15}
          note: aquarium recommendation
        - source: *branchu
          value: {min: 4.2, max: 4.6}
          note: lake water in which the species lives permanently
        - source: *fao
          value: {min: 3.2, max: 4.9}
          note: lake water in which the species lives permanently
        - source: *fk
          value: {max: 25}
          note: upper limit only
        - source: *guidarium
          value: {min: 10, max: 25}
          note: aquarium recommendation
        - source: *seachem
          value: {min: 4, max: 8}
          note: manufacturer recommendation for Malawi tanks
      verification:
        method: qualified-majority
        votes: {agree: 4, total: 5}

  khDkh:
    value: {min: 5, max: 8}
    confidence: high
    rationale: >-
      Lake Malawi endemic; the alkalinity of 2.33 to 2.46 meq/L in the north basin profiles
      (Branchu et al. 2010) and 2.00 to 2.59 meq/L after Jackson et al. (1963) corresponds to 5.6 to
      7.3 dKH. Sodium balances part of the bicarbonate, so carbonate hardness exceeds total
      hardness in this lake.
    sources: *lakesources
    evidence:
      - source: *branchu
        value: {min: 6.5, max: 6.9}
        note: converted from alkalinity, north basin
      - source: *fao
        value: {min: 5.6, max: 7.3}
        note: converted from alkalinity after Jackson et al. (1963)
    tolerance:
      value: {min: 5, max: 15}
      confidence: low
      rationale: >-
        No species-specific source states a carbonate hardness. The OATA sheet for Malawi cichlids as
        a group recommends 10 to 15 dKH; the lower bound is the lake minimum of 5 dKH, at which the
        species lives. In the aquarium a buffer in the upper part of the range keeps the pH from
        falling between water changes. The upper value rests on a group recommendation only, hence
        the low confidence. Decided unanimously by the vote count (3 of 3 within 2 dKH).
      sources:
        - *oata
        - *oatapdf
        - *branchu
        - *fao
      evidence:
        - source: *oata
          value: {min: 10, max: 15}
          note: Malawi cichlids as a group, not species-specific
        - source: *oatapdf
          value: {min: 10, max: 15}
          note: Malawi cichlids as a group, not species-specific
        - source: *branchu
          value: {min: 6.5, max: 6.9}
          note: lake water in which the species lives permanently
        - source: *fao
          value: {min: 5.6, max: 7.3}
          note: lake water in which the species lives permanently
      verification:
        method: unanimous
        votes: {agree: 3, total: 3}

  maxSizeCm:
    value: {male: 16, female: 10}
    confidence: medium
    rationale: >-
      FishBase gives 16 cm total length for males and 10 cm for females. Seriously Fish,
      Fishipedia, FishProfiles and Fishkeeper also name 16 cm, Fishipedia for dominant males with
      about 10 cm as the average size, and Practical Fishkeeping gives 15 cm with smaller females.
      Wild fish are smaller: the largest of 99 specimens measured by Cleaver et al. (2009) had 10.7 cm
      standard length, roughly 13.5 cm total length. Well-grown aquarium males reach the 16 cm that
      most sources state; females stay near 10 cm.
    sources:
      - *fishbase
      - *sf
      - *fishipedia
      - *fishprofiles
      - &pfk
        kind: literature
        title: "Clarke, M.: Otopharynx lithobates Tanzania. Practical Fishkeeping (magazine feature)"
        url: https://www.practicalfishkeeping.co.uk/features/otopharynx-lithobates-tanzania/
        accessed: 2026-10-13
      - *cleaver
      - *fk
    evidence:
      - source: *fishbase
        value: {male: 16, female: 10}
        note: total length
      - source: *sf
        value: {male: 16}
        note: given as standard length, sex not stated
      - source: *fishipedia
        value: {male: 16}
        note: dominant males; average size about 10 cm
      - source: *fishprofiles
        value: {male: 16, female: 16}
        note: same size given for both sexes
      - source: *pfk

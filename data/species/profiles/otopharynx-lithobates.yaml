  temperatureC:
    value: {min: 21, max: 29}
    confidence: high
    rationale: >-
      Lake Malawi endemic, so the natural range is the measured lake range: about 21 C in inshore
      water during the cool, windy season and 27 C in the upper 60 m by May (Eccles 1974), 23.5 to
      24 C in the winter surface layer and about 28 C in summer surface water (Vollmer et al. 2005),
      and 24 to 29 C in a 2013 campaign (Ngochera 2018). The species lives in the littoral from just
      below the surface to at least 20 m, inside this water.
    sources: &lakesources
      - &branchu
        kind: literature
        title: >-
          Branchu, P., Bergonzini, L., Ambrosi, J.-P., Cardinal, D., Delalande, M., Pons-Branchu, E.
          et al. (2010). Hydrochemistry (major and trace elements) of Lake Malawi (Nyasa), Tanzanian
          Northern Basin: local versus global considerations. Hydrology and Earth System Sciences
          Discussions 7, 4371-4409.
        url: https://hess.copernicus.org/preprints/7/4371/2010/hessd-7-4371-2010.pdf
        accessed: 2026-10-12
      - &fao
        kind: literature
        title: >-
          Vanden Bossche, J.-P. and Bernacsek, G. M. (1990). Source book for the inland fishery
          resources of Africa, Vol. 1, CIFA Technical Paper 18/1, FAO. Lake Malawi/Nyasa: physical
          and chemical data after Jackson et al. (1963) and Talling and Talling (1965).
        url: https://www.fao.org/4/t0473e/T0473E05.htm
        accessed: 2026-10-12
      - &eccles
        kind: literature
        title: >-
          Eccles, D. H. (1974). An outline of the physical limnology of Lake Malawi (Lake Nyasa).
          Limnology and Oceanography 19(5), 730-742 (abstract).
        url: https://doi.org/10.4319/lo.1974.19.5.0730
        accessed: 2026-10-12
      - &vollmer05
        kind: literature
        title: >-
          Vollmer, M. K., Bootsma, H. A., Hecky, R. E., Patterson, G., Halfman, J. D., Edmond, J. M.,
          Eccles, D. H. and Weiss, R. F. (2005). Deep-water warming trend in Lake Malawi, East
          Africa. Limnology and Oceanography 50(2), 727-732.
        url: https://www.dora.lib4ri.ch/empa/dload/empa:1253/PDF/view
        accessed: 2026-10-12
      - kind: literature
        title: >-
          Vollmer, M. K., Weiss, R. F. and Bootsma, H. A. (1999). Lake Malawi/Nyasa deep water
          renewal. In: Bootsma, H. A. and Hecky, R. E. (eds.), Water Quality Report, SADC/GEF Lake
          Malawi/Nyasa Biodiversity Conservation Project, chapter 4.
        url: https://sites.uwm.edu/hbootsma/files/2020/11/Ch4-Lake-Internal-Mixing.pdf
        accessed: 2026-10-12
      - &ngochera
        kind: literature
        title: >-
          Ngochera (2018). Carbon Dynamics in Tropical Lake Malawi. PhD dissertation, University of
          Wisconsin-Milwaukee.
        url: https://minds.wisconsin.edu/handle/1793/91765
        accessed: 2026-10-12
    evidence:
      - source: *eccles
        value: {min: 21, max: 27}
        note: inshore minimum in the cool season, upper 60 m by May
      - source: *vollmer05
        value: {min: 23.5, max: 28}
        note: winter surface layer to summer surface water
      - source: *ngochera
        value: {min: 24, max: 29}
        note: 2013 campaign
    verification:
      method: waterbody
      waterbody: lake-malawi
    tolerance:
      value: {min: 21, max: 29}
      confidence: medium
      rationale: >-
        Care sheets give 24 to 28 C (Seriously Fish), 23 to 28 C (Fishipedia), 24 to 27 C (FishBase
        after Baensch and Riehl, and FishProfiles), 24 to 26 C (Fishkeeper) and 23 to 27 C (OATA sheet
        for Malawi cichlids as a group). All lie inside the lake range, and the tolerance has to
        contain the natural range, so it spans 21 to 29 C. The lower end rests on the lake, where the
        species lives through the cool season; a steady 24 to 27 C is the usual aquarium target.
        Decided unanimously by the vote count (3 of 3).
      sources:

        - Domwe Island
        - Zimbawe Rock
        - Maleri Islands (Nakantenga Island)
        - Chinyamwezi Island
        - Chinyankwazi Island
        - Monkey Bay
    confidence: high
    rationale: >-
      Endemic to the south of Lake Malawi. Cleaver et al. (2009) examined populations from
      Chinyamwezi, Domwe, Mumbo, Thumbi West, Zimbawe Rock and Nakantenga (Maleri Islands) and give
      the islands around the Nankumba Peninsula plus Chinyankwazi and Chinyamwezi as the range.
      The describer adds Monkey Bay from his own collections and reports, after Konings, that all
      populations lie within Lake Malawi National Park. The Catalog of Fishes, FishBase and Seriously
      Fish agree on Lake Malawi and the southern part of the lake.

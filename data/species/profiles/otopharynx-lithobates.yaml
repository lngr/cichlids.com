          value: [Thumbi West Island, Thumbi East Island, Mumbo Island, Domwe Island, Chinyamwezi Island, Chinyankwazi Island, Maleri Islands (Nakantenga Island), Zimbawe Rock]
      decision: [Thumbi West Island, Thumbi East Island, Mumbo Island, Domwe Island, Zimbawe Rock, Maleri Islands (Nakantenga Island), Chinyamwezi Island, Chinyankwazi Island, Monkey Bay]
      rationale: >-
        The lists differ only in spelling and in two sites. Chinyankwazi is in the range of Cleaver
        et al. (2009), and Monkey Bay rests on the describer's collections and Seriously Fish, so
        the union of all three lists is kept.
    - field: features.ph.tolerance

  khDkh:
    value:
      min: 15
      max: 20
    confidence: high
    rationale: "The settled natural range is 15 to 20 dKH and carries no verification object. FAO annual-cycle
      alkalinity measurements are dominated by 5.6 to 6.2 meq/L bicarbonate, with station carbonate
      contributions of 0.06 to 1.02 meq/L; these components support strongly buffered water in the same order
      as the adopted lake envelope. Alkalinity near 6.5 to 6.9 meq/L in the inherited Cohen and Langenberg
      summaries corresponds to about 18.2 to 19.3 dKH. These lake studies support the rounded envelope.
      Aquarium KH denotes alkalinity here and can exceed GH. Isolated dilute inflow or deep-water readings are
      not typical habitat targets."
    sources:
      - kind: literature
        title: "Plisnier et al. 1996, Limnological sampling during an annual cycle at three stations on Lake
          Tanganyika"

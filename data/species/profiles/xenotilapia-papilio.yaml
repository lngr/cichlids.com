  temperatureC:
    value:
      min: 23
      max: 29
    confidence: high
    rationale: The settled natural range is 23 to 29 C with waterbody verification. Verburg et al. report hourly
      near-surface buoy temperatures of 23.85 to 29.01 C at Mpulungu; the annual-cycle FAO studies document
      seasonal mixing and cooler southern water. These measurements support a rounded lake habitat envelope.
      FishBase gives a narrower species interval of 24 to 28 C; it remains in the evidence without replacing
      the lake decision.
    sources:
      - kind: literature
        title: "Plisnier et al. 1996, Limnological sampling during an annual cycle at three stations on Lake
          Tanganyika"

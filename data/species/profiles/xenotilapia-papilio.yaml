  sexing:
    text: "Colors and fin markings do not reliably separate the sexes. A fuller abdomen can suggest a ripe female
      but also reflects feeding or condition. Observe mature pair behavior rather than assigning sex from a
      single photograph. Locality differences, especially the dorsal markings of Tembwe and Kanoni, describe
      geographic forms rather than male and female patterns."

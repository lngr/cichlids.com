  socialBehavior:
    text: "Adults occupy territories as pairs, while juveniles can gather before pairing. A group used to obtain
      partners needs enough room and a plan to separate fish that lose access to food or shelter. Several
      pairs can redirect hostility toward neighbors, but each pair needs visual separation and individual
      monitoring. Even a settled pair can quarrel. This is not a peaceful adult shoaling species."

      11.6 and 41.2 mg/L. Converting each pair by Ca/7.14 + Mg/4.34 gives about 11.1 to 11.5 dGH. The
      inherited Cohen chemistry summary gives roughly 12.2 dGH, consistent with the rounded envelope. FishBase
      reports a wider 10 to 25 dH species interval, which is retained but does not replace the measured lake
      range. This is total hardness, not alkalinity."

    text: "Allow for approximately 8.5 cm in males and 8 cm in females as working aquarium sizes. Published
      descriptions range from a 7.8 cm specimen record to adults around 10 cm, and the small sex difference is
      uncertain. External size is a poor sexing guide. Lifespan advice suggests about five to seven years, but
      the estimates lack tracked cohorts and should be treated cautiously."

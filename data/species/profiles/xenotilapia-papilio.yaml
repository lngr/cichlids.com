  habitat:
    text: "Sediment-coated rocks provide feeding surfaces in the confirmed range between Tembwe (Deux) and Kanoni.
      Records span roughly 3 to 40 m depth. Use fine sand beside stable rocks with broad faces and sheltered
      gaps. The lake envelope is 23 to 29 C, pH 8.4 to 9.4, GH 10 to 13 dGH and alkalinity 15 to 20 dKH.
      Alkalinity and total hardness describe different properties of this mineral-rich water."

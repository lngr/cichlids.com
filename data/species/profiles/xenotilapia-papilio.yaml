  problems:
    text: "A subordinate fish that hides continuously, stops eating or breathes rapidly may be under social
      pressure. Provide a safe retreat and separate fish when barriers fail. Poor water quality compounds
      stress, so keep waste removal and filtration consistent. Similar trade names can obscure whether fish
      are true papilio or related forms with different locality histories. General disease lists and isolated
      aquarium readings do not establish species-specific diagnoses or long-term tolerance endpoints."

          - Kanoni
      rationale: "Catalog of Fishes and FishBase place the species on the southwestern Congolese shore between
        Tembwe (Deux) and Kanoni. The four proposals differ only in geographic wording, locality punctuation
        and the lake identifier. The canonical lake-tanganyika identifier and the two confirmed localities are
        retained. Hata et al. label Zambian samples papilio, while specialist sources distinguish southern
        look-alikes; that study does not establish an extension of this profile to every southern hobby form."
    - field: features.temperatureC.tolerance
      proposals:
        - by: generator
          value:
            min: 22
            max: 29
        - by: checker-a
          value:
            min: 22
            max: 30
        - by: checker-b
          value:
            min: 22
            max: 30
        - by: checker-c
          value:
            min: 23
            max: 29
      decision:
        min: 22
        max: 30
      rationale: "The tally decides 22 to 30 C with unanimous verification, 4 of 4 votes, and low confidence.
        Proposals are generator 22 to 29 C, checker-a 22 to 30 C, checker-b 22 to 30 C and checker-c 23 to 29
        C. Bound medians give 22 and 29.5 C, rounded to 22 and 30 C. Aquariophilie and FishFish recommend 22
        to 27 C, Guidarium 23 to 28 C, and FishBase reports 24 to 28 C as ecology. The 30 C endpoint is an
        allowance inferred by the agreeing agents beyond the 29 C natural maximum, not a demonstrated
        long-term aquarium limit or a preferred setting. DRTA also recommends 23 to 27 C in its husbandry
        text. No read source establishes that modest excursions outside the natural interval cause harm."
    - field: features.ph.tolerance

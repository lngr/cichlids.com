  ph:
    value:
      min: 8.4
      max: 9.4
    confidence: high
    rationale: "The settled natural range is pH 8.4 to 9.4 with waterbody verification. Plisnier et al. report
      8.47 to 9.40 at 40 m over an annual cycle, with alkaline surface water in the follow-up survey. FishBase
      gives the wider lower reach of 7.5 to 9.0; that ecological interval is retained separately. The older
      FAO source book gives pH 7.3 to 7.8, which conflicts with the annual-cycle measurements and is not used
      as the typical lake value. Inherited rounded envelopes attached to Cohen are syntheses rather than that
      paper's exact readings."
    sources:
      - kind: literature

    value:
      type: invertivore
      bloatSensitive: false
      foods:
        - ostracods
        - copepods
        - insect larvae
        - small crustaceans
        - filamentous algae
    confidence: high
    rationale: "All four votes agree on invertivore and bloatSensitive false; the exact food list is the tally
      decision. FishBase records crustaceans and insect larvae, and Tanganyika.si summarizes ostracods as the
      dominant food despite its broad omnivore label. Algae also contribute. Hata et al. include fish labelled
      papilio among herbivorous scoopers and identify phototrophic material in stomach samples, but their
      assay does not quantify animal prey relative to plants. Their Zambian sampling may also concern southern
      look-alikes rather than the restricted Congolese taxon. That paper is retained as qualifying evidence,
      not a reason to override the settled invertivore classification. Lack of a species-specific bloat report
      supports leaving the flag false without claiming immunity."

  breeding:
    text: "Both parents participate in mouthbrooding. The female collects the eggs after spawning and passes
      developing young to the male. Accounts differ on the handover day and brood size, so neither is a fixed
      schedule. Released fry remain under parental protection and can take suitably tiny foods. Disturbance
      can disrupt pair behavior, and territorial pressure on neighboring fish needs attention throughout brood
      care."

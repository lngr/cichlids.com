partners:
  suitable:
    - species: Paracyprichromis nigripinnis
      reason: Different use of the water column can reduce feeding-territory overlap; this is an example inferred
        from the specialist genus recommendation.
      condition: "Provide separate rock faces and retreats in a well-filtered Tanganyika aquarium, with additional
        room for the companion group."
    - species: Smaller Neolamprologus species
      reason: Specialist accounts allow selected smaller rock cichlids able to maintain separate territories.
      condition: Choose species individually and separate cave areas from the papilio feeding surface; the pair
        minimum alone does not establish community capacity.
  unsuitable:
    - species: Xenotilapia flavipinnis
      reason: Detailed observations describe persistent harassment and loss of condition when sharing papilio
        territory.
    - species: Xenotilapia sp. 'papilio sunflower'
      reason: Similar-looking adults compete for the same rock and sediment feeding areas; the concern is aggression
        rather than a documented cross.
    - species: Xenotilapia cf. papilio 'Katete'
      reason: Close resemblance and overlapping feeding territories create a strong rivalry risk; its status as a
        papilio variant is not established here.
profile:
  overview:
    text: An adult papilio pair needs a carefully divided rocky bottom and close attention to social stress. This
      small Tanganyikan ectodine combines sediment feeding with shared mouthbrooding. Its confirmed range is a
      short stretch of the southwestern Congolese shore. The sunflower and Katete trade forms require separate
      identification rather than automatic inclusion as papilio. Experienced keepers are better placed to
      manage its pair dynamics and water-quality demands.

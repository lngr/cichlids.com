    rationale: "Generator, checker-a and checker-b propose level 3; checker-c proposes 4. The detailed CRC account
      describes persistent aggression after pair formation and stress in subordinate fish, and Tanganyika.si
      recommends an established pair. Level 3 fits sustained chasing and injury risk in unsuitable space or
      social arrangements. A recommendation to separate pairs alone does not establish the routine killing or
      permanent injury required for level 4. Even the two partners can quarrel, so a pair is a management unit

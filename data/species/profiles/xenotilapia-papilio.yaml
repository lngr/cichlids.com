  husbandry:
    text: "Provide at least 300 L and 130 cm length for an established adult pair; a 50 cm front-to-back footprint
      is a practical allowance for rocks and escape routes. Position barriers so fish can withdraw from one
      another. Maintain efficient filtration, good oxygenation and regular partial water changes with
      compatible replacement water. The tolerance endpoints summarize uncertain advice and are not target
      extremes. Watch feeding access and social pressure as closely as water tests."

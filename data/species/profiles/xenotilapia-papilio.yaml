  diet:
    text: "Small sinking invertebrate foods suit its sediment-feeding mouth. Offer a varied selection of fine
      crustacean foods and accepted prepared foods, with some plant material and biofilm available. Stomach
      summaries emphasize ostracods and other small animals; algae also contribute, so the invertivore
      classification does not exclude them. Hata and colleagues analyze phototrophic material in fish labelled
      papilio without determining the proportion of animal prey. No special bloat susceptibility is
      established."
    sources:

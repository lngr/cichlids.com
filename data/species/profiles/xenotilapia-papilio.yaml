  compatibility:
    text: "Selected Tanganyika companions can share a carefully structured aquarium, so a species-only rule does
      not apply. Paracyprichromis and some smaller Neolamprologus are specialist suggestions when their space
      requirements are met separately. Gentle Xenotilapia and close look-alikes can face persistent
      territorial exclusion. No reported cross establishes a hybrid group for papilio in the reviewed
      evidence. That absence does not guarantee reproductive isolation."

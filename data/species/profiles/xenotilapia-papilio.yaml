            male: 10
            female: 10
        - by: checker-c
          value:
            male: 8
            female: 7
      decision:
        male: 8.5
        female: 8
      rationale: "The component medians are retained as approximate aquarium planning values. Proposals are
        generator male 8 and female 8 cm, checker-a 9 and 8, checker-b 10 and 10, and checker-c 8 and 7.
        FishBase records 7.8 cm TL for male or unsexed fish; Fishipedia gives about 7 cm with dominant males
        reaching 8, while CRC and Tanganyika.si describe approximately 10 cm without separating sexes. The 8.5
        and 8 cm decision lies between these published descriptions, rather than adopting the largest
        proposal. Its small sex difference is a planning approximation, not a reliable sexing character.
        Fischlexikon contradicts itself with 8 to 9 cm in its introduction and 12 to 13 cm in its size
        section; DRTA gives 9 to 11 cm. Those larger figures are retained as lower-weight dissenting evidence
        rather than treated as typical maxima."

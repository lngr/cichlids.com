      rationale: "The tally decides pH 7.7 to 9.4 with unanimous verification, 4 of 4 votes, and medium confidence
        under its range-agreement rule. Proposals are generator 8.0 to 9.4, checker-a 7.5 to 9.4, checker-b
        7.5 to 9.5 and checker-c 7.8 to 9.4. The bound medians are 7.65 and 9.4, rounded to 7.7 and 9.4. This
        is narrower than FishBase's 7.5 lower endpoint and DRTA and Fischlexikon's wider 7.5 to 9.5
        recommendation; all are retained. Guidarium recommends 7.8 to 9.0 and Aquariophilie 8.0 to 9.0. The
        upper bound contains the natural lake maximum. The decision reconciles advice rather than establishing
        physiological failure thresholds."
    - field: features.khDkh.tolerance
      proposals:
        - by: generator
          value:
            min: 12
            max: 25
        - by: checker-a
          value:
            min: 8
            max: 22
        - by: checker-b
          value:
            min: 12
            max: 25
        - by: checker-c
          value:
            min: 10
            max: 25
        - by: tiebreaker-1
          value:
            min: 11
            max: 22
        - by: tiebreaker-2
          value:
            min: 10
            max: 20
      decision:
        min: 11
        max: 24
      rationale: "The tally decides 11 to 24 dKH by the median method with low confidence and 3 agreeing votes out
        of 6. Every proposal is retained: generator 12 to 25, checker-a 8 to 22, checker-b 12 to 25, checker-c
        10 to 25, tiebreaker-1 11 to 22 and tiebreaker-2 10 to 20 dKH. All minima have median 10.5 and all
        maxima median 23.5, rounded to 11 and 24 dKH. There is no qualified majority. The resulting interval
        contains the natural 15 to 20 dKH and is narrower than the proposals reaching 8 or 10 below and 25
        above; none is an established harm boundary. Tanganyika.si recommends 11 to 22 dKH for lake aquariums,
        OATA gives 10 to 15 for African lake cichlids generally, DRTA and Fischlexikon give about 15 for
        papilio, and one aquarium report gives 13 without documenting long-term outcomes. The decision extends
        2 dKH above the specialist general recommendation and remains an extrapolation, not a species-specific
        tested tolerance. FishBase 10 to 25 dH and other GH recommendations do not establish a KH ceiling of
        25. Seachem explains independent KH adjustment but gives no species tolerance. Several general care
        pages conflate papilio with sunflower forms. The forum archive and public CRC summary add no numeric
        KH limits."
    - field: features.maxSizeCm
      proposals:

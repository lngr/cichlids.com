        explicitly describes strong harassment of similar Xenotilapia and loss of condition in flavipinnis.
        That direct behavioral account outweighs broad peaceful labels in general guides. Territorial
        exclusion fits level 2 better than display alone, while the sources do not establish attacks far
        outside the territory. Different-looking, spatially separated Tanganyika tankmates can coexist."

        - {by: generator, value: {min: 6, max: 10}}
        - {by: checker-a, value: {min: 7, max: 10}}
        - {by: checker-b, value: {min: 8, max: 10}}
        - {by: checker-c, value: {min: 5, max: 8}}
      decision: {min: 6, max: 10}
      rationale: Sources state 5 to 12 years; 6 to 10 lies in the middle of the statements and of the proposals.

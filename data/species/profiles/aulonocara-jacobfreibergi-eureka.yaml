  ghDgh:
    value: {min: 3, max: 5}
    confidence: high
    verification: {method: waterbody, waterbody: lake-malawi}
    rationale: >-
      The vote count fixes the Lake Malawi range, proposed by all four runs. The lake holds little
      calcium and magnesium: Branchu et al. (2010) measured values in the upper 50 m that correspond
      to 4.2 to 4.6 dGH, and the titrations of Jackson et al. (1963) and Talling and Talling (1965)
      correspond to 3.2 to 4.9 dGH. The lake is soft, bicarbonate-buffered water; the hard-water
      figures of care sheets describe aquarium practice, not the habitat.
    sources:
      - *branchu
      - *fao
    evidence:
      - source: *branchu
        value: {min: 4.2, max: 4.6}
        note: calculated from calcium and magnesium of the upper 50 m, north basin
      - source: *fao
        value: {min: 3.2, max: 4.9}
        note: calculated from the calcium and magnesium titrations of the 1960s
    tolerance:
      value: {min: 3, max: 20}
      confidence: medium
      verification:
        method: qualified-majority
        votes: {agree: 4, total: 6}
      rationale: >-
        The runs proposed upper limits of 20 (generator, tiebreaker-1, tiebreaker-2), 19
        (checker-b) and 25 dGH (checker-a, checker-c), all starting at the lake value of 3 dGH;
        four of six votes agree on 3 to 20. Care sheets recommend clearly harder water than the
        lake: FishBase and Fishipedia give 9 to 19 dGH, Aquarium Guide 5 to 19, the OATA sheet for
        Malawi cichlids 12 to 18 and the Eureka retailer sheet 10 to 20. Seriously Fish, Tropical
        Freshwater Fish, Aqua-Fish and Guidarium accept up to 25 dGH; this wider limit rests mainly
        on Seriously Fish and on sheets that resemble it, so it is not adopted, and 20 dGH is the
        highest value that nearly all sources accept. The lower bound follows the soft lake water,
        which the tolerance has to contain; no care source documents years of keeping in water that
        soft.
      sources:
        - *sf
        - *fb
        - *fpd
        - *tff
        - *ag
        - &oata
          kind: database
          title: Ornamental Aquatic Trade Association (2022). How to care for African Malawi cichlids. Care sheet
          url: https://ornamentalfish.org/wp-content/uploads/African-Malawi-cichlids-Sept-2022.pdf
          accessed: 2026-10-13
        - &aqf
          kind: database
          title: "Aqua-Fish: Lake Malawi Butterfly Cichlid (Aulonocara jacobfreibergi) Care Guide"
          url: https://en.aqua-fish.net/fish/lake-malawi-butterfly-cichlid
          accessed: 2026-10-13
        - *branchu
        - *fk
        - &fkh
          kind: website
          title: "Fishkeeper (Maidenhead Aquatics): Hybrid Peacock (Calico Peacock)"
          url: https://www.fishkeeper.co.uk/fish/freshwater/cichlids/calico-peacock
          accessed: 2026-10-13
        - *barn
        - *guid
        - *gensou
        - *myfish
      evidence:

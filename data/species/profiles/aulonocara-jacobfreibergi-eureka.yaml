  predation:
    value: 1
    confidence: medium
    verification:
      method: qualified-majority
      votes: {agree: 5, total: 6}
    rationale: >-
      Five of six votes chose level 1; checker-c voted 0. The parent species hunts small
      invertebrates over sand, located with the widened lateral-line canals of its head (Konings;
      Schwalbe et al. 2012 for the genus), and FishBase lists only invertebrate food with an
      estimated trophic level of 3.6, so fish are no regular part of the diet and levels 2 and 3 do
      not apply. A hunter of 15 cm that strikes at small moving prey also takes fry and very small
      fish when they appear: Seriously Fish advises moving brooding females to raise more young,
      the OATA sheet notes that few fry survive in a mixed Malawi tank, and retailer and hobby
      sheets name the male among the fry predators. That is the opportunistic behaviour of level 1.
      The vote for 0 rested on the absence of fish in the natural diet (Konings, Stigliano), which
      describes the main food but not the intake of fry. The Cichlid Room Companion lists the
      species as a crustacean and insect eater, which agrees.

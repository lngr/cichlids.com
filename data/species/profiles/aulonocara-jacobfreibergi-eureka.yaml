partners:
  suitable:
    - species: Labidochromis caeruleus
      reason: Calm mbuna with a different shape and colour and the same water needs; named as a companion by Seriously Fish.
    - species: Copadichromis borleyi
      reason: Open-water utaka that uses another zone of the tank and looks different.
      condition: Tank of at least 150 cm.
    - species: Otopharynx lithobates
      reason: Calm hap of similar size with a different colour pattern; named as a companion by Seriously Fish.
      condition: Tank of at least 150 cm.
    - species: Cyrtocara moorii
      reason: Calm, slow hap with a plain blue colour and a different body shape.
      condition: Tank of at least 150 cm.
    - species: Placidochromis phenochilus
      reason: Peaceful sand-dwelling hap that does not rival the Eureka male.
      condition: Tank of at least 180 cm.
  unsuitable:
    - species: Aulonocara stuartgranti
      reason: Same hybrid group; the females look alike and the species cross readily.
    - species: Aulonocara baenschi
      reason: Same hybrid group; crosses with the Eureka and spoils both lines.
    - species: "Aulonocara jacobfreibergi (wild forms such as 'Otter Point' or 'Lemon Jake')"
      reason: Same species; interbreeding blurs the Eureka line and the wild forms, and males fight as rivals.
    - species: Maylandia zebra
      reason: Hasty, boisterous mbuna that takes the food and wears the peacock down.
    - species: Protomelas taeniolatus
      reason: Males with blue and red colour are attacked as rivals and attack in turn.
    - species: Tropheus moorii
      reason: Lake Tanganyika aufwuchs grazer that needs a low-protein diet and is kept only with its own species.

profile:
  overview:
    text: >-
      The Eureka peacock, often sold as Eureka Red, is an aquarium line of the Lake Malawi peacock
      cichlid Aulonocara jacobfreibergi and not a species of its own. Breeders selected it for red
      colour from fish of the Otter Point population in southern Malawi, and it has never lived in
      the lake; the shop name Aulonocara eureka has no scientific standing. Adult males combine red
      and orange flanks with a blue face and a pale-edged dorsal fin, which has made the line one
      of the most popular peacocks. In the tank it behaves like the wild species: a cave-holding
      sand forager whose males are persistent towards rivals and females but mostly tolerant of
      unlike fish. It suits a Malawi community as one male with several females, kept away from
      every other Aulonocara because peacocks cross easily.
    sources:
      - *pfk
      - *sf
      - *cfe
      - *cof
  habitat:
    text: >-
      As a captive line the Eureka has no habitat of its own; its needs follow the parent species.
      Aulonocara jacobfreibergi lives only in the southern half of Lake Malawi, at sites such as
      Otter Point, Cape Maclear and Monkey Bay, in the transition zone where rocky shores give way
      to sand. Males hold territories inside caves, at times several in one large cave, while
      females and young forage on the sand nearby. The lake water is warm, about 21 to 29 C, and
      soft at 3 to 5 dGH, but bicarbonate at 5 to 8 dKH buffers it to a pH of about 7.7 to 8.6. In
      the aquarium this means fine sand, stacked rock with caves and stable alkaline water.
    sources:
      - *sf
      - *fb
      - *pfk
      - *branchu
      - *fao
      - *eccles
  sizeAndGrowth:
    text: >-
      Well-kept aquarium males usually reach about 15 cm total length; females stay smaller at
      around 10 cm. Wild A. jacobfreibergi rarely grow beyond 10 cm, but captive fish on rich food
      get larger, and a few show males pass 15 cm. Young Eurekas are grey and plain; males begin to
      colour at a few centimetres and can be recognised at about four months. They mature at around
      six months, while the full red and blue of a male takes a year or more. Growth depends on
      clean water and several small, varied meals a day.
    sources:
      - *fb
      - *pfk
      - *sf
      - *myfish
  husbandry:
    text: >-
      Plan a tank of at least 120 by 60 cm and about 350 litres for one male and four females. Fine
      sand matters, because the fish sift it for food and coarse gravel can hurt the gills; build
      stable rock piles with caves and leave open sand between them. Hardy plants such as Anubias
      or Vallisneria are left alone. Aim for about 24 to 28 C, a pH between 7.5 and 8.7, total
      hardness up to about 20 dGH and enough carbonate hardness, at least the lake value of 5 dKH,
      to keep the pH steady. The line reacts badly to rising nitrate and sudden changes, so filter
      generously and change a third to half of the water every week. Add new fish only to a mature
      tank.
    sources:
      - *sf
      - *fb
      - *eb
      - *barn
  socialBehavior:
    text: >-
      A male defends a cave or a spot near the rockwork and displays to every female that passes,
      with spread fins and heightened colour. Kept with a single female he wears her out, so one
      male with at least four females spreads his attention. Rival males chase each other
      persistently and can fight badly even after a quiet period; several males live together
      only in large tanks with many caves, and all-male peacock tanks are a common alternative when
      breeding is not wanted. Towards other species the male is mostly tolerant but drives fish of
      similar colour or shape from his area. He holds his territory all year, not only while
      spawning.
    sources:
      - *sf
      - *gcca
      - *cfe
      - *pfk
  diet:
    text: >-
      In nature the parent species hovers just above the sand and senses prey through the enlarged
      pores of its lateral-line system on the head. When it notices a moving crustacean, insect
      larva or snail, it bites into the sand, sorts out the prey and lets the sand escape through
      the gills. In the aquarium the Eureka takes good sinking pellets and flakes for carnivorous
      cichlids together with frozen mysis, brine shrimp and mosquito larvae, plus a small share of
      food with spirulina. Several small meals a day suit its foraging habit better than one large
      one. Fatty mammal meat such as beef heart and overfeeding are best avoided.
    sources:
      - *pfk
      - *sf
      - *schwalbe12
      - *gcca
  breeding:
    text: >-
      The Eureka breeds readily in a well-run tank. The male cleans a flat stone or a spot on the
      sand near his cave, intensifies his colour and leads a ripe female there with quivering
      displays. She lays a few eggs at a time and takes them up at once; when she nibbles at the egg
      spots on his anal fin he releases milt, and the eggs are fertilised in her mouth. The female
      carries the brood for about three weeks, barely eating, and then releases 20 to 50
      free-swimming young that take brine shrimp nauplii and fine dry food at once. Since tankmates
      and the male eat fry, moving her to a separate tank shortly before release raises the yield,
      but a long absence can cost her rank in the group.
    sources:
      - *sf
      - *myfish
      - *eb
  sexing:
    text: >-
      Adult males are easy to tell apart: they grow larger, show the red to orange body and blue
      head of the line, and develop longer, pointed dorsal and anal fins with a broad pale margin
      and egg spots on the anal fin. Females stay grey to brownish with darker bars and only a hint
      of colour, and they resemble the females of other peacocks, which is why mixed peacock tanks
      so often produce crosses. Juveniles cannot be sexed reliably; the first male colours usually
      show at about four months, and slow-colouring young can still turn out to be males.
    sources:
      - *sf
      - *eb
      - *barn
  compatibility:
    text: >-
      Good companions are calm Malawi cichlids that look different and keep out of the male's way:
      Labidochromis caeruleus, utaka such as Copadichromis borleyi, and quiet haps like Otopharynx
      lithobates or Cyrtocara moorii in a correspondingly larger tank. Every other Aulonocara and
      every other form of A. jacobfreibergi is out, because the females cannot be told apart and
      the fish cross freely. Boisterous mbuna such as Maylandia zebra take the food and wear the
      peacock down, and males of other species with blue and red colour, for example Protomelas
      taeniolatus, are attacked as rivals. Fry and very small fish are eaten when caught, so small
      community fish do not belong with it, nor do fish from soft, acidic water.
    sources:
      - *sf
      - *fpd
      - *barn
  problems:
    text: >-
      The commonest mistake is mixing the Eureka with other peacocks: the hybrid young spoil the
      line and can hardly be recognised later. A cramped tank or a single female leads to constant
      chasing and injured, stressed females. Coarse gravel interferes with sand sifting and can
      damage the gills. Poor water, high nitrate and an unstable pH quickly cause stress, faded
      colour and infections such as white spot or bacterial disease. Bloat appears in peacocks
      mainly after overfeeding, fatty meat such as beef heart or neglected water care, so feed
      modest amounts of suitable food. Red line-bred fish are often inbred; buy from breeders with
      healthy, well-shaped stock.
    sources:
      - *sf
      - *barn
      - *gcca

provenance:
  runs:
    - role: generator
      model: claude-opus-5-5

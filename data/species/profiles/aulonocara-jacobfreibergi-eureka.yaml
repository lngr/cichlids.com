  ph:
    value: {min: 7.7, max: 8.6}
    confidence: high
    verification: {method: waterbody, waterbody: lake-malawi}
    rationale: >-
      The vote count fixes the Lake Malawi range, proposed by all four runs. Jackson et al. (1963),
      compiled by FAO, measured pH 7.7 to 8.6 in surface water. Branchu et al. (2010) report 7.5 to
      8.5 over the whole water column, where the lower values belong to deep water that the fish do
      not use.
    sources:
      - *fao
      - &branchu
        kind: literature
        title: >-
          Branchu, P., Bergonzini, L., Ambrosi, J.-P., Cardinal, D., Delalande, M., Pons-Branchu, E.
          et al. (2010). Hydrochemistry (major and trace elements) of Lake Malawi (Nyasa), Tanzanian
          Northern Basin: local versus global considerations. Hydrology and Earth System Sciences
          Discussions 7, 4371-4409.
        url: https://hess.copernicus.org/preprints/7/4371/2010/hessd-7-4371-2010.pdf
        accessed: 2026-10-12

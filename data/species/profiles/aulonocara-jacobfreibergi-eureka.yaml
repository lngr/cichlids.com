  khDkh:
    value: {min: 5, max: 8}
    confidence: high
    verification: {method: waterbody, waterbody: lake-malawi}
    rationale: >-
      The vote count fixes the Lake Malawi range, proposed by all four runs. Alkalinity of 2.33 to
      2.46 meq/L in the profiles of Branchu et al. (2010) and 2.00 to 2.59 meq/L in Jackson et al.
      (1963) corresponds to about 6.5 to 6.9 and 5.6 to 7.3 dKH. Sodium balances part of the
      bicarbonate, so the carbonate hardness of the lake exceeds its total hardness.
    sources:
      - *branchu
      - *fao
    evidence:
      - source: *branchu
        value: {min: 6.5, max: 6.9}
        note: converted from alkalinity, north basin profiles
      - source: *fao
        value: {min: 5.6, max: 7.3}
        note: converted from alkalinity, Jackson et al. 1963
    tolerance:
      value: {min: 5, max: 14}
      confidence: low
      verification:
        method: qualified-majority
        votes: {agree: 5, total: 6}
      rationale: >-
        The runs proposed 5 to 12 (generator, tiebreaker-2), 5 to 15 (checker-a, tiebreaker-1), 4
        to 14 (checker-b) and 5 to 10 dKH (checker-c); five of six votes agree, and the median of
        their upper limits gives 14. Carbonate hardness values are scarce: Seriously Fish and
        FishBase state only total hardness. The Eureka entry of Einrichtungsbeispiele gives 5 to 10
        dKH, Aquarium-Ratgeber 3 to 12, the OATA sheet for Malawi cichlids in general 10 to 15, a
        rift lake chemistry page 10 to 12, and the my-fish breeding report kept its Eureka group
        above 5 dKH. The widest sourced range thus runs from 3 (Aquarium-Ratgeber) to 15 dKH
        (OATA); the tolerance starts at the lake value of 5 and ends below the general Malawi
        figure of 15. A peacock care page with 4 to 6 dKH contradicts the lake data and is not
        followed. Confidence is low because no species database states an upper carbonate
        hardness for the species or the line.
      sources:
        - *eb
        - *ar
        - *oata
        - *branchu
        - *fao
        - *myfish
        - &furry
          kind: website
          title: "Furry Critter: Rift lake water chemistry for African cichlids"
          url: https://furrycritter.com/pages/articles/fish/rift_lake_chemistry.htm
          accessed: 2026-10-13
        - &aqsrc
          kind: website
          title: "Aquarium Source: Peacock Cichlid care guide"
          url: https://www.aquariumsource.com/peacock-cichlid/
          accessed: 2026-10-13
      evidence:
        - source: *eb
          value: {min: 5, max: 10}
          note: Eureka line
        - source: *ar
          value: {min: 3, max: 12}
        - source: *oata
          value: {min: 10, max: 15}
          note: Lake Malawi cichlids in general
        - source: *branchu
          value: {min: 6.5, max: 6.9}
          note: natural lake water, which the tolerance contains
        - source: *fao
          value: {min: 5.6, max: 7.3}
          note: natural lake water, which the tolerance contains
        - source: *myfish
          value: {min: 5}
          note: lower limit only, breeding group of the Eureka line
        - source: *furry
          value: {min: 10, max: 12}
          note: Lake Malawi cichlids in general
        - source: *aqsrc

    rationale: >-
      All four votes chose an invertivore without bloat sensitivity. Peacocks hover over the sand,
      detect moving invertebrates with their enlarged head pores and take them with a mouthful of
      substrate (Konings; Schwalbe et al. 2012 and Schwalbe 2013 for the genus; Seriously Fish).
      Stigliano reports insect larvae and crustaceans as the wild diet, FishBase lists invertebrate
      food items, and the Cichlid Room Companion classes the species as a crustacean and insect
      eater. Care sources recommend animal-based food with a small plant share; they warn against
      fatty meat such as beef heart and overfeeding, but none describes the intolerance of a
      protein-rich diet that marks aufwuchs grazers, so the flag is false. Fishkeeper calls the
      species omnivorous, which refers to aquarium feeding. The foods list follows the decided
      vote; the other runs named insect larvae, small crustaceans, brine shrimp, fine pellets and

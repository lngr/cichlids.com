schemaVersion: 1
id: aulonocara-jacobfreibergi-eureka
legacyIds: [223]
status: domestic-form

taxonomy:
  validName: "Aulonocara jacobfreibergi 'Eureka'"
  genus: Aulonocara
  species: jacobfreibergi
  author: (Johnson, 1974)
  source: &cof
    kind: catalog-of-fishes
    title: "Eschmeyer's Catalog of Fishes, species of the genus Aulonocara"
    url: https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Aulonocara
    accessed: 2026-10-13
  synonyms:
    - name: Trematocranus jacobfreibergi
      note: Original combination of the parent species (Johnson 1974); the Catalog of Fishes treats it as valid as Aulonocara jacobfreibergi.
  legacyNames:
    - Aulonocara eureka
  parents:
    - aulonocara-jacobfreibergi
  note: >-
    The Catalog of Fishes holds no nominal species eureka, neither in Aulonocara nor in
    Trematocranus (both genus lists queried on 2026-10-13), so "Aulonocara eureka" is a trade label
    without zoological standing. Ad Konings (Practical Fishkeeping), Seriously Fish, the Cichlid-Forum
    species profile and the Victorian Cichlid Society sheet all describe the Eureka as an aquarium
    line selected for red colour from the wild Otter Point population of A. jacobfreibergi; the
    Cichlid-Forum profile states expressly that it is line-bred and not a hybrid. A hobby claim that
    the line also carries blood of the 'Swallowtail' form is not backed by any breeding record. The
    profile therefore treats the fish as a domestic form of A. jacobfreibergi, which takes the
    habitat and water values of its Lake Malawi parent species. Trade names vary between "Eureka"
    and "Eureka Red"; the shorter form matches the legacy name and the literature.

names:
  trade:
    en:
      - Eureka peacock
      - Eureka red peacock
      - Eureka Red
      - Eureka red jake
    de:
      - Feenbuntbarsch Eureka
      - Aulonocara Eureka Red
      - Kaiserbuntbarsch Eureka

variants:
  - name: Albino Eureka
    kind: color-morph
    note: Albino form of the line with a red body and pale eyes; the Victorian Cichlid Society lists it as a variety, and its descent from pure Eureka stock is not documented.

features:
  origin:
    value:
      continent: captive-bred
      region: Lake Malawi
      waterbody: Lake Malawi
      localities:
        - Otter Point, southern Lake Malawi (wild stock of the line)
    confidence: high
    rationale: >-
      The Eureka exists only in aquaria. Konings, Seriously Fish, the Cichlid-Forum profile and the
      Victorian Cichlid Society agree that it was selected in captivity from A. jacobfreibergi of
      Otter Point in the south of Lake Malawi, and FishBase confirms Lake Malawi as the home of the
      parent species. The waterbody entry carries the water values of the parent species over to the
      line. All runs agree on a captive origin with Lake Malawi ancestry; several independent sources
      support it, hence high confidence.

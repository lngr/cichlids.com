    tolerance:
      value: {min: 21, max: 29}
      confidence: medium
      verification:
        method: unanimous
        votes: {agree: 4, total: 4}
      rationale: >-
        All four runs proposed 21 to 29 C. Husbandry sources for the species and the Eureka line
        span 23 to 29 C, most of them 24 to 28 C: Seriously Fish and Tropical Freshwater Fish
        accept up to 29 C, The Fish Barn names 23 C as its lower limit. No care source documents

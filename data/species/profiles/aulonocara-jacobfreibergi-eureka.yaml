    tolerance:
      value: {min: 7.5, max: 8.7}
      confidence: medium
      verification:
        method: unanimous
        votes: {agree: 4, total: 4}
      rationale: >-
        The four runs proposed lower limits of 7.5 and upper limits of 8.6 (generator, checker-b),
        8.8 (checker-a) and 9.0 (checker-c); these agree within 0.3 pH of each other, and the vote
        count takes the median of the upper limits, 8.7. Husbandry sources ask for alkaline water:
        most give 7.5 or 7.8 as the lower limit and 8.0 to 8.8 as the upper limit. Wider ranges
        exist: Seriously Fish accepts 7.5 to 9.0 and Aquarium-Ratgeber 7.3 to 9.5, while Fishipedia
        recommends 7.2 to 8.0 for the aquarium. These outer values rest on single sources and are
        not adopted. The tolerance contains the lake range of 7.7 to 8.6.

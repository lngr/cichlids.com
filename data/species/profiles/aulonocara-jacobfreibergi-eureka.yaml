  temperatureC:
    value: {min: 21, max: 29}
    confidence: high
    verification: {method: waterbody, waterbody: lake-malawi}
    rationale: >-
      The vote count fixes the Lake Malawi range for the parent species, and all four runs proposed
      it. Eccles (1974) found about 27 C in the upper 60 m at the end of the warm season and 21 C in
      inshore water of the south-east arm during the cool, windy months; Vollmer et al. (2005) give
      winter epilimnion values near 23.5 C and summer surface water near 28 C, and later campaigns
      measured up to 29 C. Aquarium recommendations belong to the tolerance, not to this natural
      range.
    sources:
      - &eccles
        kind: literature
        title: >-
          Eccles, D. H. (1974). An outline of the physical limnology of Lake Malawi (Lake Nyasa).
          Limnology and Oceanography 19(5), 730-742 (abstract).
        url: https://doi.org/10.4319/lo.1974.19.5.0730
        accessed: 2026-10-12
      - &vollmer05
        kind: literature

      model: claude-sonnet-5-5
      date: 2026-10-13
    - role: adjudicator
      model: claude-opus-5-5
      date: 2026-10-13
  disagreements:
    - field: id
      proposals:
        - {by: generator, value: aulonocara-jacobfreibergi-eureka}
        - {by: checker-a, value: aulonocara-jacobfreibergi-eureka-red}
        - {by: checker-b, value: aulonocara-jacobfreibergi-eureka}
        - {by: checker-c, value: aulonocara-jacobfreibergi-eureka}
      decision: aulonocara-jacobfreibergi-eureka
      rationale: >-
        Three of four runs use 'Eureka'. It matches the legacy name Aulonocara eureka and the name
        used by Konings, Seriously Fish, the Cichlid-Forum profile and the Victorian Cichlid
        Society; 'Eureka Red' is a common trade variant and is kept among the trade names.
    - field: taxonomy.validName
      proposals:
        - {by: generator, value: "Aulonocara jacobfreibergi 'Eureka'"}
        - {by: checker-a, value: "Aulonocara jacobfreibergi 'Eureka Red'"}
        - {by: checker-b, value: "Aulonocara jacobfreibergi 'Eureka'"}
        - {by: checker-c, value: "Aulonocara jacobfreibergi 'Eureka'"}
      decision: "Aulonocara jacobfreibergi 'Eureka'"
      rationale: Follows the decision on the id; the line name in the literature is 'Eureka'.
    - field: taxonomy.author
      proposals:
        - {by: generator, value: "(Johnson, 1974)"}
        - {by: checker-a, value: "(Johnson, 1974)"}
        - {by: checker-b, value: null}
        - {by: checker-c, value: "(Johnson, 1974)"}
      decision: "(Johnson, 1974)"
      rationale: The Catalog of Fishes gives Johnson 1974 as the author of the parent species, described in Trematocranus, hence the parentheses.
    - field: features.origin.value.region
      proposals:
        - {by: generator, value: Lake Malawi}
        - {by: checker-a, value: Lake Malawi}
        - {by: checker-b, value: "Captive line of Aulonocara jacobfreibergi, a species of Lake Malawi"}
        - {by: checker-c, value: Captive-selected Eureka line of Lake Malawi Aulonocara jacobfreibergi}
      decision: Lake Malawi
      rationale: The region names the lake or river system; the captive status is expressed by the continent value captive-bred.
    - field: features.maxSizeCm.value.female
      proposals:
        - {by: generator, value: 10}
        - {by: checker-a, value: 11}
        - {by: checker-b, value: 11}
        - {by: checker-c, value: 10}
      decision: 10
      rationale: >-
        Only Eureka-specific sources state a female size: 8 cm (Einrichtungsbeispiele), about 10 cm
        (my-fish) and 10 to 12 cm (Gensou). 10 cm is the middle statement; the 11 cm of checker-b
        rested on a female value that Seriously Fish does not state.
    - field: features.predation.value
      proposals:
        - {by: generator, value: 1}
        - {by: checker-a, value: 1}
        - {by: checker-b, value: 1}
        - {by: checker-c, value: 0}
        - {by: tiebreaker-1, value: 1}
        - {by: tiebreaker-2, value: 1}
      decision: 1
      rationale: Decided by the vote count as qualified majority, 5 of 6 votes.
    - field: features.diet.value.foods
      proposals:
        - {by: generator, value: [high-quality sinking pellets and flakes for carnivorous cichlids, "frozen mysis, brine shrimp and mosquito larvae", small share of plant-based food such as spirulina]}
        - {by: checker-a, value: [insect larvae, small crustaceans, benthic invertebrates from sand]}
        - {by: checker-b, value: [chironomid larvae, brine shrimp, mosquito larvae, quality pellets, spirulina]}
        - {by: checker-c, value: [Small crustaceans, Insect larvae, Balanced fine cichlid pellets, Artemia, Supplementary vegetable matter]}
      decision: [high-quality sinking pellets and flakes for carnivorous cichlids, "frozen mysis, brine shrimp and mosquito larvae", small share of plant-based food such as spirulina]
      rationale: Type and bloat flag are unanimous; the vote count takes the foods list of the first agreeing vote, and the other lists name the same food groups.
    - field: features.aggressionConspecific.value
      proposals:
        - {by: generator, value: 3}
        - {by: checker-a, value: 2}
        - {by: checker-b, value: 2}
        - {by: checker-c, value: 3}
      decision: 3
      rationale: >-
        Seriously Fish, Stigliano, Aquarium-Ratgeber, the Cichlid-Forum profile and the Victorian
        Cichlid Society report persistent pursuit of rivals and females and injuries under poor
        conditions, which is level 3; the milder descriptions of Fishipedia and Fishkeeper lower the
        confidence to medium.
    - field: features.territory.value.breedingOnly
      proposals:
        - {by: generator, value: false}
        - {by: checker-a, value: false}
        - {by: checker-b, value: false}
        - {by: checker-c, value: true}
      decision: false
      rationale: Males hold cave territories in every season and breed throughout the year, so the territory is permanent in practice.
    - field: features.coloration.value
      proposals:
        - {by: generator, value: {baseColors: [red, orange, blue], pattern: mixed}}
        - {by: checker-a, value: {baseColors: [red, orange, blue], pattern: mixed}}
        - {by: checker-b, value: {baseColors: [red, blue], pattern: plain}}
        - {by: checker-c, value: {baseColors: [red, orange, blue], pattern: mixed}}
      decision: {baseColors: [red, orange, blue], pattern: mixed}
      rationale: Three runs and the descriptions of Einrichtungsbeispiele and the retailer sheets name orange as well as red and blue, in separate colour fields.
    - field: features.minTank.value
      proposals:
        - {by: generator, value: {volumeL: 350, lengthCm: 120, depthCm: 60}}
        - {by: checker-a, value: {volumeL: 300, lengthCm: 120, depthCm: 60}}
        - {by: checker-b, value: {volumeL: 300, lengthCm: 120, depthCm: 50}}
        - {by: checker-c, value: {volumeL: 400, lengthCm: 150, depthCm: 60}}
      decision: {volumeL: 350, lengthCm: 120, depthCm: 60}
      rationale: >-
        Keeps the 120 by 60 cm base of Seriously Fish, which most sources support for the length;
        350 litres lies above the 250 to 300 litres of most care sheets and below the volume of the
        full base. The 150 cm of checker-c rests on one directory entry.
    - field: features.lifespanYears.value

  aggressionConspecific:
    value: 3
    confidence: medium
    rationale: >-
      The runs split evenly: generator and checker-c chose 3, checker-a and checker-b 2. Males
      defend a cave or spawning site against other males and court females persistently, which is
      why Seriously Fish asks for one male with four to six females and warns against several
      males in ordinary tanks. Stigliano reports severe fights between males that had lived
      together peacefully, Aquarium-Ratgeber notes injuries from attacks on rivals and unready
      females, the Cichlid-Forum profile rates the line as aggressive towards its own kind, and the
      Victorian Cichlid Society calls the species more aggressive than most of its genus. Level 3,
      persistent chasing with frequent injuries when space, cover or the ratio are wrong, fits these
      reports better than level 2. Fishkeeper and Fishipedia describe milder behaviour, hence
      medium confidence.
    sources:

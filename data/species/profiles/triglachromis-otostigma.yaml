  ph:
    value:
      min: 8.4
      max: 9.4
    confidence: high
    rationale: >-
      Lake Tanganyika range of 8.4 to 9.4, proposed by all four agents. The FAO/FINNIDA programme
      measured a surface pH of about 8.8 to 9.2 and 8.47 to 9.40 at 40 m over one annual cycle at
      three stations (Plisnier et al. 1996). FishBase gives 8.5 to 9.0 for the species, inside the
      lake range. A pH of 7.3 to 7.8 listed in the FAO source book contradicts the alkalinity and
      all modern measurements and is not used.
    sources:
      - kind: literature
        title: >-
          Plisnier, P.-D., Langenberg, V., Mwape, L., Chitamwembwa, D., Tshibangu, K. and Coenen, E.
          (1996). Limnological sampling during an annual cycle at three stations on Lake Tanganyika
          (1993-1994). FAO/FINNIDA Research for the Management of the Fisheries on Lake Tanganyika,
          GCP/RAF/271/FIN-TD/46.

  sizeAndGrowth:
    text: >-
      Adults reach about 12 cm. FishBase gives 12 cm total length, a specialist site says wild fish
      stay near 10 cm and aquarium fish reach 12 to 13 cm, and other sheets give up to 14 cm for
      large males. Males are somewhat larger than females. Growth is fast in captivity: a keeper
      recorded young fish of about 6 cm at eight months of age. A broad head and large mouth make
      the fish look bigger and more capable of swallowing prey than its length suggests. Lifespan is
      estimated at five to seven years, but no firm data exist.
    sources:
      - kind: database
        title: "FishBase: Triglachromis otostigma"
        url: 'https://www.fishbase.se/summary/Triglachromis-otostigma.html'
        accessed: 2026-10-17
        archived: fishbase.se/summary/triglachromis-otostigma.html/2026-10-17T114618Z

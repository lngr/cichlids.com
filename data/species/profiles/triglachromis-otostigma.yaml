      - kind: archive
        title: cichlids.com forum thread 60461
        url: 'https://www.cichlids.com/disc/read.php?3,60461'
  habitat:
    text: >-
      The species is endemic to Lake Tanganyika and lives around the shore wherever soft sediment
      lies, with records from Burundi, the Democratic Republic of the Congo, Tanzania and Zambia. It
      uses mud and fine sand in shallow and deeper coastal water, where pairs dig tunnel systems
      with many exits. Stomach contents examined by Poll held mud, large diatoms and debris.
      According to Konings the fish is not often met, and the turbid water over the mud makes counts
      difficult. Lake Tanganyika water is hard and strongly buffered, with a pH of 8.4 to 9.4, 10 to
      13 dGH, 15 to 20 dKH and 23 to 29 C. The IUCN lists the species as Least Concern.
    sources:
      - kind: database
        title: "FishBase: Triglachromis otostigma"
        url: 'https://www.fishbase.se/summary/Triglachromis-otostigma.html'
        accessed: 2026-10-17
        archived: fishbase.se/summary/triglachromis-otostigma.html/2026-10-17T114618Z
      - kind: database

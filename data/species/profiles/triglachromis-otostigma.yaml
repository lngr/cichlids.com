  social:
    value:
      structure: pair
    confidence: medium
    rationale: >-
      All four agents chose a pair. The species is a biparental mouthbrooder with a lasting pair
      bond; a settled pair drives off a third adult, and breeders advise keeping a pair on its own.
      Young fish live together peacefully, so a small group of juveniles is the way to obtain a
      pair. FishFish advises five or more fish, which suits growing juveniles, and Fishipedia names
      a harem, which contradicts the shared brood care reported by breeders.

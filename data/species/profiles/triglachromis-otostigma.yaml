      - kind: website
        title: "FishFish.fr: Triglachromis otostigma species sheet"
        url: 'https://www.fishfish.fr/poisson/triglachromis-otostigma'
        accessed: 2026-10-17
        archived: fishfish.fr/poisson/triglachromis-otostigma/2026-10-17T114645Z
  husbandry:
    text: >-
      Plan for a tank of about 300 litres, 120 cm long and 50 cm deep for a pair, and more when
      other fish share it. The floor needs a deep layer of fine sand, because the fish excavate
      under stones and carry sand to the corners and the front glass. Set heavy stones directly on
      the tank bottom rather than stacking them, since undermined piles can collapse. Expect the
      layout to change. Hard, alkaline water that suits Lake Tanganyika cichlids works: a pH of 7.8
      to 9.4, 9 to 20 dGH, a carbonate hardness of about 10 to 22 dKH that keeps the pH steady, and
      22 to 29 C, with the lake values of pH 8.4 to 9.4 and 23 to 29 C as the ideal. The fish is shy
      and jumps when startled, so a tight cover is wise. Mud-sifting fish stir up sand, so filter
      intakes need protection and the sand should be rinsed clean before it goes in.
    sources:
      - kind: database
        title: "tanganyika.si: Triglachromis otostigma 'Cape Kachese'"
        url: 'https://www.tanganyika.si/Tanganjika/Triglachromis/Triglachromis%20otostigma/slides/Triglachromis%20otostigma%20%27Cape%20Kachese%27.html'
        accessed: 2026-10-17
        archived: tanganyika.si/tanganjika/triglachromis/triglachromis_otostigma/slides/triglachromis_otostigma__cape_kachese_.html/2026-10-17T114644Z

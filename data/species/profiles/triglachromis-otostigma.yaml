      rationale: >-
        Unanimous decision of four votes: the generator, checker-a and checker-b proposed 22 to 29 C
        and checker-c 23 to 29 C, which agree within one degree; the decided range takes the median
        bounds. All care figures lie inside it: FishBase 24 to 26 C, FishFish 23 to 26 C and
        Fishipedia 23 to 28 C. No source reports harm at the edges of the lake range. The upper
        limit is the lake maximum, and the lower limit of 22 C rests on the general keeping practice
        of Tanganyika cichlids rather than on a source for this species, hence the low confidence.

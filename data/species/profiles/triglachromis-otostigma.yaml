  temperatureC:
    value:
      min: 23
      max: 29
    confidence: high
    rationale: >-
      The species is endemic to Lake Tanganyika, so the natural range is the lake range of 23 to 29
      C, as all four agents proposed. The hourly buoy record at Mpulungu (Verburg et al. 1997) spans
      about 23.9 to 29.0 C, the cooler values falling in the southern upwelling season from June to
      September, and the seasonal surface means at the northern stations of the FAO/FINNIDA
      programme lie near 24 to 26 C (Plisnier et al. 1996). The 24 to 26 C on the FishBase page is
      an aquarium figure within the lake range.
    sources:
      - kind: literature
        title: >-
          Plisnier, P.-D., Langenberg, V., Mwape, L., Chitamwembwa, D., Tshibangu, K. and Coenen, E.
          (1996). Limnological sampling during an annual cycle at three stations on Lake Tanganyika
          (1993-1994). FAO/FINNIDA Research for the Management of the Fisheries on Lake Tanganyika,
          GCP/RAF/271/FIN-TD/46.

  territory:
    value:
      size: large
      breedingOnly: false
    confidence: low
    rationale: >-
      All agents chose a large territory; the generator set the breeding flag to true, checker-a,
      checker-b and checker-c to false. The decision is a large territory held permanently. In the
      lake a pair digs a tunnel system with about a dozen exits over a radius of 2 to 3 m (Konings,
      reported by Destination Tanganyika), and in tanks a settled pair owns the sand and pushes
      other fish to the far side whether or not it is spawning. Unpaired young fish claim little.
      Tanganyika.si limits the territorial behaviour to the burrow and breeding site, and Fishipedia
      calls the species not territorial, which contradicts the keepers and reads as template text.
      Low confidence, as the evidence is a few keeper reports.

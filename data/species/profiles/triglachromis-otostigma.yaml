  habitatZones:
    value:
      - sand
      - rock
    confidence: medium
    rationale: >-
      The generator, checker-a and checker-b chose sand and rock, checker-c sand alone. The decision
      is sand and rock. In the wild the species lives over soft mud and fine sand and digs tunnels
      in it (FishBase, Cichlid Room Companion, Kirchberger et al. 2014). In the tank keepers and
      Tanganyika.si use a deep bed of fine sand with large flat stones set on the bottom, which the
      fish undermine and use as roofs for their burrows, so stable rock is a tank need even though
      the fish leaves the rockwork itself to other species.

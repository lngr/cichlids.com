  breeding:
    value: biparental-mouthbrooder
    confidence: high
    rationale: >-
      All four agents chose biparental mouthbrooding. The Cichlid Room Companion gives this mode,
      Sefc (2011) lists the species among the Limnochromini that brood in the mouths of both parents
      and guard the young, and Destination Tanganyika and a breeder on Cichlid-Forum saw both
      parents carry eggs and larvae and pass them between them. Tanganyika.si adds that pairs spawn
      inside their tunnels.

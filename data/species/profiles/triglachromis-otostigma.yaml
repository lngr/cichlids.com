      waterbody: lake-tanganyika
      localities:
        - Masambu
        - Mshale
        - Chituta Bay
        - Cape Kachese
        - Namansi
    confidence: high
    rationale: >-
      All four agents place the species in Lake Tanganyika alone, in line with the Catalog of
      Fishes, FishBase and the Cichlid Room Companion. The syntypes come from Masambu and Mshale,
      the Cichlid Room Companion shows a male photographed at Chituta Bay on the Zambian shore, and
      a Tanganyika specialist site names the populations Cape Kachese and Namansi and reports the
      species wherever muddy bottom occurs along the shores, without geographic variation.
      Fishipedia lists Burundi, the Democratic Republic of the Congo, Tanzania and Zambia. The
      locality list joins the localities of all agents.

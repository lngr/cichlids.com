  synonyms:
    - name: Limnochromis otostigma
      note: >-
        Original combination of Regan (1920), with syntypes from Masambu and Mshale on Lake
        Tanganyika; Poll and Thys van den Audenaerde (1974) placed the species in its own genus
        Triglachromis.
  legacyNames:
    - Triglachromis otostigma
  note: >-
    The Catalog of Fishes (species list of Triglachromis, accessed 2026-10-17, updated 21 September
    2026) gives the status valid as Triglachromis otostigma in the subfamily Pseudocrenilabrinae.
    The query for the original genus Limnochromis
    (https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Limnochromis,
    accessed 2026-10-17, archived
    researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-571266da/2026-10-15T083922Z)
    returns only Limnochromis auritus. The genus holds this single species and belongs to the tribe
    Limnochromini; FishBase, GBIF and the Cichlid Room Companion use the same valid name. All four
    agents agree on the taxonomy.

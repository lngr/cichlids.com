        title: "Destination Tanganyika: Triglachromis otostigma (aquarium keeping and breeding report)"
        url: 'https://www.destin-tanganyika.com/triglachromis-otostigma/'
        accessed: 2026-10-17
        archived: destin-tanganyika.com/triglachromis-otostigma/2026-10-17T114644Z
      - kind: forum
        title: "Cichlid-Forum thread: triglachromis otostigma"
        url: 'https://www.cichlid-forum.com/threads/triglachromis-otostigma.224153/'
        accessed: 2026-10-17
        archived: cichlid-forum.com/threads/triglachromis-otostigma.224153/2026-10-17T114644Z
      - kind: database
        title: "FishBase: Triglachromis otostigma"
        url: 'https://www.fishbase.se/summary/Triglachromis-otostigma.html'
        accessed: 2026-10-17
        archived: fishbase.se/summary/triglachromis-otostigma.html/2026-10-17T114618Z
  socialBehavior:
    text: >-
      Behaviour depends on age and on whether the fish are paired. Young fish live together without
      aggression, and one keeper held three wild pairs in one tank with little more than chasing at
      spawning time. Once a pair forms, it claims the sand around its burrow, charges and flares at
      other fish and can turn steadily on a surplus adult of its own kind: in one 450 litre tank the
      pair first drove the third fish into a corner and in the end kept it out of the rest of the
      tank. Injuries are rarely reported when the chased fish can retreat, but a surplus adult is
      better moved to another tank. The fish are shy and skittish and settle best in a quiet tank. A
      group of young fish gives pairs the chance to form. Aggression towards other species is mostly
      territorial and tied to pairing.
    sources:
      - kind: forum
        title: "Cichlid-Forum thread: triglachromis otostigma"
        url: 'https://www.cichlid-forum.com/threads/triglachromis-otostigma.224153/'
        accessed: 2026-10-17
        archived: cichlid-forum.com/threads/triglachromis-otostigma.224153/2026-10-17T114644Z
      - kind: website
        title: "Destination Tanganyika: Triglachromis otostigma (aquarium keeping and breeding report)"
        url: 'https://www.destin-tanganyika.com/triglachromis-otostigma/'
        accessed: 2026-10-17
        archived: destin-tanganyika.com/triglachromis-otostigma/2026-10-17T114644Z
      - kind: forum
        title: "Music City Cichlids forum: WC Triglachromis otostigma breeding log"
        url: 'https://musiccitycichlids.proboards.com/thread/3777/wc-triglachromis-otostigma-breeding-log'
        accessed: 2026-10-17
        archived: musiccitycichlids.proboards.com/thread/3777/wc-triglachromis-otostigma-breeding-log/2026-10-17T114752Z
      - kind: website
        title: "FishFish.fr: Triglachromis otostigma species sheet"
        url: 'https://www.fishfish.fr/poisson/triglachromis-otostigma'
        accessed: 2026-10-17
        archived: fishfish.fr/poisson/triglachromis-otostigma/2026-10-17T114645Z
  diet:
    text: >-
      In the lake the fish sifts mud and sand and swallows the sediment together with diatoms,
      microorganisms and small invertebrates. In the tank it feeds in a typical way: it presses its
      belly to the sand, backs along it and feels the grains with the free pectoral rays, then sucks
      up what it finds. Fine sinking pellets, powdered food and frozen foods such as krill and mysis
      are accepted, and a mix of items is better than a single food. Crushed pellets raise fry. Food
      that sinks into the sand is used, so uneaten portions foul the substrate quickly; feed small
      amounts. No tendency to bloat is documented, but a varied, not too fatty diet is the safe
      course.
    sources:
      - kind: database
        title: "FishBase: Triglachromis otostigma"
        url: 'https://www.fishbase.se/summary/Triglachromis-otostigma.html'
        accessed: 2026-10-17

  predation:
    value: 2
    confidence: low
    rationale: >-
      Conservative decision with low confidence: the six votes split evenly, with level 2 from the
      generator, checker-b and checker-c and level 1 from checker-a, tiebreaker-1 and tiebreaker-2,
      so the tally takes the higher level. The case for level 2 rests on tank reports: a keeper of
      Destination Tanganyika found a young fish with a Cyprichromis of similar size in its mouth a
      day after the two were mixed and saw a surplus adult hunt the free fry of the breeding pair at
      night, FishFish and a French forum sheet say the large mouth can take a Cyprichromis, and a
      breeder on Cichlid-Forum says adults relish fry and could eat small females of Lamprologus
      ocellatus. The case for level 1 rests on the wild diet: the gut metagenome study of Huyghe et
      al. (2025) places the species in its herbivorous cluster with only a minor share of fish
      reads, the FishBase food item lists name no fish, the Cichlid Room Companion classes it as a
      substrate sifter, and FishBase accepts tankmates of comparable size. No source describes
      active hunting. Level 2 is the cautious reading for the tank: fish below about a third of the
      adult length, about 4 cm, are at risk, although fish are no regular part of the natural diet.

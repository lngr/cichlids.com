      - kind: forum
        title: "Cichlid-Forum thread: triglachromis otostigma"
        url: 'https://www.cichlid-forum.com/threads/triglachromis-otostigma.224153/'
        accessed: 2026-10-17
        archived: cichlid-forum.com/threads/triglachromis-otostigma.224153/2026-10-17T114644Z
  breeding:
    text: >-
      Triglachromis otostigma is a biparental mouthbrooder. A bonded pair digs a tunnel system,
      spawns inside it, and both parents carry the eggs and larvae, passing them to each other at
      intervals of minutes to many hours. The eggs are about 2.5 mm long. Larvae are visible after
      about three days, and the young swim freely after about a week, when the parents release them
      but take them back into the mouth at any alarm. Broods of 125 to 150 and up to 250 or 300
      young are reported. A startled pair may abandon its fry, so quiet and a tank without other
      fish are needed. Pairing can take months to years, and unpaired adults should be removed once
      fry are free.
    sources:
      - kind: database
        title: "tanganyika.si: Triglachromis otostigma 'Cape Kachese'"
        url: 'https://www.tanganyika.si/Tanganjika/Triglachromis/Triglachromis%20otostigma/slides/Triglachromis%20otostigma%20%27Cape%20Kachese%27.html'
        accessed: 2026-10-17
        archived: tanganyika.si/tanganjika/triglachromis/triglachromis_otostigma/slides/triglachromis_otostigma__cape_kachese_.html/2026-10-17T114644Z
      - kind: website
        title: "Destination Tanganyika: Triglachromis otostigma (aquarium keeping and breeding report)"
        url: 'https://www.destin-tanganyika.com/triglachromis-otostigma/'
        accessed: 2026-10-17
        archived: destin-tanganyika.com/triglachromis-otostigma/2026-10-17T114644Z
      - kind: forum
        title: "Cichlid-Forum thread: triglachromis otostigma"
        url: 'https://www.cichlid-forum.com/threads/triglachromis-otostigma.224153/'
        accessed: 2026-10-17
        archived: cichlid-forum.com/threads/triglachromis-otostigma.224153/2026-10-17T114644Z
      - kind: literature
        title: >-
          Sefc, K. M. (2011). Mating and Parental Care in Lake Tanganyika's Cichlids. International
          Journal of Evolutionary Biology 2011, 470875.
        url: 'https://doi.org/10.4061/2011/470875'
        accessed: 2026-10-17
        archived: doi.org/10.4061_2011_470875/2026-10-13T065306Z
  sexing:
    text: >-
      There is no clear sexual dimorphism. Males are usually a little larger than females. A black
      pigment on the first hard ray of the dorsal fin, and often the next two, marks the female in
      the reports of a specialist site and of a French keeper who checked it on several breeding
      pairs. One US keeper believes the reverse, so the mark alone is not fully reliable, and the
      most certain proof is a fish that holds eggs. Young fish of both sexes carry a dark spot on
      the soft dorsal rays that does not indicate sex. The females start to show the black rays at
      about eight months of age.
    sources:
      - kind: database
        title: "tanganyika.si: Triglachromis otostigma 'Cape Kachese'"
        url: 'https://www.tanganyika.si/Tanganjika/Triglachromis/Triglachromis%20otostigma/slides/Triglachromis%20otostigma%20%27Cape%20Kachese%27.html'
        accessed: 2026-10-17
        archived: tanganyika.si/tanganjika/triglachromis/triglachromis_otostigma/slides/triglachromis_otostigma__cape_kachese_.html/2026-10-17T114644Z
      - kind: website
        title: "Destination Tanganyika: Triglachromis otostigma (aquarium keeping and breeding report)"
        url: 'https://www.destin-tanganyika.com/triglachromis-otostigma/'
        accessed: 2026-10-17
        archived: destin-tanganyika.com/triglachromis-otostigma/2026-10-17T114644Z
      - kind: forum
        title: "Cichlid-Forum thread: triglachromis otostigma"
        url: 'https://www.cichlid-forum.com/threads/triglachromis-otostigma.224153/'
        accessed: 2026-10-17
        archived: cichlid-forum.com/threads/triglachromis-otostigma.224153/2026-10-17T114644Z
  compatibility:
    text: >-
      Choose tankmates of comparable size and sturdiness that live in other zones. Medium rock
      dwellers such as Julidochromis, Altolamprologus and Telmatochromis stay in the stones, and
      adult Cyprichromis use the open water; keepers suggest all of these for unpaired
      Triglachromis. Avoid small shell dwellers such as Lamprologus ocellatus and Neolamprologus
      multifasciatus, and any fish small enough to fit into the large mouth, including young
      Cyprichromis. Fast, pushy fish such as Lake Malawi mbuna harass this shy fish and need softer
      water. A paired Triglachromis pushes every fish out of its area, and a brood is unlikely to
      survive in a community tank. The species has no known hybrid partner.
    sources:
      - kind: database
        title: "FishBase: Triglachromis otostigma"
        url: 'https://www.fishbase.se/summary/Triglachromis-otostigma.html'
        accessed: 2026-10-17
        archived: fishbase.se/summary/triglachromis-otostigma.html/2026-10-17T114618Z
      - kind: forum
        title: "Cichlid-Forum thread: triglachromis otostigma"

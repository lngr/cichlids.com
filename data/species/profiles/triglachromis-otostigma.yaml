  diet:
    value:
      type: omnivore
      bloatSensitive: false
      foods:
        - fine sinking pellets
        - frozen krill
        - frozen mysis
        - powdered food
    confidence: medium
    rationale: >-
      Unanimous decision of four votes for an omnivore without bloat sensitivity. FishBase names
      diatoms and microorganisms and calls the species omnivorous at a trophic level of 2.7; stomach
      contents examined by Poll and reported by Destination Tanganyika held mud, large diatoms and
      debris; the gut metagenome of Huyghe et al. (2025) holds mostly plant material with diatoms,
      ostracods, insects and some fish; and Kirchberger et al. (2014), after Coulter, describe a
      detritus feeder that probes mud with its free pectoral fin rays. Tanganyika.si and the
      FishBase food item list, with benthic copepods, point towards an invertivore, but the large
      share of plant material and detritus fits omnivore better. No source reports bloat, and a
      breeder raised adults and fry on one pelleted food; the flag rests on this absence of reports,
      hence medium confidence.

  aggressionConspecific:
    value: 3
    confidence: low
    rationale: >-
      The generator and checker-a proposed level 2, checker-b and checker-c level 3. The decision is
      level 3. In the Destination Tanganyika report, which the adjudicator checked for this
      decision, a trio formed a pair that grew ever more aggressive towards the third fish, a male,
      first pushing it into a corner and finally denying it access to the rest of a 450 litre tank;
      FishFish describes pronounced aggression among conspecifics and advises removing dominated
      fish. Persistent chasing of a rival in a large tank fits level 3. Against it, a breeder on
      Cichlid-Forum reports charging and flaring without bodily harm when the chased fish can flee,
      a breeder on the Music City Cichlids forum kept three wild pairs together with chasing only at
      spawning time, and young fish live together peacefully. Since no injuries are reported, level
      4 is excluded, and the split evidence gives low confidence.

  ghDgh:
    value:
      min: 10
      max: 13
    confidence: high
    rationale: >-
      Lake Tanganyika range of 10 to 13 dGH, proposed by all four agents. Magnesium far exceeds
      calcium: the FAO/FINNIDA surface means at Bujumbura, Kigoma and Mpulungu give about 11.1 to
      11.5 dGH, the north basin data of Cohen et al. (1997) about 12.2 dGH and the analysis of
      Talling and Talling in the FAO source book 11.3 dGH. FishBase gives 10 to 15 dGH as an
      aquarium figure. Fishipedia presents 15 to 25 dGH as the natural hardness, which no lake
      measurement supports, so that figure counts only for the tolerance.

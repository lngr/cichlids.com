  problems:
    text: >-
      The commonest problems come from the setup rather than from disease. Stacked stones collapse
      when the fish undermine them, so rockwork must rest on the bottom glass or a firm base. A
      startled fish bolts upward and can leave an open tank. Breeding pairs abandon or lose their
      fry if disturbed or if other fish share the tank. Small tankmates are swallowed, and a lone
      third adult can be driven into a corner and stressed. Stress shows as dark bars across the
      body. Sifting fouls the sand with uneaten food, so overfeeding and poorly cleaned sand damage
      water quality. Water that is soft or acidic is unsuitable for this lake fish. Sources name no
      species-specific disease.

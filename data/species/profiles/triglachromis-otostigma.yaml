  feedingSpeed:
    value: normal
    confidence: low
    rationale: >-
      All four agents chose normal. The fish sifts food from the sand with its free pectoral fin
      rays, a deliberate technique, yet Destination Tanganyika reports that a group works through
      frozen food until nothing remains. The fish are shy and do not rush food like mbuna, and no
      source reports that they lose food to tankmates of similar size.

      a community of fish of comparable size, a breeder on Cichlid-Forum suggests medium-sized
      lamprologines, Julidochromis, Altolamprologus and Cyprichromis for unpaired fish, and a
      breeder on the Music City Cichlids forum kept wild pairs with Telmatochromis. Destination
      Tanganyika doubts that a brood survives among other fish, which is breeding advice and not a
      general rule as for Tropheus.

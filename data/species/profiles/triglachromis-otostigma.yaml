partners:
  suitable:
    - species: Julidochromis marlieri
      reason: >-
        A rock-dwelling cichlid that lives in crevices and stays out of the sandy zone, so it meets
        the sand-digging pair only at the margins. Keepers suggest medium-sized Julidochromis for
        unpaired Triglachromis.
      condition: Tank of 150 cm or more with separate rock and sand areas.
    - species: Altolamprologus calvus
      reason: >-
        A robust, medium-sized rock dweller that keeps to the caves and is not an easy snack.
        Keepers recommend Altolamprologus for the same reason as Julidochromis.
      condition: Tank of 150 cm or more.
    - species: Telmatochromis brichardi
      reason: >-
        A small, quick rock-dweller that was kept with wild Triglachromis pairs and stayed out of
        their way.
    - species: Cyprichromis leptosoma
      reason: >-
        Open-water schooling fish that use a different zone and are larger than a mouth-sized meal
        as adults. A keeper compares the temperament of Triglachromis with that of Cyprichromis.
      condition: >-
        Adult Cyprichromis only; young fish of similar size to a young Triglachromis can be
        swallowed.
  unsuitable:
    - species: Lamprologus ocellatus
      reason: >-
        A tiny shell dweller. Breeders report that its behaviour is inhibited by a paired
        Triglachromis, that its fry are eaten and that females could be taken.
    - species: Neolamprologus multifasciatus
      reason: >-
        A shell dweller of 4 to 5 cm that is small enough to be eaten or pushed out by a pair that
        claims the sand.
    - species: Cyprichromis (juveniles)
      reason: >-
        Young Cyprichromis of similar size to young Triglachromis were swallowed within a day in a
        keeper's tank.
    - species: Lake Malawi mbuna
      reason: >-
        Pushy, fast-feeding rock dwellers that live in much softer and less alkaline water and
        out-compete or harass a shy sifter.
profile:
  overview:
    text: >-
      Triglachromis otostigma is a medium-sized cichlid of the soft bottoms of Lake Tanganyika and
      the only species of its genus. It belongs to the tribe Limnochromini and was first described
      by Regan in 1920 under Limnochromis. The body is elongated with a rounded head, a large mouth
      and long, free tips on the pectoral fin rays, which the fish uses to feel for food in mud and
      sand. Adults reach about 12 cm. It is a biparental mouthbrooder that lives in burrows it digs
      itself and rearranges any sand and stone it is given. Wild-caught fish reach the trade, but
      captive breeding is rare. The species suits keepers who like a specialised, digging-centred
      setup more than a classic rockscape.
    sources:
      - kind: catalog-of-fishes
        title: "Eschmeyer's Catalog of Fishes: species in the genus Triglachromis"
        url: 'https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Triglachromis'
        accessed: 2026-10-17
        archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-db7a55d0/2026-10-17T114615Z
      - kind: database
        title: "tanganyika.si: Triglachromis otostigma 'Cape Kachese'"
        url: 'https://www.tanganyika.si/Tanganjika/Triglachromis/Triglachromis%20otostigma/slides/Triglachromis%20otostigma%20%27Cape%20Kachese%27.html'
        accessed: 2026-10-17
        archived: tanganyika.si/tanganjika/triglachromis/triglachromis_otostigma/slides/triglachromis_otostigma__cape_kachese_.html/2026-10-17T114644Z
      - kind: website
        title: "Destination Tanganyika: Triglachromis otostigma (aquarium keeping and breeding report)"
        url: 'https://www.destin-tanganyika.com/triglachromis-otostigma/'

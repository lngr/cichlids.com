  diet:
    text: "Feed small invertebrate foods and appropriately sized sinking prepared food. Artemia, Daphnia and\
      \ frozen insect larvae provide variety without making fish flesh or plant grazing the basis of the diet.\
      \ Most established captive fish take food at an ordinary pace, while new wild arrivals may need time\
      \ to recognize substitutes. Distribute food so each female can reach a portion and check that companions\
      \ do not take everything first. The field diet is dominated by insects and their larvae. Occasional fry\
      \ consumption is plausible and reported by keepers, so exposed young are not reliably safe. There is\
      \ no established specialized protein-triggered bloat syndrome, but excess food and deteriorating water\
      \ still cause problems."
    sources:
    - kind: literature

  social:
    value:
      structure: harem
      ratio: 3
    confidence: high
    rationale: "All four full-profile runs identify a harem. Generator and checker-a proposed three females\
      \ per male; checker-b and checker-c proposed two. FishBase and the public CRC entry confirm polygyny\
      \ without setting a numeric ratio. A trio is reported as workable by Practical Aquariums, but Bydzovsky\
      \ specifically recommends three to four females and describes exclusion of a subordinate when only two\
      \ females are present; Fishipedia also prefers three. Select one male with three females as a supported\
      \ planning unit, with separate retreats and the larger decided tank. This is not a claim that every trio\
      \ fails or that adding females compensates for missing cover."

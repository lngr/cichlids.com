    rationale: "All four full-profile runs identify a harem. Generator and checker-a proposed three females\
      \ per male; checker-b and checker-c proposed two. FishBase and the public CRC entry confirm polygyny\
      \ without setting a numeric ratio. A trio is reported as workable by Practical Aquariums, but Bydzovsky\

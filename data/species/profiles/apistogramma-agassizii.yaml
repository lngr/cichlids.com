      \ survey reports 25.1 C with a standard deviation of 1.1 in streams containing this species; the derived\
      \ 24.0 to 26.2 evidence band is a summary of dispersion, not measured seasonal limits. Romer and Hahn\
      \ report approximately 29 C at an occupied Peruvian creek. The adopted band is narrower than the 24 to\
      \ 29 proposals and excludes cooler observations from the representative lower edge, rather than declaring\
      \ those waters unsuitable. Fishipedia gives 24 to 27 without station records. Wider regional Xingu readings\
      \ of 26.01 to 31.83 C, general Amazon readings of 28 to 32 C, and Catalao surface peaks of 31.5 to 32\

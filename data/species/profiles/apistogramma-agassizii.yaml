    rationale: "The tally decides level 1 conservatively with low confidence: generator, checker-a and tiebreaker-2\
      \ proposed 1, while checker-b, checker-c and tiebreaker-1 proposed 0. Neither level has the four votes\
      \ required for a qualified majority, so the maximum proposed level is retained. The Krib contains repeated\
      \ aquarium larval-consumption reports for the Alenquer form, Dietzenbach warns about fry losses, and\
      \ AquariumStoreDepot warns about smaller fish. These hobby observations support limited opportunism without\
      \ establishing a measured prey-size limit. Against them, Virgilio and colleagues examined 127 stomachs\
      \ and found insect-dominated diets with no fish prey reported in the readable results; Seriously Fish\
      \ and the Nordic register emphasize invertebrates, Aquario classifies the fish as nonpredatory, and the\
      \ six-month reproductive study observed no offspring cannibalism in its pairs. The scientific diet data\
      \ carry greater trust for normal feeding, while the lower-trust aquarium accounts report a behavior those\
      \ samples do not test. This does not imply a fish-based diet. The rubric ceiling of about 2 cm is a category\
      \ boundary, not a documented prey length. Brood cannibalism also does not prove routine hunting of unrelated\
      \ fish."

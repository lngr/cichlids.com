  problems:
    text: "Common difficulties begin with too little cover, an immature filter or a fish that loses every feeding\
      \ opportunity. Persistent hiding, torn fins or an empty-looking belly warrant checking the social arrangement\
      \ and water quality. Acclimate gradually to changes in mineral content and keep replacement water consistent.\
      \ Do not assume that leaves can turn hard tap water into suitable soft water. Quarantine arrivals and\
      \ maintain good hygiene, because imported fish and stressed tankmates can introduce or develop infectious\
      \ and parasitic problems. A symptom such as poor appetite is not a diagnosis. Avoid speculative medication\
      \ and seek qualified help when losses or unusual signs persist."

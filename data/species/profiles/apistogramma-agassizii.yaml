    value:
      min: 4.7
      max: 7
    confidence: medium
    rationale: "Keep the unanimous approximate-agreement tally at pH 4.7 to 7.0 with medium confidence. Generator\
      \ and checker-b proposed 4.8 to 7.0; checker-a and checker-c proposed 4.5 to 7.0. The tally rounds the\
      \ median lower bound of those proposals. The confirmed Ampiyacu collecting site was pH 4.8, and the Manaus\
      \ survey reports a forest-stream mean of 5.2 with standard deviation 0.45. Catalao spatial means of 4.5\
      \ to 6.6 and source-water values around 6 to 7 provide regional context, not specimen-linked endpoints.\
      \ This representative band is narrower than the full regional values: Horbe and Santos report 5.26 to\
      \ 7.34, and the Amazon review spans black and clear waters from 2.5 to 6.8. Those data do not demonstrate\
      \ occupation of each extreme by this species. The pH 4.1 to 5.3 evidence concerns a congener. Seriously\
      \ Fish values of 3 to 4 concern breeding particular wild populations, not field measurements. The historical\
      \ taxon covers several lineages, so this range is not a universal collecting-site or survival limit."

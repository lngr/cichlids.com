  compatibility:
    text: "Choose calm companions that spend most of their time above the defended floor. Pencilfish are especially\
      \ useful for wild stock, and small peaceful tetras can suit captive lines in a larger community aquarium.\
      \ Keep companions in their appropriate groups and allow extra space beyond the cichlid harem minimum.\
      \ Fry and small shrimp may be eaten, so a community is not a reliable nursery. Other dwarf cichlids compete\
      \ for the same shelter and may complicate identification or breeding. Large predators and forceful cichlids\
      \ are unsuitable. Bottom-dwelling catfish can repeatedly enter brood areas and provoke conflict even\
      \ when their water preferences overlap."
    sources:

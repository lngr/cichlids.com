    tolerance:
      value:
        min: 4
        max: 7
      confidence: low
      rationale: "The tally uses method median with low confidence and decides pH 4.0 to 7.0. Generator proposed\
        \ 4.8 to 7.0, checker-a 4.5 to 7.5, checker-b 4.0 to 7.0, checker-c 4.0 to 7.0, tiebreaker-1 4.0 to\
        \ 7.0 and tiebreaker-2 4.0 to 7.5. Three votes agree within the voting threshold, short of a qualified\
        \ majority; the medians of all six lower and upper endpoints are 4.0 and 7.0. This reflects the central\
        \ husbandry recommendations instead of letting the narrowest proposal determine the envelope. Practical\
        \ Fishkeeping explicitly recommends 4 to 7, with origin-dependent care. The decided ceiling is narrower\
        \ than the retained 5.0 to 7.5 TFH interpretation and the two proposals reaching 7.5. Silva and colleagues\
        \ kept 16 wild-collected pairs for six months at a reported mean pH of 7.40, with dispersion 1.83,\
        \ with all pairs alive at the end and 13 spawning. That is material contrary evidence to treating 7.0\
        \ as a harm threshold, but neither the mean nor its dispersion establishes a multi-year range. The\
        \ reported 7.2 to 7.6 forum holding conditions are brief; Fishipedia recommends 6.8 to 7.2. Seriously\
        \ Fish gives 3 to 4 for spawning some wild populations, not a general maintenance band. Checker-a inferred\
        \ a wider 3 to 7 envelope from that statement; its evidence is retained as an interpretation. AquaInfo\
        \ extractions contained geography rather than readable numerical care advice. The decision contains\
        \ the natural range and is an approximate planning envelope, not proof that every population thrives\
        \ at every endpoint."

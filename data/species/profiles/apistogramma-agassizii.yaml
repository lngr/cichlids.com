  sizeAndGrowth:
    text: "Use about 8 cm for a well-kept adult male and 5 cm for a female when planning the aquarium. Male\
      \ reports reaching 9 cm occur in breeder and trade accounts, but they are not the default size here.\
      \ Some scientific and database lengths exclude the tail, and smaller wild samples do not describe the\
      \ same quantity as a typical adult aquarium maximum. Juvenile colour and fin shape can differ greatly\
      \ from adult sales photographs. Longevity evidence is weak: two to four years is a provisional expectation,\
      \ with some keepers reporting longer lives. Regular small meals and stable clean water support growth\
      \ without forcing it."

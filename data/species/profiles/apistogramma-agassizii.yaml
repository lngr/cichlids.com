  habitat:
    text: "The traditional species occurs in sheltered Amazon-basin streams and floodplain margins associated\
      \ with clear, black and white water. Fine substrate, leaves, roots and branches provide feeding surfaces\
      \ and concealment. A Peruvian collecting account records fish over white sand at pH 4.8 and approximately\
      \ 29 C, without submerged plants. A Manaus survey found the species in a forest-stream system whose intact\
      \ waters averaged 25.1 C and pH 5.2. The profile uses representative natural ranges of 25 to 29 C and\
      \ pH 4.7 to 7.0. Regional ion and alkalinity measurements support very soft water, but the selected 0\
      \ to 3 dGH and 0 to 2 dKH remain proxies rather than measurements beside identified fish throughout its\
      \ range. Collection information matters because the broad historical name includes distinct lineages."
    sources:
    - kind: literature

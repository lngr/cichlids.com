  khDkh:
    value:
      min: 0
      max: 2
    confidence: low
    rationale: "Keep the tally value of 0 to 2 dKH with low confidence and no natural-KH verification object.\
      \ Generator proposed 0 to 3, checker-a 0 to 1, and checker-b and checker-c 0 to 2. Caraballo and colleagues\
      \ summarize regional Negro alkalinity below 0.05 meq/L and Solimoes alkalinity of 0.5 to 0.6 meq/L, equivalent\
      \ to below 0.14 and approximately 1.4 to 1.68 dKH. Comparative bicarbonate measurements give about 0.15\
      \ to 1.15 dKH; Xingu and Chocai alkalinity gives about 0.19 to 0.92. All are regional proxies, not a\
      \ collecting-site KH series. The decided band is narrower than the generator regional envelope of 0 to\
      \ 3 and its Catalao cation-charge estimate of 0 to 2.2 dKH; that estimate assumes all countercharge is\
      \ bicarbonate and is an upper bound rather than measured carbonate hardness. Checker-a inferred 0 to\
      \ 1 from conductivity and pH; neither is converted directly into KH here. GH and KH describe different\
      \ properties."
    sources:
    - kind: literature
      title: Aprile and Darwich (2013). Nutrients and water-forest interactions in an Amazon floodplain lake.

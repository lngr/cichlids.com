  sexing:
    text: "Mature males are usually larger and show longer fins and more elaborate colour than females. The\
      \ pointed male tail is useful once it is developed. Females are smaller and often become strongly yellow\
      \ with darker contrasting markings when guarding a brood. Colour intensity alone is a poor guide in juveniles\
      \ or selected ornamental lines. Look at body size, fin shape and behavior together, and ask the breeder\
      \ to confirm the sexes before purchasing a group. Keep track of the origin of every adult used for breeding\
      \ so that a bright trade colour does not replace reliable identification."
    sources:

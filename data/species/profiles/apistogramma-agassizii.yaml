  temperatureC:
    value:
      min: 25
      max: 29
    confidence: low
    rationale: "Retain the unanimous tally decision of 25 to 29 C with low confidence. Generator and checker-c\
      \ proposed 24 to 29, checker-a 25 to 29, and checker-b 26 to 29 C. The tally combines these approximately\
      \ agreeing ranges and rounds the median lower bound. The Manaus forest-stream survey reports 25.1 C with\
      \ a standard deviation of 1.1 in streams containing this species; the derived 24.0 to 26.2 evidence band\
      \ is a summary of dispersion, not measured seasonal limits. Romer and Hahn report approximately 29 C\
      \ at an occupied Peruvian creek. The adopted band is narrower than the 24 to 29 proposals and excludes\
      \ cooler observations from the representative lower edge, rather than declaring those waters unsuitable.\
      \ Fishipedia gives 24 to 27 without station records. Wider regional Xingu readings of 26.01 to 31.83\
      \ C, general Amazon readings of 28 to 32 C, and Catalao surface peaks of 31.5 to 32 C are not species-linked\
      \ limits. FishBase gives 26 to 29 from aquarium literature, as the FWS assessment recognizes. No complete\
      \ seasonal series for identified populations was available."

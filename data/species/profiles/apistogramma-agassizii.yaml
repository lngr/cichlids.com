  socialBehavior:
    text: "One male can associate with several females rather than maintaining a permanent exclusive pair.\
      \ Each female needs her own sheltered patch and escape routes. Displays and short chases are normal,\
      \ but a fish pinned behind the filter or prevented from feeding is not coping. Rival males are a poor\
      \ choice for the minimum aquarium. A guarding female can also drive away the larger male after spawning.\
      \ Observe all four fish individually and move an excluded fish when necessary. The harem recommendation\
      \ depends on divided floor space; adding females to an open tank does not by itself solve aggression."
    sources:
    - kind: database

    confidence: high
    rationale: "The Catalog of Fishes retains an Amazon-basin species in Brazil, Colombia and Peru. FishBase\
      \ and Seriously Fish describe its traditional range from the Peruvian Amazon east to the Capim system.\
      \ All four runs agree on that origin; their locality lists emphasize different parts of it. The merged\
      \ list covers those supported regions without implying that every population belongs to one biological\
      \ lineage. Estivals and colleagues found substantial reproductive and genetic subdivision within the\
      \ traditional name."

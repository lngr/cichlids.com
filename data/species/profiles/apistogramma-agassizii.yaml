      \ 7.5 and 5. The starting medians are 7.75 and 5 cm. Round the male estimate to about 8 cm for practical\
      \ aquarium planning, within the breeder and Dietzenbach male reports reaching 9 cm and female reports\
      \ of 5. Seriously Fish explicitly gives 7.5 and 5 cm standard length, whereas Practical Aquariums gives\
      \ these as adult aquarium lengths. No exact conversion between standard and total length is assumed.\
      \ FishBase reports 4.4 cm for male or unsexed fish, not a female maximum; checker-a assigned this unsexed\
      \ figure to both sexes. Smaller wild samples and an unsexed 6 cm literature figure do not establish typical\
      \ captive maxima. The feature is an approximate sex-specific aquarium estimate, not the largest trade-line\
      \ record."

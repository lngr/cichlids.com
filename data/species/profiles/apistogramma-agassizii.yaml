  legacyNames:
  - Apistogramma agassizii
  note: "The Catalog of Fishes accepts Apistogramma agassizii (Steindachner, 1875), with the double-i spelling.\
    \ Its original genus was Geophagus and its original subgenus Mesops. The catalog keeps Apistogramma parva\
    \ in synonymy while recording historical uncertainty about its identity. Genetic and mate-choice research\
    \ indicates multiple biological lineages within the traditional broad name; the profile covers the legacy\
    \ catalog taxon and associated aquarium forms, not a formal taxonomic revision."

partners:
  suitable:
  - species: Nannostomus beckfordi
    reason: A calm pencilfish that uses higher water and leaves most cave space free.
    condition: Keep a group in a larger aquarium with matching soft water.
  - species: Nannostomus eques
    reason: Quiet upper-water behavior reduces interference with guarded caves.
    condition: Allow additional space and feed all fish individually.
  - species: Hyphessobrycon rosaceus
    reason: A peaceful midwater tetra is a plausible companion for captive stock.
    condition: Use an adequately sized shoal in a larger community; fry survival is unlikely.
  unsuitable:
  - species: Apistogramma cacatuoides
    reason: Another territorial dwarf cichlid competes for the same floor and caves in the minimum tank.
  - species: Astronotus ocellatus
    reason: A much larger predatory cichlid can consume or severely intimidate this dwarf.
  - species: Chindongo demasoni
    reason: Forceful mbuna behavior and alkaline aquarium requirements conflict with this soft-water dwarf.
profile:
  overview:
    text: "An adult male brings a great deal of colour to a modest aquarium, but this dwarf cichlid needs more\
      \ planning than its size suggests. It searches near the bottom and divides its time between feeding,\
      \ displaying and patrolling shelter. Females become especially assertive when they have young. Captive\
      \ colour lines are usually the most practical choice for a first attempt with the species. Keep collection\
      \ information for wild fish: research around Iquitos found distinct biological entities under the same\
      \ familiar name. A locality name and a captive colour label describe different kinds of information,\
      \ and neither should be silently discarded."
    sources:
    - kind: database

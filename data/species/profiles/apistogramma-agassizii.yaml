    rationale: "All four full-profile runs proposed an empty list, retained with unanimous verification and\
      \ the tally confidence low. No curated group names this species. Seriously Fish warns about mixing geographic\
      \ forms and congeners, but the read sources do not establish a named valid-species pair or an all-members-cross\
      \ group involving A. agassizii. Estivals and colleagues demonstrate subdivision and reproductive isolation\
      \ among lineages within the historical name, not a crossing group of named accepted species. Trade colour\
      \ forms of this nominal species do not by themselves constitute interspecific groups. An empty list records\
      \ the absence of an identified supported group, not proof that no cross is possible."

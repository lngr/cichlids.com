  coloration:
    value:
      baseColors:
      - blue
      - yellow
      - orange
      - red
      - black
      pattern: mixed
    confidence: medium
    rationale: "Generator proposed blue, yellow, red and black with stripes; checker-a blue and yellow with\
      \ mixed pattern; checker-b the generator palette with mixed pattern; checker-c added orange with mixed\
      \ pattern. Retain the common male palette plus the supported orange variation. The flank stripe combines\
      \ with variable caudal bands, spots and coloured fins, so mixed covers the reported forms better than\
      \ stripes alone. None of these colours is required in every locality or selected captive line. Brooding\
      \ female yellow is not the sole basis for the male palette."

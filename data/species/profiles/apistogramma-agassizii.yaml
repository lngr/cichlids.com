  husbandry:
    text: "Provide about 100 litres with at least an 80 by 35 cm floor for one male and three females. Divide\
      \ the bottom with wood, plants and several caves so each female can withdraw without crossing another\
      \ guarded patch. Fine sand, shaded light and a gentle current suit bottom-oriented feeding and shelter\
      \ use. Use a mature biological filter and regular water changes with consistent replacement water. The\
      \ planning tolerances are 22 to 29 C, pH 4 to 7, GH 0 to 11 dGH and KH 0 to 5 dKH; these are approximate\
      \ stock-dependent envelopes rather than targets at their extremes. A starting temperature near 25 to\
      \ 27 C and soft acidic to neutral water suits many aquarium lines. Some populations need different breeding\
      \ conditions, and a six-month study near mean pH 7.4 shows that 7.0 is not an established universal harm\
      \ threshold. Measure pH, GH and KH separately and keep spare accommodation available for an excluded\
      \ adult."

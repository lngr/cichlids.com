      \ starting endpoint medians are 2.5 and 4.5 years. Those fractional boundaries imply more precision than\
      \ the evidence supports. Dietzenbach gives 2 to 3, while a species-specific keeper reports more than\
      \ four years and the same forum offers genus-level expectations around 2 to 3. Adopt a coarse 2 to 4\
      \ year expectation rather than the unsupported 3 to 5 model estimates. Fishipedia lists six years without\
      \ a survival dataset, so the chosen range is narrower than that source and is not a biological maximum.\

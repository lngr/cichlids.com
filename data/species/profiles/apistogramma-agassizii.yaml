  breeding:
    text: "The female places eggs inside a cavity and takes the leading role in tending the clutch and free-swimming\
      \ young. Provide several small caves rather than relying on a single spawning location. Spawning can\
      \ make her intolerant of the male, so do not assume that a successful clutch proves the adults can remain\
      \ together safely. Fine live foods help feed the young once they are swimming and searching. Low hardness\
      \ often matters for reproduction. Some wild populations need very acidic spawning water, whereas selected\
      \ captive stock may reproduce under milder conditions. Match the stock you actually have instead of treating\
      \ an extreme pH as a universal requirement."
    sources:

  ghDgh:
    value:
      min: 0
      max: 3
    confidence: low
    rationale: "Retain the unanimous approximate-agreement tally at 0 to 3 dGH, with low confidence. Generator\
      \ and checker-a proposed 0 to 2; checker-b and checker-c proposed 0 to 4. The tally rounds the median\
      \ upper endpoint to 3. Zero denotes negligible measurable hardness. Horbe and Santos paired calcium and\
      \ magnesium measurements convert to about 0.16 to 0.82 dGH using Ca/7.14 plus Mg/4.34 for mg/L; Catalao\
      \ seasonal ion means yield a bounding envelope around 0.8 to 1.7. Comparative Negro and Solimoes ions\
      \ give approximately 0.15 and 1.75 dGH. These are regional proxies rather than hardness titrations alongside\
      \ identified fish. The adopted band is narrower than the DwarfCichlid collecting-report synthesis of\
      \ below 1 to 4 dGH. Fishipedia lists 6 to 10 as natural without underlying station measurements, and\
      \ FishBase lists 0 to 12 from aquarium literature; both remain contrary evidence rather than verified\
      \ habitat limits. Checker-a inferred small GH values from conductivity and ion-poor conditions; conductivity\
      \ alone is not a valid conversion to GH."
    sources:
    - kind: literature
      title: Horbe and Santos (2009). Chemical composition of black-watered rivers in the western Amazon Region
        (Brazil).

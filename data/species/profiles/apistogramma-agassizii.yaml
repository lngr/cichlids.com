    decision: 3
    rationale: "Generator, checker-b and checker-c proposed 3; checker-a proposed 2. Seriously Fish warns that\
      \ maternal aggression can require removing the male, and the captive study directly observed females\
      \ attacking males near offspring. Breeder and Nordic accounts also describe dangerous female or rival\
      \ conflicts when space or cover is inadequate. This supports persistent territorial chasing and injury\
      \ risk under poor conditions, beyond routine hierarchy alone. Separate female territories and one male\
      \ reduce the risk; level 4 would overstate inevitable severe injury in the recommended unit."

        \ 6 and low confidence. The generator proposed 5 to 12, checker-a 5 to 15, checker-b 5 to 10, checker-c\
        \ 5 to 20, tiebreaker-1 5 to 10, and tiebreaker-2 5 to 15 dKH. No qualified majority forms. All minima\
        \ are 5; the two middle maxima are 12 and 15, whose median of 13.5 rounds to 14. This is a median\
        \ of all votes, not an intersection or a claimed physiological threshold. It contains natural 5 to\
        \ 8 dKH and sits among plausible buffered Malawi aquarium conditions. JBL's mbuna setup gives 5 to\
        \ 10, its general freshwater guide 5 to 12, LICG the wider 5 to 15, and OATA the wider 10 to 15 dKH;\
        \ those wider source ranges are retained. Abysse's target of 10 and a reported aquarium reading of\
        \ 11 are points rather than limits. The RSDiscus 8.1 to 8.5 figures lack a unit and may confuse KH\
        \ with pH. No direct Ndumbi study establishes the upper endpoint, so this remains a low-confidence\
        \ group-based husbandry inference."

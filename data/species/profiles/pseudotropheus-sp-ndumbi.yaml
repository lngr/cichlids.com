        \ confidence. The generator proposed 3 to 12, checker-a 3 to 20, checker-b 3 to 30, checker-c 3 to\
        \ 20, tiebreaker-1 3 to 20, and tiebreaker-2 3 to 18 dGH. The four proposals with maxima of 18 or\
        \ 20 agree within the 2 dGH rule; their median maximum is 20. The minimum contains the natural 3 to\
        \ 5 dGH. Riverpark and my-fish recommend 10 to 20, and JBL's manufacturer sheet gives 5 to 20 for\
        \ Malawi aquaria; OATA's general Malawi advice is 12 to 18. The wider Interaquaristik range of 9 to\
        \ 30 and Aquaristik Deals range of 10 to 25 remain in evidence, but do not establish long-term endpoint\
        \ outcomes. A reported aquarium point of 16 dGH supports practical keeping above the lake range without\
        \ determining a maximum. The continuous lake-to-aquarium span remains inferred."

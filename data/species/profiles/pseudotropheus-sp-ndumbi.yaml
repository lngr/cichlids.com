partners:
  suitable:
    - species: Chindongo saulosi
      reason: A specialist lists this grazing mbuna as a possible companion with compatible feeding and water
        movement.
      condition: "Use a larger mixed-stock aquarium, around 450 L and 150 cm or more, with separate rock refuges;\
        \ confirm identities and watch for rivalry."
    - species: Labidochromis caeruleus
      reason: "Listed by the specialist as a possible mbuna companion, although its different natural feeding\
        \ habits require care with the shared diet."
      condition: Only in a larger community with ample retreats and a feeding plan that preserves the plant-rich
        Ndumbi staple.
  unsuitable:
    - species: Calm community fish
      reason: Persistent chasing and competition from an adult male can overwhelm less assertive fish.
    - species: Cichlids needing a rich animal-based staple
      reason: Their feeding requirements conflict with the decided aufwuchs diet and bloat-sensitivity flag.
    - species: Unidentified Ndumbi Gold or Elongatus Ndumbi stock
      reason: The shared locality word does not establish identity or compatibility; mixing them obscures
        breeding records and makes social and crossing risk difficult to assess.
profile:
  overview:
    text: "Ndumbi is a shortened aquarium label associated with a Lake Malawi reef. It does not by itself\
      \ identify a described species. The best documented candidate is Red Top Ndumbi, also called Pseudotropheus\
      \ sp. 'perspicax orange cap', which specialist registers treat as undescribed. Ndumbi Gold and Elongatus\
      \ Ndumbi are different possible identities and should not be assumed to be color variants of this fish.\
      \ The care information here primarily follows the orange-cap candidate, with moderate or low confidence\
      \ where identity matters. A blue male with a warm-colored head is a useful clue, but a locality record\
      \ is more informative than color alone."
    sources:
      - *id049
      - *id015
      - *id016
      - *id061
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      - *id009
      - kind: catalog-of-fishes
        title: "Eschmeyer's Catalog of Fishes, species of the genus Pseudotropheus"
        url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Pseudotropheus"
        accessed: '2026-10-15'
        archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-54fb6171/2026-10-14T101559Z
  habitat:
    text: "The label refers to the Ndumbi reef area on the Tanzanian shore of Lake Malawi. Orange-cap references\
      \ also report Pombo Rocks. They describe shallow rocky habitat, with clean rock faces and nearby sand\
      \ pockets or a sloping sandy floor. Accounts give depths from roughly 2 to 10 m, rather than a single\
      \ fixed depth. Lake Malawi's natural chemistry is alkaline despite fairly low calcium and magnesium\
      \ hardness: the regional profile uses pH 7.7 to 8.6, GH 3 to 5 dGH and alkalinity equivalent to 5 to\
      \ 8 dKH. The natural temperature synthesis spans 21 to 29 C across seasons and regions. These lake-wide\
      \ ranges are not measurements of every Ndumbi collection site."
    sources:
      - *id015
      - *id026
      - *id024
      - *id010
      - *id011
      - *id012
      - *id009
      - *id008
      - *id020

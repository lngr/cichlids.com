      decision: 3
      rationale: "The generator, checker-a and checker-b proposed 3; checker-c proposed 4. Retain the median\
        \ of 3 for a one-male harem in the specified tank. The Nordic association reports strong male rivalry,\
        \ and Malawi Mayhem describes damaging courtship pressure with inadequate female numbers. This supports\

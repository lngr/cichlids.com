  note: "The abbreviated legacy label is retained as Pseudotropheus sp. 'Ndumbi', with no described species\
    \ or author assigned. The Catalog of Fishes recognizes Pseudotropheus perspicax (Trewavas, 1935) from\
    \ Deep Bay, but does not connect it taxonomically with this label. CRC and the Nordic association treat\
    \ Red Top Ndumbi as the undescribed Pseudotropheus sp. 'perspicax orange cap'; that is the best-supported\
    \ husbandry reference here, not a verified identification of every legacy fish. Ndumbi Gold and Elongatus\
    \ Ndumbi are distinct possible trade identities and are not established synonyms or variants of this entry.\
    \ The CRC orange-cap public page was readable; the attempted Ndumbi Gold page provided no usable feeding\
    \ classification, and a later run recorded an access barrier. The taxonomy source is read together with\
    \ the specialist sources retained in origin and overview."

  temperatureC:
    value:
      min: 21
      max: 29
    confidence: high
    rationale: "Retain the tally's lake-malawi habitat synthesis of 21 to 29 C, high confidence and waterbody\
      \ verification. Eccles reports a seasonal inshore minimum of 21 C and an upper layer near 27 C; Vollmer\
      \ describes seasonal upper-water variation, while FAO compiles an older 23 to 25 C surface interval.\
      \ These are regional and seasonal measurements, not proof that Ndumbi Reef spans both endpoints every\
      \ year. Inherited evidence attributing the entire synthesis to one study remains qualified as a synthesis.\
      \ No exceptional habitat changes or plausibility replacement are needed."

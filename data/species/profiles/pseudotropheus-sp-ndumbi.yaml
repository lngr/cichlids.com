      - *id023
      - *id013
      - *id027
  sizeAndGrowth:
    text: "For planning, allow approximately 10 cm for an adult aquarium male and 7 cm for a female of the\
      \ orange-cap candidate. Sources differ, including smaller aquarium figures and retail estimates reaching\
      \ roughly 15 cm without separating sexes. Ndumbi Gold's reported 12 cm males and 10 cm females concern\
      \ a different possible identity. Captive growth can exceed wild size when food is abundant, so small\
      \ wild measurements do not set aquarium maxima. Longevity is provisionally estimated at 8 to 10 years\
      \ from hobby care accounts; measured long-term survival data were not found."
    sources:

      - *id036
  breeding:
    text: "The female carries the eggs and early brood in her mouth. A receptive female visits a male near\
      \ a cave, rock gap or sand pit, and the male's attention can become difficult for other females to escape.\
      \ Reports differ in incubation time and brood size, so no single count or schedule is assumed here.\
      \ Give a holding female protected retreats and stable water quality. Young can shelter among narrow\
      \ rock gaps after release. Record the parents' exact trade and locality labels when breeding, because\
      \ a brood from an unresolved Ndumbi stock does not settle its taxonomic identity."
    sources:
      - *id015
      - *id016
      - *id025
      - *id064
      - *id003
      - *id004
      - *id005
      - *id006
      - *id053
      - *id008
  sexing:
    text: "Adult orange-cap males are usually blue to violet-blue with orange or red on the forehead and dorsal\
      \ region; females are smaller and less colorful, generally brown or gray. Some females show bars, while\
      \ the dominant male pattern combines the body color and cap. Juveniles and stressed fish may not show\
      \ reliable adult colors. Golden females described in Ndumbi Gold accounts belong to a different possible\
      \ identity and are not used as a sexing rule for the orange-cap candidate. Color should be considered\
      \ together with adult size, fin development and breeding behavior."
    sources:
      - *id015
      - *id016
      - *id025
      - *id006
      - *id005
  compatibility:
    text: "A single-species aquarium is an option, but it is not an exclusive requirement. In a larger tank,\
      \ robust Malawi mbuna with similar feeding needs can be considered if each has cover and feeding access.\
      \ The minimum tank specified for the one-male harem does not authorize adding a full mbuna community.\
      \ Calm fish and partners needing regular rich animal food are poor matches for the decided aggression\
      \ and diet. Predation level 0 indicates no established fish-eating specialization, while incidental\
      \ loss of small fry remains possible. No named hybrid group is assigned because no reviewed source establishes\
      \ one for this label; this does not guarantee that closely similar fish cannot cross."
    sources:
      - *id015
      - *id052
      - *id061
      - *id049
      - *id025
      - *id018
      - *id017
      - *id053
      - *id005
      - *id009
      - *id004
      - *id062
  problems:
    text: "The main practical concerns are persistent chasing, females denied shelter, digestive problems\
      \ after unsuitable feeding, and mistakes caused by the shortened trade name. A fish hiding continuously,\
      \ losing condition or missing meals needs prompt attention to its social and environmental conditions.\
      \ Maintain regular water changes and check water quality when behavior changes. The GH and KH tolerance\
      \ limits are inferred largely from group husbandry advice rather than experiments on a confirmed Ndumbi\
      \ taxon. Confirm the supplier's locality and full label when possible, because a peaceful account of\
      \ Ndumbi Gold may not describe a Red Top Ndumbi aquarium. Keep different identities distinct in breeding\
      \ records."
    sources:

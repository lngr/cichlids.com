      \ Point, Ndumbi Rocks and Pombo Rocks, checker-b limited the entry to Ndumbi Reef and Ndumbi Rocks,\
      \ and checker-c included Ndumbi Reef and Pombo Rocks. Retain the Ndumbi reef locality without asserting\
      \ that every abbreviated legacy fish belongs to the wider orange-cap distribution. CRC locates orange\
      \ cap at Ndumbi Point; the Nordic register also lists Pombo Rocks for that candidate. The Gold evidence\
      \ concerns a distinct possible identity with a different distribution."

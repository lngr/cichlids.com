      - *id063
  husbandry:
    text: "Use at least 300 L with a footprint around 120 by 45 cm for one adult male and three females. The\
      \ depth is a practical layout allowance rather than a published physiological threshold. Arrange secure\
      \ rocks to create several retreats and interrupt sightlines, with sand available beside and beneath\
      \ the rockwork. Prevent digging from undermining the rocks. Provide effective filtration, water movement\
      \ and surface aeration. Routine care accounts usually recommend temperatures around 24 to 28 C. The\
      \ broader recorded tolerances are provisional keeping envelopes, not targets for abrupt adjustments.\
      \ Mixed mbuna stocking needs additional space; one specialist recommends at least 450 L and 150 cm for\
      \ such a community."
    sources:
      - *id015
      - *id016
      - *id025
      - *id064
      - *id024
      - *id018
      - *id017
      - *id053
      - *id005
      - *id006
      - *id009
      - *id045
      - *id031
  socialBehavior:
    text: "Plan around one male and three females in the minimum aquarium. Mature males can repeatedly pursue\
      \ females and rivals, especially when cover or the sex ratio is inadequate. Reports of little sustained\
      \ territorial defense in the lake do not guarantee calm behavior in a tank. The primary defended site\
      \ is treated here as a small breeding area, consistent with accounts of briefly occupied caves and spawning\
      \ pits. Females need separate places to withdraw, and a fish that stays hidden or cannot feed indicates\
      \ a failing social arrangement. Multiple males belong only in a larger, carefully structured setup with\
      \ enough females and a way to separate fish."
    sources:
      - *id015
      - *id052
      - *id025
      - *id018
      - *id017
      - *id005
      - *id048
      - *id006
      - *id008
      - *id009
      - *id003
      - *id053
  diet:
    text: "Use a plant-rich mbuna staple, such as spirulina flakes or plant-based pellets, with suitable vegetable\
      \ supplements. Orange-cap sources describe collecting algae and small material from biofilm, and the\
      \ decided diet category is aufwuchs. A few sources call the fish omnivorous or describe occasional small\
      \ animal foods; this does not support a rich predator diet. Specialist husbandry accounts associate\
      \ unsuitable animal-heavy feeding with severe digestive trouble, supporting the bloat-sensitivity flag.\
      \ That warning does not mean that every protein ingredient is harmful. Portions should be controlled\
      \ because this fish feeds eagerly and dominant individuals can monopolize food."

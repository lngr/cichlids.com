    value:
      continent: Central America
      region: "Upper Grijalva basin on the Atlantic slope of Chiapas, Mexico, and northwestern Guatemala"
      waterbody: null
      localities:
      - Rio Grande de Chiapa between Tuxtla Gutierrez and Chiapa de Corzo
      - La Angostura reservoir
      - Lagos de Colon
      - Rio Santo Domingo
      - Rio Lagartero
    confidence: high
    rationale: "The Catalog of Fishes establishes the Grijalva drainage and includes northwestern Guatemala; the\
      \ Mexican-only FishBase account is narrower. The jaw and parasite studies directly support La Angostura and\
      \ Lagos de Colon, while Hohl supplies Santo Domingo and Lagartero. The proposals differ mostly in locality\
      \ lists and wording. Checker-a also includes Malpaso, but the cited parasite study sampled La Angostura and\
      \ Lagos de Colon, so Malpaso is not retained as a verified locality here. Hutchins incorrectly calls this\
      \ Pacific drainage, and CRC uses broader Grijalva-Usumacinta context; neither expands the established species\
      \ range."

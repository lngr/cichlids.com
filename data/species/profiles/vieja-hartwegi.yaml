  coloration:
    value:
      baseColors:
      - silver
      - yellow
      - red
      - black
      pattern: mixed
    confidence: medium
    rationale: "Generator and checker-c choose silver, yellow, red and black with mixed pattern; checker-b uses\
      \ yellow, brown, red and black with mixed pattern; checker-a chooses silver and grey with stripes. The adult-male\
      \ descriptions in AquaInfo and Hohl support a reflective yellowish ground, red flecking and variable dark\
      \ bands or blotches. Silver represents the metallic appearance; brownish or grey states remain possible. A\
      \ simple stripe is incomplete for adults, and the redescription abstract emphasizes substantial variation."

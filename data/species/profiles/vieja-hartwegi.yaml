  compatibility:
    text: "Mixed keeping is possible with suitable robust fish and sufficient room, but breeding can change the\
      \ outcome. The pair minimum does not describe the space needed for a mixed community. Small, timid or slow-feeding\
      \ companions face problems from territorial chasing, feeding competition and occasional predation. Other Vieja\
      \ carry presumed crossing risk based on general specialist warnings. A hybrid gallery also labels offspring\
      \ involving Vieja bifasciata and Nandopsis tetracanthus, without verified pedigree or mate-choice information.\
      \ NVC reports a named aquarium cross with Chiapaheros grammodes; putative wild hybrids of that pair remain\
      \ disputed. These four group memberships describe presumed risks, not verified free-choice crosses for every\
      \ pairing. Named tankmate suggestions remain conditional candidates rather than tested guarantees."
    sources:
    - kind: database

  note: "The Catalog of Fishes accepts Vieja hartwegi. Vieja is both the legacy and current genus; a Cichlasoma\
    \ query also checks the original combination. Cichlasoma and Paraneetroplus are catalogued older placements,\
    \ while AquaInfo and keeper literature also record Paratheraps and Theraps. The 2018 rheophilic form is treated\
    \ cautiously because Rican and Morgenstern, as summarized by NVC, suggest hybrid parentage. Only the redescription\
    \ abstract was readable; neither that dispute nor an unavailable manuscript establishes a verified aquarium\
    \ variant. Older FishBase subfamily usage does not change the catalogued valid name."

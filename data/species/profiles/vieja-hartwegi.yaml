  sexing:
    text: "Mature males generally grow larger and may develop a fuller forehead and more conspicuous red markings.\
      \ Females can show a darker throat and underside, especially during breeding. These clues vary with age, mood\
      \ and population and are weak guides for juveniles. Experienced examination of the genital papilla is more\
      \ useful when fish are in breeding condition. Sex identification and behavioral compatibility are separate\
      \ questions; continue observing a proposed pair after sexing."

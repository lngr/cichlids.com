    rationale: "Component medians are 500 L, 200 cm length and 50 cm depth: generator 500/200/50, checker-a 540/180/60,\
      \ checker-b 500/200/50 and checker-c 500/200/50. AquaInfo directly specifies 200 by 50 by 50 cm, approximately\
      \ 500 L gross, supporting an established adult pair. Other published suggestions include 450 L from Einrichtungsbeispiele,\
      \ 200 L from Aqua-Fish, 250 L from Bestfish24 and about 284 L in a keeper account. The Nordic association\
      \ gives the wider recommendation of 700 L with the same 200 cm length. Retain that alternative without making\
      \ it an automatic minimum for a pair, because the direct 500 L specialist footprint already allows retreats.\
      \ Mixed communities, extra adults and incompatible pairs need different or larger housing. Assumed dimensions\
      \ in inherited evidence are explicitly marked as inferred."

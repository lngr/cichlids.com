  ph:
    value:
      min: 7
      max: 8.4
    confidence: low
    rationale: "The settled median is pH 7 to 8.4 with low confidence. Miller gives 7 to 8 in native streams, while\
      \ INAPESCA supplies reservoir surface readings of 7.9 to 8.4 and CESACH a 7.7 point. The wider highland comparison\
      \ in the Tlaloc study is 7.4 to 8.5, and Hutchins describes a general regional interval of 7.5 to 8.5 without\
      \ a field protocol. Those 8.5 endpoints are retained but do not outweigh the more directly relevant stream\
      \ and occupied-reservoir measurements. FishBase publishes only 7.5 with its other endpoint unknown. The inherited\
      \ checker-a evidence encoded 7.5 to 9; 9 is not a reported FishBase measurement and is retained only as a\
      \ flagged input interpretation. Proposals were generator 7 to 8.4; checker-a 7.5 to 8.5; checker-b 7 to 8;\
      \ checker-c 7 to 8.4; tiebreaker-1 7 to 8; tiebreaker-2 7 to 8.4."

      \ cm aquarium, so persistent harassment with space-dependent injury risk fits level 3 more closely than treating\
      \ undersized-tank deaths as the normal outcome of that social unit. Milder AquaInfo and Aqua-Fish descriptions\
      \ and the archive spawning report do not guarantee partner safety."

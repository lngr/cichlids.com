  breeding:
    text: "Pairs clean an exposed hard surface and deposit eggs there. Aquarium observations include horizontal\
      \ stones and upright stone faces, with both parents involved in guarding and care. Digging can expose spawning\
      \ surfaces or prepare places for larvae. Provide escape routes for either adult throughout the breeding cycle,\
      \ because successful spawning does not ensure continued compatibility. Free-swimming fry accept suitably small\
      \ foods such as newly hatched Artemia. Monitor the parents after brood loss. The community archive records\
      \ a pair spawning in about 284 L, but a spawning event alone does not establish adequate lifelong housing."

  socialBehavior:
    text: "The recommended social unit is a compatible pair. Other adults can become rivals, and a male and female\
      \ selected by sex alone may reject each other. Even a long-settled pair can become dangerous when reproductive\
      \ readiness changes or a brood disappears. Persistent exclusion from food or open swimming space is a useful\
      \ early warning. Direct aquarium accounts include fatal attacks, particularly in small tanks, alongside reports\
      \ of much calmer pairs. Extra females are not a reliable substitute for space and escape routes. Separate\
      \ fish when harassment persists instead of waiting for obvious external wounds."

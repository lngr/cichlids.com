    rationale: "Tally method: conservative. Retain the conservative union of four groups and low confidence because\
      \ no complete group set obtains a qualified majority. The genus-level vieja warning rests on specialist congener\
      \ cautions and relatedness, not proof that every species pair has crossed. Binns labels captive offspring\
      \ and backcrosses involving Vieja bifasciata, and a separate gallery labels a Nandopsis tetracanthus cross;\
      \ neither supplies verified parentage or conspecific mate availability. NVC reports Peter Buchhauser's 1999\
      \ aquarium cross with Chiapaheros grammodes and summarizes Rican and Morgenstern's alternative interpretation\
      \ of the 2018 rheophilic fish as wild hybrids. The redescription abstract instead treats those fish as a morph;\
      \ its full text and the original hybrid report were unavailable. DCG provides a bibliographic record, not\
      \ the original breeding observations. All four groups therefore have presumed basis; relatedness and crosses\
      \ are not extended transitively. Checker-a's empty proposal also conflicts with three existing memberships\
      \ in the registry. Proposals were generator [\"vieja\", \"nandopsis-tetracanthus-vieja-hartwegi\", \"vieja-bifasciata-hartwegi\"\
      , \"chiapaheros-grammodes-vieja-hartwegi\"]; checker-a []; checker-b [\"vieja-bifasciata-hartwegi\"]; checker-c\
      \ [\"vieja\", \"vieja-bifasciata-hartwegi\", \"nandopsis-tetracanthus-vieja-hartwegi\"]; tiebreaker-1 [\"\
      vieja\", \"vieja-bifasciata-hartwegi\", \"nandopsis-tetracanthus-vieja-hartwegi\", \"chiapaheros-grammodes-vieja-hartwegi\"\
      ]; tiebreaker-2 [\"vieja\", \"nandopsis-tetracanthus-vieja-hartwegi\", \"vieja-bifasciata-hartwegi\", \"chiapaheros-grammodes-vieja-hartwegi\"\

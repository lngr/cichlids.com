  temperatureC:
    value:
      min: 20
      max: 30
    confidence: low
    rationale: "The settled median is 20 to 30 C, with low confidence because the six votes do not form a qualified\
      \ majority. Miller gives native stream readings of 20 to 29 C and Hohl adds a shared Angostura collecting\
      \ site at 30 C. The wider regional envelope proposed by generator and tiebreaker-2 is 20 to 32 C: INAPESCA\
      \ measured reservoir surface water at 25 to 32 C. That wider source range remains evidence, but a seasonal\
      \ surface maximum is less specific to occupied fish microhabitats than the collecting records. This median\
      \ describes typical native conditions rather than removing the warmer observation from the record. Proposals\
      \ were generator 20 to 32; checker-a 25 to 30; checker-b 20 to 30; checker-c 20 to 30; tiebreaker-1 20 to\
      \ 30; tiebreaker-2 20 to 32."

  diet:
    text: "Use an omnivorous ration with a substantial plant component. Suitable staple pellets can be varied with\
      \ algae-based foods, vegetables and modest portions of aquatic invertebrates. Natural food records include\
      \ detritus, plants and small animals, while CRC emphasizes the plant and detritus component. This supports\
      \ plant-biased omnivory. Occasional predation on fry or very small fish is plausible; regular fish eating\
      \ is not established. Eager feeding makes portion control and access for both partners important. No special\
      \ species-specific bloat predisposition has been demonstrated, but the false compatibility flag does not protect\
      \ against overfeeding or an unbalanced ration."

    tolerance:
      value:
        min: 6.8
        max: 8.5
      confidence: medium
      rationale: "Retain the tally qualified-majority decision of pH 6.8 to 8.5 with medium confidence. Repeated\
        \ aquarium recommendations are 7 to 8; a species-specific keeper reports 6.8 to 7.3, and Hutchins describes\
        \ satisfactory keeping under broadly stated conditions extending to 8.5, with an actual setup near 7.5.\
        \ These sources support a broader working envelope than the care-sheet interval, but neither endpoint is\
        \ a controlled multiyear physiological limit. The range contains the decided natural pH 7 to 8.4. Proposals\
        \ were generator 6.8 to 8.5; checker-a 7 to 8.5; checker-b 7 to 8; checker-c 6.8 to 8.4; tiebreaker-1 7\
        \ to 8.5; tiebreaker-2 6.8 to 8.4."

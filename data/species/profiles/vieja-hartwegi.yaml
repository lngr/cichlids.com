  problems:
    text: "Sudden pair aggression is a central management risk. Limited space, blocked escape routes and mismatched\
      \ reproductive readiness can lead to severe damage even after apparent harmony. Plants may be eaten or uprooted,\
      \ and uneaten food or vegetation can collect behind decor. Persistent hiding, breathing changes, appetite\
      \ loss or declining condition call for checks of water quality and social pressure. Keep new arrivals separate\
      \ initially and investigate visible injuries promptly. Parasites have been recorded in wild populations, but\
      \ that finding does not diagnose an individual aquarium fish or justify routine medication. Uncertain identities\
      \ and undocumented crosses also complicate breeding projects."
    sources:
    - kind: literature
      title: "Hohl, D. (2023). Das Leben in meinen Aquarien (35), Vieja hartwegi. Rossmassler-Vivarium Rundbrief\
        \ 32(3), pages 6-10; field values also on page 11"

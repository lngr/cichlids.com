  habitat:
    text: "The accepted range belongs to the Atlantic drainage of the upper Grijalva, including La Angostura and\
      \ tributaries reaching northwestern Guatemala. Species accounts describe rocky channels and streams with sand,\
      \ branch cover and moderate or strong flow; young fish gather in quieter margins. Clear water is common, but\
      \ turbid habitats also occur. Native stream observations span 20 to 29 C and pH 7 to 8. Reservoir monitoring\
      \ reaches 32 C at the surface and pH 8.4; the typical planning temperature stops at 30 C. Historical collecting\
      \ records give GH 10 to 33 dGH and KH 12 to 18 dKH. Modern reservoir work reports lower hardness, including\
      \ about 5.8 to 10 dGH and a separate point near 4.5 dGH, with an alkalinity point near 7.8 dKH. The decided\
      \ natural ranges retain uncertainty across locality, season and sampling method. They do not mean that the\
      \ species requires the hardest recorded water. Downstream surveys and highland streams remain comparisons\
      \ rather than direct measurements beside captured hartwegi."

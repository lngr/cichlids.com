  aggressionConspecific:
    value: 3
    confidence: medium
    rationale: "Generator, checker-a and checker-c propose 3; checker-b proposes 4. Hohl describes fatal rival and\
      \ mate attacks in 90 cm aquaria, and a keeper also warns of dangerous courtship. These observations remain\
      \ evidence and require a separation option. The rubric assumes an established pair in the recommended 200\
      \ cm aquarium, so persistent harassment with space-dependent injury risk fits level 3 more closely than treating\
      \ undersized-tank deaths as the normal outcome of that social unit. Milder AquaInfo and Aqua-Fish descriptions\
      \ and the archive spawning report do not guarantee partner safety."

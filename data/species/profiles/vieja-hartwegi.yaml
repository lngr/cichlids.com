  ghDgh:
    value:
      min: 6
      max: 33
    confidence: low
    rationale: "Retain the settled median of 6 to 33 dGH at low confidence; the vote does not settle the competing\
      \ habitat interpretations. INAPESCA measured total hardness by EDTA titration at 104 to 179 mg/L, interpreted\
      \ as CaCO3 equivalents, giving 5.83 to 10.03 dGH after division by 17.848. Hohl reports a historical collecting\
      \ range of 10 to 33 dGH and an Angostura point of 10 dGH, so the high endpoint is not rejected merely because\
      \ it seems hard for a river fish. The wider combined source envelope is about 4.5 to 33 dGH when the CESACH\
      \ reservoir point of 80 mg/L is included. That lower point and the 5.8 to 33 generator and tiebreaker-2 envelopes\
      \ remain evidence; the decided minimum of 6 reflects the rounded vote median, not a demonstrated absence below\
      \ it. The highland study gives 9.8 to 16.9 dGH in different stream settings, and CAYMO uses ambiguous hardness\
      \ wording. FishBase supplies 33 with an unknown second endpoint, not a requirement of at least 33 dGH. Proposals\
      \ were generator 5.8 to 33; checker-a 6 to 10; checker-b 10 to 33; checker-c 4 to 12; tiebreaker-1 10 to 33;\
      \ tiebreaker-2 5.8 to 33."

  khDkh:
    value:
      min: 12
      max: 18
    confidence: low
    rationale: "The settled median natural estimate is 12 to 18 dKH with low confidence. Hohl explicitly separates\
      \ native carbonate hardness of 12 to 18 from total hardness of 10 to 33 dGH and adds a shared Angostura collecting\
      \ point at 12 dKH. Alkali bicarbonates can contribute alkalinity without matching calcium and magnesium hardness,\
      \ so KH above GH is not intrinsically impossible. The wider set of reported localities includes the CESACH\
      \ alkalinity point of 140 mg/L, about 7.8 dKH, and the downstream CAYMO comparison of 130 to 148 ppm, about\
      \ 7.3 to 8.3 dKH. Both lower records remain evidence; the median favors the traceable species collecting compilation\
      \ over extrapolating a single reservoir point or a downstream proxy into a species range. The inherited INAPESCA\
      \ entry at 5.8 to 10 is total hardness used as a proxy, not measured KH. The highland comparison of 10.5 to\
      \ 17 dKH is another habitat type. This estimate does not establish a need to raise aquarium KH to 12. Natural\
      \ KH deliberately carries no verification object. Proposals were generator 12 to 18; checker-a 5 to 10; checker-b\
      \ 12 to 18; checker-c 7 to 9; tiebreaker-1 12 to 18; tiebreaker-2 12 to 18."
    sources:
    - kind: literature
      title: "Hohl, D. (2023). Das Leben in meinen Aquarien (35), Vieja hartwegi. Rossmassler-Vivarium Rundbrief\

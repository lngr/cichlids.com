  hybridGroups:
    value:
    - chiapaheros-grammodes-vieja-hartwegi
    - nandopsis-tetracanthus-vieja-hartwegi
    - vieja
    - vieja-bifasciata-hartwegi
    confidence: low
    rationale: "Retain the conservative union of four groups and low confidence because no complete group set obtains\
      \ a qualified majority. The genus-level vieja warning rests on specialist congener cautions and relatedness,\
      \ not proof that every species pair has crossed. Binns labels captive offspring and backcrosses involving\
      \ Vieja bifasciata, and a separate gallery labels a Nandopsis tetracanthus cross; neither supplies verified\
      \ parentage or conspecific mate availability. NVC reports Peter Buchhauser's 1999 aquarium cross with Chiapaheros\
      \ grammodes and summarizes Rican and Morgenstern's alternative interpretation of the 2018 rheophilic fish\
      \ as wild hybrids. The redescription abstract instead treats those fish as a morph; its full text and the\
      \ original hybrid report were unavailable. DCG provides a bibliographic record, not the original breeding\
      \ observations. All four groups therefore have presumed basis; relatedness and crosses are not extended transitively.\

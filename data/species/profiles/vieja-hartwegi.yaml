  husbandry:
    text: "An established adult pair needs approximately 500 L gross with a 200 by 50 cm footprint; additional companions\
      \ require more room. Arrange stable stones and wood to break sight lines and provide separate retreats, leaving\
      \ sand available for digging. Anchor heavy structures securely so excavation cannot undermine them. Provide\
      \ effective biological filtration, oxygenation and regular water changes adjusted to the waste load. A routine\
      \ temperature around 24 to 27 C lies within repeated keeping recommendations. The working tolerances are 20\
      \ to 30 C, pH 6.8 to 8.5, GH 5 to 33 dGH and KH 4 to 20 dKH; their endpoints have uneven support and are not\
      \ equally desirable permanent targets. Measure GH and KH independently and favor stable conditions. Keep a\
      \ divider or separate aquarium available before introducing a prospective partner."

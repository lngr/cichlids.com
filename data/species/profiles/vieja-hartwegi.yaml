    tolerance:
      value:
        min: 5
        max: 33
      confidence: low
      rationale: "Retain the settled median of 5 to 33 dGH with low confidence, rather than intersecting the narrower\
        \ care recommendations. AquaInfo and Einrichtungsbeispiele give 10 to 30 dGH, Aqua-Fish 12 to 21, Guidarium\
        \ 8 to 15, and Bestfish24 10 to 33. Hutchins reports successful keeping around 200 ppm hardness, approximately\
        \ 11.2 dGH if expressed as CaCO3, though he does not explicitly identify the hardness type. The lower endpoint\
        \ is inferred from reservoir measurements and widened below the decided natural minimum of 6; neither 5\
        \ nor 33 is an experimentally established failure boundary. The wider field-to-husbandry synthesis would\
        \ reach the CESACH 4.5 dGH point, below this decision; it remains visible as dissenting evidence and does\
        \ not establish a lower constant aquarium limit by itself. Proposals were generator 5.8 to 33; checker-a\
        \ 5 to 18; checker-b 10 to 33; checker-c 4 to 30; tiebreaker-1 10 to 33; tiebreaker-2 5 to 33."

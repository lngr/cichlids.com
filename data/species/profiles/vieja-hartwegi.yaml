  sizeAndGrowth:
    text: "Allow for a typical well-kept male of about 25 cm and a female of about 20 cm. Published larger estimates\
      \ reach roughly 30 cm or more, so individual variation still matters. Wild sample lengths and standard-length\
      \ measurements cannot be substituted directly for aquarium planning sizes. Young fish may outgrow temporary\
      \ accommodation quickly. A provisional lifespan estimate is eight to ten years, with little reliable species-specific\
      \ longevity evidence. Plan permanent housing early and follow body condition rather than trying to force growth\
      \ through heavy feeding."

partners:
  suitable:
  - species: Hypsophrys nicaraguensis
    reason: A conditional candidate of substantial adult size with broadly overlapping routine keeping needs.
    condition: "Inferred candidate, not a verified species-pair trial; a tank larger than the 500 L pair minimum,\
      \ separate territories, similar adult sizes and a separation option are required."
  - species: Rocio octofasciata
    reason: A robust adult cichlid may use separate shelters in a sufficiently spacious layout.
    condition: "Inferred candidate only; match actual water tolerances, provide more space than for the pair alone\
      \ and reassess immediately if either fish is excluded."
  - species: Pterygoplichthys gibbiceps
    reason: "A large armored catfish has a different feeding role, though its own adult space needs are considerable."
    condition: "Inferred candidate only; substantially more than 500 L, independent feeding and refuges, and observation\
      \ during breeding are needed."
  unsuitable:
  - species: Paracheirodon innesi
    reason: "Its small size and timid behavior expose it to territorial attacks, feeding competition and opportunistic\
      \ predation."
  - species: Vieja bifasciata
    reason: Similar territorial behavior and a presumed crossing risk supported by labelled captive offspring.
  - species: Nandopsis tetracanthus
    reason: A labelled captive cross gives a presumed hybrid risk alongside substantial territorial demands.
  - species: Chiapaheros grammodes
    reason: A reported aquarium cross and disputed wild hybrid interpretation give a presumed lineage risk.
  - species: Symphysodon aequifasciatus
    reason: Deliberate feeding and sensitivity to territorial pressure make this an unsuitable companion.
profile:
  overview:
    text: "Vieja hartwegi, the tailbar cichlid, is a large upper Grijalva species from southern Mexico and adjacent\
      \ Guatemala. An adult male can combine metallic yellowish color, red flecking and dark markings that change\
      \ with mood. Its appeal includes active foraging, excavation and shared brood care. Keeping an established\
      \ pair requires considerable space and attention to changing aggression. Several historical genus names still\
      \ appear in aquarium accounts. Identity and collection history matter when selecting breeding stock because\
      \ congener crosses and other putative hybrids have been reported."
    sources:
    - kind: catalog-of-fishes
      title: "Eschmeyer's Catalog of Fishes: species of Vieja, updated 21 September 2026"
      url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Vieja"
      archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-2ce1eaf7/2026-10-14T094904Z
      accessed: '2026-10-15'
    - kind: database
      title: "FishBase, Vieja hartwegi summary"

    rationale: "Tally method conservative. The conservative tally intersects all six proposals and retains\
      \ 15 to 20 dKH with low confidence. Generator, checker-b and tiebreaker-1 proposed 15 to 20; checker-a\
      \ and tiebreaker-2 proposed 10 to 20; checker-c proposed 12 to 20. Fischlexikon and Aquaristik-Profi\
      \ directly recommend 15 to 20. The wider 12 to 20 in the gold-form trade compilation and OATA's generic\
      \ 10 to 15, plus aquarium readings at 10 and 14, remain dissenting evidence. Monitarium gives 8 to 12\

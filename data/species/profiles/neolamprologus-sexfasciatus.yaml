  breeding:
    text: "Eggs are placed within a rock cavity, sometimes after the fish dig beneath a stone. Both parents\
      \ participate in defense, with the female initially close to the clutch and the male guarding a wider\
      \ area. Small live foods such as newly hatched brine shrimp support free-swimming fry. Accounts disagree\
      \ about clutch size and the length of parental care, so those figures are not fixed here. Retreats and\
      \ the ability to separate adults remain necessary throughout the breeding cycle."

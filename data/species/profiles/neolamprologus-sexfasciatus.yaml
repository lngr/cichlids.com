  habitat:
    text: "Rocky shoreline and the adjoining transition between stones and sand provide shelter and feeding\
      \ sites. The type series came from the M'Toto rocky islets; the distribution occupies the southern lake,\
      \ including Tanzanian, Congolese and Zambian localities. The natural lake ranges used here are 23 to\
      \ 29 C, pH 8.4 to 9.4, 10 to 13 dGH and 15 to 20 dKH. Lake alkalinity exceeds total hardness because\
      \ ions other than calcium and magnesium help balance the dissolved carbonates."

  socialBehavior:
    text: "Keep only one adult pair in the recommended setup. Allowing juveniles to choose partners is more\
      \ reliable than combining two unrelated adults, but surplus fish need to leave once a pair forms. A bond\
      \ may weaken between breeding attempts and the male can seriously injure the female. Territorial behavior\
      \ persists outside spawning and can intensify enough during brood care to occupy much of the available\
      \ rockwork."

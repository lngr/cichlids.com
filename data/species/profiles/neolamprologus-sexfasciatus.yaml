  minTank:
    value:
      volumeL: 350
      lengthCm: 135
      depthCm: 46
    confidence: medium
    rationale: "For one self-selected adult pair, generator proposed 473 L at 183 x 46 cm, checker-a 200 L\
      \ at 120 x 40 cm, checker-b 400 L at 150 x 50 cm, and checker-c 300 L at 120 x 45 cm. The component medians\
      \ are 350 L, 135 cm length and 45.5 cm depth; depth is rounded to 46 cm. The 350 L decision lies between\
      \ Tanganyika.si's explicit 300 L pair recommendation and the Nordic register's 400 L figure. Seriously\
      \ Fish gives 110 L at 120 x 30 cm as barely adequate, aqua-fish gives 200 L, and the generator attached\
      \ 473 L at 183 x 46 cm to Atlas. The archived Atlas text supplies no 473 L or 183 x 46 cm figure, so\
      \ that inherited proposal is not independent source support. Nordic prose asks for 200 cm despite its\
      \ 120 cm summary, so its conflicting lengths are retained. The footprint is an adjudicated layout allowance\
      \ for separate caves and female retreats, not a published measured threshold. The decision stays within\
      \ the range of read recommendations and applies to a pair without additional community fish."

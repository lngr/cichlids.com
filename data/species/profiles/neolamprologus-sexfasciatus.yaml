  temperatureC:
    value:
      min: 23
      max: 29
    confidence: high
    rationale: The waterbody tally fixes 23 to 29 C with high confidence. Verburg et al. measured 23.85 to
      29.01 C at 1 m in southern Lake Tanganyika; the adopted whole-degree lake envelope includes seasonal
      cooling and warming. The observed upper 29.01 C is slightly above the rounded 29 C boundary. Aquarium
      recommendations of 23 to 26 C and 23 to 27 C remain evidence of husbandry guidance rather than natural
      limits.

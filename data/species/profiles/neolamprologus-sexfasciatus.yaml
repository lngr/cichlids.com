  sexing:
    text: "Males tend to become larger than females, but appearance alone gives limited certainty before adulthood.\
      \ Locality color and the flank bars occur in both sexes and do not establish a compatible pair. The adopted\
      \ female size is a planning estimate within a retailer's 12 to 13 cm account. Self-selected pairing provides\
      \ behavioral information but does not guarantee a lasting bond."

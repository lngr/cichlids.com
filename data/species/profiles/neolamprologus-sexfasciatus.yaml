      \ piscivore; generator and checker-c proposed invertivore. Seriously Fish explicitly identifies natural\
      \ piscivory, while CRC lists both insects and fish without proportions. Tanganyika.si, Cichlid Atlas,\
      \ Fischlexikon and Dubosc's yellow-form aquarium account support invertebrate feeding and possible population\
      \ differences. FishBase confirms carnivory but does not resolve which prey dominates; the morphological\
      \ review and Ronco study do not provide the missing species-wide diet proportions. The unread Boileau\
      \ full text reported in prior research is not evidence. False bloat sensitivity is an inference from\
      \ animal-food husbandry, supported by Acquariofilia Facile's general account, rather than a protein challenge\
      \ experiment. The tally's food list is retained exactly."

  compatibility:
    text: "Other species are possible only with additional space and carefully separated territories. Seriously\
      \ Fish identifies medium-sized Cyprichromis and larger Julidochromis or Altolamprologus as possible choices,\
      \ without guaranteeing peace. Fish approaching or below about 5 cm fall within the size-based prey warning\
      \ for a 15 cm level-3 predator. A species-only pair setup can simplify management even though the speciesOnly\
      \ flag is false. N. tretocephalus shares the existing presumed crossing group because of their close\
      \ relationship; verified hybrid offspring of this named pair have not been established in the cited accounts."

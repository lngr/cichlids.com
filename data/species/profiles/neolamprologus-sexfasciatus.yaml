  ghDgh:
    value:
      min: 10
      max: 13
    confidence: high
    rationale: The waterbody tally fixes 10 to 13 dGH with high confidence. Cohen et al. report north-basin
      calcium and magnesium that calculate to about 12.2 to 12.3 dGH; the historical FAO compilation calculates
      to about 11.4 dGH. The annual-cycle measurements support the lake-scale rounded envelope. Care-sheet
      recommendations reaching 8 to 25 dGH are retained but do not define habitat chemistry.

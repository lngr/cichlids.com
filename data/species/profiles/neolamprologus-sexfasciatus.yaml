  sizeAndGrowth:
    text: "Typical adult planning values are 15 cm for males and 12.5 cm for females, with weaker evidence\
      \ for the female value. Sources mix standard and total length, so their similar headline numbers are\
      \ not identical measurements. Accounts reaching about 16 to 18 cm are retained as larger, usually unsexed\
      \ observations rather than the typical aquarium target. Aquarium lifespan is tentatively 8 to 10 years\
      \ based on general hobby accounts, without a longitudinal study."

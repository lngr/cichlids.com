  husbandry:
    text: "For one self-selected pair, plan around at least 350 L with a footprint of 135 by 46 cm. These dimensions\
      \ are a synthesis of differing recommendations and do not include space for a mixed community. Secure\
      \ the rockwork and provide several cavities with routes between cover so one adult cannot trap the other.\
      \ Keep water stable with efficient filtration and regular maintenance. The recorded tolerance is 23 to\
      \ 29 C, pH 7.5 to 9.4, 8 to 25 dGH and 15 to 20 dKH; ordinary care sources center temperature closer\
      \ to 23 to 27 C. The KH band is a cautious decision rather than a demonstrated lower physiological limit."

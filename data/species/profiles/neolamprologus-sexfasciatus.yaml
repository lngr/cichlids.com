partners:
  suitable:
  - species: Cyprichromis leptosoma
    reason: Open-water schooling fish use a different zone and are specifically noted as a possible match;
      keep only in a large tank with fish too large to swallow.
    condition: "Adults too large to swallow; a mixed community requires substantially more space than the 350\
      \ L pair minimum, with a long open-water zone and retreat routes."
  - species: Altolamprologus compressiceps
    reason: A robust rock-dweller with a different profile may coexist where each fish has separate caves and
      escape routes.
    condition: "Adult fish above prey size; a mixed community requires additional space, separated caves and\
      \ escape routes, with close observation during brood care."
  - species: Julidochromis marlieri
    reason: Larger Julidochromis may work as robust rock-dwelling tankmates when territories are separated.
    condition: "Adult fish above prey size; a mixed community requires additional space, separated caves and\
      \ escape routes, with close observation during brood care."
  unsuitable:
  - species: Neolamprologus tretocephalus
    reason: Both species compete for rocky territories and share a presumed crossing group based on close genetic
      relationship; actual pairwise aquarium crossing remains unverified.
  - species: Neolamprologus multifasciatus
    reason: Small shell-dwellers may be attacked or eaten and cannot withstand the six-bar's predatory behavior.
  - species: Tropheus moorii
    reason: "Its plant-based grazing diet conflicts with the sexfasciatus's carnivorous feeding, and its active\
      \ territorial behavior adds stress."
profile:
  overview:
    text: "The six-bar lamprologus is a southern Lake Tanganyika cichlid with marked variation in ground color\
      \ among localities. Six dark flank bars distinguish it from the similar five-bar N. tretocephalus. Adults\
      \ require deliberate pair management and a structured aquarium because conspecific conflict can be lethal.\
      \ Fish predation is treated as pronounced for compatibility decisions, although accounts disagree about\
      \ how much fish contributes to the diet across populations."
    sources:
    - kind: catalog-of-fishes
      title: "Eschmeyer's Catalog of Fishes, Neolamprologus species list"
      url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Neolamprologus"

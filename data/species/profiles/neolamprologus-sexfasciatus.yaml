  problems:
    text: "Persistent chasing, injury after failed pair formation and predation on small tankmates are the\
      \ main compatibility concerns. Cover needs multiple exits and must not collapse if the fish dig. Animal-rich\
      \ feeding increases the need to control leftovers and maintain filtration. Source recommendations for\
      \ chemistry vary, particularly for KH, and the adopted tolerance endpoints are not evidence of abrupt\
      \ health boundaries. Sudden changes and deteriorating water quality add stress to a species already difficult\
      \ to manage socially."

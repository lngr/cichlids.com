  diet:
    text: "The decided feeding type is piscivore with no established special tendency toward protein-associated\
      \ bloat. Seriously Fish identifies fish feeding in nature; CRC also identifies insects, and other accounts\
      \ emphasize crustaceans, molluscs and occasional fish. Provide varied animal foods and suitable cichlid\
      \ pellets in controlled portions. This feeding classification does not require live feeder fish. Small\
      \ tankmates remain at risk even where a locality form is reported to favor invertebrates."

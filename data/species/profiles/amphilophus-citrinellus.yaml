  breeding:
    value: cave-spawner
    confidence: medium
    rationale: Wild pairs lay their eggs in small caves at the base of rock piles and defend the cave
      mouth; on sandy ground some pairs dig a pit against a buried rock (Barlow 1976). FishBase
      states a preference for cave ceilings, and Seriously Fish and Fishkeeper name a cave, a
      vertical rock face, slate or flat driftwood. The larvae are moved to pits dug in the sand and
      both parents guard them. Aquarium-Ratgeber and the Cichlid Room Companion summary classify it
      as an open-substrate spawner, and in tanks the species accepts almost any hard surface, so the
      boundary to open-substrate spawning is soft.

    confidence: high
    rationale: The Catalog of Fishes places the species on the Atlantic slope of Nicaragua and Costa
      Rica with Lake Nicaragua as type locality; FishBase names the San Juan drainage with lakes
      Nicaragua, Managua and Masaya. Barlow (1976) found it in most lakes of the basin, rarely in
      rivers, and mentions an estuarine population at Tortuguero, Costa Rica. FishBase and some care
      sheets also list Lake Apoyo, but its Midas cichlids are separate endemic species, so it is not
      a locality of A. citrinellus in the narrow sense; the same holds for Lake Xiloá and Lake
      Asososca Managua. The species is not an endemic of a single lake of the waterbody table.

  ph:
    value:
      min: 7.2
      max: 9.3
    confidence: medium
    verification:
      method: qualified-majority
      votes:
        agree: 5
        total: 5
    rationale: "Five votes were cast (generator and checker-a 7.0 to 9.3, checker-b and tiebreaker-2 7.5
      to 9.0, tiebreaker-1 7.2 to 9.3); all agree within 0.3 with the range of tiebreaker-1, a
      qualified majority of five out of five. The decided range is the median of the bounds, 7.2 to
      9.3. Lake Nicaragua is mildly alkaline: 7.2 to 7.7 in a survey of the 1950s, 7.35 to 8.64
      across 19 stations in June 1997, 8.35 in 1970 and 8.48 in a single reading in 2012. Lake
      Masaya measured 8.6 to 8.75. Lake Managua is the most alkaline water of the range, with 9.18
      and 9.26 as seasonal means of 11 stations in 1988 and 9.11 at a bloom site; older surveys
      found 7.6 to 9.3. Photosynthesis drives the high values, so pH swings daily in the shallows. A
      single reading of 9.6 in very shallow water of Lake Nicaragua is treated as an outlier."

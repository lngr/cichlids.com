    rationale: "Five votes were cast: generator and checker-a proposed 24 to 31 °C (Lake Nicaragua 24 °C
      at the bottom and 28 °C at the surface in March, the warm upper layer of Lake Managua of at
      least 31 °C, after Cole 1976), checker-b 26 to 30 °C, tiebreaker-1 25 to 32 °C (Lake Nicaragua
      25.4 to 29.3 °C over a year, Lake Managua profiles of 26.5 to about 32 °C) and tiebreaker-2
      27.5 to 29.8 °C (single November readings in lakes Managua, Nicaragua and Masaya). Only three
      votes agree within 1 °C, so no qualified majority exists, and the decided value is the most
      cautious one: the intersection of all five proposals, 27.5 to 29.8 °C, rounded to 28 to 30 °C.
      This conservative range is the warm core that every measurement covers; the lakes of the
      species span about 24 to 32 °C over depth, season and time of day. FishBase gives 23 to 33 °C
      without measurement details. Readings from lakes Apoyo and Xiloá, where other Midas species
      live, fall within the same band."

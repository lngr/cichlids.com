partners:
  suitable:
    - species: Parachromis managuensis
      reason: A robust Central American cichlid of similar size and temper that can hold its own.
      condition: Only in tanks of about 1000 litres or more with many visual barriers; separate if one
        fish dominates.
    - species: Pterygoplichthys gibbiceps
      reason: A large armoured catfish that uses the bottom at night and is too big to be eaten.
      condition: Very large tank with its own caves; watch for fin damage during breeding.
    - species: Barbonymus schwanenfeldii
      reason: A large, fast schooling barb that stays in open water out of reach of the cichlid.
      condition: Group of five or more in a tank of 1000 litres or more.
    - species: Herichthys carpintis
      reason: Another heavy Central American cichlid with a similar water range and enough robustness.
      condition: Very large tank, all fish added at the same time as juveniles.
  unsuitable:
    - species: Amphilophus labiatus
      reason: Same hybrid group; the two cross readily and many trade fish are already hybrids.
    - species: Amphilophus zaliosus
      reason: Crater-lake member of the same hybrid group; Midas species cross easily with each other.
    - species: Pterophyllum scalare
      reason: Slow, tall and peaceful; it is chased, injured or eaten.
    - species: Paracheirodon innesi
      reason: Small fish that fit easily into the mouth of an adult and are eaten.
    - species: Lake Malawi mbuna
      reason: Too small and too busy; they are attacked and killed, and feeding conflicts arise.
    - species: Symphysodon aequifasciatus
      reason: Needs soft warm water and calm surroundings; a Midas would bully it to death.
profile:
  overview:
    text: "The Midas cichlid is a heavy, deep-bodied cichlid from the great lakes of Nicaragua and the
      San Juan basin. It is famous for its gold morph, a small share of wild fish that turn white,
      yellow, orange or red, and for the large forehead hump of old males. In the hobby it is a pet
      fish with a strong personality: adults recognise their keeper, beg for food and learn
      routines. The same fish is one of the most aggressive cichlids in the trade. It rearranges the
      tank, attacks equipment and can kill its partner or tankmates. Many fish sold under this name
      are crosses with the red devil, Amphilophus labiatus, and the species is also a parent of the
      blood parrot and flowerhorn crosses. Buy from a breeder who knows the origin of the stock if
      you want the pure species."
    sources:
      - kind: database
        title: "Seriously Fish: Amphilophus citrinellus (Midas Cichlid)"
        url: https://www.seriouslyfish.com/species/amphilophus-citrinellus/
        accessed: 2026-10-12
      - kind: literature
        title: "Barlow, G. W. (1976). The Midas cichlid in Nicaragua. In: Thorson, T. B. (ed.),
          Investigations of the Ichthyofauna of Nicaraguan Lakes, University of Nebraska-Lincoln,
          333-358."
        url: https://digitalcommons.unl.edu/ichthynicar/23
        accessed: 2026-10-12
      - kind: database
        title: "Fishkeeper (Maidenhead Aquatics): Midas Cichlid, Amphilophus citrinellus, species profile"
        url: https://www.fishkeeper.co.uk/fish/freshwater/cichlids/midas-cichlid
        accessed: 2026-10-12
  habitat:
    text: "The species lives in Lake Nicaragua, Lake Managua, the crater lake Masaya and the calmer
      reaches of the San Juan drainage in Nicaragua and Costa Rica. It is a lake fish: Barlow found
      it in nearly every lake of the basin but seldom in rivers. The great lakes are shallow, warm
      and turbid, while the crater lakes are deep with steep rocky slopes. Adults stay close to the
      bottom and gather around rock piles, sunken trees and crevices. The water is warm all year,
      mostly in the upper 20s °C. Lake Nicaragua is soft and only lightly buffered, about 3 to 4 dGH
      and dKH, at pH 7 to 9. Lake Managua, a closed basin, is richer in minerals and more alkaline,
      with pH above 9. The Midas cichlids of other crater lakes such as Apoyo and Xiloá are separate
      species."
    sources:
      - kind: literature
        title: "Barlow, G. W. (1976). The Midas cichlid in Nicaragua. In: Thorson, T. B. (ed.),
          Investigations of the Ichthyofauna of Nicaraguan Lakes, University of Nebraska-Lincoln,
          333-358."
        url: https://digitalcommons.unl.edu/ichthynicar/23
        accessed: 2026-10-12
      - kind: literature
        title: "Cole, G. A. (1976). Limnology of the Great Lakes of Nicaragua. In: Thorson, T. B. (ed.),
          Investigations of the Ichthyofauna of Nicaraguan Lakes, University of Nebraska-Lincoln."
        url: https://digitalcommons.unl.edu/ichthynicar/3
        accessed: 2026-10-12
      - kind: literature
        title: "Barlow, G. W., Baylis, J. R. and Roberts, D. (1976). Chemical analyses of some crater lakes
          in relation to adjacent Lake Nicaragua. In: Thorson, T. B. (ed.), Investigations of the
          Ichthyofauna of Nicaraguan Lakes, University of Nebraska-Lincoln, 17-20."
        url: https://digitalcommons.unl.edu/ichthynicar/4
        accessed: 2026-10-12
  sizeAndGrowth:
    text: Well-kept males usually reach about 30 cm total length, sometimes a little more; females stay
      smaller at roughly 20 to 24 cm. Wild fish are often smaller than tank-raised ones. Young fish
      are plain grey with dark bars. Gold morphs change colour at very different ages, often from
      about 5 to 12 cm, passing through a blotchy stage before the final colour sets. Growth is fast
      with good food and large water changes; a fish can reach adult size within two to three years.
      Males develop longer pointed fins and, with age, a large fatty hump on the forehead, which in
      aquarium fish can become permanent. Expect a life span of ten years or more.
    sources:
      - kind: database
        title: "FishBase species summary: Amphilophus citrinellus"
        url: https://www.fishbase.se/summary/Amphilophus-citrinellus.html
        accessed: 2026-10-12
      - kind: database
        title: "Seriously Fish: Amphilophus citrinellus (Midas Cichlid)"
        url: https://www.seriouslyfish.com/species/amphilophus-citrinellus/
        accessed: 2026-10-12
      - kind: database
        title: "Aqua-Fish.net: Midas cichlid, Amphilophus citrinellus"
        url: https://en.aqua-fish.net/fish/midas-cichlid
        accessed: 2026-10-12
  husbandry:
    text: A pair needs a tank of about 180 x 60 x 60 cm (650 litres) or larger. Use a sand or fine
      gravel bottom, since the fish dig constantly, and build caves from heavy stones placed
      directly on the glass bottom so they cannot be undermined. Live plants rarely survive; robust
      driftwood and large stones are better decor. Protect heaters and pipes behind rocks or guards,
      because the fish attack and move equipment. Filtration must be strong, with large weekly water
      changes, as the species eats a lot and produces much waste. A temperature of 24 to 30 °C and
      neutral to moderately alkaline, well buffered water suit it; normal tap water of medium
      hardness works. A heavy, tight lid is essential, and a spare divider should always be at hand.
    sources:
      - kind: database
        title: "Seriously Fish: Amphilophus citrinellus (Midas Cichlid)"
        url: https://www.seriouslyfish.com/species/amphilophus-citrinellus/
        accessed: 2026-10-12
      - kind: database
        title: "Aqua-Fish.net: Midas cichlid, Amphilophus citrinellus"
        url: https://en.aqua-fish.net/fish/midas-cichlid
        accessed: 2026-10-12
  socialBehavior:
    text: "In the wild, non-breeding Midas cichlids drift in loose, fairly peaceful groups of hundreds
      above rocks and sunken trees, and only breeding pairs defend small areas. In a tank the
      situation changes: fish cannot escape, settle down and start to defend the whole tank. The
      dominant fish then picks on single victims until they die. Adult males and females that are
      simply put together often end in a dead female. The safest way to a pair is to raise five or
      six young fish together and remove the others as soon as two fish pair off. Even established
      pairs can turn on each other, especially after the fry are removed or when the female is not
      ready to spawn again. A divider, perforated for water flow, lets a keeper separate the
      partners without breaking the bond."
    sources:
      - kind: literature
        title: "Barlow, G. W. (1976). The Midas cichlid in Nicaragua. In: Thorson, T. B. (ed.),
          Investigations of the Ichthyofauna of Nicaraguan Lakes, University of Nebraska-Lincoln,
          333-358."
        url: https://digitalcommons.unl.edu/ichthynicar/23
        accessed: 2026-10-12
      - kind: database
        title: "Seriously Fish: Amphilophus citrinellus (Midas Cichlid)"
        url: https://www.seriouslyfish.com/species/amphilophus-citrinellus/
        accessed: 2026-10-12
  diet:
    text: "Wild Midas cichlids eat almost anything: algae and the film on rocks and logs, insect larvae,
      tiny snails they crush with their throat teeth, detritus sifted from the sand, and now and
      then a small fish or the fry of other cichlids. Larger adults take more fish. In the aquarium
      a quality cichlid pellet with plant content makes a good staple. Add frozen or live foods such
      as shrimp, mussel, earthworms and insect larvae, plus vegetable food like peas, spinach or
      algae wafers. Shrimp with shell helps to keep the orange colour bright. Avoid mammal meat such
      as beef heart, which the fish digest poorly. Feeder fish are not needed and bring disease
      risks. Feed once or twice a day in amounts eaten within minutes."
    sources:
      - kind: literature
        title: "Barlow, G. W. (1976). The Midas cichlid in Nicaragua. In: Thorson, T. B. (ed.),
          Investigations of the Ichthyofauna of Nicaraguan Lakes, University of Nebraska-Lincoln,
          333-358."
        url: https://digitalcommons.unl.edu/ichthynicar/23
        accessed: 2026-10-12
      - kind: database
        title: "FishBase species summary: Amphilophus citrinellus"
        url: https://www.fishbase.se/summary/Amphilophus-citrinellus.html
        accessed: 2026-10-12
      - kind: database
        title: "Seriously Fish: Amphilophus citrinellus (Midas Cichlid)"
        url: https://www.seriouslyfish.com/species/amphilophus-citrinellus/
        accessed: 2026-10-12
  breeding:
    text: A compatible pair breeds readily. Courtship involves digging, tail beating and mouth gaping,
      and the humps of both partners swell. In the wild pairs spawn in small caves among rocks; in
      the tank the female lays several hundred to about a thousand eggs on a cleaned stone, a
      vertical rock face or the roof of a cave, and the male fertilises them. Both parents fan and
      guard the clutch. The larvae hatch after two to three days and are moved into pits in the
      sand; they swim freely about a week later. The fry feed partly on mucus from the sides of
      their parents and take newly hatched brine shrimp from the start. Parents defend the brood
      fiercely, including against the keeper's hand. Remove all tankmates before breeding, and keep
      a divider ready, because males often turn on the female once the fry are free-swimming.
    sources:
      - kind: database
        title: "Seriously Fish: Amphilophus citrinellus (Midas Cichlid)"
        url: https://www.seriouslyfish.com/species/amphilophus-citrinellus/
        accessed: 2026-10-12
      - kind: database
        title: "Fishkeeper (Maidenhead Aquatics): Midas Cichlid, Amphilophus citrinellus, species profile"
        url: https://www.fishkeeper.co.uk/fish/freshwater/cichlids/midas-cichlid
        accessed: 2026-10-12
      - kind: database
        title: "FishBase species summary: Amphilophus citrinellus"
        url: https://www.fishbase.se/summary/Amphilophus-citrinellus.html
        accessed: 2026-10-12
      - kind: literature
        title: "Barlow, G. W. (1976). The Midas cichlid in Nicaragua. In: Thorson, T. B. (ed.),
          Investigations of the Ichthyofauna of Nicaraguan Lakes, University of Nebraska-Lincoln,
          333-358."
        url: https://digitalcommons.unl.edu/ichthynicar/23
        accessed: 2026-10-12
  sexing:
    text: "Juveniles cannot be sexed reliably. Adult males grow larger and bulkier, with longer, more
      pointed dorsal and anal fins, and develop a bigger forehead hump; in nature the hump appears
      mainly in the breeding season, in tanks it often stays. Females remain smaller, typically
      reaching two thirds to nine tenths of their partner's length, and look rounder when ready to
      spawn. The surest sign is the genital papilla: it is slender and pointed in males and short
      and blunt in females, and the female's egg tube becomes clearly visible shortly before
      spawning. Colour does not reveal the sex, since both sexes come in gold and barred forms."
    sources:
      - kind: database
        title: "Seriously Fish: Amphilophus citrinellus (Midas Cichlid)"
        url: https://www.seriouslyfish.com/species/amphilophus-citrinellus/
        accessed: 2026-10-12
      - kind: literature
        title: "Barlow, G. W. (1976). The Midas cichlid in Nicaragua. In: Thorson, T. B. (ed.),
          Investigations of the Ichthyofauna of Nicaraguan Lakes, University of Nebraska-Lincoln,
          333-358."
        url: https://digitalcommons.unl.edu/ichthynicar/23
        accessed: 2026-10-12
  compatibility:
    text: "For most keepers the Midas cichlid is a fish for a pair tank or a single-fish display.
      Tankmates are possible only in very large tanks of about 1000 litres or more, and then only
      robust species that are too big to swallow and tough enough to take a beating: other heavy
      Central American cichlids, large armoured catfish or big fast barbs such as tinfoil barbs. Add
      all fish together while young and provide many visual barriers. Anything small, slow or
      peaceful will be chased, injured or eaten; angelfish, tetras, mbuna and discus do not belong
      with it. Do not keep it with Amphilophus labiatus or the crater-lake Midas species such as A.
      zaliosus, because they cross easily. During breeding even robust tankmates are in danger."
    sources:
      - kind: database
        title: "Seriously Fish: Amphilophus citrinellus (Midas Cichlid)"
        url: https://www.seriouslyfish.com/species/amphilophus-citrinellus/
        accessed: 2026-10-12
      - kind: database
        title: "Fishkeeper (Maidenhead Aquatics): Midas Cichlid, Amphilophus citrinellus, species profile"
        url: https://www.fishkeeper.co.uk/fish/freshwater/cichlids/midas-cichlid
        accessed: 2026-10-12
      - kind: literature
        title: "Barlow, G. W. and Munsey, J. W. (1976). The red devil-Midas-arrow cichlid species complex in
          Nicaragua. In: Thorson, T. B. (ed.), Investigations of the Ichthyofauna of Nicaraguan
          Lakes, University of Nebraska-Lincoln, 359-369."
        url: https://digitalcommons.unl.edu/ichthynicar/24
        accessed: 2026-10-12
      - kind: literature
        title: Kautt, A. F., Machado-Schiaffino, G. and Meyer, A. (2016). Multispecies outcomes of sympatric
          speciation after admixture with the source population in two radiations of Nicaraguan
          crater lake cichlids. PLoS Genetics 12(6), e1006157.
        url: https://doi.org/10.1371/journal.pgen.1006157
        accessed: 2026-10-12
      - kind: archive
        title: cichlids.com forum thread 2476
        url: https://www.cichlids.com/disc/read.php?1,2476
        accessed: 2026-10-12
  problems:
    text: "The most common mistake is a tank that is too small or a pair forced together as adults,
      which ends with injured or dead fish. Underestimating the waste load is the second: poor
      filtration and rare water changes lead to high nitrate, poor appetite and frayed fins, and the
      fish then lose condition. Fatty mammal meat and overfeeding cause digestive trouble and
      obesity. Wild populations suffer from lymphocystis, whitish nodules on the fins, often after
      stress; in laboratory stocks fry sometimes waste away with swollen bellies, a syndrome linked
      to bacterial infection. Feeder fish can carry parasites and bacteria into the tank. Fish that
      jump out of open tanks, burns from unguarded heaters and cuts from loose decor are frequent
      avoidable losses. Consult a fish veterinarian for any treatment."
    sources:
      - kind: literature
        title: "Barlow, G. W. (1976). The Midas cichlid in Nicaragua. In: Thorson, T. B. (ed.),
          Investigations of the Ichthyofauna of Nicaraguan Lakes, University of Nebraska-Lincoln,

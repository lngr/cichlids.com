variants:
  - name: Gold morph
    kind: color-morph
    note: Natural xanthomorphic form that loses the dark pattern and turns white, yellow, orange or red;
      about 7 to 10 percent of wild adults, dominant in the aquarium trade.
  - name: Normal (barred) morph
    kind: color-morph
    note: Grey to olive brown wild coloration with dark vertical bars and a midlateral blotch.
  - name: Piebald and white strains
    kind: color-morph
    note: Aquarium strains with white, red and black patches; their purity is often doubtful.
  - name: Lake Nicaragua
    kind: locality
    note: Type locality; wild stock from the great lake.
  - name: Lake Managua
    kind: locality
  - name: Lake Masaya
    kind: locality
    note: Crater lake population used in many behavioural studies.

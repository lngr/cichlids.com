    rationale: "Five votes were cast: generator and checker-a proposed 3 to 25 dKH (Lake Nicaragua 3.5
      to 4.1 dKH, Lake Masaya 12.3 dKH and Lake Managua 24.4 dKH, computed from 8.7 meq/L alkalinity
      reported by Lin 1961 in Cole 1976), checker-b 3 to 8 dKH, tiebreaker-2 3 to 12 dKH as an
      estimate without measurement, and tiebreaker-3 3 to 16 dKH (Lake Nicaragua 3.4 to 3.6 dKH
      after Swain 1966; Río Tipitapa, the outflow of Lake Managua, 4.6 to 15.7 dKH in 2016 and
      2017). Only two votes agree within 2 dKH, so the decided value is the most cautious one: the
      intersection of all proposals, 3 to 8 dKH. This range describes the soft water of Lake
      Nicaragua, the main habitat and the source of most wild fish, and the lower site means of the
      Tipitapa river; it leaves out the strongly buffered water of Lake Masaya and Lake Managua,
      where the species lives as well. The alkalinity of Lake Managua is uncertain: the 1950s survey
      found 6.7 to 15.7 dKH, the older chemical analysis about 24 dKH, and no recent lake
      measurement was readable. Converted with 1 dKH = 17.85 mg/L CaCO3 = 0.357 meq/L."

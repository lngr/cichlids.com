      Masaya held algae in 93 percent, insects in 72 percent, snails in 28 percent and fish in 14
      percent of the fish (Barlow 1976); the species also rasps aufwuchs, sifts sand and crushes
      snails with its pharyngeal teeth. FishBase and the USGS sheet call it omnivorous, and
      Seriously Fish recommends a mixed diet with vegetable matter. The Cichlid Room Companion
      summary lists it as detritivorous and insectivorous, which fits the sifting behaviour but
      understates the plant share. Bloat is not reported as a typical problem; the warning against
      mammal meat concerns digestion in general.

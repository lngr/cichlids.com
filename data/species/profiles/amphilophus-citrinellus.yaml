        - by: checker-a
          value: Narrow species concept; lists A. viridis among the Xiloá species and A. tolteca in Lake
            Asososca Managua.
        - by: checker-b
          value: Species name applied in a wide sense to the great-lake populations; crater-lake forms often
            called A. cf. citrinellus.
      decision: Narrow species concept with A. viridis in Lake Xiloá and A. tolteca in Lake Asososca Managua.
      rationale: The Catalog of Fishes gives Lake Xiloá as the type locality and range of A. viridis and
        Lake Asososca Managua for A. tolteca. All three runs agree that the crater-lake species are
        separate; the narrow concept describes this correctly.

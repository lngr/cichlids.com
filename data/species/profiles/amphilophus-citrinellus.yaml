  hybridGroup:
    value: amphilophus-citrinellus-complex
    confidence: high
    verification:
      method: unanimous
      votes:
        agree: 3
        total: 3
    rationale: "All three votes agree on the curated group amphilophus-citrinellus-complex. Barlow and
      Munsey (1976) describe fish of lakes Masaya and Xiloá that show features of A. labiatus,
      apparently through introgressive hybridisation, and the care sheets report that much aquarium
      stock is crossed with the red devil A. labiatus. Elmer et al. (2010) found no significant
      mitochondrial differentiation between A. citrinellus and A. labiatus in Lake Nicaragua. The
      crater-lake species of the complex belong to the group as well: Kautt et al. (2016) report
      that no intrinsic incompatibilities are known among Midas cichlids, that the species cross
      easily in the laboratory, that great-lake fish admixed into the founding populations of lakes
      Apoyo and Xiloá, and that the Xiloá species hybridise in nature; Recknagel et al. (2013)
      raised F2 hybrids of A. astorquii and A. zaliosus. The species is also a parent of the blood
      parrot and flowerhorn crosses."

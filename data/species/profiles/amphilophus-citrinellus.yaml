  synonyms:
    - name: Heros citrinellus
      note: Original combination, Günther 1864, type locality Lake Nicaragua.
    - name: Cichlasoma citrinellum
      note: Combination used until the late 1990s (Conkel 1993, Page and Burr 1991).
    - name: Cichlosoma citrinellum
      note: Spelling variant used by Villa 1982 and Bussing 1987.
    - name: Heros basilaris
      note: Gill 1877, Lake Nicaragua; junior synonym.
    - name: Cichlasoma granadense
      note: Meek 1907, Lake Nicaragua at Granada; junior synonym (treated as valid by Stauffer and McKaye
        2002).
  legacyNames:
    - Amphilophus citrinellus
    - Cichlasoma citrinellus
  note: The Catalog of Fishes (accessed 2026-10-12) lists Amphilophus citrinellus (Günther 1864) as
    valid, distributed on the Atlantic slope of Nicaragua and Costa Rica, with Heros basilaris and
    Cichlasoma granadense as synonyms. Legacy entry 683, Cichlasoma citrinellus, is the older genus
    placement of the same species (correctly spelled citrinellum in Cichlasoma), so both legacy
    entries map here. The species is defined narrowly. The Midas cichlids of the crater lakes Apoyo
    (A. astorquii, A. chancho, A. flaveolus, A. globosus, A. supercilius, A. zaliosus), Xiloá (A.
    amarillo, A. sagittae, A. viridis, A. xiloaensis) and Asososca Managua (A. tolteca) are separate
    valid species, as are A. erythraeus of Lake Managua and the thick-lipped red devil A. labiatus
    of the great lakes. A. citrinellus in the narrow sense covers the great lakes Nicaragua and
    Managua, the San Juan drainage and crater lakes without described endemics such as Masaya;
    populations of further crater lakes such as Apoyeque are usually called A. cf. citrinellus. Much
    aquarium stock sold as Midas cichlid is crossed with A. labiatus.

            pattern: "bars"
        - by: "checker-c"
          value:
            baseColors:
              - "yellow"
              - "black"
              - "blue"
            pattern: "mixed"
      decision: *a48
      rationale: "Generator proposed yellow/blue/black with plain pattern; checker-a black/blue/yellow with mixed
        pattern; checker-b yellow/black with bars; checker-c yellow/black/blue with mixed pattern. The order
        of the same colour set is immaterial. Select the combined yellow, black and blue set and mixed
        pattern because localities include yellow, dark, bronze, banded and spotted fish. Bars and plain
        colour describe some populations but do not represent the species as a whole. The keeper account
        directly describes yellow males with flank spots and changing green tones; a single set cannot
        encode every locality or mood."
    - field: "features.minTank"
      proposals:
        - by: "generator"
          value:
            volumeL: 500
            lengthCm: 150
            depthCm: 60
        - by: "checker-a"
          value:
            volumeL: 300
            lengthCm: 150
            depthCm: 45
        - by: "checker-b"
          value:
            volumeL: 500
            lengthCm: 150
            depthCm: 50
        - by: "checker-c"
          value:
            volumeL: 500
            lengthCm: 150
            depthCm: 50
      decision: *a49
      rationale: "Start from coordinate medians: generator proposed 500 L/150 cm/60 cm; checker-a 300 L/150 cm/45
        cm; checker-b and checker-c 500 L/150 cm/50 cm. Retain 500 L with at least 150 cm length and 50 cm
        front-to-back depth for one male and three females. Tanganyika.si and Aquarium Lesson support 500
        L/150 cm; the Nordic header gives 500 L/160 cm but its prose says 300 to 400 L, and the keeper
        article recommends 400 L/150 cm. Seriously Fish gives approximately 304 L and a 150 by 45 cm base,
        while Fishipedia recommends 1500 L. The median 500 L lies within this source spread and accommodates
        sand, shelter and adult group space without treating the much larger observed multi-male communities
        as the minimum. Fifty centimetres of depth is a practical footprint inference rather than a measured
        species threshold. Inherited depth assumptions and the forum stocking question are retained as such,
        not as independently measured minimum dimensions."
    - field: "features.lifespanYears"
      proposals:
        - by: "generator"
          value:
            min: 8
            max: 12
        - by: "checker-a"
          value:
            min: 6
            max: 10
        - by: "checker-b"
          value:
            min: 8
            max: 12
        - by: "checker-c"
          value:
            min: 5
            max: 10
      decision: *a50
      rationale: "Generator and checker-b proposed 8 to 12 years; checker-a 6 to 10; checker-c 5 to 10. Endpoint
        medians are 7 and 11, but the read species sources provide 8 years in Fishipedia and only an upper
        value of 10 years in Aquarium Lesson. Cap the unsupported median upper endpoint at 10 instead of
        extending beyond the largest sourced value. Keep 7 as an uncertain central planning estimate for the
        lower endpoint, not a measured survival percentile. The 12-year estimates and related
        model-knowledge entries remain evidence of uncertainty rather than new longevity observations."
    - field: "features.beginnerSuitability"
      proposals:
        - by: "generator"
          value: "demanding"
        - by: "checker-a"
          value: "moderate"
        - by: "checker-b"
          value: "demanding"
        - by: "checker-c"
          value: "demanding"
      decision: "demanding"
      rationale: "Generator, checker-b and checker-c proposed demanding; checker-a proposed moderate. The Nordic
        register labels the fish advanced, Seriously Fish and Fishipedia rate overall care moderate, and
        specialist accounts require a large footprint with a carefully managed group. Select demanding
        because an adult harem needs substantial space, stable buffered water and monitoring of courtship
        and feeding. This does not imply fragility under suitable conditions, and the moderate source
        ratings remain visible."

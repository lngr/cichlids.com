    confidence: "high"
    rationale: "All four complete profiles agree on Lake Tanganyika endemism. Their locality lists range from a
      lake-level label to Kalungwe and an almost lake-wide shoreline description. Retain Kalungwe as the
      catalogued type locality and describe the distribution as discontinuous around the lake, as in
      Hanssens et al.; a coarse range is not a claim of occurrence at every shoreline site. Archive searches
      found a stock list and a stocking question, not distribution measurements."

  ph:
    value:
      min: 8.4
      max: 9.4
    confidence: "high"
    rationale: "Retain the settled natural range of pH 8.4 to 9.4 with waterbody verification and high
      confidence. Plisnier et al. report 8.47 to 9.40 at 40 m in the north over an annual cycle; Cohen et
      al. give narrower north-basin surface readings of 8.8 to 9.2. The older FAO source book lists 7.3 to
      7.8, but that isolated listing conflicts with the modern profiles and the measured high alkalinity.
      Keep the source without using that older pH listing to move the lake envelope. Some inherited evidence
      attributed the full lake synthesis to Cohen alone; Table 1 supports its narrower surface interval, not
      the full envelope."

  temperatureC:
    value:
      min: 23
      max: 29
    confidence: "high"
    rationale: "Retain the settled lake envelope of 23 to 29 C with waterbody verification and high confidence.
      Verburg et al. measured hourly 1 m values of 23.85 to 29.01 C at Mpulungu; the adopted whole-degree
      envelope is deliberately rounded rather than a reproduction of those exact endpoints. The annual
      limnological studies describe seasonal cooling and upwelling. FishBase gives the narrower species
      account interval of 24 to 26 C, which is retained as evidence without replacing the regional lake
      envelope. Aquarium recommendations are also retained as such."

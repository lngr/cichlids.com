    - species: "Tropheus moorii"
      reason: "The Nordic register discourages this combination because forceful Tropheus can suppress nasuta. The
        concern remains temperament and competition even though both need plant-inclusive feeding."
profile:
  overview:
    text: "A displaying male nasuta is conspicuous above the rocky and sandy margins of Lake Tanganyika. Its
      enlarged snout and extended pelvic fins distinguish it from many other featherfins, but locality and
      maturity strongly affect appearance. A practical adult unit is one male with at least three females in
      a spacious aquarium. The female carries the brood, and the male defends a spawning site rather than
      caring for fry. Calm Tanganyika communities are possible when floor space and feeding access are
      protected."
    sources:
      - *a2
      - *a7
      - *a11
      - *a3
  habitat:
    text: "The species has a discontinuous distribution around Lake Tanganyika, with Kalungwe as its type
      locality. It uses sandy areas interrupted by rocks and feeds above the slope, usually in shallow
      littoral water. Published accounts place many observations within roughly 2 to 10 m, while individual
      populations differ. Regional lake measurements define natural conditions of 23 to 29 C, pH 8.4 to 9.4,
      GH 10 to 13 dGH and KH 15 to 20 dKH. These are a habitat envelope, not instructions to hold an
      aquarium continuously at an extreme."
    sources:
      - *a7
      - *a2
      - *a8
      - *a17
      - *a9
      - *a18
      - *a10
      - *a19
  sizeAndGrowth:
    text: "Use about 20 cm for males and approximately 16.5 cm for females when planning adult space. The female
      figure summarizes estimates of 16 to 17 cm, rather than a precisely measured maximum. Published length
      conventions differ: the FishBase maximum is total length, whereas Seriously Fish labels its number
      standard length. Young fish can be much plainer than mature males. A lifespan of roughly 7 to 10 years
      remains a low-confidence planning estimate because species-specific observations are sparse."
    sources:
      - *a2
      - *a7
      - *a11
      - *a15
      - *a14
  husbandry:
    text: "Provide at least 500 L, 150 cm of length and 50 cm of front-to-back space for the recommended
      single-male harem. Preserve a usable sand area, with secure rocks at its margins and shelter outside
      the display site. Filtration and water changes must maintain clean, oxygenated water without abrupt
      changes in mineral balance. Keep conditions stable around an appropriate midrange rather than moving
      between tolerance endpoints. The decided tolerance envelopes are 23 to 29 C, pH 7.5 to 9.4, GH 8 to 25
      dGH and KH 10 to 23 dKH; the KH interval is derived and especially uncertain."
    sources:
      - *a7
      - *a11
      - *a20
      - *a12
  socialBehavior:
    text: "Male display sites create a hierarchy and repeated chasing, even though nasuta is often calmer than
      other featherfins. Start with one male and at least three females. A much larger tank can support
      several males, but a successful colony in a very large aquarium does not show that extra males fit the
      minimum setup. A mound only 25 to 30 cm across may sit within a substantially larger defended area.
      Watch for individuals excluded from food or pinned against cover, especially during courtship."
    sources:
      - *a7
      - *a11
      - *a24
      - *a20
  diet:
    text: "The evidence includes drifting plankton, attached biological growth and small invertebrates. A
      FishBase field diet record from Luhanga assigns 66 percent to plants, so the species should not be
      treated as an obligate animal feeder. Offer varied small foods with a substantial vegetable
      contribution and suitable planktonic supplements. Husbandry sources advise against overly rich feeding
      and associate it with intestinal problems. The bloat-sensitive flag reflects this practical warning;
      it does not establish one dietary cause for every digestive illness."
    sources:
      - *a2
      - *a7
      - *a11
      - *a24
      - *a12
  breeding:
    text: "Females mouthbrood after visiting a male sand bower, which may be built on a flat rock. The enlarged
      tips of the male pelvic fins are part of courtship. Incubation is commonly reported at around three
      weeks, with some accounts giving three to four weeks. A brooding female needs freedom from persistent
      harassment, and released fry can take small suitable foods. Crosses with ventralis and boops are
      supported by wild genetic evidence; a secondary aquarium account also reports crossing with
      heterodonta. Keep locality records when raising offspring."
    sources:
      - *a3
      - *a2
      - *a7
      - *a24
      - *a28
      - *a34
      - *a20
      - *a5
  sexing:
    text: "Mature males are usually larger and more strongly coloured, with longer fins and a more prominent
      nasal projection. Females and immature or subordinate males may be much harder to distinguish. The
      morphological revision records a nasal projection in some females too, so the snout alone is not a
      reliable sex test. Colour also varies among populations. Observe the fish over time and combine
      several traits before choosing the adult sex ratio."
    sources:
      - *a11
      - *a7
      - *a24
      - *a4
  compatibility:
    text: "Calm companions can work if they leave the nasuta display floor available. Cyprichromis leptosoma is
      supported by mixed-aquarium reports. Enantiopus melanogenys and Xenotilapia spilopterus have also
      shared a successful community, but that report used a 300 by 80 cm footprint and should not be applied
      to the minimum harem tank. Aggressive grazers such as Tropheus may suppress nasuta. Treat ventralis,
      boops and heterodonta as crossing risks under the three pairwise hybrid groups; this does not imply
      that every other pair within the genus crosses."
    sources:
      - *a7
      - *a24
      - *a28
      - *a5
      - *a11
      - *a34
      - *a20
  problems:
    text: "Persistent courtship, extra males in restricted space and competition for the sand area are recurring
      risks. Provide escape routes and reassess the group if a fish cannot rest or eat. Rich feeding can
      contribute to digestive trouble, so monitor appetite and body condition rather than encouraging rapid
      bulk gain. The lower-confidence KH and lifespan estimates should remain visible when planning care.
      During moves, use gentle handling because the keeper account reports eye damage after rough capture.
      Archive stocking questions are useful prompts to investigate crowding, not proof of a safe capacity."
    sources:
      - *a11
      - *a7
      - *a20
      - *a24
      - *a12

      value: &a40
        min: 23
        max: 29
      confidence: "medium"
      rationale: "Retain the unanimous tally decision of 23 to 29 C, medium confidence, with four agreeing votes
        under the one-degree agreement rule. Generator proposed 22 to 30 C; checker-a, checker-b and
        checker-c each proposed 23 to 29 C. The generator added unsupported one-degree margins, so the
        median of the agreeing endpoints returns 23 to 29 C. Seriously Fish and Aquarium Lesson recommend 23
        to 27 C, Fishipedia 23 to 28 C, the Nordic register 24 to 27.5 C and Kever et al. kept reproducing
        fish at 25 to 27 C. Containment of the natural lake envelope accounts for 29 C; these sources do not
        establish sharp physiological failure thresholds or long-term trials at every endpoint."

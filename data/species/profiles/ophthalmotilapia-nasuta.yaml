  note: "The Catalog of Fishes accepts Ophthalmotilapia nasuta and records Kalungwe as the type locality. Its
    separate Ophthalmochromis query returned no records; that query is retained among origin sources.
    Hanssens et al. distinguish regional populations within the nasuta complex. Locality labels do not
    establish separate described species, and the similar undescribed paranasuta is not merged into this
    profile."

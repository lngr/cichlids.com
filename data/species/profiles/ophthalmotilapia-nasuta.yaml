      reason: "Reported in nasuta community aquaria and uses swimming space above the spawning floor."
      condition: "Provide enough open water for its own group and keep the nasuta bower clear."
    - species: "Enantiopus melanogenys"
      reason: "A keeper reports successful cohabitation with nasuta in a very large sand-based community."
      condition: "The report used a 300 by 80 cm footprint; do not extend this pairing to the minimum nasuta tank."
    - species: "Xenotilapia spilopterus"
      reason: "Reported alongside nasuta in the same spacious community aquarium."
      condition: "Provide a much larger shared footprint than the minimum harem tank and monitor feeding access."
  unsuitable:
    - species: "Ophthalmotilapia ventralis"
      reason: "Shares a documented hybrid group supported by wild introgression; captive crossing is also
        reported."
    - species: "Ophthalmotilapia boops"
      reason: "Shares a documented pairwise hybrid group supported by wild genetic evidence."
    - species: "Ophthalmotilapia heterodonta"
      reason: "A secondary account reports aquarium crossing even with conspecific partners available; genetic
        evidence for this exact pair is less conclusive."
    - species: "Neolamprologus tretocephalus"

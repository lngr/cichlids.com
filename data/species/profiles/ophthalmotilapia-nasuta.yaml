      rationale: "The Catalog establishes the original combination Ophthalmochromis nasutus. The Nordic register
        also records Ophthalmotilapia nasutus as an earlier spelling, so preserve it with an explicit
        spelling note rather than treating it as a distinct valid species. Differences in wording of the
        original-combination notes have no taxonomic significance."

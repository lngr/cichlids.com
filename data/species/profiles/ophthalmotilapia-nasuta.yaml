        to five females; that experimental arrangement does not establish a compulsory 1:4 ratio for nasuta.
        Large multi-male colonies are reported but require much more space than the minimum unit. The keeper
        groups imply approximately 2.2 females per male and are observations of successful or unsuccessful
        particular groups, not a universal minimum."
    - field: "features.hybridGroups"
      proposals:
        - by: "generator"
          value:
            - "ophthalmotilapia-nasuta-ventralis"
        - by: "checker-a"
          value:
            - "ophthalmotilapia-nasuta-ventralis"
            - "ophthalmotilapia-boops-nasuta"
            - "ophthalmotilapia-heterodonta-nasuta"
        - by: "checker-b"
          value:
            - "ophthalmotilapia-nasuta-ventralis"
        - by: "checker-c"
          value:
            - "ophthalmotilapia-nasuta-ventralis"
            - "ophthalmotilapia-heterodonta-nasuta"
        - by: "tiebreaker-1"
          value:
            - "ophthalmotilapia-nasuta-ventralis"
            - "ophthalmotilapia-boops-nasuta"
            - "ophthalmotilapia-heterodonta-nasuta"
        - by: "tiebreaker-2"
          value:
            - "ophthalmotilapia-nasuta-ventralis"
            - "ophthalmotilapia-boops-nasuta"
            - "ophthalmotilapia-heterodonta-nasuta"
      decision: *a47
      rationale: "Retain the conservative tally union with low confidence and a largest exact-set cluster of three
        of six votes. Generator and checker-b proposed only ophthalmotilapia-nasuta-ventralis; checker-c
        proposed that pair plus ophthalmotilapia-heterodonta-nasuta; checker-a, tiebreaker-1 and
        tiebreaker-2 proposed all three decided pairs, adding ophthalmotilapia-boops-nasuta. All six name
        the ventralis pair, four name heterodonta and three name boops, so every retained pair clears the
        two-vote conservative rule even though no exact set reaches four votes. Nevado supports wild
        boops/nasuta and ventralis/nasuta introgression, with additional boops evidence in GENBAS; these are
        documented pairwise groups. Heterodonta-related genetic ancestry has an unresolved ancestral-donor
        alternative. Its documented group basis instead follows the explicit Cichlid Atlas report
        attributing aquarium crosses with conspecific partners available to Hans-Joachim Herrmann. This is
        secondary reporting and the original account was not examined, so it is weaker evidence than the
        wild genetic cases. Tiebreaker-1 preferred presumed for this pair for that reason, while checker-a,
        checker-c and tiebreaker-2 accepted documented. The rubric accepts a source reporting free-choice
        crossing, but this does not raise the low confidence of the conservative feature decision. The
        laboratory ventralis cross lacked conspecific males and alone would support only presumed. No
        all-pairs genus group is inferred."

  problems:
    text: "Handling stress and unstable or polluted water are recurring concerns. Brood loss can follow
      disturbance, and crowded courtship areas can turn otherwise mild rivalry into persistent
      pursuit. A keeper reports bloat-like losses after import and food changes, and an aquarium
      record reports disease and medication losses; these accounts do not establish a
      Kilesa-specific diagnosis or a proven causal diet rule. Monitor appetite, breathing and
      behavior, maintain clean oxygenated water and address changes promptly without treating
      anecdotal medication advice as a diagnosis."

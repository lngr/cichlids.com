  breeding:
    text: "The female incubates the brood after spawning at a male-built sand site. Several displaying
      males can form a lek, with shallow depressions and small sand towers around their nests.
      Species-specific sources and CRC support maternal mouthbrooding, despite a retailer
      incorrectly suggesting rock or shell substrate spawning. Aquarium accounts give differing
      brood counts and incubation lengths, so neither a fixed clutch size nor a precise release date
      is guaranteed. Minimize disturbance to carrying females and provide tiny foods for released
      fry."
    sources:

  diet:
    text: "Offer small animal foods that suit an invertebrate feeder, alongside appropriate prepared
      cichlid food. Natural accounts emphasize crustaceans extracted from sand; some dealers use an
      omnivore label and mention occasional plant food. The decided invertivore classification
      follows the more specific diet evidence. Check that food reaches the whole group near the
      bottom. The fixed bloatSensitive false flag does not mean the fish cannot develop bloat: a
      keeper reports losses after import and feeding changes, without proving a protein-specific
      cause."

  habitat:
    text: "Most of the aquarium floor should remain fine sand with free swimming room above it. The
      locality-specific accounts place Kilesa on the western Congolese shore, including Kasenge Bay
      and the coast between Kalemie and the Kavala Islands; the Nordic account emphasizes Toa.
      Natural lake-study values are 23 to 29 C, pH 8.4 to 9.4, GH 10 to 13 dGH and KH 15 to 20 dKH.
      These describe the lake envelope, not independently tested aquarium targets. A few stable
      stones can mark boundaries without filling the sand area."

partners:
  suitable:
    - species: "Cyprichromis leptosoma"
      reason: "Uses the water above the sand and is explicitly supported at genus level as a calm
        companion."
      condition: "A larger aquarium must meet the needs of both adult groups and leave the Kilesa sand
        areas clear."
    - species: "Paracyprichromis nigripinnis"
      reason: "A larger aquarium record reports this upper-water and rock-associated species with Kilesa."
      condition: "Provide separate rock cover without occupying the open sand floor."
  unsuitable:
    - species: "Cyphotilapia frontosa"
      reason: "Its large size and potential to eat smaller fish make it a poor choice for a small, easily
        disturbed sand-dweller."
    - species: "Tropheus moorii"
      reason: "Assertive feeding and a primarily plant-based diet conflict with the calm setting and
        invertebrate diet chosen for Kilesa."
    - species: "Callochromis macrops"
      reason: "A keeper report warns against combining these competing sand dwellers because they use the
        same lower area."
profile:
  overview:
    text: "Plan this fish around its group and the sandy floor it uses, rather than around its modest
      adult length. Enantiopus sp. 'Kilesa' is an undescribed Tanganyika form whose courting males
      become conspicuously colored. The described E. melanogenys remains a separate taxonomic
      reference here. Some databases call Kilesa Xenotilapia, but a different genus label does not
      resolve its species identity. Its suggested hybrid ancestry has not been demonstrated."
    sources:

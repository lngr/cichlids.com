  socialBehavior:
    text: "A group can show coordinated movement and several adjacent courtship sites. In a suitable
      six-fish setup, displays and brief chases fit conspecific aggression level 1, although one
      source instead recommends a single adult male because rivals can compete. Courtship
      territories may span about 61 cm even when each individual sand bowl is small. Females need
      room to leave a courting male and quiet space while carrying a brood. Persistent pursuit,
      injury or hiding indicates that the current arrangement is failing."

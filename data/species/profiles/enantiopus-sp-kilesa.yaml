      rationale: "Generator, checker-a and checker-c propose 13 cm male and 11 cm female; checker-b
        proposes 13 and 12 cm. The medians are 13 and 11 cm. The locality-specific account gives
        adults about 12 to 13 cm without separate sex maxima, while Wet Spot gives 10 to 12 cm and
        Imperial Tropicals about 7.6 to 10.2 cm. The Nordic register lists 14 cm, retailers reach 15
        cm, and Zoopet and Akvaryum list 16 cm. These larger maxima remain evidence but do not
        outweigh the locality-specific typical size. The 11 cm female maximum is an estimate, not a
        measured sex-specific limit; duplicated unsexed evidence values are not independent female
        measurements."
    - field: "features.diet"
      proposals:
        - by: "generator"
          value:

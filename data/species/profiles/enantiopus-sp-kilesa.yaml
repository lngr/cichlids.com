  sexing:
    text: "In breeding condition, male color and behavior are more useful than body length alone. The
      Nordic account describes a yellow-orange throat and dark fin marks; Imperial Tropicals adds
      blue scales, a green face sheen and a spotted dorsal fin. Females and juveniles remain much
      plainer and silvery. A resting male can also appear subdued, making immature or unsettled fish
      difficult to sex confidently."

  compatibility:
    text: "Calm upper-water Cyprichromis are a documented companion option when their group has enough
      space in addition to the Kilesa floor. Paracyprichromis are also reported with Kilesa in
      larger aquaria. Avoid companions that crowd sand courtship areas or dominate this easily
      disturbed fish. The speciesOnly decision is false. The empty hybrid-group decision does not
      establish reproductive isolation: a keeper gives a general Enantiopus crossing warning, while
      the proposed natural-hybrid origin is a separate unconfirmed claim."

    tolerance:
      value:
        min: 23
        max: 29
      confidence: "low"
      rationale: "Generator, checker-a, checker-b and checker-c all propose 23 to 29 C; the tally retains
        that unanimous 4 of 4 decision with low confidence. The interval contains the full natural
        lake envelope, while species-specific aquarium recommendations cluster around 24 to 28 C and
        the Nordic register gives 24 to 27.5 C. Zoopet gives 23 to 26 C and Interaquaristik gives 22
        to 26 C. The latter reaches below the decided minimum, but is a lower-trust retailer
        recommendation using the melanogenys label, not a long-term Kilesa endpoint study. The
        inherited 26 C attribution to the locality page is unconfirmed; the Nordic husbandry text
        independently supports about 26 C. There is no evidence that continuous exposure to both
        lake extremes is an ideal aquarium target."

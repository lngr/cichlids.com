        - by: "generator"
          value:
            continent: "Africa"
            region: "Lake Tanganyika"
            waterbody: "Lake Tanganyika"
            localities:
              - "Western shore, from Kalemie to the Kavala Islands; Kasenge Bay"
        - by: "checker-a"
          value:
            continent: "Africa"
            region: "Lake Tanganyika"
            waterbody: "lake-tanganyika"
            localities:
              - "Kasenge Bay"
              - "western shore of Lake Tanganyika between Kalemie and the Kavala Islands (Democratic
                Republic of Congo)"
        - by: "checker-b"
          value:
            continent: "Africa"
            region: "Lake Tanganyika"
            waterbody: "lake-tanganyika"
            localities:
              - "Western shore from Kalemie to the Kavala Islands, including Kasenge Bay"
        - by: "checker-c"
          value:
            continent: "Africa"
            region: "Lake Tanganyika"
            waterbody: "lake-tanganyika"
            localities:
              - "Western shore, Democratic Republic of the Congo"
      decision:
        continent: "Africa"
        region: "Lake Tanganyika"
        waterbody: "lake-tanganyika"
        localities:
          - "Kasenge Bay"
          - "Western shore from Kalemie to the Kavala Islands, Democratic Republic of the Congo"
      rationale: "Species-specific locality accounts and the Cichlid Room Companion place Kilesa on the
        western Congolese shore of Lake Tanganyika. Generator and checker-b describe Kalemie to the
        Kavala Islands, checker-a also names Kasenge Bay, and checker-c gives the western shore more
        generally. The Nordic register instead emphasizes Toa. The decision retains the documented
        western-shore localities without claiming a complete or settled distribution."
    - field: "features.ph.tolerance"
      proposals:
        - by: "generator"
          value:
            min: 8.4
            max: 9.4
        - by: "checker-a"
          value:
            min: 7.5
            max: 9.4
        - by: "checker-b"
          value:
            min: 7.5
            max: 9.4
        - by: "checker-c"
          value:
            min: 7.8
            max: 9.4
        - by: "tiebreaker-1"
          value:
            min: 7.8
            max: 9.4
        - by: "tiebreaker-2"
          value:
            min: 7.5
            max: 9.4
      decision:
        min: 7.5
        max: 9.4
      rationale: "Generator proposes 8.4 to 9.4; checker-a, checker-b and tiebreaker-2 propose 7.5 to 9.4;
        checker-c and tiebreaker-1 propose 7.8 to 9.4. The tally decides 7.5 to 9.4 by a qualified
        majority of 5 of 6, treating lower endpoints within 0.3 pH as agreement, and retains medium
        confidence. Interaquaristik recommends 7.5 to 8.5 for fish sold as Kilesa, a keeper of both
        forms gives 7.5 to 8.5 for Enantiopus, and Seriously Fish gives 7.5 to 9.0 for the related
        E. melanogenys. Species-specific Imperial Tropicals and Zoopet begin at 7.8. The Nordic
        summary gives 8.8 to 9.3 but its husbandry prose recommends about 8.2, so the narrow summary
        is not a complete tolerance test. Aquarium observations around 8.1 to 8.2 support moderate
        alkalinity without testing the minimum for years. The upper endpoint contains the natural
        lake maximum of 9.4. Related-species and product targets remain contextual; no controlled
        long-term Kilesa endpoint trial was found."
    - field: "features.ghDgh.tolerance"
      proposals:
        - by: "generator"
          value:
            min: 10
            max: 20
        - by: "checker-a"
          value:
            min: 10
            max: 20
        - by: "checker-b"
          value:
            min: 8
            max: 20
        - by: "checker-c"
          value:
            min: 8
            max: 20
      decision:
        min: 9
        max: 20
      rationale: "Generator and checker-a propose 10 to 20 dGH; checker-b and checker-c propose 8 to 20
        dGH. All four meet the tally agreement threshold of 2 dGH, so the tally method is unanimous
        at 4 of 4 even though its endpoint medians give 9 to 20 dGH. Confidence remains low. Wet
        Spot recommends 8 to 15 dGH, Lone Star 10 to 20 dGH, and Interaquaristik 12 to 20 dGH. The
        decided lower endpoint is above the Wet Spot minimum of 8; the related-species Seriously
        Fish interval of 10 to 25 is also wider at the upper end. Both outlying recommendations
        remain evidence, but neither establishes a Kilesa-specific long-term limit. FishBase gives
        only an upper hardness value of 20 for E. melanogenys; inherited lower endpoints, including
        zero, are not measurements and do not support soft-water tolerance. The decision contains
        natural GH 10 to 13 dGH."
    - field: "features.khDkh.tolerance"
      proposals:
        - by: "generator"
          value:
            min: 15
            max: 20
        - by: "checker-a"
          value:
            min: 12
            max: 20
        - by: "checker-b"
          value:
            min: 15
            max: 20
        - by: "checker-c"
          value:
            min: 10
            max: 20
        - by: "tiebreaker-1"
          value:
            min: 10
            max: 20
        - by: "tiebreaker-2"
          value:
            min: 10
            max: 20
      decision:
        min: 10
        max: 20
      rationale: "Generator and checker-b propose 15 to 20 dKH, checker-a 12 to 20, and checker-c,
        tiebreaker-1 and tiebreaker-2 10 to 20. The tally decides 10 to 20 dKH with a qualified
        majority of 4 of 6, including the 12 minimum within the 2 dKH agreement threshold, and low
        confidence. Lone Star explicitly recommends 10 to 15 dKH for Kilesa; the selected upper
        endpoint is widened to contain natural lake KH 15 to 20. Aquarium reports give 9 dKH with
        breeding and 12 dKH with Kilesa, while a record at 8 dKH has uncertain current species
        attribution. The lower observed values do not establish healthy years of maintenance at 8 or
        9 dKH, so they remain evidence without moving the decided minimum. JBL gives an 18 dKH
        Tanganyika replication target and Sera advises elevated KH for rift-lake fish, but neither
        defines Kilesa-specific lower limits. GH care ranges are not used as KH evidence."

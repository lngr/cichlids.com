    confidence: "high"
    rationale: "The settled natural decision is 15 to 20 dKH. Plisnier reports bicarbonate-dominated
      alkalinity with a smaller carbonate contribution, and Cohen et al. report 6.5 to 6.6 meq/L,
      about 18.2 to 18.5 dKH. The older FAO compilation gives 6.71 meq/L, about 18.8 dKH. The
      envelope includes variation across the lake programme; GH and KH are distinct and are not
      converted into each other. All four full-profile runs proposed 15 to 20 dKH. Natural KH
      carries no verification object."

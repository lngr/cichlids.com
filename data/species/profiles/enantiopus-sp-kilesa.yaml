  legacyNames:
    - "Enantiopus spec. \"Kilesa\""
  note: "Kilesa remains undescribed, with no species epithet or taxonomic author assigned. The Catalog
    of Fishes retains Enantiopus melanogenys as a valid described species but supplies no described
    Kilesa taxon. CRC independently treats Kilesa as undescribed in Enantiopus. FishBase and some
    hobby sources use Xenotilapia for the related species or for this trade form. Takahashi (2003),
    read as an abstract only, and Kidd et al. (2012) question the genus separation; this does not
    justify identifying Kilesa as E. melanogenys. Suggested hybrid ancestry remains a hypothesis."

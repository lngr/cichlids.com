  minTank:
    value:
      volumeL: 300
      lengthCm: 120
      depthCm: 50
    confidence: "medium"
    rationale: "Generator, checker-a and checker-c propose 300 L with a 120 by 50 cm footprint;
      checker-b proposes 600 L and 200 by 60 cm for ten fish. The coordinate medians are 300 L, 120
      cm and 50 cm. The locality account states those minimum figures for several males and females,
      while Imperial Tropicals gives a similar 75 US gallon tank and 122 by 46 cm footprint for six
      fish. The Nordic register and Zoopet recommend 500 L and 160 cm, and Interaquaristik asks for
      200 cm with ten fish. Those larger configurations remain useful options, but do not override
      the documented minimum for the selected six-fish unit. A floor partition and more space are
      needed when several males defend their broad breeding areas."

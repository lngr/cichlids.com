  sizeAndGrowth:
    text: "The working adult maxima are 13 cm for males and an estimated 11 cm for females. The locality
      account gives about 12 to 13 cm without a sex split; other sources range from about 10 cm to
      16 cm, so the female number and exact aquarium maxima remain uncertain. The 5 to 8 year
      lifespan range is provisional. A retailer claims 8 to 10 years while an older hobby comment
      claims about three; neither provides a reliable longevity record. A short breeding career
      should not be interpreted as a fixed lifespan."

      min: 10
      max: 13
    confidence: "high"
    rationale: "The settled natural decision is 10 to 13 dGH with waterbody verification. Calcium and
      magnesium surface means in Plisnier (1996, TD/56) calculate to about 11.1 to 11.5 dGH; Cohen
      et al. yield about 12.2 dGH. These measurements underpin the compiled natural envelope.
      Aquarium recommendations, including 8 to 15 and 10 to 25 dGH, are retained as husbandry
      evidence rather than natural lake measurements. All four full-profile runs proposed 10 to 13
      dGH."

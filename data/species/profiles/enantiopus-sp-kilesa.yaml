  husbandry:
    text: "For a six-fish unit, the documented minimum is 300 L with at least a 120 by 50 cm floor. Two
      males and four females have direct species-specific care support. Males may defend a broad
      area containing several spawning pits, so arrange clear sand sections and increase floor space
      if both cannot settle. Recommendations of 500 L and 160 cm, or 200 cm for ten fish, remain
      useful larger options. Maintain filtration, oxygenation and consistent water chemistry. About
      26 C and pH near 8.2 have direct husbandry support. Decided tolerances are 23 to 29 C, pH 7.5
      to 9.4, GH 9 to 20 dGH and KH 10 to 20 dKH, with limited endpoint evidence; they are not
      instructions to fluctuate between extremes."

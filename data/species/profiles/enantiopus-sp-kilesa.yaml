      decision:
        type: "invertivore"
        bloatSensitive: false
        foods:
          - "small crustaceans"
          - "insect larvae"
          - "prepared cichlid food"
      rationale: "The tally retains invertivore with bloatSensitive false, unanimous at 4 of 4 and high
        confidence. Generator, checker-a, checker-b and checker-c all agree on those two components
        while proposing different food lists; the complete decided generator list is retained.
        Kilesa-specific invertebrate feeding and CRC substrate sifting support the type, with
        related FishBase stomach data as context. Imperial Tropicals and Lone Star use omnivore
        labels but emphasize animal foods. A Turkish keeper reports bloat losses after import and
        food changes and recommends plant foods initially; this contradicts claims that no source
        reports bloat, but does not demonstrate a protein-specific predisposition. The fixed false
        flag remains a plausibility concern and does not imply immunity to disease."

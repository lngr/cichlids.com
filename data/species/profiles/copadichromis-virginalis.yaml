profile:
  overview:
    text: "Plan this utaka around a long open swimming lane and a female-biased group. Copadichromis virginalis\
      \ is a Malawi plankton feeder whose breeding males become dark below a conspicuous upper blaze. It is\
      \ comparatively mild toward suitable tankmates, while male courtship still needs space and refuges. The\
      \ name is best anchored to the Kaduna population at Nkhata Bay. Older aquarium labels sometimes include\
      \ fish now assigned to C. mloto or unresolved local forms, so a trade name alone cannot establish identity."
    sources:
      - *id002
      - *id005
  habitat:
    text: "Nkhata Bay provides the confirmed reference population. Manda and Higga Reef have similar pale-blue\
      \ forms that the 2022 study treats as possible geographic variants or sister species. Fish use the water\
      \ above the bottom for feeding and sandy areas beside rock for spawning. Lake chemistry combines alkaline\
      \ pH with relatively low calcium-magnesium hardness: the decided natural intervals are 21 to 29 C, pH\
      \ 7.7 to 8.6, GH 3 to 5 dGH and KH 5 to 8 dKH. These describe the lake across seasons and locations,\
      \ rather than simultaneous measurements at one collection site. Historical southern-arm and Malombe records\
      \ under virginalis require caution because many such fish are now identified as mloto."
    sources:
      - *id001
      - *id002
      - *id009
      - *id010
      - *id008
      - *id011
      - *id013
      - *id014
      - *id005
  sizeAndGrowth:
    text: "Use about 13 cm for a typical adult male and 10.5 cm for the smaller female when planning the group.\
      \ The female figure is an estimate. FishBase reports 13.2 cm total length for male or unsexed fish, whereas\
      \ Seriously Fish reports 13 cm standard length, which excludes the tail; these measurements cannot be\
      \ treated as interchangeable. An older association account gives 17 cm under a broader trade label. Growth\
      \ rate is poorly documented. The provisional lifespan interval is 5.5 to 8 years, supported only weakly\
      \ by one seven-year hobby estimate."
    sources:
      - *id004
      - *id005
      - *id002
      - *id029
      - *id016
      - *id030
      - *id031
  husbandry:
    text: "A small harem needs approximately 304 L with a footprint at least 150 cm long and 45 cm deep. Leave\
      \ most of that length open and provide sand for digging, with stable rocks and sheltered edges to break\
      \ visual contact. Larger groups and mixed communities need additional room. Seriously Fish recommends\
      \ 25 to 29 C; the decided temperature envelope extends to 21 C to include the natural lake interval,\
      \ but continuous keeping at its cool endpoint is not established. The other decided envelopes are pH\
      \ 7.5 to 8.6, GH 3 to 25 dGH and KH 5 to 14 dKH. GH and KH describe different properties; the broad GH\
      \ interval and estimated KH endpoints have low confidence. Stable conditions, oxygenation and effective\
      \ filtration matter more than pushing water toward an uncertain endpoint."
    sources:
      - *id005
      - *id009
      - *id010
      - *id008
      - *id011
      - *id013
      - *id014
      - *id007
      - *id006
      - *id019
      - *id023
      - *id032
      - *id033
      - *id001
      - *id004
      - *id022
      - *id034
      - *id035
      - *id036
      - *id020
      - *id021
  socialBehavior:
    text: "One male with at least three females is the baseline aquarium unit. Shoaling and a breeding hierarchy\
      \ coexist: the male establishes a courtship site while females need routes and shelters that let them\
      \ disengage. A larger aquarium can accommodate additional males with more females and separated sites.\
      \ The association account favours several males for breeding and describes such a group in a much larger\
      \ tank; that is useful experience rather than proof that a smaller harem cannot breed. Persistent pursuit\
      \ is a reason to reassess space and group composition."
    sources:
      - *id005
      - *id022
      - *id017
      - *id024
      - *id007
      - *id006
  diet:
    text: "Offer small animal foods suited to a plankton-feeding mouth, with a varied prepared diet and appropriately\
      \ sized live or frozen invertebrates. Captive guidance also includes some plant material. The invertivore\
      \ classification describes the main natural food rather than a demand for an exclusively animal ration.\
      \ The sources do not identify a special high-protein bloat sensitivity for this species. Allow every\
      \ fish access to food and adjust portions to avoid uneaten waste."
    sources:
      - *id002
      - *id005
  breeding:
    text: "Females provide mouthbrooding care after spawning at a male-held site. A male works a shallow sand\
      \ depression near an overhanging or adjacent rock and courts passing females. Eggs are collected during\
      \ spawning and develop in the female's mouth; the care account reports release after roughly three to\
      \ four weeks. A brooding female needs a quiet refuge from renewed courtship. Community spawning is possible,\
      \ although fry survival is less predictable. Published seasonal dates differ across labels and populations,\
      \ so they are not treated as a fixed aquarium schedule."
    sources:
      - *id005
      - *id022
      - *id002
  sexing:
    text: "Mature males are larger and develop longer fins and stronger colour than females. At Nkhata Bay\
      \ the upper blaze is yellow over a dark grey body, with a thin dark band at the dorsal-fin base that\
      \ rises near the rear. Some related locality populations show pale blue instead of yellow; occasional\
      \ white edging is also reported. Females remain silvery. Older care pages describe a red dorsal band,\
      \ but that is not a universal diagnostic for the revised species. Juveniles and subordinate males are\
      \ harder to sex reliably by colour."
    sources:
      - *id002
      - *id005
      - *id015
      - *id024
      - *id006
      - *id007
  compatibility:
    text: "Calm Malawi haps and suitable peacocks are the most plausible companions; Seriously Fish names Aulonocara\
      \ and Cyrtocara moorii. Such examples still need an aquarium sized for the entire adult community. Boisterous\
      \ mbuna can dominate this comparatively mild fish, while similarly coloured males may attract rivalry.\
      \ The presumed copadichromis group carries a genus-wide crossing caution. It rests on a specialist husbandry\
      \ warning rather than verified free-choice crosses between all named species, and applies independently\
      \ of whether two fish seem behaviourally peaceful."
    sources:
      - *id005
      - *id006
  problems:
    text: A short aquarium or too few females can turn ordinary courtship into repeated harassment. Heavy rockwork
      that blocks the swimming lane also reduces usable space. Uncertain locality labels create an identification
      problem because older virginalis accounts can include mloto and unresolved relatives. Large changes in
      water chemistry add avoidable stress; the broad tolerance values do not justify abrupt changes. Check
      that all group members feed and that females can leave the male's immediate spawning area. The retrieved
      forum archive posts are stocking discussions and establish neither numeric tolerances nor a verified
      husbandry outcome.
    sources:
      - *id005
      - *id002
      - *id009
      - *id010
      - *id008
      - *id011
      - *id013
      - *id014

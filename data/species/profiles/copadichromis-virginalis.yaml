        \ confidence. Seriously Fish gives 25 to 29 C, Cichlid-Forum about 25.6 to 27.8 C, Fishipedia 23 to\
        \ 28 C and Cichlid Atlas 24 to 28 C. The lower endpoint is extended to contain the required natural\
        \ lake range, so equality with the habitat interval is a containment result rather than evidence of\
        \ harm immediately outside it or proof of a preferred year-round 21 C setting. AquariumPro also advertises\

  ghDgh:
    value:
      min: 3
      max: 5
    confidence: high
    rationale: "The settled natural decision is 3 to 5 dGH with high confidence. Historical calcium and magnesium\
      \ measurements compiled by FAO calculate to about 3.2 to 4.9 dGH, and the northern-basin profiles of\
      \ Branchu and colleagues give about 4.2 to 4.6 dGH. Alkaline pH therefore does not imply high calcium-magnesium\
      \ hardness. Seriously Fish gives a wider and higher 10 to 25 dGH aquarium range, which is retained as\
      \ husbandry evidence rather than habitat chemistry."
    sources:

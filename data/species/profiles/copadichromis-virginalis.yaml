variants:
  - name: Nkhata Bay (Kaduna)
    kind: locality
    note: The type-locality reference population; mature males develop a yellow upper blaze.
  - name: Manda
    kind: locality
    note: Pale-blue virginalis-like population; the 2022 study leaves its status as a geographic variant or
      a separate sister species open.
  - name: Higga Reef
    kind: locality
    note: Pale-blue virginalis-like population; its exact boundary relative to type-locality virginalis remains
      unresolved.
  - name: Gold Nkanda
    kind: color-morph
    note: Trade label retained for identification context. The 2022 study leaves its species assignment unresolved;
      it is not a confirmed colour morph of true virginalis.

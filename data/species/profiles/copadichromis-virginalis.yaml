            max: 12
        - by: tiebreaker-2
          value:
            min: 5
            max: 15
      decision:
        min: 5
        max: 14
      rationale: "Generator, checker-b and tiebreaker-1 propose 5 to 12 dKH; checker-a and tiebreaker-2 propose\
        \ 5 to 15 dKH; checker-c proposes 5 to 20 dKH. With no qualified majority among six votes, the tally\
        \ uses the endpoint medians: 5 and 13.5, with the upper endpoint rounded to 14 dKH. Verification remains\
        \ median with three agreeing votes out of six and low confidence. The range contains the natural 5\
        \ to 8 dKH. JBL gives a general Malawi target of 5 to 10 dKH, Malawi.si gives 6 to 12, a hobby forum\
        \ discusses approximately 12, and OATA gives 10 to 15. The wider OATA upper value of 15 is retained\
        \ in evidence; the decided 14 is a rounded synthesis, not a demonstrated failure threshold. No read\
        \ source supplies a species-specific long-term KH trial or substantiates the 20 dKH proposal. Seriously\
        \ Fish gives pH and GH but no KH range, Seachem discusses buffering without endpoints, and the Malawi-Guru\
        \ GH/KH example is not a species tolerance. GH is not converted into KH. The cichlids.com archive hits\
        \ contain stocking discussions without KH evidence; the JBL test-product URL provides no usable numeric\
        \ advice."

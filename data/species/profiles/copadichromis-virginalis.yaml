  note: "Copadichromis virginalis is valid in the Catalog of Fishes; Haplochromis virginalis is its original\
    \ combination. Turner and colleagues (2022) identify the holotype-associated Kaduna form as virginalis\
    \ and the Kajose component of the original type series as C. mloto. FishBase still treats Kajose as awaiting\
    \ description; that older remark is superseded by the revision. C. cyaneus and C. ilesi remain separate\
    \ valid species here because proposed synonymies have not been adopted. The original-genus catalog was\
    \ also checked on 2026-10-13 at https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Haplochromis\
    \ (archive researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-873e9721/2026-10-14T094822Z)."
names:

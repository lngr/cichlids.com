  temperatureC:
    value:
      min: 21
      max: 29
    confidence: high
    rationale: The settled waterbody decision is 21 to 29 C with high confidence. Eccles documents seasonal
      inshore cooling to 21 C in the southeast arm and upper waters near 27 C; Vollmer and colleagues describe
      warmer summer surfaces and cooler winter mixing. The broad interval is the prescribed lake-wide synthesis
      rather than a measured range for one northern population. The Ngochera repository abstract supports seasonal
      lake variation but supplies no numeric endpoints; the Eccles publisher page was inaccessible and only
      its literature-search abstract was read. Care recommendations are retained separately and do not replace
      natural lake values.

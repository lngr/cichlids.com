  diet:
    value:
      type: aufwuchs
      bloatSensitive: true
      foods:
        - spirulina flakes and pellets
        - blanched spinach and other soft vegetables
        - algae wafers
        - small crustaceans such as Mysis, sparingly
    confidence: high
    verification:
      method: unanimous
      votes: {agree: 3, total: 3}
    rationale: >-
      All three votes gave aufwuchs with bloat sensitivity. In the wild the species takes
      phytoplankton above the reef while territorial males graze the algal cover of the rocks
      (FishBase), and the Cichlid Room Companion confirms algae combing and plankton feeding.
      Genner and Turner (2005) describe the zebra group of mbuna as combers of rock algae that also
      use plankton. Seriously Fish asks for vegetable matter as a large share of the diet, and
      Fishkeeper wants a mainly vegetarian diet and warns that food rich in animal protein can cause
      Malawi bloat. The plant-based, low-protein requirement fits the aufwuchs class even though
      much of the natural food is phytoplankton. The Riverpark retail notes call the species an
      omnivore and suggest bloodworms; they stand alone against the other sources.
    sources:
      - *fb
      - *gt
      - *sf
      - *fk
      - *crc
      - *rp
    evidence:
      - source: *fb

    confidence: high
    rationale: >-
      Endemic to Lake Malawi with a very small range in the southeastern arm. The Catalog of
      Fishes gives Makokola as type locality, FishBase and Seriously Fish restrict the species to
      the Makokola area, and the Fishkeeper data bank adds the reef at Crocodile Rocks south of
      Boadzulu Island. The inputs name this second site Crocodile Reef or Crocodile Rocks; both
      mean the same place. FishBase reports the IUCN assessment of 2018 as Near Threatened because
      of the small range; Fishkeeper still calls the species Vulnerable, which is an older status,
      and one checker followed it.

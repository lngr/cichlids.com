  temperatureC:
    value: {min: 21, max: 29}
    confidence: high
    verification:
      method: waterbody
      waterbody: lake-malawi
    rationale: >-
      The species is a Lake Malawi endemic, so the natural range is the measured lake range. Eccles
      (1974) found about 21 C inshore in the southeastern arm during the cool, windy season and 27 C
      in the upper 60 m in May; Vollmer et al. (2005) give winter epilimnion values of about 23.5 C
      and summer surface water of about 28 C; a 2013 campaign (Ngochera 2018) measured 24 to 29 C.
      FishBase lists 24 to 26 C, which is an aquarium figure and not a habitat measurement. All
      three votes gave the lake range.

        votes: {agree: 4, total: 5}
      rationale: >-
        Four of five votes (checker-a, checker-b, tiebreaker-1, tiebreaker-2) gave 3 to 20 dGH; the
        generator proposed 3 to 25 dGH. The lower bound is the soft lake water itself, in which the
        species lives. For the upper bound Seriously Fish gives 10 to 25 dGH, the Fishkeeper data
        bank up to 20 degrees German hardness, the OATA care sheet for Malawi cichlids in general 12
        to 18 dGH and a retailer care guide 10 to 20 dGH; only Seriously Fish goes beyond 20, so 20
        dGH is the limit that most sources support. No source reports harm from hard water inside
        this span.

  khDkh:
    value: {min: 5, max: 8}
    confidence: high
    rationale: >-
      Lake Malawi endemic; the natural range is the lake value. Alkalinity of 2.33 to 2.46 meq/L
      (Branchu et al. 2010) and 2.00 to 2.59 meq/L (Jackson et al. 1963 in the FAO compilation)
      converts to about 5.6 to 7.3 dKH. Sodium balances part of the bicarbonate, so carbonate
      hardness exceeds total hardness in the lake. All three votes gave the lake range.
    sources: *lakeSources
    evidence:
      - source: *branchu
        value: {min: 6.5, max: 6.9}
        note: from the alkalinity of the upper water column
      - source: *fao
        value: {min: 5.6, max: 7.3}
        note: from the alkalinity after Jackson et al.
    tolerance:
      value: {min: 5, max: 15}
      confidence: low
      verification:
        method: qualified-majority
        votes: {agree: 4, total: 5}
      rationale: >-
        Four of five votes (generator, checker-b, tiebreaker-1, tiebreaker-2) gave 5 to 15 dKH;
        checker-a proposed 5 to 20 dKH from the single hardness figures of Seriously Fish and
        Fishkeeper, which do not separate carbonate from total hardness. No species-specific source
        states a carbonate hardness. The OATA care sheet for Malawi cichlids in general gives 10 to
        15 dKH, and the LiveAquaria sheets for the congeners M. estherae and M. callainos give the
        same span. The lower bound is the measured lake value. Confidence is low because the upper
        bound rests on group-level and congener figures only; a stable buffer matters more than
        the exact number, because it keeps the pH from falling.

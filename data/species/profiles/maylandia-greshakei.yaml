      waterbody: lake-malawi
    rationale: >-
      Lake Malawi endemic; the natural range is the lake value. Calcium and magnesium in the upper
      50 m of the north basin give about 4.2 to 4.6 dGH (Branchu et al. 2010), and the titrations of
      the 1960s compiled by FAO give 3.2 to 4.9 dGH. The lake is soft water; care sheets that call
      it hard describe aquarium practice and confuse hardness with alkalinity. All three votes gave
      the lake range.
    sources: *lakeSources

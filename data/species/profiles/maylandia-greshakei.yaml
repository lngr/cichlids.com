  synonyms:
    - name: Pseudotropheus greshakei
      note: Original combination of Meyer and Förster (1984); type locality Makokola in the southeastern arm of Lake Malawi.
    - name: Metriaclima greshakei
      note: Combination used by Stauffer et al. (1997), later revisions and the Cichlid Room Companion, by authors who regard Maylandia as unavailable.
  legacyNames:
    - Pseudotropheus greshakei
  note: >-
    The Catalog of Fishes lists the species as valid in Maylandia and treats Metriaclima as a
    later name for the same genus; the species is the type species of Maylandia. The Pseudotropheus
    and Metriaclima queries hold no separate valid entry for greshakei. The genus name stays
    disputed: Konings, Geerts and Stauffer (2026, Taxonomy 6(1), 3, doi 10.3390/taxonomy6010003,
    known from its bibliographic record) hold that Maylandia is a nomen nudum and use Metriaclima,
    as does the Cichlid Room Companion. Both names denote the same species; this profile follows
    the Catalog of Fishes. The legacy name Pseudotropheus greshakei is not a separate species.

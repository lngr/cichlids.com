partners:
  suitable:
    - species: Labidochromis caeruleus
      reason: Yellow mbuna of a different genus, hybrid group and body shape, so the blue males do not treat it as a rival; it shares the water values and holds its own in a mixed mbuna tank.
      condition: Feed both a plant-based staple, because the yellow lab takes more animal food in the wild.
    - species: Iodotropheus sprengerae
      reason: Rust-brown mbuna of moderate size with a plant-based diet; its colour and shape differ clearly from the ice-blue males.
    - species: Pseudotropheus crabro
      reason: Robust mbuna with yellow and brown bars that stands up to territorial Maylandia males and needs the same water.
      condition: Tank of at least 150 cm with plenty of rock, because both species are territorial.
    - species: Synodontis multipunctatus
      reason: Bottom-dwelling catfish that does well in the same hard, alkaline aquarium water and keeps out of the way of the cichlids.
      condition: Keep it in a group; it lays its eggs among the spawn of mouthbrooders, so broods of the cichlids may be lost.
  unsuitable:
    - species: Maylandia callainos
      reason: Same hybrid group and blue colouring; males fight as rivals and the species cross readily.
    - species: Maylandia estherae
      reason: Same hybrid group; the species cross and their females look alike.
    - species: Maylandia lombardoi
      reason: Same hybrid group; its blue-barred females and juveniles resemble greshakei and the species cross.
    - species: Cynotilapia afra
      reason: Blue-barred mbuna whose males fight greshakei males as rivals; it hybridises with M. zebra in the wild.
    - species: Labeotropheus trewavasae
      reason: Its red-topped blue males look similar, which provokes rival fights, and a keeper reports a cross between the two.
    - species: Aulonocara stuartgranti
      reason: Peaceful peacock from sandy habitats that needs more protein; the territorial mbuna males harass it and it loses out at feeding time.
    - species: Copadichromis borleyi
      reason: Calm open-water utaka that suffers from mbuna aggression and needs a more protein-rich diet.
profile:
  overview:
    text: >-
      The red top ice blue zebra, Maylandia greshakei, is a rock-dwelling mbuna from a small
      stretch of the southeastern arm of Lake Malawi. Males are pale icy blue with a bright orange
      dorsal fin, while females are a plain greyish brown with orange hints. The trade still uses
      the older names Pseudotropheus greshakei and Metriaclima greshakei, and an albino line is
      widespread. Almost all fish on sale are captive-bred, which matters because the wild
      population has a very small range and is assessed as Near Threatened. In the aquarium it is a
      robust and attractive fish for a mixed mbuna tank, provided it gets a large rock layout, a
      harem of one male with several females and a plant-based diet. Its males are territorial and
      harsh towards rivals and look-alikes, and it crosses readily with other Maylandia species, so
      tankmates need careful choice.
    sources:
      - *cof
      - *fb
      - *sf
      - *fk
  habitat:
    text: >-
      Wild fish are known only from Makokola Reef and the nearby reef at Crocodile Rocks south of
      Boadzulu Island in the southeastern arm of Lake Malawi. They live in the upper part of rocky
      reefs at about 15 to 35 m, where the stones carry a layer of sediment, close to open water.
      The fish rise from the rocks to feed on plankton, while territorial males stay near the
      stones and graze the algal cover. Lake Malawi water is soft and moderately alkaline: about 21
      to 29 C over the year, pH 7.7 to 8.6, 3 to 5 dGH and 5 to 8 dKH, with sodium bicarbonate
      supplying most of the buffer. In the aquarium the species also does well in harder water, as
      long as the pH stays alkaline and the carbonate buffer is stable.
    sources:
      - *fb
      - *sf
      - *fk
      - *branchu
      - *fao
      - *eccles
  sizeAndGrowth:
    text: >-
      Well-kept males reach about 13.5 cm total length; the reference sizes in FishBase and the
      care sheets lie between 12.5 and 13.5 cm, and exceptionally large aquarium males can reach
      about 15 cm. Females stay smaller, at roughly 10 to 11 cm. Captive-bred males in a laboratory
      study weighed around 100 g at 28 months, so aquarium fish can become quite heavy-bodied. Fish
      fed sparingly on plant-based food grow steadily without becoming fat. With good care a life
      span of about 8 to 10 years is reported.
    sources:
      - *fb
      - *sf
      - *fk
      - *glaser
      - *snell
      - *rp
  husbandry:
    text: >-
      A tank of at least 120 cm and about 200 litres suits one male with three or more females;
      larger tanks make the aggression easier to manage. Build stable piles of rock from the bottom
      glass up to near the surface, with many caves and crevices, and set the stones before adding
      the sand so that digging cannot topple them. Sand is the best substrate. The water should be
      well oxygenated and strongly filtered, with a weekly change of a large share of the volume,
      because these tanks are usually heavily stocked. Keep the temperature between 24 and 28 C and
      the pH between 7.5 and 8.8; a general hardness up to about 20 dGH and a carbonate hardness of
      roughly 5 to 15 dKH work well, and the carbonate buffer matters most because it holds the pH
      steady. Live plants are usually eaten or uprooted.
    sources:
      - *sf
      - *fk
      - *rp
      - *oata
  socialBehavior:
    text: >-
      Males hold a territory around a rock or cave and defend it against rival males all year, not
      only while breeding. They chase females persistently when courting, so a male needs at least
      three females to spread his attention; a lone female can be harassed to death. Two males in
      one tank work only in large setups with many visual barriers. Towards other species the
      males are clearly aggressive, most of all towards fish of similar shape or colour. A crowded
      mbuna tank with several species of different appearance helps, because the aggression is
      shared out and no single fish becomes the only target.
    sources:
      - *sf
      - *fk
      - *rp
      - *gt
  diet:
    text: >-
      In the lake the species feeds on phytoplankton above the reef and on the algal cover of the
      rocks. In the aquarium the staple should be a spirulina-based flake or small pellet made for
      mbuna, together with soft vegetables such as blanched spinach, peas or cucumber. Small
      crustaceans such as Mysis can be offered now and then as a treat. Avoid regular feeding of
      bloodworms, beef heart and protein-rich pellets, because they promote intestinal problems
      and bloat. Feed small portions two or three times a day rather than one large meal, since the
      fish eat greedily and leftovers spoil the water.
    sources:
      - *fb
      - *sf
      - *fk
      - *gt
  breeding:
    text: >-
      Maylandia greshakei is a maternal mouthbrooder and breeds readily in a well-run tank. The
      male cleans a flat stone or digs a shallow pit, turns almost white in breeding colour and
      leads ready females to the site. The female lays a few eggs at a time and takes them into her
      mouth at once; fertilisation follows when she nips at the egg spots on the male's anal fin
      while he releases sperm. She then carries the brood for about three to four weeks without
      eating, and a large female can hold up to about sixty young. The fry eat brine shrimp
      nauplii and crushed flakes from the start. Stressed females may spit out or swallow the
      brood, so move them only with care and preferably late in the brooding period.
    sources:
      - *sf
      - *fk
      - *gt
  sexing:
    text: >-
      Adult males are easy to recognise by their pale blue body and the bright orange dorsal fin;
      females are greyish brown with orange-tinted fins and look much plainer. Males also grow
      larger and carry more distinct egg spots on the anal fin. Juveniles look alike and develop
      the adult colours as they mature. Females can be confused with females of other Maylandia
      species, which is one reason why different Maylandia should not share a tank.
    sources:
      - *sf
      - *fk
      - &ar49563
        kind: archive
        title: cichlids.com forum thread 49563
        url: https://www.cichlids.com/disc/read.php?2,49563
  compatibility:
    text: >-
      This species belongs in a Lake Malawi mbuna tank. Good companions are robust mbuna of other
      genera that look clearly different, such as the yellow Labidochromis caeruleus, the rust-brown
      Iodotropheus sprengerae or, in larger tanks, Pseudotropheus crabro. Do not combine it with
      other Maylandia, because they cross readily, or with Cynotilapia afra, whose blue males fight
      as rivals. Avoid fish with a similar red-topped blue pattern, such as Labeotropheus
      trewavasae. Peaceful haplochromines such as peacocks (Aulonocara) and utaka (Copadichromis)
      suffer from the constant pressure and need a richer diet that does not suit mbuna. Fry and
      very small fish may be eaten when the chance arises, and fish from soft-water habitats do not
      match its water needs.
    sources:
      - *sf
      - *fk
      - *rp
      - *gt
      - *ar60069
  problems:
    text: >-
      The most common problem is Malawi bloat, a serious intestinal disease linked to protein-rich
      food, overfeeding and poor water quality; a plant-based diet and regular water changes are
      the best protection. Keeping a male with too few females, or several males in a small tank,
      leads to torn fins and stressed, hiding fish. Because Maylandia species cross readily, buy
      from breeders who keep the species pure. In poorly buffered water the pH can drift down
      over time, which stresses the fish, and heavy stocking quickly raises nitrate. Loose rock
      structures may collapse when the fish dig underneath. Holding females can be harassed or
      lose their brood, so watch them closely, and seek advice from an experienced keeper or a
      veterinarian when fish stop eating or swell.
    sources:
      - *fk
      - *sf
      - &ar39721
        kind: archive
        title: cichlids.com forum thread 39721
        url: https://www.cichlids.com/disc/read.php?2,39721

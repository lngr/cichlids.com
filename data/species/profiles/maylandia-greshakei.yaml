  predation:
    value: 1
    confidence: low
    verification:
      method: conservative
      votes: {agree: 3, total: 5}
    rationale: >-
      The votes did not settle: generator and checker-a proposed level 1, checker-b, tiebreaker-1
      and tiebreaker-2 level 0. Level 0 reached three of five votes, one short of the qualified
      majority, so the conservative rule applies and takes the highest proposed level, 1. Every
      species-specific source describes a plankton and aufwuchs feeder without fish in the diet:
      FishBase lists phytoplankton as the only natural food item, territorial males graze the rock
      cover, the Cichlid Room Companion classes the species as algae comber and planktivore, and
      Seriously Fish and Fishkeeper ask for a mainly vegetable diet. Level 1 rests on group-level
      statements: Genner and Turner (2005) count fish fry among the foods of mbuna, and the OATA
      care sheet notes that only some fry survive in a mixed Malawi tank. The fry remark of
      Seriously Fish concerns stressed holding females that spit or swallow their own brood, not
      predation on other fish. Level 1 is the cautious value for the compatibility check; with
      the threshold of 2 cm it affects only fry and the smallest tankmates.

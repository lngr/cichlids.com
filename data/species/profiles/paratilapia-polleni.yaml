  ph:
    value: &a34
      min: 5
      max: 7.5
    confidence: low
    rationale: "Five of six votes support 5 to 7.5. Loiselle reports acidic northern streams at 5 to 6
      with photograph-based local reports of Paratilapia in deeper water, and western northern
      floodplain waters at 6.5 to 7.2 including an Ifasy lake with collected fish. Ramena reaches
      7.5. Ravelobe measurements of 5.5 to 6.8 and historical Alaotra data add regional context
      without resolving the lineage. The killifish summary repeats the same northern sampling. The
      interval is therefore provisional despite qualified majority; laboratory or care-sheet pH is
      not substituted for habitat measurements. Proposals were generator: 5 to 7.5; checker-a: 6 to
      7.5; checker-b: 5 to 7.5; checker-c: 5 to 7.5; tiebreaker-1: 5 to 7.5; tiebreaker-2: 5 to

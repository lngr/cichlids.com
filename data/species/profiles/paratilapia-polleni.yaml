  synonyms:
    - name: Paratilapia bleekeri
      note: "Sauvage, 1891. Catalog synonym; historical large-spot trade usage does not prove parental
        identity."
    - name: Paracara typus
      note: "Bleeker, 1878. Catalog synonym, not an accepted name for a separate eastern species."
  legacyNames:
    - Paratilapia polleni
  note: "The Catalog retains polleni as the valid described name and treats bleekeri and Paracara
    typus as synonyms. The operational profile scope is the northern large-spotted lineage called
    polleni sensu stricto in the 2018 COI study. Eastern Paratilapia sp. small spot, also called
    smallspots East or East Coast Small Spots, is treated separately as undescribed; a distinct Nosy
    Be lineage is also reported. These genetic distinctions are not formal species descriptions.
    Seriously Fish reverses older spot-based assignments, and Williams discusses names not accepted
    by the Catalog. Spot size or a shop label cannot establish identity. FishBase lists Vulnerable
    (VU), B1ab(iii), assessed on 24 June 2016 in its 2025-2 metadata. This is a 2016 assessment
    under the database name, not a new assessment in 2026 or a separate assessment of each
    undescribed lineage; the primary IUCN assessment text was not independently read."

  khDkh:
    value: &a36
      min: 0
      max: 4
    confidence: low
    rationale: "All four available natural-KH proposals agree within the two-degree threshold, so the
      tally takes the medians and rounds to 0 to 4 dKH; this plain natural fact carries no
      verification object. Direct northern carbonate-hardness titrations are below 18 and 36 to 71.6
      mg/L as CaCO3, approximately below 1.01 and 2.02 to 4.01 dKH. Zero is a reporting bound for
      censored low alkalinity. The wider 2 to 11 dKH database summary mixes mainland and Nosy Be
      stations. Historical Alaotra SBV 1.49 is about 4.17 dKH only if its unstated unit follows the
      meq/L convention; it is retained as an inference rather than controlling the range. The carbon
      study measures DIC and alkalinity separately, so its DIC cannot be substituted directly for
      KH. No KH is inferred from GH, conductivity or pH. Proposals were generator: 0 to 4;
      checker-a: 1 to 6; checker-b: 0 to 4.2; checker-c: 0 to 4.1."
    sources:
      - *a4
      - *a6
      - kind: literature
        title: "Biogeochemical functioning of Lake Alaotra (Madagascar): a reset of aquatic carbon sources
          along the land-ocean aquatic continuum"
        url: "https://doi.org/10.5194/bg-22-2403-2025"
        accessed: 2026-10-13
      - *a17
    evidence:
      - source: *a4
        value:
          min: 0
          max: 4.01
        note: Northern field titrations converted with 17.848 mg/L as CaCO3 per German degree. The lower
          bound is censored below approximately 1.01 degrees; zero was not measured.
      - source: *a6
        value:
          min: 2
          max: 11
        note: Derivative mixed-station field range; its island maximum is excluded from northern species
          attribution.
      - source: *a17
        value:
          min: 4.17
          max: 4.17
        note: SBV 1.49 at Lake Alaotra converted only under the assumed historical meq/L convention;
          uncertain unit and lineage.
    tolerance:
      value: &a40
        min: 0
        max: 10
      confidence: low
      rationale: "Five of six proposals support 0 to 10 dKH. Tropical Treasures and NageoireBleue list 4
        to 10, while The Fish Collection lists 3 to 10; these are retailer recommendations with

  ghDgh:
    value: &a35
      min: 0
      max: 4
    confidence: low
    rationale: "Five agreeing votes emphasize measured northern water. Their median upper bound is
      rounded by the tally from 4.1 to 4 dGH. Loiselle reports below 18 mg/L and 36 to 71.6 mg/L as
      CaCO3, approximately below 1.01 and 2.02 to 4.01 dGH. Zero encodes the unknown lower endpoint
      of a censored measurement. The broader 2 to 15 dGH database summary includes a Nosy Be creek
      without syntopic cichlids; that maximum does not define polleni habitat. FishBase supplies
      only an unlocalized maximum of 10 dGH, not a 1 to 10 measured interval. The Itasy abstract
      reports very soft survey water but unresolved Paratilapia sp. These records do not establish
      two independent hardness series for confirmed northern polleni. Proposals were generator: 0 to
      4; checker-a: 1 to 10; checker-b: 0 to 4.1; checker-c: 0 to 4.1; tiebreaker-1: 0 to 4.1;
      tiebreaker-2: 0 to 4.1."

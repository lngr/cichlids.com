  temperatureC:
    value: &a33
      min: 25
      max: 28
    confidence: low
    rationale: "The tally uses the median of all six proposed lower and upper bounds because no
      candidate secured four agreeing votes. Rounded to whole degrees, this yields 25 to 28 C with
      low confidence. Loiselle measured 25.2 and 26.6 C at northern regional stations; occurrence of
      identified polleni at each thermometer station is unconfirmed. The 28 C Salehy measurement has
      captured historical polleni but may belong to the eastern small-spot lineage. The broader 25.2
      to 27.8 C killifish habitat summary includes Nosy Be, and the Alaotra study has surface means
      from 25.7 to around 30 C plus a 41.3 C shallow-water extreme. Those wider datasets concern
      unresolved stocks or regional conditions, not a confirmed seasonal range of northern polleni.
      The 12 to 40 C survival accounts are not used as typical habitat endpoints. FishBase 24 to 28
      C derives from an aquarium atlas. Ravelobe and the Itasy abstract corroborate warm waters
      without verifying the endpoints or modern species identity; the Itasy full text was
      unavailable through fetch-oa. Proposals were generator: 25.2 to 26.6; checker-a: 24 to 30;
      checker-b: 25 to 28; checker-c: 25.2 to 27.8; tiebreaker-1: 25.2 to 28; tiebreaker-2: 25.2 to
      26.6."

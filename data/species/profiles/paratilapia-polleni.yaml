        marginal vegetation, while Williams describes hunting away from cover in the upper water
        column. Retain openWater to provide hunting and swimming space. Wood is a shelter
        requirement supported by husbandry and older collected habitats; cover descriptions from
        other northern sites are regional proxies. Rocks can be used as decor without establishing
        an essential rock habitat."

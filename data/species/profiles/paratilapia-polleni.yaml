      confidence: low
      rationale: "The tally applies the conservative intersection of all six proposals: the highest lower
        endpoint is 23 and the lowest upper endpoint is 28 C. This already contains the decided
        natural interval. There were only three agreeing votes around the leading candidate, so low
        confidence is mandatory. FishFish and Aqua-Fish support 23 to 28 C. Seriously Fish lists the
        wider 17 to 28 C band but prefers approximately 22 to 27 C, and the 1992 study kept eastern
        historical stock for about two years at 28 to 30 C. Neither colder routine limits nor 30 C
        can be transferred confidently to every northern stock. The culture paper recommends 22 to
        28 C for unidentified Paratilapia sp.; Williams advises at least 26 C. Routine 26 to 27 C
        sits within these overlapping recommendations. Proposals were generator: 23 to 28;

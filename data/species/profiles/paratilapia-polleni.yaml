profile:
  overview:
    text: "Paratilapia polleni is a large Malagasy cichlid whose dark adult body carries reflective
      spotting. This profile follows the northern large-spotted lineage, while eastern fish traded
      as small spot are treated as a separate undescribed taxon. The Catalog retains one valid
      described name, and identification in commerce remains uncertain. FishBase reports Vulnerable
      with a 2016 assessment date. Maintain locality and parentage records when breeding so that a
      generic trade name does not erase the identity of the stock."
    sources:
      - *a1
      - *a2
      - *a3
      - *a10
      - *a28
  habitat:
    text: "Northern collecting accounts describe river drainages and shallow floodplain lakes, with
      sandy or clay bottoms, organic debris and marginal vegetation. Shelter and open hunting space
      both matter in an aquarium. Natural water values are provisional sampled envelopes, because
      some fish records came from local informants and several measurement stations lack modern
      lineage identification. The decided 25 to 28 C interval also incorporates the uncertainty of
      an older eastern collection. The low GH and KH floor represents below-detection reporting, not
      measured mineral-free water."
    sources:
      - *a4
      - *a5
      - *a2
      - *a6
  sizeAndGrowth:
    text: "Allow for a male around 30 cm and a female around 25 cm when planning the adult aquarium.
      Other sources give smaller females, and actual growth depends on origin and individuals. Young
      fish may take years to reach their full size, so a small juvenile does not reduce the eventual
      space requirement. The 10 to 15 year lifespan is a low-confidence planning estimate rather
      than a measured survival curve."
    sources:
      - *a12
      - *a10
      - *a5
      - *a24
      - *a29
  husbandry:
    text: >-
      For one established pair, provide at least 360 litres with a base about 150 by 47.5 cm and
      a workable divider or separate aquarium. Published minima vary substantially, and the
      Nordic register recommends 700 litres and 200 cm. Build secure refuges and visual barriers
      with wood, pots or stable rocks over smooth substrate. Combine effective filtration with
      oxygenation and regular water replacement matched to the existing chemistry. A steady 26
      to 27 C is a practical target within the decided 23 to 28 C tolerance. Near-neutral pH and
      modest mineral content have better aquarium support than the provisional low endpoints;
      the tolerance envelope is not a set of targets.
    sources:
      - *a15
      - *a18
      - *a14
      - *a10
      - *a24
      - *a12
  socialBehavior:
    text: "A naturally compatible pair is the planned adult unit; an unpaired fish can live alone.
      Juvenile groups need separate accommodation once territories and pairs develop. Rival males
      are poor companions, and a previously settled pair can still require separation after spawning
      or a change in behavior. Provide a refuge that the pursued fish can use and monitor meals,
      hiding and injuries. The high conspecific aggression grade reflects the possibility of severe
      partner harm and the need for intervention, rather than constant violence in every pair."
    sources:
      - *a15
      - *a18
      - *a10
      - *a5
  diet:
    text: "Use a complete formulated cichlid food with varied suitable animal foods such as aquatic
      larvae, crustaceans and worms. The decided diet is invertivore, although fish remain potential
      prey and some hobby accounts describe adults as mainly fish eaters. The detailed biological
      studies concern eastern or unresolved stocks, which limits certainty about proportions in
      northern polleni. Natural prey records including tadpoles and small fish are not a requirement
      to supply those animals in an aquarium; live feeder fish are unnecessary. Feed portions that
      both partners can reach, and avoid treating the false bloat-sensitivity flag as protection
      from poor feeding or digestive disease."
    sources:
      - *a5
      - *a11
      - *a15
      - *a10
      - *a14
  breeding:
    text: "Spawning occurs at a protected substrate site. Filaments connect the eggs into a mass that
      can be moved within the nesting area, rather than a fixed adhesive plaque. The female tends
      the eggs while the male largely patrols nearby; both can defend swimming young. Nest cover
      does not make this an obligatory cave spawner, and retrieving young with the mouth is not
      mouth incubation. Separate grow-out space and suitable fine fry foods are needed as the young
      develop, and their parents' provenance should remain attached to the brood."
    sources:
      - *a5
      - *a11
      - *a15
      - *a10
  sexing:
    text: "Adult males usually become larger and develop longer dorsal and anal fin extensions; some
      also develop a forehead bulge. Those differences are less useful in small juveniles. Breeding
      condition and lineage alter coloration, so darkening or the brightness of spots cannot
      reliably identify sex. A documented breeding pair is more dependable than selecting two shop
      fish by size alone. Spot size is also an unreliable shortcut to lineage identity."
    sources:
      - *a15
      - *a5
      - *a11
      - *a10
      - *a2
  compatibility:
    text: "The fish can share a sufficiently large aquarium with selected similarly sized robust
      companions, but breeding defense can disrupt a settled community. Paretroplus damii is
      explicitly suggested by a specialist care sheet; its group and space requirements still apply.
      Small fish are prey-sized, even if a retailer lists them as companions. The two-member hybrid
      group creates a presumed mixing caution for polleni and eastern small spot, based on a general
      crossing warning and close relationship rather than verified parentage. A dedicated tank with
      known-provenance stock is more predictable than a crowded display."
    sources:
      - *a15
      - *a27
      - *a10
      - *a2
      - *a28
  problems:
    text: "The main husbandry concerns are partner injuries, crowding and unstable or degraded water.
      Very low KH provides little buffering, so the encoded zero floor should not be pursued as a
      target. Digging may disturb rooted plants and unsecured furnishings. Published accounts
      mention velvet and white-spot problems, but those reports do not justify copying treatment
      recipes or diagnosing every loss of appetite as infection. The archive includes a planted
      community at pH 6 with problematic nitrate conditions; it is practical context, not evidence
      that such water quality or the full tolerance endpoints are safe for years."
    sources:
      - *a15
      - *a10
      - *a18
      - *a20
      - *a30

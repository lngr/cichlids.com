      scope supported by the 2018 lineage analysis. Generator and checker-c focus on northern
      populations; checker-a also includes Alaotra, Salehy and Nosy Be, and checker-b includes
      eastern historical records. The Catalog itself gives an eastern distribution alongside a
      northern type locality. That unresolved difference prevents treating all historical localities

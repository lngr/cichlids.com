      decision: *a45
      rationale: >-
        Generator proposed 500 L, 180 cm length and 60 cm depth; checker-a proposed 205 L, 120
        cm length and 45 cm depth; checker-b proposed 400 L, 150 cm length and 50 cm depth;
        checker-c proposed 320 L, 150 cm length and 45 cm depth. The component medians are 360
        L, 150 cm length and 47.5 cm depth. The unit is one established adult pair. Seriously
        Fish gives a compatible-pair example of about 205 L on a 120 by 45 cm base and prefers
        about 150 cm for breeding. The medium-trust Fishkeeping pair recommendation is 320 L
        with a 152.4 by 45.72 cm base. These support the component medians of 360 L, 150 cm
        length and 47.5 cm depth as a provisional pair plan. Tropical Treasures Wyo gives 125 US
        gallons, about 473 L, for a breeding pair without dimensions; NageoireBleue gives 400 L
        for a single adult or pair. The Nordic register gives 700 L and 200 cm without defining
        the adult unit. Neither the lower-trust 473 L recommendation nor the unit-unspecified
        700 L figure establishes a 500 L, 180 by 60 cm requirement for this pair. Maintain
        separate refuges and a divider; additional adult species require more space.

  ph:
    value: {min: 5.0, max: 7.5}
    confidence: low
    rationale: >-
      The vote did not settle this value, so it is decided by the median rule like a conservative
      decision: the generator, checker-a and tiebreaker-1 proposed pH 5.0 to 7.5, checker-b 5.5 to
      7.0 and checker-c 4.5 to 7.5. Only three of the five votes agree within 0.3 pH, one short of a
      qualified majority, so the range is the median of all five minima (4.5, 5.0, 5.0, 5.0 and 5.5
      give 5.0) and of all five maxima (7.0, 7.5, 7.5, 7.5 and 7.5 give 7.5), with low confidence.
      The species lives in several Amazonian water types. At capture sites in the Igarapé Fortaleza
      basin the pH was 6.5 ± 0.9, with 6.2 to 7.5 on the floodplain and 6.4 to 6.9 in the main
      channel; várzea lakes of the lower Solimões averaged 5.5 to 6.75, and Lake Catalão, where the
      species was caught, ranged from 5.86 to 7.47 over a year. Wild fish for a physiological study
      came from upper Rio Negro blackwater, whose usual pH the paper gives as 5 to 6. The sources
      span a wider pH 4.0 to 7.5: reviews of Amazonian water chemistry put typical Rio Negro
      blackwater at pH 4 to 5.5, and a spatial gradient in Lake Catalão reaches down to 4.5, so
      blackwater populations may live somewhat below the decided lower bound; these are water-type
      values, not angelfish sites. A collecting paper from the middle Rio Negro prints a pH of 1.5
      to 2.7, which contradicts its own conductivity and is not used. FishBase gives 6.0 to 8.0,
      which reads as a keeping range; no field value above 7.5 was found.

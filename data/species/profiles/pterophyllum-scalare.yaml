  aggressionConspecific:
    value: 2
    confidence: medium
    rationale: >-
      All four runs chose level 2. Groups of young angelfish form a ranking with chasing and fin
      displays, and pairs that form within the group defend their spawning site against the other
      angelfish (Seriously Fish, AquaInfo, AquaExperience). Behavioural studies describe breeding
      males as very aggressive while they set up a territory and pairs that attack intruders during
      the breeding cycle but not between cycles. In a tall, roomy tank with cover injuries are rare;
      crowding or forcing two unbonded adults together leads to persistent harassment.

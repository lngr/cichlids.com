        Decided by a qualified majority of four of five votes: the generator, checker-c and
        tiebreaker-1 proposed 24 to 30 °C and checker-a 24 to 31 °C, which agrees within 1 °C;
        checker-b proposed 22 to 30 °C. Seriously Fish, Practical Fishkeeping, FishBase, Tropical
        Fish Hobbyist and the Fishkeeping.co.uk care sheet all give 24 to 30 °C, and a breeder's
        article checked on the Cichlid Room Companion agrees. AquaInfo stays at 24 to 27 °C and an
        Aqualog sheet for wild fish from Guyana at 24 to 29 °C. Captive juveniles grew best at 26 to
        27.6 °C, and eggs are incubated at about 28 °C. The sources span a wider 22 to 31 °C: an
        Aqualog sheet for a captive colour line starts at 22 °C, and earlier studies cited by
        Korzelecka-Orkisz et al. report preferred breeding temperatures of up to 31 °C; no
        husbandry source recommends keeping below 24 °C or above 30 °C for long periods. The range
        contains the natural 27 to 30 °C.

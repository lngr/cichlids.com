        note: Squabbles with its own kind; males more territorial when breeding.
      - source: *aquainfo
        value: 2
        note: Hierarchy within the group; pairs defend a territory when breeding.
      - source: *aquaexp
        value: 2
        note: Hierarchy and territorial adult pairs.
      - source: *fishkeeping
        value: 2
        note: Conflicts between conspecifics increase during spawning.
      - source: *cacho1999
        value: 2
        note: Breeding males very aggressive while establishing a territory.
      - source: *cacho2007
        value: 2
        note: Mated fish attack intruders during breeding cycles, not between them.

  aggressionHeterospecific:
    value: 2
    confidence: medium
    rationale: >-
      Outside breeding the angelfish is a calm community fish that leaves tankmates of suitable
      size alone (Seriously Fish, AquaInfo). A spawning pair, however, guards its leaf or slate and
      chases other fish away from it for the whole brood care; Practical Fishkeeping and the
      Fishkeeping.co.uk care sheet note aggression when breeding in a community tank, and a
      behavioural study describes pairs attacking intruders during the breeding cycle. Chasing
      other species out of the spawning territory without injuries is level 2; level 1 covers only
      display. Attacks beyond the spawning site are not typical, so level 3 does not apply.
    sources:
      - *pfkfacts
      - *fishkeeping
      - *cacho2007
      - *sf
      - *aquainfo
      - &tetra
        kind: website
        title: "Tetra: Angelfish (Pterophyllum scalare), care guide"
        url: https://blog.tetra.net/en-en/angelfish-pterophyllum-scalare/
        archived: blog.tetra.net/en-en/angelfish-pterophyllum-scalare/2026-10-14T102801Z
        accessed: 2026-10-13
    evidence:
      - source: *pfkfacts
        value: 2
        note: Aggressive when breeding in a community tank, otherwise suitable for larger community tanks.
      - source: *fishkeeping
        value: 2
        note: Community keeping possible; territorial when spawning.
      - source: *cacho2007
        value: 2
        note: Pairs aggressive towards intruders during breeding cycles.
      - source: *sf
        value: 1
        note: Generally peaceful, a good community fish.
      - source: *aquainfo
        value: 1
        note: Friendly towards other fish; defends a territory when breeding.

  territory:
    value: {size: small, breedingOnly: true}
    confidence: medium
    rationale: >-
      Angelfish claim no fixed area outside breeding and move through the tank as a group. A pair
      chooses a vertical surface such as a broad leaf, slate, a pipe or the glass and defends the
      spawning site and its surroundings while it tends eggs and fry; between breeding cycles the
      pair does not attack intruders. The defended area is the spawning site and its immediate
      surroundings rather than a third of a large tank.
    sources:
      - *sf
      - *aquainfo
      - *fishbase
      - *cacho1999
      - *cacho2007
      - *pfkfacts
    evidence:
      - source: *cacho2007
        value: {size: small, breedingOnly: true}
        note: No aggression towards intruders between breeding cycles.
      - source: *sf
        value: {size: small, breedingOnly: true}
        note: Males more territorial in breeding condition.
      - source: *tetra
        value: {size: large, breedingOnly: true}
        note: Paired adults defend a spawning territory; size not stated.
      - source: *amazonia
        value: {size: large, breedingOnly: true}
        note: Retailer guide; a breeding pair may dominate a community tank.

  habitatZones:
    value: [plants, wood, openWater]
    confidence: high
    rationale: >-
      Wild angelfish live in slow or still water of floodplains, swamps, flooded forest and river
      margins among dense aquatic vegetation, floating macrophyte banks, roots and submerged
      branches, and they swim in the open midwater between this cover. FishBase and the capture
      reports describe vegetation and submerged wood at the sites, várzea studies caught the species
      in macrophyte banks, and care sheets ask for tall plants, roots and open swimming space.
    sources:
      - *fishbase
      - *farias2015
      - *prado2011
      - *aquainfo
      - *aquaexp
      - *korzelecka2012
    evidence:
      - source: *fishbase
        value: [plants, wood]
        note: Swamps and flooded ground with dense vegetation.
      - source: *farias2015
        value: [plants, wood]
        note: Caught near submerged wood and vegetation.
      - source: *prado2011
        value: [plants]
        note: Caught in macrophyte banks of várzea lakes.
      - source: *aquaexp
        value: [plants, wood, openWater]
        note: Slow water with roots and plants, plus swimming room.

  social:
    value: {structure: group, minGroup: 5}
    confidence: medium
    rationale: >-
      FishBase and AquaInfo recommend groups of at least five, and Seriously Fish advises starting
      with about six juveniles so that a pair can form. Pairs form within the group and separate
      from it only for brood care; they may then dominate the others, so a large tank or rehoming
      surplus fish is needed. A single established pair also works in a smaller tank, but the
      sources give group keeping as the standard.
    sources:
      - *fishbase
      - *aquainfo
      - *sf
      - *cacho2007
    evidence:
      - source: *fishbase
        value: {structure: group, minGroup: 5}
        note: Groups of five or more; single pairs for breeding.
      - source: *aquainfo
        value: {structure: group, minGroup: 5}
      - source: *sf
        value: {structure: group, minGroup: 6}
        note: Six juveniles recommended to obtain a pair.
      - source: *cacho2007
        value: {structure: pair}
        note: Serial monogamy under experimental conditions.
      - source: *tetra
        value: {structure: pair}
        note: One adult pair in a smaller tank, groups in large tanks.

  speciesOnly:
    value: false
    confidence: high
    rationale: >-
      Decided unanimously: all four votes chose false. Seriously Fish rates the angelfish as a good
      community fish, Practical Fishkeeping as suitable for larger community tanks, and AquaInfo
      and the Fishkeeping.co.uk care sheet allow peaceful tankmates that are too large to be eaten.
      FishBase gives no recommendation to keep it alone. The limits are small fish that fit into
      its mouth and fin nippers, which the predation level and the partner list cover.
    sources:
      - *sf
      - *pfkfacts
      - *aquainfo
      - *fishkeeping
      - *fishbase
      - *tetra
    evidence:
      - source: *sf
        value: false
        note: Good community fish.
      - source: *pfkfacts
        value: false
        note: Suitable for larger community tanks.
      - source: *aquainfo
        value: false
        note: Suits a community aquarium with peaceful fish that are not too small.
      - source: *fishkeeping
        value: false
      - source: *fishbase
        value: false
        note: No recommendation to keep it alone.
      - source: *tetra
        value: false
    verification:
      method: unanimous
      votes: {agree: 4, total: 4}

  hybridGroups:
    value: [pterophyllum]
    confidence: medium
    rationale: >-
      The angelfish group has the basis presumed. The only reported cross, P. altum x P. scalare
      (Clarke 2010), was a deliberate pairing by one breeder without a known fertile strain, and no
      cross with P. leopoldi is documented; the group rests on the close relationship and the
      assumed mixed ancestry of farmed angelfish (Practical Fishkeeping, TFH).
    sources:
      - &pfkhybrid
        kind: literature
        title: "Clarke, M. (2010). Hybrid scalare-altum angel. Practical Fishkeeping (August 2010)."
        url: https://www.practicalfishkeeping.co.uk/features/hybrid-scalare-altum-angel/
        archived: practicalfishkeeping.co.uk/features/hybrid-scalare-altum-angel/2026-10-14T102801Z
        accessed: 2026-10-13
      - *pfkperu
      - *tfh
      - *cof
      - &wikipedia
        kind: website
        title: "Wikipedia: Freshwater angelfish"
        url: https://en.wikipedia.org/wiki/Freshwater_angelfish
        archived: en.wikipedia.org/wiki/freshwater_angelfish/2026-10-14T102801Z
        accessed: 2026-10-13
    evidence:
      - source: *pfkhybrid
        value: pterophyllum
        note: Captive-bred cross of P. altum and P. scalare.
      - source: *pfkperu
        value: pterophyllum
        note: Farmed angelfish probably carry genes of all three species; no controlled cross.
      - source: *tfh
        value: pterophyllum
        note: Aquarium angelfish likely descend from two or more species.
      - source: *cof
        value: pterophyllum
        note: P. scalare, P. altum and P. leopoldi are the valid species of the genus; states nothing about crosses.
      - source: *wikipedia
        value: pterophyllum
        note: Domestic strains of hybrid ancestry; species only subtly different.
    verification:
      method: unanimous
      votes: {agree: 4, total: 4}

  coloration:
    value: {baseColors: [silver, black], pattern: bars}
    confidence: high
    rationale: >-
      The wild form is silvery with dark vertical bars, seven in juveniles and four in adults, one
      of them through the eye; the bars darken during spawning and fade under stress. Captive strains
      range from black and gold to marbled and koi patterns; the value describes the wild type.
    sources:
      - *fishbase
      - *sf
      - *aquainfo
      - *tfh
    evidence:
      - source: *fishbase
        value: {baseColors: [silver, black], pattern: bars}
        note: Silvery body with vertical bars.
      - source: *tfh
        value: {baseColors: [silver, black], pattern: bars}
        note: Wild type silver with dark vertical bars.

  feedingSpeed:
    value: normal
    confidence: low
    rationale: >-
      Angelfish accept flakes, granules and frozen food readily and take their share in the middle
      and upper water among calm tankmates, but fast, pushy feeders such as barbs or mbuna
      outcompete them. Tropical Fish Hobbyist calls them voracious, and the Fishkeeping.co.uk care
      sheet warns that they are easily overfed, which points to a strong appetite rather than the
      rushing of hasty species. No source compares their feeding pace directly, hence low
      confidence.
    sources:
      - *sf
      - *pfkfacts
      - *aquainfo
      - *tfh
      - *fishkeeping
    evidence:
      - source: *tfh
        value: hasty
        note: Described as a voracious feeder.
      - source: *fishkeeping
        value: hasty
        note: Takes offered food readily, so overfeeding is common.

  minTank:
    value: {volumeL: 240, lengthCm: 120, depthCm: 40}
    confidence: medium
    rationale: >-
      The social unit is a group of five adults. Practical Fishkeeping gives 120 x 40 x 50 cm for a
      group, which holds about 240 litres. AquaInfo asks for about 150 cm length for a group of five
      or more; Seriously Fish names 100 x 40 x 50 cm, about 200 litres, as the smallest tank, and
      FishBase a length of at least 100 cm, which suit a single pair rather than a group. Because
      adults stand up to 25 cm tall with fins, the water should be at least 50 cm high.
    sources:
      - *pfkfacts
      - *aquainfo
      - *sf
      - *fishbase
    evidence:
      - source: *pfkfacts
        value: {volumeL: 240, lengthCm: 120, depthCm: 40}
        note: 120 x 40 x 50 cm for a group.
      - source: *aquainfo
        value: {volumeL: 400, lengthCm: 150, depthCm: 50}
        note: About 150 cm length and at least 50 cm water height for a group; volume calculated.
      - source: *sf
        value: {volumeL: 200, lengthCm: 100, depthCm: 40}
        note: 100 x 40 x 50 cm as the smallest tank.

  lifespanYears:
    value: {min: 8, max: 12}
    confidence: medium
    rationale: >-
      AquaInfo reports at least ten years under good care, AquaExperience 8 to 12 years and
      Fishipedia about 9 years; hobby and retailer pages give 8 to 10 years and up to about 12 years
      for well-kept fish.
    sources:
      - *aquainfo
      - *aquaexp
      - *fishipedia
      - *garnelio
      - *furrycritter
      - *wikipedia
    evidence:
      - source: *aquainfo
        value: {min: 10, max: 12}
        note: At least ten years.
      - source: *aquaexp
        value: {min: 8, max: 12}
      - source: *fishipedia
        value: {min: 9, max: 9}
      - source: *garnelio
        value: {min: 8, max: 10}
      - source: *wikipedia
        value: {min: 8, max: 12}
        note: Around 12 years with good care.

  breeding:
    value: open-substrate-spawner
    confidence: high
    rationale: >-
      Pairs lay their eggs in rows on vertical or steep surfaces such as broad leaves, wood, slate
      or the aquarium glass, and both parents fan and guard the eggs and the young. FishBase,
      Seriously Fish, AquaInfo and breeding studies describe this biparental care on an exposed
      substrate, and the Cichlid Room Companion, used for verification, agrees.
    sources:
      - *fishbase
      - *sf
      - *aquainfo
      - *korzelecka2012
      - *cacho1999
      - *crc
    evidence:
      - source: *fishbase
        value: open-substrate-spawner
        note: Both parents guard eggs attached to vegetation.
      - source: *sf
        value: open-substrate-spawner
        note: Spawns on vertical surfaces.
      - source: *korzelecka2012
        value: open-substrate-spawner
        note: Paired spawning and care on exposed vertical strips.
      - source: *cacho1999
        value: open-substrate-spawner
        note: Broad-leaved plants preferred as spawning substrate.

  beginnerSuitability:
    value: moderate
    confidence: medium
    rationale: >-
      Captive-bred angelfish are hardy and adapt to a wide range of tap water; Seriously Fish rates
      them easy and AquaInfo easy to keep in a community tank. They do, however, need a tall tank,
      grow large, become quarrelsome when pairs form and eat small tankmates, which trips up many
      beginners who buy them small for a low community tank. Wild-caught locality fish need soft,
      acidic water and are more demanding. The Cichlid Room Companion, used for verification,
      places the species at the intermediate level, which matches moderate.
    sources:
      - *sf
      - *aquainfo
      - *pfkperu
      - *crc
      - *amazonia

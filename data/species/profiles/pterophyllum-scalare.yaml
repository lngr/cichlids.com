  predation:
    value: 2
    confidence: medium
    rationale: >-
      Decided by a qualified majority of four of five votes: the generator, checker-a, checker-c
      and tiebreaker-1 chose level 2, checker-b level 1. Adult angelfish are not piscivores, since
      insects, small crustaceans and other invertebrates make up most of the wild diet, so level 3
      does not apply. In the aquarium, however, several husbandry sources describe them taking small
      fish: Seriously Fish warns about small tetras, Practical Fishkeeping says they will eat small
      fish, AquaInfo reports shrinking schools of cardinal tetras, Tropical Fish Hobbyist calls the
      species an adept hunter of small fishes and singles out neon tetras, and the Fishkeeping.co.uk
      care sheet confirms that neon-sized fish are eaten. Neon and cardinal tetras of 3 to 4 cm lie
      above the 2 cm limit of level 1 and below a third of the adult length, which matches level
      2. Small fish also appear among the wild food items cited by Farias Pantoja et al. FishBase
      lists only invertebrates as food items.

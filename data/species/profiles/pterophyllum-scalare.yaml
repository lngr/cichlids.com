id: pterophyllum-scalare
legacyIds: [775]
status: described

taxonomy:
  validName: Pterophyllum scalare
  genus: Pterophyllum
  species: scalare
  author: (Schultze, 1823)
  source: &cof
    kind: catalog-of-fishes
    title: "Eschmeyer's Catalog of Fishes, species of the genus Pterophyllum"
    url: https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Pterophyllum
    archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-091d09fa/2026-10-14T102733Z
    accessed: 2026-10-13
  synonyms:
    - name: Zeus scalaris
      note: Original combination of Schultze in Lichtenstein (1823); lectotype from the lower Amazon.
    - name: Platax scalaris
      note: Name used by Cuvier in Cuvier and Valenciennes (1831); synonym of P. scalare.
    - name: Plataxoides dumerilii
      note: Described by Castelnau (1855) from Pará; synonym of P. scalare.
    - name: Pterophyllum eimekei
      note: Described by Ahl (1928) from the Rio Negro; synonym of P. scalare.
  legacyNames:
    - Pterophyllum scalare
  note: >-
    The Catalog of Fishes lists three valid species in Pterophyllum: P. scalare, P. altum and
    P. leopoldi. It attributes P. scalare to Schultze in Lichtenstein (1823), following Paepke and
    Schindler (2002); many hobby texts credit the species to Lichtenstein or to Cuvier and
    Valenciennes. The legacy name is the valid name. The angelfish of the trade is a domesticated
    line of this species whose ancestry may include the other two species; this profile describes
    the wild species and lists the captive strains as colour forms.

names:
  trade:
    en: [Angelfish, Freshwater angelfish, Scalare]
    de: [Segelflosser, Skalar]
    es-419: [Escalar, Pez ángel]
    pt-BR: [Acará-bandeira]

variants:
  - name: "Peruvian Altum (Rio Nanay)"
    kind: locality
    note: Tall, brownish wild form from the Rio Nanay in Peru; despite the trade name it is regarded as a population of P. scalare.
  - name: "Manacapuru (red shoulder)"
    kind: locality
    note: Wild form from the Manacapuru area of the Solimões with reddish markings behind the head.
  - name: "Santa Isabel (Rio Negro)"
    kind: locality
    note: Wild form from the middle Rio Negro.
  - name: Wild type (silver)
    kind: color-morph
    note: Silver body with four dark vertical bars; the reference colour of the species and of captive-bred wild-type stock.
  - name: Black and black lace
    kind: color-morph
    note: Captive strain with a dark to completely black body.
  - name: Gold and platinum
    kind: color-morph
    note: Captive strains without dark bars, yellowish to white, partly with an orange crown.
  - name: Marble and koi
    kind: color-morph
    note: Captive strains with irregular black, white and orange patches.
  - name: Zebra, leopard and smokey
    kind: color-morph
    note: Captive strains with extra bars, dark spots or a dusky rear half.
  - name: Veil
    kind: color-morph
    note: Long-finned captive strain; occurs in combination with most colour forms.

features:
  origin:
    value:
      continent: South America
      region: Amazon basin and Guiana rivers
      waterbody: null
      localities:
        - Rio Ucayali (Peru)
        - Rio Nanay (Peru)
        - Rio Solimões and its floodplain lakes (Brazil)
        - Lower Amazon main stem and rivers of Amapá (Brazil)
        - Rio Negro (Brazil)
        - Rio Oyapock (French Guiana)
        - Essequibo River (Guyana)
    confidence: high
    rationale: >-
      The Catalog of Fishes gives the Amazon basin of Brazil, Colombia, French Guiana, Guyana and
      Peru as the range and treats the population in Suriname as introduced. FishBase names the
      Ucayali, Solimões and Amazon, the rivers of Amapá, the Oyapock and the Essequibo; the last
      two drain to the Atlantic outside the Amazon basin, hence the region name. Field studies
      worked with wild fish from the Igarapé Fortaleza basin in Amapá, from várzea lakes of the
      lower Solimões, and from the blackwater of the middle and upper Rio Negro, which is also the
      type locality of the synonym P. eimekei. The Rio Nanay population is known in the trade as
      the Peruvian Altum.

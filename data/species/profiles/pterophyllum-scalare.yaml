        value: easy
        note: Common captive stock.
      - source: *aquainfo
        value: easy
      - source: *crc
        value: moderate
        note: Intermediate level; used for verification only.
      - source: *amazonia
        value: demanding
        note: Wild locality imports; retailer guide.

partners:
  suitable:
    - species: Corydoras sterbai
      reason: Peaceful bottom dweller of the Amazon basin that tolerates the same warm, soft water and is too large to be eaten.
    - species: Ancistrus sp. (bristlenose catfish)
      reason: Robust algae grazer that stays on wood and the bottom and does not compete for space in the water column.
    - species: Moenkhausia sanctaefilomenae
      reason: Calm schooling tetra of about 7 cm, too large to be taken as prey.
    - species: Laetacara curviceps
      reason: Small, peaceful South American cichlid that stays near the bottom and shares the water requirements.
      condition: Tank of at least 120 cm with plants and wood so that territories do not overlap.
    - species: Mesonauta festivus
      reason: Calm cichlid of the same floodplain habitats with similar body shape and temperament.
      condition: Tank of at least 150 cm; watch for clashes when either species breeds.
  unsuitable:
    - species: Paracheirodon innesi
      reason: Neon tetras of 3 to 4 cm fit into the mouth of an adult angelfish and are eaten.
    - species: Puntigrus tetrazona
      reason: Tiger barbs nip the long ventral and dorsal fins of angelfish.
    - species: Lake Malawi mbuna
      reason: Need hard alkaline water and are far too aggressive and fast at feeding for angelfish.
    - species: Astronotus ocellatus
      reason: Grows much larger and preys on or harasses angelfish.
    - species: Pterophyllum altum
      reason: Same hybrid group; a breeder has deliberately crossed it with P. scalare, so the two species should not be kept together.
    - species: Pterophyllum leopoldi
      reason: Same hybrid group; a close relative that should be kept apart to avoid mixed offspring.
    - species: Symphysodon aequifasciatus
      reason: Discus feed slowly and lose food to angelfish, and farmed angelfish may pass on parasites such as gill flukes.

profile:
  overview:
    text: >-
      The freshwater angelfish is one of the best-known aquarium fish and a cichlid from the Amazon
      basin. Its disc-shaped, laterally compressed body with very tall dorsal and anal fins and long,
      thread-like ventral fins makes it unmistakable. Wild fish are silver with dark vertical bars,
      while the trade offers many captive-bred strains such as black, gold, marble, koi and veil
      forms. Almost all fish on sale come from large breeding farms, and these domesticated lines
      probably carry some genes of the two other angelfish species, Pterophyllum altum and
      P. leopoldi. Wild-caught fish from Peru, the Solimões or the Rio Negro reach the hobby only
      occasionally. Angelfish are calm, attractive fish for a large, tall community tank, but they
      are cichlids: pairs defend their spawning site and adults eat small fish.
    sources:
      - *cof
      - *sf
      - *pfkperu
      - *tfh
  habitat:
    text: >-
      The species ranges across the Amazon basin from the Ucayali in Peru along the Solimões and the
      lower Amazon to Amapá, and further to the Oyapock in French Guiana and the Essequibo in Guyana.
      It also lives in the Rio Negro. Angelfish favour quiet, slow-flowing water: floodplain lakes,
      swamps, flooded forest and sheltered river margins with dense aquatic and bank vegetation,
      roots and fallen branches. Field measurements at capture sites show warm water of about 27 to
      30 °C, a pH from moderately acidic to about neutral, and very soft water with almost no
      carbonate hardness. In the blackwater of the Rio Negro the water is more acidic still and even
      poorer in minerals.
    sources:
      - *cof
      - *fishbase
      - *farias2015
      - *bittencourt2014
      - *tavares2010
      - *prado2011
      - *brito2014
  sizeAndGrowth:
    text: >-
      Adult angelfish reach a body length of about 15 cm, while their fins make them up to 25 cm tall.
      Males tend to grow slightly larger than females and develop a steeper forehead with age. Young
      angelfish grow quickly on a varied diet and reach their adult shape within about a year. With
      good care they live around ten years. Because of their height they need tanks with at least
      50 cm of water depth; low tanks restrict the fins and cause stress.
    sources:
      - *sf
      - *pfkfacts
      - *tfh
      - *fishbase
      - *aquainfo
  husbandry:
    text: >-
      A group of five adults needs a tank of about 120 cm length and 240 litres with at least 50 cm
      water height, and more room is better. Tall plants such as Amazon swords, vertical roots and
      some open swimming space suit their habits; the current should be gentle. Captive-bred
      angelfish do well at 24 to 30 °C, pH 6 to 7.5 and soft to medium-hard water, and many live in
      ordinary tap water that is not strongly alkaline. Wild-caught fish and breeding pairs are
      better kept in soft, slightly acidic water close to the natural values. Clean water matters
      more than exact numbers: regular partial water changes and a good filter keep nitrate low and
      prevent many of the diseases that hit stressed angelfish.
    sources:
      - *sf
      - *pfkfacts
      - *aquainfo
      - *fishbase
  socialBehavior:
    text: >-
      Juvenile angelfish move in loose groups and establish a ranking with short chases and displays.
      When a pair forms, the two fish separate from the others, claim a spawning site and drive away
      both rival angelfish and other fish that come too close. In a spacious tank this rarely causes
      injuries, but in small tanks the remaining fish can be harassed. A group of five or more young
      fish in a large tank, or a single established pair, works best. Towards other species
      angelfish are peaceful outside breeding; they are, however, opportunistic predators of small
      fish.
    sources:
      - *sf
      - *fishbase
      - *aquainfo
      - *cacho1999
      - *cacho2007
  diet:
    text: >-
      In the wild angelfish feed mainly on insect larvae, small crustaceans and other invertebrates,
      which they pick from plants, roots and the water column, and they take small fish and some
      plant matter as well. In the aquarium they accept flakes, granules and pellets readily. Frozen
      or live foods such as mosquito larvae, brine shrimp, daphnia and mysis add variety and help to
      condition breeding pairs. Feed small portions once or twice a day that are eaten within a few
      minutes, because uneaten food quickly spoils the water. Very small tankmates may become part of
      the menu.
    sources:
      - *fishbase
      - *sf
      - *farias2015
      - *pfkfacts
      - *tfh
  breeding:
    text: >-
      Angelfish are open-substrate spawners that form lasting pairs. After cleaning a vertical
      surface such as a broad leaf, a piece of slate, a pipe or the glass, the female lays several
      hundred eggs in rows and the male fertilises them. Both parents fan and guard the clutch; the
      larvae hatch after about two days at 28 °C and hang from the surface by sticky threads until
      they swim freely about five days later. Rotifers or infusoria suit the first days, followed by
      newly hatched brine shrimp. Young or disturbed pairs often eat their first clutches, which is
      why many breeders hatch the eggs separately. Eggs develop poorly in alkaline water; soft,
      slightly acidic water improves the hatching rate.
    sources:
      - *korzelecka2012
      - *ortega2009
      - *sf
      - *cacho1999
  sexing:
    text: >-
      Sexing angelfish from outside is difficult. Adult males often have a more pronounced bump on
      the forehead and a slightly larger body, while females look rounder behind the ventral fins
      when ripe with eggs. The only reliable sign is the genital papilla, which appears shortly before
      spawning: it is short and pointed in the male and broader and blunt in the female. Behaviour
      also helps, since males are usually the more active defenders. Buying six young fish and
      letting a pair form on its own is the most dependable way to get a breeding pair.
    sources:
      - *sf
      - *cacho1999
  compatibility:
    text: >-
      Angelfish suit a large, tall community tank with fish that share their warm, soft water and
      are too large to be swallowed. Good companions include medium-sized tetras, Corydoras and
      other armoured catfish, bristlenose catfish and calm South American cichlids such as Laetacara
      or Mesonauta in larger tanks. Small fish under about 5 cm, such as neon tetras, guppies or
      small rasboras, are at risk, especially once the angelfish are full grown. Fin-nipping fish
      like tiger barbs damage their long fins, and boisterous or large cichlids outcompete or attack
      them. The other two angelfish species should not be added: a breeder has crossed P. altum with
      P. scalare, and P. leopoldi is kept apart as a close relative.
    sources:
      - *sf
      - *pfkfacts
      - *tfh
      - *pfkhybrid
  problems:
    text: >-
      The most common mistake is buying small angelfish for a short, low community tank where they
      soon lack room and eat the small tetras they were meant to live with. Farmed angelfish are
      often imported with gill flukes, ich or bacterial infections, so a quarantine period before
      adding them to a tank is sensible. Poor water quality and high nitrate encourage hole-in-the-head
      symptoms and fin rot. Overfeeding causes digestive trouble and polluted water, and females that
      cannot spawn may become swollen. Pairs that form in a crowded tank can make life miserable for
      the other angelfish, so plan for space or for rehoming surplus fish.
    sources:
      - *sf
      - &aguinaga2015
        kind: literature
        title: "Aguinaga, J. Y., Marcusso, P. F., Claudiano, G. S., Lima, B. T. M., Sebastião, F. A., Fernandes, J. B. K., Moraes, F. R. and Moraes, J. R. E. (2015). Parasitic infections in ornamental cichlid fish in the Peruvian Amazon. Revista Brasileira de Parasitologia Veterinária 24(1), 82-86."
        url: https://doi.org/10.1590/s1984-29612014076
        archived: doi.org/10.1590_s1984-29612014076/2026-10-13T074842Z
        accessed: 2026-10-13
      - kind: archive
        title: cichlids.com forum thread 1269
        url: https://www.cichlids.com/disc/read.php?1,1269
        accessed: 2026-10-13
      - kind: archive
        title: cichlids.com forum thread 33259
        url: https://www.cichlids.com/disc/read.php?1,33259
        accessed: 2026-10-13
      - kind: archive
        title: cichlids.com forum thread 61288
        url: https://www.cichlids.com/disc/read.php?1,61288
        accessed: 2026-10-13


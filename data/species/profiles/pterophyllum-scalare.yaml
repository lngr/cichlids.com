  temperatureC:
    value: {min: 27, max: 30}
    confidence: medium
    rationale: >-
      Decided unanimously by the vote count: the generator proposed 26 to 30 °C, checker-a 26 to
      31 °C, checker-b and checker-c 27 to 30 °C; all four agree within 1 °C, and the median of the
      bounds gives 27 to 30 °C. The range rests on water measured where wild P. scalare were
      caught: a mean of 28.6 °C with little spread in the Igarapé Fortaleza basin in Amapá, 27.8 to
      28.5 °C in the main channel of the same basin, 27.0 to 29.1 °C in a blackwater stream of the
      middle Rio Negro, and lake means of 28.0 °C at low water in várzea macrophyte banks of the
      lower Solimões. A review of the species summarises the habitat as 27 to 30 °C, and wild
      spawning falls into the warm season at 28 to 30 °C. The sources span a wider 26 to 33 °C:
      shallow floodplain water of the Igarapé Fortaleza ranged from 26 to 33 °C, and the várzea
      lakes averaged 31.6 °C at high water; these are short or surface extremes and lie outside the
      decided range. FishBase gives 24 to 30 °C, which reads as a keeping range rather than a
      habitat measurement.

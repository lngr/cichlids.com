    - field: features.ph.value
      proposals:
        - {by: generator, value: {min: 5.0, max: 7.5}}
        - {by: checker-a, value: {min: 5.0, max: 7.5}}
        - {by: checker-b, value: {min: 5.5, max: 7.0}}
        - {by: checker-c, value: {min: 4.5, max: 7.5}}
        - {by: tiebreaker-1, value: {min: 5.0, max: 7.5}}
      decision: {min: 5.0, max: 7.5}
      rationale: Only three of five votes agree, so the tally applies the median method to all five votes; field sources reach down to about pH 4 in Rio Negro blackwater, which the low confidence reflects.
    - field: features.ph.tolerance
      proposals:
        - {by: generator, value: {min: 5.0, max: 8.0}}
        - {by: checker-a, value: {min: 5.0, max: 8.0}}
        - {by: checker-b, value: {min: 5.5, max: 7.5}}
        - {by: checker-c, value: {min: 4.5, max: 8.0}}
        - {by: tiebreaker-1, value: {min: 5.0, max: 8.0}}
      decision: {min: 5.0, max: 7.5}
      rationale: No qualified majority; the tally takes the conservative intersection of all votes, 5.5 to 7.5, widened to contain the natural range down to 5.0.
    - field: features.ghDgh.tolerance
      proposals:
        - {by: generator, value: {min: 0, max: 15}}
        - {by: checker-a, value: {min: 0, max: 12}}
        - {by: checker-b, value: {min: 0, max: 15}}
        - {by: checker-c, value: {min: 0, max: 15}}
        - {by: tiebreaker-1, value: {min: 0, max: 15}}
      decision: {min: 0, max: 15}
      rationale: Qualified majority of four of five votes in the tally; checker-a's 12 dGH follows the reduced fry growth from about 11 dGH, while three care sheets allow 15 dGH.
    - field: features.khDkh.value
      proposals:
        - {by: generator, value: {min: 0, max: 2}}
        - {by: checker-a, value: {min: 0, max: 2.5}}
        - {by: checker-b, value: {min: 0, max: 2}}
        - {by: checker-c, value: {min: 0, max: 3}}
      decision: {min: 0, max: 2}
      rationale: The tally finds all four votes within 2 dKH and decides unanimously on the median of the bounds.
    - field: features.khDkh.tolerance
      proposals:
        - {by: generator, value: {min: 0, max: 10}}
        - {by: checker-a, value: {min: 0, max: 10}}
        - {by: checker-b, value: {min: 0, max: 8}}
        - {by: checker-c, value: {min: 0, max: 6}}
      decision: {min: 0, max: 9}
      rationale: The tally decides unanimously with the median upper bound of the agreeing votes; the evidence for carbonate hardness is thin, hence low confidence.
    - field: features.predation.value
      proposals:
        - {by: generator, value: 2}
        - {by: checker-a, value: 2}
        - {by: checker-b, value: 1}
        - {by: checker-c, value: 2}
        - {by: tiebreaker-1, value: 2}
      decision: 2
      rationale: Qualified majority of four of five votes in the tally; neon and cardinal tetras of 3 to 4 cm are eaten, which exceeds the 2 cm limit of level 1.
    - field: features.origin.value.region
      proposals:
        - {by: generator, value: Amazon basin}
        - {by: checker-a, value: Amazon basin and Guiana rivers}
        - {by: checker-b, value: Amazon basin}
        - {by: checker-c, value: Amazon basin and adjacent Guiana drainages}
      decision: Amazon basin and Guiana rivers
      rationale: The range includes the Oyapock and the Essequibo, which drain to the Atlantic outside the Amazon basin; the shorter wording of checker-a names them.
    - field: features.maxSizeCm.value
      proposals:
        - {by: generator, value: {male: 15, female: 13}}
        - {by: checker-a, value: {male: 15, female: 13}}
        - {by: checker-b, value: {male: 15, female: 15}}
        - {by: checker-c, value: {male: 15, female: 15}}
      decision: {male: 15, female: 15}
      rationale: All sources give 15 cm without a separate figure per sex; the smaller female size was an unsourced estimate.
    - field: features.aggressionHeterospecific.value
      proposals:
        - {by: generator, value: 2}
        - {by: checker-a, value: 1}
        - {by: checker-b, value: 1}
        - {by: checker-c, value: 2}
      decision: 2
      rationale: Breeding pairs chase other fish out of the spawning area, which is level 2; level 1 covers display only.
    - field: features.territory.value
      proposals:
        - {by: generator, value: {size: small, breedingOnly: true}}
        - {by: checker-a, value: {size: small, breedingOnly: true}}
        - {by: checker-b, value: {size: small, breedingOnly: true}}
        - {by: checker-c, value: {size: large, breedingOnly: true}}
      decision: {size: small, breedingOnly: true}
      rationale: Pairs defend the spawning site and its surroundings; the large size rests on a retailer guide and a manufacturer page that give no area.
    - field: features.habitatZones.value
      proposals:
        - {by: generator, value: [plants, wood, openWater]}
        - {by: checker-a, value: [plants, wood, openWater]}
        - {by: checker-b, value: [plants, wood]}
        - {by: checker-c, value: [plants, wood, openWater]}
      decision: [plants, wood, openWater]
      rationale: The fish swim in the open midwater between plants and wood, and care sheets ask for open swimming space.
    - field: features.social.value
      proposals:
        - {by: generator, value: {structure: group, minGroup: 5}}
        - {by: checker-a, value: {structure: group, minGroup: 5}}
        - {by: checker-b, value: {structure: group, minGroup: 5}}
        - {by: checker-c, value: {structure: pair}}
      decision: {structure: group, minGroup: 5}
      rationale: FishBase, AquaInfo and Seriously Fish recommend groups of five or six from which pairs form; a single pair is an alternative, not the standard.
    - field: features.feedingSpeed.value
      proposals:
        - {by: generator, value: normal}
        - {by: checker-a, value: normal}
        - {by: checker-b, value: normal}
        - {by: checker-c, value: hasty}
      decision: normal
      rationale: Angelfish have a strong appetite but lose food to genuinely hasty feeders such as barbs or mbuna; no source compares feeding pace, so confidence is low.
    - field: features.minTank.value
      proposals:
        - {by: generator, value: {volumeL: 240, lengthCm: 120, depthCm: 40}}
        - {by: checker-a, value: {volumeL: 400, lengthCm: 150, depthCm: 50}}
        - {by: checker-b, value: {volumeL: 200, lengthCm: 100, depthCm: 40}}
        - {by: checker-c, value: {volumeL: 200, lengthCm: 100, depthCm: 40}}
      decision: {volumeL: 240, lengthCm: 120, depthCm: 40}
      rationale: The social unit is a group of five; Practical Fishkeeping gives 120 x 40 x 50 cm explicitly for a group, between the 100 cm pair minimum of Seriously Fish and the 150 cm of AquaInfo.
    - field: features.beginnerSuitability.value
      proposals:
        - {by: generator, value: moderate}
        - {by: checker-a, value: easy}
        - {by: checker-b, value: easy}
        - {by: checker-c, value: moderate}
      decision: moderate
      rationale: The fish are hardy, but tank height, size, pair aggression and predation on small tankmates make them less simple than the easy rating suggests; the intermediate rating of the Cichlid Room Companion agrees.

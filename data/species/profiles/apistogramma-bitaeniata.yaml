    tolerance:
      value:
        min: 0
        max: 5
      confidence: medium
      rationale: "Retain the unanimous 0 to 5 dGH tolerance and medium confidence. Generator, checker-b and checker-c\
        \ propose 0 to 5; checker-a proposes 0 to 6. Seriously Fish gives 0 to 5, Aqua-Fish 0 to 4 and a Krib breeder\
        \ reports 3 dGH. The wider FishBase interval is 2 to 6, Aquadiction 2 to 8, and Maidenhead permits up to\
        \ 8 without specifying a lower bound. These wider recommendations are retained but do not outweigh the specialist\
        \ soft-water interval and DRTA's report of losses of wild Nanay juveniles in moderately hard water. The\
        \ chosen envelope is not proof of immediate harm above 5, and very soft breeding conditions do not establish\
        \ a universal physiological threshold."

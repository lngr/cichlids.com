  diet:
    text: "Offer small animal foods near the bottom, including Artemia, Daphnia and suitable insect larvae. Small\
      \ sinking carnivore pellets can supplement these when the fish accept them. Wild imports may continue to prefer\
      \ live or frozen food. Check that each individual feeds, although settled adults can compete quite assertively.\
      \ The species is an invertebrate feeder with precautionary level-1 fry predation, not an established specialist\
      \ fish hunter. The bloat flag is false because the particular protein-intolerance syndrome is not reported;\
      \ modest portions and a varied diet still matter."

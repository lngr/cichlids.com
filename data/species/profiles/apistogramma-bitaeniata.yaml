features:
  origin:
    value:
      continent: South America
      region: "Upper Amazon basin in Peru, Colombia and Brazil"
      waterbody: null
      localities:
      - Lower Rio Nanay
      - Rio Mazan
      - Rio Tigre
      - Leticia
      - Igarape Preto
      - Lago Tefe
      - Rio Ampiyacu
    confidence: high
    rationale: "Catalog of Fishes and FishBase establish the upper Amazon distribution in Peru, Colombia and Brazil.\
      \ Merge the locality lists, adding the independently documented Ampiyacu collection and FishBase's Igarape\
      \ Preto record. Seriously Fish reports a broader eastward distribution toward the Madeira and Tapajos; Bleher's\
      \ northern Taraira report is retained as an attributed collecting identification, while his Apaporis record\
      \ is explicitly uncertain. Neither changes the core distribution into a different basin. The RIIA proceedings\
      \ confirm shallow Nanay collection sites but provide no numerical water measurements. The three legacy forum\
      \ threads add historical context without site chemistry."

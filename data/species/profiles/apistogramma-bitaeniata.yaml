  ghDgh:
    value:
      min: 0
      max: 1
    confidence: low
    rationale: "Retain the tally's unanimous 0 to 1 dGH decision under the two-degree agreement rule. The Krib's\
      \ secondary transcription of Kullander records Nanay tributaries at 0.2 to 0.6 dGH, margins at 0 to 0.8 and\
      \ Mazan waters below 1. Regional calcium and magnesium data summarized by the hydrochemical review give about\
      \ 0.15 dGH at Tefe and about 0.014 to 0.017 in dilute lower Tapajos streams. These are proxies and not a hardness\
      \ survey at all capture sites. The Momon abstract's 13 to 14 mg/L total hardness corresponds to about 0.73\
      \ to 0.78 dGH only if the unstated equivalent is CaCO3. FishBase's wider, conflicting 2 to 6 dH interval is\
      \ retained but lacks a visible collecting series. Measured ions and explicitly attributed field hardness take\
      \ precedence. Conductivity alone cannot be converted to GH; checker-a's conductivity-derived evidence is retained\
      \ as inference rather than direct measurement. Zero is a rounded very-low-hardness endpoint, not proof of\
      \ water devoid of minerals. Indirect transcription and regional extrapolation justify the tally's low confidence."
    sources:
    - kind: forum
      title: "The Krib: Apistogramma bitaeniata mailing-list discussions"

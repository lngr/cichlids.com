  problems:
    text: "The main husbandry risks are mineral-rich water for sensitive imports, accumulating waste and social\
      \ pressure around breeding. A DRTA account reports wild Nanay juveniles failing in moderately hard water,\
      \ while another keeper found aggression difficult in a short aquarium. Avoid treating a broad care-sheet limit\
      \ or a two-week observation as proof of long-term suitability. Quarantine newcomers and investigate water\
      \ quality, breathing, food intake and access to shelter when a fish declines. The literature on polluted urban\
      \ waterways supplies environmental context, not a disease diagnosis for aquarium fish."

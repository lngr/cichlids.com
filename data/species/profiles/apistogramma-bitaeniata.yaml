  habitat:
    text: "Shallow forest tributaries and protected margins provide sand, fallen leaves, roots and woody cover.\
      \ A confirmed collection in an Ampiyacu tributary measured 26 C and pH 6.0, with no aquatic plants present.\
      \ The working natural envelope is 24 to 29 C, pH 4.7 to 6.0, GH 0 to 1 dGH and KH 0 to 1 dKH. Several endpoints\
      \ use comparable regional waters rather than a survey of occupied sites. Regional reports of surface temperatures\
      \ reaching 34 C, pooled lake and pool temperatures reaching 32 C, and pH 4.1 in another species' lake are\
      \ contextual observations, not aquarium targets for this species. The tentative Apaporis fish reported at\
      \ pH 6.56 is not a confirmed basis for extending its range."

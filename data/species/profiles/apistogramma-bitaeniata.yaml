  husbandry:
    text: "For one male with two females, provide at least 100 L and an 80 by 35 cm base. Arrange separate cave\
      \ areas and escape routes behind wood and leaf cover. Gentle flow, subdued light and a mature filter suit\
      \ this setup. The keeping envelopes are 22 to 29 C, pH 4.5 to 7.0, GH 0 to 5 dGH and KH 0 to 3 dKH; wild fish\
      \ generally merit the softer, acidic portion. Prepare replacement water consistently and use regular partial\
      \ changes to control waste. Plants are useful optional shelter. The KH limits are inferred from keeping practice\
      \ and should not be read as experimentally established thresholds."
    sources:

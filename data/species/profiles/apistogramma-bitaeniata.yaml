  sexing:
    text: "Mature males usually have a larger body and much longer dorsal, pelvic and tail-fin extensions. Females\
      \ are smaller and often develop stronger yellow during brood care. Judge several characters together after\
      \ the fish have settled, because young or subordinate males can be misleading. Colour alone is also unreliable\
      \ for assigning a locality form."

  khDkh:
    value:
      min: 0
      max: 1
    confidence: low
    rationale: "Retain the tally's natural 0 to 1 dKH envelope and low confidence, without a verification object\
      \ on the natural KH fact. The World Bank volume's regional table gives Nanay alkalinity of 40 and Tefe of\
      \ 67 microequivalents/L, about 0.112 and 0.188 dKH using 357 microequivalents/L per dKH. The hydrochemical\
      \ review's regional bicarbonate calculations give about 0.315 dKH for Tefe and 0.095 for dilute lower Tapajos\
      \ streams. These calculations and the Momon abstract's provisional 0.78 dKH conversion from 14 mg/L alkalinity\
      \ concern regional waters rather than confirmed captures; the Momon CaCO3 equivalent is not explicit. The\
      \ 0 to 1 envelope allows spatial variation around these points. Low pH and conductivity are contextual indicators,\
      \ not independent KH measurements. Organic alkalinity complicates interpreting titrations in acidic water.\
      \ The IIAP pollution report's numerical alkalinity table was not recoverable in its extracted text and supplies\
      \ no quantitative endpoint."

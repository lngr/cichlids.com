  temperatureC:
    value:
      min: 24
      max: 29
    confidence: medium
    rationale: "Retain the tally's qualified-majority decision of 24 to 29 C, with four of six votes agreeing under\
      \ the one-degree comparison rule. This is a typical habitat envelope supported by the 26 C Ampiyacu collection\
      \ and comparable Nanay-region forest-stream measurements of 24.5 to 28.6 C in Romer et al. (2012), extended\
      \ outward to whole degrees. Those regional stations concern A. allpahuayo and are proxies, not confirmed A.\
      \ bitaeniata captures. Bleher reports 26.5 C at Taraira and Acquario.top relays 26.6 C from a collector. FishBase's\
      \ 23 to 25 C is attributed to aquarium-atlas reference 1672 and does not establish a field lower limit. Wider\
      \ regional observations are preserved: Sotero and Alva report 26.8 to 30 C in the lower Nanay, the cinilabra\
      \ study spans 25.8 to 29.7 C across dates, the Momon abstract gives a 30 C mean, and The Krib transcribes\
      \ 27 to 34 C at river surfaces and 27.5 to 32 C in lakes and pools. These have different microhabitats, seasonal\
      \ sampling or no simultaneous species identification, so their hottest endpoints do not define the ordinary\
      \ shaded-stream range. The tentative Apaporis identification at 27.2 C is not used to set a boundary. Medium\
      \ confidence reflects the sparse confirmed collecting measurements and regional extension."

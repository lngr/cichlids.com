    tolerance:
      value:
        min: 4.5
        max: 7
      confidence: medium
      rationale: "Retain the unanimous pH 4.5 to 7.0 tolerance with medium confidence; all four agents propose this\
        \ interval. Seriously Fish and Aquadiction give these keeping limits, while Maidenhead gives 5.0 to 6.5\
        \ and Aqua-Fish 4.5 to 6.5. Acquario.top's advice extends lower to 4.0 in a narrower 4 to 6 interval, and\
        \ the broader spread of all recommendations is therefore 4.0 to 7.0. No read long-term study establishes\
        \ routine health at pH 4.0 for the full species. The adopted lower limit follows the specialist keeping\
        \ sheet rather than combining every extreme. Breeding around pH 5.5 to 6.2 supports the central acidic portion.\
        \ A forum observation at 7.0 to 7.2 lasted only two weeks and does not extend the upper endpoint. Wild imports\
        \ are best planned toward the acidic portion; tolerance and spawning optima differ."

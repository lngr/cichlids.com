partners:
  suitable:
  - species: Nannostomus marginatus
    reason: A small quiet pencilfish selected from the genus-level dither recommendation.
    condition: Keep its own group in a larger aquarium with matching soft acidic water and feeding access.
  - species: Nannostomus eques
    reason: An upper-water pencilfish selected from general companion advice rather than a controlled pairing trial.
    condition: "Provide its own group, sheltered surface space and room beyond the harem minimum."
  - species: Carnegiella strigata
    reason: A surface-oriented candidate inferred from hatchetfish advice; the detailed collecting recommendation
      concerned a tentatively identified population.
    condition: Use a secure cover and a larger aquarium with matching water and an appropriate group.
  unsuitable:
  - species: Apistogramma cacatuoides
    reason: "Competes for similar bottom territories; the advice against mixing Apistogramma is territorial guidance,\
      \ not evidence of a specific cross."
  - species: Astronotus ocellatus
    reason: Large adult size and predation put this dwarf cichlid at risk.
  - species: Chindongo demasoni
    reason: Aggression and alkaline-water husbandry conflict with the selected soft-water community.
profile:
  overview:
    text: "A quiet aquarium with a sheltered floor brings out this dwarf cichlid's courtship and brood care. Adult\
      \ males develop extended fins and two dark body bands, with blue, yellow or warm fin colours varying among\
      \ populations. The species comes from the upper Amazon region of Peru, Colombia and Brazil. Trade colour labels\
      \ do not reliably identify where a fish was collected. Known captive-raised stock is a practical choice when\
      \ its previous water conditions can be established."
    sources:
    - kind: catalog-of-fishes
      title: "Eschmeyer's Catalog of Fishes: Apistogramma species"

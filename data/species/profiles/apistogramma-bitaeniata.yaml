  socialBehavior:
    text: "A male can breed with more than one female, but each female needs an independent refuge. Male pursuit\
      \ and female brood defense can both become persistent. One male and two females is the selected small harem,\
      \ with no extra male included in its minimum tank allowance. Watch for a fish losing access to food or being\
      \ confined to a corner, and have separation space available. Territorial pressure also occurs away from active\
      \ spawning."

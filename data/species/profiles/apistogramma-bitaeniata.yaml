  breeding:
    text: "Females attach eggs inside sheltered cavities and provide most direct care, while the male may defend\
      \ the surrounding area. Reports commonly mention clutches around forty to sixty eggs, with variation between\
      \ accounts. Soft acidic water near 26 C has supported breeding, but spawning alone does not prove that a keeping\
      \ limit is suitable for years. Brood guarding may require separating an adult. Protect young from filter intakes\
      \ and provide suitably small foods once they swim freely. Briefly carrying larvae between refuges is different\
      \ from mouthbrooding."

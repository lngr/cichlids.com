  compatibility:
    text: "Small quiet pencilfish are possible companions when their own group and space requirements are met. Surface-oriented\
      \ fish can also work in a covered aquarium with matching water. Increase space beyond the harem minimum when\
      \ adding a community. Other bottom-territorial cichlids can compete for the same refuges, and catfish may\
      \ disturb eggs or fry even when accepted in a display. No established hybrid group is currently assigned to\
      \ this species; this does not establish reproductive isolation. Large predators, boisterous competitors and\
      \ alkaline-water mbuna are unsuitable choices."

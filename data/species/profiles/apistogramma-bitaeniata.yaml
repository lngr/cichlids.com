  ph:
    value:
      min: 4.7
      max: 6
    confidence: medium
    rationale: "Retain the tally's qualified-majority decision of pH 4.7 to 6.0 with six of six votes agreeing under\
      \ its comparison rule; this is the tally's median of the agreeing endpoints, not a verification method of\
      \ median. The Ampiyacu site with confirmed specimens measured 6.0, Bleher's Taraira collection 5.56, and a\
      \ collector measurement relayed by Acquario.top 4.71. Comparable Nanay forest streams in Romer et al. span\
      \ 4.6 to 5.7. The final envelope is narrower than the Pebas regional range of 4.7 to 6.4 in the hydrochemical\
      \ review; it also omits the lower Nanay values of 4.5 to 5.8 and the cinilabra lake's usual 4.8 to 5.3 with\
      \ a separate reading of 4.1. These regional observations remain evidence but do not establish endpoints at\
      \ confirmed capture sites of this species. The Momon regional mean of 6.14 and general blackwater pH 4 to\
      \ 5 are context, not a species-wide series. Bleher's 6.56 belongs to an uncertain Apaporis identification,\
      \ while the allpahuayo branco station at 7.4 concerns another species and water type. FishBase gives 5 to\
      \ 6 without identified sampling stations. Aquarium recommendations remain separate from habitat measurements;\
      \ the lower endpoint has regional and secondary-source uncertainty, so confidence stays medium."

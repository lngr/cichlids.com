  note: "Catalog of Fishes accepts Apistogramma bitaeniata Pellegrin, 1936, without author parentheses. The public\
    \ CRC page uses parentheses, but the nomenclatural catalog takes precedence. Apistogramma pertense var. bitaeniata\
    \ is the catalogued original combination; sweglesi, klausewitzi and kleei are junior synonyms. The catalog retains\
    \ the original Rio Madeira type locality, while Seriously Fish discusses Kullander's later Leticia interpretation\
    \ and subsequent Madeira reports."

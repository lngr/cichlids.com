  - field: taxonomy.note
    proposals:
    - by: generator
      value: 'The Catalog lists eleven valid described Petrotilapia species and does not list this locality form.
        The supported name is the undescribed trade designation, not a synonym or a described species name.'
    - by: checker-a
      value: 'The Catalog of Fishes lists eleven valid Petrotilapia species (chrysos, flaviventris, genalutea, kitrinos,
        microgalana, mumboensis, nigra, palingnathos, pyroscelos, tridentiger, xanthos), none with Likoma Island
        as type locality and none as a synonym that could cover this form, so the trade name stays undescribed.
        The Cichlid Room Companion lists it as sp. ''likoma barred'', beside a separate sp. ''likoma variable''.
        The name refers to the vertical bars of the female, which in the grouping of Konings and of Lundeba et al.
        marks the P. tridentiger group (fish of the wave-washed upper rocks). Closest described relatives are therefore
        P. tridentiger Trewavas 1935 and the other barred-female members of that group such as P. microgalana and
        P. chrysos; the group assignment of this form itself is inferred from the name and not confirmed by a read
        source.'
    - by: checker-b
      value: 'The Catalog lists 11 valid described Petrotilapia species and no entry for this trade form. The legacy
        and current genus are both Petrotilapia, so the required genus searches coincide. Cichlid Room Companion
        search returned a matching trade-name page, but its page command produced no readable text or archive reference;
        it could not provide evidence.'
    - by: checker-c
      value: The Catalog lists described Petrotilapia species but no available species name for this form. CRC retains
        it in its undescribed forms; the trade name is therefore the valid profile name.
    decision: 'The Catalog of Fishes lists eleven described Petrotilapia species and provides no available name
      for Likoma Barred. CRC separately retains this trade designation as undescribed. The legacy and current genus
      are identical. No read revision establishes synonymy with P. tridentiger or another described congener, so
      congener data remain comparisons. The suggested tridentiger-group placement based only on the trade name is
      not adopted.'
    rationale: 'All runs retain the undescribed name. Checker-a additionally infers tridentiger-group affinity from
      the barred trade label, which no read form-specific account establishes. Checker-b could not read the CRC
      form page; adjudicator access confirms its public undescribed listing and breeding summary. These differences
      do not justify synonymy or a formal group assignment.'

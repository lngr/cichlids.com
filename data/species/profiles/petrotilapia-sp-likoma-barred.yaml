  diet:
    value:
      type: aufwuchs
      bloatSensitive: true
      foods:
      - algal turf
      - biofilm
      - plankton
    confidence: medium
    rationale: 'The four complete runs unanimously agree on aufwuchs and bloatSensitive true; retain the tally''s
      medium confidence and exact foods list. The locality record reports plankton, Malawi-Guru classifies the form
      as a grazing mbuna, and the review and kitrinos paper describe flexible teeth collecting loose biofilm material
      in Petrotilapia. CRC''s tridentiger entry also identifies algae combing, whereas the public Likoma Barred
      entry does not state a feeding type. Oliver calls tridentiger opportunistically omnivorous; retain that congener
      evidence without changing this form''s plant-forward aquarium classification. Bloat sensitivity is a precaution
      transferred from grazer husbandry, not a demonstrated disease rate for Likoma Barred. Differences in the proposed
      foods lists are descriptive rather than independent disagreements over feeding type.'

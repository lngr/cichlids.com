    confidence: low
    rationale: 'Generator proposed 800 L/200 by 60 cm, checker-a 750 L/200 by 60, checker-b 300 L/120 by 50 and
      checker-c 300 L/120 by 45. Component medians give 525 L, 160 cm length and 55 cm front-to-back depth. NCS
      directly recommends 300 L and 120 cm for this form, while Malawi-Guru recommends 800 L and 200 cm; Oliver
      prefers more than 750 L for the genus, and Atlas''s header lists roughly 284 L with a 122 by 46 cm footprint.
      The median is retained as a low-confidence recommendation for one male and three females with separated rock
      areas, above the register minimum to accommodate that adult social unit and below the largest recommendations
      because no form-specific keeping observation establishes 800 L as necessary. A tank about 160 by 55 by 60

  note: 'The Catalog of Fishes lists eleven described Petrotilapia species and provides no available name for Likoma
    Barred. CRC separately retains this trade designation as undescribed. The legacy and current genus are identical.
    No read revision establishes synonymy with P. tridentiger or another described congener, so congener data remain
    comparisons. The suggested tridentiger-group placement based only on the trade name is not adopted.'

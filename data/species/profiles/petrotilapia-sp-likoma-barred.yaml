profile:
  overview:
    text: 'Petrotilapia sp. ''Likoma Barred'' is an undescribed Lake Malawi mbuna associated with rocky shores around
      Likoma Island. Mature males have a blue ground colour and dark vertical bars. The provisional typical aquarium
      maxima here are 16 cm for males and 14 cm for females; locality records report fish reaching 19 cm total length.
      No described-species name has been established for this trade form, and husbandry information is much thinner
      than the familiar trade label may suggest.'
    sources:
    - *id056
    - *id001
    - *id002
    - *id044
    - *id043
    - *id033
  habitat:
    text: 'Locality records include Likoma Island, Maingano Island, Ndumbi Rocks and Taiwanee Reef. Exposed upper
      rock habitat provides grazing surfaces, but non-territorial fish can school and feed on plankton away from
      defended areas. Lake-wide natural ranges are 21-29 C, pH 7.7-8.6, 3-5 dGH and 5-8 dKH. These summarize seasonal
      and regional lake observations rather than a survey of every named reef. Lake Malawi has relatively little
      calcium and magnesium despite appreciable bicarbonate buffering.'
    sources:
    - *id002
    - *id001
    - *id010
    - *id024
    - *id013
  sizeAndGrowth:
    text: 'Plan around estimated typical adult maxima of 16 cm for males and 14 cm for females, while allowing for
      larger individuals. The available form-specific figures range from about 13-15 cm in care registers to 19
      cm in the locality record and about 20 cm in a specialist list. No separate measured female maximum or growth
      series resolves that variation. An 8-10 year lifespan is a provisional husbandry estimate, not a documented
      age record for this form.'
    sources:
    - *id002
    - *id044
    - *id033
  husbandry:
    text: 'For one adult male with three females, the provisional minimum is 525 litres with a footprint at least
      160 cm long and 55 cm front to back. Source recommendations span 300 litres and 120 cm to 800 litres and 200
      cm, so this median remains uncertain. Build stable rock structures with multiple grazing surfaces and shelters
      that interrupt sightlines, while leaving swimming space. Maintain oxygenation, filtration and regular water
      renewal. The tallied long-term envelopes are 21-30 C, pH 7.5-8.6, 3-15 dGH and 5-14 dKH; they are estimated
      keeping ranges, not experimentally demonstrated failure limits. The better-supported routine temperature recommendations
      cluster around 23-28 C, and a stable value within that band is preferable to deliberately using an extreme.'
    sources:
    - *id044
    - *id016
    - *id010
    - *id033
    - *id019
  socialBehavior:
    text: 'A dominant male may occupy a substantial rock area and repeatedly chase rivals or females. One male with
      three females is the practical group used for this profile, rather than a claim that the species forms permanent
      wild harems. CRC records mating by multiple partners, and non-territorial fish may form feeding schools. Territorial
      males can retain feeding and breeding areas beyond an individual spawning event. Subordinate fish need access
      to food and shelter without continually entering the dominant fish''s defended area.'
    sources:
    - *id043
    - *id002
    - *id044
    - *id053
    - *id019
  diet:
    text: 'Use a plant-forward diet suited to an aufwuchs grazer, with algae-based prepared foods and access to
      biofilm. Petrotilapia teeth gather loose material from algal growth; the form-specific account also reports
      plankton feeding. This flexibility does not justify a rich animal-food staple. The bloat-sensitive flag follows
      precautionary grazer husbandry, since no feeding trial measures the risk for Likoma Barred itself. Predation
      level 0 reflects the available evidence, while allowing incidental loss of fry.'
    sources:
    - *id002
    - *id044
    - *id016
    - *id053
    - *id019
  breeding:
    text: 'Females carry the brood in the mouth after spawning. The form-specific CRC entry confirms maternal mouthbrooding,
      while the broader mbuna literature supports mating with multiple partners and the lack of prolonged parental
      care after young become independent. Provide shelter for brooding females and suitable protected space for
      juveniles. No read exact-form source establishes clutch size, incubation length or age at maturity, so numerical
      expectations from other mbuna should remain comparisons.'
    sources:
    - *id043
    - *id053
  sexing:
    text: 'The locality account describes mature males in blue shades with dark vertical bars and females with a
      darker barred body. The provisional male and female sizes are planning estimates rather than diagnostic measurements.
      Colour intensity changes with social condition, and the sources supply no reliable age or length threshold
      for sexing juveniles. Preserve locality information alongside identification because superficially similar
      Petrotilapia trade forms are not established synonyms of this one.'
    sources:
    - *id002
    - *id001
    - *id043
    - *id056
  compatibility:
    text: 'Mixed stocking is possible with appropriately sized, robust Malawi rock dwellers that accept the same
      plant-forward food and have separate defended areas. Evaluate swimming room, access to food and the subordinate
      fishes'' body condition together. The normal feeding-speed estimate does not ensure that a smaller or timid
      fish can compete. Large predators and fish requiring a rich animal-food staple are poor choices. No hybrid
      group is currently supported for this form; that missing evidence does not establish that mixing similar Petrotilapia
      is free of crossing risk.'
    sources:
    - *id044
    - *id002
    - *id016
    - *id019
    - *id053
  problems:
    text: 'Watch for repeated exclusion from shelter or food, damaged fins and declining body condition. The combination
      of a dominant male and poorly divided rock space can create sustained pressure despite adequate nominal volume.
      Digestive trouble after unsuitable feeding is a concern in grazing mbuna, but the evidence does not establish
      a unique disease syndrome in Likoma Barred. Stable water, oxygenation and a suitable diet address the main
      husbandry risks; the numerical tolerance endpoints remain provisional.'
    sources:
    - *id044
    - *id002
    - *id016
    - *id019
    - *id053

      The median is retained as a low-confidence recommendation for one male and three females with separated rock
      areas, above the register minimum to accommodate that adult social unit and below the largest recommendations
      because no form-specific keeping observation establishes 800 L as necessary. A tank about 160 by 55 by 60
      cm has the stated gross volume; rockwork reduces usable volume. These medians do not establish a physiological
      or aggression threshold, and the wider published recommendations remain explicit uncertainty.'

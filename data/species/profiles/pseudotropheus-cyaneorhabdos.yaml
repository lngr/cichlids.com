    rationale: "All four accounts describe the same restricted native rocky coast of northeastern Likoma
      Island between Mbako and Membe, around Maingano. Generator lists the locality labels
      separately; checker-a combines them into one shore description, checker-b adds the Maingano
      area, and checker-c explicitly mentions Maingano Island. These are compatible geographic
      descriptions, so the generator locality list is retained without treating them as distinct
      established forms. Catalog records of introduction to Indonesia are excluded from native
      origin."

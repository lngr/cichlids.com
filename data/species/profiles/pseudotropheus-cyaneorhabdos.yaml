  hybridGroups:
    value:
      - "melanochromis"
    confidence: "medium"
    rationale: "All four votes retain melanochromis, and the tally confidence is medium. Seriously Fish
      gives a crossing warning under the former genus, the Nordic register singles out similarly
      coloured johannii, and TFH warns generally about crosses involving auratus. The 2012 revision
      confirms that cyaneorhabdos and johannii were moved to Pseudotropheus, explaining their
      inclusion despite the modern genus. These are general hobby warnings rather than a verified
      named Maingano cross with free choice of conspecific partners. The existing group therefore
      remains presumed; vote agreement does not establish a documented cross or demonstrate every
      member pairing."

      confidence: "low"
      rationale: "All four proposals, generator and checker-a through checker-c, give 21 to 29 C,
        producing the unanimous tally decision. Seriously Fish and MARE 2000 recommend 24 to 28 C,
        AquaInfo 22 to 26 C, the Nordic register 23 to 28 C and FishProfiles 22 to 28 C. Inclusion
        of the complete natural lake envelope supplies 21 and 29 C; these endpoints are
        habitat-based extrapolations rather than established multi-year aquarium limits. Low
        confidence is retained and 24 to 26 C is a better-supported routine target."

partners:
  suitable:
    - species: "Robust Lake Malawi mbuna with dissimilar colour patterns"
      reason: "Species databases allow mixed mbuna stocking when companions tolerate similar water and a
        vegetable-rich staple."
      condition: "Use a larger aquarium than the 300 L harem minimum; Malawi-Guru suggests at least 400 L
        for mixed stocking. Provide complete conspecific units and separate refuges, and monitor
        subordinate fish."
  unsuitable:
    - species: "Pseudotropheus johannii"
      reason: "Similar horizontally striped males can provoke rivalry; the species shares the presumed
        melanochromis hybrid group."
    - species: "Melanochromis auratus"
      reason: "Strong aggression combines with horizontal-pattern similarity and the presumed
        melanochromis crossing risk."
    - species: "Peaceful Lake Malawi peacocks and utaka"
      reason: "Their quieter behaviour makes persistent harassment by Maingano a concern despite shared
        lake chemistry."
    - species: "Fry and very small fish"
      reason: "Level-1 predation includes opportunistic capture of fry and fish around 2 cm or smaller;
        that cutoff is the rubric convention."
profile:
  overview:
    text: "Maingano is a compact blue and black mbuna from a restricted rocky part of Lake Malawi. Its
      accepted name is Pseudotropheus cyaneorhabdos; Melanochromis maingano is an older trade label.
      Females retain the striped colour pattern, so a colourful group does not have to consist of
      males. The difficult part is managing persistent pursuit and identifying the sexes. Start with
      a reliably identified group of one male and four females, with adult space and shelters
      already available."
    sources:
      - kind: "database"
        title: "Seriously Fish: Melanochromis cyaneorhabdos"
        url: "https://www.seriouslyfish.com/species/melanochromis-cyaneorhabdos/"
        accessed: "2026-10-13"
      - kind: "database"
        title: "Nederlandse Vereniging van Cichlidenliefhebbers: Pseudotropheus cyaneorhabdos, by Serge
          Splitters"
        url: "https://www.nvcweb.nl/visbeschrijvingen/malawi/pseudotropheus-cyaneorhabdos-bowers-stauffer-1\
          997"
        accessed: "2026-10-13"
  habitat:
    text: "Its native range lies around Maingano on northeastern Likoma Island between Mbako Point and
      Membe Point. Field observations place it near small and medium rocks, with several encounters
      at roughly 5 to 10 m. Provide stable rocky shelter with escape routes and open swimming room
      between it. Fine sand is suitable on the floor but rock cover is the essential habitat
      feature. Lake-wide measurements used here are 21 to 29 C, pH 7.7 to 8.6, GH 3 to 5 dGH and KH
      5 to 8 dKH. Alkaline water can have low calcium and magnesium hardness."
    sources:
      - kind: "literature"
        title: "Deproost, W. Reisverslag Melanochromis cyaneorhabdos. AquaInfo field and aquarium report"
        url: "https://aquainfo.nl/reisverslag-melanochromis-cyaneorhabdos/"
        accessed: "2026-10-13"
      - kind: "literature"
        title: "Vanden Bossche, J.-P. and Bernacsek, G. M. (1990). Source book for the inland fishery
          resources of Africa, Vol. 1, CIFA Technical Paper 18/1, FAO. Lake Malawi/Nyasa: physical
          and chemical data after Jackson et al. (1963) and Talling and Talling (1965)."
        url: "https://www.fao.org/4/t0473e/T0473E05.htm"
        accessed: "2026-10-13"
      - kind: "literature"
        title: "Branchu, P., Bergonzini, L., Ambrosi, J.-P., Cardinal, D., Delalande, M., Pons-Branchu, E.
          et al. (2010). Hydrochemistry (major and trace elements) of Lake Malawi (Nyasa), Tanzanian
          Northern Basin: local versus global considerations. Hydrology and Earth System Sciences
          Discussions 7, 4371-4409."
        url: "https://doi.org/10.5194/hessd-7-4371-2010"
        accessed: "2026-10-13"
  sizeAndGrowth:
    text: "Plan for adult males around 10 cm and females around 9 cm, with considerable uncertainty in
      the female estimate. The Dutch AquaInfo account gives smaller sex-specific figures of about 9
      and 7 cm, while other aquarium accounts report adults near 10 cm. FishBase reports 7.5 cm
      standard length, which excludes the tail and is a different measurement. These are planning
      estimates rather than record sizes. Growth rate has not been established reliably; use the
      full adult setup from the start and judge feeding by body condition."
    sources:
      - kind: "database"
        title: "Nederlandse Vereniging van Cichlidenliefhebbers: Pseudotropheus cyaneorhabdos, by Serge
          Splitters"
        url: "https://www.nvcweb.nl/visbeschrijvingen/malawi/pseudotropheus-cyaneorhabdos-bowers-stauffer-1\
          997"
        accessed: "2026-10-13"
      - kind: "database"
        title: "AquaInfo: Pseudotropheus cyaneorhabdos, Maingano, species account by John de Lange"
        url: "https://aquainfo.nl/artikel/pseudotropheus-cyaneorhabdos-maingano/"
        accessed: "2026-10-13"
      - kind: "database"
        title: "fishprofiles.com: Melanochromis cyaneorhabdos"
        url: "https://fishprofiles.com/profiles/freshwater/Cichlids/Melanochromis_cyaneorhabdos/"
        accessed: "2026-10-13"
      - kind: "database"
        title: "FishBase: Pseudotropheus cyaneorhabdos species summary"
        url: "https://www.fishbase.se/summary/Pseudotropheus-cyaneorhabdos.html"
        accessed: "2026-10-13"
  husbandry:
    text: "For one male and four females use at least 300 L, with a base 120 cm long and 50 cm deep. The
      depth is a cautious layout allowance for rockwork rather than a tested minimum. A community
      needs more space; the Malawi specialist guide recommends at least 400 L. Support stones
      securely before adding fine sand and provide multiple routes away from a pursuing male.
      Maintain clean, well-oxygenated water. Around 24 to 26 C is a practical routine target. The
      decided tolerances are 21 to 29 C, pH 7.5 to 8.8, GH 3 to 25 dGH and KH 5 to 10 dKH. Their
      endpoints are provisional guidance rather than tested lifelong limits; KH is particularly
      uncertain."
    sources:
      - kind: "database"
        title: "Malawi-Guru: Pseudotropheus cyaneorhabdos"
        accessed: "2026-10-13"
        url: "https://malawi-guru.de/pseudotropheus-cyaneorhabdos-verzeichnis-mbuna/"
      - kind: "database"
        title: "AquaInfo: Pseudotropheus cyaneorhabdos, Maingano, species account by John de Lange"
        url: "https://aquainfo.nl/artikel/pseudotropheus-cyaneorhabdos-maingano/"
        accessed: "2026-10-13"
      - kind: "database"
        title: "Seriously Fish: Melanochromis cyaneorhabdos"
        url: "https://www.seriouslyfish.com/species/melanochromis-cyaneorhabdos/"
        accessed: "2026-10-13"
  socialBehavior:
    text: "One male with four females spreads courtship attention, but does not guarantee a settled
      group. Rival males can fight severely and a repeatedly pursued female may lose access to
      shelter or food. Watch for continual hiding, damaged fins or a fish confined to one corner. A
      small shelter-based territory can be defended in the aquarium beyond obvious spawning
      activity, even though wild accounts emphasize temporary courtship sites. Several males require
      much more room and an effective separation option. Some published keepers report restrained
      behaviour with dissimilar mbuna, showing that individuals and layout matter."
    sources:
      - kind: "database"
        title: "Nederlandse Vereniging van Cichlidenliefhebbers: Pseudotropheus cyaneorhabdos, by Serge
          Splitters"
        url: "https://www.nvcweb.nl/visbeschrijvingen/malawi/pseudotropheus-cyaneorhabdos-bowers-stauffer-1\
          997"
        accessed: "2026-10-13"
      - kind: "database"
        title: "Nordiska Ciklidsallskapet: Pseudotropheus cyaneorhabdos species register"
        url: "https://www.ciklid.org/artregister/art.php?ID=630"
        accessed: "2026-10-13"
      - kind: "literature"
        title: "Deproost, W. Reisverslag Melanochromis cyaneorhabdos. AquaInfo field and aquarium report"
        url: "https://aquainfo.nl/reisverslag-melanochromis-cyaneorhabdos/"
        accessed: "2026-10-13"
  diet:
    text: "Use a vegetable-rich mbuna pellet or spirulina flake as the staple, with small portions of
      foods such as Cyclops or Artemia. The decided category is omnivore. Natural feeding accounts
      disagree about the relative importance of plankton, bottom-associated invertebrates and algal
      material, so this label should not invite a heavily meaty ration. Species care sources
      associate excessive rich feeding and overfeeding with digestive problems and bloat. Give
      modest portions and ensure subordinate fish can eat. Bloat sensitivity is a precaution based
      on husbandry reports; an altered appetite or swollen abdomen has several possible causes."
    sources:
      - kind: "database"
        title: "Nederlandse Vereniging van Cichlidenliefhebbers: Pseudotropheus cyaneorhabdos, by Serge
          Splitters"
        url: "https://www.nvcweb.nl/visbeschrijvingen/malawi/pseudotropheus-cyaneorhabdos-bowers-stauffer-1\
          997"
        accessed: "2026-10-13"
      - kind: "database"
        title: "Nordiska Ciklidsallskapet: Pseudotropheus cyaneorhabdos species register"
        url: "https://www.ciklid.org/artregister/art.php?ID=630"
        accessed: "2026-10-13"
      - kind: "database"
        title: "Seriously Fish: Melanochromis cyaneorhabdos"
        url: "https://www.seriouslyfish.com/species/melanochromis-cyaneorhabdos/"
        accessed: "2026-10-13"
      - kind: "database"
        title: "FishBase: Pseudotropheus cyaneorhabdos species summary"
        url: "https://www.fishbase.se/summary/Pseudotropheus-cyaneorhabdos.html"
        accessed: "2026-10-13"
  breeding:
    text: "The female incubates the developing brood in her mouth, generally for about three to four
      weeks, while the male continues courting. She often feeds little or not at all during
      incubation. Provide quiet refuges and avoid repeated disturbance. If preserving a brood,
      prepare separate accommodation and consider the stress of removal and return to the group.
      Once released, young are independent and can be eaten by adults, including their mother. Small
      fry take appropriately sized foods such as finely crushed flakes and newly hatched Artemia."
    sources:
      - kind: "database"
        title: "AquaInfo: Pseudotropheus cyaneorhabdos, Maingano, species account by John de Lange"
        url: "https://aquainfo.nl/artikel/pseudotropheus-cyaneorhabdos-maingano/"
        accessed: "2026-10-13"
      - kind: "database"
        title: "Seriously Fish: Melanochromis cyaneorhabdos"
        url: "https://www.seriouslyfish.com/species/melanochromis-cyaneorhabdos/"
        accessed: "2026-10-13"
  sexing:
    text: "Both sexes show blue and dark horizontal stripes. Males often become larger and more
      intensely coloured, but belly shading changes with status and suppressed males can resemble
      females. The colour pattern alone is not a dependable way to assemble a harem. Obtain reliably
      sexed fish where possible and reassess as juveniles mature. A yellow or orange female offered
      as Maingano warrants checking identification, because that is characteristic of Pseudotropheus
      johannii rather than this species."
    sources:
      - kind: "database"
        title: "AquaInfo: Pseudotropheus cyaneorhabdos, Maingano, species account by John de Lange"
        url: "https://aquainfo.nl/artikel/pseudotropheus-cyaneorhabdos-maingano/"
        accessed: "2026-10-13"
      - kind: "database"
        title: "fishprofiles.com: Melanochromis cyaneorhabdos"
        url: "https://fishprofiles.com/profiles/freshwater/Cichlids/Melanochromis_cyaneorhabdos/"
        accessed: "2026-10-13"
      - kind: "database"
        title: "Nordiska Ciklidsallskapet: Pseudotropheus cyaneorhabdos species register"
        url: "https://www.ciklid.org/artregister/art.php?ID=630"
        accessed: "2026-10-13"
  compatibility:
    text: "A spacious community of robust and visibly dissimilar mbuna can work. Plan around both
      territorial pressure and the vegetable-rich staple diet. Similar striped fish are poor
      choices, especially Pseudotropheus johannii and Melanochromis auratus. They also share the
      presumed melanochromis crossing group: that caution rests on hobby warnings, not a confirmed
      named Maingano cross with free partner choice. Peaceful peacocks and utaka are vulnerable to
      persistent harassment. Fry and very small fish face opportunistic predation even though adult
      fish are not the usual natural food."
    sources:
      - kind: "database"
        title: "Seriously Fish: Melanochromis cyaneorhabdos"
        url: "https://www.seriouslyfish.com/species/melanochromis-cyaneorhabdos/"
        accessed: "2026-10-13"
      - kind: "database"
        title: "Nordiska Ciklidsallskapet: Pseudotropheus cyaneorhabdos species register"
        url: "https://www.ciklid.org/artregister/art.php?ID=630"
        accessed: "2026-10-13"
      - kind: "database"
        title: "Nederlandse Vereniging van Cichlidenliefhebbers: Pseudotropheus cyaneorhabdos, by Serge
          Splitters"
        url: "https://www.nvcweb.nl/visbeschrijvingen/malawi/pseudotropheus-cyaneorhabdos-bowers-stauffer-1\
          997"
        accessed: "2026-10-13"
  problems:
    text: "Common setbacks begin with several unsexed juveniles maturing into rival males, too few
      females or rockwork that traps a chased fish. Persistent pursuit can cause injury even in a
      fish of modest size. Excessively rich food and overfeeding are additional concerns, especially
      when combined with deteriorating water quality. Inspect appetite, body condition and access to
      shelter regularly, and quarantine new arrivals. Lifespan reports span roughly 5 to 9 years but
      are weak hobby estimates without validated age data. Sudden appetite loss, abdominal swelling
      or abnormal breathing needs investigation rather than diagnosis from a feeding label."
    sources:
      - kind: "database"
        title: "AquaInfo: Pseudotropheus cyaneorhabdos, Maingano, species account by John de Lange"
        url: "https://aquainfo.nl/artikel/pseudotropheus-cyaneorhabdos-maingano/"
        accessed: "2026-10-13"
      - kind: "database"
        title: "Nederlandse Vereniging van Cichlidenliefhebbers: Pseudotropheus cyaneorhabdos, by Serge
          Splitters"
        url: "https://www.nvcweb.nl/visbeschrijvingen/malawi/pseudotropheus-cyaneorhabdos-bowers-stauffer-1\
          997"
        accessed: "2026-10-13"

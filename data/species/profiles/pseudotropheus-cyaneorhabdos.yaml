      female: 9
    confidence: "medium"
    rationale: "Generator proposed 10 cm male and 8 female, checker-a and checker-b 10 and 9, and
      checker-c 10 and 7. The adopted 10 and 9 are cautious aquarium planning estimates: the Dutch
      association gives males 10 and smaller females, while the Nordic account describes a male
      advantage near 1 cm. AquaInfo explicitly gives 9 and 7, and FishProfiles lists 10 for both
      sexes. These show variation rather than a precisely measured sex-specific ceiling. FishBase
      7.5 cm is standard length from scientific material and excludes the tail; it is not
      substituted for typical aquarium size. The erroneous inches in the AquaInfo English
      translation are disregarded."

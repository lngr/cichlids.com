  temperatureC:
    value:
      min: 21
      max: 29
    confidence: "high"
    rationale: "The decided lake-wide habitat envelope is 21 to 29 C. Eccles reports cool inshore water
      at 21 C; Vollmer describes summer surface water near 28 C and winter water below 24 C, while
      Branchu measured 25.4 C at the northern surface in October 1993. The 2020 lake-wide carbon
      study explicitly reports surface water reaching 29 C during the hot stratified season and
      describes its 2013 sampling campaign. The range is therefore a seasonal lake envelope rather
      than a measured Maingano aquarium limit. The 1999 report and 2018 dissertation are retained as
      background references from the lake synthesis; their full texts could not be checked with the
      DOI-based access tool and contribute no separate evidence entry. These measurements vary with
      season and locality."

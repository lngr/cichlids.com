    genus=Melanochromis. Maingano and Melanochromis sp. Maingano are informal trade designations,
    not separate described nominal species. The 2012 revision records the reassignment and CRC
    public classification corroborates it. All runs agree on the accepted name and original
    combination; checker-c additionally lists the informal trade name as a synonym, which is instead
    explained here. Shore labels are not treated as independently established colour morphs."

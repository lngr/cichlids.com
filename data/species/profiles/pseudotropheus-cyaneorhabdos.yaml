        qualified-majority tally chooses omnivore with bloatSensitive true, supported by generator,
        checker-a and both tiebreakers, four of six votes. Checker-b proposed invertivore and
        checker-c aufwuchs; all six retained the bloat flag. FishBase and Oliver emphasize
        zooplankton and benthic invertebrates in the lake, whereas AquaInfo and Malawi-Guru
        emphasize grazing. The Nordic and Dutch cichlid associations describe mixed feeding;
        Seriously Fish and FishProfiles support a substantial vegetable staple with modest animal
        supplements. No readable quantitative diet study resolves the relative contributions, so
        confidence remains medium. CRC corroborates grazing only and supplies no primary value.
        AquaInfo and the Dutch association explicitly caution about excessively rich feeding; the
        bloat flag is a husbandry precaution rather than a claim that protein alone causes disease.
        The exact food list is the generator proposal retained by the tally; checker-a offered
        alternative vegetable and live or frozen foods, checker-b emphasized small invertebrates,
        checker-c plant-rich pellets and biofilm, and neither tiebreaker supplied a list."

      meq/L converts to 6.5 to 6.9 dKH; Jackson values compiled by FAO convert to 5.6 to 7.3 dKH.
      The decided whole-lake envelope rounds outward. Sodium contributes to bicarbonate balance, so
      KH can exceed calcium and magnesium hardness without implying a high GH."

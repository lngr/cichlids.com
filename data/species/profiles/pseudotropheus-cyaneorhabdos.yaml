      readable quantitative diet study resolves the relative contributions, so confidence remains
      medium. CRC corroborates grazing only and supplies no primary value. AquaInfo and the Dutch
      association explicitly caution about excessively rich feeding; the bloat flag is a husbandry
      precaution rather than a claim that protein alone causes disease. The exact food list is the
      generator proposal retained by the tally; checker-a offered alternative vegetable and live or
      frozen foods, checker-b emphasized small invertebrates, checker-c plant-rich pellets and
      biofilm, and neither tiebreaker supplied a list."

    rationale: "Keep the conservative tally decision of aufwuchs with bloatSensitive true and low confidence. Generator,\
      \ checker-c and tiebreaker-1 proposed omnivore with the sensitivity flag true; checker-a proposed invertivore\
      \ with the flag true; checker-b proposed omnivore with the flag false; tiebreaker-2 proposed aufwuchs with\
      \ the flag true. No qualified majority settles both flags, so the rubric selects the strictest proposed diet\
      \ and retains a sensitivity flag reported by any voter. The 2017 predator-discrimination paper describes herbivory\
      \ and rock-film grazing, Tanganyika.si makes algal aufwuchs primary, and Liem provides broader herbivorous-lineage\
      \ context. FishBase and CRC emphasize plankton without separating plant from animal plankton. Anikstein describes\
      \ substantial zooplankton intake, while NCS, Maidenhead and the Polish keeper describe mixed aquarium feeding;\
      \ these disagreements stay visible. Interaquaristik instead recommends invertebrate food without plants, conflicting\
      \ with the stronger plant-feeding evidence. The bloat flag is inferred from Seriously Fish and Maidenhead\
      \ warnings against rich protein feeding; no cited study demonstrates diet-induced bloat or its incidence.\
      \ Low confidence records that this is a protective compatibility decision, not unanimity about feeding ecology."
  - field: features.aggressionConspecific
    proposals:
    - by: generator
      value: 3
    - by: checker-a
      value: 2
    - by: checker-b
      value: 3
    - by: checker-c

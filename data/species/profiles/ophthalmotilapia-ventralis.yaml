    confidence: high
    rationale: "All agents identify Lake Tanganyika. The generator gives southern and central shoreline, checker-a\
      \ includes Kinyamkolo, Kombe, Mbity Rocks and a lake-wide rocky-shore distribution, checker-b gives the lake\
      \ shoreline without a boundary, and checker-c restricts the named coasts to Zambia, southern Congo and southern\
      \ Tanzania. FishBase and the locality specialist support the southern core; Seriously Fish includes much more\
      \ shoreline, but some northern trade populations are treated as unresolved taxa by Tanganyika.si. Use the\
      \ lake as the secure region and name the well-supported southern core without claiming that the northern taxonomic\
      \ boundary is settled."

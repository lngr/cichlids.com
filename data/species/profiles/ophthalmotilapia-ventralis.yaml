    decision: 3
    rationale: "Generator, checker-b and checker-c proposed 3; checker-a proposed 2. Seriously Fish describes forceful\
      \ courtship and male rivalry, and the Kever colony needed a change from three males with four or five females\
      \ to one male with three or four females because persistent male pressure hindered reproduction. Level 3 best\
      \ captures sustained pursuit when ratio or space is unsuitable; it does not claim routine lethal attacks in\
      \ a suitable harem."
  - field: features.aggressionHeterospecific

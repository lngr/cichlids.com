  husbandry:
    text: "The selected starting aquarium is 300 L with a 150 by 45 cm footprint for one male and four females.\
      \ Provide a sandy court area, separated rocky outcrops and ample swimming room; arrange cover so a pursued\
      \ fish can leave the male's view. Multiple males require a larger arrangement. Filtration, aeration and regular\
      \ partial water changes matter because the fish responds poorly to deteriorating conditions. The retained\
      \ aquarium envelope is 23-29 C, pH 7.5-9.4, 8-25 dGH and 10-20 dKH. Its extreme temperature and pH bounds\
      \ partly come from the requirement to include natural lake conditions; care sources favour about 25-26 C and\
      \ stable alkaline water rather than deliberately targeting the outer limits. Measure GH and alkalinity separately."

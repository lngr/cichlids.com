  problems:
    text: "Watch for repeated pursuit, failure to feed, loss of display colour and difficulty settling after transport.\
      \ These signs can arise from social pressure, unsuitable layout or declining water quality. Rich feeding conflicts\
      \ with the adopted dietary precautions; the literature does not quantify a species-specific bloat rate. Warm\
      \ water also makes reliable oxygenation especially important. Investigate the aquarium conditions when fish\
      \ deteriorate rather than assuming a particular diagnosis from these general signs."

  sizeAndGrowth:
    text: "For well-kept adults, allow about 15 cm total length for a male and 12 cm for a female. Some accounts\
      \ give males up to 16 cm; Seriously Fish uses standard length, whereas FishBase uses total length, so these\
      \ figures should not be treated as identical measurements. Smaller females and subdued juveniles need space\
      \ alongside the displaying male. An estimated lifespan of 8-10 years has only weak support from husbandry\
      \ listings and should not be read as a measured survival distribution."

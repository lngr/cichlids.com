    tolerance:
      value:
        min: 10
        max: 20
      confidence: low
      rationale: "Keep the qualified-majority tally of 10-20 dKH with low confidence. Generator and checker-c proposed\
        \ 15-20, checker-a proposed 8-20, checker-b proposed 10-22, and tiebreaker-1 and tiebreaker-2 proposed 10-20.\
        \ Abysse recommends KH 10, Aqueon gives 10-20 for Tanganyika fish generally, and Schuler reports aquarium\
        \ KH 12 with growth problems and losses that prevent a claim of a proven safe threshold. The Polish keeper\
        \ recommends 16-18, Interaquaristik gives a minimum of 8, and the AC shop gives 8-16 without documented\
        \ long-term outcomes. Kever reports research water above 8 dKH, not a measured lower health limit. The selected\
        \ 10-20 interval is narrower than the general Tanganyika.si aquarium range of 11-22 at the upper end and\
        \ narrower than checker-b's 10-22 proposal; species-specific evidence for extending to 22 is absent. Twenty\
        \ includes the full natural 15-20 envelope. Retained Maidenhead evidence mapped to 8-20 by checker-a is\
        \ an agent inference from qualitative buffered-water advice, not a numerical KH statement on that page.\
        \ This is provisional husbandry guidance, not a controlled long-term tolerance measurement."

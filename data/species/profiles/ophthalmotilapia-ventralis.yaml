  socialBehavior:
    text: "Use a single male with four females as the practical unit for the stated minimum tank. Wild non-territorial\
      \ fish can forage together, but breeding males defend court areas and may pursue rivals or females persistently.\
      \ A multi-male display is a different stocking arrangement and cannot be assumed suitable at the minimum size.\
      \ Monitor whether each fish can feed and rest away from the male. Peaceful neighbours can coexist when they\
      \ have their own space; a fish that stays hidden or loses colour may be under social pressure."

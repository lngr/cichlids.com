  maxSizeCm:
    value:
      male: 15
      female: 12
    confidence: medium
    rationale: "All four proposals are male 15 cm and female 12 cm, so these are also the component medians. FishBase\
      \ gives 15 cm total length for male or unsexed fish, while Seriously Fish uses standard length and cannot\
      \ be interpreted as the same measurement. Tanganyika.si gives typical aquarium adults near 15 cm total length\
      \ with females around 12, and Anikstein reports males 14-16 and females up to 12. Abysse gives an unsexed\
      \ 12-14 cm range and Interaquaristik estimates females near 10. Retain the sex-specific typical values rather\
      \ than interpreting an unsexed maximum as a measured female maximum."

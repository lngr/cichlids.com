      \ providing documented natural hybridization under the rubric. Kever et al. additionally observed a female\
      \ ventralis mating with a male nasuta and later obtained four surviving hybrid offspring without same-species\
      \ males; that laboratory result alone would be presumed. Generator treated the captive context as presumed,\
      \ while checker-a and checker-b supported documented and checker-c cited earlier genetic evidence without\
      \ specifying basis. The wild genetic evidence determines documented for the group. This does not extend pairwise\
      \ risk to every congener or make locality forms separate species."

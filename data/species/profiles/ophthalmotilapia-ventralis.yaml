  compatibility:
    text: "Choose peaceful Tanganyika fish that can use distinct spaces, including appropriately housed Cyprichromis\
      \ and modest rock dwellers. This species can be kept in a community, but aggressive neighbours may suppress\
      \ its feeding and display. Tropheus presents a social and competition risk rather than an automatic mismatch\
      \ with the decided plant-based diet. Wild genetic evidence documents crossing between ventralis and nasuta;\
      \ captive matings also occurred without same-species males. Keeping a single identified locality line helps\
      \ retain stock identity. General warnings about other congeners remain cited, but the curated species pair\
      \ supported here is ventralis with nasuta."

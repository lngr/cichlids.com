  minTank:
    value:
      volumeL: 300
      lengthCm: 150
      depthCm: 45
    confidence: medium
    rationale: "Generator proposed 300 L with 150 by 45 cm, checker-a and checker-b 231 L with 135 by 45 cm, and\
      \ checker-c 400 L with 150 by 60 cm. Component medians are 265.5 L, 142.5 cm length and 45 cm depth. Checking\
      \ those interpolations against the sources favours the explicit Tanganyika.si guidance near 300 L for fewer\
      \ males and the approximately 150 cm length used by Maidenhead and NCS, for the selected one male with four\
      \ females. Seriously Fish gives the smaller documented alternative of about 231 L and 135 by 45 cm; the retained\
      \ 45 cm depth follows that explicit base recommendation. NCS recommends 400 L for its broader social arrangement,\
      \ Tanganyika.si recommends 400 L for multiple males, and Abysse gives 600 L without specifying the social\
      \ unit. The selected size is a supported practical single-male recommendation, not the largest proposal and\
      \ not a proven exclusion threshold for the smaller Seriously Fish arrangement."

    rationale: "Generator, checker-a and checker-b proposed 1; checker-c proposed 2. Seriously Fish describes a\
      \ relatively peaceful community fish with spawning-site defence, and Maidenhead warns mainly about its withdrawal\
      \ under aggressive neighbours. Level 1 follows these accounts of local defence; the evidence does not establish\
      \ regular pursuit throughout a larger territory in a suitable community. Checker-c's stronger interpretation\
      \ remains in the evidence."

  ghDgh:
    value:
      min: 10
      max: 13
    confidence: high
    rationale: "The natural 10-13 dGH envelope is the settled lake decision. FAO/FINNIDA surface calcium and magnesium\
      \ measurements convert to approximately 11.1-11.5 dGH; Cohen et al. give approximately 12.2 dGH, and the older\
      \ Talling values reproduced by FAO give about 11.3 dGH. This is general hardness derived from calcium and\
      \ magnesium, separate from alkalinity. Broader aquarium recommendations remain visible in the evidence."

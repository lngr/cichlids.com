  breeding:
    text: "Courtship centres on a male's cleared patch, pit or sand court, sometimes on rock. A receptive female\
      \ collects eggs and sperm while responding to the coloured pads on his elongated pelvic fins. She then broods\
      \ in her mouth for roughly three to four weeks before releasing free-swimming young. Disturbance and persistent\
      \ pursuit can interrupt brooding, so observe carrying females without unnecessary handling. The male does\
      \ not form a lasting pair or share the female's incubation work."

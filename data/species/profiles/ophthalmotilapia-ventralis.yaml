    rationale: "The natural 15-20 dKH envelope is the settled lake decision, expressed as aquarium alkalinity rather\
      \ than calcium-and-magnesium hardness. FAO/FINNIDA bicarbonate and carbonate titrations reach approximately\
      \ 15.4 dKH at the low end; Cohen et al. report 6.5-6.6 meq/L, equivalent to 18.2-18.5 dKH, and the FAO source\
      \ book reproduces 6.71 meq/L, about 18.8 dKH. Langenberg summarizes comparable measurements. Sodium and potassium\
      \ buffering allows alkalinity to exceed GH. No natural KH verification object is attached."

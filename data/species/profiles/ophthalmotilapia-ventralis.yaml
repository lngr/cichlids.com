  sexing:
    text: "Adult males are usually larger, brighter and longer-finned, especially in the pelvic fins. Females remain\
      \ more subdued. Colour alone is unreliable for young or subordinate fish, so assess maturity, fin proportions\
      \ and behaviour together. Male colour and markings vary with locality. Some stocks marketed under the broad\
      \ ventralis label have unresolved taxonomic placement, making a reliable locality record useful alongside\
      \ visual identification."

    decision:
      min: 7.5
      max: 9.4
    rationale: "Keep the qualified-majority tally of 7.5-9.4 with medium confidence. Generator, checker-a, tiebreaker-1\
      \ and tiebreaker-2 proposed 7.5-9.4, checker-b proposed 7.5-9.5, and checker-c proposed 8.0-9.4. Seriously\
      \ Fish gives 7.5-9.0, Abysse gives a minimum of 7.5, and the Polish husbandry article warns against lower\
      \ pH. Maidenhead gives 8.0-9.0 and NCS 8.8-9.3. The decided range is narrower than the general Tanganyika.si\
      \ aquarium recommendation of 8.0-9.5 at its upper end: 9.4 retains the entire natural range, without adopting\
      \ the broader generic 9.5 endpoint. The AC shop claim of 6.5-7.8 is preserved but lacks long-term outcomes\
      \ and conflicts with stronger alkaline-water guidance. FishBase environmental pH 7.5-8.0 does not establish\
      \ an aquarium upper limit. The endpoints combine care advice with habitat coverage rather than controlled\
      \ physiological trials."

      \ breeding-only territory. The cleared nest can be small, as the experimental and locality accounts describe,\
      \ but Seriously Fish reports dominant males defending several metres around spawning courts in nature, and\
      \ Maidenhead describes larger craters. The rubric concerns defended space rather than just the nest depression,\
      \ so large is retained. The predator-discrimination paper describes defence confined to spawning craters rather\
      \ than a separate feeding territory, supporting breedingOnly and preserving uncertainty about exact aquarium\
      \ boundaries."

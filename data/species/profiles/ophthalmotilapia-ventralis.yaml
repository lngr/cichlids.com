partners:
  suitable:
  - species: Cyprichromis leptosoma
    reason: Peaceful schooling Tanganyika fish using the water column; this reduces direct competition over the
      court.
    condition: Allow the Cyprichromis group its own swimming space and expand the tank for the combined stocking.
  - species: Julidochromis transcriptus
    reason: Rock crevices can provide a separate space from the featherfin court.
    condition: Provide distinct rock territories and monitor defence during breeding.
  unsuitable:
  - species: Ophthalmotilapia nasuta
    reason: Wild genetic introgression and captive heterospecific matings support the documented pairwise crossing
      risk.
  - species: Tropheus moorii
    reason: Assertive activity and competition can suppress ventralis feeding and display; the plant-based dietary
      categories themselves overlap.
  - species: Chindongo demasoni
    reason: Strong mbuna territorial pressure is a poor match for a featherfin that depends on peaceful surroundings.
profile:
  overview:
    text: "Long pelvic fins ending in bright pads distinguish mature male Ophthalmotilapia ventralis. This Lake\
      \ Tanganyika cichlid combines courtship-site defence with feeding in the nearby water column and on rock surfaces.\
      \ Females carry the developing brood in their mouths. Its display depends on a settled social arrangement\
      \ and peaceful surroundings, making it a demanding choice for a keeper who can provide a long aquarium and\
      \ stable, well-oxygenated water."

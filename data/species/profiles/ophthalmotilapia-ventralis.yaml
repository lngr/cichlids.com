      \ and husbandry literature. Mixed captures locality variation better than a plain blue morph alone. White\
      \ is not retained as a dominant species-wide colour because Tanganyika.si separates the strongly white-marked\
      \ northern whitecap stock as an unresolved taxon; the conflicting white proposals remain visible."

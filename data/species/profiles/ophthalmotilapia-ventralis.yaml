  diet:
    text: "The compatibility category is aufwuchs with a provisional protein-sensitivity flag. Ecological accounts\
      \ support herbivory and rock-film grazing, while other sources emphasize drifting plankton or successful mixed\
      \ feeding. Use algae- and vegetable-containing prepared foods as the main diet, with appropriately small planktonic\
      \ animal foods as occasional supplements. Do not make rich animal feeds the staple. The bloat-related flag\
      \ comes from dietary caution in care literature, rather than a controlled demonstration of disease, and does\
      \ not mean that all animal food is forbidden."

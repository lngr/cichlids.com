  habitat:
    text: "The secure distribution is Lake Tanganyika, particularly its southern rocky shores in Zambia and neighbouring\
      \ Congolese and Tanzanian waters. Accounts disagree on the northern extent: some older profiles include much\
      \ of the shoreline, while the locality specialist separates northern whitecap and some yellow populations\
      \ as unresolved forms. Shallow rocky slopes, sand patches and water immediately above the shore provide grazing,\
      \ plankton feeding and spawning space. The adopted lake envelope is 23-29 C, pH 8.4-9.4, GH 10-13 dGH and\
      \ alkalinity 15-20 dKH, supported by limnological measurements rather than generic aquarium targets."

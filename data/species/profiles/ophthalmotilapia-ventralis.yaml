    tolerance:
      value:
        min: 8
        max: 25
      confidence: medium
      rationale: "Keep the unanimous tally of 8-25 dGH with medium confidence. Generator, checker-a and checker-b\
        \ proposed 8-25, while checker-c proposed 10-25; their lower bounds agree within the two-degree tally threshold.\
        \ Seriously Fish explicitly recommends 8-25 dGH, covering the natural 10-13 range. Maidenhead gives 15-25\
        \ dH and the Tanganyika.si general care page 8-20 dGH. These narrower recommendations are retained without\
        \ treating their endpoints as demonstrated health boundaries. GH figures do not supply KH evidence."

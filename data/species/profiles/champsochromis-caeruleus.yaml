  compatibility:
    text: "Judge companions by their actual adult body size and robustness, with enough room for all fish to use
      the aquarium. Large Malawi haplochromines are possible candidates, but no named combination is
      guaranteed. Juveniles of otherwise large species can still be swallowed, and small mbuna or small
      peacocks are poor choices. Nimbochromis livingstonii and other substantial Malawi predators are
      conditional possibilities in a system sized for the complete adult community. Fossorochromis rostratus
      has an additional risk: a breeder reports an accidental cross with Champsochromis caeruleus. The report
      does not establish free choice of conspecific mates, so this is a presumed crossing risk based on a
      single commercial account. The species is therefore not restricted to an exclusive species tank, while a
      pure breeding project needs particular care in companion selection."

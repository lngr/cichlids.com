  sizeAndGrowth:
    text: "Plan around a working adult maximum of about 37 cm for males and 27 cm for females. These rounded
      median estimates sit within Malawi.si's wider 35 to 40 cm male and 25 to 30 cm female intervals, so
      individuals can exceed the selected figures. Published measurements also differ in convention: FishBase
      gives 32.2 cm total length for a male or unsexed fish, whereas Seriously Fish gives 32.5 cm standard
      length, excluding the tail. Juvenile groups can look manageable long before the adult fish require a
      much longer swimming lane. Lifespan is less securely known: the working estimate is 8 to 12 years, with
      an unverified retailer claim of 15 years retained as a possible longer outcome."

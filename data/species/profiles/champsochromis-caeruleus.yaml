  sexing:
    text: "Reliable visual sexing depends on maturity and condition. Males usually become larger and develop
      stronger blue coloration, red details and extended fin rays; the dark oblique flank stripe is often
      concealed in a fully coloured male. Females remain smaller and more silvery with shorter fins and a
      clearer stripe. Juveniles and subordinate males can remain subdued, so pale coloration alone does not
      establish that a fish is female. A locality name such as Nkhata Bay identifies provenance rather than a
      separate sexing rule or an established colour morph."
    sources:

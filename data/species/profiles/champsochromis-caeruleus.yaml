    confidence: "high"
    rationale: "The settled natural range is 5 to 8 dKH, with high confidence and no verification object. Branchu
      et al. report lake alkalinity of about 2.33 to 2.46 meq/L, equivalent to 6.5 to 6.9 dKH. The Jackson et
      al. values compiled by FAO are 2.00 to 2.59 meq/L, equivalent to 5.6 to 7.3 dKH. Rounding outward gives
      5 to 8 dKH. These alkalinity measurements can exceed GH because sodium also balances bicarbonate; GH
      cannot be converted directly into KH."

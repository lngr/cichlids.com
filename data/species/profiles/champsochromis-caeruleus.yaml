      possible. FishBase reports 32.2 cm male or unsexed total length, Seriously Fish 32.5 cm standard length,
      Wet Spot and Aquario about 32 cm, Abysse 25 cm without sex, and Flowgrow 21 cm for each sex. Standard
      and total lengths are not directly comparable, and isolated smaller entries do not establish a typical
      aquarium maximum for both sexes. The sex-specific specialist intervals support the median-based decision
      without using the largest proposal as a record size."

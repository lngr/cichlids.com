    tolerance:
      value:
        min: 3
        max: 30
      confidence: "medium"
      rationale: "The qualified majority is 5 of 6 votes for 3 to 30 dGH, with medium confidence. Generator,
        checker-a, checker-b, tiebreaker-1 and tiebreaker-2 propose 3 to 30; checker-c proposes 3 to 20.
        Seriously Fish recommends 10 to 30 dGH and FishBase lists 5 to 30 dH, supporting the upper boundary of
        30. The lower boundary includes natural 3 to 5 dGH water. Cichlid Atlas gives the narrower 10 to 20 dH
        target and Einrichtungsbeispiele gives 5 to 15 dGH; these are care recommendations, not demonstrated
        damage thresholds. Flowgrow gives the wider 7 to 40 dGH interval without a supporting keeping account,
        so its 40 dGH maximum receives less weight. The aquarium report at GH 13 is a single observation.
        Malawi-Guru describes natural GH 3 to 4 and general fishkeeping GH 4 to 15; neither changes the
        species-specific upper recommendation. No controlled multi-year tolerance experiment was found."

  problems:
    text: "The most predictable failures arise when adult space, prey exclusion or waste management are
      underestimated. Restricted swimming room also makes escape from an insistent male harder. Overfeeding
      can reduce the characteristic lean shape and degrade water quality; a low predation or aggression
      impression in juveniles does not make small companions safe later. Stable alkaline water needs
      monitoring, and the broad GH and estimated KH tolerances should not be treated as reasons to force
      extreme chemistry. A generic hobby disease list mentions bloat and infections but provides no
      species-specific trial. The inherited report of group losses in forum thread 19134 concerns another fish
      and cannot be used to diagnose a disease or quantify aggression in this species."

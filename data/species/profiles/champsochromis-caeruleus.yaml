  husbandry:
    text: "For one adult male with three females, use at least 1000 L, 250 cm length and 60 cm front-to-back depth
      as the working minimum. These dimensions combine the long-tank specialist recommendation with a
      published 60 cm footprint; they are not an exact tank model specified by one source. Seriously Fish
      gives a smaller 648 L minimum and prefers larger accommodation, while another hobby guide recommends
      1200 L for adults. Leave the centre open, provide sand and arrange limited cover where females can
      withdraw. Strong biological filtration, oxygenation and regular partial water changes are essential
      practical provisions. Species-specific care advice commonly centres on 24 to 27 C and pH 7.5 to 8.5. The
      wider planning tolerances are 21 to 30 C, pH 7.5 to 8.6, GH 3 to 30 dGH and KH 5 to 15 dKH; their outer
      limits are not all demonstrated lifetime endpoints, especially KH."

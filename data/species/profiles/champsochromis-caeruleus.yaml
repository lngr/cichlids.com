  socialBehavior:
    text: "Courtship pressure determines the aquarium social arrangement. Keep one male with at least three
      females and enough space for each female to leave his approaches; mature rival males require exceptional
      space and management. Wild adults often occur alone, so the recommended aquarium harem should not be
      read as a permanent wild social group. During breeding, a male prepares and defends a sandy site; the
      specialist account reports bowers around a metre across. Away from that context, a permanent large
      defended territory is not established. With suitably large other species the fish is comparatively
      tolerant, while prey-sized neighbours are a feeding risk."
    sources:
      - kind: "database"
        title: "Seriously Fish: Champsochromis caeruleus"
        url: "https://seriouslyfish.com/species/champsochromis-caeruleus"

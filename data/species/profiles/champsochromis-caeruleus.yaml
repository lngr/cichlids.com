  diet:
    text: "Offer varied foods based on aquatic animals, with portions suited to maintaining a lean adult body.
      Small fish, including Engraulicypris sardella, form the natural prey base. Prepared fish, shrimp and
      mollusc foods can meet that feeding style without supplying live feeder fish; dried carnivore foods are
      accepted but should supplement the varied menu described in the care literature. Avoid excessive meals
      and remove leftovers before they burden filtration. The profile does not flag the rubric-specific
      intolerance of a high-protein diet, because animal prey is natural food. That decision does not rule out
      digestive illness or the generic bloat warning found in one hobby page."

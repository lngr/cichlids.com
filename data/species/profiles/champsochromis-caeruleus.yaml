  temperatureC:
    value:
      min: 21
      max: 29
    confidence: "high"
    rationale: "The settled waterbody decision is 21 to 29 C with high confidence. Eccles (1974), available only
      as an abstract, describes 21 C inshore cooling in the southeast arm and about 27 C in the upper 60 m by
      May. Vollmer et al. (2005) report surface water around 28 C in summer and below 24 C in winter. The
      broader seasonal lake synthesis also incorporates the Ngochera study; its accessible repository abstract
      does not independently expose the 29 C measurement. These are seasonal habitat limits across the lake,
      not a recommendation to fluctuate the aquarium across them. The inherited Vollmer DOI ending .727 omits
      a zero; the correct DOI ends .0727 and is cited separately. The Eccles publisher URL returned HTTP 403,
      and no full text was used."

partners:
  suitable:
    - species: "Aristochromis christyi"
      reason: "A conditional candidate among large Malawi predators; a keeper lists the two together, but that
        observation does not establish reliable long-term compatibility."
      condition: "Use only comparably sized adults in an aquarium sized for the complete community; 1000 L and 250
        cm are the trout harem baseline, not an automatic allowance for extra adults."
    - species: "Buccochromis nototaenia"
      reason: "A keeper lists this large Malawi hap with the trout cichlid in a 3150 L aquarium; shared water
        requirements and adult size make it a conditional candidate."
      condition: "Provide substantially more space for the combined adult stock and exclude prey-sized juveniles."
    - species: "Nimbochromis livingstonii"
      reason: "An adult large enough to resist swallowing is a plausible companion under the published
        large-Malawi-predator guidance; the pairing remains an inference, not a verified compatibility trial."
      condition: "Use comparably sized adults with retreat room and capacity to separate incompatible individuals."
  unsuitable:
    - species: "Labidochromis caeruleus"
      reason: "Small body size leaves it vulnerable to a dedicated fish predator; mbuna also do not fit the
        preferred open swimming setup."
    - species: "Chindongo demasoni"
      reason: "Its small adult size makes it potential prey, with additional differences in feeding niche and
        preferred aquarium structure."
    - species: "Aulonocara baenschi"
      reason: "Small individuals are vulnerable to swallowing and are poor candidates alongside a large adult trout
        cichlid; peacock size alone does not establish safety."
    - species: "Fossorochromis rostratus"
      reason: "A breeder reports an accidental cross with the trout cichlid, making the combination unsuitable for
        maintaining unmixed breeding stock despite its appearance in general tankmate advice."
profile:
  overview:
    text: "An adult Malawi trout needs its permanent aquarium planned before it is bought. Champsochromis
      caeruleus combines a long cruising body with a mouth suited to catching other fish, so small companions
      remain at risk even when the predator shows little territorial aggression. It is endemic to Lake Malawi
      and ranges widely around the lake. A mature male develops blue coloration with red details and elongated
      fins. The recommended breeding unit is one male and three females in a long, very large aquarium; an
      adult kept singly still needs substantial swimming room."
    sources:
      - kind: "database"
        title: "Seriously Fish: Champsochromis caeruleus"
        url: "https://seriouslyfish.com/species/champsochromis-caeruleus"

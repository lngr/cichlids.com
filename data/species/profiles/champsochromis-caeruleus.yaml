        directly stated 60 cm footprint in Seriously Fish: Malawi.si gives no depth, so the inherited 70 and
        80 cm attributions are unsupported. The selected combination is a synthesis for one adult male with
        three females, with clear swimming and retreat areas. Seriously Fish gives a smaller 648 L, 180 by 60
        cm minimum with a preference for more space; Wet Spot gives 700 L, Abysse 800 L, Einrichtungsbeispiele
        1200 L, and one forum keeper 473 L. Aquarium Stocking Calculator gives 300 L without a suitable
        adult-harem footprint. These different recommendations are retained rather than treating a small

      rationale: "The qualified majority is 5 of 6 votes for 5 to 15 dKH, with low confidence. Generator proposes 5
        to 12; checker-a, checker-b, checker-c, tiebreaker-1 and tiebreaker-2 propose 5 to 15. The selected
        interval includes natural 5 to 8 dKH water. JBL recommends 5 to 10 dKH for a Malawi rocky-habitat
        community, Abysse gives this species a point target of KH 10, and an aquarium keeper reports KH 14
        with this species present. The upper limit of 15 is a rounded provisional allowance around that
        reported practice, not a demonstrated lifetime limit. Flowgrow's wider carbonate-hardness interval of
        0 to 30 has a dGH unit label and no supporting husbandry observations; it does not establish health at
        those extremes. The generator ceiling of 12 would exclude the KH 14 report without evidence of harm.
        Malawi-Guru's illustrative GH 15 and KH 12 relationship cannot be used to calculate this species' KH
        limits."

  habitat:
    text: "Room to cruise above the bottom matters more than dense rock cover. This predator uses open water over
      sand and rock around Lake Malawi; specialist accounts describe frequent use of shallow water, while
      Oliver relays records down to at least 55 m. Sand also provides the spawning surface. The natural lake
      ranges adopted here are 21 to 29 C, pH 7.7 to 8.6, GH 3 to 5 dGH and KH 5 to 8 dKH. Lake water therefore
      has modest calcium and magnesium despite appreciable bicarbonate buffering. The seasonal lake envelope
      is broader than the usual aquarium temperature recommendation and does not justify abrupt changes in
      captivity."
    sources:

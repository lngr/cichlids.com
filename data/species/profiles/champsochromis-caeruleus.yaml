  breeding:
    text: "Females incubate the brood in the mouth after spawning over a prepared sandy site. For aquarium
      breeding, one male with three or more females allows his repeated approaches to be distributed, with
      hiding space for unreceptive females. Seriously Fish reports incubation lasting about three to four
      weeks. Disturbance can interrupt brooding, and removing a female also changes her place in the group, so
      handling deserves care. Newly released young can take suitably small foods. The sources confirm captive
      breeding, but their accounts do not justify assuming that every adult group will breed readily."
    sources:

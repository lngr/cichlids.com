      et al. measured calcium and magnesium in the upper 50 m that convert to approximately 4.2 to 4.6 dGH.
      Earlier lake chemistry compiled by FAO spans about 3.2 to 4.9 dGH. The adopted whole-number interval
      encloses those results. The 5 to 30 dH FishBase summary and 10 to 30 dGH aquarium recommendation do not
      establish natural lake hardness."

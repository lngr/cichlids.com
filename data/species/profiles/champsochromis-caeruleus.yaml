      rationale: "The tally decides 21 to 30 C with unanimous verification under the one-degree agreement threshold
        and low confidence. Generator and checker-a propose 21 to 30 C; checker-b and checker-c propose 21 to
        29 C. Seriously Fish and Wet Spot recommend 24 to 27 C, FishBase lists 24 to 26 C, and Aquarium
        Stocking Calculator gives 24 to 28 C. The wider selected interval contains the entire natural 21 to 29
        C range; its 30 C ceiling is an inferred allowance from general Malawi keeping practice, not a
        measured long-term endpoint. Flowgrow gives 21 to 26 C. Stable conditions near the species-specific
        care recommendations are better supported than sustained exposure at either selected extreme."

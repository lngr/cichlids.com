partners:
  suitable:
  - species: "Aristochromis christyi"
    reason: "A robust large Malawi predator recorded with fusco in the cited 4000-litre community."
    condition: "Comparable adult size, substantially more space than the harem minimum, visual cover and a\
      \ separation option."
  - species: "Buccochromis spectabilis"
    reason: "A large Malawi hap with similar water and feeding needs, recorded in the same spacious community."
    condition: "A very large aquarium meeting both adult social-unit requirements; exclude small or newly purchased\
      \ juveniles."
  - species: "Dimidiochromis compressiceps"
    reason: "A substantial Malawi predator recorded with fusco in the cited large aquarium."
    condition: "Use robust adult fish that cannot be swallowed, ample open space and retreats; monitor individual\
      \ aggression."
  unsuitable:
  - species: "Nimbochromis venustus"
    reason: "Shares the presumed nimbochromis crossing group; a breeding community risks mixed offspring and\
      \ rival male aggression."
  - species: "Paracheirodon innesi"
    reason: "Small enough to be prey, with a community-fish temperament and water requirements poorly matched\
      \ to a large Malawi predator."
  - species: "Tropheus moorii"
    reason: "A specialized grazing cichlid with a plant-based feeding requirement, different lake chemistry\
      \ and social needs that conflict with this predator setup."
  - species: "Chindongo demasoni"
    reason: "Small adult size and a grazing-focused diet make it an inappropriate companion for a 25 cm fish-eating\
      \ hap."
profile:
  overview:
    text: "A mature male fusco makes a striking centerpiece for a very large Malawi aquarium. Blue to green\
      \ body color and red fin accents develop over the irregular camouflage pattern seen more clearly in females\
      \ and young fish. That attractive appearance comes with a serious stocking constraint: this is a dedicated\
      \ fish predator. Small tankmates can disappear even when the fish eats prepared food reliably. Plan around\
      \ an adult male of about 25 cm, provide robust companions only in a larger community, and keep a way\
      \ to separate fish if aggression becomes persistent."
    sources:
    - kind: "database"
      title: "FishBase species summary: Nimbochromis fuscotaeniatus"
      url: "https://www.fishbase.se/summary/Nimbochromis-fuscotaeniatus.html"
      accessed: "2026-10-13"
    - kind: "database"
      title: "Nordiska Ciklidsallskapet species register: Nimbochromis fuscotaeniatus"
      url: "https://ciklid.org/artregister/art.php?ID=566"
      accessed: "2026-10-13"
    - kind: "database"
      title: "Malawi Mayhem species profile: Nimbochromis fuscotaeniatus"
      url: "https://www.malawimayhem.ca/nimbochromis-fuscotaeniatus"
      accessed: "2026-10-13"
  habitat:
    text: "Southern Lake Malawi is the main range, with FishBase reporting Namalenje Island as its northern\
      \ limit. The Nordic register also records Lake Malombe historically; a specialist directory considers\
      \ that population lost, but its present status was not independently confirmed here. Vegetated shallows\
      \ and the transition between sand and rocks provide concealment for hunting and cover for broods. Use\
      \ open sand with scattered stable rocks and sturdy plant stands where practical. The decided natural\
      \ lake ranges are 21 to 29 C, pH 7.7 to 8.6, GH 3 to 5 dGH and KH 5 to 8 dKH. These describe seasonal\
      \ habitat variation, not daily adjustment targets. Malawi water is relatively soft but alkaline and buffered."
    sources:
    - kind: "literature"
      title: "Branchu, P. et al. (2010). Hydrochemistry (major and trace elements) of Lake Malawi (Nyasa),\
        \ Tanzanian Northern Basin. Hydrology and Earth System Sciences Discussions 7, 4371-4409."
      url: "https://doi.org/10.5194/hessd-7-4371-2010"
      accessed: "2026-10-13"
    - kind: "literature"
      title: "Vanden Bossche, J.-P. and Bernacsek, G. M. (1990). Source book for the inland fishery resources\
        \ of Africa, Vol. 1, CIFA Technical Paper 18/1, FAO. Lake Malawi/Nyasa."
      url: "https://www.fao.org/4/t0473e/T0473E06.htm"
      accessed: "2026-10-13"
    - kind: "literature"
      title: "Eccles, D. H. (1974). An outline of the physical limnology of Lake Malawi (Lake Nyasa). Limnology\
        \ and Oceanography 19(5), 730-742."
      url: "https://doi.org/10.4319/lo.1974.19.5.0730"
      accessed: "2026-10-13"
    - kind: "literature"
      title: "Vollmer et al. (2005). Deep-water warming trend in Lake Malawi, East Africa. Limnology and Oceanography\
        \ 50, 727-732."
      url: "https://doi.org/10.4319/lo.2005.50.2.0727"
      accessed: "2026-10-13"
    - kind: "literature"
      title: "Ngochera, M. and Bootsma, H. (2020). Spatial and temporal dynamics of pCO2 and CO2 flux in tropical\
        \ Lake Malawi. Limnology and Oceanography."
      url: "https://doi.org/10.1002/lno.11408"
      accessed: "2026-10-13"
    - kind: "database"
      title: "FishBase species summary: Nimbochromis fuscotaeniatus"
      url: "https://www.fishbase.se/summary/Nimbochromis-fuscotaeniatus.html"
      accessed: "2026-10-13"

    rationale: "FishBase and the Catalog establish southern Lake Malawi, with Namalenje Island as the northern\
      \ limit reported by FishBase. The generator lists Namalenje, Kanchedza and Mazinzi islands and Lake Malombe;\
      \ checker-a lists the northern limit and Malombe, checker-b lists Namalenje and Malombe, and checker-c\
      \ gives a historical Malombe extension without localities. The Nordic register supports the named localities.\
      \ Malawi-Guru considers the Malombe population lost, but no population survey was read to confirm that\
      \ claim. The merged distribution therefore records historical Malombe occurrence at medium confidence\
      \ and uses the Lake Malawi waterbody for the decided chemistry."

    tolerance:
      value:
        min: 7.5
        max: 8.6
      confidence: "medium"
      rationale: "Generator and checker-b propose 7.5 to 8.6, checker-a proposes 7.4 to 8.6, and checker-c\
        \ proposes 7.5 to 8.7. The differences fall within the tally agreement threshold of 0.3 pH; its unanimous\
        \ four-of-four decision uses the median endpoints, 7.5 and 8.6, at medium confidence. The Nordic register,\
        \ Fischlexikon, Fishkeeper, Zoopet and AquaInfo converge on 7.5 to 8.5, with 8.6 retained to contain\
        \ the natural lake maximum. Broader source ranges are Malawi.si 7.6 to 8.7, the Modern Aquatic Design\
        \ retailer 7.8 to 8.9 and FishFish 7 to 9; the iFISH retailer gives 7 to 8 and Ron's gives 7.4 to 8.4.\
        \ These wider or shifted recommendations lack chronic species-specific health data and do not justify\
        \ widening the decided range."
      sources:
      - kind: "literature"

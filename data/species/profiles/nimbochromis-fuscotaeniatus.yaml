  temperatureC:
    value:
      min: 21
      max: 29
    confidence: "high"
    rationale: "The tally waterbody decision is retained exactly at 21 to 29 C with high confidence. Eccles\
      \ reports inshore cooling to 21 C and about 27 C in the upper 60 m by May. Vollmer et al. describe summer\
      \ surface water near 28 C and winter surface water below 24 C; Ngochera and Bootsma describe a surface\
      \ maximum of 29 C during the hot stratified season. These are lake observations across seasons, not aquarium\
      \ settings or temperatures measured specifically around every fusco population. FAO historical surface\
      \ measurements of 23 to 25 C are a narrower campaign range. The lake studies are cited directly; the\
      \ FAO link in the inputs was corrected to the chapter containing Malawi/Nyasa."
    sources:
    - kind: "literature"
      title: "Branchu, P. et al. (2010). Hydrochemistry (major and trace elements) of Lake Malawi (Nyasa),\
        \ Tanzanian Northern Basin. Hydrology and Earth System Sciences Discussions 7, 4371-4409."
      url: "https://doi.org/10.5194/hessd-7-4371-2010"
      accessed: "2026-10-13"
    - kind: "literature"
      title: "Vanden Bossche, J.-P. and Bernacsek, G. M. (1990). Source book for the inland fishery resources\
        \ of Africa, Vol. 1, CIFA Technical Paper 18/1, FAO. Lake Malawi/Nyasa."
      url: "https://www.fao.org/4/t0473e/T0473E06.htm"
      accessed: "2026-10-13"
    - kind: "literature"
      title: "Eccles, D. H. (1974). An outline of the physical limnology of Lake Malawi (Lake Nyasa). Limnology\

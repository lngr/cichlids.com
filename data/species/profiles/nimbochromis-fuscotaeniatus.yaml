  hybridGroups:
    value:
    - "nimbochromis"
    confidence: "medium"
    rationale: "The tally unanimously selects nimbochromis with four of four votes and medium confidence. All\
      \ five valid congeners belong to the existing presumed group. Malawi-Guru and Aquarium Glaser give genus-wide\
      \ crossing cautions, and Zoopet independently warns against other Nimbochromis with fuscotaeniatus. The\
      \ Catalog verifies member names only. Masonick et al. recover a strongly supported clade of three sampled\
      \ congeners but do not sample fuscotaeniatus or demonstrate its crosses. No named free-choice cross involving\
      \ this species was found. Zoopet also mentions Tyrannochromis generally, but that single unpaired warning\
      \ supplies no additional decided group. The Ribbink mixed-brood observations concern foreign fry under\
      \ parental care, not hybrids."

      title: "Malawi-Guru species directory: Nimbochromis fuscotaeniatus"
      accessed: "2026-10-13"
      url: "https://malawi-guru.de/artentafel-nimbochromis-fuscotaeniatus-verzeichnis/"
  sizeAndGrowth:
    text: "Plan for males around 25 cm and females around 20 cm. These figures agree across FishBase and the\
      \ Nordic aquarium register, although other care sheets mention larger individuals. Buying a small juvenile\
      \ postpones the space problem rather than solving it. Arrange the adult aquarium before the fish outgrows\
      \ its temporary home, and judge space by usable length and width as well as litres. Growth depends on\
      \ feeding, water quality and social access to food. An eight to ten year planning horizon is a weakly\
      \ supported estimate; a reliable species age study was not found."
    sources:
    - kind: "database"
      title: "FishBase species summary: Nimbochromis fuscotaeniatus"
      url: "https://www.fishbase.se/summary/Nimbochromis-fuscotaeniatus.html"
      accessed: "2026-10-13"
    - kind: "database"
      title: "Nordiska Ciklidsallskapet species register: Nimbochromis fuscotaeniatus"
      url: "https://ciklid.org/artregister/art.php?ID=566"
      accessed: "2026-10-13"
    - kind: "database"
      title: "Fischlexikon: Leopardmaulbruter, Nimbochromis fuscotaeniatus"
      url: "https://www.fischlexikon.eu/fischlexikon/fische-suchen.php?fisch_id=0000001755"
      accessed: "2026-10-13"
    - kind: "database"
      title: "AquaInfo species profile: Nimbochromis fuscotaeniatus"
      url: "https://aquainfo.nl/en/article/nimbochromis-fuscotaeniatus/"
      accessed: "2026-10-13"
  husbandry:
    text: "For one male with three females, provide at least 1100 litres, 250 cm length and 70 cm front-to-back\
      \ depth. The depth is a planning allowance for turning and separate retreats; it is not a published biological\
      \ threshold. Additional large companions require more space. Preserve open swimming lanes and secure\
      \ the rocks against digging, with several routes into cover. Large carnivores need substantial biological\
      \ filtration, surface movement and regular partial water changes. A stable 24 to 26 C is a well-supported\
      \ routine setting. The decided planning tolerances are 21 to 29 C, pH 7.5 to 8.6, GH 3 to 15 dGH and\
      \ KH 5 to 12 dKH. Confidence is low for the temperature extremes and KH ceiling because multi-year species-specific\
      \ health limits are unavailable. Test GH and KH separately and make chemistry changes gradually."
    sources:
    - kind: "literature"
      title: "Branchu, P. et al. (2010). Hydrochemistry (major and trace elements) of Lake Malawi (Nyasa),\
        \ Tanzanian Northern Basin. Hydrology and Earth System Sciences Discussions 7, 4371-4409."
      url: "https://doi.org/10.5194/hessd-7-4371-2010"
      accessed: "2026-10-13"
    - kind: "database"
      title: "Fischlexikon: Leopardmaulbruter, Nimbochromis fuscotaeniatus"
      url: "https://www.fischlexikon.eu/fischlexikon/fische-suchen.php?fisch_id=0000001755"
      accessed: "2026-10-13"
    - kind: "database"
      title: "Malawi-Guru species directory: Nimbochromis fuscotaeniatus"
      accessed: "2026-10-13"
      url: "https://malawi-guru.de/artentafel-nimbochromis-fuscotaeniatus-verzeichnis/"
    - kind: "database"
      title: "Nordiska Ciklidsallskapet species register: Nimbochromis fuscotaeniatus"
      url: "https://ciklid.org/artregister/art.php?ID=566"
      accessed: "2026-10-13"
    - kind: "database"
      title: "Fishkeeper (Maidenhead Aquatics) data bank: Fusco Hap, Nimbochromis fuscotaeniatus"
      url: "https://www.fishkeeper.co.uk/fish/freshwater/cichlids/fusco-hap"
      accessed: "2026-10-13"
    - kind: "database"
      title: "OATA care sheet: How to look after African Malawi Cichlids"
      url: "https://ornamentalfish.org/what-we-do/advice-information/care-sheets/caresheets-tropical-freshwater-fish/how-to-look-after-african-malawi-cichlids/"
      accessed: "2026-10-13"
    - kind: "website"
      title: "Malawi.si husbandry guide: Lake Malawi Aquarium Setup"
      accessed: "2026-10-13"
      url: "https://www.malawi.si/slides/Lake%20Malawi%20Aquarium%20Setup.html"
  socialBehavior:
    text: "Use one male with at least three females as the planned breeding unit. Wild hunting is usually solitary,\
      \ while aquarium harem care spreads courtship pressure across several females. It still requires cover,\
      \ space and a separation option. Rival males can fight persistently, and the archive includes a report\
      \ of repeated mouth injuries in unsuitable mixed housing. Aquarium territoriality is treated as large\
      \ and not confined to breeding, with low confidence because no defended area was measured. Wild territorial\
      \ males are reported chiefly during reproduction. Check that each fish can rest and feed without constant\
      \ pursuit, and separate persistently attacked individuals."
    sources:
    - kind: "database"
      title: "FishBase species summary: Nimbochromis fuscotaeniatus"
      url: "https://www.fishbase.se/summary/Nimbochromis-fuscotaeniatus.html"
      accessed: "2026-10-13"
    - kind: "database"
      title: "Fischlexikon: Leopardmaulbruter, Nimbochromis fuscotaeniatus"
      url: "https://www.fischlexikon.eu/fischlexikon/fische-suchen.php?fisch_id=0000001755"
      accessed: "2026-10-13"
    - kind: "database"
      title: "Malawi-Guru species directory: Nimbochromis fuscotaeniatus"
      accessed: "2026-10-13"
      url: "https://malawi-guru.de/artentafel-nimbochromis-fuscotaeniatus-verzeichnis/"
    - kind: "database"
      title: "Zoopet species profile: Nimbochromis fuscotaeniatus"
      accessed: "2026-10-13"
      url: "https://www.zoopet.com/fiskar/fisk.php?NR=911"
    - kind: "database"
      title: "my-fish Fishothek: Nimbochromis fuscotaeniatus"
      url: "https://my-fish.org/my-fishothek/nimbochromis-fuscotaeniatus/"
      accessed: "2026-10-13"
    - kind: "archive"
      title: "cichlids.com forum thread 58640"
      url: "https://www.cichlids.com/disc/read.php?2,58640"
      accessed: "2026-10-13"
  diet:
    text: "Build the aquarium diet around a complete food formulated for carnivorous cichlids, then add modest\
      \ portions of thawed aquatic foods such as krill, shrimp or mussel. Small pieces of fish can provide\
      \ variety. Prepared foods let this predator obtain balanced nutrition without relying on live feeder\
      \ fish, which introduce avoidable disease risk. Keep portions controlled and remove uneaten food before\
      \ it burdens the filter. Check that females and other subordinate fish actually receive their share.\
      \ This species naturally uses animal protein; the profile does not assign the special plant-diet bloat\
      \ sensitivity of grazing cichlids."
    sources:
    - kind: "database"
      title: "Nordiska Ciklidsallskapet species register: Nimbochromis fuscotaeniatus"
      url: "https://ciklid.org/artregister/art.php?ID=566"
      accessed: "2026-10-13"
    - kind: "database"
      title: "Malawi Mayhem species profile: Nimbochromis fuscotaeniatus"
      url: "https://www.malawimayhem.ca/nimbochromis-fuscotaeniatus"
      accessed: "2026-10-13"
    - kind: "database"
      title: "Einrichtungsbeispiele: Nimbochromis fuscotaeniatus husbandry profile"
      url: "https://www.einrichtungsbeispiele.de/zierfische/malawisee/nimbochromis-fuscotaeniatus-slnk.html"
      accessed: "2026-10-13"
  breeding:
    text: "The female incubates the brood in her mouth. The Nordic register reports roughly 20 to 25 days before\
      \ release and continued protection afterwards, while field observations record brood sites sheltered\
      \ by rocks. Give holding females a quiet retreat. Young fish need a safe growing area if they are to\
      \ survive alongside adult predators. The existing nimbochromis group carries a presumed crossing caution\
      \ from general genus warnings and close relationship. A named cross involving fuscotaeniatus with free\
      \ choice of partners has not been established; mixed broods described in field studies involve foreign\
      \ fry and do not demonstrate hybridization."
    sources:
    - kind: "literature"
      title: "Parental behaviour and mixed broods among cichlid fish of Lake Malawi (1980). South African Journal\
        \ of Zoology 15(1)"
      url: "https://doi.org/10.1080/02541858.1980.11447677"
      accessed: "2026-10-13"
    - kind: "database"
      title: "Nordiska Ciklidsallskapet species register: Nimbochromis fuscotaeniatus"
      url: "https://ciklid.org/artregister/art.php?ID=566"
      accessed: "2026-10-13"
    - kind: "database"
      title: "Fischlexikon: Leopardmaulbruter, Nimbochromis fuscotaeniatus"
      url: "https://www.fischlexikon.eu/fischlexikon/fische-suchen.php?fisch_id=0000001755"
      accessed: "2026-10-13"
    - kind: "database"
      title: "Malawi-Guru species directory: Nimbochromis livingstonii, genus crossing caution"
      url: "https://malawi-guru.de/nimbochromis-livingstonii-buntbarsch-verzeichnis/"
      accessed: "2026-10-13"
    - kind: "database"
      title: "Zoopet species profile: Nimbochromis fuscotaeniatus"
      accessed: "2026-10-13"
      url: "https://www.zoopet.com/fiskar/fisk.php?NR=911"
  sexing:
    text: "Adult males usually become larger and show much stronger blue or green color, together with red\
      \ accents in the fins. Females retain a quieter brown pattern on a pale background. The irregular blotches\
      \ and broken bands can remain visible in both sexes, so pattern alone is insufficient. Young fish and\
      \ subdued males may be difficult to sex from color, and a fish without vivid blue should not automatically\
      \ be counted as female. Assess several features and behavior over time before planning the final ratio,\
      \ and allow for rearranging the group as the fish mature."
    sources:
    - kind: "database"
      title: "Nordiska Ciklidsallskapet species register: Nimbochromis fuscotaeniatus"
      url: "https://ciklid.org/artregister/art.php?ID=566"
      accessed: "2026-10-13"
    - kind: "database"
      title: "Malawi Mayhem species profile: Nimbochromis fuscotaeniatus"
      url: "https://www.malawimayhem.ca/nimbochromis-fuscotaeniatus"
      accessed: "2026-10-13"
    - kind: "database"
      title: "FishBase species summary: Nimbochromis fuscotaeniatus"
      url: "https://www.fishbase.se/summary/Nimbochromis-fuscotaeniatus.html"
      accessed: "2026-10-13"
  compatibility:
    text: "Other species are possible companions when their adult size and robustness suit a large predator\
      \ aquarium. Small fish and newly purchased juveniles remain potential prey even if their species eventually\
      \ grows large. Aristochromis christyi, Buccochromis spectabilis and Dimidiochromis compressiceps are\
      \ conditional options recorded with fusco in a 4000-litre Malawi-Guru aquarium. That mixed-tank example\
      \ used two fusco females and also included another Nimbochromis, so it does not validate the planned\
      \ three-female harem minimum or remove the hybrid caution. Use the example as limited practical context.\
      \ Other Nimbochromis share the presumed crossing group, and specialised grazers fit poorly with this\
      \ animal-food regime. Even similarly sized companions can face attacks, particularly during reproduction."
    sources:
    - kind: "database"
      title: "Malawi Mayhem species profile: Nimbochromis fuscotaeniatus"
      url: "https://www.malawimayhem.ca/nimbochromis-fuscotaeniatus"
      accessed: "2026-10-13"
    - kind: "database"
      title: "Fischlexikon: Leopardmaulbruter, Nimbochromis fuscotaeniatus"
      url: "https://www.fischlexikon.eu/fischlexikon/fische-suchen.php?fisch_id=0000001755"
      accessed: "2026-10-13"
    - kind: "database"
      title: "Malawi-Guru aquarium case study: 4000-litre Malawi aquarium"
      url: "https://malawi-guru.de/4000-liter-aquarium-malawisee-buntbarsche/"
      accessed: "2026-10-13"
    - kind: "database"
      title: "Malawi-Guru species directory: Nimbochromis livingstonii, genus crossing caution"
      url: "https://malawi-guru.de/nimbochromis-livingstonii-buntbarsch-verzeichnis/"
      accessed: "2026-10-13"
    - kind: "database"
      title: "Zoopet species profile: Nimbochromis fuscotaeniatus"
      accessed: "2026-10-13"
      url: "https://www.zoopet.com/fiskar/fisk.php?NR=911"
  problems:
    text: "The most consequential mistakes are keeping adults in a juvenile-sized tank, adding swallowable\
      \ companions and leaving subordinate fish exposed to a dominant male. Injury and chronic hiding are reasons\
      \ to reassess the setup promptly. Large meals and weak filtration can also worsen water quality, while\
      \ sudden changes in pH or temperature add stress. Quarantine new arrivals and avoid dependence on feeder\
      \ fish to reduce opportunities for parasites and infection. Bloating, appetite loss, breathing changes\
      \ or damaged fins deserve investigation, but these signs do not identify a single disease and the profile\
      \ does not prescribe medication."
    sources:
    - kind: "database"
      title: "Fischlexikon: Leopardmaulbruter, Nimbochromis fuscotaeniatus"
      url: "https://www.fischlexikon.eu/fischlexikon/fische-suchen.php?fisch_id=0000001755"
      accessed: "2026-10-13"

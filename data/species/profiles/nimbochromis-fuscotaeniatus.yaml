    tolerance:
      value:
        min: 21
        max: 29
      confidence: "low"
      rationale: "All four full-profile runs propose 21 to 29 C, which the tally retains unanimously with four\
        \ of four votes and low confidence. The Nordic register recommends 23 to 28 C, Fischlexikon 22 to 27\
        \ C, Fishkeeper 24 to 26 C, my-fish 24 to 28 C, Zoopet 23 to 27 C and AquaInfo 22 to 26 C for maintenance\
        \ with warmer breeding guidance. Inclusion of the entire natural 21 to 29 C range extends beyond those\
        \ routine recommendations. Neither continuous multi-year health at both endpoints nor a chronic physiological\
        \ limit is demonstrated. A stable 24 to 26 C has stronger routine husbandry support."

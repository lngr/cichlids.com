    decision:
      volumeL: 400
      lengthCm: 150
      depthCm: 50
    rationale: "The proposals are generator 500 L/150/60 cm, checker-a 284 L/122/46, checker-b 150 L/100/35\
      \ and checker-c 400 L/150/50. Component medians are 342 L, 136 cm length and 48 cm depth. Checking those\
      \ against the actual recommendations supports 400 L for one male and at least three females: Fishipedia\
      \ explicitly gives 400 L, while Malawi-Guru and the readable AquaInfo HTML recommend the larger 500 L\
      \ and 150 cm. The 150 cm length follows those specialist accounts and provides separation for the adult\
      \ harem; 50 cm depth is an inferred usable footprint near the median, not a published species measurement.\
      \ Smaller recommendations span 114 L at Malawi Mayhem, 120 L at Akvaforum, 150 L/100 cm in the Nordic\
      \ register and 284 L at AquariumDomain and Tropical Fish Keeping. These are retained, but they address\
      \ less clearly specified social arrangements. The final minimum is not a minimum for two males or for\
      \ adding a full mixed Malawi community."

  temperatureC:
    value:
      min: 21
      max: 29
    confidence: high
    rationale: "The settled waterbody decision is 21 to 29 C for the Lake Malawi reference population. Lake\
      \ limnology supports seasonal cooling below 24 C and summer water near 28 C, with the broader compiled\
      \ lake interval retained. FishBase gives the narrower 24 to 28 C species interval and the FAO compilation\
      \ reports a 23 to 25 C surface snapshot. Retained input entries that attach 21 to 29 C to a single study\
      \ represent the rounded multi-study synthesis, not that study's independently measured endpoints. The\
      \ readable Eccles abstract reports inshore cooling to 21 C and upper-water temperatures near 27 C; its\
      \ publisher page returns HTTP 403, so the full text is not used."
    sources:
    - &legacy215source010
      kind: literature

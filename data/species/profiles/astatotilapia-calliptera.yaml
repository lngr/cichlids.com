      rationale: "Generator and checkers a, b and c all propose 20 to 30 C; the tally therefore records unanimous\
        \ agreement at low confidence. This inferred keeping envelope contains the natural 21 to 29 C interval\
        \ and extends beyond the more usual care recommendations of 22 to 28 C on AquaInfo and Akvaforum, 23\
        \ to 27 C in the Nordic register and about 24 to 28 C on other care sheets. Laboratory temperatures\
        \ within that envelope confirm successful keeping only near their chosen setpoints, not its endpoints.\
        \ Sustained healthy maintenance at 20 or 30 C is not established by a boundary experiment."

partners:
  suitable:
  - species: Robust Lake Malawi cichlids of comparable adult size
    reason: Species-specific husbandry accounts permit resilient mbuna and non-mbuna that can tolerate local
      territorial defense.
    condition: A larger community aquarium with sight breaks and enough space for every adult social unit;
      exclude the listed crossing partners.
  unsuitable:
  - species: Astatotilapia burtoni
    reason: Experimental offspring establish a presumed pairwise crossing risk; the experiments do not demonstrate
      unrestricted choice of partners in a community tank.
  - species: Astatotilapia gigliolii
    reason: Experimental offspring establish a presumed pairwise crossing risk; the experiments do not demonstrate
      unrestricted choice of partners in a community tank.
  - species: Maylandia estherae
    reason: Experimental offspring establish a presumed pairwise crossing risk; the experiments do not demonstrate
      unrestricted choice of partners in a community tank.
  - species: Protomelas taeniolatus
    reason: Experimental offspring establish a presumed pairwise crossing risk; the experiments do not demonstrate
      unrestricted choice of partners in a community tank.
  - species: Pundamilia nyererei
    reason: Experimental offspring establish a presumed pairwise crossing risk; the experiments do not demonstrate
      unrestricted choice of partners in a community tank.
  - species: "Timid Lethrinops, Mchenga and sand-dwelling Aulonocara"
    reason: Specialist aquarium accounts describe a poor temperament match with forceful territorial males.
  - species: Fry and very small fish
    reason: Opportunistic predation makes fish of roughly 2 cm or less vulnerable.
profile:
  overview:
    text: "Astatotilapia calliptera is an adaptable southeastern African haplochromine known as the eastern\
      \ happy. Its distribution includes Lake Malawi and several satellite lakes and river systems. Adult males\
      \ display a varied green, yellow, blue and red palette, while females are less conspicuous. Its broad\
      \ food use and maternal mouthbrooding contrast with the narrow ecological specializations of many Malawi\
      \ cichlids."
    sources:
    - *legacy215source002
    - *legacy215source036
    - *legacy215source035
  habitat:
    text: "The species occupies vegetated lake margins, streams and rivers across the Malawi region and adjacent\
      \ Zambezi and coastal drainages. Sand, plant cover and rocky shelter provide feeding and breeding sites.\
      \ The Lake Malawi reference chemistry is 21 to 29 C, pH 7.7 to 8.6, GH 3 to 5 dGH and KH 5 to 8 dKH.\
      \ Peripheral populations inhabit different water bodies, and these lake intervals do not characterize\
      \ every collection site."
    sources:
    - *legacy215source002
    - *legacy215source004
    - *legacy215source014
    - *legacy215source009
    - *legacy215source011
  sizeAndGrowth:
    text: "For aquarium planning, allow about 15 cm for a large adult male and 11 cm for a female. These sex-specific\
      \ figures follow aquarium observations; the FishBase maximum of 15 cm is standard length and is not an\
      \ aquarium average. A 20 cm value in the Nordic register lacks a stated length convention. Growth and\
      \ incubation differ among populations in controlled studies, so juveniles from different localities need\
      \ not develop identically."
    sources:
    - *legacy215source032
    - *legacy215source002
    - *legacy215source022
    - *legacy215source004
  husbandry:
    text: "For one male with at least three females, provide at least 400 L and a footprint around 150 by 50\
      \ cm. Arrange rock shelter and well-anchored robust plants around an open swimming area, using sight\
      \ breaks and escape routes to limit pursuit. Provide effective filtration, good oxygenation and regular\
      \ water changes. The aquarium tolerance estimates are 20 to 30 C, pH 7.3 to 8.7, GH 3 to 16 dGH and KH\
      \ 5 to 20 dKH; their endpoints have weak evidence. Stable conditions within the better-supported care\
      \ recommendations are preferable to treating those endpoints as targets."
    sources:
    - *legacy215source016
    - *legacy215source032
    - *legacy215source017
    - *legacy215source015
    - *legacy215source013
    - *legacy215source028
  socialBehavior:
    text: "Males display and defend sheltered sites, with stronger rivalry during reproduction. One male with\
      \ several females spreads courtship pressure and avoids direct male competition. This aquarium arrangement\
      \ does not imply a permanent pair bond or an exclusive wild harem. Other adults can be chased from the\
      \ immediate defended space. A second male requires substantially more room, and the minimum for the single-male\
      \ group does not establish a safe two-male setup."
    sources:
    - *legacy215source036
    - *legacy215source032
    - *legacy215source022
    - *legacy215source013
  diet:
    text: "Feed a varied omnivorous diet with a suitable complete cichlid food, vegetable components and appropriately\
      \ sized aquatic invertebrates. Natural diets include both animal and plant-associated resources; the\
      \ Masoko study also shows dietary differences between lake ecotypes. Fry and very small fish can be taken\
      \ opportunistically. The species has no established special bloat-sensitivity flag, but that assessment\
      \ does not remove the need for controlled portions, dietary variety and clean water."
    sources:
    - *legacy215source002
    - *legacy215source035
    - *legacy215source032
  breeding:
    text: "Females collect eggs and incubate the brood in the mouth. The male courts at a defended site, while\
      \ the female carries the developing young. FishBase describes egg incubation of about 12 to 14 days at\
      \ 26 C and a subsequent period of fry protection; some aquarium accounts describe a longer interval to\
      \ free-swimming release. Population differences and the distinction between hatching and release make\
      \ those timings approximate. Sheltered retreats help brooding females avoid persistent male attention."
    sources:
    - *legacy215source002
    - *legacy215source036
    - *legacy215source004
    - *legacy215source013
  sexing:
    text: "Mature males are generally larger and display stronger color, with conspicuous anal-fin egg spots\
      \ and blue or red accents. Females are comparatively subdued. Status, locality and reproductive condition\
      \ affect appearance, and juvenile coloration alone gives uncertain sex identification. The dark Chizumulu\
      \ fish appears under a separate undescribed label in CRC, so its identity should not be assumed from\
      \ a calliptera trade label alone."
    sources:
    - *legacy215source032
    - *legacy215source022
    - *legacy215source036
    - *legacy215source021
  compatibility:
    text: "Comparable, resilient Malawi cichlids can share a sufficiently spacious community with appropriate\
      \ cover. Quiet sand-dwellers and very small fish face harassment or predation risk. Laboratory crosses\
      \ link calliptera with A. burtoni, A. gigliolii under the experimental name tweddlei, Maylandia estherae,\
      \ Protomelas taeniolatus and Pundamilia nyererei. Because females lack a male of their own species in\
      \ those experiments, the five pairwise risks are presumed. They do not establish a larger group in which\
      \ every partner crosses with every other partner."
    sources:
    - *legacy215source032
    - *legacy215source022
    - *legacy215source040
    - *legacy215source003
    - *legacy215source001
  problems:
    text: "Repeated pursuit, damaged fins or loss of access to food indicate a social arrangement that needs\
      \ attention. Male rivalry, too few females and exposed retreats can increase pressure within the group.\
      \ Digging and grazing can disturb plants. GH and KH measure different aspects of water chemistry; the\
      \ lake combines relatively low calcium-magnesium hardness with stronger alkalinity. The lifespan estimate\
      \ of 6 to 9 years is provisional, and the conflicting hardness recommendations do not establish measured\
      \ failure thresholds."
    sources:
    - *legacy215source032
    - *legacy215source022
    - *legacy215source014
    - *legacy215source009
    - *legacy215source026
    - *legacy215source016

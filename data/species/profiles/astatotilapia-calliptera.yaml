    rationale: "Generator and tiebreaker-2 propose the five decided groups with burtoni, Maylandia estherae,\
      \ Protomelas taeniolatus, Pundamilia nyererei and tweddlei; checkers a, b and c propose no groups. Tiebreaker-1\
      \ proposes the same first four pairs but uses astatotilapia-calliptera-gigliolii for the fifth. No qualified\
      \ majority settles the six votes, so the conservative tally retains the five identifiers proposed at\
      \ least twice, with three agreeing votes out of six and low confidence. Stelkens reports F1 and F2 offspring\
      \ for the first four pairs; Selz also obtains F1 offspring with fish called A. tweddlei but no F2 because\
      \ those F1 fish do not mate. Females have no male of their own species in the crossing setups, so every\
      \ group has basis presumed. The Catalog treats tweddlei as a synonym of A. gigliolii; the retained tally\
      \ identifier astatotilapia-calliptera-gigliolii therefore has A. gigliolii as its valid-name member. The\
      \ two proposed identifiers refer to one experimental pairing, not two distinct crossing claims. A. gigliolii\
      \ population-wide crossability and unrestricted aquarium mate choice are not established. Sources without\
      \ crossing reports remain in evidence and do not negate the experiments; the Selz behavioural-isolation\
      \ paper is readable only as an abstract and metadata and supplies no independently checked named pairing\
      \ here."

  note: "The original combination Copadichromis azureus Konings, 1990 remains valid in the Catalog of Fishes, so
    the legacy and current genus queries coincide. C. borleyi (Iles, 1960) and C. trewavasae Konings, 1999 are
    separately valid congeners. Historical Haplochromis chrysonotus Mbenji and Maleri aquarium labels are
    misapplications rather than formal synonyms of azureus. FishBase diagnoses breeding azureus by its blue
    breast, whereas trewavasae has a dark lower body and a pale dorsal blaze; these accounts are not
    interchangeable. CRC independently verifies the name and lists the undescribed azureus jalo form
    separately. Its old conservation teaser differs from FishBase, so no conservation category is asserted."

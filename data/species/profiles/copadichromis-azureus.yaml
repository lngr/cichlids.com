  compatibility:
    text: "Selected peaceful Malawi communities can work when the adults have sufficient room and suitable social
      groups. Aulonocara baenschi has a contrasting male pattern and a care account allowing differently
      patterned Copadichromis; Cyrtocara moorii is another named possibility if its own adult needs are met.
      Yellow Labidochromis caeruleus is a conditional exception in one specialist account, while broader
      guidance excludes mbuna. Sources also differ over peaceful Lethrinops, so timid sand feeders are a
      cautious exclusion rather than a claim that every Lethrinops is incompatible. Borleyi and trewavasae
      share the presumed congeneric crossing group with azureus. A laboratory cross with D. compressiceps was
      produced without a conspecific male available to the azureus females, which does not establish
      free-choice community crossing."

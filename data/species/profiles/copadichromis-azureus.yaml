  sizeAndGrowth:
    text: "Use about 16 cm for a typical adult aquarium male and about 12 cm for a female when planning space.
      Reports of larger fish and different length conventions make those practical estimates rather than rigid
      growth ceilings. Juvenile grey coloration does not guarantee that a fish is female. Published longevity
      advice ranges from a five-to-eight-year estimate to a retailer estimate of ten years, with no measured
      ageing series behind either claim; this profile retains five to eight years with low confidence."

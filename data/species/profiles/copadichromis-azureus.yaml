  breeding:
    text: "The male courts from a sand excavation near a rock, and pursuit becomes more noticeable as females
      become receptive. After spawning, the female incubates eggs and larvae in her mouth. Care sources
      commonly report release after about three to four weeks. Avoid unnecessary disturbance and give the
      brooding female a way to withdraw from persistent attention. Released young accept fine foods such as
      newly hatched Artemia. A properly prepared raising aquarium can improve survival; collection locality
      and parent identity should remain attached to offspring records."

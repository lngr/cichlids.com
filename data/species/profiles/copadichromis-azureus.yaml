        adequately housed adult harem, not rival males in a cramped aquarium. AquaInfo and Seriously Fish
        describe female pursuit and male intolerance when the arrangement is unsuitable, but do not establish
        routine injuries in one male with at least three females. Level 2 therefore better describes hierarchy
        and reproductive chasing in the recommended setup. Intense courtship remains a practical risk, and
        broad peaceful labels from NCS and Aqua-Fish do not mean no chasing."

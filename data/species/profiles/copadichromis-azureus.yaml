        min: 21
        max: 29
      confidence: "low"
      rationale: "Generator and checker-a, checker-b and checker-c all propose 21 to 29 C, so the tally reports
        unanimous 4/4 agreement with low confidence. The range includes the full decided natural envelope,
        rather than demonstrating years of aquarium survival at both extremes. AquaInfo recommends 22 to 26 C,
        NCS 23 to 28 C, Ciklider 23 to 26 C, Aqua-Fish 24 to 28 C and Seriously Fish 26 to 28 C; the latter
        gives 25 to 26.5 C separately for spawning. Reproducing research colonies were maintained at 28 C. A
        stable central care temperature is better supported than a constant extreme."

    confidence: "high"
    rationale: "The tally fixes natural general hardness at 3 to 5 dGH. Calcium and magnesium in Branchu Table 2
      give about 4.2 to 4.6 dGH in the upper 50 m. The Jackson ion ranges compiled by FAO give approximately
      3.5 to 4.9 dGH when combined at their stated limits, while the Talling values give about 3.9 dGH. The
      decided whole-degree envelope is retained exactly. Lake Malawi is soft in calcium-magnesium hardness;
      higher aquarium recommendations do not redefine its natural chemistry."

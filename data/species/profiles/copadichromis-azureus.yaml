        accessed: "2026-10-13"
  socialBehavior:
    text: "A male-biased or cramped setup can turn courtship into sustained pressure. One male with at least three
      females usually distributes that attention more effectively, while adequate space and several retreat
      areas remain necessary. Hierarchy and chasing are expected even in a suitable harem. Males may exclude
      other fish from the bower, and a specialist register records territorial males throughout the year. This
      profile therefore does not assume a predictable season without territory defence. Watch for females that
      stay hidden, lose condition or cannot reach food."
    sources:

  habitat:
    text: "A sandy bottom with scattered rocks provides the link between feeding and reproduction. Populations
      occur around southern islands and reefs, including Mbenji, the Maleri area, Nkhomo and Eccles reefs.
      Females and nonterritorial males feed near the bottom and in the adjoining water column, while males
      prepare sand bowers beside stones. Lake Malawi has low calcium-magnesium hardness alongside greater
      bicarbonate buffering. Seasonal lake measurements describe variable temperature, so the full natural
      envelope should not be read as a preferred constant aquarium setting."

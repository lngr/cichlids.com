  husbandry:
    text: "Provide at least 400 litres and 150 cm length for the adult harem, with about 50 cm front-to-back room
      to combine open sand, shelters and swimming routes. The depth allowance is a practical layout judgement.
      Keep rock structures stable and leave routes by which a pursued female can move out of view. A mixed
      community needs more space, with at least 500 litres as specialist guidance. A stable temperature around
      25 to 26 C lies within several published recommendations. Maintain mature biological filtration, surface
      gas exchange and regular partial water changes; check GH, KH and pH separately. The tolerance intervals
      express uncertain husbandry envelopes, not instructions to pursue their outer limits."
    sources:
      - kind: "database"

        accessed: "2026-10-13"
  sexing:
    text: "Mature males are generally larger and more colourful, with longer fins, a blue body and dark markings
      whose visibility changes with social state. White dorsal edging and a narrow yellow anal margin may be
      visible. Females and young males are less colourful and commonly show three dark flank spots. Juvenile
      appearance is a poor guarantee of sex, and several congeners have similar females. Obtain fish with
      reliable identity and breeding or locality records. The undescribed azureus jalo form is listed
      separately by CRC and is excluded from the locality variants here."

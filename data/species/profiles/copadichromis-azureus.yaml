  problems:
    text: "Crowding, excessive courtship and forceful companions are the main avoidable pressures described in the
      care accounts. A brooding female can withdraw naturally, but prolonged hiding accompanied by lost
      condition or feeding exclusion deserves attention to the arrangement. Overfeeding and insufficient
      filtration add water-quality stress. Monitor appetite, breathing, body condition and fin damage when
      introducing fish or changing the group. Reduced fry survival in a community is not proof that normally
      maintained adult azureus hunt small fish. The archive contains small-tank stocking proposals, but no
      controlled long-term tolerance or predation observation supporting those proposals."

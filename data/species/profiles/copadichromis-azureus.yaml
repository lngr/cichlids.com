        outweigh the older mixed-feeding label in FishBase ecology and the broad omnivore label in the 2016
        skull-study introduction. Vegetable supplementation does not change the principal natural food
        category. Ciklider recommends protein-rich foods, and the research colonies reproduced on cichlid
        pellets. False indicates no established special conflict with appropriate animal foods, not immunity
        to bloat or proof from a disease-incidence trial. CRC verifies the plankton-feeding classification."

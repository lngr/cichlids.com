        archived: ciklider.se/artbeskrivning/copadichromis-azureus/2026-10-14T095214Z
        accessed: "2026-10-13"
  diet:
    text: "Build the diet around suitably small animal foods and a balanced prepared cichlid food. The natural
      prey described for azureus are zooplankton and near-bottom invertebrates. Artemia, Cyclops and mysis are
      practical supplements, with some vegetable content as recommended in care sources. Keep portions modest
      and check that each female receives food. The invertivore classification and false bloat-sensitive flag
      do not make digestive illness impossible. Predation level 0 reflects the lack of evidence for ordinary
      fish hunting; incidental fry uptake can still occur, so community breeding does not ensure survival of
      the young."

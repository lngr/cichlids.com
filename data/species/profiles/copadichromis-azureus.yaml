    rationale: "All four full profiles propose the existing copadichromis group, giving unanimous 4/4 verification
      and medium confidence. Seriously Fish warns about congeneric crossing on both azureus and borleyi pages,
      but the two pages share one publisher and name no observed azureus cross. Malawi.si gives an independent
      general warning about similar congeners and females. The group basis remains presumed; azureus, borleyi
      and trewavasae are already valid listed members. Anseeuw et al. infer ancient gene exchange in other
      utaka, not a named azureus crossing partner. The 2016 study produced azureus x Dimidiochromis
      compressiceps offspring with a single heterospecific male and five azureus females, leaving the females
      without a conspecific male. It demonstrates laboratory interfertility, but does not establish
      free-choice aquarium crossing. Under the fixed tally no additional pairwise group is added, and absence
      of that group is not a claim of biological incompatibility."

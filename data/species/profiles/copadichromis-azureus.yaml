  temperatureC:
    value:
      min: 21
      max: 29
    confidence: "high"
    rationale: "The tally fixes the lake-wide seasonal envelope at 21 to 29 C with waterbody verification. These
      endpoints are retained exactly, without treating the entire envelope as a preferred constant
      temperature. Branchu Table 4 contains upper-layer campaign means of 24.48 to 26.15 C, and Vollmer
      describes summer surface water around 28 C and winter values below 24 C. Those studies support seasonal
      variability but do not individually establish both decided endpoints. Eccles full text was refused by
      fetch-oa as not open access, and the accessible Ngochera thesis abstract does not report its numerical
      temperatures; neither unread measurement series is presented as freshly checked evidence."
    sources:
      - kind: "literature"
        title: "Branchu et al. (2010). Hydrochemistry (major and trace elements) of Lake Malawi (Nyasa), Tanzanian
          Northern Basin: local versus global considerations. HESS Discussions 7, 4371-4409."

      verification and medium confidence. Their food lists differ: generator includes zooplankton, benthic
      invertebrates, pellets, Artemia, Cyclops, Mysis and a vegetable supplement; checker-a lists zooplankton,
      Artemia, small frozen foods and spirulina; checker-b lists plankton, crustaceans, benthic invertebrates,
      pellets, Artemia and Cyclops; checker-c also includes Mysis and a vegetable supplement. The tally
      retains the generator list exactly. Specific prey descriptions and species care accounts outweigh the
      older mixed-feeding label in FishBase ecology and the broad omnivore label in the 2016 skull-study
      introduction. Vegetable supplementation does not change the principal natural food category. Ciklider
      recommends protein-rich foods, and the research colonies reproduced on cichlid pellets. False indicates
      no established special conflict with appropriate animal foods, not immunity to bloat or proof from a
      disease-incidence trial. CRC verifies the plankton-feeding classification."

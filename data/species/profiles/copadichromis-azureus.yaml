partners:
  suitable:
    - species: "Aulonocara baenschi"
      reason: "Its male pattern differs from blue azureus, and its species account permits differently patterned
        Copadichromis."
      condition: "At least 500 L for the community, with each species given its own adequate social group and
        separate retreat areas."
    - species: "Cyrtocara moorii"
      reason: "Seriously Fish names this calmer Malawi hap as a possible companion; individual blue males still need
        observation for rivalry."
      condition: "A community larger than the azureus minimum that also meets the full adult space and group
        requirements of moorii."
    - species: "Labidochromis caeruleus"
      reason: "Malawi-Guru specifically permits the yellow insect-feeding form; Seriously Fish excludes mbuna more
        generally, so this is a conditional choice."
      condition: "At least 500 L with rock shelters separated from open azureus sand and swimming routes; both
        species must retain normal feeding access."
  unsuitable:
    - species: "Copadichromis borleyi"
      reason: "Shares the presumed copadichromis crossing group; similar females and male rivalry complicate a mixed
        breeding setup. A named free-choice azureus cross is unconfirmed."
    - species: "Copadichromis trewavasae"
      reason: "A distinct valid species in the same presumed crossing group; the caution is based on genus-wide
        warnings rather than an established named azureus cross."
    - species: "Aggressive Lake Malawi mbuna"
      reason: "Forceful territorial companions can suppress this comparatively mild harem and compete for its
        swimming and feeding space."
    - species: "Timid Lethrinops species"
      reason: "Malawi-Guru warns that breeding azureus can dominate these sand cichlids, while Ciklider permits
        peaceful Lethrinops more generally. Treat timid species as a poor match; the evidence is conditional
        rather than a demonstrated incompatibility of every member of the genus."
profile:
  overview:
    text: "Copadichromis azureus is a southern Lake Malawi utaka whose mature males develop a strong blue
      appearance. Its aquarium needs are shaped by open swimming space and courtship, rather than a
      fish-eating diet. An adult group of one male with at least three females is the practical starting unit.
      Copadichromis borleyi and C. trewavasae are different valid species, despite their similar females and
      their shared presumed crossing-risk group."

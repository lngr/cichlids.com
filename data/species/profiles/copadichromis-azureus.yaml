  khDkh:
    value:
      min: 5
      max: 8
    confidence: "high"
    rationale: "Natural carbonate buffering remains the tally range of 5 to 8 dKH. Branchu alkalinity corresponds
      to about 6.5 to 6.9 dKH, including a 125 m sample at the upper limit; Jackson alkalinity compiled by FAO
      corresponds to 5.6 to 7.3 dKH. Sodium-associated bicarbonate helps explain why alkalinity-derived KH
      exceeds calcium-magnesium GH. The complete decided range is a rounded lake synthesis, not a
      species-specific aquarium experiment."

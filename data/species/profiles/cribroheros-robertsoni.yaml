    on 2026-10-13; neither is the current genus. Legacy query:
    https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&\
    genus=Amphilophus. Alternative-genus query:
    https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&\
    genus=Cincelichthys."

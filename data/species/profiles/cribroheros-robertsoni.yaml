        archived: doi.org/10.1594/pangaea.940538/2026-10-14T095334Z
        accessed: "2026-10-13"
  sizeAndGrowth:
    text: "Plan for large adults before buying small juveniles. Nordic and GCCA accounts place large
      fish near 25 cm, while other aquarium sources give smaller maxima. FishBase reports standard
      length, which excludes the tail and should not be compared directly with aquarium total
      length. This profile selects 25 cm for males and a provisional 20 cm for females. The female
      figure is an estimate because published sex-specific measurements differ and are sparse.
      Growth and mature coloration develop over a long period, and a group used to obtain a pair
      needs adequate space as its members grow."
    sources:
      - kind: "literature"
        title: "Toromanovic (2016). Astatheros robertsoni. Greater Chicago Cichlid Association breeding
          report"
        url: "https://www.gcca.net/art-pics/cichlid-profiles-list/central-american-cichlids/410-astatheros-\
          robertsoni.html"
        accessed: "2026-10-13"

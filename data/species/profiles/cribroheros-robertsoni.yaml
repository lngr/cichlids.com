  sexing:
    text: "Sexing young fish from appearance alone is unreliable. Mature males usually grow larger and
      show stronger blue colour, with more extended dorsal and anal fin tips. Females are often
      smaller, but locality variation and individual condition can make the differences subtle. The
      NVC account notes that some forms show little difference in body size between the sexes. Use
      several features together and confirm a pairing by reproductive behaviour rather than colour
      alone. Breeding bars indicate reproductive state or mood and should not be treated as a
      permanent male-only mark. Do not buy two bright fish on the assumption that they will form a
      compatible pair."
    sources:

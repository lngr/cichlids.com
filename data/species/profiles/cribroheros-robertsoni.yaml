  breeding:
    text: "A compatible pair breeds on the substrate and both parents tend the brood. Accounts describe
      prepared stones as well as open depressions in sand, followed by movement of the larvae among
      pits. Hatching and the start of free swimming depend on temperature; a breeder reported
      free-swimming young about eight days after spawning. Small sinking foods and newly hatched
      Artemia can feed the fry once their yolk is absorbed. Pair formation can require patience even
      when daily care is straightforward. Arrange separate space for the brood and displaced adults
      before spawning, because parental defence can overwhelm otherwise workable community
      arrangements."
    sources:
      - kind: "database"

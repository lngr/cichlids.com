variants:
  - name: "Honduras Red Cheek"
    kind: "locality"
    note: "The NVC account describes a Honduran population with more yellow and red on the gill covers.
      It has circulated under the misapplied trade name Astatheros margaritifer; this is not adopted
      as a taxonomic synonym."
  - name: "Blue-green form"
    kind: "color-morph"
    note: "The NVC account distinguishes predominantly blue-green aquarium fish from Red Cheek fish.
      This is a descriptive trade form, not a demonstrated domestic strain; retain collection
      locality whenever known."
  - name: "Lago Petén Itzá"
    kind: "locality"
    note: "A named collection locality in the Nordic register. No fixed diagnostic colour difference is
      asserted here."
  - name: "Cenote Escondido"
    kind: "locality"
    note: "A named Mexican collection locality in the Nordic register and CRC photographs. Keep its
      provenance separate from other stocks."

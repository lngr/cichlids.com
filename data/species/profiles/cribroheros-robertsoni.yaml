  aggressionConspecific:
    value: 3
    confidence: "medium"
    rationale: "All four runs selected level 3. Nordic explicitly warns of strong same-species
      aggression and recommends pairs; FishProfiles reports difficult pairing and Aqua-Fish warns
      about several males. NVC instead reports a calmer six-fish hierarchy. Persistent rivalry
      warrants level 3 for the recommended established adult pair and possible surplus rivals;
      successful groups in more space do not demonstrate safety in the pair minimum. The sources do
      not establish the routine permanent injury needed for level 4."

    rationale: "All four runs recommend a pair. Nordic explicitly recommends adult pairs; FishBase, GCCA
      and NVC describe two-parent substrate reproduction. NVC and other accounts also describe
      groups, so monogamous spawning does not establish exclusive pair living throughout the year.
      An established compatible pair is the adult unit for the stated minimum; larger groups need
      more floor area and management. CRC is corroboration of monogamy rather than the origin of the
      recommendation."

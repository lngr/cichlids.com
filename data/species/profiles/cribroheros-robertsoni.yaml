  aggressionHeterospecific:
    value: 3
    confidence: "medium"
    rationale: "Generator proposed 3 and all three checkers proposed 2. Nordic, NVC and Aqua-Fish
      describe mild behavior toward other species outside reproduction. The more specific GCCA
      breeding account reports a pair forcing other adults into an upper corner and subsequently
      attacking them as fry became free swimming. That extends beyond simple exclusion at the egg
      site and supports level 3 for adult brood defence. It does not establish routine killing of
      comparable-sized fish or constant aggression outside breeding; mixed displays need
      substantially more space than the pair minimum."

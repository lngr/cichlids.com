    rationale: "All four runs agree on the Atlantic slope from Mexico to Honduras, including Belize and
      Guatemala, but name complementary localities. The Catalog and FishBase establish the
      geographic range; Nordic and NVC locality accounts, Caobas and Creeke Jute fish samples, and
      regional collections support the merged locations. A named locality is not evidence that all
      of its water chemistry or microhabitats are used by the fish. No single waterbody is assigned
      because the species spans several systems."

    rationale: "Generator proposed 25/22 cm male/female, checker-a 20/17, checker-b 23/18, and checker-c
      25/20. Nordic gives 25 cm without sex separation, and GCCA gives about 25.4 cm with females
      smaller. FishProfiles provides 20.3/17.5 cm, while Aqua-Fish describes adults near 22.9 cm but
      has a smaller usual-size header. FishBase's 19 cm standard length excludes the tail and cannot
      be treated as 19 cm total length. Select 25 cm for a typical large male and a provisional 20
      cm for a female, retaining low confidence for the unmeasured female maximum. A forum female
      near 25 cm is an exceptional low-weight report and does not establish the typical sex-specific
      maximum."

partners:
  suitable:
    - species: "Thorichthys maculipinnis"
      reason: "A comparatively restrained Central American sifter; PFK reports keeping the fish together
        under the older name Thorichthys ellioti."
      condition: "A substantially larger display than the 500 L pair minimum, comparable adult sizes,
        separate retreats and capacity to separate a breeding pair; the reported pairing is
        conditional, not guaranteed."
    - species: "Oscura heterospila"
      reason: "The NVC species account recommends this relatively calm larger cichlid, formerly called
        Vieja heterospila."
      condition: "A substantially larger display than the 500 L pair minimum, comparable adult sizes,
        separate retreats and capacity to separate a breeding pair; the reported pairing is
        conditional, not guaranteed."
    - species: "Maskaheros regani"
      reason: "NVC recommends this companion and PFK reports a mixed display containing it under the older
        name Vieja regani."
      condition: "A substantially larger display than the 500 L pair minimum, comparable adult sizes,
        separate retreats and capacity to separate a breeding pair; the reported pairing is
        conditional, not guaranteed."
  unsuitable:
    - species: "Small fish and fry around 2 cm or less"
      reason: "The decided level-1 predation category covers opportunistic consumption. Sources report
        smaller fish being eaten but do not establish an exact safe threshold for larger
        companions."
    - species: "Amphilophus labiatus"
      reason: "A large, forceful territorial fish can injure or chronically intimidate a quieter sifter
        and monopolize food."
    - species: "Parachromis dovii"
      reason: "Its much greater adult size, territorial attacks and fish-eating behaviour put robertsoni
        at risk."
profile:
  overview:
    text: "Cribroheros robertsoni brings turquoise colour and constant sand sorting to a large Central
      American aquarium. Some Honduran stocks have warmer head colours. The current name is
      Cribroheros; Amphilophus and Astatheros remain common in older care accounts and trade labels.
      Mature males may approach 25 cm. An established adult pair is the planning unit here, with at
      least 500 litres and substantial bottom space. Pair formation and brood defence make this a
      demanding choice despite often restrained behavior with other species outside breeding."
    sources:
      - kind: "catalog-of-fishes"
        title: "Eschmeyer's Catalog of Fishes: Cribroheros species and the robertsoni entry"
        url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=specie\
          s&genus=Cribroheros"
        archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-355aa69b/2026-10-14T095330Z
        accessed: "2026-10-13"
      - kind: "literature"
        title: "Toromanovic (2016). Astatheros robertsoni. Greater Chicago Cichlid Association breeding
          report"
        url: "https://www.gcca.net/art-pics/cichlid-profiles-list/central-american-cichlids/410-astatheros-\
          robertsoni.html"
        accessed: "2026-10-13"
      - kind: "database"
        title: "Kwist: Cribroheros robertsoni. Nederlandse Vereniging van Cichlidenliefhebbers species
          account"
        url: "https://www.nvcweb.nl/visbeschrijvingen/midden-amerika/cribroheros-robertsoni-regan-1905"
        archived: nvcweb.nl/visbeschrijvingen/midden-amerika/cribroheros-robertsoni-regan-1905/2026-10-14T095335Z
        accessed: "2026-10-13"
      - kind: "database"
        title: "Nordiska Ciklidsällskapet species register: Cribroheros robertsoni"
        url: "https://ciklid.org/artregister/art.php?ID=247"
        archived: ciklid.org/artregister/art.php/q-0ac7405c/2026-10-14T095334Z
        accessed: "2026-10-13"
  habitat:
    text: "The species occurs on the Atlantic slope from southern Mexico through Belize and Guatemala to Honduras, using rivers, lakes and sinkholes. Soft sediment offers feeding ground, while stones, vegetation and submerged structure provide cover. Chemistry differs markedly among localities. Caobas fish sampling provides the lower temperature and pH observations, and Peten Itza studies supply calcium and magnesium measurements for moderately hard water. Bacalar is a notable sulfate-rich lagoon in a gypsum karst system: Yanez-Montalvo et al. report calcium and magnesium concentrations equivalent to about 73.6 to 90.2 dGH. This exceptional chemistry does not represent ordinary aquarium water or demonstrate long-term captive tolerance."
    sources:
      - kind: "catalog-of-fishes"
        title: "Eschmeyer's Catalog of Fishes: Cribroheros species and the robertsoni entry"
        url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=specie\
          s&genus=Cribroheros"
        archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-355aa69b/2026-10-14T095330Z
        accessed: "2026-10-13"
      - kind: "literature"
        title: "Valtierra-Vega and Schmitter-Soto (2000). Feeding habits of cichlids in Lake Caobas,
          Quintana Roo, Mexico. Revista de Biologia Tropical 48, 503-508"
        url: "https://doi.org/10.15517/rbt.v48i2-3.18819"
        archived: doi.org/10.15517_rbt.v48i2-3.18819/2026-10-13T073018Z
        accessed: "2026-10-13"
      - kind: "literature"
        title: "Perez et al. (2010). Distribution, diversity and ecology of modern freshwater ostracodes and
          hydrochemical characteristics of Lago Peten Itza, Guatemala"
        url: "https://doi.org/10.4081/jlimnol.2010.146"
        archived: doi.org/10.4081_jlimnol.2010.146/2026-10-13T001607Z
        accessed: "2026-10-13"

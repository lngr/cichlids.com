  temperatureC:
    value:
      min: 25
      max: 30
    confidence: "medium"
    rationale: "The fixed tally selects 25 to 30 C by qualified majority, 5 of 6 votes. Lake Caobas
      water measured during fish sampling was 25.1 to 29.3 C, and Peten Itza upper water reached 30
      C; the lower endpoint is tally rounding. The generator used only 27.2 to 30 C. Checker-a
      proposed 25 to 30 C, checker-b and both tie-breakers 25.1 to 30 C, and checker-c 25.1 to 30.5
      C. The wider measured cross-locality envelope is 25.1 to 30.5 C because the 2013 PANGAEA
      Bacalar station recorded 30.5 C; that higher observation remains evidence despite the narrower
      decided maximum. Lacanja measured 29.2 C. Deep low-oxygen layers and air temperatures are
      excluded. Coverage remains incomplete across the native distribution."

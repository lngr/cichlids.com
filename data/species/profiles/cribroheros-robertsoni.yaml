  compatibility:
    text: "Calm Central American cichlids can share a substantially larger display when every adult can
      retreat and feed. Published accounts include Thorichthys maculipinnis under the older ellioti
      name and Maskaheros regani under Vieja regani; NVC also suggests Oscura heterospila. These
      examples do not establish safety at the minimum for a robertsoni pair. A breeding pair may
      pursue companions across the tank, while forceful large cichlids can intimidate the sifter.
      Fry and very small fish face opportunistic predation; the level-1 size convention is not a
      tested safe threshold for larger companions. No supported hybrid group is assigned, which
      records missing evidence rather than demonstrated reproductive isolation."
    sources:
      - kind: "literature"

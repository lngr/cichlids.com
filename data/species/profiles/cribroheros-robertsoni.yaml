  socialBehavior:
    text: "Adults do not have one universally predictable social pattern. Some keepers maintain loose
      groups with a hierarchy, whereas the Nordic register warns of strong aggression between
      conspecifics and recommends pairs. This profile therefore uses an established pair as its
      adult planning unit. A collection of juveniles can help a pair form, but surplus adults need
      alternative accommodation. Breeding fish may chase companions across the tank and confine them
      near the surface. Have a divider or spare aquarium available before spawning occurs. Observe
      the subordinate fish at feeding time and check whether it can leave cover without being
      pursued."
    sources:
      - kind: "database"
        title: "Nordiska Ciklidsällskapet species register: Cribroheros robertsoni"

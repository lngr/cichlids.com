  diet:
    text: "The decided diet is invertivore, reflecting the strong emphasis on aquatic invertebrates in
      field records and ecological descriptions. Offer a complete sinking food with suitable insect
      larvae, crustaceans and occasional molluscs or other invertebrates; plant ingredients can
      remain part of the varied diet. Caobas data concern juveniles, and a small Guatemalan sample
      also consumed substantial detritus, so feeding is not identical across populations or ages.
      Ensure food reaches the bottom where the fish gathers sediment and sorts edible particles.
      Small fish may also be taken opportunistically. The provisional absence of a protein-triggered
      bloat flag does not establish resistance to digestive illness or overfeeding."

        url: "https://en.aqua-fish.net/fish/false-firemouth-cichlid"
        archived: en.aqua-fish.net/fish/false-firemouth-cichlid/2026-10-14T095335Z
        accessed: "2026-10-13"
  husbandry:
    text: "Use at least 500 litres and about 150 by 60 cm of bottom space for an established compatible pair. The 60 cm depth is a layout judgment rather than a published experimental threshold. Leave open fine sand, interrupt sightlines with securely supported wood and rocks, and anchor any plants away from digging areas. Groups and mixed displays need more room. Provide effective biological filtration, oxygenation and regular water changes. Routine care around 24 to 27 C has stronger support than prolonged keeping at the warm edge. The GH tolerance of 8 to 18 dGH contains the moderately hard natural range; published aquarium recommendations support its central portion more strongly than its endpoints. Measure GH and KH separately and consider the collection locality."
    sources:
      - kind: "literature"
        title: "Toromanovic (2016). Astatheros robertsoni. Greater Chicago Cichlid Association breeding
          report"
        url: "https://www.gcca.net/art-pics/cichlid-profiles-list/central-american-cichlids/410-astatheros-\

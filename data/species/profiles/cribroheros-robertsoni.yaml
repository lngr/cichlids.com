  problems:
    text: "Common mistakes are buying a juvenile for a small permanent tank, removing its usable sand
      bed, or placing it with companions that prevent feeding. A breeding pair may turn a previously
      calm aquarium into a serious territorial conflict. Uneaten food, accumulated waste and poorly
      oxygenated warm water add stress and can make injuries or disease more likely. Fin damage,
      clamped fins, abnormal skin and persistent loss of appetite need prompt attention to water
      quality and social pressure. An archived keeper report describes such symptoms but establishes
      no diagnosis. Quarantine newcomers and seek qualified help when signs persist; neither an
      online profile nor appearance alone identifies a disease."

    rationale: "The median decision of 12 to 53 dGH is replaced with 12 to 15 dGH because 53 is an arithmetic compromise between ordinary lake water and exceptional Bacalar chemistry, proposed by none of the votes. Checker-b's range rounds outward from Peten Itza measurements: Perez et al. report calcium and magnesium equivalent to 12.34 dGH, and Hillesheim et al. give a lake mean equivalent to 14.05 dGH. These observations support a moderately hard natural range relevant to keeping, with incomplete geographic coverage. Bacalar's sulfate-rich karst water is described in the habitat rather than used to set aquarium ranges; conductivity alone does not establish GH."

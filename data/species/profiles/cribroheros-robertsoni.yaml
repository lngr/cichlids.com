  diet:
    value:
      type: "invertivore"
      bloatSensitive: false
      foods:
        - "Aquatic insect larvae"
        - "Small crustaceans"
        - "Snails"
        - "Sinking prepared food with some plant ingredients"
    confidence: "medium"
    rationale: "The tally selects invertivore with bloatSensitive false by qualified majority, 4 of 6
      votes. Generator and checker-a proposed omnivore; checker-b, checker-c and both tie-breakers
      proposed invertivore. Caobas juvenile stomachs were dominated by cladocerans, chironomids and
      copepods; Fischlexikon describes chiefly benthic animal food. Hulsey records molluscs from an
      earlier feeding dataset, rather than a new adult diet survey for this species. The Creeke Jute
      study of only five 44 to 54 mm fish found both animal food and detritus important and little
      plant food, supporting locality variation and explaining the omnivore proposals. The selected
      category represents its invertebrate feeding niche without excluding detritus, plant fragments
      or complete prepared foods. CRC verifies the independently reached insect and mollusc
      interpretation. FishBase's zooplankton entry derives from Caobas and is not another
      independent field study. No reliable species-specific protein-triggered bloat syndrome is
      established; false is provisional and does not imply immunity."

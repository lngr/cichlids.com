  ghDgh:
    value:
      min: 0
      max: 4
    confidence: low
    rationale: "Keep the unanimous Tally decision of 0 to 4 dGH: all four proposals agree within the two-degree threshold,\
      \ and their endpoint medians round to these bounds. The estimates differ because no read study measures GH beside\
      \ identified proteus at Orosa or Yanashi. Regional paired calcium and magnesium measurements imply about 1.25\
      \ to 2.82 dGH in the upper Solimoes and approximately 1.2 to 3.6 dGH in the Acre system, while dilute tributaries\
      \ are below one degree. The Iquitos-Nauta regional total-hardness envelope converts to approximately 0.06 to\
      \ 4.37 dGH and is slightly wider than the decided range; it includes main-channel sites without verified species\
      \ occurrence. Zero represents rounded very soft freshwater, not pure deionized water. Conversion uses Ca/7.14\
      \ plus Mg/4.34 for ions in mg/L, or CaCO3-equivalent total hardness divided by 17.848. The secondary Atlas attribution\
      \ of 6 to 7 dGH to natural water conflicts with the original account, where it is aquarium breeding water. Retain\
      \ low confidence in the exact habitat endpoints. Proposals: generator {\"min\": 0, \"max\": 5}; checker-a {\"\
      min\": 0.5, \"max\": 2.5}; checker-b {\"min\": 0, \"max\": 4}; checker-c {\"min\": 0, \"max\": 3}."
    sources:
    - kind: literature
      title: "Ismiño Orbe, Montalván Naranjos and Maco García (2012). Hidrografía e hidrología: Iquitos-Nauta, Annexes\
        \ 1 and 2"
      url: "https://terra.iiap.gob.pe/assets/files/micro/zee_iquitos_nauta/01_Hidrografia_e_Hidrologia.pdf"
      archived: terra.iiap.gob.pe/assets/files/micro/zee_iquitos_nauta/01_hidrografia_e_hidrologia.pdf/2026-10-15T072751Z
      accessed: '2026-10-15'

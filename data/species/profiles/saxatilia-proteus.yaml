        \ breeding at 2 dKH and Rybicky breeding advice at 1 dKH are point observations only. Source-attributed inferred\
        \ bands of 0 to 6 or 0 to 8 are interpretations, not direct KH recommendations. The inferred tolerance deliberately\
        \ extends beyond the natural 0 to 2 dKH estimate; neither endpoint is a demonstrated harm threshold. Proposals:\

  husbandry:
    text: "For an established adult pair, plan at least 225 litres with a base about 120 by 45 cm. This minimum is\
      \ a synthesis of differing pair recommendations, and more room is needed for additional large fish. Build several\
      \ retreats with wood and stable cavities, interrupt sight lines, and keep a divider or separate aquarium ready.\
      \ Sand allows digging; protected plants and floating cover reduce exposure. Cover the tank securely, including\
      \ service openings. Maintain good filtration and regular water changes. Around 25 to 27 C with stable slightly\
      \ acidic to neutral water is a useful routine target. The wider tolerances of 23 to 28 C, pH 6 to 7.5 and 0\
      \ to 15 dGH describe working husbandry bounds rather than experimentally proved limits. KH 0 to 7 is particularly\
      \ provisional, and very weak buffering requires attention to pH stability."

  sexing:
    text: "Mature males generally become larger. Females often show stronger dorsal-fin markings and a conspicuous\
      \ belly as spawning approaches, while adult male body colors remain relatively pale with dark markings. Age,\
      \ condition and reproductive state change appearance, so body size or one fin outline alone cannot establish\
      \ sex. Juveniles and closely similar pike species are especially easy to misidentify. Seek consistent identification\
      \ and several mature characteristics when obtaining a proposed pair."

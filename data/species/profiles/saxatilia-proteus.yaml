    value:
      min: 6
      max: 7
    confidence: medium
    rationale: "The qualified-majority decision is pH 6 to 7, with five of six proposals agreeing within the rubric\
      \ threshold. This is the measured interval at both collecting areas in Pettersen and Wolla. The decision is\
      \ narrower than their reported regional extremes of 4.5 to 8.2, the Curaray-Arabela-Napo study envelope of 5.7\
      \ to 7.6, the IIAP stream and Maranon ranges of 5.7 to 6.0 and 5.8 to 7.1, and the 2019 regional monitoring\
      \ envelope of 5.24 to 7.94. Those wider measurements establish regional heterogeneity without establishing the\
      \ usual conditions beside identified fish. Kutty repeats the older broad pH range rather than supplying independent\
      \ field sampling. Cashibococha pH 6 to 6.8 and regional whitewater pH 6.5 to 7 support the selected band. The\
      \ typical range does not imply that excursions outside it are immediately harmful. Proposals: generator {\"\
      min\": 5.7, \"max\": 7.1}; checker-a {\"min\": 6.0, \"max\": 7.5}; checker-b {\"min\": 6, \"max\": 7}; checker-c\
      \ {\"min\": 6, \"max\": 7}; tiebreaker-1 {\"min\": 6, \"max\": 7}; tiebreaker-2 {\"min\": 6, \"max\": 7}."

    value: cave-spawner
    confidence: high
    rationale: "All four proposals choose cave-spawner. Pettersen and Wolla directly observed eggs on the roof of\
      \ a cavity beneath a root and under a slate; independent keeper accounts also describe sheltered overhead egg\
      \ deposition. The CRC public species summary instead labels open substrate, while Seriously Fish says captive\
      \ breeding is unknown. Those conflicting statements remain cited, but detailed observations of actual clutches\
      \ determine the category. Female egg care and male perimeter defense develop into shared defense of swimming\
      \ young."

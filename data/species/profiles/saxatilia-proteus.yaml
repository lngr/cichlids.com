  diet:
    text: "Provide varied animal foods in portions the fish can swallow comfortably. Thawed krill, shrimp, other aquatic\
      \ invertebrates and small fish pieces suit its feeding biology; a suitable prepared carnivore food can help\
      \ if accepted. Some fish readily take pellets while others resist dry foods. Establish reliable feeding before\
      \ adding competitors and observe each individual rather than assuming the fastest strike means equal intake.\
      \ Live feeder fish are unnecessary and can introduce infection. Routine feeding does not make prey-sized tankmates\
      \ safe. The piscivore category allows substantial invertebrate feeding and does not mean an exclusive fish diet."

      title: "Fishes from Yarinacocha lake: an emblematic Amazonian ecosystem in the lower Ucayali River basin, Pucallpa,\
        \ Peru"
      url: "https://doi.org/10.1590/1676-0611-bn-2022-1424"
      accessed: '2026-10-15'
      archived: doi.org/10.1590_1676-0611-bn-2022-1424/2026-10-15T072821Z
  habitat:
    text: "Vegetated shallow margins, sheltered creeks and river-edge cover guide the aquarium layout. Collectors\
      \ found fish among submerged branches and leaves in the Orosa area and near floating plants at Yanashi. Both\
      \ areas measured 25 to 27 C and pH 6 to 7. Habitat hardness and buffering are estimated from regional chemistry\
      \ rather than measurements beside identified fish. The collectors describe a broader regional envelope of 17\
      \ to 28 C and pH 4.5 to 8.2 during changing runoff. Cashibococha, a regional comparison lake without confirmed\
      \ proteus occurrence in the readable study, reached 37 C at the surface within a 24.4 to 37 C series. These\
      \ transient or site-specific extremes remain outside the typical natural range and aquarium tolerance. Source\
      \ coverage spans distinct water types and seasons; a single regional lake cannot describe every population."
    sources:
    - kind: database
      title: "FishBase: Crenicichla proteus"
      url: "https://www.fishbase.se/summary/Crenicichla-proteus.html"
      archived: fishbase.se/summary/crenicichla-proteus.html/2026-10-15T072542Z

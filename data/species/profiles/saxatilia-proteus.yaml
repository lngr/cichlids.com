        \ upper endpoint depends mainly on lower-trust husbandry accounts, so confidence remains medium. The decided\
        \ interval is narrower than the regional wild envelope of 4.5 to 8.2, which includes transient conditions\
        \ and is not evidence of long-term aquarium health. Unspecified alkaline-water spawning cannot support pH\
        \ 8 as a numerical endpoint. Kutty's separate pH 7.8 breeding observation concerns C. cf. menezesi and is\

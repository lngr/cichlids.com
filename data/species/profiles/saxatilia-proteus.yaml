  breeding:
    text: "Offer a compatible pair several sheltered cavities under wood or stable stone. Keeper observations describe\
      \ eggs attached overhead inside a retreat, with the female tending eggs and larvae while the male guards the\
      \ surrounding area. Both adults may later defend swimming young. Newly swimming fry accept small live foods\
      \ such as brine shrimp nauplii. Brood care can destabilize the pair, especially after losses, so retain immediate\
      \ separation options. Keep other fish out of the breeding setup and separate unevenly sized growing juveniles\
      \ when necessary. Published direct spawning accounts support cave spawning despite contradictory older summary\
      \ labels."
    sources:
    - kind: website
      title: "Multihobby (2018). Crenicichla proteus: Rozród"

  compatibility:
    text: "Swallowable fish are at risk of predation, and robust size alone does not prevent territorial disputes.\
      \ Adult larger cichlids and suitable catfish can work in an aquarium substantially larger than the pair minimum,\
      \ with separate shelters and room outside the breeding territory. The named suitable partners are conditional\
      \ suggestions inferred from mixed-tank reports, without a controlled test of each combination. Small tetras,\
      \ small dwarf cichlids and competing pikes are poor choices. Catfish may also consume eggs or young. No supported\
      \ hybrid group is assigned; this absence does not establish reproductive isolation from other pikes."
    sources:

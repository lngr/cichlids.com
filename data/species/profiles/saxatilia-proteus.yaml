    rationale: "The four male proposals are 18, 15, 20 and 18 cm, giving a median of 18 cm. Keep 18 cm as a typical\
      \ aquarium male maximum because the firsthand Multihobby account reports usual males of 15 to 18 cm, despite\
      \ a larger 20 cm maximum. Female proposals of 15, 12, 16 and 14 cm give a median of 14.5 cm; choose approximately\
      \ 14 cm because the NVC account is the only read source quantifying female size, at about 30 percent below a\
      \ 20 cm male. This is an approximate planning size, not a measured sex-specific growth series. FishBase 15.5\
      \ cm and Seriously Fish 15 cm are standard lengths without the tail and cannot be substituted directly for aquarium\
      \ total length. The older article and Kutty also mention larger group-level lengths, which do not establish\
      \ the usual maximum of aquarium proteus. Proposals by run: generator {\"male\": 18, \"female\": 15}; checker-a\
      \ {\"male\": 15, \"female\": 12}; checker-b {\"male\": 20, \"female\": 16}; checker-c {\"male\": 18, \"female\"\

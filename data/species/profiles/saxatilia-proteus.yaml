  sizeAndGrowth:
    text: "Use approximately 18 cm total length for a typical aquarium male and about 14 cm for a female. Female size\
      \ has weaker support and individual fish may exceed these planning figures. The often repeated scientific maximum\
      \ of 15.5 cm is standard length, which excludes the tail. Well-fed young can grow quickly, and uneven growth\
      \ among siblings can lead to cannibalism. A lifespan of 8 to 11 years is only a planning estimate; published\
      \ species-specific age verification is lacking."

  - field: features.aggressionConspecific
    proposals:
    - by: generator
      value: 4
    - by: checker-a
      value: 3
    - by: checker-b
      value: 4
    - by: checker-c
      value: 4
    decision: 4
    rationale: "Choose level 4 over checker-a's level 3. Pettersen and Wolla describe lethal male harassment of females\
      \ in two breeding histories, Kutty reports additional female and rival deaths, and the Multihobby breeder independently\
      \ warns of fatal partner attacks. Those outcomes meet the rubric's injury-or-death criterion even when aggression\
      \ emerges only after a formerly compatible pair changes reproductive state. A large tank, visual refuges and\
      \ immediate separation capacity remain necessary. A moderate reputation among pike cichlids does not lower this\
      \ specific risk."

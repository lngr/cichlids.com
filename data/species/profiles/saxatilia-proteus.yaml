  khDkh:
    value:
      min: 0
      max: 2
    confidence: low
    rationale: "Keep the qualified-majority Tally value of 0 to 2 dKH, with five of six proposals agreeing within\
      \ the two-degree threshold. No alkalinity measurement tied directly to identified fish at the collecting sites\
      \ was found. Cashibococha alkalinity of 14 to 22 mg/L as CaCO3 converts to 0.78 to 1.23 dKH, and Napo alkalinity\
      \ of 12 to 24 mg/L is approximately 0.67 to 1.34 dKH if expressed as CaCO3 equivalents. Regional Solimoes bicarbonate\
      \ of 19 to 37 mg/L implies about 0.87 to 1.70 dKH. Divide CaCO3 equivalents by 17.848, or bicarbonate by about\
      \ 21.8. The lower Nanay report labels its 2 to 6 mg/L as total alkalinity, so checker-derived bicarbonate-specific\
      \ conversions of that row remain uncertain. The decided range is narrower than the Iquitos-Nauta proxy envelope\
      \ of 0.11 to 4.54 dKH and the 2015 Solimoes proxy envelope of about 0.2 to 3.5 dKH. Those broader main-channel\
      \ measurements remain evidence without establishing usual species-site buffering. The 2019 report table was\
      \ not readable in its extracted text during adjudication; its inherited numerical evidence is retained as unconfirmed\
      \ regional context. Neither GH nor conductivity is converted to KH. Aquarium KH 2 is a breeding observation,\
      \ not natural evidence. Low confidence reflects the proxy habitats and alkalinity-unit uncertainty. Proposals:\

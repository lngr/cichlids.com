  socialBehavior:
    text: "Pair formation and brood care are the periods that need closest observation. A male can injure or kill\
      \ an unreceptive female, including after loss of a brood, even when earlier cohabitation was peaceful. Adults\
      \ also challenge rivals of their own species. During breeding a pair can occupy a large part of the aquarium\
      \ and confine other fish to its edges. Outside breeding the evidence supports less extensive exclusion, although\
      \ individual retreats still matter. Separate fish promptly when pursuit is sustained or one partner can no longer\
      \ feed or leave cover safely."

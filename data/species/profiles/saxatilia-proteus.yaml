  problems:
    text: "The recurring practical problems are jumping, unsuitable small companions and escalating partner attacks.\
      \ Watch for repeated pursuit, damaged fins, feeding exclusion and prolonged hiding. Poor water quality can compound\
      \ these problems, so check filtration and nitrogen waste as well as social conditions. Quarantine new arrivals\
      \ and establish their feeding history. Refusal of a new pellet alone does not identify disease, and persistent\
      \ appetite, breathing or body-condition changes need assessment. Neither a large water change nor an apparently\
      \ stable pair guarantees that subsequent breeding behavior will remain safe."
    sources:
    - kind: literature
      title: Pettersen and Wolla (1997). Crenicichla proteus Cope 1872
      url: "https://cichlidae.com/article.php?id=Omsx8IgyIlcrVFgjXgsRKg"

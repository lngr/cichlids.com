  temperatureC:
    value:
      min: 25
      max: 27
    confidence: medium
    rationale: "The qualified-majority decision is 25 to 27 C, with four of six votes agreeing. Pettersen and Wolla\
      \ measured this interval at both occupied Orosa and Yanashi collecting areas and describe it as usual for the\
      \ species. This is a range observed at multiple sites, not a single point. It is narrower than their broader\
      \ regional 17 to 28 C envelope, the IIAP forest-stream range of 24 to 29.5 C, Curaray-Arabela readings of 24.4\
      \ to 30.2 C and Cashibococha surface readings of 24.4 to 37 C. Those sources include transient conditions or\
      \ sites without demonstrated proteus occurrence at each reading. They remain evidence but do not define the\
      \ typical occupied microhabitat. No year-round series at verified collecting sites was found. The ENSO source\
      \ supplied only a landing-page abstract, so its unseen tables add no numerical support. Proposals: generator\
      \ {\"min\": 24, \"max\": 30}; checker-a {\"min\": 24, \"max\": 29}; checker-b {\"min\": 25, \"max\": 27}; checker-c\
      \ {\"min\": 25, \"max\": 27}; tiebreaker-1 {\"min\": 25, \"max\": 27}; tiebreaker-2 {\"min\": 25, \"max\": 27}."

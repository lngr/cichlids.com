partners:
  suitable:
  - species: Heros efasciatus
    reason: "A robust adult is too deep-bodied to be ordinary prey and can share warm soft water. This is a conditional\
      \ inference from reports of similar-sized cichlids, not a documented species-pair trial."
    condition: Use adults in an aquarium substantially larger than the pair minimum; separate spawning territories.
  - species: Mesonauta festivus
    reason: A full-sized adult offers a different body shape and swimming position. Small juveniles remain prey and
      a timid individual may be bullied.
    condition: Spacious planted aquarium with visual barriers; monitor closely and separate if chased.
  - species: Megalechis thoracata
    reason: A large adult armored catfish can use the same broad water conditions and is less vulnerable than small
      free-swimming fish. This specific pairing is inferred.
    condition: Provide separate refuges in a larger aquarium; exclude it from any breeding setup.
  unsuitable:
  - species: Paracheirodon innesi
    reason: Small adult size puts it within prey range.
  - species: Poecilia reticulata
    reason: Small individuals and fry are likely to be hunted; routine guppy keeping also often uses harder water.
  - species: Apistogramma cacatuoides
    reason: Smaller females and juveniles face predation and both species compete for sheltered bottom territories.
  - species: Saxatilia lepidota
    reason: A similar-shaped territorial pike may trigger rivalry; mixed pike identities also complicate management.
profile:
  overview:
    text: "An adult Saxatilia proteus needs space for predation and pair behavior as well as space to swim. A compatible\
      \ pair offers close observation of cooperative brood care, but a partnership that once appeared settled can\
      \ turn dangerous. The name Crenicichla proteus remains common in aquarium literature; the accepted genus is\
      \ Saxatilia. This fish comes from the upper and western Amazon basin and can live with appropriately robust\
      \ neighbours in a larger aquarium. Small community fish remain potential prey."
    sources:
    - kind: catalog-of-fishes
      title: "Eschmeyer's Catalog of Fishes: Saxatilia species"
      url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Saxatilia"
      archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-2ecfba06/2026-10-15T072532Z

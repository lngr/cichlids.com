      confidence: medium
      rationale: "Decided by qualified majority (5 of 6 votes): checker-a, checker-b, checker-c and both
        tie-breakers proposed 7.5 to 9.0, the generator 7.5 to 8.6. Seriously Fish gives 7.5 to 9.0
        for this form and for A. stuartgranti, and a genus care page repeats it; the Nordic
        register, my-fish, Fishkeeper and Garnelio stop at 8.5, and two retail sheets mirror the
        lake range of 7.8 to 8.6. The care sources agree on a lower limit of 7.5. Lower figures
        exist but do not describe long-term keeping: FishBase gives 7.2 to 8.2 for the related A.
        baenschi after an aquarium atlas, below the lake values, and a 2026 aquaculture study held
        juvenile A. stuartgranti at about pH 7.0 to 7.2 for a short trial only. The decided 7.5 to
        9.0 is therefore narrower than the full source span of 7.0 to 9.0 and contains the natural
        7.7 to 8.6."

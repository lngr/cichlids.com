        max: 29
      confidence: medium
      rationale: All four votes agree on 21 to 29 C. Care sources for this form give 25 to 29 C (Seriously
        Fish), 23 to 28 C (Nordic register) and about 24 to 28 C (GCCA breeder report, Guidarium);
        for A. stuartgranti they give 23 to 29 C (Seriously Fish), 22 to 26 C (FishBase, Fishkeeper)
        and 24 to 27 C (Garnelio), and a laboratory colony of A. stuartgranti was kept at 26 C for
        years (Schwalbe et al. 2016). The upper bound of 29 C is shared by Seriously Fish and the
        lake. The lower bound is widened to the 21 C the fish meet in the lake in the cool season;
        no care source documents years of keeping below 22 C, so 24 to 28 C is the better supported
        everyday range.

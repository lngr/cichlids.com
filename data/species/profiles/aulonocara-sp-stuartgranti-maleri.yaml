  predation:
    value: 1
    confidence: low
    rationale: "Decided conservatively: level 1 was proposed by the generator, checker-a and
      tiebreaker-1, level 0 by checker-b, checker-c and tiebreaker-2. With 3 of 6 votes no qualified
      majority exists, so the vote count takes the higher, more cautious level, and the confidence
      is low. All sources agree that the fish feeds on small invertebrates that it detects in or on
      the sand through its enlarged lateral line pores and then strikes at (FishBase, Schwalbe et
      al. 2012, 2014 and 2016, Seriously Fish), and none reports fish as food, which rules out
      levels 2 and 3. The level 0 votes read this as an invertebrate specialist that takes fry only
      by chance. The level 1 votes point out that a hunter of small moving prey of this size will
      take free-swimming fry when it meets them, that Seriously Fish advises moving brooding females
      to raise more young and that a TFH article states fry survive only in a tank without other
      fish. Level 1 matches the rubric anchor Labidochromis caeruleus, a smaller invertebrate
      picker. No source tests the reaction to fish of about 2 cm directly."

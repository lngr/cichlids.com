  aggressionConspecific:
    value: 2
    confidence: medium
    rationale: The generator, checker-b and checker-c proposed level 2, checker-a level 3. Males hold a
      site between rocks, chase rival males and drive females hard, so the sources recommend one
      male with four to six females (Seriously Fish, my-fish, GCCA breeder report). Seriously Fish
      calls this form less peaceful than some other peacocks, while the Nordic register describes
      only mild territoriality. A forum report of a male that killed two conspecifics in a tank of
      about 136 litres shows what happens in too small a tank, but it lies outside the recommended
      unit of the rubric. With enough space, cover and females injuries are rare, which is level 2.
    sources:
      - kind: database
        title: "Seriously Fish: Aulonocara sp. 'stuartgranti maleri' (Sunshine Peacock)"

partners:
  suitable:
    - species: Copadichromis borleyi
      reason: Calm open-water hap of similar size and different colour; it uses the upper water layers
        rather than the sand.
    - species: Otopharynx lithobates
      reason: Peaceful hap of rock and sand of similar size, named as a suitable companion for this fish.
    - species: Placidochromis electra
      reason: Peaceful sand-sifting hap whose blue males do not compete for the same colour signals.
    - species: Labidochromis caeruleus
      reason: Quiet mbuna that does not harass peacocks.
      condition: Its yellow males may be taken for rivals; give enough rockwork and space.
    - species: Cyrtocara moorii
      reason: Calm sand-dwelling hap that tolerates peacocks well.
      condition: Tank of at least 150 cm, because Cyrtocara grows larger.
  unsuitable:
    - species: Aulonocara baenschi
      reason: Yellow look-alike peacock; the males fight as rivals and the females cross readily.
    - species: Aulonocara stuartgranti
      reason: Closest relative, perhaps the same species; crosses are almost certain.
    - species: Sciaenochromis fryeri
      reason: Its males court and spawn with peacock females, and it eats the fry.
    - species: Maylandia zebra
      reason: Boisterous mbuna that harasses peacocks, outcompetes them at feeding and keeps the males
        from colouring up.
    - species: Melanochromis auratus
      reason: Aggressive mbuna that stresses the calmer peacocks.
    - species: Tropheus moorii
      reason: Lake Tanganyika algae grazer with other food needs; it bullies peacocks and suffers from
        their protein-rich food.
profile:
  overview:
    text: "The sunshine peacock is a peacock cichlid from the south-west of Lake Malawi, traded as
      Aulonocara maleri, yellow regal peacock, orange peacock or sunshine peacock. It has no
      scientific name yet: specialists treat it as an undescribed member of the Stuartgranti group,
      and some regard it as a southern population of Aulonocara stuartgranti. Adult males shine
      yellow to orange with a bluish face, females remain grey-brown with faint bars. It hunts small
      invertebrates over sand and fits a calm Malawi community of haps, but it must be the only
      peacock in the tank because peacocks cross easily. The red aquarium strains 'German Red' and
      'Rubescens' were bred from this fish."

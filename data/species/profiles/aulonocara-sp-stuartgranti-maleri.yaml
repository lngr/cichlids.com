          2005 issue (online feature)."
        url: https://www.practicalfishkeeping.co.uk/features/aulonocara-stuartgranti-ngara-mdoka/
        accessed: 2026-10-13
  compatibility:
    text: Good companions are calm Malawi haps of similar size and different colour, such as
      Copadichromis borleyi, Otopharynx lithobates, Placidochromis electra or, in a tank of 150 cm
      or more, Cyrtocara moorii; quiet mbuna such as Labidochromis caeruleus work as well. All other
      peacocks are unsuitable, above all the yellow Aulonocara baenschi and the related A.
      stuartgranti, because the fish cross and the females cannot be told apart. The electric blue
      hap is unsuitable too, as its males breed with peacock females, and so are boisterous mbuna
      such as Maylandia zebra or Melanochromis auratus, which stress the peacocks and take their
      food. Very small fish and fry are at risk.
    sources:
      - kind: database
        title: "Seriously Fish: Aulonocara sp. 'stuartgranti maleri' (Sunshine Peacock)"

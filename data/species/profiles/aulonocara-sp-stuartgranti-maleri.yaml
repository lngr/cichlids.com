        accessed: 2026-10-13
  sexing:
    text: Adult males are larger, show yellow to orange colours with a blue face, have longer and more
      pointed dorsal and anal fins and carry egg spots on the anal fin. Females and young fish are
      plain grey-brown with darker bars and are almost impossible to tell from the females of
      related peacocks, which is a further reason to keep a single peacock species per tank. The
      sexes can usually be told apart from about four months.
    sources:
      - kind: database
        title: "Seriously Fish: Aulonocara sp. 'stuartgranti maleri' (Sunshine Peacock)"

        accessed: 2026-10-13
  problems:
    text: "Most losses go back to poor or unstable water: rising nitrate, ammonia spikes and large pH
      swings hit these peacocks hard, so an immature tank or skipped water changes are risky.
      Overfeeding, especially with fatty food, leads to bloat and other digestive problems, and
      coarse gravel can damage the gills of a fish that sifts sand. Too few females or several males
      in a small tank cause stress, torn fins and deaths. Other peacocks or electric blue haps in
      the same tank produce hybrids that are hard to recognise. A stressed brooding female may spit
      or swallow her brood."
    sources:

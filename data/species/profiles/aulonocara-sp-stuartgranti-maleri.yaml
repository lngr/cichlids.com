  socialBehavior:
    text: Keep a single male with at least four females. The male holds a spot between the rocks,
      displays for much of the day and steers females towards it; with too few females one of them
      bears all his attention. Rival males fight, and in a cramped tank a dominant male can kill
      weaker fish of his own kind, so more than one male needs a very large tank. Towards other
      species the fish is fairly calm, but males go for anything that resembles them, especially
      other peacocks and yellow or orange fish.
    sources:
      - kind: database
        title: "Seriously Fish: Aulonocara sp. 'stuartgranti maleri' (Sunshine Peacock)"

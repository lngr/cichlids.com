  breeding:
    text: The sunshine peacock is a maternal mouthbrooder that often spawns in a community tank. The
      male courts the female over a flat stone or a pit in the sand; she lays a few eggs at a time
      and takes each batch into her mouth straight away, where the eggs are fertilised when she
      nibbles at the egg spots on his anal fin. She broods for up to about four weeks and eats
      little in that time. The fry leave her mouth able to swim and take newly hatched brine shrimp
      or fine crushed food once any remaining yolk is used up. Because adults eat fry, breeders move
      the brooding female carefully to a quiet tank late in the brooding period, as an early or
      rough move makes her spit or swallow the brood.
    sources:
      - kind: database
        title: "Seriously Fish: Aulonocara sp. 'stuartgranti maleri' (Sunshine Peacock)"

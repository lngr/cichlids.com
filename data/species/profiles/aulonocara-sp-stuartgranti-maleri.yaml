  husbandry:
    text: "One male with four or more females needs a tank of at least 120 cm length and about 240
      litres. Fine sand is essential: the fish take in mouthfuls of it while feeding, and coarse
      gravel hinders this and can injure the gills. Stable rock piles with open sand between them
      give the male a site and the females room to forage. Aim for clean, stable, alkaline water:
      about 24 to 28 C (21 to 29 C are tolerated), pH 7.5 to 9.0 with a stable value around 8, and a
      carbonate hardness of 5 to 15 dKH; total hardness matters less and may lie anywhere from the
      soft lake water up to about 25 dGH. These peacocks suffer from poor or fluctuating water, so
      the tank should be mature before they arrive, strongly filtered and given large weekly water
      changes. Robust plants are left alone."
    sources:
      - kind: database
        title: "Seriously Fish: Aulonocara sp. 'stuartgranti maleri' (Sunshine Peacock)"

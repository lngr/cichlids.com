  diet:
    value:
      type: invertivore
      bloatSensitive: false
      foods:
        - sand-dwelling insect larvae and small crustaceans
        - frozen bloodworm, Mysis and brine shrimp
        - fine cichlid pellets and flakes with some plant matter
    confidence: high
    rationale: All four votes agree on an invertivore that is not bloat sensitive; the lists of foods
      differed only in wording, and the generator's list is kept. In the lake the fish takes
      mouthfuls of sand and sifts out small invertebrates, which it finds with its lateral line
      (FishBase, Schwalbe et al. 2012, 2014 and 2016, Seriously Fish, the Nordic register, my-fish);
      the Cichlid Room Companion confirms an invertebrate feeder. Fishkeeper calls the stuartgranti
      peacocks omnivorous in the aquarium because they accept plant-based food, which describes
      captive feeding rather than the natural diet. The fish is not an algae grazer, so it is not
      bloat sensitive in the sense of the rubric; digestive trouble in peacocks follows overfeeding
      and poor water rather than protein-rich food as such. Some vegetable matter in the dry food is
      still recommended.

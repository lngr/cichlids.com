  coloration:
    value:
      baseColors:
        - yellow
        - blue
        - orange
      pattern: bars
    confidence: medium
    rationale: The proposals were yellow, orange and blue with bars (generator), yellow and blue plain
      (checker-a), yellow and orange plain (checker-b) and yellow and blue with bars (checker-c).
      Adult males have a bright yellow body with a blue sheen on face and throat (Nordic register,
      Oliver, my-fish); the Chidunga fish sold as sunshine or orange peacock carry much orange on
      the body (Seriously Fish, my-fish), so all three colours are kept, which also catches
      look-alike conflicts with orange haps. The two sources that describe the pattern (Nordic
      register, my-fish) name dark vertical bars, which fade in a displaying male; the plain
      proposals were estimates without such a source. Females are grey-brown with bars. The similar
      yellow A. baenschi matters for rivalry and crossing.

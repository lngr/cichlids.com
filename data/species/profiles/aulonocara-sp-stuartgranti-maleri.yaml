  diet:
    text: In the wild the fish hovers just above the bottom, picks up the faint movements of small
      animals with the large sensory pores on its head and snaps them up together with sand, which
      it then sifts out through mouth and gills. In the aquarium it takes fine-grained cichlid
      pellets or flakes, part of them with plant content, together with frozen Mysis, bloodworm and
      brine shrimp. Several small meals a day suit it better than one large one, and overfeeding
      with rich food is the main cause of digestive trouble. Fish are not part of its natural food,
      but adults readily eat free-swimming fry.

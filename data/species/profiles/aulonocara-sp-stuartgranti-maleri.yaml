  habitat:
    text: "The form is known from only a handful of places in the south-west of Lake Malawi: the Maleri
      Islands, Chidunga Rocks off Chipoka, Mumbo Island and Namalenje Island. There it lives where
      rocky shore gives way to sand strewn with single rocks. Adult males each guard a hollow
      between stones whose entrance they edge with a small wall of sand, while the females and young
      move about in loose shoals and search the sand for food. The lake water is soft but alkaline,
      with about 3 to 5 dGH, 5 to 8 dKH, pH 7.7 to 8.6 and 21 to 29 C over the year."
    sources:
      - kind: database
        title: "Seriously Fish: Aulonocara sp. 'stuartgranti maleri' (Sunshine Peacock)"
        url: https://www.seriouslyfish.com/species/aulonocara-sp-stuartgranti-maleri/

  sizeAndGrowth:
    text: Aquarium males usually grow to about 13 cm and females to about 10 cm; the largest males in
      the sources reach 14 to 15 cm including the tail. Young fish grow steadily on varied food, and
      males start to show colour at about four months, when the sexes can first be told apart. The
      full yellow or orange comes with maturity and rank, often only after a year, and a male kept
      down by a stronger rival can stay pale for a long time.
    sources:
      - kind: database
        title: "Seriously Fish: Aulonocara sp. 'stuartgranti maleri' (Sunshine Peacock)"

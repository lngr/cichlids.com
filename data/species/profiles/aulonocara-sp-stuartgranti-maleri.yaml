  synonyms:
    - name: Aulonocara stuartgranti 'Maleri'
      note: Hobby name that treats the fish as a southern population of A. stuartgranti; no published
        revision assigns it to that species.
    - name: Aulonocara sp. 'Maleri'
      note: Short trade name without nomenclatural standing.
  legacyNames:
    - Aulonocara maleri
  note: The Catalog of Fishes (genus list of Aulonocara, accessed 2026-10-13) holds no name maleri,
    neither as a valid species nor among the synonyms of A. stuartgranti Meyer and Riehl 1985, whose
    synonyms A. hansbaenschi and A. steveni follow Konings (2016). "Aulonocara maleri" is therefore
    a trade name, not an available scientific name. Seriously Fish, the Nordic cichlid society
    register, M. K. Oliver (after Konings) and the Cichlid Room Companion all keep the fish as the
    undescribed Aulonocara sp. 'stuartgranti maleri' of the Stuartgranti group; Seriously Fish adds
    that some authors regard it as conspecific with A. stuartgranti and that the question is open.
    Oliver separates it from the similar yellow A. baenschi by its straighter snout profile.
    Seriously Fish names the selectively bred red aquarium strains 'German Red' and 'Rubescens' as
    derived from this fish; the catalog keeps them as entries of their own. Should a revision sink
    the form into A. stuartgranti, this entry merges with the A. stuartgranti profile.

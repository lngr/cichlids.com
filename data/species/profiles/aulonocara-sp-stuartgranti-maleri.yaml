  hybridGroups:
    value:
      - aulonocara
      - sciaenochromis-fryeri-aulonocara
    confidence: medium
    rationale: All four votes agree on both existing groups, and the undescribed form is listed as a
      member of both. Seriously Fish and the Nordic register warn for this very fish that most
      peacocks can cross with it, and Seriously Fish, Practical Fishkeeping and Fishkeeper give the
      same warning for the closely related A. stuartgranti; this places the form in the genus-wide
      group aulonocara, whose basis is presumed. Seriously Fish also names the red aquarium strains
      'German Red' and 'Rubescens' as bred from this fish, and hobbyists in the cichlids.com forum
      suspect that some trade sunshine peacocks are crosses with A. baenschi; these reports do not
      name a cross from a tank with free choice of partners. Seriously Fish and Fishkeeper report
      that males of Sciaenochromis fryeri court and spawn with peacock females in community tanks,
      naming the genus but no species, hence the group sciaenochromis-fryeri-aulonocara, also
      presumed.

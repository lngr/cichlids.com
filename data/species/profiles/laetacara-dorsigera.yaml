      rationale: "The tally retains 4.9 to 7.6. Generator and checker-b propose 5.0 to 7.6, checker-a 5.0\
        \ to 7.5 and checker-c 4.7 to 7.5, within the voting agreement threshold. The agreeing median is 5.0\
        \ to 7.6 after rounding; containment of the decided natural range lowers the minimum to 4.9. Seriously\
        \ Fish recommends 5.0 to 7.5, while Werner reports successful growth and reproduction at pH 7.6. FishProfiles\
        \ gives the wider upper recommendation of 7.8 and FishBase an environmental envelope of 4.0 to 7.5;\
        \ neither establishes long-term success at those additional endpoints. The selected lower boundary\
        \ is a containment rule supported by natural acidity, not a demonstrated injury threshold. The macrophyte\
        \ survey's 4.68 to 7.37 observations remain evidence of habitat chemistry rather than a lifetime aquarium\
        \ experiment. The culture paper's 5.5 to 7.5 recommendation is secondary and has an identification\
        \ caveat."

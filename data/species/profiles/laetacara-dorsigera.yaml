  hybridGroups:
    value:
    - laetacara-curviceps-dorsigera
    confidence: medium
    rationale: "All four primary runs retain laetacara-curviceps-dorsigera. Its curated members already include\
      \ this species and its basis is presumed. Cichlidamerique speculates about mixed ancestry in Asian farm\
      \ stocks, while specialist forum participants warn about mixing dorsigera and curviceps. FishProfiles\
      \ mentions uncertain hybrid identity without verified parents. No reviewed report establishes a verified\
      \ brood with same-species mates available, so the evidence supports a pairwise caution rather than documented\
      \ crossing or a genus-wide group. The CRC article's lack of a cross report is retained as dissenting\
      \ evidence, not evidence that crossing is impossible."

  sexing:
    text: "Juveniles are difficult to sex with confidence. Mature males usually become larger and deeper-bodied\
      \ and can develop longer fin extensions. Females remain smaller, though colour and fin shape overlap\
      \ between sexes. Both parents can show red lower-body colour and both can darken strongly during brood\
      \ care. A dorsal blotch can help with identification but is an unreliable sexing shortcut. Compare mature\
      \ fish and observe their interactions rather than relying on one mark. Pantanal fish with strong blue\
      \ and yellow colour are locality variants, so absence of an intense red belly alone does not identify\
      \ a different species."

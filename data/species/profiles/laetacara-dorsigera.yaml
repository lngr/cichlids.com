    value:
      volumeL: 80
      lengthCm: 60
      depthCm: 35
    confidence: medium
    rationale: "The component medians are 80 litres, 60 cm length and 35 cm depth: generator, checker-b and\
      \ checker-c propose 80/60/35, while checker-a proposes 60/60/30. The Nordic association and Zoopet explicitly\
      \ support 80 litres and 60 cm length; FishFish recommends 80 litres for two fish. A 35 cm depth is a\
      \ practical inferred footprint for cover around one compatible pair, not a published measurement. Diszhal's\
      \ 60-litre pair recommendation is retained as the smaller alternative, and AquaInfo recommends a longer\
      \ 80 cm pair tank. The 60 cm recommendation follows the association rather than taking the largest source\
      \ recommendation as a universal minimum. Werner's 70 by 45 by 45 cm aquarium is an observed setup, while\
      \ the Czech 80 to 100 by about 40 cm recommendation concerns two or three pairs. CRC's 10 US gallon\
      \ setup requires intensive maintenance and develops partner conflict. Add floor space for a community\
      \ or further pairs."

  predation:
    value: 1
    confidence: medium
    rationale: "Five of six votes support level 1: generator, checker-b, checker-c, tiebreaker-1 and tiebreaker-2.\
      \ Checker-a proposes level 0 from diet descriptions without fish. FishProfiles explicitly describes\
      \ consumption of other species' fry and cautions about companions smaller than about 1.5 cm; Maidenhead\
      \ and Cichlid Atlas also require companions too large to swallow. These specific cautions outweigh Aquario's\
      \ general nonpredatory label and absence of fish from Seriously Fish's provisional wild-diet list. The\
      \ two Atlas domains reproduce one account and do not provide independent confirmation. Reports of parents\
      \ consuming their own fry support only brood cannibalism, not proof of attacks on unrelated adults.\
      \ Level 1 captures opportunistic fry and tiny-fish risk; the rubric's 2 cm threshold is not a measured\
      \ prey-size limit."

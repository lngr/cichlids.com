      \ generator's 0 to 4 proposal and does not encompass the 3.8 dKH regional mean or Miranda's roughly\
      \ 6.41 dKH mainstem mean. Upper Parana regional alkalinity converts to 0.03 to 1.4 dKH. These are regional\
      \ analogues rather than a species-wide survey. KH is calculated from alkalinity, not GH, conductivity\
      \ or pH alone; zero denotes an unresolved low endpoint. Confidence remains low and natural KH has no\

  sizeAndGrowth:
    text: "Plan for total lengths of about 8 cm in males and 6 cm in females. The sex-specific aquarium account\
      \ is more useful for this purpose than an unsexed record or a small preserved specimen. Standard length\
      \ excludes the tail and cannot be substituted directly for total length. Young fish grow with varied\
      \ feeding and good water quality, but extra food also raises the maintenance burden. Published hobby\
      \ lifespan estimates span roughly three to eight years; five to eight years is the adopted expectation\
      \ with limited survival data. Newly purchased juveniles therefore need an aquarium chosen for their\
      \ adult pair."

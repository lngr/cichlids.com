        \ rounded agreeing upper-bound median is 11. Linke's native habitat below 1 dKH supplies the dilute\
        \ end. The Czech breeder reports repeated reproduction at 8 dKH, and Werner documents growth and breeding\
        \ at 11 dKH and pH 7.6, supporting a wider interval than the checker-c inference from pH and GH alone.\

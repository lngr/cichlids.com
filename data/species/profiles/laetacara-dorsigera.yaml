  note: "The Catalog of Fishes accepts Laetacara dorsigera (Heckel, 1840) and places the type locality at\
    \ Caceres, formerly Villa Maria, on the Paraguay River in Brazil. The Laetacara query contains the original\
    \ Acara dorsiger entry; the separate Acara query yields no records. Acara dorsigera is a subsequent spelling.\
    \ Other listed historical combinations and spellings come from the retained aquarium references and are\
    \ not claims of separate valid species."

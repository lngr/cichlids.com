    - sand
    rationale: "Generator, checker-b and checker-c propose plants, wood and sand; checker-a also includes\
      \ rock. Macrophyte sampling, the Uruguay wetland record and collecting observations establish planted\
      \ margins and submerged roots or branches over fine substrate. Smooth sand provides a practical aquarium\
      \ substitute for natural mud and supports shallow larval pits. Stones can provide a spawning surface\
      \ but the evidence does not establish a required rocky habitat, so rock is excluded from the decided\
      \ habitat zones while its evidence is retained. Vegetation at several heights matters because collected\
      \ fish also use floating cover."

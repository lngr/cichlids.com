  socialBehavior:
    text: "Keep a compatible adult pair in the minimum aquarium. A juvenile group can produce a pair, but\
      \ surplus adults need additional space or removal once territories develop. Both sexes display and chase\
      \ intruders around eggs and fry. Their dark brood-care colours can be very different from their resting\
      \ appearance. Pair formation does not guarantee lasting harmony: a breeding report describes a male\
      \ excluding his partner after spawning. Plant cover and separate refuges help each fish withdraw. Persistent\
      \ pursuit, loss of condition or exclusion from food calls for separation before the weaker fish is injured."
    sources:
    - kind: literature
      title: Yang (1996). Laetacara dorsigera. Cichlid Room Companion.

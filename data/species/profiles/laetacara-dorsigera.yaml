  problems:
    text: "Repeated hiding or poor feeding can signal social pressure, inadequate shelter or deteriorating\
      \ water quality. Check both members of the pair rather than assuming the bond prevents aggression. A\
      \ coarse sharp substrate can damage the mouth during pit digging, and injured tissue is vulnerable to\
      \ secondary infection. Uneaten food and excess waste undermine a small aquarium quickly. A CRC report\
      \ describes white spot after a transfer, supporting careful quarantine and stable conditions. Plants\
      \ are usually tolerated, although the same report records damage to sword leaves. Very small fry can\
      \ starve when offered particles they cannot swallow despite the parents' attention."

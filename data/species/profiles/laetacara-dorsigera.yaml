  habitat:
    text: "Records place the species in the Paraguay and Parana systems and the upper Madeira drainage, including\
      \ the Guapore. A voucher-backed record also comes from a vegetated Uruguay-basin wetland near Uruguaiana.\
      \ Habitats include macrophyte stands, flooded margins and shallow pools with roots above muddy ground.\
      \ Linke's Trinidad-area collecting site has 29.5 C, pH 6.0 and GH and KH below 1 degree. The Mutum survey\
      \ measures 26 to 27.1 C and a seasonal low-water pH of 4.68; the regional lake system reaches 33.7 C.\
      \ Other northern Pantanal shallows reach 36.2 C and a secondary Corrientes lagoon-edge account reports\
      \ 37.7 C. These heat extremes are brief observations rather than aquarium targets. Natural hardness\
      \ estimates combine dilute collecting water with regional chemistry, so they do not describe every occupied\
      \ locality."
    sources:
    - kind: catalog-of-fishes
      title: "Eschmeyer's Catalog of Fishes: Laetacara"

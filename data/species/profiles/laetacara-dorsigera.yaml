  diet:
    text: "Use a varied diet of small prepared foods together with appropriately sized live or frozen invertebrates.\
      \ Plant or algal ingredients in part of the prepared ration complement the animal foods. Daphnia and\
      \ Artemia are useful options when suitable for the fish's size. The omnivore classification reflects\
      \ mixed feeding advice; measured wild dietary proportions are poorly documented. Feed modest amounts\
      \ and make sure both pair members eat. This species has no supported specialist protein-related bloat\
      \ flag, but poor food quality and overfeeding can cause illness. Its willingness to consume tiny fish\
      \ or fry makes those unsuitable as companions."

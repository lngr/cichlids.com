  compatibility:
    text: "Choose gentle companions too large to swallow and an aquarium that gives them space beyond the\
      \ pair's territory. Adult lemon tetras, black neon tetras and marbled hatchetfish are reasonable planning\
      \ examples within the recommended tetra and hatchetfish groups, subject to their own social and water\
      \ needs. These named combinations are inferred choices rather than published compatibility trials. Bottom-dwelling\
      \ fish can trigger repeated defence near a brood even when otherwise peaceful. Large predators and forceful\
      \ territorial cichlids can overwhelm the acaras. Laetacara curviceps also presents a presumed hybridization\
      \ risk and reports of congener bullying, so it is an unsuitable pairing for this profile."

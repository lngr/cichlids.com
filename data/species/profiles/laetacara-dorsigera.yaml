partners:
  suitable:
  - species: Hyphessobrycon pulchripinnis
    reason: Adult lemon tetras are peaceful midwater companions with overlapping softwater needs.
    condition: A larger community aquarium with a full tetra group and refuge from brood defence.
  - species: Hyphessobrycon herbertaxelrodi
    reason: Adult black neon tetras are generally large enough to avoid opportunistic predation and use open
      midwater.
    condition: Use grown fish in a planted aquarium at about 24 to 26 C.
  - species: Carnegiella strigata
    reason: Adult marbled hatchetfish use the surface and overlap in soft acidic water.
    condition: A covered aquarium with a proper group and space above the pair territory.
  unsuitable:
  - species: Laetacara curviceps
    reason: Presumed crossing risk in the curated group and reports of dorsigera bullying curviceps.
  - species: Astronotus ocellatus
    reason: An adult oscar can swallow or seriously injure this small cichlid.
  - species: Amatitlania nigrofasciata
    reason: Forceful breeding territory defence can overwhelm a redbreast pair in an ordinary community aquarium.
profile:
  overview:
    text: "The redbreast acara is a small South American cichlid suited to a quiet planted aquarium. A compatible\
      \ pair shares parental care and defends a compact area around its offspring. Many adults develop a red\
      \ throat and belly during reproduction, while some Pantanal populations show stronger blue and yellow.\
      \ Population identity and breeding condition explain much of this variation. Adult companions of suitable\
      \ size can share a larger community tank, but fry and very small fish face a risk of being eaten. The\
      \ resemblance to Laetacara curviceps also matters because that pair carries a presumed crossing caution."
    sources:
    - kind: database
      title: "Seriously Fish: Laetacara dorsigera"
      url: "https://www.seriouslyfish.com/species/laetacara-dorsigera/"
      accessed: '2026-10-15'

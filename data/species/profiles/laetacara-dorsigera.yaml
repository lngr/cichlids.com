    confidence: medium
    rationale: "The qualified-majority value is 4.9 to 7.4. Generator proposes 5.5 to 7.5, checker-a 5.0 to\
      \ 7.4, checker-b 6.0 to 7.2, checker-c 4.7 to 7.4, tiebreaker-1 5.0 to 7.4 and tiebreaker-2 4.7 to 7.4.\
      \ The agreeing four votes yield a lower-bound median of 4.85, rounded by the tally to 4.9, and an upper\
      \ bound of 7.4. This is a typical working interval rather than a complete observed envelope: the macrophyte\
      \ survey spans 4.68 to 7.37, including a low-water Mutum reading below the decided minimum. FishBase\
      \ is wider at 4.0 to 7.5, regional tributary means span 5.4 to 7.8 and vegetated Parana measurements\
      \ span 6.1 to 7.9. The latter alkaline endpoint belongs to a connecting stream without a secure species-site\
      \ link. Trinidad pH 6.0 and Corrientes pH 6.5 to 7.2 corroborate the central range. Regional inference\
      \ and seasonal associations limit confidence."

  breeding:
    text: "A pair deposits adhesive eggs on a stone, wood surface or broad leaf and shares care of the clutch.\
      \ Guarding and fanning roles can alternate between the sexes. Depending on temperature, hatching occurs\
      \ after roughly two to three days, followed by a period in shallow pits prepared by the parents. Once\
      \ free-swimming, the fry remain near their parents but are vulnerable to other aquarium fish. Prepare\
      \ very small foods before spawning: some broods need infusoria or other tiny live foods before taking\
      \ Artemia nauplii. Clean water and gentle circulation help fry feeding. A successful spawn in a community\
      \ does not guarantee survival of the brood."
    sources:

    rationale: "The qualified majority retains 20 to 30 C. Generator, checker-b, tiebreaker-1 and tiebreaker-2\
      \ propose 20 to 30 C; checker-a proposes 24 to 30 C and checker-c 26 to 30 C. The Mutum macrophyte survey\
      \ measures 26 to 27.1 C, and Linke's collecting observation near Trinidad is 29.5 C. FishBase gives\
      \ 20 to 23 C, while regional vegetated Parana wetlands span 18 to 31 C across flood stages. These support\
      \ a broad working band rather than restricting the species to the warm sampling season. The decided\
      \ range is narrower than the regional 18 to 31 C and Pantanal 26 to 33.7 C envelopes; regional northern\
      \ Pantanal shallows reach 36.2 C and a secondary Corrientes account reports 37.7 C. Those short-lived\
      \ or unassigned extremes are retained in evidence and habitat prose, not treated as permanent conditions.\
      \ The cool endpoint is supported indirectly, so the tally confidence remains medium."

    tolerance:
      value:
        min: 18
        max: 30
      confidence: medium
      rationale: "The qualified majority retains 18 to 30 C. Generator, checker-a, checker-c, tiebreaker-1\
        \ and tiebreaker-2 propose 18 to 30 C; checker-b proposes 20 to 30 C. AquaInfo explicitly gives 18\
        \ to 30 C and recommends a winter interval of 18 to 20 C. CRC independently reports cool keeping near\
        \ 18.3 C and breeding at 25 to 27.2 C. Seriously Fish and the Nordic association give a narrower 20\
        \ to 28 C, Maidenhead 18 to 26 C and Werner observes growth at 25 to 28 C. FishProfiles separates\
        \ a 25 to 29 C recommendation from 20 to 30 C survival advice that expressly does not guarantee prolonged\
        \ maintenance. FishFish's wider 16 to 28 C and the forum's secondhand 13.9 C observation are retained\
        \ but do not lower the chosen endpoint; spawning advice up to 30 C does not establish lifelong tolerance\
        \ by itself. The tally envelope contains the natural range and accommodates seasonal keeping, while\
        \ evidence for uninterrupted years at 30 C is weaker than for central temperatures."

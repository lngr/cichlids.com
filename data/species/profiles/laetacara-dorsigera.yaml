      \ a mixed tank. A breeding-only aquarium can improve fry survival without making species-only maintenance\
      \ necessary. The cichlids.com archive includes a community report but the epithet-only hits are a stocking\
      \ question and water-quality discussion, not controlled compatibility evidence. The live URLs for those\

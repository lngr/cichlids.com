  husbandry:
    text: "Provide at least 80 litres with about 60 by 35 cm of floor space for one compatible pair, and more\
      \ space for a community. Sand, branching wood and dense plants create sheltered feeding routes and break\
      \ sightlines. Floating cover is useful because these fish also spend time above the bottom. Include\
      \ a few firm surfaces for spawning and a fitted lid because frightened fish can jump. Use effective\
      \ filtration with gentle circulation and regular partial water changes. Soft acidic to neutral water\
      \ and about 23 to 26 C provide a useful starting point. The broader 18 to 30 C tolerance includes seasonal\
      \ practice; evidence for uninterrupted keeping at its warm endpoint is limited. AquaInfo describes cooler\
      \ winter maintenance around 18 to 20 C."

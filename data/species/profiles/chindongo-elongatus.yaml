      localities: [Mbamba Bay (Tanzania), Nkhata Bay (Malawi)]
    confidence: high
    rationale: >-
      Endemic to Lake Malawi, which the Catalog of Fishes, FishBase and Seriously Fish agree on. The
      type locality is Mbamba Bay on the Tanzanian shore, and FishBase places the species between 11
      and 12 degrees south. Seriously Fish adds Nkhata Bay on the Malawian side, from where Ribbink et
      al. (1983) illustrated a fish; Oliver notes that very similar fish are widespread in the lake,
      so under the narrow concept of Seegers (1996) the Nkhata Bay record may belong to a look-alike
      form. Cichlid-Forum gives Likoma Island, which no other source supports. Photographs of males
      from Hongi Island on the Cichlid Room Companion are not used as a locality, because that site
      serves for verification only and no other source names the island.

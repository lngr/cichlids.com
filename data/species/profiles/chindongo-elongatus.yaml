  ghDgh:
    value: {min: 3, max: 5}
    confidence: high
    rationale: >-
      Lake Malawi endemic, so the natural range is the total hardness of the lake computed from
      measured calcium and magnesium (dGH = Ca/7.14 + Mg/4.34): 4.2 to 4.6 dGH in the upper 50 m of
      the north basin (Branchu et al. 2010) and 3.2 to 4.9 dGH from the 1960s titrations in the FAO
      source book. The lake is soft; care sheets that ask for 10 to 25 dGH confuse its alkalinity
      with hardness. All three full profiles proposed this range.
    sources: [*branchu, *fao, *eccles, *vollmer05, *vollmer99, *ngochera]
    evidence:
      - source: *branchu
        value: {min: 4.2, max: 4.6}
        note: computed from Ca and Mg, upper 50 m
      - source: *fao
        value: {min: 3.2, max: 4.9}
        note: computed from Jackson et al. 1963 and Talling and Talling 1965
    verification: {method: waterbody, waterbody: lake-malawi}
    tolerance:
      value: {min: 3, max: 20}
      confidence: medium
      rationale: >-
        Care sheets ask for moderately hard to hard water: Fishipedia 8 to 15, FishBase after an
        aquarium atlas 9 to 19 dH, FishProfiles and Riverpark Aquatics 10 to 20, Seriously Fish 10
        to 25 and TropicalFreshwaterFish 12 to 25 dGH; Cichlid-Forum asks for hard water without a
        figure. The upper bound follows the majority near 20 dGH. The lower bound is the natural lake
        value of 3 dGH, which the tolerance must contain; soft water is no risk as long as the
        carbonate hardness keeps the pH stable. Decided unanimously by the vote count (3 of 3).
      sources: [*fishbase, *sf, *fishprofiles, *fishipedia, *branchu, *riverpark, *tff]
      evidence:
        - source: *fishbase
          value: {min: 9, max: 19}
          note: aquarium figure, given as dH
        - source: *sf
          value: {min: 10, max: 25}
        - source: *fishprofiles
          value: {min: 10, max: 20}
          note: given as dH
        - source: *fishipedia
          value: {min: 8, max: 15}
          note: trade form 'Chewere'
        - source: *riverpark
          value: {min: 10, max: 20}
        - source: *tff
          value: {min: 12, max: 25}
          note: given as dH
      verification:
        method: unanimous
        votes: {agree: 3, total: 3}

  khDkh:
    value: {min: 5, max: 8}
    confidence: high
    rationale: >-
      Lake Malawi endemic, so the natural range is the measured alkalinity of the lake: 2.33 to 2.46
      meq/L in the Branchu et al. (2010) profiles (6.5 to 6.9 dKH) and 2.00 to 2.59 meq/L in Jackson
      et al. (1963) in the FAO source book (5.6 to 7.3 dKH), with dKH = meq/L x 2.8. All three full
      profiles proposed this range.
    sources: [*branchu, *fao, *eccles, *vollmer05, *vollmer99, *ngochera]
    evidence:
      - source: *branchu
        value: {min: 6.5, max: 6.9}
        note: alkalinity profiles, north basin
      - source: *fao
        value: {min: 5.6, max: 7.3}
        note: Jackson et al. 1963
    verification: {method: waterbody, waterbody: lake-malawi}
    tolerance:
      value: {min: 5, max: 14}
      confidence: low
      rationale: >-
        No care sheet for this species gives a carbonate hardness; Seriously Fish, FishBase and the
        other sheets state only pH and total hardness. Practical Fishkeeping asks for high, well
        buffered carbonate hardness for all mbuna and warns against unbuffered soft water, without a
        figure. The lower bound is the natural lake value of 5 dKH. The upper bound rests on general
        mbuna practice, which keeps such tanks at about 8 to 15 dKH, and on the high pH and hardness
        that the care sheets accept. The three votes proposed 15, 12 and 14 dKH as upper bound; they
        agree within 2 dKH, and the vote count took the median, 5 to 14 dKH, unanimously (3 of 3)
        with confidence low, because no species source states the value.
      sources:
        - *branchu
        - *fao
        - &pfk
          kind: literature
          title: "Practical Fishkeeping: The mbuna keeper's survival guide"
          url: https://www.practicalfishkeeping.co.uk/features/the-mbuna-keepers-survival-guide/
          archived: practicalfishkeeping.co.uk/features/the-mbuna-keepers-survival-guide/2026-10-14T095109Z
          accessed: 2026-10-13
        - *sf
        - *fishbase
        - &mkKh
          kind: model-knowledge
          title: General husbandry practice for buffering Lake Malawi mbuna aquaria
      evidence:
        - source: *branchu
          value: {min: 6.5, max: 6.9}
          note: natural lake water in which the species lives
        - source: *fao
          value: {min: 5.6, max: 7.3}
          note: natural lake water, Jackson et al. 1963
        - source: *mkKh
          value: {min: 8, max: 15}
          note: common aquarium target for mbuna, not species-specific
      verification:
        method: unanimous
        votes: {agree: 3, total: 3}

  maxSizeCm:
    value: {male: 12, female: 10}
    confidence: medium
    rationale: >-
      Wild fish are small: FishBase gives 9.5 cm standard length, and Aquarium Glaser notes that
      Chindongo barely exceed 8 cm in the lake but grow about half as large again in the tank.
      Aquarium sources give 12 cm (FishProfiles, Aqualog, Riverpark Aquatics) to 12.7 cm
      (Cichlid-Forum) for adults; Seriously Fish lists 135 mm standard length and
      TropicalFreshwaterFish 13.5 cm for males, which are top values. TropicalFreshwaterFish gives 10
      cm for females, and males grow larger than females. 12 cm for males is the typical maximum of
      well-kept aquarium fish.
    sources: [*fishbase, *sf, *fishprofiles, *cforum, *aqualog, *riverpark, *tff, *glaser, *fishipedia]
    evidence:

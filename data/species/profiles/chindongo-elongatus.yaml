  diet:
    value:
      type: aufwuchs
      bloatSensitive: true
      foods: [spirulina flakes and pellets, algae, blanched spinach and peas, nori, small amounts of frozen crustaceans]
    confidence: high
    rationale: >-
      FishBase describes a grazer that combs loose algae from the rock cover, and Genner and Turner
      (2005) place comb-feeding mbuna of this type among the algae grazers; the Cichlid Room
      Companion confirms the feeding type. Seriously Fish wants vegetable matter to form a large
      part of the diet and warns against red meat, FishProfiles links protein-rich feeding to the
      often fatal Malawi bloat, and Practical Fishkeeping names rich food as the main trigger of
      bloat in mbuna. Cichlid-Forum and Aqualog list the species as omnivore, a coarse label that
      reflects what it accepts in the tank, not its natural diet. Decided unanimously by the vote
      count (3 of 3 on type and bloat sensitivity).
    sources:
      - *fishbase
      - *sf
      - *fishprofiles
      - *pfk
      - *genner
      - *crc
      - *cforum
      - *aqualog
      - *glaser
    evidence:
      - source: *fishbase
        value: {type: aufwuchs}
        note: combs loose algae from the biocover; no statement on bloat
      - source: *sf

  ph:
    value: {min: 7.7, max: 8.6}
    confidence: high
    rationale: >-
      Lake Malawi endemic, so the natural range is the measured pH of the lake. Jackson et al. (1963)
      in the FAO source book give 7.7 to 8.6 for surface water; Branchu et al. (2010) give 7.5 to 8.5
      for the whole column of the north basin near the type locality, the lower values belonging to
      deep water that this shallow-water mbuna does not use. All three full profiles proposed this
      range.
    sources: [*fao, *branchu, *eccles, *vollmer05, *vollmer99, *ngochera]
    evidence:
      - source: *fao
        value: {min: 7.7, max: 8.6}
        note: surface water, Jackson et al. 1963
      - source: *branchu
        value: {min: 7.5, max: 8.5}
        note: whole water column, lower values at depth
    verification: {method: waterbody, waterbody: lake-malawi}
    tolerance:
      value: {min: 7.5, max: 8.8}
      confidence: medium
      rationale: >-
        Husbandry sources agree on alkaline water: Seriously Fish 7.6 to 8.8, Cichlid-Forum 7.8 to
        8.6, FishProfiles 8.0 to 8.5, Fishipedia and Riverpark Aquatics 7.5 to 8.5, FishBase after an
        aquarium atlas 7.5 to 8.0, and Aquarium Glaser asks for a pH above 8. Aqualog goes down to
        7.0 and TropicalFreshwaterFish up to 9.0, each alone. The range 7.5 to 8.8 covers the bulk
        of the sources and contains the lake range. Decided unanimously by the vote count (3 of 3).

  predation:
    value: 0
    confidence: medium
    rationale: >-
      An aufwuchs grazer that combs loose algae from the rock cover (FishBase); FishProfiles adds the
      small invertebrates living in the algal mats, and Genner and Turner (2005) describe mbuna of
      this type as feeding mainly on algae and small invertebrates. The Cichlid Room Companion
      confirms the algae-pulling habit. No source reports fish in the diet; like all mbuna it may
      take fry that drift past, which level 0 allows. Decided unanimously by the vote count (3 of
      3).

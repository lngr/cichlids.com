        - {by: checker-b, value: [Mbamba Bay (type locality), Nkata Bay, Hongi Island]}
      decision: [Mbamba Bay (Tanzania), Nkhata Bay (Malawi)]
      rationale: >-
        Mbamba Bay rests on the Catalog of Fishes and Nkhata Bay on Seriously Fish. Hongi Island rests
        only on photographs in the Cichlid Room Companion, which serves for verification and is never
        the origin of a value, and no other source names it; the island is therefore left out, and
        the Hongi Island variant of the generator as well.
    - field: features.khDkh.tolerance
      proposals:
        - {by: generator, value: {min: 5, max: 15}}
        - {by: checker-a, value: {min: 5, max: 12}}
        - {by: checker-b, value: {min: 5, max: 14}}
      decision: {min: 5, max: 14}
      rationale: Decided by the vote count (unanimous, 3 of 3 within 2 dKH, confidence low); the median of the agreeing upper bounds is 14 dKH. No species source states a carbonate hardness.
    - field: features.diet.value.foods
      proposals:
        - {by: generator, value: [spirulina flakes and pellets, algae, blanched spinach and peas, nori, small amounts of frozen crustaceans]}
        - {by: checker-a, value: [algae and aufwuchs, spirulina flakes and other vegetable foods, small invertebrates from the algal cover]}
        - {by: checker-b, value: [algae, spirulina, blanched spinach, nori, small live and frozen food]}
      decision: [spirulina flakes and pellets, algae, blanched spinach and peas, nori, small amounts of frozen crustaceans]
      rationale: >-
        The diet is decided by the vote count (unanimous on type aufwuchs and bloatSensitive true),
        which takes the food list of the top candidate. It names the plant-based staples that all
        proposals share and limits animal food to small amounts, as Seriously Fish and FishProfiles
        advise.
    - field: features.hybridGroups.value
      proposals:
        - {by: generator, value: [chindongo-elongatus-complex]}
        - {by: checker-a, value: [chindongo]}
        - {by: checker-b, value: []}
        - {by: tiebreaker-1, value: [chindongo-elongatus-complex]}
        - {by: tiebreaker-2, value: []}
      decision: [chindongo-elongatus-complex]
      rationale: >-
        Decided by the vote count as the conservative value (2 of 5, no qualified majority,
        confidence low): the most common named group. The group rests on the crossing warnings of
        Seriously Fish for the elongatus forms and for C. flavus and on the close relationship
        shown by Seegers (1996) and Li et al. (2016), not on a documented cross; the null votes
        rightly note that no paper reports one. The genus-wide group of checker-a lacks any source
        for crosses with the deeper-bodied Chindongo. The group is added to the curated list with
        C. elongatus, C. longior and C. flavus.
    - field: features.maxSizeCm.value
      proposals:
        - {by: generator, value: {male: 12, female: 10}}
        - {by: checker-a, value: {male: 12, female: 10}}
        - {by: checker-b, value: {male: 13, female: 10}}
      decision: {male: 12, female: 10}
      rationale: >-
        The feature is the typical maximum of well-kept aquarium fish, not a top value. FishProfiles,
        Aqualog and Riverpark Aquatics give 12 cm and Cichlid-Forum 12.7 cm; only Seriously Fish and
        TropicalFreshwaterFish reach 13.5 cm, so 13 cm describes the upper tail.
    - field: features.territory.value
      proposals:
        - {by: generator, value: {size: small, breedingOnly: false}}
        - {by: checker-a, value: {size: small, breedingOnly: false}}
        - {by: checker-b, value: {size: large, breedingOnly: false}}
      decision: {size: small, breedingOnly: false}
      rationale: >-
        The defended area is a rock pile around a cave or spawning site and, in the wild, a small
        algae garden (Seriously Fish, FishBase), which is the small level of the rubric. The large
        territorial demands that FishProfiles reports describe pressure on tankmates, which the
        aggression levels 4 and 3 already capture.
    - field: features.social.value
      proposals:
        - {by: generator, value: {structure: harem, ratio: 4}}
        - {by: checker-a, value: {structure: harem, ratio: 4}}
        - {by: checker-b, value: {structure: harem, ratio: 5}}
      decision: {structure: harem, ratio: 4}
      rationale: >-
        Seriously Fish asks for four to six females, TropicalFreshwaterFish and Guidarium for at
        least four; four is the lowest ratio that all stronger recommendations accept and matches
        the minimum tank.
    - field: features.minTank.value
      proposals:
        - {by: generator, value: {volumeL: 200, lengthCm: 120, depthCm: 40}}
        - {by: checker-a, value: {volumeL: 240, lengthCm: 120, depthCm: 45}}
        - {by: checker-b, value: {volumeL: 250, lengthCm: 120, depthCm: 50}}
      decision: {volumeL: 240, lengthCm: 120, depthCm: 45}
      rationale: >-
        All proposals agree on 120 cm length. The sources range from 137 L (Seriously Fish) through
        200 L (Guidarium) to 300 L (Fishipedia); a standard 120 cm tank of about 240 L with 45 cm
        depth is the middle value and gives the aggressive male and four females room and rockwork.
    - field: features.lifespanYears.value
      proposals:
        - {by: generator, value: {min: 5, max: 8}}
        - {by: checker-a, value: {min: 6, max: 10}}
        - {by: checker-b, value: {min: 5, max: 8}}
      decision: {min: 5, max: 8}
      rationale: >-
        Riverpark Aquatics gives 5 to 8 years and Fishipedia 7 years; the upper bound of 10 years
        rested on model knowledge alone.
    - field: features.beginnerSuitability.value
      proposals:
        - {by: generator, value: moderate}
        - {by: checker-a, value: demanding}
        - {by: checker-b, value: moderate}
      decision: demanding
      rationale: >-
        Seriously Fish advises against the species for beginners and FishProfiles reserves it for
        experienced keepers; the easy ratings of Aquarium Glaser and the Cichlid Room Companion
        concern water and food only. Conspecific aggression at level 4 requires experience by its
        rubric definition, and the catalog rates the other level 4 species demanding, so the
        cautious rating keeps the features consistent.

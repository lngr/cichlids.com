    - name: Pseudotropheus elongatus Fryer, 1956
      note: Original combination; type locality Mbamba Bay, eastern shore of Lake Malawi, Tanzania. Valid in Pseudotropheus until Li, Konings and Stauffer (2016) transferred it to Chindongo; hobby literature and Seriously Fish use this name.
  legacyNames:
    - Pseudotropheus elongatus
  note: >-
    The Catalog of Fishes lists Pseudotropheus elongatus Fryer 1956 with the current status valid
    as Chindongo elongatus (Fryer 1956) after Li et al. (2016); the species list of Pseudotropheus
    no longer contains it. The lectotype from Mbamba Bay was designated by Seegers (1996), who
    redescribed the species in a narrow sense: a comparatively short, deep-bodied member of the
    elongatus complex with a convex forehead whose territorial males show 7 to 8 blue bars on a
    dark brown to blackish ground. In the same work Seegers described the slenderer C. longior,
    which lives beside C. elongatus at Mbamba Bay. Li, Konings and Stauffer (2016) split the old
    Pseudotropheus elongatus species group: they erected Chindongo for its barred core (type
    species C. bellicosus, eleven valid species today) and placed six further elongate species in
    Metriaclima, Tropheops and Cynotilapia. The hobby name elongatus therefore covers far more than
    this species: Seriously Fish counts more than thirty forms, many trade fish with locality names
    such as 'Chewere', 'Chailosi' or 'Mpanga' belong to other described or undescribed species, and
    care data published under the name may refer to them.

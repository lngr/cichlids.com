partners:
  suitable:
    - species: Labidochromis caeruleus
      reason: Yellow, unbarred rock dweller with a plant-rich diet; its colour and shape do not trigger rival fights.
      condition: Crowded mbuna tank of at least 150 cm with dense rockwork.
    - species: Labeotropheus trewavasae
      reason: Robust aufwuchs grazer of similar size that holds its own against an aggressive mbuna and shares the low-protein diet.
      condition: Tank of at least 150 cm; avoid strongly blue-barred males.
    - species: Iodotropheus sprengerae
      reason: Rust-brown, unbarred grazer that looks nothing like C. elongatus and eats the same food.
      condition: Plenty of caves to retreat into, since it is the weaker fish.
    - species: Synodontis multipunctatus
      reason: Bottom-dwelling catfish that lives in the same alkaline, well-buffered water and is ignored by mbuna.
  unsuitable:
    - species: Chindongo longior
      reason: Very similar slender species from the same bay; member of the same hybrid group and attacked as a rival.
    - species: Chindongo flavus
      reason: Member of the same hybrid group; the hobby warns that it interbreeds with the elongatus complex and that the males clash heavily.
    - species: Chindongo saulosi
      reason: Males share the blue-barred pattern, so the look-alike fish are attacked as rivals.
    - species: Maylandia zebra
      reason: Blue males with dark bars resemble C. elongatus males and provoke constant fights.
    - species: Aulonocara jacobfreibergi
      reason: Peaceful peacock that is harassed by mbuna aggression and needs more animal protein than C. elongatus tolerates.
    - species: Copadichromis borleyi
      reason: Calm open-water utaka that cannot cope with the persistent attacks of this mbuna.
    - species: Paracheirodon innesi
      reason: Small soft-water tetra; wrong water chemistry and easily hunted or stressed by mbuna.
profile:
  overview:
    text: >-
      Chindongo elongatus is a slim mbuna from the rocky shores of Lake Malawi and one of the
      fiercest of the group. Adult males are striking: a dark brown to black body crossed by
      seven or eight bright blue bars. In the hobby the name elongatus has long been used for
      dozens of slender, barred mbuna. Science has since split that collection into several
      genera and species, and many forms sold as elongatus are undescribed relatives rather
      than this species. The true C. elongatus comes from Mbamba Bay on the Tanzanian shore.
      In the tank it is a lively, colourful grazer that stays small, but its temper shapes
      everything else: it needs a harem, lots of rock and tankmates that can stand up to it.
      Kept that way it is a rewarding fish for keepers who already have experience with mbuna.
    sources: [*cof, *li2016, *seegers, *sf]
  habitat:
    text: >-
      The species is endemic to Lake Malawi. Its type locality is Mbamba Bay in Tanzania, and
      FishBase places it between 11 and 12 degrees south; reports from Nkhata Bay on the Malawian
      side are linked to it, though the exact range under the modern narrow concept is not settled.
      It lives in shallow water over rocks, often around smaller stones where little sediment
      settles, and grazes the algae film that covers them. Lake Malawi water is warm (about 21 to
      29 C), soft in total hardness (3 to 5 dGH) and moderately alkaline (pH 7.7 to 8.6, 5 to 8
      dKH). FishBase lists the species as Near Threatened in the IUCN assessment of 2018.
    sources: [*fishbase, *sf, *branchu, *fao, *oliver]
  sizeAndGrowth:
    text: >-
      Wild fish are small: museum specimens reach about 9.5 cm standard length, and many adults
      in the lake stay near 8 cm. In aquariums with regular feeding they grow larger. Males
      usually reach about 12 cm in total length, and occasional fish approach 13 to 14 cm.
      Females stay smaller at about 10 cm. Overfeeding to push growth is a mistake with this
      grazer, because rich food harms its gut long before it adds useful size. A lifespan of five
      to eight years is typical in good conditions.
    sources: [*fishbase, *sf, *tff, *glaser, *riverpark]
  husbandry:
    text: >-
      Plan at least 120 cm of front length and about 240 litres for one male and four females;
      a longer tank makes life easier for every fish. Build tall piles of rock with many caves
      and gaps that break the line of sight, and leave a strip of open water above them. Sand
      is a good substrate, and algae on the stones should be left as a natural snack. Stable,
      alkaline water matters more than exact numbers: keep the pH between about 7.5 and 8.5,
      the temperature between 24 and 27 C and the carbonate hardness high enough to hold the pH
      steady. Strong filtration and large weekly water changes are needed, because a crowded
      mbuna tank produces a lot of waste. Plants are usually eaten or dug out.
    sources: [*sf, *pfk, *guidarium]
  socialBehavior:
    text: >-
      The dominant male claims a rock pile and chases everything that looks like a rival. Other
      males are attacked without pause, and in an ordinary tank a weaker male is often killed,
      so keep only one male unless the tank is very large and densely decorated. He also drives
      females hard; with fewer than four females per male a single female can be harassed to
      death. In the wild, females guard their own small algae patches. In the tank, a crowded
      mixed mbuna community or a harem of one male with four to six females spreads the
      aggression best. Some keepers prefer a large group of ten or more young fish raised
      together. Watch for torn fins and fish hiding at the surface, which signal that the
      balance has tipped.
    sources: [*sf, *tff, *fishprofiles, *glaser, *t45417]
  diet:
    text: >-
      In the lake this mbuna combs loose algae and the small animals living in it from the rock
      surface. In the tank the base of the diet should be a quality spirulina or vegetable flake
      or small pellet with low protein. Blanched spinach, peas, nori and courgette are good
      additions, and natural algae growth on the decoration keeps the fish busy. Frozen
      crustaceans such as mysis or daphnia are fine as an occasional treat. Avoid beef heart,
      other meat-based foods and high-protein pellets made for predatory cichlids. Feed small
      portions once or twice a day and allow a fasting day each week; this mbuna will eat until
      nothing is left, which makes overfeeding easy.
    sources: [*fishbase, *sf, *fishprofiles, *pfk]
  breeding:
    text: >-
      C. elongatus is a maternal mouthbrooder. The male cleans a flat stone or a patch of sand
      near his cave and courts passing females with intense colours. The female lays a few eggs
      at a time and takes them into her mouth; when she nibbles at the yellow egg spots on the
      male's anal fin, the eggs are fertilised. Clutches are small, up to about 37 eggs. She
      carries them for three to four weeks without eating, then releases fully formed fry that
      take brine shrimp nauplii and crushed flake right away. Because the male rarely leaves a
      holding female alone, many breeders move her to a separate tank shortly before release.
      Stable water around pH 8.2 suits breeding.
    sources: [*sf, *fishbase, *fishprofiles, *tff]
  sexing:
    text: >-
      Adult males are easy to recognise. They are larger and show a dark brown to black body
      with seven or eight broad blue bars, blue bands across the forehead, black pelvic fins
      with a white front edge and a black anal fin carrying one to several yellow egg spots.
      Females and young fish are greyish brown with fainter bars and duller or missing egg
      spots. Subordinate males can stay in this drab dress for a long time, so a dull fish is
      not always a female; venting gives a reliable answer in grown fish. Colour also varies
      between populations, which is one more reason to buy fish with a known collection site.
    sources: [*oliver, *cforum, *sf]
  compatibility:
    text: >-
      Good company are other robust mbuna of similar size that look clearly different, such as
      the yellow Labidochromis caeruleus, orange forms of Labeotropheus or the rusty
      Iodotropheus sprengerae, plus hardy catfish such as Synodontis multipunctatus. Never keep it
      with C. longior or C. flavus, or with other fish sold as elongatus: the hobby warns that the
      forms of this complex interbreed, and the males fight hard. Other fish with blue bodies and
      dark bars, for example Maylandia zebra or C. saulosi, are attacked as rivals. Calm haps such
      as peacocks (Aulonocara) and utaka (Copadichromis) suffer under the constant pressure and
      also need richer food. Small soft-water community fish do not suit the water or the
      temperament. Stocking the tank densely with young fish of similar size helps to share out
      aggression.
    sources: [*sf, *sfflavus, *pfk, *tff]
  problems:
    text: >-
      The most common mistake is too much protein. Mbuna fed meaty or rich food often develop
      Malawi bloat: the belly swells and feels firm, the fish stops eating and the eyes may
      bulge, and the disease often ends in death. A plant-based diet, small portions and good
      water quality are the best protection. The second big risk is aggression: one male too
      many, too few females or too little rock leads to injured or killed fish. Torn fins and
      wounds then invite bacterial and fungal infections. Mixing several elongatus forms produces
      hybrids that should never be passed on. Fish bought under a trade name may not be this
      species at all, so ask for the collection site. Soft, unbuffered water lets the pH drop,
      which stresses the fish.
    sources:
      - *pfk
      - *fishprofiles
      - *sf
      - kind: archive
        title: cichlids.com forum thread 20566
        url: https://www.cichlids.com/disc/read.php?2,20566
        accessed: 2026-10-13

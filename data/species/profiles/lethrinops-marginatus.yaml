  compatibility:
    text: "A peaceful Malawi community is possible if companions leave the group enough feeding space and do
      not dominate it. Calm Copadichromis, some Placidochromis and carefully chosen Aulonocara are
      possibilities rather than guaranteed combinations. Increase space for any additional social units.
      Assertive mbuna and much larger fish predators are poor choices. Malawi-Guru instead favors
      exclusive species keeping, which remains a useful option when competition cannot be controlled.
      Mixing Lethrinops also raises a separate presumed hybrid concern: the Nordic association warns
      about congeners, but no identified pair with demonstrated free choice of mates is documented in
      this evidence set. That caution does not imply that every pair in the genus has been tested."

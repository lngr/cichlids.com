  diet:
    text: "Small invertebrates provide the main natural food, including crustaceans and insect larvae found
      in sediment. Offer small sinking prepared foods with varied suitably sized frozen invertebrates so
      feeding remains accessible at the sand surface. Distribute modest portions and check the quieter
      fish rather than judging the meal by the boldest male. Its animal-prey diet supports invertivore,
      even though one care database uses an animal-biased omnivore label. It is not assigned special
      high-protein bloat sensitivity on the available evidence. That flag does not protect it from poor
      nutrition, stress or deteriorating water. Directed fish hunting is unreported; incidental loss of
      tiny fry remains possible under predation level 0."

  breeding:
    text: "The female holds the developing brood in her mouth, while the male uses a display site and may
      mate with several females. Public CRC information and independent husbandry accounts agree on
      maternal mouthbrooding. The Nordic association reports about three weeks of incubation and
      approximately 30 to 40 young, but temperature and the individual female can affect the outcome. No
      lasting male-female pair bond should be assumed. Quiet resting space for brooding females is useful
      in a colony. The presumed Lethrinops hybrid group comes from general aquarium warnings, with no
      named free-choice cross established by the sources reviewed here."

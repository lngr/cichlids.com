    tolerance:
      value:
        min: 21
        max: 29
      confidence: medium
      rationale: "The tally decides 21 to 29 C with unanimous agreement within the 1 C comparison threshold,
        not exact endpoint identity. Generator, checker-a and checker-b proposed 21 to 29 C; checker-c
        proposed the wider 20 to 30 C. The Nordic species register and Fishipedia recommend 23 to 28 C,
        OATA gives 23 to 27 C for Malawi cichlids, and the congener retailer gives 23 to 29 C. The
        decided envelope includes the full natural range without adopting the unsupported extra margin in
        checker-c. It is a practical keeping envelope, not a demonstrated injury threshold or a
        recommendation to maintain either extreme continuously; the better-supported routine target is
        about 24 to 26 C. No source demonstrates multi-year outcomes at every endpoint."

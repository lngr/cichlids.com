  sexing:
    text: "Size and breeding color become more useful once the fish mature. Males are generally larger and
      develop stronger iridescence, whereas females remain comparatively subdued. Blue-green body color
      and variable pale or warm fin margins can depend on locality and breeding condition, so a trade
      name or a momentary color state is insufficient for certain identification. Immature fish and
      females of related Lethrinops can be difficult to distinguish. The evidence does not establish a
      dependable juvenile color rule or a precise sex-specific maximum for females."

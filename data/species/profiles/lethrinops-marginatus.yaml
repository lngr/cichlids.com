  maxSizeCm:
    value:
      male: 14
      female: 11
    confidence: low
    rationale: "Generator proposed 13/11 cm, checker-a 13.5/11, checker-b 14/12 and checker-c 14/11 for
      male/female. Their medians are 13.75/11 cm; the male value is rounded to 14 after checking the
      sources. FishBase gives 11 cm standard length without a separate female measurement; its synonym
      page gives 13.5 cm total length. The Nordic register gives 13 cm and Malawi.si up to 14 cm.
      Einrichtungsbeispiele gives a larger 15/12 cm, while Fishipedia lists a smaller 11 cm maximum. For
      typical aquarium adults the 14 cm male estimate follows the specialist total-length reports; female
      11 cm is the proposal median and remains an estimate, not a directly established sex-specific
      limit. Standard length excludes the tail and must not be treated as the same measurement as total
      length."

    tolerance:
      value:
        min: 3
        max: 15
      confidence: low
      rationale: "The qualified-majority tally decides 3 to 15 dGH with low confidence. Generator proposed 3 to
        12, checker-a 3 to 18, and checker-b, checker-c, tiebreaker-1 and tiebreaker-2 each proposed 3 to
        15. Einrichtungsbeispiele gives species-specific aquarium advice of 5 to 15 dGH and Aquarist
        Atlas gives 8 to 15; extending their lower bounds to 3 includes measured natural water. A
        marginatus aquarium was reported at 11 dGH and a separate keeper at 8 dGH, but neither point
        defines a long-term limit. The decided upper bound is narrower than OATA's general Malawi range
        of 12 to 18 dGH and the congener albus table of 10 to 25 dGH, whose prose instead says 15 to 20.
        These broader and partly inconsistent general or congener recommendations do not establish a
        marginatus requirement beyond 15. Fishipedia's 8 to 15 and Atlas's separate 6 to 12 habitat
        claims are retained but do not replace lake measurements. This remains a practical envelope
        rather than a measured physiological tolerance."

  ghDgh:
    value:
      min: 3
      max: 5
    confidence: high
    rationale: "The settled natural range is 3 to 5 dGH. Calcium and magnesium measurements compiled by FAO
      convert to about 3.2 to 4.9 dGH; Branchu upper-water measurements convert to about 4.2 to 4.6 dGH.
      Rounding and combining these lake observations supports the natural envelope. Fishipedia gives 8 to
      15 dGH and Aquarist Atlas separately gives 6 to 12 dGH as lake hardness, but neither outweighs the
      measured ion concentrations. The inherited whole-envelope entries are synthesis interpretations;
      the measured subranges remain explicit. Alkaline pH does not mean high calcium and magnesium
      hardness."
    sources:
      - kind: literature
        title: "Branchu, P., Bergonzini, L., Ambrosi, J.-P., Cardinal, D., Delalande, M., Pons-Branchu, E. et al.

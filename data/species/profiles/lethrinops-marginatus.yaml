  hybridGroups:
    value:
      - lethrinops
    confidence: low
    rationale: "The tally uses the conservative rule and low confidence for lethrinops, with three
      supporting votes out of six and no qualified majority. Generator, checker-a and checker-c proposed
      an empty list; checker-b, tiebreaker-1 and tiebreaker-2 proposed lethrinops. The rule
      retains a group supported by at least two votes. The Nordic cichlid association explicitly warns
      about crosses when marginatus shares a tank with other Lethrinops; Aquarist Atlas gives a similar
      genus warning and Fishipedia adds a generic congener precaution. Under the rubric these warnings
      justify a presumed group despite the absence of a named-pair crossing report. The Catalog of Fishes
      supplies 25 valid described genus members, not crossing evidence. Turner distinguishes
      shallow-water and deep-water lineages, so the broad group is a precaution under current
      nomenclature rather than proof of equal crossability across the genus. The archive thread under
      oculatus contains only a request for information. No documented free-choice cross was found."

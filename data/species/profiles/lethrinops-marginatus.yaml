  habitat:
    text: "Sheltered sandy bays provide feeding ground and spawning space. Stones and flat rock occur nearby,
      and some reported locations have aquatic vegetation. Open sand remains the common feature; neither
      caves nor dense planting define this fish's habitat. Specialist sources report shallow-water
      populations, with Malawi-Guru giving approximately 7 to 15 m. Lake studies support the natural
      envelope of 21 to 29 C, pH 7.7 to 8.6, GH 3 to 5 dGH and KH 5 to 8 dKH. These are regional and
      seasonal lake conditions rather than a prescription to fluctuate an aquarium between extremes.
      Malawi water has modest calcium and magnesium hardness despite its alkaline pH and appreciable
      buffering."

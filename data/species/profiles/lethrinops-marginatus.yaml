  husbandry:
    text: "Provide at least 400 L with a usable footprint about 150 cm long and 50 cm front to back for the
      recommended group of eight adults. Keep much of that floor as fine sand and place stable stones
      along edges to interrupt sight lines without dividing the feeding area into narrow corridors.
      Sparse plants are optional. Routine care around 24 to 26 C sits within the species-specific
      aquarium recommendations. The practical tolerance decisions are 21 to 29 C, pH 7.5 to 8.6, GH 3 to
      15 dGH and KH 5 to 15 dKH; their endpoints are uncertain keeping allowances rather than
      experimentally demonstrated health limits. Stable chemistry, effective biological filtration and
      regular waste removal matter more than pursuing the outer limits. A reported marginatus aquarium at
      KH 4 is retained as evidence, although the tally keeps 5 as the lower planning bound."

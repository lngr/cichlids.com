      reason: A possible calm midwater-oriented companion under the specialist recommendation permitting
        peaceful Malawi haps.
      condition: A spacious aquarium with protected sand-feeding access; individual aggression must be assessed.
    - species: Placidochromis electra
      reason: A possible similarly sized Malawi companion when it remains calm and does not monopolize food.
      condition: Allow space beyond the minimum for the marginatus group and monitor feeding competition.
    - species: Aulonocara stuartgranti
      reason: Compatible water and size can permit a calm individual or carefully managed group.
      condition: Avoid dominant males that displace marginatus from the sand or feeding area.
  unsuitable:
    - species: Melanochromis auratus
      reason: Persistent mbuna aggression can suppress this quiet sand feeder.
    - species: Nimbochromis livingstonii
      reason: Its much larger predatory adult size makes smaller marginatus vulnerable.
    - species: Maylandia zebra
      reason: Assertive rock-territorial behavior and rapid feeding are poor matches for quiet sand sifters.
    - species: Other Lethrinops species
      reason: A presumed genus-level hybrid precaution is supported by specialist husbandry warnings; no
        particular free-choice cross is documented here.
profile:
  overview:
    text: "A sand bed is central to keeping Lethrinops marginatus. This Lake Malawi cichlid searches sediment
      for small animal prey and is usually calmer than the familiar rock-dwelling mbuna. Displaying males
      develop brighter color than females, and a settled group can spend much of its time feeding across
      the bottom. Its rounded head gives rise to one of its common trade names. The older catalog entry
      Lethrinops oculatus refers to the same accepted species. A dedicated aquarium is a reasonable
      option, while carefully chosen peaceful Malawi companions are possible. Published advice differs
      over colony size and aquarium dimensions, so the requirements here refer to a group rather than a
      single display fish."
    sources:

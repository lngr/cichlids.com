  socialBehavior:
    text: "Treat it as a group fish with a mating system involving several partners. Eight adults is a
      provisional minimum rather than a published biological threshold, and a female-heavy group spreads
      male attention. Advice ranges from one male with several females to larger colonies. Males may
      display from a flat stone or a cleared sand site, and neighboring spawning males can contest those
      sites. This local breeding behavior does not make the species generally aggressive. Give
      subordinate fish room to move away and check that all animals reach food. A larger colony or
      several active males can need more room than the stated minimum."

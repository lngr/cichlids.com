  sizeAndGrowth:
    text: "Plan for adult males around 14 cm total length and females around 11 cm, with uncertainty greatest
      for the female figure. FishBase's 11 cm record measures standard length, excluding the tail; its
      older oculatus account lists 13.5 cm total length. Specialist aquarium sources give 13 to 14 cm,
      while another care account gives 15 cm males and 12 cm females. These differences do not justify
      treating every fish as a 15 cm adult. Growth has not been quantified here. A lifespan estimate of
      roughly 6.5 to 10 years is provisional: the ten-year care-sheet figure lacks a documented series of
      captive ages."

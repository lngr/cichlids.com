  social:
    value:
      structure: group
      minGroup: 8
    confidence: low
    rationale: "Generator proposed a group of at least eight, checker-a a harem with four females per male,
      checker-b a harem with three females per male, and checker-c a group of at least six. CRC reports
      polygynandrous mating, which describes reproduction rather than exclusive harem residence.
      Malawi.si recommends larger groups and Malawi-Guru proposes a 12-fish colony with five males and
      seven females; an aquarium account houses ten. Choose group housing with eight as a provisional
      practical minimum between the six- and eight-fish proposals and the larger source examples, with
      more females than males. Eight is not a published threshold; smaller one-male harems are
      alternative advice in Fishipedia and Aquarist Atlas, not evidence for a pair bond."

  problems:
    text: "Missed meals, persistent hiding and repeated displacement deserve attention in this otherwise
      quiet species. Aggressive companions can prevent access to food even when water chemistry is
      suitable. Coarse gravel interferes with the normal sifting method and may damage the mouth or
      gills; fine sand and accessible open floor are safer husbandry choices. Breeding males still need
      escape routes and visual breaks for other fish. Avoid interpreting a broad water-tolerance range as
      evidence that sudden changes are harmless. The GH and especially KH limits rely on mixed
      recommendations and sparse observations, while long-term endpoint trials are unavailable. No
      disease diagnosis can be made from withdrawal or reduced appetite alone."

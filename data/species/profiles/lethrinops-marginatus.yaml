  khDkh:
    value:
      min: 5
      max: 8
    confidence: high
    rationale: "The settled natural range is 5 to 8 dKH. The FAO compilation gives alkalinity of 2.00 to 2.59
      meq/L, about 5.6 to 7.3 dKH. Branchu reports about 2.33 to 2.46 meq/L, about 6.5 to 6.9 dKH. Their
      rounded regional envelope explains the adopted range. This is alkalinity expressed as dKH and is
      separate from calcium and magnesium hardness; sodium-associated bicarbonate allows it to exceed GH.
      No verification object is attached to the natural KH fact."

    tolerance:
      value:
        min: 5
        max: 15
      confidence: low
      rationale: "The qualified-majority tally decides 5 to 15 dKH with low confidence and four agreeing votes
        within the 2 dKH comparison threshold. Generator and checker-c proposed 5 to 12, checker-a and
        checker-b 5 to 15, and tiebreaker-1 and tiebreaker-2 4 to 15. The matched wider-upper proposals
        have a median lower endpoint of 4.5, rounded by the tally to 5; the decision is retained exactly.
        It is narrower at the lower end than the 4 to 15 tiebreaker proposals and excludes a specialist
        aquarium observation at KH 4 with ten marginatus. That observation remains evidence and does not
        demonstrate harm below 5 or multi-year health at 4. OATA advises 10 to 15 dKH for Malawi
        cichlids, a Red Cap retailer also gives 10 to 15, an unidentified Senga Bay retailer gives KH 10,
        and the congener albus sheet gives 5 to 12. These support only a provisional buffering allowance,
        not a measured marginatus upper threshold. No species-specific long-term KH experiment was found;
        pH and GH advice cannot be converted into a fixed KH requirement. The natural 5 to 8 dKH range
        remains contained."

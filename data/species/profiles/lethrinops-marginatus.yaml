  temperatureC:
    value:
      min: 21
      max: 29
    confidence: high
    rationale: "The settled lake decision is 21 to 29 C. Lake Malawi seasonal and nearshore measurements are
      the natural baseline for this endemic sand dweller. FAO compiles a narrower surface range of 23 to
      25 C; Vollmer describes summer surface water near 28 C and winter water below 24 C. Eccles and the
      later monitoring synthesis provide the wider seasonal context. Earlier evidence entries sometimes
      assign the entire compiled lake envelope to one study; those inherited interpretations are retained
      separately from the directly reported measurements. The lake limits describe habitat variation
      rather than an aquarium thermostat target. The Eccles full text is not open access and its DOI page
      is blocked, so it is retained as an unavailable background reference rather than newly read
      numerical evidence."

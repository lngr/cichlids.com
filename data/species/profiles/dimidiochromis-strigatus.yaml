    rationale: "Generator and checker-b proposed 8 to 12 years, checker-a 7 to 10, and checker-c 8 to 10. Their\
      \ endpoint medians are 8 and 11. The only numeric species source retained is the provisional Fishipedia sheet\
      \ at 10 years; no read source supports 11 as a documented typical lifespan. After checking the median against\
      \ that evidence, the upper value is set to 10. The lower value of 8 remains an estimate, and all longer model-based\

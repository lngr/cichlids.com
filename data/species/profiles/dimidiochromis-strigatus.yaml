  socialBehavior:
    text: "A practical breeding unit is one male with three females. Several partners and separated retreats help\
      \ reduce concentrated courtship pressure. Males can pursue females and rivals persistently during spawning,\
      \ even though some specialist observations describe quiet behavior at other times. The roughly 50 cm nest\
      \ area counts as a large territory in this profile, and its use is mainly tied to breeding."

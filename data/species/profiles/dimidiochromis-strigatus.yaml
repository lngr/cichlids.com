        \ bounds. General Malawi advice ranges from 6 to 12 to 10 to 15 dKH. The wider Malawi-Guru acceptable range\
        \ is 6 to 20, and Aquarium.org.il recommends 12 to 20 for this species; both remain in evidence although\
        \ the decided maximum is lower. Aquarium reports at KH 10 and 8.5 show keeping conditions, not either endpoint.\

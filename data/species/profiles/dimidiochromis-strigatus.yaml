  compatibility:
    text: "Use robust Malawi tankmates too large to be swallowed and provide more space when building a mixed community.\
      \ Small adults, fry and growing juveniles can be eaten regardless of shared lake origin. Nest defense can\
      \ also disturb similar-sized fish during spawning. No hybrid group is assigned by the settled tally. A single\
      \ low-trust Atlas account warns about crossing with D. compressiceps without identifying a verifiable case,\
      \ so that uncertainty remains visible in the feature evidence."

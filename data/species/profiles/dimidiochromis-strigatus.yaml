    rationale: "Generator proposed green, silver and red with stripes; checker-a blue and orange with a plain pattern;\
      \ checker-b blue and red with a mixed pattern; checker-c blue, red and orange with stripes. The Nordic register\
      \ describes blue-iridescent males with red fin and opercular markings, and Imperial Tropicals adds orange\
      \ fins. The species' longitudinal band is supported by specialist accounts, although it can be less apparent\
      \ in displaying males and is especially clear in silver females and juveniles. The chosen colors describe\
      \ mature males rather than the female background."
  - field: features.minTank
    proposals:
    - by: generator
      value:
        volumeL: 680
        lengthCm: 180
        depthCm: 60
    - by: checker-a
      value:
        volumeL: 450
        lengthCm: 150
        depthCm: 50
    - by: checker-b

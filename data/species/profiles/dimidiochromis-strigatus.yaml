  diet:
    text: "Small fish are principal prey, with invertebrates also eaten. In an aquarium, use a varied prepared carnivore\
      \ diet with suitable frozen animal foods rather than relying on live feeder fish. Pellets and shrimp are supported\
      \ in care accounts. Feed controlled portions to limit waste. The profile does not identify a special protein-related\
      \ bloat susceptibility, but that does not eliminate ordinary digestive and water-quality problems."

  breeding:
    text: "The female incubates the brood in her mouth after spawning over a crater excavated by the male. Specialist\
      \ and breeding accounts describe large broods, with some captive reports reaching about 230 young. Newly released\
      \ fry can suffer losses when given excessive food, so small measured meals and clean water matter. Brooding\
      \ and courting females need places to escape the male's attention."

  problems:
    text: "Cramped swimming space, prey-sized companions and a breeding group without retreats are the main avoidable\
      \ risks. Monitor females during courtship and separate fish when pursuit causes injury. Maintain filtration\
      \ and regular water changes appropriate to the stock. Fry overfeeding is reported in a breeding account. Published\
      \ longevity evidence is weak; the estimated eight to ten years should be treated as planning guidance rather\
      \ than a verified survival record."
    sources:
    - kind: literature

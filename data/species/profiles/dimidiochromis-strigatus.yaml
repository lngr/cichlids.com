  maxSizeCm:
    value:
      male: 25
      female: 19.5
    confidence: medium
    rationale: "The male proposals are generator 25, checker-a 25, checker-b 20 and checker-c 25 cm, giving a median\
      \ of 25. Female proposals are 20, 20, 15 and 19 cm respectively, giving 19.5. FishBase reports 24.4 cm TL\
      \ for male or unsexed fish, the Nordic register gives 25 cm, and Malawi.si gives about 25 cm for males with\
      \ females roughly one-quarter smaller. Thus 25 cm is a planning maximum for well-kept adult males and 19.5\
      \ cm is an approximate female estimate, not a measured sex-specific limit. Dealer estimates extending to 28\
      \ to 30 cm remain in evidence but do not outweigh the specialist convergence near 25."

  husbandry:
    text: "For one male with three females, the minimum adopted here is 640 L with a footprint at least 180 by 60\
      \ cm. This is a low-confidence synthesis of differing care recommendations; additional large tankmates require\
      \ more space. Leave room for swimming and sand excavation while providing sight breaks and retreats for females.\
      \ Maintain clean, stable alkaline water and effective filtration. The estimated aquarium envelopes are 21\
      \ to 30 C, pH 7.5 to 8.6, GH 3 to 20 dGH and KH 5 to 15 dKH. Their endpoints are not ideal setpoints or experimentally\
      \ established failure thresholds."

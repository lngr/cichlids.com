partners:
  suitable:
  - species: Cyrtocara moorii
    reason: A sufficiently large adult can suit a spacious Malawi hap community with open swimming space.
    condition: "Only individuals clearly beyond prey size, in an aquarium exceeding the harem minimum when additional\
      \ fish are added."
  - species: Fossorochromis rostratus
    reason: A robust adult sand-associated Malawi cichlid is a possible community candidate.
    condition: "A substantially larger aquarium than 640 L, with enough floor area for both species and separate\
      \ breeding sites."
  unsuitable:
  - species: Small Malawi cichlids and juvenile tankmates
    reason: An adult strigatus is a pronounced piscivore; fish that fit its mouth can become prey.
  - species: Tropheus moorii
    reason: The grazer's plant-focused feeding requirements conflict with the decided fish-led carnivore diet.
  - species: Highly territorial Malawi mbuna
    reason: Persistent rock-territory competition can add stress and injury risk around the strigatus spawning area.
profile:
  overview:
    text: "This Malawi basin predator is often sold as Sunset Hap. It combines a large oblique mouth with a body\
      \ suited to hunting among shallow plant beds. Plan for males approaching 25 cm and smaller females, rather\
      \ than the juvenile purchase size. Its principal compatibility risk is fish predation, followed by breeding-season\
      \ pursuit and nest defense."

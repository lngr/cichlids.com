    rationale: "Generator, checker-b and checker-c proposed demanding; checker-a proposed moderate. The Nordic register\
      \ and provisional Fishipedia sheet describe moderate difficulty, but the full keeping requirements include\
      \ a large adult predator, a spacious harem aquarium and breeding aggression. Those requirements justify demanding\
      \ under this profile's planning context without claiming the species is inherently delicate."

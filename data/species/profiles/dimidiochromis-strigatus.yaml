    decision:
      volumeL: 640
      lengthCm: 180
      depthCm: 60
    rationale: "Generator proposed 680 L with 180 by 60 cm, checker-a 450 L with 150 by 50 cm, checker-b 750 L with\
      \ 200 by 60 cm, and checker-c 600 L with 180 by 60 cm. Component medians are 640 L, 180 cm and 60 cm. Malawi.si\
      \ supports a 600 L minimum and 180 to 200 cm length, while the Nordic register specifies 750 L and 200 cm;\
      \ Malawi-Guru and Einrichtungsbeispiele specify 1000 L, and the provisional Fishipedia sheet gives 1200 L.\
      \ Dealer minima of 284 to 473 L are less explicit about a breeding harem. The decided minimum is for one male\
      \ with three females; larger communities need more room. A 60 cm depth is a layout inference allowing a roughly\
      \ 50 cm crater, refuge and turning room, not a quoted specialist measurement. The generator's Atlas attribution\
      \ of 681 L and 183 by 61 cm is retained but does not match the read page, which gives about 606 L and length\
      \ advice around 152 to 198 cm."

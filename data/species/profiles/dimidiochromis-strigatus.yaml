      rationale: "The unanimous tally decision is 21 to 30 C with low confidence. Generator and checker-a proposed\
        \ 21 to 30, checker-b proposed 20 to 30, and checker-c proposed 21 to 29; these meet the tally agreement\
        \ threshold, with median agreeing bounds of 21 and 30. Species care targets mostly lie near 23 to 28 C,\
        \ so the endpoints remain inferred rather than measured healthy-years limits. The natural 21 to 29 C range\
        \ is fully included; the wider checker-b allowance to 20 C is retained as a proposal rather than established\
        \ source advice."

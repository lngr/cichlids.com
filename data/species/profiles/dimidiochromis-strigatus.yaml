  sizeAndGrowth:
    text: "The planning maximum is about 25 cm for males and 19.5 cm for females. The female value is approximate\
      \ because sex-separated measurements are scarce. Some adults remain nearer 15 cm, while dealer estimates reach\
      \ 28 to 30 cm; specialist descriptions and FishBase converge near 25 cm. Select the permanent aquarium and\
      \ tankmates for the eventual adult size."

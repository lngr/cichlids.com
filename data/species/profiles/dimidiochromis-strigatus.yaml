  temperatureC:
    value:
      min: 21
      max: 29
    confidence: high
    rationale: "The settled lake decision is 21 to 29 C. Eccles reports seasonal inshore cooling to 21 C in his\
      \ accessible abstract, FAO compiles surface readings of 23 to 25 C, and Vollmer describes summer surface water\
      \ near 28 C and winter water below 24 C. These individual campaigns sample parts of the seasonal lake envelope.\
      \ The full Eccles paper was not open access and its publisher page returned HTTP 403; only the archived Crossref\
      \ abstract supports its evidence here. The 21 to 29 C envelope is retained exactly as decided for the lake,\
      \ rather than replacing it with a narrower aquarium target."

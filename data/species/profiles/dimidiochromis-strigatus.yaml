  sexing:
    text: "Mature males are larger and develop blue iridescence with red or orange markings, especially around the\
      \ fins and behind the gill cover. Females and juveniles are more silver-colored and usually show the longitudinal\
      \ dark band clearly. The band can be less apparent on displaying males. Young fish may not yet show reliable\
      \ adult color differences, so appearance alone gives uncertain sex assignments."

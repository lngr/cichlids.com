  predation:
    value: 3
    confidence: high
    rationale: "The qualified-majority tally selects level 3 with five of six votes. Generator proposed level 2;\
      \ checker-a, checker-b, checker-c and both tie-breakers proposed level 3. CRC explicitly identifies piscivory,\
      \ and the Nordic association identifies small fish as the principal food. FishBase and Practical Fishkeeping\
      \ also report invertebrates but do not quantify their share. Eating invertebrates does not exclude pronounced\
      \ piscivory, so the level-2 interpretations remain in evidence without changing the decided level. The available\
      \ AquaInfo Dutch page supplied only map text, and its English article route supplied no readable article,\
      \ so neither contributes feeding evidence."

      \ dealer groups span two to five. Three females is a supported aquarium unit for distributing courtship pressure.\
      \ CRC's polygynandrous natural mating category is consistent with multiple partners; Fishipedia's provisional\
      \ pair description is outweighed by repeated species-specific harem advice."

  habitat:
    text: "The range includes Lake Malawi, adjacent lagoons, Lake Malombe and the upper Shire system. Fish usually\
      \ occupy shallow sand with aquatic vegetation and move through midwater; specialist accounts give depths around\
      \ 1 to 15 m. Broad sand areas, open swimming space and patches of cover suit that setting. Natural lake ranges\
      \ are 21 to 29 C, pH 7.7 to 8.6, GH 3 to 5 dGH and KH 5 to 8 dKH. Lake water is alkaline but relatively soft\
      \ in calcium-magnesium hardness."

    tolerance:
      value:
        min: 21
        max: 32
      verification:
        method: qualified-majority
        votes:
          agree: 5
          total: 6
      confidence: low
      rationale: "Proposals were generator: 21 to 32; checker-a: 22 to 30; checker-b: 21 to 31; checker-c:\
        \ 22 to 29; tiebreaker-1: 20 to 32; tiebreaker-2: 21 to 32. The tally qualified majority has five of\
        \ six agreeing proposals and selects 21 to 32 C. The envelope contains the decided natural 26 to 31\
        \ C. It is narrower at the cool edge than the union of care-source ranges, 20 to 32 C; NCS supplies\
        \ 20 to 29, Aqua-Fish 21 to 25, and AquaInfo 22 to 32. AquaInfo explicitly treats 32 C as wild variation\
        \ and prefers about 26 C in tanks. The 2025 and 2026 laboratory papers support multi-year breeding\
        \ at 27 to 29 C but overlap in stock and methods. Years of health at 21 or 32 C are unproven, so the\
        \ tally confidence remains low and the outer edges are provisional."

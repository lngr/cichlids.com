      \ 7.6 to 8.3; tiebreaker-1: 6.8 to 8.3; tiebreaker-2: 7.8 to 8.3. The tally takes the median of all lower\
      \ bounds, 7.2, and upper bounds, 8.3, because the largest agreeing cluster has two of six votes. This\
      \ low-confidence summary is narrower than the generator-reported historical Brinson envelope of 5.2 to\
      \ 8.25 and the 7.9 to 10.5 basin range reported by Choc, whose sampled fish were other genera. The later\
      \ monitoring records are near pH 8; Machorro supplies a surface mean of 7.8 rather than an endpoint.\
      \ In the Izabal row of Perez and Pailles, 7.6 is dissolved oxygen and 8.3 is pH; those columns are not\
      \ interchangeable. Rio Dulce is a separate site. The selected 7.2 lower edge is the vote median rather\
      \ than a newly measured station value. Caobas measurements belong to the former species complex and are\
      \ excluded from direct habitat support."

        title: "The Early Development of the Blue-Eye Cichlid, Cryptoheros spilurus, Evolution & Development\
          \ 2025"
        url: "https://doi.org/10.1111/ede.70019"
        accessed: '2026-10-13'
      - kind: literature
        title: "Life-history divergence and reproductive strategies in two closely related Neotropical cichlids\
          \ (Cryptoheros spilurus and C. cutteri), Hydrobiologia 2026"
        url: "https://doi.org/10.1007/s10750-026-06274-0"
        accessed: '2026-10-13'
      - kind: database
        title: "ilMioAcquario: Cryptoheros spp. care sheet"
        url: "https://www.ilmioacquario.it/acqua-dolce/pesci/cichlidae/cryptoheros/"
        accessed: '2026-10-13'
  socialBehavior:
    text: "Use a settled male-female pair as the basic adult unit. Pair selection matters because a male can\
      \ pressure or attack an unwilling partner, and rival males may remain subordinate even outside spawning.\
      \ Conspecific aggression is graded 3 to account for that risk; aggression toward other species is graded\
      \ 2 for territorial displacement in suitable housing. The immediate nesting area is the usual territory,\
      \ with stronger defense while caring for eggs and fry. Provide a divider or separate accommodation if\
      \ either partner cannot retreat."
    sources:
      - kind: database
        title: "Rybicky.net fish atlas: Cryptoheros spilurus"
        url: "https://rybicky.net/atlasryb/kancik_hrbohlavy"
        accessed: '2026-10-13'
      - kind: literature
        title: Borstein (2008). Cryptoheros spilurus. Greater Chicago Cichlid Association breeding report.
        url: "https://www.gcca.net/art-pics/cichlid-profiles-list/central-american-cichlids/129-cryptoheros-spilurus.html"
        accessed: '2026-10-13'
      - kind: database
        title: "Nordiska Ciklidsallskapet species register: Cryptoheros spilurus"
        url: "https://ciklid.org/artregister/art.php?ID=379"
        accessed: '2026-10-13'
      - kind: literature
        title: "Life-history divergence and reproductive strategies in two closely related Neotropical cichlids\
          \ (Cryptoheros spilurus and C. cutteri), Hydrobiologia 2026"
        url: "https://doi.org/10.1007/s10750-026-06274-0"
        accessed: '2026-10-13'
      - kind: literature
        title: "Nederlandse Vereniging van Cichlidenliefhebbers: Cryptoheros spilurus (Gunther 1862), species\
          \ article"
        url: "https://www.nvcweb.nl/visbeschrijvingen/midden-amerika/cryptoheros-spilurus-g%C3%BCnther-1862"
        accessed: '2026-10-13'
  diet:
    text: "Feed balanced sinking omnivore pellets with plant ingredients and varied small invertebrate foods.\
      \ Algae and plant material belong in the diet alongside animal foods. Live feeder fish are unnecessary,\
      \ but fry and very small fish can be taken opportunistically. The special bloat-sensitive flag is false\
      \ because no characteristic syndrome is established; this does not rule out ordinary digestive disease\
      \ or problems from overfeeding."
    sources:
      - kind: database
        title: "Aqua-Fish: Blue-eye cichlid, Cryptoheros spilurus"
        url: "https://en.aqua-fish.net/fish/blue-eye-cichlid"
        accessed: '2026-10-13'
      - kind: database
        title: "Nordiska Ciklidsallskapet species register: Cryptoheros spilurus"
        url: "https://ciklid.org/artregister/art.php?ID=379"
        accessed: '2026-10-13'
      - kind: literature
        title: "The Early Development of the Blue-Eye Cichlid, Cryptoheros spilurus, Evolution & Development\
          \ 2025"
        url: "https://doi.org/10.1111/ede.70019"
        accessed: '2026-10-13'
      - kind: literature
        title: "Life-history divergence and reproductive strategies in two closely related Neotropical cichlids\
          \ (Cryptoheros spilurus and C. cutteri), Hydrobiologia 2026"
        url: "https://doi.org/10.1007/s10750-026-06274-0"
        accessed: '2026-10-13'
  breeding:
    text: "Both parents care for the brood. Offer sheltered flat surfaces as well as caves: Izabal-derived\
      \ fish have spawned on more exposed surfaces, so the selected mode is open substrate spawning with flexible\
      \ site choice. Hundreds of eggs can be produced, and repeated breeding creates a need for offspring accommodation.\
      \ Laboratory eggs hatched after roughly two days; the timing of later development depends on temperature.\
      \ Small Artemia and fine prepared foods can feed the young."
    sources:
      - kind: literature
        title: "Life-history divergence and reproductive strategies in two closely related Neotropical cichlids\
          \ (Cryptoheros spilurus and C. cutteri), Hydrobiologia 2026"
        url: "https://doi.org/10.1007/s10750-026-06274-0"
        accessed: '2026-10-13'
      - kind: literature
        title: "The Early Development of the Blue-Eye Cichlid, Cryptoheros spilurus, Evolution & Development\
          \ 2025"
        url: "https://doi.org/10.1111/ede.70019"
        accessed: '2026-10-13'
      - kind: literature
        title: Hellweg. Twelve Types of Dwarf Cichlids from Central America. Tropical Fish Hobbyist.
        url: "https://www.tfhmagazine.com/articles/freshwater/twelve-types-of-dwarf-cichlids-from-central-america"
        accessed: '2026-10-13'
      - kind: database
        title: "Nordiska Ciklidsallskapet species register: Cryptoheros spilurus"
        url: "https://ciklid.org/artregister/art.php?ID=379"
        accessed: '2026-10-13'
  sexing:
    text: "Mature males usually grow larger and may develop a steeper forehead and longer fin extensions. Females\
      \ can show a dark dorsal mark and a fuller abdomen before spawning. Breeding changes the intensity of\
      \ body markings, while a socially suppressed male may remain small. Evaluate several traits and observed\
      \ pairing rather than relying on the blue eyes or one photograph to determine sex or species identity."
    sources:
      - kind: literature
        title: "Nederlandse Vereniging van Cichlidenliefhebbers: Cryptoheros spilurus (Gunther 1862), species\
          \ article"
        url: "https://www.nvcweb.nl/visbeschrijvingen/midden-amerika/cryptoheros-spilurus-g%C3%BCnther-1862"
        accessed: '2026-10-13'
      - kind: database
        title: "Nordiska Ciklidsallskapet species register: Cryptoheros spilurus"
        url: "https://ciklid.org/artregister/art.php?ID=379"
        accessed: '2026-10-13'
      - kind: literature
        title: Borstein (2008). Cryptoheros spilurus. Greater Chicago Cichlid Association breeding report.
        url: "https://www.gcca.net/art-pics/cichlid-profiles-list/central-american-cichlids/129-cryptoheros-spilurus.html"
        accessed: '2026-10-13'
  compatibility:
    text: "Mixed housing is possible when adult companions have suitable size, robustness and overlapping water\
      \ needs. Upper-water livebearers are conditional options, and another cichlid pair needs separate territory\
      \ in a larger tank. Tiny companions and fry face opportunistic predation. The presumed cryptoheros group\
      \ covers spilurus, chetumalensis and cutteri; a second presumed group concerns only spilurus and the\
      \ convict cichlid. The congener caution comes from close relationship and general warnings, while the\
      \ convict reports lack verified stock identity or mate-choice circumstances."
    sources:
      - kind: database
        title: "Nordiska Ciklidsallskapet species register: Cryptoheros spilurus"
        url: "https://ciklid.org/artregister/art.php?ID=379"
        accessed: '2026-10-13'
      - kind: database
        title: "Aqua-Fish: Blue-eye cichlid, Cryptoheros spilurus"
        url: "https://en.aqua-fish.net/fish/blue-eye-cichlid"
        accessed: '2026-10-13'
      - kind: literature
        title: "Nederlandse Vereniging van Cichlidenliefhebbers: Cryptoheros spilurus (Gunther 1862), species\
          \ article"
        url: "https://www.nvcweb.nl/visbeschrijvingen/midden-amerika/cryptoheros-spilurus-g%C3%BCnther-1862"
        accessed: '2026-10-13'
      - kind: website
        title: "Biotope Aquarium Design Contest 2019: Tunico River in summer, Izabal, Guatemala"
        url: "http://biotope-aquarium.info/aquariums/tunico-river-in-the-summer-izabal-guatemala-192-l/"
        accessed: '2026-10-13'
      - kind: literature
        title: Hulsey et al. (2010). Temporal diversification of Central American cichlids.
        url: "https://doi.org/10.1186/1471-2148-10-279"
        accessed: '2026-10-13'
      - kind: archive
        title: cichlids.com forum thread 802
        url: "https://www.cichlids.com/disc/read.php?1,802"
        accessed: '2026-10-13'
  problems:
    text: "Watch for sustained hiding, missed meals, damaged fins or a partner controlling every refuge. Social\
      \ conflict can persist despite acceptable water tests, especially during repeated breeding. Tank size,\
      \ visual barriers and pair compatibility deserve review when problems appear. Clear stock locality is\
      \ also important because legacy spilurus names have included related species. The broad temperature and\
      \ hardness envelopes should not be treated as targets for pushing maintenance to their uncertain edges."
    sources:
      - kind: literature
        title: Borstein (2008). Cryptoheros spilurus. Greater Chicago Cichlid Association breeding report.
        url: "https://www.gcca.net/art-pics/cichlid-profiles-list/central-american-cichlids/129-cryptoheros-spilurus.html"

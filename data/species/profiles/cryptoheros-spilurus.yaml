  legacyNames:
    - Archocentrus spilurus
  note: "The Catalog of Fishes accepts Cryptoheros spilurus and separately accepts C. chetumalensis and C.\
    \ cutteri. The legacy genus query lists only Archocentrus centrarchus: https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Archocentrus,\
    \ accessed 2026-10-13. The 2007 split described chetumalensis and restored cutteri; Mexican and northern\
    \ Belize records under the old spilurus concept require reassessment. The Catalog and FishBase retain a\
    \ broad Belize-to-Nicaragua distribution, while post-split specialist accounts identify the Izabal drainage\
    \ as the secure core. The revision and morphological phylogeny were read as abstracts only; the latter\
    \ fetch-oa result was a restricted metadata page. Fishipedia remained blocked, and the Holloway report\
    \ has no usable DOI for the authorized full-text tool, so these input citations supply no independently\
    \ reviewed evidence here. The CRC public summary was consulted for verification only."

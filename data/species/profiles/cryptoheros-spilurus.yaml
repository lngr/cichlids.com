partners:
  suitable:
    - species: Xiphophorus hellerii
      reason: Robust adults can occupy upper water away from a nesting pair; fry can be eaten.
      condition: "A larger community aquarium with broken sight lines, matching water requirements and separate\
        \ refuge space."
    - species: Poecilia mexicana
      reason: "Robust adult livebearers are potential upper-water companions, also listed in the Tunico locality\
        \ account."
      condition: Adequate additional swimming space and overlapping measured water requirements; brood defense
        and fry predation still apply.
    - species: Thorichthys aureus
      reason: NVC names this cichlid as a possible companion when there is room for separate territories.
      condition: "A substantially larger footprint than the pair minimum, with visual barriers and the ability\
        \ to separate incompatible pairs."
  unsuitable:
    - species: Cryptoheros chetumalensis
      reason: Close resemblance and the presumed cryptoheros hybrid caution conflict with maintaining clearly
        identified breeding stock.
    - species: Cryptoheros cutteri
      reason: Covered by the presumed congener crossing caution and potential territorial rivalry; one laboratory
        tank without crosses does not remove the caution.
    - species: Amatitlania nigrofasciata
      reason: A presumed pairwise hybrid caution rests on old-name captive reports with unresolved parent identity
        and mate availability.
    - species: Large predatory Central American cichlids
      reason: The small adult size and retreat requirements of spilurus create a severe size and predation
        imbalance.
    - species: Very small community fish and fry
      reason: "Level 1 allows occasional consumption of fry and fish around 2 cm, while brood defense can also\
        \ exclude delicate companions."
profile:
  overview:
    text: "A pair of Cryptoheros spilurus offers close views of parental behavior without the adult bulk of\
      \ many Central American cichlids. Its blue eye region and dark body markings become especially conspicuous\
      \ around spawning. The valid name replaces the legacy Archocentrus spilurus. This account centers on\
      \ securely identified Izabal fish; chetumalensis and cutteri are separate species, and old trade labels\
      \ can obscure that distinction."
    sources:
      - kind: catalog-of-fishes
        title: "Eschmeyer's Catalog of Fishes: Cryptoheros, online version updated 21 September 2026"
        url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Cryptoheros"
        accessed: '2026-10-13'
      - kind: literature
        title: "Nederlandse Vereniging van Cichlidenliefhebbers: Cryptoheros spilurus (Gunther 1862), species\
          \ article"
        url: "https://www.nvcweb.nl/visbeschrijvingen/midden-amerika/cryptoheros-spilurus-g%C3%BCnther-1862"
        accessed: '2026-10-13'
      - kind: database
        title: "Nordiska Ciklidsallskapet species register: Cryptoheros spilurus"
        url: "https://ciklid.org/artregister/art.php?ID=379"
        accessed: '2026-10-13'
  habitat:
    text: "The secure core is the Izabal drainage in eastern Guatemala, including shallow lake margins and\
      \ adjoining rivers. Sand, stones and submerged wood provide feeding surfaces and shelter. The recorded\
      \ consensus ranges are 26 to 31 C, pH 7.2 to 8.3, GH 5 to 6 dGH and KH 5 to 6 dKH. They summarize the\
      \ adjudicated evidence and are narrower than some basin measurements, including a modern lake reading\
      \ of 31.6 C and hardness above 7 dGH. They are not exhaustive annual limits. Measurements from Mexican\
      \ populations cannot be assigned directly after the species split."
    sources:
      - kind: literature
        title: "Perez et al. (2013). Bioindicators of climate and trophic state in lowland and highland aquatic\
          \ ecosystems of the Northern Neotropics. Revista de Biologia Tropical 61(2), 603-644. Table 1A."
        url: "https://doi.org/10.15517/rbt.v61i2.11164"
        accessed: '2026-10-13'
      - kind: literature
        title: Pailles et al. (2020). New fossil genus and new extant species of diatoms from Pleistocene sediments
          in Guatemala. Table 1.
        url: "https://doi.org/10.5852/ejt.2020.726.1169"
        accessed: '2026-10-13'
      - kind: database
        title: "INE / INSIVUMEH: Base Calidad del Agua 2023, Mariscos and Castillo San Felipe monitoring records."
        url: "https://datos.ine.gob.gt/api/3/action/datastore_search?resource_id=45008b75-b34d-4e12-9f13-482873eda5fb&limit=10000"
        accessed: '2026-10-13'
      - kind: database
        title: "INE / INSIVUMEH: Base de monitoreo del Agua 2024, Mariscos and Castillo San Felipe monitoring\
          \ records."
        url: "https://datos.ine.gob.gt/api/3/action/datastore_search?resource_id=d08589e5-e264-41cc-b67d-4867ff11d3bc&limit=10000"
        accessed: '2026-10-13'
      - kind: database
        title: "Nordiska Ciklidsallskapet species register: Cryptoheros spilurus"
        url: "https://ciklid.org/artregister/art.php?ID=379"
        accessed: '2026-10-13'
  sizeAndGrowth:
    text: "Plan for an adult male around 12 cm and a female around 9 cm in total length. FishBase gives the\
      \ smaller female maximum of 8 cm, while larger legacy-stock reports lack secure locality. Social suppression\
      \ can delay the growth and appearance of subordinate males. The estimated aquarium lifespan is 6 to 10\
      \ years, with lower hobby estimates also published; no survival series establishes a guarantee."
    sources:
      - kind: database
        title: "FishBase species summary: Cryptoheros spilurus"
        url: "https://www.fishbase.se/summary/Cryptoheros-spilurus.html"
        accessed: '2026-10-13'
      - kind: literature
        title: Borstein (2008). Cryptoheros spilurus. Greater Chicago Cichlid Association breeding report.
        url: "https://www.gcca.net/art-pics/cichlid-profiles-list/central-american-cichlids/129-cryptoheros-spilurus.html"
        accessed: '2026-10-13'
      - kind: literature
        title: "Nederlandse Vereniging van Cichlidenliefhebbers: Cryptoheros spilurus (Gunther 1862), species\
          \ article"
        url: "https://www.nvcweb.nl/visbeschrijvingen/midden-amerika/cryptoheros-spilurus-g%C3%BCnther-1862"
        accessed: '2026-10-13'
      - kind: database
        title: "Aqua-Fish: Blue-eye cichlid, Cryptoheros spilurus"
        url: "https://en.aqua-fish.net/fish/blue-eye-cichlid"
        accessed: '2026-10-13'
      - kind: database
        title: "Rybicky.net fish atlas: Cryptoheros spilurus"
        url: "https://rybicky.net/atlasryb/kancik_hrbohlavy"
        accessed: '2026-10-13'
  husbandry:
    text: "Allow one compatible pair about 200 L and a footprint of 120 by 40 cm, with secure rocks and wood\
      \ forming several retreats. Additional fish need more room. Filter reliably and change water regularly,\
      \ keeping both partners able to feed and rest. The tolerance envelopes are 21 to 32 C, pH 6.5 to 8.5,\
      \ GH 4 to 21 dGH and KH 2 to 8 dKH. Their outer limits are estimates with uneven support; routine temperatures\
      \ near 26 to 28 C are better supported than continuous maintenance at 32 C. Measure GH and KH separately."
    sources:
      - kind: database
        title: "AquaInfo: Cryptoheros spilurus"
        url: "https://aquainfo.nl/artikel/cryptoheros-spilurus/"
        accessed: '2026-10-13'
      - kind: database
        title: "Aqua-Fish: Blue-eye cichlid, Cryptoheros spilurus"

    rationale: "Proposals were generator: 23 to 31.4; checker-a: 25 to 29; checker-b: 26 to 31; checker-c:\
      \ 26.4 to 27.6; tiebreaker-1: 26 to 31; tiebreaker-2: 26.4 to 31.6. The tally takes the rounded median\
      \ of all six lower and upper bounds because only three votes form the largest agreeing cluster. The resulting\
      \ 26 to 31 C has low confidence and is a consensus summary, not complete field extrema. It is narrower\
      \ than the generator-reported Brinson lake and Polochic envelope of 23 to 31.4 C, FishBase's historical\
      \ 22 to 32 C, and the independently reread 2024 lake measurements reaching 31.6 C. Perez and Pailles\
      \ reuse one campaign rather than independent measurements. Holloway's input citation was not independently\
      \ retrieved and contributes no evidence here."

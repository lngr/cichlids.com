      reason: "Species care sources name this large Malawi predator as a possible companion."
      condition: "Mature fish must be too large to swallow; use a community aquarium larger than the harem minimum
        and monitor breeding interactions."
    - species: "Aristochromis christyi"
      reason: "Malawi-Guru includes this genus among robust predator companions."
      condition: "Only a substantially larger community aquarium with suitable adult sizes and visual barriers."
  unsuitable:
    - species: "Small Malawi cichlids and juveniles"
      reason: "Pronounced piscivory makes mouth-sized fish potential prey, including fry of larger species."
    - species: "Nimbochromis livingstonii"
      reason: "Shares the presumed nimbochromis crossing group; conspecific-like appearance can also add rivalry."
    - species: "Small algae-grazing mbuna"
      reason: "Adult polystigma may swallow small fish, and the tankmates can have different feeding needs or harass
        it."
profile:
  overview:
    text: "A mottled juvenile polystigma grows into a substantial fish predator from Lake Malawi. Males can become
      strongly blue when displaying, while the many small spots are easier to see in females and subdued fish.
      The older catalog names Cyrtocara polystigma, Nimbochromis maculimanus and Nimbochromis pardalis refer
      to this same species. Its appetite makes adult size and the eventual community more important planning
      questions than the appearance of a small fish in a shop."
    sources:
      - *a1
      - *a2
      - *a4
  habitat:
    text: "This lake-wide endemic uses sandy ground mixed with rocks and beds of submerged plants. FishBase
      records foraging alone, in pairs and in groups; public CRC also identifies intermediate, sandy and
      vegetated habitats. It may wait motionless on the bottom, but the more reliable species account
      distinguishes this posture from the side-lying tactic associated with livingstonii. The decided natural
      ranges are 21 to 29 C, pH 7.7 to 8.6, GH 3 to 5 dGH and KH 5 to 8 dKH."
    sources:
      - *a2
      - *a4
      - *a33
      - *a9
      - *a21
      - *a10
      - *a11
  sizeAndGrowth:
    text: "Use about 25 cm for a typical large aquarium male and 20 cm for a female when planning the adult group.
      Reports of males approaching 30 cm remain relevant when allowing turning room, although that upper
      report does not set the typical maximum. Small juveniles need an adult home planned from the beginning.
      Longevity figures are weakly documented; eight to ten years is the working estimate, with shorter and
      longer proposals retained in the feature evidence."
    sources:
      - *a2
      - *a33
      - *a12
      - *a18
      - *a16
  husbandry:
    text: "For one male with three females, plan around 650 litres with at least 180 cm length and 60 cm depth.
      Leave substantial swimming room over sand, secure heavy rocks against digging, and provide routes out of
      a displaying male's view. A community with other large cichlids needs more space. Maintain effective
      filtration and regular water changes. The tallied long-term envelopes are 21 to 29 C, pH 7.5 to 8.6, GH
      3 to 18 dGH and KH 5 to 14 dKH; they describe working ranges rather than tested survival boundaries."
    sources:
      - *a16
      - *a33
      - *a37
      - *a15
      - *a5
  socialBehavior:
    text: "Breeding males can chase their own species persistently, so one male with several females is the
      default aquarium arrangement. The defended site is associated with spawning; a roaming fish outside that
      period need not hold a permanent feeding territory. Large fish of other species may receive much less
      attention than rivals or prey. Accounts disagree about the strength of this difference, so observe
      individual behaviour rather than assuming that every predator is equally combative toward all
      tankmates."
    sources:
      - *a37
      - *a33
      - *a34
      - *a4
  diet:
    text: "Fish dominate the natural diet, with invertebrate foods also reported. In captivity a suitable
      carnivore pellet and varied frozen aquatic foods can provide practical feeding options. Feed measured
      portions and check that every fish gets food; aquarium accounts describe vigorous feeding and attempts
      to reach food above the surface. A secure cover is useful. The profile does not flag a special
      protein-related bloat sensitivity, but this does not make overfeeding or deteriorating water harmless."
    sources:
      - *a2
      - *a5
      - *a34
      - *a17
  breeding:
    text: "The male prepares a sandy spawning place near cover and courts females without forming a permanent
      pair. The female carries the developing brood in her mouth and continues maternal care after release.
      Aquarium reports place incubation near three weeks, but timing varies and published brood counts
      disagree. Provide space for a brooding female to avoid attention. The current hybrid caution concerns
      other Nimbochromis species; it rests on general aquarium warnings rather than a confirmed free-choice
      polystigma cross."
    sources:
      - *a4
      - *a2
      - *a5
      - *a37
  sexing:
    text: "Adult display colour is more informative than a juvenile's markings. A territorial male develops blue
      to green-blue over the head and body, often with yellow or orange fin accents; the spots may become hard
      to distinguish. Females and non-displaying males retain more obvious dark mottling on a pale background.
      Males usually grow larger, but size and subdued colour alone cannot reliably sex immature fish. The
      small spots on the pectoral fins are useful identification characters rather than a guarantee of sex."
    sources:
      - *a33
      - *a2
      - *a12
  compatibility:
    text: "Choose mature companions that cannot be swallowed and give each large fish enough room to leave a
      breeding site. Species accounts suggest other substantial Malawi predators, including Dimidiochromis and
      Aristochromis, for suitably enlarged communities. Small mbuna, fry and other mouth-sized fish remain
      prey regardless of how calm polystigma appears. Other Nimbochromis share a presumed crossing caution. No
      additional hybrid group is justified by the reviewed evidence, and a general crossing warning does not
      establish how frequently these fish hybridize."
    sources:
      - *a37
      - *a33
      - *a34
      - *a42
      - *a16
  problems:
    text: "The most avoidable failures come from underestimating adult size, mixing in small fish, or allowing
      repeated chasing without refuge. Check food intake, body condition and water quality when behaviour
      changes. A motionless ambush posture can be normal, but persistent distress or abnormal respiration
      needs separate assessment. Archive discussions report identification confusion, fast growth and poor
      outcomes in some mbuna mixtures; these anecdotes support careful observation without establishing
      universal compatibility rules or reliable treatment instructions."
    sources:
      - *a17
      - *a33
      - *a30
      - *a29

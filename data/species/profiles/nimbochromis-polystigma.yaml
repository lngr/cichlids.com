  ghDgh:
    value:
      min: 3
      max: 5
    confidence: "high"
    rationale: "The decided natural hardness is 3 to 5 dGH. Branchu calcium and magnesium yield roughly 4.2 to 4.6
      dGH, while the earlier surveys compiled by FAO yield about 3.2 to 4.9 dGH. FishBase lists 10 to 18 dH
      and hobby advice reaches 22, but neither describes the measured lake chemistry. Sodium-supported
      bicarbonate buffering allows this alkaline water to remain relatively soft."

        with 650 L gross volume. Source advice spans 284 L from Aquarium Wiki, 342 to 378 L and 152 cm from
        Mongabay, 600 to 800 L from Fischlexikon, 700 L and 150 cm from Fishipedia, 750 L for a harem from
        Malawi.si, and 800 L with 200 cm from Malawi-Guru. Neotropic states 600 L and 200 cm. Several
        inherited depths are estimates. This decision is for one male with three females; a community of
        additional large fish needs more room, with Malawi.si and Fischlexikon recommending around 1000 L for
        that context."

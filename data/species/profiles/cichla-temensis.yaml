    decision: *id063
    rationale: "Generator proposed 3000 L and 305 by 122 cm; checker-a 3000 L and 300 by 100 cm; checker-b\
      \ 5000 L and 400 by 150 cm for five adults; checker-c 3400 L and 305 by 122 cm for three adults.\
      \ Component medians give 3200 L and a 305 by 122 cm footprint. Scott reports two or three adults\
      \ in aquaria 244 to 305 cm long and 91 to 122 cm wide. Seriously Fish specifies about 305 cm length,\
      \ 91 cm height and 122 cm front-to-back width, roughly 3398 L gross; 3200 L represents a modest\
      \ allowance for freeboard and furnishing within that larger published enclosure. This profile selects\
      \ a managed group of three adults, so Scott's direct group experience supports retaining the median\
      \ footprint. Guidarium gives 3000 L and 300 cm length but no independently established 100 cm width;\
      \ checker-a's 91 cm Seriously Fish depth conversion is the vertical height, not front-to-back width.\
      \ The five-adult 5000 L proposal is not adopted after selecting three adults. Additional giant tankmates\
      \ or an incompatible breeding pair require more space or separation, and the dimensions are practical\
      \ husbandry guidance rather than a measured welfare threshold."

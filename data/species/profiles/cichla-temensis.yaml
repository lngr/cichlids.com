      \ with low confidence. This is a synthesis of uneven regional coverage, not a new measurement or\
      \ a physiological limit. Balbina capture sites measured 4.75 to 5.10; JBL observed the species at\
      \ Atabapo pH 4.5. The decision is narrower than Kuchler et al.'s Rio Negro basin range of 3.89 to\
      \ 6.07 at the acidic end, the occupied-water envelope of 3.9 to 6.5 proposed by generator and tiebreaker-1,\
      \ and the database environment interval of 5.5 to 6.5 at the less acidic end. Silva et al. report\

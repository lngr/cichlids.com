      \ envelope 0 to 1 dGH with medium confidence. JBL measured GH 0 at Atabapo where the species was\
      \ observed. Kuchler et al.'s blackwater calcium and magnesium extrema yield a calculated outer envelope\
      \ of roughly 0.01 to 0.14 dGH, and the wet/dry calcium and magnesium measurements reproduced by\
      \ Gonzalez et al. yield about 0.042 to 0.048 dGH. Checker-a retained a converted Venezuelan field\
      \ range of 0 to 0.34 dGH, which could not be independently checked through the allowed full-text\
      \ tool. Zero denotes near-zero hardness at aquarium-test resolution. The 1 dGH ceiling is outward\
      \ practical rounding, not a measured concentration. Conductivity supports low mineral content but\
      \ is not converted into general hardness; basin proxies do not prove identical chemistry throughout\
      \ the Orinoco distribution."

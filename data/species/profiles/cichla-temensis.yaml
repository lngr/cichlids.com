      very large enclosure.
    condition: "Only large adults beyond swallowing size, with additional surface area and secure covers;\
      \ a larger enclosure than the three-adult group minimum is required."
  - species: Astronotus ocellatus
    reason: Scott lists oscars among potential companions; robust adults can coexist if neither fish can
      swallow the other.
    condition: "Only exceptionally large adults at least half the bass length; match current sizes, monitor\
      \ aggression and provide substantially more space."
  - species: Pterygoplichthys gibbiceps
    reason: A large loricariid is a conditional example of the large catfish companions listed by Seriously
      Fish.
    condition: "Fully grown specimen safely beyond swallowing size, ample bottom refuge and separate feeding;\
      \ observe for skin rasping and separate if it occurs."
  unsuitable:
  - species: Paracheirodon axelrodi
    reason: Its entire adult body fits easily within the mouth of an adult bass and will be treated as
      prey.
  - species: Apistogramma agassizii
    reason: A dwarf cichlid is prey-sized despite sharing broadly similar water chemistry.
  - species: Parachromis dovii
    reason: Scott warns that combative Parachromis can bully peacock bass; similarly large size does not
      resolve this aggression risk.
  - species: Cichla monoculus
    reason: Reported farm hybridization makes it unsuitable when maintaining an identifiable pure breeding
      line.
  - species: Cichla orinocensis
    reason: Natural-population genetic evidence of hybridization makes it unsuitable for a pure-species
      breeding setup.
profile:
  overview:
    text: The speckled pavon is a large South American fish predator whose juvenile size can conceal the
      scale of its adult care requirements. Its native distribution includes the Negro and Uatuma drainages
      and tributaries of the Orinoco. A small group needs a permanent enclosure measured in several thousand
      litres. Dark spotting and bright vertical bars are phases of a reproductive color cycle shared by
      both sexes. They do not identify separate species or permanent captive strains. Identification and
      provenance deserve attention because peacock bass crosses have been reported both in wild populations
      and in commercial farms.
    sources:
    - *id001
    - *id005
    - *id010
    - *id008
    - *id011
  habitat:
    text: "Adults use river margins and connected lagoons with sandy or rocky shores, deeper littoral\
      \ water and submerged wood. Seasonal flooding changes access to feeding and breeding areas. Much\
      \ of the native water is acidic and contains very little calcium, magnesium or carbonate buffering.\
      \ The decided natural intervals are 28 to 31 C, pH 4.3 to 6.3 and 0 to 1 dGH/dKH; they summarize\
      \ selected typical habitats rather than every population and season. Balbina measurements come from\
      \ sites where this species was captured. Wider regional measurements remain relevant context: Anavilhanas\
      \ microhabitats reached 28.4 to 34.7 C, JBL reported an Atabapo surface peak of 32.5 C, and a Rio\
      \ Negro basin survey reached pH 3.89 at Rio Tea. These readings are not established long-term aquarium\
      \ targets or a complete species-specific field envelope. Polluted urban tributary chemistry is excluded\
      \ from the habitat estimate."
    sources:
    - *id005
    - *id009
    - *id030
    - *id013
    - *id014
    - *id031
    - *id032
    - *id035
    - *id004
    - *id007
    - *id017
    - *id015
    - *id019
    - *id020
    - *id024
  sizeAndGrowth:
    text: "Approximate typical aquarium planning maxima are 77.5 cm TL for males and 67.5 cm TL for females.\
      \ These figures are proposal medians with low confidence; a reliable sex-separated captive series\
      \ is missing. Larger individuals occur, and FishBase lists a 99 cm TL male or unsexed record. Seriously\
      \ Fish labels a similar numerical maximum as SL, a different measurement. Scott reports about 41\
      \ cm TL at 12 to 14 months, showing why temporary juvenile housing can quickly become inadequate.\
      \ The estimated lifespan of 9 to 14.5 years is also provisional. A wild growth model estimated longevity\
      \ near 14 years, while captive-life claims have not been confirmed by a documented long-term cohort."
    sources:
    - *id008
    - *id005
    - *id006
    - *id042
    - *id003
    - *id037
    - *id023
  husbandry:
    text: "Provide a permanent enclosure at least 305 cm long and 122 cm front to back with about 3200\
      \ litres of water for the recommended three-adult group. The footprint follows the larger published\
      \ aquarium recommendation and direct experience with two or three adults. Additional giant companions\
      \ require a larger system. Preserve broad swimming and turning space, with securely placed roots\
      \ or rocks at the perimeter. Strong covers, protected equipment, substantial biological filtration\
      \ and good oxygenation matter. Routine maintenance around 27 to 29 C and stable mildly acidic water\
      \ has stronger support than the edges of the provisional tolerance ranges. Match temperature during\
      \ water changes, keep ammonia and nitrite undetectable and control accumulating waste. Monitor weakly\
      \ buffered water carefully and avoid abrupt pH adjustment."
    sources:
    - *id006
    - *id008
    - *id021
    - *id013
    - *id022
    - *id023
    - *id039
  socialBehavior:
    text: "A managed group of three adults is the social unit used here. Species groups are described\
      \ in husbandry literature, and Scott reports two or three fish in very large aquaria. Breeding pairs\
      \ are seasonal associations and do not establish a mandatory year-round pair-only arrangement. Adults\
      \ can chase persistently, and an emerging pair may dominate the remaining fish. Use sight breaks\
      \ and maintain a workable separation option. Watch for exclusion from food, repeated pursuit and\
      \ injuries rather than assuming that a numerical group size guarantees stability. Juveniles can\
      \ also be bullied by more forceful tankmates. Larger groups may work in larger systems, but a five-fish\
      \ minimum lacks direct numerical support."
    sources:
    - *id009
    - *id010
    - *id006
    - *id008
    - *id022
    - *id046
  diet:
    text: "Fish dominate the natural adult diet. Suitable captive choices include accepted complete carnivore\
      \ pellets and varied aquatic animal foods such as thawed whole fish, prawns and mussels, with earthworms\
      \ as another option. Prepared-food acceptance can require gradual training; farm studies show that\
      \ trained fish can use extruded feed. Adjust portion size and frequency to growth and body condition,\
      \ and remove leftovers. Avoid meals that grossly distend the abdomen. Feeder fish of uncertain health\
      \ can transmit infection or parasites. The false bloat-sensitive flag describes the absence of the\
      \ rubric dietary conflict associated with high protein in plant-feeding cichlids; it does not rule\
      \ out digestive disease."
    sources:
    - *id005
    - *id036
    - *id008
    - *id006
    - *id009
    - *id045
  breeding:
    text: "This is an open-substrate spawner with care by both parents. Field studies describe nests and\
      \ defended schools of young, with reproductive timing linked to the local flood cycle. Parents may\
      \ become substantially more territorial while guarding. Aquarium spawning accounts are limited,\
      \ and simply placing two adults together does not establish a compatible pair. A breeding pair in\
      \ the recommended group may require separation from the third fish. Hybridization adds a separate\
      \ concern: four named species pairs are supported by wild or farm evidence. A pure-species breeding\
      \ project depends on reliable identification and avoids reproductive contact with those congeners."
    sources:
    - *id009
    - *id010
    - *id006
    - *id028
    - *id008
    - *id047
    - *id048
    - *id046
  sexing:
    text: "Mature males may be larger and develop a more prominent forehead, but these clues do not reliably\
      \ sex juveniles or establish a precise female maximum. Body condition can also change apparent shape.\
      \ Studies of the color cycle show that both sexes pass between spotted paca and more strongly barred\
      \ acu appearances as reproductive condition changes. A dark spotted fish should not be labeled female,\
      \ or a bright barred fish male, from appearance alone. Retain uncertainty until sex can be established\
      \ by reliable reproductive observation or expert examination."
    sources:
    - *id006
    - *id010
    - *id046
  compatibility:
    text: "Large companions can be possible, so this species has no absolute species-only restriction.\
      \ Every companion must remain beyond swallowing size, including during juvenile growth and any later\
      \ replacement. Body depth and temperament matter as well as length. A large arowana, robust adult\
      \ oscar or appropriate large catfish is only a conditional option in a system larger than the group\
      \ minimum. Small tetras and dwarf cichlids are prey. More combative Central American cichlids may\
      \ intimidate or injure the bass. Hybrid risks are pair-specific with Cichla monoculus, C. nigromaculata,\
      \ C. ocellaris and C. orinocensis. Wild genetic findings do not establish how frequently those crosses\
      \ occur in ordinary aquaria."
    sources:
    - *id006
    - *id008
    - *id021
    - *id028
    - *id047
    - *id048
  problems:
    text: "Adult space, waste removal and social management require planning before a juvenile is acquired.\
      \ Restricted turning room, insecure lids and unstable heavy decor create avoidable injury risks.\
      \ Chronic poor water quality and contaminated feeder fish can undermine health. Gradual food training\
      \ may be needed after import, while repeated loss of appetite should prompt investigation rather\
      \ than automatic extra feeding. Provisional tolerances of 26 to 31 C, pH 4.3 to 6.5, 0 to 15 dGH\
      \ and 0 to 8 dKH contain the decided natural ranges but do not make every combination of their endpoints\
      \ an appropriate maintenance target. In particular, the KH ceiling lacks strong long-term evidence\
      \ and strongly acidic water must not be forced against high carbonate buffering. Abnormal breathing,\
      \ declining condition or persistent wounds warrant environmental assessment and qualified veterinary\
      \ advice."
    sources:
    - *id006
    - *id008
    - *id021
    - *id049
    - *id011
    - *id012
    - *id022
    - *id037
    - *id023
    - *id039

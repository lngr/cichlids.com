    decision: 2
    rationale: "Generator, checker-b and checker-c proposed 2; checker-a proposed 3, partly from predation\
      \ and a general aggressive rating. Predation is scored separately. Seriously Fish describes moderate\
      \ territorial aggression, while Scott describes successful large-fish communities and vulnerability\
      \ to more combative cichlids. Displacement from territory fits level 2; attacks well beyond a territory\
      \ on comparable-size fish are not established by the stronger species accounts."

    decision: *id061
    rationale: "Generator and checker-a proposed pair; checker-b group with five adults; checker-c group\
      \ with three adults. Field nesting pairs establish the breeding association, not permanent exclusion\
      \ of other adults outside reproduction. Seriously Fish allows species groups and Scott directly\
      \ describes two or three adults in very large aquaria. A managed group of three therefore has better\
      \ numerical husbandry support than an inferred compulsory five. Three is a recommended social unit,\
      \ not a proven aggression-dispersal threshold. A breeding pair can dominate the third fish, so sight\
      \ breaks and separation capacity remain necessary."

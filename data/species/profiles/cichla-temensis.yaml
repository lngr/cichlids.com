  temperatureC:
    value: &id051
      min: 28
      max: 31
    confidence: medium
    rationale: "The tally selects 28 to 31 C by qualified majority, with four of six proposals within\
      \ its agreement threshold. Generator and tiebreaker-1 proposed 28 to 31 C; checker-a 26 to 31 C;\
      \ checker-b 29 to 31 C; checker-c 28 to 32 C; tiebreaker-2 26 to 32 C. Species-specific Balbina\
      \ capture sites measured 29.18 to 30.50 C. Serra and Paz measured 28.9 to 30.7 C in Rio Negro water,\
      \ and JBL recorded 28 to 29 C in the Atabapo wet season and 30.4 C in the dry season. The decision\
      \ is narrower than the 26 to 31 C Venezuelan range reported by checker-a from Winemiller et al.,\
      \ the 29 to 32 C regional band in Thome-Souza et al., and the 28.4 to 34.7 C microhabitat measurements\
      \ in Oliveira and Ferreira. It describes a typical warm-water interval rather than all seasonal\
      \ extrema. JBL also reported an Atabapo surface peak of 32.5 C, and Glaser reported occurrences\
      \ at 22 to 30 C without station details. These broader observations remain in evidence but do not\
      \ establish typical species-wide limits. The Copeia full text was refused as non-open-access by\
      \ fetch-oa, so its checker-a measurements remain unverified here; the accessible secondary Atlas\
      \ account is lower-weight. FishBase 27 to 29 C derives from an aquarium reference, as noted by FWS,\
      \ and is not independent field evidence."

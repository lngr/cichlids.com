        \ takes their rounded bound medians: generator 25 to 31 C, checker-a 26 to 31 C, checker-b 27\
        \ to 31 C and checker-c 25 to 32 C yield 26 to 31 C. Seriously Fish recommends 27 to 29 C; Scott\
        \ supports approximately 25 to 28 C; Guidarium gives 26 to 30 C; AquariumDomain approximately\
        \ 26.7 to 28.9 C. Glaser gives the wider, cooler 23 to 28 C recommendation, which is retained\
        \ but does not establish chronic health at 23 C. The decided upper endpoint contains the natural\
        \ range; neither warm field occurrence nor the juvenile metabolic experiment at 25, 30 and 35\
        \ C establishes years of aquarium health at 31 C. Low confidence reflects this endpoint uncertainty.\

      votes: {agree: 3, total: 3}
  diet:
    value:
      type: invertivore
      bloatSensitive: false
      foods:
        - sinking cichlid pellets with low fat content
        - mysis
        - krill
        - cyclops
        - daphnia
        - brine shrimp
        - spirulina flakes as a supplement
    confidence: medium
    rationale: >-
      The natural diet consists of invertebrates and other edible particles that sand-sifting
      cichlids expose (Rizzo); the Cichlid Room Companion summary lists a detritivore, which fits a
      fish that picks food from stirred-up sediment. Care sheets call it an omnivore (Fishipedia)
      or a meat eater (Garnelio), which describes aquarium feeding. Rizzo advises low-fat dry food,
      small portions, a weekly fasting day and rich live food only every week or two, because the
      fish overeat; no source names bloat as a problem of this species, so the flag is false. The
      food list follows Rizzo's recommendations. Decided unanimously by the vote count (3 of 3 on
      type and flag).
    sources:
      - *rizzo
      - *fishipedia
      - *crc
      - *garnelio
      - &fishipediatz
        kind: database
        title: "Fishipedia: Placidochromis phenochilus tanzania (species sheet of the Tanzanian form)"
        url: https://www.fishipedia.fr/fr/poissons/placidochromis-phenochilus-tanzania

partners:
  suitable:
    - species: Aulonocara stuartgranti
      reason: Peaceful peacock of similar size that also feeds over sand; Rizzo names Aulonocara as good companions.
      condition: Keep the groups in a tank of at least 160 cm; blue peacock males may provoke the blue white lip male.
    - species: Copadichromis borleyi
      reason: Calm utaka that uses the open water above the sand, so the two species hardly compete for space or food.
    - species: Cyrtocara moorii
      reason: Gentle sand dweller that also follows sand-sifting cichlids in the wild and shares the peaceful temperament.
      condition: Tank of at least 180 cm, as C. moorii grows larger.
    - species: Taeniolethrinops praeorbitalis
      reason: Large sand-sifter of the kind this species follows in the lake; together they show the natural feeding association.
      condition: Tank of at least 200 cm with deep fine sand.
  unsuitable:
    - species: Lake Malawi mbuna
      reason: Fast, aggressive rock dwellers such as Maylandia and Melanochromis stress this gentle fish, take its food and prevent normal breeding.
    - species: Melanochromis auratus
      reason: Very quarrelsome mbuna that harasses calm haplochromines in the whole tank.
    - species: Placidochromis electra
      reason: Close relative and look-alike; the hobby warns that the two hybridise, and both belong to the hybrid group placidochromis-electra-complex.
    - species: Tropheus moorii
      reason: Lake Tanganyika algae grazer that needs a plant-based diet, harder water and a species tank.
profile:
  overview:
    text: >-
      Placidochromis phenochilus is a peaceful haplochromine from the north of Lake Malawi, named
      for the white lips of its males. Breeding males turn a rich metallic blue, and older males
      collect irregular pearly blotches on the body. For decades the species was known from a
      single museum specimen; Ad Konings found it alive on the north-western coast of Malawi, and
      it is the fish of the trade called "Mdoka White Lips". The deep blue fish from the Tanzanian
      shore, sold as "phenochilus Tanzania" or "Star Sapphire", belong to an undescribed relative
      and are not covered here. In the wild these fish trail large sand-sifting cichlids and snap
      up what the sifters stir up. In the aquarium they are calm, sociable and suited to a long
      tank with other gentle Malawi cichlids, never with mbuna.
    sources:
      - *cof
      - *oliver
      - *rizzo
      - *fishbase
  habitat:
    text: >-
      The species is endemic to Lake Malawi. The type specimen came from Vua, and the living
      populations lie along the north-western coast of Malawi at Mdoka, Chesese, Chirwa Island and
      between Selewa and Kasinda. It keeps to open sand, where it swims behind large bottom-sifting
      cichlids such as Taeniolethrinops and picks small animals and particles out of the clouds of
      sand they expel. The lake water is warm, soft and moderately alkaline: about 21 to 29 C, pH
      7.7 to 8.6, 3 to 5 dGH and 5 to 8 dKH. The IUCN Red List rates the species as endangered.
    sources:
      - *cof
      - *oliver
      - *rizzo
      - *fishbase
      - *branchu
      - *fao
      - *eccles
  sizeAndGrowth:
    text: >-
      Adult males reach about 16 cm in the aquarium, females stay a few centimetres shorter at
      roughly 13 cm. The wild holotype measured just under 16 cm in total length, and wild fish
      seldom pass 15 cm. Growth is slow: juveniles resemble their parents after about eight months,
      and males take years to show their full colour and thick white lips. Fish that are fed too
      much grow larger and heavier than wild ones, which harms their health.
    sources:
      - *fishbase
      - *fishipedia
      - *rizzo
  husbandry:
    text: >-
      Plan a tank of at least 160 cm length and around 450 L for one male and three females; a
      mixed community deserves more. Cover most of the floor with fine sand and leave a long open
      swimming area, with a few rocks or caves along the back as refuges for brooding females.
      Sturdy plants such as Vallisneria or Anubias can grow at the rear. These fish react badly to
      poor water and low oxygen, so filter strongly, keep good circulation and change a large share
      of the water every week. Keep the temperature at 24 to 27 C and the pH between 7.5 and 8.5.
      Moderately hard water is fine; keep the total hardness at or below about 15 dGH and the
      carbonate hardness between 5 and 12 dKH, so that the pH stays stable.
    sources:
      - *rizzo
      - *garnelio
      - *fishipedia
  socialBehavior:
    text: >-
      This is one of the gentler Malawi haplochromines. A group moves calmly across the sand, and
      the dominant male shows the strongest colour. He courts every ripe female and chases rivals
      and females, but he digs no pit and holds no fixed territory, so injuries are rare when
      there is enough room and each male has two or three females. Towards other species it is
      unassuming and at most displays at fish that come too close. Boisterous tankmates intimidate
      it, take its food and keep it from colouring up or breeding.
    sources:
      - *rizzo
      - *fishipedia
      - *garnelio
  diet:
    text: >-
      In nature it lives on small invertebrates and organic particles that larger cichlids churn up
      from the sand. In the aquarium it accepts nearly every food, so restraint matters more than
      any special item. Base the diet on a sinking cichlid pellet or flake with low fat content,
      and add frozen mysis, krill, cyclops and daphnia. Some spirulina food belongs in the menu,
      even though the fish show little interest in it. Brine shrimp and other rich live food make
      a treat every week or two. Feed small portions and allow one fasting day per week, because
      the fish overeat readily.
    sources:
      - *rizzo
      - *fishipedia
  breeding:
    text: >-
      Placidochromis phenochilus is a maternal mouthbrooder and breeds readily once the fish are
      well conditioned. The male needs no pit or territory: he swims up to a ripe female, the two
      circle over the sand, and she lays her eggs a few at a time and takes them into her mouth,
      where the male fertilises them. The female then hides among rocks or plants and fasts for
      about three and a half weeks. She releases roughly two dozen grey fry of about half a
      centimetre and does not guard them afterwards. In a community most fry are eaten, so move the
      brooding female to a separate tank and let her release the young on her own. The fry take
      brine shrimp nauplii and fine powdered food.
    sources:
      - *rizzo
      - *fishbase
  sexing:
    text: >-
      Mature males are easy to recognise: they are larger, deep metallic blue, and develop the thick
      white lips that give the species its name, and older males gain pearly white patches. Females
      and juveniles are a duller blue-grey, show the faint dark vertical bars more clearly and never
      grow the heavy white lips. Colour takes years to develop fully, so young fish are hard to
      sex; buying a group of six to eight juveniles and keeping one male with several females is
      the practical way.
    sources:
      - *rizzo
      - *garnelio
      - *oliver
  compatibility:
    text: >-
      Good tankmates are calm Malawi cichlids of similar size that do not dominate the sand:
      peacocks such as Aulonocara, utaka such as Copadichromis, and gentle haplochromines like
      Cyrtocara moorii or Protomelas in a large tank. A long tank with a large sand-sifter such as
      Taeniolethrinops recreates the natural feeding association. Avoid mbuna and other rough rock
      dwellers, which harass it and eat its share. Do not combine it with Placidochromis electra:
      the two are close relatives and the hobby warns that they hybridise. Keep it apart from the
      Tanzanian "phenochilus" and the 'gissel' form as well, so that the lines stay pure. Large
      piscivores can eat juveniles, and fish from other lakes or with plant-based diets have
      different needs.
    sources:
      - *rizzo
      - *fishipedia
      - *sfelectra
  problems:
    text: >-
      The most common mistake is housing this gentle fish with mbuna, where it hides, loses colour
      and goes hungry. Overfeeding comes second: the fish eat whatever they are given, and fatty
      food or too much rich live food leads to obesity and poor health, so keep portions small.
      Nitrate build-up and low oxygen show as dull colour and rapid breathing; large weekly water
      changes and strong circulation prevent most of this. A faulty heater is a real danger: a
      forum member lost a fish of this name when the tank reached about 34 C. Mixing it with P.
      electra or with other phenochilus forms produces hybrids.
    sources:
      - *rizzo
      - *thread28033

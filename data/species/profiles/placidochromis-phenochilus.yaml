  ph:
    value: {min: 7.7, max: 8.6}
    confidence: high
    rationale: >-
      Lake Malawi endemic; the surface water of the lake has a pH of 7.7 to 8.6 (Jackson et al.
      1963 in the FAO source book). Branchu et al. (2010) measured 7.5 to 8.5 over the whole water
      column, the lower values belonging to deep water the species does not use.
    sources: *lakesources
    evidence:
      - source: *fao
        value: {min: 7.7, max: 8.6}
        note: lake surface water
      - source: *branchu
        value: {min: 7.5, max: 8.5}
        note: whole water column, lower values in deep water
    verification:
      method: waterbody
      waterbody: lake-malawi
    tolerance:
      value: {min: 7.5, max: 8.6}
      confidence: medium
      rationale: >-
        All care sources ask for alkaline water: Fishipedia and Garnelio 7.5 to 8.5, Sims Tropical
        Fish 7.8 to 8.6, Ron's Cichlids 7.4 to 8.4, and Rizzo aims at pH 8 for the blue
        Placidochromis. Seriously Fish gives 7.6 to 8.8 for P. electra. The tolerance spans the
        species-specific recommendations and contains the lake range. Decided unanimously by the
        vote count (3 of 3 within 0.3 pH): the generator and checker-a proposed 7.5 to 8.6,
        checker-b 7.4 to 8.6, and the median of the agreeing bounds is 7.5 to 8.6.
      sources:
        - *fishipedia
        - *rizzo
        - *sfelectra
        - *garnelio
        - *sims
        - *rons
      evidence:
        - source: *fishipedia
          value: {min: 7.5, max: 8.5}
          note: aquarium recommendation
        - source: *rizzo
          value: {min: 8, max: 8}
          note: single target value for the aquarium
        - source: *sfelectra
          value: {min: 7.6, max: 8.8}
          note: aquarium recommendation for the close relative P. electra
        - source: *garnelio
          value: {min: 7.5, max: 8.5}
          note: aquarium recommendation
        - source: *sims
          value: {min: 7.8, max: 8.6}
          note: retailer care sheet
        - source: *rons
          value: {min: 7.4, max: 8.4}
          note: retailer care summary
      verification:
        method: unanimous
        votes: {agree: 3, total: 3}
  ghDgh:
    value: {min: 3, max: 5}
    confidence: high
    rationale: >-
      Lake Malawi endemic; the calcium and magnesium of the lake correspond to 3.2 to 4.9 dGH in the
      1960s titrations (Jackson et al. 1963, Talling and Talling 1965) and 4.2 to 4.6 dGH in the
      upper 50 m of the north basin (Branchu et al. 2010). Care sheets that call the lake water
      hard confuse hardness with alkalinity.
    sources: *lakesources
    evidence:
      - source: *fao
        value: {min: 3.2, max: 4.9}
        note: calculated from lake calcium and magnesium
      - source: *branchu
        value: {min: 4.2, max: 4.6}
        note: north basin, upper 50 m
    verification:
      method: waterbody
      waterbody: lake-malawi
    tolerance:
      value: {min: 3, max: 15}
      confidence: low
      rationale: >-
        A conservative decision of the vote count (no qualified majority, confidence low). The five
        votes proposed 3 to 20 dGH (generator, checker-a), 3 to 15 dGH (checker-b) and 3 to 25 dGH
        (tiebreaker-1, tiebreaker-2); all start at the soft lake water, but their upper bounds
        spread over 10 dGH. The vote count takes the intersection of all proposals, 3 to 15 dGH, the
        narrower range that triggers more warnings. The care sources themselves differ widely:
        Fishipedia gives 8 to 15 dGH, Rizzo about 20 degrees of hardness, Garnelio 5 to 25 dGH, and
        for the close relative P. electra Seriously Fish gives 10 to 25 and FishBase 9 to 19 dGH. The
        upper bound of 15 dGH is the one that Fishipedia and the most cautious vote share; harder
        water is reported as kept but is not covered by the decided range. The lower bound is the
        lake water, in which the species lives permanently.
      sources:
        - *fishipedia
        - *rizzo
        - *sfelectra
        - &fbelectra
          kind: database
          title: "FishBase species summary: Placidochromis electra"
          url: https://www.fishbase.se/summary/Placidochromis-electra.html
          archived: fishbase.se/summary/placidochromis-electra.html/2026-10-14T102410Z
          accessed: 2026-10-13
        - *branchu
        - *fao
        - *garnelio
      evidence:
        - source: *fishipedia
          value: {min: 8, max: 15}
          note: listed under habitat but far above the lake hardness; aquarium figure
        - source: *rizzo
          value: {min: 20, max: 20}
          note: single target hardness for the aquarium, in degrees dH
        - source: *sfelectra
          value: {min: 10, max: 25}
          note: aquarium recommendation for the close relative P. electra
        - source: *fbelectra

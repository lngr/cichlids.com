  maxSizeCm:
    value: {male: 16, female: 13}
    confidence: medium
    rationale: >-
      The holotype, a wild male, measures 15.7 cm total length (FishBase). Rizzo reports that wild
      fish rarely exceed 15 cm and that well-fed aquarium fish grow slightly larger; Fishipedia
      gives about 14 cm with dominant males to 16 cm, and Garnelio 12 to 14 cm. A male of 16 cm is
      therefore the typical well-kept adult. All sources describe smaller females without giving a
      figure, so 13 cm is an estimate from the male sizes. Ron's Cichlids states 8 to 9 inches (20
      to 23 cm) but places the Mdoka fish in Tanzanian waters and deep rocky habitat, so its size
      claim is not followed.
    sources:
      - *fishbase
      - *rizzo
      - *fishipedia
      - *garnelio
      - *rons
    evidence:
      - source: *fishbase
        value: {male: 15.7}
        note: total length of the male holotype
      - source: *rizzo
        value: {male: 15}
        note: wild fish; slightly larger in aquaria
      - source: *fishipedia
        value: {male: 16}
        note: about 14 cm on average, dominant males to 16 cm
      - source: *garnelio
        value: {male: 14, female: 12}
        note: 12 to 14 cm, unsexed
      - source: *rons
        value: {male: 22}
        note: 8 to 9 inches; the same page misplaces the form in Tanzania
  predation:
    value: 1
    confidence: medium
    rationale: >-
      In the lake the species follows large sand-sifting cichlids and picks invertebrates and
      other edible particles from the stirred-up sand (Rizzo); no source reports fish in its diet,
      and FishBase estimates a trophic level of 3.3 from its closest relatives, typical of an
      invertebrate feeder. As a 16 cm haplochromine it takes fry and very small fish within
      reach: Rizzo notes that very few fry survive in community tanks. That is level 1. The
      Cichlid Room Companion summary lists a detritivore and Fishipedia a peaceful omnivore, which
      confirms that it is no fish eater. Decided unanimously by the vote count (3 of 3).
    sources:
      - *rizzo
      - *fishbase
      - *fishipedia
      - &crc
        kind: database
        title: "Cichlid Room Companion: Placidochromis phenochilus (public summary, verification only)"
        url: https://cichlidae.com/species.php?id=Qyn97j5IDaw5Y2-_8FJDeg
        accessed: 2026-10-13
      - *garnelio
      - &glaser
        kind: website
        title: "Aquarium Glaser (wholesaler): Placidochromis sp. \"Phenochilus Tanzania\" (Frank Schäfer, 2010)"
        url: https://www.aquariumglaser.de/en/fish-archives/placidochromis_sp_phenochilus_tanzania__en
        archived: aquariumglaser.de/en/fish-archives/placidochromis_sp_phenochilus_tanzania__en/2026-10-14T102446Z
        accessed: 2026-10-13
    evidence:
      - source: *rizzo
        value: 1
        note: feeds on invertebrates from sifted sand; few fry survive in community tanks
      - source: *fishbase
        value: 1
        note: estimated trophic level 3.3, typical of an invertebrate feeder
      - source: *fishipedia
        value: 0
        note: peaceful omnivore, no mention of eating fish
      - source: *crc
        value: 0
        note: summary lists a detritivore
      - source: *garnelio
        value: 1
        note: carnivorous; other fish only conditionally compatible
      - source: *glaser
        value: 1

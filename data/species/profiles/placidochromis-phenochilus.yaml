        Tanzanian waters, so its size claim is not reliable.
    - field: features.aggressionConspecific
      proposals:
        - by: generator
          value: 1
        - by: checker-a
          value: 2
        - by: checker-b
          value: 2
      decision: 2
      rationale: >-
        The polygamous males court and chase every ripe female, and two care sheets describe
        territorial males, which is why all sources advise several females per male. Regular chasing
        with rare injuries fits level 2 better than the short displays of level 1.
    - field: features.aggressionHeterospecific
      proposals:
        - by: generator
          value: 0
        - by: checker-a
          value: 1
        - by: checker-b
          value: 1
      decision: 1
      rationale: >-
        The fish is gentle, but retailer sheets report territorial behaviour of breeding males;
        displays towards fish that come close fit level 1, while level 0 would mean ignoring other
        species entirely.

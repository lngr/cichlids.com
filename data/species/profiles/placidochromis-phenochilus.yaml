  synonyms:
    - name: Haplochromis phenochilus Trewavas, 1935
      note: >-
        Original combination; the unique holotype comes from Vua in the north of Lake Malawi. Eccles
        and Trewavas (1989) left the generic placement open because the only specimen was a dark
        breeding male whose pattern could not be read.
    - name: Cyrtocara phenochilus
      note: Combination listed as a synonym by FishBase; no entry of its own in the Catalog of Fishes.
    - name: Protomelas phenochilus
      note: Combination listed as a synonym by FishBase; no entry of its own in the Catalog of Fishes.
  legacyNames:
    - Placidochromis phenochilus
  note: >-
    The Catalog of Fishes lists Placidochromis phenochilus (Trewavas, 1935) as valid and follows
    Konings (2016) for the genus. Konings found the species alive on the north-western coast of
    Malawi (Mdoka, Chesese, Chirwa Island, between Selewa and Kasinda), saw that it is vertically
    barred and placed it in Placidochromis for its resemblance to P. electra (M. K. Oliver). The
    trade fish "Mdoka White Lips" belongs to this species. The legacy catalog entry and the hobby,
    including the cichlids.com forum archive, use the name phenochilus for the blue fish from the
    Tanzanian shore as well ("phenochilus Tanzania", "Star Sapphire"). That form is an undescribed
    species, listed by the Cichlid Room Companion as Placidochromis sp. 'phenochilus tanzania',
    next to the black-cheeked Placidochromis sp. 'phenochilus gissel'. This profile describes the
    valid species P. phenochilus; values and text rest on sources for the Malawian fish, and
    sources on the Tanzanian form appear only as supporting evidence marked as such.

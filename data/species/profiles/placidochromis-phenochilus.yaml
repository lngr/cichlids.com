        votes: {agree: 2, total: 5}
  khDkh:
    value: {min: 5, max: 8}
    confidence: high
    rationale: >-
      Lake Malawi endemic; the alkalinity of 2.33 to 2.46 meq/L in the north basin profiles
      (Branchu et al. 2010) and 2.00 to 2.59 meq/L after Jackson et al. (1963) corresponds to 5.6 to
      7.3 dKH. Sodium balances part of the bicarbonate, so carbonate hardness exceeds total
      hardness in this lake.
    sources: *lakesources
    evidence:
      - source: *branchu
        value: {min: 6.5, max: 6.9}
        note: converted from alkalinity, north basin
      - source: *fao
        value: {min: 5.6, max: 7.3}
        note: converted from alkalinity after Jackson et al. (1963)
    tolerance:
      value: {min: 5, max: 12}
      confidence: low
      rationale: >-
        Only one species-specific care sheet names a carbonate hardness: Garnelio gives 6 to 12
        dKH. The other care sources state total hardness or pH only. The lower bound is the lake
        minimum of 5 dKH, at which the species lives; the upper bound follows the care sheet. A
        single retailer value is thin support, hence the low confidence. Decided unanimously by the
        vote count (3 of 3, all proposing 5 to 12 dKH).
      sources:
        - *garnelio
        - *branchu
        - *fao
      evidence:

  disagreements:
    - field: taxonomy.synonyms
      proposals:
        - by: generator
          value: [Haplochromis phenochilus Trewavas, 1935, Cyrtocara phenochilus]
        - by: checker-a
          value: [Haplochromis phenochilus, Cyrtocara phenochilus, Protomelas phenochilus]
        - by: checker-b
          value: [Haplochromis phenochilus, Cyrtocara phenochilus, Protomelas phenochilus]
      decision: [Haplochromis phenochilus Trewavas, 1935, Cyrtocara phenochilus, Protomelas phenochilus]
      rationale: >-
        The FishBase synonym list names all three combinations; the Catalog of Fishes lists only the
        original combination. The union is kept.
    - field: taxonomy.note
      proposals:
        - by: generator
          value: The profile covers the Malawian species and the Tanzanian trade form, whose care does not differ.
        - by: checker-a
          value: The profile describes the nominal species; the Tanzanian and gissel forms are undescribed Placidochromis sp.
        - by: checker-b
          value: The Mdoka fish is the species; the Tanzanian fish is a separate undescribed form.
      decision: The profile describes the valid species; the Tanzanian form is the undescribed Placidochromis sp. 'phenochilus tanzania'.
      rationale: >-
        The Catalog of Fishes recognises one species, which Konings found on the Malawian coast, and
        the Cichlid Room Companion lists the Tanzanian fish as a separate undescribed form. A profile
        for the valid name therefore rests on the Malawian fish; sources on the Tanzanian form serve
        only as marked supporting evidence, and its trade names and variant entry are left out.
    - field: variants
      proposals:
        - by: generator
          value: [Mdoka, Tanzania]
      decision: [Mdoka]
      rationale: >-
        Only the generator listed variants. The Tanzanian form is an undescribed species of its own,
        so it is no variant of P. phenochilus.
    - field: features.origin.value.waterbody
      proposals:
        - by: generator
          value: Lake Malawi
        - by: checker-a
          value: Lake Malawi
        - by: checker-b
          value: lake-malawi
      decision: Lake Malawi
      rationale: Both spellings name the same entry of the water body table; the name form is used, as in the other proposals.
    - field: features.origin.value.localities

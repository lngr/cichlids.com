        - by: checker-b
          value: [Vua, Mdoka Reef]
      decision: [Vua (type locality), Mdoka, Chesese, Chirwa Island, between Selewa and Kasinda]
      rationale: >-
        The lists differ in spelling and completeness only; the full list follows the sites of the
        rediscovery as summarised by M. K. Oliver.

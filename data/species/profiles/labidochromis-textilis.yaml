    confidence: low
    rationale: "All agents agree on a small territory, a cave or crevice with its surroundings;
      generator and checker-b set breedingOnly true and checker-a and checker-c false. Seriously
      Fish ties the territorial behaviour of L. caeruleus to spawning, and a species account says
      that wild Labidochromis males hold a cave only in the breeding season. The same account and
      the genus page add that males in the aquarium defend their caves against rivals much more than
      in the wild, and Genner and Turner (2005) report that male mbuna hold territories for long
      periods. The rubric describes adult fish in a tank, where males are in breeding condition most
      of the time, so the claim is treated as permanent. Confidence is low because no source
      observes the territory of this species directly."

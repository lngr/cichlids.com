  hybridGroups:
    value:
      - labidochromis
    confidence: medium
    rationale: "All four votes name the curated genus group labidochromis, which the tally decides
      unanimously; the group lists this species already. Seriously Fish advises against mixing
      Labidochromis species because they may hybridise, Wikipedia and a genus page repeat the
      warning and call the crosses fertile, and Genner and Turner (2005) report fertile hybrids
      between mbuna species in general. No cross of L. textilis with a named partner is reported, so
      the group rests on general warnings and keeps its presumed basis. A thread in the cichlids.com
      archive only concerns the identification of a look-alike and reports no cross."

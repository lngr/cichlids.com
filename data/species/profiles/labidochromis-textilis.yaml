  ph:
    value:
      min: 7.7
      max: 8.6
    confidence: high
    rationale: "Lake Malawi surface water measures pH 7.7 to 8.6 in the titrations of Jackson et al.
      (1963) compiled by FAO. Branchu et al. (2010) give 7.5 to 8.5 for the whole water column of
      the north basin, the lower values belonging to deep water that this shallow rock dweller does
      not use, so the surface range applies."

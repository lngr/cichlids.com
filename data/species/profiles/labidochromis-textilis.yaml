  author: "Oliver, 1975"
  synonyms: []
  legacyNames:
    - Labidochromis textilis
  note: "The Catalog of Fishes lists Labidochromis textilis Oliver, 1975 as valid in its original
    combination without synonyms and gives Likoma Island as the probable type locality, so the
    legacy catalog name is the valid name. Dealers have applied labels such as Marineatus, Samueli
    and Exasperatus to this and other striped Labidochromis; Melanochromis exasperatus is a synonym
    of Labidochromis joanjohnsonae in the Catalog, and the Catalog counts a paratype of that species
    among the paratypes of L. textilis, which explains the mix-ups in older aquarium literature. The
    undescribed forms called textilis blue and textilis cobalt in the Cichlid Room Companion are not
    treated as this species."

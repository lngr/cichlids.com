features:
  origin:
    value:
      continent: Africa
      region: Lake Malawi
      waterbody: lake-malawi
      localities:
        - East central coast from Undu Reef (Tanzania) to Metangula (Mozambique)
        - "Lumbaulo, Mozambique"
    confidence: high
    rationale: "The Catalog of Fishes and FishBase agree that the species is endemic to Lake Malawi, and
      FishBase places it on the east central coast. Two hobby profiles give the stretch from Undu
      Reef in Tanzania to Metangula in Mozambique, and photographs on the describer's page, the
      Cichlid Room Companion and the Cichlid-Forum profile show a wild male from Lumbaulo, which
      lies within that stretch. Generator, checker-a and checker-c also listed Likoma Island as the
      probable type locality of the Catalog of Fishes; it is left out of the localities because the
      type specimens carried no exact label and a species account that reports the IUCN assessment
      states that the fish is absent from Likoma and Chizumulu. The lake itself is certain, so the
      Lake Malawi values decide the natural water ranges."

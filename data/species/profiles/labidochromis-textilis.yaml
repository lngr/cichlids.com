  temperatureC:
    value:
      min: 21
      max: 29
    confidence: high
    rationale: "The species lives only in Lake Malawi, so the lake range applies. Eccles (1974) reports
      21 C in cool inshore water of the windy season and 27 C in the upper 60 m by May, Vollmer et
      al. (2005) give winter mixed-layer values near 23.5 C and summer surface water near 28 C, and
      later campaigns reach 29 C. The fish lives in shallow rocky water, which follows these
      seasonal swings. Aquarium recommendations of 24 to 28 C are no source for the natural range."

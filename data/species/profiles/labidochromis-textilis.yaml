  beginnerSuitability:
    value: moderate
    confidence: low
    rationale: "Generator and checker-a propose moderate, checker-b and checker-c easy. The care itself
      is ordinary mbuna care, and the Cichlid-Forum profile gives a low difficulty rating, a species
      account calls the fish easy by mbuna standards and Seriously Fish rates L. caeruleus easy. The
      same species account aims it at aquarists already familiar with Malawi cichlids, and a genus
      page treats wild single-locality forms as fish for collectors. The fish is rare in the trade,
      the sexes are hard to tell apart, which makes the recommended harem difficult to build, it is
      shy among robust mbuna and must be kept apart from other Labidochromis. These practical
      hurdles outweigh the easy care, so moderate is chosen with low confidence."

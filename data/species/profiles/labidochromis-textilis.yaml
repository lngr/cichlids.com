  khDkh:
    value:
      min: 5
      max: 8
    confidence: high
    rationale: "Alkalinity is 2.33 to 2.46 meq/L in the north basin profiles of Branchu et al. (2010),
      which is 6.5 to 6.9 dKH, and 2.00 to 2.59 meq/L in the 1960s titrations compiled by FAO, which
      is 5.6 to 7.3 dKH, so the range is 5 to 8 dKH. Sodium balances part of the bicarbonate, which
      is why the carbonate hardness exceeds the total hardness."
    sources:
      - kind: literature
        title: "Branchu, P., Bergonzini, L., Ambrosi, J.-P., Cardinal, D., Delalande, M., Pons-Branchu, E.
          et al. (2010). Hydrochemistry (major and trace elements) of Lake Malawi (Nyasa), Tanzanian
          Northern Basin: local versus global considerations. Hydrology and Earth System Sciences
          Discussions 7, 4371-4409"
        url: "https://hess.copernicus.org/preprints/7/4371/2010/hessd-7-4371-2010.pdf"
        accessed: 2026-10-12
        archived: hess.copernicus.org/preprints/7/4371/2010/hessd-7-4371-2010.pdf/2026-10-14T094507Z

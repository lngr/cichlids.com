  compatibility:
    text: "Suitable tankmates are calm Lake Malawi fish that share its water, such as the peacock
      Aulonocara stuartgranti, Astatotilapia calliptera, open-water haplochromines like
      Copadichromis borleyi and gentle small mbuna like Iodotropheus sprengerae. Other Labidochromis
      do not belong in the same tank, since hobby sources warn that species of the genus interbreed
      and their females look alike. Pushy mbuna such as Melanochromis auratus and the zebra mbuna
      outcompete and harass it, and large predatory haplochromines such as Nimbochromis livingstonii
      can swallow a fish of its size. Cichlids from other lakes need different water."

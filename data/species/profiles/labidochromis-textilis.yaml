    tolerance:
      value:
        min: 21
        max: 30
      confidence: low
      rationale: "The four votes agree within 1 C, so the tally decides 21 to 30 C unanimously from the
        median of the minima and of the maxima; the proposals are 21 to 29 C (generator, checker-c),
        21 to 30 C (checker-a) and 20 to 30 C (checker-b). Care sources recommend 24 to 28 C for the
        species and its congeners: the Cichlid-Forum profile about 25.5 to 27.8 C, Seriously Fish 24
        to 28 C for L. caeruleus, the Aquarist Atlas genus page about 23 to 27.8 C and a retailer
        listing 23 to 28 C. All of these lie inside the lake range, which the tolerance contains.
        The upper limit of 30 C is one degree above the lake maximum and rests on the judgement of
        the agents rather than on a tested limit; checker-b's lower limit of 20 C is wider than the
        decision and no source supports it. Confidence is low because the care data are general
        recommendations, mostly for congeners."

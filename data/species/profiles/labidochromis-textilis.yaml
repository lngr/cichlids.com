    confidence: high
    rationale: "Lake Malawi is soft water. Calcium and magnesium of the upper 50 m in the north basin
      (Branchu et al. 2010) give 4.2 to 4.6 dGH, and the 1960s titrations compiled by FAO give 3.2
      to 4.9 dGH, so the range is 3 to 5 dGH. Care sheets that call the lake hard confuse total
      hardness with alkalinity."

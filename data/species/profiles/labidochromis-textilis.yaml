    rationale: "Five of six votes (checker-a, checker-b, checker-c, tiebreaker-1, tiebreaker-2) give an
      invertivore prone to bloat, and the generator proposed an omnivore prone to bloat, so the
      tally decides invertivore by qualified majority. A hobby profile names microinvertebrates as
      the wild food, a species account reports insects and crustaceans picked from crevices after
      the IUCN assessment, and a genus page counts L. textilis among the more carnivorous
      Labidochromis. The Cichlid-Forum profile calls it an omnivore without a stated basis, and
      FishBase only models a trophic level of 2.7 from relatives. Congeners differ: FishBase reports
      mostly midge larvae in L. maculicauda but mostly filamentous algae in L. vellicans, so the

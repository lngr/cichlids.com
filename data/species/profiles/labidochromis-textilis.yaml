  husbandry:
    text: "One male with three females fits a tank of about 150 L on a base of 90 by 45 cm. Stack stones
      into a ridge of caves and narrow gaps along the back and leave an open sandy area in front, so
      that every male can claim a cave of his own. Keepers run the species at 24 to 28 C and pH 7.8
      to 8.6. The lake water is soft, so very hard water is unnecessary, but the fish cope well with
      moderately hard tap water as long as the pH is buffered and stable. Efficient filtration and
      weekly partial water changes keep dissolved waste low, which matters because poor water
      quality favours bloat. Stable decoration and calm surroundings suit this shy fish."
    sources:

partners:
  suitable:
    - species: Aulonocara stuartgranti
      reason: "A peaceful, mid-water peacock of similar size that keepers pair with gentle mbuna; its
        males spar with their own kind, not with this fish."
      condition: Tank of at least 120 cm with the Lake Malawi water values.
    - species: Astatotilapia calliptera
      reason: "A calm, small haplochromine of Lake Malawi that does not compete for caves and tolerates
        the same alkaline water."
      condition: A tank of 120 cm or more so the males can keep apart.
    - species: Iodotropheus sprengerae
      reason: A peaceful dwarf mbuna of similar size and diet that does not push other fish out of their
        caves.
      condition: "Plenty of caves, and only one male of each species."
    - species: Copadichromis borleyi
      reason: "A mild, open-water haplochromine that stays above the rockwork and leaves the picker alone."
      condition: A tank of 150 cm or more.
  unsuitable:
    - species: Labidochromis caeruleus
      reason: "Another Labidochromis. Hobby sources warn that species of the genus may hybridise, and the
        females look alike."
    - species: Melanochromis auratus
      reason: "A fast, pushy mbuna that bullies calm species such as this one."
    - species: Maylandia zebra
      reason: "A hasty, territorial zebra mbuna that outcompetes the shy picker for food and caves."
    - species: Nimbochromis livingstonii
      reason: A predatory haplochromine whose adults eat fish the size of this one.
profile:
  overview:
    text: "Labidochromis textilis is a slender dwarf mbuna of Lake Malawi that Michael K. Oliver
      described in 1975. Adult males are covered with fine horizontal lines of yellow and blue that
      blend into a greenish sheen, and the dorsal fin is mostly blue; the name alludes to this woven
      look. Like the other members of its genus it has a narrow snout with pointed front teeth for
      picking small animals out of rock crevices. It grows to about 9 cm and is one of the calmer
      mbuna. The fish is rare in the trade, and dealers have used labels such as Exasperatus or
      Marineatus for several striped Labidochromis, so offered fish deserve a careful check. It
      needs rockwork with caves, alkaline Malawi water and a tank without other Labidochromis."
    sources:
      - kind: catalog-of-fishes
        title: "Eschmeyer's Catalog of Fishes: Labidochromis textilis"
        url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Labidochromis&species=textilis"
        accessed: 2026-10-17
        archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-6e878ae1/2026-10-17T111709Z

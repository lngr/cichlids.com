  sizeAndGrowth:
    text: "FishBase lists a maximum of 7.7 cm standard length, which corresponds to roughly 9 cm total
      length, and hobby profiles give 3 to 4 inches. Well-kept males reach about 9 cm, and females
      stay slightly smaller at around 8 cm. Growth data for the species are not published. No source
      states its lifespan; five to nine years is an estimate based on other small mbuna."
    sources:
      - kind: database

  socialBehavior:
    text: "By mbuna standards the species is mild. Keeper profiles describe it as peaceful and somewhat
      shy, yet in the aquarium males defend a cave against rival males and court females
      persistently, so a clear hierarchy with regular chasing develops. One male with three or more
      females spreads this pressure; several males share a large tank only when each holds a cave
      out of sight of the others. Towards other species it does little more than display at the
      entrance of its shelter. Robust, fast mbuna drive it away from food and cover, so calm company
      suits it best. Because the sexes look alike, a group of young fish may contain more males than
      intended."
    sources:

  breeding:
    text: "Like all mbuna, the species is a maternal mouthbrooder. A ripe female follows the male to his
      cave, spawns there and gathers the eggs into her mouth, where they are fertilised. She carries
      the brood for about three weeks. Broods in the genus are small; a close relative is reported
      to release about 7 to 18 young, and counts for this species are not published. The fry accept
      crushed flake and newly hatched brine shrimp from the start. Breeding works in a rocky tank
      with one male and several females, and moving a brooding female to a separate tank late in the
      incubation saves more young. Keeping other Labidochromis out of the tank prevents hybrids."
    sources:
      - kind: database
        title: "Cichlid Room Companion: Labidochromis textilis"
        url: "https://cichlidae.com/species.php?id=t7oQ0O02roFRPU6aXm5Szw"

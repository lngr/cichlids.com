  problems:
    text: "Bloat is the main health risk: overfeeding, protein-rich food and accumulated waste trigger
      it in mbuna, so a plant-rich staple, modest portions and regular water changes are the best
      prevention. A shy fish among robust mbuna may be chased from food and lose condition. Trade
      names are confused, so misidentified fish and unwanted hybrids with other Labidochromis are a
      further risk. Sudden changes of pH or temperature stress the fish. A swollen belly, loss of
      appetite or listless behaviour call for a water test and, where needed, advice from a fish
      veterinarian."
    sources:

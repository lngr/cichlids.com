  aggressionConspecific:
    value: 2
    confidence: low
    rationale: "Generator, checker-a and checker-c propose level 2 and checker-b proposes level 1; the
      median is 2. The species-specific sources point to a mild fish: the Cichlid-Forum profile
      calls it peaceful towards its own kind, and a species account describes only mild posturing
      between males. Genus sources and the review of Genner and Turner (2005) describe males that
      defend caves against rivals in the confines of a tank and pursue females persistently, which
      is why Seriously Fish advises several females per male in L. caeruleus. A hierarchy with
      regular chasing and rare injuries in a tank with enough caves and females fits level 2.
      Confidence is low because the two species-specific sources would support level 1."

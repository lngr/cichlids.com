  sexing:
    text: "Males and females are hard to tell apart. The Cichlid-Forum profile treats the species as
      monomorphic and names venting as the only reliable method, which is best left to experienced
      hands. A species account reports that adult males are somewhat larger, more boldly marked and
      show clearer egg spots on the anal fin, and a forum reply mentions three orange egg spots on a
      male, but many mbuna females carry such spots as well. Buying six or more juveniles and
      removing surplus males as they mature is the most practical route to a working group."
    sources:

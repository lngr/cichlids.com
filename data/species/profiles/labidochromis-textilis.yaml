  diet:
    text: "In the lake the fish picks insects, insect larvae, small crustaceans and other tiny
      invertebrates from crevices and from the algal cover of the rocks. A gut content study of the
      species is lacking, and its congeners range from invertebrate pickers to algae grazers. In the
      aquarium it takes prepared food readily. A spirulina flake or mbuna pellet with a good share
      of plant matter makes a sound staple, with frozen mysis, daphnia or brine shrimp as
      supplements. Mbuna in general fatten and develop bloat on rich food, so small portions and no
      mammalian meat are the safe course, although one genus page considers Labidochromis less prone
      to bloat than other mbuna."

  habitat:
    text: "The species is endemic to Lake Malawi and lives along the eastern shore between Undu Reef in
      Tanzania and Metangula in Mozambique; underwater photographs document a population at Lumbaulo
      on the Mozambique coast. The original description named Likoma Island as the probable
      collecting site, but the specimens carried no exact label, and a species account that reports
      the IUCN assessment states that the fish is absent from Likoma and Chizumulu. It inhabits
      shallow intermediate shores, roughly 1 to 15 m deep, where boulders and rubble alternate with
      patches of sand, and it probes the crevices for food. The lake water is soft but moderately
      alkaline, with pH 7.7 to 8.6, 3 to 5 dGH and 5 to 8 dKH, and its temperature ranges from 21 to
      29 C over the year. The IUCN Red List rates the species Least Concern and names siltation from
      eroding catchments as the main threat to its habitat."
    sources:

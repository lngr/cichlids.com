  sexing:
    text: "The sexes look much alike. Adult males usually grow somewhat larger and heavier. Colour is no
      reliable guide: some keepers find males a little brighter outside breeding, others report
      females that are just as red or redder, above all in spawning condition. Young fish cannot be
      sexed by eye, so raising a group and waiting for two fish to pair up is the most dependable
      way to get a true pair."

  husbandry:
    text: A pair needs a tank of about 100 cm and 160 litres; growing a group of youngsters until a pair
      forms calls for 120 cm or more. Use sand as the bottom, since the fish dig pits for their fry,
      and build caves and sight barriers from wood, stones and clay pots. Plants should be sturdy
      and well rooted or kept in pots. Good filtration, plenty of oxygen and regular partial water
      changes matter more than exact chemistry. Most keepers hold the species at 22 to 28 C, pH 6 to
      7.8 and soft to medium-hard water up to about 15 dGH. Wild fish come from very soft, acid
      water and need slow acclimatisation to harder water.

  breeding:
    text: Once a compatible pair exists, breeding is easy. In spawning mood both fish turn deep red,
      clean a flat stone, a pot or a patch of glass and lay several hundred small, sticky eggs
      there. The female mostly tends the clutch while the male guards the surroundings. The larvae
      hatch after two to three days, are carried between pits in the sand and swim freely about a
      week after spawning; the parents stir up the bottom so that the fry can pick out food. Newly
      hatched brine shrimp makes a good first food. In breeding trials, 28 C gave more and healthier
      young than 25 C. Other fish should be removed, or the pair moved to a breeding tank.

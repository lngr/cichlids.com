    accessed: 2026-10-13
  synonyms:
    - name: Hemichromis lifalili Loiselle, 1979
      note: Described from Lake Tumba, Democratic Republic of the Congo; treated as valid in Hemichromis
        and from 2022 in Rubricatochromis, and placed in the synonymy of R. stellifer by Lamboj and
        Koblmüller (2026). Both names stem from the same work of Loiselle (1979), in which stellifer
        appears on an earlier page.
    - name: Rubricatochromis lifalili (Loiselle, 1979)
      note: Combination used from the erection of Rubricatochromis in 2022 until the synonymy.
    - name: Hemichromis stellifer Loiselle, 1979
      note: Original combination, described from Malebo (Stanley) Pool.
  legacyNames:
    - Hemichromis lifalili
  note: 'The Catalog of Fishes (queried on 2026-10-13 for Rubricatochromis and Hemichromis) lists
    Hemichromis lifalili as a synonym of Rubricatochromis stellifer after the revision of Lamboj and
    Koblmüller (2026, Fishes 11: 531); the public part of the Cichlid Room Companion shows the same
    synonymy. Only the abstract of the revision could be read. The revision also assigns Gabonese
    material once placed in stellifer, including former paratypes, to the new R. gabonensis, which
    the Catalog lists from the Ogooué basin and from the Itimbiri, Lomami and Aruwimi drainages of
    the Democratic Republic of the Congo. Many fish sold as "lifalili" in the trade are not this
    species: the wholesaler Aquarium Glaser reports that such stock consists of selected lines of R.
    guttatus or of strains bred from crosses of several Rubricatochromis species, and that the true
    Congo fish hardly ever reaches the trade. Care sheets and hobby reports under the name lifalili
    may therefore describe other jewel cichlids or crosses, which limits their weight in this
    profile.'
names:

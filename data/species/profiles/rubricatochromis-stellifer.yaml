    tolerance:
      value:
        min: 22
        max: 30
      confidence: low
      verification:
        method: median
        votes:
          agree: 3
          total: 6
      rationale: "No qualified majority settles the 6 proposals. generator proposes 22 to 30; checker-a
        proposes 22 to 30; checker-b proposes 22 to 28; checker-c proposes 20 to 33; tiebreaker-1
        proposes 22 to 30; tiebreaker-2 proposes 22 to 32 (C). The rounded median of all minima and
        all maxima is 22 to 30 C. This contains natural 24 to 30 without widening. Confidence is
        low. Husbandry sources cover the lower part: Seriously Fish keeps the species at 23 to 26 C
        and breeds it at 24 to 28 C, AquaInfo gives 22 to 26 C, FishBase handbook data 22 to 24 and
        22 to 26 C, the Nordic cichlid society 22 to 28 C and B-Aqua 22 to 30 C; breeding trials
        find clearly better hatching at 28 C than at 25 C. The wider votes of checker-c (20 to 33 C)
        and tiebreaker-2 (up to 32 C) rest on field extremes, not on long-term keeping. No husbandry
        source documents years above 28 C, so the upper end has habitat support and B-Aqua care
        guidance, without a chronic endpoint trial. The median is plausible around species-linked
        habitat measurements and care guidance, with routine settings better supported than chronic
        health at every edge."

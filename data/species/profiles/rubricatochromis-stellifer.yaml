    rationale: "Unanimous (4 of 4 votes): the generator, checker-a and checker-c proposed 0 to 2,
      checker-b 0 to 0.5 dKH; the median of the bounds gives 0 to 2 dKH. Alkalinity in the Congo
      system is very low: 85 to 235 umol/kg at Brazzaville/Kinshasa (about 0.2 to 0.7 dKH, partly
      organic acids), 195 to 697 umol/kg along the middle main stem (0.5 to 2.0 dKH), about 140
      umol/kg in tributaries and from below detection to 242 umol/L in rivers of the Republic of the
      Congo; the bicarbonate values of the FAO source book give 0.3 to 0.5 dKH. Checker-b's 0 to 0.5
      dKH, inferred from the low conductivity of the Kinshasa streams, fits the acid side streams
      but not the main river, so the wider range is kept."

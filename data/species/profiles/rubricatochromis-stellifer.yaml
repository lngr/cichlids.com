  aggressionConspecific:
    value: 4
    confidence: medium
    rationale: The generator and checker-b proposed level 3, checker-a and checker-c level 4. Seriously
      Fish reports that two adults put together often end with the weaker fish dead, that a formed
      pair soon kills other conspecifics and that a male can harass an unready female to death; a
      breeder in Tropical Fish Hobbyist had to separate an established pair after the male injured
      the female. Killing of rivals and partners unless the fish are separated matches level 4
      rather than level 3, where injuries stem mainly from too little space or cover. Pairs grown
      from a group of juveniles are stable, and outside breeding the fish are calm.

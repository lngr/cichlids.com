  hybridGroups:
    value: [rubricatochromis]
    confidence: medium
    verification:
      method: qualified-majority
      votes:
        agree: 5
        total: 6
    rationale: "Decided by qualified majority (5 of 6 votes): checker-a, checker-b, checker-c and both
      tie-breakers voted for no group, while the generator proposed a new group rubricatochromis
      covering all valid species of the genus. No source documents a cross between R. stellifer (or
      the former H. lifalili) and a named species. The Catalog of Fishes, FishBase and Seriously
      Fish report no hybrids, and the abstract of the 2026 revision describes overlapping characters
      and confused names in the genus but no hybridisation. Two hobby sources point to crossing in
      captive stock: a breeder in Tropical Fish Hobbyist suspects mixed aquarium lines, and the
      wholesaler Aquarium Glaser reports that part of the fish sold as lifalili descend from crosses
      of several jewel species. Neither names parent species, and a group built on genus membership
      alone is not covered by the hybrid group definition. Look-alike jewel cichlids should still
      not share a tank with this species (see partners).
      The curated hybrid-groups.yaml file defines rubricatochromis as a presumed genus-wide aquarium crossing group based on general hobby warnings, suspected mixed domestic ancestry and close taxonomic relationship, without verified crosses for every species pair."

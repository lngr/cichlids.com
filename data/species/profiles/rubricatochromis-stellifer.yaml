  ghDgh:
    value:
      min: 0
      max: 2
    confidence: low
    verification:
      method: unanimous
      votes:
        agree: 4
        total: 4
    rationale: "Unanimous (4 of 4 votes): the generator and checker-b proposed 0 to 1, checker-a 0 to 2
      and checker-c 0.05 to 2 dGH; the median of the bounds, rounded to whole degrees, gives 0 to 2
      dGH. No survey measured hardness at a site with the species, so the value is derived: calcium
      and magnesium at Malebo Pool give 0.3 to 0.5 dGH, the ion data of the FAO source book for Pool
      Malebo and the Congo about 0.5 to 0.6 dGH, and 151 paired calcium and magnesium samples of the
      Borges and Bouillon dataset in the region 0.06 to 1.5 dGH. Conductivity of 1 to 9 uS/cm in the
      Musolo and Mpieme streams and of 20 to 48 uS/cm in the main river at Brazzaville points to
      almost ion-free water, and Lake Tumba is described as very poor in minerals. The confidence is
      low because every figure is a conversion or a regional proxy."

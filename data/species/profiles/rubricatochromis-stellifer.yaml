partners:
  suitable:
    - species: Phenacogrammus interruptus
      reason: Large, fast Congo tetra from the same river system that schools in the upper water and stays
        clear of the pair.
      condition: Tank of at least 140 cm; move the tetras out if the pair turns on them while breeding.
    - species: Synodontis spp.
      reason: Robust, armoured African catfish that cope with being chased.
      condition: Medium-sized species and enough caves for all fish.
    - species: Ancistrus spp.
      reason: Armoured bottom dweller that keeps out of the cichlids' way and tolerates soft water.
      condition: Own caves away from the spawning site.
    - species: Pelvicachromis taeniatus
      reason: West African dwarf cichlid of soft water that can hold its own territory in a large tank.
      condition: Tank of at least 150 cm with many hiding places; remove it when the jewel cichlids breed.
  unsuitable:
    - species: Rubricatochromis guttatus
      reason: Look-alike jewel cichlid of the same genus; the males fight it like a rival, and trade stock
        suggests the two can cross.
    - species: Rubricatochromis bimaculatus
      reason: Look-alike jewel cichlid of the same genus; heavy fights and a risk of crossing.
    - species: Paracheirodon innesi
      reason: Small, peaceful schooling fish that is chased constantly, above all by a breeding pair.
    - species: Maylandia zebra
      reason: Lake Malawi mbuna need hard, alkaline water, and their harem aggression clashes with a
        pair-forming substrate spawner.
    - species: Neocaridina davidi
      reason: Dwarf shrimp are hunted and eaten.
profile:
  overview:
    text: The blood-red jewel cichlid is a small cichlid from the Congo basin that shows a deep red body
      covered in blue spots, most intensely when it breeds. It was long known as Hemichromis
      lifalili, moved to Rubricatochromis in 2022 and since a revision in 2026 counts as part of
      Rubricatochromis stellifer. Much of the stock offered as "lifalili" in shops belongs to other
      jewel cichlids, mostly bred lines of R. guttatus, or comes from crosses. The fish is hardy,
      eats almost anything and cares for its brood with great devotion, but it lives in strict pairs
      and turns very aggressive when spawning. It suits keepers who can give a pair a roomy tank or
      a tank of its own.

  socialBehavior:
    text: This cichlid lives in pairs. The safest way to a pair is to raise five or six juveniles
      together and let two of them choose each other; the others must then leave the tank, because
      the pair will hunt them down. Two adults simply put together often fight until one dies. Even
      in an established pair the male can press the female too hard, for example when he wants to
      spawn again while she still tends fry, so she needs places to hide. Outside breeding the fish
      are fairly calm towards other species, but a spawning pair claims most of the tank and attacks
      anything that comes near.

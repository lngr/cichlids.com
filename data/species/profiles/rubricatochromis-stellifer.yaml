    rationale: "Decided by qualified majority (5 of 6 votes). The agreeing runs proposed 24 to 30 C
      (generator, checker-a, tiebreaker-1), 24 to 31 C (checker-b) and 24 to 32 C (tiebreaker-2);
      the median of their bounds is 24 to 30 C. Checker-c proposed 20 to 33 C as an outer envelope
      of regional readings. Two surveys measured the water where the species was caught near
      Kinshasa: station means of 24.0 to 30.1 C in the Musolo system and 27.75 to 32.2 C in the
      Mpieme River, where the species is linked to the cooler stations I to III and the warmest mean
      comes from an open station without it. The Congo at Brazzaville/Kinshasa averages 27.7 C (+/-
      1.6) over twelve years, Malebo Pool station means lie at 27.6 to 28.2 C, and Borges et al.
      found 27.7 C in the main stem and 26.3 C in tributaries. The sources span more than the
      decided range: single monthly readings at Brazzaville/Kinshasa run from 20.0 to 31.7 C, and
      the FAO source book gives 20 to 25 C for shaded forest waters and up to 32.9 C for Lake Tumba;
      these extremes are not tied to the species. FishBase lists 22 to 24 and 22 to 26 C, but these
      figures come from aquarium handbooks and count for the tolerance only."

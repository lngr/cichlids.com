  sizeAndGrowth:
    text: Grown males reach about 10 cm total length and females slightly less; single dominant males
      may grow to about 12 cm. Young fish grow quickly when fed several small meals a day, pass 2.5
      cm in about two months and then begin to colour up. Pairs may spawn at only about 5 cm, long
      before they are fully grown. In good conditions the fish live about five to eight years.

  habitat:
    text: The species inhabits the Congo basin in the Democratic Republic of the Congo, the Republic of
      the Congo and Cameroon, from Lake Tumba and the Likouala rivers to Malebo Pool and the lower
      Congo. Near Kinshasa it was caught in small forest streams with sandy beds. It prefers quiet
      or slowly flowing water with roots, leaf litter and plants and avoids rapids. The water there
      is warm all year, with means of about 24 to 30 C, almost free of minerals and acid, with pH
      values around 5 to 7 at the sites where it was found. Lake Tumba, home of the former lifalili,
      is a blackwater lake that is probably more acid still. Populations from Gabon and from some
      northern tributaries once included here belong to R. gabonensis.

      - Roter Juwelenbuntbarsch
variants:
  - name: Lake Tumba
    kind: locality
    note: Type locality of the former Hemichromis lifalili, a blackwater lake in the central Congo basin.
  - name: Malebo Pool
    kind: locality
    note: Type locality of Hemichromis stellifer on the Congo River between Kinshasa and Brazzaville.
features:
  origin:
    value:
      continent: Africa
      region: Congo River basin
      waterbody: null
      localities:
        - Lake Tumba (type locality of the former H. lifalili)
        - Malebo Pool (type locality of H. stellifer) and the lower Congo River
        - Mpieme and Musolo rivers near Kinshasa
        - Likouala and Likouala-aux-Herbes rivers (Republic of the Congo)
    confidence: high
    rationale: The Catalog of Fishes places the species in the Congo River basin of the Democratic
      Republic of the Congo, the Republic of the Congo and Cameroon, possibly also in the Central
      African Republic. FishBase gives Malebo Pool, the lower Congo and the Likouala rivers for the
      former stellifer and the Congo basin outside Katanga and the Kasai for the former lifalili,
      whose type locality is Lake Tumba. Fish surveys caught it in the Mpieme and Musolo rivers at
      Kinshasa. Gabonese records and populations of the Itimbiri, Lomami and Aruwimi drainages
      belong to R. gabonensis since the 2026 revision. All runs agree on the Congo basin; their
      lists of localities differ only in detail and are merged here.

  habitatZones:
    value:
      - sand
      - plants
      - wood
    confidence: medium
    rationale: The generator, checker-a and checker-b chose sand, plants and wood; checker-c added rock.
      The species lives in quiet, slow forest creeks, tributaries and lake margins with sandy or
      soft beds, roots, leaf litter and plant cover, and is absent from rapids (FishBase, Seriously
      Fish); the Kinshasa streams where it was caught run over sand. In the tank it digs fry pits in
      the sand and needs cover from plants and wood. It needs a flat surface for the eggs, but a
      stone, a pot or the glass serve equally and the habitat is not rocky, so rock is not a
      required zone.

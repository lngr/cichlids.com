  problems:
    text: The most frequent mistake is to buy two adult fish and expect them to form a pair; this often
      ends with one fish badly injured or dead. A tank that is too small or lacks cover leaves the
      female no escape from an eager male. Many fish sold under this name are other jewel cichlids
      or crosses, so keepers who want the true species should look for stock of documented origin.
      Poor water and a diet of dry food alone lead to pale colours and weaker fish. Wild fish react
      badly to sudden changes in pH and hardness. Cool water during breeding raises the losses of
      eggs and larvae, and fungus can attack fish injured in fights.

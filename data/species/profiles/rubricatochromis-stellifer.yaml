  diet:
    text: In nature the species feeds on aquatic insects and their larvae, worms and small crustaceans;
      plant matter reaches it mainly inside its prey. In the tank it accepts almost all foods. A
      good cichlid pellet or flake can serve as the staple, completed several times a week with
      frozen or live food such as bloodworms, mosquito larvae and brine shrimp, which keep the red
      colour strong. Small portions two or three times a day are better than one large meal, and
      leftovers should be removed.

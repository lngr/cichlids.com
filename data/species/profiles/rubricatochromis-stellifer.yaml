  compatibility:
    text: "Good tankmates are fast, robust fish that use the upper water, such as Congo tetras and other
      large African characins, and armoured catfish such as Synodontis or Ancistrus. In a large tank
      a West African dwarf cichlid can work if each species has its own territory. Do not keep it
      with other jewel cichlids: they look alike, fight like rivals and may cross, as mixed trade
      stock suggests. Small, peaceful fish and dwarf shrimp are chased or eaten. Lake Malawi
      cichlids do not fit in water chemistry or behaviour. When the pair breeds, tankmates may have
      to be taken out."

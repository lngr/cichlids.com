    tolerance:
      value:
        min: 5
        max: 7.8
      confidence: low
      verification:
        method: median
        votes:
          agree: 3
          total: 6
      rationale: "No qualified majority settles the 6 proposals. generator proposes 4 to 7.8; checker-a
        proposes 5 to 7.8; checker-b proposes 6 to 7.8; checker-c proposes 4.2 to 7.8; tiebreaker-1
        proposes 5 to 7.8; tiebreaker-2 proposes 5.1 to 7.8 (pH). The rounded median of all minima
        and all maxima is 5 to 7.8 pH. This contains natural 5.1 to 6.8 without widening. Confidence
        is low. All votes share the upper end: Seriously Fish allows up to 7.8, AquaInfo and
        FishBase handbook data give 6.5 to 7.5, AquariumDomain 6.0 to 7.5, and a breeder reports
        spawning at 7.6. No husbandry source documents long-term keeping below pH 6.0, so the median
        lower end of 5 is close to the species-linked habitat minimum of 5.11 and has no chronic
        aquarium trial. The lower bounds of 4.0 and 4.2 proposed by the generator and checker-c come
        from the blackwater of Lake Tumba and are tied neither to the species nor to aquarium
        experience. The median is plausible as a provisional envelope containing species-linked
        habitat pH and aquarium guidance; the acidic edge is not a routine care target."

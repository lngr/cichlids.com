  ph:
    value:
      min: 5.1
      max: 6.8
    confidence: medium
    verification:
      method: qualified-majority
      votes:
        agree: 4
        total: 6
    rationale: "Decided by qualified majority (4 of 6 votes): checker-a proposed 5.0 to 7.0, checker-b
      and both tie-breakers 5.1 to 6.8; the median of the agreeing bounds is 5.1 to 6.8. The
      generator (4.0 to 7.4) and checker-c (4.2 to 7.8) also included the blackwater of Lake Tumba
      and the near-neutral main stem. The decided range rests on the two surveys that measured pH
      where the species was caught near Kinshasa: station means of 5.11 to 6.06 in the Mpieme River
      and 5.75 to 6.75 in the Musolo system. Malebo Pool station means of 6.2 to 6.8 and long-term
      means of 6.0 and 6.7 at Brazzaville/Kinshasa fit this range. The sources span a wider range
      than the decision: Lake Tumba, type locality of the former H. lifalili, has pH 4.0 to 4.9
      (FEOW) or 4.2 to 5.5 (FAO source book), swamp-draining rivers in the Republic of the Congo
      average 4.4 and tributaries of the middle Congo 4.9 to 5.4, while the main stem reaches 7.4 to
      7.8 and single monthly readings at Brazzaville go up to 8.9. No pH reading tied to the species
      in the central basin was found, so the acid end of its natural range stays uncertain."

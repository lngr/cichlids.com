    rationale: "All four agents chose level 3. Malawi-Guru finds the species too aggressive among its own kind for group keeping and advises one male with two or three females. malawi.si allows one adult male per tank, and einrichtungsbeispiele.de reports heavy fights in tanks that are too small and accepts several males only in very large ones. Aquahaus Gaus describes dominant, space-claiming males. DRTA rates the males as milder than N. venustus, and Ron's Cichlids calls the species mildly aggressive; both read as level 2. Persistent chasing of rivals and females, with injuries when space, cover or ratio are wrong, matches level 3; no source reports killing in a suitable tank."

  hybridGroups:
    value: [nimbochromis]
    confidence: medium
    rationale: "All four votes chose the curated group nimbochromis, so the tally decides it unanimously. The group holds the five valid species of the genus in the Catalog of Fishes and has the basis presumed: Malawi-Guru and the importer Aquarium Glaser warn in general terms, on their N. livingstonii pages, that Nimbochromis species may cross in one tank, and Masonick et al. (2022) recover the genus, sampled with N. linni, as a close monophyletic group. No source reports a cross involving N. linni. A keeper on MonsterFishKeepers kept it with two congeners without mentioning hybrids, which does not show whether young were raised. No other curated group concerns the species, and N. linni is already a member of the group."

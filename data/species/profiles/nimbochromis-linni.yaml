  sizeAndGrowth:
    text: "Well-kept aquarium males reach about 27 cm and females about 23 cm. FishBase gives 25 cm for males, and wild fish can reach about 30 cm. Juveniles in shops measure 5 to 7 cm, look drab and develop the downturned snout only as they grow, so the adult size is easy to underestimate. Any fish below about 9 cm, a third of the male's length, counts as prey."

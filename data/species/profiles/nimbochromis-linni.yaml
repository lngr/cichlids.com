  sexing:
    text: "Adult males grow larger than females and show stronger egg spots and a brighter fin edge. Outside breeding the sexes look much alike, with brown blotches and speckles on a pale ground. In breeding colour the male turns dark blue with a red anal fin that carries a yellow margin and pale egg spots, while the female turns yellowish grey with darker blotches and small red dots. Young fish cannot be sexed reliably, so a group of juveniles or adults of known sex is the way to one male with several females."
    sources:

  territory:
    value: {size: large, breedingOnly: true}
    confidence: low
    rationale: "All four agents chose a large territory held only while breeding, with low confidence. Malawi-Guru and malawi.si report that males are territorial only in a short yearly breeding period, on large rock plateaus or on sand against rocks, and build no sand nest. No source gives an area. The size large is a judgement: a male of about 27 cm that defends a spawning plateau and is the only male in a 200 cm tank claims far more than a cave. The Animal Diversity Web describes the site as a flat rock or sandy patch, which one checker read as small, and Aquahaus Gaus describes males that claim space at all times; both keep the confidence low."

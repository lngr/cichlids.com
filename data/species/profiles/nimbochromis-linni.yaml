  husbandry:
    text: "One male with three females needs a tank of about 600 L, 200 cm long and 60 cm from front to back; Malawi-Guru and DRTA advise 1000 L and 250 cm for lasting success. A rock wall with crevices along the back and open sand in front gives room to swim, retreats for chased fish and flat stones for spawning. Care sheets advise 24 to 27 C and pH 7.5 to 8.5 with steady buffering. The lake itself is soft, and the tolerance of 3 to 15 dGH covers both lake-like water and moderately hard tap water. A large carnivore loads the water heavily, so strong filtration and large regular water changes are part of the care."

  breeding:
    text: "The species is a maternal mouthbrooder with a short breeding period each year. The breeding male turns dark blue and courts females on a flat rock or a patch of sand beside rocks; he digs no crater. The female picks up the eggs as soon as they are laid and takes in the sperm afterwards, so the eggs are fertilised in her mouth. She broods for about 18 to 24 days and guards the fry for several weeks after release. In the tank, spawning follows when a male has three or more females and enough space, and a brooding female does best with cover or in a separate tank."
    sources:

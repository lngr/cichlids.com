  khDkh:
    value: {min: 5, max: 8}
    confidence: high
    rationale: "Lake Malawi alkalinity is 2.33 to 2.46 meq/L in the north basin profiles of Branchu et al. (2010), which is 6.5 to 6.9 dKH, and 2.00 to 2.59 meq/L after Jackson et al. (1963) in the FAO compilation, which is 5.6 to 7.3 dKH, so the lake range is 5 to 8 dKH. Sodium balances part of the bicarbonate, so the carbonate hardness exceeds the total hardness. All four agents proposed this range, and the tally takes it from the water body."

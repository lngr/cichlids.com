  feedingSpeed:
    value: normal
    confidence: low
    rationale: "All four agents chose normal with low confidence. No source rates the feeding pace in tanks. In the lake the fish waits motionless for minutes before it strikes (Konings et al. 2021) and patrols slowly (Malawi-Guru). In tanks Nimbochromis take prepared food readily (a Cichlid-Forum keeper on the genus, Seriously Fish for N. livingstonii), and Ron's Cichlids advises one or two small meals a day. It neither rushes food like mbuna nor loses it to tankmates, so normal is a judgement from this behaviour."

  beginnerSuitability:
    value: moderate
    confidence: medium
    rationale: "All agents chose moderate. The Cichlid Room Companion lists the aquarium level as intermediate, and Wet Spot rates the difficulty as medium. DRTA and einrichtungsbeispiele.de address experienced keepers, while Interaquaristik, Fishipedia and Tropical Freshwater Fish call the fish easy or robust. It is hardy, eats ordinary meaty food and has no special water needs, but it needs a tank of about 600 L, a harem with a single male and tankmates too large to swallow, and the small juveniles in shops hide the adult size. Moderate weighs both sides."

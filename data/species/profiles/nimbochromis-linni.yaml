  maxSizeCm:
    value: {male: 27, female: 23}
    confidence: medium
    rationale: "The proposals for the male were 25, 25, 28 and 28 cm (median 26.5) and for the female 20, 22, 24 and 24 cm (median 23). The sources give 25 cm for males or unsexed fish (FishBase, Imperial Tropicals, Wet Spot, Fishipedia), 28 cm (Ron's Cichlids), up to 30 cm (Konings et al. 2021 for wild fish, malawi.si, DRTA with males of 25 to 30 cm, Interaquaristik) and 32 cm (the breeder Aquahaus Gaus). A typical well-kept aquarium male lies between the 25 cm cluster and the field maximum, so the median is rounded to 27 cm; the 30 and 32 cm figures are maxima, not typical sizes. Females stay a few centimetres smaller (malawi.si, DRTA); Fishipedia gives about 20 cm on average and malawi.si up to about 27 cm, and 23 cm is the median of the proposals. The compatibility check therefore treats fish below about 9 cm as prey."

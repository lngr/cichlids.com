partners:
  suitable:
    - species: Fossorochromis rostratus
      reason: "A large, robust sand-dwelling hap of the same lake that is too big to be eaten and holds its own against a male N. linni."
      condition: Tank of at least 200 cm with open sand and a rock structure.
    - species: Synodontis njassae
      reason: A robust catfish of Lake Malawi for the lower part of the tank; care sheets and an importer name Synodontis catfish as companions.
      condition: "Adult catfish only, since small juveniles fit into the predator's mouth."
    - species: Large Lake Malawi haplochromines and predators
      reason: "Malawi-Guru, DRTA and dealers advise other predators or large, assertive non-mbuna of similar size, which are neither prey nor easily bullied."
      condition: "Large tank with rock barriers and caves, and no other Nimbochromis species."
  unsuitable:
    - species: Nimbochromis polystigma
      reason: "A close relative with almost the same pattern that is treated as a rival, and specialist sources warn that Nimbochromis species may cross."
    - species: Nimbochromis livingstonii
      reason: "Same genus with a similar pattern and size; one keeper reports the two together without trouble, but rivalry between males and an unwanted cross remain the concern."
    - species: Chindongo demasoni
      reason: "A small mbuna of about 8 cm that fits into the mouth of an adult N. linni, whose natural prey is young mbuna."
    - species: Labidochromis caeruleus
      reason: A small mbuna whose juveniles and half-grown fish are within reach of the suction strike.
    - species: Aulonocara
      reason: "Peacocks of about 10 to 15 cm are close to the prey size of an adult and their young are eaten; one importer lists peacocks as tankmates, but the predation risk outweighs this."
profile:
  overview:
    text: "Nimbochromis linni is a large predatory haplochromine endemic to Lake Malawi. Hobbyists know it as the elephant-nose cichlid, because its snout points downward and ends in a mouth that shoots forward like a short trunk. Burgess and Axelrod described it as Haplochromis linni, and the Catalog of Fishes places it in Nimbochromis with N. fuscotaeniatus, N. livingstonii, N. polystigma and N. venustus. Like these relatives it wears a camouflage of brown blotches and speckles; it resembles N. polystigma most and differs mainly in the snout. In the lake it hunts alone and takes young mbuna from rock crevices. Keeping it calls for a tank of about 600 L, one adult male with several females and tankmates too large to be eaten."
    sources:
      - kind: catalog-of-fishes
        title: "Eschmeyer's Catalog of Fishes, species of the genus Nimbochromis"
        url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Nimbochromis"
        accessed: 2026-10-17
        archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-c444a769/2026-10-14T101944Z
      - kind: database

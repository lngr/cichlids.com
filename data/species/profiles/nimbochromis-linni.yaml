  problems:
    text: "The commonest mistake is buying a small, drab juvenile for a tank that cannot hold the adult; the fish needs about 600 L and later eats tankmates that were safe at first. Several males in one tank lead to constant fights and injured fish. Shops sometimes mix up juveniles of similar species, so the downturned snout is worth checking as the fish grows. Heavy feeding and weak filtration foul the water of a large predator quickly, and live feeder fish can bring in parasites. Other Nimbochromis species in the same tank risk crosses."
    sources:

features:
  origin:
    value: {continent: Africa, region: Lake Malawi, waterbody: lake-malawi, localities: [Chizumulu Island, Mbenji Island, Nakantenga Island, Boadzulu Island]}
    confidence: high
    rationale: "The species is endemic to Lake Malawi and occurs around the whole lake on rocky shores and in the intermediate zone between rock and sand, at about 2 to 61 m (Catalog of Fishes, FishBase, Cichlid Room Companion, Animal Diversity Web). The four islands are places where Malawi-Guru, malawi.si and the Cichlid Room Companion show photographed fish. Single fish turn up wherever rock dominates, so the islands are examples of the lake-wide range, not separate populations. A dealer page that places the species in Lake Tanganyika (Quinn's Fins) contradicts every taxonomic source and is an error."

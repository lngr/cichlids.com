  temperatureC:
    value: {min: 21, max: 29}
    confidence: high
    rationale: "The species is endemic to Lake Malawi, so the natural range is the lake range: about 21 C inshore in the cool windy season (Eccles 1974), 23.5 to 28 C in the epilimnion over the year (Vollmer et al. 2005) and up to about 29 C in warm surface water. The FAO compilation gives 23 to 25 C for one survey of surface water, the Animal Diversity Web 23 to 28 C as average surface values and FishBase 23 to 25 C from an aquarium atlas; all lie inside the lake range. The fish lives from 2 m to about 60 m, within the layer these measurements cover. All four agents proposed this range, and the tally takes it from the water body."

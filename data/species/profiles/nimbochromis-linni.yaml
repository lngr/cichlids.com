  diet:
    text: "In the lake N. linni lives on fish, mostly young mbuna. It lowers itself onto a rock with its snout at the edge of a crevice, waits motionless for minutes and then sucks out a fish that comes within reach of its extendable mouth. In the tank it accepts meaty food: small fish, frozen fish, shrimp, krill, mussel, insect larvae and sinking pellets for large carnivores. Moderate portions keep adults from growing fat, and very fatty food is best avoided. Live feeder fish can carry disease."
    sources:
      - kind: literature
        title: "Konings, A. F., Wisor, J. M., Stauffer, J. R. Jr. et al. (2021). Microcomputed tomography used to link head morphology and observed feeding behavior in cichlids of Lake Malawi. Ecology and Evolution 11(9), 4605-4615."
        url: "https://doi.org/10.1002/ece3.7359"
        accessed: 2026-10-17

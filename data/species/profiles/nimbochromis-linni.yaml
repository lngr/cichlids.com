    rationale: "The agents chose brown and blue (generator, checker-a), brown, grey and blue (checker-b) and blue, brown and silver (checker-c), all with the pattern spots. Outside breeding both sexes show large brown blotches and fine speckles on a pale, greyish to silvery ground (Animal Diversity Web, DRTA, FishBase), much like N. polystigma; breeding males turn dark blue with a red anal fin and yellow fin edges and lose the blotches (malawi.si, Malawi-Guru). The pale ground is a background rather than a dominant colour, so brown and blue, the colours of the two phases of the adult male, are kept. The blotched pattern is irregular and counts as spots."

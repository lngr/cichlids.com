  aggressionHeterospecific:
    value: 2
    confidence: medium
    rationale: "All four agents chose level 2. Outside breeding the fish is a calm ambush hunter that patrols alone (Malawi-Guru, Animal Diversity Web); breeding males defend their site against other fish as well. Ron's Cichlids calls it mildly aggressive, Fishipedia moderately aggressive and territorial, Wet Spot and Imperial Tropicals aggressive, and Tropical Freshwater Fish not very aggressive towards other species. A keeper on MonsterFishKeepers kept it with N. livingstonii and N. venustus of similar size in a 180 cm tank without trouble. Chasing other species out of the territory without injuring comparable tankmates is level 2; its threat to small fish is predation and is rated there."

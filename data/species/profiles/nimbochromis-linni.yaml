  habitatZones:
    value: [rock, sand]
    confidence: high
    rationale: "All four agents chose rock and sand. FishBase and the Cichlid Room Companion place the species in rocky and intermediate habitats, and Malawi-Guru, malawi.si and the Animal Diversity Web describe hunting along sediment-free rocky shores and spawning in the intermediate zone on flat rock or on sand next to rocks. It is not an open-water fish. One dealer (Ron's Cichlids) lists vegetated habitats, which no field source supports. Several independent high- and medium-trust sources agree, so the confidence is raised to high."

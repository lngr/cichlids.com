        url: "https://doi.org/10.1002/ece3.7359"
        accessed: 2026-10-17
        archived: doi.org/10.1002_ece3.7359/2026-10-14T122817Z
  habitat:
    text: "The species lives all around Lake Malawi along rocky shores free of sediment and in the intermediate zone where rock gives way to sand. Foraging fish and subadults are seen from about 2 m, breeding adults mostly below 15 m, and FishBase gives a depth range of 2 to 61 m. The hunter moves slowly along the rocks and inspects the crevices where young mbuna hide. Breeding sites lie on large flat rocks or on sand against rocks. The lake water is soft but alkaline, with pH 7.7 to 8.6, 3 to 5 dGH, 5 to 8 dKH and 21 to 29 C over the year; the high pH comes from bicarbonate, not from calcium and magnesium, which many care sheets overlook. Hobby directories show fish from Chizumulu, Mbenji, Nakantenga and Boadzulu Islands."

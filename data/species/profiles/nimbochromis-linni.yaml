  socialBehavior:
    text: "Wild fish live alone and patrol slowly along the rocks. Males hold a site only in the short breeding period and defend it against their own kind and against other fish. In the tank only one adult male belongs with several females, ideally three. Malawi-Guru advises against groups with several males, and in a tank that is too small or bare the male chases rivals and females until they are injured. Outside spawning the fish is calm towards other species, but it drives intruders from its site and needs tankmates of similar size and toughness."
    sources:

  compatibility:
    text: "Suitable tankmates are large, robust Malawi cichlids such as other big haps and predators, large non-mbuna and sturdy catfish like Synodontis. Fish under about 9 cm fit into the mouth of an adult, and young mbuna are its natural prey, so small mbuna, small peacocks and the young of any tankmate are at risk. Other Nimbochromis species look similar and are treated as rivals, and specialist sources warn that the genus may cross in tanks, so one Nimbochromis species per tank is the safe choice. Rock barriers and enough length give weaker fish places to retreat."

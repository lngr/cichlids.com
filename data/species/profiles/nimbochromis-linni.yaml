    tolerance:
      value: {min: 21, max: 29}
      confidence: medium
      rationale: "The votes were 21 to 29 C from the generator, checker-a and checker-c and 21 to 30 C from checker-b; the bounds agree within 1 C, so the tally decides 21 to 29 C unanimously, the median of the agreeing maxima. Care sheets and dealers recommend narrower bands inside the lake range: 22 to 27 C (DRTA), 23 to 25 C (FishBase), 23 to 28 C (Imperial Tropicals, Fishipedia), 24 to 26 C (Interaquaristik, einrichtungsbeispiele.de), 24 to 27 C (Wet Spot), 24 to 28 C (zierfische.de, and Seriously Fish for the congener N. livingstonii) and about 23 to 29 C (Ron's Cichlids). No source names a limit outside 21 to 29 C, and the tolerance has to contain the natural range, so here it equals the lake range; no source reports harm at either end. Confidence is medium because the husbandry figures come from medium- and low-trust sources and FishBase gives an aquarium figure only."

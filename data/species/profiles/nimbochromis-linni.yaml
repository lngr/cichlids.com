    tolerance:
      value: {min: 7, max: 8.8}
      confidence: medium
      rationale: "Six votes were cast: 7.0 to 8.8 by the generator, checker-b and tiebreaker-1, 7.0 to 8.6 by checker-a and tiebreaker-2, and 7.5 to 8.6 by checker-c. Five agree within 0.3 pH, so the tally decides 7.0 to 8.8 by qualified majority (five of six), the median of the agreeing minima and maxima. The lower end rests on FishBase (7.0 to 8.5) and a French care sheet (FishFish.fr, 7.0 to 8.5), while most sheets for the species advise 7.4 or 7.5 to 8.4 or 8.5 (Fishipedia, Wet Spot, Imperial Tropicals, Ron's Cichlids, Interaquaristik, einrichtungsbeispiele.de, DRTA). The upper end of 8.8 follows a care sheet for the species (Tropical Freshwater Fish, 7.5 to 8.8) and the Seriously Fish range of 7.6 to 8.8 for the congeners N. livingstonii and N. venustus, which are kept the same way. Quinn's Fins gives a wider 8.0 to 9.0, but that page confuses the species with fishes of other lakes and carries no weight. The range contains the natural 7.7 to 8.6. Confidence is medium, because the lower limit rests on FishBase alone among high-trust sources and the upper limit partly on congeners."

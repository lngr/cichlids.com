  synonyms:
    - name: Haplochromis linni
      note: "Original combination of Burgess and Axelrod in Tropical Fish Hobbyist 23(5), with holotype USNM 213483 from Lake Malawi."
    - name: Cyrtocara linni
      note: "Combination from the period when most Malawi haplochromines were placed in Cyrtocara, used in older hobby literature and listed as a synonym by FishBase, Wikipedia and Fishipedia. The Catalog of Fishes list of Cyrtocara holds only C. moorii and has no entry for it."
  legacyNames: [Nimbochromis linni, Cyrtocara linni]
  note: "The Catalog of Fishes lists Nimbochromis linni as valid, citing Eccles and Trewavas (1989), Snoeks and Manuel (2004) and Konings (2016). It dates the description to 1974, because the issue of Tropical Fish Hobbyist dated January 1975 was mailed in December 1974; FishBase, Wikipedia and the Cichlid Room Companion give 1975. The Catalog list for the legacy genus Cyrtocara was read as well (archived researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-18c811a1/2026-10-14T095732Z); it files species under their original genus and holds only C. moorii. The legacy catalog listed the species twice, as Nimbochromis linni (entry 405) and as Cyrtocara linni (entry 289)."

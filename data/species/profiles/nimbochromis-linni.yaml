  minTank:
    value: {volumeL: 600, lengthCm: 200, depthCm: 60}
    confidence: medium
    rationale: "The proposals were 600 L at 180 by 55 cm (generator), 600 L at 180 by 60 cm (checker-a), 600 L at 200 by 60 cm (checker-b) and 720 L at 200 by 60 cm (checker-c), with medians of 600 L, 190 cm and 60 cm. For one male with two, three or more females the sources range from about 360 L at 152 cm (Tropical Freshwater Fish) and 473 L (Ron's Cichlids) over 500 L (Fishipedia), 600 L (Interaquaristik, Wet Spot, zierfische.de at 180 cm) and 800 L at 200 cm (einrichtungsbeispiele.de) to 1000 L at 200 cm (Aquahaus Gaus) or 250 cm (Malawi-Guru, DRTA). The volume keeps the median of 600 L. The length is 200 cm instead of the median 190 cm because the sources that give a length name 152 cm and 180 cm once each and 200 cm or more four times, and a tank of 200 by 60 by 50 cm holds the 600 L. No source gives a depth; 60 cm front to back lets a 27 cm male turn. The larger tanks that Malawi-Guru and DRTA ask for are better but are not the minimum the sources share."

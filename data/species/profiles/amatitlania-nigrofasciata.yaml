  khDkh:
    value: {min: 4, max: 12}
    confidence: low
    rationale: >-
      The vote count decided this range with the method median (3 of 5 votes agree, no qualified
      majority). The proposals were generator 3 to 12 dKH, checker-a 3 to 12, checker-b 3.5 to
      4.3, tiebreaker-1 4 to 14 and tiebreaker-2 3.5 to 4.5. The five minima sorted are 3, 3, 3.5,
      3.5 and 4, so the median minimum is 3.5, which rounds to 4 dKH; the five maxima sorted are
      4.3, 4.5, 12, 12 and 14, so the median maximum is 12 dKH. The decided range is slightly
      narrower than the measured and estimated range of the sources, which spans about 3 to 14
      dKH. No alkalinity was measured in the range of the narrow
      species. The only measurement comes from four Costa Rican streams of A. siquia (Wisenden
      1995), and it is read in two ways: Wikipedia reports 63 to 77 mg/L CaCO3 (3.5 to 4.3 dKH) as
      carbonate hardness, while the archived reprint, as read by one vote, gives that figure as
      total hardness and an alkalinity of 107 to 127 mg/L CaCO3 (6.0 to 7.1 dKH). The full text
      is not open access and could not be checked here. Estimates from pH and conductivity give

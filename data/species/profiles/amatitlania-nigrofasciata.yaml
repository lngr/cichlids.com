    rationale: >-
      All three files give level 3. Seriously Fish calls it unsuitable for community tanks: it is
      aggressive and territorial, violent while breeding and beats fish several times its own
      size. Fishkeeper reports breeding pairs attacking any fish in the tank, and Aqua-Fish.net and
      Aquarium-Ratgeber advise only sturdy tankmates of similar size. Because pairs breed almost

      8.0, tiebreaker-1 6.2 to 9.0 and tiebreaker-2 6.2 to 8.0. All five minima are 6.2, so the
      median minimum is 6.2. The five maxima sorted are 8.0, 8.0, 8.5, 8.7 and 9.0, so the median
      maximum is 8.5. All votes share the lower bound from the Río Acahuapa, whose middle and
      upper sites have mean pH 6.2 to 8.0 (6.2 to 8.5 over all sites), most of them slightly acidic
      between 6.2 and 6.8. Lake Amatitlán, the type locality, had period means of 7.7 (1969) and
      7.75 (1985 to 1995); with eutrophication the means rose to 8.3 to 8.9, with single bloom
      readings from 7.2 to 9.5. The votes differed on whether these lake values describe the
      natural habitat; the median bound of 8.5 takes the lake into account without adopting the
      highest bloom readings, which are wider than the decided range. Costa Rican streams of the
      broad concept measured 6.6 to 7.8, and FishBase gives 7.0 to 8.0.

        note: depth estimated
      - source: *fk
        value: {volumeL: 200, lengthCm: 120, depthCm: 40}
        note: length stated, other dimensions assumed

  lifespanYears:
    value: {min: 8, max: 10}
    confidence: medium
    rationale: >-
      Aqua-Fish.net gives up to 10 years or more, Aquarium Guide up to 11 years and Aquarium
      Source 8 to 10 years. No age data from the wild were found. Eight to ten years is the typical
      aquarium lifespan; single fish reach 11.
    sources:
      - *aqf
      - *ag
      - kind: website
        title: "Aquarium Source: Convict Cichlid"
        url: https://www.aquariumsource.com/convict-cichlid
        accessed: 2026-10-12

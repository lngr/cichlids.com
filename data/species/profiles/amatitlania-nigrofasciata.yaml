      waterbody: null
      localities:
        - Lake Amatitlán, Guatemala (type locality)
        - Río Acahuapa basin, Lempa drainage, El Salvador
        - Río Cara Sucia, El Salvador
    confidence: high
    rationale: >-
      The Catalog of Fishes gives Lake Amatitlán as the type locality. FishBase gives the range of
      the narrow concept: Pacific slope from the Río Sucio in El Salvador to the Río Suchiate in
      Guatemala, Atlantic slope from the Río Patuca in Honduras to the Río Jutiapa in Guatemala,
      and expressly excludes Nicaragua, Costa Rica and Panama, whose populations belong to A.
      siquia, A. kanna and A. coatepeque. Field studies record native populations in the Río
      Acahuapa and the Río Cara Sucia in El Salvador. The distribution line of the Catalog entry
      and Seriously Fish (Guatemala to Panama) describe the broad concept. Populations in Mexico,
      the United States, Asia and Australia are introduced.

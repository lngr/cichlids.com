        value: {baseColors: [grey, black], pattern: bars}

  feedingSpeed:
    value: hasty
    confidence: low
    rationale: >-
      No source rates the feeding speed explicitly. Care sheets describe a greedy, unfussy feeder
      that takes any food at once, and archive keepers report convicts competing hard for food,
      although one report describes a convict losing food to a larger Jack Dempsey. Against slow
      or calm tankmates it clears the food quickly, so hasty is the cautious value.
    sources:
      - *sf
      - *aqf
      - kind: archive
        title: cichlids.com forum thread 19
        url: https://www.cichlids.com/disc/read.php?1,19
      - &mkhusb
        kind: model-knowledge
        title: "Model knowledge: general husbandry experience with the convict cichlid"
    evidence:
      - source: *sf
        value: hasty
        note: accepts most foods at once; speed not stated explicitly

  minTank:
    value: {volumeL: 120, lengthCm: 90, depthCm: 35}
    confidence: medium
    rationale: >-
      For one adult pair Seriously Fish considers a base of 90 by 30 cm adequate, FishBase cites a
      German minimum of 80 cm, Aqua-Fish.net names 30 US gallons (113 L), Aquarium-Ratgeber 100 cm
      and 160 L and Fishkeeper 120 cm. Because the pair claims a large territory and breeds almost
      continuously, a tank of 90 cm length, 35 cm depth and about 120 L is the minimum for a pair
      alone; any tankmates need substantially more space.
    sources:
      - *sf
      - *fb
      - *aqf
      - *rg
      - *fk
      - *ag

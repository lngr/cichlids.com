schemaVersion: 1
id: amatitlania-nigrofasciata
legacyIds: [655, 701]
status: described

taxonomy:
  validName: Amatitlania nigrofasciata
  genus: Amatitlania
  species: nigrofasciata
  author: (Günther, 1867)
  source: &cof
    kind: catalog-of-fishes
    title: "Eschmeyer's Catalog of Fishes, species of the genus Amatitlania (online version of 21 Sep. 2026; also queried: Archocentrus, Cryptoheros, Cichlasoma, Heros)"
    url: https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Amatitlania
    accessed: 2026-10-12
  synonyms:
    - name: Heros nigrofasciatus
      note: Original combination, Günther 1867; type locality Lake Amatitlán, Guatemala.
    - name: Cichlasoma nigrofasciatum
      note: Combination used until the late 1990s and in many aquarium books.
    - name: Cichlosoma nigrofasciatum
      note: Misspelt variant of the Cichlasoma combination listed by FishBase.
    - name: Archocentrus nigrofasciatus
      note: Combination used from Kullander and Hartel (1997) until the revision by Schmitter-Soto (2007).
    - name: Cryptoheros nigrofasciatus
      note: Combination of Allgayer (2001).
  legacyNames:
    - Archocentrus nigrofasciatus
    - Cichlasoma nigrofasciatum
  note: >-
    The Catalog of Fishes lists Heros nigrofasciatus Günther 1867 (type locality Lake Amatitlán,
    Guatemala) as valid in Amatitlania. Its lists for Archocentrus, Cryptoheros, Cichlasoma and
    Heros hold no separate valid entry for the epithet, so the legacy entries 655 (Archocentrus
    nigrofasciatus) and 701 (Cichlasoma nigrofasciatum) are one species. This profile follows the
    narrow species concept of Schmitter-Soto (2007), which the Catalog and FishBase use: A.
    nigrofasciata lives on the Pacific slope from the Río Sucio in El Salvador to the Río Suchiate
    in Guatemala and on the Atlantic slope from the Río Patuca in Honduras to the Río Jutiapa in
    Guatemala. Schmitter-Soto described the southern and lake populations as A. siquia (Atlantic
    Honduras to Costa Rica), A. kanna (Atlantic Panama and Costa Rica) and A. coatepeque (Lake
    Coatepeque, El Salvador); his morphological phylogeny places A. coatepeque as sister to the
    other three and A. siquia next to A. kanna. The split is disputed. McMahan et al. (2014) found
    A. coatepeque indistinguishable from A. nigrofasciata and treat it as a synonym, and Artigas
    Azas (2021) treats both A. coatepeque and A. siquia as synonyms; the Cichlid Room Companion
    follows this broad concept, and the distribution line of the Catalog entry (Costa Rica to
    Panama) matches it. The Catalog itself lists all three as valid species, and so does this
    profile. The aquarium convict cichlid descends from captive stock of unknown wild origin, so
    trade fish cannot be assigned to one of these taxa with certainty.


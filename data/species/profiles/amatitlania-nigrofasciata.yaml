  ghDgh:
    value: {min: 4, max: 10}
    confidence: low
    rationale: >-
      The vote count decided this range with the method median (3 of 5 votes agree, no qualified
      majority). The proposals were generator 4 to 20 dGH, checker-a 9 to 20, checker-b 4 to 10,
      tiebreaker-1 3 to 10 and tiebreaker-2 3 to 10. The five minima sorted are 3, 3, 4, 4 and 9,
      so the median minimum is 4 dGH; the five maxima sorted are 10, 10, 10, 20 and 20, so the
      median maximum is 10 dGH. The decided range is narrower than the measured and estimated
      range of the sources, which spans about 3 to 20 dGH, and it rests on no measurement of its
      own. No source measured
      general hardness in the range of the narrow species. The one measurement comes from four
      Costa Rican streams of the broad concept (populations of A. siquia), with a total hardness
      of 63 to 77 mg/L CaCO3, about 3.5 to 4.3 dGH, as read from the archived reprint of Wisenden
      (1995). Estimates from conductivity give about 3 to 10 dGH for the Salvadoran rivers (180 to
      484 uS/cm) and 13 to 17 dGH for Lake Amatitlán (656 to 830 uS/cm); Brezonik and Fox (1974)
      describe the southern Guatemalan lakes as rich in sodium, so the lake estimate is probably
      too high. FishBase gives 9 to 20 dH without a habitat source, likely an aquarium value. The
      natural hardness of the species therefore lies somewhere between soft and moderately hard
      water; the value needs a habitat measurement, and the tolerance of 4 to 25 dGH covers the
      whole span.
    sources:
      - *fb
      - *acahuapa
      - *amdiv
      - *rodas
      - &brezonik
        kind: literature
        title: >-
          Brezonik, P. L. and Fox, J. L. (1974). The limnology of selected Guatemalan lakes.
          Hydrobiologia 45, 467-487 (abstract only).
        url: https://doi.org/10.1007/BF00012032
        accessed: 2026-10-12
      - &wisenden
        kind: literature
        title: >-
          Wisenden, B. D. (1995). Reproductive behaviour of free-ranging convict cichlids,
          Cichlasoma nigrofasciatum. Environmental Biology of Fishes 43, 121-134 (author reprint,
          archived copy).
        url: https://web.archive.org/web/20161225044647/http://web.mnstate.edu/wisenden/reprint%20pdfs/1995%20Reprod%20Behaviour%20EBF.pdf
        accessed: 2026-10-12

  predation:
    value: 1
    confidence: medium
    rationale: >-
      All three votes give level 1 (unanimous). FishBase lists fish among worms, crustaceans,
      insects and plant matter in the natural diet, and stomach contents of 372 fish from an
      introduced population in the Amacuzac River, Mexico, contained fish only as a minor item
      among 26 food categories (Trujillo-Jiménez 1998). The convict is a small generalist with a
      small mouth. Aquarium-Ratgeber reports that adult swordtails live with it while their young
      are eaten, and Aqua-Fish.net warns that much smaller fish may be eaten; Seriously Fish
      reports no piscivory. Fry and fish up to about 2 cm are at risk; very slender fish slightly
      above that size, such as neon tetras, are at risk as well. Larger fish suffer from its
      territorial attacks, which the aggression levels cover.

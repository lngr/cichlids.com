  aggressionConspecific:
    value: 3
    confidence: high
    rationale: >-
      All three files give level 3. A pair forms quickly and then drives all other adults of the
      species away; Seriously Fish advises moving surplus fish once a pair has formed unless the
      tank is large, Aquarium-Ratgeber reports strong aggression among males, and Fishkeeper
      calls the species highly aggressive and advises one pair. In small tanks rivals are chased
      persistently and injured or killed. Several pairs can coexist only in large tanks with
      clear territory borders. Archive reports of newly added conspecifics being attacked agree.

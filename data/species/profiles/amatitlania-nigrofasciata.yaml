      - source: *ag
        value: {min: 11, max: 11}
        note: up to 11 years
      - source:
          kind: website
          title: "Aquarium Source: Convict Cichlid"
          url: https://www.aquariumsource.com/convict-cichlid
          accessed: 2026-10-12
        value: {min: 8, max: 10}

  breeding:
    value: cave-spawner
    confidence: high
    rationale: >-
      All files agree. FishBase reports that eggs are laid on the cleaned surface of a stone,
      preferably inside a dark cavity with one entrance; Seriously Fish describes spawning in caves
      and flowerpots, Fishkeeper agrees and the Cichlid Room Companion lists substrate cave
      breeding. Both parents guard eggs and young and move the larvae into dug pits.
    sources:
      - *fb
      - *sf
      - *fk
      - *crc
    evidence:
      - source: *fb
        value: cave-spawner
        note: dark cavities preferred; eggs also on cleaned rocks
      - source: *sf
        value: cave-spawner
      - source: *crc
        value: cave-spawner
        note: verification

  beginnerSuitability:
    value: easy
    confidence: medium
    rationale: >-
      The species is hardy, undemanding about water and food and one of the easiest cichlids to
      breed. Seriously Fish calls it a great beginner species in many ways and ideal for newcomers
      to breeding, though its structured difficulty rating is moderate because of space,
      temperament and tankmate choice; the Cichlid Room Companion classes it as a beginner species
      and Aquarium-Ratgeber rates it easy in a species tank. Kept as a single pair in a species
      tank, as this profile recommends, its care is easy; the beginner needs a plan for the many
      young.
    sources:

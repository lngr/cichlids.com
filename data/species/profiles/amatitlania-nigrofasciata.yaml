        note: great beginner species in many ways; structured difficulty rating moderate
      - source: *crc
        value: easy
        note: verification
      - source: *rg
        value: easy
        note: in a species tank

partners:
  suitable:
    - species: Xiphophorus hellerii
      reason: Fast, sturdy livebearer that stays in open water; adults are left alone, although their young are eaten.
      condition: Exception to the recommended species tank; adult fish only, tank from 120 cm.
    - species: Rocio octofasciata
      reason: Sturdy Central American cichlid of similar temperament that holds its own against a breeding convict pair.
      condition: Exception to the recommended species tank; at least 150 cm with separate cave zones.
    - species: Astyanax mexicanus
      reason: Fast, tough characin of the upper water layers that serves as a dither fish for Central American cichlids.
      condition: Exception to the recommended species tank; group of six or more adults, tank from 120 cm.
  unsuitable:
    - species: Amatitlania siquia
      reason: Closest relative, formerly the same species and traded as the Honduran red point; crosses are expected and would mix both lines.
    - species: Amatitlania kanna
      reason: Close relative from Atlantic Panama and Costa Rica, formerly part of the convict cichlid; crosses are expected.
    - species: Amatitlania coatepeque
      reason: Lake form that some authors treat as the same species; crosses are expected.
    - species: Hypsophrys nicaraguensis
      reason: Same hybrid group; a captive cross with the convict cichlid is reported, and the two compete for the same caves.
    - species: Paracheirodon innesi
      reason: Small slender tetra that is harassed and eaten.
    - species: Pterophyllum scalare
      reason: Slow, tall-finned cichlid that is chased and nipped by a breeding pair.
    - species: Symphysodon aequifasciatus
      reason: Calm, slow feeder that needs soft, warm water and suffers under constant aggression.
    - species: Parachromis managuensis
      reason: Large piscivore that eats convicts.
    - species: Ancistrus
      reason: Bottom-dwelling catfish that compete for caves and are attacked by breeding convicts.

profile:
  overview:
    text: >-
      The convict cichlid is one of the best-known cichlids in the hobby and has been kept and bred
      for generations. It is a small, deep-bodied fish from northern Central America with bold
      black bars on a grey body. Behind the modest size lies a strong personality: pairs form
      quickly, breed almost without pause and defend their young against fish many times their
      size. That makes it a rewarding fish for anyone who wants to watch parental care up close in
      a species tank, and a poor choice for a peaceful community tank. The valid name is
      Amatitlania nigrofasciata; older books list it as Cichlasoma nigrofasciatum or Archocentrus
      nigrofasciatus, and the legacy catalog of cichlids.com held both names as separate entries.
    sources:
      - *cof
      - *sf
      - *fb
  habitat:
    text: >-
      In the narrow sense used here the species lives on the Pacific slope of El Salvador and
      Guatemala and on the Atlantic slope of Guatemala and Honduras; the populations further south
      belong to A. siquia and A. kanna, and the fish of Lake Coatepeque to A. coatepeque. The type
      locality is Lake Amatitlán in the Guatemalan highlands, but most populations live in streams
      and rivers. There the fish stay in shallow water with loose rocks, crevices, roots and fallen
      branches, avoid open water and retreat into rock cover during floods. Field measurements in
      El Salvador show warm water of about 26 to 28 C, a pH that is often slightly acidic and a
      moderate mineral content, while Lake Amatitlán is cooler, harder and alkaline. The hardness
      of the habitat waters has not been measured directly.
    sources:
      - *fb
      - *carasucia
      - *acahuapa
      - *amdiv
      - *rodas
  sizeAndGrowth:
    text: >-
      Males usually reach 12 to 13 cm total length in the aquarium and females 8 to 10 cm;
      exceptional males grow to about 15 cm. Juveniles grow fast and often become sexually mature
      within a few months, while still well below full size. Older males develop longer, pointed
      dorsal and anal fins and may form a small fatty bump on the forehead. Females stay noticeably
      smaller and rounder. With good care the species lives about eight to ten years.
    sources:
      - *fb
      - *sf
      - *aqf
      - *ag
      - *wikide
  husbandry:
    text: >-
      A single pair needs a tank of at least 90 cm length and about 120 litres, and a species tank
      is the recommended setup. Build several caves from rocks, roots or clay pots laid on their
      side, and use a sand or fine gravel bottom, because the fish dig pits to park their young.
      Plants are often uprooted, so choose tough species attached to wood or rock. The species
      adapts to most tap water: soft to hard (about 4 to 25 dGH), with a pH of 6.0 to 8.5 and 20 to
      30 C; 24 to 27 C suits everyday keeping, the warmer end triggers breeding. Strong filtration
      and regular large water changes keep the heavy feeders and their broods healthy.
    sources:
      - *sf
      - *aqf
      - *rg
      - *fb
      - *fk
  socialBehavior:
    text: >-
      Convicts live in monogamous pairs. Once a pair has formed, both partners defend their cave
      and the surrounding area against any other fish, and because they spawn so often this
      defence is almost permanent. Other adults of the species are chased hard; in a small tank
      the weaker fish are injured or killed, so surplus fish should be moved once a pair has
      settled. Towards other species they are just as bold and attack fish far larger than
      themselves. Only in large tanks with visual barriers do they share space with sturdy Central
      American cichlids.
    sources:
      - *sf
      - *rg
      - *aqf
      - *fk
  diet:
    text: >-
      In the wild the species eats mostly aquatic insect larvae, along with worms, small
      crustaceans, algae, plant debris and occasionally small fish. In the aquarium it accepts
      practically everything: cichlid pellets and flakes, frozen foods such as mysis and brine
      shrimp, and vegetable foods such as blanched peas or spinach. A varied diet with a plant
      share keeps the fish in good condition, and one-sided feeding with red mosquito larvae alone
      is best avoided. Fry are easy to raise on newly hatched brine shrimp and crushed flakes.
    sources:
      - *trujillo
      - *fb
      - *sf
      - *aqf
      - *rg
  breeding:
    text: >-
      Breeding is easy and often happens without any help. A pair cleans the inside of a cave or a
      stone, and the female attaches up to about 300 eggs, fewer in young fish. She tends the
      clutch while the male guards the territory. The larvae hatch after three to four days and are
      moved into pits in the substrate, then swim free after about another week. Both parents lead
      the school of fry for several weeks and defend it fiercely. Plan ahead for the young: pairs
      may spawn every month, and shops often refuse convict fry because supply far exceeds demand.
    sources:
      - *sf
      - *fb
      - *aqf
      - *wikide
  sexing:
    text: >-
      Adult males are larger, have a steeper forehead that may carry a fatty bump, and grow longer,
      pointed dorsal and anal fins. Females remain smaller and show orange to pinkish scales on the
      lower flank and belly, which brighten before spawning, as well as a dark spot in the dorsal
      fin. In the pink form the orange belly patch of the female is visible as well. Unusually among
      cichlids, the female is the more colourful sex.
    sources:
      - *sf
      - *wiki
      - *aqf
  compatibility:
    text: >-
      This is no community fish, and the hobby recommends a species tank with one pair. As an
      exception for experienced keepers, convicts can share tanks of 150 cm or more with other
      sturdy Central American cichlids of similar or larger size and with fast, tough fish of the
      upper water layers such as adult swordtails. Avoid small or slender fish that fit into the
      mouth, slow and long-finned species such as angelfish, bottom-dwelling catfish that compete
      for caves, and large predatory cichlids that would eat the convicts. Never keep them with
      their closest relatives A. siquia (the Honduran red point), A. kanna or A. coatepeque: these
      formed one species until 2007 and are expected to cross. The Nicaragua cichlid, Hypsophrys
      nicaraguensis, is reported to have crossed with the convict cichlid in aquaria and does not
      belong in the same tank either.
    sources:
      - *sf
      - *fk
      - *aqf
      - *rg
      - *cof
      - *pfk
  problems:
    text: >-
      The most common mistake is placing convicts in a community tank because they are sold small
      and cheap; once a pair forms, tankmates are injured or killed. A second problem is the
      endless stream of fry: unwanted young must never be released into the wild, where the species
      has become invasive in many countries. Overcrowded tanks with constant breeding lead to poor
      water quality and stress. Overfeeding fouls the water quickly, so feed moderately and include
      plant matter. Fights between rivals cause torn fins and wounds that may become infected in
      dirty water.
    sources:
      - *sf
      - *fb
      - *trujillo
      - kind: archive
        title: cichlids.com forum thread 942
        url: https://www.cichlids.com/disc/read.php?1,942
      - kind: archive
        title: cichlids.com forum thread 8075
        url: https://www.cichlids.com/disc/read.php?1,8075


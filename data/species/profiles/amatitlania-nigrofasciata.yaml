variants:
  - name: Pink convict (white convict)
    kind: color-morph
    note: Leucistic aquarium form with a pale pink to white body and only faint bars; it breeds true and is as aggressive as the wild colour.
  - name: Marbled convict
    kind: color-morph
    note: Aquarium form with irregular dark blotches in place of regular bars.
  - name: Long-finned convict
    kind: color-morph
    note: Aquarium form with elongated fins, which tear easily in fights.


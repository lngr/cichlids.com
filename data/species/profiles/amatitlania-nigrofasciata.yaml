    value: [amatitlania-nigrofasciata-complex, amatitlania-nigrofasciata-hypsophrys-nicaraguensis,
      amatitlania-nigrofasciata-thorichthys-meeki, cryptoheros-spilurus-amatitlania-nigrofasciata,
      nandopsis-tetracanthus-amatitlania-nigrofasciata]
    confidence: low
    rationale: >-
      The convict cichlid is a member of the presumed group of the four Amatitlania species
      described from its range, which rests on their very close relationship (Schmitter-Soto 2007);
      no cross among them is documented. The presumed two-member group
      amatitlania-nigrofasciata-hypsophrys-nicaraguensis covers the Nicaragua cichlid, with which
      Seriously Fish reports a captive cross without source or circumstances. The presumed
      two-member group amatitlania-nigrofasciata-thorichthys-meeki covers the firemouth, Thorichthys
      meeki: an aquarist reported that a firemouth female kept without a male of her own species
      spawned with a convict male and raised young, and a 1982 paper describes hybrids of the two
      species, though only its title could be read.
      The curated data/species/hybrid-groups.yaml file defines
      cryptoheros-spilurus-amatitlania-nigrofasciata as presumed, based on a specialist article
      citing older reports of fertile offspring and a forum archive thread repeating a crossing
      claim, both without known parental origin or partner choice. The historical spilurus label
      may refer to C. chetumalensis or C. cutteri, leaving the parental identity uncertain.
      The curated data/species/hybrid-groups.yaml file defines
      nandopsis-tetracanthus-amatitlania-nigrofasciata as a presumed pairwise crossing group
      based on unverified hobby reports of captive offspring labelled as Cuban cichlid and
      convict crosses, with uncertain convict species identity, parentage and access to
      conspecific mates.

  temperatureC:
    value: {min: 22, max: 29}
    confidence: low
    rationale: >-
      The vote count decided this range with the method median (3 of 5 votes agree, no qualified
      majority). The proposals were generator 20 to 29 C, checker-a 22 to 31 C, checker-b 24 to 29
      C, tiebreaker-1 21 to 30 C and tiebreaker-2 26 to 29 C. The five minima sorted are 20, 21,
      22, 24 and 26, so the median minimum is 22 C; the five maxima sorted are 29, 29, 29, 30 and
      31, so the median maximum is 29 C. The median range follows the measurements better than the
      intersection of all proposals (26 to 29 C), which would cut off the cooler lake water. The
      upper part agrees with the measured site means of the middle and upper Río Acahuapa (26.1 to
      28.5 C at 185 to 519 m), where the species belongs to the fish assemblage, and with the daily
      range of 26 to 29 C reported for four Costa Rican streams of the broad concept. The measured
      habitat range of the sources is wider than the decided range, about 20 to 31 C: Lake
      Amatitlán, the type locality at about 1,190 m, had period means of 19.9 C (1910) to 25.0 C
      (2008 to 2013), monthly surface readings of 22.1 to 29.2 C in 2017 and 21 to 23 C in the cool
      months of turnover, and the lowland sites of the Río Acahuapa reach 30 to 31 C. The values
      below 22 C and above 29 C lie in the tolerance. FishBase lists 20 to 36 C after Costa Rican
      material and feral populations in heated outflows; German Wikipedia gives 20 to 35 C without
      a measurement. Neither describes the native habitat of the narrow species.

  compatibility:
    text: "The decided stocking default excludes other species. Both mouth-fit predation and severe territorial\
      \ aggression matter, so being too large to swallow does not ensure safety. Published accounts allow exceptionally\
      \ robust companions, and Murphy and Block described coexistence with catfish in a large aquarium. Those exceptions\
      \ explain the low-confidence species-only decision but do not create routine suitable-partner recommendations.\
      \ Small tetras, dwarf cichlids and delicate large fish are poor choices. No substantiated hybrid group was\
      \ identified; that evidence gap does not prove reproductive isolation."
    sources:

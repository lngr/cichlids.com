    confidence: "low"
    rationale: "Qualified majority, 5 of 6 votes, fixes 24 to 30 C after integer rounding of the agreeing proposal\
      \ bounds. The wider measured Rokel/Seli source envelope is 23.5 to 30.2 C, from Konoyima and Barrie; the decided\
      \ interval is not its full union. Waanje reports 23.2 to 25.6 C, Wanjei 26.5 to 32.3 C and the older FAO Jong\
      \ directory 28 to 34 C. These additional rivers do not establish occupied microhabitats at the extremes. The\
      \ tally retains the Rokel-based selection rather than the broader regional envelope. Field temperature and\
      \ pH remain useful although some ionic rows in these studies are problematic. FishBase confirms native Rokel\
      \ occurrence, but none of the water studies measured identified individuals alongside the endpoints. Confidence\
      \ stays low. Proposals: generator 23.5 to 30.2; checker-a 23 to 28; checker-b 23.9 to 30.2; checker-c 23.5\
      \ to 30.2; tiebreaker-1 23.9 to 30.2; tiebreaker-2 23.5 to 30.2."

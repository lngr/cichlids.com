    rationale: "The tally considers four proposals unanimous within 2 dKH and rounds their median bounds to 0 to\
      \ 1 dKH at low confidence. This plain natural-water fact carries no verification object. The rounded interval\
      \ is narrower than Waanje's 0 to 2 dKH, excludes Livingstone's approximately 1.19 dKH Sonapiti reading and\
      \ slightly truncates the BEDGIS 1.01 dKH upper value. Zero is a rounding result. Bicarbonate or measured alkalinity\
      \ is converted to equivalent carbonate buffering, with no GH or conductivity substitution. Jong groundwater\
      \ and the inconsistent total-alkalinity row are excluded, as is the potentially estuarine JON 1 station. The\
      \ resulting interval is an uncertain regional summary. Proposals: generator 0.2 to 1.2; checker-a 0 to 2;\
      \ checker-b 0.3 to 1.1; checker-c 0.2 to 0.8."

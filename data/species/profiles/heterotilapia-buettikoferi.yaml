profile:
  overview:
    text: "The zebra tilapia combines striking vertical bands with the strength and territorial behaviour of a large\
      \ adult cichlid. Heterotilapia buettikoferi is the accepted name; the former Tilapia name and several spelling\
      \ variants remain common in trade. Its native home is coastal West Africa. This profile recommends a dedicated\
      \ aquarium for one adult, with experienced care and a long-term space commitment."
    sources:
    - kind: "catalog-of-fishes"
      title: "Eschmeyer's Catalog of Fishes: species of Heterotilapia"
      url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Heterotilapia"
      archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-a0ed1ff6/2026-10-14T100723Z
      accessed: "2026-10-13"
    - kind: "database"
      title: "FishBase species summary: Heterotilapia buettikoferi"
      url: "https://www.fishbase.se/summary/Heterotilapia-buettikoferi.html"
      archived: fishbase.se/summary/heterotilapia-buettikoferi.html/2026-10-14T100723Z
      accessed: "2026-10-13"
    - kind: "database"
      title: "My-fish Fishothek: Heterotilapia buettikoferi, Zebratilapia"
      url: "https://my-fish.org/my-fishothek/tilapia-buttikoferi-zebratilapia/"
      archived: my-fish.org/my-fishothek/tilapia-buttikoferi-zebratilapia/2026-10-14T100730Z
      accessed: "2026-10-13"
  habitat:
    text: "Adults inhabit rocky channels of larger coastal rivers from Guinea-Bissau to western Liberia, including\
      \ Guinea and Sierra Leone. Regional river studies indicate warm and often very soft water with seasonally\
      \ variable pH. The selected natural ranges summarize regional evidence and have been rounded or decided by\
      \ median voting; they do not enclose every published measurement. Exact water conditions beside identified\
      \ fish at the study endpoints remain unknown."
    sources:
    - kind: "database"
      title: "FishBase species summary: Heterotilapia buettikoferi"
      url: "https://www.fishbase.se/summary/Heterotilapia-buettikoferi.html"
      archived: fishbase.se/summary/heterotilapia-buettikoferi.html/2026-10-14T100723Z
      accessed: "2026-10-13"

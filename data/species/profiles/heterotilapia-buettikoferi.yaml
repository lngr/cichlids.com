  sexing:
    text: "The sexes share the barred colour pattern. Adult males commonly grow larger and may develop a more prominent\
      \ forehead, but neither clue reliably sexes juveniles. Observed egg deposition provides clearer identification\
      \ of the female than size or colour alone. Sex identification does not establish that two adults will form\
      \ a safe pair."

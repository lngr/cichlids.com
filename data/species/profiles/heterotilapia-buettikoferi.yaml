  maxSizeCm:
    value:
      male: 30
      female: 25
    confidence: "medium"
    rationale: "Generator and checker-b proposed 35 cm male and 30 cm female; checker-a and checker-c proposed 30\
      \ and 25. Choose 30 and 25 as typical aquarium planning maxima, matching Bailey's usual male length and the\
      \ observed 28 to 30 cm male and 25 cm female in Murphy and Block. Aqua-Fish lists unsexed adults at 28 to\

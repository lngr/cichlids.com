      rationale: "The proposals in vote order are 5.4 to 8, 6 to 8, 5.8 to 8, 5.4 to 8, 5.8 to 8, 5.4 to 8.6\
        \ (pH). Without a qualified majority, the medians of all proposed minima and maxima are 5.6\
        \ and 8, rounded to 5.6 to 8 pH. The median 5.6 to 8 pH contains the natural 5.6 to 8 range\
        \ without widening. LiveAquaria and Tropical Fish Site give 7.8 to 8.6, but their alkaline\
        \ extreme lacks chronic-health verification. Aqua-Fish gives 6.5 to 7.3,\
        \ TropicalFreshwaterFish and My-fish 6 to 7.5, and Israquarium 6.8 to 8.0. These overlapping\
        \ near-neutral recommendations make the 5.6 to 8.0 median plausible, although 5.6 is\
        \ habitat-derived rather than a tested captive endpoint. Confidence is low because endpoint\
        \ support is incomplete."

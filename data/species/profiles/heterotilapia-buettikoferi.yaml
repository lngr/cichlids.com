  husbandry:
    text: "For one adult, use the planning minimum of 800 litres with at least 220 cm length and 60 cm front-to-back\
      \ depth. Provide open movement space and sheltered areas around securely supported rocks. Keep rocks stable\
      \ when the fish removes substrate beneath them and protect exposed equipment. Effective filtration, oxygenation\
      \ and regular partial water changes support the substantial waste load. Maintain stable conditions near the\
      \ better-supported care ranges, such as 24 to 27 C and pH around 6.5 to 7.5. The broad low-confidence tolerances\
      \ do not establish healthy chronic exposure at every endpoint, especially the KH extremes."

  problems:
    text: "Adult aggression and powerful excavation are the main management difficulties. A fish that cannot rest\
      \ or feed safely needs prompt separation even before injuries appear. Digging can undermine furnishings and\
      \ destroy plants, while insufficient filtration and maintenance can allow waste to accumulate. Investigate\
      \ appetite changes, abnormal breathing or wounds together with water quality and social conditions. Physiological\
      \ hardiness does not remove these husbandry demands."

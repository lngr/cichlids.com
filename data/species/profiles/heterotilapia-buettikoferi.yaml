  sizeAndGrowth:
    text: "Use about 30 cm for a typical adult male and 25 cm for a female when planning space. The sex-specific\
      \ limits are estimates from sparse aquarium observations, and larger individuals occur. Standard-length records\
      \ exclude the tail and should not be treated as total aquarium length. The expected captive lifespan is roughly\
      \ 10 to 15 years, so a juvenile purchase requires an adult housing plan."
    sources:
    - kind: "literature"
      title: "Bailey, M. The 10 biggest and best cichlids. Practical Fishkeeping."
      url: "https://www.practicalfishkeeping.co.uk/features/the-10-biggest-and-best-cichlids/"

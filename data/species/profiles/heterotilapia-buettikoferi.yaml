  socialBehavior:
    text: "Keep one adult as the routine arrangement. Groups and unproven male-female combinations can lead to persistent\
      \ harassment or death. A bonded pair is the natural reproductive unit and can be maintained by experienced\
      \ keepers in a larger dedicated setup, with separate housing or a divider ready. Pair management generally\
      \ calls for about 1000 litres and more refuge space than the single-adult minimum. Calm juvenile behaviour\
      \ does not establish future compatibility."

  ph:
    value:
      min: 5.6
      max: 8
    confidence: "low"
    rationale: "Median decision, with 3 of 6 votes agreeing with the top candidate and no qualified majority, fixes\
      \ pH 5.6 to 8.0 at low confidence. Ordered proposed lower bounds are 5.4, 5.4, 5.4, 5.8, 5.8 and 6.5, so the\
      \ middle two average to 5.6; the median upper bound is 8.0. The wider measured Rokel/Seli envelope is 5.4\
      \ to 8.0 across Konoyima and Barrie. The selected lower bound therefore excludes a reported 5.4 reading and\
      \ is an adjudicated summary, not a measurement or a complete habitat envelope. Freshwater Jong and Waanje\
      \ results confirm regional variation, while human impacts and unconfirmed fish occupancy prevent stronger\

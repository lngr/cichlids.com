  diet:
    text: "Provide complete cichlid pellets with plant ingredients and vary them with algae foods and suitable vegetables.\
      \ Aquatic invertebrate foods can supplement the plant component. This fish is a flexible omnivore and can\
      \ consume smaller fishes, so feeding preference does not make small tankmates safe. The false bloat flag means\
      \ that a specific protein-associated syndrome was not established; balanced nutrition remains important."

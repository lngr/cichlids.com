      title: "Konoyima et al. (2020). Lengthz-Weight Relationship and Condition Factor of Coelotilapia joka in the\
        \ Rokel/Seli River, West Africa."
      url: "https://doi.org/10.18052/www.scipress.com/ilns.77.27"
      archived: doi.org/10.18052_www.scipress.com_ilns.77.27/2026-10-13T150213Z
      accessed: "2026-10-13"

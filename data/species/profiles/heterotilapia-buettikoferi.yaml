  ghDgh:
    value:
      min: 0
      max: 1
    confidence: "low"
    rationale: "The tally calls all four proposals unanimous within its 2 dGH agreement threshold and rounds their\
      \ median bounds to 0 to 1 dGH, with low confidence. Zero is a rounded endpoint, not evidence of mineral-free\
      \ water. Jong and BEDGIS indicate very soft rivers. The chosen upper bound is narrower than the Waanje source\
      \ range of 0 to 2 dGH and excludes the Livingstone Sonapiti value of about 1.37 dGH, which helped produce\
      \ the generator proposal of 0.2 to 1.4. Barrie's calcium-carbonate row would imply 1.4 to 6.2 dGH if interpreted\
      \ as hardness, but its identity and consistency with TDS are insufficient for that conversion. These regional\
      \ measurements are not a complete species-wide range. Proposals: generator 0.2 to 1.4; checker-a 0 to 2; checker-b\
      \ 0.2 to 0.7; checker-c 0.2 to 0.5."

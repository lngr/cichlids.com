  breeding:
    text: "Breeding pairs clear a substantial area and place eggs on exposed solid substrate. Both adults defend\
      \ eggs and young, often increasing their pressure on fish nearby. Mouth transport of young does not change\
      \ the classification to mouthbrooding. A detailed aquarium report observed spawning after prolonged female\
      \ harassment and later suspected catfish predation when the brood disappeared. Fry require small foods and\
      \ separate rearing capacity; a breeding setup must also allow immediate adult separation."
    sources:

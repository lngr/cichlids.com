  aggressionConspecific:
    value: 3
    confidence: medium
    rationale: "All four runs give level 3. In the lake the male drives adult conspecifics from the nest
      while the female guards the brood (Caribbean Journal of Science 2008), and the NVC article
      reports that tolerance drops sharply once pairs form and that fish of this size can injure
      each other badly. A research colony keeps two to five pairs per tank only with a split
      flowerpot as a cave for each pair. Seriously Fish describes the relative A. citrinellus as one
      of the most belligerent cichlids whose males may kill females, but the sources on this species
      describe damage mainly in the breeding season, which fits level 3 rather than 4."
    sources:

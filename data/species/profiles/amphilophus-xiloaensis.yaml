  socialBehavior:
    text: "Outside the breeding season, Midas cichlids of the lake roam and feed in loose groups. At the
      start of breeding, fish pair up and defend a nest. The male chases adult rivals from the
      territory, and the female guards the brood against predators. Mutual tolerance drops sharply,
      and large fish can injure each other. In laboratory tanks of about 480 litres, two to five
      pairs live together when split flowerpots give each pair its own cave. In home tanks, one pair
      per tank is safest. A group of young fish raised together lets a pair form, and the surplus
      fish should leave once a pair is established. Towards other species, adults claim the area
      around the nest and chase intruders hard."
    sources:

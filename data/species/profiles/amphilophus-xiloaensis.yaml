  maxSizeCm:
    value:
      male: 25
      female: 20
    confidence: low
    rationale: "Generator, checker-a and checker-c proposed 25 cm for males and 20 cm for females,
      checker-b 23 and 19; the median is 25 and 20. Wild fish are smaller: FishBase gives 16 cm
      standard length and the seven adults of the type series measure 12.4 to 17.1 cm standard
      length, roughly 15 to 21 cm total length, and fish sheets give 15 to 20 cm. Keepers on a forum
      report aquarium fish of 20 to 25 cm, which supports the median for well-fed adults. The NVC
      article and an importer quote up to 35 cm, the largest source value, which no measured fish
      supports. Males are the larger and deeper-bodied sex; the split by sex is an estimate, because
      the sources give few sizes per sex."

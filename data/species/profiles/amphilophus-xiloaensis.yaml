  social:
    value:
      structure: pair
    confidence: high
    rationale: "All four runs give a pair. The Cichlid Room Companion lists the mating system as
      monogamous, and field studies observe biparental pairs of the same species with a division of
      roles in brood defence (Elmer et al. 2009, Caribbean Journal of Science 2008). Outside the
      breeding season the lake fish move in loose groups, which a tank cannot provide at this size,
      so the recommended unit is one pair. The agreement of these independent sources gives
      confidence high."

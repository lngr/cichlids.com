        accessed: 2026-10-17
        archived: ecosystems.psu.edu/research/labs/stauffer/publications/2000s/2002-descriptions-of-three-new-species-of-cichlid-fishes-teleostei-cichlidae-fro/2026-10-17T121938Z
  husbandry:
    text: "One pair needs a tank of at least 500 litres with 180 cm length and 50 cm depth. A 300 cm
      tank gives a pair, or a mixed group of robust cichlids, far more room to avoid each other.
      Warm water of 27 to 29 degrees Celsius matches the lake. The lake water is hard and alkaline,
      and laboratory stock lives and spawns at pH 8.0 to 9.0. Offer sand or fine gravel for digging,
      heavy rock piles and large flowerpots as caves, and fix rocks firmly because the fish move
      substrate. Use strong filtration with weekly partial water changes, because these cichlids are
      large eaters and produce a lot of waste. Do not plant the tank, since plants are uprooted."

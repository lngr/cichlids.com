      - amphilophus-citrinellus-complex
    confidence: high
    rationale: "All four votes name amphilophus-citrinellus-complex and amphilophus, and the tally
      decides both unanimously with confidence high. Genome-wide data from Lake Xiloá find eighteen
      wild fish of mixed ancestry between A. sagittae and A. xiloaensis and report no known
      intrinsic barrier to crossing among Midas cichlids, which cross easily in the laboratory
      (Kautt et al. 2016); colour-mixed pairs occur in the wild as well (Elmer et al. 2009). The
      documented Midas group lists the species. The presumed genus group amphilophus, based on a
      breeder warning, lists it too. The NVC article advises against keeping other Midas cichlids
      with it."

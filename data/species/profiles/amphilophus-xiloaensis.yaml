  habitatZones:
    value:
      - rock
      - sand
    confidence: high
    rationale: "All four runs give rock and sand. Field studies find breeding pairs between basalt
      boulders and in small caves at the base of rock piles at about 4 to 16 m, and the fish occur
      down to about 25 m on the steep northeastern slope (Elmer et al. 2009, Barlow 1976, AquaInfo).
      The type locality on the southeastern shore has sandy and silty bottom, and the Cichlid Room
      Companion lists sand as the habitat. Chara beds exist in the lake, but no source ties the
      species to plants or wood. The agreement of high-trust field and database sources raises the
      confidence to high."

  temperatureC:
    value:
      min: 26
      max: 30
    confidence: low
    rationale: "Lake Xiloá is not a water body of the table, so the agents voted on field data.
      Generator, checker-a and checker-b proposed 26 to 30 degrees Celsius and checker-c 27 to 31;
      the bounds lie within one degree, so the tally counts all four votes as agreeing and decides
      26 to 30 (unanimous, confidence low), which the profile takes as decided. Direct readings are
      few: a probe at 1 m gave 29.5 degrees in November 2021 (Hydrobiologia 2026), profiles of 1974
      show the lake mixed and nearly even in temperature down to about 29 m (Barlow, Baylis and
      Roberts 1976), and the NVC article on AquaInfo puts the lake at about 29 degrees all year.
      Checker-c widened these points with regional values of Lake Managua and Managua air
      temperatures, which span about 26 to 31 degrees (Cole 1976). A research colony is held at 28
      degrees, a laboratory setting rather than a habitat value. Near the sulphur springs of the
      northern shore the water reaches 37 degrees (original description); that local anomaly stays
      out of the range and appears in the habitat text."

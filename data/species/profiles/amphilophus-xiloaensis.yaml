  breeding:
    text: "This is a pair-bonding cave spawner. In the lake it breeds in dense colonies between basalt
      boulders, with a peak in the months around the turn of the year, at depths of about 4 to 16 m.
      In the tank, the pair takes a cave or flowerpot, cleans its inner surface and the female
      attaches her eggs there. Clutches reach up to 1,000 eggs and hatch in about three days. The
      young swim free about a week after hatching. In laboratory tanks at 28 degrees Celsius,
      females spawn every four to six weeks all year. Both parents defend the nest and fry fiercely,
      so tankmates and rival fish need a divider or a very large tank."
    sources:

partners:
  suitable:
    - species: Hypsophrys nicaraguensis
      reason: Robust rock-dwelling cichlid of the same region that holds its own against Midas cichlids.
      condition: Tank of 300 cm or more with many caves.
    - species: Neetroplus nematopus
      reason: Lives in the rocky zone of Lake Xiloá itself and is fast and tough enough to avoid a pair.
      condition: Large tank with many visual barriers.
    - species: Cribroheros rostratus
      reason: "Large Central American cichlid of Lake Managua, comparable in size and robustness."
      condition: Very large tank of 300 cm or more.
    - species: Large armoured catfish (Pterygoplichthys)
      reason: "Bottom dwellers with thick armour that the cichlids rarely harm, so they live with large
        Amphilophus."
      condition: Provide hiding places and enough algae and plant food.
  unsuitable:
    - species: Amphilophus citrinellus
      reason: "Midas cichlids cross with each other freely, and the tank produces hybrids and fights
        between rivals."
    - species: Amphilophus amarillo
      reason: Lake sibling species with the same body type and colours; counts as a rival and crosses with
        this species.
    - species: Flowerhorn
      reason: Domestic line derived from Midas relatives; crosses and fights with the species.
    - species: Parachromis dovii
      reason: Pronounced fish eater that dominates and can kill fish of this size in the same tank.
    - species: "Small peaceful fish such as tetras, rasboras or Apistogramma"
      reason: Adults and breeding pairs eat or kill fish of about 2 cm and chase smaller fish relentlessly.
    - species: Lake Malawi mbuna
      reason: Different water chemistry and hasty feeding; mbuna are no match for a pair in breeding mood.
profile:
  overview:
    text: "Amphilophus xiloaensis is a Midas cichlid that lives only in Lake Xiloá, a crater lake near
      Managua in Nicaragua. It belongs to the benthic, high-bodied ecotype of the lake and is
      closely related to the great-lake Midas cichlid, Amphilophus citrinellus. Most fish are grey
      with dark bars and blotches, while a minority turn uniformly gold, orange, yellow or white.
      The species is a sturdy, digging, strongly territorial breeder that suits experienced keepers
      with a very large tank. It is rare in the hobby, and the IUCN lists it as Vulnerable because
      the whole population lives in one small lake. Captive lines exist in research laboratories and
      with a few breeders."
    sources:
      - kind: catalog-of-fishes
        title: "Eschmeyer's Catalog of Fishes, species of the genus Amphilophus"
        url: https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Amphilophus
        accessed: 2026-10-17

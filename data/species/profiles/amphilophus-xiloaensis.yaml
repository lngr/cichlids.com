  note: "The Catalog of Fishes lists Amphilophus xiloaensis as valid (Cichlidae, Cichlinae), described
    in Cuadernos de Investigación de la UCA 12 (2002) from the southeastern shore of Lake Xiloá and
    endemic to that lake, so the legacy name is the valid name. The catalog prints the second author
    once as McKay and otherwise as McKaye. A paper in the Caribbean Journal of Science spells the
    epithet xiloanensis in its title; that spelling is an error and not a nomenclatural synonym."

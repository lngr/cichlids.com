        - yellow
      pattern: bars
    confidence: medium
    rationale: "The runs agree on grey as the ground colour and on orange gold fish but differ in
      detail: grey, black and orange with a mixed pattern (generator), grey, orange and yellow,
      mixed (checker-a), grey and orange with bars (checker-b) and grey, black, yellow and orange
      with bars (checker-c). The original description gives the normal morph a grey body with six
      black vertical bars and a spot on the caudal peduncle, and about a fifth of the breeding fish
      in the lake are gold morphs of orange, yellow or white (Elmer et al. 2009); the NVC article
      adds red and blotched fish and strong banding in breeding dress. The decision lists grey and
      black for the normal morph and orange and yellow for the gold morph, with bars as the pattern
      of the dominant normal morph."

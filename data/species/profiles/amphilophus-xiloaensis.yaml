  sizeAndGrowth:
    text: "FishBase lists 16 cm standard length as the maximum, and the seven adults of the type series
      measure 12.4 to 17.1 cm standard length, which equals roughly 15 to 21 cm in total length.
      Well-fed aquarium fish grow somewhat larger than wild ones, so the profile assumes about 25 cm
      for males and 20 cm for females. A specialist article quotes up to 35 cm, a figure far above
      the scientific sources and not adopted here. Males are taller bodied than females."
    sources:

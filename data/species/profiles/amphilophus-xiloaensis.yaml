    verification:
      method: unanimous
      votes:
        agree: 4
        total: 4
    tolerance:
      value:
        min: 22
        max: 31
      confidence: medium
      rationale: "Proposals: 22 to 31 degrees Celsius (generator, checker-a, tiebreaker-2), 22 to 30
        (checker-b, tiebreaker-1) and 24 to 31 (checker-c). The tally finds five of six votes in
        agreement and decides 22 to 31 by qualified majority with confidence medium. The lower end
        follows care data for close relatives (Seriously Fish gives 21 to 26 degrees for A.
        citrinellus and 22 to 28 for A. labiatus) and species pages that start at 23 degrees. The
        NVC article prefers at least 27 degrees for this warm-lake fish, which checker-c followed
        for its higher floor; it is a preference and not a report of harm at lower values. The upper
        end adds a margin above the lake surface reading of 29.5 degrees: a colony of wild-caught
        fish lives and breeds at 28 degrees, and embryos of the species were raised at 25, 28 and 31
        degrees. The tolerance contains the natural 26 to 30 degrees."

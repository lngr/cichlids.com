  sexing:
    text: "The sexes look alike in colour and pattern, and both normal and gold fish occur in each sex.
      Males are taller bodied than females, and breeding fish of either sex may show a short-lived
      bump on the forehead. The surest sign is the genital papilla of a female about to spawn, which
      swells, juts out and turns reddish a few days before eggs appear. Ripe males show no clear
      external sign. In genus relatives, males also grow longer dorsal and anal fins and a more
      slender papilla. Most keepers raise six or more young fish together and let a pair form on its
      own, rather than trying to sex juveniles."
    sources:

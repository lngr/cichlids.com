    kind: color-morph
    note: Grey with dark bars and blotches; the majority of wild fish.
  - name: Gold morph
    kind: color-morph
    note: "Uniform orange, yellow or white after a dark juvenile stage; about one in five breeding fish
      in the lake."
features:
  origin:
    value:
      continent: Central America
      region: "Lake Xiloá (Laguna de Xiloá), a crater lake on the Chiltepe Peninsula beside Lake Managua,
        Nicaragua"
      waterbody: null
      localities:
        - Lake Xiloá, southeastern shore (type locality)
        - Lake Xiloá, rocky basalt slope of the northeastern shore
    confidence: high
    rationale: "The Catalog of Fishes, FishBase, the Cichlid Room Companion and a national checklist of
      Nicaraguan fishes agree that the species lives only in Lake Xiloá, a closed volcanic crater
      lake on the Chiltepe Peninsula next to Lake Managua. The type series comes from the
      southeastern shore at 2 to 8 m, and field studies find breeding pairs mainly on the rocky
      basalt slope of the northeastern shore. The lake is not in the water body table, so the water
      values rest on field measurements."

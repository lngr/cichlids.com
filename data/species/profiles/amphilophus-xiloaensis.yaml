  ghDgh:
    value:
      min: 18
      max: 27
    confidence: low
    rationale: "Proposals: 15 to 25 dGH (generator, checker-b), 22 to 28 (checker-a), 20 to 30
      (checker-c), 10 to 20 (tiebreaker-1) and 22 to 30 (tiebreaker-2). Without a qualified majority
      the tally takes the median, 18 to 27 dGH, with confidence low. The one chemical analysis of
      Lake Xiloá, from April 1970, gives total hardness of 443 mg/L as calcium carbonate, about 24.8
      dGH, with magnesium nearly as abundant as calcium (Barlow, Baylis and Roberts 1976); the
      original description and a 2013 engineering report repeat the 443 ppm. Lake Apoyo of the same
      water type had 15.0 dGH, which the lower votes used to widen the point, while salinity
      readings of 2018 to 2021 above the 1970 level suggest that Xiloá water can be more
      concentrated, which the upper votes used. The median range contains the lake reading and suits
      aquarium practice, so it stands. It is narrower than the span of 15 to 30 dGH among the votes
      built on measurements. Tiebreaker-1 could not read the analysis and estimated 10 to 20 dGH;
      Laguna de Tiscapa, a soft crater lake of the region at about 2 to 4 dGH, shows how far crater
      waters differ but is not Xiloá water."

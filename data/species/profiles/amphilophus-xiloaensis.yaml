  aggressionHeterospecific:
    value: 3
    confidence: medium
    rationale: "All four runs give level 3, with confidence low (generator, checker-a) or medium
      (checker-b, checker-c); medium follows from the agreement of independent sources. Aquatic
      Community calls the species aggressive and advises only large, robust tankmates, and a fish
      sheet stresses its attacks on other territorial fish, while the NVC article finds it moderate
      and keeps it with other cichlids in a large tank. Keepers report fish that dominate tanks of
      large Central Americans. Tankmates therefore need comparable size and robustness."

      basalt boulders, in dense colonies, only when breeding (Barlow 1976, Elmer et al. 2009). A
      breeding pair of fish of this size defends a large share of a tank, although a laboratory
      colony fits several pairs into a 480 litre tank with a pot per pair. A fish sheet calls the
      species territorial without restriction."

  problems:
    text: "The most common problems are fights between pairs and rivals, especially when spawning
      starts, and injuries when a newly introduced partner meets a ready fish. Overfeeding leads to
      obesity, so feed in measured portions with some plant food. Heavy feeding and digging need
      strong filtration and frequent water changes, since poor water quality weakens the fish. Midas
      cichlids are prone to lymphocystis and bacterial diseases such as nocardiosis. Quarantine new
      fish and watch for lumps, wasting or spots. Soft, acid water does not match the lake and is
      best avoided. Mixed Midas stock produces hybrids, which dilutes a rare species."
    sources:

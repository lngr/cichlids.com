  habitat:
    text: "Lake Xiloá fills a volcanic crater at the edge of Lake Managua. It is deep, with a mean depth
      of about 60 m, covers roughly 3.75 square kilometres and shares its fish ancestry with Lake
      Managua, from which the Midas cichlids colonised it. The water is rich in dissolved minerals
      and slightly saline: an analysis of 1970 found about 25 dGH of total hardness, about 17.6 dKH
      of carbonate hardness, a pH near 8 and about 19 times the dissolved solids of Lake Nicaragua,
      with magnesium nearly as abundant as calcium. The northeast shore is a steep basalt slope with
      boulders, the south has sandy beaches. Adults of this species breed on rock at roughly 4 to 16
      m and occur down to about 25 m. Surface water stays near 29 degrees Celsius all year. At a few
      spots volcanic gas rises from the bottom, and near the sulphur springs of the northern shore
      the water reaches about 37 degrees, a local anomaly that plays no part in the water values of
      this profile."
    sources:
      - kind: literature
        title: "Barlow, G. W., Baylis, J. R. and Roberts, D. (1976). Chemical analyses of some crater lakes
          in relation to adjacent Lake Nicaragua. In: Thorson, T. B. (ed.), Investigations of the
          Ichthyofauna of Nicaraguan Lakes, University of Nebraska-Lincoln, 17-20."
        url: https://web.archive.org/web/2020/https://digitalcommons.unl.edu/cgi/viewcontent.cgi?article=1003&context=ichthynicar
        accessed: 2026-10-17
        archived: web.archive.org/web/2020/https_/digitalcommons.unl.edu/cgi/viewcontent.cgi/q-1a6c4401/2026-10-14T233126Z
      - kind: literature
        title: "Heterogeneity across Neotropical aquatic environments affects prokaryotic and eukaryotic
          biodiversity based on environmental DNA (Environmental DNA 2021, Table 1: surface water of
          Nicaraguan lakes)"
        url: https://doi.org/10.1002/edn3.267
        accessed: 2026-10-17
        archived: doi.org/10.1002_edn3.267/2026-10-13T000709Z

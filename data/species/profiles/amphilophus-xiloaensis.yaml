    rationale: "The six votes rest on different readings: 7.3 to 8.2 (generator), 7.3 to 8.4 (checker-a,
      tiebreaker-2), 7.7 to 8.3 (checker-b) and 7.8 to 8.5 (checker-c, tiebreaker-1). Without a
      qualified majority the tally takes the median of all minima and all maxima, 7.5 to 8.4, with
      confidence low. The range is plausible for the lake and for keeping: Lake Xiloá measured 8.00
      near shore in April 1970 (Barlow, Baylis and Roberts 1976), 7.9 according to the original
      description and a 2013 report of the National University of Engineering, and 7.33 at 1 m depth
      in 2018 (Environmental DNA 2021). The neighbouring crater lake Apoyo of the same water type
      measured 8.1 to 8.15 and 7.58. The decided range is narrower than the source span of 7.33 to
      8.5: the 2018 reading lies below it, and Laguna de Tiscapa, a softer crater lake of the
      Managua area used only for the regional spread, varies from 7.0 to 9.5. Aquarium pages giving
      7.5 to 8.0 are advice, not habitat data."

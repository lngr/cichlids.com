  compatibility:
    text: "Other cichlids are possible when the tank is large, rock work breaks lines of sight and
      tankmates are robust and of comparable size. Species from the same lake and from Lake Managua
      are a natural match, for example Hypsophrys nicaraguensis, Neetroplus nematopus and
      Cribroheros rostratus. Large armoured catfish also cope. Avoid small or peaceful fish, because
      a pair in breeding mood attacks them and adults eat fry and fish up to about 2 cm. Do not
      combine the species with other Midas cichlids or the flowerhorn: the lake species cross freely
      in nature and in the laboratory, and their young are fertile."
    sources:

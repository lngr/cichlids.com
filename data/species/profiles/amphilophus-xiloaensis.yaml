  diet:
    text: "In the lake this species is a bottom feeder with heavy, millstone-like pharyngeal teeth that
      crack snail shells. Its wild diet is richer in snails than that of the slender arrow-shaped
      Midas cichlid of the same lake. In the aquarium it accepts almost anything. A good cichlid
      pellet works as the staple, with mussels, prawns, earthworms and some vegetable food such as
      peas or spinach. Live snails give the pharyngeal teeth natural work. Feed measured portions,
      because the species gains weight easily, and avoid regular meals of fatty red meat."
    sources:

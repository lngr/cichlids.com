  temperatureC:
    value:
      min: 26
      max: 31
    confidence: medium
    rationale: "The tally decides 26 to 31 C with unanimous agreement under its 1 C comparison threshold.\
      \ Generator proposes 26 to 31 C, checker-a 25 to 30 C, checker-b 25 to 31 C and checker-c 26 to\
      \ 30 C. JBL reports regional Jauaperi and Negro readings of 26.3 to 30.3 C, while seasonal Middle\
      \ Negro means span 26.5 to 29.8 C. The upper endpoint is a rounded regional allowance, not a measured\
      \ optimum. The Candiru study measures 25 C where this species is collected; Horbe reports a wider,\
      \ cooler regional 24.9 to 27 C interval. These cooler observations remain evidence outside the selected\
      \ range. FishBase and the Biotope Aquarium Project give 22 to 30 C without an exposed habitat measurement\
      \ series, a lower reach than the decided ideal. The broad Amazon physiology review gives 28 to 32 C. Anavilhanas microhabitats span 28.4 to 34.7 C; their\
      \ warmer exposed samples do not justify a persistent aquarium ideal at 34.7 C. Regional measurements\
      \ are not all paired with captures of this species."

  predation:
    value: 2
    confidence: medium
    rationale: "The qualified-majority tally retains level 2: generator, checker-b, checker-c, tiebreaker-1\
      \ and tiebreaker-2 propose 2, while checker-a proposes 1. FishBase lists smaller fish as prey and\
      \ bony fish among food items, supporting risk beyond accidental fry consumption. Cichlidamerique\
      \ identifies fish below about 5 cm as potential prey; Aquarismo Paulista and Aquarist Atlas also\

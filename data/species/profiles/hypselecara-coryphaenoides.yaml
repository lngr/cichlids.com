  ph:
    value:
      min: 4
      max: 6
    confidence: low
    rationale: "The median tally decides pH 4.0 to 6.0 with low confidence because no qualified majority\
      \ settles the upper bound. Generator and tiebreaker-2 propose 4.0 to 6.4, checker-a 4.0 to 5.5,\
      \ and checker-b, checker-c and tiebreaker-1 4.0 to 6.0. All six minima are 4.0; the sorted maxima\
      \ are 5.5, 6.0, 6.0, 6.0, 6.4 and 6.4, giving median 6.0. Candiru provides a species-associated\
      \ point at 5.0. Typical Negro-type regional chemistry near 4 to 5 and FishBase species values of\
      \ 5 to 6 support a useful acidic envelope. Kuchler reports a wider blackwater interval of 3.89 to 5.8. Silva reports wider regional evidence: 3.96 to 6.32 across\
      \ Cubati and Uatuma and 6.38 to 6.55 in the Trombetas main channel. The metal-distribution study\
      \ reports 4.7 to 6.85 across blackwater rivers, and the DOC paper describes a regional 3.0 to 5.5\
      \ interval. These wider ranges explain the competing proposals but do not establish occupation by\
      \ this species at every endpoint. The Rio Negro field account gives a regional low of 3.8. Those\
      \ values remain evidence rather than redefining the representative median ideal. Aquarium pH recommendations\
      \ do not determine the natural range."

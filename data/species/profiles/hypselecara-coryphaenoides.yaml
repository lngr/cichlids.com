profile:
  overview:
    text: "Hypselecara coryphaenoides is a northern South American cichlid associated with acidic forest\
      \ waters. It shares the chocolate cichlid common name with H. temporalis, so a scientific identification\
      \ matters. A flank blotch extending above the lateral line and a relatively elongated body help\
      \ distinguish it. Both sexes can develop a bright dorsal band when breeding. A compatible pair offers\
      \ elaborate parental behavior, but additional adults can face sustained persecution."
    sources:
    - *id001
    - *id004
    - *id049
  habitat:
    text: "Its distribution includes the Negro, Trombetas, Tapajos, Maues and Uatuma systems and parts\
      \ of the upper Orinoco and Aguaro drainage. Submerged timber, shaded margins and sandy or leaf-covered\
      \ bottoms provide shelter. Regional measurements show highly dilute acidic water, but neighboring\
      \ rivers and sampling sites vary. The selected natural pH interval is 4.0 to 6.0; regional source\
      \ values extend below and above it without proving species occupancy at every endpoint. Most chemical\
      \ evidence represents regional habitat rather than simultaneous fish captures."
    sources:
    - *id004
    - *id003
    - *id025
    - *id026
    - *id006
    - kind: literature
      title: Gonzalez et al. (2024). Ion uptake in naturally acidic water
      url: "https://doi.org/10.1007/s00360-024-01552-6"
      archived: doi.org/10.1007_s00360-024-01552-6/2026-10-13T131655Z
      accessed: '2026-10-15'
  sizeAndGrowth:
    text: "Adult aquarium planning uses about 22 cm total length for a male and 20 cm for a female. The\
      \ sex-specific difference is estimated, and smaller adults are also reported. Standard length excludes\
      \ the tail and must not be read as total length. An uncorroborated forum size claim does not establish\
      \ this species maximum. Longevity is provisionally estimated at eight to ten years from weak care-sheet\
      \ evidence; neither bound represents a measured survival distribution."
    sources:
    - *id003
    - *id004
    - *id015
    - *id039
    - *id043
    - *id018
    - *id019
  husbandry:
    text: "Provide at least 300 litres with a 120 by 45 cm base for one compatible pair. A community requires\
      \ more room. Secure wood above fine sand so digging cannot destabilize it, and create shaded retreats\
      \ and interrupted sight lines. Manage clean, soft, acidic water with reliable oxygenation. Routine\
      \ targets around 26 to 29 C and pH 5.5 to 6.5 have stronger keeping support than the outer tolerance\
      \ endpoints. Low carbonate buffering requires monitoring and carefully prepared replacement water."
    sources:
    - *id004
    - *id015
    - *id039
    - *id006
  socialBehavior:
    text: "Adult pairs can exclude other members of their species even when juveniles coexist. Persistent\
      \ cornering, feeding exclusion and damaged fins require separation. A fitted cover also matters\
      \ because threatened fish can jump through gaps. During spawning, the pair defends a substantial\
      \ floor area. Other large species are often tolerated outside that area, although brood defense\
      \ can cause injury. Shelter helps create retreat routes but cannot resolve every incompatible social\
      \ arrangement."
    sources:
    - *id004
    - *id046
    - *id039
    - *id016
  diet:
    text: "Use a balanced cichlid food with varied invertebrate supplements and a plant component. Pellets,\
      \ insect larvae, small crustaceans and earthworm pieces suit the mixed feeding pattern. Offer moderate\
      \ portions and remove uneaten food. Avoid fatty mammalian meat as a staple. FishBase records small\
      \ fish among foods, while field diet observations also show diverse non-fish items. Omnivory does\
      \ not make small tankmates safe, and the absence of a specialized bloat flag does not exclude digestive\
      \ illness."
    sources:
    - *id004
    - *id039
    - *id016
  breeding:
    text: "A compatible pair attaches eggs to a cleaned solid surface and shares brood care. Wood or sloping\
      \ stone can provide a spawning surface; the adults can move larvae into sheltered depressions. Published\
      \ breeding advice favors pH 5.5 to 6.5, 1 to 5 dGH and approximately 26.5 to 29 C. Eggs hatch after\
      \ about two days and free swimming follows several days later. Small live foods support the fry.\
      \ Separate rearing space is useful because tankmates and even parents preparing another spawn can\
      \ consume them."
    sources:
    - *id004
    - *id003
    - *id039
    - *id016
  sexing:
    text: "External sexing is uncertain, especially in young fish. Males tend to be slightly larger and\
      \ may develop a forehead swelling, but neither feature reliably identifies every individual. Both\
      \ sexes can show the dark body and bright dorsal breeding band. A successful spawn provides firmer\
      \ confirmation than color alone. Raising juveniles to obtain a pair requires accommodation for the\
      \ fish excluded as the pair establishes itself."
    sources:
    - *id004
    - *id039
    - *id016
  compatibility:
    text: "Choose peaceful companions with compatible warm acidic water needs and an adult size beyond\
      \ plausible prey risk. Newman reports coexistence with Satanoperca lilith but also a damaging bite\
      \ near the fry. Recommendations for Heros and loricariids are broader husbandry suggestions rather\
      \ than guarantees for every named combination. Small tetras are vulnerable despite compatible water\
      \ chemistry. Strongly alkaline-water fish and much more forceful predators make poor matches. The\
      \ 300 litre minimum applies to the pair, not a fully stocked community."
    sources:
    - *id004
    - *id046
    - *id043
    - *id056
    - *id016
  problems:
    text: "Adult social pressure and deteriorating water conditions are practical risks. Watch for fish\
      \ trapped in corners, persistent hiding, feeding exclusion and damage around spawning territories.\
      \ Hard alkaline replacement water conflicts with the keeping advice, while very weak buffering can\
      \ permit unstable pH. Newman links one episode of sensory-pore erosion to a change in copper plumbing,\
      \ an individual observation rather than proof of a universal diagnosis. Investigate source water\
      \ and husbandry when symptoms appear, and obtain qualified help for persistent illness."
    sources:
    - *id004
    - *id039
    - *id041
    - *id016

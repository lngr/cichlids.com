    tolerance:
      value:
        min: 24
        max: 31
      confidence: medium
      rationale: "The qualified-majority tally decides 24 to 31 C and contains the decided natural range.\
        \ Generator and checker-b propose 24 to 31 C; checker-a proposes 22 to 30 C; checker-c, tiebreaker-1\
        \ and tiebreaker-2 propose 24 to 30 C. Five proposals agree within the 1 C threshold. Seriously\
        \ Fish, the Nordic register and Aquarismo Paulista recommend 24 to 30 C, and Newman reports keeping\
        \ and spawning at 29 C. The 31 C endpoint is an allowance required to contain the tallied natural\
        \ interval, not a demonstrated multi-year limit. FishBase and the Biotope Aquarium Project give\
        \ the wider lower reach of 22 to 30 C as environmental summaries, not controlled long-term keeping\
        \ results. Cichlidamerique contains conflicting 28 to 31, 25 to 28, 26 to 30, 24 to 30 and 22\
        \ to 30 C statements, plus 23 to 29 C breeding advice. Those alternatives remain evidence. Routine\
        \ keeping at 26 to 29 C has better direct support than either endpoint."

      \ these are field-test readings below useful resolution, not proof of absent carbonate. A wider\
      \ 0 to 1 interval prevents one test result becoming a point ideal. The Wood sample contains 0.21\
      \ mg C/L dissolved inorganic carbon at pH 4.0, implying at most about 0.05 dKH even if all inorganic\

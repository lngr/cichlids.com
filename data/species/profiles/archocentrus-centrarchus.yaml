  ph:
    value:
      min: 6.8
      max: 8.9
    confidence: "low"
    rationale: "Retain the tally median of 6.8 to 8.9 with low confidence. Generator and tiebreaker-2 proposed 7.0\
      \ to 8.9; checker-a 6.5 to 8.5; checker-b and tiebreaker-1 6.5 to 8.9; checker-c 7.4 to 9.3. No qualified\
      \ majority emerged, so the median describes a provisional common-water range rather than an observed pair\
      \ of limits. The lower end draws on weakly localized river and wetland information, including the forum claim\
      \ of 6.5 to 7.2; the wider Costa Rican site series reaches 5.35 to 7.0 but does not pair each reading with\
      \ this species. Direct Lake Nicaragua evidence includes FAO pH 7.0, Swain surface 8.2 to 8.9 and deeper water\
      \ 7.4 to 7.8, and later CIRA/OAS observations. Managua surface measurements reach 8.9 to 9.3, with ILEC seasonal\
      \ means 9.18 to 9.26; this sodium-carbonate basin is described separately as an exceptional habitat. Its high\
      \ readings do not define the usual aquarium requirement. Fishipedia habitat labels lack station metadata and\
      \ do not replace field analyses."

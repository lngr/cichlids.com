    tolerance:
      value:
        min: 6.5
        max: 9
      confidence: "low"
      rationale: "Retain the tally median of 6.5 to 9.0 with low confidence. Generator proposed 7.0 to 9.0; checker-a\
        \ 6.0 to 8.5; checker-b, tiebreaker-1 and tiebreaker-2 6.5 to 9.0; checker-c 7.0 to 9.3. No qualified majority\
        \ emerged. Potvin bred the fish at 7.0; care recommendations commonly give 7.0 to 8.2 or 7.2 to 8.0. The\
        \ source recommendations collectively reach the wider 6.0 to 8.2 envelope, and checker-c extended to the\
        \ exceptional Managua observation of 9.3. The adopted lower endpoint is a provisional synthesis and the\
        \ upper endpoint is inferred to contain the natural 8.9, not a controlled long-term trial. Stable water\
        \ near the better supported central interval is preferable to targeting either limit."

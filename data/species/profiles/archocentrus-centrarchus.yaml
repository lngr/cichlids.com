    rationale: "Choose open-substrate-spawner, the generator, checker-b and checker-c proposal. Checker-a chose\
      \ cave-spawner based on aquarium shelters. FishBase describes natural shallow open-substrate spawning; AquaInfo\
      \ expressly distinguishes this from optional cave use, and Fischlexikon also describes exposed sheltered surfaces.\
      \ Potvin observed eggs on a vertical rock inside a rock shelter. That observation and the cave labels in other\
      \ care sheets remain evidence but do not establish obligatory cave spawning."

        - "balanced prepared foods"
    - by: "checker-c"
      value:
        type: "omnivore"
        bloatSensitive: false
        foods:
        - "insect larvae"
        - "small crustaceans"
        - "detrital plant material"
        - "balanced cichlid pellets"
        - "vegetable foods"
    decision:
      type: "omnivore"
      bloatSensitive: false
      foods:
      - "balanced cichlid pellets"
      - "plant-containing flakes"
      - "small aquatic invertebrates"
      - "vegetable matter"
    rationale: "All four full-profile runs chose omnivore with bloatSensitive false; the tally retains the generator\
      \ food list. FishBase insects and detritus and AquaInfo algae, crustaceans and larvae support animal and plant-derived\
      \ foods. Fruciano et al. emphasize an invertebrate-feeding ecological guild, retained as invertivore evidence,\
      \ but that does not establish exclusion of plant material. The other proposed food lists describe compatible\
      \ variants of the same mixed diet. Prepared-food breeding observations reinforce this interpretation. No read\
      \ source establishes a special protein-related bloat syndrome; the false flag means no established special\
      \ sensitivity, not immunity to digestive illness."
  - field: "features.territory"

partners:
  suitable:
  - species: "Herotilapia multispinosa"
    reason: "AquaInfo explicitly suggests this relatively restrained Central American companion."
    condition: "Use a substantially larger, partitioned aquarium than the 200 L pair minimum and supervise spawning."
  - species: "Hypsophrys nicaraguensis"
    reason: "AquaInfo names this larger Central American species as a possible companion."
    condition: "Provide distinct bottom territories in a large aquarium and be prepared to separate breeding pairs."
  - species: "Amatitlania siquia"
    reason: "AquaInfo names this species; compatible sizes and cover can permit coexistence."
    condition: "Use a large aquarium with separate spawning areas; breeding aggression can make the combination\
      \ fail."
  unsuitable:
  - species: "Paracheirodon innesi"
    reason: "Very small individuals and fry are vulnerable to opportunistic predation. Neon tetras also offer little\
      \ resilience against displacement by a guarding cichlid pair."
  - species: "Parachromis dovii"
    reason: "A much larger fish predator, identified as a natural predation threat by AquaInfo, can injure or consume\
      \ flier cichlids."
  - species: "Amphilophus labiatus"
    reason: "Its greater adult size and intense territorial behaviour can overwhelm the pair; this is an inferred\
      \ mismatch rather than a documented trial."
profile:
  overview:
    text: "The flier cichlid, Archocentrus centrarchus, combines a deep body and dark bars with subdued yellow,\
      \ green and blue tones. Adults are best planned for as an established pair. They can coexist with selected\
      \ companions in a larger aquarium, but brood defence and pressure on an unready partner require careful layout\
      \ and observation. Its current scientific name matches the legacy catalog entry. Keepers should distinguish\
      \ the uncertain summary of natural waters from the broader, separately assessed aquarium tolerances."
    sources:
    - *id001
    - *id006
    - *id007
    - *id059
  habitat:
    text: "Shallow vegetated margins, slow channels and floodplain pools provide cover and feeding surfaces for\
      \ this species. Its distribution includes the Caribbean drainages of Nicaragua and Costa Rica and Pacific\
      \ Gulf of Fonseca tributaries in Nicaragua and Honduras. Lake Nicaragua analyses give approximately 3.3 to\
      \ 3.5 dGH and 3.4 to 3.8 dKH, but later surveys show wider basin variation. The profile uses the decided typical\
      \ ranges of 25 to 29 C, pH 6.8 to 8.9, 2 to 6 dGH and 3 to 4 dKH as uncertain summaries rather than the full\
      \ measured envelope. Occupied Lake Managua is chemically unusual: Swain reports surface pH 8.9 to 9.3 and\
      \ FAO ions imply about 24.39 dKH. Barlow and colleagues report about 24.9 dGH for crater lake Xiloa. These\
      \ concentrated lake settings and reported shallow-water temperatures up to 36 C are exceptional observations,\
      \ not routine aquarium targets."

  temperatureC:
    value:
      min: 25
      max: 29
    confidence: "low"
    rationale: "Retain the tally median of 25 to 29 C with low confidence. Generator and checker-b proposed 25 to\
      \ 28; checker-a and tiebreaker-2 proposed 25 to 30; checker-c proposed 24 to 28; tiebreaker-1 proposed 25\
      \ to 32. No four-vote cluster settled the bounds. This median is a plausible working description of common\
      \ warm habitat, not a measured species-wide envelope. It is narrower than FishBase 26 to 36 C, the Costa Rican\
      \ survey 20.4 to 34.8 C, Tipitapa 28.5 to 32.4 C, and CIRA/OAS 28.3 to 30.2 C. Costa Rican and river readings\
      \ are not linked to captures at every station; the CIRA campaign partly investigated fish mortality. Swain\
      \ supplies the measured Lake Nicaragua core at 25 to 28 C and Managua surface water at 24.7 to 26 C. Unusually\
      \ hot shallow-water exposures remain in the evidence and habitat prose without becoming routine aquarium targets.\
      \ Different campaigns and extraction limits prevent claiming a complete seasonal range."

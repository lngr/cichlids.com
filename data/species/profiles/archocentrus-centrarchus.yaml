  sizeAndGrowth:
    text: "Allow for typical adult aquarium lengths of about 15 cm in males and 12 cm in females. Smaller fish can\
      \ already breed, so the size of a spawning pair does not establish its eventual maximum. Some care sheets\
      \ give 20 cm, while FishBase uses standard length rather than total length; those measurements are not interchangeable.\
      \ A planning horizon of six to nine years is supported by care estimates and a photographed nine-year-old\
      \ male, although there is no population-level longevity study. Good food, space and clean water support development\
      \ without a need to force growth through overfeeding."
    sources:
    - *id007
    - *id032
    - *id006
    - *id030
    - *id031
    - *id033
  husbandry:
    text: "Provide at least 200 litres with a footprint 100 cm long and 40 cm deep for one established adult pair.\
      \ Plants, wood and stable stones should interrupt sight lines and leave several routes into cover. A soft\
      \ bottom allows digging, while sheltered hard surfaces provide spawning options. Secure heavy structures against\
      \ undermining. Gentle to moderate circulation suits the species, alongside effective filtration and surface\
      \ gas exchange. Routine temperatures around 26 to 28 C have stronger husbandry support than the hot extremes\
      \ reported from nature. Assess source-water pH, GH and alkalinity separately, then keep conditions stable\
      \ through regular partial water changes. Additional companions require more floor area."
    sources:
    - *id007
    - *id031
    - *id030
    - *id032
    - *id033
  socialBehavior:
    text: "Keep adults as an established pair rather than assuming that a wild feeding group will remain peaceful\
      \ in a confined aquarium. Courtship and brood defence change the social balance, and a female that is not\
      \ ready to spawn can be pressured by the male. Dense cover and passages that let a fish leave another's view\
      \ are essential. Watch for persistent hiding, exclusion from food or damage rather than judging compatibility\
      \ from the first quiet day. Have a workable separation arrangement if the pair fails. Other fish may be largely\
      \ ignored between broods, but a nest and mobile fry can bring much stronger territorial defence."
    sources:
    - *id007
    - *id032
    - *id059
    - *id033
  diet:
    text: "Offer a varied omnivore diet built around a balanced cichlid pellet or flake with plant ingredients.\
      \ Small aquatic invertebrates and modest vegetable portions can provide variety. Natural food reports include\
      \ insects, crustaceans, algae and detritus, so a diet made entirely of fish flesh would poorly reflect the\
      \ available evidence. Feed amounts that the fish finish promptly and make sure both partners obtain food.\
      \ Small fish and fry can be taken opportunistically, even though this is not a specialized fish predator.\
      \ No source read establishes a particular protein-related bloat syndrome for this species. Overfeeding and\
      \ spoiled food can still cause poor condition and water-quality problems."
    sources:
    - *id006
    - *id007
    - *id032
    - *id030
    - *id031
    - *id033
  breeding:
    text: "A pair places eggs on a prepared substrate and guards the brood. Sheltered stones, including upright\
      \ surfaces, are useful; aquarium cave use does not make it an obligatory cave breeder. The female commonly\
      \ becomes dark before the male, and both may be very dark once they are guarding free-swimming young. One\
      \ aquarium observation reports hatching after about 60 hours at 25.6 C and swimming several days later. Other\
      \ accounts describe larvae attaching to plants or nearby surfaces, so early brood placement can vary. Provide\
      \ newly hatched brine shrimp or comparably small suitable foods when fry are swimming, and plan space for\
      \ their subsequent growth."
    sources:
    - *id006
    - *id007
    - *id032
    - *id030
    - *id031
    - *id072
  sexing:
    text: "Sex is easier to judge in mature fish than in juveniles. Males generally become larger and may develop\
      \ more extended dorsal and anal fins, but size alone can mislead when ages or growth conditions differ. FishBase\
      \ records a dorsal-fin eyespot in mature females, which provides an additional feature to examine. A female\
      \ often darkens earlier during spawning, while the male changes later as the brood develops. That temporary\
      \ colour sequence is more useful as a breeding observation than as a permanent identification rule. Choose\
      \ a proven compatible pair when possible rather than relying on a single colour or fin character to select\
      \ two young fish."
    sources:
    - *id006
    - *id007
    - *id030
    - *id032
  compatibility:
    text: "AquaInfo suggests Herotilapia multispinosa, Hypsophrys nicaraguensis and Amatitlania siquia as possible\
      \ cichlid companions. These are conditional options for a larger aquarium with distinct territories and an\
      \ available separation arrangement. The 200 L minimum is for the flier pair. Brood care can change a previously\
      \ quiet community, while very small fish and fry face opportunistic predation. Large predators and strongly\
      \ aggressive cichlids can overwhelm this species. No supported hybrid group was identified; this records an\
      \ evidence gap and does not guarantee reproductive isolation from every possible companion."
    sources:
    - *id007
    - *id032
    - *id031
    - *id033
  problems:
    text: "Common problems arise from an incompatible pair, inadequate escape cover and adding neighbours without\
      \ enough bottom space. A male can seriously injure a female, so persistent pursuit needs intervention rather\
      \ than waiting for spawning to solve it. Digging can uproot plants and destabilize unsupported stones. Keep\
      \ food portions controlled and maintain filtration, oxygen exchange and regular water changes; quiet natural\
      \ habitats are not a reason to allow dirty aquarium water. New fish should be observed separately before introduction.\
      \ Loss of appetite, damaged fins, unusual breathing or swelling merit checking conditions and seeking qualified\
      \ help. This profile does not diagnose disease or recommend medication."
    sources:
    - *id032
    - *id007
    - *id031
    - *id030
    - *id033
    - *id053

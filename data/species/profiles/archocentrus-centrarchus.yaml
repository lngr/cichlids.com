    decision:
      size: "large"
      breedingOnly: true
    rationale: "Choose a large territory mainly during breeding, as proposed by generator, checker-b and checker-c.\
      \ Checker-a proposed a small territory defended outside breeding as well. Potvin describes the pair occupying\
      \ one side of a tank about 91 cm long, close to the rubric reference for a substantial defended area. Nest-site\
      \ descriptions alone do not measure a 30 cm territory. breedingOnly refers to the substantial territorial\
      \ phase; occasional defence of cover outside spawning can still occur. Confidence stays low because the footprint\
      \ and timing are inferred from qualitative observations."

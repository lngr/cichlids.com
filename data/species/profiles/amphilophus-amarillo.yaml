    - *id020
  diet:
    text: "Snails are the main natural food, and the species has a benthic invertebrate-feeding specialization.\
      \ Aquarium acceptance is broader: balanced cichlid foods can be supplemented with suitable mollusc and other\
      \ invertebrate foods. The field report also records egg and fry predation. Avoid chronic overfeeding and observe\
      \ whether both partners obtain food. No established species-specific bloat sensitivity was found; this does\
      \ not make digestive problems impossible."
    sources:

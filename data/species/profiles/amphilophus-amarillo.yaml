  husbandry:
    text: "The recommended adult unit is one established pair in at least 1000 litres, 250 cm long and about 65\
      \ cm from front to back. The depth is a planning inference. Provide open turning space, a diggable sandy bottom\
      \ and firmly supported shelters that interrupt direct views. Use effective filtration and aeration with regular\
      \ water replacement. Aquarium guidance is 24 to 30 C, pH 7.0 to 8.5, GH 5 to 26 and KH 3 to 20; the hardness\
      \ limits remain uncertain. Keep a divider or separate aquarium available before introducing adults."

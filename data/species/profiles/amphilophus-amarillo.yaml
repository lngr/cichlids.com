  ph:
    value:
      min: 7.3
      max: 8
    confidence: medium
    rationale: "The qualified majority is 4 of 6 for 7.3 to 8.0: generator, checker-c and both tiebreakers. Checker-a\
      \ proposes 8.0 to 8.8 using other crater lakes; checker-b proposes 7.8 to 8.2 around sparse historical observations.\
      \ Harer et al. measured a mean 7.33 at 1 m in Xiloa in 2018. The field assessment reports 7.9 and PHALK retains\
      \ the historical Xiloa pH 8.0. The chosen interval spans those lake observations. Wider evidence of 8.15 to\
      \ 8.75 in Apoyo and Masaya and 7.0 to 9.3 in the great lakes remains cited but does not define Xiloa's typical\
      \ water. The 8.0 to 8.2 aquarium recommendation is husbandry evidence, not a field measurement."
    sources:
    - &id021
      kind: literature
      title: Harer et al. (2021 online). Heterogeneity across Neotropical aquatic environments affects prokaryotic
        and eukaryotic biodiversity based on environmental DNA

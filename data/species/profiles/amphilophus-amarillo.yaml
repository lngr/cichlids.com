  habitat:
    text: "The fish feeds and breeds around shallow Chara beds, sand and nearby hard cover in Lake Xiloa. FishBase\
      \ records depths of 3 to 10 m. The selected natural envelope is 27 to 30 C and pH 7.3 to 8.0. Historical hardness\
      \ is sparse, so 20 to 26 dGH remains provisional; 8 to 16 dKH is an estimate rather than a measured lake interval.\
      \ NVC reports localized geothermal patches approaching 40 C, which are excluded from the profile ranges. Dissolved\
      \ salts in this lake cannot be treated as GH or KH measurements."

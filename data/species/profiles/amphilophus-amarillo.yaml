  problems:
    text: "Insufficient adult space, unstable pair relationships and overfeeding are the main management concerns\
      \ identified by the keeping accounts. Digging can undermine loose heavy decorations, so support them securely.\
      \ Sustained hiding, missed meals, torn fins or rapid breathing call for checking water quality and interactions\
      \ between fish. A newly acquired fish also needs observation before joining established stock. Unusual swelling\
      \ or persistent appetite loss should be investigated rather than assumed to be a particular disease."

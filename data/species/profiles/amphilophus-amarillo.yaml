      \ no verification object. Generator proposes 8 to 20, checker-a 9 to 18, checker-b 5 to 12, and checker-c\
      \ plus both tiebreakers 8 to 16. Under the tally's 2 dKH agreement tolerance the leading cluster contains\
      \ 5 of 6 votes; the resulting range is not an exact vote by each of those runs. Checker-a supplies a historical\
      \ Xiloa point of 17.6 dKH from 314 mg/L as CaCO3 bicarbonate alkalinity, plus an Apoyo point of 9.0. That\
      \ Xiloa point lies above the decision and is retained as dissenting evidence. The other runs could not independently\
      \ verify a quantitative local alkalinity result through the permitted full-text routes. PHALK supplies regional\
      \ Apoyo and Managua points of 8.95 and 19.01 dKH, but its released selected alkalinity table has no Xiloa\
      \ site 62704 row. Thus the wider regional 8 to 20 proposal and the historical point do not establish the chosen\
      \ endpoints. Eight to 16 remains a provisional working estimate, not a measured native envelope; GH, pH, sodium\
      \ and conductivity cannot establish KH."

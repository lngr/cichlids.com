    value:
      type: invertivore
      bloatSensitive: false
      foods:
      - aquatic snails
      - mollusc flesh
      - insect larvae
      - crustaceans
      - balanced cichlid pellets
    confidence: medium
    rationale: "All four votes agree on invertivore and bloatSensitive false; the tally retains the generator's\
      \ food list. The generator lists snails, mollusc flesh, insect larvae, crustaceans and balanced pellets; checker-a\
      \ adds vegetables, checker-b uses broader invertebrate and sinking-food categories, and checker-c uses mollusc\
      \ foods, invertebrates and pellets. CRC, NVC and the Chiltepe field report support a predominantly mollusc-based\

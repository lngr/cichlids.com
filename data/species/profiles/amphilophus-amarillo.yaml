partners:
  suitable:
  - species: Vieja melanura
    reason: "Conditional candidate of comparable adult size outside the Midas hybrid group; compatibility is inferred,\
      \ not demonstrated in a read amarillo trial."
    condition: "At least 300 cm and 1500 L, similar-sized adults, overlapping measured aquarium water and immediate\
      \ separation capacity."
  - species: Vieja fenestrata
    reason: A robust non-Midas cichlid is a possible companion in a very large managed community; individual aggression
      can still rule it out.
    condition: At least 300 cm and 1500 L with separate territories; do not add juveniles to a guarding pair.
  - species: Cincelichthys pearsei
    reason: Large adults are plausible size-matched candidates outside the Midas group; their more plant-oriented
      feeding needs separate attention.
    condition: "At least 300 cm and 1500 L, dedicated feeding access and removal if bullied; this is an unverified\
      \ husbandry inference."
  unsuitable:
  - species: Amphilophus viridis
    reason: Wild genomic admixture with amarillo supports a hybrid conflict within the curated Midas complex.
  - species: Amphilophus citrinellus
    reason: Shares the curated Midas hybrid group and resembles a territorial rival.
  - species: Paracheirodon innesi
    reason: Small delicate adults cannot withstand the territorial attacks of this large cichlid; eggs and small
      fry are also potential prey.
  - species: Parachromis dovii
    reason: Its eventual adult size and predatory aggression make it unsuitable for the recommended amarillo pair
      aquarium; occurrence in the same lake does not establish compatibility in that space.
profile:
  overview:
    text: Amphilophus amarillo is a Lake Xiloa endemic in the Nicaraguan Midas cichlid radiation. Its yellow breeding
      coloration and dark bars become less conspicuous outside reproduction. Similar appearance among related species
      makes collection history more useful than color alone when choosing stock. It is a large fish for experienced
      keepers who can manage an established pair and separate incompatible adults.

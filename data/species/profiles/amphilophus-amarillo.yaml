  sizeAndGrowth:
    text: "Plan for males around 35 cm and somewhat smaller females, estimated here at 30 cm. The separate female\
      \ figure is uncertain. Aquarium accounts give 35 cm without separating sexes, and NVC reports some individuals\
      \ reaching 40 cm. FishBase's 15.5 cm is standard length from scientific records, excluding the tail, so it\
      \ does not define the maximum size of a well-kept aquarium adult. Juvenile size is a poor guide to the permanent\
      \ space required."

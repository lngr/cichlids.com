    value:
      min: 27
      max: 30
    confidence: medium
    rationale: "The qualified majority is 5 of 6 for 27 to 30 C: generator, checker-b, checker-c and both tiebreakers;\
      \ checker-a proposes 25 to 30 C from regional context. The 2026 field study reports 29.53 C at 1 m in Xiloa.\
      \ The secondary historical account gives about 27.2 to 30 C near the surface and 27.2 to 27.8 C deeper down.\
      \ These support the rounded envelope across sampling occasions, not measured annual extrema. The wider regional\
      \ 24 to 31 C evidence concerns the great lakes, not this species' occupied lake margin. Local geothermal patches\
      \ reaching about 40 C are excluded and described in the habitat section."

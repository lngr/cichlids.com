  compatibility:
    text: "Species-only housing is not obligatory, but companions require a larger aquarium with separate territories\
      \ and an immediate removal option. The suitable partners listed here are conditional husbandry inferences,\
      \ not verified amarillo pairing trials. Small or delicate fish are vulnerable to aggression, and fry can be\
      \ eaten. Both curated crossing groups apply: the Midas complex has documented wild admixture, while the wider\
      \ Amphilophus group reflects a presumed risk from a general breeder warning. Preserve documented parentage\
      \ when breeding this species."

  socialBehavior:
    text: "Nonbreeding fish can aggregate in the lake, but an established pair is the recommended aquarium unit.\
      \ Pairing and reproduction bring strong territorial defense, and aquarium adults may remain in that state\
      \ for long periods. A fish that cannot feed, leave its refuge or escape repeated chasing needs separation.\
      \ Adding space and cover helps manage encounters but cannot make two incompatible adults a stable pair."
    sources:

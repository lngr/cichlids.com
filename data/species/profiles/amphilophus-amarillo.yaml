  breeding:
    text: "Both parents guard eggs laid on a firm substrate and defend the young. Sheltered sites among rocks or\
      \ beneath cover explain the cave-spawner code, although aquarium accounts also classify the species as an\
      \ open substrate spawner. Provide entrances and escape routes usable by both adults. Expect territorial aggression\
      \ to increase during reproduction. Published hobby accounts disagree on clutch size and development timing,\
      \ so they do not support a fixed breeding schedule here."
    sources:
    - *id036
    - *id014
    - *id035
    - *id015
    - *id012
    - *id013
  sexing:
    text: "Males generally grow larger and may develop more extended fins and a stronger forehead profile. These\
      \ are supporting clues rather than reliable markers in juveniles or fish with different growth histories.\
      \ Both sexes can develop the yellow breeding pattern. A demonstrated reproductive pair is more dependable\
      \ than a pair selected from color alone, and a sexed male and female may still prove incompatible."

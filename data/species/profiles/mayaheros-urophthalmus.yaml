  husbandry:
    text: "For a compatible adult pair, allow about 750 L and a 210 by 60 cm footprint, with more room
      for companions. Use secure heavy decor, sheltered retreats and open escape routes around a
      diggable substrate. Reliable filtration and regular water changes must match adult waste
      production. Routine freshwater care near 24 to 28 C and pH 7 to 8 is supported. GH tolerance
      above ordinary 8 to 20 dGH advice is a habitat-derived provisional extension; the median 5 to
      13 dKH tolerance also lacks established long-term numerical boundaries."

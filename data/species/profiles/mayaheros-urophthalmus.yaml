  sizeAndGrowth:
    text: "Plan for approximately 30 cm males and 25 cm females, with low confidence in the exact sex-specific
      maxima. Aquarium guidance gives usual unsexed lengths of 20 to 27 cm, whereas the published record
      reaches 39.4 cm total length. These record and aquarium measures are not interchangeable. Allow room for
      full adult development; small juveniles do not predict mature territorial pressure. Lifespan guidance
      suggests roughly 8 to 11 years."

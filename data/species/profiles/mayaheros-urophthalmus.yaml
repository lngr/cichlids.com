  ph:
    value:
      min: 7.4
      max: 8.5
    confidence: medium
    rationale: "Tally qualified-majority, 5 of 6: generator, checker-b and both tie-breakers proposed 7.4 to 8.5;
      checker-c proposed 7.4 to 8.6 and agrees within 0.3 pH; checker-a proposed 6.8 to 8.5. Median agreeing
      endpoints retain 7.4 to 8.5. Bacalar Table 1 gives 7.4 and 7.6 despite a narrower generalized sentence
      in the paper; Peten Itza surface waters give 8.2 to 8.5. The narrower decision does not erase lower
      peten seasonal means of 6.88 to 7.36 or the 8.55 Lacanja observation. These remain evidence of
      geographic variation beyond the selected envelope; means, deep-lake readings and cenotes without matched
      species records are not pooled as complete habitat extremes. The tourism cenote study cited by checker-a
      gives approximately 6.7 to 7.5, a wider lower-pH context without confirmed species occurrence at those
      sampling points."

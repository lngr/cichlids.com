        title: cichlids.com forum thread 643
        url: "https://www.cichlids.com/disc/read.php?1,643"
        accessed: 2026-10-13
  habitat:
    text: "Shallow lakeshores, slow river margins, vegetated wetlands and mangrove lagoons provide shelter and feeding sites. Brackish-water tolerance is well supported, including a native collection at 24 ppt, but freshwater aquarium maintenance is suitable. The decided water ranges summarize selected native surveys rather than every occupied locality. Bacalar is a notable sulfate-rich lagoon in a gypsum karst system, with reported calcium and magnesium concentrations equivalent to about 73.6 to 90.2 dGH while bicarbonate alkalinity remains much lower. These exceptional values describe that habitat rather than ordinary aquarium conditions or demonstrated long-term captive tolerance. GH, KH and salinity describe different properties."
    sources:
      - kind: literature
        title: Fernandez-Perez et al. (2025). Captive reproductive performance of Mayaheros urophthalmus from four
          different regions of Southeastern Mexico

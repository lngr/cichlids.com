  socialBehavior:
    text: "Adults are best managed as an established pair. Unrelated adults and incompatible partners may suffer
      sustained chasing; groups of juveniles commonly need separation as they mature. Both aggression scores
      are level 3 and the territory remains substantial outside breeding. Provide visual cover and a practical
      way to separate fish if one stops feeding, hides persistently or develops injuries. Brood defense can
      rapidly disrupt a previously workable mixed aquarium."
    sources:

        accessed: 2026-10-13
  sexing:
    text: "Mature males tend to grow larger and may have stronger coloration and more extended dorsal and anal
      fins. These tendencies are unreliable for juveniles or a single photograph. Females also change color
      around reproduction. The tail eyespot is not a sex marker, and two fish sold as opposite sexes are not
      necessarily compatible. An established breeding pair provides stronger evidence than appearance alone."

  temperatureC:
    value:
      min: 24
      max: 30
    confidence: medium
    rationale: "Tally unanimous, 4 of 4 under the 1 C agreement threshold. Generator proposed 24 to 29 C;
      checker-a, checker-b and checker-c proposed 24 to 30 C. The median agreeing endpoints give 24 to 30 C
      after integer rounding. Native collection sites measured 24 to 28 C, Chile Verde monthly means span
      24.05 to 28.90 C, and Peten Itza epilimnetic observations reach 30 C. Fernandez-Perez reports a wider
      distribution-level 18 to 34 C envelope; FishBase gives 20 to 39 C. The decided range represents selected
      shallow-water measurements rather than every season or physiological extreme. Regional cenote studies
      provide context without demonstrating occurrence at every sampling site."

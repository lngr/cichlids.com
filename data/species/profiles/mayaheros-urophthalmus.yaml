        accessed: 2026-10-13
  compatibility:
    text: "Species-only keeping is not mandatory, but companions must be substantial and robust, with extra space
      and separate retreats. Category-level candidates are listed because no reliable species-specific success
      record supports the generator's named pairings. Small schooling fish and delicate dwarf cichlids face
      predation or territorial attacks. Two presumed crossing conflicts apply: Vieja melanurus and the blood
      parrot cichlid. Both derive from artificial fertilization experiments, not demonstrated routine spawning
      with free partner choice."

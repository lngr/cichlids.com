    legacy Cichlasoma query does not retain this transferred species. The Catalog supersedes the older CRC
    subspecies treatment: aguadae, amarus, ericymba and trispilus remain separate valid Mayaheros species,
    whereas the synonymized Hubbs names listed here do not. The conchitae synonym omitted by some inputs is
    retained."

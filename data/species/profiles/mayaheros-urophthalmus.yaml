      confidence: medium
      rationale: "Tally unanimous, 4 of 4 retain 20 to 30 C. Seriously Fish gives 20 to 30, Fishkeeper 22 to 30 and
        Aqua-Fish 20 to 27. The one-year captive reproduction study maintained adults at 27.91 to 29.70. The
        broader 15 to 39 C ultimate lethal envelope in Stauffer and Boltz is an acute survival result, not
        evidence for healthy long-term keeping. Stable conditions within the husbandry band are supported more
        directly than physiological extremes."

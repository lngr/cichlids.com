  diet:
    text: "Provide complete cichlid pellets with aquatic invertebrates and a vegetable component. The decided diet
      is omnivorous, although some populations feed mainly on crustaceans or other invertebrates and the value
      of ingested detritus remains debated. Mouth-sized fish are prey risks rather than safe companions. No
      specialist protein-triggered bloat conflict is established, so bloatSensitive remains false; this does
      not imply immunity to digestive illness. Keep portions appropriate to body condition and water quality."
    sources:

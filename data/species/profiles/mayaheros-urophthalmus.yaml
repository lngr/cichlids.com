  problems:
    text: "Adult space shortages, incompatible pairs and prey-sized companions are major avoidable
      failures. Digging can undermine rocks, uproot plants and expose equipment. Large appetites and
      body mass increase filtration and maintenance demands. Monitor injuries and loss of access to
      food before social pressure becomes severe. Chemical survival extremes do not define aquarium
      targets, and neither the very high GH extension nor the median KH band is a proven long-term
      physiological boundary."

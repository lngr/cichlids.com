partners:
  suitable:
    - species: Large robust Central American cichlids
      reason: The care sources allow this category conditionally; adults must be too large to swallow.
      condition: "A tank larger than the pair minimum, separate territories and prompt removal if sustained attacks
        develop."
    - species: Large armored catfish
      reason: Seriously Fish and Fishkeeper allow substantial catfish; Aquario cautions about conflicts with bottom
        users.
      condition: "Full-grown robust individuals, protected retreats and enough extra floor space; breeding defense
        may require separation."
  unsuitable:
    - species: Paracheirodon innesi
      reason: Prey-sized adult fish face a level-2 mouth-size predation conflict.
    - species: Mikrogeophagus ramirezi
      reason: Small delicate adults face predation and sustained territorial attacks.
    - species: Vieja melanurus
      reason: "Presumed pairwise crossing conflict from artificial fertilization, plus substantial territorial and
        space demands."
    - species: blood parrot cichlid
      reason: Presumed crossing conflict from viable progeny after blood-parrot eggs were artificially fertilized
        with Mayan sperm; natural mate choice is untested.
profile:
  overview:
    text: Mayaheros urophthalmus is a substantial Atlantic Central American cichlid with dark flank bars and a
      conspicuous tail-base eyespot. Older aquarium literature calls it Cichlasoma urophthalmus. Its natural
      range extends from southern Mexico through Belize and Guatemala to Honduras and Nicaragua; Florida
      populations are introduced. The false-red-terror trade name can cause confusion with Mesoheros festae.
      An established pair rewards close observation but needs substantial space and experienced management.
    sources:
      - kind: catalog-of-fishes
        title: "Eschmeyer's Catalog of Fishes: species of Mayaheros, updated 21 September 2026"
        url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Ma\
          yaheros"
        archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-53c4f361/2026-10-14T101215Z
        accessed: 2026-10-13
      - kind: database

  breeding:
    text: "A compatible pair deposits adhesive eggs on a prepared surface or in a shallow substrate depression,
      and both parents defend the brood. It is an open substrate spawner. Protection can make companions
      unsafe and requires a separation option. Offspring numbers vary greatly and may reach thousands, so
      breeding needs capacity and homes for the young. Once fry swim freely, appropriately small foods such as
      Artemia nauplii and fine prepared food are suitable."

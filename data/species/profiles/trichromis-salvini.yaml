        - {by: generator, value: {type: invertivore, bloatSensitive: false}}
        - {by: checker-a, value: {type: invertivore, bloatSensitive: false}}
        - {by: checker-b, value: {type: invertivore, bloatSensitive: false}}
        - {by: checker-c, value: {type: omnivore, bloatSensitive: false}}
        - {by: tiebreaker-1, value: {type: invertivore, bloatSensitive: false}}
        - {by: tiebreaker-2, value: {type: invertivore, bloatSensitive: false}}
      decision: {type: invertivore, bloatSensitive: false}
      rationale: >-
        Taken from the tally: qualified majority of 5 of 6 votes. The studies of wild fish show
        mainly invertebrate prey; checker-c weighted the omnivorous aquarium diet named by care
        sheets. The food list of the generator is kept.
    - field: features.maxSizeCm
      proposals:
        - {by: generator, value: {male: 17, female: 12}}
        - {by: checker-a, value: {male: 16, female: 11}}
        - {by: checker-b, value: {male: 16, female: 12}}
        - {by: checker-c, value: {male: 18, female: 12}}
      decision: {male: 16.5, female: 12}
      rationale: >-
        Generator proposed 17 cm male and 12 cm female; checker-a proposed 16 cm male and 11 cm
        female; checker-b proposed 16 cm male and 12 cm female; checker-c proposed 18 cm male
        and 12 cm female. The component medians are 16.5 cm male and 12 cm female. Seriously
        Fish gives about 15.2 cm standard length for males and 11.4 cm for females; these
        exclude the tail and cannot be used directly as total-length planning values. AquaInfo
        reports an unsexed 15 to 18 cm range and an 18 cm measured maximum, while
        TropicalFreshwaterFish gives 15 cm males and 10 cm females. Fishkeeper gives an unsexed
        20 cm figure, USGS 13 cm standard length and FishBase a 22 cm standard-length record.
        These establish variation and differing measurement conventions, but no source
        establishes a typical aquarium male limit of exactly 17 cm. Use the male median of 16.5
        cm and female median of 12 cm as provisional total-length estimates within the aquarium
        guidance. Record sizes are not typical captive ceilings.
    - field: features.aggressionConspecific
      proposals:
        - {by: generator, value: 3}
        - {by: checker-a, value: 3}
        - {by: checker-b, value: 3}
        - {by: checker-c, value: 4}
      decision: 3
      rationale: >-
        AquaInfo reports a high risk for the female in a pair, which checker-c read as level 4. Seriously
        Fish, Fishkeeper and the archive tie the injuries to unpaired adults, small tanks and missing
        cover, which matches level 3; the risk is described in the profile text.
    - field: features.territory
      proposals:
        - {by: generator, value: {size: small, breedingOnly: false}}
        - {by: checker-a, value: {size: large, breedingOnly: false}}
        - {by: checker-b, value: {size: small, breedingOnly: false}}
        - {by: checker-c, value: {size: large, breedingOnly: false}}
      decision: {size: large, breedingOnly: false}
      rationale: >-
        The small proposals rest on one archive report of a non-breeding female holding about 30 cm.
        Breeding pairs, which form readily in the tank, defend much more (over 2 m in the wild after
        AquaInfo, a wide area after Fishkeeper), so the larger class is taken; it errs on the side of
        more warnings.
    - field: features.habitatZones
      proposals:
        - {by: generator, value: [rock, sand, openWater, wood]}
        - {by: checker-a, value: [openWater, rock, wood, sand]}
        - {by: checker-b, value: [sand, rock, wood]}
        - {by: checker-c, value: [rock, sand, openWater, plants, wood]}
      decision: [rock, sand, openWater, wood]
      rationale: >-
        Three runs include open water, supported by the hunting in the river current that Seriously
        Fish describes. Plants were proposed by checker-c from juveniles in Centla vegetation; adults
        rely on rock and wood, and Seriously Fish only tolerates plants in the tank, so plants are
        left out.
    - field: features.coloration
      proposals:
        - {by: generator, value: {baseColors: [yellow, black, red, blue], pattern: stripes}}
        - {by: checker-a, value: {baseColors: [yellow, red, black], pattern: stripes}}
        - {by: checker-b, value: {baseColors: [yellow, black], pattern: mixed}}
        - {by: checker-c, value: {baseColors: [yellow, red, blue, green, black], pattern: mixed}}
      decision: {baseColors: [yellow, black, red, blue], pattern: stripes}
      rationale: >-
        All runs name yellow and black, three name red and two blue; the blue spangles are part of
        the three colours behind the genus name, while green appears only as a sheen. The dominant
        markings are a lengthwise band and a second row of blotches that AquaInfo describes as
        merging into a second band, which is stripes.
    - field: features.feedingSpeed
      proposals:
        - {by: generator, value: hasty}
        - {by: checker-a, value: hasty}
        - {by: checker-b, value: normal}
        - {by: checker-c, value: normal}
      decision: hasty
      rationale: >-
        No source rates the pace directly. Fishkeeper and an importer describe an eager feeder and
        keepers report it outcompeting slower fish; hasty keeps the warning for slow-feeding
        tankmates.
    - field: features.minTank
      proposals:
        - {by: generator, value: {volumeL: 240, lengthCm: 120, depthCm: 45}}
        - {by: checker-a, value: {volumeL: 240, lengthCm: 120, depthCm: 45}}
        - {by: checker-b, value: {volumeL: 200, lengthCm: 100, depthCm: 40}}
        - {by: checker-c, value: {volumeL: 540, lengthCm: 160, depthCm: 60}}
      decision: {volumeL: 300, lengthCm: 150, depthCm: 45}
      rationale: >-
        Generator proposed 240 L, 120 cm length and 45 cm depth; checker-a proposed 240 L, 120
        cm length and 45 cm depth; checker-b proposed 200 L, 100 cm length and 40 cm depth;
        checker-c proposed 540 L, 160 cm length and 60 cm depth. The component medians are 240
        L, 120 cm length and 45 cm depth. The unit is one adult pair. AquaInfo explicitly
        requires 150 cm length for a pair, supported by Aquarium Glaser, providing a concrete
        reason to exceed the 120 cm length median. Fishkeeper gives 120 cm for a pair and 180 cm
        with companions; TropicalFreshwaterFish gives about 190 L and 122 cm, Seriously Fish
        about 103 L and a 90 by 30 cm base, and the Nordic register 540 L and 160 cm. Use the 45
        cm depth median because no pair-specific source establishes 50 cm as necessary. The 240
        L volume median at the median 120 by 45 cm base implies about 44.4 cm nominal height.
        Extending that same cross-section to the source-backed 150 cm pair length requires 300
        L, so the volume follows a concrete geometric adjustment rather than the largest
        proposal or an unspecified safety margin. The dimensions are a provisional pair plan;
        companions require more space.
    - field: features.lifespanYears
      proposals:
        - {by: generator, value: {min: 8, max: 12}}
        - {by: checker-a, value: {min: 8, max: 13}}
        - {by: checker-b, value: {min: 8, max: 12}}
        - {by: checker-c, value: {min: 8, max: 10}}
      decision: {min: 8, max: 12}
      rationale: All proposals are estimates; the range of two runs is kept and the ten years of a hobby guide fall inside it.
    - field: features.breeding
      proposals:
        - {by: generator, value: open-substrate-spawner}
        - {by: checker-a, value: open-substrate-spawner}
        - {by: checker-b, value: cave-spawner}
        - {by: checker-c, value: open-substrate-spawner}
      decision: open-substrate-spawner
      rationale: >-
        Checker-b found no source naming the spawning site. Seriously Fish, Fishkeeper, AquaInfo and
        the Nordiska Ciklidsällskapet register describe spawning on a cleaned flat stone, and the
        Cichlid Room Companion confirms open-substrate spawning.
    - field: features.beginnerSuitability
      proposals:
        - {by: generator, value: moderate}
        - {by: checker-a, value: moderate}
        - {by: checker-b, value: moderate}
        - {by: checker-c, value: demanding}
      decision: moderate
      rationale: >-
        Seriously Fish rates the difficulty as moderate and the Cichlid Room Companion as
        intermediate; the species is hardy and easy to feed. Checker-c weighted the aggression more
        heavily, which the aggression levels and the profile text already express.

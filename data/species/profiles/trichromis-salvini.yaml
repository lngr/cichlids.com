variants:
  - name: Usumacinta
    kind: locality
    note: Fish from the Usumacinta drainage are known for an intense red belly; body colour varies by locality from greenish to bright lemon yellow.
  - name: Laguna Miramar
    kind: locality
    note: A dwarf population from this lake in the Chiapas rainforest stays at about 8 cm.

features:
  origin:
    value:
      continent: Central America
      region: Atlantic slope of southern Mexico, Guatemala and Belize (from the Papaloapan basin east through the Grijalva-Usumacinta system to the Yucatán Peninsula and the rivers of Belize)
      waterbody: null
      localities:
        - Río de Santa Isabel, Guatemala (type locality)
        - Lake Petén Itzá, Guatemala (type locality)
        - Laguna Bacalar, Quintana Roo (probable type locality of Heros triagramma)
        - Río Usumacinta
        - Río Lacantún basin, Chiapas
        - Río Tzendales, Chiapas
        - Tacotalpa, Puyacatengo and Ixtapangajoya drainages (Grijalva), Tabasco and Chiapas
        - Pantanos de Centla, Tabasco
        - Río San Pedro, Tabasco
        - Laguna Caobas, Quintana Roo
        - Chile Verde Lagoon, Quintana Roo
        - Los Petenes, Campeche
        - Papaloapan drainage
    confidence: high
    rationale: >-
      The Catalog of Fishes and FishBase place the species on the Atlantic slope of southern Mexico,
      Guatemala and Belize; the USGS fact sheet and Fishkeeper name the Papaloapan basin as the
      western limit. Field studies confirm it in the Lacantún and Tzendales rivers of the
      Usumacinta basin, in Grijalva tributaries of Tabasco, in the Pantanos de Centla wetland, in
      Laguna Caobas and Chile Verde Lagoon in southern Quintana Roo and in the Petenes of Campeche.
      It lives in rivers, lagoons and lakes, none of them a lake of the waterbody table, so the
      waterbody is empty. Some hobby pages add Honduras, which the Catalog of Fishes does not
      list. The population established in Florida is introduced and not part of the native range.

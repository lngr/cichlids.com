  temperatureC:
    value: {min: 23, max: 30}
    confidence: medium
    verification:
      method: qualified-majority
      votes: {agree: 5, total: 6}
    rationale: >-
      Decided by qualified majority: the generator (23 to 30 °C), checker-a and checker-b (24 to
      30 °C) and both tie-breakers (23 to 30 °C) agree; checker-c proposed 24.1 to 32 °C. The range
      rests on field measurements from habitats of the species: site means of 23.6 to 29.6 °C in
      the Lacantún basin, 25.1 to 29.3 °C in Laguna Caobas, about 24 to 29 °C in Chile Verde
      Lagoon, 25.4 to 30 °C in the upper water column of Lake Petén Itzá, a type locality, and
      station means of 24.1 to 29.9 °C in the Centla wetland. Sources reach wider: the Usumacinta
      main stem drops to 20.8 °C at one upstream station in the rainy season, single lower
      Usumacinta sites reach 22.96 to 33.88 °C, spring channels of the Campeche petenes 31.8 °C,
      shallow Centla lagoons 26 to 35 °C, one San Pedro collection of juveniles 32 °C, and AquaInfo
      summarises the habitat as 24 to 32 °C. These higher readings come from shallow, sun-warmed
      water in the dry season and describe short peaks rather than the typical habitat. FishBase
      gives 22 to 32 °C from an aquarium reference, which is no habitat measurement. Medium
      confidence because most values describe the basins rather than exact capture points.

  habitatZones:
    value: [rock, sand, openWater, wood]
    confidence: medium
    rationale: >-
      In the Tzendales River the species lives at deeper sites with current and rocky ground;
      Seriously Fish notes that it hunts in the flowing middle of rivers, AquaInfo that juveniles
      stay among stones in the current while older males hold territories under fallen branches
      near the bank. The USGS fact sheet adds lagoons and swamps over sand, mud or rock. Juveniles in
      the Centla wetland are often found in marginal vegetation, but adults rely on rock and wood for
      cover. In the tank it needs sand for digging, rock and wood for cover and open swimming space.
    sources:
      - *soria2008
      - *seriouslyfish
      - *aquainfo
      - *nas
      - *macossay
      - *fishkeeper


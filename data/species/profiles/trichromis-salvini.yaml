partners:
  suitable:
    - species: Rocio octofasciata
      reason: Similar size and temperament and shares parts of the natural range; a common long-term companion in Central American tanks.
      condition: Tank of at least 180 cm length with several separated territories.
    - species: Mayaheros urophthalmus
      reason: Robust cichlid from the same river systems that is large enough to hold its own against a breeding pair.
      condition: At least 180 cm length.
    - species: Herichthys cyanoguttatus
      reason: Larger and robust enough to hold its own against a breeding pair.
      condition: At least 180 cm length.
    - species: Amatitlania nigrofasciata
      reason: Equally tough and claims only a small territory; both species usually settle into a stable pecking order.
      condition: At least 180 cm length with plenty of caves; expect conflicts when both pairs breed.
    - species: Pterygoplichthys gibbiceps
      reason: Large armoured catfish that is active at night and too big and well protected to be harmed.
    - species: Platydoras armatulus
      reason: Robust, nocturnal doradid catfish that keeps out of the way of the cichlids.
  unsuitable:
    - species: Paracheirodon innesi
      reason: Small tetras fall below the prey size of Salvin's cichlid and are eaten.
    - species: Pterophyllum scalare
      reason: Slow, peaceful and long-finned; it is harassed and young angelfish are eaten.
    - species: Symphysodon aequifasciatus
      reason: Needs soft, warm water, eats slowly and cannot cope with the aggression.
    - species: Parachromis dovii
      reason: Large piscivore that eats Salvin's cichlid; the size difference is too great.
    - species: Tropheus moorii
      reason: Species-only keeping is recommended for Tropheus, and its plant-based diet and bloat sensitivity conflict with the meaty diet of Salvin's cichlid.
    - species: Thorichthys meeki
      reason: Related, similar in size but less forceful; hobby literature advises against the combination because a breeding salvini pair keeps firemouths under constant pressure.

profile:
  overview:
    text: >-
      Salvin's cichlid, also sold as yellow-belly or tricolor cichlid, is a medium-sized Central
      American cichlid from the Atlantic slope of southern Mexico, Guatemala and Belize. Long
      kept as Cichlasoma salvini, it is the only species of the genus Trichromis, whose closest
      relatives are the firemouth cichlids of Thorichthys. The genus name refers to its three
      colours: a yellow body, blue spangles and a red belly. Males reach about 16.5 cm and
      females about 12 cm in the aquarium. It is hardy and copes with a wide range of water, but
      it is one of the most aggressive cichlids of its size, above all when breeding. It suits a
      large Central American tank with robust tankmates, provided the keeper plans for space and
      careful pairing.
    sources:
      - *cof
      - *seriouslyfish
      - *fishkeeper
      - *aquainfo
      - *wiki_de
  habitat:
    text: >-
      The species lives in rivers, streams, lagoons and lakes of the lowlands and middle valleys
      between the Papaloapan basin and Belize, including the Grijalva-Usumacinta system, the
      Pantanos de Centla wetland, the karst country of the Yucatán Peninsula and Lake Petén Itzá,
      one of its type localities. It is not found above about 500 m. In the Usumacinta tributaries
      it favours deeper water flowing over rocky ground and hunts in the current more than many
      relatives; it also enters calm lagoons, marshes and slightly brackish coastal water, where the
      young often shelter in marginal vegetation. The water is warm, typically 23 to 30 °C, slightly
      acid to alkaline at pH 6.6 to 8.5, moderately hard to hard at about 8 to 20 dGH and 5 to 10
      dKH; shallow lagoons heat up further in the dry season, some lagoons are softer in the rainy
      season and a few gypsum-rich karst lakes are far harder. Genetic work suggests that
      populations from different basins may represent more than one species.
    sources:
      - *larre
      - *soria2008
      - *valtierra
      - *perez2010
      - *albarran
      - *macossay
      - *soria_reinoso
      - *esj
      - *aquainfo
      - *nas
      - *biorxiv
  sizeAndGrowth:
    text: >-
      In good aquarium conditions males grow to about 16 to 18 cm total length and females to about
      11 to 13 cm. Larger figures in the literature, up to 22 cm standard length, are rare maximum
      values. Size also differs between populations: a dwarf form from Laguna Miramar in Chiapas
      stays at about 8 cm. Growth is fast in the first year with regular feeding and frequent water
      changes, and the fish start to breed well before they are fully grown. The body is oval and
      laterally compressed, with a pointed, protrusible mouth suited to picking prey from the bottom
      and snapping it from open water.
    sources:
      - *seriouslyfish
      - *aquainfo
      - *fishkeeper
      - *fishbase
      - *nas
  husbandry:
    text: >-
      A pair needs a tank of about 150 cm length, 45 cm depth and 300 litres; with tankmates
      plan 180 cm or more. Use a sand bottom, since the fish dig pits for their young, and build
      caves and visual barriers from stones and roots so that a harassed partner can get out of
      sight, with an open area for swimming. Tough plants tied to wood, such as Java fern or
      Anubias, last better than rooted plants. The species comes from flowing water: give strong
      filtration, good oxygenation and a zone of current. Keep the water at about 24 to 28 °C
      and pH 7 to 8; the species stays healthy long-term within 22 to 30 °C, pH 6.5 to 8.5, 5 to
      20 dGH and 4 to 12 dKH, so most tap water suits it. Nitrate should stay low, so change a
      large part of the water every week.
    sources:
      - *aquainfo
      - *fishkeeper
      - *seriouslyfish
      - *fishbase
      - *tff
  socialBehavior:
    text: >-
      Salvin's cichlid forms monogamous pairs. Two adults bought separately often do not accept each
      other and the weaker fish may be badly hurt, so it is best to raise five or six juveniles
      together, let a pair form and rehome the others. Even an established pair can turn on each
      other around spawning, particularly after a failed brood or in small tanks where the female
      cannot retreat; robust dither fish draw some of the male's aggression away from her. More than
      one pair per tank rarely works. Outside the breeding season the fish is fairly retiring, but a
      breeding pair claims a large area and chases tankmates well beyond its spawning site.
    sources:
      - *seriouslyfish
      - *fishkeeper
      - *aquainfo
      - *arch50
      - *arch1217
      - *arch1256
  diet:
    text: >-
      In the wild the species feeds mainly on aquatic insects and their larvae, small crustaceans
      and other invertebrates, takes small fish when it can and, in some pools, swallows a fair
      amount of detritus with its prey. In the aquarium it accepts nearly every food. A good cichlid
      pellet or granule can be the staple, supplemented several times a week with frozen mysis,
      krill, shrimp, bloodworm or mosquito larvae; occasional vegetable food such as spirulina flakes
      adds variety. Live feeder fish are unnecessary and carry a risk of disease. Feed small portions
      once or twice a day; overfeeding mainly spoils the water.
    sources:
      - *fishbase
      - *soria2019
      - *valtierra
      - *hinojosa
      - *fishkeeper
      - *seriouslyfish
  breeding:
    text: >-
      Breeding is easy once a true pair has formed. Both fish colour up strongly, and the female,
      who often takes the lead, cleans a flat stone or the floor of a cave while the male guards the
      area. She lays about 500 to 600 eggs, which hatch after three to four days. The parents move
      the wrigglers to pits dug in the sand, and the fry swim freely after another four to five
      days. They take Artemia nauplii and fine powdered food at once and are led around the tank by
      both parents for several weeks. During this time the pair is at its most aggressive, so
      tankmates need room to keep away. Removing the fry early can leave the male to vent his
      aggression on the female, so it is often safer to leave the young with the parents for a
      while and to plan homes for them in advance.
    sources:
      - *fishkeeper
      - *seriouslyfish
      - *aquainfo
      - *fishbase
  sexing:
    text: >-
      Adult males are clearly larger and have longer, more pointed tips on the dorsal and anal fins.
      Females stay smaller and usually carry a dark spot in the middle of the dorsal fin and another
      at the lower edge of the gill cover; in some populations males show the dorsal spot as well.
      The red of the belly is usually stronger in females, especially when they are ready to spawn,
      while males tend to show a sharper contrast between the dark markings and the pale areas of the
      body. Juveniles are hard to sex until the dorsal fin spot of the females appears.
    sources:
      - *seriouslyfish
      - *aquainfo
      - *fishkeeper
      - *wiki_en
  compatibility:
    text: >-
      Combine Salvin's cichlid only with fish of similar size and toughness, such as Jack Dempsey,
      Mayan cichlids, Texas cichlids or convicts, and with large armoured catfish, in a tank of at
      least 180 cm. Any fish small enough to be swallowed, from tetras to young angelfish, will be
      eaten. Calm or slow species such as discus or angelfish are bullied and should not be kept with
      it. Large predators such as Parachromis dovii are a danger to Salvin's cichlid itself.
      Firemouths are related but are kept under constant pressure by a breeding salvini pair, and
      hobby literature advises against the combination. Introducing all fish at the same time
      reduces conflicts.
    sources:
      - *seriouslyfish
      - *fishkeeper
      - *aquainfo
      - *nordic
      - *arch50
      - &arch675
        kind: archive
        title: cichlids.com forum thread 675
        url: https://www.cichlids.com/disc/read.php?1,675
  problems:
    text: >-
      The most common mistake is buying two adults and expecting them to pair; if they do not, one
      fish is beaten up. A second mistake is keeping a pair in a tank that is too small or too open,
      where the male may attack the female after spawning or after a failed brood. Watch the pair
      closely, provide visual barriers and keep a divider ready. As a fish of flowing water it reacts
      badly to high nitrate and low oxygen: poor water and an unbalanced diet are linked with
      hole-in-the-head disease and faded colours. Like other cichlids it can bring white spot disease
      in with new arrivals, so quarantine new fish. Feeding live fish carries a risk of parasites. In
      warm, oxygen-poor tanks it breathes rapidly near the surface, a signal to increase aeration and
      water changes.
    sources:
      - *fishkeeper
      - *seriouslyfish
      - *aquainfo
      - *arch1217
      - *arch1256


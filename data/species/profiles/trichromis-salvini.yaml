    confidence: low
    rationale: >-
      Outside breeding the species is a shy fish that holds a modest spot; an archive keeper saw a
      female defend about 30 cm in a large community tank. Once a pair breeds, the defended area
      grows sharply: AquaInfo reports wild pairs defending territories more than two metres across
      against much larger fish, and Fishkeeper asks for 120 cm for a single pair because the pair
      claims a wide area. Pairs spawn readily in the aquarium, so the value follows the breeding

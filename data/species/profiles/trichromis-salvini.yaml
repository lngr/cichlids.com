  ph:
    value: {min: 6.6, max: 8.5}
    confidence: medium
    verification:
      method: qualified-majority
      votes: {agree: 5, total: 6}
    rationale: >-
      Decided by qualified majority: checker-a (6.8 to 8.5), the generator (7.1 to 8.3), checker-c
      (6.55 to 8.5), tie-breaker-1 (6.5 to 8.5) and tie-breaker-2 (6.55 to 8.5) agree, and the
      decided range is the median of their bounds; checker-b proposed 7.3 to 8.5. The rivers of
      the range drain limestone and are slightly alkaline: site means of 7.3 to 8.1 in the Lacantún
      basin, 7.3 to 8.3 along the Usumacinta main stem and 7.1 to 7.9 at middle Usumacinta sites.
      Lake Petén Itzá reaches 8.2 to 8.5 near the surface. Lagoons dip below neutral: Laguna
      Caobas ranged from 6.55 to 8.23 with a mean of about 7.0, which contradicts the statement of
      AquaInfo that the habitat water is always at pH 7.5 or more. Sources reach wider than the
      decided range: Centla lagoons from 6.1 to 8.5, single lower Usumacinta readings up to 8.93
      and Chile Verde Lagoon at a mean of 8.3 with a spread up to about 8.9. FishBase gives 7.0 to
      8.0 from an aquarium reference.

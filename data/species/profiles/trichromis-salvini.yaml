id: trichromis-salvini
legacyIds: [707]
status: described

taxonomy:
  validName: Trichromis salvini
  genus: Trichromis
  species: salvini
  author: (Günther, 1862)
  source: &cof
    kind: catalog-of-fishes
    title: "Eschmeyer's Catalog of Fishes: species of the genus Trichromis"
    url: https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Trichromis
    archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-15552f8f/2026-10-14T103510Z
    accessed: 2026-10-13
  synonyms:
    - name: Heros salvini
      note: Original combination (Günther, 1862); syntypes from the Río de Santa Isabel and Lake Petén Itzá, Guatemala.
    - name: Heros triagramma
      note: Steindachner, 1864; a synonym of Trichromis salvini in the Catalog of Fishes; its type probably came from Laguna Bacalar, Quintana Roo.
    - name: Cichlasoma salvini
      note: Combination used in most literature and in the hobby before the genus Trichromis was erected in 2015.
    - name: Nandopsis salvini
      note: Combination used by Burgess (2000) and in the trade.
  legacyNames:
    - Cichlasoma salvini
  note: >-
    The Catalog of Fishes (online version updated 21 Sep. 2026, queried for Trichromis, Cichlasoma,
    Heros and Amphilophus on 2026-10-13) lists the species as valid Trichromis salvini, the only
    species of the genus Trichromis McMahan and Chakrabarty, 2015. Some hobby pages and older works
    give Cichlasoma tenue Meek, 1906 as a synonym; the Catalog of Fishes treats that name as a
    synonym of Amphilophus trimaculatus, so it is not listed here. A 2026 phylogenomic preprint
    reports unrecognised genetic diversity within T. salvini, so the species may be split in future.


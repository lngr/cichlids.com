  aggressionConspecific:
    value: 3
    confidence: medium
    rationale: >-
      Seriously Fish and Fishkeeper describe the species as very aggressive, especially when
      breeding, and advise a true pair grown up from a group of juveniles, because adults that do
      not pair fight. AquaInfo goes further: keeping a pair stays risky, the female often suffers,
      above all after a failed spawning, and more than one pair per tank is hardly possible. Archive
      keepers report a partner beaten in small tanks and parents fighting over the brood. Most
      reports tie the injuries to cramped tanks, missing cover or unpaired adults, which is level 3;
      level 4 was proposed on the strength of the AquaInfo account, but the other care sources do not
      report routine killing of partners in adequate tanks with retreats and dither fish.
    sources:
      - *seriouslyfish
      - *fishkeeper
      - *aquainfo
      - *arch50
      - &arch1217
        kind: archive
        title: cichlids.com forum thread 1217
        url: https://www.cichlids.com/disc/read.php?1,1217
      - &arch1256
        kind: archive
        title: cichlids.com forum thread 1256
        url: https://www.cichlids.com/disc/read.php?1,1256
    evidence:
      - source: *seriouslyfish
        value: 3
        note: Adults that do not pair turn on each other.
      - source: *fishkeeper
        value: 3
        note: Very aggressive, best kept as a compatible pair.
      - source: *aquainfo
        value: 4
        note: Pair keeping risky for the female; several pairs per tank hardly possible.

  aggressionHeterospecific:
    value: 3
    confidence: medium
    rationale: >-
      Seriously Fish calls the species aggressive for its size and advises only similarly sized and
      similarly forceful Central American cichlids as tankmates; Fishkeeper classes it as unsuitable
      for community tanks and asks for robust companions in a tank of 180 cm or more; the Nordiska
      Ciklidsällskapet register recommends only large cichlids and catfish. AquaInfo reports that in
      the wild breeding pairs drive off much larger fish. Archive keepers rank it among the most
      aggressive Central Americans of its size but keep it with Jack Dempseys, Texas cichlids and
      convicts in large tanks. Tankmates must match it in size and robustness, which is level 3.
    sources:
      - *seriouslyfish
      - *fishkeeper
      - *nordic
      - *aquainfo
      - *arch50

  sizeAndGrowth:
    text: "Use 13 cm for males and 9.5 cm for females as provisional aquarium planning sizes. These are\
      \ medians of differing candidate identifications, not measurements of identified Jaro adults. The\
      \ Cynotilapia locality account gives aquarium males near 12 cm and females near 8 cm; NCS gives\
      \ 12 and 10 cm for Placidochromis jalo. Standard-length database records cannot be treated as equivalent\
      \ total lengths. Longevity is estimated at 5.5 to 9 years and has no direct confirmation for this\
      \ label."
    sources:

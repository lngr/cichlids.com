    confidence: low
    rationale: "All four full profiles propose Lake Malawi. The generator proposes Jaro in Malawi, checker-a\
      \ Jalo Reef, checker-b Jalo Reef and Mbenji Islands, and checker-c Jalo Reef. These are candidate\
      \ collection sites for different fish, not verified sites for legacy entry 313. Cichlid News places\
      \ its Jaro Placidochromis report under Malawi, while the registers place both Cynotilapia and Aulonocara\
      \ Jalo forms in Malawi. No Lake Victoria reassignment is supported. Localities remain unassigned\
      \ until the stock is identified."

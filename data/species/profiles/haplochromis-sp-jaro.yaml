  husbandry:
    text: "For one male and four females, start with 250 L and a base of at least 120 by 45 cm. Arrange\
      \ stable shelters with separate escape routes and open sand and swimming space. The footprint is\
      \ a planning inference from comparative care advice. Maintain clean, well-aerated water and avoid\
      \ sudden chemical changes. The settled long-term planning intervals are 21 to 29 C, pH 7.5 to 8.7,\
      \ 3 to 25 dGH and 5 to 15 dKH. These provisional ranges include the natural lake values and should\
      \ not be treated as targets to cycle between or as experimentally proven failure boundaries."
    sources:
    - *id018
    - *id019

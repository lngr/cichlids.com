  note: "Retain the unresolved aquarium label. The generator identifies a Placidochromis candidate, checker-a\
    \ an Aulonocara sp. 'jalo' candidate, and checkers b and c identify Cynotilapia zebroides. Cichlid\
    \ News reports a Placidochromis electra-like green-faced form from Jaro, Zoopet uses Jaro afra for\
    \ Cynotilapia sp. 'jalo', and CRC separately lists Aulonocara sp. 'jalo'. The Catalog validates C.\
    \ zebroides but does not connect entry 313 to it. Similar locality spellings are insufficient to establish\
    \ a synonym. No read source supports Lake Victoria for this label. A peacock picture caption mentioned\
    \ by checker-a was unreadable and cannot establish identity. The AlbertaAquatica list and the Placidochromis\
    \ CRC page remain inaccessible."

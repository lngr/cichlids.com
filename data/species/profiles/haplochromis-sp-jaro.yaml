    - *id072
  socialBehavior:
    text: "Keep a single male with four females as the provisional social unit. Males of the Cynotilapia\
      \ candidate defend cave sites and may chase rivals or females persistently; territorial chasing\
      \ can also involve other fish. Provide visual breaks and observe whether all fish can retreat and\
      \ feed. A small defended area is assumed to persist outside an individual spawning event. Gentler\
      \ Placidochromis and peacock accounts remain alternative evidence, so the identity of a purchased\
      \ fish can materially change these expectations."
    sources:
    - *id018
    - *id019
    - *id020
    - *id040
    - *id021
    - *id008
    - *id022
    - *id047
    - *id002
    - *id006
  diet:
    text: "Use a mixed diet with a substantial plant component and appropriately sized invertebrate and\
      \ prepared foods. The settled omnivore classification follows the candidate accounts of plankton\
      \ feeding and grazing. The normal feeding pace is only an estimate, so check each fish receives\
      \ food. No special bloat sensitivity is established for the unresolved label, but the retailer account\
      \ warns about rich food and bloat in its Jalo Reef fish. That warning remains relevant uncertainty\
      \ and does not justify a meat-heavy routine."

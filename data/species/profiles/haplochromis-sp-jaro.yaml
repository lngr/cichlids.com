  compatibility:
    text: "The settled speciesOnly flag is false, but companion choice remains conditional on identity.\
      \ Comparative sources disagree: peacock and Placidochromis accounts favour calm Malawi fish, while\
      \ afra advice favours compatible mbuna. Confirm temperament before selecting named companions. The\
      \ tally conservatively assigns the zebroides and zebra hybrid group; this is a precaution based\
      \ on a possible Cynotilapia identity, not proof that the legacy fish crosses with either named species.\
      \ Avoid breeding mixtures of uncertain Jaro stock and the listed group members. Predation level\
      \ 0 means no supported routine fish feeding, with accidental fry capture possible."

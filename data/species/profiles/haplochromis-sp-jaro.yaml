  problems:
    text: "The main preventable problems are crowding, sustained chasing, poor water quality and an unsuitable\
      \ feeding routine. Identity uncertainty makes a generic Jaro care label unreliable. A cichlids.com\
      \ archive post mentions a Jaro fish refusing food in a troubled community, but neither the fish's\
      \ identity nor the cause was established; it does not show a species-specific disease. The disagreeing\
      \ bloat warning is retained, and the settled false flag is not evidence that the fish cannot develop\
      \ digestive disease."

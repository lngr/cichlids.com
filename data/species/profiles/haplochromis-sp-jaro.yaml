      \ a general zebra-type risk. The literature on the original Thumbi crosses uses C. afra and does\
      \ not independently identify Jaro as zebroides. Gerlai's different afra and fryeri cross cannot\
      \ be transferred as another group. Membership for Jaro is precautionary under the tally rule and\
      \ depends on the uncertain Cynotilapia identification. The alternative Aulonocara identity and all\
      \ empty-list evidence remain recorded."

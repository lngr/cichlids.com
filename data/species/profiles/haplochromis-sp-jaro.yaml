profile:
  overview:
    text: "Haplochromis sp. 'Jaro' is an unresolved Lake Malawi aquarium label. The strongest spelling\
      \ match is the Jaro afra name used for a Cynotilapia Jalo form, but an older magazine also reports\
      \ a green-faced Placidochromis from Jaro and CRC separately lists a Jalo peacock. These references\
      \ do not identify legacy entry 313. Retain undescribed status and verify the stock using locality\
      \ records and mature-fish photographs before treating it as a named species. No read source supports\
      \ a Lake Victoria origin."
    sources:
    - *id067
    - *id001
    - *id068
    - kind: catalog-of-fishes
      title: "Eschmeyer's Catalog of Fishes, species of Cynotilapia"
      url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Cynotilapia"
      accessed: 2026-10-13
      archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-61f3da92/2026-10-14T095558Z

  habitat:
    text: "Lake Malawi is the working origin, with the collecting locality unconfirmed. Related candidate\
      \ accounts describe rocks, cave shelter and adjacent sand; the Cynotilapia comparison also uses\
      \ open space above the bottom for feeding. Provide these zones without assuming that Jalo Reef or\
      \ Mbenji is the collection site of the legacy fish. The lake measurements adopted here are 21 to\
      \ 29 C, pH 7.7 to 8.6, 3 to 5 dGH and 5 to 8 dKH. They describe the lake rather than a demonstrated\
      \ preference of Jaro stock."

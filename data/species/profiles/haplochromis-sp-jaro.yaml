  sexing:
    text: "The selected Cynotilapia comparison suggests that mature males show blue coloration with dark\
      \ bars and yellow in the dorsal fin, while females and subordinate males are less vivid. The alternative\
      \ Placidochromis report has a green-faced male, so appearance is also a clue to the unresolved identity.\
      \ Colour alone is an unreliable way to sex young or subordinate fish. The profile's male and female\
      \ size estimates are planning figures rather than diagnostic measurements."

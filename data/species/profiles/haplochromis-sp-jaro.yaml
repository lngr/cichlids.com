    rationale: "The tally makes a conservative decision because no qualified majority exists. Generator\
      \ and tiebreakers 1 and 2 propose an empty list, checker-a proposes aulonocara, and checkers b and\
      \ c propose cynotilapia-zebroides-maylandia-zebra. Only the latter nonempty group receives at least\
      \ two votes, so it is retained exactly; the reported vote count of three of six reflects the largest\
      \ agreeing candidate, the empty list, rather than three direct endorsements of this group. Malawi.si\

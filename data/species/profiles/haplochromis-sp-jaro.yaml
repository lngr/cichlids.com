  breeding:
    text: "Maternal mouthbrooding is the mode shared by all credible identity candidates. A female carries\
      \ the clutch in her mouth and needs refuge from male attention and disturbance. No verified Jaro\
      \ account establishes clutch size or incubation duration, so figures from a particular Jalo stock\
      \ should not be assigned to this label. The predation decision allows accidental fry capture and\
      \ cannot guarantee fry survival in a community."

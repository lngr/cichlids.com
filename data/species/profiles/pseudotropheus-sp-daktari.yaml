profile:
  overview:
    text: "Daktari is a small Lake Malawi mbuna whose name is still informal. This profile keeps the trade label Pseudotropheus\
      \ sp. 'daktari'; specialists also use Maylandia or Metriaclima for the same fish. Dominant males are mainly yellow,\
      \ with a blue overlay in the southern populations and darker fin margins in some accounts. The combination of a\
      \ modest adult size, female mouthbrooding and territorial male behaviour makes it an interesting choice for a carefully\
      \ arranged Malawi aquarium. Scientific research includes a Hai Reef breeding family, but does not settle the species\
      \ boundaries or provide a complete husbandry trial. Locality names help preserve the identity of stock under this\
      \ undescribed label."
    sources:
    - kind: "database"
      title: "Cichlid Room Companion, Metriaclima sp. 'daktari'"
      url: "https://cichlidae.com/species.php?id=q8AeC-M4OmBOtkYqikA-LA"

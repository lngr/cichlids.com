  temperatureC:
    value:
      min: 21
      max: 29
    confidence: "high"
    rationale: "The settled lake range is 21 to 29 C. Eccles underlies the cool seasonal endpoint, Vollmer describes\
      \ summer surface water near 28 C and winter water below 24 C, and Ngochera underlies the 29 C endpoint in the inherited\
      \ lake synthesis. FAO reports the narrower historical surface interval of 23 to 25 C. These are lake-wide observations,\
      \ not measurements at every Daktari locality or preferred aquarium set points. Eccles full text was not open access\
      \ and its publisher page was blocked; no new full-text claim is made from it."

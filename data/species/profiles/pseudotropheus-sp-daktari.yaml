  problems:
    text: "The main husbandry pressures are territorial stress, unsuitable feeding and deteriorating water quality. A\
      \ subordinate fish can lose condition through repeated displacement even without obvious wounds. Provide retreats\
      \ that work for the fish being chased, and reassess a group if a female or rival cannot feed or leave cover. Stable\
      \ rocks are essential because males excavate near their bases. Avoid chronic overfeeding and protein-heavy staples;\
      \ the bloat flag reflects aquarium warnings rather than a demonstrated single cause of disease in this trade form.\
      \ The natural lake GH and aquarium hardness advice describe different things, so neither high GH nor the outer\
      \ tolerance endpoints should be pursued automatically."

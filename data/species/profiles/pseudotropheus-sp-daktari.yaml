  habitat:
    text: "The best-supported records lie on the northeastern shore around the Tanzania-Mozambique border. Undu and Hai\
      \ reefs are the northern localities; Chiwindi and Liutche occur farther south. Malawi.si also carries a Ngombe\
      \ label. Fish use the transition between boulders and sand, with accounts placing them around 5 to 15 m deep. Roaming\
      \ fish take plankton above the bottom, while territorial males graze close to their spawning shelter. Lake-wide\
      \ natural conditions span 21 to 29 C, pH 7.7 to 8.6, 3 to 5 dGH and 5 to 8 dKH. Those ranges combine lake studies\
      \ and are not measurements from every Daktari population. Calcium-magnesium hardness is relatively low even though\
      \ the water is alkaline and buffered."
    sources:

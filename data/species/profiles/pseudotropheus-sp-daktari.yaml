  socialBehavior:
    text: "A single male with several females is the clearest small-group recommendation. Three females distribute attention\
      \ better than a pair, although individual fish still require monitoring. Glaser reports that subordinate males\
      \ can resemble females and that larger mixed-sex groups sometimes work; this does not establish that extra males\
      \ fit in the minimum harem aquarium. Males defend a small rock-associated site and may chase rivals or females\
      \ persistently. Accounts calling Daktari peaceful refer to its relative position among mbuna and coexist with reports\
      \ of strong male rivalry. Ongoing hiding, damaged fins or exclusion from food signal that the present arrangement\
      \ is failing."

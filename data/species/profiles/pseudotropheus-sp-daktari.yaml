  - name: "Metriaclima sp. 'daktari'"
    note: "CRC and some aquarium references use Metriaclima."
  legacyNames:
  - "Pseudotropheus daktari"
  note: "Daktari remains undescribed: neither queried Catalog of Fishes genus list supplies a daktari binomial or authorship.\
    \ The profile uses Pseudotropheus sp. 'daktari' to match the curated trade-form identity. Maylandia and Metriaclima\
    \ are alternative generic placements of this same informal label, not available species synonyms. The Catalog recognizes\
    \ described Maylandia species; checker-a's claim that it treats the whole genus as Pseudotropheus is incorrect. CRC\
    \ uses Metriaclima, and Ser, Roberts and Kocher list a Hai Reef family under Metriaclima daktari. None establishes\
    \ a formally described species or its nearest sister species. FishBase returned no readable record; GCCA returned\
    \ an access barrier."

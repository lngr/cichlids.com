        \ to 20 and tiebreaker-2 5 to 12 dKH. The middle upper endpoints are 12 and 15; their median is 13.5, rounded\
        \ to 14, while the lower endpoint remains 5. The range contains the natural 5 to 8 dKH. Wider source recommendations\
        \ are 6 to 20 dKH from Malawi-Guru and 10 to 15 dKH from OATA. The species-specific forum repost gives 10 to\
        \ 12, Interaquaristik specifies at least 8 without a maximum, and JBL gives 5 to 10 for a Malawi aquarium and\
        \ 5 to 12 in general freshwater guidance. Fourteen is the rounded vote median, not a source-measured boundary.\
        \ General Malawi experience makes it plausible, but the evidence does not establish a precise Daktari limit.\
        \ The inherited Fishkeeper 5 to 15 entry is an agent inference, not a numeric claim on that page; GH advice has\
        \ not been treated as KH."

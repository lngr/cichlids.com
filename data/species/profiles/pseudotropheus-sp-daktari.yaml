      \ but undescribed status does not exclude a presumed group under the rubric. CRC, the Hai Reef research family\
      \ and Malawi.si establish the Maylandia or Metriaclima association. Glaser warns generally of aquarium interbreeding\
      \ among these zebra mbuna, including undescribed forms, and Fishkeeper gives genus-level crossing cautions. That\
      \ supports presumed membership, not a named Daktari hybrid, and the Ser breeding families are not interspecific\
      \ crosses. Only the existing maylandia member list is extended with the preferred trade-form name; its basis and\
      \ other fields remain unchanged. No pairwise group or inference of transitive crossing is added."

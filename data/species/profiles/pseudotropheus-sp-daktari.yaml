variants:
- name: "Undu Reef"
  kind: "locality"
  note: "Tanzanian population with predominantly yellow dominant males."
- name: "Hai (Chimate) Reef"
  kind: "locality"
  note: "Tanzanian locality also represented by a Hai Reef research family."
- name: "Chiwindi"
  kind: "locality"
  note: "Mozambican population with a blue sheen over the yellow male body."
- name: "Liutche"
  kind: "locality"
  note: "Southern locality in the specialist distribution accounts."
- name: "Ngombe"
  kind: "locality"
  note: "Additional locality label in the Malawi.si image index; its relationship to the four populations is unresolved."
features:
  origin:
    value:

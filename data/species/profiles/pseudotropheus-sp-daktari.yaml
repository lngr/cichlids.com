  compatibility:
    text: "A species-only aquarium is optional. Care sources allow other outgoing mbuna when space, territories and feeding\
      \ are suitable, but lake origin alone does not establish compatibility. Avoid fish that cannot cope with territorial\
      \ displacement or need a routine diet that conflicts with Daktari's bloat-sensitive feeding guidance. The presumed\
      \ Maylandia crossing group includes this undescribed form because specialists place it among those mbuna and sources\
      \ warn of genus-wide aquarium interbreeding. No named Daktari cross was established in the material reviewed. This\
      \ is a plausible crossing risk with low confidence, and separately documented zebra crosses do not establish additional\
      \ pairwise groups for Daktari."

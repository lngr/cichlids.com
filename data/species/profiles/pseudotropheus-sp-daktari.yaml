  maxSizeCm:
    value:
      male: 10
      female: 8
    confidence: "medium"
    rationale: "The four proposals are 10/9, 10/8, 9/7 and 10/8 cm for male/female, giving medians of 10 and 8 cm. FishFish\
      \ directly gives 10/8; Malawi.si gives 9/7 as typical size and the later-read Einrichtungsbeispiele account gives\
      \ aquarium maxima of 11/9. Glaser, NBFGR and Interaquaristik give about 10 cm without separating sexes. Fishkeeper\
      \ reports a larger unsexed 12.5 cm maximum; that wider estimate and the inherited Atlas complex maxima of 11 to\
      \ 11.4 are retained, but do not establish the typical maximum of each sex. Female values inferred by agents remain\
      \ labelled as such."
    sources:
    - kind: "website"
      title: "Interaquaristik, Daktari-Maulbrüter, Pseudotropheus sp. Daktari"

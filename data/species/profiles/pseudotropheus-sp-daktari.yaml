partners:
  suitable:
  - species: "Differently coloured Lake Malawi mbuna"
    reason: "Species care accounts permit outgoing mbuna with compatible feeding and enough room for separate territories."
    condition: "Use a tank larger than the single-harem minimum for a community; assess aggression, diet and hybrid-group\
      \ membership for each candidate."
  unsuitable:
  - species: "Other Maylandia species"
    reason: "The presumed maylandia group signals a genus-level crossing risk; similar males can also provoke territorial\
      \ rivalry."
  - species: "Very peaceful or slow-feeding cichlids"

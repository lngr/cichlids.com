  sizeAndGrowth:
    text: "Plan around adult males of about 10 cm and females of about 8 cm. Sex-specific accounts range from 9/7 cm\
      \ to aquarium maxima of 11/9 cm; Fishkeeper gives an unsexed maximum of 12.5 cm. These differences make adult size\
      \ an estimate rather than an exact limit for every captive line. No Daktari growth-rate study was found. A lifespan\
      \ of about five to eight years is reported in aquarium sources, with no independently followed cohort behind it.\
      \ Adequate food, water quality and room for subordinate fish matter throughout maturation, when male rivalry and\
      \ colour differences become more apparent."

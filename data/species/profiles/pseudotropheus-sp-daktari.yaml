    confidence: "high"
    rationale: "Glaser, Fishkeeper and the Malawi.si locality account identify Undu and Hai reefs in Tanzania and Chiwindi\
      \ and Liutche in Mozambique. The index additionally names Ngombe, retained as a locality label without asserting\
      \ a fifth distinct population. Ser, Roberts and Kocher independently include a Hai Reef Daktari family, and CRC\
      \ identifies a Chiwindi male. The Fish Barn statement placing Daktari at Thumbi West conflicts with these records\
      \ and is not adopted."

  diet:
    text: "Daktari uses more than one natural food source. Species accounts describe plankton taken from the water column\
      \ and attached growth eaten near defended rocks. The resulting omnivore classification includes substantial plant\
      \ material; it does not imply a meat-heavy aquarium menu. Offer suitable mbuna prepared foods with a vegetable\
      \ component and modest animal supplements. Fishkeeper specifically warns that excessive animal protein can contribute\
      \ to bloat, which supports the sensitivity flag used here. The precise natural balance is disputed and no controlled\
      \ Daktari diet trial was found. Feed small amounts, observe body condition and avoid allowing dominant fish to\
      \ monopolize every feeding."

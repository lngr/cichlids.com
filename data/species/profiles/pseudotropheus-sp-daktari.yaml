  breeding:
    text: "The female carries the brood in her mouth, with no lasting pair bond. A male may excavate a sheltered spawning\
      \ space at the base of a rock. Eggs are collected by the female during spawning, and the male does not share incubation.\
      \ Aquarium accounts put holding at roughly three to four weeks, while reported brood sizes vary enough to make\
      \ a precise count unhelpful. A holding female needs protection from persistent pursuit and reliable access to a\
      \ quiet retreat. Fry receive no guarantee of safety in a community tank. The Hai Reef research family confirms\
      \ use of this trade form in breeding research, but provides no evidence of an interspecific Daktari cross."

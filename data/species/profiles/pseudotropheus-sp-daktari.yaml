  sexing:
    text: "Adult dominant males are usually the more colourful and larger fish. Tanzanian males are yellow; southern\
      \ males can show a blue sheen over a yellow body. Female shades vary with locality and are described as beige,\
      \ brownish or yellowish. Colour alone can mislead because a subordinate male may adopt a female-like appearance.\
      \ Compare mature fish over time and keep locality information with the stock. Fin extensions and stronger display\
      \ colour can help, but no single mark reliably establishes the sex of every juvenile or suppressed adult."

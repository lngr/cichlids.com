  khDkh:
    value:
      min: 5
      max: 8
    confidence: "high"
    rationale: "The settled natural range is 5 to 8 dKH, rounded to contain the lake measurements. Jackson data compiled\
      \ by FAO give alkalinity of 2.00 to 2.59 meq/L, equivalent to about 5.6 to 7.3 dKH; Branchu gives about 6.5 to\
      \ 6.9 dKH in sampled profiles. Alkalinity can exceed calcium-magnesium hardness because sodium also balances bicarbonate.\
      \ This natural KH fact has no verification object."
    sources:
    - kind: "literature"
      title: "Vanden Bossche, J.-P. and Bernacsek, G. M. (1990). Source book for the inland fishery resources of Africa,\

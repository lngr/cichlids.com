  husbandry:
    text: "For one male with three females, use at least 240 litres with a footprint around 120 by 40 cm. The depth is\
      \ a planning estimate, and a larger footprint is appropriate when adding other species or males. Combine stable\
      \ rock shelters with sandy openings and swimming room above them. Break direct sightlines so a retreat does not\
      \ remain visible from the dominant male's station. Use established biological filtration, good oxygenation and\
      \ regular water changes. The care sources overlap around 24 to 26 C. The broader tolerance envelope is 21 to 29\
      \ C, pH 7.5 to 8.6, 3 to 20 dGH and 5 to 14 dKH; its hardness endpoints remain tentative. Stable chemistry near\
      \ the better-supported husbandry recommendations is more useful than treating every edge of that envelope as a\
      \ target."

partners:
  suitable:
    - species: Nandopsis haitiensis
      reason: Only a compatible opposite-sex conspecific is recommended for shared adult housing.
      condition: "Established pair in at least 700 L with 200 cm length and approximately 60 cm depth; secure\
        \ refuges, a divider and separate accommodation remain available."
  unsuitable:
    - species: Poecilia reticulata
      reason: Small adults are potential prey and vulnerable to territorial attacks.
    - species: Nandopsis tetracanthus
      reason: Serious aggression risk and a presumed crossing risk supported by unverified captive-offspring
        labels.
    - species: Rocio octofasciata
      reason: The dedicated-species recommendation and serious aggression make routine mixing unsuitable; labelled
        captive offspring also indicate a presumed crossing risk.
    - species: Symphysodon aequifasciatus
      reason: Its quieter feeding and social behaviour do not withstand the territorial pressure of this species.
    - species: Thorichthys meeki
      reason: "A permissive hobby page names it as a companion, but its smaller size and lower fighting capacity\
        \ make adult cohabitation unreliable."
    - species: Dajaus monticola
      reason: Recorded natural association under Agonostomus monticola does not establish safe captive cohabitation;
        no direct aquarium compatibility evidence was found.
    - species: Pterygoplichthys gibbiceps
      reason: Armour does not establish safety from a large aggressive cichlid; no direct evidence justifies
        listing it as a suitable shared-space companion.
profile:
  overview:
    text: "A large aquarium devoted to the Haitian cichlid can hold an impressive pale male with dark markings\
      \ and a strongly contrasting breeding female. The species is native to Hispaniola, shared by Haiti and\
      \ the Dominican Republic, and is also traded as Odo or Black nasty. Its powerful appearance should not\
      \ obscure the care challenge: partner aggression can be severe, and digestive losses are repeatedly reported.\
      \ Older stock labelled vombergi or vombergae belongs to the same accepted species, although keeping reliable\
      \ locality records remains useful."
    sources:
      - *id001
      - *id003
      - *id022
      - *id037
      - *id066
  sizeAndGrowth:
    text: "Allow for approximately 31 cm total length in a large male and 25 cm in a female. These are practical\
      \ adult estimates rather than fixed biological limits, and the female figure is particularly uncertain.\
      \ Some hobbyists report substantially larger adults, but exceptional fish do not set the typical maximum.\
      \ FishBase's 21.5 cm standard length excludes the tail and is not directly interchangeable with total\
      \ length. Breeding can begin while fish are still small, so an early spawn is no reason to postpone adult\
      \ housing. The provisional longevity estimate is about 9-12 years, with published hobby estimates varying\
      \ much more widely."
    sources:
      - *id003
      - *id021
      - *id018
      - *id037
      - *id022
      - *id023
      - *id019
      - *id026
      - *id049
      - *id013
      - *id027
      - *id028
      - *id029
      - *id040
      - *id041
  husbandry:
    text: "Plan at least 700 litres with a 200 cm length and roughly 60 cm front-to-back space for a compatible\
      \ adult pair. Keep open swimming room between secure rockwork and several refuges. Place heavy structures\
      \ so digging cannot undermine them, and protect vulnerable equipment. Maintain efficient biological filtration,\
      \ oxygenation and steady water quality. Husbandry reports give the strongest routine support around 27-29\
      \ C with stable near-neutral to alkaline water. The wider listed tolerances have uncertain endpoints,\
      \ especially 33 C and pH 9, and are not targets to pursue. Match replacement water carefully and keep\
      \ a secure divider and separate accommodation available throughout the fish's life. Freshwater keeping\
      \ is established; brackish occurrence alone does not establish a universal salt requirement."
    sources:
      - *id021
      - *id022
      - *id037
      - *id067
      - *id011
      - *id026
      - *id019
      - *id028
  socialBehavior:
    text: "A compatible pair is the recommended adult social unit. Two fish of opposite sex may remain incompatible,\
      \ and an established partner can still become dangerous. Controlled introductions, clear escape routes\
      \ and close observation are essential; permanent separation may be necessary. Aggression can come from\
      \ either sex and often intensifies around a spawning surface. Continuous hiding, exclusion from food\
      \ or repeated attacks signal an arrangement that needs intervention. Occasional small groups in nature\
      \ do not justify a normal aquarium group of adults."
    sources:
      - *id003
      - *id022
      - *id018
      - *id057
      - *id011
      - *id028
  diet:
    text: "Provide a complete food with a substantial plant component, supplemented with varied vegetable foods\
      \ and modest portions of aquatic invertebrates. Plants and snails occur in wild food records, while captive\
      \ fish readily hunt small fish. That combination supports omnivory without making fish flesh the staple.\
      \ Offer controlled portions and watch appetite and body condition. Reports link rich feeding, temperature,\
      \ stress and water quality with digestive losses, but they do not isolate a single cause of bloat. Feeding\
      \ adjustments should accompany suitable water conditions and relief from aggression."
    sources:
      - *id003
      - *id021
      - *id018
      - *id022
      - *id052
      - *id053
      - *id055
      - *id049
  breeding:
    text: "The pair attaches eggs to a prepared solid surface and guards the developing brood. Exposed stones\
      \ are suitable, although sheltered surfaces can also be used. A published breeding account obtained fertile\
      \ eggs even while the adults remained separated by a grid, illustrating the value of physical protection\
      \ during reproduction. Either parent may tend free-swimming young, and the female can become particularly\
      \ intolerant around eggs. Development times vary with temperature. Newly swimming fry can take newly\
      \ hatched Artemia and suitably fine prepared food, with clean water and sufficient rearing space prepared\
      \ in advance."
    sources:
      - *id003
      - *id021
      - *id018
      - *id022
      - *id057
      - *id011
  sexing:
    text: "Adult males generally grow larger and may have more pointed dorsal and anal fins or a prominent\
      \ forehead swelling. Females tend to remain smaller and can darken markedly while guarding young. Neither\
      \ a hump nor a single colour mark is a reliable universal test, and reports differ over which sex becomes\
      \ darkest during breeding. Ground colour may include cream, grey or brownish tones with dark bars, spots\
      \ or reticulation. Juveniles are difficult to sex visually; comparisons between mature fish of similar\
      \ age and known origin are more informative."
    sources:
      - *id018
      - *id021
      - *id037
      - *id022
      - *id011
      - *id049
  compatibility:
    text: "Use a dedicated aquarium for a carefully managed pair or a single fish. Small tankmates may be eaten,\
      \ and comparable-sized cichlids can suffer serious attacks. Some dealers and keepers describe robust\
      \ companions, but those reports do not establish a dependable adult community at the selected minimum.\
      \ The only listed suitable companion is a compatible conspecific partner. Reported captive crosses with\
      \ the Cuban cichlid and Jack Dempsey add presumed hybrid risks to the fighting risk. These reports come\
      \ from labelled offspring in one hobby compilation, without verified pedigrees or established choice\
      \ of conspecific partners. Wild association with livebearers or mountain mullet does not establish aquarium\
      \ compatibility."
    sources:
      - *id003
      - *id018
      - *id022
      - *id037
      - *id062
      - *id056
      - *id058
      - *id068

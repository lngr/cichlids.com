  ghDgh:
    value:
      min: 6
      max: 16
    confidence: low
    rationale: "The tally decides 6-16 dGH and calls the four votes unanimous under its two-degree range-agreement\
      \ rule; this is threshold agreement rather than identical proposals. generator proposed {\"min\": 5,\
      \ \"max\": 17}; checker-a proposed {\"min\": 7, \"max\": 15}; checker-b proposed {\"min\": 5, \"max\"\
      : 17}; checker-c proposed {\"min\": 9, \"max\": 13}. The tally value and low confidence are retained\
      \ exactly. Stalsberg's directly measured occupied-site range is wider, 5-17 dGH, including 5 at Rio Acapulco,\
      \ 11-12 at Rio Nizao, 12 at Palo Leche and 17 in the stream west of Santo Domingo. Those observations\
      \ remain evidence outside the decided interval, and 6-16 must not be read as the full measured field\
      \ envelope. Miragoane supplies one 9 dGH reading; the regional FAO Rio Yaque calcium and magnesium analysis\
      \ converts to about 12.1 dGH without identifying the exact river station. The 7-15 proposal relied on\
      \ estimates from dissolved solids, and 9-13 emphasized Miragoane and that regional chemical analysis.\
      \ TDS, conductivity, pH and salinity alone do not determine GH, so the retained numerical inferences\
      \ of 7-10, 12-40 and 10-25 dGH are not independent measurements. Exceptional hypersaline waters above\
      \ 60 dGH are excluded."

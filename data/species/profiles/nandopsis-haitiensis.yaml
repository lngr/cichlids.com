    confidence: low
    rationale: "The settled tally uses the median method because no four-vote qualified majority exists under\
      \ the pH agreement threshold; confidence is low. generator proposed {\"min\": 6.9, \"max\": 9}; checker-a\
      \ proposed {\"min\": 7.4, \"max\": 8.4}; checker-b proposed {\"min\": 7.3, \"max\": 9}; checker-c proposed\
      \ {\"min\": 6.9, \"max\": 7.4}; tiebreaker-1 proposed {\"min\": 6.9, \"max\": 9}; tiebreaker-2 proposed\
      \ {\"min\": 6.9, \"max\": 9}. The median of proposal minima is 6.9 and of maxima is 9.0, so 6.9-9.0 is\
      \ retained without replacing it. It is plausible as a spatial freshwater envelope: Citizen Conservation\
      \ reports 6.9 and 7.1 at Miragoane, Ferdenzi 7.35 at Rio Jaina, and Stalsberg 8.0-9.0 at occupied Dominican\
      \ river and canal sites, plus 7.3 at a regional Galvan pool. The Miragoane report pairs a 2015 reference\
      \ with a 2021 observation date, weakening its chronology. The narrow 6.9-7.4 proposal omits directly\
      \ measured occupied alkaline sites; the 7.4-8.4 proposal emphasizes regional studies rather than the\
      \ full collecting evidence. Hypersaline-lake readings and pH inferred from calcium-bicarbonate water\
      \ type do not set the range. Neither endpoint is a demonstrated constant optimum."

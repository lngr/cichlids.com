        \ Smithsonian and Beerlink support both plant and animal feeding. The Nordic account instead describes\
        \ adult piscivory, and Fishipedia uses an unquantified carnivore label; neither makes fish the necessary\
        \ staple. Beerlink, hobby accounts and archive thread 60750 report digestive losses, supporting the\
        \ sensitivity flag without proving that excess protein alone causes every case. The two FishBase ecology\
        \ URLs use different stock-code parameters, but both readable responses identify Nandopsis haitiensis\
        \ and describe mixed feeding; they are retained without counting them as independent dietary studies."

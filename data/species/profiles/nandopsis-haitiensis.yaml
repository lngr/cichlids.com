        \ Cuban-pair id is retained exactly as tallied and curated, without creating a duplicate name for its\
        \ members; no transitive group is inferred. Atlas's claim that Catalog of Fishes still accepts vombergae\
        \ as valid conflicts with the actual catalog and is not followed. The accessible Rican abstract establishes\
        \ evolutionary context, not either named cross."

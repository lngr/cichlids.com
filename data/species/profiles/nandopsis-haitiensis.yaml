      decision: 4
      rationale: "Generator, checker-b and checker-c proposed level 4; checker-a proposed 3. Aqua-Fish explicitly\
        \ describes fatal partner attacks, Beerlink notes female attacks around eggs, and Ferdenzi used physical\
        \ partitions throughout breeding. These observations meet the rubric's level requiring experienced\
        \ management and separation even within a putative pair. The lower proposal relies on successful pairing\
        \ and the general solitary-or-pair habit, which do not exclude lethal partner aggression."

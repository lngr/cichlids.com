  problems:
    text: "Aggression, cramped adult housing and unexplained digestive losses are the main practical concerns.\
      \ Young fish are repeatedly reported to deteriorate during growth, but abdominal swelling is not a diagnosis\
      \ and the sources do not show one cause for every loss. Monitor feeding, breathing, injuries and access\
      \ to refuge, and check water quality and social pressure when behaviour changes. Keep new stock separate\
      \ during acclimation and maintain a usable separation option for established adults. Stable replacement-water\
      \ conditions and restrained feeding reduce avoidable stress without substituting for investigation of\
      \ a sick fish."
    sources:
      - *id018
      - *id022
      - *id037
      - *id055
      - *id027
      - *id028
  habitat:
    text: "Populations occupy Hispaniolan lakes, rivers, canals and small streams, including fresh and brackish\
      \ water. Adults use open areas and nearby rock or debris refuges; vegetation and trailing roots shelter\
      \ young fish. Collecting accounts measured occupied freshwater sites at 26-33 C and pH 7.35-9.0, while\
      \ Miragoane shores add 25-26 C and pH 6.9-7.1. A nearby regional Galvan pool measured 24 C. Stalsberg\
      \ reported GH and KH of 5-17 degrees across occupied freshwater sites; the tallied 6-16 dGH field parameter\
      \ is a narrower synthesis, not the complete observed GH range. Miragoane provides single readings of\
      \ 9 dGH and 7 dKH, with an unresolved mismatch between its observation and reference dates. Oviedo had\
      \ GH above 60, pH 8.5 and water near 30 C, but the expedition did not collect this cichlid there. Estimated\
      \ Enriquillo open-water temperatures of 33-34 C and its hypersaline chemistry also do not determine this\
      \ profile's freshwater parameters."
    sources:
      - *id003
      - *id018
      - *id007
      - *id006
      - *id044

      colour strain.
  - name: Etang Saumatre
    kind: locality
    note: Type locality of haitiensis; lagoon-origin fish should retain reliable locality information.
features:
  origin:
    value:
      continent: Central America
      region: "Hispaniola, Haiti and the Dominican Republic"
      waterbody: null
      localities:
        - Etang Saumatre

        - Rio Guayamouco
        - Rio Yaque del Sur
        - Rio Yaque del Norte
        - Rio Nizao
        - Rio Acapulco
        - Rio Jaina tributary
    confidence: high
    rationale: "All runs agree on Hispaniolan endemism in Haiti and the Dominican Republic; their locality\
      \ lists describe different documented parts of the distribution. Catalog of Fishes establishes Etang\
      \ Saumatre as the type locality and Rio Yaque del Sur as the origin of the junior synonym. The Yaque\
      \ survey, Stalsberg and Ferdenzi document Dominican freshwater sites, Beerlink records Haitian and northern\
      \ Dominican rivers, and Citizen Conservation records Miragoane. The merged list is illustrative rather\
      \ than exhaustive. Central America is the schema's regional category for the Greater Antilles. No named\
      \ African-lake preset applies. Rican's accessible abstract and the biogeography paper provide lineage\
      \ context; the two Limia abstracts provide lake context, not species-specific water limits."

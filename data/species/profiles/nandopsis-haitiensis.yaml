      \ Jaina collecting creek. Stalsberg measured 26-32.5 C at occupied freshwater sites and 24 C at a nearby\
      \ Galvan pool of the same regional water type. Citizen Conservation adds 25-26 C at Miragoane. FishBase\
      \ lists 24-27 C without a locality-resolved series. Direct collecting measurements outweigh that general\
      \ interval. The result describes different places and sampling times, with limited seasonal coverage;\
      \ the hot endpoints are not established year-round aquarium targets. Enriquillo hypersaline-lake data\
      \ remain contrary regional context and do not set either endpoint. The Yaque survey mean and standard\
      \ deviation are not observed minimum and maximum temperatures."

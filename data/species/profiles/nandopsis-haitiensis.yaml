        \ requirement. The conservative rule retains groups named by at least two votes: the existing Cuban\
        \ pair occurs in five votes and the Jack Dempsey pair in both tiebreakers. Only tiebreaker-1 names\
        \ the blood parrot, Parachromis motaguensis and Thorichthys meeki pairs, so those reports remain evidence\
        \ without entering the decided list. Binns Hybrid Encyclopedia labels photographed captive offspring\
        \ for the two retained pairs, and repeats the Jack Dempsey pairing in two galleries from the same compilation.\

    verification:
      method: qualified-majority
      votes:
        agree: 5
        total: 6
    tolerance:
      value:
        min: 24
        max: 33
      confidence: low
      rationale: "The tally classifies the four proposals as unanimous within the one-degree agreement threshold\
        \ and decides 24-33 C after containing the natural range. generator proposed {\"min\": 24, \"max\"\
        : 33}; checker-a proposed {\"min\": 22, \"max\": 32}; checker-b proposed {\"min\": 23, \"max\": 33};\
        \ checker-c proposed {\"min\": 24, \"max\": 33}. Beerlink recommends 27-29 C, the Nordic register 24-29\
        \ C and Aqua-Fish 23-28 C. Ferdenzi bred fish around 24.4 and 27.8 C and reared fry near 28.9 C. A\
        \ forum keeper reports a pair maintained for five years in the high eighties Fahrenheit, approximately\
        \ 30-32 C. The broader forum care interval of 28.8-33 C is retained, as is the conflicting Bay Bridge\
        \ dealer advice of 20-22.8 C. The upper bound is required to include the observed habitat envelope\
        \ and has no demonstrated multiyear safety margin. Limia critical temperatures of 12-41.2 C concern\
        \ a different fish family and acute experiments, so they do not establish this cichlid's chronic tolerance.\
        \ Routine maintenance around 27-29 C has better support than either decided edge; confidence stays\
        \ low."

  synonyms:
    - name: Cichlasoma haitiensis
      note: Original combination described by Tee-Van in 1935.
    - name: Cichlasoma haitiense
      note: Grammatically corrected spelling of the original combination.
    - name: Cichlosoma vombergi
      note: Original spelling and combination of the junior synonym described by Ladiges in 1938.
    - name: Cichlosoma vombergae
      note: Emended spelling used in the public CRC synonym record.
    - name: Cichlasoma vombergae
      note: Later combination of the emended junior synonym.
    - name: Nandopsis vombergae
      note: Former species combination now treated as a synonym in Catalog of Fishes.
    - name: Nandopsis vombergi
      note: Legacy catalog combination of the junior synonym.
  legacyNames:
    - Nandopsis haitiensis
    - Nandopsis vombergi
  note: "Catalog of Fishes accepts Nandopsis haitiensis (Tee-Van, 1935) and places the 1938 vombergi name,\
    \ later emended to vombergae, in synonymy following Chakrabarty (2006). Both legacy entries 759 and 761\
    \ therefore map to this profile. The legacy and accepted genera are both Nandopsis, covered by one genus\
    \ query. The public CRC synonym record agrees. Atlas states that the catalog still treats vombergae as\
    \ valid; reading the catalog contradicts that claim. The expanded synonym list unites original spellings,\
    \ corrected spellings and historical combinations rather than treating them as separate species."

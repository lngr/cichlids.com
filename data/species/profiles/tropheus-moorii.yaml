        url: https://pmc.ncbi.nlm.nih.gov/articles/PMC1634779/
        accessed: 2026-10-12
  sexing:
    text: "Males and females look much alike in most populations, and colour mainly reflects rank, not sex: subdominant males may wear female colours. Fully grown males tend to be larger, but this is not reliable in young fish. The only dependable method is to look at the genital papillae (venting): the female's vent is much larger than the male's. Venting needs practice and careful handling, so beginners should let an experienced keeper or the breeder do it. Because sexing is difficult, most keepers start with a larger group of young fish from one population and remove surplus males as they show themselves."
    sources:

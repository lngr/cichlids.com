  socialBehavior:
    text: In the lake both sexes defend small feeding territories, and males claim larger areas for courtship. In the aquarium this turns into constant activity and a strict pecking order. Males chase each other relentlessly and press females that are not ready to spawn. In small groups the pressure falls on a few fish, and fights can end in death, so keep at least fifteen fish, all from one single population. Views on the sex ratio differ; many keepers aim for more females than males, while Konings reports good results with equal numbers. Towards other species Tropheus are mostly indifferent, but they chase other algae grazers from their feeding area and their restless behaviour wears down calm fish.
    sources:
      - kind: literature
        title: Staeck, W. (2008). Half a Century of Experience with Tropheus Species, Part 1. Tropical Fish Hobbyist.

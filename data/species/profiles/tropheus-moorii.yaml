  diet:
    text: In the wild T. moorii tears filamentous algae from sunlit rocks and swallows little else; its gut is very long and adapted to this fibrous, low-energy food. In the aquarium it eats anything, which is exactly the danger. Base the diet on good Spirulina flakes or other plant-based dry food, add blanched vegetables or nori, and let algae grow on the decoration. Small portions of rough-shelled crustaceans such as Cyclops or Mysis are acceptable now and then. Avoid bloodworms, Artemia, Tubifex, beefheart and other soft or meaty food, and keep protein-rich pellets meant for other cichlids out of the tank. Feed sparingly, at most once a day, since these fish can eat more in two minutes than they would find in a whole day in the lake.

  synonyms:
    - name: Tropheus moorii kasabae Nelissen, 1977
      note: Described as a subspecies from Kasaba Bay (Zambia); synonym of Tropheus moorii after Konings (2019) in the Catalog of Fishes. The Cichlid Room Companion lists it as a subspecies.
    - name: Tropheus kasabae
      note: Species rank used for the Kasaba Bay form by Marechal and Poll (1991); synonym of Tropheus moorii in the Catalog of Fishes.
    - name: Tropheus moorei
      note: Misspelling in older ethological literature, for example Kawanabe (1981).
  legacyNames:
    - Tropheus moorii
  note: "The Catalog of Fishes lists Tropheus moorii Boulenger, 1898 as valid, with the type locality Kinyamkolo (today Mpulungu, Zambia) and the distribution southern Lake Tanganyika; T. moorii kasabae is its synonym, T. polli a synonym of T. annectens. This profile follows the current, narrow species concept (Konings; Van Steenberge et al. 2018, AFLP lineages of the southern subbasin): T. moorii lives in the south of the lake, on the Congolese coast south of Moba, along most of the Zambian shore and on the south-eastern Tanzanian shore, with a relict population at Lyamembe. Its range is interrupted between Nkamba Bay and Kiku, where Tropheus sp. 'red' lives, and the 'yellow' populations between the two species are natural hybrids. For decades nearly every Tropheus in the hobby was sold as \"moorii\", and many of these trade forms belong to other, mostly undescribed species: 'Kirschfleck' and the Bemba forms to T. sp. 'black', 'Moliro' and 'Kiku' to T. sp. 'red', 'Kaiser' to T. sp. 'ikola', 'Limespot' to T. sp. 'maculatus', besides T. sp. 'Mpimbwe'. The legacy entry very likely mixes photos and posts of such forms under the old broad name. It maps here because the name is valid; the features describe T. moorii in the strict sense, and its husbandry values hold for the genus as a whole. The Cichlid Room Companion places the genus in the tribe Haplochromini."

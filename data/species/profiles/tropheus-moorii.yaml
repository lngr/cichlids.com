    tolerance:
      value:
        min: 23
        max: 29
      confidence: medium
      rationale: Care sheets place the long-term aquarium range between 23 and 28 C, most of them at 24 to 27 C (Seriously Fish 23 to 27, FishBase after the Aquarien Atlas 24 to 26, Fishkeeper 23 to 26, Guidarium 24 to 28). The Tanganyika specialist site tanganyika.si recommends 24 to 27 C and names 29 C as a limit that must never be exceeded, because warm water holds less oxygen while the fish need more. The tolerance contains the natural lake range, so it runs from 23 C, the lowest value of the care literature, to the stated ceiling of 29 C. Values above 27 C are tolerated but not recommended for long periods; only one source names 29 C, so the upper end is less certain than the lower one.

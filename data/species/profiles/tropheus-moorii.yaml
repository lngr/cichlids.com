  husbandry:
    text: "Plan a tank of at least 150 cm length and 50 cm depth, about 400 litres, for a group of fifteen adults; more fish or several males need more room. Build several separate rock piles with many caves and crevices so that subordinate fish can escape the view of the dominant male, and use sand as the substrate. Strong lighting lets algae grow on the rocks, which adds natural grazing. Keep the water close to the lake values and well within the long-term range of 23 to 29 C (ideally 24 to 27 C), pH 8.0 to 9.5, 8 to 20 dGH and 11 to 22 dKH, and above all clean: strong, mature filtration, plenty of oxygen and large regular water changes matter more than anything else. Introduce the whole group at once. Never add new fish to an established colony; if the group must change, move everyone into a fresh or completely rearranged tank so that old territories disappear."

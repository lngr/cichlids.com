  speciesOnly:
    value: true
    confidence: medium
    rationale: "The specialist literature keeps Tropheus as a group of one single population in a tank of its own: Konings describes keeping only as a single-locality group on a strict vegetarian diet and names no tankmates, Staeck considers the fish unsuitable for the mixed feeding of a community tank, Aqualog advises against other species, and tanganyika.si calls a species-only tank often the better choice. The plant-based, low-protein diet conflicts with the food of most tankmates, and the restless group wears down calm fish; a keeper in the archive reports stress in a community tank. Seriously Fish, Fishkeeper and Tropical Freshwater Fish allow a Tanganyika community with tankmates that thrive on the same lean diet, such as goby cichlids (Eretmodus, Tanganicodus) or Julidochromis, so the value is a strong recommendation with narrow exceptions rather than a rule, and the confidence is medium. The rubric names Tropheus as the example of a species-only fish."

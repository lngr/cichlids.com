  hybridGroups:
    value: [tropheus, tropheus-brichardi-moorii, tropheus-moorii-red]
    confidence: high
    rationale: >-
      The genus group tropheus has the basis presumed, because crosses are documented only for a few
      pairs of its members and none involves T. duboisi or T. annectens; it rests on the close
      relationship, past gene flow across the genus and the hobby warning against mixing forms, and
      it includes the undescribed species named by Konings. Two documented two-member groups carry
      the direct evidence: tropheus-moorii-red, with T. sp. 'red', which mixes with T. moorii in the
      wild, after a release in Mpulungu harbour and in ponds holding both forms (Van Steenberge et
      al. 2018, Salzburger et al. 2006, Sefc et al. 2015), and tropheus-brichardi-moorii, with the
      Kipili form of T. brichardi, whose natural hybrids with T. moorii are reported from the
      Tanzanian coast (tanganyika.si).
    sources:

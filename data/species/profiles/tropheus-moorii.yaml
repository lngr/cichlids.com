  ph:
    value:
      min: 8.4
      max: 9.4
    confidence: high
    rationale: "Lake endemic: the natural pH is the measured range of Lake Tanganyika. Over an annual cycle at Bujumbura, Kigoma and Mpulungu the surface water has pH 8.8 to 9.2 and the water at 40 m 8.47 to 9.40, which gives 8.4 to 9.4. An older compilation of pH 7.3 to 7.8 contradicts the high alkalinity and all modern measurements and is not used."

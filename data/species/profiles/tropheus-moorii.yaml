      rationale: All files name the same water body (name and id resolve to the same table entry). The localities are merged; Kala Bay is placed in Zambia as tanganyika.si states, since Konings ends the Tanzanian range at Kisambala and names no Kala there. Kisambala and the Congolese coast south of Moba come from Konings, Kasaba Bay from the Catalog of Fishes.

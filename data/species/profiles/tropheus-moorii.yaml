variants:
  - name: Mpulungu
    kind: locality
    note: Type region at the southern tip of the lake (Zambia); dark olive to brownish fish with a yellow to orange flank blotch.
  - name: Sunset (Kasakalawe)
    kind: locality
    note: Population a few kilometres west of Mpulungu with an orange blotch on the flanks.
  - name: Red Rainbow (Kasanga)
    kind: locality
    note: Southern Tanzanian coast south of Kasanga; the Tanzanian form most often imported.
  - name: Chisanza
    kind: locality
    note: Red-eyed form from the eastern side of Chituta Bay south of the Kalambo river (Zambia).
  - name: Golden Kalambo
    kind: color-morph
    note: Orange-blotch (OB) morph of the Chituta Bay populations; full colour only in fully adult fish.
  - name: Chaitika (Rainbow)
    kind: locality
    note: Southern Zambian coast near Cape Chaitika; probably the source of the type material of T. kasabae.
  - name: Molwe
    kind: locality
    note: Pastel bluish grey to yellowish form with a whitish to orange flank patch.

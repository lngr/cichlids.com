partners:
  suitable:
    - species: Eretmodus cyanostictus
      reason: Goby cichlid of the same rocky shallows that grazes aufwuchs, stays near the bottom and accepts the same plant-based diet; Aqualog and Seriously Fish name goby cichlids as the least problematic companions.
      condition: Only as an exception to the species-only recommendation, in a tank of at least 150 cm with enough rockwork that the goby cichlids hold their own spot, and with a plant-based diet for the whole tank.
    - species: Tanganicodus irsacae
      reason: Small goby cichlid that keeps to the bottom; Seriously Fish names Tanganicodus as a possible companion with a similar diet.
      condition: Only as an exception to the species-only recommendation, added together with or before the Tropheus group, with a plant-based diet for the whole tank.
    - species: Spathodus erythrodon
      reason: Bottom-dwelling goby cichlid that grazes biofilm and does not compete for the middle water layers.
      condition: Only as an exception to the species-only recommendation, with a plant-based diet for the whole tank.
  unsuitable:
    - species: Tropheus duboisi
      reason: Same genus and hybrid group; Tropheus cross with each other, and other Tropheus are attacked like rivals of the own species.
    - species: Tropheus sp. 'red'
      reason: Sister species sold as moorii (for example Moliro, Kiku); crosses with T. moorii, as natural hybrid populations show.
    - species: Julidochromis regani
      reason: Named as a possible tankmate by some care sheets, but it needs regular animal food, and feeding it puts the Tropheus at risk of bloat.
    - species: Neolamprologus brichardi
      reason: Needs a protein-rich diet that causes bloat in Tropheus, and Tropheus eating its fry can trigger the same problem.
    - species: Cyphotilapia frontosa
      reason: Large, slow fish that needs fish and crustacean meat; its diet is dangerous for Tropheus and the hectic Tropheus stress it.
    - species: Petrochromis trewavasae
      reason: Larger algae-grazing cichlid that dominates the same feeding grounds and fights Tropheus for them in a confined tank.
    - species: Maylandia zebra
      reason: Mbuna from Lake Malawi with a similar territorial, hasty temperament; mixed Tropheus-mbuna tanks lead to constant fighting over rocks.
profile:
  overview:
    text: "Tropheus moorii is the type species of Tropheus, a genus of algae browsers from the rocky shores of Lake Tanganyika. For decades almost every Tropheus in the hobby was sold as \"moorii\", but genetic and morphological studies show that many of these forms belong to other, mostly undescribed species such as Tropheus sp. 'black', sp. 'red' or sp. 'ikola'. In the strict sense T. moorii lives in the southern part of the lake, with well-known forms such as Mpulungu, Sunset, Red Rainbow and the orange-blotched Golden Kalambo. All of these fish share the same demands: a large, rocky tank, a big group of one single population without other fish, a plant-based diet and stable, clean, hard and alkaline water. Kept this way they are lively, colourful and long-lived; kept wrongly they suffer from deadly fights or bloat. FishBase lists the species as Near Threatened on the IUCN Red List."
    sources:

  coloration:
    value:
      baseColors:
        - black
        - brown
        - yellow
        - orange
        - red
      pattern: mixed
    confidence: medium
    rationale: Colour depends on the population. Fish around Mpulungu are dark olive to brownish with a yellow to orange flank blotch, 'Sunset' from Kasakalawe carries an orange blotch, Tanzanian forms such as 'Red Rainbow' show red and orange, and the OB morphs of Chituta Bay are mottled orange; most southern forms have a dark brown to black body with a coloured flank band or blotch. Some forms such as Molwe are paler, bluish grey to yellowish. Juveniles show narrow bars that most adults lose. With blotches, bands and mottling across the forms the pattern counts as mixed.

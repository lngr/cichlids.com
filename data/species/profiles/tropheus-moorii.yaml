  feedingSpeed:
    value: hasty
    confidence: high
    rationale: Tropheus greedily eat anything offered and are fast enough to take the food of slower tankmates (Aqualog reports them robbing Lamprologus tankmates). Konings notes that they can eat more protein and fat in two minutes than in a whole day in the lake, and Tropical Freshwater Fish calls the species a greedy eater; the colony is fed sparingly once a day for this reason. The steady grazing of wild fish does not describe their behaviour at the food in a tank.

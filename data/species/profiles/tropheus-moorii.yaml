      rationale: "The lower limits of the sources cluster at 8 to 10 dGH (Seriously Fish and tanganyika.si 8, the Aquarien Atlas of Riehl and Baensch as shown by FishBase 9, Guidarium and Einrichtungsbeispiele 10), and no source for the genus goes below 8 dGH. The upper limits spread from 19 to 25 dGH: the specialist and book sources meet at about 20 dGH (tanganyika.si 20, Aquarien Atlas 19, Einrichtungsbeispiele 20), while 22 to 25 dGH appear only in general care sheets (Seriously Fish, Fishkeeper, Gensou, Tropical Freshwater Fish). The tolerance of 8 to 20 dGH follows the specialist range and contains the natural range of 10 to 13 dGH; harder water is probably tolerated as well but is less well documented. The Fishkeeper minimum of 15 dGH lies above the lake value and is not plausible as a lower limit. Total hardness matters less than a stable high pH and carbonate hardness."

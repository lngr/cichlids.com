  problems:
    text: The best-known problem is bloat, an intestinal disease that typically shows as a swollen belly, loss of appetite, rapid breathing and white, stringy faeces and that can kill a fish within days. It is linked to rich or soft food, overfeeding, poor water quality and stress, so prevention means a plant-based diet, small portions, clean water and a calm, stable group. Wild-caught fish are more delicate than tank-bred ones. The second common mistake is a group that is too small or a tank that is too short, which ends in constant fighting and losses. Adding single new fish to an established colony or moving fish back and forth causes the same trouble. Mixing locality forms leads to hybrids that damage the value of the colony. Sick fish should be isolated quickly and assessed by an experienced keeper or a veterinarian.
    sources:

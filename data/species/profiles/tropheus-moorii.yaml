    value:
      structure: group
      minGroup: 15
    confidence: medium
    rationale: Tropheus is kept as a colony, not as a pair or a fixed harem, so that aggression spreads over many fish. Seriously Fish recommends 15 to 20 fish and reports deadly fights in groups of five or six, Fishkeeper names 15 or more, tanganyika.si 15 to 25 and Tropical Freshwater Fish 15 to 40; Konings and Aqualog name ten or more as the minimum. Fifteen is the lower end that most sources recommend and the safer value. Recommendations on the sex ratio differ widely, from equal numbers (Konings) to three or four (tanganyika.si) or six to ten females per male (Seriously Fish).

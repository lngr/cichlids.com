  aggressionConspecific:
    value: 4
    confidence: high
    rationale: Both sexes defend feeding territories, males chase rival males relentlessly and court females aggressively. Seriously Fish reports that groups of five or six may fight to the death, Fishkeeper that smaller groups dwindle as harassment kills females and weaker males, and Staeck describes extremely high aggression towards conspecifics with losses in small tanks; newcomers to an established group are not tolerated. Konings sees a group of ten or more as the only way to keep the species. Keeping it therefore requires a large group, a large rocky tank and experience, which is level 4. Care sheets that describe it only as intolerant of its own kind point to level 3.

  khDkh:
    value:
      min: 15
      max: 20
    confidence: high
    rationale: "Lake endemic: the natural carbonate hardness is the measured range of Lake Tanganyika, strongly buffered bicarbonate water. With dKH = meq/L x 2.8, the alkalinity of 6.5 to 6.6 meq/L (Cohen et al.), 6.71 meq/L (Talling and Talling) and 6.7 to 6.9 meq/L (Edmond et al. 1993 as cited by Langenberg) gives 18.2 to 19.3 dKH; the bicarbonate and carbonate titrations of the FAO/FINNIDA programme reach down to about 15.4 dKH. This gives 15 to 20 dKH."

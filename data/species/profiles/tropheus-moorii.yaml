  diet:
    value:
      type: aufwuchs
      bloatSensitive: true
      foods:
        - Spirulina flakes and other plant-based dry food
        - blanched vegetables and nori
        - algae grown on the decoration
        - small portions of rough-shelled crustaceans such as Cyclops and Mysis
    confidence: high
    rationale: "Field studies class T. moorii as an epilithic algae browser that holds feeding territories and takes mostly filamentous algae (Takamura 1984; Sturmbauer and Dallinger 1995; Egger et al. 2006; Hata et al. 2014). Its gut is very long; wild fish have a relative intestine about 1.7 times longer than aquarium-raised fish, and the species is an algivore rather than a detritivore (Sturmbauer et al. 1992). The FishBase list of worms, crustaceans, insects and plant matter comes from an aquarium book and describes what the fish accepts, not its natural food; the FishBase ecology table gives a trophic level of about 2. All husbandry sources agree on a plant-based, low-protein diet: Konings calls Spirulina flakes the safest food and warns that mosquito larvae, Artemia, beefheart and other soft food can be lethal, Seriously Fish calls the species very susceptible to bloat and rules out meat, and Staeck describes the fish as prone to intestinal disease. Rough-shelled crustaceans such as Cyclops and Mysis are acceptable in small portions."

  predation:
    value: 0
    confidence: high
    rationale: A specialised algae browser that tears filamentous algae from the rock surface and avoids sediment (Konings; Takamura 1984; Egger et al. 2006; Hata et al. 2014; Sturmbauer et al. 1992). Staeck reports stomach contents of wild fish consisting mostly of filamentous algae, and the FishBase ecology table places the species at trophic level about 2.0, a plant and detritus feeder. FishBase also lists worms, crustaceans and insects after an aquarium book, but no source reports fish in the diet. Fry of tankmates may be eaten only by chance, which a keeper in the archive links to bloat. The rubric uses this species as its example for level 0.

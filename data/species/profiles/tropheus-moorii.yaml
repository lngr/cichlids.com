      rationale: The checkers took the midpoint of the typical adult size of 12 to 14 cm on tanganyika.si, but the rubric asks for the typical maximum of well-kept adults, which is the upper end of that range for males and 1 to 2 cm less for females. The 14.5 cm of FishBase and Seriously Fish is the record limit.

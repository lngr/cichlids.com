  breeding:
    text: "T. moorii is a maternal mouthbrooder without a lasting pair bond. A ripe female may stay in a male's territory for some time before spawning; she then lays a small clutch of large eggs, usually fewer than twenty, and takes them into her mouth, where they are fertilised. She broods for about four weeks, hides among the rocks and keeps feeding carefully, and after release she guards the fry for a few more days. In a well-run colony breeding happens on its own. Moving a holding female is risky: stressed females may spit or swallow the brood, and a female away from the group too long can lose her rank and be attacked when she returns. If you move her, do it in darkness and reintroduce her with the lights off. The fry take fine plant-based food and small live food."
    sources:
      - kind: literature
        title: Konings, A. (2009). Tropheus - home is where the rocks are. Practical Fishkeeping.

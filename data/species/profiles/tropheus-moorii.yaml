    tolerance:
      value:
        min: 11
        max: 22
      confidence: low
      rationale: Neither Seriously Fish nor FishBase states a carbonate hardness for this species, and Fishkeeper only says that buffering may be needed to hold the high pH. The Tanganyika specialist site tanganyika.si gives 11 to 22 dKH as acceptable aquarium alkalinity for Tanganyika cichlids, the Einrichtungsbeispiele genus sheet 10 to 20 dKH, Aquaristik-Profi and Zierfische-Direkt 15 to 20 dKH (probably not independent of each other), and a Tropheus club 12 to 20 dKH. Generic values of 3 to 12 dKH or at least 4 dKH would not hold a pH of 8 or more for long and are not followed. The tolerance of 11 to 22 dKH follows the specialist range and contains the natural range of 15 to 20 dKH. Confidence is low because no book or species database states a carbonate hardness for Tropheus moorii itself.

    rationale: "Lake endemic: the natural total hardness is the measured range of Lake Tanganyika, magnesium-rich water in which magnesium far exceeds calcium. With dGH = Ca/7.14 + Mg/4.34, the surface means of the FAO/FINNIDA programme at Bujumbura, Kigoma and Mpulungu give 11.1 to 11.5 dGH, the north basin data of Cohen et al. 12.2 to 12.3 dGH and the values of Talling and Talling 11.3 dGH. This gives 10 to 13 dGH."

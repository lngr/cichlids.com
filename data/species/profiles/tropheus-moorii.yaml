      decision:
        - Tropheus moorii kasabae Nelissen, 1977
        - Tropheus kasabae
        - Tropheus moorei
      rationale: Union of the proposals. The Catalog of Fishes lists kasabae as a synonym of T. moorii, once used at species rank by Marechal and Poll (1991); the misspelling moorei appears in Kawanabe (1981), cited by Konings. T. polli, named in the source title of checker-b, is a synonym of T. annectens and does not belong here.

  sizeAndGrowth:
    text: Adult males reach about 14 cm in a good aquarium, females stay 1 to 2 cm smaller at around 12 cm; the published maximum is 14.5 cm. The body is deep and compact with a blunt head and an underslung mouth with closely set teeth for tearing algae. Juveniles carry narrow dark bars that most adults lose as their population colour develops; some forms, such as Golden Kalambo, show their full colouring only when fully grown. Subdominant fish often stay dull or dark, so colour in a group depends on rank as much as on age. With good care the fish can live for about ten years.

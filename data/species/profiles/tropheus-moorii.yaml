  compatibility:
    text: "The safest setup is a tank with one single Tropheus population and nothing else. Never mix different Tropheus species or locality forms: they cross readily, and in the lake whole hybrid populations exist where two species meet. Most other cichlids are poor companions, because their protein-rich food is dangerous for Tropheus and the restless Tropheus group stresses calmer fish. If you want company in a large tank, the least problematic choice is small bottom-dwelling goby cichlids such as Eretmodus, Tanganicodus or Spathodus, which graze biofilm and accept the same diet. Some care sheets also name Julidochromis, but it needs more animal food than a Tropheus tank should see. Avoid Lake Malawi mbuna, Petrochromis, fish-eating or invertebrate-eating Tanganyika cichlids such as Cyphotilapia frontosa or Neolamprologus brichardi, and any fish that needs regular meaty food."

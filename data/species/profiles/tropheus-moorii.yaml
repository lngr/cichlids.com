  temperatureC:
    value:
      min: 23
      max: 29
    confidence: high
    rationale: Tropheus moorii is endemic to Lake Tanganyika, so its natural temperature is the measured range of the lake. Hourly buoy readings at Mpulungu, inside the range of the species at the cooler southern end of the lake, span 23.85 to 29.01 C; the south is cooler and more variable from June to September because of upwelling. This gives 23 to 29 C.

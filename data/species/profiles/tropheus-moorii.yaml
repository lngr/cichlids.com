  habitat:
    text: "The species lives along the southern shores of Lake Tanganyika: the Congolese coast south of Moba, most of the Zambian coast from Kala Bay past Mpulungu to Chituta Bay, and the south-eastern Tanzanian coast, with a small relict population further north at Lyamembe. It stays in the upper rocky zone, mostly between one and three metres and rarely below seven, and is most common where piles of smaller rocks offer countless hiding places. Sand, mud, river mouths and open water are avoided, so neighbouring populations rarely meet and have developed their own colours. The lake water is warm (23 to 29 C), hard (10 to 13 dGH), very strongly buffered (15 to 20 dKH) and alkaline (pH 8.4 to 9.4). In the lake Tropheus often share their feeding grounds with larger Petrochromis, which dominate them."

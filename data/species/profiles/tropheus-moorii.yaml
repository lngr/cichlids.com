  aggressionHeterospecific:
    value: 2
    confidence: medium
    rationale: Towards unrelated species the fish is described as relatively peaceful (Seriously Fish, Tropical Freshwater Fish, Aqualog), but in the lake it interferes with the feeding of other algae grazers (Takamura 1984), and in the tank it chases competing grazers from its feeding area while its hectic activity wears down calm tankmates; an archive thread reports a juvenile Tropheus subduing a larger mbuna. Chasing other species out of the territory without injuries is level 2; the sources that call it peaceful point to level 1.

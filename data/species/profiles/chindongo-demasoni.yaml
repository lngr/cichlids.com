  ghDgh:
    value: {min: 3, max: 5}
    confidence: high
    verification:
      method: waterbody
      waterbody: lake-malawi
    rationale: >-
      The species lives only in Lake Malawi, so the natural range is the total hardness of the
      lake, computed from measured calcium and magnesium: 4.2 to 4.6 dGH in the upper 50 m of the
      northern basin (Branchu et al. 2010) and 3.2 to 4.9 dGH in the 1960s titrations compiled by
      FAO, which gives 3 to 5 dGH. The lake is soft water whose carbonate hardness exceeds its
      total hardness; the hard-water advice of care sheets concerns the tank, not the habitat.
    sources: *malawiStudies
    evidence:
      - source: *branchu
        value: {min: 4.2, max: 4.6}
        note: upper 50 m of the northern basin, computed from calcium and magnesium
      - source: *fao
        value: {min: 3.2, max: 4.9}
        note: 1960s titrations, computed from calcium and magnesium
    tolerance:
      value: {min: 3, max: 25}
      confidence: medium
      verification:
        method: qualified-majority
        votes: {agree: 4, total: 5}
      rationale: >-
        Four of five votes (generator, checker-a, checker-b and tiebreaker-1) set 3 to 25 dGH;
        checker-c proposed 3 to 20 dGH. The lower bound is the natural lake value, since the fish
        live at 3 to 5 dGH in the wild. The upper bound of 25 dGH rests on Seriously Fish (10 to
        25 dGH), Fishkeeper (up to 25 degrees) and Guidarium (10 to 25 dGH); TankMatcher and a
        German retailer stop at 20 dGH, and no source reports harm between 20 and 25 dGH. The
        lower limits of 9 or 10 dGH in the care sheets reflect the habit of hardening water for
        Malawi cichlids and contradict the lake measurements, so they do not narrow the range.
        Care sheets often confuse total hardness with alkalinity, which keeps the confidence at
        medium.
      sources:
        - *sf
        - *fishkeeper
        - *guidarium
        - *branchu
        - *fao
        - *garnelio
        - &tankmatcher
          kind: website
          title: "TankMatcher: Demasoni Cichlid water parameters and overlap"
          url: https://tankmatcher.com/water-parameters/demasoni-cichlid/
          archived: tankmatcher.com/water-parameters/demasoni-cichlid/2026-10-14T095041Z
          accessed: 2026-10-13
      evidence:
        - source: *sf
          value: {min: 10, max: 25}
          note: aquarium recommendation
        - source: *fishkeeper
          value: {max: 25}
          note: upper limit only; no lower bound stated
        - source: *guidarium
          value: {min: 10, max: 25}
          note: aquarium recommendation
        - source: *branchu
          value: {min: 4.2, max: 4.6}
          note: natural lake value, which the tolerance contains
        - source: *fao
          value: {min: 3.2, max: 4.9}
          note: natural lake value, which the tolerance contains
        - source: *garnelio
          value: {min: 5, max: 20}
          note: retailer page; its running text names 9 to 20
        - source: *tankmatcher
          value: {min: 10, max: 20}
          note: aggregated care band with little primary documentation

  khDkh:
    value: {min: 5, max: 8}
    confidence: high
    verification:
      method: waterbody
      waterbody: lake-malawi
    rationale: >-
      The species lives only in Lake Malawi, so the natural range is the carbonate hardness of
      the lake, converted from measured alkalinity: 2.33 to 2.46 meq/L in the profiles of Branchu
      et al. (2010), about 6.5 to 6.9 dKH, and 2.00 to 2.59 meq/L after Jackson et al. as
      compiled by FAO, about 5.6 to 7.3 dKH, which gives 5 to 8 dKH.
    sources: *malawiStudies
    evidence:
      - source: *branchu
        value: {min: 6.5, max: 6.9}
        note: alkalinity profiles of the northern basin, converted
      - source: *fao
        value: {min: 5.6, max: 7.3}
        note: alkalinity after Jackson et al. (1963), converted
    tolerance:
      value: {min: 5, max: 15}
      confidence: low
      verification:
        method: unanimous
        votes: {agree: 4, total: 4}
      rationale: >-
        The four votes agree within the threshold: three proposed 5 to 15 dKH, checker-c 5 to 14
        dKH. Few sources state a carbonate hardness for this species, and none of them is a
        species database: the retailer page of LiveAquaria names 10 to 15 dKH, TankMatcher 6 to 14
        and AquariumHQ 8 to 18, while a German retailer gives 2 to 8 dKH. Seriously Fish and
        Fishkeeper ask for hard, alkaline water without a dKH value, and their pH ranges reaching
        8.5 to 8.8 need good buffering. The lower bound is the lake minimum of 5 dKH measured by
        Branchu et al. and FAO, because weaker buffering lets the pH sag in a crowded mbuna tank;
        the low 2 dKH of the retailer is not adopted. The upper bound of 15 dKH rests only on
        retailer and aggregator pages, so the confidence is low.
      sources:
        - *branchu
        - *fao
        - *sf
        - *fishkeeper
        - *liveaquaria
        - *tankmatcher
        - &aquariumhq
          kind: website
          title: "AquariumHQ: Demasoni cichlid husbandry record"
          url: https://aquariumhq.app/fish/demasoni-cichlid
          archived: aquariumhq.app/fish/demasoni-cichlid/2026-10-14T095041Z
          accessed: 2026-10-13
        - *garnelio
      evidence:
        - source: *branchu
          value: {min: 6.5, max: 6.9}
          note: natural lake value, which the tolerance contains
        - source: *fao
          value: {min: 5.6, max: 7.3}
          note: natural lake value, which the tolerance contains
        - source: *liveaquaria
          value: {min: 10, max: 15}
          note: retailer page; aragonite substrate advised
        - source: *tankmatcher
          value: {min: 6, max: 14}
          note: aggregated care band
        - source: *aquariumhq
          value: {min: 8, max: 18}
          note: editorial husbandry summary, not a measured tolerance
        - source: *garnelio
          value: {min: 2, max: 8}
          note: retailer page; calcareous decor advised to keep the water alkaline

  maxSizeCm:
    value: {male: 8, female: 7}
    confidence: medium
    rationale: >-
      A dwarf mbuna. FishBase gives 6.3 cm standard length for wild fish from the revision of Li
      et al. (2016), Seriously Fish 7.5 cm standard length, Fishkeeper and Guidarium about 8 cm,
      and the GCCA keeper profile about 7.6 cm for males and 6.4 cm for females. Males grow
      slightly larger than females. Well-kept aquarium males reach about 8 cm total length,
      females about 7 cm. The 10 cm of English Wikipedia and some shops stands alone and is not
      adopted.
    sources:
      - *fishbase
      - *sf
      - *fishkeeper
      - *guidarium
      - *gcca

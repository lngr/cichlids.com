    tolerance:
      value: {min: 21, max: 29}
      confidence: low
      verification:
        method: unanimous
        votes: {agree: 4, total: 4}
      rationale: >-
        All four votes agree on 21 to 29 °C. The care sheets cluster at 24 to 28 °C (Seriously
        Fish, Guidarium, the retailer pages of LiveAquaria, Garnelio and Riverpark Aquatics),
        Fishkeeper names a narrower 24 to 26 °C and FishProfiles.com 26 to 28 °C, and a
        behavioural study held the fish at 25 °C for two months. The tolerance has to contain the
        natural range, so its edges of 21 and 29 °C rest on the lake measurements, which the fish
        meet only seasonally. No husbandry source supports keeping it permanently near those edges;
        24 to 28 °C is the band for long-term care, which is why the confidence is low.

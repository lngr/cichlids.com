partners:
  suitable:
    - species: Labidochromis caeruleus
      reason: Yellow, calm mbuna of similar size that does not share the blue barred pattern and eats a similar plant-rich diet.
      condition: Crowded mbuna tank of at least 120 cm with many caves; demasoni added last.
    - species: Iodotropheus sprengerae
      reason: Small, brownish mbuna of the same size class and diet that holds its own without looking like a rival.
      condition: Tank of at least 120 cm with dense rockwork.
    - species: Maylandia estherae
      reason: Robust mbuna that shares the water and plant-based diet and is not intimidated by demasoni.
      condition: Tank of at least 150 cm, since M. estherae grows larger and is aggressive itself; choose orange fish, not bluish males.
    - species: Synodontis multipunctatus
      reason: Lake Tanganyika catfish that tolerates the same water, stays near the bottom and is too robust to be harmed by demasoni.
      condition: Keep several; it may eat demasoni eggs and fry.
  unsuitable:
    - species: Cynotilapia afra
      reason: Blue barred look-alike; demasoni treats it as a rival of its own kind and fights it relentlessly.
    - species: Maylandia lombardoi
      reason: Females and young males are blue with dark bars and trigger the same rivalry; the species is also larger and aggressive.
    - species: Chindongo saulosi
      reason: Close relative whose males are blue with dark bars; keepers avoid the combination because of the rivalry it triggers.
    - species: Pseudotropheus cyaneorhabdos
      reason: Blue and black look-alike that draws heavy aggression; a laboratory cross with demasoni females that lacked males of their own species produced fertile hybrids.
    - species: Aulonocara stuartgranti
      reason: Peaceful peacock cichlid that needs more protein in its diet and suffers under the constant attacks of demasoni.
    - species: Copadichromis borleyi
      reason: Calm open-water hap that is harassed by demasoni and is fed a more protein-rich diet.

profile:
  overview:
    text: >-
      The demasoni is a dwarf mbuna from a tiny stretch of rocky coast in the Tanzanian part of
      Lake Malawi. Hobbyists know it best under its old name Pseudotropheus demasoni; since 2016
      the Catalog of Fishes places it in the genus Chindongo. Both sexes wear the same striking
      pattern of dark blue and light blue vertical bars, so a group looks uniform and bright.
      Behind the small size hides one of the most quarrelsome cichlids of the lake. A male in a
      small group often kills his rivals one after another, and an established fish will chase
      tankmates many times its size. The species is popular, widely bred in captivity and cheap to
      buy, but it rewards only keepers who plan the tank around its temper: a large, crowded group,
      many caves, robust tankmates of other colours and a plant-based diet. Kept that way it is
      lively, curious and fun to watch, often swimming upside down along the rock faces.
    sources:
      - *cof
      - *sf
      - *fishkeeper
  habitat:
    text: >-
      The species is known only from Pombo Rocks and the nearby reef at Ndumbi Point on the
      Tanzanian east coast of Lake Malawi, south of the Ruhuhu River mouth. These are rocky reefs
      free of sediment, where the fish stay close to the rocks, often in shallow water near the
      tops, and seldom enter open water. Lower down the rock grades into a mix of stones and sand.
      Lake Malawi water is warm, clear and moderately alkaline: about 21 to 29 °C, pH 7.7 to 8.6,
      soft with 3 to 5 dGH but buffered with 5 to 8 dKH. Because the whole world population lives
      on a few small reefs, the IUCN lists the species as Vulnerable; the fish in the trade are
      almost all bred in captivity. An introduced population is also recorded from Romania.
    sources:
      - *cof
      - *fishbase
      - *sf
      - *malawiguru
      - *branchu
      - *fao
      - *eccles
      - *wikide
  sizeAndGrowth:
    text: >-
      This is one of the smallest mbuna. Wild fish measured for the scientific revision reach a
      little over 6 cm standard length; in the aquarium males grow to about 8 cm total length and
      females stay slightly smaller at around 7 cm. Figures of 10 cm found on some pages are
      exaggerated. Young fish already show the full adult pattern, so even juveniles in the shop
      look like small copies of their parents. Growth is moderate, and a group often starts to
      breed well before it is fully grown. With good care the fish live for several years;
      retailers give between about four and ten years.
    sources:
      - *fishbase
      - *sf
      - *fishkeeper
      - *guidarium
      - *gcca
  husbandry:
    text: >-
      Plan a tank of at least 120 cm length, about 45 cm front to back and some 240 litres for a
      group; larger is better. Most of the space should be rockwork: stack stones from the floor
      almost to the surface and leave many caves, gaps and passages, so that no fish can see the
      whole tank at once. Set the rocks on the glass or on the sand bed so that digging cannot
      topple them. A sand floor and a few flat stones give spawning sites. The water should be
      alkaline and well buffered: keep the pH between about 7.5 and 8.8, the carbonate hardness
      above 5 dKH and the temperature between 24 and 28 °C. A crushed coral or aragonite filter
      bag helps to hold the pH. Because the tank will be crowded, filtration must be generous and
      partial water changes frequent. Introduce demasoni as the last fish of a community, since an
      established group defends its rocks against newcomers.
    sources:
      - *sf
      - *fishkeeper
      - *guidarium
      - *malawiguru
      - *liveaquaria
  socialBehavior:
    text: >-
      On the reef demasoni live in large numbers, but in a tank their aggression towards their own
      kind is extreme. In a small group the dominant male usually picks off rivals and even females
      one by one until few or none are left. The working answer is a crowded group of at least
      twelve fish, where attacks spread over many targets and weaker fish can vanish in the crowd;
      since the sexes look alike, the ratio sorts itself out in such a group. Other robust mbuna in
      the tank help to dilute the pressure further. Males defend a compact territory around a cave
      or flat stone at all times and attack any fish that enters, regardless of size. A typical
      and charming habit is how closely they hug the rock surfaces, turning sideways or upside
      down to follow the stone.
    sources:
      - *sf
      - *fishkeeper
      - *guidarium
      - *malawiguru
      - *cichlidforum
  diet:
    text: >-
      In the lake demasoni graze the algal layer on the rocks together with the tiny animals living
      in it, using small mouths with rows of two-pointed teeth. In the tank the staple should be a
      spirulina or other vegetable-based flake or small pellet made for mbuna, supplemented with
      blanched spinach, nori, cucumber or courgette. Animal food is only an occasional small treat,
      such as mysis or brine shrimp; red meat, beef heart and bloodworms are best avoided entirely,
      because this species digests protein-rich food poorly and easily develops bloat. Feed small
      portions once or twice a day and stop while the fish are still eager; a slightly lean
      demasoni is healthier than a round one. Natural algae growth on the rocks gives them
      something to graze between meals.
    sources:
      - *sf
      - *fishkeeper
      - *li2016
      - *malawiguru
      - *a14115
  breeding:
    text: >-
      Demasoni are maternal mouthbrooders and breed readily once a group settles. A ripe male
      darkens, cleans a flat stone or digs a shallow pit near his cave and courts passing females
      in front of it. The pair circles head to tail; the female lays a few eggs at a time, picks
      them up at once and collects the sperm while nibbling at the egg spots on the male's anal
      fin. She then holds the brood for about three weeks without feeding and releases a small
      number of fairly large fry, which take brine shrimp nauplii and crushed flake from the
      start. Breeding works best in a species tank with many females per male; a holding female
      can be moved carefully to a separate tank shortly before release, but stress may make her
      spit out the brood. The young start fighting among themselves early, so rearing tanks need
      cover and space.
    sources:
      - *sf
      - *fishkeeper
      - *gcca
      - *cichlidforum
  sexing:
    text: >-
      Sexing is notoriously hard because males and females share the same colours and bars.
      Adult males tend to be a little larger and above all behave differently: they hold
      territories, display with intensified colours and chase other fish, while females and
      subordinate males stay more in the background. The only reliable method is to compare the
      genital papillae of adult fish, which needs practice and careful handling. For this reason
      most keepers start with a large group of young fish and let the sexes reveal themselves over
      time.
    sources:
      - *sf
      - *fishkeeper
      - *wikide
  compatibility:
    text: >-
      Demasoni belong in a crowded Lake Malawi mbuna tank with tankmates that are robust, about the
      same size or larger, plant-eating and clearly different in colour. Yellow Labidochromis
      caeruleus, Iodotropheus sprengerae and, in larger tanks, orange Maylandia work well. Avoid
      every fish with blue and dark bars or stripes, such as Cynotilapia afra, Maylandia
      lombardoi, Chindongo saulosi or Pseudotropheus cyaneorhabdos: demasoni treat them as rivals
      of their own kind. The last of these has also produced hybrids with demasoni in a laboratory
      cross, although no crossing in mixed tanks is reported. Peaceful peacocks, utaka and other
      haps are a poor match, both because they get bullied and because they need more protein
      than demasoni tolerate. Soft-water fish from South America or Asia do not fit the water.
      Add demasoni last to an existing community.
    sources:
      - *sf
      - *fishkeeper
      - *pfk
      - *gerwin2021
      - *cichlidforum
  problems:
    text: >-
      The most frequent loss is Malawi bloat after protein-rich or excessive feeding; bloodworms,
      beef heart and generous portions of frozen food are typical triggers, and the condition is
      often fatal once the belly swells and the fish stops eating. Keep the diet mainly vegetable
      and the portions small, and ask a fish vet early if a fish swells or produces white, stringy
      faeces. The second classic mistake is too small a group or too small a tank: with three to
      six fish, a dominant male usually kills the others. Too few caves, a single female per male
      or adding new fish to an established demasoni tank lead to the same result. Poor water
      quality in a crowded mbuna tank raises stress and disease risk, so filtration and regular
      water changes matter. Stressed holding females may spit or eat their brood.
    sources:
      - *fishkeeper
      - *sf
      - *guidarium
      - &a14153
        kind: archive
        title: cichlids.com forum thread 14153
        url: https://www.cichlids.com/disc/read.php?2,14153
        accessed: 2026-10-13
      - *a14787


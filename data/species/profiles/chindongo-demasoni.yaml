  diet:
    value:
      type: aufwuchs
      bloatSensitive: true
      foods:
        - spirulina flakes and small vegetable-based pellets
        - algae growth and nori
        - blanched spinach, cucumber and other vegetables
        - small crustaceans such as Mysis or Artemia as a rare treat
    confidence: high
    verification:

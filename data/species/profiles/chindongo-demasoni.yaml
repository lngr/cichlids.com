      decision: []
      rationale: >-
        Decided by the tally as qualified majority with 4 of 5 votes. The proposed group rests on
        one forced laboratory cross with P. cyaneorhabdos, studied in two papers, in which the
        females had no male of their own species; no source reports crosses in mixed tanks, and
        Seriously Fish links the crossing risk of P. cyaneorhabdos to Melanochromis, not to
        demasoni. hybrid-groups.yaml stays unchanged.
    - field: features.ghDgh.tolerance

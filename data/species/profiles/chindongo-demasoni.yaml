        - {by: checker-b, value: {min: 3, max: 25}}
        - {by: checker-c, value: {min: 3, max: 20}}
        - {by: tiebreaker-1, value: {min: 3, max: 25}}
      decision: {min: 3, max: 25}
      rationale: >-
        Decided by the tally as qualified majority with 4 of 5 votes. The upper bound of 25 dGH
        rests on Seriously Fish, Fishkeeper and Guidarium; the 20 dGH of checker-c follows
        TankMatcher and a retailer, and no source reports harm between 20 and 25 dGH.
    - field: features.origin.value.localities
      proposals:
        - {by: generator, value: [Pombo Rocks, Ndumbi Point]}
        - {by: checker-a, value: [Pombo Rocks]}
        - {by: checker-b, value: [Pombo Rocks, Ndumbi Point region]}
        - {by: checker-c, value: [Pombo Rocks, Ndumbi Point]}
      decision: [Pombo Rocks, Ndumbi Point]
      rationale: >-
        Pombo Rocks is the type locality; Malawi-Guru, German Wikipedia and the biotope model add
        the neighbouring reef at Ndumbi Point, and no source contradicts it. The region of
        checker-c, Lake Malawi, Tanzania, is shortened to Lake Malawi, the region name of the
        other runs; the Tanzanian range is stated in the rationale.
    - field: features.maxSizeCm
      proposals:
        - {by: generator, value: {male: 8, female: 7}}
        - {by: checker-a, value: {male: 8, female: 7}}
        - {by: checker-b, value: {male: 8, female: 7}}
        - {by: checker-c, value: {male: 7.6, female: 6.4}}
      decision: {male: 8, female: 7}
      rationale: >-
        Checker-c converted the sizes of a single keeper profile (GCCA). Seriously Fish gives 7.5
        cm standard length, which is about 8 cm or more in total length, and Fishkeeper and
        Guidarium give about 8 cm; females stay slightly smaller. The majority value fits these
        sources better.
    - field: features.aggressionHeterospecific
      proposals:
        - {by: generator, value: 3}
        - {by: checker-a, value: 3}
        - {by: checker-b, value: 3}
        - {by: checker-c, value: 4}
      decision: 3
      rationale: >-
        Seriously Fish and Fishkeeper describe working mixed mbuna tanks of 120 cm with robust
        tankmates of other colours, which is rubric level 3; level 4 means a fish suitable only
        alone or with very robust tankmates in very large tanks. The kills reported by Fishkeeper,
        the GCCA keeper and one forum member concern newcomers to an established tank or unsuitable
        tankmates, which the profile warns about.
    - field: features.territory
      proposals:
        - {by: generator, value: {size: small, breedingOnly: false}}
        - {by: checker-a, value: {size: small, breedingOnly: false}}
        - {by: checker-b, value: {size: small, breedingOnly: false}}
        - {by: checker-c, value: {size: large, breedingOnly: false}}
      decision: {size: small, breedingOnly: false}
      rationale: >-
        Seriously Fish and Fishkeeper describe a male territory around a cave, rock or pit, which
        stays compact in a tank with dense rockwork. The feeding territories of about 2 m that
        Malawi-Guru describes on the reef support checker-c, but in the tank the species is kept
        crowded among many caves; the high heterospecific aggression level covers the risk to
        tankmates.
    - field: features.habitatZones
      proposals:
        - {by: generator, value: [rock]}
        - {by: checker-a, value: [rock]}
        - {by: checker-b, value: [rock, sand]}
        - {by: checker-c, value: [rock]}
      decision: [rock]
      rationale: >-
        The species lives on sediment-free rocky reefs and rarely leaves the rock surface. The
        mixed rock and sand zone lower on the reef and the sand floor of the tank serve as
        substrate and spawning ground, which does not make sand a zone the species depends on.
    - field: features.minTank
      proposals:
        - {by: generator, value: {volumeL: 200, lengthCm: 120, depthCm: 45}}
        - {by: checker-a, value: {volumeL: 200, lengthCm: 120, depthCm: 45}}
        - {by: checker-b, value: {volumeL: 240, lengthCm: 120, depthCm: 45}}
        - {by: checker-c, value: {volumeL: 400, lengthCm: 130, depthCm: 50}}
      decision: {volumeL: 240, lengthCm: 120, depthCm: 45}
      rationale: >-
        All runs agree on a 120 cm tank with about 45 cm depth as the floor, except checker-c,
        which follows the 400 litres and 130 cm of Malawi-Guru for a species tank. Seriously Fish
        calls about 205 litres an absolute minimum, and the recommended unit is a crowded group of
        at least twelve with rockwork that displaces much water, so the common 120 cm tank of about
        240 litres is taken. The larger specialist figure is named in the rationale as the better
        choice.
    - field: features.lifespanYears
      proposals:
        - {by: generator, value: {min: 5, max: 10}}
        - {by: checker-a, value: {min: 8, max: 10}}
        - {by: checker-b, value: {min: 8, max: 10}}
        - {by: checker-c, value: {min: 6, max: 10}}
      decision: {min: 5, max: 10}
      rationale: >-
        Only retailer and aggregator pages give a life span, ranging from 4 to 6 years (Garnelio)
        and about 5 years (The iFISH Store) to 6 to 10 (AquariumHQ) and 8 to 10 years (Aquarium
        Fish Paradise). A range of 5 to 10 years covers these reports; checker-b gave no source for
        its value. The confidence stays low.

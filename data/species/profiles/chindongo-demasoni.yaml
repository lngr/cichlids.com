  habitatZones:
    value: [rock]
    confidence: high
    rationale: >-
      Lives on rocky reefs free of sediment, mostly near the rock tops in shallow water, and is
      rarely seen in open water (Seriously Fish, Malawi-Guru, Fishkeeper; the Cichlid Room
      Companion confirms a rocky habitat). Courtship in the laboratory centres on rock crevices
      and caves. Lower on the reef the rock grades into rock and sand, and a sand floor in the tank
      serves as substrate and spawning ground, but the species does not depend on open sand.

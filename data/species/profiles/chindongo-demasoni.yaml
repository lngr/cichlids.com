  author: (Konings, 1994)
  source: &cof
    kind: catalog-of-fishes
    title: "Eschmeyer's Catalog of Fishes, species of the genus Chindongo"
    url: https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Chindongo
    archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-7cb5b2a4/2026-10-14T095033Z
    accessed: 2026-10-13
  synonyms:
    - name: Pseudotropheus demasoni Konings, 1994
      note: Original combination; Konings (2016) and Stauffer et al. (2016) keep it, and most of the aquarium trade uses it.
  legacyNames:
    - Pseudotropheus demasoni
  note: >-
    The Catalog of Fishes gives the current status as valid in Chindongo, following the revision
    of the former Pseudotropheus elongatus species group by Li, Konings and Stauffer (2016); the
    Pseudotropheus list holds no separate entry for the species. Type locality Pombo Rocks on the
    Tanzanian coast of Lake Malawi, holotype MRAC 94-12-P-1. The catalog also records an
    introduced population in Romania.

names:
  trade:
    en: [Demasoni, Demasoni cichlid, "Demason's cichlid"]
    de: [Demasoni, Demasons Maulbrüter]

variants:
  - name: Pombo Rocks
    kind: locality
    note: Type locality; the trade stock descends mainly from fish of this reef.
  - name: Ndumbi
    kind: locality
    note: Reef near Ndumbi Point close to Pombo Rocks, the only other site named for the species; the fish look the same.

features:
  origin:
    value:
      continent: Africa
      region: Lake Malawi
      waterbody: lake-malawi
      localities: [Pombo Rocks, Ndumbi Point]
    confidence: high
    rationale: >-
      Endemic to Lake Malawi with a very small range on the Tanzanian east coast. The Catalog of
      Fishes gives Pombo Rocks as type locality and FishBase restricts the species to the
      Tanzanian part of the lake. Malawi-Guru, German Wikipedia and a biotope model of the reef
      add the neighbouring reef at Ndumbi Point, south of the Ruhuhu mouth. The public summary of
      the Cichlid Room Companion confirms a rocky lake habitat. The population in Romania is
      introduced and does not count as natural range.

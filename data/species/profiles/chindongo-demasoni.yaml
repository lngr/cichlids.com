  ph:
    value: {min: 7.7, max: 8.6}
    confidence: high
    verification:
      method: waterbody
      waterbody: lake-malawi
    rationale: >-
      The species lives only in Lake Malawi, so the natural range is the measured surface pH of
      the lake: 7.7 to 8.6 in the survey of Jackson et al. as compiled by FAO. Branchu et al.
      (2010) give 7.5 to 8.5 for the whole water column of the northern basin, the lower values
      belonging to deep water that the species does not reach. A biotope model of Pombo Rocks
      states pH 7.8, inside the range.
    sources: *malawiStudies
    evidence:
      - source: *fao
        value: {min: 7.7, max: 8.6}
        note: lake surface water
      - source: *branchu
        value: {min: 7.5, max: 8.5}
        note: whole water column of the northern basin; the low values come from deep water
      - source: *bap
        value: {min: 7.8, max: 7.8}
        note: single habitat reading given for the reef
    tolerance:
      value: {min: 7.5, max: 8.8}
      confidence: medium
      verification:
        method: unanimous
        votes: {agree: 4, total: 4}
      rationale: >-
        The four votes agree within the threshold: three proposed 7.5 to 8.8, checker-c 7.6 to
        8.6, and the tally keeps 7.5 to 8.8. The husbandry sources cluster in this band: Seriously
        Fish 7.6 to 8.8, Fishkeeper 7.5 to 8.5, FishProfiles.com, Guidarium and the GCCA keeper
        profile 7.6 to 8.6, and the retailer pages of LiveAquaria and Riverpark Aquatics 7.8 to
        8.6 and 7.5 to 8.5. A German retailer goes down to pH 7.0; the species databases do not
        support neutral water for mbuna, so this lower value is not adopted. The range contains
        the lake range of 7.7 to 8.6.

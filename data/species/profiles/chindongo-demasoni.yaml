    rationale: >-
      All four votes give an aufwuchs grazer that is sensitive to bloat. The genus has bicuspid
      scraping teeth (Li et al. 2016), and the species grazes the algal layer on the rocks with
      the small animals living in it (Malawi-Guru, Practical Fishkeeping; Genner and Turner 2005
      for mbuna in general). Seriously Fish asks for a mainly vegetable diet and warns that red
      meat upsets digestion; Fishkeeper and Guidarium link protein-rich food with Malawi bloat,
      which can be fatal, and Malawi-Guru and German Wikipedia warn of intestinal disease on
      animal food. Members of the cichlids.com forum report losses to bloat. The Cichlid Room
      Companion confirms the feeding type as algae grazer. One retailer guide calls the species
      an omnivore, which reflects feeding practice in the hobby rather than the natural diet.

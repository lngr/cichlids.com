  aggressionConspecific:
    value: 4
    confidence: high
    rationale: >-
      One of the most aggressive mbuna towards its own kind. Seriously Fish reports that
      subdominant males may be killed even in crowded tanks and that females are intolerant as
      well; Fishkeeper reports that a male kept with a single female harasses her to death and
      that males kill unreceptive females. Guidarium and the Cichlid-Forum article state that
      groups of fewer than about twelve end with the dominant male killing the others, and the
      GCCA keeper lost four of five fish within a week. Keeping it needs a large crowded group,
      many caves and experience. Four independent sources and all four votes agree.

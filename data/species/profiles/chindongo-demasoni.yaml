  aggressionHeterospecific:
    value: 3
    confidence: medium
    rationale: >-
      Despite its small size the male attacks fish several times larger that come near its rocks
      (Seriously Fish), and Fishkeeper warns that an established male can kill much larger
      newcomers, so demasoni should be added last. Tankmates must be robust mbuna of comparable
      temperament that do not share its blue barred pattern; peaceful haplochromines such as
      peacocks and utaka are unsuitable. Seriously Fish and Fishkeeper both describe working mixed
      mbuna tanks of 120 cm, which fits level 3 rather than level 4, whose rubric meaning is a
      fish suitable only alone or with very robust tankmates in very large tanks. The kills
      reported by the GCCA keeper and one forum member concern newcomers or unsuitable tankmates.

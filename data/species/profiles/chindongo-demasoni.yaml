  temperatureC:
    value: {min: 21, max: 29}
    confidence: high
    verification:
      method: waterbody
      waterbody: lake-malawi
    rationale: >-
      The species lives only in Lake Malawi, so the natural range is the measured temperature
      range of the lake. Eccles (1974) reports about 27 °C in the upper water column by May and
      21 °C inshore in the cool, windy season; Vollmer et al. (2005) give summer surface water of
      about 28 °C and winter surface-layer values of 23.5 to 24 °C, and a later survey campaign
      reached 29 °C. No measurement from Pombo Rocks itself was found; a biotope model of the reef
      states 25 °C, inside the range.
    sources: &malawiStudies
      - &branchu
        kind: literature
        title: >-
          Branchu, P., Bergonzini, L., Ambrosi, J.-P., Cardinal, D., Delalande, M., Pons-Branchu,
          E. et al. (2010). Hydrochemistry (major and trace elements) of Lake Malawi (Nyasa),
          Tanzanian Northern Basin: local versus global considerations. Hydrology and Earth System
          Sciences Discussions 7, 4371-4409.
        url: https://hess.copernicus.org/preprints/7/4371/2010/hessd-7-4371-2010.pdf
        archived: hess.copernicus.org/preprints/7/4371/2010/hessd-7-4371-2010.pdf/2026-10-14T094507Z
        accessed: 2026-10-12
      - &fao
        kind: literature
        title: >-
          Vanden Bossche, J.-P. and Bernacsek, G. M. (1990). Source book for the inland fishery
          resources of Africa, Vol. 1, CIFA Technical Paper 18/1, FAO. Lake Malawi/Nyasa: physical
          and chemical data after Jackson et al. (1963) and Talling and Talling (1965).
        url: https://www.fao.org/4/t0473e/T0473E05.htm
        archived: fao.org/4/t0473e/t0473e05.htm/2026-10-14T094507Z
        accessed: 2026-10-12
      - &eccles
        kind: literature
        title: >-
          Eccles, D. H. (1974). An outline of the physical limnology of Lake Malawi (Lake Nyasa).
          Limnology and Oceanography 19(5), 730-742 (abstract).
        url: https://doi.org/10.4319/lo.1974.19.5.0730
        accessed: 2026-10-12
      - &vollmer2005
        kind: literature
        title: >-
          Vollmer, M. K., Bootsma, H. A., Hecky, R. E., Patterson, G., Halfman, J. D., Edmond, J.
          M., Eccles, D. H. and Weiss, R. F. (2005). Deep-water warming trend in Lake Malawi, East
          Africa. Limnology and Oceanography 50(2), 727-732.
        url: https://www.dora.lib4ri.ch/empa/dload/empa:1253/PDF/view
        archived: dora.lib4ri.ch/empa/dload/empa_1253/pdf/view/2026-10-14T094508Z
        accessed: 2026-10-12
      - &vollmer1999
        kind: literature
        title: >-
          Vollmer, M. K., Weiss, R. F. and Bootsma, H. A. (1999). Lake Malawi/Nyasa deep water
          renewal. In: Bootsma, H. A. and Hecky, R. E. (eds.), Water Quality Report, SADC/GEF Lake
          Malawi/Nyasa Biodiversity Conservation Project, chapter 4.
        url: https://sites.uwm.edu/hbootsma/files/2020/11/Ch4-Lake-Internal-Mixing.pdf
        archived: sites.uwm.edu/hbootsma/files/2020/11/ch4-lake-internal-mixing.pdf/2026-10-14T094509Z
        accessed: 2026-10-12
      - &ngochera
        kind: literature
        title: Ngochera (2018). Carbon Dynamics in Tropical Lake Malawi. PhD dissertation, University of Wisconsin-Milwaukee.
        url: https://minds.wisconsin.edu/handle/1793/91765
        archived: minds.wisconsin.edu/handle/1793/91765/2026-10-14T094513Z
        accessed: 2026-10-12
    evidence:
      - source: *eccles
        value: {min: 21, max: 27}
        note: cool-season inshore minimum and warm upper water column
      - source: *vollmer2005
        value: {min: 23.5, max: 28}
        note: winter surface layer to summer surface water
      - source: *bap

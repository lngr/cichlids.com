  socialBehavior:
    text: "Treat a compatible adult pair as the social unit. Rival adults and an incompatible partner can receive\
      \ persistent chasing; the conspecific aggression grade is 3. Territory is substantial and not confined to\
      \ spawning. A laboratory study observed territorial aggression even in immature fish and found fewer confrontations\
      \ with furnishings. Visual barriers help, but a fish that cannot feed or leave cover needs separation. Obtain\
      \ a pair from juveniles only with accommodation ready for surplus adults. Breeding can greatly increase the\
      \ defended bottom area, so compatibility should be checked again when courtship begins."
    sources:
      - kind: literature
        title: "Borstein and Borstein (2005). Geophagus brasiliensis, Greater Chicago Cichlid Association breeding\
          \ report"
        url: "https://www.gcca.net/art-pics/cichlid-profiles-list/south-american-cichlids/145-geophagus-brasiliensis"

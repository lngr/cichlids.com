      \ fish larvae among foods. Bastos et al. found mixed plant and invertebrate feeding with fish material mainly\
      \ as scales. This supports opportunistic fry predation rather than regular hunting of all mouth-sized fish.\
      \ The rubric's approximately 2 cm boundary is a planning convention, not a measured prey maximum. Southern\
      \ diet samples may represent other modern members of the complex; retailer warnings are supporting website\
      \ evidence only."

  note: "The current Catalog of Fishes retains Geophagus brasiliensis (Quoy & Gaimard, 1824). Its present generic\
    \ placement is provisional in phylogenetic papers, which often mark Geophagus with quotation marks. The legacy\
    \ Brazil-to-Uruguay pearl-eartheater concept combines several described and undescribed lineages. Argolo et\
    \ al. (2020) assign many southern populations to the valid G. iporangensis and recover the named brasiliensis\
    \ near the Paraiba do Sul/type region plus disjunct northeastern clusters with a possible introduction history.\
    \ None of the valid complex members is merged as a synonym or listed as an aquarium variant. The Catalog retains\
    \ Acara minuta in synonymy despite its southern type locality, so molecular distribution changes do not by themselves\
    \ rewrite the nomenclature. CRC's public page corroborated the combination but offered no feeding or breeding\
    \ summary; its Kner year differs from the Catalog, whose 1865 date takes precedence. The legacy entry lacks\
    \ locality and diagnostic evidence, so older ecology, husbandry and the 1991 hybrid report may concern a different\
    \ modern complex member."

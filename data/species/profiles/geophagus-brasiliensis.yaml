  sizeAndGrowth:
    text: "The selected aquarium planning sizes are 25 cm for males and 18 cm for females. The female figure is\
      \ an estimate; few read sources quantify females separately. Published maxima also mix standard length with\
      \ total length, so a 25 cm standard-length record and 28 cm total-length record are not equivalent measurements.\
      \ Some accounts describe males near 30 cm or larger. Young fish can reproduce before reaching adult dimensions.\
      \ Early spawning in a small aquarium does not establish that it will remain adequate, and adult space should\
      \ be ready before the fish outgrow juvenile accommodation. A lifespan around eight to ten years is a practical\
      \ estimate rather than a verified maximum."
    sources:
      - kind: literature
        title: "Borstein and Borstein (2005). Geophagus brasiliensis, Greater Chicago Cichlid Association breeding\
          \ report"

    rationale: "The tally fixes 0 to 4 dKH with low confidence; its four proposals agree within the 2 dKH threshold.\
      \ Median endpoints are 0.35 and 3.6 before integer rounding. Natural KH has no verification object. The value\
      \ is operational carbonate alkalinity, separately calculated from GH: divide alkalinity as CaCO3 by 17.848,\
      \ microequivalents/L by about 357, or bicarbonate mg/L by about 21.8. Lee and Bonotto give 1.23 to 3.59 dKH\
      \ excluding their sewage outlier; Figueiredo's annual station means give 1.01 to 1.45; Lammle's bicarbonate\
      \ gives 0.47 to 0.59. Guandu reference streams give 0.32 to 0.48 and raw water 1.82 to 2.24. The selected\
      \ maximum is narrower than Pereira's Mae-Ba 2.59 to 4.57 and checker-c's 0.3 to 4.6 proposal. De Souza's inferred\
      \ 0.55 to 3.04 assumes a CaCO3-equivalent reporting basis. Zero comes from rounded votes, not a measured absence\
      \ of buffering; conductivity and GH cannot supply KH measurements. Proposals: generator 0.5 to 3.6; checker-a\
      \ 0 to 2; checker-b 0.4 to 3.6; checker-c 0.3 to 4.6."

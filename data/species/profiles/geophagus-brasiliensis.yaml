  ghDgh:
    value:
      min: 0
      max: 3
    confidence: low
    rationale: "The tally fixes 0 to 3 dGH with unanimous 4-of-4 agreement under its 2 dGH endpoint threshold and\
      \ low confidence. The agreed-endpoint medians are 0.3 and 2.65 dGH, rounded to integers; zero is not an observation\
      \ of ion-free habitat. Direct hardness assays and calcium-magnesium calculations support very soft southeastern\
      \ basin water. Use dGH=Ca(mg/L)/7.14+Mg(mg/L)/4.34, or total hardness as CaCO3 divided by 17.848. Lee and\
      \ Bonotto imply 0.13 to 1.12; de Souza's independent ion bounds imply 0.17 to 2.09. Guandu measurements give\
      \ 0.55 to 1.10 or 0.61 to 1.12 and paired Mae-Ba ions about 1.66 to 2.29. The decided upper boundary is narrower\
      \ than Lammle's paired 2.89 to 3.31 dGH and checker-b's 0.1 to 3.5 proposal. FishBase states the conflicting\
      \ 5 to 10 dH and Bednarczuk gives 5 to 15 for the broader complex. Those are not substituted for measured\
      \ core-basin chemistry. Conductivity-only proposals cannot establish GH, and unpaired ion extrema provide\
      \ bounds rather than paired hardness observations. Proposals: generator 0.1 to 2.1; checker-a 1 to 3; checker-b\
      \ 0.1 to 3.5; checker-c 0.5 to 2.3."

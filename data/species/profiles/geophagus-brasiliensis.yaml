  temperatureC:
    value:
      min: 19
      max: 29
    confidence: low
    rationale: "The tally fixes 19 to 29 C by the median method with low confidence because the six proposals do\
      \ not yield qualified agreement. Median endpoints are 19 and 29.4 C before integer rounding. This is a representative\
      \ vote-derived band, not the full measured habitat envelope. Honorio and Martins report 17.2 to 29.3 C in\
      \ Una site-season cells with the species caught; Araujo and Santos report the wider 20.3 to 36 C at Lajes,\
      \ including hot reservoir excursions with unresolved fish-level exposure. Other wider evidence is 16 to 30\
      \ C for Bednarczuk's multi-species complex, 17 to 28.2 C in Jureia streams, 24.6 to 32.8 C in Lee and Bonotto's\
      \ basin survey and 29.5 to 31.6 C at Mae-Ba Lagoon. These ranges are retained rather than silently truncated.\
      \ Some southern records may be iporangensis, regional surveys do not prove fish occupancy at every station,\
      \ and annual means such as Figueiredo's 25.8 to 29.5 C are not annual extremes. FishBase's 11 to 37 C environment\
      \ interval is not a demonstrated native field envelope or long-term care range. Proposals: generator 23.9\
      \ to 29.5; checker-a 18 to 28; checker-b 16 to 30; checker-c 23.9 to 31.6; tiebreaker-1 17.2 to 29.3; tiebreaker-2\
      \ 20 to 29."

    - field: taxonomy.note
      proposals:
        - by: generator
          value: "Valid name confirmed directly in the Catalog of Fishes. Scientific papers often put Geophagus\
            \ in quotation marks because the brasiliensis group awaits a formal generic assignment. Argolo et al.\
            \ (2020) restrict brasiliensis sensu stricto and assign many southern Brazilian and Uruguayan populations\
            \ to iporangensis. Neither iporangensis nor the other currently valid complex members is treated as\
            \ a synonym here. The legacy entry provides no locality diagnosis. Husbandry data often concern the\
            \ broad trade concept, while natural chemistry uses the confirmed Brazilian core basin as a regional\
            \ proxy. CRC was consulted for nomenclature only; its public page did not make feeding, habitat or breeding\
            \ summaries available. The Tubarao study and the 2013 Paraiba do Sul hydrochemistry paper were refused\
            \ as not open access by fetch-oa and were not used for numerical evidence. No securely identified named\
            \ aquarium color strain or distinct locality form of brasiliensis sensu stricto was established, so\
            \ variants is empty rather than listing other valid complex species as forms."
        - by: checker-a
          value: "The Catalog of Fishes lists the species as valid in Geophagus; Argolo et al. 2020 place it in\
            \ quotation marks (Geophagus), indicating that the genus assignment is provisional. The name covers\
            \ a species complex with several unresolved forms."
        - by: checker-b
          value: "Valid name checked directly against the Catalog of Fishes. Its distribution is southeastern Brazil,\
            \ while the legacy catalog and FishBase encompass a wider brasiliensis complex extending to Uruguay.\
            \ G. iporangensis and several other former brasiliensis populations are valid separate species, not\
            \ synonyms to merge here. CRC public nomenclature confirms the retained combination but contains an\
            \ inconsistent year for the Kner synonym; the catalog takes precedence. Water and husbandry inferences\
            \ from incompletely identified populations therefore remain provisional."
        - by: checker-c
          value: "The Catalog of Fishes confirms the valid combination on the access date. Its southeastern Brazilian\
            \ range is narrower than the historical Brazil-to-Uruguay aquarium concept. Geophagus iporangensis and\
            \ G. itapicuruensis are valid separate species and are not listed here as synonyms. Argolo et al. (2020)\
            \ resolves approximately ten lineages, including undescribed forms. Older habitat and husbandry data\
            \ may mix members of this complex. The public Cichlid Room Companion page corroborates the name but\
            \ did not expose feeding or breeding summaries; subscriber content was not accessed."
      decision: "The current Catalog of Fishes retains Geophagus brasiliensis (Quoy & Gaimard, 1824). Its present\
        \ generic placement is provisional in phylogenetic papers, which often mark Geophagus with quotation marks.\
        \ The legacy Brazil-to-Uruguay pearl-eartheater concept combines several described and undescribed lineages.\
        \ Argolo et al. (2020) assign many southern populations to the valid G. iporangensis and recover the named\
        \ brasiliensis near the Paraiba do Sul/type region plus disjunct northeastern clusters with a possible introduction\
        \ history. None of the valid complex members is merged as a synonym or listed as an aquarium variant. The\
        \ Catalog retains Acara minuta in synonymy despite its southern type locality, so molecular distribution\
        \ changes do not by themselves rewrite the nomenclature. CRC's public page corroborated the combination\
        \ but offered no feeding or breeding summary; its Kner year differs from the Catalog, whose 1865 date takes\
        \ precedence. The legacy entry lacks locality and diagnostic evidence, so older ecology, husbandry and the\
        \ 1991 hybrid report may concern a different modern complex member."
      rationale: "All full profiles agree on the valid name and authority. The generator gives the full Catalog\
        \ synonym set, checker-a gives a short authored subset, and checker-b and checker-c differ in ordering or\
        \ explanatory labels. Retain the full normalized Catalog list, mark museum names as unavailable and keep\
        \ all currently valid complex species separate. Scope is resolved by the Catalog and read Argolo revision;\
        \ CRC is verification only and its conflicting Kner year is not adopted."

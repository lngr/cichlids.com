  breeding:
    text: "A compatible pair attaches eggs to a prepared solid surface and both parents guard the brood. Rocks,\
      \ wood, glass or a pot surface can be used; this is open substrate spawning rather than obligatory cave breeding\
      \ or mouthbrooding. Larvae may be moved into shallow excavated depressions before swimming freely. Territorial\
      \ defense intensifies while eggs and young are present, which can displace companions that previously coexisted.\
      \ Supply suitable fine fry food when the young begin independent feeding. An isolated female may lay eggs\
      \ without a male, so an egg deposit alone does not demonstrate fertilization or a hybrid spawning."
    sources:
      - kind: literature
        title: "Borstein and Borstein (2005). Geophagus brasiliensis, Greater Chicago Cichlid Association breeding\
          \ report"
        url: "https://www.gcca.net/art-pics/cichlid-profiles-list/south-american-cichlids/145-geophagus-brasiliensis"

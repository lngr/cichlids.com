  problems:
    text: "Insufficient adult space, a weak or immature filter and an incompatible partner are common avoidable\
      \ problems. Digging can dislodge stones, uproot plants and push sand into pumps. Uneaten food and buried debris\
      \ increase the load even when the water looks clear. Sources associate poor maintenance with restricted growth\
      \ and lesions around the head or lateral line, but appearance alone cannot identify their cause. Persistent\
      \ appetite loss, labored breathing or injury calls for checking water quality and obtaining qualified help.\
      \ At low alkalinity, pay particular attention to pH stability. Broad habitat adaptability does not establish\
      \ immunity to chronic pollution or guarantee health at the uncertain tolerance endpoints."
    sources:
      - kind: literature
        title: "Borstein and Borstein (2005). Geophagus brasiliensis, Greater Chicago Cichlid Association breeding\
          \ report"

  ph:
    value:
      min: 6
      max: 8.2
    confidence: medium
    rationale: "The tally fixes pH 6.0 to 8.2 by qualified majority, with 4 of 6 agreeing within its 0.3 pH threshold\
      \ and medium confidence. Lee and Bonotto measured 6.16 to 7.41 and Figueiredo et al. 6.86 to 8.15; native-region\
      \ occupied systems independently include Imboassica 6 to 8, Una 6.7 to 7.9 and Lajes 6.5 to 8.2. The selected\
      \ range is narrower than de Souza's drought-period 4.83 to 8.15, Ferreira's Jureia readings of 4.8 to 8.1\
      \ and Itanhaem blackwater mean-plus-SD band of 4.1 to 5.0. Those observations involve altered conditions or\
      \ older complex identifications and are not interpreted as a routine aquarium target. Guandu reference streams\
      \ also reach 5.9. FishBase's narrower 6.5 to 7.0 does not encompass the read regional alkaline records. Identity\
      \ was not genetically confirmed in these ecological surveys. Proposals: generator 6.16 to 8.15; checker-a\
      \ 5.0 to 7.5; checker-b 6 to 8.2; checker-c 5.9 to 8.1; tiebreaker-1 6.5 to 8.2; tiebreaker-2 6 to 8.2."

  sexing:
    text: "Mature males generally become larger and may develop a fuller forehead and longer fins. Females usually\
      \ remain smaller, but size overlaps among different ages, stocks and social ranks. Reflective colors occur\
      \ in both sexes and change with condition and dominance. Use several clues together and observe reproduction\
      \ rather than assigning sex from a single photograph or forehead feature. Egg laying identifies a female;\
      \ it does not prove that a compatible male is present. The numerical female planning size remains less secure\
      \ than the published male or unsexed maxima."
    sources:
      - kind: literature
        title: "Borstein and Borstein (2005). Geophagus brasiliensis, Greater Chicago Cichlid Association breeding\
          \ report"

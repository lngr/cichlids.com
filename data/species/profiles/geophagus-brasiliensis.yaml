        accessed: '2026-10-13'
  diet:
    text: "Use balanced sinking cichlid pellets as the prepared staple and vary the menu with appropriate insect\
      \ larvae, small crustaceans, mollusks and plant-containing foods. Natural feeding studies under the older\
      \ species name include animal prey, vascular plant material and detritus; their proportions depend on habitat\
      \ and reproductive state. Pearl eartheaters inspect objects and dig as well as picking food above the substrate.\
      \ Opportunistic consumption of fry or tiny fish supports predation level 1, without evidence that fish form\
      \ the main diet. No specialized high-protein bloat sensitivity is established, although excessive feeding\
      \ still degrades water quality. Offer portions the fish can finish and verify that any companions get food."
    sources:

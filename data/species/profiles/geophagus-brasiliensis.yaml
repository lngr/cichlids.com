  compatibility:
    text: "Selected fish of similar size and temperament can coexist in an aquarium substantially larger than the\
      \ pair minimum. Large severums, adult blue acaras and an adult school of silver dollars are conditional examples,\
      \ with feeding access, cover and a separation option. General heterospecific aggression is graded 2 for territorial\
      \ exclusion, though individuals and breeding pairs can become more damaging. Tiny fish and fragile bottom-dwelling\
      \ cichlids are poor choices. Two separate presumed crossing cautions concern G. iporangensis and Vieja melanurus.\
      \ The first rests on close relationship without a verified cross; the second on a historical captive report\
      \ with unverified parent identity and partner availability. These pairwise groups do not establish crossing\
      \ among every member of the broader complex."
    sources:

partners:
  suitable:
    - species: Heros efasciatus
      reason: A similarly sized severum is a conditional option supported by the care guide for Heros tankmates.
      condition: "An established adult specimen in a spacious aquarium substantially exceeding the pair minimum,\
        \ with overlapping water conditions and a separation option."
    - species: Andinoacara pulcher
      reason: "Blue acaras are explicitly suggested by a care guide, but must be large enough to withstand territorial\
        \ attention."
      condition: "Adults only, with separate cover and feeding access in a large mixed aquarium; remove if repeatedly\
        \ chased."
    - species: Metynnis argenteus
      reason: Silver dollars are suggested as robust midwater companions; this concrete species is an inference
        within the named genus.
      condition: A full adult school with ample swimming room in a larger aquarium; the 400 litre pair allowance
        is not sufficient for the complete community.
  unsuitable:
    - species: Paracheirodon innesi
      reason: Small adult size and limited ability to withstand territorial attacks make predation or injury plausible
        even without a specialist piscivore diet.
    - species: Mikrogeophagus ramirezi
      reason: "Small, comparatively vulnerable bottom-dwelling cichlids can be excluded from feeding and shelter\
        \ by a territorial pearl-eartheater pair. The shared bottom area makes this an unsuitable default pairing."
    - species: Geophagus iporangensis
      reason: "A close, look-alike pearl-eartheater species creates territorial rivalry and a proposed presumed\
        \ breeding-line crossing risk; named crosses remain unverified."
    - species: Vieja melanurus
      reason: A historical captive cross with a male fish identified as G. brasiliensis was reported by Astle and
        indexed by the DCG; original parent identity and free partner choice are unverified. The presumed pairwise
        group raises a crossing caution in addition to size and territorial demands.
profile:
  overview:
    text: "An adult pearl eartheater brings persistent digging, reflective flank markings and conspicuous pair behavior\
      \ to a large aquarium. A settled pair needs at least 400 litres with a 150 by 50 cm base. Plan around males\
      \ of about 25 cm and smaller females, while allowing for larger individuals and uncertain sex-specific limits.\
      \ The valid name remains Geophagus brasiliensis. Older labels encompass a complex extending from eastern Brazil\
      \ toward Uruguay; genetic research assigns many southern populations to other species, including G. iporangensis.\
      \ Collection or breeding-line information is therefore more useful than color alone when preserving identity."
    sources:
      - kind: catalog-of-fishes
        title: "Eschmeyer's Catalog of Fishes: species of Geophagus, version updated 21 September 2026"
        url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Geophagus"
        archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-99b1ebbc/2026-10-14T095906Z
        accessed: '2026-10-13'
      - kind: literature
        title: Argolo et al. (2020). Unraveling the systematics and evolution of the Geophagus brasiliensis species
          complex
        url: "https://doi.org/10.1016/j.ympev.2020.106855"
        archived: doi.org/10.1016_j.ympev.2020.106855/2026-10-13T155519Z
        accessed: '2026-10-13'
      - kind: literature
        title: "Borstein and Borstein (2005). Geophagus brasiliensis, Greater Chicago Cichlid Association breeding\
          \ report"
        url: "https://www.gcca.net/art-pics/cichlid-profiles-list/south-american-cichlids/145-geophagus-brasiliensis"
        accessed: '2026-10-13'
      - kind: database
        title: "Seriously Fish: Geophagus brasiliensis, Pearl Cichlid"
        url: "https://www.seriouslyfish.com/species/geophagus-brasiliensis/"
        archived: seriouslyfish.com/species/geophagus-brasiliensis/2026-10-14T095913Z
        accessed: '2026-10-13'
      - kind: database
        title: "Nordiska Ciklidsallskapet: Geophagus brasiliensis species register"
        url: "https://ciklid.org/artregister/art.php?ID=386"
        archived: ciklid.org/artregister/art.php/q-dc203eb1/2026-10-14T095915Z
        accessed: '2026-10-13'
  habitat:
    text: "The currently named species is best anchored in southeastern Brazilian coastal drainage systems and the\
      \ Paraiba do Sul/type-locality region. Older studies cover a wider pearl-eartheater complex and sometimes\
      \ describe altered rivers, reservoirs or coastal lagoons. Soft substrate, woody litter and solid bottom surfaces\
      \ supply feeding sites and cover; vegetation varies. The decided natural values are 19 to 29 C, pH 6 to 8.2,\
      \ GH 0 to 3 and KH 0 to 4. These summarize the evidence through voting and rounding rather than every observed\
      \ extreme. In particular, the temperature band is narrower than several field studies, and zero hardness or\
      \ buffering was not demonstrated as a habitat requirement. GH and alkalinity were assessed separately."
    sources:

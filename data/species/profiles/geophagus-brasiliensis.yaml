    tolerance:
      value:
        min: 18
        max: 30
      confidence: low
      rationale: "The tally fixes 18 to 30 C by qualified majority, 4 of 6 votes, with low confidence. Seriously\
        \ Fish gives 18 to 28 C and Fishkeeping.co.uk 20 to 28; Rechi gives 18 to 30 and the Nordic register 24\
        \ to 30, directly supporting the warm extension as care advice. This range is narrower than checker-b's\
        \ 16 to 30 and checker-c's 18 to 32 proposals. The measured natural median band of 19 to 29 lies inside\
        \ it. The 72-day Medina trial at 24.3, 28.1 and 31.7 C favored growth near 24.3; acute hypoxia experiments\
        \ and warm field excursions do not establish health over years at the endpoints. The most consistently supported\
        \ routine conditions are cooler than the uncertain upper boundary. Proposals: generator 18 to 30; checker-a\
        \ 18 to 28; checker-b 16 to 30; checker-c 18 to 32; tiebreaker-1 17 to 30; tiebreaker-2 18 to 30."

  husbandry:
    text: "Provide an established adult pair with at least 400 litres and a 150 by 50 cm base, broad sand areas\
      \ and stable wood or rocks that interrupt sight lines. Secure heavy objects so excavation cannot undermine\
      \ them, and protect filter intakes from stirred substrate. Mature biological filtration, effective removal\
      \ of suspended debris and regular substantial water changes support the waste load. Around 24 to 26 C is a\
      \ practical everyday temperature. The stored aquarium tolerances are 18 to 30 C, pH 6 to 8.2, GH 0 to 15 and\
      \ KH 0 to 10, all with low confidence at their uncertain boundaries. Use stable conditions within the supported\
      \ care ranges. Neither the zero endpoints nor warm field excursions justify deliberately removing minerals\
      \ or holding fish at extreme conditions."
    sources:
      - kind: literature
        title: "Borstein and Borstein (2005). Geophagus brasiliensis, Greater Chicago Cichlid Association breeding\
          \ report"
        url: "https://www.gcca.net/art-pics/cichlid-profiles-list/south-american-cichlids/145-geophagus-brasiliensis"

profile:
  overview:
    text: "Buccochromis lepturus is a large fish-eating cichlid of the Lake Malawi system, known in the aquarium\
      \ trade as the Slender Tail Hap or Green Lepturus. A full-grown male is a powerful swimmer whose prey-size\
      \ requirements matter more than its relatively restrained everyday aggression. Adults need an exceptionally\
      \ large aquarium with space above a sandy bottom. The recommended social unit here is one male with three\
      \ females. This is a demanding choice because the fish combine substantial adult size, rapid feeding\
      \ and a large waste load. The valid name remains Buccochromis lepturus; Haplochromis lepturus is the\
      \ original combination and Haplochromis gigas a synonym."
    sources:
    - *id001
    - *id014
    - *id018
  habitat:
    text: "Juveniles use shallow sandy margins, while adults range over deeper sandy areas and the water above\
      \ them. Specialist accounts differ on depth, with observations around 20 m in the NVC account and a preferred\
      \ 15 to 30 m band in Malawi-Guru. The species is reported around Lake Malawi; NVC additionally mentions\
      \ connected Lake Malombe. Aquarium planning uses the Malawi lake envelope of 21 to 29 C, pH 7.7 to 8.6,\
      \ GH 3 to 5 dGH and KH 5 to 8 dKH. These natural values come from lake studies and include seasonal variation.\
      \ They are distinct from the separately listed aquarium tolerances."
    sources:
    - *id002
    - *id028
    - *id019
    - *id007
    - *id009
    - *id012
    - *id008
  sizeAndGrowth:
    text: "Use about 40 cm for the male and 32 cm for the female when planning the adult aquarium. The male\
      \ figure is anchored by a 40 cm standard-length report, whereas NVC reports males to 42 cm and directly\
      \ supplies the 32 cm female figure. FishBase gives 41.7 cm total length for male or unsexed fish; that\
      \ is a different length measure. Other care pages report upper sizes around 45 cm without a comparable\
      \ female measurement. The selected values describe typical planning maxima rather than record limits.\
      \ The approximate lifespan interval is 8 to 12 years; a provisional care page gives ten years, but reliable\
      \ long-term lifespan records are scarce."
    sources:
    - *id014
    - *id002
    - *id019
    - *id013
  husbandry:
    text: "For one male and three females, use at least 1000 litres and 250 cm of uninterrupted tank length.\
      \ A front-to-back depth around 70 cm is a planning estimate for turning and passing, not a published\
      \ species-specific threshold. NVC recommends a longer 300 cm aquarium; extra length is valuable for this\
      \ active fish. Leave broad swimming routes over sand, with a few stable rocks and sheltered areas that\
      \ do not constrict them. Maintain strong filtration, oxygenation and consistent water changes. Seriously\
      \ Fish recommends 24 to 27 C, pH 7.5 to 8.8 and GH 10 to 25 dGH. The wider profile tolerances include\
      \ natural conditions; their outer limits are not routine targets, and the inferred KH tolerance of 5\
      \ to 14 dKH has low confidence."
    sources:
    - *id014
    - *id019
    - *id007
    - *id009
    - *id012
    - *id008
    - *id029
  socialBehavior:
    text: "The aquarium recommendation is a harem of one male with at least three females. This follows explicit\
      \ specialist keeping advice rather than a claim that wild fish form permanent harems. CRC describes mating\
      \ with multiple partners, and wild observations include loose associations with one courting male. Roomy\
      \ aquaria can support reasonable conspecific tolerance, although hierarchy and breeding chases still\
      \ occur. A spawning male may defend a small temporary location. Outside that period the species ranges\
      \ widely instead of occupying a permanent large territory. Provide ways for a subordinate fish to withdraw\
      \ and watch whether every fish can feed without being repeatedly cornered."
    sources:
    - *id028
    - *id014
    - *id019
    - *id029
  diet:
    text: "Fish are the principal natural food, including juvenile cichlids taken over sandy substrate. In\
      \ captivity, a suitable cichlid pellet can form the staple, supplemented with varied aquatic foods such\
      \ as prawns, mussels and krill. The food list describes nutritional options and the wild feeding mode;\
      \ live fish are unnecessary. This predator feeds rapidly, so control portions and check the condition\
      \ of less assertive companions. Remove leftovers and account for the considerable load that animal foods\
      \ place on filtration. No special bloat sensitivity is established, but that does not make excessive\
      \ or poorly balanced feeding harmless."
    sources:
    - *id002
    - *id014
    - *id019
    - *id030
  breeding:
    text: "The female mouthbroods after spawning. Aquarium reproduction has been reported, but detailed species-specific\
      \ schedules remain limited. Accounts describe spawning either over sediment or at a location among rocks;\
      \ neither supports making a crater or cave an obligatory requirement. The male can defend the immediate\
      \ site briefly and strongly. A brooding female needs room to avoid pressure from other fish. The 1:3\
      \ aquarium ratio is a husbandry recommendation, compatible with the multiple-partner mating pattern reported\
      \ by CRC. There is insufficient evidence here to promise a particular clutch size, incubation duration\
      \ or fry yield."
    sources:
    - *id028
    - *id014
    - *id019
    - *id029
  sexing:
    text: "Mature males grow larger and develop stronger colour than females. Green and blue are the supported\
      \ adult-male colours, while the stripe assignment in the feature data remains tentative rather than a\
      \ reliable textual diagnosis. A reported female adult size around 32 cm helps with long-term planning\
      \ but is unsuitable as a standalone sexing test. Age, growth and social status can obscure differences,\
      \ particularly in young fish. Use mature specimens and several traits together instead of assuming that\
      \ every small or dull fish is female. The sources read do not establish a dependable species-specific\
      \ fin or egg-spot rule."
    sources:
    - *id014
    - *id019
    - *id013
  compatibility:
    text: "Choose large Malawi cichlids with enough body depth to remain safely beyond swallowing size and\
      \ enough confidence to compete at feeding. Comparable adult predators can be candidates in an aquarium\
      \ larger than the minimum needed for the harem alone. Small fish and juveniles are unsuitable regardless\
      \ of their temperament, and mbuna are discouraged in the species accounts. Everyday aggression toward\
      \ similarly sized companions is usually modest, but spawning defense and feeding competition can change\
      \ the balance. No supported hybrid group is assigned; this is an absence of specific evidence, not assurance\
      \ that any related pairing is genetically safe. Evaluate size and behaviour before treating any suggested\
      \ companion as a workable combination."
    sources:
    - *id014
    - *id019
    - *id018
    - *id030
    - *id029
  problems:
    text: "Insufficient swimming room, weak waste removal and vulnerable tankmates are the principal avoidable\
      \ problems. A small juvenile can outgrow an apparently spacious setup, so provide for adult size from\
      \ the outset. Warm water needs particular attention to oxygenation; the upper tolerance bound is not\
      \ a preferred permanent setting. Eager feeding can produce excess waste and uneven body condition among\
      \ companions. Observe whether breeding pressure, blocked routes or food competition isolate an individual.\
      \ This profile does not establish a recurring special disease susceptibility. Loss of appetite, breathing\
      \ changes or abnormal swimming warrant investigation of water quality and the fish's condition rather\
      \ than automatic treatment."
    sources:
    - *id014
    - *id018

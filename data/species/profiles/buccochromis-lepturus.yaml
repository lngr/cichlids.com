  khDkh:
    value:
      min: 5
      max: 8
    confidence: high
    rationale: "Keep the settled natural 5 to 8 dKH without a verification object. FAO compiles alkalinity\
      \ equivalent to about 5.6 to 7.3 dKH, while Branchu et al. measurements give about 6.5 to 6.9 dKH. The\
      \ natural interval is the outward whole-degree lake synthesis. Sodium contributes to bicarbonate charge\
      \ balance, so this alkalinity can exceed calcium-magnesium general hardness; GH is not converted into\
      \ KH."

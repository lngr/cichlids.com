      decision:
        - name: Pelmatochromis pleurospilus
          note: Original combination published by Boulenger in 1906.
        - name: Pelmatochromis rhodostigma
          note: Boulenger 1906; a synonym in the current Catalog of Fishes.
        - name: Callochromis rhodostigma
          note: Later combination of the rhodostigma synonym used in aquarium references.
        - name: Pelmatochromis stappersii
          note: Boulenger 1914; synonymy follows Takahashi and Nakaya (1998) in the current Catalog of Fishes.
        - name: Callochromis stappersii
          note: "Later combination of Pelmatochromis stappersii, now a junior synonym."
      rationale: "The accepted name is Callochromis pleurospilus (Boulenger, 1906). Legacy entry 24 spells the
        synonym stappersi with one final i; the catalog spelling is stappersii. The current catalog synonymy
        unites entries 23 and 24. CRC and Tanganyika.si distinguish an undescribed Tanzanian fish formerly
        sold under the stappersii name, so trade locality labels alone do not establish identity. The
        Takahashi and Nakaya paper was retained as a bibliographic record; fetch-oa did not provide an open
        full text."

    tolerance:
      value:
        min: 23
        max: 29
      confidence: low
      rationale: "The tally decision is 23 to 29 C, unanimous within its one-degree agreement rule at 4 of 4 votes,
        with low confidence. The generator and checker-c proposed 23 to 29 C, checker-a 22 to 29 C, and
        checker-b 23 to 30 C. The agreed endpoint medians retain 23 to 29 C without speculative extra degrees.
        FishBase and Fishipedia give 23 to 28 C, DRTA 23 to 27 C, Aquahaus-Gaus 24 to 26 C, Aquatropics 24 to
        27 C, and the Nordic register 24 to 27.5 C. Seriously Fish gives 24 to 27 C for C. macrops only. The
        natural maximum requires 29 C to be included, but Louette reports repeated distress above 26 C in his
        Callochromis tanks. Equal natural and tolerance intervals here reflect the containment rule and
        limited endpoint evidence, not demonstrated failure outside the interval; sustained warmth is not the
        preferred keeping target. The wider 23 to 30 C proposal has no chronic species trial behind it."

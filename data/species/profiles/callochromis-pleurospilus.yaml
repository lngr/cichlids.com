  ph:
    value:
      min: 8.4
      max: 9.4
    confidence: high
    rationale: "The natural decision is pH 8.4 to 9.4 with waterbody verification. Plisnier et al. recorded pH
      8.47 to 9.40 at 40 m during an annual cycle, with surface water near pH 9. FishBase gives the
      conflicting species-summary range 7.0 to 8.5, and Fishipedia gives 7.8 to 8.8; these are retained in
      evidence but do not override direct lake limnology. The older FAO source-book range of 7.3 to 7.8 is
      also inconsistent with the modern lake studies."

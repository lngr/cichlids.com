  husbandry:
    text: "For one male and four females, provide at least 240 L with a base around 120 by 45 cm. Community
      stocking requires additional room for the companions. Leave much of the floor as fine sand, with stable
      rocks around the edges making refuges and interrupting long lines of sight. Gravel and a bare floor
      remove the fish's main feeding and escape substrate. Maintain clean water with reliable biological
      filtration and regular water changes. The recorded aquarium tolerances are 23 to 29 C, pH 7.5 to 9.4, GH
      10 to 15 dGH and KH 10 to 20 dKH; these are recommendations and derived intervals, not experimentally
      demonstrated failure thresholds. A temperature around 24 to 26 C fits the cooler care advice. Louette
      reported distress above 26 C, so the lake maximum is not a reason to heat a tank to the top of its
      recorded tolerance."
    sources:
      - *a14
      - *a54
      - *a17
      - *a15

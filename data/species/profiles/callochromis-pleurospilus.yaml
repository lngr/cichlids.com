    - field: partners
      proposals:
        - by: generator
          value:
            suitable:
              - species: Cyprichromis leptosoma
                reason: Uses the upper water column while this species needs open bottom sand.
                condition: Use a Tanganyika-sized aquarium with separate room for the sand bed.
              - species: Paracyprichromis nigripinnis
                reason: Stays near rock faces and higher in the water than the sand-foraging Callochromis.
              - species: Neolamprologus leleupi
                reason: Uses rocky retreats; its habitat differs from the broad open-sand courtship area.
                condition: Provide a rock zone and visual barriers away from the sandy display area.
            unsuitable:
              - species: Callochromis macrops
                reason: Similar sand-dwelling males can contest the same display space and may hybridize within the genus.
              - species: Cyathopharynx furcifer
                reason: "Large, territorial sand-bottom fish competes for the same open substrate and can dominate this
                  smaller species."
              - species: Tropheus moorii
                reason: "More forceful, algae-focused feeding and territorial activity make it a poor match for this slower
                  benthic invertivore."
      decision:
        suitable:
          - species: Cyprichromis leptosoma
            reason: A potential companion using the water column while Callochromis keeps its sand feeding and spawning
              area.
            condition: Use a larger community aquarium that meets both species needs and retains an unobstructed sand
              zone.
          - species: Paracyprichromis nigripinnis
            reason: A possible calmer companion around rock faces away from the main sand territory.
            condition: Provide suitable rock cover and verify that both species feed without harassment.
          - species: Julidochromis regani
            reason: "Louette kept this rock-associated species with breeding Callochromis, providing direct but limited
              mixed-tank experience."
            condition: The reported aquarium had a 145 by 50 cm floor and shared filtration with another tank; released
              fry were not safe from the companions.
        unsuitable:
          - species: Callochromis macrops
            reason: Its similar feeding and breeding sites create direct competition for sand; a cross involving C.
              pleurospilus was not established.
          - species: Cyathopharynx furcifer
            reason: Larger males use overlapping sand display space and can disrupt this smaller species.
          - species: Tropheus moorii
            reason: The grazing diet and forceful feeding and territorial behavior are a poor match for this invertebrate
              feeder and its quiet sand area.
      rationale: "The generator mentioned possible hybridization with C. macrops despite proposing no hybrid group.
        No named cross was established, so the unsuitable-pair explanation rests on shared sand territories.
        The documented Julidochromis regani experience replaces the unverified Neolamprologus leleupi
        recommendation; other potential companions remain explicitly conditional."

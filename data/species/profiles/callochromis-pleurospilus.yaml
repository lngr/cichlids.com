      rationale: "The proposals were generator 200 L and 100 by 40 cm, checker-a 240 L and 120 by 45 cm, checker-b
        200 L and 110 by 45 cm, and checker-c 280 L and 120 by 45 cm. Component medians are 220 L, 115 cm
        length and 45 cm depth. Checking those medians against sources leads to a practical 240 L and 120 by
        45 cm footprint for one male with four females: Fishipedia lists 240 L, AquariumDomain recommends
        about 208 L but a four-foot aquarium, and Seriously Fish gives a 120 by 45 cm base for the larger
        congener. The Nordic register gives 200 L and 110 cm; DRTA gives a smaller 160 L and 80 cm. The modest
        upward adjustment from the medians follows the selected five-fish unit and four-foot guidance, not the
        largest proposal. The inherited Atlas attribution of 284 L and 122 by 46 cm is retained but flagged as
        unsupported by its archived text; its actual article gives about 50 US gallons and 40 inches before
        recommending four feet in practice. Louette used 145 by 50 by 35 cm, about 254 L, linked to another
        300 L tank, so it is not a standalone minimum-volume trial."

  sizeAndGrowth:
    text: "Plan around a male of roughly 11 cm and a smaller female estimated at about 8.5 cm. The female number
      is inferred rather than a measured maximum, so the decimal should not suggest biological precision. Most
      better-supported adult descriptions cluster around 10 to 12 cm, although some aquarium listings reach 14
      or 15 cm without separating the sexes. Locality, identity and the way length is measured may contribute
      to that spread. A lifespan of 6 to 8 years is only a low-confidence planning estimate: the sole
      numerical species account gives 8 years and labels its data provisional. A dependable species-specific
      growth curve was not available."
    sources:
      - *a2
      - *a14
      - *a4

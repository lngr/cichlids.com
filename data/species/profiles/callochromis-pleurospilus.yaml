      - *a56
      - *a7
      - *a51
  problems:
    text: "Social injury is the clearest documented keeping hazard. Male rivalry can be fatal, and repeated
      harassment can prevent females from feeding normally. A coarse substrate also prevents effective burying
      when the fish is startled; handling should account for this escape response. Watch respiration and
      movement during warm conditions, because one experienced breeder repeatedly observed distress above 26
      C. The GH and especially KH tolerance endpoints have limited long-term evidence and should not be
      treated as targets to test. Stable chemistry, adequate filtration and observation of individual appetite
      provide a better basis for care. No special species-specific disease pattern was established by the
      retained sources."
    sources:

      - *a53
  sexing:
    text: "Mature displaying males are usually larger and more colourful than females, whose appearance stays
      largely silver. Male hues can include blue, orange, green and red over a pale base, with dark flank
      markings and colour across the fins. Intensity changes with display and locality, so a quiet or
      subordinate male may look much plainer. The sex difference is less dependable in juveniles, and the
      numerical female size estimate is not a diagnostic threshold. Male anal-fin markings participate in the
      spawning display. Because a trade label can include a different Tanzanian fish, colour alone is
      insufficient to confirm the species or the provenance of a group."
    sources:
      - *a66
      - *a30
      - *a16
      - *a3
      - *a50

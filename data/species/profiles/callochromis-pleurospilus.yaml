      - *a2
  diet:
    text: "Small animal prey taken from sand defines the natural feeding role. Crustaceans, insect larvae and
      molluscs are recorded, with mysis, daphnia and cyclops among suitable aquarium foods. A varied selection
      of small frozen foods and appropriate prepared foods allows subordinate fish to take manageable
      portions. Check that each female actually feeds instead of judging the group by the appetite of the
      male. The profile classifies the species as an invertivore and does not assign special bloat
      sensitivity. Broader omnivore labels in some care pages describe food acceptance rather than evidence
      for a predominantly plant-based natural diet. Predation level 0 allows incidental fry pickup; it is not
      a guarantee that every newly released fry will survive."
    sources:
      - *a2
      - *a49
      - *a14
      - *a4

      - *a51
  compatibility:
    text: "Calmer Tanganyika species can share the aquarium when their territories leave the sand area available.
      Water-column fish such as Cyprichromis and rock-associated companions are possibilities in a suitably
      larger setup. Louette reported keeping and breeding Callochromis with Julidochromis regani, but that
      experience does not establish every mixed stock as safe. Avoid crowding the floor with other
      sand-breeding cichlids, especially larger Callochromis or featherfins. The selected interspecific
      aggression level reflects territorial chasing rather than routine injury to unrelated species. No hybrid
      group is assigned because no named cross involving this species was established. That absence of a group
      is a statement about available evidence, not a guarantee against crossing."
    sources:
      - *a14
      - *a54
      - *a15
      - *a46
      - *a50

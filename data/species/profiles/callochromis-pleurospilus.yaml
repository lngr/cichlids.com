  legacyNames:
    - Callochromis pleurospilus
    - Callochromis stappersi
  note: "The accepted name is Callochromis pleurospilus (Boulenger, 1906). Legacy entry 24 spells the synonym
    stappersi with one final i; the catalog spelling is stappersii. The current catalog synonymy unites
    entries 23 and 24. CRC and Tanganyika.si distinguish an undescribed Tanzanian fish formerly sold under the
    stappersii name, so trade locality labels alone do not establish identity. The Takahashi and Nakaya paper
    was retained as a bibliographic record; fetch-oa did not provide an open full text."

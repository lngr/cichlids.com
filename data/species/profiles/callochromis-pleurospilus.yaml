    - field: features.aggressionConspecific
      proposals:
        - by: generator
          value: 3
        - by: checker-a
          value: 3
        - by: checker-b
          value: 3
        - by: checker-c
          value: 4
      decision: 4
      rationale: "The generator, checker-a and checker-b proposed 3; checker-c proposed 4. Louette describes
        injuries to subordinate males and two males killed by the dominant fish despite a 145 by 50 cm
        footprint. The Nordic association independently warns of extreme aggression within the species. These
        concrete outcomes support rubric level 4 rather than the general chasing descriptions behind level 3.
        The recommendation of one male with four females avoids the tested multi-male conflict; adding males
        needs substantially more space and a separation option. Mild descriptions under the stappersii trade
        name and a forum stocking list do not invalidate the direct account."

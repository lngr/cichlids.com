    value:
      min: 23
      max: 29
    confidence: high
    rationale: "The natural decision is 23 to 29 C with waterbody verification. Verburg et al. recorded hourly
      near-surface values of 23.85 to 29.01 C at Mpulungu; these support the rounded lake reference rather
      than an aquarium target. FishBase gives 23 to 28 C, while the Louette aquarium account reports distress
      above 26 C. The latter observation qualifies warm aquarium keeping but does not replace the lake-wide
      measurements."

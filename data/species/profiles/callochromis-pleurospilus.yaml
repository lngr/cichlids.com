      - *a29
      - *a13
  breeding:
    text: "Spawning takes place at a small depression prepared by the male in fine sand. He displays to females,
      and the female gathers the clutch into her mouth. She alone carries the developing eggs and young.
      Aquarium accounts generally place incubation near three weeks, with variation between reports. The nest
      may be only about 10 to 15 cm across, but the defended area and social pressure need much more room. A
      brooding female needs quiet cover outside the main courtship site. Accounts disagree about retrieval of
      fry after their first release, so continued maternal protection should not be assumed. Other aquarium
      inhabitants can eat the released fry, as happened in the Louette report."
    sources:
      - *a49
      - *a14
      - *a34
      - *a17

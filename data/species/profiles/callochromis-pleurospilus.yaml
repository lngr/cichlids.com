  socialBehavior:
    text: "Use a single male with four females at the stated minimum. The species schools in nature, but that does
      not make a confined group of males safe. A published aquarium experience records two subordinate males
      killed by the dominant fish, and the Nordic association also warns of severe aggression within the
      species. Females need routes out of the male's view and places to feed away from his display area. A
      male may spend much of his time tending a small sand crater, with chasing extending beyond its rim.
      Watch for fish that remain trapped near the surface or in a corner, miss food, or acquire injuries.
      Persistent exclusion calls for separation or a change in housing. Multi-male arrangements need
      substantially more floor space and individual assessment."
    sources:
      - *a54
      - *a14
      - *a17
      - *a15
      - *a4
      - *a18

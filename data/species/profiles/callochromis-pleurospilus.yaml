  habitat:
    text: "The essential habitat is a shallow sandy shore with nearby rocky shelter. Loose groups search the
      bottom and can bury themselves when frightened. Tanganyika.si describes sheltered, sediment-rich bays
      and river-mouth areas, usually within roughly the first 3 m. Distribution accounts differ: FishBase
      excludes the southern tip, while the Nordic register and other specialist pages describe a more
      extensive shoreline range. The confirmed type localities and synonym records establish a broad lake
      origin without resolving every trade locality. The natural reference intervals are 23 to 29 C, pH 8.4 to
      9.4, GH 10 to 13 dGH and KH 15 to 20 dKH. Those lake measurements describe habitat chemistry; aquarium
      recommendations form a separate body of evidence."

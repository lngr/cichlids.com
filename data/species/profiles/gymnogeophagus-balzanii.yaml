      rationale: "The qualified-majority tally selects 14 to 28 C from 5 agreeing votes out of 6. This is a seasonal
        envelope, with 21 to 25 C preferred during active months and 16 to 18 C for three to four winter
        months according to Seriously Fish. The lower edge contains the rounded natural decision and is partly
        inferred from occupied Ibera water at 13.5 C. The upper edge rounds TFH spawning observations of 25 to
        27.8 C, not a demonstration of health for years at constant 28 C. NCS recommends 15 to 25 C, Glaser
        explicitly includes balzanii in its 14 to 16 C several-week cool phase, and the farm gives 18.3 to
        25.6 C. Wider keeper observations reach approximately 12.8 C, but duration and stock history do not
        establish a firm lifelong lower threshold. Tankora's nearly constant warm regime conflicts with the
        better supported winter rest. Keep low confidence and do not treat either endpoint as a year-round
        target. Proposals: generator 14 to 28; checker-a 16 to 27; checker-b 13.5 to 26; checker-c 13.5 to 28;
        tiebreaker-1 13.5 to 28; tiebreaker-2 13.5 to 27."

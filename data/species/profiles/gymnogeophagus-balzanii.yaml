    rationale: "The tally uses the median of all six proposals because only 3 votes support its leading candidate,
      giving 5.6 to 7.8 with low confidence. The lower bound is directly measured in occupied Ibera ponds at
      pH 5.6 to 6.8. The 7.8 upper bound is a regional Pantanal tributary proxy, not a paired balzanii
      capture. Kutty measured 6.7 to 7.4 at an occupied Salto Grande site. Neiff reports a wider 6.1 to 7.9
      study-area range, but the 7.9 observation belongs to a phase without recorded balzanii; phases
      containing this species span 6.3 to 7.36 across the stations. Puig reports 6.7 to 7.9. The wider
      Pantanal tributary means span 5.4 to 7.8, with no demonstrated occurrence at the 5.4 Correntes station.
      The median retains ordinary acidic and mildly alkaline native-basin waters while preserving these
      broader regional observations as evidence. Proposals: generator 6 to 7.9; checker-a 6.5 to 7.5;
      checker-b 5.6 to 7.8; checker-c 5.6 to 7.8; tiebreaker-1 5.6 to 7.9; tiebreaker-2 5.6 to 7.4."

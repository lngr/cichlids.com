      established as occupied. Lower Parana alkalinity gives 1.34 to 2.58 dKH and Corriente regional
      measurements give 0.39 to 2.91 dKH. These values measure buffer capacity in aquarium KH equivalents,
      distinct from Ca/Mg hardness. Regional proxies and the rounded endpoints justify low confidence.

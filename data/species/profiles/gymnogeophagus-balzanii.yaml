  breeding:
    text: "The female deposits eggs on a prepared surface and guards the initial substrate stage. She gathers the
      developing young around hatching and carries them in her mouth, later taking released fry back when
      threatened. The male can resume courting other females and is not the oral caregiver. Sources differ on
      the precise moment of pickup, but the stronger accounts agree on delayed maternal care. Keep refuges
      available for females before and after brooding and offer suitably small food when fry begin feeding."
    sources:
      - *a49
      - *a79
      - *a65
      - *a32
      - *a25
      - *a31
  sexing:
    text: "Mature males usually become larger and more colorful, with extended dorsal and anal fins. The forehead
      swelling reflects dominance as well as maturity, so a subordinate male can lack a conspicuous hump.
      Females are smaller and can darken noticeably while caring for a brood. Adult male coloration combines
      yellow and olive tones with blue markings, reddish fins and dark flank markings. Juveniles are harder to
      sex reliably; a juvenile group needs a plan for surplus males as rivalry develops."
    sources:
      - *a31
      - *a32
      - *a79
      - *a59
      - *a25
      - *a13
      - *a26
      - *a36
      - *a68
      - *a61
      - *a60
  compatibility:
    text: "Selected adult shoaling companions can occupy the upper water if their temperature requirements match
      the winter rest. Buenos Aires tetras are a source-backed option, and suitable danionins offer
      alternatives when their identity, adult size and seasonal needs are checked. Food still needs to reach
      the eartheaters. Very small fish and fry can be eaten; the approximately 2 cm level-1 threshold is a
      rubric rule rather than a measured gape limit. Warm-water rams and cardinal tetras conflict with the
      cool season. Frontosa also come from much more alkaline lake water and were involved in a failed
      archived introduction. No named hybrid group is established for balzanii."
    sources:

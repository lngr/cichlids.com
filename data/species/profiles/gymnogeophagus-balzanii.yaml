  socialBehavior:
    text: "One adult male with three females is the recommended arrangement. Competing males and unreceptive
      females can face persistent chasing even when the fish seem calm around upper-water companions. Brooding
      females exclude neighbors from their spawning areas, which can extend well beyond one stone. Provide
      several separate refuges and check that every fish can feed and move freely. The breeding-only territory
      flag concerns brood-site defence; it does not remove male rivalry at other times."
    sources:

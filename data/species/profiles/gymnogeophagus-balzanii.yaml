        throughout the species. Checker-a's level 0 is contradicted by the stomach records. Compatibility with
        medium-sized shoaling fish and warnings about tiny tankmates support an opportunistic category. The
        rubric's approximately 2 cm threshold is not a measured prey-size limit. The fish-dominated local
        sample remains dissenting level-3 evidence rather than being suppressed. Proposals: generator 1;
        checker-a 0; checker-b 1; checker-c 1; tiebreaker-1 1; tiebreaker-2 1."

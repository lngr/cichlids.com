  sizeAndGrowth:
    text: "The adopted aquarium planning maxima are 20 cm for males and 14 cm for females. Female size is less
      securely documented, with other read accounts giving about 10 or 12 cm. Standard length excludes the
      tail and cannot be compared directly with total length, so the published 12 cm and 16.9 cm
      standard-length records do not replace these aquarium estimates. Young fish may mature while still much
      smaller than adult size. The five-to-eight-year lifespan estimate comes from care accounts rather than a
      tracked cohort."

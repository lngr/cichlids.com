  temperatureC:
    value: &a97
      min: 14
      max: 27
    confidence: low
    rationale: "The settled tally selects 14 to 27 C by qualified majority, with 5 of 6 votes agreeing within the
      temperature threshold. Whole-degree rounding raises the repeated 13.5 C proposal to 14 C; the directly
      observed 13.5 to 20.8 C occupied Ibera pond range stays in evidence. Permanent Parana floodplain
      stations span 18 to 27 C, but individual captures are not linked to every measurement. Wider measured
      ranges include Puig et al. 14.3 to 27.5 C, the full Neiff station set 18 to 31 C, and Paraguay channel
      or floodplain observations up to 32.5 or 33.6 C. Kutty measured 29.4 C where adult balzanii were
      collected and 33.3 C at the nearby shallow shore. These seasonal snapshots remain evidence without
      making the upper extremes routine long-term aquarium temperatures. FishBase 22 to 26 C is attributed to
      aquarium literature. The working range is plausible as an approximate typical seasonal envelope and its
      locality uncertainty keeps confidence low. Proposals: generator 14.3 to 27.5; checker-a 15 to 28;
      checker-b 13.5 to 26; checker-c 13.5 to 27; tiebreaker-1 13.5 to 27; tiebreaker-2 13.5 to 27."

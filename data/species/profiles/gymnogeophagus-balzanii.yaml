  predation:
    value: 1
    confidence: low
    rationale: "The qualified-majority tally retains level 1 from 5 of 6 votes, with its decided low confidence.
      Neiff et al. report fish in 15 percent of examined stomachs, compared with insects in 65 percent and
      higher plants in 60 percent; these are occurrence frequencies, not percentages of food volume. Correa et
      al. report 93.6 percent fish by volume in a local sample of only two stomachs from fish 2.8 to 8.5 cm
      standard length. That is direct evidence of ingestion but cannot establish habitual adult piscivory
      throughout the species. Checker-a's level 0 is contradicted by the stomach records. Compatibility with
      medium-sized shoaling fish and warnings about tiny tankmates support an opportunistic category. The
      rubric's approximately 2 cm threshold is not a measured prey-size limit. The fish-dominated local sample
      remains dissenting level-3 evidence rather than being suppressed. Proposals: generator 1; checker-a 0;
      checker-b 1; checker-c 1; tiebreaker-1 1; tiebreaker-2 1."
    sources:
      - *a31
      - *a25
      - *a59

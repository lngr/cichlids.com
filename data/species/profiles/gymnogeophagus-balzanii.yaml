partners:
  suitable:
    - species: Psalidodon anisitsi
      reason: Adult shoaling fish use the upper water and tolerate the planned seasonal cooling.
      condition: "At least 8 to 10 adults, winter 16 to 18 C, ample space and monitoring for fin nipping."
    - species: Devario aequipinnatus
      reason: A larger upper-water shoaling species with a documented 16 to 26 C care range.
      condition: "At least 8 to 10 correctly identified adults; maintain oxygenation and a lid, and distribute
        sinking food separately."
    - species: Danio rerio
      reason: Peaceful adult upper-water fish can share the active season and an 18 C winter.
      condition: "At least 8 to 10 fully grown standard-fin fish; keep the winter at 18 C and summer at 21 to 25 C,
        exclude juveniles and monitor for predation."
    - species: Hoplisoma paleatum
      reason: "A peaceful sand-foraging catfish from subtropical South America, also compatible with the general
        catfish experience in TFH."
      condition: Conditional alternative with a group of adults and extra bottom space. FishBase gives 18 to 23 C
        but Seriously Fish 22 to 26 C; use proven cool-adapted stock for an 18 C winter or separate it
        seasonally.
  unsuitable:
    - species: Mikrogeophagus ramirezi
      reason: Its 27 to 30 C care requirement conflicts with the cool winter rest and preferred active-season
        temperatures.
    - species: Cyphotilapia frontosa
      reason: "Tanganyika field studies document much more alkaline water, and its tropical regime does not suit the
        planned cool winter; the archive also describes an unsuccessful introduction involving illness."
    - species: Paracheirodon axelrodi
      reason: Its 23 to 29 C care range does not include the 16 to 18 C winter rest; small juveniles also risk being
        eaten.
profile:
  overview:
    text: "Gymnogeophagus balzanii is a subtropical sand-foraging cichlid best planned around a seasonal routine.
      A mature dominant male develops a conspicuous forehead swelling, while females provide the mouth care
      for young. Its aquarium appeal comes with a need for a cool winter, room for a harem and feeding access
      at the bottom. The common name Argentine humphead does not describe the full native range."
    sources:
      - *a1
      - *a49
      - kind: database
        title: "FishBase: common names of Gymnogeophagus balzanii"
        url: "https://www.fishbase.se/ComNames/CommonNamesList.php?GenusName=Gymnogeophagus&ID=12375&SpeciesName=balz\
          anii&StockCode=12704"
        archived: fishbase.se/comnames/commonnameslist.php/q-ee9e816f/2026-10-14T110741Z
        accessed: 2026-10-13
      - *a79
  habitat:
    text: "The principal range includes the Paraguay and Parana systems and lower Uruguay drainage. A published
      Guapore specimen extends the known distribution beyond these basins. Occupied Ibera ponds have sandy
      beds and aquatic plants, and Parana records include vegetated floodplain waters. Pond measurements
      include 13.5 to 20.8 C, pH 5.6 to 6.8, about 0.11 to 0.28 dGH and alkalinity equivalent to 0.11 to 0.50
      dKH. Regional river studies broaden the environmental picture but seldom pair every reading with a fish
      capture. Kutty recorded 29.4 C at an adult collecting site and 33.3 C nearby in shallow water; those hot
      snapshots do not define permanent aquarium targets."
    sources:

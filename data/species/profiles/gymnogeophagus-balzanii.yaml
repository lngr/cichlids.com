    rationale: "The Catalog of Fishes establishes the Parana basin, including the Paraguay drainage, and lower
      Uruguay drainage. Reis and Malabarba report a specimen from the Guapore, explaining the broader
      Amazonian reference in CRC without making Amazonian chemistry representative of aquarium stock. Ibera
      collections and Parana floodplain sampling directly confirm the main habitat setting. The AquaInfo
      retrievals contain a map caption without species-level information. The Felizardo publication was read
      only as an abstract and does not supply water measurements for this profile."

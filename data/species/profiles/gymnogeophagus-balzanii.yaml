    rationale: "The tally accepts all four natural-hardness proposals within its agreement thresholds and rounds
      their agreeing bounds to 0 to 7 dGH, with low confidence. Zero is the rounded representation of very
      dilute freshwater, not a measurement of mineral-free water or a prescription for deionized water.
      Occupied Ibera ponds had total hardness of 2 to 5 mg/L as CaCO3, or 0.11 to 0.28 dGH using 17.848 mg/L
      per degree. Paired Pantanal Ca and Mg means give approximately 0.18 to 5.85 dGH using Ca/7.14 + Mg/4.34;
      lower Parana measured hardness gives 1.23 to 3.03 dGH. The wider Corriente regional series gives 0.39 to

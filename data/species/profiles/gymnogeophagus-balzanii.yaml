  husbandry:
    text: "For one male with three females, the selected minimum is 200 L with a footprint at least 120 by 40 cm.
      Larger mixed communities and multiple active brood sites need additional space. Provide fine sand,
      refuges separated by wood or stable stones and enough room for each female to escape the male. Use
      mature filtration and regular water changes. Plan about 21 to 25 C in the active season and a gradual
      winter period at 16 to 18 C for three to four months. The broader 14 to 28 C tolerance describes
      seasonal flexibility. A pH near 6.5 to 7.5 is better supported than either tolerance endpoint; weak
      buffering demands consistent monitoring."

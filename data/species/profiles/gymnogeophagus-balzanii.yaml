  diet:
    text: "Use sinking complete foods with small invertebrates and some plant ingredients. The wild feeding
      evidence includes insects, plant seeds and occasional fish, making omnivore the appropriate overall
      category. A small local sample with fish-dominated stomachs shows that tiny companions deserve caution
      without establishing habitual adult piscivory. Deliver food to several bottom positions so sheltered
      females receive a share. Reduce portions during the cool season in line with appetite. No specific
      high-protein bloat syndrome is established for this species, but the false flag does not imply immunity
      to digestive disease."
    sources:

  problems:
    text: "Year-round warmth, inadequate sand-feeding access and persistent harassment can undermine husbandry.
      Poor water quality is associated in care literature with head and sensory-pore lesions, but their
      appearance does not identify a single cause. The legacy forum describes losses after adding balzanii to
      a frontosa tank, followed by white spots and emergency relocation; it cannot isolate the cause of death.
      Quarantine new fish, watch appetite and breathing, and investigate water quality and social access when
      condition declines. Claims of rigid disease percentages or a precise lifespan without winter cooling are
      not supported by the read evidence."
    sources:

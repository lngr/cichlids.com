        Mg/4.34; lower Parana measured hardness gives 1.23 to 3.03 dGH. The wider Corriente regional series
        gives 0.39 to 8.85 dGH, supporting checker-c's wider proposal but lacking simultaneous fish records.
        The Ronco basin-wide 1.29 to 27.36 dGH envelope combines unpaired ion extremes and includes
        mineralized rivers without demonstrated balzanii occupancy. Neither it nor FishBase's
        husbandry-derived 5 to 19 dH defines typical natural hardness. Proposals: generator 0.4 to 6;
        checker-a 2 to 8; checker-b 0.1 to 6; checker-c 0.1 to 9."

  problems:
    text: "Resolve species identity before applying aquarium advice. The archive includes a reply treating ahli\
      \ as a renamed fryeri, illustrating why older trade-name reports cannot establish true-ahli tolerances.\
      \ A juvenile community may also become unsafe as the predator grows. Monitor appetite and access to food,\
      \ repeated chasing, breathing and fin condition alongside water tests. Digestive swelling and damaged tissue\
      \ have several possible causes and do not establish a diagnosis by themselves. Moderate suitability here\
      \ assumes prior experience managing a large Malawi aquarium and separating a harassed fish; it does not\
      \ indicate unusual physiological fragility."

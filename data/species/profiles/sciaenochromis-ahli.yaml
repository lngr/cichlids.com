      confidence: "low"
      rationale: "Generator and checker-b propose 7.5 to 8.6; checker-a proposes 7.5 to 8.8; checker-c proposes\
        \ 7.5 to 8.7. All fit the tally's agreement threshold, so its unanimous decision is 7.5 to 8.6 with low\
        \ confidence. The median of agreeing upper bounds is 8.65 before rounding to the decided endpoint; this\
        \ range aggregation is not verification method median. Fischlexikon and Einrichtungsbeispiele give 7.5\
        \ to 8.5, expanded to contain natural 8.6. The wider source ranges are 7.6 to 8.8 in the fryeri Seriously\
        \ Fish sheet and 7.6 to 8.7 in the general Malawi.si guide. Karsli and colleagues began a 90-day trade-stock\
        \ experiment at pH 8.7 but did not establish true-ahli identity or years of health there. These wider\
        \ observations remain evidence without expanding the binding decision."

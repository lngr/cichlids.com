partners:
  suitable:
  - species: "Copadichromis borleyi"
    reason: "Conditional non-mbuna candidate with sufficiently large adults and room to escape breeding territories."
    condition: "Community tank larger than 600 L; match adult sizes and monitor harassment. This specific pairing\
      \ is inferred from the general non-mbuna advice."
  - species: "Protomelas taeniolatus"
    reason: "Adult size and non-mbuna behaviour make it a conditional candidate rather than prey-sized schooling\
      \ fish."
    condition: "Community tank larger than the minimum; retain separate sheltered areas and ensure an appropriate\
      \ diet for both species. Pairing is an inference."
  - species: "Cyrtocara moorii"
    reason: "Large adults use sandy space and can be considered with a relatively restrained non-mbuna predator."
    condition: "A substantially larger aquarium with open sand; introduce no small juveniles and monitor pressure\
      \ on the moorii. Pairing is an inference."
  unsuitable:
  - species: "Paracheirodon innesi"
    reason: "Small adult size exposes it to a specialized fish predator; its usual water requirements also differ."
  - species: "Melanochromis auratus"
    reason: "A highly assertive mbuna can repeatedly harass ahli and disrupt the recommended calmer non-mbuna\
      \ arrangement."
  - species: "Tropheus moorii"
    reason: "An aufwuchs-based feeding plan conflicts with the animal-rich diet and fish-predation behaviour of\
      \ ahli."
  - species: "Sciaenochromis fryeri"
    reason: "A look-alike congener complicates identification and breeding-line purity; direct ahli-fryeri crossing\
      \ is unverified, so this is a precaution rather than a documented hybrid warning."
profile:
  overview:
    text: "True Sciaenochromis ahli is a large fish predator from Lake Malawi. Its name is frequently attached\
      \ to S. fryeri in shops and older aquarium accounts, although the Catalog of Fishes recognizes two separate\
      \ species. A blue sales photograph therefore cannot settle identity. Secure breeder identification and collection\
      \ history are especially valuable when planning a breeding group. This profile uses true-ahli accounts where\
      \ possible and marks the remaining aquarium estimates. A mature group needs substantial floor space, and\
      \ fish small enough to swallow remain potential prey even when the adults appear restrained."
    sources:
    - kind: "catalog-of-fishes"
      title: "Eschmeyer's Catalog of Fishes: Sciaenochromis species, version of 21 September 2026"
      accessed: "2026-10-13"
      url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Sciaenochromis"

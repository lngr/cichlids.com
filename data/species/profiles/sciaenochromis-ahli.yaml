  sizeAndGrowth:
    text: "Choose the adult aquarium before buying juveniles. Planning sizes are 20 cm for males and 18 cm for\
      \ females; identified-species accounts put females at 17 to 18 cm. Some larger males are reported, but exceptional\
      \ size is not the basis of the compatibility feature. A growth timetable for authenticated captive ahli\
      \ is unavailable. Its provisional lifespan estimate of 8 to 10 years is likewise derived from related aquarium\
      \ fishes rather than a verified age series. Controlled portions and a layout with room to turn and retreat\
      \ are more useful than trying to accelerate growth."
    sources:
    - kind: "database"
      title: "Fischlexikon: Sciaenochromis ahli, species and aquarium data"
      accessed: "2026-10-13"
      url: "https://www.fischlexikon.eu/fischlexikon/fische-suchen.php?fisch_id=0000001753"

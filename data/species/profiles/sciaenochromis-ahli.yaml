      title: "Malawi.si: Sciaenochromis ahli 'Masimbwe Island'"
      url: "https://www.malawi.si/MalawiByLocations/Masimbwe%20Island/slides/Sciaenochromis%20ahli%20%27Masimbwe%20Island%27.html"
      accessed: "2026-10-13"
    - kind: "database"
      title: "Einrichtungsbeispiele: Sciaenochromis ahli species care sheet"
      accessed: "2026-10-13"
      url: "https://www.einrichtungsbeispiele.de/zierfische/malawisee/sciaenochromis-ahli-slnk.html"
    - kind: "model-knowledge"
      title: "Explicit adjudicator estimates for aquarium planning where identified-species evidence is missing"
      accessed: "2026-10-13"
  sexing:
    text: "Adult males are larger and can become more blue during courtship. Their appearance may otherwise be\
      \ subdued, and described greenish or brownish ground colors make the usual electric-blue shop image misleading.\
      \ Females are smaller and less colorful; observed mouthbrooding directly establishes the sex of that individual.\
      \ Vertical flank markings are described in species accounts, but color alone is insufficient to identify\
      \ a juvenile, subordinate adult or species. Combine adult appearance with dependable stock history and specialist\
      \ identification, keeping genuine collection labels rather than assigning fryeri ornamental strain names."

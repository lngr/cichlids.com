      title: "Explicit adjudicator estimates for aquarium planning where identified-species evidence is missing"
      accessed: "2026-10-13"
  diet:
    text: "A complete carnivore-cichlid pellet is the practical staple. Mysis, krill and chopped shrimp can vary\
      \ the animal-food supply, with occasional small portions of fish flesh. This fish naturally hunts smaller\
      \ fishes, so an algae-centered diet alone does not match its feeding specialization. Watch that the females\
      \ receive food rather than assuming the male leaves enough. The selected bloatSensitive flag is false because\
      \ a protein-restriction conflict has not been established for true ahli. It does not imply immunity to digestive\
      \ disease. Reports under uncertain electric-blue trade labels are too weak to establish a different species-specific\
      \ restriction."

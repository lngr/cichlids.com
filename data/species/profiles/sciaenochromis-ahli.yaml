    \ S. ahli, not the bright electric-blue fish commonly sold under its name. The original Haplochromis combination\
    \ was also checked at https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Haplochromis&species=ahli\
    \ on 2026-10-13. Iceberg and other fryeri aquarium strains are not ahli variants. Malawi.si was readable through\
    \ the www host and a locality page. Where identification is uncertain, trade accounts are retained only as\
    \ qualified comparison evidence."

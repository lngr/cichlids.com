  habitat:
    text: "Rock cover beside usable sand is the central layout requirement. Northern Malawi locality accounts\
      \ describe this boundary as hunting habitat, with cracks and sheltered routes available among the rocks.\
      \ The catalog confirms endemism but does not provide a precise northern boundary, so locality labels should\
      \ be preserved without treating them as an exhaustive distribution map. The combined natural lake envelope\
      \ is 21 to 29 C, pH 7.7 to 8.6, GH 3 to 5 dGH and KH 5 to 8 dKH. These values describe different seasons\
      \ and samples, not a prescription to cycle an aquarium through every endpoint."

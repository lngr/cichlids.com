      accessed: "2026-10-13"
  breeding:
    text: "The female incubates the eggs and developing young in her mouth. Suitable sand and rock margins allow\
      \ a male to organize a spawning site, after which the brooding female still needs protected space. Keep\
      \ fish identity and locality information with any offspring. The reliably supported feature is maternal\
      \ mouthbrooding; numerical brood sizes, incubation deadlines and precise spawning sequences from fryeri\
      \ are not transferred here. If a fish needs separation, prepare matching water and established filtration\
      \ first rather than relying on an uncycled holding container."
    sources:
    - kind: "database"
      title: "FishBase: Sciaenochromis ahli species summary"
      accessed: "2026-10-13"
      url: "https://www.fishbase.se/summary/Sciaenochromis-ahli.html"

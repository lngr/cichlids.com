  compatibility:
    text: "The species does not require a species-only aquarium. Consider sufficiently large adult non-mbuna that\
      \ will neither become prey nor repeatedly overwhelm this fish. Copadichromis borleyi, Protomelas taeniolatus\
      \ and Cyrtocara moorii are inferred candidates in a larger community, subject to individual behavior and\
      \ matching diets; they are not a tested combined stocking recipe. Their juveniles may still be vulnerable.\
      \ Small schooling fish and dominant mbuna are poor matches. Keep look-alike fryeri separate when identification\
      \ and line purity matter. No established hybrid group is assigned to true ahli; the empty list provides\
      \ no assurance that crossing is impossible."
    sources:
    - kind: "database"
      title: "Röder and Bandhauer: Sciaenochromis ahli, Malawi-Guru species directory"

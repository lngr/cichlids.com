    - kind: "database"
      title: "Malawi.si: Sciaenochromis ahli 'Masimbwe Island'"
      url: "https://www.malawi.si/MalawiByLocations/Masimbwe%20Island/slides/Sciaenochromis%20ahli%20%27Masimbwe%20Island%27.html"
      accessed: "2026-10-13"
    - kind: "model-knowledge"
      title: "Explicit adjudicator estimates for aquarium planning where identified-species evidence is missing"
      accessed: "2026-10-13"
  husbandry:
    text: "The recommended unit is one male with three females in at least 600 litres, using a conservative 180\
      \ by 60 cm floor area. The volume is published care guidance; the footprint is an explicit planning estimate.\
      \ Rock barriers should create more than one escape route, with sand and clear swimming lanes left between\
      \ them. Mixed communities require additional space. Use mature biological filtration and regular water changes,\
      \ checking replacement water before adding it. Routine temperatures around 24 to 26 C have better husbandry\
      \ support than sustained exposure to the outer limits. The selected tolerances are 21 to 29 C, pH 7.5 to\
      \ 8.6, GH 3 to 15 dGH and KH 5 to 10 dKH. Measure GH and KH separately and favor stability over repeated\
      \ adjustments to endpoints."
    sources:
    - kind: "database"
      title: "Fischlexikon: Sciaenochromis ahli, species and aquarium data"

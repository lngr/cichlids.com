  temperatureC:
    value:
      min: 21
      max: 29
    confidence: "high"
    rationale: "The waterbody decision fixes the combined natural envelope at 21 to 29 C. Eccles reports the 21\
      \ C inshore cool-season extreme in its abstract; FAO provides the narrower historical surface sample of\
      \ 23 to 25 C, and Branchu measured 22.8 to 25.4 C in one deep seasonal profile. Vollmer describes summer\
      \ surface water near 28 C and winter cooling below 24 C. The 29 C endpoint is retained from the compiled\
      \ lake studies, including Ngochera, rather than reconstructed from these narrower samples. Ngochera was\
      \ accessible here only as a repository abstract, Eccles only as an abstract because fetch-oa refused its\
      \ full text, and the 1999 renewal chapter was not retrieved. None of those access limits justifies altering\
      \ the binding lake decision or treating seasonal extremes as year-round aquarium targets."

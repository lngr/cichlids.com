      accessed: "2026-10-13"
  socialBehavior:
    text: "The one-male arrangement avoids adding a rival male to the minimum aquarium. Several females distribute\
      \ courtship attention, but they still need sheltered feeding and resting space. Territorial defense becomes\
      \ more noticeable around spawning, while identity-aware accounts report no lasting territory outside reproduction.\
      \ The large territory category is a cautious allowance for aquarium space because its actual extent has\
      \ not been measured. At the specified stocking unit, conspecific and heterospecific aggression are both\
      \ assessed as level 2. Persistent pursuit that prevents an individual from eating or resting is a reason\
      \ to reassess the layout or separate that fish."
    sources:
    - kind: "database"

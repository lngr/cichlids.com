    value:
      min: 7.7
      max: 8.6
    confidence: "high"
    rationale: "The waterbody decision fixes natural pH at 7.7 to 8.6, supported directly by the Jackson surface\
      \ data reproduced in the FAO lake account. Branchu cites the wider contextual lake range of 7.5 to 8.5,\
      \ which is not an independently measured shallow habitat interval for this species. Its lower endpoint does\
      \ not replace the surface-based lake decision. Aquarium recommendations belong to tolerance."

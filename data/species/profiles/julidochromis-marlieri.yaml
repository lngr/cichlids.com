        - "Isanga, Zambia"
    confidence: high
    rationale: "All four full-profile runs agree on Lake Tanganyika. The generator lists Makabola, Magara,\
      \ Halembe and Isanga; checker-a lists Gitaza and Bemba; checker-b uses the same two field sites\
      \ with country labels; checker-c supplies no locality list. Retain the field sites described by\
      \ Sunobe and the independently described Magara, Halembe and Isanga populations. Makabola is a historical\
      \ type-locality label in the Nordic register, not a newly verified occurrence. Geographic labels\
      \ do not resolve debated species limits."

  diet:
    text: "The decided feeding category is omnivore. Wild records include both algae and sponges, while\
      \ small crustaceans and insect larvae are also described. A specialist magazine reports an animal-dominated\
      \ stomach sample, so the classification does not imply equal plant and animal proportions in every\
      \ population. Offer small animal foods together with suitable prepared food and a modest vegetable\
      \ component. The selected food list includes frozen small crustaceans, live small invertebrates,\
      \ quality flake and blanched vegetable matter. Special protein-induced bloat sensitivity was not\
      \ established; avoid letting uneaten food accumulate."

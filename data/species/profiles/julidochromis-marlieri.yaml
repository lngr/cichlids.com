        \ majority. Generator and tiebreaker-2 propose the regani, transcriptus and ornatus pairs; checker-a\
        \ proposes julidochromis; checker-b and checker-c propose the regani and transcriptus pairs; tiebreaker-1\
        \ proposes julidochromis plus the regani pair. Each retained id appears in at least two proposals.\
        \ Preserve all four ids with conservative verification of 2 of 6 and low confidence. The broad\
        \ julidochromis group is presumed for the six traditional julie species covered by the warning,\
        \ not automatically extended to the newly transferred former Chalinochromis species. The regani\
        \ pair is documented under the rubric because Sturmbauer and colleagues report putative wild affinis\
        \ hybrids near Rumonge and Ubwari after Brichard (1978), though parentage is not genetically confirmed.\
        \ The ornatus pair is presumed from an old captive-cross report without mate-choice evidence.\
        \ The transcriptus pair is presumed: Tawil discusses southern intermediate phenotypes with disputed\
        \ identities, while Anderson reports unsuccessful crossing attempts. Konings (2019) was readable\
        \ only as a public abstract, and Pam Chin interview access remained bot-blocked; neither supplies\
        \ verified named parents here. The 2010 phylogeny supports relationships and historical hypotheses,\
        \ not modern named offspring. No crosses are inferred transitively."

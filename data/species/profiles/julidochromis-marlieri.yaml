        accessed: '2026-10-13'
      - kind: website
        title: "Maidenhead Aquatics retailer care page: Marlier's Julie"
        url: "https://www.fishkeeper.co.uk/fish/freshwater/cichlids/marliers-julie"
        accessed: '2026-10-13'
      - kind: literature
        title: "Dennis et al. (2025). Plasticity of sex-biased aggression in response to the sex of territory\
          \ intruders in an African cichlid fish, Julidochromis marlieri"
        url: "https://doi.org/10.17912/micropub.biology.001795"
        accessed: '2026-10-13'
  socialBehavior:
    text: "Observe access to food and shelter, especially after a move or layout change. An adult repeatedly\
      \ driven into a corner or behind equipment may be unable to remain safely with its partner. Bond\
      \ failure and unsuitable introductions can cause severe injury or death. One compatible pair is\
      \ the standard aquarium unit, with a practical separation option available. Wild social groups can\
      \ include helpers or a female associated with two males; this does not make unrelated adults suitable\
      \ additions to the minimum pair tank."
    sources:
      - kind: database
        title: "Seriously Fish: Julidochromis marlieri (Marlier's Julie)"

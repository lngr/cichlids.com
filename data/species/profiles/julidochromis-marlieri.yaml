  compatibility:
    text: "Predation level 0 describes the available microfeeding evidence; it still permits occasional\
      \ incidental fry capture and does not make all small tankmates safe from aggression. In a larger\
      \ suitable Tanganyikan aquarium, open-water Cyprichromis can avoid the main rock territory, and\
      \ similarly sized Altolamprologus may work where cave areas are separate. Other Julidochromis carry\
      \ territorial and hybridization concerns. The regani group rests on a reported putative wild hybrid\
      \ population, while the broader julie group and the transcriptus and ornatus pairs remain presumed.\
      \ Southern intermediate appearance does not securely identify hybrid parents."

  ghDgh:
    value:
      min: 10
      max: 13
    confidence: high
    rationale: "The fixed lake decision is 10 to 13 dGH. Lake calcium and magnesium measurements underpin\
      \ total hardness rather than alkalinity. The FAO compilation gives Ca 9.8 and Mg 43.3 mg/L, equivalent\
      \ to about 11.35 dGH using Ca/7.14 + Mg/4.34. This measured value lies inside the decided envelope;\
      \ aquarium hardness recommendations do not determine it. The Cohen (1997) full text was refused\
      \ as not open access by fetch-oa; no unread Cohen table is presented as independently verified evidence.\
      \ Branchu and Bergonzini Table 2 independently gives about 10.56 dGH in surface water, also within\
      \ the adopted envelope."
    sources:
      - kind: literature
        title: "Langenberg, V. T. (2008). On the limnology of Lake Tanganyika. Chapters 2 and 8"
        url: "https://doi.org/10.18174/121977"
        accessed: '2026-10-13'
      - kind: literature
        title: "Vanden Bossche and Bernacsek (1990). Source book for the inland fishery resources of Africa,\
          \ Vol. 1. Lake Tanganyika measurements after Talling and Talling (1965)"
        url: "https://www.fao.org/4/t0473e/T0473E10.htm"
        accessed: '2026-10-13'
      - kind: literature
        title: "Branchu and Bergonzini (2004). Chloride concentrations in Lake Tanganyika: an indicator\
          \ of the hydrological budget?"
        url: "https://doi.org/10.5194/hess-8-256-2004"
        accessed: '2026-10-13'
    evidence:
      - source:
          kind: literature
          title: "Vanden Bossche and Bernacsek (1990). Source book for the inland fishery resources of\
            \ Africa, Vol. 1. Lake Tanganyika measurements after Talling and Talling (1965)"
          url: "https://www.fao.org/4/t0473e/T0473E10.htm"
          accessed: '2026-10-13'
        value:
          min: 11.35
          max: 11.35
        note: Converted from calcium 9.8 and magnesium 43.3 mg/L; one compiled lake measurement.
      - source:
          kind: literature
          title: "Branchu and Bergonzini (2004). Chloride concentrations in Lake Tanganyika: an indicator\
            \ of the hydrological budget?"
          url: "https://doi.org/10.5194/hess-8-256-2004"

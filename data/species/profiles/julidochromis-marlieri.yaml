          max: 27.3
        note: "Surface values in a 12-month Kigoma study; local measurements, not the full lake envelope."
    verification:
      method: waterbody
      waterbody: lake-tanganyika
    tolerance:
      value:
        min: 23
        max: 29
      confidence: low
      rationale: "The unanimous tally treats the 23 to 29 C proposals from generator, checker-b and checker-c\
        \ and the 22 to 29 C proposal from checker-a as agreeing within the 1 C rule; the median minimum\
        \ is 23 C. FishBase gives the wider lower reach of 22 to 25 C, while Seriously Fish gives 23 to\
        \ 27 C, the Nordic prose 24 to 28 C and TropicalFreshwaterFish 24 to 28 C. The 22 C endpoint is\
        \ not retained. Dennis maintained a colony at 27.7 to 28.3 C. The ceiling is widened to 29 C to\
        \ contain natural water; multi-year constant exposure at 29 C was not established, so the decided\
        \ confidence remains low."

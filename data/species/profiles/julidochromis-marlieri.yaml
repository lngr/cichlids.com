partners:
  suitable:
    - species: Cyprichromis leptosoma
      reason: Open-water use can reduce competition with the rock-centred pair. This is an example inferred
        from the care sources genus-level recommendation.
      condition: "A larger community tank meeting the schooling species requirements, with open swimming\
        \ room and a separate Julie territory."
    - species: Altolamprologus calvus
      reason: A similarly sized Tanganyikan example of the Altolamprologus genus recommended in care sources.
        Separate cave areas can reduce conflict.
      condition: A spacious community aquarium with distinct rock areas and visual barriers; small offspring
        may be eaten by tankmates.
    - species: Altolamprologus compressiceps
      reason: "Comparable size and lake-water requirements allow a conditional combination, inferred from\
        \ care guidance for its genus."
      condition: "Substantially more room than the pair minimum, with separate caves and close monitoring\
        \ of territorial disputes."
  unsuitable:
    - species: Julidochromis regani
      reason: "Shared rock habitat creates territorial competition, and a putative wild marlieri-regani\
        \ hybrid population is reported, giving a documented group under the rubric despite unconfirmed\
        \ genetic parentage."
    - species: Julidochromis transcriptus
      reason: "Rock-territory overlap and presumed crossing risk. Southern intermediate fish have disputed\
        \ identity, and failed laboratory attempts limit the strength of a named-cross claim."
    - species: Julidochromis ornatus
      reason: "Shared nesting habitat and a captive crossing report with claimed sterile offspring; partner\
        \ choice and original parentage checks are unspecified, so the group is presumed."
    - species: Lamprologus ocellatus
      reason: "Small shell dwellers can suffer territorial attacks when their shell area overlaps the\
        \ Julie nest, as reported in a cramped breeding tank."
      condition: Unsuitable in the minimum pair aquarium or an adjacent shell field; this is an aggression
        concern rather than established predation.
profile:
  overview:
    text: "An established pair can occupy a rock aquarium for years, with successive young appearing near\
      \ a hidden nest. Julidochromis marlieri is a Lake Tanganyika cichlid described by Poll in 1956.\
      \ Adults have pale and dark intersecting markings, with typical aquarium allowances of about 10\
      \ cm for males and 13 cm for females. The main challenge is the relationship between the adults:\
      \ a pair is a social bond, not simply two fish of opposite sex. Serious partner aggression makes\
      \ the species a moderate-care choice."
    sources:
      - kind: catalog-of-fishes
        title: "Eschmeyer's Catalog of Fishes: Julidochromis, updated 21 September 2026"
        url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Julidochromis"
        accessed: '2026-10-13'
      - kind: database
        title: "AquaInfo: Julidochromis marlieri, by Margie van der Heijden"
        url: "https://aquainfo.nl/en/article/julidochromis-marlieri/"
        accessed: '2026-10-13'
      - kind: database
        title: "Seriously Fish: Julidochromis marlieri (Marlier's Julie)"
        url: "https://www.seriouslyfish.com/species/julidochromis-marlieri/"
        accessed: '2026-10-13'
      - kind: database
        title: "Nordiska Ciklidsallskapet species register: Julidochromis marlieri"
        url: "https://www.ciklid.org/artregister/art.php?ID=847"
        accessed: '2026-10-13'
  habitat:
    text: "Shelter and feeding surfaces are closely connected for this species. Sunobe studied boulder\
      \ slopes at Gitaza, Burundi, at depths of 3 to 9 m; other accounts discuss Bemba and populations\
      \ along additional shores. The fish search rock surfaces and use narrow cavities for nests. Regional\
      \ identifications, particularly of small southern forms, differ between specialists. The adopted\
      \ natural lake envelope is 23 to 29 C, pH 8.4 to 9.4, GH 10 to 13 dGH and KH 15 to 20 dKH. Lake\
      \ alkalinity and general hardness describe different aspects of the water."
    sources:
      - kind: literature
        title: "Sunobe (2000). Social structure, nest guarding and interspecific relationships of Julidochromis\
          \ marlieri in Lake Tanganyika"
        url: "https://doi.org/10.14989/68192"
        accessed: '2026-10-13'
      - kind: literature
        title: "Konings, A. Julidochromis: Three way lovers. Practical Fishkeeping"
        url: "https://www.practicalfishkeeping.co.uk/features/julidochromis-three-way-lovers/"
        accessed: '2026-10-13'
      - kind: literature
        title: "Tawil, P. (2013). Julidochromis ornatus and its dwarf relatives. Cichlid News"
        url: "https://www.cichlidnews.com/issues/2013jul/Xornatus.html"
        accessed: '2026-10-13'
      - kind: literature
        title: "Langenberg, V. T. (2008). On the limnology of Lake Tanganyika. Chapters 2 and 8"
        url: "https://doi.org/10.18174/121977"
        accessed: '2026-10-13'
      - kind: literature
        title: "Vanden Bossche and Bernacsek (1990). Source book for the inland fishery resources of Africa,\
          \ Vol. 1. Lake Tanganyika measurements after Talling and Talling (1965)"
        url: "https://www.fao.org/4/t0473e/T0473E10.htm"
        accessed: '2026-10-13'
  sizeAndGrowth:
    text: "Use adult space requirements when selecting a tank, even for a juvenile purchase. AquaInfo\
      \ gives about 10 cm for males and 13 cm for females, with similar sex-specific intervals in a specialist\
      \ locality sheet. Larger unsexed or standard-length maxima in other references are not equivalent\
      \ to typical aquarium measurements for each sex. Offspring need increasing room as they mature and\
      \ parental tolerance eventually ends. A care database estimates five to eight years of life; the\
      \ longer retailer estimates lack stronger evidence."

  problems:
    text: "A fish that cannot feed or leave its refuge needs prompt attention to the social arrangement.\
      \ Pair disruption, retained rival adults and growing juveniles can all turn adequate shelter into\
      \ insufficient space. Bijker reported shell-dweller losses in a small breeding tank, illustrating\
      \ the danger of overlapping territories even when the species itself is not a fish hunter. Check\
      \ water quality and oxygenation alongside behaviour when appetite or breathing changes. Stable maintenance\
      \ and an available separation tank reduce the chance that a developing conflict becomes an emergency."
    sources:

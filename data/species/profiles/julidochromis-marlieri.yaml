        value:
          min: 10.56
          max: 10.56
        note: "Branchu and Bergonzini Table 2: Ca 0.273 and Mg 1.611 mmol/L in surface 0 to 70 m water,\
          \ converted to dGH."
    verification:
      method: waterbody
      waterbody: lake-tanganyika
    tolerance:
      value:
        min: 8
        max: 25
      confidence: medium
      rationale: "Generator, checker-b, checker-c and tiebreaker-2 propose 8 to 25 dGH; tiebreaker-1 proposes\
        \ 10 to 25, agreeing within the 2 dGH rule; checker-a proposes 8 to 20. The qualified majority\
        \ is 5 of 6, with median endpoints 8 and 25. Seriously Fish gives 10 to 25 and TropicalFreshwaterFish\
        \ 8 to 20; AquaInfo gives 7 to 11, while the wider Aqua-Fish recommendation is 18 to 30 dGH. The\
        \ isolated 7 and 30 endpoints are not adopted. NBAT records breeding at GH 8 in Katoto fish whose\
        \ current identification is disputed, and tiebreaker-1 therefore preferred 10. The tally retains\
        \ 8, supported also by the older care page, with medium confidence rather than a demonstrated\
        \ physiological threshold."

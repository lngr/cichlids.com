      - kind: database
        title: "Aqua-Fish: Marlieri cichlid care guide"
        url: "https://en.aqua-fish.net/fish/marlieri-cichlid"
        accessed: '2026-10-13'
      - kind: website
        title: "Cichlidy.cz breeder and retailer: Julidochromis marlieri"
        url: "https://www.cichlidy.cz/inpage/julidochromis-marlieri-918/"
        accessed: '2026-10-13'
  husbandry:
    text: "For one established pair, provide approximately 110 litres with at least a 120 cm length and\
      \ 30 cm front-to-back footprint. This pair minimum does not cover additional adult pairs or community\
      \ fish. Seat rockwork securely and create several protected retreats with broken sight lines. Maintain\
      \ filtration, oxygenation and routine waste removal. Aquarium recommendations are strongest near\
      \ 24 to 26 C; the full decided tolerance includes 29 C to contain natural conditions, although constant\
      \ multi-year exposure at that endpoint is unproven. Stable chemistry and water changes matched to\
      \ the aquarium help avoid abrupt disruption."
    sources:
      - kind: database
        title: "Seriously Fish: Julidochromis marlieri (Marlier's Julie)"
        url: "https://www.seriouslyfish.com/species/julidochromis-marlieri/"
        accessed: '2026-10-13'
      - kind: database
        title: "Nordiska Ciklidsallskapet species register: Julidochromis marlieri"

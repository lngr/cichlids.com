  breeding:
    text: "Before repeated spawning fills the tank, arrange a destination for growing offspring. Eggs\
      \ are deposited inside a protected cavity and the young remain near the nest. Both adults contribute\
      \ to protection, with the smaller partner often spending more time close to the brood. Older offspring\
      \ or helpers may participate, and several ages can coexist temporarily. Supply food small enough\
      \ for the fry, such as newly hatched Artemia or finely divided prepared foods, and monitor when\
      \ older young lose access to shelter."

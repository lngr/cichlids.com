  temperatureC:
    value:
      min: 23
      max: 29
    confidence: high
    rationale: "The fixed lake decision is 23 to 29 C, with high confidence and waterbody verification.\
      \ Verburg et al. (1997) underpin the wider seasonal envelope in the lake compilation. Langenberg\
      \ reports southern surface seasonal means of 24.4 to 27.2 C, a narrower local series that cannot\
      \ replace the lake envelope. These are habitat variations, not proven constant aquarium limits.\
      \ The original TD46, TD56 and TD59 reports were not independently retrieved with the DOI-only full-text\
      \ tool; the available Langenberg synthesis is cited directly. Chale reports 25.7 to 27.3 C at the\
      \ surface near Kigoma, another narrower annual series."
    sources:
      - kind: literature
        title: "Langenberg, V. T. (2008). On the limnology of Lake Tanganyika. Chapters 2 and 8"
        url: "https://doi.org/10.18174/121977"
        accessed: '2026-10-13'

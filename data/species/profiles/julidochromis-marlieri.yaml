  sexing:
    text: "Size is useful within an established mature pair but is an unreliable sole guide for unfamiliar\
      \ stock. Females are often larger and fuller-bodied, although variation and differently sized locality\
      \ forms can confuse this comparison. Both sexes have similar markings. The genital papilla can provide\
      \ an additional distinction when visible, with a more pointed male structure. A confirmed compatible\
      \ pair or young fish allowed to select partners is more useful than assuming that two purchased\
      \ adults will bond."

    confidence: high
    rationale: "The fixed lake decision is pH 8.4 to 9.4. Langenberg chapter 2 reports 8.47 to 9.40 at\
      \ 40 m in the northern annual series, consistent with the rounded adopted envelope. The older FAO\
      \ source book gives 7.3 to 7.8, which conflicts with the modern series and strong alkalinity; it\
      \ is not adopted as the natural range."

  ghDgh:
    value:
      min: 1
      max: 8
    confidence: "low"
    rationale: "Retain the unanimous-within-threshold tally of 1 to 8 dGH with low confidence. The result is a rounded\
      \ synthesis of four nearby proposals rather than directly observed species-wide limits. Total hardness in\
      \ mg/L as CaCO3 is divided by 17.848. Sources give Jong 0.22 to 0.34, Niger at Kainji approximately 0.76 to\
      \ 1.36 from measured calcium and magnesium, Sokoto 1.54 to 5.77, Oda 2.84 to 6.28 and Tano 1.51 to 2.59 dGH.\
      \ Birim extends to 2.90 to 9.45 dGH and has internal data inconsistencies. Thus the decided range omits both\
      \ very dilute regional values below 1 and the Birim upper end above 8; it does not invalidate either observation\
      \ or establish absence of the fish there. These regional studies generally lack identified fish at the sampling\
      \ stations. A FishBase value repeated in the risk report is not a native hardness measurement. The retained\
      \ description of Turkana as very hard is qualitative and must not be inferred from high salinity or alkalinity.\
      \ Conductivity is never converted into GH. Proposals were generator: 0.2 to 6; checker-a: 2 to 8; checker-b:\
      \ 1 to 7; checker-c: 1 to 10."
    sources:
    - kind: "literature"

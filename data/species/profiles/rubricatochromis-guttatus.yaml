  sexing:
    text: "Mature males generally grow longer, while a female approaching spawning tends to become fuller through\
      \ the abdomen. Females may also become intensely red, so the brightest individual is not automatically a male.\
      \ Gill-cover markings, reflective spots and fin shape vary and do not reliably settle the sex or species of\
      \ a juvenile. Observe mature fish from the same stock and their interaction over time. Sex identification\
      \ and pair compatibility are separate questions. Reliable locality and stock records are especially useful\
      \ when distinguishing guttatus from other red jewels or aquarium mixtures."

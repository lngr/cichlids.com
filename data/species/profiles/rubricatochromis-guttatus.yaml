      \ or establish absence of the fish there. These regional studies generally lack identified fish at the sampling\
      \ stations. A FishBase value repeated in the risk report is not a native hardness measurement. The retained\
      \ description of Turkana as very hard is qualitative and must not be inferred from high salinity or alkalinity.\
      \ Conductivity is never converted into GH. Proposals were generator: 0.2 to 6; checker-a: 2 to 8; checker-b:\
      \ 1 to 7; checker-c: 1 to 10."

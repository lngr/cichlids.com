  habitat:
    text: "Across its revised North and West African range, guttatus occupies river edges, side channels, wetlands\
      \ and some lakes and coastal lagoons. Many western collecting waters are shallow, quiet and soft, with vegetation\
      \ or other shelter; plants are sparse at some sites. The natural fields summarize representative freshwater\
      \ conditions with low confidence, not every measured locality. Turkana is exceptional: the FAO compilation\
      \ gives surface water at 27.0 to 28.9 C, pH 9.3 to 9.7 and conductivity around 2860 to 3300 microsiemens per\
      \ centimetre. Its measured calcium and magnesium correspond to only about 1.5 dGH, despite the high salinity\
      \ and alkalinity. Stuchlik separately reports 24.5 to 30 C and pH 9.2 to 9.4 there. Such chemistry is locality\
      \ context rather than a general aquarium requirement. Northern Mareotis has reported seasonal temperatures\
      \ of 15 to 29 C and pH 7.2 to 8.6, and one western Bia pond reached 33.4 C. These observations do not set\
      \ ordinary maintenance targets."

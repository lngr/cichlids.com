  predation:
    value: 2
    confidence: "medium"
    rationale: "Keep level 2 from the qualified majority, four of six votes, with medium confidence. The association\
      \ reports small fish among preferred animal prey; Homrich describes acceptance of live fish and Stuchlik records\
      \ fry consumption. CRC supports predatory feeding without specifying prey sizes. This warrants the stocking-planner\
      \ assumption that mouth-sized tankmates are prey, but the approximate one-third size threshold comes from\
      \ the rubric, not a feeding experiment. Checker-b and tiebreaker-2 propose level 1 because the evidence emphasizes\
      \ fry and the Churince stomach study assigns teleosts only 2.12 percent of relative importance. That dissent\
      \ is retained. Territorial killing is not feeding evidence, and neither introduced-population diet nor old\
      \ broad bimaculatus identifications establish universal feeding frequency. The sources do not support a specialized\
      \ fish-dominated diet or level 3. Proposals were generator: 2; checker-a: 2; checker-b: 1; checker-c: 2; tiebreaker-1:\
      \ 2; tiebreaker-2: 1."

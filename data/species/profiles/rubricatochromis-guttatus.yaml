    tolerance:
      value:
        min: 1
        max: 25
      confidence: "low"
      rationale: "Keep the qualified-majority tolerance of 1 to 25 dGH with low confidence. Schaefer gives 3 to\
        \ 25 and Horvath 8 to 25 for Turkana stock. Other advice is narrower: Fishkeeping 5 to 15, AquaInfo 5 to\
        \ 8, FishFish and My-fish 5 to 20, and Maidenhead only an upper limit of 18. Homrich gives a wider lower\
        \ end of 0 to 10 for spawning and recommends routine hardness no higher than 12; neither establishes literal\
        \ zero as a healthy long-term endpoint. The 1 dGH minimum accommodates the decided natural range without\
        \ adopting the 0.2 proposals. Ellembelle regional river measurements span 1.3 to 28.0 dGH with saline sites\
        \ and no fish census, so their high end does not enlarge aquarium tolerance. Very soft native water and\
        \ cross-population adaptability are supporting context, not lifetime trials at every endpoint. The decision\
        \ contains natural 1 to 8 dGH. Proposals were generator: 0.2 to 25; checker-a: 2 to 20; checker-b: 1 to\
        \ 25; checker-c: 1 to 25; tiebreaker-1: 0.2 to 25; tiebreaker-2: 1 to 25."

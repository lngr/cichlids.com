  khDkh:
    value:
      min: 1
      max: 7
    confidence: "low"
    rationale: "Retain the tally value of 1 to 7 dKH and its low confidence; this natural feature carries no verification\
      \ object. It is a rounded regional buffering envelope, not a set of limits measured beside identified fish.\
      \ Kainji bicarbonate corresponds to 1.13 to 1.78 dKH and Sokoto alkalinity to 2.38 to 7.14. Jong surface bicarbonate\
      \ corresponds to the wider low end of 0.23 to 0.31 dKH, outside the decision; its inconsistent total-alkalinity\
      \ extraction is not adopted. Regional seasonal medians give 2.02 to 3.70, Tano 1.75 to 2.95 and Birim a wider\
      \ 1.12 to 9.02 dKH. The decision does not encompass the Birim upper end. Some alkalinity tables do not explicitly\
      \ state the CaCO3 basis, and fish occurrence is not established at each station. Divide CaCO3 alkalinity by\
      \ 17.848 or bicarbonate by about 21.78, never GH or conductivity. The retained dealer value of 6 to 20 is\
      \ aquarium advice for Turkana stock, not natural field evidence. Proposals were generator: 0.2 to 7.2; checker-a:\
      \ 1 to 6; checker-b: 1 to 7; checker-c: 1 to 9."

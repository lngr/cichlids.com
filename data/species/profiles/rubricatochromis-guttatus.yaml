  minTank:
    value:
      volumeL: 130.0
      lengthCm: 120.0
      depthCm: 30.0
    confidence: "medium"
    rationale: "Generator proposes 140 L, 120 by 30 cm; checker-a 120 L, 120 by 35 cm; checker-b 100 L, 90 by 30\
      \ cm; checker-c 140 L, 120 by 30 cm. Componentwise medians are 130 L, 120 by 30 cm, retained for one established\
      \ adult pair with effective sight breaks. The 130 L volume is a synthesis between source recommendations,\
      \ not a quoted threshold. Fishkeeping lists 140 L and 48 by 12 inches, approximately 121.9 by 30.5 cm, in\
      \ a juvenile-pair-selection context; Maidenhead independently favors at least four feet. The association gives\
      \ 120 L and 80 cm, Stuchlik at least 100 L, and Horvath a 90 by 30 by 30 cm aquarium for the smaller Turkana\
      \ population. Homrich recommends about 102 by 30 cm and My-fish gives 200 L with 120 cm length. Aquaworld\
      \ gives 60 L and Aqualog mentions 60 cm breeding tanks; these are not selected as the permanent adult baseline.\
      \ The median stays within the cited numerical recommendations and preserves the independently supported long\
      \ footprint. Additional fish need more room."

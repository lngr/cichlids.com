  legacyNames:
  - "Hemichromis guttatus"
  note: "The Catalog of Fishes accepts Rubricatochromis guttatus (Günther, 1862), incorporating the 2022 genus transfer\
    \ and the September 2026 revision. Former exsul, letourneuxi, paynei and saharae, together with the older name\
    \ rolandi, belong here. Rubricatochromis stellifer remains a separate valid species, with lifalili in its synonymy.\
    \ Historical aquarium use of bimaculatus for guttatus is a misidentification, not current synonymy. A lifalili\
    \ trade label cannot identify a fish as either species. Only legacy entry 563 is mapped in this profile."

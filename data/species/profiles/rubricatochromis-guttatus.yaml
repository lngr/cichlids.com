  breeding:
    text: "Guttatus lays eggs on a cleaned hard surface and both parents protect the brood. Cover may surround the\
      \ chosen site, but the breeding category is open-substrate spawning. Several hundred eggs are possible. Many\
      \ aquarium accounts place hatching near two days and free swimming several days later, while one association\
      \ account gives a longer interval; temperature and conflicting reports make a fixed schedule unreliable. Offer\
      \ newly free-swimming fry suitably small food, including newly hatched Artemia. Plan growing space before\
      \ encouraging a brood, and remove threatened companions or an incompatible partner promptly."

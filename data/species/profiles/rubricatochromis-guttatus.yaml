  temperatureC:
    value:
      min: 24
      max: 30
    confidence: "low"
    rationale: "Retain the qualified-majority tally of 24 to 30 C with low confidence. Stuchlik reports ordinary\
      \ Ghana and Togo collecting waters at 26.4 to 27.6 C and Turkana water at 24.5 to 30 C. These observations\
      \ support a representative tropical envelope, not annual limits at every occupied site. Wider evidence remains\
      \ visible: FAO gives upper Niger 19 to 30 C and Sokoto 18 to 30 C; the Gambia thesis pools 20.5 to 39 C across\
      \ many habitats; Stuchlik includes a 33.4 C Bia pond and northern Mareotis at 15 to 29 C. These seasonal,\
      \ pooled or localized observations do not set typical conditions for the West African catalog fish. Guinea\
      \ cf. guttatus observations and regional Tano, Birim and Pra surveys add context with uncertain fish attribution.\
      \ Care-sheet temperatures are used only in tolerance. Proposals were generator: 18 to 30; checker-a: 24 to\
      \ 30; checker-b: 24 to 30; checker-c: 24 to 28; tiebreaker-1: 23 to 30; tiebreaker-2: 24 to 30."

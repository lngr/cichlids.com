  problems:
    text: "Social conflict is the central management problem: injury may follow prolonged exclusion from food or\
      \ shelter before dramatic fighting is noticed. Check both fish daily and separate a partner that cannot escape.\
      \ Maintain filtration, avoid accumulating uneaten food and observe new arrivals separately before introduction.\
      \ Persistent appetite loss, abnormal breathing or damaged skin and fins require assessment of behaviour and\
      \ water quality as well as disease. Avoid sudden chemistry changes made to reach a published endpoint. Misidentified\
      \ trade fish and unknown mixed ancestry can also make breeding outcomes and compatibility harder to predict."

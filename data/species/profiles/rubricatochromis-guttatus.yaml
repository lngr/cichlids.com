  hybridGroups:
    value:
    - "rubricatochromis"
    confidence: "medium"
    rationale: "All four complete profiles propose rubricatochromis and the tally verifies that set unanimously,\
      \ with medium confidence. Horvath independently warns of aquarium crossing among red jewels; FishProfiles\
      \ gives a comparable general warning and Glaser and Woodland discuss uncertain ancestry in captive stock.\
      \ The existing group already contains guttatus and remains presumed. These sources do not establish free-choice\
      \ crosses for every named pair. Former exsul and paynei are now synonyms within guttatus, whereas stellifer\
      \ and its lifalili synonym remain a separate species in the group. No new pairwise group is demonstrated.\
      \ Proposals were generator: [\"rubricatochromis\"]; checker-a: [\"rubricatochromis\"]; checker-b: [\"rubricatochromis\"\
      ]; checker-c: [\"rubricatochromis\"]."

    tolerance:
      value:
        min: 22
        max: 30
      confidence: "medium"
      rationale: "Keep the qualified-majority 22 to 30 C tolerance with medium confidence. Fishkeeping and Schaefer\
        \ give 22 to 28 C; the association gives 23 to 28, Maidenhead 24 to 28 and AquaInfo and My-fish 23 to 27.\
        \ Horvath gives 23 to 28 in the narrative and 23 to 30 in the Turkana fact file, now within guttatus. The\
        \ decision contains the natural 24 to 30 range. The generator lower limit of 18 was imposed by its regional\
        \ natural envelope and is not supported as years of healthy aquarium maintenance. The related-species FishProfiles\
        \ recommendation of 21 to 25 lies partly outside this decision and is retained with its identification caveat.\
        \ Do not treat the 33.4 C pond or northern winter conditions as maintenance targets. Proposals were generator:\
        \ 18 to 30; checker-a: 22 to 30; checker-b: 22 to 30; checker-c: 22 to 28; tiebreaker-1: 22 to 30; tiebreaker-2:\
        \ 22 to 30."

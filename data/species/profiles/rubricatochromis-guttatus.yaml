  sizeAndGrowth:
    text: "For planning, the resolved typical aquarium lengths are approximately 12.5 cm for a male and 10.5 cm\
      \ for a female. These medians sit among differing care-source estimates and should not imply half-centimetre\
      \ biological precision. Some stocks, including Turkana fish, stay smaller. FishBase reports a 12 cm standard\
      \ length, which excludes the tail and is not the same measure. Allow growing fish adequate room before territorial\
      \ behaviour intensifies. Five to eight years is a tentative lifespan estimate with no verified individual\
      \ longevity series behind it."

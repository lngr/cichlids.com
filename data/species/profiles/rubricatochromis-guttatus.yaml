    tolerance:
      value:
        min: 5.3
        max: 9
      confidence: "low"
      rationale: "Keep the median pH tolerance of 5.3 to 9.0 with low confidence. There is no qualified majority.\
        \ Sorted lower bounds are 5, 5, 5, 5.6, 6 and 6, giving 5.3; sorted upper bounds are 8.1, 8.5, 9, 9, 9 and\
        \ 9, giving 9.0. This contains the natural 6.0 to 8.1 range. The wider low-side recommendation is the association\
        \ range of 5 to 8; Schaefer gives about 6 to 8.5, Fishkeeping 6 to 7.6 and Maidenhead 6.5 to 7.5. Horvath\
        \ permits 7.5 to 9 for Turkana fish but favors 7.5 to 8 routinely. The median lower limit is a voting synthesis\
        \ between proposals, not an experimentally demonstrated threshold, and the high end is less securely applicable\
        \ to all western stocks. The broad range is not a recommendation to change pH abruptly. Exceptional native\
        \ Turkana pH above 9 remains habitat context. Proposals were generator: 5 to 8.1; checker-a: 6 to 8.5; checker-b:\
        \ 6 to 9; checker-c: 5 to 9; tiebreaker-1: 5.6 to 9; tiebreaker-2: 5 to 9."

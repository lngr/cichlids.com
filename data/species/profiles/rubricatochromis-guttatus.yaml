  ph:
    value:
      min: 6
      max: 8.1
    confidence: "low"
    rationale: "Retain the median tally of pH 6.0 to 8.1 with low confidence. No four of the six proposals agree\
      \ within the voting threshold, so the decision takes the medians of all lower and upper bounds. It represents\
      \ ordinary freshwater conditions and remains a synthesis, not a measured physiological boundary. Confirmed\
      \ western collections measured 6.46 to 7.2. The wider Guinea cf. guttatus collecting envelope is 5.56 to 8.05;\
      \ Jong regional water is 5.87 to 6.23 and Tano is 6.85 to 8.93. The decision excludes parts of these source\
      \ ranges rather than claiming they were absent. Broader pooled or impacted surveys give Gambia 3.1 to 9.5,\
      \ Oueme 6.4 to 9.8, Ellembelle 5.83 to 8.68 and Tarkwa 4.16 to 9.95 without paired guttatus sampling. Their\
      \ extremes are not ordinary habitat endpoints. Exceptional Turkana chemistry is reported separately: FAO 9.3\
      \ to 9.7, Horvath 9.1 to 9.4 and Stuchlik 9.2 to 9.4. Mareotis 7.2 to 8.6 is northern brackish-population\
      \ context. None is replaced with Congo stellifer chemistry. Proposals were generator: 5.8 to 8.1; checker-a:\
      \ 6 to 8; checker-b: 6 to 7.5; checker-c: 6.3 to 8.9; tiebreaker-1: 5.6 to 8.1; tiebreaker-2: 6.4 to 7.2."

  compatibility:
    text: "An aquarium dedicated to one pair is straightforward, although the speciesOnly flag is false because\
      \ carefully selected companions can work. Adult larger African tetras or robust catfish are conditional candidates\
      \ in an aquarium substantially larger than the pair minimum. Each companion still needs its own space and\
      \ social group, and spawning may require removal even after peaceful coexistence. Small fish face both predation\
      \ and territorial attacks. Other red jewels, including stellifer, add rivalry and the presumed crossing risk\
      \ represented by the rubricatochromis group. Mbuna are poor partners because competing territories and strong\
      \ aggression can leave either fish injured."

    rationale: "Retain the unanimous-within-threshold tally of 1 to 8 dGH with low confidence. The result is a rounded\
      \ synthesis of four nearby proposals rather than directly observed species-wide limits. Total hardness in\
      \ mg/L as CaCO3 is divided by 17.848. Sources give Jong 0.22 to 0.34, Niger at Kainji approximately 0.76 to\
      \ 1.36 from measured calcium and magnesium, Sokoto 1.54 to 5.77, Oda 2.84 to 6.28 and Tano 1.51 to 2.59 dGH.\

  socialBehavior:
    text: "Shared brood defence does not make two arbitrarily chosen adults a safe pair. An unwilling partner or\
      \ extra adult can suffer sustained pursuit and potentially fatal injury. Youngsters may choose partners more\
      \ successfully, provided surplus fish can be moved once a pair forms. Watch feeding access and retreat routes\
      \ as well as visible wounds. A fish confined to one corner, persistently hiding or losing condition needs\
      \ separation. Even an established pair requires observation when one partner becomes ready to spawn before\
      \ the other. Stock and individual differences explain why reports range from relatively calm pairs to destructive\
      \ fish."

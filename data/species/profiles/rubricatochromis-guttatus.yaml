  diet:
    text: "Use varied prepared foods for omnivorous cichlids, together with suitable small invertebrate foods and\
      \ some plant ingredients. Animal prey dominates several ecological accounts, while a stomach study also records\
      \ plant material. The decided predation level is 2, so a mouth-sized tankmate may be eaten even though fish\
      \ need not dominate the diet. Both partners should be able to obtain food without one controlling the feeding\
      \ area. No special protein-related bloat sensitivity is established for this profile; ordinary digestive and\
      \ water-quality problems remain possible when food is excessive or unsuitable."

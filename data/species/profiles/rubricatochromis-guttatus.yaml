  husbandry:
    text: "Provide one established pair with at least about 130 litres and a 120 by 30 cm footprint. Break sightlines\
      \ with secure wood and rockwork, leaving shelter that each partner can reach. Sand or a fine substrate permits\
      \ digging, and stable hard surfaces provide spawning sites. Robust plants can add cover but need protection\
      \ from excavation. Efficient filtration and regular partial changes matter more than aiming at a tolerance\
      \ endpoint. Around 24 to 27 C and stable, moderately buffered water suit ordinary western stock. The broad\
      \ tolerance ranges allow population differences and uncertain endpoints; they are not preferred targets. Have\
      \ a divider or spare aquarium available."

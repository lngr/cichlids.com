      \ and reflective markings, and Glaser documents yellow aquarium stock. Brown resting fish and strongly red\
      \ breeding fish may look quite different. Spots and iridescence vary within populations; the plain orange\
      \ Turkana form remains evidence of variation rather than a reason to confuse guttatus with stellifer."

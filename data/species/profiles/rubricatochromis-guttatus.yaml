    tolerance:
      value:
        min: 1
        max: 10
      confidence: "low"
      rationale: "Keep the qualified-majority tolerance of 1 to 10 dKH with low confidence. The explicit genus-level\
        \ Il Mio Acquario recommendation is 2 to 8; JBL gives 4 to 6 for a broad West and Central African husbandry\
        \ group. The chosen endpoints are provisional extensions, not measured species-specific limits. Wider recommendations\
        \ remain visible: Aquaworld labels 8 to 20 dKH and the Turkana dealer gives 6 to 20; label ambiguity, population\
        \ differences and lack of long-term tests limit their use. Regional Oueme alkalinity spans 2.8 to 18.5 dKH\
        \ overall, with station means 4.6 to 8.4, and Ellembelle bicarbonate corresponds to 1.9 to 5.3. These are\
        \ regional observations, not aquarium endpoint trials; impacted and saline sites cannot establish a general\
        \ 20 dKH limit. The decision contains natural 1 to 7 dKH. GH is never substituted for KH. Proposals were\
        \ generator: 0.2 to 20; checker-a: 1 to 15; checker-b: 1 to 12; checker-c: 1 to 10; tiebreaker-1: 0.2 to\
        \ 10; tiebreaker-2: 1 to 10."

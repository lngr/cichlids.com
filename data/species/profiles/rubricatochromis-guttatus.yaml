      \ medium confidence. FishBase explicitly describes aquarium omnivory; the Churince stomach study independently\
      \ records insects, crustaceans and plants and classifies the fish as omnivorous. Its relative-importance values\
      \ are 43.31 percent insects, 35.04 crustaceans, 9.98 plants and 2.12 fish, not percentages of diet mass. Checker-b\
      \ proposes invertivore because CRC and native collecting accounts emphasize invertebrates; the other five\
      \ runs propose omnivore, with differing food examples. Retain that emphasis while accepting documented plant\
      \ and animal intake. AquaInfo suggests piscivory, another dissenting source interpretation that is not adopted.\
      \ Prepared-food acceptance alone would not prove a natural mixed diet. No source establishes the specialized\
      \ protein-associated bloat sensitivity of the rubric; false is an absence-of-warning inference, not an experimental\
      \ claim of immunity. The old Nigerian bimaculatus literature is taxonomically uncertain. The 1987 paper URL\
      \ could not be fetched, so its retained citation is offline and supports only the previously reported abstract-level\
      \ observation. Proposals were generator: {\"bloatSensitive\": false, \"foods\": [\"quality cichlid pellets\"\
      , \"insect larvae\", \"small crustaceans\", \"plant-containing prepared food\"], \"type\": \"omnivore\"};\

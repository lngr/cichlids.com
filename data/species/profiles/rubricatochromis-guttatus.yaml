partners:
  suitable:
  - species: "Phenacogrammus interruptus"
    reason: "Adult Congo tetras are active and large enough to be more plausible companions than small tetras; Maidenhead\
      \ and Fishkeeping.co.uk recommend larger African tetras."
    condition: "A substantially larger aquarium than the pair minimum, a full shoal, separate swimming room, and\
      \ immediate removal if the jewels breed or attack. This is a conditional candidate, not a guarantee."
  - species: "Arnoldichthys spilopterus"
    reason: "Maidenhead lists Arnoldichthys among larger African tetras that may coexist with jewels; active adults\
      \ use a different part of the tank."
    condition: "A long community aquarium with a shoal, visual barriers, and a separate tank available for breeding\
      \ aggression."
  - species: "Synodontis eupterus"
    reason: "An adult robust Synodontis is consistent with the catfish group suggested by Maidenhead and Fishkeeping.co.uk;\
      \ exact species pairing is inferred."
    condition: "A tank sized for the catfish as well as the pair, separate shelters, and close monitoring. Remove\
      \ it if attacked; eggs and fry are at risk."
  unsuitable:
  - species: "Paracheirodon innesi"
    reason: "Small adults are vulnerable to predation and cannot withstand repeated territorial attacks."
  - species: "Rubricatochromis stellifer"
    reason: "A separate jewel species with similar appearance and overlapping territories; both belong to the presumed\
      \ rubricatochromis hybrid group."
  - species: "Maylandia zebra"
    reason: "Persistent mbuna aggression and competing rock territories make this a poor mixture; the legacy archive\
      \ specifically reports jewels being injured by larger mbuna."
profile:
  overview:
    text: "Rubricatochromis guttatus is the valid name for the West African jewel cichlid in legacy entry 563. A\
      \ compatible pair offers vivid breeding colors and conspicuous parental care, but pair formation can be dangerous.\
      \ The 2026 revision includes several formerly separate northern and Turkana populations within guttatus. It\
      \ keeps Rubricatochromis stellifer separate and places the scientific name lifalili with stellifer. Aquarium\
      \ fish sold under either an old genus or a loose jewel trade name need careful identification; a shop label\
      \ does not establish species or ancestry."

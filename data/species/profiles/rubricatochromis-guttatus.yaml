    confidence: "high"
    rationale: "The Catalog and the 2026 integrative revision establish a widespread North and West African species\
      \ extending to Lake Turkana. The four origin proposals describe this same revised taxon but emphasize different\
      \ localities. The final region and locality list retain the generator summary and the confirmed western collecting\
      \ context. FishBase still gives the narrower Sierra Leone to Cameroon coastal distribution and excludes the\
      \ lower Volta, whereas the revision includes Volta specimens. Those older limits do not supersede the revision.\
      \ Congo-basin stellifer and its lifalili synonym are excluded. No Malawi, Tanganyika or Victoria water-body\
      \ decision applies."

  husbandry:
    text: >-
      Provide at least 300 litres with a 150 cm length and about 45 cm front-to-back space for
      one male and three females. The volume and length follow Malawi.si; the depth is a
      comparative planning estimate rather than a tested minimum. Arrange secure rock shelters
      beside sand and keep an open swimming lane. Establish biological filtration before
      stocking and maintain surface movement. A stable 24 to 26 C is a supported routine target.
      The wider recorded tolerance envelope is 21 to 29 C, pH 7.5 to 8.6, GH 3 to 15 dGH and KH
      5 to 15 dKH, with limited evidence for chronic maintenance at the endpoints.

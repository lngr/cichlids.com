  problems:
    text: "Loss of condition, repeated hiding and missed meals can reveal social pressure before obvious fin damage.\
      \ Check water quality and feeding access when behaviour changes. Established filtration, regular conditioned-water\
      \ changes and quarantine of new arrivals reduce common husbandry problems. Swelling or altered appetite does\
      \ not identify a single cause; seek qualified aquatic veterinary help for persistent illness rather than treating\
      \ a general disease label as a diagnosis."

  socialBehavior:
    text: "Repeated short pursuits and a male defending his breeding site can occur in a suitable harem. Watch that\
      \ each female keeps condition and receives food. Three females distribute male attention but do not guarantee\
      \ harmony. Persistent hiding or pursuit calls for changes to space, shelter or stocking. Additional adult\
      \ males need substantially more room and a larger female group than the minimum unit described here."
    sources:
    - kind: "database"
      title: "malawi.si: Copadichromis mbenjii 'Mbenji Island'"
      url: "https://malawi.si/MalawiByLocations/Mbenji%20Island/slides/Copadichromis%20mbenjii%20%27Mbenji%20Island%27.html"

  temperatureC:
    value:
      min: 21
      max: 29
    confidence: "high"
    rationale: "The waterbody tally fixes the lake-wide natural envelope at 21 to 29 C. Eccles supports 21 C in\
      \ exceptional cool inshore conditions and 27 C in May; Vollmer describes summer surface water around 28 C\
      \ and winter below 24 C. Branchu campaign means of 24.48 to 26.15 C and historical FAO values of 23 to 25\
      \ C sample only parts of that envelope. The 29 C endpoint is retained exactly as decided. Ngochera was readable\
      \ only as an abstract with no numeric endpoints; its numeric full text and the DOI-less 1999 mixing report\
      \ could not be read through the permitted OA tool, so neither supplies numeric evidence here. These are lake-wide\
      \ conditions rather than a Mbenji-specific seasonal series."

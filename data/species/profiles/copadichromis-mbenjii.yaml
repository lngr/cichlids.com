  note: "The Catalog confirms Copadichromis mbenjii as valid in its original genus, with no formal synonyms adopted\
    \ here. Haplochromis quads is a common or trade label. The earlier names in Zoopet, including quadrimaculatus\
    \ and the single-i spelling mbenji, do not override the Catalog or identify formal synonyms. Maylandia mbenjii,\
    \ Labidochromis mbenjii and the undescribed Copadichromis sp. Mbenji Blue are separate fishes. The Haplochromis\
    \ Catalog query contained no mbenjii entry. The cichlids.com archive supplied no dependable husbandry measurement;\
    \ thread 41310 is only an uncertain identification."

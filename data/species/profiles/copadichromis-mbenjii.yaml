      accessed: "2026-10-13"
  diet:
    text: "Base feeding on small prepared foods suited to an invertebrate feeder, with Artemia or other small crustacean\
      \ foods for variety. The natural prey records are plankton and bottom invertebrates. Check that all fish receive\
      \ a share and remove excess food. Predation level 0 is an uncertain ecological interpretation that allows\
      \ incidental fry capture; it does not guarantee fry survival. No special high-protein incompatibility was\
      \ established, but overfeeding and deteriorating water can still cause problems."
    sources:

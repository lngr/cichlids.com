partners:
  suitable:
  - species: "Aulonocara stuartgranti"
    reason: "A calm peacock is consistent with the species-specific Aulonocara recommendation; it uses similar aquarium\
      \ chemistry."
    condition: "A larger mixed tank with distinct territories; choose a form whose male looks clearly different.\
      \ This named pairing is inferred from genus-level guidance."
  - species: "Placidochromis electra"
    reason: "A relatively calm invertebrate-feeding haplochromine is a plausible companion for the quieter Malawi\
      \ community."
    condition: "Increase tank space beyond the species minimum and verify that both groups feed. This is a husbandry\
      \ inference, not a documented mbenjii pairing."
  - species: "Cyrtocara moorii"
    reason: "Seriously Fish recommends this peaceful hap as a Copadichromis companion."
    condition: "Provide extra space for the complete adult social units and separate territories; the 500 L species\
      \ minimum alone is not a validated minimum for this combination."
  unsuitable:
  - species: "Copadichromis borleyi"
    reason: "Shares the presumed copadichromis hybrid group; similar females make breeding-line identity harder\
      \ to preserve."
  - species: "Copadichromis azureus"
    reason: "Shares the presumed copadichromis hybrid group and blue breeding males can complicate territorial interactions."
  - species: "Melanochromis auratus"
    reason: "An aggressive mbuna can overwhelm the calmer utaka and create sustained harassment."
  - species: "Nimbochromis livingstonii"
    reason: "A large fish predator creates a size and predation risk, especially for juveniles and smaller females."
profile:
  overview:
    text: "This Mbenji Island utaka combines a blue head and flanks with yellow breeding accents. It is the described\
      \ Copadichromis mbenjii, also traded as Quads, rather than another cichlid carrying the island name. Plan\
      \ for adult fish and reliable species identity before buying juveniles. One male with three females is the\
      \ recommended starting unit, with calm companions possible in a larger community."
    sources:
    - kind: "catalog-of-fishes"

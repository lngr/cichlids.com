  habitat:
    text: "The fish lives where rock meets sand around Mbenji Island. Females gather above the bottom while breeding\
      \ males stay near their sand bowers. Lake-wide natural conditions are 21 to 29 C, pH 7.7 to 8.6, GH 3 to 5\
      \ dGH and KH 5 to 8 dKH. These values include seasonal and geographic variation; they are not a daily cycle\
      \ to reproduce indoors. Total hardness is relatively low despite alkaline pH and appreciable buffering."
    sources:
    - kind: "database"
      title: "FishBase: Copadichromis mbenjii species summary"

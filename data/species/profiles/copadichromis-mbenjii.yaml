  sexing:
    text: "Breeding males develop blue and yellow areas, while females and young fish remain much paler with three\
      \ flank spots. Orange suffusion and a pale throat can also appear in mature males. Young or suppressed males\
      \ may resemble females, so colour alone is unreliable for assembling a juvenile harem. Mature fish or established\
      \ breeding records give a firmer basis for the intended ratio."
    sources:
    - kind: "database"
      title: "FishBase: Copadichromis mbenjii species summary"

      confidence: "low"
      rationale: "The tally records four unanimous proposals of 21 to 29 C, with low confidence. This envelope must\
        \ contain the complete natural range and is broader than the read care recommendations: Zoopet and OATA\
        \ 23 to 27 C, Einrichtungsbeispiele 24 to 26 C, the general Malawi.si guide 23 to 28 C and the borleyi care\
        \ sheet 25 to 29 C. Bruce's retailer gives 25.6 to 27.8 C after Fahrenheit conversion. The 21 C boundary\
        \ is imposed by natural coverage, not demonstrated years of aquarium maintenance. A stable 24 to 26 C is\
        \ the better supported routine target."

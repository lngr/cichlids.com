      accessed: "2026-10-13"
  compatibility:
    text: "Choose calm Malawi cichlids that can share the feeding regime and have enough space for their own adult\
      \ social units. Aulonocara stuartgranti, Placidochromis electra and Cyrtocara moorii are conditional possibilities\
      \ derived from broader husbandry guidance, rather than verified pairings with this species. Similar-looking\
      \ males can provoke breeding-site defence. Aggressive mbuna and large fish hunters are poor choices. Other\
      \ Copadichromis share a presumed hybrid risk based on broad warnings, with no verified free-choice mbenjii\
      \ cross established in the sources read."

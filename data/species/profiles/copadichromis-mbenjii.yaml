      accessed: "2026-10-13"
  breeding:
    text: "The male prepares a sand bower against or beneath rock. After spawning, the female incubates the brood\
      \ in her mouth for about three weeks in the species accounts. Keep her surroundings calm and ensure she has\
      \ relief from courtship. Released young need protection from community fish if they are to survive. Preserve\
      \ accurate parentage records, since similar utaka can be confused and the genus carries a presumed crossing\
      \ risk."

  sizeAndGrowth:
    text: "Allow for aquarium males around 15 cm and females around 11 cm. Published care figures differ, and the\
      \ larger unsexed retailer estimate is not used as the typical adult size. Food and space should support steady\
      \ growth without excess feeding. The 8 to 10 year lifespan is only a weak sales-page estimate; no measured\
      \ species-specific survival series or growth timetable was found."

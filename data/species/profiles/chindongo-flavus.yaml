profile:
  overview:
    text: "Chindongo flavus is a Malawi mbuna with a yellow, vertically barred adult male. The aquarium
      name Pseudotropheus flavus refers to the same species. Its compact body hides substantial
      territorial pressure, particularly within its own species."
    sources:
      - *a1
      - *a2
      - *a57
      - *a79
      - *a72
  habitat:
    text: "Chinyankwazi Island is the type locality; Seriously Fish and Malawi-Guru also record
      Chinyamwezi Reef. Other accounts list only the island, so the reef record has less consistent
      support. Rock crevices anchor territorial males, while feeding schools use the water
      immediately above the bottom. The natural lake envelope is 21-29 C, pH 7.7-8.6, 3-5 dGH and
      5-8 dKH. These combine lake studies rather than measurements at every occupied site."
    sources:
      - *a8
      - *a57
      - *a1
      - *a79
      - *a15
      - *a14
      - *a16
      - *a17
      - *a18
      - *a19
      - *a31
      - *a12
      - *a63
      - *a56
  sizeAndGrowth:
    text: "The typical adult planning estimates are 9 cm for males and 8 cm for females. Sources mix
      standard length with unspecified aquarium length, and the female limit is inferred. Larger
      captive fish are reported. The estimated 5.5-9 year lifespan is based on related mbuna rather
      than measured longevity for this species."
    sources:
      - *a2
      - *a8
      - *a64
      - *a56
      - *a80
      - *a78
  husbandry:
    text: "The baseline is a 154 L aquarium with a 90 by 45 cm footprint for one male and at least three
      females. Sources also recommend substantially larger aquaria, especially for communities or
      multiple males. Build stable rock refuges and broken sight lines while leaving swimming space
      above them. Maintain filtration, oxygenation and steady chemistry. A routine temperature of
      24-26 C fits the principal care recommendations; the wider tolerance endpoints are not routine
      targets."
    sources:
      - *a2
      - *a8
      - *a64
      - *a63
      - *a56
      - *a45
  socialBehavior:
    text: "Males defend local rock territories and repeatedly court passing females. A female-heavy
      harem distributes attention, but each fish still needs a retreat. Wild schooling and larger
      captive groups do not justify extra males in the minimum footprint. Territorial chasing is
      normal; persistent exclusion from shelter or food requires intervention."
    sources:
      - *a2
      - *a57
      - *a70
  diet:
    text: "Field summaries describe plankton feeding as well as algal grazing. The decided omnivore
      classification therefore includes plant and animal foods, while retaining bloat sensitivity.
      Use a vegetable-rich mbuna staple and algae on the rocks; modest invertebrate supplements can
      supplement it. Rich animal-protein feeding and unsuitable meat carry digestive warnings in the
      care sources."
    sources:
      - *a8
      - *a57
      - *a2
      - *a64
      - *a63
      - *a66
  breeding:
    text: "Females collect and incubate the brood in their mouths. Accounts place incubation and release
      at roughly three to four weeks. Brooding fish need refuge from courtship pressure, and
      disturbance can cause premature brood loss. Level 0 predation describes ordinary feeding and
      does not guarantee survival of exposed fry."
    sources:
      - *a2
      - *a57
      - *a64
      - *a56
  sexing:
    text: "Mature males develop stronger yellow colour and dark bars; females are smaller and duller.
      Social suppression can reduce male colour, so pale juveniles or subordinate adults cannot be
      assigned a sex reliably from brightness alone."
    sources:
      - *a2
      - *a57
  compatibility:
    text: "A community of similarly sized mbuna with compatible diets is possible. Avoid close
      elongatus-complex relatives: the existing presumed group includes Chindongo elongatus and
      Chindongo longior because hobby sources warn of crossing. It does not document a freely chosen
      cross. Very forceful or much larger mbuna, placid peacocks and large fish predators are
      unsuitable matches for the stated baseline."
    sources:
      - *a2
      - *a72
  problems:
    text: "Insufficient refuges and a poor sex ratio can turn pursuit into chronic stress or injury.
      Plant-poor, protein-rich feeding brings a reported bloat risk. Observe appetite and access to
      shelter rather than relying on colour alone; forum reports of illness do not establish a
      diagnosis. KH tolerance is especially provisional: 5-15 dKH is the median of conflicting
      recommendations, not a demonstrated physiological boundary."
    sources:
      - *a2
      - *a70
      - *a64
      - *a43
      - *a45
      - *a44

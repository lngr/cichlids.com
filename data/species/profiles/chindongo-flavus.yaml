  aggressionConspecific:
    value: 3
    confidence: "medium"
    rationale: "All four full profiles propose level 3. Species-specific accounts describe strong
      territorial males and repeated pursuit of females, with a several-female harem needed to
      distribute attention. Malawi.si uses a stronger aggression description, represented by an
      inherited level-4 interpretation, but does not establish routine killing under the stated
      one-male social unit. Level 3 captures chronic harassment and injury risk when the layout or
      ratio fails."

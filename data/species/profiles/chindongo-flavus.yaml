  temperatureC:
    value:
      min: 21
      max: 29
    confidence: "high"
    rationale: "The settled lake decision is 21-29 C. This seasonal and spatial envelope combines the
      physical limnology attributed to Eccles with later temperature work, rather than representing
      one site or a year-round aquarium target. FAO records 23-25 C for its historical surface
      samples; Vollmer describes summer water near 28 C and colder winters, including extra cooling
      in the southeastern arm. The inherited 21-29 C synthesis is distinguished from the measured
      subsets in the evidence. The Eccles full text was not available through fetch-oa and its DOI
      page returned 403, so no newly checked numerical claim is attributed to that inaccessible
      paper."

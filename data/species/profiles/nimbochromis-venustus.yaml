  temperatureC:
    value:
      min: 21
      max: 29
    confidence: high
    rationale: Lake Malawi endemic, so the natural range is the measured lake range decided by the water
      body lake-malawi; generator, checker-a and checker-b all proposed 21 to 29 C. The lake is
      about 21 C inshore in the cool, windy season (Eccles 1974), 23.5 to 24 C in the winter
      epilimnion and about 28 C in summer surface water (Vollmer et al. 2005), with later campaigns
      reaching 29 C. The FishBase line of 25 to 27 C is an aquarium figure and belongs to the
      tolerance.

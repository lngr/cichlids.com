  sizeAndGrowth:
    text: Males reach about 25 cm in a good aquarium; larger fish up to 30 cm are reported from the
      wild. Females stay noticeably smaller, at roughly 20 cm. Juveniles grow quickly on a rich
      diet, which often surprises owners who bought small fish for a medium tank. The body is deep
      and robust, with a large, wide mouth. With good care the species lives about 8 to 12 years.
    sources:

partners:
  suitable:
    - species: Cyrtocara moorii
      reason: Large, calm sand-dwelling hap of the same lake, too big to be eaten and plain blue instead
        of blotched.
      condition: Tank of at least 180 cm.
    - species: Dimidiochromis compressiceps
      reason: Another large Malawi predator of similar size that holds its own; named as a tankmate by
        Seriously Fish.
      condition: Tank of at least 200 cm with plenty of open water.
    - species: Sciaenochromis fryeri
      reason: Robust hap of the same habitat that outgrows the gape of venustus and shares the water
        values.
      condition: Tank of at least 180 cm; add as adults or large juveniles.
    - species: Copadichromis borleyi
      reason: Open-water hap of medium size that stays out of the way of the sand-dwelling venustus.
      condition: Add as adults of at least 12 cm.
    - species: Synodontis njassae
      reason: Lake Malawi catfish of sufficient size; Fishkeeper names suitably sized Synodontis as
        companions.
      condition: Choose adult catfish.
  unsuitable:
    - species: Pseudotropheus demasoni
      reason: Small mbuna below the prey size; it will be eaten.
    - species: Nimbochromis livingstonii
      reason: Similar blotched look; Fishkeeper advises against look-alikes, which fight as rivals.
    - species: Fossorochromis rostratus
      reason: Blotched sand-dwelling hap of similar shape and pattern, so rivalry with the male venustus
        is likely.
    - species: Tropheus moorii
      reason: Needs a species tank and a low-protein plant diet; different water of Lake Tanganyika.
    - species: Amatitlania nigrofasciata
      reason: Very aggressive Central American substrate spawner that defends its brood fiercely; an
        archive keeper reports convicts killing a venustus.
    - species: Neolamprologus multifasciatus
      reason: Tiny shell dweller that is easy prey.
profile:
  overview:
    text: "Nimbochromis venustus, sold as venustus or giraffe hap, is a large haplochromine cichlid
      found only in Lake Malawi. Its trade name refers to the irregular brown blotches on a pale
      body, which recall the coat of a giraffe. In nature it hunts from ambush: it lies still on the
      sand, sometimes half buried, until a small fish comes close enough to grab. In the aquarium it
      grows to about 25 cm and becomes tame and eager for food. Mature males turn into a vivid
      yellow fish with a deep blue face. Because of its size and its appetite for small fish it
      belongs in a large tank with robust Lake Malawi haps of similar size, not in a community of
      small mbuna or young peacocks."
    sources:
      - kind: database
        title: "Seriously Fish: Nimbochromis venustus (Venustus)"
        url: https://www.seriouslyfish.com/species/nimbochromis-venustus/
        archived: seriouslyfish.com/species/nimbochromis-venustus/2026-10-14T102033Z

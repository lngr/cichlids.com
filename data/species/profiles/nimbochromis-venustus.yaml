        url: https://www.liveaquaria.com/products/venustus-cichlid
        archived: liveaquaria.com/products/venustus-cichlid/2026-10-14T102035Z
        accessed: 2026-10-13
  socialBehavior:
    text: Venustus lives solitary in the lake and males do not tolerate each other. Keep one male per
      tank, either as a single fish among other large haps or with at least three females, and with
      four or more in a species tank, so that the male does not single out one partner. Towards
      other species it is mostly calm as long as they are too large to swallow, although the
      breeding male chases intruders away from his spawning site. Smaller fish disappear, because
      the predator lies motionless near the bottom and strikes suddenly.
    sources:
      - kind: database
        title: "Seriously Fish: Nimbochromis venustus (Venustus)"

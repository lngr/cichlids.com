    tolerance:
      value:
        min: 21
        max: 29
      confidence: medium
      rationale: "Unanimous tally (3 of 3): generator, checker-a and checker-b all proposed 21 to 29 C.
        Care sheets name 24 to 28 C (Seriously Fish), 25 to 27 C (FishBase), 24 to 26 C (Fishkeeper)
        and about 24 to 28 C (LiveAquaria); hobby guides range from 23 to 29 C, and a laboratory
        rearing study kept the fish at 26 to 28 C. The tolerance spans the lake range because wild
        fish live through the cool season near 21 C; 24 to 28 C is the usual target for long-term
        keeping. The tally decides the tolerance by agent votes; the lake range of the water body
        lies inside it."

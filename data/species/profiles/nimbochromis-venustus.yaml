        archived: doi.org/10.22034_ijab.v6i3.525/2026-10-13T000438Z
        accessed: 2026-10-13
      - kind: website
        title: "Wikipedia: Nimbochromis venustus"
        url: https://en.wikipedia.org/wiki/Nimbochromis_venustus
        archived: en.wikipedia.org/wiki/nimbochromis_venustus/2026-10-14T102041Z
        accessed: 2026-10-13
  habitat:
    text: "The species lives all around Lake Malawi. Young fish stay in shallow water close to rocks,
      while adults patrol sandy bottoms and the transitions between sand and rock, mostly in the
      upper 15 to 23 m. The lake water is soft but alkaline and well buffered: about 3 to 5 dGH, 5
      to 8 dKH and a pH of 7.7 to 8.6, at 21 to 29 C depending on season and depth. In the aquarium
      it does well at 24 to 28 C in alkaline water with a pH between 7.5 and 8.8, a general hardness
      up to about 20 dGH and a carbonate hardness up to about 15 dKH. Fine sand matters because it
      rests on and digs in the substrate."

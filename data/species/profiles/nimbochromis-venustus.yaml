          - yellow
        pattern: spots
      rationale: baseColors describe the adult male, whose blotches are faint or absent according to
        German Wikipedia and whose colours Seriously Fish and Fishkeeper give as blue and yellow;
        brown dominates only females and juveniles. The blotches are irregular patches, so spots
        fits better than mixed.

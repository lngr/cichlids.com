        url: https://www.fishkeeper.co.uk/fish/freshwater/cichlids/venustus-hap
        archived: fishkeeper.co.uk/fish/freshwater/cichlids/venustus-hap/2026-10-14T102035Z
        accessed: 2026-10-13
      - kind: database
        title: "FishBase species summary: Nimbochromis venustus"
        url: https://www.fishbase.se/summary/Nimbochromis-venustus.html
        archived: fishbase.se/summary/nimbochromis-venustus.html/2026-10-14T102033Z
        accessed: 2026-10-13
  breeding:
    text: Venustus is a maternal mouthbrooder. A coloured male cleans a flat stone or digs a shallow pit
      and courts the females. The female lays her eggs in small batches, the male fertilises them
      and she takes them into her mouth. She carries up to about 120 eggs and larvae for roughly
      three weeks without eating, then releases fry that are large enough to eat brine shrimp
      nauplii. For about ten more days the fry flee back into her mouth when disturbed. Stressed
      females tend to spit out the brood early, so move a brooding female only with care, or raise
      the fry separately.
    sources:

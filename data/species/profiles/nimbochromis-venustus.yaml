        - by: checker-b
          value:
            - Haplochromis venustus
            - Haplochromis simulans
      decision:
        - Haplochromis venustus
        - Haplochromis simulans
        - Cyrtocara venusta
      rationale: The Catalog of Fishes lists Haplochromis venustus and Haplochromis simulans. Cyrtocara
        venusta is kept as a combination of the older hobby literature, marked as such, because
        keepers meet the name in books and dealer lists.

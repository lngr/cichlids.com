  synonyms:
    - name: Haplochromis venustus
      note: Original combination of Boulenger (1908), described from Lake Malawi and the Shire River.
    - name: Haplochromis simulans
      note: Regan (1922); a synonym of Nimbochromis venustus according to the Catalog of Fishes (Eccles
        and Trewavas 1989, Snoeks and Manuel 2004).
    - name: Cyrtocara venusta
      note: Combination of the hobby literature of the 1980s, when most Malawi haplochromines were placed
        in Cyrtocara; not an available name of its own.
  legacyNames:
    - Nimbochromis venustus
    - Cyrtocara venusta
  note: The Catalog of Fishes lists the species as valid in Nimbochromis (Eccles and Trewavas 1989,
    Marechal 1991, Snoeks and Manuel 2004, Konings 2016) with Haplochromis simulans as its only
    synonym. The Cichlid Room Companion uses the same name.
    The legacy catalog also held the species under Cyrtocara venusta, and that entry maps to this profile.

    - field: taxonomy.synonyms
      proposals:
        - by: generator
          value:
            - Haplochromis venustus
            - Haplochromis simulans
            - Cyrtocara venusta
        - by: checker-a
          value:
            - Haplochromis venustus
            - Haplochromis simulans

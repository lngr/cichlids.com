        accessed: 2026-10-13
  problems:
    text: The most common mistake is buying juveniles for a tank that is far too small; the fish outgrow
      it within a year and become stressed and aggressive. Another is mixing them with small mbuna,
      which are eaten. Too many males lead to constant fights. Large predators produce much waste,
      and poor water leads to fin damage, rapid breathing and losses; regular water changes prevent
      this. Live feeder fish can introduce parasites and diseases. Overfeeding and mammal meat make
      the fish fat. Brooding females lose condition or their brood if they are disturbed or moved
      roughly.

  compatibility:
    text: Good companions are large and robust Lake Malawi cichlids that share the water values and are
      too big to swallow, for example Cyrtocara moorii, Dimidiochromis compressiceps, Sciaenochromis
      fryeri or Copadichromis borleyi, and sturdy Synodontis catfish. Avoid small mbuna, young
      peacocks and any fish shorter than about a third of the venustus, because they become prey.
      Similar-looking blotched haps such as Nimbochromis livingstonii or Fossorochromis rostratus
      are treated as rivals. Aggressive Central American cichlids and Tanganyika specialists such as
      Tropheus need other conditions and do not belong in the same tank.
    sources:
      - kind: database
        title: "Seriously Fish: Nimbochromis venustus (Venustus)"

            ratio: 3
        - by: checker-a
          value:
            structure: harem
            ratio: 4
        - by: checker-b
          value:
            structure: harem
            ratio: 4
      decision:
        structure: harem
        ratio: 3
      rationale: Seriously Fish recommends three to six females, Fishkeeper one or two in a mixed tank and
        four or more in a species tank, an archive keeper three to four. The checkers took a middle
        value of four, but three is the lower end that all sources accept for the recommended unit;
        the prose advises more females in a species tank.

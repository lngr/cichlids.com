        archived: riverparkaquatics.co.uk/venustus-cichlid-nimbochromis-venustus/2026-10-14T102038Z
        accessed: 2026-10-13
  husbandry:
    text: Plan for a tank of at least 180 cm length and about 500 litres, with a sandy bottom and a few
      stable rock piles along the back; the middle should stay free for swimming. Venustus digs, so
      rocks must stand on the glass, not on the sand. Strong filtration and generous weekly water
      changes matter, because a group of large predators produces much waste. Keep the water
      alkaline and buffered, for example with an aragonite substrate, and avoid sudden changes in
      temperature or pH. Flat stones near a cave give the male a place to spawn.
    sources:
      - kind: database
        title: "Fishkeeper (Maidenhead Aquatics): Venustus Hap, Nimbochromis venustus, species profile"
        url: https://www.fishkeeper.co.uk/fish/freshwater/cichlids/venustus-hap
        archived: fishkeeper.co.uk/fish/freshwater/cichlids/venustus-hap/2026-10-14T102035Z
        accessed: 2026-10-13

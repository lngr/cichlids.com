        title: cichlids.com forum thread 307
        url: https://www.cichlids.com/disc/read.php?1,307
        accessed: 2026-10-13
  diet:
    text: In the lake small fish make up most of the diet, with some invertebrates. Live feeder fish are
      unnecessary and bring disease risks; venustus learns to take dead food quickly. Offer a varied
      menu of frozen shrimp and prawns, krill, mysis and whole small fish such as lancefish or
      whitebait, plus good sinking pellets for large cichlids as a staple. Meat of mammals or birds
      is hard to digest and should not be fed. Juveniles take flakes, small pellets and frozen
      foods. Feed adults moderately once or twice a day so that they do not become fat.
    sources:
      - kind: database
        title: "Seriously Fish: Nimbochromis venustus (Venustus)"
        url: https://www.seriouslyfish.com/species/nimbochromis-venustus/
        archived: seriouslyfish.com/species/nimbochromis-venustus/2026-10-14T102033Z
        accessed: 2026-10-13

  hybridGroups:
    value:
      - nimbochromis
    confidence: medium
    rationale: >-
      Neither FishBase, Seriously Fish nor Fishkeeper reports crosses of N. venustus, and no cross
      with a named species is documented. The curated group file nevertheless places the species
      in the group nimbochromis, which covers the five valid species of the genus with the basis
      presumed: a wholesaler and a Malawi specialist site warn in general terms that Nimbochromis
      species can cross in tanks, the genus is a close lineage, and one retailer lists a cross of
      N. venustus and N. livingstonii without stating the circumstances. No cross from the wild or
      with free choice of partners is documented.

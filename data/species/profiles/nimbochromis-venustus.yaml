    rationale: "Unanimous tally (3 of 3): generator, checker-a and checker-b all proposed level 3. The
      species is an ambush piscivore: half-grown fish lie motionless, partly buried in the sand,
      until small fish come within reach, and small fish are its main food with some invertebrates
      (FishBase, the laboratory rearing study). Seriously Fish calls it an exclusive piscivore in
      nature that eats smaller mbuna and young fish in the aquarium, and Fishkeeper warns that its
      ambush hunting must guide the choice of tankmates. The Cichlid Room Companion confirms the
      piscivorous feeding."

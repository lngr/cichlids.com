  sexing:
    text: Young fish of both sexes show the blotched giraffe pattern on a sandy to ivory body. As males
      mature, the head turns intensely blue and the flanks and dorsal fin yellow, while the blotches
      fade until they are faint or gone. Fully coloured males are also larger. Females keep the
      brown blotches on a pale ground. Subdominant males may stay in the female colours for a long
      time, so an apparent group of females can still hold more than one male.

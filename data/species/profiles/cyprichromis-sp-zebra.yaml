    rationale: "Component medians of the four proposals are 300 L, 130 cm length and 45 cm front-to-back depth.\
      \ Generator proposes 300/150/50, checker-a 250/120/45, checker-b 300/140/45 and checker-c 300/120/45. Tanganyika.si\
      \ and TankBud recommend 300 L; AquaInfo gives 300 L and 140 cm for zonatus; Seriously Fish gives a 120 by\
      \ 45 by 45 cm congener tank of about 243 L; CRC gives at least 130 cm length for C. leptosoma. The selected\
      \ 130 cm median has independent support and avoids treating 150 cm as an established minimum. The volume\
      \ applies to ten adults and needs sufficient water height above the rockwork; depth means front-to-back\
      \ width. Smaller older group accounts and the importer's 60 US gallon recommendation are retained as context,\
      \ not direct trials of a group of ten of this unresolved form."

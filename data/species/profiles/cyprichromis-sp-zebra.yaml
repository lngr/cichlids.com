  sizeAndGrowth:
    text: "Use approximately 10 cm for males and 8.5 cm for females as typical adult planning sizes. The closest\
      \ locality account gives males about 10 cm total length and females 1 to 2 cm less. Reports for zebra-labelled\
      \ or zonatus fish differ substantially: AquaInfo gives about 8 cm males, while older aquarium accounts describe\
      \ males above 12 cm and a care compilation gives 13 cm. This spread reflects differing stocks and evidence\
      \ as well as uncertain identity. FishBase's 8.6 and 8.1 cm zonatus figures exclude the tail and cannot be\
      \ compared directly with total length. Track the supplied population rather than relying on a trade name\
      \ to predict an exact adult size. The 5 to 8 year lifespan is an unverified estimate."

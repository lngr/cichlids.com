  legacyNames:
  - Cyprichromis spec. "Zebra"
  - Cyprichromis zebra
  note: "The Catalog of Fishes recognizes five described Cyprichromis species and no zebra binomen. The unqualified\
    \ Zebra trade label does not identify a locality or establish identity with C. zonatus. Tanganyika.si associates\
    \ the Kipili and Mpimbwe zebra populations with the zonatus complex but reports different interpretations\
    \ of their taxonomic rank; DCG lists those locality forms as undescribed. The supplied trade-form identity\
    \ is therefore retained with species and author null. These locality forms are comparisons, not confirmed\
    \ variants of one taxon."

  diet:
    text: "Offer small animal foods suited to a planktivore, including appropriately sized frozen or live crustaceans\
      \ and suitable fine prepared foods. Distribute food through the swimming zone and check that quiet individuals\
      \ take their share. The main natural prey is zooplankton and other small invertebrates. This supports an\
      \ invertivore classification and predation level 0, which permits incidental capture of tiny fry without\
      \ implying routine fish hunting. This profile has no evidence of a special requirement for the low-protein\
      \ grazer diet used for some Tanganyikan algae feeders. The false bloat-sensitivity flag records the absence\
      \ of a specific reported tendency and does not make excessive feeding harmless. General hardness and carbonate\
      \ hardness are separate water properties and should not be inferred from one another when preparing water."

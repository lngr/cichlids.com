  socialBehavior:
    text: "Keep at least ten rather than a pair. A group gives females and subordinate males more opportunity\
      \ to move away from display activity. Male encounters usually involve showing the fins and brief pursuit,\
      \ with little evidence of serious contact fighting under suitable conditions. A female-biased group can\
      \ reduce repeated attention to individual females. The closest Zebra locality accounts describe breeding\
      \ courts facing a rock surface; the wholly suspended display territories described for C. leptosoma should\
      \ not be transferred automatically. Other appropriately chosen species are generally tolerated. Watch whether\
      \ every fish can swim and feed normally, since peaceful group behaviour does not guarantee that every individual\
      \ avoids harassment in a crowded layout."

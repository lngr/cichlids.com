  sexing:
    text: "Males generally develop brighter yellowish and blue tones with conspicuous dark vertical bars. Females\
      \ tend toward muted beige or brown and show less vivid fins. This is a practical comparison with locality-qualified\
      \ Zebra forms, not a diagnostic description for every fish sold under the label. Body size overlaps and\
      \ juveniles are harder to sex. Adult display behaviour and a known stock history offer better context than\
      \ selecting fish by brightness alone. Some Cyprichromis populations have several male colour forms, but\
      \ the closest Mpimbwe, Kipili and zonatus accounts describe similar male patterns within each population;\
      \ colour polymorphism should not be assumed for this trade form."

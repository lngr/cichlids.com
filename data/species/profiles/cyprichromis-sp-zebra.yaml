      \ in the FAO/FINNIDA programme yield about 11.1 to 11.5 dGH, while the other lake studies support the broader\
      \ rounded interval. GH is calculated as calcium mg/L divided by 7.14 plus magnesium mg/L divided by 4.34.\
      \ Aquarium recommendations extending to 25 dGH are retained separately and are not field measurements."

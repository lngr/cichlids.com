  habitat:
    text: "The relevant habitat is open water beside Tanganyika's rocky shores. Mpimbwe Zebra is reported from\
      \ deep reef habitat, particularly 45 to 60 m, while FishBase gives 9 to 30 m for described C. zonatus. Neither\
      \ depth range identifies the origin of every Zebra-labelled fish. The decided natural lake values are 23\
      \ to 29 C, pH 8.4 to 9.4, 10 to 13 dGH and 15 to 20 dKH. Seasonal and depth variation in these measurements\
      \ should not be reproduced as abrupt aquarium changes. Rocks provide reference points, shelter and a surface\
      \ beside which males can display. The water column is the principal swimming and feeding zone; sand is optional\
      \ rather than a required feeding or spawning habitat."

  breeding:
    text: "Females carry the developing brood in the mouth. The closest locality accounts place courtship and\
      \ spawning in the water just in front of a vertical rock, whereas related C. leptosoma displays in a suspended\
      \ court. Incubation reports vary from roughly three to four weeks, so a precise schedule should not be promised\
      \ for an unidentified trade form. Broods are small and the free-swimming young need appropriately fine foods.\
      \ Avoid unnecessary disturbance of a brooding female and assess her condition and social access individually.\
      \ Claims about whether females continue feeding differ among care sources. Preserve the parents' locality\
      \ and trade identity when labelling offspring; an unqualified Zebra name does not establish a described\
      \ species or demonstrate that mixed stocks share the same ancestry."

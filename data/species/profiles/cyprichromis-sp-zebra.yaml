      rationale: "The tally decides 10 to 23 dKH by median with low confidence and 3 of 6 votes in the largest\
        \ agreeing set. Generator, checker-b and checker-c propose 10 to 25; checker-a and tiebreaker-2 propose\
        \ 8 to 20; tiebreaker-1 proposes 10 to 20 dKH. The minima have median 10 and the maxima median 22.5, rounded\
        \ to 23; the result contains the natural 15 to 20 dKH range. Practical Fishkeeping recommends 8 to 18,\
        \ OATA and AquaInfo 10 to 15, and the lower-trust Einrichtungsbeispiele account gives 6 to 9 for C. zonatus.\
        \ Thus published advice extends below the chosen minimum, and the wider proposals extend to 25. The settled\
        \ interval is an inferred group-husbandry allowance, not a demonstrated stress threshold; neither 23 nor\
        \ 25 dKH has direct long-term Zebra evidence. GH and pH figures retained below are contextual inferences\
        \ and must not be read as measured KH. Seachem distinguishes KH from GH but provides no species-specific\

    rationale: "The sex-specific medians are male 10 cm and female 8.5 cm: generator and checker-a propose 10/9,\
      \ checker-b 9/8, and checker-c 10/8. Tanganyika.si gives locality-form males about 10 cm total length and\
      \ females 1 to 2 cm smaller, supporting a female estimate of 8 to 9 cm. FishBase's zonatus values of 8.6/8.1\
      \ cm are standard lengths and cannot be substituted directly for total length. AquaInfo gives an 8 cm male,\
      \ whereas Sims quotes 4 to 5 inches without sex separation, Einrichtungsbeispiele gives 13/10 cm, and Destination\
      \ Tanganyika reports males over 12 cm and females near 10 cm. These larger figures are retained but do not\
      \ identify every unlocalized Zebra fish; the chosen sizes are typical proxy maxima rather than guarantees\
      \ for all trade stock."

  temperatureC:
    value:
      min: 23
      max: 29
    confidence: high
    rationale: The settled waterbody decision is 23 to 29 C with high confidence. Verburg and colleagues measure
      23.85 to 29.01 C in hourly near-surface buoy readings at Mpulungu; rounded lake-wide values describe the
      natural seasonal setting. The narrower 24 to 27 C husbandry advice is retained as aquarium context and does
      not redefine habitat water.

  problems:
    text: "Repeated chasing, excluded individuals, weak feeding and a short or obstructed swimming route call\
      \ for a review of group size and layout. Abrupt changes in water chemistry can compound these problems.\
      \ Keep all lid gaps closed and use calm introductions. Check that food reaches the school before fast companions\
      \ consume it. Large predators and energetic algae grazers create additional compatibility risks. The uncertain\
      \ trade identity is also a practical limitation: adult size, rock-facing courtship and incubation details\
      \ are supported mainly by locality proxies. Neither the inferred KH allowance nor the lifespan estimate\
      \ is a measured long-term limit for identified Zebra fish. Persistent deterioration needs investigation\
      \ rather than a diagnosis based solely on a generic symptom such as hiding or poor appetite."

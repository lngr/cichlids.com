  khDkh:
    value:
      min: 15
      max: 20
    confidence: high
    rationale: "The settled natural lake decision is 15 to 20 dKH with high confidence and no verification object.\
      \ Plisnier's bicarbonate and carbonate titrations, together with the alkalinity reported by Langenberg after\
      \ Edmond and colleagues, support this rounded lake interval. Alkalinity in meq/L is multiplied by 2.8 to\
      \ express dKH. Sodium and potassium contribute to alkalinity, so KH can exceed GH. Lower readings near an\
      \ inflow do not define the typical lake habitat."
    sources:
    - kind: literature
      title: "Plisnier, P.-D. (1996). Limnological sampling during a second annual cycle (1994-1995) and some\
        \ comparisons with year one on Lake Tanganyika. FAO/FINNIDA GCP/RAF/271/FIN-TD/56."

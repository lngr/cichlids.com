    rationale: "All four runs place the form in Lake Tanganyika. Checker-a proposes Kipili and Mpimbwe as localities,\
      \ whereas generator, checker-b and checker-c leave the collection site unresolved. These names identify\
      \ related zebra populations rather than the origin of this unqualified legacy entry, so no exact locality\
      \ is assigned. The lake id is normalized from checker-b's lake-name alias."

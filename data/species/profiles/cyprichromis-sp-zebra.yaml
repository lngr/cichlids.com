partners:
  suitable:
  - species: Altolamprologus calvus
    reason: A rock-associated adult uses shelter below the main swimming route; the pairing follows congener community
      guidance.
    condition: Provide separate rock shelter in a spacious tank; small fry of either fish may be vulnerable.
  - species: Julidochromis transcriptus
    reason: Occupies crevices along rocks while the sardine cichlids use the open water.
    condition: Provide separate rock territory and sufficient open swimming length.
  - species: Neolamprologus multifasciatus
    reason: Stays near a shell bed on the bottom and has different space needs.
    condition: Place shells away from the main open-water swimming corridor.
  unsuitable:
  - species: Bathybates fasciatus
    reason: A large open-water piscivore can prey on these smaller midwater fish.
  - species: Boulengerochromis microlepis
    reason: This very large predatory cichlid can swallow adult Cyprichromis.
  - species: Tropheus moorii
    reason: "Its plant-based grazing diet conflicts with the animal-rich feeding needs of Cyprichromis, and feeding\
      \ both together complicates diet control."
  - species: Cyphotilapia frontosa
    reason: "Tanganyikan husbandry sources identify Cyprichromis as prey, especially while resting; adult size\
      \ does not make the school safe."
profile:
  overview:
    text: "Cyprichromis sp. 'Zebra' labels a barred sardine cichlid from Lake Tanganyika without identifying one\
      \ described species. Several locality-qualified zebra forms resemble C. zonatus, but their taxonomic interpretation\
      \ differs between specialist accounts. An unqualified label provides too little information to assign a\
      \ collection population. This profile therefore retains an undescribed trade form and uses the closest locality\
      \ accounts, with congener husbandry as supporting guidance. The fish schools in the water column and feeds\
      \ on small suspended animals. Its main aquarium requirements are a group of at least ten, stable alkaline\
      \ water and room to swim above sparse rockwork. Female mouthbrooding and male breeding displays are characteristic,\
      \ while exact adult size and colour depend on the stock."

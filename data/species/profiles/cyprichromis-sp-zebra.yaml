  compatibility:
    text: "Calm Tanganyikan rock and shell dwellers are plausible companions when their adult territories leave\
      \ the school enough clear swimming space. Suitable examples include smaller Julidochromis, Altolamprologus\
      \ and shell-dwelling Neolamprologus. Account for the needs of every species rather than treating 300 L as\
      \ capacity for an arbitrary community. Large piscivores can consume Cyprichromis, and boisterous grazers\
      \ such as Tropheus or Malawi mbuna can disrupt feeding and calm schooling. No hybrid group is assigned to\
      \ this unresolved label. Broader hobby warnings about mixing Cyprichromis forms remain relevant to stock\
      \ identity, but no verified cross involving the unqualified Zebra label is established by the evidence.\
      \ Community keeping therefore remains possible without asserting that all congeners are reproductive matches."
    sources:

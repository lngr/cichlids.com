  husbandry:
    text: "Provide at least 300 L with a swimming length of 130 cm and front-to-back depth of 45 cm for ten adults,\
      \ with enough height to leave open water above the rocks. Distribute a few stable rocks along the margins,\
      \ including a near-vertical face, while keeping the main swimming route clear. Gentle lighting suits the\
      \ deeper-water comparison forms. Fit a secure lid because Cyprichromis can jump during disturbance or courtship.\
      \ Related-species care sources commonly recommend 24 to 27 C as an everyday temperature target. The profile's\
      \ broader tolerances are 23 to 29 C, pH 7.8 to 9.5, 9 to 25 dGH and an inferred 10 to 23 dKH. These ranges\
      \ express uncertain keeping allowances rather than experimentally verified limits or a reason to target\
      \ their endpoints. Maintain filtration, oxygenation and consistent replacement-water chemistry."

  predation:
    value: 1
    confidence: low
    rationale: >-
      The votes split three to two between level 0 and level 1, which reaches no qualified majority,
      so the conservative rule takes the higher level 1. The fish is an aufwuchs grazer with small
      bicuspid scraping teeth that graze algae from sunken wood (Oliver after Konings, Seriously Fish;
      the Cichlid Room Companion confirms the algae-scraping habit), and no source reports that it
      hunts fish. The runs for level 0 read this as fry being taken at most by chance. The runs for
      level 1 point to fry losses in the tank: Seriously Fish advises moving holding females so that
      the young are not eaten, a care website marks the species as a fry predator, and keepers in the
      cichlids.com archive lost broods in community tanks. For the compatibility check, level 1 means
      that only fry and fish below about 2 cm count as prey, which matches these reports; it does not
      mark the species as a hunter of larger fish.
    sources:
      - *sf
      - *oliver
      - *aqualog
      - &crc
        kind: database
        title: "Cichlid Room Companion: Pseudotropheus sp. 'acei' (public summary, verification only)"
        url: https://cichlidae.com/species.php?id=0l3Euanq-W7k3KfBH3Perg
        accessed: 2026-10-13
      - *fishkeeper
      - *guidarium
      - &arch14992
        kind: archive
        title: cichlids.com forum thread 14992
        url: https://www.cichlids.com/disc/read.php?2,14992
        accessed: 2026-10-13
    evidence:
      - source: *sf
        value: 1
        note: wood-grazing aufwuchs feeder; advises moving holding females so that the fry are not eaten in the tank
      - source: *oliver
        value: 0
        note: grazes algae on submerged wood; no fish or fry in the diet mentioned
      - source: *aqualog
        value: 0
        note: omnivore, no fish in the diet stated
      - source: *crc
        value: 0
        note: feeding type algae scraper (verification only)
      - source: *fishkeeper
        value: 0
        note: primarily vegetarian
      - source: *aquahoy
        value: 0
        note: predominantly herbivorous diet, no fish
      - source: *guidarium
        value: 1
        note: generic trait list marks it as a fry predator, without detail
      - source: *arch14992
        value: 1
        note: brood lost to tankmates in a community tank
    verification:
      method: conservative
      votes: {agree: 3, total: 5}

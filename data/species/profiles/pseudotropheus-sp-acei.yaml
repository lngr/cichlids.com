          note: aquarium recommendation
        - source: *branchu
          value: {min: 3, max: 5}
          note: natural lake water, the lower bound of the tolerance
        - source: *tuzluluk
          value: {min: 3, max: 25}
          note: abstract reports adaptation to high salinity; indirect support only
        - source: *fishkeeper
          value: {min: 3, max: 25}
          note: gives only an upper limit of 25
        - source: *guidarium
          value: {min: 10, max: 25}
          note: aquarium recommendation, probably taken from Seriously Fish
        - source: *garnelio
          value: {min: 10, max: 30}
          note: aquarium recommendation of a dealer
        - source: *aquahoy
          value: {min: 10, max: 20}
          note: aquarium recommendation
        - source: *cfArticle

      reason: Lake Malawi catfish that shares the water values, stays near the bottom and ignores the cichlids.
  unsuitable:
    - species: "Pseudotropheus sp. 'acei' (other colour forms)"
      reason: Yellow-tail and white-tail forms cross and lose their identity.
    - species: Pseudotropheus elegans
      reason: Very similar fish that may belong to the same species complex; provokes rival fights, and crossing cannot be ruled out.
    - species: Gephyrochromis lawsi
      reason: Look-alike and possible close relative that provokes rival fights; no cross is documented.
    - species: Melanochromis auratus
      reason: Much more aggressive mbuna that harasses the calm acei.
    - species: Maylandia lombardoi
      reason: Aggressive mbuna that Practical Fishkeeping advises leaving out of a calm mbuna tank.
    - species: Maylandia estherae
      reason: Robust, aggressive mbuna that dominates acei.
    - species: Nimbochromis livingstonii
      reason: Predatory hap that eats juvenile and small acei.
    - species: Cyphotilapia frontosa
      reason: Needs protein-rich food that causes bloat in acei and comes from a different lake.
profile:
  overview:
    text: >-
      Acei is one of the best-known mbuna of Lake Malawi and a long-standing favourite in the hobby,
      yet science has never described it. It is traded as Pseudotropheus sp. 'acei', sometimes as
      Pseudotropheus acei or Gephyrochromis acei, and some retailers label it Pseudotropheus elegans,
      a described species that is related but treated as distinct. The usual trade form has a
      violet-blue body with bright yellow fins. Unlike most mbuna it lives along sandy shores, grazes
      algae from sunken logs and branches and swims in loose schools in the water column. In the
      aquarium it counts as one of the calmer mbuna and breeds readily, which makes it a good first
      Malawi cichlid for keepers who can offer a long tank and a mainly plant-based diet.
    sources: [*sf, *oliver, *crc, *pfkBeginners, *fishkeeper, *cof]
  habitat:
    text: >-
      Acei is endemic to Lake Malawi and lives along the western shore, from Senga Bay in the south via
      Nkhata Bay and Bandawe to Ngara and Karonga in the north. It favours sandy stretches where trees
      and branches have fallen into the water, but it also occurs near rocks. Groups of a few fish to
      several dozen gather around a log, and at Ngara schools of thousands have been seen at a single
      trunk. The lake water is warm, soft and alkaline: about 21 to 29 C, pH 7.7 to 8.6, 3 to 5 dGH and
      5 to 8 dKH. In the aquarium it stays healthy within the same temperature span and at pH 7.5 to
      8.8, with 24 to 28 C as the usual comfort zone, as long as the water is well buffered.
    sources: [*oliver, *sf, *glaserNgara, *branchu, *fao, *eccles]
  sizeAndGrowth:
    text: >-
      Males reach about 15 cm in the aquarium, females stay a little smaller at around 12 cm. Wild fish
      are usually somewhat smaller, because their food is poorer than in the aquarium; single aquarium
      males have grown to almost 18 cm. The body is more slender than that of most mbuna, and the fish
      swims a lot, often in the upper half of the tank. Juveniles grow steadily on a plant-based diet;
      fast growth on rich food is not a goal, because protein-heavy feeding harms the gut of this
      grazer.
    sources: [*fishkeeper, *glaserMsuli, *sf, *aqualog]
  husbandry:
    text: >-
      A group of five or more, with more females than males, needs a tank of at least 120 cm length
      and about 240 litres; 150 cm is better, because acei are active swimmers. Build stable rock piles
      that reach high into the water column, leave open sand and swimming space in front, and add a
      piece of wood only if the water is well buffered, since wood tends to lower the pH. Keep the
      temperature around 24 to 28 C and the pH between 7.5 and 8.8 with steady carbonate hardness.
      Strong filtration and large weekly water changes keep nitrate low, which matters for all Malawi
      grazers. A darker substrate shows the colours better.
    sources: [*sf, *fishkeeper, *liveaquaria, *oliver]
  socialBehavior:
    text: >-
      Acei is a sociable fish that lives in loose schools. In the aquarium males become territorial
      when they want to spawn: they clean a spot between rocks, display and chase other fish away from
      it, but they rarely cause injuries. In the lake breeding males have not been seen holding
      territories. A single female kept with a male gets harassed, so keep a group with several
      females per male; in long tanks more than one male works. Compared with typical rock mbuna it is
      mild, and robust mbuna may push it around instead.
    sources: [*sf, *oliver, *glaserNgara, *fishkeeper, *cfArticle]
  diet:
    text: >-
      In nature acei scrapes the algae and small organisms that grow on submerged wood, an unusual food
      source among mbuna. Its gut is built for this low-protein fare. In the aquarium the staple should
      be spirulina flakes or pellets for herbivorous cichlids, with nori, blanched spinach or other soft
      greens as additions. Small frozen crustaceans can be offered as a rare treat, but red meat,
      bloodworms and protein-rich food for predators should be avoided. Feed small portions several
      times a day and leave out one day a week.
    sources: [*sf, *oliver, *fishkeeper, *glaserNgara]
  breeding:
    text: >-
      Acei is a maternal mouthbrooder and breeds throughout the year in the aquarium. The male picks a
      flat stone or a pit in the sand and courts the females in intense colours. The female lays her
      eggs, takes them into her mouth and collects the sperm while nipping at the egg spots on the
      male's anal fin. She carries the brood for about three to four weeks without eating and then
      releases a few dozen young, depending on her size. The fry take brine shrimp nauplii and crushed
      flakes from the start. In a community tank many fry are lost, so breeders move the female before
      release or raise the young in a separate tank.
    sources: [*sf, *oliver, *fishkeeper, *cfArticle]
  sexing:
    text: >-
      Sexing acei is harder than in most mbuna because both sexes share the same colour pattern and
      both can show egg spots on the anal fin. Adult males grow larger, colour up more strongly in
      breeding mood and usually carry more and brighter egg spots. Behaviour is the most reliable
      sign: males display, spread their fins and chase, while females stay calmer in the school.
      Venting is possible but needs experience. A group of six or more juveniles gives a good chance of
      getting both sexes.
    sources: [*sf, *fishkeeper, *cfArticle]
  compatibility:
    text: >-
      Acei suits a Malawi community of calm to moderately aggressive species. Good partners are
      Labidochromis caeruleus, Iodotropheus sprengerae and peaceful haps such as Copadichromis and
      Aulonocara in a long tank. Very aggressive mbuna such as Melanochromis auratus, Maylandia
      lombardoi or Maylandia estherae dominate it, and large predatory haps eat young acei. Do not mix
      the yellow-tail and white-tail forms or look-alikes such as Gephyrochromis and Pseudotropheus
      elegans, because similar fish fight like rivals and colour forms cross. Tankmates that need
      meaty, protein-rich food, for example many Tanganyika and Central American cichlids, are a poor
      match for a bloat-prone grazer. Adults leave other fish alone, but fry in the tank get eaten.
    sources: [*sf, *pfkBeginners, *pfkLabs, *fishkeeper, *oliver]
  problems:
    text: >-
      The most common problem is Malawi bloat, a gut disorder of algae-eating cichlids that often
      follows protein-rich food, overfeeding, poor water or stress. A swollen belly, loss of appetite
      and white stringy droppings are warning signs that call for advice from a fish veterinarian or
      an experienced keeper. Acidic or poorly buffered water, for example after adding a lot of wood
      without buffering, weakens the fish. A male kept with only one or two females wears them down,
      and harassed holding females lose their brood. Mixing colour forms produces hybrids that can no
      longer be passed on as a true form.
    sources: [*fishkeeper, *sf, *oliver, *arch14992]

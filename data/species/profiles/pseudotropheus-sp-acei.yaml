  maxSizeCm:
    value: {male: 15, female: 12}
    confidence: medium
    rationale: >-
      Aquarium sources give about 15 cm total length (Fishkeeper, Aqualog 12 to 15 cm, Seriously Fish
      12.5 cm standard length, which is about 15 cm total length). Males grow larger than females.
      Aquarium Glaser reports wild males of usually 12, rarely 14 cm and females of about 12 cm, and
      single aquarium fish of almost 18 cm, which is a record and not typical. A hobby article gives
      about 10 cm for females; since wild females already reach about 12 cm, well-fed aquarium
      females are taken at 12 cm.
    sources:
      - *sf
      - *aqualog
      - *fishkeeper

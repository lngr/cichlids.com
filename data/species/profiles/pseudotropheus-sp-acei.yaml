        votes: {agree: 4, total: 5}
  khDkh:
    value: {min: 5, max: 8}
    confidence: high
    rationale: >-
      Lake Malawi endemic, so the natural value is the alkalinity of the lake, 2.0 to 2.6 meq/L or 5
      to 8 dKH. Sodium bicarbonate makes the carbonate hardness higher than the total hardness.
    sources: *lakeSources
    evidence:
      - source: *branchu
        value: {min: 6.5, max: 6.9}
        note: alkalinity profiles of the north basin
      - source: *fao
        value: {min: 5.6, max: 7.3}
        note: alkalinity after Jackson et al. (1963)
    tolerance:
      value: {min: 5, max: 15}
      confidence: low
      rationale: >-
        Only LiveAquaria and AquaHoy give a carbonate hardness for the species (10 to 15 dKH). Seriously
        Fish and Fishkeeper give no number but ask for well-buffered, alkaline water, above all when
        wood is used, and the hobby article asks for a pH above 8. The tolerance spans the natural 5 to
        8 dKH of the lake up to the 15 dKH of the care sheets; values below 5 dKH risk pH drops and no
        source supports them. The confidence stays low because no structured source states a figure.
      sources:
        - *branchu
        - *fao
        - *sf
        - *liveaquaria
        - *fishkeeper
        - *aquahoy
        - *cfArticle
      evidence:
        - source: *branchu
          value: {min: 6.5, max: 6.9}
          note: natural lake water, inside the lower part of the tolerance
        - source: *fao
          value: {min: 5.6, max: 7.3}
          note: natural lake water, inside the lower part of the tolerance
        - source: *liveaquaria
          value: {min: 10, max: 15}
          note: aquarium recommendation
        - source: *aquahoy
          value: {min: 10, max: 15}
          note: aquarium recommendation, lower bound of the stated range
        - source: *fishkeeper
          value: {min: 5, max: 15}

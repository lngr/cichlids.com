status: undescribed
taxonomy:
  validName: "Pseudotropheus sp. 'acei'"
  genus: Pseudotropheus
  species: null
  author: null
  source: &cof
    kind: catalog-of-fishes
    title: "Eschmeyer's Catalog of Fishes, species of the genus Pseudotropheus (no name with the epithet acei)"
    url: https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Pseudotropheus
    accessed: 2026-10-13
  synonyms:
    - name: Pseudotropheus acei
      note: >-
        Trade and aquaculture name written like a binomial; no description exists, and the
        attribution to Regan 1922 found in some aquaculture papers and hobby texts has no basis in the
        Catalog of Fishes.
    - name: Gephyrochromis acei
      note: Trade name based on the outward likeness to Gephyrochromis; not an available scientific name.
    - name: "Gephyrochromis sp. 'acei'"
      note: Earlier hobby placement in Gephyrochromis; the fish has the stout bicuspid outer teeth of Pseudotropheus.
  legacyNames:
    - Pseudotropheus acei
  note: >-
    The Catalog of Fishes (accessed 2026-10-13) holds no name with the epithet acei in Pseudotropheus
    or in the other mbuna genera checked by the runs (Gephyrochromis, Maylandia, Chindongo,
    Cynotilapia, Melanochromis, Tropheops), so the fish carries the trade name
    Pseudotropheus sp. 'acei'. Weighing a possible identity with Pseudotropheus elegans Trewavas 1935:
    the catalog lists P. elegans as a valid species (type locality Deep or Chilumba Bay) without any
    reference to acei. The redescription by Stauffer, Konings and Ryan (2016) includes the sp. 'acei'
    of Konings (2007) in the list of earlier names of P. elegans, so at least one population that
    Konings had shown as acei belongs to P. elegans; the redescribed material comes from Chilumba Bay
    and Chitande Island and is a grey fish with green-edged scales and a pale yellow to clear dorsal
    fin, not the violet-blue, yellow-finned or dark white-tailed trade forms. The Cichlid Room
    Companion, curated by Konings and updated in 2018, still lists P. elegans and sp. 'acei' as two
    separate species, and Seriously Fish keeps acei undescribed. A UK retailer sells the yellow-tail
    acei under the name P. elegans, which this profile treats as a trade label, not as an
    identification. Result: the trade acei stays undescribed and P. elegans is not listed as a
    synonym; part of the pale acei-like populations may belong to P. elegans, and the trade forms may
    turn out to be one or more species once described.
names:
  trade:
    en: [Acei, Yellow-tail acei, Yellowtail acei, White-tail acei]
    de: [Acei]
variants:
  - name: Yellow tail (Nkhata Bay to Bandawe, Msuli)
    kind: locality
    note: Violet-blue body with yellow fins in both sexes; the form most common in the trade.
  - name: White tail (Ngara to Karonga)
    kind: locality
    note: Bluish to very dark body with white or pale fins.
  - name: South Rukuru River to Ruarwe and Senga Bay
    kind: locality
    note: Pale populations that resemble Gephyrochromis; rarely traded.
features:

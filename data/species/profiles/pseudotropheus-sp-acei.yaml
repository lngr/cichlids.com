      waterbody: lake-malawi
    tolerance:
      value: {min: 7.5, max: 8.8}
      confidence: medium
      rationale: >-
        Care sources agree on alkaline water: 7.6 to 8.8 (Seriously Fish), 7.5 to 8.5 (Fishkeeper),
        7.8 to 8.6 (LiveAquaria, AquaHoy), at least 8 (Aquarium Glaser, a hobby article), and growth
        trials ran at pH 8.1 to 8.2. Aqualog alone gives 7.0 to 8.0, which contradicts all other
        sources including its partner wholesaler and is not followed for the lower bound. The range
        7.5 to 8.8 contains the lake range; one run proposed 7.5 to 8.6, which lies within the
        agreement threshold.

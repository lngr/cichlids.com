    value:
      continent: Africa
      region: Lake Malawi
      waterbody: Lake Malawi
      localities: [Nkhata Bay, Bandawe, Msuli, Luwala Reef, Ngara, Karonga, Ruarwe, South Rukuru River, Senga Bay]
    confidence: high
    rationale: >-
      Endemic to Lake Malawi. All sources place the populations on the western (Malawian) shore
      between Senga Bay in the south and Karonga in the north; Oliver points out that every locality
      in Konings (1995) lies on the western shore. The fish lives on sandy and mixed shores around
      sunken trees and branches. Msuli and Luwala Reef are the localities a retailer gives for the
      yellow-tail form.

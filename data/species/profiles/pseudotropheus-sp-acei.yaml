  ghDgh:
    value: {min: 3, max: 5}
    confidence: high
    rationale: >-
      Lake Malawi endemic, so the natural value is the total hardness of the lake computed from its
      calcium and magnesium, 3 to 5 dGH. The lake is soft water whose buffering comes from
      bicarbonate, not from calcium and magnesium.
    sources: *lakeSources
    evidence:
      - source: *branchu
        value: {min: 4.2, max: 4.6}
        note: upper 50 m of the north basin, computed from calcium and magnesium
      - source: *fao
        value: {min: 3.2, max: 4.9}
        note: titrations of the 1960s, computed from calcium and magnesium
    verification:
      method: waterbody
      waterbody: lake-malawi
    tolerance:
      value: {min: 3, max: 25}
      confidence: medium
      rationale: >-
        The soft lake water of 3 to 5 dGH sets the lower bound. For the upper bound Seriously Fish
        (10 to 25 dGH), Fishkeeper (up to 25), Guidarium (10 to 25) and a dealer (up to 30) accept hard
        water, while AquaHoy stops at 20 and a hobby article names 10 to 12. The higher figures of the
        care sheets reflect the habit of keeping Malawi cichlids in hard water rather than a need of
        the fish; what matters is a stable, alkaline pH. Studies on the species report that it adapts
        to strongly saline water, which indicates robust osmoregulation but does not test hardness
        directly. The decided range runs from the lake value to the 25 dGH that the structured sources
        accept.
      sources:
        - *sf
        - *branchu
        - &tuzluluk
          kind: literature
          title: >-

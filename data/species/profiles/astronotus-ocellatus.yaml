      (Fishipedia). Adults form pairs and treat other adults as rivals; disputes run through
      displays, colour changes and jaw-locking (Animal Diversity Web, Beeching 1995). Once a pair has
      formed, Seriously Fish advises removing the other fish, because in a normal tank the pair
      chases them persistently and injures them. That matches level 3 rather than level 2.

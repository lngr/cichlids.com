  ph:
    value: {min: 5.9, max: 7.5}
    confidence: low
    rationale: >-
      The five votes did not settle on one range: generator 5.9 to 7.5, checker-a 5.8 to 7.6,
      checker-b 6.0 to 7.0, tiebreaker-1 6.0 to 7.5 and tiebreaker-2 5.4 to 7.0. No range reached
      four agreeing votes, so the vote count takes the median of the proposals. The minima 5.4, 5.8,
      5.9, 6.0 and 6.0 give a median of 5.9, the maxima 7.0, 7.0, 7.5, 7.5 and 7.6 give a median of
      7.5, hence pH 5.9 to 7.5. The core is the circumneutral range of the silt-laden white water
      the species favours: water from the Lake Janauaca collection site had pH 6.6 plus or minus 0.4
      (Duncan et al. 2020), the Solimoes main channel 6.5 to 7.0 (Queiroz et al. 2009), and reviews
      give about 6 to 7.2 for white-water rivers (Val et al. 2022; the Frontiers review of Amazon
      water types). Mixed-water Lake Catalao ranged from 5.86 to 7.47 over a year (Brito et al.
      2014), which the decided range matches, and Andean-influenced tributaries reach 7.6 (Rocha da
      Silva et al. 2019). The measured extremes are wider than the decided range: isolated Mamiraua
      lakes rise to 8.5 at low water through algal photosynthesis, and a Colombian blackwater oxbow
      was acid at 5.3 to 5.7 (Correa 2008); black-water oscars may belong to the uncertain A.
      rubroocellatus. FishBase gives 6 to 8 without saying whether it is a habitat value, and
      Seriously Fish 6.0 to 7.5 for aquarium fish.
    sources:
      - *janauaca
      - *queiroz
      - *val

        Two of three proposals and the 35 cm of Seriously Fish support 35 cm for well-kept males;
        checker-a set 33 cm within its own range of 30 to 35 cm. The female value is unanimous.
    - field: features.aggressionConspecific
      proposals:
        - {by: generator, value: 3}
        - {by: checker-a, value: 2}
        - {by: checker-b, value: 3}
      decision: 3
      rationale: >-
        Once a pair forms, the other adults are chased persistently and have to be removed
        (Seriously Fish), and rivals fight by jaw-locking (Animal Diversity Web). That is the
        persistent chasing with injuries in too little space of level 3; checker-a itself noted a
        tendency to 3 during breeding, which is the normal state of an adult pair.
    - field: features.aggressionHeterospecific
      proposals:
        - {by: generator, value: 2}
        - {by: checker-a, value: 2}
        - {by: checker-b, value: 3}
      decision: 2
      rationale: >-
        Seriously Fish, Aquarium Glaser and Fishipedia describe the oscar as fairly calm towards
        other species for its size; checker-b chose 3 cautiously on the strength of a forum post
        and said itself that the sources disagree. Attacks on fish of similar size beyond the own
        territory, as level 3 requires, are not documented.
    - field: features.minTank
      proposals:
        - {by: generator, value: {volumeL: 650, lengthCm: 180, depthCm: 60}}
        - {by: checker-a, value: {volumeL: 600, lengthCm: 180, depthCm: 60}}
        - {by: checker-b, value: {volumeL: 660, lengthCm: 200, depthCm: 55}}
      decision: {volumeL: 650, lengthCm: 180, depthCm: 60}
      rationale: >-
        Two proposals agree on 180 x 60 cm for a pair, in line with Flowgrow (160 to 180 cm) and
        the single-fish base of Seriously Fish; 180 x 60 x 60 cm holds about 650 L, close to the
        600 L minimum of Fishipedia. Checker-b's 200 cm was an extrapolation without a source.
    - field: features.lifespanYears
      proposals:
        - {by: generator, value: {min: 10, max: 15}}
        - {by: checker-a, value: {min: 10, max: 20}}
        - {by: checker-b, value: {min: 10, max: 20}}
      decision: {min: 10, max: 20}
      rationale: >-
        Seriously Fish gives 10 to 20 years, and the generator's own prose mentions oscars reaching
        20; the narrower 10 to 15 years was the overlap with a general hobby page.

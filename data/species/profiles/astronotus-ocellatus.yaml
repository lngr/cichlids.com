  ghDgh:
    value: {min: 0, max: 2}
    confidence: medium
    rationale: >-
      The three votes agree (generator 0.4 to 2, checker-a 0.3 to 2, checker-b 0.5 to 2.5); the
      median of their bounds is 0.4 to 2 dGH, which the vote count rounds to whole degrees, 0 to 2
      dGH. Amazonian white water is very soft. With dGH = Ca/7.14 + Mg/4.34, the calcium and
      magnesium of Lake Catalao give 0.3 to 1.1 dGH as seasonal means (Brito et al. 2014) and 0.8 to
      1.7 dGH over ten years of sampling (Aprile and Darwich 2013); the Solimoes main channel gives
      1.4 to 2.3 dGH (Queiroz et al. 2009); calcium in the water of the Lake Janauaca collection site
      alone gives about 1 dGH (Duncan et al. 2020). Val et al. (2022) state calcium below 10 mg/L for
      virtually all Amazon waters. Magnesium was not measured everywhere, so the upper bound is
      partly an estimate.

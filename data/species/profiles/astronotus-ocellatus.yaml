        value: {volumeL: 322, lengthCm: 120, depthCm: 45}
        note: 55 US gallons for one fish plus 30 for each further fish

  lifespanYears:
    value: {min: 10, max: 20}
    confidence: medium
    rationale: >-
      Seriously Fish gives a typical life of 10 to 20 years, Fishipedia 12 years and Fishkeeping
      World 8 to 15 years in captivity. Oscars mature at about one year and stay reproductive for 9
      to 10 years (Yilmaz and Arslan, Animal Diversity Web); well-kept fish often live beyond 15.
    sources:
      - *sf
      - *fishipedia
      - *yilmaz
      - *adw
      - *fkw
    evidence:

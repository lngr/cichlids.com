  validName: Astronotus ocellatus
  genus: Astronotus
  species: ocellatus
  author: (Agassiz, 1831)
  source: &cof
    kind: catalog-of-fishes
    title: Eschmeyer's Catalog of Fishes, species of the genus Astronotus (online version updated 21 Sep. 2026)
    url: https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Astronotus
    archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-8267b6c1/2026-10-14T094439Z
    accessed: 2026-10-12
  synonyms:
    - name: Lobotes ocellatus
      note: Original combination of Agassiz in Spix and Agassiz (1831).
    - name: Acara compressus
      note: Cope 1872, Rio Ambyiacu, Peru; synonym according to the Catalog of Fishes.
    - name: Acara hyposticta
      note: Cope 1878, Peru; synonym according to the Catalog of Fishes.
    - name: Astronotus orbiculatus
      note: Haseman 1911, Santarem; synonym according to the Catalog of Fishes.
    - name: Astronotus ocellatus var. zebra
      note: Pellegrin 1904, Santarem; synonym according to the Catalog of Fishes.
    - name: Cychla rubroocellata
      note: >-
        Jardine 1843, Rio Negro and tributaries. Kullander (2003) treats it as a synonym; the Catalog
        of Fishes gives its status as uncertain because Lozano et al. (2022) consider it possibly
        valid as Astronotus rubroocellatus.
  legacyNames:
    - Astronotus ocellatus
  note: >-
    The Catalog of Fishes treats Astronotus ocellatus as valid in a narrow sense, restricted to the
    Amazon basin of Brazil, Bolivia, Colombia, French Guiana and Peru. Astronotus crassipinnis
    (Paraguay and Guapore drainages) and Astronotus mikoljii (lower Orinoco and Gulf of Paria
    basins, described by Lozano et al. 2022) are separate valid species. The Rio Negro form, named
    Cychla rubroocellata by Jardine, has uncertain status and may be a species of its own; DNA
    barcodes also split the remaining Amazonian populations into several deep lineages (Colatreli et
    al. 2012). This profile uses the narrow concept for habitat data. The aquarium oscar is a line
    bred for decades by commercial farms, mainly in Eastern Europe and East Asia, whose wild origin is
    not documented; Seriously Fish and the USGS point out that trade oscars may belong to another
    Astronotus species than A. ocellatus in the strict sense.


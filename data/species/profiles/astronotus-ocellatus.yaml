  temperatureC:
    value: {min: 26, max: 32}
    confidence: low
    rationale: >-
      The five votes did not settle on one range: generator 24 to 32 C, checker-a 24 to 32 C,
      checker-b 27 to 31 C, tiebreaker-1 26 to 32 C and tiebreaker-2 26 to 31 C. No range reached
      four agreeing votes, so the vote count takes the median of the proposals. The minima 24, 24,
      26, 26 and 27 give a median of 26 C, the maxima 31, 31, 32, 32 and 32 give a median of 32 C,
      hence 26 to 32 C. The decided range covers the sustained temperature of the white-water
      floodplain where the species lives: the water at the Lake Janauaca collection site of wild
      oscars measured 27.5 plus or minus 0.8 C (Duncan et al. 2020), the Solimoes main channel 28.9
      to 30.1 C (Queiroz et al. 2009), Lake Catalao 27.8 to 32.0 C in diel profiles (Caraballo et
      al. 2014), and reviews give 28 to 31 or 28 to 32 C for Amazonian waters (Val et al. 2022; the
      UBC thesis). The measured extremes are wider than the decided range: a cold-air friagem cooled
      Lake Catalao to 24.5 C for a few days (Brito et al. 2014), the Colombian oxbow lake fell to
      24.4 C (Correa 2008), and sun-heated shallows of Mamiraua lakes and that oxbow lake reached 34
      to 37 C at low water (Mamiraua study 2015; Correa 2008). The FishBase entry of 22 to 25 C comes
      from an aquarium atlas and is no habitat value. No temperature series from an oscar locality
      over a full flood cycle was found, hence the low confidence.

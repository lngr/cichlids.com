  khDkh:
    value: {min: 1, max: 2}
    confidence: medium
    rationale: >-
      The three votes agree (generator 0.7 to 2.4, checker-a 0.7 to 2.5, checker-b 0.5 to 2); the
      median of their bounds, rounded to whole degrees, is 1 to 2 dKH. Bicarbonate is the main anion
      of white water, but there is little of it: Lake Catalao carries 15.3 mg/L at rising water to
      52.8 mg/L at low water, 0.7 to 2.4 dKH with dKH = mg/L HCO3 / 21.8 (Brito et al. 2014); the
      Solimoes, which floods the lakes, carries 0.5 to 0.6 meq/L, 1.4 to 1.7 dKH (Caraballo et al.
      2014), and 19 to 37 mg/L, 0.9 to 1.7 dKH, in the stretch above Manaus (Queiroz et al. 2009).
      Val et al. (2022) and Aprile and Darwich (2013) describe these waters as poorly buffered.
    sources:
      - *catalao
      - *friagem
      - *queiroz
      - *aprile
      - *val
    evidence:
      - source: *catalao
        value: {min: 0.7, max: 2.4}

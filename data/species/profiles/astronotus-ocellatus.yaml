    tolerance:
      value: {min: 22, max: 32}
      confidence: low
      rationale: >-
        The five votes did not settle on one tolerance: generator, checker-a and tiebreaker-1
        proposed 22 to 32 C, checker-b 20 to 31 C and tiebreaker-2 20 to 30 C. The vote count takes
        the intersection of all proposals, 22 to 30 C, and widens it to contain the natural range of
        26 to 32 C, which gives 22 to 32 C. The lower bound is the value most care sources share (FishBase,
        Animal Diversity Web, Aqualog, Fishipedia; Seriously Fish goes down to 20 C), and the cold
        side is the real risk: the lower lethal limit lies near 12 C (USGS), and feral Florida stocks
        collapse after cold winters. Care sheets stop at 25 to 28 C, but wild oscars live for months
        in water of 28 to 32 C, so the tolerance follows the habitat on the warm side. Short-term
        survival from 9 to 41 C in experiments (Gutierre et al. 2016) says nothing about keeping fish
        for years and does not widen the range. Most keepers hold oscars at 25 to 28 C.

      - source: *fishipedia
        value: moderate
      - source: *crc
        value: moderate
        note: intermediate aquarists
      - source: *fkw
        value: moderate
        note: moderate care level, not for beginners

partners:
  suitable:
    - species: Heros severus
      reason: Large, sturdy South American cichlid from soft Amazonian water, too big to be eaten.
      condition: Tank of at least 200 cm; add both while young.
    - species: Pterygoplichthys gibbiceps
      reason: Heavily armoured bottom dweller that grows as large as the oscar and is left alone.
    - species: Metynnis argenteus
      reason: Deep-bodied schooling characin from the same waters; adults are too tall to swallow.
      condition: Only adult fish of 12 cm or more, kept as a group.
    - species: Platydoras armatulus
      reason: Armoured, nocturnal catfish that the oscar cannot eat or harm.
    - species: Geophagus altifrons
      reason: Large, peaceful eartheater of the Amazon that tolerates the oscar's presence.
      condition: Very large tank with open sand; keep the eartheaters as a group.
  unsuitable:
    - species: Paracheirodon innesi
      reason: Small tetras are prey.
    - species: Pterophyllum scalare
      reason: Young and medium angelfish are eaten; adults are harassed and outcompeted at feeding.
    - species: Symphysodon aequifasciatus
      reason: Slow, shy feeders that starve next to a greedy oscar and suffer from its waste load.
    - species: Tropheus moorii
      reason: Aufwuchs grazer from hard alkaline water that bloats on the oscar's protein-rich food.
    - species: Maylandia zebra
      reason: Mbuna need hard alkaline water and a herbivorous diet; small adults are eaten.
    - species: Parachromis dovii
      reason: Much more aggressive predator that injures or kills oscars.

profile:
  overview:
    text: >-
      The oscar is one of the best-known large cichlids and has been bred in huge numbers for
      decades. Wild fish are olive brown with orange blotches and a large ringed spot on the tail
      base; the trade mostly offers bred lines such as tiger, red, albino and long-finned oscars.
      Oscars recognise their keeper, beg for food and often rearrange their tank, which makes them
      popular pets. They are not community fish for ordinary tanks, though: they reach 30 to 35 cm,
      live 10 to 20 years, eat any fish that fits into their mouth and need a tank of several
      hundred litres with powerful filtration. The genus holds several species, and the name
      Astronotus ocellatus belongs in the strict sense to the Amazon basin populations; the aquarium
      oscar is a farm-bred line of undocumented wild origin sold under this name. Many oscars end up
      abandoned once they outgrow their tank, so buyers should plan for the adult size from the
      start.
    sources: [*cof, *sf, *fishbase, *usgs, *wiki]
  habitat:
    text: >-
      In the wild the oscar lives in the Amazon basin of Brazil, Peru, Colombia, Bolivia and French
      Guiana. It prefers calm, shallow water of floodplain lakes, oxbows and side channels, mostly in
      muddy white-water areas where it hides under submerged branches, roots and floating vegetation
      over mud or sand. The water is warm, mostly 26 to 32 C, with brief drops to about 25 C during
      cold-air spells and higher readings only in sun-heated shallows. It is very soft (below 2 dGH,
      1 to 2 dKH) and slightly acidic to neutral, about pH 5.9 to 7.5. Oxygen is often low, and the oscar
      copes with long phases of hypoxia better than most fishes. Spawning starts with the rising
      water of the rainy season, when the forest floods. The Orinoco and Paraguay populations belong
      to separate species, and introduced oscars live in Florida, Hawaii, Puerto Rico and other warm
      regions.
    sources: [*cof, *sf, *janauaca, *queiroz, *catalao, *friagem, *tavares, *usgs]
  sizeAndGrowth:
    text: >-
      Oscars grow fast and mature at about 12 to 25 cm, at an age of roughly one to two years. Adult
      males in the aquarium usually reach about 35 cm in total length, females a little less.
      Records of about 45 cm and 1.6 kg come from wild fish, while many aquarium fish stop at 25 to
      30 cm, especially when kept in tanks that are too small. Growth slows after the second year,
      but a healthy oscar keeps gaining weight for several years. With good care they live 10 to 20
      years.
    sources: [*sf, *fishbase, *yilmaz, *adw, *tavares]
  husbandry:
    text: >-
      A pair of adult oscars needs a tank of at least 180 x 60 cm and about 650 L; a single fish can
      manage with 150 cm. Use a soft sand substrate, a few large roots and smooth stones, and fix all
      decoration firmly because oscars dig and move objects. Plants are often uprooted; floating
      plants or epiphytes on wood last longest. Oscars produce a lot of waste, so filter capacity
      should be generous and 30 to 50 percent of the water should be changed every week. Heaters
      are best placed outside the tank or behind a guard, since large oscars can break them.
      Captive-bred oscars accept a wide range of water: 22 to 32 C (most keepers use 25 to 28 C), pH
      about 6 to 8, and soft to fairly hard water up to about 20 dGH and 12 dKH, as long as nitrate
      stays low. Temperatures below 22 C are a real risk for this warm-water fish.
    sources: [*sf, *yilmaz, *fishbase, *adw, *usgs]
  socialBehavior:
    text: >-
      Young oscars live in loose groups and are fairly tolerant of each other. As they mature they
      pair off, and a pair then claims a large part of the tank and drives the other oscars away.
      Rivals display with spread fins and changing colours and wrestle mouth to mouth; a defeated
      fish turns dark with pale bars, which signals submission. In a tank of normal size only one
      pair or a single fish should remain. Towards other species the oscar is calmer than many
      large cichlids, but it chases fish out of its space and becomes rough while breeding. It
      prefers dim light and gets nervous in bright, open tanks.
    sources: [*sf, *adw, *beeching, *glaser, *yilmaz]
  diet:
    text: >-
      In nature oscars eat mainly insects and their larvae, shrimp, crayfish and snails, plus small
      fish, mostly slow bottom-dwelling catfish; fruit and seeds that drop into the water are taken
      in season. In the aquarium a high-quality pellet for large cichlids makes a good staple,
      supplemented with earthworms, shrimp, mussels, insects such as crickets and occasional
      vegetable matter or fruit. Oscars need vitamin C in their food. Avoid beef heart and poultry,
      which fatten the liver, and do not use feeder goldfish or livebearers, which bring in disease
      and contain little nutrition. Oscars are greedy and learn to beg, so feed small portions and
      remove leftovers to protect the water quality.
    sources: [*uakari, *tavares, *fishbase, *sf, *yilmaz]
  breeding:
    text: >-
      The easiest way to obtain a pair is to raise six or more young oscars together and remove the
      others once two fish have paired. Before spawning, both partners show short breeding tubes and
      clean a flat stone or similar surface for days. The female then lays rows of eggs, from a few
      hundred in young fish to about two thousand in large ones, and the male fertilises them. Both
      parents guard and fan the eggs, which hatch after two to four days. The larvae are moved into
      pits in the sand and swim free after about a week. Because one spawn can produce more young
      than the hobby can absorb, breeding should be planned.
    sources: [*sf, *adw, *fishbase, *wiki]
  sexing:
    text: >-
      Oscars are very hard to sex from outside. In wild populations males are sometimes a little
      larger and more colourful, and some keepers report dark spots at the base of the male's dorsal
      fin, but these traits are unreliable, especially in bred lines. The only clear sign appears
      shortly before spawning: the female's breeding tube is short and broad with a blunt tip, while
      the male's is narrower and pointed. Because of this, keepers usually let pairs form on their
      own in a group of young fish instead of trying to choose a male and a female.
    sources: [*sf, *adw, *wiki]
  compatibility:
    text: >-
      Oscars can share a large tank with fish that are too big to be swallowed and robust enough to
      stand their size and occasional chases. Good choices are severums, large eartheaters, adult
      silver dollars and other deep-bodied characins, and armoured catfish such as large plecos or
      Raphael catfish. Any fish shorter than about a third of the oscar's length will sooner or
      later be eaten, so tetras, small livebearers and dwarf cichlids are out. Slow or shy feeders
      such as discus and angelfish do poorly. Very aggressive Central American predators can injure
      or kill oscars. African lake cichlids need hard alkaline water and, in the case of mbuna and
      Tropheus, a plant-based diet, so they do not fit either.
    sources: [*sf, *glaser, *fkw, *arch60]
  problems:
    text: >-
      The most common mistake is a tank that is too small: oscars grow quickly, and cramped fish
      suffer from poor water, stunted growth and stress. High nitrate and organic waste are linked
      to head and lateral line erosion (hole in the head), which also occurs with diets lacking
      vitamins. A one-sided diet of feeder fish or mammal meat can lead to nutritional deficiencies
      and fatty liver, and feeder fish bring in parasites. Wild and imported fish frequently carry
      gill flukes and other parasites, so quarantine is advisable. Oscars are sensitive to cold, so
      a failing heater in a cool room is dangerous.
    sources: [*sf, *yilmaz, *tavares, *usgs, *arch59, *fkw]


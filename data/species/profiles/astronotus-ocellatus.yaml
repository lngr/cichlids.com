        value: {min: 10, max: 20}
      - source: *fishipedia
        value: {min: 12, max: 12}
      - source: *yilmaz
        value: {min: 10, max: 11}
        note: reproductive span of 9 to 10 years after maturity at one year
      - source: *fkw
        value: {min: 8, max: 15}
        note: in captivity

  breeding:
    value: open-substrate-spawner
    confidence: high
    rationale: >-
      Both parents clean a flat stone or similar hard surface, spawn up to about two thousand
      adhesive eggs on it, guard them and move the larvae into pits in the sand.
    sources:
      - *fishbase
      - *sf
      - *adw
      - *fishipedia
      - *flowgrow
      - *crc
    evidence:
      - source: *fishbase
        value: open-substrate-spawner
      - source: *sf
        value: open-substrate-spawner
      - source: *adw
        value: open-substrate-spawner
      - source: *fishipedia
        value: open-substrate-spawner
      - source: *crc
        value: open-substrate-spawner
        note: open substrate

  beginnerSuitability:
    value: moderate
    confidence: medium
    rationale: >-
      Oscars are hardy and undemanding about water chemistry, but they grow fast to 30 cm and more,
      live long, need a very large tank with strong filtration and frequent water changes,
      rearrange the decoration and eat small tankmates. Seriously Fish and Fishipedia rate them as
      moderate, the Cichlid Room Companion as fish for intermediate aquarists.
    sources:
      - *sf
      - *fishipedia
      - *crc
      - *fishbase

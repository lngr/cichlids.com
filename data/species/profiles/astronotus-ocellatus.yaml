    - field: taxonomy.synonyms
      proposals:
        - by: generator
          value: [Lobotes ocellatus, Acara compressus, Acara hyposticta, Astronotus orbiculatus, Astronotus ocellatus var. zebra, Cychla rubroocellata]
        - by: checker-a
          value: ["Lobotes ocellatus Agassiz, 1831", "Acara compressus Cope, 1872", "Acara hyposticta Cope, 1878", "Astronotus orbiculatus Haseman, 1911", "Astronotus ocellatus var. zebra Pellegrin, 1904", "Cychla rubroocellata Jardine, 1843"]
        - by: checker-b
          value: [Lobotes ocellatus, Acara hyposticta, Astronotus orbiculatus, Astronotus ocellatus var. zebra, Cychla rubroocellata, Acara compressus]
      decision: [Lobotes ocellatus, Acara compressus, Acara hyposticta, Astronotus orbiculatus, Astronotus ocellatus var. zebra, Cychla rubroocellata]
      rationale: >-
        All three list the same six names and differ only in form; the names stay without author,
        which goes into the note. Cychla rubroocellata stays in the list with a note, because the
        Catalog of Fishes gives it as uncertain rather than as a valid species.
    - field: features.origin.value.localities
      proposals:
        - by: generator
          value: ["Solimoes-Amazon floodplain lakes, Brazil", "Ucayali and Peruvian Amazon", "Lower Amazon near Santarem, Brazil", "Amazon tributaries in Amapa, Brazil", "French Guiana (Approuague, Oyapock)"]
        - by: checker-a
          value: [Rio Solimoes and Amazonas floodplains, Rio Ucayali, Rio Madeira, Rio Tapajos, Rio Tocantins]
        - by: checker-b
          value: [Rio Solimoes varzea (Mamiraua), Lake Janauaca, Rio Negro drainage]
      decision: ["Rio Solimoes floodplain lakes (Mamiraua, Janauaca)", "Rio Ucayali, Peru", Lower Rio Madeira, Rio Tapajos, Rio Tocantins, Lower Amazon near Santarem, "French Guiana (Approuague, Oyapock)"]
      rationale: >-
        The proposals describe the same Amazonian range and are merged with the river systems
        Seriously Fish names and the sampled floodplain lakes. The Rio Negro is left out because its
        oscars may be the uncertain A. rubroocellatus, the upper Madeira because its lineage is
        assigned to A. crassipinnis (Colatreli et al. 2012), and Amapa because no source read
        names a locality there beyond the Oyapock.

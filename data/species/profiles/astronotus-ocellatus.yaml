      votes: {agree: 3, total: 3}
    tolerance:
      value: {min: 1, max: 12}
      confidence: low
      rationale: >-
        The five votes did not settle: generator 0.7 to 15, checker-a 0.7 to 20, checker-b 0.5 to
        12, tiebreaker-1 0.5 to 12 and tiebreaker-2 1 to 15 dKH; at most two of them agree. The vote
        count takes the intersection of all proposals, 1 to 12 dKH, which contains the natural
        range. No care source read for this profile states a carbonate hardness for oscars: Seriously
        Fish and FishBase give only general hardness (5 to 20 dGH), Flowgrow fills its field with a
        very wide 0 to 30, and Fishkeeping World labels the same 5 to 20 as dKH in one place and dGH
        in another. Tap water within the accepted general hardness and a pH up to 8 typically carries
        up to about 10 to 12 dKH, in which captive oscars are widely kept; the upper bound is
        inferred from this, the lower bound from the habitat. The evidence is thin, hence the low
        confidence.
      sources:

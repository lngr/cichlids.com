variants:
  - name: Wild type
    kind: color-morph
    note: Olive to dark brown body with orange blotches and a large ringed spot on the tail base.
  - name: Tiger oscar / Red tiger oscar
    kind: color-morph
    note: Bred line with irregular red to orange marbling on a dark body.
  - name: Red oscar
    kind: color-morph
    note: Bred line in which red covers most of the flanks.
  - name: Albino oscar
    kind: color-morph
    note: White body, often with red or orange marbling (albino tiger, albino red).
  - name: Lemon oscar
    kind: color-morph
    note: Xanthistic line with yellow instead of red markings.
  - name: Long-finned oscar
    kind: color-morph
    note: Bred line with elongated fins; less able to compete for food than standard forms.
  - name: Colombia
    kind: locality
    note: Wild-caught juveniles occasionally imported from the Colombian Amazon.

features:
  origin:
    value:
      continent: South America
      region: Amazon basin
      waterbody: null
      localities:
        - Rio Solimoes floodplain lakes (Mamiraua, Janauaca)
        - Rio Ucayali, Peru
        - Lower Rio Madeira
        - Rio Tapajos
        - Rio Tocantins
        - Lower Amazon near Santarem
        - French Guiana (Approuague, Oyapock)
    confidence: high
    rationale: >-
      The Catalog of Fishes gives the Amazon basin of Brazil, Bolivia, Colombia, French Guiana and
      Peru as the range of the species in its narrow sense; Seriously Fish and FishBase agree on the
      Amazon. The localities combine the river systems Seriously Fish lists with the floodplain lakes
      where field studies sampled the species (Mamiraua, Janauaca). Records from the Orinoco belong to
      A. mikoljii and those from the Paraguay system to A. crassipinnis. The Rio Negro is left out
      because the oscars there may be the uncertain A. rubroocellatus, and the upper Madeira in
      Bolivia holds a lineage that Colatreli et al. (2012) assign to A. crassipinnis. The species is
      not endemic to a water body of the table, so no lake values apply.

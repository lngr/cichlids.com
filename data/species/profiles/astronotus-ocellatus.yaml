    rationale: >-
      All three votes give level 2. Fish are a regular but not the dominant food: in 182 stomachs from
      the Mamiraua varzea insects and fish were the most important items (Trindade and Queiroz 2012),
      wild oscars of an Amazon tributary feed on fish, crustaceans, snails and insect larvae
      (Tavares-Dias and Neves 2017), and in the congener A. crassipinnis fish make up 36 to 41
      percent of the adult stomach contents. FishBase lists small fish next to crayfish, worms and
      insect larvae, and the Cichlid Room Companion confirms a piscivorous component. In the tank
      even small juveniles take guppies (Aquarium Glaser), and Seriously Fish warns against much
      smaller tankmates. Any fish that fits into the large mouth is at risk; fish are not the main
      food, so level 3 does not apply.

partners:
  suitable:
    - species: Julidochromis transcriptus
      reason: A smaller rock-dweller uses a different zone while sharing alkaline-water needs.
      condition: Provide a defined rock territory with clear separation from the schooling area; monitor its
        breeding defence.
    - species: Neolamprologus multifasciatus
      reason: A bottom-dwelling shell colony leaves the upper swimming area for leptosoma.
      condition: Provide a dedicated shell bed and adequate footprint; no guarantee of survival for all newborn fry.
    - species: Altolamprologus calvus
      reason: A relatively restrained rock-dweller can share an adult leptosoma community.
      condition: "Use a suitably spacious tank with separate refuges; it may take leptosoma fry, so unsuitable for
        maximum fry production."
  unsuitable:
    - species: Cyphotilapia frontosa
      reason: A large fish predator can treat slender leptosoma as prey.
    - species: Maylandia zebra
      reason: Boisterous territorial mbuna may intimidate the school and monopolise feeding opportunities.
    - species: Cyprichromis sp. 'leptosoma jumbo'
      reason: Aquarium mixing warnings indicate a presumed crossing risk and strain identity problem; larger adults
        also alter space planning.
    - species: Cyprichromis coloratus
      reason: Presumed pairwise crossing caution from close relationship; no confirmed named hybrid or free
        partner-choice cross was found.
profile:
  overview:
    text: A shoal of Cyprichromis leptosoma adds midwater activity to a calm Tanganyika community. Adults are
      slender plankton feeders; males carry stronger blue and yellow accents than females. Local colour labels
      matter for strain identity but do not define separate species. This profile covers described leptosoma
      rather than every fish sold as Jumbo. Cyprichromis coloratus and C. pavo are separate valid species.
    sources:

      retained. FishBase instead lists 8.0 to 9.0 as a general species interval; this is contrasting database
      information rather than a replacement for limnological measurements. Original lake-study citations are
      retained from the supplied pipeline record. Direct adjudicator checks used the accessible Plisnier

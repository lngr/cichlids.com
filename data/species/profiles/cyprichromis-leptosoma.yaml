    tolerance:
      value:
        min: 23
        max: 29
      confidence: low
      verification:
        method: unanimous
        votes:
          agree: 4
          total: 4
      rationale: "The unanimous tolerance decision is 23 to 29 C with low confidence. Generator, checker-b and
        checker-c propose 23 to 29 C; checker-a proposes the wider 22 to 29 C interval. The 1 C difference
        counts as agreement and the median lower bound is 23 C. Seriously Fish recommends 24 to 27 C,
        FishProfiles 23 to 26 C and The Tropical Tank 22 to 25 C. The latter supports the rejected cooler
        endpoint, but supplies no multi-year comparison. Inclusion of the natural maximum widens the aquarium
        recommendations to 29 C; continuous years at that endpoint are unproven. Stable routine care near 24
        to 26 C has better support."

  socialBehavior:
    text: "Keep a school with more females than males and room for subordinate fish to retreat. Breeding males
      defend sizable volumes in midwater and regularly exclude rivals, producing a hierarchy. Chasing is
      normally manageable with adequate space, but sustained harassment and biting have been reported. Calm
      bottom-dwelling companions usually attract little aggression. A fish that cannot feed or escape repeated
      pursuit indicates that the current group or layout needs attention."

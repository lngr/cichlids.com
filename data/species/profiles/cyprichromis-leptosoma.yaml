  note: "Cyprichromis leptosoma remains valid. The Catalog of Fishes recognizes C. coloratus Takahashi and Hori
    2006 and C. pavo Büscher 1994 as separate species, not synonyms or locality forms of leptosoma. The
    lectotype is from Mbity Rocks; Kinyamkolo is represented among the original material. The original genus
    Paratilapia was also queried but its current genus list does not return this transferred species. Jumbo
    trade labels cover several undescribed forms and are not interchangeable with either described relative."

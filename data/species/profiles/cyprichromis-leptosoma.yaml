    rationale: "Qualified-majority verification selects level 0 with high confidence, five of six votes.
      Generator, checker-a, checker-c and both tie-breakers propose 0; checker-b proposes 1 from the
      Destination Tanganyika account of repeated consumption of exposed Neolamprologus caudopunctatus and
      Variabilichromis moorii fry. That first-hand account is a real contrary observation, not disproved by
      survival of the species' own fry. Seriously Fish reports released young usually coexisting with adults;
      Maidenhead Aquatics independently describes the same pattern, while FishBase establishes a
      small-invertebrate feeding niche. These support the decided baseline without routine fish feeding. Level
      0 permits incidental fry losses and is not a guarantee that another species' exposed fry are safe.
      Guidarium's unsupported fry-predator flag adds weak contrary evidence and its sand-sifting claim is
      biologically inconsistent."

  sexing:
    text: Mature males are usually identified by stronger blue and yellow head and fin colours; females remain
      subdued brown or silvery. Young males can resemble females before their display colours develop. Tail
      colour alone cannot identify a locality or a distinct species because blue and yellow tails may coexist
      within a population. Retain collection or breeder records when maintaining a locality line.

    confidence: high
    rationale: "All four agree on Lake Tanganyika endemism. Generator provides regional and trade localities,
      checker-a the type-material localities, checker-b regional shores and checker-c no locality list. The
      final list combines catalog type-material records with Anderson et al.'s sampled Kalambo breeding
      school; it is illustrative, not the full distribution. Tanganyika.si supports eastern and southern rocky
      coasts. Trade locality labels alone do not identify all larger Jumbo stock."

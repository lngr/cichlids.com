  problems:
    text: "A school can lose condition when swimming room, social refuge or access to fine food is inadequate.
      Jumping during displays makes a secure cover important. Repeated pursuit and bites require changes to
      space or group structure. Mouthbrooding females may lose a brood after disturbance, and rough handling
      can damage their mouths. Test water quality and review recent changes when breathing, appetite or
      behaviour deteriorates. GH figures must not be substituted for KH; both measurements matter when
      preparing stable alkaline water."

  diet:
    text: "The natural diet centres on small animal plankton and crustaceans. Offer fine complete pellets or
      crumbled flakes and suitably small live or frozen foods such as Artemia, Daphnia and Cyclops. Newly
      hatched Artemia also suits released young. This is an invertivore, with no established special
      high-protein bloat restriction. That classification does not imply resistance to digestive illness.
      Observe each fish taking food, especially after introduction, and avoid excess portions."

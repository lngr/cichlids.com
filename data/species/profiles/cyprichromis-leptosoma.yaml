  hybridGroups:
    value:
      - cyprichromis-coloratus-leptosoma
      - cyprichromis-leptosoma-jumbo
    confidence: low
    rationale: "Conservative verification retains the union of pairwise identifiers supported by at least two
      votes, with low confidence and a displayed tally agreement of three of six. Generator and both
      tie-breakers propose leptosoma-jumbo plus leptosoma-coloratus; checker-a proposes no group; checker-b
      proposes a genus-wide cyprichromis group including pavo; checker-c proposes only leptosoma-coloratus.
      Four votes mention leptosoma-coloratus and three mention leptosoma-jumbo, while the genus group has one
      vote. Seriously Fish warns of ordinary leptosoma crossing with Jumbo forms without naming a verified
      parental pair or showing access to conspecific partners; FishProfiles supports distinct Jumbo identity,
      not a cross. Anderson et al. establish a close coloratus relationship and Baldo et al. explicitly call
      them sister species, meeting the rubric's presumed relationship basis. A mixed wild school, transferred
      fry and multiple paternity establish neither interspecific offspring nor a free-choice cross. Behrens et
      al. sampled dwarf jumbo, not a verified leptosoma-jumbo equivalent; shared sex chromosomes are not
      crossing evidence. Both decided groups therefore have basis presumed. Coloratus and pavo remain valid
      species; neither a named leptosoma-pavo cross nor genus-wide evidence accepted by two votes establishes
      an additional group. The RH1 study places pavo in a deeper basal lineage, without testing crossability.
      Pairwise membership does not imply Jumbo-coloratus crossing."

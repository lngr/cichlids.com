  temperatureC:
    value:
      min: 23
      max: 29
    confidence: high
    rationale: "The fixed lake-wide natural envelope is 23 to 29 C. Plisnier et al. report dry-season and
      wet-season surface means of 24.4 and 27.2 C at Mpulungu, with cooling from upwelling. These means
      corroborate seasonal variation but do not individually establish the full envelope. The original Verburg
      buoy extremes of 23.85 to 29.01 C supplied with the lake decision round to its broader bounds; the
      DOI-only OA tool could not retrieve that report independently. The natural decision is retained without
      substituting a narrower care-sheet range. Original lake-study citations are retained from the supplied
      pipeline record. Direct adjudicator checks used the accessible Plisnier annual-cycle publication,
      Langenberg thesis and Branchu ion study; the DOI-only OA tool did not provide the DOI-less FAO reports,
      and Cohen full text was refused as not open access."

      rationale: "Generator proposes 300 L and 130 by 45 cm; checker-a 240 L and 120 by 45; checker-b 300 L and 150
        by 45; checker-c 243 L and 120 by 45. Retain 300 L and 130 by 45 for at least eight true leptosoma
        adults as a cautious combined recommendation. Tanganyika.si explicitly supplies 300 L and 130 cm for
        at least twelve; using that space for eight gives room for male display territories. Seriously Fish
        supplies 120 by 45 by 45 cm, about 243 gross litres, as a smaller minimum. Destination Tanganyika
        prefers 450 L and 150 cm for two males and five females, a useful larger recommendation rather than
        evidence that every group requires that footprint. The roughly 151 L breeder example includes Kekese
        trade stock and is not used as a true-species minimum. Front-to-back depth remains 45 cm and volume is
        a separate minimum requiring sufficient water height. CRC confirms 130 cm independently, for
        verification only."

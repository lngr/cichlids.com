  husbandry:
    text: "Provide at least 300 L, 130 cm length and 45 cm front-to-back depth for a group of eight or more, with
      enough water height to meet the volume requirement. Keep a continuous open swimming area above
      restrained rockwork and cover escape openings. More room benefits several reproductive males. Routine
      temperatures around 24 to 26 C have stronger care support than constant exposure to 29 C. Recorded
      tolerances are 23 to 29 C, pH 7.8 to 9.4, GH 8 to 25 dGH and KH 6 to 20 dKH. Temperature and KH
      endpoints remain weakly established; these are planning envelopes rather than targets. Maintain stable
      prepared water, effective filtration and good oxygenation."

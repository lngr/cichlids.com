  compatibility:
    text: "Calm Tanganyika rock and shell dwellers can share a suitably sized adult community. Small
      Julidochromis, a separated shell colony and adult Altolamprologus are possible combinations, with
      attention to breeding defence and fry losses. Large fish predators and boisterous mbuna are poor
      matches. The decided predation baseline is 0, but a specialist keeper reported attacks on exposed fry of
      other species, so fry safety cannot be assumed. Both curated crossing cautions, with coloratus and with
      leptosoma jumbo, are presumed. No verified named cross with pavo was established; lack of a listed
      conflict is not experimental proof of reproductive isolation."

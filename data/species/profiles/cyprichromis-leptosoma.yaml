        - by: checker-b
          value: normal
        - by: checker-c
          value: normal
      decision: normal
      rationale: "Generator, checker-b and checker-c propose normal; checker-a proposes slow. Repeated capture of
        fine suspended particles and successful prepared-food feeding support normal within a calm community.
        The breeder account is corroborative but may include Jumbo stock. Seriously Fish's caution to watch
        newly introduced fish does not establish persistent food loss as the normal baseline. This is a rubric
        inference without a measured feeding-rate trial."

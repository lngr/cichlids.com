  breeding:
    text: "Females visit displaying males in midwater and collect sperm and eggs into the mouth. The female
      incubates alone, commonly for three to four weeks. A modest brood can develop without an isolated pair
      bond. Brooding females may stop feeding and are vulnerable to stress during capture. Released young can
      take newly hatched Artemia; adults often leave their own fry alone, while predatory companions may
      consume them. Parentage studies found multiple fathers and transferred leptosoma offspring, which do not
      demonstrate interspecific hybrids."

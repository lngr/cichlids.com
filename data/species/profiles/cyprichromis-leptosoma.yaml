      magnesium measurements across studies; the read Branchu and Bergonzini Table 2 independently gives 0.273
      mmol/L calcium and 1.611 mmol/L magnesium, about 10.55 dGH using Ca in mg/L divided by 7.14 plus Mg
      divided by 4.34. FishBase lists the wider 9 to 19 dH interval, which does not establish a measured lake
      range. Cohen full text was refused as not open access; its numerical table was not independently
      rechecked. Original lake-study citations are retained from the supplied pipeline record. Direct
      adjudicator checks used the accessible Plisnier annual-cycle publication, Langenberg thesis and Branchu
      ion study; the DOI-only OA tool did not provide the DOI-less FAO reports, and Cohen full text was
      refused as not open access."

  sizeAndGrowth:
    text: "Allow for adult aquarium fish reaching about 11 cm total length in either sex. Published estimates for
      true leptosoma range lower, and a reliable smaller female upper limit is unresolved. Larger Jumbo stock
      can exceed these planning sizes. Colour develops as males mature, so a plain juvenile is not reliably a
      female. Five to eight years is a weak hobby estimate of lifespan, without long-term age records."

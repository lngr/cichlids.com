  habitat:
    text: "The species lives off rocky shores of Lake Tanganyika, with feeding and courtship in the water column
      and refuges nearby. A sampled Zambian breeding school occupied roughly 10 to 14 m depth. Natural lake
      ranges retained here are 23 to 29 C, pH 8.4 to 9.4, GH 10 to 13 dGH and KH 15 to 20 dKH. These represent
      variation across lake measurements, not intended daily aquarium swings. Seasonal upwelling cools
      southern surface water. GH and aquarium KH measure different properties."

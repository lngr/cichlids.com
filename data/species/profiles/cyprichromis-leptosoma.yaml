  khDkh:
    value:
      min: 15
      max: 20
    confidence: high
    rationale: "The fixed natural envelope is 15 to 20 dKH, representing alkalinity measured by aquarium KH tests
      rather than calcium-magnesium hardness. Langenberg cites 6.7 to 6.9 meq/L from Edmond et al., equivalent
      to 18.8 to 19.3 dKH. Branchu and Bergonzini Table 2 gives 6 mmol/L bicarbonate and 0.28 mmol/L
      carbonate, equivalent to 18.37 dKH. These narrower measurements corroborate strong buffering; the wider
      compiled lake bounds are retained. Original lake-study citations are retained from the supplied pipeline
      record. Direct adjudicator checks used the accessible Plisnier annual-cycle publication, Langenberg
      thesis and Branchu ion study; the DOI-only OA tool did not provide the DOI-less FAO reports, and Cohen
      full text was refused as not open access."

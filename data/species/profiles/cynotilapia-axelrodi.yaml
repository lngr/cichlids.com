  habitat:
    text: "Around Nkhata Bay, rocks give way to sand and fish can feed above the bottom while retaining access to\
      \ shelter. FishBase records Nkhata Bay and Chirombo Point; specialist accounts also name Lion's Cove and Mundola\
      \ Point. These locality lists differ in their boundaries. Malawi.si reports the greatest abundance at 4 to\
      \ 10 m and records to 20 m, while FishBase lists 2 to 10 m and Fischlexikon gives a deeper 10 to 25 m interval.\
      \ Provide sand, stable rocks and open water to reflect this combination of habitats. The lake-wide natural\
      \ ranges used here are 21 to 29 C, pH 7.7 to 8.6, GH 3 to 5 dGH and KH 5 to 8 dKH. They combine seasons and\
      \ studies rather than describing one dive site. Alkalinity and mineral hardness are different quantities in\
      \ this lake."

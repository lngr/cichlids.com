  socialBehavior:
    text: "The minimum social unit is one male with at least three females. A male uses a rock-associated cave or\
      \ shallow sand pit as a focal site, and females need routes out of his view. Under that setup, the decided\
      \ conspecific aggression level describes hierarchy and regular chasing, with injuries uncommon when the space\
      \ and cover work. Glaser gives a serious warning about pair keeping, and another care sheet describes stronger\
      \ aggression than the moderate specialist accounts. Watch individual fish rather than relying on the average\
      \ rating. Multi-male groups are possible but require a larger layout with distinct defended sites. Site defence\
      \ is treated as persistent for aquarium planning, although direct evidence for its timing outside breeding\
      \ is limited."
    sources:
    - *id003
    - *id017
    - *id006
    - *id021

  temperatureC:
    value:
      min: 21
      max: 29
    confidence: high
    rationale: "The decided 21 to 29 C is the lake-wide seasonal envelope, rather than a single observation at Nkhata\
      \ Bay. Eccles's readable abstract documents inshore cooling to 21 C and upper-water temperatures near 27 C;\
      \ Vollmer and colleagues describe summer water near 28 C and winter water below 24 C. The retained lake synthesis\
      \ extends the upper bound to 29 C using the later campaign cited by Ngochera. The FAO compilation's single-survey\
      \ 23 to 25 C is narrower and does not describe the full annual cycle. All four natural-range proposals agree;\
      \ retain waterbody verification and high confidence. Eccles's DOI landing page returned HTTP 403 and fetch-oa\
      \ declined the full text, so only the archived Crossref abstract is used directly."
    sources:
    - *id009

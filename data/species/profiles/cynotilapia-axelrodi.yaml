    rationale: "Generator, checker-b and checker-c propose level 2; checker-a proposes 3. The median is 2. Malawi.si\
      \ describes moderate aggression and a keeper reports a functioning multi-female group; these describe the\
      \ recommended social conditions more closely than a warning about an isolated pair. Glaser's warning that\
      \ pair keeping may be fatal and Fischlexikon's severe aggression description remain significant contrary evidence.\
      \ Under the rubric, rate a properly housed one-male harem at 2, while explaining the injury risk when that\
      \ setup fails. Confidence remains medium."

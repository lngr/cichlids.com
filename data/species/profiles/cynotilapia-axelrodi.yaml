      rationale: "Retain 7.5 to 8.7, low confidence and unanimous four-of-four verification under the 0.3-pH agreement\
        \ rule. Generator and checker-c propose 7.5 to 8.8; checker-a and checker-b propose 7.5 to 8.6. The agreeing\
        \ endpoint medians give 7.5 and 8.7. Glaser advises pH above 7.5, while several sheets recommend 7.5 to\
        \ 8.5 and the keeper gives 7.5 to 8.6. The wider FishFish recommendation reaches pH 9.0, and Aqualog's 7.0\
        \ to 8.0 extends below the decision; both remain evidence. The decided interval is a cautious synthesis\
        \ around alkaline keeping practice and the natural maximum of 8.6, not proof of harm at 8.8 or 9.0. The\
        \ inferred endpoints limit confidence."

    rationale: "Generator, checker-a and checker-c propose 2; checker-b proposes 1. The median is 2. Species accounts\
      \ support a limited male territory and compatible Malawi communities, while Fischlexikon reports relatively\
      \ peaceful behaviour towards other species and Aqualog labels aggression without distinguishing its target.\
      \ Chasing fish from the immediate defended site best fits 2; no evidence establishes attacks across the whole\
      \ aquarium. Confidence is medium because the rubric level is inferred from qualitative descriptions."

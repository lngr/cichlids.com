    rationale: "Retain the qualified-majority decision of level 0, with five agreeing votes out of six and medium\
      \ confidence. Generator, checker-b, checker-c, tiebreaker-1 and tiebreaker-2 proposed 0; checker-a proposed\
      \ 1 from general mbuna fry feeding. FishBase and CRC describe plankton feeding, and the correctly linked FishBase\
      \ stock 2519 food table identifies planktonic invertebrates. The review's fry-feeding statement concerns mbuna\
      \ generally and does not establish regular opportunistic consumption of fish up to 2 cm by axelrodi. Incidental\

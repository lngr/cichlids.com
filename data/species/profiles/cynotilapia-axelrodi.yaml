partners:
  suitable:
  - species: Labidochromis caeruleus
    reason: FishFish reports this combination in an aquarium; its contrasting appearance and less forceful behaviour
      make it a plausible choice.
    condition: Use a larger Malawi community layout with separate shelters; the 200 L minimum concerns the axelrodi
      harem alone.
  - species: Iodotropheus sprengerae
    reason: "A provisional choice based on comparable size and relatively moderate mbuna behaviour, without a direct\
      \ pairing report in the read sources."
    condition: Allow enough additional territory for both groups and observe individual aggression.
  unsuitable:
  - species: Maylandia pulpican
    reason: Similar blue-barred males and the historically shared kingsizei label increase rivalry and identification
      problems; a named cross with axelrodi was not established.
  - species: Tropheus moorii
    reason: Its specialised grazing diet makes routine feeding a poor match for this chiefly plankton-feeding species.
  - species: Sciaenochromis fryeri
    reason: "A much larger piscivore introduces a size-dependent risk to small axelrodi. FishFish reports coexistence,\
      \ so this is a precaution against predation on smaller individuals rather than proof that every adult combination\
      \ fails."
    condition: Especially unsuitable with juvenile or undersized axelrodi.
profile:
  overview:
    text: "A male Cynotilapia axelrodi can move from a sheltered rock site into a school feeding above sand, so\
      \ its aquarium needs both shelter and swimming room. This small Lake Malawi endemic comes from the northwestern\
      \ shore. Adult males are blue with darker body and fin markings, while females are smaller and less vivid.\
      \ Plan around a 9 cm male, 7 cm females and a minimum harem of one male with three females. The species is\
      \ relatively accessible among mbuna, but an isolated pair or an unsuitable companion can turn territorial\
      \ behaviour into injury. Its main natural food is animal plankton, with supplementary algae and other small\
      \ foods. Older kingsizei labels can be misleading because they have also been applied to a different species."
    sources:
    - *id003
    - *id002
    - *id005

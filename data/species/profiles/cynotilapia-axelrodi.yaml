        max: 10
    - by: checker-a
      value:
        min: 3
        max: 10
    - by: checker-b
      value:
        min: 3
        max: 10
    - by: checker-c
      value:
        min: 4
        max: 12
    decision:
      min: 4
      max: 10
    rationale: "Retain 4 to 10 dKH, low confidence and unanimous four-of-four verification under the two-degree\
      \ agreement rule. Generator proposes 5 to 10, checker-a and checker-b 3 to 10, and checker-c 4 to 12 dKH.\
      \ The agreeing lower-bound median is 3.5 dKH, rounded to 4; the upper-bound median is 10. The keeper's explicit\
      \ 3 to 10 dKH advice extends below the decision, and checker-c's inferred 4 to 12 extends above it. Hobby\
      \ syntheses describe a narrower 6 to 8 dKH buffering target. No physiological tolerance study was read, so\
      \ the interval is partly inferred from alkaline pH advice and keeping practice, contains the natural 5 to\
      \ 8 dKH, and does not claim demonstrated failure outside its bounds."
  - field: features.maxSizeCm
    proposals:
    - by: generator
      value:
        male: 9
        female: 7
    - by: checker-a
      value:
        male: 9
        female: 7.5
    - by: checker-b
      value:
        male: 9
        female: 7
    - by: checker-c
      value:
        male: 9
        female: 7
    decision:
      male: 9
      female: 7
    rationale: "All four male proposals are 9 cm; female proposals are 7 cm from generator, checker-b and checker-c,\
      \ and 7.5 cm from checker-a. The per-sex medians are 9 and 7 cm. Malawi.si reports aquarium males around 9\
      \ cm with females one to two centimetres smaller, supporting these typical aquarium maxima. Aqualog and Glaser\
      \ also give about 9 cm without a sex breakdown; Fischlexikon and FishFish give 10 cm males and 8 cm females,\
      \ and a keeper reports still larger fish. FishBase's 7.7 cm is standard length, not a directly interchangeable\
      \ total length. Retain the median figures with medium confidence rather than promoting the largest hobby report\
      \ to the typical maximum."
  - field: features.predation

  ghDgh:
    value:
      min: 3
      max: 5
    confidence: high
    rationale: "All four proposals agree on 3 to 5 dGH. Lake Malawi's calcium and magnesium measurements are more\
      \ relevant to natural hardness than aquarium recipes: Branchu's upper 50 m give about 4.2 to 4.6 dGH, while\
      \ the surveys compiled by FAO span about 3.2 to 4.9 dGH after conversion. The decided interval rounds outward\
      \ over those measurements. Higher aquarium recommendations remain evidence for husbandry, not measurements\
      \ of the lake. Retain waterbody verification and high confidence."

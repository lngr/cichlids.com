  sizeAndGrowth:
    text: "Use about 9 cm for an aquarium male and 7 cm for a female when planning adult space. These figures are\
      \ the medians of the proposals and fit the specialist account of females being one to two centimetres shorter.\
      \ Some hobby sources report 10 cm males and 8 cm females, and a keeper gives larger maxima, so individual\
      \ fish can exceed the planning figures. FishBase reports 7.7 cm standard length without a sex distinction;\
      \ that measurement excludes the tail and is not directly comparable to aquarium total lengths. A 5 to 8 year\
      \ lifespan is only an estimate for small mbuna, since no species-specific longevity series was found."

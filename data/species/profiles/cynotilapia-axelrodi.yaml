  husbandry:
    text: "For one male and three females, the decided minimum is 200 L with a base about 100 by 40 cm. The volume\
      \ follows specialist advice; the footprint is an inferred arrangement. Other sources recommend 300 to 350\
      \ L, including 150 by 50 cm bases, which offers more scope for communities and larger groups. Build separate\
      \ stable rock shelters over sand and leave clear swimming lanes. Keep water well oxygenated and maintain it\
      \ consistently. Most published temperature recommendations fall inside the low to upper twenties Celsius.\
      \ The broader decided tolerances are 21 to 30 C, pH 7.5 to 8.7, GH 3 to 20 dGH and KH 4 to 10 dKH, all with\
      \ low confidence at their limits. They express compatibility estimates rather than targets for continual operation\
      \ at an extreme. The lake's low GH does not imply poor buffering, so do not confuse hardness with alkalinity."
    sources:

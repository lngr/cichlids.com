    - *id015
    - *id008
    - *id029
    - *id030
    - *id018
    - *id038
    - *id027
  breeding:
    text: "A male courts around a cleared site beneath or beside rocks. After spawning, the female incubates eggs\
      \ and developing young in her mouth, commonly for about three weeks, with some accounts giving three to four\
      \ weeks. The male does not share that care. Brooding females need sheltered resting places because they may\
      \ eat little during incubation. Fry can survive among cover, but a community aquarium does not protect every\
      \ brood. Maternal mouthbrooding should not be confused with a lasting pair bond, and maintaining only a male\
      \ and a female concentrates social pressure on that female."
    sources:
    - *id003
    - *id005
    - *id017
    - *id021
    - *id006
    - *id007
    - *id019
    - *id008
    - *id031
    - *id022
    - *id026
    - *id015
  sexing:
    text: "Adult males usually show the brighter blue body, darker mask and stronger dark fin markings, and they\
      \ grow larger than females. Females tend towards subdued blue or grey and may carry yellowish tones in the\
      \ tail and other fins. Bar intensity and overall colour vary with social position and condition. Juveniles\
      \ and suppressed males can therefore be difficult to identify by colour alone. Confirm mature fish using several\
      \ traits and reliable stock identification; a kingsizei trade label alone does not establish this species."
    sources:
    - *id003
    - *id017
    - *id006
    - *id021
    - *id019
    - *id015
    - *id008
  compatibility:
    text: "A carefully selected Malawi community is possible. Choose companions that can coexist with a small territorial\
      \ mbuna without suppressing it, and provide more space than the minimum harem tank when adding other groups.\
      \ Less forceful mbuna such as Labidochromis caeruleus have practical support; the suitability of other combinations\
      \ remains dependent on individuals and layout. Predation is rated 0 because plankton and small invertebrates\
      \ dominate the evidence, although incidental fry capture is possible. The hybrid-group list is empty because\
      \ no sufficiently identified pair was established by the inputs. FishFish nevertheless reports a cross with\
      \ an unidentified elongatus-form male when no axelrodi male was present, so the empty list is not assurance\
      \ against crossing. Similar blue-barred fish also complicate identification and can provoke rivalry."
    sources:
    - *id003
    - *id017
    - *id002
    - *id026
    - *id007
    - *id021
    - *id006
    - *id019
    - *id008
    - *id001
    - *id022
    - *id028
    - *id005
    - *id035
    - *id004
    - *id029
    - *id030
    - *id027
    - *id039
  problems:
    text: "Repeated pursuit, blocked escape routes and sustained suppression deserve attention even in a species\
      \ often described as a manageable mbuna. Pair keeping carries a particularly serious warning in the importer\
      \ account. Stable water quality and suitable feeding matter alongside social management. The conservative\
      \ bloat flag records a precaution derived from broader mbuna advice; no species-specific study establishes\
      \ an exact dietary threshold. A female carrying a brood may eat little and lose condition for several weeks,\
      \ but incubation alone does not explain every change in behaviour. Review the social group, food intake and\
      \ water conditions when a fish remains withdrawn or fails to recover after releasing young."

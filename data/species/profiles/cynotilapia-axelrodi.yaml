    - *id007
  diet:
    text: "Offer small foods that suit a fish which chiefly catches animal plankton. Suitable variety includes fine\
      \ prepared food, plant-containing flakes or pellets and measured portions of small aquatic invertebrates.\
      \ Supplementary algae and substrate foods explain why some accounts call it omnivorous. The decided rubric\
      \ type remains invertivore because animal plankton is the principal food documented by FishBase and CRC. A\
      \ conservative bloatSensitive flag is retained from the vote rules. It rests on general mbuna feeding warnings\
      \ and related-species advice, with no direct demonstration of unusual protein sensitivity in axelrodi. Include\
      \ fibre and plant material, avoid an excessive rich-food staple and maintain water quality without turning\
      \ this species into an algae-only feeder."
    sources:
    - *id005
    - *id002
    - *id003
    - *id006
    - *id021
    - *id028
    - *id026
    - *id022
    - *id033

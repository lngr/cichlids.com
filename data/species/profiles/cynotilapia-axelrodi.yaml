  ph:
    value:
      min: 7.7
      max: 8.6
    confidence: high
    rationale: "All four runs agree on the decided Lake Malawi surface range of 7.7 to 8.6. Jackson and colleagues'\
      \ measurements, compiled by Vanden Bossche and Bernacsek, support these bounds. Branchu and colleagues report\
      \ a wider whole-column interval of 7.5 to 8.5; its deeper-water minimum is not used for this shallow-water\
      \ species. Retain waterbody verification and high confidence, with the original wider evidence represented\
      \ by its actual values."

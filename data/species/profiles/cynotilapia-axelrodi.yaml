    rationale: "Retain the conservative tally decision of invertivore with bloatSensitive true and low confidence,\
      \ with verification votes 3 of 6 as recorded by the tally. Generator, tiebreaker-1 and tiebreaker-2 proposed\
      \ invertivore with false; checker-a proposed invertivore with true; checker-b and checker-c proposed omnivore\
      \ with false. FishBase's correctly linked stock 2519 food table, CRC and the Genner and Turner review support\
      \ primary animal-plankton feeding, which the rubric includes under invertivore. Malawi.si, Zoopet and the\
      \ hobby syntheses also describe algae and other supplementary foods, explaining the omnivore proposals. No\
      \ combined value gains a qualified majority, so the tally applies the stricter proposed type and sets the\
      \ sensitivity flag when any vote does. The true flag is a precaution based on Glaser's fibre-rich feeding\
      \ advice, advice for C. afra and Aquarist Atlas's general mbuna bloat warning; it is not a demonstrated axelrodi-specific\
      \ response to protein. Five false proposals and the absence of species-specific bloat data remain explicit\
      \ contrary evidence. This plankton feeder still needs small animal foods alongside plant material."

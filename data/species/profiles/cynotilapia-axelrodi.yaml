      \ and Lion's Cove; checker-a and checker-c also include Mundola Point. FishBase corroborates Nkhata Bay and\
      \ Chirombo Point; Malawi.si adds Lion's Cove, while the Czech specialist and a keeper account name Mundola\
      \ Point. Retain all reported localities without treating the differently named range boundaries as equivalent\
      \ sites. Use lake-malawi as the waterbody identifier."
  - field: features.temperatureC.tolerance
    proposals:
    - by: generator
      value:
        min: 20
        max: 30
    - by: checker-a
      value:
        min: 21
        max: 29
    - by: checker-b
      value:
        min: 21
        max: 30
    - by: checker-c
      value:
        min: 20
        max: 30
    decision:
      min: 21
      max: 30
    rationale: "Retain the tally's 21 to 30 C, low confidence and unanimous four-of-four verification under the\
      \ one-degree agreement rule. Generator and checker-c propose 20 to 30 C, checker-a 21 to 29 C, and checker-b\
      \ 21 to 30 C. The agreeing lower-bound median is 20.5 C, rounded to 21, and the upper-bound median is 30 C.\
      \ The 20 C proposals are broader than the decided interval. Published keeping recommendations are narrower:\
      \ 22 to 28 C from Aqualog, 22 to 27 C from Fischlexikon, 22 to 26 C from Interaquaristik, 23 to 27 C from\
      \ Zoopet and about 25.6 to 27.8 C from the keeper; Seriously Fish gives 25 to 29 C for C. afra. The decided\
      \ range contains the whole natural seasonal interval and a modest warm-side margin. These are estimated long-term\
      \ limits, not demonstrated endpoints or a recommendation to keep fish continually at 30 C."
  - field: features.ph.tolerance
    proposals:
    - by: generator
      value:
        min: 7.5
        max: 8.8
    - by: checker-a
      value:
        min: 7.5
        max: 8.6
    - by: checker-b
      value:
        min: 7.5
        max: 8.6
    - by: checker-c
      value:
        min: 7.5
        max: 8.8
    decision:
      min: 7.5
      max: 8.7
    rationale: "Retain 7.5 to 8.7, low confidence and unanimous four-of-four verification under the 0.3-pH agreement\
      \ rule. Generator and checker-c propose 7.5 to 8.8; checker-a and checker-b propose 7.5 to 8.6. The agreeing\
      \ endpoint medians give 7.5 and 8.7. Glaser advises pH above 7.5, while several sheets recommend 7.5 to 8.5\
      \ and the keeper gives 7.5 to 8.6. The wider FishFish recommendation reaches pH 9.0, and Aqualog's 7.0 to\
      \ 8.0 extends below the decision; both remain evidence. The decided interval is a cautious synthesis around\
      \ alkaline keeping practice and the natural maximum of 8.6, not proof of harm at 8.8 or 9.0. The inferred\
      \ endpoints limit confidence."
  - field: features.khDkh.tolerance

  ph:
    value:
      min: 8.4
      max: 9.4
    confidence: high
    rationale: "The natural range is the required Lake Tanganyika synthesis of 8.4 to 9.4. Plisnier et al. measure\
      \ 8.47 to 9.40 at 40 m near Bujumbura/Uvira, with surface water generally near pH 9. The older FAO source-book\
      \ figure of 7.3 to 7.8 is retained as dissenting evidence but conflicts with the modern lake measurements\
      \ and does not replace them."

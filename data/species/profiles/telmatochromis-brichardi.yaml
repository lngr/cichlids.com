    tolerance:
      value:
        min: 22
        max: 30
      confidence: low
      verification:
        method: unanimous
        votes:
          agree: 4
          total: 4
      rationale: "The tally regards the four proposals as unanimous within its one-degree agreement rule: generator\
        \ 22 to 30 C, checker-a 22 to 29 C, checker-b 23 to 29 C and checker-c 22 to 30 C. Their rounded endpoint\
        \ medians give 22 to 30 C. This contains the natural 23 to 29 C range and modest inferred margins; it\
        \ is not a tested chronic-exposure result. Species recommendations are narrower: Zoopet 23 to 26 C, Tanganyika.si\
        \ and the Atlas 24 to 26 C, PetsHome and FishFish 23 to 27 C, and Guidarium 24 to 28 C. Routine keeping\
        \ should stay inside those ordinary care targets rather than use the uncertain outer edges as goals."

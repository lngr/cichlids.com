  temperatureC:
    value:
      min: 23
      max: 29
    confidence: high
    rationale: Lake-wide seasonal measurements support the fixed natural range of 23 to 29 C. Verburg et al. report
      buoy temperatures of 23.85 to 29.01 C near the surface at Mpulungu; the annual lake programme adds spatial
      and seasonal context. The narrower 23 to 26 C and 24 to 26 C care recommendations are aquarium targets rather
      than habitat limits.

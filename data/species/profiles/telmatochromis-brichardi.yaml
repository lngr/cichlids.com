      \ false. Generator, checker-a, checker-b and both tiebreakers choose omnivore; checker-c chooses aufwuchs.\
      \ Tanganyika.si and Zoopet describe mixed plant and animal feeding, Burnel includes algae, invertebrates\
      \ and eggs, and the morphological review supports algal feeding plus egg taking among lake Telmatochromis.\
      \ FishBase emphasizes algae, but grazing alone does not establish the obligatory low-protein plant-based\
      \ husbandry represented by the rubric aufwuchs category. The false bloat flag is an inference from mixed\
      \ feeding advice, not evidence from a health trial. The Wagner study discusses strict algivory in Tropheus\
      \ brichardi and is not species-specific nutritional evidence for this Telmatochromis."

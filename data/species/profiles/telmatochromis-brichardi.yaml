partners:
  suitable:
  - species: Cyprichromis leptosoma
    reason: Open-water use can reduce competition around the rock shelters.
    condition: "An inferred combination, not a direct keeping trial here; provide the larger tank and group required\
      \ by the open-water fish."
  - species: Neolamprologus brevis
    reason: A direct aquarium account describes coexistence with a brevis shell dweller.
    condition: That account involves a single male rather than a breeding pair; separate the shell patch from
      the rock territory and allow space for both species.
  - species: Xenotilapia flavipinnis
    reason: A direct aquarium account includes a single individual alongside this species.
    condition: The observation does not establish compatibility with a breeding pair; provide suitable open sand
      and a larger aquarium.
  unsuitable:
  - species: Telmatochromis bifrenatus
    reason: Shares a presumed pairwise hybrid risk and competes for similar narrow rock shelters; no verified
      cross is established by the read sources.
  - species: Telmatochromis vittatus
    reason: Shares a presumed pairwise hybrid risk and similar shelter use; the hybrid warning is not a documented
      parentage result.
  - species: Lepidiolamprologus elongatus
    reason: Its piscivorous feeding and much greater size create a predation risk for small brichardi adults.
  - species: Tropheus moorii
    reason: A vigorous grazing group has different space and feeding demands and may prevent this small shelter-associated
      fish from feeding comfortably.
profile:
  overview:
    text: "A pair of Telmatochromis brichardi spends much of its time around narrow shelters in a rocky aquarium.\
      \ Its pale body and dark lengthwise markings help distinguish it from the fairy cichlids that share its\
      \ species epithet. This small Lake Tanganyika cichlid combines surface grazing with opportunistic animal\
      \ feeding and forms temporary breeding pairs. Its modest size allows a compact pair aquarium, provided both\
      \ adults can retreat from each other."
    sources:
    - *id001
    - *id002
    - *id003
    - *id047
  habitat:
    text: "The best-supported distribution follows the northern Burundi shore of Lake Tanganyika around the Magara\
      \ region, between the Bujumbura area and Rumonge. Records place the fish mainly among rocks at depths of\
      \ about 5 to 20 m. Rock crevices provide the principal shelter and nesting habitat; shells can serve as\
      \ alternative refuges. Lake studies describe hard, strongly alkaline water with substantial carbonate buffering.\
      \ The broad natural ranges include seasonal and spatial variation and do not prescribe a single aquarium\
      \ target."
    sources:
    - *id002
    - *id003
    - *id027
    - *id011
  sizeAndGrowth:
    text: "Typical aquarium sizes used here are 7 cm for males and 6 cm for females. Larger captive individuals\
      \ are reported, while the 4.1 cm FishBase record measures standard length and excludes the tail. These measurements\
      \ describe different things and should not be treated as interchangeable adult maxima. Lifespan advice of\
      \ 5 to 6 years rests on hobby care sheets and has low confidence."
    sources:
    - *id002
    - *id003
    - *id039
    - *id021
    - *id022
    - *id031
  husbandry:
    text: "For one adult pair, provide at least 80 L with 60 cm of length and 30 cm of front-to-back space. Meet\
      \ the volume and footprint together. Arrange stable rocks so that several narrow refuges have separate approaches\
      \ and a pursued fish can leave the other adult's view. Empty shells add optional shelter. Keep the water\
      \ well filtered and oxygenated, and use consistent maintenance. Species care recommendations commonly fall\
      \ around 24 to 26 C; the broader tolerance endpoints carry uncertainty and are not routine keeping targets.\
      \ Mixed communities require additional space."
    sources:
    - *id003
    - *id023
    - *id021
    - *id039
  socialBehavior:
    text: "Breeding brings a male and female together around a concealed nest. The female stays close to the clutch\
      \ while the male guards nearby space, but this association does not imply a permanent pair bond. Other adults\
      \ can face repeated pursuit, and a keeper reports a dominant male restricting females to their shelters\
      \ without injuring them. Watch access to food and safe resting places as well as visible wounds. Provide\
      \ separation if either partner cannot escape persistent attention."
    sources:
    - *id002
    - *id003
    - *id047
    - *id039
  diet:
    text: "Offer small prepared foods containing plant ingredients alongside suitable small animal foods. Grazing\
      \ on rock biofilm supplies plant material and associated organisms; small frozen crustaceans provide useful\
      \ dietary variety in captivity. Egg and fry consumption also occurs, so a fish seen grazing should not be\
      \ assumed safe around another species' brood. The profile classifies the diet as omnivorous. The false bloat\
      \ flag reflects the absence of a demonstrated special sensitivity and does not establish that an unbalanced\
      \ diet is harmless."
    sources:
    - *id002
    - *id003
    - *id039
    - *id023
  breeding:
    text: "The pair uses a protected opening and attaches its eggs inside the shelter. A narrow rock cavity is\
      \ suitable, and aquarium observations also include eggs within empty shells. Male defense concentrates around\
      \ the nest while the female tends the young at close range. Once fry feed independently, supply food small\
      \ enough for them to take and provide many inaccessible gaps between stones. Other fish, including adults\
      \ of this species, can consume exposed young."
    sources:
    - *id002
    - *id003
    - *id047
    - *id039
  sexing:
    text: "Adult size provides a useful clue because males generally grow larger. Long pelvic fins are described\
      \ in a direct aquarium account, but colour contrast varies and is an uncertain way to assign sex. Juveniles\
      \ are difficult to sex reliably. If a pair forms from a juvenile group, the remaining fish need space away\
      \ from the pair or a separate aquarium."
    sources:
    - *id003
    - *id039
    - *id021
  compatibility:
    text: "A well-spaced Tanganyika community can work when other fish use separate shelters or swimming areas.\
      \ A published aquarium account includes coexistence with a brevis shell dweller and Xenotilapia flavipinnis,\
      \ but that observation does not establish a universal stocking combination. Protect any brood that matters\
      \ because eggs and fry can be taken. T. bifrenatus and T. vittatus share presumed pairwise hybrid cautions\
      \ with this species; the warnings come from hobby accounts and close relationship rather than confirmed\
      \ crosses. Large piscivores threaten these small adults, and a pair aquarium minimum provides no allowance\
      \ for additional territorial species."
    sources:
    - *id003
    - *id039
    - *id023
    - *id001
    - *id031
    - *id022
    - *id040
    - *id041
  problems:
    text: "Repeated pursuit can leave a female confined to a refuge even when no wounds are visible. A fish that\
      \ cannot feed or move freely needs intervention and more effective separation. Newly free-swimming fry also\
      \ need refuge from adults. Avoid transferring the ecology or breeding behavior of another brichardi species\
      \ to this fish: the cichlids.com archive search finds a discussion about Neolamprologus brichardi rather\
      \ than a keeping record for this Telmatochromis. Its legacy forum URL is offline. The read sources do not\
      \ establish a distinctive disease syndrome or experimentally measured water-tolerance limits."
    sources:
    - *id039
    - *id003
    - *id002
    - *id023
    - *id028

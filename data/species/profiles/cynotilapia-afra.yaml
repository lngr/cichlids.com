  ph:
    value: {min: 7.7, max: 8.6}
    confidence: high
    rationale: >-
      Lake Malawi endemic: the natural range is the measured surface pH of the lake, 7.7 to 8.6
      after Jackson et al. (1963) in the FAO source book. Branchu et al. (2010) give 7.5 to 8.5 for
      the whole water column, the lower values belonging to deep water that this shallow rock
      dweller does not use. FishBase gives 8.0 to 8.5, inside the lake range.
    sources: *lakesources
    evidence:
      - source: *fao
        value: {min: 7.7, max: 8.6}
        note: lake surface water after Jackson et al. 1963
      - source: *branchu
        value: {min: 7.5, max: 8.5}
        note: whole water column, lower values in deep water
    verification:
      method: waterbody
      waterbody: lake-malawi
    tolerance:
      value: {min: 7.5, max: 8.6}
      confidence: medium
      rationale: >-
        Decided by the vote count (unanimous, 3 of 3). Care sheets agree on alkaline water:
        Seriously Fish and Fishkeeper give 7.5 to 8.5, FishBase and FishProfiles 8.0 to 8.5 and
        Guidarium 7.6 to 8.6; Seriously Fish names 8.0 to 8.5 as ideal for breeding and stresses a
        steady pH. The upper limit is the lake maximum of 8.6, so that the tolerance contains the
        natural range. Aqualog's 7.0 to 8.0 lies below the lake and below every other sheet and
        is not followed.
      sources:
        - *sf
        - *fk
        - *fprof
        - *fb
        - *aqualog
        - &guid
          kind: website
          title: "Guidarium: Afra Cichlid (Cynotilapia afra)"

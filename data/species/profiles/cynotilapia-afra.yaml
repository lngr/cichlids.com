  ghDgh:
    value: {min: 3, max: 5}
    confidence: high
    rationale: >-
      Lake Malawi is soft water: calcium and magnesium are low and bicarbonate dominates. The
      north-basin profiles of Branchu et al. (2010) convert to 4.2 to 4.6 dGH in the upper 50 m and
      the 1960s titrations compiled by FAO to 3.2 to 4.9 dGH, so the natural range is 3 to 5 dGH.
      The 15 dH that FishBase gives is an aquarium figure that confuses hardness with the
      alkalinity of the lake.
    sources: *lakesources
    evidence:
      - source: *branchu
        value: {min: 4.2, max: 4.6}
        note: upper 50 m of the north basin, computed from calcium and magnesium
      - source: *fao
        value: {min: 3.2, max: 4.9}
        note: 1960s titrations, computed from calcium and magnesium
    verification:
      method: waterbody
      waterbody: lake-malawi
    tolerance:
      value: {min: 3, max: 25}
      confidence: medium
      rationale: >-
        Decided by the vote count (unanimous, 3 of 3). Care sheets ask for much harder water than
        the lake: Seriously Fish 10 to 25 dGH, FishProfiles 10 to 20, Fishkeeper up to 25 and
        FishBase at least 15. The species is kept for years in such water, so the upper end is
        25 dGH; the lower end is the soft lake water of 3 to 5 dGH in which the fish live. Soft
        water is safe only while carbonate hardness and pH stay in the alkaline range.
      sources:
        - *sf
        - *fprof
        - *fk
        - *fb
        - *branchu
      evidence:
        - source: *sf
          value: {min: 10, max: 25}
          note: aquarium recommendation
        - source: *fprof
          value: {min: 10, max: 20}
          note: aquarium recommendation
        - source: *fk
          value: {min: 0, max: 25}
          note: only the upper limit is stated
        - source: *fb
          value: {min: 15, max: 25}
          note: only a lower limit of 15 dH is stated
        - source: *branchu
          value: {min: 4.2, max: 4.6}
          note: lake water the species lives in
      verification:
        method: unanimous
        votes: {agree: 3, total: 3}

  khDkh:
    value: {min: 5, max: 8}
    confidence: high
    rationale: >-
      Lake Malawi endemic: bicarbonate dominates the ions of the lake. Alkalinity of 2.33 to 2.46
      meq/L in the profiles of Branchu et al. (2010) gives 6.5 to 6.9 dKH, and 2.00 to 2.59 meq/L
      after Jackson et al. (1963) gives 5.6 to 7.3 dKH, so the natural range is 5 to 8 dKH.
      Sodium balances part of the bicarbonate, so carbonate hardness exceeds total hardness.
    sources: *lakesources
    evidence:
      - source: *branchu
        value: {min: 6.5, max: 6.9}
        note: computed from alkalinity profiles
      - source: *fao
        value: {min: 5.6, max: 7.3}
        note: computed from alkalinity after Jackson et al. 1963
    tolerance:
      value: {min: 5, max: 15}
      confidence: low
      rationale: >-
        The proposals in vote order are 5 to 25, 5 to 12, 5 to 15, 5 to 15 and 5 to 15 dKH.
        No qualified majority exists. The median bounds give 5 to 15 dKH with low confidence
        and contain the natural 5 to 8 dKH without widening. Seriously Fish, FishBase and
        Fishkeeper give only total hardness (10 to 25, at least 15 and up to 25 dGH), which
        does not determine carbonate buffering. General Lake Malawi advice gives 10 to 14
        dKH in the Cichlid-Forum water-chemistry article and 10 to 12 and 10 to 15 at
        Furrycritter; Gensou gives 6 to 10 as lake-water advice. The lake supports the lower
        edge and general Malawi husbandry supports the upper edge, making the median
        plausible in aquarium practice. The generator's 25 dKH proposal reads total-hardness
        figures as KH and has no support, but it does not determine the median.
        Species-specific long-term KH endpoints remain unverified.
      sources:
        - &wittig
          kind: literature
          title: Wittig, S. Practical Water Chemistry. Article, Cichlid-Forum (general recommendations for Rift Lake cichlids)
          url: https://www.cichlid-forum.com/articles/water_chemistry.php
          archived: cichlid-forum.com/articles/water_chemistry.php/2026-10-14T095612Z
          accessed: 2026-10-12
        - *branchu
        - *fao
        - *sf
        - *fb
        - *fk
        - &furryrift
          kind: website
          title: "Furrycritter: Rift lake water chemistry"
          url: https://www.furrycritter.com/pages/articles/fish/rift_lake_chemistry.htm
          archived: furrycritter.com/pages/articles/fish/rift_lake_chemistry.htm/2026-10-14T095613Z
          accessed: 2026-10-12
        - &furryafrican
          kind: website
          title: "Furrycritter: African cichlid water"
          url: https://www.furrycritter.com/pages/articles/fish/african_cichlid_water.htm
          archived: furrycritter.com/pages/articles/fish/african_cichlid_water.htm/2026-10-14T095615Z
          accessed: 2026-10-12
        - &gensou
          kind: website
          title: "Gensou: Cynotilapia afra care guide"
          url: https://gensou.sg/cynotilapia-afra-care-guide/
          accessed: 2026-10-12
      evidence:
        - source: *wittig
          value: {min: 10, max: 14}
          note: general recommendation for Rift Lake aquaria
        - source: *furryrift
          value: {min: 10, max: 12}
          note: general advice for Lake Malawi cichlids
        - source: *furryafrican
          value: {min: 10, max: 15}
          note: general advice for Lake Malawi cichlids
        - source: *gensou
          value: {min: 6, max: 10}
          note: species care guide, values given for lake water
        - source: *branchu
          value: {min: 6.5, max: 6.9}
          note: lake water the species lives in
        - source: *fao
          value: {min: 5.6, max: 7.3}
          note: lake water the species lives in
      verification:
        method: median
        votes: {agree: 3, total: 5}

  maxSizeCm:
    value: {male: 10, female: 8.5}
    confidence: medium
    rationale: >-
      FishBase gives 10.1 cm standard length for males or unsexed fish and Seriously Fish 10 cm
      standard length; Tawil (2011, cited by Mbizi et al. 2025) puts wild adults at 7 to 9 cm
      standard length. Males grow larger than females, so a well-kept male reaches about 10 cm and
      a female about 8.5 cm, as Guidarium also states. Aqualog gives 9 cm. Fishkeeper's 12.5 cm
      refers to a red-top form that the sheet labels C. zebroides and is not used.
    sources:

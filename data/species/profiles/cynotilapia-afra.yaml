partners:
  suitable:
    - species: Labidochromis caeruleus
      reason: Calm mbuna of similar size with yellow, unbarred males, so it is not taken for a rival; shares the plant-based diet and the water values.
      condition: Rock structures across the whole tank and enough hiding places.
    - species: Iodotropheus sprengerae
      reason: Peaceful, rust-brown mbuna of similar size and diet that looks clearly different from C. afra.
      condition: Tank of at least 120 cm with plenty of caves.
    - species: Melanochromis johannii
      reason: Mbuna of similar size and temperament with horizontal stripes instead of bars; robust enough to hold its own.
      condition: Only in tanks of 150 cm or more with one male of each species.
    - species: Synodontis njassae
      reason: Lake Malawi catfish that lives near the bottom, ignores the cichlids and needs the same water.
  unsuitable:
    - species: Maylandia zebra
      reason: Same hybrid group; closely related blue barred mbuna that crosses with C. afra in the lake, and males fight it as a rival.
    - species: Maylandia callainos
      reason: A blue mbuna that C. afra males treat as a rival.
    - species: Cynotilapia zebroides
      reason: Look-alike Cynotilapia sold under similar trade names; the two are easily confused in the trade and should not be mixed.
    - species: Pseudotropheus saulosi
      reason: Small mbuna with blue barred males that C. afra treats as rivals.
    - species: Aulonocara stuartgranti
      reason: Peaceful peacock that is harassed in a crowded mbuna tank and loses out at feeding.
    - species: Copadichromis borleyi
      reason: Calm utaka of open water that does not cope with the constant pressure of mbuna.

profile:
  overview:
    text: >-
      Cynotilapia afra, the dogtooth or afra cichlid, is a small mbuna from the rocky shores of
      Lake Malawi. Its name refers to the pointed, single-tipped teeth that set the genus apart
      from the similar-looking Maylandia, whose outer teeth have two tips. Males are blue with dark
      vertical bars that continue into the dorsal fin, and each population has its own dorsal
      colour, from white to yellow or orange. Many forms are traded under locality names such as
      Jalo Reef or Cobue, and several fish sold as afra belong to related species, among them C.
      zebroides and undescribed forms such as Cynotilapia sp. 'Lion' and sp. 'Hara'. It is a
      hardy, lively fish for a dedicated mbuna tank, but males are quarrelsome and need several
      females and plenty of rockwork.
    sources:
      - *cof
      - *sf
      - *crc
      - *oliver
  habitat:
    text: >-
      The species lives only in Lake Malawi, mainly along the north-western coast, on parts of the
      Mozambican and Tanzanian shores and around the islands of Likoma, Chizumulu and Mbenji. It
      keeps to the upper rocky zone where the stones are free of sediment, usually between about 3
      and 30 m. Territorial males stay close to their rock and graze its cover of algae and tiny
      animals, while females and young fish gather in the open water just off the rocks to pick
      plankton. The lake water is warm (about 21 to 29 C), moderately alkaline (pH 7.7 to 8.6) and
      soft, with 3 to 5 dGH and 5 to 8 dKH. Fish released at Thumbi West Island in the south of
      the lake in the early 1960s have spread there and cross with the native Maylandia zebra.
    sources:
      - *fb
      - *sf
      - *branchu
      - *fao
      - *eccles
      - *streelman
  sizeAndGrowth:
    text: >-
      Adult males reach about 10 cm in the aquarium; females stay somewhat smaller at around 8 to
      9 cm. Wild adults are often a little shorter. The body is slender and of medium depth. Young
      fish grow steadily on a good diet and mature at six to eight months, when the males start to
      show their full colours and the first disputes over territory begin. No published lifespan
      exists; small mbuna of this size often live six to ten years in a well-kept tank.
    sources:
      - *fb
      - *sf
      - *mbizi
  husbandry:
    text: >-
      Plan a tank of at least 120 cm length and about 200 L for one male with three or more
      females. Build stable rock piles with many caves from the floor to near the surface and leave
      some open sand between them, because the fish like to dig beneath stones; plants are usually
      uprooted. Keep the water warm (24 to 27 C works well), clean and alkaline with a steady pH
      around 8; a carbonate hardness of about 5 to 12 dKH buffers it. Good filtration and frequent
      partial water changes matter more than a high total hardness. Mbuna tanks are usually
      stocked fairly densely so that no single fish becomes the constant target of a male.
    sources:
      - *sf
      - *fk
      - *fprof
      - *wittig
  socialBehavior:
    text: >-
      Each adult male claims a cave or a spot under a rock and defends it against other males,
      above all against fish with a similar blue, barred pattern. He courts females with vigorous
      displays and can chase them hard, so keep at least three females per male. Several males are
      possible only in large tanks with many separate rock piles. Towards other mbuna of different
      appearance the species is territorial but rarely harmful. In the wild, males hold their sites
      while the rest of the population forms loose groups in the water above. The undescribed
      Cynotilapia sp. 'Lion', often sold as afra, has a reputation for being much more aggressive.
    sources:
      - *sf
      - *fk
      - *fb
      - *arch17519
  diet:
    text: >-
      In nature the fish eat plankton from the water column and graze the cover of algae and tiny
      animals on the rocks. In the aquarium a plant-based staple works best: spirulina flakes or
      pellets made for mbuna, plus blanched spinach or similar vegetables. Small crustaceans such
      as mysis or brine shrimp can be offered now and then, but a diet rich in animal protein
      raises the risk of bloat. Feed small amounts two or three times a day, since the fish eat
      everything quickly. Free-swimming fry in the tank may be eaten as well.
    sources:
      - *fb
      - *sf
      - *fk
      - *mbizi
      - *genner
  breeding:
    text: >-
      C. afra is a maternal mouthbrooder and breeds readily in a harem. The male prepares a site in
      the rockwork or digs a pit below a stone and displays at its entrance. The female lays her
      eggs there and takes them into her mouth at once; the egg spots on the male's anal fin guide
      her to take up sperm. She carries 15 to 30 eggs for up to three weeks without eating and then
      releases young that can take brine shrimp nauplii straight away. Stressed females may spit
      or eat the brood early, so move them only with care, or keep the young in a separate tank.
    sources:
      - *sf
      - *fprof
      - *crc
  sexing:
    text: >-
      Adult males are larger and much more colourful than females: bright blue with clear dark
      bars and a coloured dorsal fin, plus egg spots on the anal fin. Females are light blue-brown
      without the barring. Young fish of both sexes look alike, so buying a group of juveniles and
      removing surplus males later is a common approach. Subordinate males can stay drab for a
      long time and are easily mistaken for females.
    sources:
      - *sf
      - *fprof
      - *mbizi
      - kind: archive
        title: cichlids.com forum thread 17979
        url: https://www.cichlids.com/disc/read.php?2,17979
        accessed: 2026-10-12
  compatibility:
    text: >-
      Keep C. afra with other mbuna of similar size and temperament that look different, for example
      yellow Labidochromis caeruleus or rust-coloured Iodotropheus sprengerae. Maylandia zebra and
      the other Maylandia species do not belong in the same tank: C. afra crosses with M. zebra in
      the lake, and blue males on both sides fight as rivals. Other blue barred mbuna such as
      Pseudotropheus saulosi provoke the same rivalry. Do not mix different afra forms or other
      Cynotilapia either, since the colour forms interbreed and the species are hard to tell apart.
      Peacocks, utaka and other calm haplochromines suffer in the hectic mbuna setting and should
      not share the tank.
    sources:
      - *sf
      - *fk
      - *stauffer
      - *streelman
      - *zidana
  problems:
    text: >-
      The most common mistake is keeping a male with only one or two females, which leads to
      exhausted or injured females; too little rockwork has the same effect. Feeding much animal
      protein, such as bloodworm or meaty pellets, can trigger Malawi bloat, a serious digestive
      disease of plant-eating mbuna, so stick to a plant-based staple. Acidic or unstable water and
      infrequent water changes weaken the fish. Mixing several afra forms or blue barred relatives
      leads to hybrid offspring that cannot be passed on as pure fish. Quarantine new fish before
      adding them to an established group.
    sources:
      - *fk
      - *sf
      - *arch23984


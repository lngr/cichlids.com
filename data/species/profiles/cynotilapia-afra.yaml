  predation:
    value: 1
    confidence: low
    rationale: >-
      Decided by the vote count with the conservative method: generator, checker-a and
      tiebreaker-1 proposed level 1, checker-b and tiebreaker-2 level 0. Three of five votes do not
      reach a qualified majority, so the highest proposed level applies with confidence low. No
      source reports fish in the diet. In the lake, territorial males graze the biocover near
      their rocks and the other fish pick plankton (FishBase), and Zidana et al. (2009) and Genner
      and Turner (2005) call the species a planktivore. Genner and Turner name fry among the foods
      of mbuna in general, and in feeding trials wild-caught fish took mosquito larvae and pupae
      of every stage in large numbers (Mbizi et al. 2025), which shows an active hunter of small,
      moving prey of fry size. Guidarium tags it as a fry predator without detail. Seriously Fish
      mentions fry loss only for stressed brooding females that eat their own brood. The level
      rests on the feeding mode, not on observed fry predation.
    sources:
      - *fb
      - &genner
        kind: literature
        title: Genner, M. J. and Turner, G. F. (2005). The mbuna cichlids of Lake Malawi, a model for rapid speciation and adaptive radiation. Fish and Fisheries 6(1), 1-34.
        url: https://doi.org/10.1111/j.1467-2679.2005.00173.x

          archived: guidarium.com/fishes/afra-cichlid/2026-10-14T095608Z
          accessed: 2026-10-12
      evidence:
        - source: *sf
          value: {min: 7.5, max: 8.5}
          note: aquarium recommendation; 8.0 to 8.5 for breeding
        - source: *fk
          value: {min: 7.5, max: 8.5}
          note: aquarium recommendation
        - source: *fprof
          value: {min: 8.0, max: 8.5}
          note: aquarium recommendation
        - source: *fb
          value: {min: 8.0, max: 8.5}
          note: aquarium figure quoted by FishBase
        - source: *guid
          value: {min: 7.6, max: 8.6}
          note: aquarium recommendation
        - source: *aqualog
          value: {min: 7.0, max: 8.0}
          note: generic range below the lake values

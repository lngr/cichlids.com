    accessed: 2026-10-12
  synonyms:
    - name: Hemichromis afer
      note: >-
        Original combination of Günther, published in the 1893 volume of the Proceedings of the
        Zoological Society of London, which appeared in 1894; type locality Lake Malawi.
    - name: Paratilapia afra
      note: >-
        Older combination found in hobby and secondary literature; the genus listing of the
        Catalog of Fishes does not show it.
  legacyNames:
    - Cynotilapia afra
  note: >-
    This profile uses the narrow species concept of the Catalog of Fishes (online version of 21
    September 2026). It lists five valid species in Cynotilapia: C. afra (Günther 1894), C.
    axelrodi Burgess 1976, C. chilundu Li, Konings and Stauffer 2016, and the two species that
    Tawil (2011) and Johnson (1975) placed in Microchromis, C. aurifrons and C. zebroides, which
    Konings (2016) and Li et al. (2016) moved into Cynotilapia. These four are separate species
    and do not belong to this profile. For decades the trade sold nearly every blue and black
    barred dogtooth mbuna as "afra". Several of these forms are undescribed species with trade
    names of their own, among them Cynotilapia sp. 'Lion' from Lion's Cove, sp. 'Hara', sp.
    'Ndumbi', sp. 'Chinyankwazi' and sp. 'Mbamba', which the Cichlid Room Companion and M. K.
    Oliver list apart from C. afra. Red-top fish are sold under both C. afra and C. zebroides, so
    care sheets under the name C. afra partly describe related forms; their husbandry is very
    similar.

names:
  trade:
    en:
      - Dogtooth cichlid
      - Afra cichlid
      - Afra

variants:
  - name: Jalo Reef
    kind: locality
    note: Blue barred males without yellow on the flanks and with a yellow dorsal fin; north-western Malawian coast.
  - name: Mbenji Island
    kind: locality
    note: Males with a white dorsal fin; the fish feed on plankton above the rocks.
  - name: Cobue
    kind: locality
    note: Mozambican coast (also spelled Kobwe or Cobwe); blue barred males with a yellow dorsal fin and forehead. Fish under this name are also sold as C. zebroides.
  - name: Lupingu
    kind: locality
    note: Population of the Tanzanian coast that is common in the trade.
  - name: Thumbi West
    kind: locality
    note: Introduced population in Lake Malawi National Park, partly crossed with Maylandia zebra; no natural form.

features:
  origin:
    value:
      continent: Africa
      region: Lake Malawi
      waterbody: Lake Malawi
      localities:
        - Malawian north-west coast south to Ngara
        - Jalo Reef
        - Mbenji Island
        - Likoma Island
        - Chizumulu Island
        - Mozambican coast between Makanjila Point and Chuanga (Cobue)
        - Tanzanian coast between Lumbaulo and Ikombe
        - Thumbi West Island, Lake Malawi National Park (introduced)
    confidence: high
    rationale: >-
      Endemic to Lake Malawi (Catalog of Fishes). FishBase places the native range in the central
      and northern parts of the lake. Seriously Fish lists the north-western coast down to Ngara,
      two stretches of the eastern coast (Makanjila Point to Chuanga, Lumbaulo to Ikombe) and the
      islands Likoma and Chizumulu; the Cichlid Room Companion gives Malawi, Mozambique and
      Tanzania and shows a male from Mbenji Island, and Gerlai (2007) studied fish of the Jalo
      Reef population. In the early 1960s an exporter released fish
      at Mitande Point on Thumbi West Island in the south, and by 2001 they had spread around the
      whole island (Streelman et al. 2004); further introduced populations live elsewhere in Lake
      Malawi National Park (Zidana et al. 2009).

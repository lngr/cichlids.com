    - field: taxonomy.synonyms
      proposals:
        - {by: generator, value: [Hemichromis afer, Paratilapia afra]}
        - {by: checker-a, value: [Hemichromis afer, Paratilapia afra]}
        - {by: checker-b, value: [Hemichromis afer]}
      decision: [Hemichromis afer, Paratilapia afra]
      rationale: >-
        The Catalog of Fishes lists only the original combination Hemichromis afer. Paratilapia
        afra is kept because two runs found it in secondary literature and buyers may meet it; its
        note says that the Catalog of Fishes does not list it.
    - field: features.origin.value.waterbody
      proposals:
        - {by: generator, value: Lake Malawi}
        - {by: checker-a, value: lake-malawi}
        - {by: checker-b, value: lake-malawi}
      decision: Lake Malawi
      rationale: Both spellings name the same entry of the water body table; the name form is used.
    - field: features.origin.value.localities
      proposals:
        - {by: generator, value: [Malawian north-west coast south to Ngara, Likoma Island, Chizumulu Island, Mbenji Island, Mozambican coast between Makanjila Point and Chuanga (Cobue), Tanzanian coast between Lumbaulo and Ikombe]}
        - {by: checker-a, value: [Mbenji Island, Jalo Reef, northwestern Malawian coast, Thumbi West Island (introduced)]}
        - {by: checker-b, value: [Chizumulu Island, Likoma Island, Ikombe, Makanjila Point, Chuanga]}
      decision: [Malawian north-west coast south to Ngara, Jalo Reef, Mbenji Island, Likoma Island, Chizumulu Island, Mozambican coast between Makanjila Point and Chuanga (Cobue), Tanzanian coast between Lumbaulo and Ikombe, Thumbi West Island, Lake Malawi National Park (introduced)]
      rationale: >-
        The proposals do not contradict each other and differ only in detail. The coastal
        stretches and the islands come from Seriously Fish, Mbenji Island from the Cichlid Room
        Companion and Oliver, Jalo Reef from the population studied by Gerlai, and the introduced
        Thumbi West population from Streelman et al. (2004), marked as introduced.
    - field: features.maxSizeCm
      proposals:
        - {by: generator, value: {male: 10, female: 8.5}}
        - {by: checker-a, value: {male: 10, female: 8}}
        - {by: checker-b, value: {male: 10, female: 9}}
      decision: {male: 10, female: 8.5}
      rationale: >-
        All runs agree on 10 cm for males and on smaller females. Wild adults reach 7 to 9 cm
        standard length (Tawil 2011 via Mbizi et al. 2025) and Guidarium gives 8.5 cm for females,
        the middle of the three proposals.
    - field: features.predation
      proposals:
        - {by: generator, value: 1}
        - {by: checker-a, value: 1}
        - {by: checker-b, value: 0}
        - {by: tiebreaker-1, value: 1}
        - {by: tiebreaker-2, value: 0}
      decision: 1
      rationale: >-
        Decided by the vote count with the conservative method: 3 of 5 votes do not reach a
        qualified majority, so the highest proposed level applies with confidence low. No source
        reports fish in the diet; the level rests on the active hunting of small larvae and on fry
        being part of the mbuna diet in general.
    - field: features.diet.value.foods
      proposals:
        - {by: generator, value: [spirulina or other plant-based flakes and pellets, blanched spinach and other soft vegetables, small crustaceans such as mysis or brine shrimp as an occasional supplement]}
        - {by: checker-a, value: [zooplankton, phytoplankton, aufwuchs, insect larvae]}
        - {by: checker-b, value: [spirulina flakes, blanched greens, live and frozen zooplankton foods, brine shrimp]}
      decision: [spirulina or other plant-based flakes and pellets, blanched spinach and other soft vegetables, small crustaceans such as mysis or brine shrimp as an occasional supplement]
      rationale: >-
        Decided by the vote count (unanimous on omnivore and bloat sensitivity); the food list of
        the top candidate is kept. It names aquarium foods and limits animal food to an occasional
        supplement, which fits the bloat sensitivity; checker-a lists the wild diet instead.
    - field: features.khDkh.tolerance
      proposals:
        - {by: generator, value: {min: 5, max: 25}}
        - {by: checker-a, value: {min: 5, max: 12}}
        - {by: checker-b, value: {min: 5, max: 15}}
        - {by: tiebreaker-1, value: {min: 5, max: 15}}
        - {by: tiebreaker-2, value: {min: 5, max: 15}}
      decision: {min: 5, max: 15}
      rationale: >-
        The proposals in vote order are 5 to 25, 5 to 12, 5 to 15, 5 to 15 and 5 to 15 dKH.
        No qualified majority exists. The median bounds give 5 to 15 dKH with low confidence
        and contain the natural 5 to 8 dKH without widening. Seriously Fish, FishBase and
        Fishkeeper give only total hardness (10 to 25, at least 15 and up to 25 dGH), which
        does not determine carbonate buffering. General Lake Malawi advice gives 10 to 14
        dKH in the Cichlid-Forum water-chemistry article and 10 to 12 and 10 to 15 at
        Furrycritter; Gensou gives 6 to 10 as lake-water advice. The lake supports the lower
        edge and general Malawi husbandry supports the upper edge, making the median
        plausible in aquarium practice. The generator's 25 dKH proposal reads total-hardness
        figures as KH and has no support, but it does not determine the median.
        Species-specific long-term KH endpoints remain unverified.
    - field: features.hybridGroups
      proposals:
        - {by: generator, value: [maylandia]}
        - {by: checker-a, value: [maylandia]}
        - {by: checker-b, value: []}
        - {by: tiebreaker-1, value: [maylandia]}
        - {by: tiebreaker-2, value: []}
      decision: [maylandia]
      rationale: >-
        Decided by the vote count with the conservative method: 3 of 5 votes do not reach a
        qualified majority, so the most common named group applies with confidence low. The null
        votes accept the field hybrids with Maylandia zebra and left the value open because the
        curated group did not list the species and crosses with its other members are not
        documented. Cynotilapia afra is added to the members of maylandia.
    - field: features.social
      proposals:
        - {by: generator, value: {structure: harem, ratio: 3}}
        - {by: checker-a, value: {structure: harem, ratio: 3}}
        - {by: checker-b, value: {structure: harem, ratio: 4}}
      decision: {structure: harem, ratio: 3}
      rationale: >-
        All runs agree on a harem. Seriously Fish advises three to six females per male and
        FishProfiles three; three is the lowest number the external sources share, and checker-b's
        four is the rounded middle of the Seriously Fish range.
    - field: features.coloration
      proposals:
        - {by: generator, value: {baseColors: [blue, black], pattern: bars}}
        - {by: checker-a, value: {baseColors: [blue, black], pattern: bars}}
        - {by: checker-b, value: {baseColors: [blue, black, yellow], pattern: bars}}
      decision: {baseColors: [blue, black], pattern: bars}
      rationale: >-
        Yellow appears only on the dorsal fin and forehead of some populations, while others show
        white, orange or black there (Mbizi et al. 2025); blue body and black bars are the colours
        shared by all males.

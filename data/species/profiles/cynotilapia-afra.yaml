          Mbizi, W., Mzilahowa, T., Njunga, G., Lackson, M., Chiumia, M. and Jere, W. W. L.
          (2025). Larvivorous potential of Metriaclima callainos and Cynotilapia afra as
          biological agents for mosquito control. Malaria Journal 24, 324.
        url: https://doi.org/10.1186/s12936-025-05582-5

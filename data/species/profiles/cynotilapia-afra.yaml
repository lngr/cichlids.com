  temperatureC:
    value: {min: 21, max: 29}
    confidence: high
    rationale: >-
      Lake Malawi endemic, so the natural range is the measured range of the lake. Inshore water
      cools to about 21 C in the windy season (Eccles 1974), the winter surface layer holds 23.5 to
      24 C and summer surface water about 28 C (Vollmer et al. 2005), and a 2013 campaign measured
      24 to 29 C (Ngochera 2018). The species lives on shallow rocky shores inside the mixed upper
      layer that these values describe. FishBase gives 23 to 27 C, an aquarium figure inside this
      range.
    sources: &lakesources
      - &branchu
        kind: literature
        title: "Branchu, P., Bergonzini, L., Ambrosi, J.-P., Cardinal, D., Delalande, M., Pons-Branchu, E. et al. (2010). Hydrochemistry (major and trace elements) of Lake Malawi (Nyasa), Tanzanian Northern Basin: local versus global considerations. Hydrology and Earth System Sciences Discussions 7, 4371-4409."
        url: https://hess.copernicus.org/preprints/7/4371/2010/hessd-7-4371-2010.pdf
        archived: hess.copernicus.org/preprints/7/4371/2010/hessd-7-4371-2010.pdf/2026-10-14T094507Z
        accessed: 2026-10-12
      - &fao

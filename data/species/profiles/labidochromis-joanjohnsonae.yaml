      rationale: "The qualified-majority decision is 7.5 to 8.8 with five of six agreeing votes. Generator and tiebreaker-1 propose 7.5 to 8.6; checker-b, checker-c and tiebreaker-2 propose 7.5 to 8.8; checker-a proposes 7.0 to 8.6. The agreeing proposals fall within the rubric's 0.3 pH agreement threshold and their median upper bound is 8.8. Fishkeeper and several care sheets give 7.5 to 8.5; Cichlid Atlas supplies 7.7 to 8.8. FishBase's wider 7.0 to 8.5 environmental summary and the Dutch association's still wider 6.0 to 8.5 recommendation remain evidence, but neither supplies a long-term outcome at the acidic endpoint and the association favours alkaline conditions. Keeper measurements at 7.6 and 8.4 are consistent with the decision. The natural 7.7 to 8.6 range is contained; confidence remains medium. Tally method: qualified-majority."

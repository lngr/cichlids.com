  sizeAndGrowth:
    text: "The typical adult sizes used for planning are 10 cm for males and 8 cm for females. Those values match the median proposals and the Dutch association account. Larger captive adults are reported, including 12 cm males and 9 cm females in Klub Malawi, so these planning values are not growth limits. Feeding generously to obtain the largest possible fish can undermine body condition. The estimated lifespan is five to eight years with low confidence; one hobby account reports eight years or longer, and a verified species-specific longevity series is unavailable."
    sources:
      - *a2
      - *a22
      - *a19
      - *a33
      - *a4
      - *a23
      - *a34
      - *a29
      - *a48
      - *a49
      - *a30
  husbandry:
    text: "Provide at least 250 litres with a footprint of about 120 by 40 cm for one adult male and at least three females. Arrange secure rock clusters with multiple shelters and routes out of a defended area, while leaving accessible swimming space between them. A mixed community requires additional room for its other social units. Strong filtration and oxygenation help keep feeding and stocking demands manageable. Care sheets most often recommend roughly 24 to 28 C and alkaline water; the broader temperature tolerance of 21 to 29 C includes the natural lake range with weak evidence for lifelong exposure at its edges. The tallied aquarium envelopes are pH 7.5 to 8.8, GH 3 to 25 dGH and KH 5 to 8 dKH. Their endpoints are evidence-based planning estimates, not experimentally established physiological boundaries."
    sources:
      - *a33
      - *a19
      - *a4
      - *a34
      - *a21
      - *a29
      - *a35
      - *a20
      - *a11
      - *a2
      - *a12
      - *a13
      - *a14
      - *a15
      - *a16
      - *a17
      - *a18
  socialBehavior:
    text: "The recommended harem distributes the male's attention across several females. A pair can concentrate pursuit on one fish, and additional males create another source of competition. Males use defended areas for feeding as well as spawning; a natural-history account reports territories reaching about three metres across in the lake. That observation explains the need for separated rock patches and escape routes in captivity. Rivalry can intensify at spawning, but territorial behaviour is not restricted to that period. A fish unable to leave shelter or reach food needs prompt attention to the social arrangement."
    sources:
      - *a19
      - *a36
      - *a22
      - *a4
      - *a9
      - *a33
      - *a34
      - *a21
      - *a35
      - *a20
      - *a29
  diet:
    text: "Small arthropods taken from rock growth dominate the feeding descriptions, while algae enter with that material. The profile therefore uses invertivore under the rubric, even though several hobby sources call the fish omnivorous. Suitable food can include appropriately sized aquatic invertebrates and a balanced prepared food with a plant component. The bloat-sensitive flag is a conservative decision at low confidence: one account explicitly links rich feeding to bloat, whereas other sources recommend aquatic animal foods and connect plant-oriented feeding mainly with growth control. Keep portions measured and avoid making rich animal foods the entire ration. The evidence does not show that all insect or crustacean food causes illness."
    sources:
      - *a33
      - *a19
      - *a35
      - *a4
      - *a23
      - *a37
      - *a34
      - *a24
      - *a21
      - *a38
      - *a20
      - *a25
      - *a26
      - *a2
      - *a27
      - *a52
      - *a29
      - *a39
      - *a40
  breeding:
    text: "The female carries eggs and developing young in her mouth. Reports describe broods around 20 to 30 and holding periods of roughly three weeks, sometimes longer, depending on conditions. Give a carrying female access to quiet cover and watch her body condition and ability to avoid pursuit. The male continues to use his territory and may court again. Congeners share a presumed crossing group based on general warnings; this profile does not establish a particular named-pair cross. Separate breeding stock helps keep the ancestry of any offspring identifiable."
    sources:
      - *a35
      - *a19
      - *a4
      - *a33
      - *a2
      - *a34
      - *a1
      - *a44
      - *a45
      - *a46
      - *a47
      - *a20
  sexing:
    text: "Adult males are mainly blue and can show dark vertical body bars as their display state changes. Dark fin details can remain visible even when body bars are faint. Females retain warm orange or brown markings on a paler background, often arranged in rows or longitudinal lines. Juveniles resemble females, so early colour alone may give a misleading sex assignment. Compare mature appearance and size across the group before fixing its adult sex ratio."
    sources:
      - *a19
      - *a33
      - *a4
      - *a23
      - *a2
      - *a34
      - *a29
  compatibility:
    text: "A mixed Malawi mbuna aquarium can work when companions have suitable water needs, manageable territorial demands and sufficiently different appearances. The minimum tank here is for a single harem, not every proposed community. Iodotropheus sprengerae and orange Maylandia estherae are conditional candidates in larger structured setups rather than guaranteed pairings. Other Labidochromis share a presumed hybrid risk; blue lookalikes can trigger rivalry and forceful species can dominate the group. Predation level 0 reflects the available feeding evidence, but incidental fry loss is still possible. The conservative feeding flag also matters when a proposed companion requires a rich animal-food staple."
    sources:
      - *a19
      - *a35
      - *a43
      - *a4

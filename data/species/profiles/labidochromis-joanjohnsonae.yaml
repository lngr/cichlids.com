profile:
  overview:
    text: "The Pearl of Likoma brings two contrasting adult appearances to a Malawi aquarium: blue males and females with warm orange markings. The accepted name is Labidochromis joanjohnsonae, while Exasperatus remains a familiar trade name derived from a synonym. Two legacy catalog entries represent this one species. Its small size should be considered together with territorial behaviour and repeated male pursuit, so an established rocky aquarium and a suitable social unit matter more than the apparent simplicity of its feeding."

      - *a10
  problems:
    text: "Social pressure can become serious before obvious wounds appear. Repeated hiding, missed feeding opportunities and damaged fins call for checking space, shelter and the number of females exposed to a male. Excess feeding can produce obesity and poor water quality, while the species-specific strength of the bloat warning remains uncertain. General dH recommendations should not be read as measured KH limits. A keeper report at 14 dKH came immediately after stocking and does not establish healthy long-term keeping at that value. Misidentified or mixed breeding stock adds uncertainty to both behaviour and offspring ancestry."

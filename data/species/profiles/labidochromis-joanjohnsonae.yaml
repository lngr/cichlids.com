    confidence: "high"
    rationale: "The settled waterbody decision is the lake-wide natural 21 to 29 C range. Eccles reports a cool inshore reading of 21 C, Vollmer describes summer surface water near 28 C and cooler winter mixing, and the retained later lake study supplies the broader seasonal context. Branchu records a 25.4 to 22.8 C surface-to-deep profile and FAO compiles 23 to 25 C, rather than each independently measuring the whole decided range. FishBase gives the narrower species-summary interval of 24 to 26 C. The evidence preserves these distinct scopes."

        title: "Eschmeyer's Catalog of Fishes: Melanochromis exasperatus synonym record"
        url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Melanochromis&species=exasperatus"
        accessed: "2026-10-13"
        archived: "researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-640b4c21/2026-10-14T202611Z"
  habitat:
    text: "Likoma Island is the native home of this rock-associated cichlid. FishBase also records a population introduced at Thumbi West Island. Specialist accounts place most fish among shallow rocks, with fewer individuals at greater depth; reports differ about the amount of sediment on those rocks. The natural lake ranges used here are 21 to 29 C, pH 7.7 to 8.6, GH 3 to 5 dGH and KH 5 to 8 dKH. These combine lake studies across places and seasons rather than measuring a single Likoma collecting site. Lake alkalinity is higher than its calcium-and-magnesium hardness, so GH and KH should be measured separately."
    sources:
      - *a2
      - *a33
      - *a39

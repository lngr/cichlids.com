    confidence: "low"
    rationale: "The tally considers all four votes in agreement within its 2 dGH threshold and decides 0 to 1 dGH. Generator, checker-b and checker-c proposed 0 to 1; checker-a proposed 0 to 2. The Suriname water assessment reports coastal total hardness equivalent to about 0.15 to 0.55 dGH, and Stalsberg recorded undetectable GH at Brokopondo without confirming this fish at that measured station. These are regional proxies, not a species-linked hardness series. The rounded range remains low confidence. Checker-a's evidence estimating 0 to 3 dGH from conductivity is retained as an inference; conductivity cannot determine GH uniquely. A 2 dGH Kanawee reading concerns a different assemblage. FishBase's upper bound of 20 dGH is not evidence of typical native water."

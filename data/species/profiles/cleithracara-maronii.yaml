      rationale: "The qualified-majority tally decides 0 to 9 dKH with five of six votes agreeing within the 2 dKH threshold. Generator proposed 0 to 9, checker-a 0 to 10, checker-b 0 to 8, checker-c 0 to 5, tiebreaker-1 0 to 8 and tiebreaker-2 0 to 10. Nine follows the median upper bound of the agreeing proposals and the retailer's explicit 4 to 9 recommendation; the lower extension contains the provisional natural range. This is not a conservative or median verification method. The wider Aquaristik-Lexikon interval of 1 to 10 and the spawning observation at 11 are retained, but neither establishes years-long endpoint health. Aqua-Pedia gives 1 to 8, Il Mio Acquario 2 to 8, DRTA a target of 5 and one breeder observed 2 with a later recommendation of 3. Forum advice about 0 to 2 is not a maintenance outcome. GH limits cannot establish KH limits. Confidence remains low."

  compatibility:
    text: "Peaceful adult pencilfish, hatchetfish and suitable tetras are reasonable companions when their water needs overlap and total stocking leaves enough room. The named partners are examples supported by recommended companion groups, not controlled trials. Powerful predators and persistent territorial bullies can intimidate or harm keyholes. Tanganyika breeding colonies add territorial and water-chemistry conflicts. An empty hybrid-group list means no supported named crossing group was found, rather than proven reproductive isolation."

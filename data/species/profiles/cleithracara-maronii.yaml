  problems:
    text: "Stress can keep these fish hidden or interfere with feeding. Check water quality, cover and companions when behaviour changes; alarm colour alone does not diagnose illness. Poor care and diet are associated with impaired growth and head or lateral-line damage, whose causes cannot be identified from appearance alone. Keep maintenance regular and chemistry changes gradual. Ongoing illness deserves qualified assessment. Regional mining and mercury studies describe environmental pressures without proving a specific effect on this species."

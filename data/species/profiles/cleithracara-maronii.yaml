      rationale: "All four runs proposed 0 to 15 dGH and the tally retains that unanimous decision at low confidence. Seriously Fish supplies 2 to 15. Its lower limit is extended to contain the very dilute natural range, an inference supported by regional measurements rather than aquarium survival trials. The decided ceiling is narrower than Maidenhead's upper-only 18 dGH and the 5 to 20 dGH intervals in DCG and DRTA; FishBase also gives an upper-only 20. Those wider recommendations remain in evidence. Fifteen is the specialist care ceiling, not proof that higher GH necessarily harms every captive-bred fish. Wild stock deserves softer conditions."

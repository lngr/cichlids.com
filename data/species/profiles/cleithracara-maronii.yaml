  sexing:
    text: "Juveniles cannot be sexed reliably from appearance. Mature males commonly become larger and develop longer fin extensions, while females usually remain smaller. Compare fish of similar age and condition; size alone can be misleading. The flank mark identifies the species rather than the sex. Two correctly sexed adults are not necessarily compatible, so an established pair is a safer social unit than an arbitrary male and female."

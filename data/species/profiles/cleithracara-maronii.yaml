  maxSizeCm:
    value:
      male: 11.5
      female: 9
    confidence: "low"
    rationale: "The proposal medians are retained as planning estimates of 11.5 cm male and 9 cm female. Generator proposed 11 and 7, checker-a 11 and 8, checker-b 12.5 and 10, and checker-c 12 and 10. The male median sits among aquarium reports of about 10 to 14 cm; Maidenhead gives an unsexed 12.5 cm and DCG 12 to 14. Seriously Fish's 11 cm and FishBase's 7.1 cm are standard lengths, not directly interchangeable with aquarium lengths. Aquario is the only explicit sex-separated numerical source, giving 11 and 7. Nine for females exceeds that explicit female figure because the higher aquarium size reports also describe females as smaller than males, leaving room for larger females in those populations; it is not a directly measured sex-specific maximum. Both medians remain low confidence, especially the female estimate, and exceptional fish can exceed them."

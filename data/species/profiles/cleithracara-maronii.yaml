  diet:
    text: "Natural feeding records chiefly identify small invertebrates. Use appropriately sized prepared food and vary it with foods such as Daphnia, Artemia or insect larvae. Vegetable ingredients can be part of a mixed ration without making this a plant-feeding specialist. The slow-feeding category is inferred from vulnerability to competition, so watch whether each fish gets its share. No special protein-related bloat susceptibility is established. Tiny fry and shrimp can still be consumed."

    confidence: "high"
    rationale: "All four runs place the species in the Guianas and the Orinoco delta. The catalog also includes Amapa in Brazil and historical Trinidad records. Locality proposals differ in coverage: generator names Maroni, Demerara, Suriname coastal creeks, Orinoco delta and Amapa; checker-a names Maroni and Demerara; checker-b adds Barima, Ouanary and Lower Palumeu; checker-c adds historical Trinidad and Amapa. These compatible records are combined, with Trinidad explicitly historical. The Palumeu chapter summarizes an earlier lower-river collection, and Melo et al. cite an earlier Brazilian record rather than capturing this species in their new survey. Glaser's Maroni-only distribution claim conflicts with the catalog and is not adopted."

partners:
  suitable:
    - species: "Nannostomus beckfordi"
      reason: "Peaceful adult pencilfish can provide confidence cues without claiming the spawning substrate."
      condition: "Keep a proper shoal with cover and separate feeding access."
    - species: "Carnegiella strigata"
      reason: "A quiet upper-water companion from the recommended hatchetfish group."
      condition: "Keep a group in matching water with a tightly fitted lid."
    - species: "Gasteropelecus sternicla"
      reason: "An adult surface shoal leaves much of the sheltered lower tank to the keyhole pair."
      condition: "Provide surface space and a secure lid; verify the total stocking capacity."
  unsuitable:
    - species: "Astronotus ocellatus"
      reason: "An adult oscar is much larger and can prey on or intimidate keyholes."
    - species: "Amatitlania nigrofasciata"
      reason: "Breeding convicts can dominate the substrate and repeatedly displace this timid species."
    - species: "Neolamprologus brichardi"
      reason: "Territorial breeding colonies and the usual strongly alkaline Tanganyika conditions are a poor match for this retiring acidic-creek species."
profile:
  overview:
    text: "Cleithracara maronii is a small South American cichlid whose strongest appeal is its quiet behaviour and shared parental care. Adults usually suit peaceful communities, but a breeding pair defends space around its brood. A dark flank mark and eye band contrast with the pale body. Sudden darkening often accompanies alarm. Most fish sold are captive bred; an importer has also reported a Kourou locality line with intermittent red and blue colours, without confirmed separate species status."

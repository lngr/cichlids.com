      rationale: "The unanimous tally, using its 1 C agreement threshold, decides 21 to 28 C. Generator, checker-b and checker-c proposed 21 to 28; checker-a proposed 22 to 28. Seriously Fish explicitly supplies 21 to 28, while Maidenhead and DRTA recommend 22 to 26 and FishBase supplies 22 to 25 from an aquarium book. Retain these narrower recommendations as routine-care guidance; they do not negate the wider specialist interval. The 26 C breeder observation supports its interior, not both endpoints. The range contains the decided natural temperature."

  sizeAndGrowth:
    text: "The planning estimates are 11.5 cm for males and 9 cm for females, with low confidence in the sex-specific limits. Published aquarium sizes vary and some scientific values exclude the tail. Females are usually smaller, but their precise maximum is poorly documented. A provisional lifespan of 7 to 9 years reconciles care-sheet estimates; reports near 12 years lack verified age histories. Clean water and dependable food access support growth, but no reliable growth timetable was found."

    rationale: "All four runs proposed 0 to 1 dKH, retained exactly from the tally as a low-confidence natural estimate without a verification object. Stalsberg measured 0.5 dKH at Brokopondo, but the keyhole capture was at a separate creek without chemistry. The Norwegian and English accounts describe the same expedition and are not independent measurements. Landburg's interior Palumeu alkalinity corresponds to about 0.11 to 0.37 dKH and is a regional comparison, not chemistry at a confirmed keyhole station. The 1 dKH Kanawee reading concerns another assemblage. Neither GH, conductivity nor pH alone determines KH. No readable species-linked alkalinity series establishes the endpoints; inaccessible collecting material and non-open-access books provide no numeric support."

  socialBehavior:
    text: "Pair formation can begin within a juvenile group, but surplus adults may need separate accommodation. In a suitable pair aquarium, displays and short chases are more typical than damaging conflict. Breeding parents may exclude both other keyholes and different species from an area roughly 60 cm across. Calm schooling companions can encourage exploration. Persistent hiding or missed meals warrants checking whether cover, disturbance or competition is limiting the fish."

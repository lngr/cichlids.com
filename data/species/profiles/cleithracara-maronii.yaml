  habitat:
    text: "Its range includes the Guianas and the Orinoco delta, with Amapa included by the taxonomic catalog and historical records from Trinidad. Sheltered lowland creeks provide leaf cover, submerged roots and gentle current. Typical habitat accounts support 26 to 27 C and pH 4 to 5.5. Regional measurements suggest GH and KH near zero, but are not matched to identified fish at each station. Wider stream measurements remain relevant context rather than established species limits."

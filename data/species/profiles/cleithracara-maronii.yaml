      rationale: "Tally method qualified-majority. The qualified-majority tally selects 26 to 27 C from checker-b, checker-c and both tie-breakers, following the DCG species habitat account. Generator proposed 23 to 27 C from regional Suriname habitat classes and checker-a proposed 24 to 27 C by inference. The DCG account is species-specific but lacks station dates and methods, so this is a provisional typical interval rather than complete seasonal coverage. The wider Fishipedia claim of 25 to 29 C and the generator's regional forest-creek measurements of 23 to 27 C remain in evidence. Neither links a complete temperature series to identified fish. FishBase's 22 to 25 C cites aquarium reference 1672. Regional readings of 30 C at Brokopondo and 24.8 C in the Nassau survey concern other fish assemblages and do not set this range."

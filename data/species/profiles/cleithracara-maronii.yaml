  breeding:
    text: "Both adults guard offspring after laying eggs on a firm exposed surface. Suitable sites can include wood, stone or a broad leaf. The parents divide attention between the clutch and nearby intruders, and care continues after the young begin swimming. Reported clutch sizes differ substantially. Early broods may fail after disturbance or parental inexperience. Very small foods can support free-swimming fry; other community fish can reduce brood survival."

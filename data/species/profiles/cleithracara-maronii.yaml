  husbandry:
    text: "Allow one established pair at least 105 litres with a base 90 cm long and 30 cm deep. Give the fish sheltered resting places, subdued light and open access to food. A mature filter should maintain clean water without strong current through every refuge. Around 24 to 26 C and pH 6 to 7 are practical routine targets for acclimated captive stock. The wider tolerance bands are compatibility envelopes, with GH and especially KH endpoints less securely documented."

  socialBehavior:
    text: The red devil forms monogamous pairs and defends a large territory. Two males cannot share a
      tank, and even a male and a female may fight to the death if the female is not ready to spawn.
      Keepers therefore raise a group of six or more juveniles together and take out the others once
      a pair has formed. A tank divider should always be at hand, because the male may turn on his
      partner at any time, especially when guarding fry. Towards other species the red devil is
      equally hostile; it bites hands during maintenance and treats equipment as a rival. Visual
      barriers lower the pressure but do not remove it.

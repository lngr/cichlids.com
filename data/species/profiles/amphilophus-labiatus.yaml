  habitat:
    text: "Amphilophus labiatus lives in Lake Nicaragua and Lake Managua, which drain to the Caribbean
      through the San Juan River; the Catalog of Fishes also lists Costa Rica, and the species
      rarely enters rivers such as the Tipitapa, which links the two lakes. Both lakes are shallow,
      warm and constantly mixed by wind, with turbid water. The fish stays near submerged rocks of
      volcanic origin and searches crevices for prey. The water is alkaline: the surface of the
      lakes measures about pH 8.2 to 9.3, the higher values in Lake Managua, which has no regular
      outflow and is therefore saltier and richer in sodium bicarbonate. Lake Nicaragua is soft and
      only weakly buffered. Water temperatures range from about 24 C in the cool season to 30 C and
      more in the shallows in the hot season."

        accessed: 2026-10-13
  sexing:
    text: "Adult males are larger and more massive than females and grow longer, pointed dorsal and anal
      fins. Many males develop a nuchal hump, which in the wild appears mainly in the breeding
      season but in tanks often stays permanent. Before spawning both sexes show a swollen forehead,
      and the female shows a blunt, broad breeding tube while the male has a narrow, pointed one.
      Juveniles cannot be sexed reliably by colour or shape, which is another reason to start with a
      group. Telling a pure red devil from a Midas cichlid is difficult: A. labiatus has a slimmer
      body, a longer and more pointed snout and thicker lips, but hybrids blur these differences."

  diet:
    value:
      type: invertivore
      bloatSensitive: false
      foods:
        - snails
        - insect larvae
        - worms
        - crustaceans
        - small fish
        - cichlid pellets
        - frozen shrimp and mussel
        - vegetable matter
    confidence: medium
    rationale: "The tally decides invertivore without bloat sensitivity by qualified majority (4 of 6
      votes: generator, checker-a, tiebreaker-1 and tiebreaker-2 invertivore; checker-b and
      checker-c omnivore). Every source on the natural diet of A. labiatus itself names animal food:
      FishBase lists snails, insect larvae, worms and other bottom animals plus some small fish, the
      Nordic Cichlid Society register names insects, crustaceans, snails and larvae, and the Cichlid
      Room Companion calls it insectivorous and detritivorous. The ecological literature reads the
      fleshy lips and pointed snout as tools for sucking crustaceans and other invertebrates out of
      rock crevices (Barluenga and Meyer; Machado-Schiaffino et al. 2014 and 2017), and stable
      isotopes place the species above the thin-lipped A. citrinellus in the food web (Manousaki et
      al.). The mixed diet with algae and aufwuchs that Barlow describes belongs to A. citrinellus
      and the Midas complex as a whole. The omnivore votes rest on care sheets (Seriously Fish,
      Fishkeeper, AquariumDomain) that recommend vegetable food in the aquarium; FishProfiles uses a
      general carnivore label. Fish are a minor part of the diet, so piscivore does not apply. No
      source reports bloat on a protein-rich diet; Seriously Fish advises against mammalian meat,
      which is a general husbandry point."

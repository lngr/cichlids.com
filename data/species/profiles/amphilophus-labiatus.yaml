  ghDgh:
    value:
      min: 3
      max: 8
    confidence: medium
    rationale: "The tally decides 3 to 8 dGH unanimously from four votes (generator 3 to 8.5, checker-a
      and checker-b 3 to 8, checker-c 3.3 to 6.5 dGH). Lake Nicaragua is soft: Swain reports 14.7
      mg/L calcium and 5.4 mg/L magnesium at the surface and 13.2 and 7.2 mg/L near the bottom,
      which gives 3.3 to 3.5 dGH with dGH = Ca/7.14 + Mg/4.34, and the FAO compilation converts to
      about 3.5 dGH for Lake Nicaragua and 6.4 dGH for Lake Managua. Urist found 0.9 mmol/L calcium
      and 0.6 mmol/L magnesium in Lake Nicaragua, about 8.4 dGH, so the two Lake Nicaragua analyses
      differ by a factor of about 2.5. The Tipitapa River, fed mainly by Lake Managua water, holds
      100 to 137 mg/L total hardness as CaCO3 (5.6 to 7.7 dGH). Lake Managua is an evaporative lake
      with about 1400 mg/L dissolved solids dominated by sodium bicarbonate and chloride
      (Barberena-Moncada et al.), so its high mineral content does not translate into an equally
      high general hardness. The decided range spans the soft Lake Nicaragua water and the
      Managua-fed river."

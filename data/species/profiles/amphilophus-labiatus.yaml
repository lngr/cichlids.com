  predation:
    value: 2
    confidence: medium
    rationale: "The tally decides level 2 unanimously (4 of 4 votes). In the lakes the red devil feeds
      mainly on bottom invertebrates but also takes small fish: FishBase and the Nordic Cichlid
      Society register list small fish among its food, Seriously Fish notes fish eating in the wild,
      and AquariumDomain names small fish among the natural foods. Stable isotopes place it on a
      higher trophic level than the sympatric thin-lipped Midas cichlid (Manousaki et al.). Fish are
      no main part of the diet, so level 3 does not apply, but a large cichlid of this kind eats any
      tankmate that fits into its mouth, which is level 2. The Cichlid Room Companion calls the
      species insectivorous and detritivorous, which does not contradict occasional fish eating."

variants:
  - name: Wild type
    kind: color-morph
    note: Grey to olive fish with dark bars or blotches; the common colour of wild populations.
  - name: Gold or red
    kind: color-morph
    note: Orange to deep red fish without dark pigment, derived from the gold morph that occurs in the
      lakes; the dominant form in the trade.
  - name: White and piebald
    kind: color-morph
    note: Tank-bred white, orange-and-white and marbled lines.
  - name: Lake Nicaragua
    kind: locality
    note: Wild fish from Lake Nicaragua (Cocibolca).
  - name: Lake Managua
    kind: locality
    note: Wild fish from Lake Managua (Xolotlán), the type locality.
features:
  origin:
    value:
      continent: Central America
      region: Great lakes of Nicaragua (San Juan basin, Atlantic slope)
      waterbody: null
      localities:
        - Lake Nicaragua (Cocibolca)
        - Lake Managua (Xolotlán)
        - Tipitapa River (rare)
        - Costa Rica (range record of the Catalog of Fishes)
    confidence: high
    rationale: All four runs agree on the two great lakes of Nicaragua on the Atlantic slope. The
      Catalog of Fishes and FishBase restrict the species to lakes Nicaragua and Managua, Barlow and
      Munsey state that it lives only there, and FishBase and Fishkeeper add that it rarely enters
      the Tipitapa River that links the lakes. The Catalog of Fishes and the Nicaraguan checklist of
      Angulo et al. also give Costa Rica; no species-specific field account confirms a Costa Rican
      site, so it is kept as a range record only and does not inform the water values. Introduced
      populations outside the range are not part of the origin.

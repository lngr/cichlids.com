  khDkh:
    value:
      min: 3
      max: 15
    confidence: low
    rationale: "No qualified majority formed among the six votes (generator 3 to 13, checker-a 3 to 16,
      checker-b 3.5 to 10, checker-c 3.3 to 24.5, tiebreaker-1 3 to 16, tiebreaker-2 3.4 to 13
      dKH), and a lake value does not apply because the water body is not decided. The tally
      therefore takes the median of the minima and of the maxima of all votes, with confidence
      low. The minima sort to 3, 3, 3, 3.3, 3.4, 3.5, whose middle pair averages 3.15, decided as 3
      dKH; the maxima sort to 10, 13, 13, 16, 16, 24.5, whose middle pair averages 14.5, rounded to
      15 dKH. The median range of 3 to 15 dKH contains the measured Lake Nicaragua alkalinity:
      Swain gives 60 to 65 mg/L as CaCO3 there, about 3.4 to 3.6 dKH (dKH = mg/L CaCO3 / 17.85),
      while Urist found about 3 mmol/L bicarbonate (8.4 dKH). The Tipitapa River, which carries
      Lake Managua water towards Lake Nicaragua, held 82 to 280 mg/L alkalinity, 3.8 to 12.9 dKH
      when read as bicarbonate and 4.6 to 15.7 dKH when read as CaCO3. The sources reach wider than
      the decided range: for Lake Managua itself only the FAO compilation gives carbonate plus
      bicarbonate, about 24.4 dKH; the lake is an evaporative sodium bicarbonate lake with about
      1400 mg/L dissolved solids and a conductivity near 1770 microsiemens per cm in the 1980s
      baseline (Moreno and Pacheco), so its alkalinity may exceed the decided upper bound of 15.
      The measured sources thus range from about 3.4 to 24.4 dKH."

  minTank:
    value:
      volumeL: 600
      lengthCm: 200
      depthCm: 60
    confidence: medium
    rationale: The minimum is for one adult pair, the social unit decided above. Seriously Fish puts a
      single fish at no less than 150 by 45 cm and a breeding pair at about 180 cm length, Aqualog
      gives at least 200 cm and the Nordic Cichlid Society 250 cm and 1000 litres. A pair of adults
      of 24 to 30 cm needs room to separate and a divider, so 200 by 60 cm with about 600 litres is
      the minimum; tanks with tankmates need more than 1000 litres. The proposals were 700, 600, 500
      and 400 litres; the last one was for a single fish.

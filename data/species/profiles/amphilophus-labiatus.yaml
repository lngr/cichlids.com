partners:
  suitable:
    - species: Parachromis managuensis
      reason: A large, robust guapote from the same lakes that can hold its own against the red devil.
      condition: Tank of more than 1000 litres with many visual barriers; remove when the red devils breed.
    - species: Pterygoplichthys pardalis
      reason: Large armoured catfish that stays on the bottom and is hard to injure.
      condition: Tank of more than 1000 litres.
    - species: Barbonymus schwanenfeldii
      reason: Large, fast open-water fish that avoids the red devil and is too big to swallow.
      condition: Group in a tank of more than 1000 litres.
    - species: Herichthys carpintis
      reason: Robust Central American cichlid of similar size and temperament.
      condition: Tank of more than 1000 litres; keep apart from breeding pairs.
  unsuitable:
    - species: Amphilophus citrinellus
      reason: Same hybrid group; crosses readily and fights like a conspecific.
    - species: Amphilophus trimaculatus
      reason: Same hybrid group; parent species of flowerhorn crosses.
    - species: Pterophyllum scalare
      reason: Slow, peaceful fish that is chased, injured or eaten.
    - species: Amatitlania nigrofasciata
      reason: Small cichlid that is killed or eaten by the much larger red devil.
    - species: Paracheirodon innesi
      reason: Small tetra that is eaten.
    - species: Symphysodon aequifasciatus
      reason: Calm soft-water fish that cannot cope with the aggression and needs other water.
profile:
  overview:
    text: The red devil is a large, heavy-bodied cichlid from the two great lakes of Nicaragua. Its name
      in science refers to the lips, which in wild fish form thick, fleshy lobes; aquarium-raised
      fish usually show much smaller lips. In the trade the name red devil is also used for the
      closely related Midas cichlid, Amphilophus citrinellus, and for crosses of both, so many fish
      sold under this name are not pure A. labiatus. Wild fish are mostly grey with dark markings,
      while the orange, red and white fish of the hobby go back to a gold morph that occurs
      naturally in the lakes. The species is known for its intelligence and its bond with the
      keeper, but also for an aggression that few other cichlids match. It belongs in very large
      tanks, alone or as a pair.

  sizeAndGrowth:
    text: Males commonly reach 25 to 30 cm in the tank, females stay a few centimetres smaller. Some
      care sheets give 35 to 40 cm, but such sizes are exceptional and may refer to hybrids. Growth
      is fast with good feeding, and fish reach most of their size within about three years. Males
      become bulkier with age, develop longer pointed dorsal and anal fins and often a nuchal hump
      on the forehead, which in pure A. labiatus tends to be smaller than in the Midas cichlid. With
      good care the species lives for well over ten years, so a keeper should plan for a long
      commitment.

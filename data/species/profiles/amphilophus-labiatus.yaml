        max: 31
      confidence: medium
      rationale: The tally decides 22 to 31 C unanimously from four votes (generator 22 to 31, checker-a
        22 to 32, checker-b and checker-c 22 to 30 C). Seriously Fish, Fishkeeper and FishProfiles
        recommend 22 to 28 C for the aquarium and Aqualog 24 to 29 C, which sets the lower end. The
        upper end is the natural maximum of 31 C, which the fish meet in their lakes and which
        research laboratories approach when they rear Midas cichlids at about 28 C. The Nordic
        Cichlid Society register and FishBase give a wider 28 to 33 C, so the decided upper end is
        narrower than these two sources. At the warm end the tank needs strong aeration, because
        these large fish have a high oxygen demand.

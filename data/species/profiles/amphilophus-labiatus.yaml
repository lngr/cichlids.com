        accessed: 2026-10-13
      - kind: archive
        title: cichlids.com forum thread 226
        url: https://www.cichlids.com/disc/read.php?1,226
        accessed: 2026-10-13
  diet:
    text: In the lakes the red devil feeds mainly on animals from the bottom and from rock crevices,
      such as snails, insect larvae, worms and crustaceans, and also eats small fish. Its thick lips
      and pointed head help it to suck prey out of narrow gaps. In the aquarium it accepts nearly
      every food. A good cichlid pellet or stick as staple, varied with frozen shrimp, krill, mussel
      and earthworms, keeps it healthy. Shrimp with shell help to keep the red and orange colours.
      Some vegetable food such as peas or spinach is accepted. Mammalian meat such as beef heart and
      live feeder fish are not needed and are best avoided.

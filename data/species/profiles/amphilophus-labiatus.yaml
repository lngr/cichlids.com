  temperatureC:
    value:
      min: 24
      max: 31
    confidence: medium
    rationale: The tally decides 24 to 31 C unanimously from four votes (generator and checker-a 24 to
      31, checker-b 25 to 29, checker-c 24 to 30 C), as the median of the agreeing bounds. Both
      great lakes are shallow, wind-mixed and without lasting stratification, so the rocky littoral
      has nearly the temperature of the whole water column. Swain measured 25 to 28 C at the surface
      of Lake Nicaragua, 24.7 to 26 C in Lake Managua and 24 to 26 C near the bottom in the early
      1960s; Collado et al. recorded 27.5 to 28 C at 1 m depth early in the morning in November, and
      the FAO field compilation gives 26 to 30 C for Lake Managua. These cool-season and morning
      readings set the lower end. The upper end of 31 C allows for afternoon and dry-season warming
      of the shallows, which the 28.5 to 32.4 C of the Tipitapa River between the lakes indicates.
      FishBase gives 28 to 33 C after an aquarium book rather than a field measurement and carries
      little weight.

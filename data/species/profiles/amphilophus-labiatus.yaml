  hybridGroups:
    value: [amphilophus-citrinellus-complex, amphilophus-trimaculatus-midas, parachromis-dovii-amphilophus-labiatus]
    confidence: high
    rationale: >-
      The red devil is a member of the documented Midas complex through wild introgression with A.
      citrinellus in lakes Masaya and Xiloá (Barlow and Munsey 1976) and the lack of intrinsic
      barriers among Midas cichlids (Kautt et al. 2016). Its cross with A. trimaculatus is one of
      the documented origins of the flowerhorn (Tarkhani et al. 2016, Sari et al. 2023), which makes
      it a member of the group amphilophus-trimaculatus-midas.
      The curated hybrid-groups.yaml file defines parachromis-dovii-amphilophus-labiatus as a presumed pairwise crossing group based on hobby photographs labelled as captive offspring, without verified parentage or documented access to conspecific mates.

  compatibility:
    text: The red devil is no community fish. Kept alone or as a pair it is easiest to manage. In tanks
      of more than 1000 litres with many visual barriers, robust Central American cichlids of
      similar size, large armoured catfish and large, fast barbs can live with it, but some
      individuals do not tolerate any company, and breeding pairs drive out or kill tankmates. Small
      or calm fish, such as angelfish, tetras or small cichlids, are eaten or bullied to death.
      Never combine it with the Midas cichlid, the three-spot cichlid or other members of the Midas
      complex, because they cross readily and the hybrids spoil both lines.
    sources:
      - kind: database
        title: "Seriously Fish: Amphilophus labiatus (Red Devil Cichlid)"
        url: https://www.seriouslyfish.com/species/amphilophus-labiatus/

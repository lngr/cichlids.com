  synonyms:
    - name: Heros labiatus Günther, 1864
      note: Original combination; type locality Lake Managua.
    - name: Cichlasoma labiatum (Günther, 1864)
      note: Combination of the older literature, for example Barlow and Munsey (1976).
    - name: Heros lobochilus Günther, 1867
      note: Synonym according to the Catalog of Fishes; described from Lake Managua.
    - name: Cichlasoma dorsatum Meek, 1907
      note: Synonym according to the Catalog of Fishes; described from Lake Managua at Managua.
    - name: Amphilophus froebelii Agassiz, 1859
      note: "Not a confirmed synonym: the Catalog of Fishes gives its status as uncertain. The name rests
        on a one-sentence description from Lake Nicaragua, is probably the same fish and is treated
        as an unused senior name."
  legacyNames:
    - Amphilophus labiatus
  note: The Catalog of Fishes lists Amphilophus labiatus as valid, with Lake Managua as type locality
    and lakes Nicaragua and Managua plus Costa Rica as range. Heros erythraeus Günther, 1867, long
    treated as a synonym, is listed there as the valid Lake Managua species Amphilophus erythraeus
    and is therefore not a synonym here. The thick-lipped great-lake fish are genetically only
    weakly separated from the Midas cichlid A. citrinellus, the trade name red devil is also used
    for A. citrinellus, and aquarium stock is often of mixed origin.
names:

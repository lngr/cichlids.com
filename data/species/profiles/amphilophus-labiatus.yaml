    confidence: high
    rationale: All four runs agree. The species lives near submerged volcanic rocks and forages in
      crevices, for which its thick lips are an adaptation (Seriously Fish, Manousaki et al.,
      Machado-Schiaffino et al. 2014); the lake floor between the rocks is mud and sand, and the
      fish dig pits in soft substrate for the fry. In the tank it needs heavy, secured rocks and a
      sand or fine gravel bottom; plants are uprooted.

  husbandry:
    text: A pair needs a tank of at least 200 cm length and about 600 litres; with tankmates more than
      1000 litres are needed. The fish digs constantly and moves loose decoration, so rocks must be
      heavy or glued together, and plants do not survive. A sand or fine gravel bottom suits the
      digging. Heaters and pipes need guards, and a heavy, weighted cover prevents jumps. The
      species is a large eater and produces much waste, so a powerful filter, strong aeration and
      large weekly water changes are essential. Medium-hard, neutral to alkaline water at 24 to 28 C
      works well; the species adapts to a wide range of tap water but should not be kept in soft,
      acid water.

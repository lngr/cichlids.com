  breeding:
    value: cave-spawner
    confidence: medium
    rationale: Biparental substrate brooder with long brood care. Eggs are laid in a rocky cave or on a
      vertical stone, slate or piece of wood, and the larvae are then moved into dug pits (Seriously
      Fish, Fishkeeper); the Cichlid Room Companion classes the species as a cave-spawning substrate
      brooder. Three runs chose cave-spawner; checker-c chose open-substrate-spawner because
      FishProfiles and LiveAquaria describe eggs on exposed hard surfaces. Caves are taken when
      available, so cave-spawner is kept, with the note that the fish is flexible about the spawning
      site.

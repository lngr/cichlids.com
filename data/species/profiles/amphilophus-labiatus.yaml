  ph:
    value:
      min: 8.2
      max: 9.3
    confidence: medium
    rationale: "The tally decides pH 8.2 to 9.3 by qualified majority (5 of 6 votes; generator and
      tiebreaker-1 8.0 to 9.3, checker-a, checker-b and tiebreaker-2 8.2 to 9.3, checker-c 7.0 to
      9.3). The lower bound is the median of the agreeing minima. Both lakes are alkaline: Swain
      measured 8.2 to 8.9 at the surface of Lake Nicaragua and 8.9 to 9.3 in Lake Managua in dry and
      rainy season, the ILEC lake database gives surface means of 9.18 and 9.26 for eleven Lake
      Managua stations in 1988, and Härer et al. measured 8.59 in Lake Nicaragua and 8.69 in Lake
      Managua at 1 m depth. The sources span a wider range than the decision: the Tipitapa River
      between the lakes reached down to 8.0, the FAO compilation gives 7.0 for Lake Nicaragua, and
      the profundal water of Lake Nicaragua is 7.4 to 7.8 (Swain). The profundal is no habitat of
      this rock-dwelling fish, and the single FAO reading is outweighed by the repeated surface
      measurements."
    sources:
      - kind: literature
        title: "Swain, F. M. (1966). Bottom sediments of Lake Nicaragua and Lake Managua, western Nicaragua.
          Journal of Sedimentary Research 36(2), 522-540."

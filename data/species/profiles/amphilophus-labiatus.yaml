  beginnerSuitability:
    value: demanding
    confidence: medium
    rationale: Hardy and easy to feed, but its size, extreme aggression, digging and the difficulty of
      forming a pair without injuries make it a fish for experienced keepers with very large tanks;
      the Nordic Cichlid Society rates it advanced and Aqua-Fish discourages beginners. Checker-b
      proposed moderate after the Cichlid Room Companion, which rates it for intermediate aquarists,
      and Seriously Fish rates the care itself as moderate; three runs chose demanding because the
      lethal aggression and the tank size outweigh the easy water and food demands.

  breeding:
    text: Once a compatible pair exists, breeding is easy. Both partners clean a hard surface, usually
      inside a rocky cave or on a vertical stone or piece of wood, and the female lays several
      hundred eggs, up to about 700. The eggs hatch after two to three days, and the parents move
      the larvae into pits they have dug in the sand. The fry swim freely after about another week
      and take newly hatched brine shrimp. Both parents guard the young for several weeks. During
      this time the male is extremely aggressive and may attack the female, so a divider helps. A
      pair can spawn again and again, and the many large offspring are hard to place, so breeding
      should be planned.

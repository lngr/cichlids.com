      orange, red, yellow or white fish occurs in the lakes and is the basis of the trade lines,
      which range from plain orange and red to white, piebald and marbled (Seriously Fish,
      Fishkeeper). Because plain gold fish and patterned wild-type and piebald fish are all common,
      the pattern is mixed. The proposals differed in the colour list and between plain and mixed;

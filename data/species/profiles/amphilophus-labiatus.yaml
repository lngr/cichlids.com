  problems:
    text: The most common mistake is a tank that is too small, which leads to constant fighting and dead
      tankmates or partners. Putting an adult male and female together without preparation often
      ends in a killed female. Unsecured rocks can fall and break the glass when the fish dig
      beneath them. Large amounts of waste quickly raise nitrate and stress the fish; poor water is
      linked with hole-in-the-head symptoms and fin damage in large cichlids. Buyers should know
      that many fish sold as red devils are hybrids with the Midas cichlid, so adult size and
      appearance may differ from expectations. Overfeeding with fatty or mammalian food can cause
      digestive trouble and fatty organs.
    sources:
      - kind: database
        title: "Seriously Fish: Amphilophus labiatus (Red Devil Cichlid)"
        url: https://www.seriouslyfish.com/species/amphilophus-labiatus/

    verification:
      method: unanimous
      votes: {agree: 4, total: 4}
    rationale: >-
      All four votes chose level 1. The firemouth sifts the bottom for small invertebrates and is no
      fish hunter. Seriously Fish warns that it may eat much smaller fish and Fishkeeper advises
      against tiny tankmates. In Laguna Caobas small fish turned up in juvenile stomachs only in some
      months and as a minor item next to zooplankton, and a review of native cichlids reports the

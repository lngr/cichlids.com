  temperatureC:
    value: {min: 24, max: 30}
    confidence: medium
    verification:
      method: qualified-majority
      votes: {agree: 4, total: 6}
    rationale: >-
      Decided by qualified majority: checker-a, checker-b, tiebreaker-1 and tiebreaker-2 proposed 24
      to 30 C, the generator 22 to 32 C and checker-c 21 to 30 C. The range rests on field
      measurements where the species was caught: Laguna Caobas 25.1 to 29.3 C, the petenes with
      seasonal means of 25.0 to 26.6 C, Laguna Chile Verde about 24 C in late winter and about 29 C in
      spring, Lacantun basin site means of 23.6 to 29.6 C and Calakmul pool group means of 26.1 to
      27.9 C. The sources reach wider: single daytime readings of the shallow Calakmul pools span 22
      to 32 C, cenotes of the Ring of Cenotes reach 32.2 C in the dry season, and the Usumacinta basin
      survey measured 20.8 to 29.8 C, its minimum in an upland tributary. These extremes are short
      spells of small or upland waters and are not part of the typical range. FishBase gives 26 to 30
      C from an aquarium atlas.

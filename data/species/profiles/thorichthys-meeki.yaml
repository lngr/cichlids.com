      frequent but ritualised and rarely harmful. In tanks rivals settle disputes by flaring the red
      throat and gill covers, and a keeper of a group of eight saw a clear pecking order with border
      disputes between pairs but no injuries. Breeding pairs chase other firemouths hard, and females

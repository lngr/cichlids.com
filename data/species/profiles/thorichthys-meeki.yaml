  breeding:
    value: open-substrate-spawner
    confidence: high
    rationale: >-
      All four runs agree. The pair cleans a stone, a piece of wood, a broad leaf or a vertical
      surface such as a coconut shell or the filter, and both parents guard several hundred eggs;
      the larvae are moved into pits in the sand. Wild pairs at Laguna Bacalar nested in small rock
      crevices, which still leaves the eggs on an exposed surface. The Cichlid Room Companion lists
      substrate breeding as well.
    sources:
      - *fishbase
      - *sf
      - *fishkeeper
      - *pfk
      - *parha
      - *neil
      - *crc
  beginnerSuitability:
    value: moderate
    confidence: medium
    rationale: >-
      The runs split evenly: the generator and checker-a chose easy, checker-b and checker-c
      moderate. The firemouth is hardy, adapts to a wide range of water and breeds readily, and
      Tropical Fish Hobbyist and the Cichlid Room Companion rate it as a cichlid for beginners.
      Seriously Fish rates it moderate because it needs a tank of at least 120 cm and a mature,
      stable aquarium, and a breeding pair turns aggressive towards tankmates. Moderate is chosen
      because these demands go beyond an ordinary community tank.

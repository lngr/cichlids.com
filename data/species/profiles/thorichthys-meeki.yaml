partners:
  suitable:
    - species: Xiphophorus hellerii
      reason: Robust swordtails share the native waters, use the upper water layers and act as dither fish that draw the firemouths into the open.
    - species: Poecilia mexicana
      reason: A sympatric livebearer that is large and quick enough not to be eaten and stays clear of the bottom territory.
    - species: Astyanax aeneus
      reason: Mexican tetras live alongside firemouths in the wild and fit a biotope tank as an active midwater shoal.
    - species: Heros severus
      reason: A calm cichlid of similar size that does not bully the comparatively shy firemouth.
    - species: Andinoacara pulcher
      reason: The blue acara is placid and of similar size, so both can hold small territories without serious fights.
      condition: Tank of at least 150 cm with separate caves for each pair.
    - species: Megalechis thoracata
      reason: A robust armoured catfish that shared a community tank with a firemouth pair without problems.
  unsuitable:
    - species: Amatitlania nigrofasciata
      reason: The convict cichlid has crossed with firemouths in tanks, and it is bolder and claims more of the tank.
    - species: Thorichthys maculipinnis
      reason: A close relative that has spawned with a female firemouth in a tank, so mixed pairs and hybrid fry are a risk.
    - species: Parachromis managuensis
      reason: A large predatory cichlid that eats or batters a 15 cm firemouth.
    - species: Amphilophus citrinellus
      reason: Far larger and more aggressive; the firemouth comes off worst in fights with such boisterous cichlids.
    - species: Maylandia zebra
      reason: Hasty, aggressive mbuna that crowd and chase constantly, which the shy firemouth cannot cope with.
    - species: Corydoras spp.
      reason: Small bottom dwellers that a spawning pair chases from the breeding site again and again.
profile:
  overview:
    text: >-
      The firemouth cichlid is one of the classic Central American cichlids and has been kept by
      hobbyists for many decades. Its name comes from the brick to bright red throat and chest,
      which a male shows off by spreading his gill covers wide; the two dark spots on the gill covers
      then look like a pair of large eyes. Adults stay at a moderate size of about 15 cm and accept a
      wide range of water conditions. Outside breeding the species is rather peaceful for a cichlid
      and even a little shy, which makes it a good choice for a mixed tank with calm companions of
      similar size. A pair that spawns turns into devoted parents and guards its young for weeks.
      Almost all firemouths in the trade are captive-bred.
    sources:
      - *sf
      - *fishkeeper
      - *tfh
      - *pfk
  habitat:
    text: >-
      The firemouth lives in the lowlands of the Yucatan Peninsula and on the Atlantic slope of
      southern Mexico, northern Guatemala and Belize, including the Usumacinta and Belize river
      systems. It turns up in a remarkable variety of waters: sinkholes (cenotes), clear karst lakes
      and lagoons, slow rivers, ditches and seasonal forest pools. Most of these waters run over
      limestone, so they are moderately hard to very hard and neutral to alkaline; the lake of
      Bacalar even carries gypsum water of extreme hardness, although the identity of its firemouth
      population is not settled. The fish stay in shallow water near the shore, over sand or mud with
      stones, plants, leaf litter and fallen branches. Typical water temperatures lie between 24 and
      30 C, with brief spells up to 32 C in shallow pools, and the pH mostly between 6.6 and 8.4.
    sources:
      - *cof
      - *fishbase
      - *sf
      - *neil
      - *vegacendejas
      - *perezceballos
      - *yanez
      - *ecosur
  sizeAndGrowth:
    text: >-
      Males of the firemouth reach about 15 cm in a well-kept aquarium, females usually stop at
      around 12 cm. The largest recorded fish reach 17 cm total length. Young firemouths grow quickly
      on a varied diet and show colour while still small, but the full red of throat and belly takes
      a year or more to develop and is strongest in breeding fish. The fish become sexually mature at
      about 6 to 7 cm. Kept well, firemouths usually live 10 to 12 years. Buyers should plan the tank
      for the adult size, since a group of juveniles bought at 3 cm soon needs far more room.
    sources:
      - *fishbase
      - *sf
      - *fishkeeper
      - *tfh
      - *ffa
  husbandry:
    text: >-
      A pair needs a tank of at least 120 cm length, 40 cm front to back and about 200 litres; a
      group or a community with other cichlids needs 150 cm or more. Fine, smooth sand is essential
      because the fish constantly take mouthfuls of substrate, sift them and push the sand out
      through the gills. Smooth stones, flat slates, roots and a few caves or flowerpots give cover,
      spawning sites and broken lines of sight, while an open area at the front leaves room to swim.
      Only tough plants survive, preferably tied to wood or stones, since the fish dig. Water
      chemistry is uncritical: soft to hard, neutral to alkaline water at 24 to 28 C suits captive-bred
      fish well. Clean water matters more, so a strong filter, regular large water changes and low
      nitrate are important.
    sources:
      - *sf
      - *fishkeeper
      - *pfk
      - *fishbase
  socialBehavior:
    text: >-
      Outside the breeding season firemouths are sociable and tolerate each other well. Disputes
      are mostly settled by display: rivals face each other, flare the red throat and gill covers
      and then swim off, and field studies found such contests frequent but rarely harmful. Once a
      pair forms and spawns, it defends its site and later its brood vigorously against other
      firemouths and any fish that come close. In an average tank one pair is the right unit; in
      large tanks a group of six to eight can be kept, and pairs then form by free choice. Towards
      other species the firemouth is mild and is easily bullied by rough cichlids.
    sources:
      - *neil
      - *sf
      - *fishkeeper
      - *pfk
      - *parha
  diet:
    text: >-
      In the wild firemouths feed from the bottom: they sift sand and mud for water fleas, copepods,
      insect larvae, snails and other small invertebrates, and take some detritus and algae along
      the way. Stomach studies from Quintana Roo and Campeche find animal food in first place. In the
      aquarium they eat almost anything. A good base is a quality sinking granule or pellet,
      supplemented by frozen foods such as brine shrimp, mysis, daphnia and mosquito larvae, and some
      vegetable food such as spirulina. Rich protein food such as bloodworm should be given
      sparingly, since too much of it can upset digestion; small, varied portions are better than
      large meals.
    sources:
      - *valtierra
      - *hinojosa
      - *review2025
      - *sf
      - *fishkeeper
      - *fishbase
  breeding:
    text: >-
      Firemouths are monogamous open spawners and among the easiest cichlids to breed. The pair
      cleans a smooth stone, a piece of wood or a near-vertical surface such as a coconut shell or the
      side of the filter, and the female lays rows of eggs that the male fertilises; a spawn holds up
      to several hundred eggs. The female usually tends the clutch while the male guards the
      surroundings, and the partners swap roles from time to time. After hatching, the parents move
      the larvae into pits dug in the sand. The fry swim freely after a few days and accept Artemia
      nauplii and powdered food at once. Both parents lead and defend them for several weeks. Young
      pairs often eat their first clutches, and tankmates need room to keep out of the way.
    sources:
      - *sf
      - *fishkeeper
      - *pfk
      - *fishbase
      - *neil
  sexing:
    text: >-
      Young firemouths are hard to sex. In adults the male grows larger and usually has longer,
      pointed tips on the dorsal and anal fins, while the female stays smaller, rounder and paler,
      with shorter, more rounded fins; the fin shape is not reliable in every fish. The red of throat
      and belly is usually more intense and more extensive in males, especially during courtship.
      When fish are in breeding condition, the genital papilla helps: in the female it is broad and
      blunt, in the male narrow and pointed. Buying a group of juveniles and letting a pair form on
      its own avoids mistakes.
    sources:
      - *sf
      - *fishkeeper
      - *parha
      - *tfh
  compatibility:
    text: >-
      The firemouth suits a mixed tank of medium-sized, calm fish. Good companions are robust
      livebearers such as swordtails and mollies, Mexican tetras or other sturdy characins and barbs,
      and peaceful cichlids of similar size such as severums or blue acaras. Armoured catfish can
      share the bottom. Very small fish may be eaten, and small bottom dwellers such as Corydoras are
      harried when a pair spawns. Large or aggressive cichlids such as Managua or Midas cichlids are a
      poor match because the firemouth loses every serious fight. The convict cichlid and other
      Thorichthys species such as the Ellioti cichlid are best avoided, since tank crosses with the
      firemouth have been reported.
    sources:
      - *sf
      - *fishkeeper
      - *tfh
      - *pfk
      - *parha
      - *mfk
  problems:
    text: >-
      The most common mistake is a tank that is too small: firemouths sold at 3 cm grow to 15 cm, and
      a breeding pair in a cramped tank harasses every other fish. Coarse or sharp gravel damages the
      mouth and gills of a fish that constantly sifts the bottom. Poor water quality with high
      nitrate makes the species prone to illness, so a young, unstable tank is a risk. Too much rich
      protein food can upset digestion; a varied diet of small invertebrate foods with some plant
      matter is safer. Mixing firemouths with rough Central American cichlids leads to stress and
      torn fins. Another mistake is buying a single pair of unknown age; incompatible partners may
      fight, so letting a pair form from a group works better.
    sources:
      - *fishkeeper
      - *sf
      - *liveaquaria
      - &archive824
        kind: archive
        title: cichlids.com forum thread 824
        url: https://www.cichlids.com/disc/read.php?1,824
      - *archive156

        - {by: checker-c, value: {size: large, breedingOnly: true}}
      decision: {size: small, breedingOnly: true}
      rationale: Wild pairs and colony pairs defend the area around one spawning site; the half-tank territory reported by checker-c was held in a smaller tank, where the defended area grows with confinement.
    - field: features.social
      proposals:
        - {by: generator, value: {structure: pair}}
        - {by: checker-a, value: {structure: pair}}
        - {by: checker-b, value: {structure: pair}}
        - {by: checker-c, value: {structure: group, minGroup: 8}}
      decision: {structure: pair}
      rationale: The species is a monogamous biparental spawner; a group of eight is an option for large tanks, but the unit recommended for an ordinary tank is one pair.
    - field: features.coloration
      proposals:
        - {by: generator, value: {baseColors: [grey, blue, red], pattern: bars}}
        - {by: checker-a, value: {baseColors: [grey, red, blue], pattern: mixed}}
        - {by: checker-b, value: {baseColors: [grey, red, blue], pattern: mixed}}
        - {by: checker-c, value: {baseColors: [grey, blue, red, black], pattern: mixed}}
      decision: {baseColors: [grey, blue, red], pattern: mixed}
      rationale: Bars, a midlateral blotch, gill cover spots and iridescent spots together make a mixed pattern; the black markings are details rather than a dominant colour.
    - field: features.feedingSpeed
      proposals:
        - {by: generator, value: normal}
        - {by: checker-a, value: normal}
        - {by: checker-b, value: normal}
        - {by: checker-c, value: slow}
      decision: normal
      rationale: One care sheet advises getting food to the bottom, but no source reports that the species regularly loses food to tankmates, and a breeding colony fed eagerly.
    - field: features.minTank
      proposals:
        - {by: generator, value: {volumeL: 160, lengthCm: 120, depthCm: 40}}
        - {by: checker-a, value: {volumeL: 200, lengthCm: 120, depthCm: 40}}
        - {by: checker-b, value: {volumeL: 110, lengthCm: 120, depthCm: 30}}
        - {by: checker-c, value: {volumeL: 450, lengthCm: 150, depthCm: 60}}
      decision: {volumeL: 200, lengthCm: 120, depthCm: 40}
      rationale: The social unit is one pair, so checker-c's tank for a group of eight does not apply; 120 by 40 cm gives the pair a breeding territory and tankmates room to retreat, which at a usual water height holds about 200 litres.
    - field: features.lifespanYears
      proposals:
        - {by: generator, value: {min: 8, max: 15}}
        - {by: checker-a, value: {min: 10, max: 15}}
        - {by: checker-b, value: {min: 8, max: 12}}
        - {by: checker-c, value: {min: 10, max: 12}}
      decision: {min: 10, max: 12}
      rationale: The French aquarium federation, two retailer sheets and the German Wikipedia agree on 10 to 12 years; 15 years appears only on general hobby pages.
    - field: features.beginnerSuitability
      proposals:
        - {by: generator, value: easy}
        - {by: checker-a, value: easy}
        - {by: checker-b, value: moderate}
        - {by: checker-c, value: moderate}
      decision: moderate
      rationale: The species is hardy and easy to breed, but it needs a tank of at least 120 cm, a mature aquarium and room for a pair that turns aggressive when breeding, which Seriously Fish rates as moderate.

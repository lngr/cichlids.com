schemaVersion: 1
id: thorichthys-meeki
legacyIds: [789, 699]
status: described
taxonomy:
  validName: Thorichthys meeki
  genus: Thorichthys
  species: meeki
  author: Brind, 1918
  source: &cof
    kind: catalog-of-fishes
    title: "Eschmeyer's Catalog of Fishes, species of the genus Thorichthys"
    url: https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Thorichthys
    archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-118e07ca/2026-10-14T094242Z
    accessed: 2026-10-13
  synonyms:
    - name: Thorichthys helleri meeki
      note: Original combination; Brind described the firemouth as a subspecies of T. helleri from near Progreso, Yucatan.
    - name: Cichlasoma meeki
      note: Combination used by many authors up to 2004, while Thorichthys was treated as part of Cichlasoma.
    - name: Cichlasoma hyorhynchum
      note: Described by Hubbs (1935) from the Rio San Pedro de Martir, Peten, Guatemala; a junior synonym of T. meeki.
  legacyNames:
    - Thorichthys meeki
    - Cichlasoma meeki
  note: >-
    The Catalog of Fishes lists Thorichthys meeki Brind 1918 as valid. Brind named it in
    Thorichthys, so the author citation carries no parentheses, although the Cichlid Room Companion
    prints them. Herichthys meeki, a combination found in some hobby databases, has no entry in the
    catalog's lists of Herichthys or Cichlasoma and is therefore not listed as a synonym.
    The legacy catalog also held the species under Cichlasoma meeki, and that entry maps to this profile.
names:
  trade:
    en: [Firemouth cichlid, Firemouth]
    de: [Feuermaulbuntbarsch]
    es-419: [Mojarra boca de fuego, Chonga]
variants:
  - name: "Angeles (Rio Mamantel)"
    kind: locality
    note: Dark regional form from the Rio Mamantel, sold as the black firemouth; some fish, mostly females, turn almost entirely black and have a yellowish rather than red throat.
  - name: Bacalar
    kind: locality
    note: Population of Laguna Bacalar with an orange to salmon throat and small differences in bone shape; no genetic difference to T. meeki has been found, and its taxonomic identity is regarded as open.
features:
  origin:
    value:
      continent: Central America
      region: Atlantic slope of southern Mexico, northern Guatemala and Belize, from the Yucatan Peninsula to the Grijalva-Usumacinta and Belize River drainages
      waterbody: null
      localities:
        - Near Progreso, Yucatan, Mexico (type locality)
        - Cenotes of the Ring of Cenotes, Yucatan, Mexico
        - Petenes of the El Palmar reserve and the Petenes Biosphere Reserve, Yucatan and Campeche, Mexico
        - Karstic pools of the Calakmul Biosphere Reserve, Campeche, Mexico
        - Laguna Caobas, Quintana Roo, Mexico
        - Laguna Chile Verde, Quintana Roo, Mexico
        - Laguna Bacalar, Quintana Roo, Mexico (population of uncertain identity)
        - Muyil Lagoon, Quintana Roo, Mexico
        - Lacantun basin, Chiapas, Mexico
        - Rio San Pedro, Peten, Guatemala
        - Lake Lachua, Alta Verapaz, Guatemala
    confidence: high
    rationale: >-
      All four runs agree on the native range. The Catalog of Fishes gives the Atlantic slope of
      Belize, Guatemala and southern Mexico, and FishBase names the Usumacinta and Belize drainages
      and the area near Progreso. Field surveys and DNA studies record the species in Yucatan cenotes,
      coastal petenes, karstic pools of Calakmul, the lagoons Caobas, Chile Verde and Muyil, the
      Lacantun basin, the Rio San Pedro and Lake Lachua. The firemouth of Laguna Bacalar, where Neil
      (1984) studied wild fish, differs in throat colour and is of uncertain identity. Introduced
      populations in Colombia, Hawaii, Puerto Rico and Florida are not part of the native range.

      The six votes split, so the tally took the most cautious value. The proposals were omnivore
      without bloat sensitivity (generator, checker-b), invertivore without bloat sensitivity
      (checker-a, tiebreaker-1, tiebreaker-2) and omnivore with bloat sensitivity (checker-c). Of the
      proposed types invertivore is the stricter one, and bloatSensitive is true because one vote
      set it. The type fits the stomach studies: in Laguna Caobas 127 juveniles had eaten mainly
      cladocerans and copepods, with algae a minor item; in the Petenes pools the species took snails
      and detritus selectively; a review of native cichlids reports a clear preference for benthic
      invertebrates, and a study of pharyngeal jaws places Thorichthys among the mollusc eaters.
      FishBase, Seriously Fish and Tropical Fish Hobbyist call it an omnivore, the FishBase claim of
      mainly algae resting on an aquarium reference. The bloat flag rests on the Fishkeeper warning
      that too much protein upsets digestion; no source reports actual cases of bloat, so the flag is

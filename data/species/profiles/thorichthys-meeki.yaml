  coloration:
    value:
      baseColors: [grey, blue, red]
      pattern: mixed
    confidence: medium
    rationale: >-
      Three runs chose a mixed pattern, the generator bars; checker-c added black to the base
      colours. Adult males are blue-grey with iridescent blue spots on head, body and fins, a brick
      to fiery red throat and belly and a dark, light-ringed spot on each gill cover. Five to seven
      faint bars combine with a dark midlateral blotch or band, so no single pattern dominates. The
      black markings are details, not a base colour.
    sources:
      - *sf
      - *tfh
      - *liveaquaria
      - *dewiki
      - &fishkeepingcouk
        kind: website
        title: "Fishkeeping.co.uk care sheet: Firemouth Cichlid"
        url: https://www.fishkeeping.co.uk/modules/caresheets/caresheet.php?caresheetID=109
        archived: fishkeeping.co.uk/modules/caresheets/caresheet.php/q-9f32863f/2026-10-14T103448Z
        accessed: 2026-10-13
  feedingSpeed:
    value: normal
    confidence: low
    rationale: >-
      Three runs chose normal and checker-c slow. The firemouth takes mouthfuls of substrate and
      sifts them, and readily takes prepared food. One care sheet advises getting food down to the
      bottom because faster fish may take it near the surface, but a breeding colony fed eagerly, and
      no source describes it as losing its share as a rule. Normal is the best fit; the sources give
      no explicit statement on feeding pace.
    sources:
      - *sf
      - *pfk
      - *parha
      - *fishkeepingcouk
  minTank:
    value: {volumeL: 200, lengthCm: 120, depthCm: 40}
    confidence: medium
    rationale: >-
      The runs proposed 160 litres with 120 by 40 cm (generator), 200 litres with 120 by 40 cm
      (checker-a), 110 litres with 120 by 30 cm (checker-b) and 450 litres with 150 by 60 cm for a
      group of eight (checker-c). The social unit is one pair, so the group tank does not apply.
      Seriously Fish and Practical Fishkeeping accept a base of 120 by 30 cm for one pair, FishBase
      gives 100 cm, and Fishkeeper wants at least 120 cm and 150 to 180 cm for adult groups. A pair
      with a breeding territory and room for tankmates to retreat needs 120 cm length and 40 cm front
      to back; at a usual water height this holds about 200 litres.
    sources:

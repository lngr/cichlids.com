  ghDgh:
    value: {min: 8, max: 30}
    confidence: low
    verification:
      method: median
      votes: {agree: 3, total: 6}
    rationale: >-
      No vote reached a qualified majority, so the range is the median of all six proposals:
      generator 7 to 90, checker-a 8 to 30, checker-b 8 to 20, checker-c 15.2 to 18.3, tiebreaker-1
      8 to 30 and tiebreaker-2 8 to 30 dGH. No study measured total hardness at a capture site, so
      all values are converted from calcium and magnesium of the waters the species lives in. The low
      end of about 8 dGH is an estimate from the conductivity of Laguna Caobas and from the
      bicarbonate of the Usumacinta rivers. Muyil Lagoon, where DNA confirms the species, holds 15 to
      18 dGH, nearby Lake Azul about 22 dGH, and the cenotes of northern Yucatan average about 28
      dGH (20 to 36 dGH as mean plus or minus one standard deviation, single samples about 10 to 50
      dGH). The sources reach far beyond the decided range: Laguna Bacalar and the connected Chile
      Verde lagoon carry gypsum water of about 74 to 90 dGH, and Neil (1984) studied wild firemouths
      at Bacalar. That population differs in throat colour and its identity is regarded as open, so
      the median leaves this extreme outside the typical range. FishBase gives up to 10 dH, an
      aquarium value.
    sources:
      - *perezceballos
      - *yanez
      - &frontiers
        kind: literature
        title: "Exploring Biogeochemistry and Microbial Diversity of Extant Microbialites in Mexico and Cuba. Frontiers in Microbiology 9, 510 (2018), Table 1."
        url: https://doi.org/10.3389/fmicb.2018.00510
        archived: doi.org/10.3389_fmicb.2018.00510/2026-10-13T103612Z
        accessed: 2026-10-13

    rationale: "The proposals are generator 150 L at 100 by 40 cm, checker-a 200 L at 120 by 40 cm,
      checker-b 200 L at 100 by 40 cm, and checker-c 70 L at 75 by 30 cm. Their component medians
      give 175 L with a 100 by 40 cm footprint, retained as a pair-only planning baseline. Seriously
      Fish publishes 70 L and 75 by 30 cm for one pair but separately asks for at least 48 inches,
      about 122 cm, when breeding. Klinesteker describes a pair after separating two fighting pairs
      from 20 US gallons, and TankBud gives 200 L without dimensions. Tanganyika.si gives a more
      spacious 400 L and 150 cm recommendation; that wider provision is retained rather than
      silently narrowed. The median does not assert a measured safety threshold, and a mixed or
      purpose-bred setup needs more room. Inherited 45 cm breeding depth and some other source
      dimensions were reviewer estimates, not explicit source figures."

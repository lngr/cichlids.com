      object. It represents lake alkalinity converted to carbonate-hardness units. The second
      annual-cycle titrations imply approximately 15.4 to 20.3 dKH across station summaries,
      slightly wider than the rounded decided interval; the historical compilation gives about 18.8
      dKH. GH and KH are distinct and are not numerically interchangeable."

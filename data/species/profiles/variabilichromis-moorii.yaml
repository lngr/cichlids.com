    confidence: "high"
    rationale: "The decided natural interval is 23 to 29 C, with high confidence and lake verification.
      Verburg and colleagues measured 23.85 to 29.01 C in hourly surface observations near Mpulungu;
      the rounded interval describes the lake synthesis rather than a continuous aquarium setpoint.
      The annual-cycle reports supply the seasonal context. Care-sheet intervals retained in the
      evidence are aquarium advice and do not set the natural endpoints."

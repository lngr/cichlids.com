      rationale: "The settled unanimous decision is 23 to 29 C at low confidence. Generator, checker-b and
        checker-c propose 23 to 29; checker-a proposes 22 to 29, which still agrees within the
        one-degree voting threshold. Seriously Fish recommends 23 to 27, FishBase lists 24 to 26,
        Fishipedia recommends 23 to 28, and Klinesteker gives roughly 24 to 26. The wider 22 to 29
        proposal is an unsupported extension rather than a measured lower limit. Retaining the
        decided 23 to 29 contains the required natural range; its equality to the natural interval
        does not mean harm is demonstrated outside it. Long-term aquarium evidence at 28 to 29 is
        limited, and typical routine care is nearer 24 to 27."

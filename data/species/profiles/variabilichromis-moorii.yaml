  compatibility:
    text: "The main constraints are defended rock space and access to food. Midwater Tanganyika fish are
      conditional companions, and other rock dwellers need distinct shelters in a larger aquarium.
      The 175 L pair baseline does not also provide space for all potential companions. Local
      territorial chasing can coexist with a generally restrained response to suitable neighbours.
      Small shell dwellers become poor choices when their fixed home lies beside the defended rocks.
      Boisterous or rapid feeders can exclude this fish from food. No named hybrid cross was found,
      so no hybrid group is assigned; that absence does not establish that every possible cross is
      impossible."
    sources:

  socialBehavior:
    text: "Keep an established compatible pair as the normal adult unit. Field research describes
      defended territories and shared brood care, while aquarium accounts show strong aggression
      toward surplus adults in limited space. Allowing juveniles to choose partners requires a plan
      for removing the others once a pair forms. An established bond should still be watched after a
      move or a new spawning cycle. Territory defence continues around feeding sites outside
      breeding. Social pairing is distinct from genetic exclusivity: field studies found young sired
      by unpaired males within broods attended by a social pair."

  problems:
    text: "Persistent chasing, a fish confined to one corner, or loss of feeding access can signal that
      the social arrangement is failing. Rock stability, adequate refuges and clean water matter as
      much as nominal volume. A pair that tolerates neighbours before spawning may defend more space
      once young appear. Differences between published recommendations are considerable, especially
      for tank size and diet, so observe the actual fish and its neighbours. The low-confidence KH
      interval is inferred rather than a proven physiological limit, and the warm end of the
      temperature tolerance is less documented for prolonged aquarium care. No reviewed study
      establishes a distinctive protein-triggered bloat susceptibility for this species."
    sources:

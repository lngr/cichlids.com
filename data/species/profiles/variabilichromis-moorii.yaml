  habitat:
    text: "Southern Tanganyika rocky shores provide feeding surfaces, crevices and sheltered nest sites.
      Field studies include shallow sites near Mutondwe Island and Kasenga Point in Zambia. The
      natural profile interval is 23 to 29 C, pH 8.4 to 9.4, 10 to 13 dGH and 15 to 20 dKH, based on
      lake monitoring and converted chemistry. These intervals summarize regional and seasonal lake
      conditions rather than simultaneous targets for one aquarium. Rocks are the essential habitat
      zone; a sandy base and gaps between rock structures help arrange an aquarium without making
      the fish an open-water or sand-feeding specialist."

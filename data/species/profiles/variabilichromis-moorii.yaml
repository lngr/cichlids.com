partners:
  suitable:
    - species: "Cyprichromis leptosoma"
      reason: "Midwater swimming reduces overlap with the defended rock patch."
      condition: "Use a larger community aquarium with open swimming space and sufficient room for the
        companions."
    - species: "Julidochromis transcriptus"
      reason: "Separate rock shelters can allow coexistence where territories do not overlap."
      condition: "Provide substantially more space than the pair-only baseline and distinct rock sections."
    - species: "Altolamprologus calvus"
      reason: "It is a conditional option among rock-dwelling Tanganyika companions."
      condition: "Use a spacious community tank with separate shelters; watch competition and brood defence."
  unsuitable:
    - species: "Neolamprologus multifasciatus"
      reason: "A small shell colony beside the pair's rocks can be displaced by territory defence; the
        concern is spatial conflict rather than established piscivory."
    - species: "Lamprologus ocellatus"
      reason: "A small fish tied to a nearby shell can have no effective escape from repeated territorial
        chases."
    - species: "Tropheus moorii"
      reason: "Competitive grazing and active feeding can overwhelm this more hesitant pair in a confined
        rocky aquarium."
profile:
  overview:
    text: "A pair of Variabilichromis moorii makes its home among the rocks of southern Lake Tanganyika.
      The adults are dark brown to black, often with pale blue fin margins, while some populations
      produce yellow or orange young that darken with age. Older aquarium names include
      Neolamprologus moorii and Black lamprologus. This fish combines algal browsing with
      small-animal feeding and shares care of its offspring with a partner. Its defended home
      includes feeding surfaces as well as a nest. A stable pair can live with appropriate
      neighbours when each has enough space, but adding more adults to an established pair can cause
      serious conflict."
    sources:
      - kind: "database"
        title: "Seriously Fish, Variabilichromis moorii"
        url: "https://www.seriouslyfish.com/species/variabilichromis-moorii/"

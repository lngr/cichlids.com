  social:
    value:
      structure: "pair"
    confidence: "high"
    rationale: "All full runs agree on a pair as the adult social unit. Aquarium accounts describe
      persistent pair bonds and the field studies demonstrate shared territory and biparental care.
      Social pairing does not imply exclusive genetic parentage: the seasonal study finds
      fertilisation by unpaired males as well. Groups of juveniles used for pair formation do not
      establish a recommendation for permanent adult groups."

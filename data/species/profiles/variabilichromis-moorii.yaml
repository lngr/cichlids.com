  husbandry:
    text: "For one compatible adult pair, the planning baseline is 175 L with at least a 100 by 40 cm
      footprint. Published recommendations vary substantially, so this is a synthesis rather than a
      tested threshold. A dedicated breeding setup should be longer, at least about 122 cm following
      the detailed breeding recommendation, and a community needs additional territory. Build stable
      rock shelters with visual barriers and routes around them. Maintain clean, buffered alkaline
      water and make changes gradually. Routine aquarium advice centres around 24 to 27 C; the
      decided 23 to 29 C tolerance also contains the full natural interval, although prolonged
      warm-end keeping has weaker evidence. The pH tolerance is 7.5 to 9.4, GH 8 to 25 dGH and KH 10
      to 25 dKH. KH endpoints are provisional and do not follow numerically from GH."

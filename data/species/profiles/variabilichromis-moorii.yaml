  maxSizeCm:
    value:
      male: 10
      female: 10
    confidence: "medium"
    rationale: "Generator proposes male 10 and female 9 cm; checker-a proposes 11 and 10; checker-b and
      checker-c each propose 10 and 10. The component median is therefore 10 cm for both sexes,
      which is retained. FishBase gives 10.3 cm total length for males or unsexed fish and Seriously
      Fish gives 10 cm standard length without a sex split. Those two measures are not directly
      interchangeable. Fishipedia gives an unsexed maximum of 11 cm; Tanganyika.si describes captive
      fish up to 2 to 3 cm above its 10 cm wild figure, a wider 10 to 13 cm context than the decided
      typical maximum. Prusinska reports aquarium adults around 12 to 13 cm and larger females,
      whereas other accounts suggest slightly larger males. These reports remain as evidence of
      possible larger individuals, but neither a universal sex difference nor 12 to 13 cm as a
      typical aquarium maximum is established. Confidence remains medium."

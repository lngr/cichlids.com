      rationale: "The settled qualified majority is omnivore with bloatSensitive false, at medium
        confidence. Generator, checker-a, checker-b and tiebreaker-1 propose omnivore; checker-c and
        tiebreaker-2 propose aufwuchs. The latter interpretation is supported by algal browsing in
        Bose et al., CRC's feeding category, the herbivore grouping in Baldo et al. and Prusinska's
        plant-rich gut account. Hata et al. independently find greater benthic-animal use than in
        most sampled territorial herbivores, while FishBase ecology and aquarium feeding advice
        support mixed nutrition. Thus the majority is plausible under the rubric, which additionally
        links aufwuchs to a required low-protein diet. False records no established special bloat
        tendency, not immunity to digestive disease. Preserve plant food and grazing opportunities
        alongside small animal foods."
    - field: "features.temperatureC.tolerance"

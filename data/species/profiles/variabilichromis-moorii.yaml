  sizeAndGrowth:
    text: "The typical adult planning size is about 10 cm for either sex. Sources mix standard length,
      which excludes the tail, with total length, so their figures are not exactly interchangeable.
      FishBase lists 10.3 cm total length and Seriously Fish lists 10 cm standard length.
      Tanganyika.si allows aquarium fish several centimetres above its wild figure, and Prusinska
      reports captive fish around 12 to 13 cm with larger females. Those observations remain
      relevant when judging an individual fish, but do not establish a universal sex difference.
      Yellow and orange juveniles gradually lose those colours. Fishipedia gives an approximate
      lifespan of eight years; no measured longevity range was found."

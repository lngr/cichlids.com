        accessed: "2026-10-15"
        archived: "doi.org/10.1186_s40851-015-0016-1/2026-10-13T103444Z"
  diet:
    text: "Give both plant-derived food and small animal foods, with regular access to edible growth on
      rock surfaces. Vegetable-rich prepared food can accompany suitable frozen or live small
      invertebrates. Scientific accounts emphasize algal browsing, while isotope research also
      detects a substantial animal contribution. This combination supports the decided omnivore
      category without dismissing the plant-focused alternative. Prusinska suggests that excessive
      protein and feeding may contribute to unusually large captive fish, but that is an explanation
      proposed from experience rather than a feeding experiment. A special protein-associated bloat
      tendency has not been established. The pair may approach food hesitantly, so check that faster
      companions do not take its share."

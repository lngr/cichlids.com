  sexing:
    text: "External sexing is uncertain. Some aquarium accounts describe longer pelvic fins or more
      extended fin tips in males, while locality accounts emphasize that body shape and adult colour
      are very similar. The direction and size of sex-related growth differences are also
      inconsistent across reports. Treat size and fin shape as clues rather than reliable proof,
      especially in juveniles. Behaviour of a settled pair is more informative than an early visual
      sex guess. A compatible pair is the adult recommendation; retaining spare fish after pair
      formation can produce injuries."
    sources:

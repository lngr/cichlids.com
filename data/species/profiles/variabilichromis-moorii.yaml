    value: 2
    confidence: "medium"
    rationale: "All four full runs choose level 2. Field work documents active exclusion of other fish
      from a defended patch, whereas Seriously Fish and aquarium observations allow suitable
      neighbours outside it. Lower level 1 interpretations and higher level 3 anecdotes remain
      visible. The stronger evidence supports local territorial chasing rather than regular attacks
      far beyond the territory. Confidence is medium because injury rates in suitable aquaria are
      not quantified."

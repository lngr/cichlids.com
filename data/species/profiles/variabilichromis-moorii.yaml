      decision:
        min: 10
        max: 25
      rationale: "The qualified-majority decision is 10 to 25 dKH at low confidence. Generator proposes 12
        to 25, checker-a 6 to 20, checker-b and checker-c 10 to 25, tiebreaker-1 10 to 20, and
        tiebreaker-2 10 to 25. Generator agrees with the 10 to 25 cluster within the two-dKH
        threshold, giving four agreeing votes out of six. The wider downward proposal of 6 to 20
        lacks direct support; the 10 to 20 alternative combines OATA's group advice of 10 to 15 with
        the species advice of 15 to 20. Fischlexikon recommends 15 to 20 and The Wet Spot gives 16
        to 19 for its featured species. These recommendations support a buffered core but not
        demonstrated failure boundaries. The decided upper extension to 25 is a provisional
        husbandry inference, not a KH number copied from Seriously Fish's GH range or a measured
        long-term tolerance. The full natural 15 to 20 range is contained; both endpoints need
        confirmation."

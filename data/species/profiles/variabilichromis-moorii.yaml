  breeding:
    text: "Eggs are attached to sheltered rock surfaces, commonly inside a cave or crevice, and both
      parents contribute to defence and care. The cave-spawner label reflects those detailed
      observations; the broader substrate-spawning category used by CRC remains compatible with eggs
      attached to rock. A hidden nest can go unnoticed until young emerge. Small first foods such as
      newly hatched Artemia are used in aquarium accounts. Care duration and renewed spawning vary,
      so judge whether growing young are still tolerated rather than relying on a fixed removal
      date. The detailed aquarium breeding recommendation calls for at least 48 inches, about 122
      cm, of tank length."

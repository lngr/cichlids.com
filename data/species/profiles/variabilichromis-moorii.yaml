    rationale: "The generator, checker-b and checker-c propose a large territory; checker-a proposes
      small. All agree it is not restricted to breeding. The public abstract of Sturmbauer et al.
      reports breeding territories from below 1 to nearly 4 square metres, averaging about 2, and
      Hata et al. describe defended feeding areas. This direct field evidence outweighs the

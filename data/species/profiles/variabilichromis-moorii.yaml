    value: 3
    confidence: "medium"
    rationale: "All four full runs choose level 3. Seriously Fish limits ordinary tanks to one bonded
      pair, and Klinesteker directly reports serious injury when two pairs shared a small tank. That
      account supports persistent conspecific conflict in inadequate social conditions. More severe
      anecdotal mappings remain in the evidence but do not establish a routine need for separation
      within a compatible pair. Confidence is medium because the injury observations are limited."

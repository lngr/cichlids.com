partners:
  suitable:
    - species: Cyprichromis leptosoma
      reason: Swims in schools in open water above the rocks and does not compete for caves.
      condition: Tank of at least 150 cm with open swimming space.
    - species: Neolamprologus multifasciatus
      reason: Stays in its own shell bed on the sand, away from the rock caves.
      condition: Shell bed placed at the opposite end from the rockwork; tank of at least 120 cm.
    - species: Julidochromis regani
      reason: Robust rock-dweller of similar size that can hold its own territory.
      condition: Tank of at least 150 cm with separate rock piles that break sight lines.
    - species: Altolamprologus calvus
      reason: Well armoured, slow rock-dweller that is not bullied out of its crevices.
      condition: Large tank with ample rockwork; fry of either species may be eaten.
  unsuitable:
    - species: Neolamprologus pulcher
      reason: So closely related that it may be the same species; the two are expected to cross.
    - species: Neolamprologus savoryi
      reason: Member of the same princess cichlid complex, which hobby sources say hybridises freely.
    - species: Tropheus moorii
      reason: Herbivore that needs a species tank and a low-protein diet; constant fights over rockwork.
    - species: Cyphotilapia frontosa
      reason: Large predator that swallows fish of 9 cm.
    - species: Lake Malawi mbuna
      reason: Hasty, aggressive rock-dwellers that compete for the same rockwork; many need a plant-based, low-protein diet.
    - species: Paracheirodon innesi
      reason: Needs soft acidic water and would be chased or eaten as a tiny fish.

profile:
  overview:
    text: >-
      Neolamprologus brichardi, sold as Princess of Burundi or fairy cichlid, is a slender
      lamprologine cichlid of about 9 cm from the rocky shores of Lake Tanganyika. Its lyre-shaped
      tail with white-edged filaments and the dark T-shaped mark on the gill cover make it easy to
      recognise. It became popular soon after the first exports in the early 1970s and remains a
      favourite, partly for its looks and partly for its social life: a pair raises one brood after
      another while older offspring stay and help guard the younger ones. This cooperative breeding
      has made the species and its close relative N. pulcher model animals in behavioural research;
      genetic work suggests that the two may be a single species. In the aquarium it is hardy and
      breeds readily, but a growing family can dominate a whole tank, so planning space and
      tankmates matters more than with many other small cichlids.
    sources: [*sf, *tfh, *duftner]
  habitat:
    text: >-
      The species lives only in Lake Tanganyika, mainly along the northern half of the lake in
      Burundi, Tanzania and the DR Congo, with some populations on southern shores. It is found over
      rocky slopes, usually between about 5 and 25 m deep, where large numbers of pairs hold
      neighbouring territories that together look like a loose school. The fish hover a short way
      above the stones to pick plankton and retreat into crevices when threatened. The water is warm
      (about 23 to 29 C), very stable, moderately hard and strongly alkaline, with a pH of roughly
      8.4 to 9.4, a general hardness of 10 to 13 dGH and a carbonate hardness of 15 to 20 dKH.
    sources: [*sf, *fishbase, *duftner, *plisnier46, *verburg, *cohen]
  sizeAndGrowth:
    text: >-
      Adults reach about 9 cm in total length, not counting the long tail filaments, and females stay
      a little smaller than males; some aquarium reports mention larger fish of 10 to 12 cm. The body
      is slim and laterally compressed, which lets the fish slip into narrow cracks between rocks.
      Fry are tiny at first and need many months to reach adult size, and the fins develop their long
      extensions only in older fish. Because the species stays small, it is often grouped with dwarf
      cichlids, yet its behaviour is that of a much larger fish. Size alone is not a safe way to tell
      males from females, since well-fed females can equal males of the same age.
    sources: [*fishbase, *sf, *tfh, *aquainfo]
  husbandry:
    text: >-
      A pair can start in a tank of about 80 cm and 110 litres, but the family grows with each brood,
      so a tank of 120 cm or more is the better long-term choice, and community setups need more room
      still. Build piles of rock with many caves and cracks over a sandy floor, leaving some open water
      above them. Keep the water hard and alkaline: the natural range is 23 to 29 C, pH 8.4 to 9.4,
      10 to 13 dGH and 15 to 20 dKH, while aquarium fish stay healthy from about 22 to 29 C, pH 7.8 to
      9.4, 9 to 20 dGH and 10 to 20 dKH; the middle twenties suit routine care best. Crushed coral or a
      Tanganyika salt mix helps to buffer soft tap water. Regular partial water changes keep nitrate
      low; avoid large, sudden changes in pH or temperature.
    sources: [*sf, *fishbase, *tfh, *ttt, *drta, *liveaquaria]
  socialBehavior:
    text: >-
      The basic unit is a bonded pair together with its young of several broods. Older juveniles of
      both sexes help to defend the cave and clean the eggs, and they are tolerated as long as there is
      room. Unrelated adults of the same species are attacked hard, so a group of youngsters bought to
      form a pair must be thinned out once a couple has settled. In a crowded tank the breeders start
      to chase off or kill older offspring and eat the smallest fry. Towards other species the pair
      defends a territory that grows with the family and can end up covering a large part of the tank.
      Plenty of rockwork with separated caves helps to spread this pressure.
    sources: [*sf, *tfh, *aquainfo, *duftner]
  diet:
    text: >-
      In the lake the fish feed mainly on zooplankton and small crustaceans that drift just above the
      rocks, plus tiny invertebrates picked from the stone surface. In the aquarium they accept almost
      any suitable food. A good base is a high-quality small pellet or flake, complemented several
      times a week with frozen or live foods such as Cyclops, Mysis, brine shrimp, Daphnia or insect
      larvae. A share of plant-based food, for example spirulina flakes, rounds out the menu. Feed
      small portions once or twice a day so that nothing rots on the bottom. The species is not known
      to be prone to bloat, but overfeeding still harms water quality.
    sources: [*fishbase, *sf, *britton, *tfh, *aquainfo]
  breeding:
    text: >-
      This is one of the easiest Tanganyika cichlids to breed. The pair digs out or chooses a cave and
      lays a few dozen eggs on its ceiling or wall, out of sight. The female usually stays close to the
      eggs while the male patrols the surroundings. After hatching and a few days in the cave the fry
      swim out and can take newly hatched brine shrimp and fine powdered food at once. The parents spawn
      again every few weeks, and the earlier broods stay and help to guard the newer ones. To raise many
      young, move some fry to a separate tank, because space limits and the parents begin to cull the
      brood when the tank fills up.
    sources: [*sf, *tfh, *fishbase, *stigliano]
  sexing:
    text: >-
      Sexing is difficult because both sexes share the same colours and markings. Adult males tend to
      be slightly larger and develop longer tips on the dorsal fin and longer tail filaments, but these
      differences overlap and depend on condition and age. The most reliable approach is to watch the
      behaviour of a group: a pair that has formed stays together, defends a cave and spawns. Venting,
      a look at the genital papilla when the fish are about to spawn, is another option for experienced
      keepers. Buying six or more young fish and letting them pair naturally avoids most sexing
      problems.
    sources: [*sf, *tfh]
  compatibility:
    text: >-
      Many keepers give this species a tank of its own, which shows its family life best. In a large
      Tanganyika tank it can share space with fish that use other zones, such as schooling
      Cyprichromis in open water or shell dwellers on a separate sand area. Robust rock-dwellers like
      Julidochromis or Altolamprologus are possible when the tank is long and the rockwork is divided
      into separate areas. Do not mix it with other princess cichlids of the brichardi complex, such as
      N. pulcher or N. savoryi: hobby sources report that they hybridise freely, and N. pulcher is so
      close that it may be the same species. Avoid large predators that can swallow it, herbivores such
      as Tropheus that need species tanks, Malawi mbuna and any soft-water community fish.
    sources: [*sf, *sfpulcher, *tfh, *duftner, *sturmbauer]
  problems:
    text: >-
      The most common mistake is too small a tank: a pair that starts out peaceful turns into a large
      family that terrorises tankmates or kills its own older young once space runs out. Mixing it with
      look-alike relatives leads to hybrids that should never be passed on. Soft or acidic water,
      unstable pH and rising nitrate cause stress, faded colours and a higher risk of bacterial
      infections. Sudden large water changes with water of very different chemistry can shock the
      fish. Fights between unrelated adults cause torn fins and skin injuries that may become
      infected. Overfeeding fouls the water quickly in a well-stocked tank. Sick fish should be
      observed closely and a veterinarian or experienced keeper consulted if they stop eating.
    sources: [*sf, *tfh, *aquainfo, *arch1374]


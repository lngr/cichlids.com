  ghDgh:
    value: {min: 10, max: 13}
    confidence: high
    verification:
      method: waterbody
      waterbody: lake-tanganyika
    rationale: >-
      Lake Tanganyika endemic, so the natural range is the measured lake hardness. Magnesium far
      exceeds calcium: station means of the FAO/FINNIDA programme of about 11 mg/L calcium and 41 to
      43 mg/L magnesium give about 11 to 12 dGH, the north basin values of Cohen et al. (1997) about
      12 dGH and the older data of Talling and Talling about 11 dGH, together 10 to 13 dGH. All
      four full runs proposed this range.
    sources:
      - *plisnier46
      - *plisnier56
      - *cohen
      - *vandenbossche
      - *verburg
      - *langenberg
    evidence:
      - source: *plisnier46
        value: {min: 11, max: 12}
        note: surface station means at Bujumbura, Kigoma and Mpulungu, converted from calcium and magnesium
      - source: *cohen
        value: {min: 12, max: 12}
        note: north basin surface water
      - source: *vandenbossche
        value: {min: 11, max: 11}
        note: converted from calcium and magnesium after Talling and Talling (1965)
    tolerance:
      value: {min: 9, max: 20}
      confidence: medium
      verification:
        method: unanimous
        votes: {agree: 4, total: 4}
      rationale: >-
        Unanimous vote: generator and checker-a proposed 8 to 20 dGH, checker-b and checker-c 9 to
        19 dGH; the decided range takes the median bounds of these proposals. FishBase and
        Seriously Fish give 9 to 19, DRTA 9 to 15, FishProfiles 10 to 20, The Tropical Tank 12 to
        20 and Aqua-Fish 12 to 18 dGH, and the range contains the natural 10 to 13 dGH. The sources
        range wider than the decided range: TropicalFreshwaterFish gives 8 to 22, Fishipedia 8 to 20,
        TFH from about 8 dGH (150 ppm) with an open upper end, Fishkeeper 15 to 25, AquaInfo 7 to
        11, and a club keeper kept adults in tap water of about 8 dGH.

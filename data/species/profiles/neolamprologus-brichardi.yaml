  khDkh:
    value: {min: 15, max: 20}
    confidence: high
    rationale: >-
      Lake Tanganyika endemic, so the natural range is the measured lake alkalinity: 6.5 to 6.6
      meq/L in the north basin (Cohen et al. 1997), 6.71 meq/L after Talling and Talling and 6.7 to
      6.9 meq/L cited by Langenberg (2008), about 18 to 19 dKH, while the FAO/FINNIDA titrations of
      bicarbonate plus carbonate reach down to about 15 dKH: 15 to 20 dKH. All four full runs
      proposed this range.
    sources:
      - *cohen
      - *plisnier46
      - *langenberg
      - *vandenbossche
    evidence:
      - source: *cohen
        value: {min: 18.2, max: 18.5}
        note: 6.5 to 6.6 meq/L, north basin
      - source: *plisnier46
        value: {min: 15.4, max: 20}
        note: titrated bicarbonate plus carbonate
      - source: *langenberg
        value: {min: 18.8, max: 19.3}
        note: 6.7 to 6.9 meq/L after Edmond et al. (1993)
      - source: *vandenbossche
        value: {min: 18.8, max: 18.8}
        note: 6.71 meq/L after Talling and Talling (1965)
    tolerance:
      value: {min: 10, max: 20}
      confidence: low
      verification:
        method: qualified-majority
        votes: {agree: 5, total: 6}
      rationale: >-
        Qualified majority: generator, checker-a, checker-b and both tie-breakers voted 10 to 20
        dKH, checker-c 15 to 20 dKH. Few care sources state carbonate hardness: The Tropical Tank
        calls 14 to 20 dKH ideal and 6 dKH the lowest acceptable value, a LiveAquaria retailer sheet
        gives 10 to 20, a shop guide 10 to 15, AquariumDomain 15 to 25 and DRTA at least 15 dKH.
        FishBase (9 to 19 dH) and TFH (150 to more than 300 ppm) give a single hardness figure
        without saying which kind is meant, which supports the order of magnitude only. The decided
        range contains the natural 15 to 20 dKH and is narrower than the full span of the sources,
        6 to 25 dKH. Confidence is low because so few sources state a carbonate hardness.
      sources:
        - *ttt
        - *aquariumdomain
        - *drta
        - *fishbase
        - *tfh
        - *liveaquaria
        - &gensou
          kind: website
          title: "Gensou Aquascaping (shop): Neolamprologus brichardi care guide"
          url: https://gensou.sg/neolamprologus-brichardi-care-guide/
          accessed: 2026-10-13
        - *arch1374
      evidence:
        - source: *ttt
          value: {min: 6, max: 20}
          note: 14 to 20 dKH ideal, 6 dKH as the floor
        - source: *aquariumdomain
          value: {min: 15, max: 25}
          note: aquarium recommendation
        - source: *drta
          value: {min: 15, max: 15}
          note: lower bound only
        - source: *fishbase
          value: {min: 9, max: 19}

  hybridGroups:
    value: [neolamprologus-brichardi-complex, neolamprologus-brichardi-leleupi, neolamprologus-brichardi-pulcher]
    confidence: low
    verification:
      method: conservative
      votes: {agree: 3, total: 6}
    rationale: >-
      Conservative decision: no proposal reached four agreeing votes. Generator, checker-b and
      tiebreaker-1 proposed only neolamprologus-brichardi-complex; checker-c and tiebreaker-2
      proposed the complex and neolamprologus-brichardi-pulcher; checker-a proposed
      neolamprologus-brichardi-pulcher and neolamprologus-savoryi-complex. The conservative rule
      takes every group named by at least two votes: the complex (five votes) and the
      brichardi-pulcher pair (three votes). The savoryi complex was named by checker-a alone; it has
      the same seven members as neolamprologus-brichardi-complex, so its content is covered. Both
      groups have the basis presumed. The complex rests on the hobby warning of Seriously Fish (on
      its N. brichardi and N. pulcher pages) that the species of the brichardi complex hybridise
      freely when mixed, and on genetic work that places the cooperatively breeding species in one
      young clade with repeated gene exchange (Sturmbauer et al. 2010; Salzburger et al. 2002 and
      Gante et al. 2016, abstracts); the wild introgression named there concerns N. savoryi, N.
      gracilis and N. marunguensis, not N. brichardi. For the pair, checker-a, checker-c and
      tiebreaker-2 proposed documented. The decision is presumed because the readable texts report
      no hybrid fish: Duftner et al. (2007) find mixed mitochondrial clades in wild populations,
      state that the two forms are never found together, offer past hybridisation only as one of
      two explanations for an intermediate population at Chaitika and propose treating both as one
      species; the only explicit statement of a brichardi-pulcher hybridisation is a one-sentence
      summary by Bouckaert et al. (2019) of a genome comparison by Gante et al. (2016), whose full
      text is not open access and whose abstract names no species pair. This is a report whose
      circumstances are unclear, so the pair is a presumed group; given the very close relationship
      the risk of crosses is high nonetheless.
      The curated file data/species/hybrid-groups.yaml defines neolamprologus-brichardi-leleupi
      with basis presumed: two forum archive reports describe offspring identified as brichardi x
      leleupi, but parentage and partner choice are unverified, while another keeper reports no
      crosses during 15 years of keeping the species together.

    rationale: >-
      Lake Tanganyika endemic, so the natural range is the measured lake range: an hourly buoy
      series at Mpulungu spans about 23.9 to 29.0 C, with the cooler readings in the southern
      upwelling season from June to September (Verburg et al. 1997); the FAO/FINNIDA sampling
      cycles and Langenberg (2008) give medians of the upper water column in the mid twenties. All
      four full runs proposed 23 to 29 C.

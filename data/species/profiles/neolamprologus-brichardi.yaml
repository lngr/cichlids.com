  ph:
    value: {min: 8.4, max: 9.4}
    confidence: high
    verification:
      method: waterbody
      waterbody: lake-tanganyika
    rationale: >-
      Lake Tanganyika endemic, so the natural range is the measured lake pH: a year of sampling
      gave 8.8 to 9.2 at the surface and 8.47 to 9.40 at 40 m (Plisnier et al. 1996), and
      Langenberg (2008) describes alkaline water with typical profile values near 8.7 to 9.0. All
      four full runs proposed 8.4 to 9.4.
    sources:
      - *plisnier46
      - *plisnier56
      - *verburg
      - *cohen
      - *langenberg
      - *vandenbossche
    evidence:
      - source: *plisnier46
        value: {min: 8.4, max: 9.4}
        note: surface to 40 m over an annual cycle
      - source: *langenberg
        value: {min: 8.7, max: 9.0}
        note: typical values of the water column, not the full lake range
    tolerance:
      value: {min: 7.8, max: 9.4}
      confidence: medium
      verification:
        method: unanimous
        votes: {agree: 4, total: 4}
      rationale: >-
        Unanimous vote: generator and checker-a proposed 7.8 to 9.4, checker-b 7.6 to 9.4 and
        checker-c 8.0 to 9.5, all within 0.3 of the decided bounds. FishBase, Seriously Fish, TFH
        and Fishkeeper give 8.0 to 9.0, and The Tropical Tank and a LiveAquaria retailer sheet start
        at 7.8; an archive keeper held the species at about 7.8 with buffering substrate. The upper
        bound is widened to the lake maximum of 9.4. The sources range wider than the decided
        range: Aqua-Fish gives 7.6 to 8.9, TropicalFreshwaterFish 7.5 to 9.0, AquariumDomain 8.5 to
        9.5, a club keeper had adults healthy at about 7.4 that spawned only after the water was
        buffered, and a breeder report describes spawning near 7.0. These single or outlying values
        are not adopted as bounds for long-term keeping.
      sources:

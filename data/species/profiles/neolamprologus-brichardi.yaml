schemaVersion: 1
id: neolamprologus-brichardi
legacyIds: [83]
status: described

taxonomy:
  validName: Neolamprologus brichardi
  genus: Neolamprologus
  species: brichardi
  author: (Poll, 1974)
  source: &cof
    kind: catalog-of-fishes
    title: "Eschmeyer's Catalog of Fishes, species of the genus Neolamprologus"
    url: https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Neolamprologus
    accessed: 2026-10-13
  synonyms:
    - name: Lamprologus brichardi
      note: Original combination (Poll 1974), a replacement name for Lamprologus savoryi elongatus.
    - name: Lamprologus savoryi elongatus
      note: Described by Trewavas and Poll (1952) as a subspecies of L. savoryi; preoccupied by Lamprologus elongatus Boulenger 1898 and therefore replaced.
    - name: Neolamprologus elongatus
      note: Name used in the hobby and aquarium literature of the 1980s for this fish, based on the unavailable name elongatus; not Lepidiolamprologus elongatus.
  legacyNames:
    - Neolamprologus brichardi
  note: >-
    The Catalog of Fishes lists the species as valid (Marechal and Poll 1991, Schelly et al. 2003,
    Verburg and Bills 2007, Konings 2023) and records that Konings (2019) treated it as a synonym
    of Neolamprologus pulcher. Duftner et al. (2007) found that mitochondrial lineages do not sort
    by the gill-cover bar pattern that separates N. brichardi from N. pulcher and proposed uniting
    both under N. pulcher, so the species boundary is disputed. The yellow-finned trade form
    'Daffodil' (described as Neolamprologus daffodil Prokofiev 2003) is a synonym of N. pulcher in
    the Catalog and not part of this species. The type locality is Kisoje (Kasoje) on the Tanzanian
    shore. The Catalog was queried for the genera Neolamprologus and Lamprologus; the latter holds
    no separate entry for brichardi.

names:
  trade:
    en: [Princess of Burundi, Fairy cichlid, Lyretail cichlid, Princess cichlid, Brichardi]
    de: [Prinzessin von Burundi, Feenbarsch, Gabelschwanzbuntbarsch]
    es-419: [Princesa de Burundi]
    pt-BR: [Princesa do Burundi]

variants:
  - name: Magara
    kind: locality
    note: Burundi coast; origin of the first exports in 1971 that gave the trade name Princess of Burundi.
  - name: Kasoje
    kind: locality
    note: Type locality on the Tanzanian shore near the Mahale Mountains (spelled Kisoje in the original description).
  - name: Kigoma
    kind: locality
    note: Northern Tanzanian population sampled in genetic and ecological studies.
  - name: Albino
    kind: color-morph
    note: Aquarium-bred amelanistic form without dark pigment.

features:
  origin:
    value:
      continent: Africa
      region: Lake Tanganyika
      waterbody: Lake Tanganyika
      localities:
        - Kasoje (Kisoje), Tanzania (type locality)
        - Magara, Burundi
        - Kigoma, Tanzania
        - Kalo
        - Malasa Island
        - Wapembe
        - Kapampa
        - Loasi River North
    confidence: high
    rationale: >-
      Endemic to Lake Tanganyika. FishBase places it in the northern part of the lake, Seriously
      Fish names the shores of Burundi, Tanzania and the DR Congo with the brichardi head pattern
      mainly in the northern half, and the Catalog of Fishes gives the type locality Kisoje.
      Duftner et al. (2007) sampled fish with the brichardi pattern at Kalo, Malasa Island,
      Wapembe and Kigoma and on a few stretches of the southern shore (Kapampa, Loasi River North);
      Britton et al. (2019) studied the species near Kigoma. All runs agree on the lake; they differ
      only in the localities they list.

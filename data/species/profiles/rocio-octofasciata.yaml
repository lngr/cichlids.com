      Seriously Fish recommends a base of at least 120 x 45 cm for one adult pair, about 240 litres at 45 cm water depth. Fishkeeper asks for at least 150 cm. Practical Fishkeeping accepts 90 x 35 cm for a pair of the smaller blue strain, which is too small for wild-type fish and leaves the female little room to escape a 22 cm male. The value follows the Seriously Fish base for one pair; tankmates need a considerably larger tank.

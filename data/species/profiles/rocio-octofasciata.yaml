status: described

taxonomy:
  validName: Rocio octofasciata
  genus: Rocio
  species: octofasciata
  author: (Regan, 1903)
  source: &cof
    kind: catalog-of-fishes
    title: "Eschmeyer's Catalog of Fishes: species of the genus Rocio"
    url: https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Rocio
    accessed: 2026-10-12
  synonyms:
    - name: Heros octofasciatus Regan, 1903
      note: original combination; type locality Río de Sarabia, Coatzacoalcos drainage, Veracruz, Mexico
    - name: Cichlasoma octofasciatum
      note: long-standing combination in the hobby literature
    - name: Nandopsis octofasciata
    - name: Archocentrus octofasciatus
    - name: Cichlosoma biocellatum Regan, 1909
      note: junior synonym with an erroneous type locality at Manaus, Brazil; widely used in older aquarium literature
    - name: Cichlasoma hedricki Meek, 1904
      note: junior synonym
  legacyNames:
    - Cichlasoma octofasciatum
  note: >-
    The Catalog of Fishes lists the species as valid in Rocio (Schmitter-Soto 2007) with a distribution in southern Mexico, Belize, Guatemala and Honduras, and files all former combinations under the epithet in the current genus. Rocio gemmata from cenotes of northern Quintana Roo is valid in the Catalog of Fishes but treated as a synonym of R. octofasciata by Artigas Azas (2018), a view the Cichlid Room Companion follows; this profile follows the Catalog of Fishes and does not list it as a synonym.

names:
  trade:
    en: [ Jack Dempsey, Jack Dempsey cichlid ]
    de: [ Achtbindenbuntbarsch, Jack Dempsey ]
    es-419: [ Mojarra castarrica, Riquiraqui, Jack Dempsey ]
    pt-BR: [ Jack Dempsey ]

variants:
  - name: Electric Blue Jack Dempsey
    kind: color-morph
    note: Bright blue aquarium strain not known from the wild; it stays smaller than the wild type and is reported as less aggressive. Its origin is debated, a fixed mutation according to some sources and a hybrid according to others.
  - name: Gold Jack Dempsey
    kind: color-morph
    note: Yellowish aquarium strain with the body shape and behaviour of the wild form.

features:
  origin:
    value:
      continent: Central America
      region: Atlantic slope from Veracruz (Mexico) through the Grijalva-Usumacinta basin, the Yucatán Peninsula, Belize and Guatemala to the Ulúa basin in Honduras
      waterbody: null
      localities:
        - Río de Sarabia, Coatzacoalcos drainage, Veracruz (type locality)
        - Río Papaloapan drainage, Veracruz
        - Grijalva drainage near Teapa, Tabasco
        - Lacantún basin and the Nahá and Metzabok lakes, Chiapas (Usumacinta basin)
        - Laguna Caobas, Laguna Bacalar and the Sian Ka'an wetlands, Quintana Roo
        - Petenes wetlands, Campeche
        - Lago Petén Itzá, Lake Yaxhá and Río de la Pasión, Petén
        - Belize River
        - Lago de Izabal and the Río Dulce basin, Izabal
        - Río Motagua, Río Chamelecón and Río Ulúa, Honduras
    confidence: high
    rationale: >-
      The Catalog of Fishes, FishBase, Seriously Fish and the revision by Schmitter-Soto (2007) agree on a native range along the Atlantic slope from southern Mexico to the Ulúa in Honduras; Seriously Fish extends it slightly north to the Río Actopan, where part of the populations may be introduced. Museum records in GBIF confirm the species in Lago Petén Itzá (Santa Elena), Laguna Bacalar, Lago Nahá and above Lago de Izabal, and field surveys collected it in Laguna Caobas, the Lacantún basin, Lake Yaxhá and the wetlands of Sian Ka'an and the Petenes. It lives in rivers, lagoons, swamps, lakes and sinkholes rather than in one lake, so no water body applies. Mexico is geographically North America, but the range belongs to the Central American cichlid fauna. Feral populations outside the native range are not part of the origin.

      confidence: low
      verification:
        method: conservative
        votes: { agree: 3, total: 5 }
      rationale: >-
        Five votes were cast: two proposed 20 to 31 °C (the lower bound of Seriously Fish and an upper bound raised to the warm-season lake temperatures of up to 31.3 °C at Laguna Bacalar and 31.4 °C at Lake Izabal), three proposed 22 to 30 °C. Without a qualified majority the tolerance is the intersection of all votes, 22 to 30 °C, which contains the natural range of 24 to 30 °C. Most care sources share these bounds: FishBase (after an aquarium book), FishProfiles, Fishkeeping World, Aquarium Source and Wikipedia give 22 to 30 °C, Fishkeeper and Aquarium Guide 22 to 28 °C, Seriously Fish 20 to 30 °C, and narrower comfort bands of 24 to 28 °C appear in several guides. Physiological limits lie far outside: a mean lower lethal temperature of 8 °C, acclimation between 10 and 35 °C and loss of equilibrium from about 34 °C, which are short-term limits and not years of healthy keeping.

  ghDgh:
    value: { min: 9, max: 17 }
    confidence: low
    verification:
      method: qualified-majority
      votes: { agree: 4, total: 6 }
    rationale: >-
      The natural range rests on habitat measurements from Lago Petén Itzá, the Grijalva and Usumacinta basins, Quintana Roo and Lake Izabal. Lago Petén Itzá surface water holds 2.9 to 4.3 meq/L calcium and 1.5 to 2.1 meq/L magnesium, about 12 to 18 dGH. The Grijalva and its tributaries near Teapa have 9.7 to 16.5 dGH, converted from mg/L CaCO3, and the Usumacinta channel 12.2 to 13.4 dGH from measured calcium and magnesium. For Quintana Roo and Lake Izabal no hardness was measured: the conductivity of Laguna Caobas points to roughly 7 to 9 dGH, alkalinity and conductivity in the Izabal basin to roughly 3 to 8 dGH, both estimates. Four of six votes agree (8 to 18, 8 to 16, 9 to 17 and 10 to 17 dGH) and the decided range is their median, 9 to 17 dGH; the two other votes (4 to 20 and 5 to 20 dGH) gave the soft Izabal estimates more weight. The species also lives in the gypsum-rich karst water of Laguna Bacalar, with a museum record of the species and about 74 to 107 dGH from measured calcium and magnesium, far harder than this range; the range leaves it out as an exceptional habitat. Floodplain lagoons of the Usumacinta lowlands (1.0 to 5.4 dGH) are not tied to a record of the species, and the hardness of 1 to 5 dGH reported for the Nahá and Metzabok lakes does not fit their conductivity. FishBase gives 9 to 20 dGH from a trait database.

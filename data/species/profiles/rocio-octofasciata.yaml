    rationale: >-
      Seriously Fish, FishBase, the US Fish and Wildlife Service screening and Fishkeeper describe a biparental substrate spawner that lays several hundred eggs on a cleaned stone and moves the larvae into pits; the Cichlid Room Companion summary confirms open substrate breeding and monogamy.

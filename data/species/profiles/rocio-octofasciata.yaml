      - *fishkeeper
      - *fws

partners:
  suitable:
    - species: Thorichthys meeki
      reason: Robust Central American cichlid from the same region and water; holds its own against a Jack Dempsey.
      condition: tank of at least 150 cm with caves for both species
    - species: Andinoacara rivulatus
      reason: Comparable size and temperament; a common pairing in the archive.
      condition: tank of at least 150 cm; only one pair of each species
    - species: Pterygoplichthys gibbiceps
      reason: Large armoured catfish that uses the bottom and is too big and well protected to be attacked.
    - species: Metynnis argenteus
      reason: Silver dollars are deep-bodied, fast and too large to be eaten; they act as dither fish.
      condition: group of five or more in a long tank
    - species: Amatitlania nigrofasciata
      reason: Hardy cichlid from the same habitat type; keepers report that adult convicts manage alongside a Jack Dempsey.
      condition: a single convict or same-sex group, otherwise breeding convicts start fights

  unsuitable:
    - species: Paracheirodon innesi
      reason: Small tetras fall well under the prey size of a 22 cm Jack Dempsey and are eaten.
    - species: Poecilia reticulata
      reason: Guppies and other small livebearers are eaten.
    - species: Pterophyllum scalare
      reason: Slow, peaceful angelfish get harassed and lose their fins.
    - species: Symphysodon aequifasciatus
      reason: Discus need soft, warmer water, eat slowly and suffer from the aggression of a Jack Dempsey.
    - species: Lake Malawi mbuna
      reason: Different diet needs and constant fighting between two aggressive groups; archive keepers advise against mixing.
    - species: Amphilophus citrinellus
      reason: Midas and red devil cichlids are larger and more aggressive and can kill a Jack Dempsey.
    - species: Parachromis dovii
      reason: Pronounced piscivore of up to 60 cm that treats a Jack Dempsey as prey or rival.

profile:
  overview:
    text: >-
      The Jack Dempsey is one of the classic Central American cichlids and has been kept since the early twentieth century. Its trade name refers to the boxer Jack Dempsey and to its bulky head and fighting spirit. Adults are dark, almost black fish covered with shining blue to blue-green spangles, and they show a lot of personality towards their keeper. The species is hardy and tolerates a wide range of water, but males grow to more than 20 cm, the fish dig constantly and become territorial when mature. It suits keepers who can offer a large tank and robust tankmates, or who want to keep a single pair. A blue aquarium strain and a gold strain are sold as well.
    sources:
      - *sf
      - *pfk
      - *fishkeeper
  habitat:
    text: >-
      The species lives on the Atlantic side of Central America, from Veracruz in Mexico through the Grijalva-Usumacinta basin and the Yucatán Peninsula, Belize and Guatemala to the Ulúa in Honduras. It prefers slow water: the lower reaches of rivers, swamps, lagoons, canals and drainage ditches, often with mud or sand, dense plants and murky water. It also lives in lakes such as Lago Petén Itzá and Lago de Izabal and in karst lagoons and cenotes. The water is warm all year, about 24 to 30 °C, around neutral to alkaline (the usual range is pH 6.5 to 8.5) and moderately hard to hard, because much of the range lies on limestone. Some habitats are exceptional, such as the gypsum-rich, very hard water of Laguna Bacalar. The species tolerates low oxygen well and moves between permanent ponds and flooded seasonal pools during the rainy season.
    sources:
      - *fishbase
      - *sf
      - *valtierra
      - *perez
      - *musalem
      - *matzuk
      - *escalera
      - *fws
  sizeAndGrowth:
    text: >-
      Males usually reach 20 to 22 cm and females about 15 to 16 cm; exceptional fish grow to 25 cm. Juveniles grow quickly and can spawn at less than a year and only 7 to 8 cm length. Growth slows after the first year, and fish kept in small tanks often stay stunted and live shorter lives. Males develop longer, pointed dorsal and anal fins and a heavier head with age. The Electric Blue strain stays smaller. The species is long-lived for a cichlid: ten to fifteen years are common with good care, and some keepers report fish close to twenty years old.
    sources:
      - *pfk
      - *sf
      - *fishbase
      - *fishlore
      - *fws
  husbandry:
    text: >-
      A pair needs a tank of at least 120 cm length and about 240 litres; a community with other cichlids needs considerably more. Use sand or fine gravel, because the fish dig pits and move the substrate around. Provide caves from stones, roots or flowerpots, and place a few flat stones as spawning sites. Rooted plants are usually dug up, so floating plants or plants tied to wood work best. The species is sensitive to rising nitrate and poor water, so use strong filtration and change a large share of the water every week. Keep the water between 22 and 30 °C, at pH 6.5 to 8.5 and 5 to 20 dGH, with a carbonate hardness of about 3 to 12 dKH. Cover the tank well, since startled fish can jump.
    sources:
      - *sf
      - *pfk
      - *fishkeeper
      - *fishlore
      - *fishbase
      - *tankflare
  socialBehavior:
    text: >-
      Young Jack Dempseys can be raised together, but they become intolerant of each other as they mature. Adults form monogamous pairs, and the safest way to get a pair is to raise five or six juveniles and let them choose partners. Forcing two adults together is risky: courtship involves jaw locking and chasing, and the weaker fish may be badly hurt. Once a pair has formed, the partners usually get along but attack other conspecifics and similar-looking fish. Outside breeding many individuals are relatively calm; while guarding eggs or fry a pair can clear a large part of the tank of other fish.
    sources:
      - *sf
      - *fishkeeper
      - *a605
      - *a575
  diet:
    text: >-
      In the wild the Jack Dempsey eats what is available: insect larvae, crustaceans, worms, terrestrial insects, detritus with algae, and occasionally small fish. In the aquarium it accepts all common foods. A good base is a quality cichlid pellet or stick, supplemented with frozen foods such as mosquito larvae, bloodworm, Mysis, krill or chopped prawns, plus some vegetable matter or spirulina. Earthworms are a good conditioning food before breeding. Live feeder fish are not needed and can carry disease. Feed adults once or twice a day in amounts they finish quickly, since leftovers pollute the water.
    sources:
      - *valtierra
      - *hinojosa
      - *sf
      - *fishkeeper
  breeding:
    text: >-
      The Jack Dempsey is a biparental open substrate spawner and breeds readily in the aquarium. The pair cleans a flat stone or digs down to a hard surface, and the female lays several hundred, sometimes up to 800, eggs. The female mostly fans the eggs, while the male guards the area. At about 27 °C the eggs hatch after about three days, and the parents move the larvae into pits in the substrate. The fry swim freely after a few more days and take newly hatched brine shrimp and fine powdered food. Both parents guard them for several weeks. Young pairs often eat their first spawns. Plan where the many young will go before the pair breeds.
    sources:
      - *fws
      - *fishkeeper
      - *sf
      - *a93
  sexing:
    text: >-
      Adult males are larger, with longer, pointed dorsal and anal fins and often a heavier forehead. Females stay smaller and rounder and usually show blue-green spangles on the lower gill cover and cheek, while males of the same age often show fewer markings there. This difference is not fully reliable, because subdominant males can look like females. Venting the genital papilla is the most certain method in adult fish. Keepers in the cichlids.com archive confirm the difference in cheek marking but also note exceptions.
    sources:
      - *fishkeeper
      - *a39473
      - *a314
  compatibility:
    text: >-
      Choose tankmates that are too large to be eaten and robust enough to withstand a cichlid that defends its space. Good choices are other medium to large Central American cichlids such as firemouths, as well as green terrors, large armoured catfish and silver dollars, in a tank of 150 cm or more with several caves and visual barriers. Avoid small tetras, livebearers and other fish below about 7 cm, slow and peaceful fish such as angelfish and discus, and very aggressive giants such as Midas cichlids and dovii. Do not mix with Malawi mbuna, whose needs and behaviour differ. Watch carefully when a pair starts to breed.
    sources:
      - *sf
      - *fishkeeper
      - *pfk
      - &a226
        kind: archive
        title: cichlids.com forum thread 226
        url: https://www.cichlids.com/disc/read.php?1,226
      - &a32378
        kind: archive
        title: cichlids.com forum thread 32378
        url: https://www.cichlids.com/disc/read.php?1,32378
  problems:
    text: >-
      The most common mistake is a tank that is too small: a Jack Dempsey bought at 5 cm outgrows a 100 litre tank within a year and becomes stressed and aggressive. A second mistake is mixing it with small community fish, which it eats or harasses. Forcing adults into a pair often ends in injuries. The species reacts badly to accumulated waste and high nitrate; poor water favours hole-in-the-head disease, fin rot and bacterial infections. Diets made only of meaty food such as raw meat or feeder fish carry a risk of digestive problems and parasites. Large adults can also jump or injure themselves when startled.
    sources:
      - *sf
      - *fishkeeper
      - *fishlore
      - *fws


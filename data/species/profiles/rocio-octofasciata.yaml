        url: https://www.cichlids.com/disc/read.php?1,39473

  feedingSpeed:
    value: hasty
    confidence: low
    rationale: >-
      Keepers describe an eager, voracious feeder that rises to the surface and takes the bulk of the food before tankmates; an archive keeper reports that a Jack Dempsey ate nearly everything while a convict went hungry. No database or literature rates feeding speed.

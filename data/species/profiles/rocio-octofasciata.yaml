    value: moderate
    confidence: medium
    rationale: >-
      The species is hardy and adaptable in water chemistry, but it grows to over 20 cm, digs, needs a large tank and robust tankmates, reacts badly to poor water, and pairing adults can end in injuries. Seriously Fish rates it moderate; the Cichlid Room Companion lists it as a beginner species, which ignores the space and pairing demands.

    rationale: >-
      All three votes give level 2. FishBase lists fish among the natural food items, and the US Fish and Wildlife Service risk screening states that the species eats smaller fish opportunistically and was predominantly predatory in a Florida creek. Wikipedia summarises that it eats almost anything smaller than itself, including fish. Wild fish in the Yucatán wetlands and in Laguna Caobas, however, fed mainly on detritus and invertebrates, so fish are not a main food and level 3 does not apply. Seriously Fish and Fishkeeper advise tankmates too large to be seen as prey. Archive keepers report that some adults ignore feeder fish, but small tetras and livebearers are lost in practice, which matches level 2.

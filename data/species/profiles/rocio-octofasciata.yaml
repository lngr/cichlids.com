  temperatureC:
    value: { min: 24, max: 30 }
    confidence: medium
    verification:
      method: unanimous
      votes: { agree: 3, total: 3 }
    rationale: >-
      The natural range rests on habitat measurements from Lago Petén Itzá, the Usumacinta basin, Quintana Roo and Lake Izabal. Laguna Caobas (Quintana Roo), where the species was collected, measured 25.1 to 29.3 °C over the dry and rainy season; the zone and season means of southern Quintana Roo lie between 24.7 and 30 °C. Lago Petén Itzá, with museum records of the species, measured 25.4 to 30 °C above the thermocline. The Lacantún sites of the Usumacinta basin lay between 23.6 and 29.6 °C, with 23.8 °C at the stream where the species was caught. Lake Izabal and its swamps and rivers typically read 25 to 31 °C, with extremes of 23 to 33 °C. All three votes agree (25 to 30, 24 to 30 and 24 to 30 °C), and the decided range is their median, 24 to 30 °C. FishBase gives 22 to 30 °C from an aquarium book (Conkel 1993), which is no habitat measurement. Northern populations in Veracruz probably see cooler winter water, but no measurement was found.

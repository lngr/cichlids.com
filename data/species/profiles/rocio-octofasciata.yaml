    rationale: >-
      Seriously Fish and Fishkeeper report that juveniles live together but turn on each other at maturity, and that a pair is hostile to any other conspecific; a male also harasses a female that is not ready to spawn. Keepers in the archive describe courtship as a real fight and report killed or mauled partners when an unready pair is forced together. With a pair formed from a group and enough space the partners get along, so persistent chasing with injuries in tanks that are too small (level 3) fits better than level 4.

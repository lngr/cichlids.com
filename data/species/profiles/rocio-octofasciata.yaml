  ph:
    value: { min: 6.5, max: 8.5 }
    confidence: low
    verification:
      method: median
      votes: { agree: 2, total: 6 }
    rationale: >-
      The natural range rests on habitat measurements from Lago Petén Itzá, the Grijalva and Usumacinta basins, Quintana Roo and Lake Izabal, and these waters differ. Lago Petén Itzá surface water reads 8.2 to 8.5. The Grijalva near Teapa measured 7.7 to 8.5 in the channel and 6.8 to 7.2 in a spring; the lower Usumacinta 7.5 to 8.9 at three bridge sites and its floodplain lagoons 6.9 to 7.4; the Lacantún sites 7.3 to 8.1. In Quintana Roo Laguna Caobas ranged from 6.55 to 8.23 (mean 6.99), the zone and season means of the south lie between 6.6 and 7.7, the Bacalar waters between 6.5 and 7.8, and the Sian Ka'an pools, where the species is abundant, reach seasonal means of 7.2 to 9.0. Lago de Izabal averages 7.8 at the surface, while a 1970s survey read mostly 6.0 to 7.0 with a meter accurate only to 0.5 units. The six votes proposed 6.5 to 8.5 (generator and tiebreaker-2), 7.0 to 8.0 (checker-a), 6.0 to 8.0 (checker-b), 6.5 to 9.0 (tiebreaker-1) and 7.0 to 8.5 (tiebreaker-3). No proposal reached a qualified majority, so the value is the median of the minima and of the maxima of all votes. The minima sorted are 6.0, 6.5, 6.5, 6.5, 7.0, 7.0, and the median is the mean of the third and fourth, 6.5. The maxima sorted are 8.0, 8.0, 8.5, 8.5, 8.5, 9.0, and the median is the mean of the third and fourth, 8.5. The result, 6.5 to 8.5, is narrower than the measured spread of about 6.0 to 9.0 across the sites above; the extremes are single sites or seasons, and the median keeps the range most votes sit around. FishBase gives 7.0 to 8.0 from a trait database, not from field measurements.

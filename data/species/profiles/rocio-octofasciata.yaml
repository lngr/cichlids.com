  coloration:
    value: { baseColors: [ brown, black, blue ], pattern: mixed }
    confidence: medium
    rationale: >-
      Adults are dark brown to almost black with many iridescent blue to blue-green spangles on the head, body and fins, a black blotch mid-body, an ocellus at the tail base and a red-edged dorsal fin. The spangles are the dominant visible colour of the male. The eight dark bars that give the name show with mood and in young fish, so the pattern is a mix of spots and bars.
    sources:
      - *sf
      - *fishbase
      - *fishkeeper

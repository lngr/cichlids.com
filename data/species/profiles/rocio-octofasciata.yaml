  khDkh:
    value: { min: 5, max: 10 }
    confidence: low
    verification:
      method: unanimous
      votes: { agree: 3, total: 3 }
    rationale: >-
      Carbonate hardness is known from three water bodies or basins with records of the species, each converted with 1 meq/L = 2.8 dKH. Lago Petén Itzá carries 1.9 to 2.2 meq/L bicarbonate, about 5.3 to 6.2 dKH, beside a large sulfate share. The Lake Izabal basin showed a typical total alkalinity of 1.0 to 2.75 meq/L in lake, swamps and small rivers, about 2.8 to 7.7 dKH. The Usumacinta channel carries 2.86 meq/L bicarbonate plus 0.51 meq/L carbonate, about 9.4 dKH, and its floodplain lagoons mostly 3.3 to 10.4 dKH. The range 3 to 10 dKH covers these values. No carbonate measurement from Quintana Roo was found, and the gypsum water of Laguna Bacalar is left out as for total hardness. The proposals were 5 to 8 (generator, Petén Itzá only), 5 to 12 (checker-a, upper bound from general knowledge of karst water) and 3 to 10 dKH (checker-b, Izabal data). All three agree within the tolerance of 2 dKH, so the tally calls the vote unanimous and takes the median of the agreeing minima and maxima: the minima 3, 5, 5 give 5, the maxima 8, 10, 12 sorted give 10. The decided range is 5 to 10 dKH. It is narrower than the measured spread of about 2.8 to 10.4 dKH, because the lowest values come from the Izabal basin alone and the highest from the floodplain lagoons of the Usumacinta, while Petén Itzá and the Usumacinta channel sit inside it. The values are converted from single studies and not measured at the collecting sites, hence the low confidence.
    sources:
      - *perez
      - *brinson
      - *palma
    evidence:
      - source: *perez
        value: { min: 5.3, max: 6.2 }
        note: Lago Petén Itzá surface water, converted from bicarbonate
      - source: *brinson

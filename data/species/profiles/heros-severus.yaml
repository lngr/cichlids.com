  socialBehavior:
    text: Juveniles get along in a group, and pairs form among them as they mature. Adults set up a firm
      order, and in a tank that is too small or holds only a few Heros the dominant fish keep
      harassing the others. Breeders describe the narrow H. severus as pushier than other Heros. A
      spawning pair defends its site hard and drives other fish across the tank; one breeder lost
      two large Uaru to a spawning male. Plenty of space, cover and robust tankmates of similar size
      keep the damage down. The fish are curious and quickly learn to recognise their keeper.

  sexing:
    text: Young fish are hard to sex. Adult males grow larger and develop longer, more pointed dorsal
      and anal fins, and they carry dark spots or worm-like lines on the cheeks and gill covers,
      while females show fewer and smaller head markings. Older males may develop a slight nuchal
      hump. Females ready to spawn show a short, blunt genital papilla. These signs are described
      for the genus, mostly from H. efasciatus. Raising a group and letting the fish choose partners
      is the surest way to a pair.
    sources:

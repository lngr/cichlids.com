  aggressionHeterospecific:
    value: 3
    confidence: low
    rationale: "Care sheets of the congeners (H. efasciatus, H. notatus) call severums peaceful with
      large tankmates outside spawning and protective of the spawning site, the basis of level 2 in
      the generator and checker-b. For the narrow H. severus a breeder reports that a spawning male
      killed his two largest male Uaru fernandezyepezi of about 23 to 25 cm, and another keeper
      reports an H. severus that singled out an H. liberifer; the breeder advises large, sturdy
      cichlids as tankmates. This fits level 3 as proposed by checker-a: tankmates need comparable
      size and robustness. The value rests on keeping reports, so the confidence is low."

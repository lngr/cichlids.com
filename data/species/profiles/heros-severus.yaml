  habitat:
    text: The species lives in the upper Orinoco drainage of Colombia and Venezuela, including the
      Inírida, Atabapo and Casiquiare, and in the upper Rio Negro, where the holotype was collected
      at Marabitanas. These rivers carry tea-coloured blackwater with pH values of about 4 to 5.5,
      almost no dissolved minerals and temperatures of about 26 to 30 C. Staeck and Schindler found
      the species only at strongly acidic blackwater sites. Heros live in calm water among fallen
      trees, roots and leaf litter over sand and also around submerged granite boulders; aquatic
      plants are rare. The water level changes by several metres between seasons, and in high water
      the fish move into the flooded forest.

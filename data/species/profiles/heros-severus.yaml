  husbandry:
    text: >-
      A pair needs a tank of about 300 litres with at least 120 cm length and 50 cm
      front-to-back depth. Use a sand bottom, roots, branches and a few smooth stones, and leave
      open space in the middle. Dim light, floating plants and leaf litter make the fish feel
      secure. Keep the water warm (about 26 to 29 C), very soft and acidic, below pH 6.5; peat
      filtration or reverse-osmosis water helps. Many care values in the hobby come from H.
      efasciatus, which is kept in harder, neutral water, and they do not suit wild H. severus,
      which should be moved into different water only slowly. Good filtration and large weekly
      water changes keep nitrate low. Soft-leaved plants are eaten, so use tough species such as
      Anubias or Java fern if plants are wanted.

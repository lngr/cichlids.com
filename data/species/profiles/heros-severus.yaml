  compatibility:
    text: "Choose tankmates that share very soft, acidic and warm water, are too large to be eaten and
      robust enough for a spawning pair. Large eartheaters such as Satanoperca and Geophagus, silver
      dollars and large armoured catfish work in a tank of 150 cm or more. Small fish such as
      cardinal tetras are eaten. Calm, slow cichlids such as Uaru and festivums are at risk once a
      pair spawns. Do not keep other Heros species with it: they look alike, fight as rivals and may
      cross. Aggressive Central American cichlids and African lake cichlids are unsuitable for their
      behaviour and their hard, alkaline water."

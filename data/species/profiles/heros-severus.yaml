partners:
  suitable:
    - species: Satanoperca daemon
      reason: Large eartheater of the same blackwater rivers that uses the bottom and is too big to be
        eaten.
      condition: Soft, acidic water, a sand bottom and a tank of at least 180 cm.
    - species: Geophagus abalios
      reason: Upper Orinoco eartheater of similar size that shares the water values.
      condition: Tank of at least 150 cm for both species.
    - species: Metynnis hypsauchen
      reason: Deep-bodied schooling silver dollar of the same waters, too large to be eaten and fast
        enough to avoid a spawning pair; it serves as dither fish.
  unsuitable:
    - species: Heros efasciatus
      reason: Close relative that looks alike, competes as a rival and may cross with H. severus.
    - species: Heros liberifer
      reason: Close relative that lives with H. severus in Venezuela and is separable only by fine
        details; risk of crosses, and keepers report H. severus singling it out.
    - species: Uaru fernandezyepezi
      reason: A breeder reports a spawning male H. severus that killed two large male Uaru; the calm, slow
        Uaru cannot escape a guarding pair.
    - species: Paracheirodon axelrodi
      reason: Cardinal tetras are small enough to be eaten by an adult severum.
    - species: Parachromis managuensis
      reason: Large Central American predator that needs harder water and injures or is injured by an
        equally large, aggressive cichlid.
    - species: Lake Malawi mbuna
      reason: Hard, alkaline water and constant aggression conflict with a soft-water South American
        cichlid.
profile:
  overview:
    text: "Heros severus is the true severum, a deep-bodied, laterally compressed cichlid of the
      blackwater rivers of the upper Orinoco and upper Rio Negro. For most of the hobby's history
      its name was used for other fish: the green, gold and red severums of the trade are mostly
      Heros efasciatus or mixed strains, and the mouthbrooder once imported from Venezuela as H.
      severus was described as H. liberifer in 2015. The real H. severus, long sold as Heros sp.
      'Inírida', spawns in the open, reaches about 25 cm and is the most quarrelsome member of its
      genus according to its breeders. It needs a large tank with very soft, acidic water and is
      mostly available as wild or wild-derived stock. Buy it from dealers who name the collecting
      site, because look-alike Heros are easy to confuse."

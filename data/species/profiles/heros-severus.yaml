  ghDgh:
    value:
      min: 0
      max: 1
    confidence: medium
    rationale: "Decided by the vote count with method unanimous (3 of 3 within 2 dGH: generator 0 to 1,
      checker-a 0 to 1, checker-b 0 to 0.5). The native rivers are among the most solute-poor waters
      known. Küchler et al. report at most about 0.7 mg/L calcium and 0.2 mg/L magnesium in the Rio
      Negro basin, about 0.13 dGH; the Ribeiro and Darwich data for Rio Negro blackwater give about
      0.06 dGH. Conductivity stays at about 7 to 15 uS/cm in the upper Orinoco, Casiquiare and upper
      Rio Negro (Laraque et al.; Pascoaloto and Bringel), with sodium and potassium as the main
      cations (Ríos-Villamizar et al.), which leaves no room for measurable hardness. The upper
      bound of 1 dGH allows for the slightly richer upper Orinoco main channel. FishBase gives 0 to
      6 dH, an aquarium value."
    sources:
      - kind: literature
        title: Küchler, I. L., Miekeley, N. and Forsberg, B. R. (2000). A contribution to the chemical
          characterization of rivers in the Rio Negro Basin, Brazil. Journal of the Brazilian

  note: "Valid as Heros severus Heckel 1840 in the Catalog of Fishes (accessed 2026-10-13); holotype
    from Maribitanos (Marabitanas) on the upper Rio Negro. The catalog keeps five valid species in
    Heros: H. severus, H. efasciatus, H. liberifer, H. notatus and H. spurius. This profile uses the
    narrow concept of Staeck and Schindler (2015), who re-examined the holotype: H. severus is a
    substrate-spawning blackwater species of the upper Rio Negro and the upper Orinoco drainage
    (Inírida, Atabapo, Casiquiare), long called Heros sp. 'Inírida' in the hobby. The larvophilous
    mouthbrooder imported from Venezuela since the 1990s and sold as H. severus is a separate
    species, H. liberifer. Most severums of the trade, including the gold and red lines, are H.
    efasciatus of the Amazon basin or stock of mixed origin, and the forum archive uses the name in
    this broad trade sense. The legacy catalog entries Heros severus and Cichlasoma severum show
    such trade fish and map to the profile of H. efasciatus. Anyone keeping a trade severum should
    check which species they have before using this profile. Few husbandry data exist for the narrow
    species, so several husbandry values rest on care sheets of H. efasciatus; the rationales mark
    these."

  minTank:
    value:
      volumeL: 300
      lengthCm: 120
      depthCm: 50
    confidence: low
    rationale: >-
      Generator proposed 300 L, 120 cm length and 50 cm depth; checker-a proposed 450 L, 150 cm
      length and 60 cm depth; checker-b proposed 250 L, 120 cm length and 45 cm depth. The
      component medians are 300 L, 120 cm length and 50 cm depth. The unit is one established
      adult pair without other adult fish. Seriously Fish gives 120 by 45 by 45 cm, about 243 L,
      for the similarly sized congener H. efasciatus. The cited breeder recommends at least 180
      cm for a group with other large cichlids, a different unit from the selected pair. That
      group recommendation supplies no pair-specific 150 by 60 cm footprint or 450 L minimum.
      Use the component medians of 300 L, 120 cm length and 50 cm depth as a provisional pair
      plan, with separated retreats and separation available. The volume exceeds the congener
      example and the depth allows additional cover, but neither is a measured H. severus
      threshold. A community or group requires a separate larger housing plan.

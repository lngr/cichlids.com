      min: 0
      max: 1
    confidence: medium
    rationale: "Decided by the vote count with method unanimous (3 of 3: generator 0 to 1, checker-a 0
      to 1, checker-b 0 to 0.5). At pH 4 to 5.5 almost no bicarbonate is present; the acidity comes
      from humic acids and dissolved carbon dioxide. Küchler et al. and Laraque et al. report pH 3.2
      to 6.1 and conductivity of 7 to 29 uS/cm in the Rio Negro and Casiquiare system,
      Ríos-Villamizar et al. describe Rio Negro blackwater as poorly buffered, and the Ribeiro and
      Darwich data give about 0.2 to 0.4 dKH. JBL measured 0 dKH at Barcelos. The upper bound allows
      for the slightly richer upper Orinoco."

  diet:
    text: In the wild the species eats fruits and seeds that fall into the water, other plant matter,
      algae, detritus and small invertebrates. In the aquarium it takes almost any food. A good
      staple is a cichlid pellet with a high plant share, supplemented with spirulina food, blanched
      peas, spinach or courgette, and frozen foods such as mosquito larvae, Mysis or brine shrimp.
      Several small meals a day are better than one large one. Plant food matters for long-term
      health, and soft aquarium plants will be grazed if the diet lacks greens.

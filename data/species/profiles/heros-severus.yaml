variants:
  - name: Inírida
    kind: locality
    note: Fish from the Río Inírida in Colombia, traded as Heros sp. 'Inírida'; Aquarium Glaser equates
      this trade name with the true H. severus, while some experienced keepers separate Inírida fish
      from H. severus by bar pattern and chest colour.
  - name: Curare (Red Tiger severum)
    kind: locality
    note: Wild imports with strong bars and a red chest, sold as Heros sp. 'Rio Curare' or Red Tiger
      severum; keepers of these fish assign them to H. severus.
  - name: Casiquiare
    kind: locality
    note: Wild fish from the Casiquiare channel in Venezuela; the Cichlid Room Companion figures an
      adult H. severus from there and lists an undescribed Heros sp. 'Casiquiare' as well.
features:
  origin:
    value:
      continent: South America
      region: Upper Rio Negro and upper Orinoco basins (blackwater rivers)
      waterbody: null
      localities:
        - Rio Negro at Marabitanas (type locality), Brazil and Venezuela
        - Río Inírida, Colombia
        - Río Atabapo, Colombia and Venezuela
        - Casiquiare channel, Venezuela
        - upper Río Orinoco, Colombia and Venezuela
    confidence: high
    rationale: All three runs place the species in the upper Rio Negro and upper Orinoco. The Catalog of
      Fishes gives the type locality on the upper Rio Negro and a wide range in the Orinoco and
      Amazon basins that still includes records of other Heros species. FishBase and the USGS
      factsheet, both after Kullander (2003), restrict the native range to the upper Orinoco
      drainage in Colombia and Venezuela and the upper Rio Negro, and the USFWS screening adds that
      Staeck and Schindler (2015) found the species only in strongly acidic blackwater and that
      records outside this range may concern other Heros. The Cichlid Room Companion figures an
      adult from the Casiquiare.

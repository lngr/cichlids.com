  breeding:
    text: H. severus spawns in the open; its relative H. liberifer is the mouthbrooder of the genus. A
      pair is best obtained by growing up a group of juveniles. The partners clean a flat stone, a
      root or a slate, the female lays her eggs there, and both parents guard them. After hatching
      the parents move the larvae to pits in the sand until they swim freely. Soft, acidic and warm
      water improves the hatch rate. The fry eat newly hatched brine shrimp and fine powdered food,
      and the parents guard them for several weeks, during which they are at their most aggressive.

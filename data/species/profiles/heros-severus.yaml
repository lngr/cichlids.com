  temperatureC:
    value:
      min: 26
      max: 30
    confidence: medium
    rationale: "Decided by the vote count with method qualified-majority (4 of 5 votes agree within 1 C:
      generator 26 to 30, checker-a 26 to 29, tiebreaker-1 26 to 29, tiebreaker-2 27 to 31;
      checker-b proposed 25 to 32 from lower Rio Negro and central Amazon floodplain data). Field
      readings from the range lie between 26 and 30 C: Laraque et al. measured 26.0 to 28.0 C at the
      Orinoco and Casiquiare bifurcation, along the Casiquiare and in the Guainía and upper Rio
      Negro in September 2000; Pascoaloto and Bringel found more than 27 C at every upper Rio Negro
      site near São Gabriel da Cachoeira from 2007 to 2009, without a stated maximum; Englezou read
      28.6 to 30.4 C in daytime in the Atabapo, where he saw a Heros among granite boulders. Val et
      al. give 28 to 32 C for Amazonian waters in general. The FishBase range of 23 to 29 C comes
      from an aquarium book and belongs to the tolerance. No year-round temperature series from the
      Inírida, Atabapo or Casiquiare was found."

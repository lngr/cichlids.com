  sizeAndGrowth:
    text: Scientific records give 20 cm standard length as the maximum, about 25 cm in total length.
      Well-grown aquarium males reach about 25 cm and females about 20 cm, and breeders report males
      of more than 28 cm. Juveniles grow fast with warm water and generous feeding, so a fish bought
      at a few centimetres needs its final tank within about a year. A deep-bodied severum of this
      length weighs far more than a slender cichlid of the same size, which matters for the tank
      volume and the filtration.

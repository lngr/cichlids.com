  problems:
    text: The most common mistake is buying a trade severum in the belief that it is the true H.
      severus, or mixing the two; check the species and origin first. Many keepers also
      underestimate the adult size and the aggression of a spawning pair. Poor water quality, high
      nitrate and a diet without plant food are linked to head and lateral line erosion, which forum
      keepers report in severums. Wild fish from blackwater react badly to sudden changes in
      hardness and pH and should be acclimatised over days; hard water makes the colours fade and
      the fish more prone to disease. Like all cichlids, severums can catch white spot after
      transport or a drop in temperature.

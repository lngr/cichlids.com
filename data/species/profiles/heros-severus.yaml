    value:
      male: 25
      female: 20
    confidence: medium
    rationale: FishBase and the USGS factsheet give 20 cm standard length as the maximum after Kullander
      (2003), which is about 25 cm total length, with 13.5 cm as common length. A keeper who has
      bred the narrow H. severus calls it the largest-growing Heros he has kept, with adults over 28
      cm, and Seriously Fish gives 20 to 25 cm in aquaria for H. efasciatus (care-sheet value of the
      congener). Females stay smaller in the genus. Well-grown aquarium males reach about 25 cm and
      females about 20 cm; record fish grow larger.

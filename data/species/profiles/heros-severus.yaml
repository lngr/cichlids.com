        L, for the similarly sized congener H. efasciatus. The cited breeder recommends at least
        180 cm for a group with other large cichlids, a different unit from the selected pair.
        That group recommendation supplies no pair-specific 150 by 60 cm footprint or 450 L
        minimum. Use the component medians of 300 L, 120 cm length and 50 cm depth as a
        provisional pair plan, with separated retreats and separation available. The volume
        exceeds the congener example and the depth allows additional cover, but neither is a
        measured H. severus threshold. A community or group requires a separate larger housing
        plan.

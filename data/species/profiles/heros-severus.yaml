  predation:
    value: 1
    confidence: medium
    rationale: Decided by the vote count with method unanimous (3 of 3 for level 1). FishBase lists
      plant matter, fruits, seeds, algae, detritus, insects and benthic invertebrates as food, with
      fish only as scales (trophic level 2.9), and the USFWS screening and the USGS factsheet
      describe an omnivore of small benthic invertebrates and plant material, so the species does
      not hunt fish. Care sheets for the congeners H. efasciatus and H. notatus warn that fish small
      enough to fit the mouth are eaten, and a keeper of the narrow H. severus reports adults eating
      tetras. Small fish and fry are taken when the chance arises.

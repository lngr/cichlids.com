  aggressionConspecific:
    value: 3
    confidence: low
    rationale: "The care sheets of H. efasciatus (Seriously Fish) and H. liberifer describe severums as
      fairly mild outside spawning with a clear order among adults, which led the generator and
      checker-b to level 2. Checker-a cited a keeper who has kept and bred the narrow H. severus: he
      calls it the most aggressive Heros he has kept, reports that adults push each other and that
      dominant fish harass the few others in a tank that is too small or holds too few fish. These
      are the only reports on the narrow species, and they describe persistent chasing with harm
      when space is short, which is level 3. They rest on forum posts, so the confidence is low."

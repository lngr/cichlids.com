  habitatZones:
    value:
      - wood
      - sand
      - rock
    confidence: medium
    rationale: The blackwater rivers of the range have sunken trees, roots and leaf litter over sand and
      almost no aquatic plants (Bleher in the Inírida basin; H. efasciatus care sheets describe the
      same habitat for the genus). In the Atabapo Englezou met a Heros among large granite boulders
      in deep water, a habitat that the river offers in the dry season. The Cichlid Room Companion
      lists floodplains and river channels. All three runs include wood; the generator and checker-b
      add sand, the generator rock; checker-a proposed open water among the roots, which the wood
      zone covers.

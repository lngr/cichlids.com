      \ 2 square metres at 3 m depth and joint all-purpose defence outside brooding. That measurement outweighs\
      \ inference from the fish's small body size. A pair can occupy a substantial part of a 90 cm aquarium,\
      \ which fits large under the rubric; breedingOnly remains false."
  - field: features.hybridGroups.value

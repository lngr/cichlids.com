      confidence: medium
      rationale: "The tally decides 23 to 29 C with unanimous verification under the one-degree agreement rule.\
        \ Generator proposed 22 to 30 C; checker-a, checker-b and checker-c proposed 23 to 29 C. Seriously\
        \ Fish recommends 24 to 28 C, Aqua-Fish and the Atlas 24 to 27 C, and Maidenhead 24 to 26 C; laboratory\
        \ fish were kept at 27 plus or minus 1 C. The adopted envelope includes the full natural range without\
        \ adding the generator's unsupported margin. Its equality with the lake envelope does not establish\
        \ harm immediately outside it. Tanganyika.si warns that about 30 C is suitable only briefly, which\
        \ argues against treating 30 C as a long-term endpoint."

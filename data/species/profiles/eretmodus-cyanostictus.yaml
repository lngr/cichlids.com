partners:
  suitable:
  - species: Cyprichromis leptosoma
    reason: Uses water above the rocky grazing territory and shares Tanganyika water requirements.
    condition: Provide a larger aquarium suited to its adult school; the goby pair minimum is insufficient
      for this community.
  - species: Paracyprichromis brieni
    reason: Can use vertical rock faces and water above the goby pair's bottom feeding area.
    condition: Provide enough separate structure and space for both social units.
  - species: Neolamprologus brevis
    reason: Its shell patch can be separated from the goby pair's rocks.
    condition: Use a larger tank with distinct shell and grazing areas and monitor territorial chasing.
  unsuitable:
  - species: Eretmodus marksmithi
    reason: Shares the same feeding and territorial niche; specialist reports describe wild hybridization with
      cyanostictus.
  - species: Tanganicodus irsacae
    reason: Another goby cichlid creates territorial overlap; the presumed hybrid group reflects historical
      introgression involving a provisionally identified cf. irsacae lineage.
  - species: Lake Malawi mbuna
    reason: Boisterous rock occupation and food competition are a poor match for a territorial Tanganyika goby
      pair.
  - species: Petrochromis famula
    reason: A much larger rock grazer can dominate feeding surfaces in a small setup.
    condition: Tanganyika.si reports some Petrochromis combinations in large stable aquaria; this remains unsuitable
      for the selected minimum tank.
profile:
  overview:
    text: "A bonded pair of Eretmodus cyanostictus brings an unusual style of life to a Tanganyika aquarium:\
      \ the fish move close to stone, crop attached growth and share incubation of their young. This is the\
      \ southern-lake species, with a compact brown or grey body carrying blue spots and lighter bars. Its\
      \ modest adult size does not remove the need for territory, oxygen or careful feeding. Plan for one compatible\
      \ pair and an established rocky aquarium. Unrelated adults can be difficult to combine, and a male and\
      \ female do not necessarily form a safe pair."
    sources:
    - *id002
    - *id017
    - *id039
    - *id037
    - *id038
  habitat:
    text: "The confirmed range lies in southern Lake Tanganyika, with FishBase describing the shore from Kipili\
      \ through Zambia to Moliro. The fish uses shallow rocky shores exposed to waves, with sand in gaps between\
      \ stones. Field studies also observed pairs around 3 m depth at Kasakalawe Point. Its reduced buoyancy\
      \ suits a life close to the bottom. The adopted lake chemistry is 23 to 29 C, pH 8.4 to 9.4, GH 10 to\
      \ 13 dGH and alkalinity 15 to 20 dKH. These are regional habitat envelopes rather than simultaneous targets\
      \ for one tank. Older northern locality labels can refer to marksmithi or unresolved Eretmodus populations."
    sources:
    - *id002
    - *id043
    - *id015
    - *id017
    - *id020
    - *id016
    - *id021
    - *id022
    - *id023
    - *id037
    - *id038
  sizeAndGrowth:
    text: "Use about 9 cm for a typical adult male maximum and 8 cm for a female, with considerable overlap\
      \ between the sexes. FishBase reports 9 cm total length without a separate female maximum, whereas Seriously\
      \ Fish uses 8 cm standard length, which excludes the tail. Field observations support males being larger\
      \ on average but do not supply a precise aquarium maximum for each sex. Young fish develop slowly, and\
      \ consistent access to suitable food matters more than rapid growth. The 5 to 8 year lifespan is a low-confidence\
      \ aquarium estimate from Aqua-Fish, without independent long-term follow-up."
    sources:
    - *id002
    - *id017
    - *id025
    - *id037
    - *id031
  husbandry:
    text: "The selected minimum for one established pair is 81 litres with a 90 by 30 cm base, following Seriously\
      \ Fish. Other sources advise roughly 100 to 200 litres, so a larger aquarium offers useful room for barriers\
      \ and grazing surfaces. The minimum does not describe a community or several pairs. Build stable rockwork\
      \ with retreats and broken sightlines above sand, and encourage edible attached growth. Strong gas exchange,\
      \ mature filtration and regular maintenance are central to care. The tallied working tolerances are 23\
      \ to 29 C, pH 8.0 to 9.4, GH 10 to 25 dGH and KH 12 to 25 dKH. They are husbandry envelopes rather than\
      \ proven physiological boundaries; the upper KH endpoint is especially uncertain. Choose stable conditions\
      \ within them instead of deliberately approaching every endpoint."
    sources:
    - *id017
    - *id025
    - *id002
    - *id042
    - *id038
    - *id029
    - *id031
    - *id024
  socialBehavior:
    text: "One compatible adult pair is the recommended social unit. Both fish use and defend an all-purpose\
      \ feeding territory, and field research reports about 2 square metres at one 3 m-deep site. This makes\
      \ territory substantial despite the fish's small size. Most defence is directed at other Eretmodus, and\
      \ failed pairing can cause prolonged harassment or injury. Allowing juveniles to choose a partner can\
      \ be safer than introducing two arbitrary adults, but surplus fish need another home after pairing. A\
      \ bonded pair may tolerate selected other species away from its rocks. A report of group keeping does\
      \ not make a small group the general recommendation."
    sources:
    - *id039
    - *id017
    - *id043
    - *id037
    - *id027
  diet:
    text: "Attached algae and the organisms living in that film are the main natural food. Provide a varied\
      \ plant-based staple, with mature grazing stones and suitable algae foods rather than a daily supply\
      \ of rich meat or worms. Small amounts of appropriate invertebrate food can supplement the staple; their\
      \ occurrence in the wild does not make this fish a general animal-food feeder. The profile retains the\
      \ bloat-sensitive flag because care sources report digestive problems with unsuitable feeding. Grazing\
      \ behaviour alone does not establish competitive feeding speed, which remains an uncertain normal rating.\
      \ Check that both partners can reach food and maintain condition."
    sources:
    - *id002
    - *id043
    - *id017
    - *id025
    - *id035
    - *id024
  breeding:
    text: "Both parents incubate the brood in the mouth. The female collects eggs during spawning on a stone\
      \ and carries the early stages before transferring the developing brood to the male. The duration of\
      \ each parent's share varies among reports and can respond to body condition. A compatible pair, adequate\
      \ food before spawning and a quiet territory are more useful than one rigid incubation timetable. Released\
      \ young can take finely divided algae foods and suitably small live food. Several sources describe the\
      \ parents tolerating or largely ignoring released fry, so continued active guarding should not be assumed.\
      \ In a community, other fish may still eat the young."
    sources:
    - *id002
    - *id039
    - *id017
    - *id027
    - *id038
  sexing:
    text: "External sex differences are slight. Males usually grow larger and Seriously Fish describes somewhat\
      \ longer pelvic fins, while both sexes carry blue markings. Aqua-Fish instead describes females as larger,\
      \ a lower-trust claim that conflicts with field research and the specialist care accounts. The decided\
      \ size values follow the better-supported male-biased difference. Size and colour alone cannot guarantee\
      \ sex, and correctly identifying one male and one female does not guarantee that they will accept each\
      \ other. Observe tolerance and feeding access when evaluating a prospective pair."
    sources:
    - *id017
    - *id025
    - *id037
    - *id024
  compatibility:
    text: "Selected Tanganyika communities are possible. Fish using the water above the rocks, such as Cyprichromis\
      \ and Paracyprichromis, can reduce direct overlap with the pair's feeding territory. Shell dwellers require\
      \ separate shell and rock areas and additional space. Sources disagree about stronger algae grazers:\
      \ Aquarium Glaser and Tanganyika.si describe combinations with Tropheus, while other advice discourages\
      \ forceful competitors. Such combinations depend on a substantially larger layout and are not a default\
      \ minimum-tank choice. Avoid other goby cichlids in this setup. The hybrid groups record reported wild\
      \ mixing with E. marksmithi and a presumed named-species risk with Tanganicodus irsacae, based on historical\
      \ gene flow involving a cf. irsacae lineage. Neither establishes frequent contemporary aquarium crossing."
    sources:
    - *id017
    - *id025
    - *id005
    - *id042
    - *id038
    - *id051
    - *id024
    - *id055
  problems:
    text: "Watch for a partner being excluded from food or shelter, loss of body condition, digestive swelling\
      \ and unusually rapid breathing. These are reasons to reassess the social arrangement, feeding, oxygenation\
      \ and water quality, rather than assume a shy fish will recover unaided. Poorly matched adults can need\
      \ separation even when their sexes are known. Rich or monotonous feeding is a recurring concern in the\
      \ hobby evidence, while a mature filter and strong gas exchange address the demands of a surf-zone species.\
      \ A fish-only stock list from a forum is not proof that a community remained healthy for years. This\
      \ account does not identify a specific disease from a single visible symptom."
    sources:
    - *id017
    - *id025
    - *id002
    - *id035
    - *id024
    - *id027

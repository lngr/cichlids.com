    decision:
      volumeL: 81
      lengthCm: 90
      depthCm: 30
    rationale: "Volumes proposed were 81 L by generator, 100 by checker-a, 81 by checker-b and 151 by checker-c,\
      \ giving a starting median of 90.5 L; lengths were all 90 cm and depths 30, 30, 30 and 45 cm, giving\
      \ medians of 90 by 30. Checking the volume against sources favours the direct high-trust Seriously Fish\
      \ minimum of 81 L at 90 by 30 cm for a single fish or bonded pair. Larger advice remains visible: 100\
      \ L in Guidarium and the laboratory compartments, 132 L in Tropical Freshwater Fish, about 151 L at Aquarium\
      \ Glaser, about 190 L in the Atlas and 200 L in the association register and Tanganyika.si. Those larger\
      \ recommendations allow more layout margin but do not displace the explicit pair minimum. Dimensions\
      \ attached to sources that gave volume alone were inferred by earlier agents, not measured prescriptions.\
      \ This minimum is not a community-tank or multiple-pair specification."
  - field: features.beginnerSuitability.value

      \ diet data include minor benthic crustaceans, and husbandry sources allow small supplementary animal\
      \ foods. The bloat flag rests on Seriously Fish and Maidenhead warnings about rich animal foods and Practical\
      \ Fishkeeping's keeper report about unvaried feeding. Ecological studies that do not discuss bloat are\
      \ retained with their original evidence values; their false flags express absence of a bloat assessment,\
      \ not evidence that the fish is resistant."
  - field: features.aggressionConspecific.value
    proposals:
    - by: generator
      value: 4
    - by: checker-a
      value: 3
    - by: checker-b
      value: 3
    - by: checker-c
      value: 2
    decision: 3
    rationale: "Generator proposed 4, checker-a and checker-b 3, and checker-c 2. Their numeric median is 3.\
      \ Seriously Fish reports potentially fatal harassment during failed adult pairing, while the laboratory\
      \ study separated pairs showing persistent aggression or injury. A settled pair is the recommended unit\
      \ and most defence is aimed at conspecific rivals, so level 3 captures the persistent pursuit risk without\
      \ making killing the expected behaviour of an established pair. The group-keeping report is retained\
      \ but does not set the recommended social unit."
  - field: features.aggressionHeterospecific.value
    proposals:
    - by: generator
      value: 1
    - by: checker-a
      value: 2
    - by: checker-b
      value: 2
    - by: checker-c
      value: 1
    decision: 2
    rationale: "Generator and checker-c proposed 1; checker-a and checker-b proposed 2. The numeric midpoint\
      \ is 1.5. The field study reports uncommon but aggressive contacts with other species, and resource-defence\
      \ studies include exclusion of other herbivores. Level 2 therefore fits territorial chasing more closely\
      \ than display alone; it does not imply attacks outside the defended area. Reports of calm coexistence\
      \ concern companions in other zones."

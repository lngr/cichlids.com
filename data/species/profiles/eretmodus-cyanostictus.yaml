    decision:
    - eretmodus-cyanostictus-marksmithi
    - eretmodus-cyanostictus-tanganicodus-irsacae
    rationale: "Tally method conservative. The tally uses the conservative union with low confidence because\
      \ only three of six complete group lists agree. Generator and checker-a proposed []; checker-c proposed\
      \ only eretmodus-cyanostictus-tanganicodus-irsacae; checker-b, tiebreaker-1 and tiebreaker-2 proposed\
      \ both eretmodus-cyanostictus-marksmithi and eretmodus-cyanostictus-tanganicodus-irsacae. Each pair has\
      \ support from at least two votes, so both remain. Tanganyika.si reports natural mixing with marksmithi\
      \ at Kampemba and labels Korongwe Bay fish as that cross; this meets the rubric's documented wild-report\
      \ basis, but it is one specialist account rather than independent genetic confirmation. Ruber, Meyer,\
      \ Sturmbauer and Verheyen (2001) favour historical introgression between southern cyanostictus and Tanganicodus\
      \ cf. irsacae; they found no evidence of ongoing gene flow. The cf. identification leaves the nominal\
      \ irsacae parent unresolved, so that named pair has presumed basis. Tiebreaker-1 favoured documented\
      \ for it and checker-b also treated the wild inference as documented; tiebreaker-2's distinction between\
      \ the studied lineage and the named catalog species is more precise. Absence of crosses from the generator's\
      \ and checker-a's sources does not negate these positive reports. The two pairs do not imply a cross\
      \ between marksmithi and irsacae."

        min: 8
        max: 9.4
      confidence: medium
      rationale: "The qualified-majority tally decides pH 8 to 9.4 with five of six votes agreeing within the\
        \ rubric threshold. Generator proposed 7.6 to 9.6; checker-a proposed 8 to 9.5; checker-b, checker-c,\
        \ tiebreaker-1 and tiebreaker-2 proposed 8 to 9.4. Seriously Fish and Maidenhead recommend 8 to 9;\
        \ 9.4 includes the measured natural maximum. Wider advice remains visible: Aqua-Fish gives 7.6 to 8.9,\
        \ Tropical Freshwater Fish 7.5 to 9, Aquarium Guide 7.5 to 8.5, Fischlexikon 7.8 to 9, and Guidarium\
        \ and general Tanganyika.si advice 8 to 9.5. The narrower adopted envelope follows stronger species-specific\
        \ minimum-pH guidance and natural coverage, rather than treating every published endpoint as a demonstrated\
        \ physiological limit."

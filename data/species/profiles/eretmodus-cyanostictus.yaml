      value: demanding
    - by: checker-a
      value: moderate
    - by: checker-b
      value: moderate
    - by: checker-c
      value: demanding
    decision: demanding
    rationale: "Generator and checker-c proposed demanding; checker-a and checker-b proposed moderate. CRC\
      \ classifies the aquarium audience as intermediate, and Seriously Fish has an overall moderate rating\
      \ but expressly discourages beginners. The combined demands for oxygen, stable water quality, specialised\
      \ food and safe pairing favour demanding as the beginner-suitability category. This does not assert that\
      \ established pairs are impossible for an experienced keeper."

  compatibility:
    text: "Mixed keeping is possible with sufficiently large robust Malawi cichlids, but every individual combination\
      \ needs room and observation. Aristochromis, Buccochromis and Champsochromis include candidates of a more\
      \ suitable adult scale; named examples here are conditional suggestions rather than proven pairings. Small\
      \ mbuna and other swallowable fish are unsuitable. With the selected 38 cm male size, the planner's one-third\
      \ prey approximation is about 12.7 cm, not a guaranteed safe boundary. A documented historical gene-flow group\
      \ also links esox and longiceps, although present aquarium crossing frequency is unknown."

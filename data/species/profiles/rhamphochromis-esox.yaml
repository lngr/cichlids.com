  diet:
    text: "Wild prey include small utaka and the lake sardine Engraulicypris sardella. This is a specialized piscivore.\
      \ Aquarium accounts differ in feeding emphasis: one favors fish prey, while Malawi Mayhem describes acceptance\
      \ of cichlid pellets or flakes with frozen supplements. Suitable foods in the decided list include small fish,\
      \ lake sardines, quality cichlid pellets, krill and mysis. Prepared-food acceptance should be established\
      \ for the individual fish. The false bloat-sensitive flag records the absence of an established high-protein\
      \ sensitivity under the rubric; it does not guarantee freedom from digestive disease."

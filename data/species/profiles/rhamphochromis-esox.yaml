  temperatureC:
    value:
      min: 21
      max: 29
    confidence: high
    rationale: "The fixed Lake Malawi envelope is 21 to 29 C. Eccles reports a 21 C inshore cool-season minimum\
      \ and about 27 C in the upper water by May; Vollmer describes seasonal heating and cooling. The 23 to 25 C\
      \ surface interval compiled by FAO and FishBase's 23 to 27 C summary cover less of this variability. These\
      \ are lake measurements, not experimental aquarium limits. Eccles was read through its Crossref abstract because\
      \ the publisher returned 403; its full text was not accessed. The retained 1999 chapter and dissertation citations\
      \ are supporting lake-reference context, not independently checked measurements of every endpoint."

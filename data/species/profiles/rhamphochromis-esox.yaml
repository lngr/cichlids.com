partners:
  suitable:
  - species: Aristochromis christyi
    reason: A large robust Malawi predator is a conditional companion if neither fish can swallow the other.
    condition: Provide a very large aquarium beyond the space needed for the esox group and monitor individual aggression.
  - species: Buccochromis nototaenia
    reason: Comparable adult scale and open-water swimming needs make it a conditional candidate.
    condition: Both fish must be too large to swallow and able to avoid one another.
  - species: Champsochromis caeruleus
    reason: A large Malawi predator in a genus proposed by the species care account.
    condition: Allow additional swimming space and observe aggression; this exact pairing is not verified.
  unsuitable:
  - species: Labidochromis caeruleus
    reason: Its adult size can lie within the approximate 12.7 cm prey threshold of a 38 cm esox.
  - species: Chindongo socolofi
    reason: Its small adult size presents a strong predation risk.
  - species: Rhamphochromis longiceps
    reason: The pair shares a documented historical natural gene-flow group; aquarium crossing frequency is not
      established.
profile:
  overview:
    text: "Rhamphochromis esox is a large fish-eating cichlid endemic to Lake Malawi. Its narrow body and toothed\
      \ jaws suit pursuit of small fishes through open water. Adults also use relatively shallow shelf and shoreline\
      \ habitats, so this species should not be pictured only as an offshore deep-water predator. Typical aquarium\
      \ planning sizes here are 38 cm for males and 30 cm for females. The current Catalog of Fishes places the\
      \ former catalog entries R. leptosoma and R. lucius within esox. This profile therefore covers legacy entries\
      \ 496, 498 and 500 together."
    sources:
    - kind: catalog-of-fishes

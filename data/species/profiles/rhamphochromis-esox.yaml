  hybridGroups:
    value:
    - rhamphochromis-esox-longiceps
    confidence: low
    rationale: "The conservative tally includes rhamphochromis-esox-longiceps with three of six votes and low confidence.\
      \ Generator, checker-a and checker-c proposed no group; checker-b, tiebreaker-1 and tiebreaker-2 proposed\
      \ this pair. The conservative rule retains a group named by at least two votes, even though there is no qualified\
      \ majority. Yang et al. explicitly infer historical natural admixture between esox and longiceps and connect\
      \ the signal to Malinsky et al.; the studies partly share sequence data and authors. This supports a documented\
      \ wild gene-flow basis under the rubric, which does not require a contemporary hybrid individual. Checker-b\
      \ and tiebreaker-2 favoured documented, whereas tiebreaker-1 favoured presumed because present aquarium crossing\
      \ was not demonstrated. Current captive frequency and mate choice remain unknown. Signals involving ancestors\
      \ of other lineages do not justify a genus-wide group, and synonymous catalog names are not additional species.\
      \ Empty-list evidence is retained rather than interpreted as proof of reproductive isolation."

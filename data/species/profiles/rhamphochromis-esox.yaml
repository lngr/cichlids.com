  husbandry:
    text: "For one male and at least two females, plan from the species-specific recommendation of 2000 litres and\
      \ 300 cm length, with about 80 cm front-to-back depth as an inferred footprint allowance. Preserve long clear\
      \ swimming routes and room for adults to pass. Stable rockwork can provide peripheral shelter without filling\
      \ the swimming space. Care accounts commonly recommend around 24 to 26 C. The broader tolerances recorded\
      \ here are 21 to 30 C, pH 7.5 to 8.7, GH 3 to 15 dGH and KH 5 to 15 dKH; they are working husbandry envelopes\
      \ rather than tested failure thresholds. Effective filtration and regular maintenance are essential for the\
      \ adult group."

  socialBehavior:
    text: "One male with at least two females is the clearest species-specific aquarium recommendation. CRC records\
      \ both monogamous and polygynandrous mating, so this stocking unit should not be confused with a universal\
      \ wild mating system. A hierarchy and chasing are plausible; observations do not securely quantify conspecific\
      \ injury rates in adequate tanks. Reports of behavior toward other species range from quiet hovering to attacks\
      \ on slender companions. The profile therefore treats heterospecific aggression cautiously even though predation\
      \ is its best-established compatibility risk."

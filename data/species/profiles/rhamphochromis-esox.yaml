  sizeAndGrowth:
    text: "The sexed aquarium account reports males reaching about 38 cm and females about 30 cm, the medians of\
      \ the profile proposals. FishBase lists 42 cm standard length for males or unsexed fish, while NCS lists an\
      \ unsexed 45 cm. These larger reference figures are retained without treating them as typical sexed aquarium\
      \ measurements. Much smaller dealer and forum reports involve uncertain identification or individual growth\
      \ histories. The estimated lifespan of 8 to 12 years is provisional because a species-specific longevity record\
      \ was not found."

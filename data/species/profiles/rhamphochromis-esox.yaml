  problems:
    text: "Short tanks, obstructed swimming routes and prey-sized companions create the clearest problems. Individual\
      \ aggression can make an apparently suitable large companion fail, especially when fish have similar slender\
      \ shapes. Conflicting minimum-tank recommendations and unreliable identification make small juvenile purchases\
      \ particularly difficult to plan. GH and KH should be considered separately; raising total hardness is not\
      \ a substitute for maintaining stable alkalinity. Hybrid evidence comes from genomic inference of natural\
      \ historical gene flow rather than a measured aquarium crossing rate. Species-specific lifespan, feeding speed\
      \ and exact tolerance endpoints remain incompletely documented."

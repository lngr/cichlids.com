  breeding:
    text: "The female provides mouthbrooding care, a reproductive mode explicitly recorded by CRC. The male does\
      \ not form a jointly guarding substrate-spawning pair with her. A group of one male with multiple females\
      \ is an aquarium recommendation, while CRC recognizes more than one mating pattern. Detailed spawning intervals\
      \ and clutch counts are not adopted here because the reviewed reliable public sources do not establish a consistent\
      \ captive protocol. One forum thread embeds a breeding account for macrophthalmus, currently treated as longiceps;\
      \ its hardness and breeding observations are congener evidence rather than direct esox measurements."

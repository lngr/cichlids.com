  khDkh:
    value:
      min: 5
      max: 8
    confidence: high
    rationale: "The fixed natural interval is 5 to 8 dKH. FAO's alkalinity measurements convert to about 5.6 to\
      \ 7.3 dKH, and Branchu's measurements to about 6.5 to 6.9 dKH. These support the rounded lake envelope. Sodium-associated\
      \ bicarbonate contributes to alkalinity without raising calcium and magnesium hardness, so KH can exceed GH.\
      \ No natural KH verification object is attached."

    tolerance:
      value:
        min: 21
        max: 30
      confidence: low
      rationale: "Tally retains 21 to 30 C with unanimous agreement under the one-degree comparison rule, not identical\
        \ proposals. Generator and checker-a proposed 21 to 29 C; checker-b and checker-c proposed 20 to 30 C. The\
        \ midpoint endpoints were rounded by the tally and widened to contain the natural range. The decided minimum\
        \ is narrower than the derived 20 C proposals; no source demonstrates harm at 20 C. Read care recommendations\
        \ are 24 to 26 C at Einrichtungsbeispiele, 23 to 28 C at NCS, and about 23.3 to 28.9 C for the unidentified\
        \ Rhamphochromis stock sold by Ron's Cichlids. The 30 C endpoint is inferred, not a recommendation for continuous\
        \ warm maintenance or an experimentally established limit. Confidence remains low."

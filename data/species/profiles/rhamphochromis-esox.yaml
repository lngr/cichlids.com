  sexing:
    text: "The aquarium account reports males larger than females, but size is an unreliable sexing method for immature\
      \ or differently grown fish. The Atlas account describes orange pelvic and anal accents and blue display fins\
      \ in mature males against a largely silvery body. These accounts do not establish a colour key that reliably\
      \ sexes every individual. A forum report describes a dominant fish initially mistaken for a male, reinforcing\
      \ that caution. Identification and sex should be checked from mature individuals rather than a juvenile trade\
      \ label alone."

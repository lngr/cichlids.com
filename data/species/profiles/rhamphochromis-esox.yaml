  habitat:
    text: "Adults move through open water around shallow shelves, rocky reefs and sandy shores; young fish also\
      \ occur in swampy littoral areas. FishBase reports a depth range of 2 to 65 m. The natural lake envelope used\
      \ here is 21 to 29 C, pH 7.7 to 8.6, GH 3 to 5 dGH and KH 5 to 8 dKH. Lake Malawi is comparatively soft in\
      \ calcium and magnesium while remaining alkaline. These seasonal and spatial ranges describe habitat variation;\
      \ they do not call for abrupt changes in a home aquarium."

  - name: Rhamphochromis melanotus
    note: Additional current catalog synonym.
  legacyNames:
  - Rhamphochromis esox
  - Rhamphochromis leptosoma
  - Rhamphochromis lucius
  note: "The current Catalog of Fishes accepts Rhamphochromis esox and treats leptosoma, lucius and melanotus as\
    \ synonyms. Older treatments placed lucius differently, including a possible association with woodi; these historical\
    \ views do not control the current mapping. CRC's older public record lists leptosoma and melanotus and retains\
    \ some other historical distinctions. The original combination is Paratilapia esox; the Paratilapia genus search\
    \ was also read and has no current esox entry. Synonymy combines names for one species and is not hybridization\
    \ evidence."

  sexing:
    text: "Adult color, fin shape and head contour vary between strains and do not provide dependable\
      \ sex identification by themselves. Reports of larger males or less deformed females lack strong\
      \ comparative measurements. Equal planning sizes reflect that uncertainty rather than proof that\
      \ all males and females grow identically. Egg laying identifies a female more reliably than a shop\
      \ label; a fish acting as the male in courtship may still be infertile. Selecting two fish by supposed\
      \ sex does not ensure social compatibility."

      \ 250 L with an approximately 122 x 46 cm footprint, and Expoaqua states 250 L with 120 cm front\
      \ length; the adopted footprint rounds to common metric dimensions. Aquarium Co-Op permits three\
      \ in about 208 L, while other source group recommendations reach 284 L or 473 L. Those wider recommendations\
      \ remain evidence, without establishing a universal 300 or 473 L necessity. Additional substantial\
      \ tankmates need a larger assessment."
  - field: taxonomy.validName

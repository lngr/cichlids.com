  habitat:
    text: "There is no native blood-parrot habitat. The water features are inherited proxies from the\
      \ reported Central American parents, including Lake Nicaragua and Peten Itza, rather than measurements\
      \ of wild blood parrots. The adopted proxies are 24 to 30 C, pH 7.0 to 8.9, 3 to 16 dGH and 3 to\
      \ 6 dKH. Lake Managua represents an atypical, sodium-rich alkaline parental setting: FAO reports\
      \ pH 8.7 and carbonate plus bicarbonate near 24.4 dKH, while Swain records surface pH 8.9 to 9.3.\
      \ These unusual values remain described here and in evidence rather than enlarging the domestic-line\
      \ water ranges. GH comes from calcium and magnesium; KH is an alkalinity equivalent. Neither conductivity\
      \ nor salt exposure supplies either hardness measure."
    sources:
    - kind: literature
      title: "Swain (1966). Bottom sediments of Lake Nicaragua and Lake Managua, western Nicaragua"

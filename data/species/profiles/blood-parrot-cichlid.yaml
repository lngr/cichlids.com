  predation:
    value: 1
    confidence: low
    rationale: "Retain the qualified-majority level 1 with low confidence: generator, checker-a, checker-b\
      \ and tiebreaker-2 proposed 1, while checker-c and tiebreaker-1 proposed 2. Gay reports consumption\
      \ of small neons, and Aquarium Co-Op explains the restricted mouth. Wiegert describes sustained\
      \ pursuit of small fish and a separate Practical Fishkeeping account reports repeated guppy feeding;\
      \ those stronger level-2 interpretations remain evidence. The approximately 2 cm prey threshold\
      \ belongs to the rubric, not a measured gape or safe tankmate cutoff. Strain and jaw variation can\
      \ change risk, so tiny fish remain unsuitable and normal-mouthed derived lines are outside this\
      \ profile."

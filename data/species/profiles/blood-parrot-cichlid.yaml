  diet:
    value:
      type: omnivore
      bloatSensitive: false
      foods:
      - Small complete cichlid pellets with plant ingredients
      - Softened flakes
      - Finely chopped vegetables
      - Small portions of frozen aquatic invertebrates
    confidence: medium
    rationale: "All four complete profiles agree on omnivore and bloatSensitive false; retain the unanimous\
      \ tally decision and its food list with medium confidence. Care sources recommend plant and animal\
      \ ingredients, and the hybrid nutrition study used a mixed diet around 44 percent protein. FishBase\
      \ corroborates mixed feeding in the parents, with CRC serving only as verification of redhead omnivory.\
      \ The false bloat flag means a specialist protein-linked syndrome was not established, not immunity\
      \ to digestive disease. Differences in food examples are retained in evidence; soft small pellets\
      \ are the better-supported staple, and flakes require individual checks because Wiegert reports\
      \ poor flake handling."

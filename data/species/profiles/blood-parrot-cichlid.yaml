      \ reports Taiwan, and Fisher independently produced the redhead female x Midas male cross. Commercial\
      \ pedigrees need not be uniform. Older severum, red-devil and single-species balloon hypotheses\
      \ remain in evidence but are weaker than known-parent experimental offspring. The Catalog validates\
      \ the reported parents, not the domestic trade name."

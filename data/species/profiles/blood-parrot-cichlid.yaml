  husbandry:
    text: "Provide a mature 250-litre aquarium with at least a 120 by 45 cm footprint for three ordinary\
      \ adults, several independent refuges and open swimming room. Fine substrate and stable rocks or\
      \ wood give cover; optional plants may succeed, but digging varies. Larger mixed stocking needs\
      \ more space. Keep filtration and oxygenation effective, remove uneaten food and maintain regular\
      \ partial water changes. The accepted tolerances are 22 to 30 C, pH 6.5 to 8.9, 3 to 20 dGH and\
      \ 3 to 12 dKH, all with low confidence. Routine care around 24 to 28 C and pH near 7 to 8 has stronger\
      \ direct husbandry support. The upper pH endpoint and softer hardness edge are partly inherited\
      \ assumptions, not preferred targets or proven lifetime limits."

  ph:
    value:
      min: 7
      max: 8.9
    confidence: low
    rationale: "The tally uses the median because no pH proposal obtains a qualified majority: 7.0 to\
      \ 8.9 is retained exactly with low confidence. FAO reports Lake Nicaragua pH 7.0; Swain gives surface\
      \ 8.2 to 8.9 and deeper 7.4 to 7.8 there, while Perez reports Peten Itza surface 8.2 to 8.5. FishBase\
      \ gives the narrower redhead summary of 7.0 to 8.0. Swain also reports the wider and more alkaline\
      \ Managua surface range of 8.9 to 9.3; its exceptional concentrated chemistry is described in habitat\
      \ and excluded from the adopted proxy. The median summarizes differing parental field interpretations,\
      \ not a measured native niche or preferred aquarium pH of this domestic line. Proposals: generator\
      \ proposed 7.4 to 8.9; checker-a proposed 7 to 8; checker-b proposed 7.4 to 8.9; checker-c proposed\
      \ 7 to 8.5; tiebreaker-1 proposed 7 to 8.9; tiebreaker-2 proposed 7 to 8.9."

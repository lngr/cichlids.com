  diet:
    text: "Offer a mixed diet built around complete small pellets with plant ingredients, supplemented\
      \ by suitable vegetables and modest portions of aquatic invertebrates. Choose pellet size and softness\
      \ by watching each fish swallow. Floating miniature pellets help some mouths, while other individuals\
      \ manage softened or sinking food better. The decided food examples include softened flakes, but\
      \ reports of poor flake handling mean these should not replace a successful pellet staple. Feeding\
      \ is slow relative to competitive tankmates even when the fish approaches eagerly. Spread small\
      \ meals so every fish feeds, and remove leftovers. The false specialist-bloat flag does not imply\
      \ immunity to constipation, intestinal illness or overfeeding."

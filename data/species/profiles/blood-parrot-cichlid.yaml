  socialBehavior:
    text: "A trio or larger loose group is the recommended arrangement, while a single fish remains possible.\
      \ Two randomly selected fish can develop unequal domination. Territorial defense usually centers\
      \ on a shelter and can occur outside breeding; egg guarding increases it. The selected aggression\
      \ levels describe recurring chasing in a properly furnished tank, not a promise that no fish will\
      \ be injured. Persistent hiding, missed meals and damaged fins suggest that an individual needs\
      \ protection or separation. Male infertility does not prevent courtship, pair association or nest\
      \ defense."

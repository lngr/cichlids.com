    confidence: low
    rationale: "Retain the conservative tally union of groups proposed by at least two runs, with low\
      \ confidence. The three existing groups are supported by Fisher laboratory crosses for redhead and\
      \ Mayan sperm and a weaker Rechi captive-offspring report for Cuban cichlids. Fisher also reports\
      \ viable progeny after artificially fertilizing blood-parrot eggs with Midas sperm. The Maidenhead\
      \ 2019 author reports seeing a blood parrot and Herichthys carpintis with fry; the TFH card, Maidenhead\
      \ care page and archive reports also describe convict crosses. None establishes conspecific mate\
      \ choice, so all six pairwise groups have presumed basis. The Flowerhorn group was proposed only\
      \ by tiebreaker-2 and is excluded by the tally, while its weak labelled-offspring evidence remains.\
      \ No ancestral group is inherited transitively, and egg laying without viable offspring establishes\
      \ no additional cross. Proposals: generator proposed [vieja-melanurus-blood-parrot, nandopsis-tetracanthus-blood-parrot,\
      \ mayaheros-urophthalmus-blood-parrot]; checker-a proposed [mayaheros-urophthalmus-blood-parrot,\
      \ nandopsis-tetracanthus-blood-parrot, vieja-melanurus-blood-parrot]; checker-b proposed [vieja-melanurus-blood-parrot,\
      \ nandopsis-tetracanthus-blood-parrot, mayaheros-urophthalmus-blood-parrot, amphilophus-citrinellus-blood-parrot];\
      \ checker-c proposed [vieja-melanurus-blood-parrot, nandopsis-tetracanthus-blood-parrot, mayaheros-urophthalmus-blood-parrot,\
      \ amphilophus-citrinellus-blood-parrot, herichthys-carpintis-blood-parrot]; tiebreaker-1 proposed\
      \ [vieja-melanurus-blood-parrot, nandopsis-tetracanthus-blood-parrot, mayaheros-urophthalmus-blood-parrot,\
      \ amphilophus-citrinellus-blood-parrot, herichthys-carpintis-blood-parrot, amatitlania-nigrofasciata-blood-parrot];\
      \ tiebreaker-2 proposed [vieja-melanurus-blood-parrot, nandopsis-tetracanthus-blood-parrot, mayaheros-urophthalmus-blood-parrot,\
      \ amphilophus-citrinellus-blood-parrot, herichthys-carpintis-blood-parrot, amatitlania-nigrofasciata-blood-parrot,\
      \ flowerhorn-blood-parrot]."

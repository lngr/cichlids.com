  breeding:
    text: "Blood parrots can clean hard surfaces, deposit eggs and guard a site without producing fry.\
      \ Fisher and colleagues monitored eight same-line pairs that laid eggs without natural fertilization;\
      \ a single male also failed an in-vitro test. This supports frequent male infertility in that sample\
      \ rather than a claim that every traded male is sterile. Stripped female eggs produced viable offspring\
      \ with Midas, redhead and Mayan sperm. Other reports describe Cuban, Green Texas and convict crosses\
      \ with weaker pedigree evidence. These six pairwise crossing cautions are presumed because free\
      \ choice among conspecific and other partners was not established. Ordinary failed spawning and\
      \ female crossability can both be true."

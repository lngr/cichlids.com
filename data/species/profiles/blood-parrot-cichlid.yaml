  compatibility:
    text: "Suitable communities need robust, similarly sized fish with overlapping water conditions and\
      \ feeding access for the slower parrots. Firemouths are reported possibilities in larger furnished\
      \ aquaria; rainbowfish and silver dollars require their own groups and enough additional room, and\
      \ faster feeders must not monopolize food. Tiny fish remain at risk despite the small mouth and\
      \ the selected opportunistic predation level. Aggressive large Central American cichlids can overpower\
      \ a parrot. The line shares presumed crossing groups with Vieja melanurus, Amphilophus citrinellus,\
      \ Mayaheros urophthalmus, Nandopsis tetracanthus, Herichthys carpintis and Amatitlania nigrofasciata.\
      \ These cautions concern the domestic line itself, without assuming all its ancestral crossing groups\
      \ apply."

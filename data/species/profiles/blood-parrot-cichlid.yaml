  feedingSpeed:
    value: slow
    confidence: high
    rationale: All four profiles propose slow. Wiegert and Aquarium Co-Op independently explain poor food
      capture and competition with faster tankmates. Eager approach to a meal does not mean efficient
      capture; the normal-feeding claim for an uncertain Blue Tiger strain stays as dissenting evidence.
      Pellet size and softness need to suit the individual mouth.

    tolerance:
      value:
        min: 22
        max: 30
      confidence: low
      rationale: "Retain the qualified-majority 22 to 30 C tally decision with low confidence. Generator,\
        \ checker-a and both tiebreakers proposed 22 to 30 C, checker-b 22 to 28 C and checker-c 23 to\
        \ 30 C. Direct ordinary-line recommendations include Aquarium Co-Op and Maidenhead at 22 to 28\
        \ C, Fishkeeping.co.uk at 23 to 28 C and Gay at 24 to 28 C. Monks discourages prolonged keeping\
        \ above 30 C; the redhead parental care sheet reaches 30 C. Short hybrid trials near 27.5 or 28\
        \ C and a 28 to 30 C spawning recommendation do not establish multiyear endpoint health. The upper\
        \ extension retains the decided parent proxy, while routine care around 24 to 28 C has better\
        \ direct support."

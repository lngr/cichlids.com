  sizeAndGrowth:
    text: "Plan for ordinary adults around 20 cm, with the same working size for males and females because\
      \ reliable sex-specific maxima are missing. Some care sources report 25 cm, and a TFH author describes\
      \ unusually large older fish around 30 cm, so 20 cm is a typical estimate rather than an absolute\
      \ ceiling. Juveniles need adult space planned in advance. Good care can support a lifespan around\
      \ 10 to 15 years, although commercial morphology and individual health vary. The default social\
      \ unit here is three adults, for which the working minimum is 250 litres with a 120 by 45 cm footprint."
    sources:
    - kind: website

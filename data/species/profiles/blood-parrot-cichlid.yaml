partners:
  suitable:
  - species: Thorichthys meeki
    reason: Clarke recommends Thorichthys as possible companions; adult firemouths can be robust enough
      without the aggression of much larger Central American cichlids.
    condition: "A larger tank than the parrot-only minimum, separate shelters, similar adult sizes and\
      \ immediate separation if chasing persists."
  - species: Melanotaenia boesemani
    reason: A concrete rainbowfish option within the Aquariumz recommendation for rainbowfish; adults
      are comparatively deep-bodied and use open swimming space.
    condition: "A full rainbowfish group in a longer aquarium, overlapping water conditions and feeding\
      \ access for slower parrots; species-level suitability is inferred from the group recommendation."
  - species: Metynnis hypsauchen
    reason: A concrete silver-dollar option within the Aquariumz companion recommendation; adult body
      depth reduces swallowing risk.
    condition: "A substantially larger aquarium for a full silver-dollar group, plant-aware feeding and\
      \ monitoring that the parrots receive food; species-level suitability is inferred."
  unsuitable:
  - species: Paracheirodon innesi
    reason: Small individuals can be swallowed and even adult fish can be harassed; the exact prey-size
      threshold is unmeasured.
  - species: Amphilophus citrinellus
    reason: "A powerful territorial Midas can injure the mouth-impaired line, and the pair shares the\
      \ presumed amphilophus-citrinellus-blood-parrot crossing group supported by laboratory backcross\
      \ offspring."
  - species: Vieja melanurus
    reason: "The adult redhead is substantially larger and more forceful, and the pair shares the presumed\
      \ vieja-melanurus-blood-parrot crossing group."
  - species: Nandopsis tetracanthus
    reason: Strong territorial aggression and the presumed nandopsis-tetracanthus-blood-parrot crossing
      caution make this a poor choice.
  - species: Mayaheros urophthalmus
    reason: Territorial mismatch and laboratory evidence of crossability produce the presumed mayaheros-urophthalmus-blood-parrot
      caution.
  - species: Betta splendens
    reason: A slow delicate fish is vulnerable to harassment and fin damage; Aquarium Co-Op specifically
      rejects bettas as companions.
  - species: Herichthys carpintis
    reason: Its stronger territorial behavior and the presumed herichthys-carpintis-blood-parrot crossing
      caution make it an unsuitable default companion.
  - species: Amatitlania nigrofasciata
    reason: "Breeding territoriality can distress the slower line, and reported convict crosses support\
      \ a presumed amatitlania-nigrofasciata-blood-parrot caution."
profile:
  overview:
    text: "The blood parrot cichlid is a domestic ornamental line developed for the aquarium trade, commonly\
      \ associated with Taiwanese breeding. Its rounded body and restricted mouth distinguish it from\
      \ normally shaped Central American cichlids. The best-supported reported parents are Amphilophus\
      \ citrinellus and Vieja melanurus, a cross reproduced independently in a laboratory, although commercial\
      \ pedigrees remain uncertain. It has no formal species binomial. This profile covers the ordinary\
      \ blood-parrot line; trade names for additional crosses and larger derivatives do not guarantee\
      \ the same adult size or behavior. Color can be orange, red or yellow, with temporary dark markings\
      \ during development."
    sources:
    - kind: literature
      title: "Fisher, Miller, Delomas, Oldfield and Dabrowski (2025). Response to salinity challenge in\

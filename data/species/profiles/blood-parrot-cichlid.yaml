  breeding:
    value: open-substrate-spawner
    confidence: high
    rationale: "All four profiles propose open-substrate-spawner. Fisher observed cleaning and egg laying\
      \ in eight same-line pairs without natural fertilization, and independent aquarium accounts describe\
      \ exposed rock or bottom surfaces. Cave egg placement reported by LiveAquaria is retained as evidence\
      \ of flexible substrate location rather than obligatory cave spawning. Female fertility is experimentally\
      \ demonstrated; a single tested male failing fertilization cannot prove universal male sterility."

  problems:
    text: "Watch every fish for effective swallowing, comfortable breathing, stable balance and access\
      \ to refuge. Mouth, body and gill-cover abnormalities vary, so severe impairment should not be assumed\
      \ normal care. Poor water, excess food and persistent bullying can compound difficulties. Temporary\
      \ dark markings are not a disease diagnosis by themselves. Investigate deteriorating appetite, breathing,\
      \ balance or fins with qualified help, and quarantine new arrivals. Avoid artificially dyed, tattooed\
      \ or surgically tail-altered specimens. Reports of losses after a rapid pH collapse support stable\
      \ maintained chemistry, without providing numerical lethal limits or a reason to chase the adopted\
      \ range endpoints."
    sources:
    - kind: website
      title: "Aquarium Co-Op: Care Guide for Blood Parrot Cichlids, the hybrid with a tiny mouth"
      url: "https://www.aquariumcoop.com/blogs/aquarium/blood-parrot-cichlid"

  temperatureC:
    value:
      min: 24
      max: 30
    confidence: low
    rationale: "The qualified majority selects 24 to 30 C as an inherited freshwater habitat proxy for\
      \ the reported Midas and redhead parents. Swain measured 24 to 28 C across surface and bottom samples\
      \ in Lake Nicaragua; Perez reports Peten Itza profiles reaching 30 C. Checker-b proposed 25 to 28\
      \ C and checker-c 26 to 30 C, while generator, checker-a and both tiebreakers proposed 24 to 30\
      \ C. FishBase gives the wider Midas envelope of 23 to 33 C, and the Usumacinta study reports 23\
      \ to 33.9 C; these broader source ranges remain evidence rather than defining a native blood-parrot\
      \ range. The domestic line has no native water measurements, and parental geography and commercial\
      \ pedigrees are incomplete."
    sources:
    - kind: literature
      title: "Swain (1966). Bottom sediments of Lake Nicaragua and Lake Managua, western Nicaragua"

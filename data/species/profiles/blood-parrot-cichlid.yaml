  ghDgh:
    value:
      min: 3
      max: 16
    confidence: low
    rationale: "The tally retains the median 3 to 16 dGH with low confidence because the proposals do\
      \ not obtain a qualified majority. This is a parental freshwater proxy, not a measured blood-parrot\
      \ requirement. Swain gives Nicaragua surface Ca 14.7 and Mg 5.4 mg/L, approximately 3.3 dGH using\
      \ Ca/7.14 + Mg/4.34; the FAO analysis independently gives about 3.47 dGH. Perez gives Peten Itza\
      \ surface Ca 2.9 and Mg 1.5 meq/L, about 12.32 dGH. Its separate whole-profile ion extrema yield\
      \ the wider bounding envelope 12.32 to 17.92 dGH, without demonstrating simultaneous maxima in shallow\
      \ fish habitat; FishBase gives the wider redhead summary 9 to 20 dH, and Hillesheim gives an approximately\
      \ 14 dGH mean. All remain evidence. The adopted upper 16 is the median of proposed maxima, not a\
      \ newly measured threshold; rounding the median lower endpoint produces 3. Conductivity, salinity\
      \ and alkalinity are not used as GH. Proposals: generator proposed 3 to 18; checker-a proposed 9\
      \ to 20; checker-b proposed 3.3 to 14; checker-c proposed 3.5 to 13; tiebreaker-1 proposed 3.3 to\
      \ 13; tiebreaker-2 proposed 3.4 to 18."
    sources:
    - kind: literature
      title: "Swain (1966). Bottom sediments of Lake Nicaragua and Lake Managua, western Nicaragua"

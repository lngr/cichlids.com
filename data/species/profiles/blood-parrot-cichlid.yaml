  khDkh:
    value:
      min: 3
      max: 6
    confidence: low
    rationale: "Retain the qualified-majority tally value 3 to 6 dKH, with low confidence and no natural-water\
      \ verification object. These are rounded parental alkalinity equivalents. Swain reports Lake Nicaragua\
      \ 60 to 65 mg/L as CaCO3, about 3.36 to 3.64 dKH; FAO gives about 3.78 dKH there. Perez reports\
      \ Peten Itza bicarbonate 1.9 to 2.2 meq/L, about 5.32 to 6.16 dKH. The decided rounded 3 to 6 interval\
      \ is narrower than the unrounded upper source value 6.16, which remains in evidence. Generator proposed\
      \ 3 to 7, checker-a 5 to 15, checker-b 3.4 to 9.1, checker-c 3.8 to 6.2, tiebreaker-1 3.4 to 6.2\
      \ and tiebreaker-2 3.5 to 6.2. The inferred 5 to 15 range and Hillesheim bicarbonate equivalent\
      \ 9.1 are retained as counterclaims, not silently converted to GH. FAO Managua alkalinity near 24.4\
      \ dKH is excluded as atypical parental chemistry. There is no native blood-parrot KH range."

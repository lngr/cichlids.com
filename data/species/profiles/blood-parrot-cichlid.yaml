    tolerance:
      value:
        min: 6.5
        max: 8.9
      confidence: low
      rationale: "Retain the conservative tally tolerance 6.5 to 8.9 with low confidence. Intersecting\
        \ all proposed tolerances gives 6.5 to 8.0, then the tally widens the upper endpoint to contain\
        \ the decided parental range reaching 8.9. This containment extension has no demonstrated multiyear\
        \ blood-parrot health evidence at pH 8.9. Aquarium Co-Op, Expoaqua and LiveAquaria support 6.5\
        \ to 8.0; Gay and Monks recommend 7 to 8. Maidenhead gives the broader lower allowance 6.0 to\
        \ 8.0, while Aqua-Fish gives 6.4 to 7.0 and Fishkeeping.co.uk 6.5 to 7.5. These differing source\
        \ ranges and the older 6 to 8 community guide remain evidence. Archive reports of losses after\
        \ a rapid pH fall support stability without defining a lethal threshold. Prefer the directly supported\
        \ near-neutral to mildly alkaline care band rather than targeting the inherited upper edge. Proposals:\
        \ generator proposed 6.5 to 8.9; checker-a proposed 6.5 to 8; checker-b proposed 6.5 to 8.9; checker-c\
        \ proposed 6.4 to 8.5; tiebreaker-1 proposed 6 to 8.9; tiebreaker-2 proposed 6.5 to 8.9."

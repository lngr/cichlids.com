    tolerance:
      value:
        min: 3
        max: 20
      confidence: low
      rationale: "Retain the conservative tally tolerance 3 to 20 dGH with low confidence. The intersection\
        \ of all proposals is 6 to 20 dGH, widened downward to contain the decided natural proxy beginning\
        \ at 3 dGH. That lower endpoint is parental inference, not a controlled chronic hybrid threshold.\
        \ Monks recommends 10 to 20 dGH and Fishkeeping.co.uk 8 to 15; Aqua-Fish gives 3 to 16 and several\
        \ domestic sheets give 6 to 18. Wider published claims remain evidence: Aquario gives 2 to 25\
        \ dGH, Maidenhead permits hardness up to 25 without a minimum, and the Midas parental guide gives\
        \ 5 to 25. Fishkeeping World instead recommends 3.3 to 6.6. These recommendations differ substantially\
        \ and do not measure lifetime physiological limits. Proposals: generator proposed 2 to 25; checker-a\
        \ proposed 6 to 20; checker-b proposed 3 to 20; checker-c proposed 3 to 20; tiebreaker-1 proposed\
        \ 3 to 25; tiebreaker-2 proposed 3 to 20."

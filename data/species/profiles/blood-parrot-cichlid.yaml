  note: "This domestic ornamental line has no formally valid species binomial or zoological author. Hybrid\
    \ is a required catalog placeholder, not a biological genus; Amphilophus x Vieja describes reported\
    \ ancestry rather than a taxonomic genus. The Catalog of Fishes recognizes Amphilophus citrinellus\
    \ and Vieja melanurus, including Cichlasoma synspilum as a redhead synonym. Fisher and colleagues\
    \ independently produced a redhead female x Midas male cross, supporting these reported parents without\
    \ verifying every commercial pedigree. Older severum and red-devil hypotheses remain cited but are\
    \ not asserted as established additional parents. The legacy label is retained in legacyNames and\
    \ is not a zoological synonym. The lowercase trade name matches the curated hybrid-group member."

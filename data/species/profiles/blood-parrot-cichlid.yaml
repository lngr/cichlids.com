        \ to 5. The wider LiveAquaria range of 9 to 20 is explicitly labelled dKH and stays as KH evidence;\
        \ it is not relabelled as GH. Monks recommends at least 5 dKH without an upper limit. Other sheets\
        \ give 2 to 8, 4 to 10 or, for an uncertain related line, 0 to 12. The adopted band contains the\
        \ rounded parental range and represents a practical buffering estimate, without multiyear endpoint\
        \ tests. Archive pH-crash accounts are qualitative stability evidence only."

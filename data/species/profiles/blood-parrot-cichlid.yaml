variants:
- name: Orange and red blood parrot
  kind: color-morph
  note: Standard ordinary line; adults are commonly orange to red. Red intensity can depend on diet and
    age.
- name: Yellow blood parrot
  kind: color-morph
  note: Yellow selection reported in the trade; color alone does not identify the pedigree.
- name: Red and white blood parrot
  kind: color-morph
  note: "Trade selection described by Aquarium Co-Op. Further-crossed platinum, polar blue, kirin and\
    \ King Kong lines are not assumed equivalent; artificial dyes and tattoos are not color morphs."

  problems:
    text: "Small companions can disappear even when the predator accepts prepared food. Inadequate space also concentrates\
      \ breeding pressure on females and prevents other fish avoiding the male's defended site. Misidentification\
      \ can lead to unsuitable stocking assumptions. Natural lake chemistry and broader aquarium tolerances describe\
      \ different things: the broad GH limit is a low-confidence voting median, and numeric KH limits come from\
      \ general Malawi practice rather than a species trial. Watch condition, access to cover and water quality\
      \ together."

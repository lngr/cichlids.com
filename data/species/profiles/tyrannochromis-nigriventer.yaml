  breeding:
    text: The female incubates the brood in her mouth. A reproductive male commonly excavates a broad depression
      in sand beside a boulder and guards the area; field accounts describe pits around one metre across. Females
      can continue guarding and retrieving young after release. This prolonged care does not demonstrate that the
      male shares oral incubation. Small breeding aggregations in the lake do not justify keeping several males
      in the minimum aquarium.

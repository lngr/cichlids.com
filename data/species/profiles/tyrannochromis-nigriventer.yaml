  husbandry:
    text: "For one male and at least two females, provide at least 1000 L and 250 cm of tank length. The proposed\
      \ 75 cm front-to-back dimension is a practical layout estimate. Arrange stable rocks so that females can move\
      \ out of view without losing access to open swimming space. Preserve sand for excavation and avoid narrow\
      \ dead ends. Use filtration and oxygenation appropriate to large predatory fish, and monitor waste accumulation\
      \ after feeding. Additional adult companions require more space."

  sizeAndGrowth:
    text: Plan around approximately 30 cm for an adult male and 20 cm for a female. Those sex-specific figures agree
      with field accounts and the larger aquarium size estimates. The 17 cm standard-length maximum in FishBase
      measures a different length convention and does not establish a typical aquarium ceiling for either sex. Species-specific
      growth rates are insufficiently documented to promise a fixed age at adult size. The lifespan estimate of
      8 to 10 years is uncertain.

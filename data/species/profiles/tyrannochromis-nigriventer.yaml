  compatibility:
    text: "Large, robust Malawi cichlids are possible companions when their individual size and the available space\
      \ are adequate. Breeding-territory chasing remains a concern even when a fish is too large to swallow. Juveniles\
      \ and small adults face a separate predation risk, and shared lake origin does not remove that danger. The\
      \ reviewed sources establish no named hybrid group for this species; the empty group list should not be read\
      \ as proof that crossing cannot occur."

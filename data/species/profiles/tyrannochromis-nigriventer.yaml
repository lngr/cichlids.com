    rationale: "The tally decides 3 to 28 dGH by median, with low confidence and three agreeing votes out of six.\
      \ Generator proposes 3 to 15, checker-a 3 to 25, checker-b 3 to 30, checker-c 3 to 10, and both tiebreaker-1\
      \ and tiebreaker-2 3 to 30. All lower bounds are 3; the middle upper bounds are 25 and 30, whose mean 27.5\
      \ rounds to 28. No four-vote qualified majority exists. The selected range contains natural lake hardness\
      \ and is narrower than the 5 to 30 dH stated by FishBase and the three 3 to 30 proposals. Seriously Fish gives\
      \ 10 to 25 for the relative, Fishipedia 8 to 15, Malawi-Guru general guidance 4 to 15, and OATA Malawi guidance\
      \ 12 to 18. These recommendations and database metadata are not long-term limit trials, and 28 is a voting-derived\
      \ endpoint rather than a measured biological threshold. Atlas hardness conversions retained in evidence lack\
      \ explicit numeric support in its readable snapshot. The 3 to 10 hardness interval attributed to the Maleri\
      \ Island page is likewise absent from its readable text and does not add numeric support."

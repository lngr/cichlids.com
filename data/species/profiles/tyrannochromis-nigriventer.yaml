  aggressionHeterospecific:
    value: 2
    confidence: low
    rationale: "Generator, checker-b and checker-c propose 3, while checker-a proposes 2. Their level-3 rationales\
      \ rely mainly on prey capture, which the separate predation feature already represents. Malawi-Guru describes\
      \ an assertive but calm hunter with robust large companions, and Malawi.si reports territorial defense chiefly\
      \ while breeding. These species-specific accounts support provisional level 2 for breeding-territory chasing;\
      \ they do not establish attacks on suitably sized fish beyond that territory. Fishipedia's draft warns of\
      \ severe territorial fights, and all level-3 interpretations remain in evidence. Confidence is low because\
      \ direct aquarium observations of aggression toward non-prey fish are sparse."

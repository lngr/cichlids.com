partners:
  suitable:
  - species: Champsochromis caeruleus
    reason: A large Malawi predator is a possible candidate when each individual is too large to swallow and can
      avoid a breeding territory.
    condition: Use a substantially larger aquarium than the minimum for the nigriventer social unit; pairing is
      not a guaranteed safe combination.
  - species: Nimbochromis livingstonii
    reason: A robust large Malawi hap is a conditional candidate under the same size and territory constraints.
    condition: Confirm individual size and provide visual breaks and additional space.
  - species: Aristochromis christyi
    reason: Comparable adult scale and Malawi husbandry needs make it a possible large-predator companion.
    condition: Use a much larger aquarium and observe breeding interactions; genus-level guidance does not prove
      this particular pairing.
  unsuitable:
  - species: Labidochromis caeruleus
    reason: Small individuals and juveniles are potential prey; feeding the predator does not remove the risk.
  - species: Aulonocara stuartgranti
    reason: Small individuals can be swallowed and less robust fish may be displaced near a defended spawning area.
  - species: Neolamprologus brichardi
    reason: Its small adult size creates a substantial prey risk in this large predator's aquarium.
profile:
  overview:
    text: "Tyrannochromis nigriventer is a Lake Malawi predator for aquarists able to house a large adult social\
      \ unit. Its natural food is fish, including smaller cichlids around rocky shores. A blue breeding male can\
      \ reach about 30 cm, while females are around 20 cm. Identification deserves care because aquarium labels\
      \ can confuse it with T. macrostoma. A body-size check alone cannot make an unsuitable companion safe."

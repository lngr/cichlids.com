  temperatureC:
    value:
      min: 21
      max: 29
    confidence: high
    rationale: "The decided natural range is 21 to 29 C, with high confidence and waterbody verification for lake-malawi.\
      \ Lake studies cover regional and seasonal variation rather than a single aquarium target. The FAO Malawi\
      \ entry itself reports 23 to 25 C; Branchu gives a northern epilimnetic comparison near 24.5 to 24.9 C, while\
      \ Vollmer documents seasonal and depth variation. Earlier evidence entries attributing the full 21 to 29 C\
      \ synthesis to each individual paper are retained as compilation-level attributions, not direct measurements\
      \ from every source. The natural range is the mandated lake envelope."

    tolerance:
      value:
        min: 21
        max: 30
      confidence: low
      rationale: "The tally decides 21 to 30 C by unanimous agreement under the one-degree comparison rule, with\
        \ low confidence. Generator and checker-c propose 21 to 30, checker-a 21 to 29, and checker-b 20 to 30.\
        \ The selected envelope contains the natural 21 to 29 range and is narrower at the lower end than checker-b's\
        \ 20 to 30 proposal. Read species care ranges include 23 to 28 at Fishipedia, 23 to 27 at Zoopet and 24\
        \ to 26 at the retailer; Seriously Fish gives 24 to 28 for T. macrostoma. Thirty degrees is an inferred\
        \ margin rather than a measured multiyear endpoint. None of these target ranges demonstrates harm just outside\
        \ it."
      sources:
      - kind: website

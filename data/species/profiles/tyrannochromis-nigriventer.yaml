  khDkh:
    value:
      min: 5
      max: 8
    confidence: high
    rationale: "The decided natural range is 5 to 8 dKH with high confidence. Branchu measures alkalinity around\
      \ 2.33 to 2.46 meq/L, equivalent to about 6.5 to 6.9 dKH. Jackson et al. measurements compiled by FAO span\
      \ about 2.00 to 2.59 meq/L, equivalent to 5.6 to 7.3 dKH. The rounded lake envelope is therefore 5 to 8. Bicarbonate\
      \ buffering and calcium-magnesium hardness measure different properties; sodium permits KH to exceed GH. The\
      \ natural KH fact intentionally has no verification object."

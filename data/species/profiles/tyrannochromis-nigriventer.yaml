  diet:
    text: "Offer suitable prepared carnivore food alongside aquatic animal foods such as shrimp, mussel and small\
      \ whole frozen fish. Husbandry accounts describe acceptance of these foods, so natural piscivory does not\
      \ require a supply of live feeders. Adjust portions to condition and remove uneaten material. The profile\
      \ does not identify special sensitivity to a protein-rich diet, but that flag does not protect against poor\
      \ food quality or overfeeding."

  habitat:
    text: "Across Lake Malawi, this species uses rocky shores with little deposited sediment. Adults are often reported\
      \ below 10 m, and specialist accounts place many observations at 15 to 30 m. Reproduction also uses sandy\
      \ spaces next to rocks. These needs translate into rock cover, open sand and unobstructed swimming room. The\
      \ lake has low calcium-magnesium hardness despite alkaline pH and substantial bicarbonate buffering."

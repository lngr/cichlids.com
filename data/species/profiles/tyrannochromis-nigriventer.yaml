  socialBehavior:
    text: "One male with two to three females is the supported aquarium arrangement. The adults do not form a permanent\
      \ pair, and the lake mating system permits multiple partners. Male breeding sites can occupy substantial areas,\
      \ so rivalry and sustained courtship can become serious where escape routes fail. Expect strong seasonal defense\
      \ and watch female condition as well as male disputes. The behavioral ratings are less certain than the evidence\
      \ for piscivory."

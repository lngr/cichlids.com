  sexing:
    text: "Adult males are larger and develop a strong blue coloration, often with orange pigment on the anal fin.\
      \ Females tend toward muted brown, beige or silver with dark markings. Locality and breeding state affect\
      \ the pattern. For identification against T. macrostoma, specialist accounts use the position of the bony\
      \ swelling between the eye and the snout: in nigriventer it lies nearer the middle of that interval. Color\
      \ alone is insufficient for identifying juveniles."

  ghDgh:
    value:
      min: 0
      max: 5
    confidence: low
    rationale: "The tally qualified majority selects 0 to 5 dGH with four of six agreeing votes and low confidence.\
      \ Proposals are generator 0 to 6; checker-a 0.5 to 4; checker-b 0 to 1; checker-c 0 to 2; tiebreaker-1 0 to\
      \ 1; tiebreaker-2 0 to 6. Agreement uses the rubric two-degree threshold, so four agreeing proposals need\
      \ not have identical endpoints. Very soft Guapore field water below 1 dGH is directly relevant; zero represents\
      \ a rounded reporting bound, not proven absence of calcium and magnesium. The selected envelope is narrower\
      \ than Oliveira regional paired-ion means converted to 0.18 to 5.84 dGH and FishBase 4 to 6 dH; it is not\
      \ the full mineralization range of every Paraguay tributary. The ionic conversion uses Ca/7.14 plus Mg/4.34\
      \ with concentrations in mg/L. Central Amazon Ca and Mg measurements generally yield about 0.02 to 0.98 dGH,\
      \ but uncertain fish identity and reused data limit their independent support. Checker-a inferred 2 to 4 dGH\
      \ from Mamiraua inorganic carbon and assigned 0.5 to 4 from a qualitative water-typology account; those retained\
      \ evidence entries are estimates rather than measured GH. Inorganic carbon, alkalinity and conductivity cannot\
      \ substitute for measured calcium and magnesium."
    sources:

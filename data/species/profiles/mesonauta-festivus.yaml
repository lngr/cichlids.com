      confidence: low
      rationale: "The tally uses the median maintenance range 24 to 31 C with low confidence. All proposals are\
        \ generator 23 to 29; checker-a 24 to 32; checker-b 20 to 30; checker-c 24 to 32; tiebreaker-1 20 to 32;\
        \ tiebreaker-2 24 to 30. The lower median is 24 and the upper median is 31, and the result contains the\
        \ natural 25 to 30 C range. Seriously Fish recommends 24 to 28 C, the Nordic association 24 to 29 C, Maidenhead\
        \ 24 to 30 C and TFH 25 to 32 C. The decision retains a narrower upper limit than TFH 32 C and the natural\
        \ FishBase envelope of 25 to 34 C. The older guide allows 20 to 28 C; seasonal occurrence at 20 C and brief\
        \ field readings up to 36.2 C are retained but do not demonstrate healthy multi-year captive maintenance.\
        \ Routine care around 25 to 28 C is more securely supported than either tolerance endpoint."

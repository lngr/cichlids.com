  breeding:
    text: "Both partners prepare an exposed leaf, stone or piece of wood and tend the eggs and subsequent young.\
      \ Published hobby estimates differ substantially in brood size and development time, so an exact egg count\
      \ is not a reliable expectation. Eggs commonly hatch after roughly two to three days, depending on temperature,\
      \ and the adults may move newly hatched young before free swimming. A quiet setting reduces disruption of\
      \ parental care. Free-swimming fry need food small enough to take, such as newly hatched Artemia. Increased\
      \ territorial pressure should be expected around the brood."
    sources:

      \ gives 12 to 15 cm with smaller females, Maidenhead 15 cm unsexed and the older guide 15 cm in aquaria. TFH\
      \ gives the wider 15 to 20 cm TL and the Nordic association 20 cm without comparable sex-specific measurements.\
      \ Seriously Fish 10 cm SL and FishBase 12.1 cm SL exclude the tail and are not directly comparable. The female\
      \ split remains estimated; no universal SL-to-TL conversion is assumed."

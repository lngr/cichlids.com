  sizeAndGrowth:
    text: "Allow for an aquarium male around 15 cm total length and a somewhat smaller female, estimated at 12 cm.\
      \ The female figure is not a measured sex-specific limit. Published standard lengths exclude the tail, and\
      \ the wider 15 to 20 cm total-length reports do not define the typical aquarium maximum for each sex. Young\
      \ fish still require room for their adult size. The lifespan interval of 5.5 to 9 years is a low-confidence\
      \ synthesis of disparate claims, not a precise prediction for an individual fish."

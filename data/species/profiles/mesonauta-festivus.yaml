  diet:
    text: "Use a balanced omnivore staple and vary it with plant-based food and small aquatic invertebrates. Vegetable\
      \ matter is a regular dietary component, supported by several independent husbandry accounts. Worms and small\
      \ crustaceans complement rather than replace that component. A commercial carnivore label conflicts with the\
      \ stronger mixed-diet evidence. Observe whether shy fish obtain their share and adjust portions to avoid accumulated\
      \ waste. No special protein-related bloat predisposition is established, which does not remove ordinary risks\
      \ from poor food quality or overfeeding."
    sources:

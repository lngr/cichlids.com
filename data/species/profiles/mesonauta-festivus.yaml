    - *id029
  compatibility:
    text: "Adult angelfish are supported companions in a sufficiently large quiet aquarium. Deep-bodied adult tetras\
      \ and peaceful bottom fish can also fit the general recommendations when too large to swallow and able to\
      \ retreat from a brood. The level-1 predation decision does not guarantee safety for every fish over 2 cm:\
      \ retail and hobby sources explicitly warn about neon tetras. Avoid overpowering cichlids and boisterous feeders.\
      \ Named partner examples besides angelfish are inferred applications of those requirements. No hybrid group\
      \ is assigned after the tally, although general congener crossing warnings remain in the evidence; an empty\
      \ group list does not prove reproductive isolation."
    sources:
    - *id004

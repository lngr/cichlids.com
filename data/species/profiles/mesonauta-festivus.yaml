partners:
  suitable:
  - species: Pterophyllum scalare
    reason: Calm adult angelfish are recommended by the association and the archive.
    condition: Adult fish in a larger planted community tank with room to withdraw from breeding territories.
  - species: Moenkhausia pittieri
    reason: A robust adult tetra school is a plausible application of the peaceful tetra recommendation.
    condition: Adults well above 2 cm; pairing is inferred rather than documented in the read sources.
  - species: Megalechis thoracata
    reason: A robust peaceful bottom catfish can use the lower level of the tank.
    condition: Larger community tank with separate cover; named pairing is inferred from the catfish recommendation.
  unsuitable:
  - species: Paracheirodon innesi
    reason: "Species-specific hobby and retailer accounts explicitly warn that neon tetras can be swallowed, despite\
      \ the approximate 2 cm rubric threshold."
  - species: Amphilophus labiatus
    reason: A much stronger territorial cichlid can overwhelm a shy flag cichlid; mismatch inferred from temperament
      requirements.
  - species: Melanochromis auratus
    reason: "Its aggression and usual harder, alkaline maintenance requirements make it a poor fit for this quiet\
      \ soft-water community; isolated archive combinations do not establish suitability."
profile:
  overview:
    text: "A flag cichlid brings measured midwater movement and a conspicuous diagonal dark marking to a quiet planted\
      \ aquarium. This profile concerns Mesonauta festivus, with festivum retained as the legacy spelling. Other\
      \ Mesonauta, particularly insignis, often share the trade name, so origin and identification matter more than\
      \ a shop label. A compatible adult pair is the minimum social unit used here; larger groups are possible when\
      \ the aquarium can accommodate their breeding territories."
    sources:
    - *id001
    - *id004
    - *id006
    - *id073
    - *id002
    - *id003
    - *id059
    - *id007
    - *id035
    - *id036
    - *id074
    - *id075
    - *id076
    - *id077
    - *id005
    - *id078
    - *id079
    - *id022
    - *id023
    - *id025
    - *id027
    - *id026
    - *id028
    - *id029
    - *id060
  habitat:
    text: "The catalog concept includes southwestern Amazon tributaries, Jamari and lower Tapajos, plus the Paraguay\
      \ drainage. Slow margins and sheltered shallow water commonly contain plants and a muddy or sandy bottom,\
      \ although some collections came from pools without vegetation. Guapore specimens and a genetically distinct\
      \ Pantanal lineage are close relatives whose formal boundary remains unresolved. Central Amazon lake studies\
      \ using the festivus name are retained as context rather than secure locality extensions. The selected natural\
      \ ranges describe typical conditions, not every seasonal extreme: Guapore associated fauna sites were recorded\
      \ at 20 to 24 C in August, while regional river accounts describe winter cooling to 15 to 20 C. Mamiraua readings\
      \ reached 34.7 C and northern Pantanal shallow plots 36.2 C, without establishing healthy sustained aquarium\
      \ conditions. Regional saline lakes approaching pH 10 and river alkalinity as high as 19.3 dKH are not demonstrated\
      \ typical habitats of this species."
    sources:
    - *id001
    - *id006
    - *id039
    - *id008
    - *id040
    - kind: literature
      title: Rezende Filho et al. (2012). Publisher landing page and abstract
      url: "https://hess.copernicus.org/articles/16/2723/2012/"
      archived: hess.copernicus.org/articles/16/2723/2012/2026-10-14T193622Z
      accessed: '2026-10-13'

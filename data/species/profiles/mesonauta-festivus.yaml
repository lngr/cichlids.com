  ph:
    value:
      min: 5.5
      max: 7.5
    confidence: low
    rationale: "The tally median is pH 5.5 to 7.5 with low confidence because no qualified majority resolves the\
      \ proposals: generator 5.4 to 7.8; checker-a 5.8 to 7.5; checker-b 6 to 7.1; checker-c 4 to 7.5; tiebreaker-1\
      \ 5.5 to 7; tiebreaker-2 5.4 to 7.8. The median minimum is 5.45 rounded to 5.5; the median maximum is 7.5.\
      \ This slightly acidic to near-neutral range is plausible for ordinary river margins. It is narrower than\
      \ Oliveira tributary means of 5.4 to 7.8, FishBase 6 to 8, the broader Paraguay river survey of 5.23 to 8.54\
      \ and Mamiraua lake readings of 6.2 to 8.8. Guapore associated-fauna sites give 6 to 7.1, Paraguá regional\
      \ measurements 5.5 to 6.5, and Catalao lake monitoring 5.86 to 7.47. Central Amazon collection measurements\
      \ of 3.71 to 7.15 remain in evidence, but the taxonomic applicability of those fish is unresolved and two\
      \ publications reuse the same chemistry. The selected range is a typical synthesis, not a claim that every\
      \ recorded locality falls within it; saline regional lakes are not established habitats of this species."

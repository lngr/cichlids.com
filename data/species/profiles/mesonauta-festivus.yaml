  note: "The accepted name is Mesonauta festivus (Heckel, 1840), originally described from the Rio Guapore. Mesonauta\
    \ takes the masculine species ending; Mesonauta festivum is the retained legacy spelling. Mesonauta insignis\
    \ is a separate valid species, despite dealer synonym lists that combine it with festivus. Oliveira and colleagues\
    \ distinguish a Pantanal genetic lineage but leave its species status unresolved. Central Amazon ecology and\
    \ trade-labelled husbandry accounts need this identification qualification. Taxonomic supporting sources are\
    \ retained with origin."

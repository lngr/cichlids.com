    rationale: "The tally uses a median decision of 25 to 30 C because no four-vote qualified majority resolves\
      \ the six proposals: generator 26 to 29; checker-a 26 to 32; checker-b 20 to 30; checker-c 24 to 32; tiebreaker-1\
      \ 20 to 30; tiebreaker-2 25 to 30. The lower median is 24.5 rounded to 25 C and the upper median is 30 C.\
      \ This is a plausible typical warm-water envelope, with low confidence rather than a complete seasonal distribution.\
      \ Coqueiro Lake seasonal means of 26.4 to 28.5 C and the Guapore reserve mean of 25.7 C support its centre.\
      \ The retained Guapore field account includes 20 to 24 C in August, showing cooler seasonal conditions outside\
      \ the selected typical range. Wider evidence includes FishBase 25 to 34 C, Solimoes macrophyte-bank readings\
      \ 28.2 to 32.9 C, Mamiraua lake extremes 26.5 to 34.7 C and northern Pantanal shallow-plot readings 26.8 to\
      \ 36.2 C. The central Amazon fish identities and fish occupancy of regional chemistry stations are uncertain;\
      \ brief heating or winter cooling does not establish a routine aquarium target. The Pires abstract and the\
      \ Crenicara abstract alone contain no numerical temperature series; the latter full-PDF archive additionally\
      \ contains an earlier reviewer transcription of the field measurements."

  socialBehavior:
    text: "Loose groups outside reproduction can coexist peacefully, but breeding pairs defend a local nursery and\
      \ exclude other adults. A proven compatible pair is therefore a useful minimum unit; two arbitrarily selected\
      \ fish may not settle together. Larger groups need more space and several sheltered areas rather than a numerical\
      \ group size alone. Watch for repeated chasing, hiding, missed meals and fin damage. Brood defence can also\
      \ displace other species even when the pair was previously calm."
    sources:

    confidence: high
    rationale: "The Catalog of Fishes and the museum-based 1991 revision support the southwestern Amazon drainages,\
      \ Jamari, lower Tapajos and Paraguay drainage in Bolivia, Brazil, Paraguay and Peru. Parana in FishBase denotes\
      \ the larger system containing the Paraguay drainage. Checker-a also proposed Solimoes floodplain lakes, but\
      \ the newer mitochondrial phylogeny separates the Guapore lineage from central Amazon forms. Those lake studies\
      \ are retained as contextual evidence without expanding the confirmed locality list. The genetically distinct\
      \ Pantanal lineage remains unresolved at species level and is retained within the catalog concept. The public\
      \ CRC entry confirms a Guapore specimen; its subscriber husbandry material was not read."

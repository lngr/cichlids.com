  problems:
    text: "Persistent hiding or poor condition can indicate social pressure as well as water problems. Check access\
      \ to food, escape routes, oxygenation and waste accumulation before treating a behavior change as a specific\
      \ disease. Inspect a spawning pair for a partner that cannot withdraw, and watch bottom fish being driven\
      \ from the brood area. Stable maintenance matters especially where KH is very low. Quarantine additions and\
      \ investigate unusual breathing, rubbing or fin damage. Historical forum illness reports provide context but\
      \ their treatment claims are not instructions; no routine salt requirement is demonstrated."

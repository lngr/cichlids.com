  husbandry:
    text: "For a compatible pair, provide at least 225 litres with a base around 120 by 40 cm. This minimum does\
      \ not cover a larger group or substantial community stock. Combine plant cover and branching wood with unobstructed\
      \ swimming room and genuine retreat routes. Sand suits the documented soft bottom habitats. Keep circulation\
      \ gentle enough for sheltered swimming while maintaining effective filtration and oxygenation. A stable 25\
      \ to 28 C setting is better supported for routine care than either end of the 24 to 31 C tolerance. Favor\
      \ soft, mildly acidic water and regular water changes. Very low KH requires consistent monitoring because\
      \ buffering can be exhausted; pH and GH must be checked separately."

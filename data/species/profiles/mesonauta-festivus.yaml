    - *id029
  sexing:
    text: "Adult males tend to grow larger and may develop longer dorsal and anal fin extensions. A dealer also\
      \ describes a more pronounced male snout, but that is a supporting clue rather than a reliable single test.\
      \ Similar-aged adults offer a better comparison than unequally grown juveniles. Breeding observations can\
      \ clarify sex and compatibility; intense color or one pointed fin cannot establish either on its own."
    sources:

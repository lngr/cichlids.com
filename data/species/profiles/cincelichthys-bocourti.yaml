    - *id048
  husbandry:
    text: "For one compatible adult pair, allow approximately 650 litres gross volume and a floor at least\
      \ 180 by 60 cm, with sufficient height for these deep-bodied fish. Larger breeder recommendations reach\
      \ 200 by 60 by 60 cm, and a mixed community needs substantially more than the pair minimum. Use sand,\
      \ stable large stones and wood to divide sight lines while leaving turning room and open floor. Vegetation\
      \ is part of the feeding environment and may be consumed rather than remain decorative. Maintain effective\
      \ filtration, regular water renewal and good gas exchange. Around 26 to 29 C and stable near-neutral\
      \ to mildly alkaline water have stronger direct aquarium support than the extremes of the provisional\
      \ tolerances. Those planning tolerances are 23 to 32 C, pH 6.4 to 8.5, 4 to 15 dGH and 2 to 12 dKH; their\
      \ endpoints are not measured failure thresholds or equally suitable constant targets. KH is buffering\
      \ alkalinity, not a conversion of GH."
    sources:
    - *id023
    - *id005
    - *id028
    - *id009
    - *id010
    - *id031
    - *id004
    - *id024
    - *id025
    - *id007
    - *id032
    - *id026
    - *id033
  socialBehavior:
    text: "Use an established compatible pair as the adult social unit. Raising juveniles together can permit\
      \ partner selection, after which excluded fish need another home. Adult territoriality continues outside\
      \ breeding, and spawning intensifies defence. Persistent pursuit, food exclusion or a fish confined to\
      \ one corner requires intervention. Published accounts range from relatively calm keeping to dangerous\
      \ courtship and partner attacks. A divider or separate aquarium should be available even for a previously\
      \ stable pair. Permanent adult groups require much larger housing than the pair specification."
    sources:
    - *id005
    - *id023
    - *id028
  diet:
    text: "Provide a varied plant-heavy diet, using appropriate vegetable-rich pellets, spirulina foods and\
      \ suitable leafy vegetables, with small supplementary portions of aquatic invertebrates. Plants, algae,\
      \ fruit and invertebrates recur in feeding accounts; occasional very small fish are also reported. Omnivore\
      \ is the closest available rubric class, although this species has a strong plant-feeding specialization.\
      \ It is not established as an obligate biofilm scraper. Experimental attached-food biting supports plant\
      \ specialization, while the dietary estimate in that study partly relies on its relative C. pearsei.\
      \ No specific protein-triggered bloat syndrome is established, but energy-rich community diets can still\
      \ cause obesity. Keep portions modest and remove uneaten food."
    sources:
    - *id028
    - *id023
    - *id005
    - *id051
    - *id031
    - *id030
    - *id052
    - *id004
    - *id025
    - *id024
    - *id032
    - *id007
    - *id026
    - *id033
  breeding:
    text: "A compatible pair deposits eggs on a cleaned firm surface such as a flat stone. Both parents participate\
      \ in guarding, with larvae subsequently moved into shallow pits. Aquarium reports commonly describe roughly\
      \ 300 to 600 eggs and hatching after two to three days in warm water, with swimming fry several days\
      \ later. Finely sized foods and Artemia nauplii are suitable for newly swimming young. Sexual maturity\
      \ and pair formation may take around two years. Courtship can be forceful and territorial boundaries\
      \ expand around offspring, so the breeding arrangement needs cover and a separation option. Reports of\
      \ safe tankmates during spawning conflict with stronger warnings from other sources."
    sources:
    - *id028
    - *id023
    - *id005
  sexing:
    text: Juveniles are difficult to sex reliably by appearance. Mature males generally become larger and deeper-bodied
      and may develop longer dorsal and anal fin extensions; females can be rounder through the abdomen. Colour
      and fin shape alone are uncertain because age and social condition affect both. Examination of a mature
      genital papilla may provide another clue. Behaviour helps identify a forming pair but does not make any
      two adults compatible.
    sources:
    - *id005
    - *id028
    - *id023
  compatibility:
    text: "The species does not require species-only housing. Comparable robust adults such as Rocio octofasciata,\
      \ Chuco godmanni or Vieja maculicauda appear in specialist keeping accounts, but combinations need separate\
      \ territories and a substantially larger aquarium, typically above 1000 litres. Avoid exceptionally aggressive\
      \ companions and small, vulnerable fish. Predation level 1 reflects occasional tiny-prey risk, not evidence\
      \ of regular piscivory or a measured absolute prey ceiling. Both Cincelichthys pearsei and Vieja melanurus\
      \ share presumed hybrid groups with bocourti. The pearsei warning and labelled captive melanurus crosses\
      \ do not establish verified freely chosen pairings, but they support caution in breeding collections."
    sources:

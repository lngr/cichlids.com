      rationale: "The tally qualified-majority interval is 23 to 32 C with low confidence and four agreeing\
        \ votes of six. Generator proposed 23 to 33, checker-a 25 to 30, checker-b 23 to 30, checker-c 23 to\
        \ 32, and both tiebreaker-1 and tiebreaker-2 23 to 31 C. The agreeing endpoints are compared within\
        \ one degree and their medians are rounded, yielding 32 C as the upper boundary. NCS recommends 23\
        \ to 27 C, Seriously Fish 26 to 28 C, Fishkeeper 25 to 30 C, Aqua-Fish 25 to 28 C, and NVC and AquaInfo\
        \ 26 to 30 C; Traas reports sustained maintenance near 29 C. The selected upper limit is narrower than\
        \ generator 33 C and field peaks up to 33.7 C, but exceeds the direct aquarium recommendations. It\
        \ is a provisional extension to include seasonal native water with a modest margin, not evidence of\
        \ healthy constant exposure at 32 C. Routine keeping around 26 to 29 C has better direct support, and\
        \ good oxygenation matters. The interval contains the decided natural 24 to 31 C."

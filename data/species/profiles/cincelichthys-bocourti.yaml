    confidence: medium
    rationale: "The settled qualified-majority decision is 24 to 31 C, with five agreeing votes of six. Proposals\
      \ were generator 24 to 32.3, checker-a 25 to 30, checker-b 24 to 30, checker-c 24 to 31, tiebreaker-1\
      \ 24 to 31, and tiebreaker-2 23.5 to 30.5 C. Brinson distinguishes typical lake water at 26 to 30 C and\
      \ lower Polochic water at 23.5 to 30.5 C from lake extremes of 24.1 to 31.4 C and river extremes of 23\
      \ to 30.9 C. CRC gives 24 to 28 C. INSIVUMEH monitored a wider 24.1 to 33.7 C at Mariscos and 24 to 31.2\
      \ C at Teleman in 2017, including hot observations not tied to captured fish. The decision is a rounded\
      \ representative planning interval rather than the complete basin envelope; it is narrower than those\
      \ measured extremes and omits the typical Polochic lower half-degree. These wider measurements remain\
      \ in evidence. No years-long aquarium safety at the field extremes is inferred."

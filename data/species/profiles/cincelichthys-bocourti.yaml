  ph:
    value:
      min: 6.5
      max: 8.3
    confidence: low
    rationale: "No qualified majority formed, so the tally uses the median of the six lower and upper bounds,\
      \ giving pH 6.5 to 8.3 with low confidence and two agreeing votes of six. Generator proposed 7.8 to 8.7,\
      \ checker-a 7 to 8.3, checker-b 6 to 8.3, checker-c 5.5 to 8.3, tiebreaker-1 7 to 8.3, and tiebreaker-2\
      \ 5.5 to 8.3. This median remains plausible for ordinary aquarium planning but does not encompass all\
      \ native measurements. Brinson reports typical lake pH 6 to 7 and typical oxygenated lower Polochic pH\
      \ 5.5 to 6.75, with extremes of 5.6 to 8.25 in the lake and 5.2 to 8 in the river. Later Machorro work\
      \ gives an annual surface mean of 7.8, not a minimum, and Perez measured 8.3 in Izabal and 7.6 in Rio\
      \ Dulce. INSIVUMEH reports a wider alkaline union of 7.83 to 8.62 in 2017, which generator rounded to\
      \ 7.8 to 8.7. The decided 6.5 to 8.3 omits both the more acidic historical water and the highest recent\
      \ alkaline readings; historical methods, season and site differences remain unresolved. All readings\
      \ are retained, including those outside the median, and no exceptional swamp or oxygen-poor bottom habitat\
      \ sets an endpoint."

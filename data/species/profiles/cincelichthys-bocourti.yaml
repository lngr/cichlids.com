      \ rather than inventing a 190 cm source recommendation. A 180 by 60 by 60 cm tank holds 648 L gross,\
      \ rounded to approximately 650 L. This is for one compatible pair with refuge and separation available.\
      \ Aqua-Fish suggests 600 L and AquaInfo a longer 250 cm aquarium; these alternatives remain cited. Mixed\
      \ communities require much more room, typically above 1000 L, and a difficult pair may need a larger\
      \ layout."

  note: "The Catalog of Fishes confirms Cincelichthys bocourti as valid. Its current-genus and legacy Cichlasoma\
    \ lists were checked; the modern Cichlasoma query no longer retains bocourti. All full-profile votes agree\
    \ on the accepted name and authority. Neetroplus is the original combination; Herichthys, Cichlasoma, Vieja\
    \ and Theraps are historical combinations rather than additional biological species. FishBase uses the\
    \ accepted heading but retains an outdated paragraph about generic uncertainty; the catalog and McMahan\
    \ revision take precedence."

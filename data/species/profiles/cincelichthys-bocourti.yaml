  sizeAndGrowth:
    text: "Plan for typical aquarium maxima around 35.5 cm in males and 25 cm in females. The sex-specific\
      \ aquarium account is more useful for adult housing than a 20 cm standard-length database record from\
      \ limited material. Reports of fish reaching or exceeding 40 cm mean additional space may be needed for\
      \ unusually large adults. A breeder raised juveniles beyond 30 cm in about two years. A published care\
      \ guide estimates 6 to 8 years of life, but reliable species-specific longevity records are scarce. The\
      \ longer 10 to 15 year estimates in the working proposals were analogies, so they are not presented as\
      \ established facts."
    sources:
    - *id005
    - *id028
    - *id023
    - *id006
    - *id029
    - *id031

profile:
  overview:
    text: "The golden mojarra is a large, deep-bodied cichlid from Atlantic-draining Guatemala and southern\
      \ Belize. Adults develop yellow to orange sides, a greenish head and vertical dark bars whose contrast\
      \ changes with social state. The accepted name is Cincelichthys bocourti; older names include Cichlasoma,\
      \ Herichthys, Vieja and Theraps bocourti. Its relatively restrained reputation among large Central American\
      \ cichlids depends on adequate space and compatible individuals. An adult pair needs permanent large\
      \ housing and a practical way to separate fish."
    sources:
    - *id001
    - *id006
    - *id005
    - *id028
    - *id023
    - *id031
    - *id052
    - *id030
    - *id024
    - *id007
    - *id032
    - *id026
  habitat:
    text: "The best supported core localities are Lake Izabal and the lower Polochic, with records from Moho\
      \ and Temash in Belize and reports from Rio Dulce. Sarstun, also written Sarstoon, appears in the regional\
      \ literature but lacks recent collecting confirmation in the account consulted. Soft lake sediments and\
      \ sheltered lowland margins provide feeding and cover. Natural planning ranges are 24 to 31 C, pH 6.5\
      \ to 8.3, 4 to 7 dGH and 4 to 6 dKH. They summarize representative conditions rather than every measurement:\
      \ Brinson reported typical lower Polochic pH 5.5 to 6.75, while later basin monitoring reached pH 8.62\
      \ and 33.7 C. These temporal and spatial differences remain unresolved. Direct ion and alkalinity measurements\
      \ show moderately soft freshwater; a hard-water stereotype is misleading. Saline intrusions and oxygen-poor\
      \ deep or swamp water are not healthy aquarium targets. The regional FAO inventory, zooplankton surveys\
      \ and Rio Dulce quality studies add basin context, while the mining report consulted supplies no usable\
      \ species-habitat hardness limits."
    sources:
    - *id005
    - *id009
    - *id010
    - *id042
    - kind: literature
      title: "FAO: The inland waters of Latin America, Central America"
      url: "https://www.fao.org/4/ad770b/AD770B13.htm"
      accessed: '2026-10-13'
      archived: fao.org/4/ad770b/ad770b13.htm/2026-10-14T094349Z
    - kind: literature
      title: "Canadian water quality index CCME-WQI in the hydrographic incidence zone of the Rio Dulce, Izabal,\
        \ Guatemala (2022)"
      url: "https://doi.org/10.34188/bjaerv5n3-014"
      accessed: '2026-10-13'
      archived: doi.org/10.34188_bjaerv5n3-014/2026-10-13T135047Z

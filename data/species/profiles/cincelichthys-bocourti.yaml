  problems:
    text: "Adult crowding, an incompatible pair and persistent exposure to a dominant fish are the main avoidable\
      \ social problems. Rich feeding can produce obesity, and large adults place a substantial load on filtration.\
      \ Monitor appetite, breathing, body condition and access to shelter while checking water quality when\
      \ behaviour changes. A provisional wide tolerance is not evidence that prolonged hot water or abrupt\
      \ chemistry changes are harmless. The cichlids.com archive search returned a tank-construction discussion\
      \ whose temporary filling temperatures do not establish species-specific chronic limits. Conflicting\
      \ habitat chemistry and sparse longevity evidence remain areas where better measurements would improve\
      \ this profile."

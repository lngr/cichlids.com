    confidence: high
    rationale: "All four full profiles agree on Guatemala and Belize. Generator omitted Sarstun because it\
      \ could not verify the locality; checker-a included it, checker-b cited NVC for it, and checker-c retained\
      \ it as supplied basin context. CRC and NCS support Izabal, lower Polochic, Moho and Temash; NVC also\
      \ identifies Rio Dulce and mentions Sarstoon in older literature while noting the lack of recent collecting\
      \ reports. Retain Sarstun as a literature-reported basin, with less locality certainty than the core\
      \ records. Lake Izabal has no entry in the waterbody table, so no table range is substituted."

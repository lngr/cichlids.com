  sexing:
    text: "Adult males usually grow larger and develop stronger blue colour than females, which tend to remain
      silvery or sandy grey. Both sexes can show a dark facial mark, and posterior vertical bars may fade with
      mood. A subdued male can resemble a female, so colour alone is unreliable in young fish or a strongly
      ranked group. Use reliably sexed adults when the recommended ratio matters. Blue colour or a locality
      label alone does not establish species identity, especially among electra-like trade fishes."

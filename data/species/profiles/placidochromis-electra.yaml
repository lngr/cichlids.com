  ph:
    value:
      min: 7.7
      max: 8.6
    confidence: "high"
    rationale: "The tally assigns the lake surface envelope of pH 7.7 to 8.6. Branchu discusses the wider
      lower-reaching whole-column interval of 7.5 to 8.5, which includes deeper water and is not substituted
      for the prescribed surface envelope. The decision therefore has a higher minimum than that source
      interval, while retaining the compiled 8.6 upper boundary. This lake-wide assignment is not a
      measurement at a single electra collecting site. The historical FAO compilation underlying the surface
      endpoints was not independently retrieved through the required DOI-only full-text tool."
    sources:
      - kind: "literature"
        title: "Branchu et al. (2010). Hydrochemistry (major and trace elements) of Lake Malawi (Nyasa), Tanzanian
          Northern Basin: local versus global considerations. HESS Discussions 7, 4371-4409."
        url: "https://doi.org/10.5194/hessd-7-4371-2010"
        archived: doi.org/10.5194_hessd-7-4371-2010/2026-10-13T071931Z
        accessed: "2026-10-13"

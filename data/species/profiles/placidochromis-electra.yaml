  socialBehavior:
    text: "Keep a female-biased adult unit, normally one male with three females. Displays and brief chases
      increase around spawning, and females need a route away from the selected site. More mature males
      require substantially more room than this minimum setup. A small breeding territory describes common
      aquarium behaviour, although some wild populations are reported to retain rocky territories more
      continuously. Observe whether every fish can eat and rest; persistent exclusion or injuries indicate
      that the particular social arrangement needs adjustment."

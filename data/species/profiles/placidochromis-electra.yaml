  problems:
    text: "A cramped floor plan, persistent social pressure, unstable water and excessive food can undermine
      otherwise straightforward maintenance. Check access to meals and refuges when a fish repeatedly hides or
      loses condition. New arrivals benefit from quarantine and observation before entering an established
      community. Swelling, rubbing and appetite loss have several possible causes; inspect water conditions
      and recent changes before assuming a particular disease. The absence of a special bloat-sensitivity flag
      is not a guarantee against digestive trouble. Misidentified trade fish also create avoidable breeding
      and stocking problems."

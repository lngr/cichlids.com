  diet:
    text: "Small invertebrates form the best-supported focus of the natural feeding strategy. A complete sinking
      food can be supplemented with appropriately sized Artemia, Mysis, Daphnia and other small crustaceans,
      with occasional spirulina food. Some algae and detrital material also enter the natural diet, so the
      invertivore category does not imply exclusive animal feeding. Offer manageable portions and check access
      for each fish. The special bloat-sensitivity flag is false because ordinary animal-food husbandry is
      supported and unusual protein intolerance is unproven. Overfeeding and digestive disease remain
      possible. The predation rating is 0: fish hunting is not established, but incidental fry ingestion can
      occur."

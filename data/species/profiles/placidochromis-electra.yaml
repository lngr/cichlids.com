            max: 15
        - by: "checker-c"
          value:
            min: 8
            max: 15
      decision:
        min: 8
        max: 15
      rationale: "Generator, checker-b and checker-c proposed 8 to 15 years; checker-a proposed 8 to 10 from general
        knowledge. Aqua-Fish explicitly gives approximately eight years, while the retailer Abysse gives
        fifteen without cohort data or a distinction between typical and exceptional survival. Retain the
        broader 8 to 15 interval to expose the disagreement between published hobby estimates; it is not a
        demonstrated survival distribution or a promise of routine fifteen-year longevity. Direct species
        estimates take precedence over the checker-a general estimate, but their reliability remains low."

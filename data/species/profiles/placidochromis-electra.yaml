  sizeAndGrowth:
    text: "Allow for an aquarium male around 18 cm total length and a female around 14 cm. Sex-specific accounts
      give slightly smaller alternatives, while unsexed standard-length figures differ substantially. Standard
      length excludes the tail and cannot be substituted directly for captive total length. No reliable growth
      timetable was found. Available hobby lifespan claims span roughly eight to fifteen years, with no
      survival cohort to show how often the upper figure is reached. The adult space requirement applies even
      when a purchased group is still small."

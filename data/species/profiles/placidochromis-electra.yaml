    tolerance:
      value:
        min: 5
        max: 10
      confidence: "low"
      rationale: "All four full-profile runs proposed 5 to 10 dKH and the tally retains it unanimously with low
        confidence. Einrichtungsbeispiele recommends 6 to 10 dKH and the retailer Abysse gives a 10 dKH
        target. The first source misattributes the species authority and the second offers no endpoint trial,
        so neither supports a strong claim of multi-year success. The lower boundary is widened to contain the
        prescribed natural 5 to 8 dKH interval, with Branchu providing directly reviewed alkalinity evidence
        within it. Checker-a inferred the same tolerance from Seriously Fish and Fishkeeper, but neither
        source actually states KH; their alkaline-water advice is contextual only. This estimate separates
        carbonate buffering from GH and does not establish a physiological threshold."

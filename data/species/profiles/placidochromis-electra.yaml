    - field: "features.minTank"
      proposals:
        - by: "generator"
          value:
            volumeL: 500
            lengthCm: 160
            depthCm: 50
        - by: "checker-a"
          value:
            volumeL: 360
            lengthCm: 160
            depthCm: 45
        - by: "checker-b"
          value:
            volumeL: 300
            lengthCm: 150
            depthCm: 50
        - by: "checker-c"
          value:
            volumeL: 400
            lengthCm: 160
            depthCm: 50
      decision:
        volumeL: 500
        lengthCm: 160
        depthCm: 50
      rationale: "For one male and three females, generator proposed 500 L with 160 cm length and 50 cm depth;
        checker-a 360 L with 160 and 45 cm; checker-b 300 L with 150 and 50 cm; checker-c 400 L with 160 and
        50 cm. Retain the cautious generator dimensions because Rizzo recommends 160 cm length and a retailer
        specifies 500 L at 160 cm; Einrichtungsbeispiele also specifies 500 L for a one-male harem but its
        taxonomy error reduces weight. Malawi-Guru and Fischlexikon allow 400 L at 150 cm, NVC allows 300 L at
        150 cm, and Seriously Fish gives about 205 L on a 120 by 45 cm base. A retailer asks for roughly 183
        cm length. Fifty centimetres of front-to-back depth is a practical allowance for open sand and
        refuges, not a measured electra-specific minimum. The 500 L decision has low confidence because
        social-unit definitions and published recommendations differ; a larger mixed community needs more
        space."

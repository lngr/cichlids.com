      decision:
        min: 3
        max: 20
      rationale: "Tally method qualified-majority, 4 of 6 votes. The qualified-majority tally selects 3 to 20 dGH
        with four of six votes: generator, checker-b, tiebreaker-1 and tiebreaker-2 proposed 3 to 20;
        checker-a and checker-c proposed 3 to 25. The cautious 20 dGH upper boundary is supported by Aqua-Fish
        at 8 to 20 dGH and Rizzo at approximately 20 dGH. Seriously Fish gives the wider source range of 10 to
        25 dGH, and Fishkeeper also allows up to 25; those recommendations explain the rejected 25 endpoint
        but do not establish a measured long-term limit. Fischlexikon gives 3 to 15, Aquarium Guide 5 to 19
        and AquaInfo 12 to 16 dGH. The lower boundary of 3 contains the prescribed natural 3 to 5 dGH
        envelope. GH and carbonate buffering remain separate quantities, and medium confidence reflects the
        conflicting recommendations."

  temperatureC:
    value:
      min: 21
      max: 29
    confidence: "high"
    rationale: "The tally assigns the lake-wide seasonal envelope of 21 to 29 C to this Malawi endemic. Eccles
      describes 21 C inshore cooling and about 27 C in the upper 60 m; only its abstract was accessible
      because fetch-oa classified the full text as not open access. Vollmer reports summer surface water
      around 28 C and winter cooling below 24 C. Branchu records 22.8 to 25.4 C in one northern-basin profile
      extending to 240 m. These observations cover parts of the fixed lake envelope rather than proving
      occupation of every endpoint by electra. The 29 C upper endpoint remains the prescribed lake compilation
      boundary; the retrieved papers do not independently establish it. Non-DOI report and thesis full texts
      behind the compilation could not be retrieved through the required DOI-only tool and are not presented
      as directly reviewed evidence."
    sources:
      - kind: "literature"
        title: "Branchu et al. (2010). Hydrochemistry (major and trace elements) of Lake Malawi (Nyasa), Tanzanian
          Northern Basin: local versus global considerations. HESS Discussions 7, 4371-4409."

        those recommendations explain the rejected 25 endpoint but do not establish a measured long-term
        limit. Fischlexikon gives 3 to 15, Aquarium Guide 5 to 19 and AquaInfo 12 to 16 dGH. The lower
        boundary of 3 contains the prescribed natural 3 to 5 dGH envelope. GH and carbonate buffering remain
        separate quantities, and medium confidence reflects the conflicting recommendations."

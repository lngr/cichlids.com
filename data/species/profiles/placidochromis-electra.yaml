    confidence: "high"
    rationale: "All runs agree on Lake Malawi endemism. Generator proposed Likoma Island, Chiwindi and Lumbaulo;
      checker-a proposed Likoma plus the Chiwindi to Mara Point and Lumessi to Ntekete stretches; checker-b
      proposed Likoma, Chiwindi and Makanjila Point; checker-c retained only Likoma. Likoma is confirmed by
      the type record and FishBase. Chiwindi and Lumbaulo have species-account support and are retained. The
      cautious locality list does not imply absence elsewhere: Mara Point and Lumessi are explicitly
      associated with undescribed electra-like taxa by Malawi-Guru, while Hai Reef to Makanjila records use an
      older broad interpretation in the NVC account. These wider reports remain in evidence but do not expand
      the named locality list without secure identification."

profile:
  overview:
    text: "A spacious Malawi aquarium with a quiet community and a broad sandy floor suits Placidochromis electra.
      Mature males show blue body colour and dark facial markings; females usually remain silver or sandy
      grey. The valid name is Placidochromis electra (Burgess, 1979), originally described from the Likoma
      Island area. Deepwater hap is a useful common name, although the fish also occurs in relatively shallow
      water. Electric blue hap is an ambiguous trade label and can refer to other species. Confirm identity
      and locality when buying fish labelled electra, phenochilus or an undescribed electra-like form."
    sources:
      - kind: "catalog-of-fishes"
        title: "Eschmeyer's Catalog of Fishes: species of Placidochromis"
        url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Pl\
          acidochromis"
        archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-7bfb0e6b/2026-10-14T102410Z
        accessed: "2026-10-13"

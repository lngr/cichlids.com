  khDkh:
    value:
      min: 5
      max: 8
    confidence: "high"
    rationale: "The tally fixes natural carbonate hardness at 5 to 8 dKH. Branchu Table 2 gives alkalinity from
      2.3339 to 2.4613 meq/L across the measured column, equivalent to about 6.5 to 6.9 dKH after
      multiplication by 2.8; the surface to 30 m subset is about 6.5 to 6.7 dKH. The prescribed rounded lake
      envelope also incorporates historical surveys not independently retrieved through the required DOI-only
      full-text tool. Bicarbonate associated with sodium contributes buffering without equivalent
      calcium-magnesium hardness, so this range can exceed GH. Natural KH deliberately has no verification
      object."
    sources:
      - kind: "literature"
        title: "Branchu et al. (2010). Hydrochemistry (major and trace elements) of Lake Malawi (Nyasa), Tanzanian
          Northern Basin: local versus global considerations. HESS Discussions 7, 4371-4409."
        url: "https://doi.org/10.5194/hessd-7-4371-2010"
        archived: doi.org/10.5194_hessd-7-4371-2010/2026-10-13T071931Z

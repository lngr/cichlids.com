  breeding:
    text: "The female incubates eggs and developing young in her mouth after spawning near a bottom site. Species
      accounts commonly describe about three weeks of incubation, with brood size varying between reports.
      Carrying females need calm retreats and may feed little or stop feeding. Disturbance can lead to
      premature brood loss, and released fry can disappear in a community aquarium. A prepared rearing
      arrangement can improve survival without making species-only housing necessary for normal adult care.
      Small live or prepared fry foods become useful after release. Exact incubation time and brood size
      depend on the female and conditions."

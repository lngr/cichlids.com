  husbandry:
    text: "Use at least 500 litres with 160 cm length and 50 cm front-to-back depth for the recommended unit of
      one male and three females. This is a cautious planning minimum assembled from differing care
      recommendations, with low confidence in an exact threshold. Leave extensive fine sand available and use
      secure rocks to provide refuges and break sight lines. Provide clean, well-oxygenated water and regular
      partial water changes. A routine temperature around 24 to 26 C has stronger shared support than the full
      21 to 29 C tolerance endpoints. The recorded tolerances are pH 7.5 to 8.8, GH 3 to 20 dGH and KH 5 to 10
      dKH. They are maintenance estimates, not proven lifetime limits; stable buffering and low general
      hardness are separate considerations."

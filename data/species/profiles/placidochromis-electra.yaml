      rationale: "The qualified-majority tally selects 3 to 20 dGH with four of six votes: generator, checker-b,
        tiebreaker-1 and tiebreaker-2 proposed 3 to 20; checker-a and checker-c proposed 3 to 25. The cautious
        20 dGH upper boundary is supported by Aqua-Fish at 8 to 20 dGH and Rizzo at approximately 20 dGH.

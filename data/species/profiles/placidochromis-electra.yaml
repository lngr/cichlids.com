        min: 7.5
        max: 8.8
      confidence: "medium"
      rationale: "Generator, checker-a, checker-b and checker-c all proposed pH 7.5 to 8.8, retained by unanimous
        tally decision. Seriously Fish gives 7.6 to 8.8; Fischlexikon, AquaInfo and Aquarium Guide give 7.5 to
        8.5. Aqua-Fish gives a wider lower-reaching recommendation of 7 to 8, whose 7.0 endpoint is not
        adopted because the more consistent care accounts favor at least 7.5. The selected range contains
        natural pH 7.7 to 8.6. These maintenance recommendations are not controlled lifetime endpoint
        experiments."

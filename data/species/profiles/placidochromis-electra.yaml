      value:
        min: 21
        max: 29
      confidence: "low"
      rationale: "All four full-profile runs proposed 21 to 29 C and the tally retains that interval unanimously,
        with low confidence. Seriously Fish recommends 24 to 28 C, Fischlexikon 22 to 27 C, AquaInfo 22 to 26
        C, Aquarium Guide 24 to 26 C and Aqua-Fish 23 to 26 C. The interval is widened to contain the
        prescribed natural lake envelope; the care recommendations do not demonstrate continuous multi-year
        success at 21 or 29 C. About 24 to 26 C has stronger overlapping husbandry support. This is a planning
        estimate rather than a measured lifetime tolerance."

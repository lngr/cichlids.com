  ghDgh:
    value:
      min: 3
      max: 5
    confidence: "high"
    rationale: "The tally fixes natural GH at 3 to 5 dGH. Branchu Table 2 gives paired calcium and magnesium
      measurements in the upper 50 m that convert to approximately 4.2 to 4.6 dGH using Ca mg/L divided by
      7.14 plus Mg mg/L divided by 4.34. The broader rounded 3 to 5 envelope also incorporates historical lake
      surveys in the prescribed compilation; those non-DOI survey texts were not independently retrieved
      through the required full-text tool. Aquarium recommendations of 10 to 25 dGH describe maintained water
      and do not redefine Lake Malawi as naturally hard water."
    sources:
      - kind: "literature"
        title: "Branchu et al. (2010). Hydrochemistry (major and trace elements) of Lake Malawi (Nyasa), Tanzanian
          Northern Basin: local versus global considerations. HESS Discussions 7, 4371-4409."

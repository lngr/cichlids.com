  compatibility:
    text: "Peaceful Malawi non-mbuna, particularly suitable Aulonocara and Copadichromis, are the main community
      options in the care accounts. Each additional social unit needs more room than the electra minimum.
      Aggressive mbuna can suppress normal behaviour and interfere with feeding. A presumed crossing group
      connects electra with phenochilus because Rizzo warns about that pair, but no actual free-choice cross
      was established. Similar names or blue colour do not justify a wider genus-wide hybrid group. Keep
      locality identities clear in breeding stock. Predation level 0 should not be read as a guarantee of fry
      survival or as proof that every small fish is a suitable companion."

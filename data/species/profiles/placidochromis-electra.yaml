  habitat:
    text: "Electra finds small foods near the bottom, often after larger cichlids expose them by digging in sand.
      Provide open sand and a limited rock-sand transition with refuges rather than a densely packed rock
      habitat. Likoma Island is the firmest locality record; Chiwindi and Lumbaulo also have
      specialist-account support. Wider distribution accounts partly overlap undescribed trade taxa. The
      assigned lake-wide natural envelope is 21 to 29 C, pH 7.7 to 8.6, GH 3 to 5 dGH and KH 5 to 8 dKH. These
      are regional planning ranges rather than simultaneous measurements at one occupied site. Reviewed ion
      measurements confirm low calcium-magnesium hardness with stronger bicarbonate buffering."
    sources:
      - kind: "catalog-of-fishes"
        title: "Eschmeyer's Catalog of Fishes: species of Placidochromis"
        url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Pl\
          acidochromis"

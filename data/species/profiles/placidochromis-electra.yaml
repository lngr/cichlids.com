  maxSizeCm:
    value:
      male: 18
      female: 14
    confidence: "medium"
    rationale: "Generator and checker-a proposed 18 cm male and 14 cm female; checker-b proposed 17 and 14;
      checker-c proposed 17 and 13. Retain 18 and 14 cm as cautiously sized ordinary aquarium adults:
      malawi.si explicitly reports captive males to 18 cm, NVC gives males 17 and females 14, and AquaInfo
      gives 17 and 13. A retailer independently offers a captive estimate of 15 to 17 and 12 to 14 but is
      lower-weight support. FishBase lists 12 cm standard length and Seriously Fish 20 cm standard length
      without separate female measurements. Those unsexed and differently measured figures are preserved as
      evidence rather than assigned to both sexes or treated as typical aquarium total lengths."
    sources:
      - kind: "database"

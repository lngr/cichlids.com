            type: "invertivore"
            bloatSensitive: false
        - by: "tiebreaker-2"
          value:
            type: "invertivore"
            bloatSensitive: false
      decision:
        type: "invertivore"
        bloatSensitive: false
        foods:
          - "quality sinking cichlid pellets"
          - "Artemia"
          - "Mysis"
          - "Daphnia"
          - "small crustaceans"
          - "occasional spirulina food"
      rationale: "Tally method qualified-majority, 5 of 6 votes. The qualified-majority tally chooses invertivore
        with bloatSensitive false and retains the generator food list. Generator, checker-a, checker-c,
        tiebreaker-1 and tiebreaker-2 proposed invertivore with the false flag; checker-b proposed omnivore
        with the false flag. Seriously Fish, Malawi-Guru, AquaInfo and Rizzo describe invertebrate-focused
        feeding behind sand diggers. FishBase and Malawi Mayhem also record algae, making omnivore plausible
        without quantitative gut-content proportions. The CRC public label is detritivorous, outside the
        rubric categories; its subscriber detail was not read and this verification does not settle food
        proportions. Rizzo reports successful insect-larval feeding while cautioning about excess rich food.
        The false flag is an inference from ordinary animal-food husbandry, not a measured absence of
        digestive disease or immunity to bloat."

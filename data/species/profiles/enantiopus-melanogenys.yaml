    rationale: 'The settled qualified majority is level 1, four of six votes, with medium confidence. Generator,
      checker-b, tiebreaker-1 and tiebreaker-2 proposed 1; checker-a and checker-c proposed 0 from the natural
      invertebrate diet. Seriously Fish explicitly reports adults consuming released fry and AquariaCentral
      independently reports the same opportunity feeding. These direct observations outweigh an inference of
      level 0 from stomach contents dominated by crustaceans. WaFishBox reports survival with cover and well-fed
      adults, which is compatible with occasional predation. Level 1 uses the rubric threshold of roughly 2
      cm, not a measured prey-size ceiling for this fish. The Oxford thesis abstract does not concern this
      species and supplies no predation evidence.'

        max: 30
      confidence: low
      rationale: 'The tally decides 23 to 30 C with unanimous agreement within the one-degree threshold and
        low confidence. Generator and checker-a proposed 22 to 30 C; checker-b and checker-c proposed 23 to
        29 C. The midpoint endpoints are 22.5 and 29.5 C, rounded by the tally to 23 and 30 C. The result is
        narrower at the lower end than the 22 to 30 proposals, which were inferred margins rather than measurements.
        Seriously Fish and the retailer recommend 24 to 27 C, AquaInfo and Aquablog 24 to 26 C, and the Swedish
        register 24 to 27.5 C. The natural 23 to 29 C range is included, but 30 C is an inferred margin with
        no demonstrated chronic threshold; routine keeping near 24 to 27 C is better supported.'

  legacyNames:
  - Enantiopus melanogenys
  note: The current-status line in the Catalog of Fishes accepts Enantiopus melanogenys. FishBase and Seriously
    Fish use Xenotilapia melanogenys for the same described species. Ectodus melanogenys is the original combination
    and Ectodus longianalis is a catalog synonym. Enantiopus albini has uncertain status and is not added as
    a confirmed synonym. The undescribed Enantiopus sp. 'Kilesa' remains separate. The 2012 phylogeny places
    Enantiopus within the Xenotilapia lineage; it does not establish that Kilesa and melanogenys are one species.

  temperatureC:
    value:
      min: 23
      max: 29
    confidence: high
    rationale: 'The settled waterbody decision is 23 to 29 C, with high confidence. Verburg et al. measured
      23.85 to 29.01 C in hourly near-surface records at Mpulungu, and the Plisnier studies describe seasonal
      mixing and upwelling. This rounded lake envelope is the natural range. Species care recommendations of
      24 to 27 C are retained separately and do not replace habitat measurements.'

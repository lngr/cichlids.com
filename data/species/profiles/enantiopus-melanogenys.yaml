partners:
  suitable:
  - species: Cyprichromis leptosoma
    reason: Uses higher water and is reported to coexist with the sand-feeding group.
    condition: Provide room for both shoals and deliver suitable food to the bottom.
  - species: Paracyprichromis nigripinnis
    reason: A relatively calm higher-water companion mentioned in specialist advice.
    condition: Keep its edge shelter separate from the large open sand area; observe actual behavior.
  - species: Lamprichthys tanganicanus
    reason: 'Mentioned as a possible midwater companion in hobby accounts, with less direct confirmation.'
    condition: Use a spacious covered aquarium and ensure the sand feeders receive enough food.
  unsuitable:
  - species: Callochromis macrops
    reason: A cichlids.com breeder warns of competing sand-sifter use of the same bottom area.
  - species: Aulonocranus dewindti
    reason: A hobby account warns that its nest building can take floor space from Enantiopus.
  - species: Lake Malawi mbuna
    reason: Boisterous activity and feeding competition can unsettle this timid bottom feeder.
  - species: Neolamprologus brichardi
    reason: An expanding defended breeding territory can restrict the sand group and expose it to persistent
      harassment.
profile:
  overview:
    text: 'Give Enantiopus melanogenys room to sift sand as a group and its behavior becomes the main attraction:
      mature males establish neighboring display sites while females move among them. This Lake Tanganyika
      endemic is also traded as Xenotilapia melanogenys. Here the accepted name follows the Catalog of Fishes.
      Enantiopus sp. ''Kilesa'' is a separate undescribed fish and is excluded from this account.'
    sources:
    - *id040
    - *id004
    - kind: catalog-of-fishes
      title: 'Eschmeyer''s Catalog of Fishes: species in the genus Ectodus'
      url: 'https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Ectodus'
      archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-e5b59a95/2026-10-14T171331Z
      accessed: '2026-10-13'
    - *id045
    - *id002
    - *id006
  habitat:
    text: 'The species uses sandy lake bottoms and feeds close to the substrate, even when traveling in large
      shoals. Records extend to about 40 m, with breeding fish moving into shallower water. Natural lake chemistry
      is represented here by 23 to 29 C, pH 8.4 to 9.4, 10 to 13 dGH and 15 to 20 dKH. These values summarize
      seasonal and regional measurements, rather than a single collecting site. Occasional nearby rocks do
      not replace its requirement for open sand.'
    sources:
    - *id001
    - *id002
    - *id012
    - *id014
    - *id011
    - *id015
    - *id016
    - *id017
  sizeAndGrowth:
    text: 'Plan around males near 15 cm and females near 13 cm. The female figure is estimated because available
      accounts describe a size difference without measuring a separate female maximum. FishBase uses total
      length, whereas Seriously Fish reports 16 cm standard length, so their numbers cannot be treated as equivalent
      measurements. Spawning can begin around the first year, and a short reported reproductive period should
      not be mistaken for a measured lifespan. The three to five year lifespan estimate remains poorly confirmed.'
    sources:
    - *id001
    - *id002
    - *id042
    - *id009
    - *id022
  husbandry:
    text: 'For eight adults, provide at least 300 L and a base around 120 by 50 cm. A length of 150 cm gives
      displaying males more room and is preferable when several bowers are active. Keep most of the floor as
      fine smooth sand, with sparse stable shelter at the margins. Use reliable filtration and regular partial
      water changes, and check that waste does not accumulate. Routine temperature advice clusters near 24
      to 27 C. The wider working tolerances are 23 to 30 C, pH 7.5 to 9.4, GH 10 to 25 dGH and KH 10 to 20
      dKH; they include natural conditions and are not experimentally determined stress limits. Quiet surroundings,
      a secure cover and gradual lighting changes reduce problems when fish startle.'
    sources:
    - *id002
    - *id018
    - *id022
    - *id029
    - *id026
  socialBehavior:
    text: 'A group of at least eight, including two or more males and more females than males, suits its schooling
      and display behavior better than an isolated pair. The males maintain separate breeding sites and mainly
      settle disputes by display and brief chasing when space is adequate. A small group can be nervous, and
      a small social unit can concentrate harassment on females. Preserve enough open floor for fish to leave
      a displaying male without being trapped at another nest.'
    sources:
    - *id002
    - *id018
    - *id029
    - *id028
  diet:
    text: 'Food needs to reach the sand where the fish normally forage. Small sinking prepared foods and appropriately
      sized frozen or live crustaceans offer a practical way to supply its mainly invertebrate diet. Wild stomach
      records include copepods, ostracods and shrimps. Distribute food so shy individuals receive a share and
      watch body condition rather than assuming that sifting always means successful feeding. The bloat-sensitive
      flag is false because a special protein-related susceptibility has not been established; the diet still
      needs variety and sensible portions.'
    sources:
    - *id001
    - *id006
  breeding:
    text: 'Females alone incubate the brood after spawning at a male''s sand nest. Display sites may approach
      50 cm across, although the actual laying pit can be much smaller and nest shape varies between populations.
      Incubation commonly takes about three to four weeks; reported broods span roughly 10 to 80 young or eggs
      across the accounts, with no single clutch size guaranteed. Handling and social disruption can cause
      brood loss. Adults can consume released fry, so a breeding display does not guarantee recruitment. Reports
      of young surviving with fed adults and cover are conditional successes, not evidence that predation never
      occurs.'
    sources:
    - *id001
    - *id002
    - *id032
    - *id022
    - *id031
  sexing:
    text: 'Adult display males show stronger blue-green iridescence, yellow areas and dark lip or fin markings;
      pattern and intensity vary among localities. Females and males outside display condition are more silvery
      and can look similar. Males tend to be larger with longer dorsal and anal fins. A female carrying a brood
      develops a fuller mouth profile, but color alone is unreliable for assigning sex to juveniles or subdued
      adults.'
    sources:
    - *id018
    - *id002
  compatibility:
    text: 'A calm midwater shoal such as Cyprichromis leptosoma can share a sufficiently spacious aquarium
      while leaving the sand available. Paracyprichromis and Lamprichthys are also mentioned as possible companions,
      with less direct experience behind some reports. Avoid crowding the bottom with competing sand nest builders
      or exposing the group to persistent territorial harassment. A dedicated display is a useful option rather
      than a strict requirement. The current hybrid-group list is empty because no named cross was found, not
      because crossing with every related fish has been ruled out.'
    sources:
    - *id002
    - *id010
    - *id034
    - *id039
    - *id046
    - *id030
    - *id035
    - *id036
    - *id037
    - *id038
    - *id033
    - *id031
  problems:
    text: 'Sudden flight can end in collisions with glass or decor, especially after abrupt lighting changes
      or disturbance near the tank. Loss of feeding access, declining body condition and repeated hiding warrant
      checking social pressure and maintenance. The archive contains a breeder report emphasizing regular water
      changes and low nitrate accumulation. Gravel interferes with its normal sand processing, and a cramped
      or sparsely populated group can behave very differently from a settled shoal. Neither species-specific
      disease rates nor precise chronic tolerance limits are established by the reviewed evidence.'
    sources:
    - *id018
    - *id002
    - *id044

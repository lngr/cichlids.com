    confidence: high
    rationale: 'The settled waterbody decision is pH 8.4 to 9.4, with high confidence. Plisnier et al. measured
      8.47 to 9.40 at 40 m in the northern lake. FishBase gives a conflicting 7.5 to 8.5 species environment
      summary and husbandry pages supply other intervals. The measured lake synthesis takes precedence for
      natural water. Cohen et al. supply corroborating alkalinity chemistry rather than a direct measurement
      of this full pH interval.'

      a separate female maximum, and Andersen and the Swedish register describe smaller females. The female
      endpoint is therefore an estimate, not a measured sex-specific maximum. Seriously Fish instead reports
      16 cm standard length, Aquablog 16 cm without a stated length convention, and the Wet Spot averages 10

    - *id043
  husbandry:
    text: "For one male and two females, the adopted minimum is 60 L with a 60 by 30 cm base. This is a modest harem\
      \ estimate derived from published pair setups and the need to separate a second female's shell. It is not\
      \ a community-tank minimum. Lay out individual shell sites on fine sand with several spare shells and breaks\
      \ in sightlines. Shell openings and interiors must accommodate the fish without narrow trapping spaces. Cover\
      \ the tank, since a displaced fish can jump. Maintain clean, stable alkaline water and match replacement water\
      \ closely to the aquarium. Practical targets such as 24 to 26 C and pH around 8.0 to 9.0 fall inside the decided\
      \ tolerances. The broad tolerance endpoints represent an evidence envelope rather than goals for daily fluctuations.\
      \ KH tolerance, 8 to 21 dKH, is inferred with low confidence and should not be confused with GH."
    sources:
    - *id003
    - *id008
    - *id018
    - *id004
    - *id017
    - *id038
    - *id019
    - *id041
    - *id028
  socialBehavior:
    text: "The recommended unit has one male and two females, each with access to a separate shell. Breeding pairs\
      \ can form within a group, but pair bonds are not necessarily exclusive or permanent. Adults may challenge\
      \ each other over shells and chase rivals from the nearby bottom. Enough shells and floor space usually keep\
      \ those disputes limited, while a dominant fish in a crowded setup can repeatedly displace others. Adding\
      \ more males changes the space requirement. The published aquarium account describes pairs breeding in smaller\
      \ tanks, which shows that pair keeping is possible without making every small pair setup suitable for a harem."
    sources:
    - *id003
    - *id008
    - *id019
    - *id004
    - *id017
    - *id038
    - *id028
    - *id018
    - *id030
  diet:
    text: "Small animal prey form the natural feeding base, including insect larvae, crustaceans and zooplankton.\
      \ Offer appropriately sized frozen or live foods and suitable small prepared foods when accepted. Watch feeding\
      \ at the shell sites, especially when companions collect food higher in the water. Some individuals reject\
      \ dry food, so a fish seen near food has not necessarily eaten. No consulted source identifies unusual susceptibility\
      \ to protein-related bloat. Occasional fry consumption is supported by aquarium accounts and fits predation\
      \ level 1; it does not make fish the normal dietary staple. Feeding speed remains a low-confidence estimate."

  sexing:
    text: "Body size becomes useful after maturity: males usually outgrow females. Care accounts also describe a\
      \ longer, more gradual facial slope in males, but both sexes share the spotted appearance. A single juvenile\
      \ is difficult to sex reliably from colour or size alone. Background and stress can change apparent brightness.\
      \ Confirm a proposed sex ratio through mature body proportions and observed breeding behaviour rather than\
      \ treating every pale or small fish as female."

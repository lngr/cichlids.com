      shells.
profile:
  overview:
    text: "A sandy patch with scattered snail shells is the centre of life for Neolamprologus stappersi. This small\
      \ Tanganyika cichlid shelters and breeds at the bottom, with each female using her own shell and a male defending\
      \ the surrounding patch. The aquarium trade often uses meleagris or Pearly Ocellatus. Current catalog synonymy\
      \ joins these names under stappersi; melagris in the legacy catalog is a spelling error. Its pale spotting\
      \ stands out against dark markings. Adult welfare depends more on separated shell sites and steady alkaline\
      \ water than on a large body of swimming space. A prepared beginner can keep it, but social composition and\
      \ individual feeding need attention."
    sources:
    - *id001
    - *id009
    - *id003
    - *id002
    - *id008
    - *id011
    - *id018
    - *id007
    - *id010
    - *id019
    - *id004
    - *id005
    - *id006
    - *id041
  habitat:
    text: "The species is endemic to Lake Tanganyika and is reported from the Congolese shore. Sambala River near\
      \ Mpala and Bwassa are the catalog type localities of the two names now joined in synonymy; care accounts\
      \ describe the shoreline between Moliro and Kalemie. Sandy littoral bottoms with empty gastropod shells provide\
      \ shelter and breeding sites. Lake limnological studies support the natural envelopes of 23 to 29 C, pH 8.4\
      \ to 9.4, 10 to 13 dGH and 15 to 20 dKH. These broad regional ranges do not describe simultaneous conditions\
      \ at a single shell patch. Much of the buffering is bicarbonate alkalinity, and it can exceed calcium-magnesium\
      \ hardness."
    sources:
    - *id002
    - *id003
    - *id012
    - *id010
    - *id009
    - *id008
    - *id011
    - *id018
    - *id007
    - *id019
    - *id001
    - *id004
    - *id005
    - *id006
    - *id041
    - *id013
    - *id014
    - *id015
    - *id016
  sizeAndGrowth:
    text: "Plan for typical aquarium adults around 6 cm for males and 4.5 cm for females. A published keeper account\
      \ reports males at 5 to 6 cm and females at 4 to 4.5 cm. Larger unsexed records remain in the evidence: FishBase\
      \ gives 7 cm total length under meleagris and 5.1 cm under stappersi, while Seriously Fish gives 6.3 cm standard\
      \ length. Standard length omits the tail, so these figures cannot be treated as equivalent sex-specific measurements.\
      \ Juveniles gradually develop adult markings and begin defending shells as they grow. The 5 to 7.5 year lifespan\
      \ is a low-confidence planning estimate, with no measured upper age in the consulted evidence."
    sources:
    - *id002
    - *id003

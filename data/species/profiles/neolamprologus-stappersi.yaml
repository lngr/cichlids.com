  breeding:
    text: "Eggs develop inside a shell, where the female attends the brood while the male defends nearby space.\
      \ Depending on the opening and the male's size, fertilisation can occur from the entrance or after he partly\
      \ enters. Spawning is easily missed until young appear near the shell. Published accounts describe newly free-swimming\
      \ young accepting tiny live foods, but developmental timing varies between reports. Parents often tolerate\
      \ their own brood, whereas neighbouring adults and other tankmates can consume young. A dedicated breeding\
      \ tank improves the chance of raising a full brood. Increasing juvenile numbers also increase competition\
      \ for shells and floor area."

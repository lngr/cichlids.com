      \ Fish and Fishkeeper concern GH or unspecified dH and cannot establish a 25 dKH ceiling. JBL's approximately\
      \ 17.6 dKH reconstruction target and Seachem's buffering instructions are not tolerance measurements. The\
      \ chosen limits are a tally synthesis of husbandry inference, not demonstrated physiological limits."

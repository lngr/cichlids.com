  khDkh:
    value:
      min: 15
      max: 20
    confidence: high
    rationale: "The fixed natural range is 15 to 20 dKH for Lake Tanganyika. FAO measurements distinguish bicarbonate\
      \ from carbonate alkalinity, and the cited limnological studies support this rounded lake-wide interval. Carbonate\
      \ buffering can exceed GH because bicarbonate is also balanced by sodium and potassium; GH is not a substitute\
      \ for KH."
    sources:
    - *id012
    - *id010
    - *id014
    - *id013
    - *id015
    - *id016
    - *id004
    - *id008
    evidence:
    - source: *id012
      value:
        min: 15
        max: 20
      note: Lake Tanganyika range copied from the project waterbody table.
    - source: *id014
      value:
        min: 15
        max: 20
      note: "Inherited lake-wide synthesis of limnological surveys, with outward rounding; this range is not a single\
        \ station measurement or a survival threshold."
    - source: *id016
      value:
        min: 18.8
        max: 18.8
      note: "Historical bicarbonate plus carbonate alkalinity of 6.71 meq/L, converted with dKH = meq/L times 2.8;\
        \ a measurement supporting the broader lake envelope."
    tolerance:
      value:
        min: 8
        max: 21
      confidence: low
      rationale: "Generator and checker-c propose 10 to 25 dKH, checker-a 6 to 22, checker-b 10 to 20, tiebreaker-1\
        \ 8 to 20 and tiebreaker-2 8 to 22. The tally groups checker-a, checker-b and both tiebreakers within its\
        \ two-degree agreement threshold around 8 to 20. Their lower-bound median is 8 and upper-bound median 21,\
        \ yielding the qualified-majority decision 8 to 21 dKH, 4 of 6 votes, with low confidence. This envelope\
        \ contains the natural 15 to 20 dKH range. Practical Fishkeeping gives 8 to 18 dKH for Tanganyika aquaria\
        \ and JBL gives 8 to 20 for carnivorous Tanganyika cichlids; neither is a stappersi survival experiment.\
        \ Tanganyika.si gives the wider 11 to 22 dKH group recommendation, so the decided maximum is one degree\
        \ narrower than that source. Atlarium gives 10 to 20 and Fischlexikon 15 to 20. AC Aquarium's wider lower\
        \ extension, 6 to 18 dKH, lacks long-term outcomes and accompanies unusually low pH; GIGA EXOTIC's 8 to\
        \ 12 dKH accompanies conflicting size and habitat identification. Both are retained with limited weight.\
        \ The 25-degree figures from Seriously Fish and Fishkeeper concern GH or unspecified dH and cannot establish\
        \ a 25 dKH ceiling. JBL's approximately 17.6 dKH reconstruction target and Seachem's buffering instructions\
        \ are not tolerance measurements. The chosen limits are a tally synthesis of husbandry inference, not demonstrated\

  problems:
    text: "Recurring problems arise when a fish controls every shell, subordinates cannot feed, or water replacement\
      \ changes conditions abruptly. Keep shell access and individual appetite under observation. Cover gaps at\
      \ the surface and avoid shells that can trap a fish. Maintain the sand and filtration without repeatedly moving\
      \ occupied shells. Fry may disappear in a community tank even when parents are attending them. Reported hard-water\
      \ recommendations use several different hardness labels, so distinguish GH from KH before adjusting water.\
      \ The consulted evidence does not identify a unique disease syndrome for this species; low-confidence tolerance\
      \ and lifespan estimates should remain visible when planning care."

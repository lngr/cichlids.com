  compatibility:
    text: "Shared housing is possible when companions use another part of a substantially larger aquarium. Small\
      \ Julidochromis can occupy rockwork and Cyprichromis the upper water column, with enough room for their own\
      \ social units. Julidochromis transcriptus has both favourable care recommendations and a legacy keeper report\
      \ of killing meleagris, so this combination remains conditional rather than assured. Rock-associated Altolamprologus\
      \ also pose a risk to young fish. Other shell dwellers compete for the same floor and shells, even though\
      \ an individual aquarium account describes limited disputes with ocellatus. Large predators and strongly aggressive\
      \ bottom fish are poor matches. The empty hybrid-group list means no named crossing group was established\
      \ in this review, not that crossing is impossible."

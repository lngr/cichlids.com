  predation:
    value: 1
    confidence: medium
    rationale: "Generator and checker-a propose level 0; checker-b, checker-c, tiebreaker-1 and tiebreaker-2 propose\
      \ level 1. The tally selects level 1 by qualified majority, 4 of 6 votes. Tanganyika.si reports young being\
      \ taken by neighbouring males, and the specialist atlas attributes fry predation by non-breeding adults to\
      \ Buescher. Pregowski observed no fry consumption in his family tanks, while Seriously Fish describes parental\
      \ protection. These context-specific negative observations do not exclude predation on other broods. The normal\
      \ insect and crustacean diet remains compatible with occasional fry predation. No evidence supports routine\
      \ piscivory; 2 cm is the rubric threshold, not a measured prey-size limit. The original Buescher passage was\
      \ unavailable, and the retained AquaInfo meleagris and old Cichlid-Forum article routes supplied no useful\
      \ species content."

  compatibility:
    text: "Other small or medium Tanganyika cichlids can share a larger aquarium when their shelter and
      swimming requirements fit. Marquis reports keeping Cyprichromis leptosoma and Paracyprichromis
      nigripinnis with vittatus, but this does not establish that either species fits the minimum pair
      aquarium. Shell dwellers need a separate area and their fry remain vulnerable. A reported cross
      with Julidochromis dickfeldi creates a specific hybrid warning. Large piscivores and forceful
      competitors for the same small shelters are poor choices."

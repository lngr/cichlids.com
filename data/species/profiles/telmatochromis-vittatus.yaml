  habitat:
    text: "Rock edges, crevices and shell-associated sites provide shelter in Lake Tanganyika. FishBase
      describes swimming away from the bottom and favoured depths around 5 to 10 m, with records to 20 m.
      Ota studies shell nests at southern lake localities. The natural lake reference is 23 to 29 C, pH
      8.4 to 9.4, GH 10 to 13 dGH and KH 15 to 20 dKH. Magnesium-rich water and substantial alkalinity
      explain why GH and KH are different quantities."

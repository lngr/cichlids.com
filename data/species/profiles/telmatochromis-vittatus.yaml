  social:
    value:
      structure: pair
    confidence: high
    rationale: "All four full proposals recommend an aquarium pair. Seriously Fish and DRTA support that
      adult unit, while FishBase describes solitary adults with temporary pair bonds. Ota documents
      polygyny and alternative male tactics in shell-nesting field populations, so the aquarium
      recommendation does not assert lifelong monogamy throughout the species. The retailer group
      recommendation and successful trio account require more space and shelter and do not establish a
      peaceful default adult group."

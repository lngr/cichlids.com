  husbandry:
    text: "Use approximately 85 L with a base around 85 by 30 cm for a compatible pair. Arrange stable rock
      shelters and several shells so that each fish can withdraw without entering a dead end. Fine sand
      leaves useful space between structures. The tallied keeping intervals are 23 to 29 C, pH 8.0 to
      9.5, GH 8 to 25 dGH and an inferred KH 10 to 25 dKH. Ordinary temperature advice centres on 23 to
      27 C; the warmer endpoint has less direct long-term aquarium support. Maintain oxygenation and make
      water changes without abrupt shifts."

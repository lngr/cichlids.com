  breeding:
    text: Suitable nests include enclosed rock cavities and empty snail shells. Aquarium accounts describe a
      female attending eggs inside the nest while a male defends the surrounding space. Wild
      shell-nesting populations also show female brood care within polygynous male territories. Courtship
      may be conspicuous while eggs remain hidden. Fine foods such as brine shrimp nauplii or microworms
      suit emerging young. The shell and cave reports explain the broad cave-spawner classification;
      neither nest type is the only one the species uses.
    sources:
      - kind: literature
        title: "Ota, Hori and Kohda, Changes in reproductive life-history strategies in response to nest density
          in a shell-brooding cichlid, Telmatochromis vittatus, 2011"

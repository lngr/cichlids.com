  sizeAndGrowth:
    text: "The adult aquarium estimate is about 9.5 cm total length for males and 8 cm for females. The
      female number is approximate because numerical maxima by sex are poorly established. FishBase lists
      8.6 cm total length, whereas the 8.5 cm Seriously Fish measurement excludes the tail. Larger
      rock-associated fish approach 10 cm in specialist accounts. A shell-associated form is reported
      near 6 cm. Allow developing fish separate retreats as differences in size and social status become
      pronounced."

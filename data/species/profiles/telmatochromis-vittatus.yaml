  socialBehavior:
    text: "Pair keeping is the default aquarium arrangement, but the species does not have one uniform mating
      system in nature. Field studies describe males associated with several shell-nesting females and
      alternative reproductive tactics. Shelter distribution matters in captivity: a crowded mixed
      breeding tank can leave a subordinate male injured, whereas a longer, more divided layout supports
      coexistence in one account. Watch courtship as well as male rivalry, and separate a fish that
      cannot leave cover or feed without pursuit."
    sources:
      - kind: database

    tolerance:
      value: &a6
        min: 23
        max: 29
      confidence: low
      rationale: "The tally retains 23 to 29 C with unanimous agreement under its 1 C endpoint allowance and
        low confidence. The generator proposes 23 to 30 C, checker-a 22 to 29 C, and checker-b and
        checker-c 23 to 29 C. The settled interval uses the central endpoints and contains the natural
        lake reference. Seriously Fish and Aquarium Life Support recommend 23 to 27 C; FishBase and DRTA
        give 24 to 26 C; Marquis keeps the fish at 24 C. The generator upper extension to 30 C and
        checker-a lower extension to 22 C lack direct long-term support. Equality with the natural
        reference here follows the tallied husbandry synthesis and containment requirement, rather than
        evidence of harm immediately outside it. Sustained keeping at the warm endpoint lacks a
        species-specific long-term trial. Gensou is inaccessible; its inherited search-result range is
        retained as unverified context."

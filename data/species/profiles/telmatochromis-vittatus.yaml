  sexing:
    text: "Mature males generally exceed females in size, but juveniles and similarly sized adults can be
      difficult to sex visually. Several husbandry accounts describe males as more slender, while the
      locality account is inconsistent about relative body shape. Size or outline alone is therefore a
      weak basis for selecting a pair. Observe several traits and the behaviour of mature fish. If
      partners form from juveniles, the adult tank needs enough space or separate housing for fish
      excluded by the pair."

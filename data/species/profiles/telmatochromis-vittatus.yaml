  problems:
    text: "Persistent social pressure can show as hiding, fading colour, missed feeding and damaged fins.
      Extra shelters help only if a subordinate fish can reach them safely; a failing social arrangement
      can require separation. Maintain stable alkaline water and avoid abrupt changes in buffering.
      Closely similar elongated Telmatochromis and the smaller shell-associated form make labels and size
      alone unreliable identification guides. The reported dickfeldi cross has no genetic parentage test,
      and that uncertainty belongs alongside the documented mixed-tank observation."
    sources:

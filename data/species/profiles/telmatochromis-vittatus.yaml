profile:
  overview:
    text: "A formed pair of Telmatochromis vittatus suits an aquarium with several sheltered nesting sites
      and space to move between them. This slender Tanganyika cichlid has dark horizontal markings and a
      subdued grey to brown body. It browses rock surfaces and also takes animal food, including eggs and
      very small young. Its small size conceals a capacity for persistent aggression toward rivals of its
      own species. Identification deserves care because other elongated Telmatochromis look similar."
    sources:

        accessed: 2026-10-15
        archived: doi.org/10.1007_s00114-011-0864-2/2026-10-15T103125Z
  diet:
    text: "Provide small prepared foods together with suitable frozen or live invertebrates and an algal or
      vegetable component. Natural feeding combines browsing of attached growth with animal material.
      Algal ingestion is supported by diet research, while brood-defence studies identify predation on
      eggs and larvae. Such raids justify caution around fry even though adult fish are not its principal
      prey. The profile records no established special bloat sensitivity. Feeding speed is an estimate,
      so check that quieter individuals obtain food when other species share the aquarium."

partners:
  suitable:
    - species: Cyprichromis leptosoma
      reason: Uses open water rather than the cave and rock edge used by the pair; it is documented in the same
        aquarium by a breeder.
      condition: Use a larger community aquarium meeting the open-water species own group and swimming-space needs.
    - species: Paracyprichromis nigripinnis
      reason: Occupies open water and was kept with T. vittatus in a species-specific breeder account.
      condition: "Provide a larger community tank with suitable social housing, swimming space and retreats for
        each species."
    - species: Neolamprologus multifasciatus
      reason: A small shell dweller can use a separate shell bed while the pair occupies rock caves; zone
        separation reduces direct competition.
      condition: Use a substantially larger tank with separated shell and rock areas; eggs and fry can be eaten.
  unsuitable:
    - species: Julidochromis dickfeldi
      reason: Marquis reports an offspring attributed to these two species from a mixed aquarium with
        conspecific partners available; identification is based on appearance and behaviour without
        genetic confirmation.
    - species: Cyphotilapia frontosa
      reason: A much larger fish can prey on or intimidate this small species and may take over its shelters.
    - species: Lepidiolamprologus elongatus
      reason: A larger piscivorous lamprologine can treat adult T. vittatus as prey and is likely to dominate
        its small territories.

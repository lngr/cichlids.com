  ghDgh:
    value:
      min: 2
      max: 7
    confidence: medium
    rationale: "The tally qualified majority retains 2 to 7 dGH, with four of six votes agreeing within
      the rubric threshold. Generator and checker-b proposed 2 to 7, checker-c 1.6 to 6.2 and
      tiebreaker-2 2 to 5; the dissenting checker-a proposed 3 to 15 and tiebreaker-1 1 to 18. JBL
      measured 2 dGH with juveniles present, and Anchique E1 total hardness converts to about 6.3 to
      7.0 dGH at 17.848 mg/L CaCO3 per degree. The selected envelope is narrower than Staeck's
      natural 5 to 18 dGH and the pooled regional 2.2 to 25.2 dGH; FAO also documents shallow El
      Prado water around 1.3 to 1.4 dGH. These wider and softer observations remain evidence. Staeck
      supplies no site-by-site hardness table, and the lower-basin survey pools modified habitats
      rather than tying each reading to this species. Conductivity is not converted into GH. The
      tally is retained with medium confidence as a planning summary, not a physiological boundary."

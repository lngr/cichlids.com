  origin:
    value:
      continent: South America
      region: "Magdalena, Cauca and Sinu basins in Colombia and the Limon drainage of the Maracaibo basin
        in Venezuela"
      waterbody: null
      localities:
        - Rio Cauca near Caceres
        - "Anchique River, station E1"
        - Rio Claro and an observed tributary
        - "Fonce River, Santander"
        - Rio Sinu
        - Rio Limon
    confidence: high
    rationale: "All four full runs describe the same Colombian and Venezuelan distribution, with
      different emphasis and locality lists. The Catalog of Fishes and FishBase establish the
      drainages; field papers and collecting accounts locate populations in the Magdalena system.
      The combined list preserves those documented localities. This is a river-distributed species,
      so no named-lake waterbody rule applies."

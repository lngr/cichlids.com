            aquarium; shared sand-sifting behavior did not prevent conflict.
        - species: Satanoperca daemon
          reason: Newman reports bullying by a male red hump in a large community aquarium.
        - species: Amatitlania nigrofasciata
          reason: Territorial bottom use and strong spawning defense make this an unfavorable inferred match.

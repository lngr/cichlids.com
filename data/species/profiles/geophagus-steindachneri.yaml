  temperatureC:
    value:
      min: 23
      max: 30
    confidence: low
    rationale: "The tally uses the median of all six natural-range proposals because no qualified
      majority exists. Generator and checker-b proposed 24 to 26 C, checker-a 22 to 30 C, checker-c
      20 to 30 C, tiebreaker-1 24 to 29 C and tiebreaker-2 20 to 31 C. Median lower and upper bounds
      give 23 to 30 C. Anchique E1 and JBL are locality-linked anchors, while FAO describes a wider
      Magdalena range of 20 to 30 C. The Fonce figure was read as approximately 20 to 25 C by
      tiebreaker-2; earlier runs could not recover its numbers from extracted text. The
      lower-Magdalena survey reports a wider pooled 25 to 36.1 C span and Canal del Dique mean of
      30.8 C, without linking each chemistry sample to this species. Those observations remain
      evidence rather than routine aquarium limits. The median is a plausible working range with low
      confidence, not an exhaustive thermal distribution; no tally replacement is made."

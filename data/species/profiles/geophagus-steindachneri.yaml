  husbandry:
    text: "For one male and three females, the starting minimum is about 243 L with a base measuring 120
      by 45 cm. Arrange cover so a female can leave the male's view without losing access to food.
      Fine sand supports normal feeding, while securely placed wood and stones create retreats.
      Maintain mature biological filtration and remove the fine debris released by sifting.
      Published aquarium tolerances are 20 to 30 C, pH 6.0 to 8.1, GH 2 to 14 and KH 0 to 13; the
      hardness endpoints are particularly uncertain. Favor stable conditions within those ranges and
      retain suitable buffering rather than trying to reproduce a zero field-test reading."

    tolerance:
      value:
        min: 2
        max: 14
      confidence: low
      rationale: "No qualified majority exists among six tolerance votes, so the tally uses the rounded
        median of minima and maxima: 2 to 14 dGH, with low confidence. Generator, checker-b and
        tiebreaker-2 proposed 2 to 12, checker-a 2 to 15, checker-c 1.6 to 15 and tiebreaker-1 1 to
        18. The median maximum is 13.5 before whole-degree rounding. Seriously Fish recommends 2 to
        12, FishBase and the repeated general hobby account 5 to 15, and Staeck a wider 5 to 18. The
        selected range is narrower than those 15 and 18 dGH upper limits and excludes some softer
        native observations; all such evidence remains. Staeck's simultaneously stated conductivity
        of 50 to 270 uS/cm makes the high GH and KH endpoints internally questionable, and none of
        these sources supplies controlled multiyear endpoints. Keeper readings of 8 and 10 dGH are
        individual observations. The tally is retained and contains the natural 2 to 7 range."

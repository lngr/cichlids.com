    rationale: "The component medians of the four proposals give 243 L, 120 cm length and 45 cm depth.
      Generator and checker-b proposed 243 L, checker-a rounded to 240 L and checker-c to 250 L; all
      proposed the same footprint. Seriously Fish explicitly supplies approximately 243 L and a 120
      by 45 cm base, so the unrounded source figure is retained. Tropical Freshwater Fish and
      Mongabay give about 190 L and 122 cm, while Fish Laboratory's about 189 L is for a single fish
      and about 473 L is for multiple males; the archive's roughly 114 L lacks a defined adult unit.
      Staeck gives only a length a little over one meter. The decided minimum concerns one male with
      three females and shelter, not several adult males or additional territorial bottom fish.
      Confidence is medium."

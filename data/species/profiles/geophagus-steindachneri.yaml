  diet:
    text: Use small foods distributed where subordinate fish can reach them. This omnivore takes
      invertebrates and detrital or plant material; the wild feeding sample is small and does not
      establish every possible prey item. Complete sinking foods can be complemented with
      appropriately sized invertebrates. Predation level 0 allows incidental loss of fry but does
      not encode routine capture of small fish. The absence of a special bloat-sensitive flag
      supports a varied diet and does not excuse poor water quality or excessive feeding.

partners:
  suitable:
    - species: Hyphessobrycon columbianus
      reason: An adult deep-bodied open-water shoal can avoid direct competition for the breeding area.
      condition: "Inferred companion, not a documented pairing; provide a full shoal and additional space
        beyond the harem minimum."
    - species: Moenkhausia pittieri
      reason: Adult diamond tetras fit the general open-water companion category.
      condition: "Inferred companion, not a documented pairing; provide a proper shoal and check feeding
        access and breeding displacement."
    - species: Gymnocorymbus ternetzi
      reason: Adults are comparatively robust schooling fish that use the water column.
      condition: "Inferred companion, not a documented pairing; allow additional room and monitor fin
        nipping."
  unsuitable:
    - species: Geophagus surinamensis
      reason: Newman reports a male red hump bullying adult fish identified by this name in a large
        aquarium; shared sand-sifting behavior did not prevent conflict.
    - species: Satanoperca daemon
      reason: Newman reports bullying by a male red hump in a large community aquarium.
    - species: Amatitlania nigrofasciata
      reason: Territorial bottom use and strong spawning defense make this an unfavorable inferred match.
        A short legacy mixed-tank report does not establish long-term compatibility.
profile:
  overview:
    text: "The red hump eartheater is a sand-browsing cichlid whose adult male can dominate a home
      aquarium despite its unhurried feeding behavior. Plan for one male and three females, with
      space to retreat and provision for separating a persistently harassed fish. The accepted name
      is Geophagus steindachneri; Geophagus steindacheri in the legacy catalog is a misspelling. Its
      native distribution includes Colombia's Magdalena system and neighboring drainages, extending
      into the Limon basin of Venezuela. Female mouthbrooding and the male's changing head shape are
      characteristic features."
    sources:
      - kind: catalog-of-fishes
        title: "Eschmeyer's Catalog of Fishes: Geophagus species"

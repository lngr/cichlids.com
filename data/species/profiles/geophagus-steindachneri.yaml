    - field: features.aggressionHeterospecific
      proposals:
        - by: generator
          value: 2
        - by: checker-a
          value: 1
        - by: checker-b
          value: 3
        - by: checker-c
          value: 2
      decision: 2
      rationale: "Generator and checker-c proposed 2, checker-a 1 and checker-b 3. Level 2 is retained for
        territorial displacement in an aquarium meeting the recommended space and social unit.
        Newman's firsthand report of bullying adult eartheaters is more informative than generic
        peaceful labels, but does not specify that attacks extended beyond the territory, as level 3
        requires. Staeck's milder observations also limit a universal level-3 assignment. The
        evidence therefore supports territorial chasing with medium confidence while documenting
        unusually difficult males."
    - field: features.territory
      proposals:
        - by: generator
          value:
            size: large
            breedingOnly: false
        - by: checker-a
          value:
            size: small
            breedingOnly: true
        - by: checker-b
          value:
            size: large
            breedingOnly: false
        - by: checker-c
          value:
            size: large
            breedingOnly: true
      decision:
        size: large
        breedingOnly: true
      rationale: "Generator and checker-b proposed large with breedingOnly false, checker-a small with
        breedingOnly true and checker-c large with breedingOnly true. Large reflects exclusion of
        rivals and the space needed to establish separate retreats; no source measures the defended
        area. Staeck explicitly associates aquarium territoriality with the period immediately
        before spawning, and the field reproductive account describes guarding a nest. Those
        observations support breedingOnly true over an inference of permanent aquarium territorial
        defense. Wild territorial observations remain relevant context, and a breeding period can be
        prolonged. Confidence stays medium because the spatial category is inferred."

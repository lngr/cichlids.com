    rationale: "The median of the four proposals is 18 cm for males and 13 cm for females; all proposed
      those values. Newman reports about 13.5 and 10 cm standard length, while Seriously Fish gives
      15 cm standard length without a sex-specific total-length series. Allowing for the caudal fin
      makes the adopted aquarium planning values approximate. Fish Laboratory gives about 15.2 and
      12.7 cm aquarium lengths, FishBase records 19.8 cm total length and Staeck describes males
      around or exceeding 20 cm, including wild observations. The decided figures summarize
      well-grown aquarium adults rather than the largest possible specimens; the sex-specific
      conversion keeps confidence medium."

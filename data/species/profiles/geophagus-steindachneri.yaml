  territory:
    value:
      size: large
      breedingOnly: true
    confidence: medium
    rationale: "Generator and checker-b proposed large with breedingOnly false, checker-a small with
      breedingOnly true and checker-c large with breedingOnly true. Large reflects exclusion of
      rivals and the space needed to establish separate retreats; no source measures the defended
      area. Staeck explicitly associates aquarium territoriality with the period immediately before
      spawning, and the field reproductive account describes guarding a nest. Those observations
      support breedingOnly true over an inference of permanent aquarium territorial defense. Wild
      territorial observations remain relevant context, and a breeding period can be prolonged.
      Confidence stays medium because the spatial category is inferred."

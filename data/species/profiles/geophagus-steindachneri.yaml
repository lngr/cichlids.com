      - sand
      - wood
      - rock
    confidence: high
    rationale: "All four runs agree on sand, wood and rock as a set; the order differs only in
      presentation. Sand provides the feeding substrate, while rocks, roots and branches structure
      shelter and breeding sites. These requirements are supported by occupied river habitat and
      independent husbandry descriptions. Planting is optional decoration rather than a demonstrated
      required habitat zone. Agreement supported by multiple accounts gives high confidence."

  compatibility:
    text: "Species-only keeping is optional. Adult open-water characins offer the clearest general
      companion category, provided the aquarium has additional room and all fish retain access to
      food. The named suitable partners are inferred examples rather than tested combinations.
      Newman's account of a male bullying other adult eartheaters shows why similar feeding behavior
      does not guarantee coexistence. The inherited warning about routine predation on small fish is
      not supported by the decided level 0; breeding defense can still displace delicate companions.
      No supported hybrid group currently includes this species, although that does not demonstrate
      that crosses are impossible."

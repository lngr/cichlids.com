  sexing:
    text: "A mature male is usually larger, with a reddish head swelling and extended unpaired fins.
      Staeck describes hump prominence as related to social rank, so it is a poor sole criterion in
      juveniles or subordinate fish. Female coloration is generally less conspicuous. Reflective
      scales and variable dark markings occur alongside the male hump, with appearance affected by
      locality and reproductive condition. Allow uncertain juveniles to develop before treating an
      apparent sex ratio as reliable."

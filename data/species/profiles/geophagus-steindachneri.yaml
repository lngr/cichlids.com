    tolerance:
      value:
        min: 6
        max: 8.1
      confidence: medium
      rationale: "Generator proposed 6.0 to 7.7, checker-a 6.0 to 8.1, checker-b 6.0 to 8.0 and checker-c
        6.0 to 8.3. The tally counts these as unanimous under the 0.3 agreement threshold around its
        leading candidate and gives their rounded median of 6.0 to 8.1, with medium confidence.
        Seriously Fish supports the 6.0 lower boundary but recommends an upper value of 7.5;
        measured occupied water around 7.68 and the broader field accounts support extension. The
        decision is narrower than the captive breeder's 5.0 to 8.0 at the lower end, Staeck's 7.0 to
        8.5 at the upper end and FAO's regional 6.5 to 8.3 at the upper end. These ranges stay
        cited, with no claim that 8.1 is a tested chronic cutoff. The tolerance contains the natural
        6.9 to 7.9 range."

    - name: Geophagus magdalena
  legacyNames:
    - Geophagus steindacheri
  note: "The Catalog of Fishes accepts Geophagus steindachneri Eigenmann & Hildebrand, 1910. Its
    account distinguishes the available 1910 name from the more detailed 1922 publication used by
    FishBase and several papers. Geophagus hondae and Geophagus magdalena are synonyms; G.
    pellegrini is a separate species despite older hobby lists treating it as a synonym. The legacy
    name Geophagus steindacheri is a spelling error. The lineage remains under Geophagus in the
    catalog while its generic placement is discussed."

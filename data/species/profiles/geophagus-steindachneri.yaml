  breeding:
    value: maternal-mouthbrooder
    confidence: high
    rationale: All four full runs agree on maternal mouthbrooding. The field reproductive study and
      multiple aquarium accounts document immediate collection of eggs and female-only oral care;
      the brief association with a male does not make this a stable pair or substrate-guarding
      strategy. Differences in the reported incubation duration reflect husbandry and temperature
      and do not alter the breeding category. Confidence is high.

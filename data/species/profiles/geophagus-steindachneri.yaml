  breeding:
    text: "The female collects newly laid eggs and performs the oral incubation and subsequent care. The
      male may spawn with other females instead of remaining a parental partner. Reports put initial
      release roughly 10 to 21 days after spawning, depending on conditions; Newman observed about
      twelve days at 28 C, whereas field observations describe a longer brooding period. Young can
      continue to return to the mother for shelter. Small live foods and clean water support fry
      development. Protect a brooding female from renewed male pursuit and assess whether she needs
      a separate quiet aquarium."

  problems:
    text: "The most consequential problems are exclusion from food, prolonged reproductive harassment
      and deteriorating water quality. A sand sifter can release debris that has accumulated below
      the visible surface, so effective mechanical maintenance matters. Coarse or sharp substrate is
      unsuitable for repeated mouthfuls of browsing. Staeck's relatively mild aggression
      observations and Newman's difficult cases show why watching the actual fish is essential.
      Persistent hiding, injury or altered feeding should prompt a review of both the social
      arrangement and aquarium conditions."

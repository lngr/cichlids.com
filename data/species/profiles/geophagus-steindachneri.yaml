  socialBehavior:
    text: "Repeated pursuit of rival males and unreceptive females warrants conspecific aggression level
      3. A female-biased harem distributes attention but cannot ensure that every individual remains
      accepted. Brooding females may also protect a retreat. Accounts differ over how persistent
      territoriality becomes: Staeck associates aquarium defense principally with spawning, while
      Newman describes difficult adult males in community settings. The profile therefore assigns a
      large breeding territory and heterospecific aggression level 2, with the more severe reported
      cases retained as a caution when evaluating an individual fish."

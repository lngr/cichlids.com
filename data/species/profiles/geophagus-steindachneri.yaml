    tolerance:
      value:
        min: 0
        max: 13
      confidence: low
      rationale: "No qualified majority exists among six tolerance votes, so the tally uses the median
        range of 0 to 13 dKH with low confidence. Generator proposed 0 to 9, checker-a 1 to 10,
        checker-b 0 to 15, checker-c 1 to 8, tiebreaker-1 0 to 18 and tiebreaker-2 0 to 15. Median
        endpoints are 0 and 12.5 before whole-degree rounding. The decision is narrower than the
        breeder's 2 to 15, Fishkeeper's stated KH up to 15 and Staeck's 5 to 18; all remain
        evidence. Fishkeeper's hardness label is ambiguous and Staeck's accompanying conductivity is
        inconsistent with the harder endpoints. Keeper readings of 7 and 8 dKH establish occurrence
        in aquaria, not years of health at the limits. The zero boundary contains JBL's
        below-resolution natural reading without requiring deliberate absence of buffering. The
        range contains the decided natural 0 to 7; its upper endpoint remains a provisional
        synthesis rather than a measured tolerance."

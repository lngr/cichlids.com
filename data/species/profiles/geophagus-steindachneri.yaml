      proposed 0 to 8.4, checker-a 1 to 4, checker-b 0 to 9, checker-c 1.7 to 5.9 and tiebreaker-2 0
      to 4. The median upper endpoint is 7.15 before whole-degree rounding. JBL's occupied tributary
      KH reading of zero is below field-test resolution. Anchique E1 bicarbonate values of 162.4 to
      182 conditionally convert to about 7.5 to 8.4 dKH if they are mg/L HCO3; the missing
      concentration unit prevents a confident conversion, and CaCO3 equivalents would instead imply
      roughly 9.1 to 10.2 dKH. The decision is narrower than that conditional site range and pooled
      floodplain alkalinity equivalent to about 0.03 to 13.11 dKH. Tocagua means of 8.68 to 13.45
      dKH describe a stressed regional lake without confirmed species-specific occurrence in that
      study. FAO's river alkalinity of about 1.74 to 5.88 dKH and lower-basin flowing-water readings
      supply additional context. KH is not derived from GH or conductivity. The tally value is
      preserved without a natural verification object, and the source uncertainty remains explicit."

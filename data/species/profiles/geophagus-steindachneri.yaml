  habitat:
    text: "Recorded populations occupy river channels and tributaries, including sandy areas within
      fast-flowing rivers. Habitat measurements vary with locality and season. JBL observed
      juveniles at 24.1 C, pH 7.2, GH 2 and a KH test reading of zero; Anchique E1 had 24 to 26 C,
      pH 7.62 to 7.68 and about 6.3 to 7 dGH. Its bicarbonate data have an unresolved unit
      ambiguity. The profile's natural ranges of 23 to 30 C, pH 6.9 to 7.9, GH 2 to 7 and KH 0 to 7
      summarize the adjudicated votes rather than every occupied locality. Broader regional studies
      include floodplain excursions to 36.1 C and pH 11.6, and stressed Tocagua water with mean pH
      4.55 and alkalinity equivalent to roughly 8.7 to 13.4 dKH; these readings are not individually
      linked to this species and do not define normal holding conditions."

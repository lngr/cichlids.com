    rationale: "Generator and checker-c proposed 2, checker-a 1 and checker-b 3. Level 2 is retained for
      territorial displacement in an aquarium meeting the recommended space and social unit.
      Newman's firsthand report of bullying adult eartheaters is more informative than generic
      peaceful labels, but does not specify that attacks extended beyond the territory, as level 3
      requires. Staeck's milder observations also limit a universal level-3 assignment. The evidence
      therefore supports territorial chasing with medium confidence while documenting unusually
      difficult males."

  aggressionConspecific:
    value: 3
    confidence: medium
    rationale: "All four runs proposed level 3. Newman's observed prolonged pursuit of unreceptive
      females, including severe injury under unsuitable introductions, and the specialist
      recommendation for several females support that level. Staeck instead describes usually
      harmless ritualized contests in adequately spacious structured aquaria. That milder
      independent account stays in evidence; temperament, breeding state and arrangement explain
      some variation. Level 3 describes the persistent pursuit risk, with medium confidence rather
      than treating every male as equally aggressive."

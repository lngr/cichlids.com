    tolerance:
      value:
        min: 20
        max: 30
      confidence: medium
      rationale: "All four full runs proposed 20 to 30 C and the tally verifies this tolerance unanimously
        with medium confidence. Seriously Fish and Staeck independently recommend the same range;
        Fishkeeper gives 22 to 28 C, Fish Laboratory about 22.2 to 27.8 C and FishBase 24 to 26 C.
        Newman observed brood development at 28 C. Those narrower recommendations remain evidence.
        The envelope contains the decided natural 23 to 30 C range, but published endpoints are
        husbandry recommendations rather than controlled multiyear physiological limits."

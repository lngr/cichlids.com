  ph:
    value:
      min: 6.9
      max: 7.9
    confidence: low
    rationale: "The tally median is 6.9 to 7.9. Generator and checker-b proposed 7.2 to 7.7, checker-a
      6.7 to 8.1, checker-c 6.5 to 8.3, tiebreaker-1 7.0 to 8.3 and tiebreaker-2 6.7 to 7.7. Median
      endpoints are rounded to one decimal. JBL and Anchique supply directly occupied-site values;
      Fonce adds seasonal figure estimates. The decision is narrower than Staeck's reported natural
      7.0 to 8.3 and the FAO combined Magdalena-Cauca 6.5 to 8.3, which remain cited. The floodplain
      survey reaches 5.4 to 11.6 and FAO includes Sinu readings to 9.1, but those broad regional
      readings do not establish typical individual capture conditions. FishBase's 6.5 to 7.0 cites
      aquarium reference 1672 and does not override direct field measurements. Limited locality
      coverage and divergent proposals keep confidence low; the plausible tally range is retained."

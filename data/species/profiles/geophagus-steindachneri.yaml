  social:
    value:
      structure: harem
      ratio: 3
    confidence: high
    rationale: "All four runs propose a harem with three females per male. Detailed breeding
      observations describe one male spawning successively with different females, and Seriously
      Fish explicitly recommends at least three females. CRC's brief monogamous label and the
      automated pair summary on Seriously Fish conflict with those detailed observations; they
      remain evidence but do not establish a lasting parental pair. The breeder's four-fish group
      and Fish Laboratory's two-female ratio are less specific or provide less dispersal of pursuit.
      Use one male and three females, with high confidence in the structure and the practical
      ratio."
    sources:

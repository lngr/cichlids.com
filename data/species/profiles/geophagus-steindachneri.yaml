  sizeAndGrowth:
    text: "Use approximate adult aquarium planning lengths of 18 cm for a male and 13 cm for a female.
      Those figures include the tail, whereas some published measurements are standard lengths.
      Staeck reports males around or above 20 cm, including wild observations, so the planning sizes
      are not absolute ceilings. Early sexual maturity does not mean that growth has finished. The 8
      to 10 year lifespan remains a weakly supported care-guide estimate rather than a result from
      known-age fish."

        \ evidence below is clearly labelled as natural measurements. Confidence therefore remains low. Proposals:\
        \ generator {\"min\": 1.9, \"max\": 25}; checker-a {\"min\": 1, \"max\": 16}; checker-b {\"min\": 1.4,\
        \ \"max\": 25}; checker-c {\"min\": 1.4, \"max\": 15}; tiebreaker-1 {\"min\": 1.9, \"max\": 25}; tiebreaker-2\
        \ {\"min\": 1.9, \"max\": 25}. The recorded tally method is qualified-majority."

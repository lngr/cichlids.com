    - field: features.feedingSpeed
      proposals:
        - by: generator
          value: hasty
        - by: checker-a
          value: hasty
        - by: checker-b
          value: normal
        - by: checker-c
          value: hasty
      decision: normal
      rationale: "Generator, checker-a and checker-c propose hasty from appetite, short meal windows and feeding\
        \ strikes; checker-b proposes normal. The Nordic species register directly describes cautious feeding\
        \ and lack of indiscriminate gulping. This addresses the rubric more directly than generic statements\
        \ that the fish eats eagerly or produces much waste. AquariumDomain recommends food consumed within\
        \ a minute or two, but does not demonstrate that it outcompetes tankmates and eats until nothing remains.\
        \ Select normal with medium confidence; no comparative feeding-speed trial was found."

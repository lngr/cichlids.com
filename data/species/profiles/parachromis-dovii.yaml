        accessed: "2026-10-13"
  husbandry:
    text: "Plan a permanent enclosure around one adult. This profile selects a 350 by 80 cm footprint with\
      \ 80 cm height, about 2240 litres gross, from published adult housing guidance. Usable swimming space\
      \ will be smaller after decor and equipment, and unusually large individuals need more. Anchor rocks\
      \ and wood securely against digging, preserve open swimming space, protect equipment and cover the tank.\
      \ Strong biological filtration, oxygenation and frequent maintenance must handle a large animal-food\
      \ eater. Routine water around 24 to 28 C and pH 7 to 8 has stronger care support than the outer tolerance\
      \ bounds. The footprint is a single-adult recommendation and does not guarantee that a pair or mixed\
      \ display will remain safe."
    sources:
      - kind: literature
        title: "Beerlink, R.: Parachromis dovii. Nederlandse Vereniging van Cichlidenliefhebbers species article"
        url: "https://www.nvcweb.nl/visbeschrijvingen/midden-amerika/parachromis-dovii-g%C3%BCnther-1864"

  socialBehavior:
    text: "A single adult is the safest recommended arrangement. Wolf cichlids form breeding pairs, but placing\
      \ a male and female together does not establish compatibility. A male can attack a female that is not\
      \ receptive, including one with which he has already spawned. Two adult males are particularly unsuitable\
      \ companions. Fish too large to eat can still be injured through territorial attacks. Watch whether each\
      \ fish can rest and feed without pursuit, and separate before injuries accumulate. A removable divider\
      \ and a genuinely usable alternative enclosure are essential for any pairing attempt. Breeding often\
      \ increases aggression enough to invalidate an arrangement that previously appeared workable."
    sources:
      - kind: website
        title: "Maidenhead Aquatics Fishkeeper: Wolf Cichlid, Parachromis dovii"
        url: "https://www.fishkeeper.co.uk/fish/freshwater/cichlids/wolf-cichlid"

  habitat:
    text: "The main native range spans Honduras, Nicaragua and Costa Rica on both Atlantic and Pacific slopes;\
      \ the Catalog also lists El Salvador. Lakes, river valleys, rocky cover, submerged trunks and vegetated\
      \ margins provide different hunting and refuge settings. Their measured chemistry varies greatly: Hule\
      \ is very soft, while Managua has moderate calcium-magnesium hardness and much higher carbonate alkalinity.\
      \ The natural profile ranges are adjudicated summaries rather than the complete union of all site observations.\
      \ Surface pH samples as low as 5.75 and as high as 9.3 lie beyond the selected 6.2 to 8.9 median interval.\
      \ No single lake table applies, and deep anoxic water should not be treated as an aquarium habitat target."
    sources:
      - kind: literature
        title: "Tabash, F. A. and Guadamuz, E. (2000). A management plan for the sport fishery of Parachromis\
          \ dovii in Hule lake, Costa Rica. Revista de Biologia Tropical 48, 473-485."
        url: "https://doi.org/10.15517/rbt.v48i2-3.18816"
        archived: doi.org/10.15517_rbt.v48i2-3.18816/2026-10-13T134927Z

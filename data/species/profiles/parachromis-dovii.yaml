  breeding:
    text: "An established pair cleans a firm laying surface and protects the eggs and developing young. Adults\
      \ may produce hundreds to more than a thousand offspring in one spawning. Hatching commonly takes roughly\
      \ three to five days, followed by a period in a pit before the young swim freely. Timing varies with\
      \ conditions, so observe development rather than relying on a fixed calendar. Newly free-swimming fry\
      \ can take suitably small foods such as freshly hatched Artemia. Organise grow-out space and eventual\
      \ homes before allowing reproduction. Keep separation equipment ready for the adults, because courtship,\
      \ brood defence and a new spawning attempt can expose the female to dangerous attacks."
    sources:
      - kind: website
        title: "Maidenhead Aquatics Fishkeeper: Wolf Cichlid, Parachromis dovii"
        url: "https://www.fishkeeper.co.uk/fish/freshwater/cichlids/wolf-cichlid"

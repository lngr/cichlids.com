    - field: features.maxSizeCm
      proposals:
        - by: generator
          value:
            male: 60
            female: 40
        - by: checker-a
          value:
            male: 60
            female: 45
        - by: checker-b
          value:
            male: 70
            female: 40
        - by: checker-c
          value:
            male: 60
            female: 40
      decision:
        male: 70
        female: 40
      rationale: "Generator and checker-c propose male 60 and female 40 cm, checker-a 60 and 45, and checker-b\
        \ 70 and 40. Select 70 and 40 as rounded upper planning sizes of well-kept aquarium adults: AquaInfo\
        \ gives about 70 and 38 cm, AquariumDomain about 71.1 and 40.6, and FishFish explicitly gives 70 and\
        \ 40. The lower male estimates lack a sex-specific captive series showing that 60 is the typical ceiling.\
        \ FishBase 72 cm is male or unsexed maximum length, not both-sex aquarium evidence. Wider source estimates\
        \ include Aquatic Community male 71.1 to 76.2 and female 38.1 to 45.7 cm, and Practical Fishkeeping\
        \ 76 and 60 with no direct full-grown experience. These are approximate planning values, not proven\
        \ percentiles or growth limits."

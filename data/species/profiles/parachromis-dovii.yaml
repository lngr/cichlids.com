      \ dataset surface codes S actually include pH 5.75 to 6.55, so 5.75 is a measured sample rather than\
      \ a mean minus one standard deviation. Swain measured surface pH as high as 9.3 at Managua, and ILEC\
      \ reports surface seasonal means 9.18 to 9.26. These wider observations are retained as evidence but\
      \ do not change the mandatory median decision. Cabassi gives upper-layer Hule values 6.3 to 7.0; FAO\
      \ gives Nicaragua 7.0 and Managua 8.7. Pooled seasonal means and sediment or anoxic deep-water readings\

  sizeAndGrowth:
    text: "A large male can require planning for about 70 cm, with females around 40 cm. These rounded aquarium\
      \ planning maxima reflect sex-specific care accounts; exceptionally large fish can exceed them. The often-repeated\
      \ 72 cm species maximum does not establish a normal female size. Growth continues after sexual maturity,\
      \ so spawning juveniles still need their permanent adult housing. Restricted growth in cramped or poor\
      \ conditions should not be used to control size."
    sources:
      - kind: database
        title: "Aqua-Fish.Net: Wolf cichlid care guide"

      rationale: "The tally selects 21 to 31 C by qualified majority, four of six votes. FishProfiles and Aquariophilie.org\
        \ each state the wider 21 to 35 C; FishBase and Akvaforum list 21 to 37 C, which is not accepted as\
        \ years-long aquarium advice. Israquarium gives 22 to 32 C and reports poorer condition below 22 C.\
        \ Most care recommendations cluster near 24 to 28 C or 23.3 to 28.9 C. The endpoint evidence is weak\
        \ and short culture trials cannot establish lifetime health, so confidence remains low. Proposals:\
        \ generator {\"min\": 23, \"max\": 30}; checker-a {\"min\": 21, \"max\": 35}; checker-b {\"min\": 21,\
        \ \"max\": 31}; checker-c {\"min\": 21, \"max\": 31}; tiebreaker-1 {\"min\": 21, \"max\": 32}; tiebreaker-2\
        \ {\"min\": 22, \"max\": 30}."

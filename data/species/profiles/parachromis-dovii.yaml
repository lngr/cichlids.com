        title: "Beerlink, R.: Parachromis dovii. Nederlandse Vereniging van Cichlidenliefhebbers species article"
        url: "https://www.nvcweb.nl/visbeschrijvingen/midden-amerika/parachromis-dovii-g%C3%BCnther-1864"
        archived: nvcweb.nl/visbeschrijvingen/midden-amerika/parachromis-dovii-g_nther-1864/2026-10-14T102113Z
        accessed: "2026-10-13"

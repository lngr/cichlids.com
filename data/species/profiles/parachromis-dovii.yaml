  temperatureC:
    value:
      min: 23
      max: 31
    confidence: low
    rationale: "The tally selects the median of all six proposed lower and upper bounds, rounded to whole degrees,\
      \ because no four-vote agreement settled the natural range. The resulting 23 to 31 C is a summary of\
      \ the proposals, not the union of measured extremes. Cabassi measured 21.1 to 24.1 C in Hule above its\
      \ anoxic bottom; the drone survey measured 30.2 C near the surface; FAO gives Managua 26 to 30 C. The\
      \ wider Tipitapa measurements are 28.5 to 32.4 C, and FishBase lists an even wider 21 to 37 C without\
      \ station context. Both extend beyond the decided interval and remain visible in evidence. Sampling does\
      \ not define lifetime aquarium limits. Proposals: generator {\"min\": 24, \"max\": 30}; checker-a {\"\
      min\": 21, \"max\": 32}; checker-b {\"min\": 21, \"max\": 31}; checker-c {\"min\": 24, \"max\": 30.2};\
      \ tiebreaker-1 {\"min\": 21, \"max\": 31}; tiebreaker-2 {\"min\": 24, \"max\": 30}."

  problems:
    text: "The most consequential mistake is buying juveniles without a permanent adult enclosure. Other recurring\
      \ problems include partner injury, damaged equipment, collapsing decor, excessive feeding and waste accumulation.\
      \ A complete diet and sound maintenance reduce risks, but neither stops territorial attacks. Do not use\
      \ the wide recorded environmental temperature range as a reason to run a tank near extreme heat. The\
      \ outer pH, GH and especially KH tolerances have uncertain long-term captive support. Poor appetite,\
      \ wounds, abnormal breathing or abdominal swelling warrant checking water quality and social pressure\
      \ promptly. Isolate threatened fish safely and seek qualified help for persistent illness; similar signs\
      \ can have different causes."
    sources:
      - kind: website
        title: "Maidenhead Aquatics Fishkeeper: Wolf Cichlid, Parachromis dovii"

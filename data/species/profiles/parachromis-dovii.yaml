partners:
  suitable: []
  unsuitable:
    - species: Poecilia gillii
      reason: "A documented native prey fish, far too small to coexist safely with an adult wolf cichlid."
    - species: Amatitlania nigrofasciata
      reason: Adult size and defensive behaviour do not protect a small convict cichlid from a large dovii
        predator.
    - species: Parachromis managuensis
      reason: Adult territorial rivalry and the tally-decided presumed crossing risk make routine shared housing
        unsuitable.
    - species: Chromobotia macracanthus
      reason: Juveniles are prey-sized and adults remain exposed to aggression; the archive contains a loss
        associated with a dovii pair.
profile:
  overview:
    text: "Keeping a wolf cichlid means planning around one large predator for many years. The small juvenile\
      \ in a shop can become a powerful adult that needs a custom-sized enclosure and regular attention. Its\
      \ appeal comes from its striking adult colour, active hunting and strong response to its surroundings.\
      \ The name Parachromis dovii remains valid in the Catalog of Fishes. Older books may use Heros, Cichlasoma\
      \ or Nandopsis for the same species. Guapote and rainbow bass are regional or trade names, not evidence\
      \ that it belongs to the bass family. Treat it as a demanding specialist fish with a substantial adult\
      \ footprint."
    sources:
      - kind: catalog-of-fishes
        title: "Eschmeyer's Catalog of Fishes: species of Parachromis, updated 21 September 2026"
        url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Parachromis"
        archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-251c79f3/2026-10-14T101709Z

          \ dovii in Hule lake, Costa Rica. Revista de Biologia Tropical 48, 473-485."
        url: "https://doi.org/10.15517/rbt.v48i2-3.18816"
        archived: doi.org/10.15517_rbt.v48i2-3.18816/2026-10-13T134927Z
        accessed: "2026-10-13"
  sexing:
    text: "Adult males generally become larger and more colourful than females. They often show stronger blue-green\
      \ reflective colour and spotting around the head and flanks, together with longer fin extensions. Females\
      \ tend toward a yellow background and more conspicuous dark lateral markings. These differences become\
      \ more useful as fish mature; juvenile colour alone can lead to mistakes. A forehead swelling is variable\
      \ and should not be used as a sole sex character. Red and gold morphs also change the usefulness of colour\
      \ cues. Confirm sex through several adult traits and, where necessary, experienced assessment rather\
      \ than buying two juveniles solely on their appearance."
    sources:
      - kind: literature

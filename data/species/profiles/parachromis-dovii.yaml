        - plants
      rationale: "Generator and checker-b include rock, sand, openWater, wood and plants; checker-a includes\
        \ only rock, sand and wood; checker-c additionally includes openWater but omits plants. Keep all five\
        \ because the field account identifies vegetated bays and fallen trunks as used habitats, the Hule\
        \ fauna study confirms association with marginal vegetation, and adults hunt away from cover. Sand\
        \ represents a suitable digging substrate rather than an exclusive natural bottom type. Plants describe\
        \ an occupied habitat zone; they need not be live planted decor in every aquarium and are often uprooted."
    - field: features.social
      proposals:
        - by: generator
          value:
            structure: solitary
        - by: checker-a
          value:
            structure: pair
        - by: checker-b
          value:
            structure: pair
        - by: checker-c
          value:
            structure: pair
      decision:
        structure: solitary
      rationale: "Generator proposes solitary housing; checker-a, checker-b and checker-c propose pair based\
        \ mainly on reproduction or compatible specialist pairs. Fishkeeper and Aquatic Community explicitly\
        \ prefer one adult, while Beerlink describes partner and mixed-tank failures even in very large installations.\
        \ Choose solitary as the routine recommended adult unit. Natural monogamy and shared brood care remain\
        \ true and are verified by CRC, but do not guarantee that a male and female can safely stay together.\
        \ A compatible pair is a demanding alternative needing separation and housing beyond the single-adult\
        \ minimum."

      - kind: archive
        title: cichlids.com forum thread 359
        url: "https://www.cichlids.com/disc/read.php?1,359"
        accessed: "2026-10-13"
  diet:
    text: "Build the captive diet around a complete food made for large carnivorous cichlids. Adjust pellet\
      \ size as the fish grows, and add appropriate aquatic foods and earthworms for variety. Its wild diet\
      \ contains other fish as well as insects and crustaceans, so a plant-only ration is unsuitable. Live\
      \ feeder fish are unnecessary and can introduce pathogens; being a predator does not create a requirement\
      \ for live vertebrate prey. Avoid using mammal meat as the routine foundation of feeding. Give portions\
      \ that leave little waste and judge body condition instead of continuing to feed whenever the fish approaches\
      \ the glass. Uneaten rich food quickly adds to the already substantial filtration burden."
    sources:
      - kind: literature
        title: "Tabash, F. A. and Guadamuz, E. (2000). A management plan for the sport fishery of Parachromis\
          \ dovii in Hule lake, Costa Rica. Revista de Biologia Tropical 48, 473-485."

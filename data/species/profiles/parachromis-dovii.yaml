  compatibility:
    text: "Routine housing is a dedicated tank for one adult. Mouth-sized fish are prey and similar-sized fish\
      \ can suffer serious territorial injury. Some care accounts mention large armoured catfish or arowanas\
      \ for exceptional installations, but no species-specific pairing is endorsed here as reliably suitable.\
      \ Previous success with juveniles can disappear at maturity or spawning. The eight listed crossing groups\
      \ are separate presumed pairs with named reported partners, rather than an all-to-all genus group. Seven\
      \ depend on unverified gallery labels; the jaguar pair also has an aquarium offspring report without\
      \ a female dovii being available. Those reports do not establish free-choice crossing frequency, verified\
      \ pedigree or crosses with every ancestor of Flowerhorn."

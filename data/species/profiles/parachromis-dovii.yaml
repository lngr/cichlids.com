  minTank:
    value:
      volumeL: 2240
      lengthCm: 350
      depthCm: 80
    confidence: medium
    rationale: "Generator proposes 1500 L with 300 by 100 cm for one fish; checker-a 1900 L with 300 by 80\
      \ cm for a pair; checker-b 1500 L with 250 by 100 cm for a pair; checker-c 2240 L with 350 by 80 cm.\
      \ Select the explicit Dutch AquaInfo adult guideline of 350 by 80 by 80 cm, nominal gross volume 2240\
      \ L, for the recommended single adult. Depth means front-to-back width. This has a published footprint\
      \ rather than an inferred dimension combination. AquariumDomain gives 681 L for an adult and 833 to 1363\
      \ L for larger fish or pairs; Nordic guidance gives 200 cm and 1200 L for a pair. Aquariophilie.org gives\
      \ the wider 300 by 100 by 100 cm and 3000 L for two fish, while Beerlink discusses a formula implying\
      \ 600 cm for a pair and reports lethal aggression in a four-metre tank. Those different social contexts\
      \ do not prove the selected minimum safe for two adults. Confidence is medium because advice varies,\

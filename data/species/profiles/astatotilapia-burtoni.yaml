  aggressionHeterospecific:
    value: 2
    confidence: medium
    rationale: "Three agents propose level 2 and checker-b level 3. Maidenhead Aquatics, Fishipedia and my-fish
      describe a moderately aggressive fish that coexists with robust East African cichlids of similar size,
      and the males drive other fish from the spawning site. The Aquarium Wiki, Aqua-Fish and
      tropical-fish-keeping.com call it aggressive towards tankmates, and two forum keepers saw small males
      chase much larger mbuna and Nimbochromis, which points to level 3 for a bold male. These reports are
      single anecdotes with unclear tank sizes and stocking, and the care sheets of higher weight describe
      chasing within the territory without injuries, so level 2 is kept; tankmates should not be small or
      timid."

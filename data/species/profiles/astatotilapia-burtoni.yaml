      rationale: "The tally decides 7.5 to 9.4 unanimously: the generator proposes 7.8 to 9.4 and the three checkers
        7.5 to 9.4, which agree within 0.3, and the median of the minima is 7.5. Care sources give 8.0 to 9.0
        (Maidenhead Aquatics, my-fish), 7.8 to 9.0 (DRTA, a dealer page), 8.4 to 8.9 (Aqua-Fish), 8.5 to 9.0
        (FishBase, the Aquarium Wiki) and 7.5 to 8.5 (Aquaristik-Welt, Einrichtungsbeispiele). Laboratory
        colonies live and breed at pH 8.0 and forum keepers hold the species near 7.6 to 7.8. The decided
        range is narrower than the widest source: Fishipedia advises 7.2 to 8.0 for captive-bred stock, a
        value no other source supports. The upper limit is the natural maximum, because no source tests more
        alkaline water."

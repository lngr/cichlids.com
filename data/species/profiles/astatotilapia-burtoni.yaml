  husbandry:
    text: "A tank of at least 120 cm and about 200 litres suits one male with four females. Rocks piled into
      outcrops with caves and sight barriers let a chased fish break contact. A sand or fine gravel floor
      allows the male to dig his spawning pit, and coral sand or aragonite helps keep the water hard and
      alkaline. Hardy plants such as anubias are possible, but digging males may uproot them. The species
      stays healthy at 20 to 29 degrees C, pH 7.5 to 9.4, 8 to 20 dGH and 8 to 22 dKH, with 24 to 28 degrees C
      and a pH of 8 or more as a comfortable middle. Strong filtration and frequent water changes matter,
      because care sheets describe the species as sensitive to poor water despite its general hardiness."
    sources:

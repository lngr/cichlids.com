  temperatureC:
    value:
      min: 23
      max: 29
    confidence: high
    rationale: "The natural range is the Lake Tanganyika value of the lake studies: hourly buoy readings off
      Mpulungu span about 23.9 to 29.0 degrees C over a year (Verburg et al. 1997), and the south cools
      further during the upwelling season, which gives 23 to 29 degrees C; the annual sampling programme of
      Plisnier and colleagues agrees. All four agents propose this range and the tally confirms it with method
      waterbody. The species also lives in river mouths, swamps and shore pools of the basin; no river series
      was found, so the lake values stand for the habitat. FishBase gives 20 to 25 degrees C, an aquarium
      figure below the lake measurements, and laboratory colonies of wild-derived stock live at 28 degrees C,
      inside the range."

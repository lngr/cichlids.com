  ghDgh:
    value:
      min: 10
      max: 13
    confidence: high
    rationale: "The natural range is the Lake Tanganyika value of the lake studies: calcium and magnesium means of
      the FAO/FINNIDA programme give about 11.1 to 11.5 dGH at Bujumbura, Kigoma and Mpulungu, the north basin
      analysis of Cohen et al. about 12.2 dGH, and the older data of Talling and Talling compiled by Vanden
      Bossche and Bernacsek a little lower; together 10 to 13 dGH, with magnesium far above calcium. All four
      agents propose this range and the tally confirms it with method waterbody. FishBase gives 12 to 16 dH
      for the species, which overlaps the upper part of the lake range."

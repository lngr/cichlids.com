    note: A line with a rust red hue is reported among hobby stock.
features:
  origin:
    value:
      continent: Africa
      region: "Lake Tanganyika basin (shallow lake margins, river mouths, swamps and inflowing rivers), with records
        from the Lake Kivu basin"
      waterbody: lake-tanganyika
      localities:
        - "Ujiji, Lake Tanganyika (type locality)"
        - "Kalemie, Lake Tanganyika (type locality of Tilapia nadinae)"
        - "Rusizi River delta and Nyangara wetland, north end of Lake Tanganyika"
        - Malagarasi River and its swamps
        - Lukuga River up to the Kisimba-Kilia rapids
        - Kalambo River and its mouth
        - Lunzua River
        - Lufubu River
        - "Crocodile Island, southern Lake Tanganyika (lake population at 5 to 8 m)"
        - Lake Kivu basin
    confidence: high
    rationale: "The Catalog of Fishes gives the Lake Kivu and Lake Tanganyika basins as the range and Ujiji as the
      type locality; the synonym Tilapia nadinae was described from Kalemie. FishBase lists the lake with the
      Lukuga, Malagarasi and Rusizi systems and treats records from the Akagera system as possible
      introductions, which stay out of the localities. Field studies of the Basel group sample the species at
      lake shores, at an offshore island without a river nearby and in many inflowing rivers such as the
      Kalambo, Lunzua and Lufubu, and the Nyangara wetland of the Rusizi plain holds a fished population.
      Hobby texts describe swamps, slow streams and shore pools. The public teaser of the Cichlid Room
      Companion mentions a Lake Malawi region and rocky lake settings; this contradicts the catalog, the type
      locality, FishBase and every field study and is not followed. Checker-a lists Lake Cohoha in Burundi
      from a phylogeographic survey, while checker-c attributes the Cohoha and Chila populations to
      translocation; Lake Cohoha is left out of the localities for that reason. All agents put the main water
      body at Lake Tanganyika, so the lake table decides the natural water values."

    rationale: "FishBase gives common lengths of 12 cm for males and 7 cm for females and 15 cm standard length as
      the largest record. Laboratory adults reach about 9.7 to 11.4 cm for dominant males and 6.1 to 8.3 cm
      for females, and Loiselle, quoted in the forum archive, gives 10 and 7.5 cm. Care sheets name 13 to 15
      cm for males, close to the record, and between 10 and 12 cm for females. Three agents propose 8 cm and
      checker-b 9 cm for females; the median of 8 cm matches the laboratory and FishBase figures, while 12 cm
      for males is unanimous and well below the record."

  sizeAndGrowth:
    text: "Males typically reach 10 to 12 cm in the aquarium and females 7 to 8 cm. FishBase gives 15 cm standard
      length as the largest record, a size that tank fish rarely reach. Laboratory males measure about 10 to
      11 cm and females 6 to 8 cm. In the Rusizi wetland, wild fish mature at about 65 mm for females and 70
      mm for males, and in laboratory stock a generation takes about six months, so the species grows and
      breeds fast. Data on lifespan are thin; care sheets suggest about five to eight years."

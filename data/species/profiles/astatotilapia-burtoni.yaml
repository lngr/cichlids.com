      - astatotilapia-burtoni-gigliolii
      - astatotilapia-burtoni-haplochromis-nubilus
      - astatotilapia-burtoni-pundamilia-pundamilia
    confidence: low
    rationale: "The tally decides four groups of two by the conservative rule, the union of all groups named by at
      least two votes, with confidence low. All six votes name astatotilapia-burtoni-calliptera and
      astatotilapia-burtoni-haplochromis-nubilus; checker-a, checker-b and both tie-breakers add
      astatotilapia-burtoni-gigliolii, and checker-b and both tie-breakers add
      astatotilapia-burtoni-pundamilia-pundamilia, while the generator and checker-c name only the first two.
      Stelkens and colleagues and Selz and colleagues raised hybrids of burtoni and calliptera to the second
      generation. Selz and colleagues also raised first and second generation hybrids of burtoni females and
      males reported as A. tweddlei, a name the Catalog of Fishes places under Astatotilapia gigliolii. In the
      cross table of Stelkens, Young and Seehausen, burtoni females with Pundamilia pundamilia males gave
      fertilised eggs that hatched in four of six clutches. Crapon de Caprona and Fritzsch obtained fertile
      hybrids over three generations from burtoni females and Haplochromis nubilus males, while the reverse
      cross died as larvae. All four rest on laboratory tanks in which females had only a male of the other
      species, so each group has the basis presumed. No wild hybrid or free-choice aquarium cross is reported.
      A single burtoni by Maylandia estherae clutch without hatching data in the same table gives no group."

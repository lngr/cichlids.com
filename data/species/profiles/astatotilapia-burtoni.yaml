    rationale: "The generator and checker-c propose rock, sand and plants, checker-a and checker-b rock and sand.
      FishBase and the IUCN summary quoted by Wikipedia describe slow streams, river mouths, swamps and
      marshes and the shallow lake margin, where the bottom is sand or mud with vegetation; my-fish and
      Aquaristik-Welt describe sandy or fine gravel shores with rubble and patches of plants. Males dig
      spawning pits in sand, and care sheets ask for rock piles with caves as cover and sight barriers. Plants
      are part of the natural habitat and several sources include robust plants in the tank, so they are
      listed, although digging males may uproot them. The species does not need open water as a separate
      zone."

    confidence: high
    rationale: "The natural range is the Lake Tanganyika value of the lake studies: surface pH of about 8.8 to 9.2
      and an annual range of 8.47 to 9.40 at 40 m in the sampling programme of Plisnier and colleagues,
      supported by the limnology thesis of Langenberg, which gives 8.4 to 9.4. All four agents propose this
      range and the tally confirms it with method waterbody. FishBase gives 8.5 to 9.0 for the species, inside
      the range. River populations may live in somewhat less alkaline water, but no measurement from their
      habitat was found."

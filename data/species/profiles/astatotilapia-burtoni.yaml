  habitat:
    text: "The species lives in slow streams, river mouths, swamps and the shallow lake margin across the Lake
      Tanganyika basin, including the Rusizi delta, the Malagarasi and Lukuga systems and the Kalambo, Lunzua
      and Lufubu rivers, with further records from the Lake Kivu basin. Field notes describe turbid shore
      pools and river deltas as typical places, where murky water protects breeding fish, and one population
      lives around an offshore island in the south at 5 to 8 m. Lake and stream populations differ in body
      shape and diet. Lake Tanganyika water is hard, strongly buffered and alkaline: pH 8.4 to 9.4, 10 to 13
      dGH, 15 to 20 dKH and 23 to 29 degrees C. River habitats can differ locally with the inflow, but no
      measurements from them were found."
    sources:

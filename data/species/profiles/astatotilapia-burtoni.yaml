  compatibility:
    text: "Burton's mouthbrooder suits robust cichlids of Lake Tanganyika and other hard-water fish that can hold
      their own against a dominant male, in a tank of 120 cm or more. Small shell dwellers and other small,
      peaceful fish are chased, and fry and fish below about 2 cm may be eaten. Large predators such as
      frontosa can swallow the smaller females. Laboratory crosses produced hybrids with Astatotilapia
      calliptera, Astatotilapia gigliolii, Pundamilia pundamilia and Haplochromis nubilus, and similarly
      coloured haplochromines are treated like rivals. Cuckoo catfish that slip their eggs into mouthbrooder
      broods are a bad choice, and grazers kept as species-only groups, such as Tropheus, do not fit."
    sources:
      - kind: website

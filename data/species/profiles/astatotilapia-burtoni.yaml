        accessed: 2026-10-17
        archived: doi.org/10.1186_s12864-016-3177-1/2026-10-17T121559Z
  sexing:
    text: "Mature males are larger and more colourful than females, with a dark eye bar and a row of egg-spots on
      the anal fin. Females are smaller and silvery grey to brownish. Both sexes show egg-spots, so spot
      number alone is unreliable, and males vary in the number of spots. A non-dominant male lives in female
      colours and can be mistaken for a female until a stronger male is removed. Sex is determined by more
      than one genetic system in laboratory lines, so the sex ratio of a brood can differ from one to one."
    sources:

      Maidenhead Aquatics and Aqua-Fish ask for at least 120 cm (Aqua-Fish 30 to 45 cm front to back), my-fish
      for 120 cm and about 210 litres for a male with two or three females, DRTA for 100 cm and 200 litres,
      the Aquarium Wiki and tropical-fish-keeping.com for about 208 litres, and WetWebMedia for 130 cm for a
      male with up to four females. Community tanks of 300 to 400 litres in some German sheets hold mixed
      stocks, not the social unit of the species. Research groups keep small units in 60 to 150 litre tanks,
      which are not long-term keeping recommendations."

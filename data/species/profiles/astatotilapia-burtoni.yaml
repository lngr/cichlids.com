  breeding:
    text: "Breeding is easy in a group with one male. The male digs a pit in the sand, shows his egg-spots to ripe
      females and fertilises the eggs as the female collects them in her mouth. She broods for about 14 days
      at 28 degrees C, up to 20 days in cooler water, and hides among rocks without eating. Clutches reach
      several dozen eggs. Fry of about 8 to 9 mm leave the mouth and slip back in when threatened. Brooding
      females may also eat the brood in some cases, so a quiet tank with cover improves survival. Laboratory
      colonies descended from wild stock collected in the 1970s breed in tanks for generation after
      generation."

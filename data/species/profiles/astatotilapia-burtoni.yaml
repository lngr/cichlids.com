partners:
  suitable:
    - species: Synodontis petricola
      reason: "Small Tanganyikan catfish of about 12 cm that lives near the bottom and among rocks, stays out of the
        male's way and shares the hard alkaline water."
    - species: Neolamprologus leleupi
      reason: Robust cave-dwelling Tanganyikan cichlid of similar size that defends its own cave and does not yield
        easily to a dominant burtoni male.
      condition: Tank of 120 cm or more with several separate caves
    - species: Neolamprologus pulcher
      reason: Hardy cave breeder of about 8 cm that holds a small territory in the rocks and fits a robust
        Tanganyikan community.
      condition: Group of five or more in a tank of 120 cm or more
  unsuitable:
    - species: Astatotilapia calliptera
      reason: Close relative that produced fertile hybrids with burtoni in laboratory crosses; its males look and
        behave alike and act as rivals.
    - species: Haplochromis nubilus
      reason: Lake Victoria haplochromine that gives fertile hybrids with burtoni females in forced laboratory
        crosses; males of similar build fight.
    - species: Astatotilapia gigliolii
      reason: Riverine haplochromine that produced hybrids with burtoni to the second generation in forced
        laboratory crosses.
    - species: Pundamilia pundamilia
      reason: Lake Victoria haplochromine whose males fertilised burtoni eggs that hatched in laboratory crosses.
    - species: Cyphotilapia frontosa
      reason: Large Tanganyikan cichlid that eats any fish fitting its mouth; burtoni females of about 8 cm are
        within that size.
    - species: Neolamprologus multifasciatus
      reason: Tiny shell-dwelling cichlid that a dominant burtoni male chases away from its shells; care sheets warn
        against small shell dwellers.
    - species: Synodontis multipunctatus
      reason: "Cuckoo catfish that places its eggs among the eggs of brooding mouthbrooders, which costs a burtoni
        female her brood."
    - species: Tropheus moorii
      reason: Grazer that needs a plant-based diet and is kept as a species-only group; a persistent burtoni male
        harasses it.
    - species: Small peaceful community fish such as tetras and rasboras
      reason: Soft-water species of 3 to 5 cm that the male chases and that do not suit water of pH 8 to 9.
profile:
  overview:
    text: "Astatotilapia burtoni, Burton's mouthbrooder, is a small haplochromine from the Lake Tanganyika basin.
      It lives in river mouths, swamps, slow streams and the shallow margins of the lake rather than on deep
      rocky shores. Breeding males are yellow or blue with a dark eye bar, a red patch behind the gill cover
      and bright egg-spots on the anal fin, while females are plain silvery grey. The species is hardy, eats
      almost anything and spawns readily in a long tank with rocks and sand. Its social system of dominant and
      suppressed males has made it one of the best studied cichlids in behaviour research. In the aquarium the
      same hierarchy means that a dominant male needs several females, space and sturdy tankmates."
    sources:
      - kind: database
        title: "FishBase species summary: Astatotilapia burtoni"

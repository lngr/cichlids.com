    tolerance:
      value:
        min: 20
        max: 29
      confidence: medium
      rationale: "All four votes propose 20 to 29 degrees C, so the tally decides this range unanimously. The lower
        limit follows FishBase, the Maidenhead Aquatics care sheet, the Aquarium Wiki and Aqua-Fish (20 to
        25), with German sheets at 21 to 26 or 22 to 26 and Fishipedia at 23 to 27. The upper limit is the
        lake maximum: research colonies of wild-derived stock live and breed for many generations at 28
        degrees C, and no source reports harm in the warm half of the natural range. Confidence stays medium
        because the lower edge rests on care sheets and the upper edge on laboratory practice and the
        habitat."
      sources:

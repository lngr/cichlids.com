  beginnerSuitability:
    value: moderate
    confidence: medium
    rationale: "Three agents propose moderate and checker-a easy. The fish is hardy, eats almost anything and
      breeds readily, and DRTA, Fishipedia and WetWebMedia call it easy. Maidenhead Aquatics lists it for a
      specialist community and warns that it does not tolerate poor water, Aqua-Fish advises against it for
      novices because of its aggression, and the Aquarium Wiki rates it moderate. The care itself is simple,
      but a male needs a long tank, several females and robust tankmates, so moderate fits."

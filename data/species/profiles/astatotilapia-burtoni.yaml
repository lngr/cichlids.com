  diet:
    text: "In the wild the species feeds where food is plentiful: lake fish near river mouths eat mainly plant
      material and algae, stream fish mainly insect larvae, snails and other invertebrates, and gut contents
      also show detritus, diatoms and zooplankton, with fish present only as scales. In the aquarium it
      accepts flake, cichlid pellets and frozen foods such as mysis, brine shrimp and mosquito larvae.
      Spirulina flake or blanched vegetables cover the plant share of the diet. Small portions once or twice a
      day that are eaten within a few minutes prevent obesity. No source reports a special bloat risk."

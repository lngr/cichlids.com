  territory:
    value:
      size: small
      breedingOnly: false
    confidence: medium
    rationale: "Three agents propose a small territory and checker-a a large one. Dominant males defend a spawning
      pit or a shelter and its surroundings, in laboratory tanks often half a flowerpot, and court passing
      females in a lek-like system; females and subordinate males hold no territory. A dominant male keeps his
      site as long as he is dominant, not only during short breeding periods, so breedingOnly is false; the
      DRTA sheet describes territorial behaviour during spawning only. Checker-a reads the advice that two
      adult males need about 200 cm of tank as a large territory, but these hobby reports mix the defence of a
      site with the general harassment of rivals, and the laboratory accounts describe a site around one
      shelter."

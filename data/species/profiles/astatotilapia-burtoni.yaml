  aggressionConspecific:
    value: 3
    confidence: high
    rationale: "All four agents propose level 3. Dominant males defend territories and chase rivals persistently;
      in a 250 litre tank two males with ten females fought hard within minutes, and dense field enclosures at
      the Kalambo lost fish with injuries attributed to male aggression. Care sheets agree that males do not
      tolerate each other except in very large tanks and that a subdominant male in a tank of about 200 litres
      is soon driven off or killed, and a dominant male also hounds females when they are too few. Fishipedia
      reports fights that end in death (level 4), while two German sheets see aggression mainly while spawning
      (level 2). With one male, four females and cover, losses are not reported, which keeps the level at 3.
      Confidence rises to high because peer-reviewed studies and several care sheets agree."

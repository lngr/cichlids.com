  khDkh:
    value:
      min: 15
      max: 20
    confidence: high
    rationale: "The natural range is the Lake Tanganyika value of the lake studies: alkalinity of 6.5 to 6.6 meq/L
      in the north basin (Cohen et al.), 6.71 meq/L after Talling and Talling and 6.7 to 6.9 meq/L cited by
      Langenberg give about 18 to 19 dKH, and the bicarbonate and carbonate titrations of the FAO/FINNIDA
      programme reach down to about 15 dKH; together 15 to 20 dKH. All four agents propose this range. No
      source states a carbonate hardness measured in the river habitats of the species."

  breeding:
    value: maternal-mouthbrooder
    confidence: high
    rationale: "All four agents agree. The male digs a pit and shows his egg-spots, and the female takes the eggs
      into her mouth, where they are fertilised and brooded for about two weeks at 28 degrees C. Peer-reviewed
      laboratory studies, FishBase, the Cichlid Room Companion and care sheets all describe maternal
      mouthbrooding."

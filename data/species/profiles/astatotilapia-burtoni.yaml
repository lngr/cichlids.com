  problems:
    text: "The most common problem is aggression: with too few females, too little cover or a second male in a
      small tank, the weaker fish is chased until it is injured or hides and starves. A male can also hound
      tankmates that are small or timid. Poor water leads to stress and illness, and care sheets mention that
      the species copes badly with dirty water. A forum report describes lip damage and the loss of a newly
      bought pair within weeks, a pattern that points to stress or infection, so quarantine of newcomers and
      clean water matter. Hybrids can arise when related haplochromines share the tank, and females sometimes
      eat their young."
    sources:
      - kind: website
        title: "Fishkeeper (Maidenhead Aquatics) species data bank: Burton's Mouthbrooder"
        url: "https://www.fishkeeper.co.uk/fish/freshwater/cichlids/burtons-mouthbrooder"

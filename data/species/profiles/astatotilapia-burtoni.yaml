  coloration:
    value:
      baseColors:
        - yellow
        - blue
      pattern: mixed
    confidence: medium
    rationale: "Three agents propose yellow and blue, the generator yellow, green and blue; all agree on a mixed
      pattern. Dominant males are yellow or blue, depending on population and line, with a dark eye bar and
      head markings, a red to orange patch behind the gill cover, red-spotted fins and yellow to orange
      egg-spots on the anal fin; stressed fish show dark vertical bars. A hobbyist author describes yellow to
      lime green as the common aquarium form and a dull green northern form, and my-fish names green among the
      colours, but most sources describe yellow and blue males, so green is noted as a variant. Females and
      subordinate males are silvery grey."

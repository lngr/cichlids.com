    tolerance:
      value:
        min: 8
        max: 22
      confidence: low
      rationale: "The tally decides 8 to 22 dKH by qualified majority, five of six votes: checker-a, checker-b and
        both tie-breakers propose 8 to 22 and checker-c 8 to 20, which agree; the generator proposes 8 to 25
        and dissents on the upper limit. Only DRTA and Aquaristik-Welt name a carbonate hardness for the
        species, both 15 to 20, which repeats the lake values without showing harm outside them. The range is
        derived from the pH advice of 7.5 to 9.0, from laboratory colonies kept in buffered water at pH 8.0
        and from the practice of Tanganyika tanks, where about 8 dKH holds a pH near 8. The upper limit allows
        for hard tap water and coral sand; the generator's 25 dKH, derived from the Maidenhead Aquatics call
        for hard alkaline water, is the widest proposal. Confidence is low because no source states a measured
        carbonate hardness tolerance."

    - name: Chromis burtoni
      note: "original combination of Günther 1894, type locality Ujiji, Lake Tanganyika"
    - name: Tilapia nadinae
      note: "described by Borodin 1931 from Albertville (Kalemie), Lake Tanganyika; junior synonym since Trewavas
        1946"
    - name: Haplochromis burtoni
      note: "generic placement of van Oijen et al. 1991, common in the hobby and in laboratory literature; the
        catalog accepts Astatotilapia"
  legacyNames:
    - Astatotilapia burtoni
  note: "The Catalog of Fishes lists Astatotilapia burtoni as valid, with a range in the Lake Kivu and Lake
    Tanganyika basins, and places Tilapia nadinae in its synonymy. FishBase and the public page of the Cichlid
    Room Companion use the same valid name and author. Queries for Haplochromis and Chromis return no separate
    entry. The name Tilapia burtoni appears in some care sheets but not in the catalog. All four agents agree
    on the taxonomy."

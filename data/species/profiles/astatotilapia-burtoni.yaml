  predation:
    value: 1
    confidence: low
    rationale: "The tally decides level 1 by the conservative rule: three votes say 1 (generator, checker-b,
      checker-c) and three say 0 (checker-a, both tie-breakers), so the higher level applies with confidence
      low. Stomach contents and isotopes describe an omnivore: lake fish near a river mouth eat mainly plant
      material and algae, stream fish mainly insects, snails and other invertebrates, and FishBase food
      records from Rwanda list fish only as scales. No source reports fish as regular prey. Some hobby pages
      say that shrimps and small fish are at risk and one lists small fish among natural prey, and laboratory
      work shows that females eat their own young in some cases. Level 1 limits the predation risk to fry and
      fish below about 2 cm, which fits these reports."

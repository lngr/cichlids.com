  social:
    value:
      structure: harem
      ratio: 4
    confidence: high
    rationale: "All four agents propose a harem with four females per male. One dominant male spawns with several
      females, and further males lose colour and status or are driven off. Maidenhead Aquatics and my-fish
      advise one male with four or five females, WetWebMedia up to four in a 130 cm tank,
      tropical-fish-keeping.com at least three, and DRTA and Aquaristik-Welt two or three for keeping and more
      for breeding. The Aquarium Wiki lists a one to one ratio, which the other sources contradict. Four
      females spread the courting pressure that DRTA describes as exhausting for females."

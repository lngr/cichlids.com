        tie-breakers propose 8 to 20, checker-b 7 to 20 and checker-c 9 to 20, which agree; checker-a proposes
        8 to 25 and dissents on the upper limit. Care sources lie mostly above the lake values: 12 to 16
        (FishBase, the Aquarium Wiki), 12 to 18 (Aqua-Fish), 12 to 20 (my-fish), 9 to 20 (DRTA,
        Aquaristik-Welt), 10 to 16 (Einrichtungsbeispiele) and 10 to 20 (a dealer page), and a keeper bred the
        species in tap water near 20 dGH. The decided range is narrower than the sources on both sides:
        Maidenhead Aquatics and Fishipedia reach 25 dGH, and tropical-fish-keeping.com advises 7 to 11 dGH.
        The lower limit of 8 sits two degrees below the lake minimum and is derived from the keeping practice
        of the group and the riverine part of the habitat rather than stated by a source."

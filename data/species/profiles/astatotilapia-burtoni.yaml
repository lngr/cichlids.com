  socialBehavior:
    text: "Males are territorial and defend a spot around a spawning pit. In laboratory groups one dominant male
      is brightly coloured and aggressive, while subordinate males look like females and have regressed
      gonads; the roles are reversible and depend on the rivals present. Keep a single male with four or five
      females, since a second male in an ordinary tank is usually harassed. Brooding females also attack
      gravid females. Towards other species the male chases intruders from his pit, and forum reports describe
      small males bullying much larger fish, so choose tankmates that are robust and not tiny."

      blue-green adult male with red and yellow fin components, making the shared generator/checker-c
      palette the best fit to the rubric's dominant adult male colours. Silver chiefly describes females,
      juveniles and subordinate fish; orange and pale fin margins remain in evidence as accents. Three
      conspicuous side spots and a weaker gill-cover mark account for differing spot counts in the

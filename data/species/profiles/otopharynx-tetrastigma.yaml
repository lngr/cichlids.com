  compatibility:
    text: "Calm Malawi haps and selected peacocks of comparable size are plausible companions when each
      species has enough floor space and feeding access. Persistent mbuna aggression and large
      fish-eaters can make the combination unsuitable. Predation level 0 allows incidental fry capture
      and does not guarantee fry survival. Other Otopharynx share a presumed crossing group based on
      general congener warnings, so their compatibility includes an uncertain hybrid concern. A community
      aquarium needs more room than the minimum given for the four-fish social unit."

  ghDgh:
    value:
      min: 3
      max: 5
    confidence: high
    rationale: "The decided natural range is 3 to 5 dGH with waterbody verification and high confidence, as
      in all four complete profiles. Calcium and magnesium in Branchu yield about 4.2 to 4.6 dGH in the
      upper 50 m, and the observations compiled by FAO span about 3.2 to 4.9 dGH. The rounded lake
      envelope describes soft water despite the high alkalinity; aquarium recommendations of 12 to 16, 5
      to 20 or 10 to 25 dGH describe keeping conditions rather than natural hardness."

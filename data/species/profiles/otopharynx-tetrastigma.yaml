  maxSizeCm:
    value:
      male: 14
      female: 12.5
    confidence: medium
    rationale: "The proposals are generator 14/12, checker-a 16/13, checker-b 14/12 and checker-c 14/12.5 cm
      for male/female; their medians are 14 and 12.25 cm. The male median matches the locality account's
      typical 14 cm adult and Zoopet's 14 cm. The female is rounded to 12.5 cm, the directly observed
      aquarium value in Reich, rather than treating 12.25 as measured precision. Fischlexikon gives
      16/12, FishBase gives a sex-unspecified maximum of 16 cm, AquaInfo prose gives 17/14 while its
      summary metadata gives 12 to 14 cm, and Ron's and Imperial list 7 to 8 inches or about 18 to 20 cm
      without a measured sex split. These larger and internally conflicting maxima remain evidence but do
      not establish typical adults of both sexes; confidence is medium."

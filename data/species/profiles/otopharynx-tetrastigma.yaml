    tolerance:
      value:
        min: 3
        max: 16
      confidence: low
      rationale: "The tally uses median verification with 3 of 6 agreeing votes and low confidence, deciding 3
        to 16 dGH. Generator proposes 3 to 12, checker-a 3 to 16, checker-b 3 to 20, checker-c 3 to 16,
        tiebreaker-1 3 to 20, and tiebreaker-2 3 to 16 dGH. The median minima and maxima are 3 and 16. No
        qualified majority exists; using the intersection would let the narrowest proposal determine the
        upper boundary. AquaInfo gives 12 to 16 dGH in its archived HTML, Interaquaristik 5 to 10, and
        Einrichtungsbeispiele 5 to 15. Wider recommendations remain evidence: Fischlexikon 5 to 20, the
        NSW society article 150 to 350 ppm as CaCO3 or about 8.4 to 19.6 dGH, and Nicks 10 to 25 dGH.
        Earlier inputs also attribute a ceiling of 25 dH to Aquarist Atlas, but its re-read text contains
        genus-level guidance without that numeric limit. The qualitative hard-water claims at Ron's and
        Fishyhub do not directly state the inferred 3 to 16 interval. The decision includes natural 3 to
        5 dGH water; the 16 dGH upper endpoint is a husbandry synthesis with no controlled long-term
        threshold study."

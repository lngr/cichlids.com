  sexing:
    text: "Adult display males combine blue or green sheen with warmer fin colours. Females and less dominant
      males are generally less intense, and social suppression can obscure a male's appearance. Three
      side spots are conspicuous in many descriptions; a weaker gill-cover marking contributes to the
      four-mark name. The markings can fade or merge during display. Size, colour and fin shape should be
      considered together after maturity rather than using a single juvenile colour cue."

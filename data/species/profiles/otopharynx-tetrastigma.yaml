  husbandry:
    text: "The recommended adult unit is one male with three females in at least 350 litres, with 150 cm
      length and about 50 cm depth. Reserve a broad area of fine sand for feeding and place cover so a
      chased fish can leave a male's sight. Scattered secure stones and loose plant stands suit this
      arrangement. Digging and occasional plant feeding can damage delicate growth. Maintain filtration,
      regular water renewal and stable alkaline conditions. Most care advice concentrates around 24 to 28
      C; the wider compatibility tolerances are uncertain estimates, not temperature targets. Additional
      cichlids or males require more space."

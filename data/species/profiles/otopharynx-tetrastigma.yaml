  problems:
    text: "Repeated hiding, missed food and loss of condition can indicate that the group or its companions
      are too demanding. A subordinate male may need separation if chasing persists. Fine sand supports
      normal foraging, but fish that bury or conceal themselves can be difficult to inspect. Check
      individuals as well as the group's overall activity. Neither a wide tolerance estimate nor the
      absence of a bloat-sensitivity flag replaces stable care and attention to feeding response."

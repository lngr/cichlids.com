  minTank:
    value:
      volumeL: 350
      lengthCm: 150
      depthCm: 50
    confidence: medium
    rationale: "The proposals are generator 400 L/150/50 cm, checker-a 280 L/120/45 cm, checker-b 450
      L/150/50 cm, and checker-c 300 L/150/45 cm. Coordinate medians are 350 L, 150 cm length and 47.5 cm
      depth. Retain 350 L and 150 cm for one male with three females: AquaInfo recommends 300 L and 150
      cm for five to seven adults, Imperial recommends about 341 L, and Malawi-Guru recommends 400 L for
      a species group. The 50 cm depth rounds the inferred 47.5 cm median to a usable sand-foraging
      footprint; no source directly measures a minimum depth. Lower suggestions of 200 to 300 L at 120 to
      122 cm and higher 450 L recommendations from Fischlexikon and Einrichtungsbeispiele remain
      evidence. Reich's 265 L, 122 cm aquarium contains a repeatedly harassed second male, so it is not a
      clean success for a multi-male minimum. Mixed communities and extra males need additional space;
      Malawi-Guru recommends 600 L for mixed cichlid stocking."

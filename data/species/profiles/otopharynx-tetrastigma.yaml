    - species: Aulonocara stuartgranti
      reason: Selected relatively calm peacocks are recommended in species care accounts.
      condition: Use a spacious community layout and assess the actual male rather than assuming every
        individual is mild.
    - species: Copadichromis azureus
      reason: Copadichromis are suggested among potential non-mbuna companions.
      condition: Allow additional swimming room and monitor competition during display and feeding.
    - species: Synodontis njassae
      reason: Species accounts suggest appropriately sized Synodontis as possible Malawi companions.
      condition: Provide its own refuge; this is a planning candidate rather than a documented pair-specific trial.
  unsuitable:
    - species: Melanochromis auratus
      reason: Strong persistent aggression can exclude a calmer Otopharynx from cover and food.
    - species: Otopharynx lithobates
      reason: It shares the presumed otopharynx crossing group; the caution rests on general hobby warnings
        rather than a documented cross of this pair.
    - species: Large piscivorous Malawi cichlids
      reason: Individuals large enough to swallow smaller Otopharynx create a predation risk.
      condition: Malawi-Guru allows selected calm predators with suitable adult fish; the warning concerns an
        actual size mismatch rather than a blanket ban on every predator.
    - species: Tropheus moorii
      reason: A specialist plant-grazing feeding regime and a demanding group setup fit poorly with the
        invertebrate-based feeding plan here.
profile:
  overview:
    text: "A sandy feeding floor and quiet plant cover bring out the character of Otopharynx tetrastigma.
      This Malawi-system cichlid searches sediment for small animals and carries its young by maternal
      mouthbrooding. Male colour develops with maturity and social position, while subdued fish show dark
      side markings. A settled group can share a roomy aquarium with calm Malawi cichlids. It is a
      different species from the similarly named O. tetraspilus."

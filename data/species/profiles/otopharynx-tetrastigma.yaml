  socialBehavior:
    text: "The breeding male has a local display site, while other fish feed through the surrounding habitat.
      Several females spread his attention, but they also need cover and access to food. Male rivalry can
      become sustained when a second male has little room to retreat. The conspecific aggression rating
      of 2 applies to the recommended one-male unit in adequate space; it does not predict a safe outcome
      for every multi-male group. Assess chasing together with body condition and feeding access."

  legacyNames:
    - Otopharynx tetrastigma
  note: The Catalog of Fishes accepts Otopharynx tetrastigma (Gunther 1894) and dates the original
    description to 1894 despite the 1893 volume label used by CRC. Otopharynx tetraspilus is a separate
    species. Trade comparisons with Tramitichromis intermedius do not establish synonymy. Additional
    historical combinations are supported by the cited species accounts rather than all being enumerated
    by the Catalog genus query.

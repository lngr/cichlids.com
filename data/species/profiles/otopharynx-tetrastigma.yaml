  temperatureC:
    value:
      min: 21
      max: 29
    confidence: high
    rationale: "The decided natural range is 21 to 29 C with waterbody verification and high confidence,
      shared by all four complete profiles. Eccles documents inshore cooling to 21 C, the FAO compilation
      gives 23 to 25 C, and Vollmer describes seasonal upper-water variation near 23.5 to 28 C. The
      adopted lake-wide envelope includes warmer campaign conditions in the limnological synthesis; it is
      not a recommendation to alternate between its endpoints. Individual studies cover narrower times
      and places."

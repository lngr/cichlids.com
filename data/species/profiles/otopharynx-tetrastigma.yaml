  breeding:
    text: "A male prepares a depression and courts females around it; the female alone carries the developing
      brood in her mouth. Accounts place release roughly three weeks after spawning, with variation
      between broods. Brooding females need protection from repeated courtship and access to a quiet
      retreat. Released fry have poor prospects among adult aquarium fish, so raising them successfully
      requires separate planning. The sources do not identify every cause of fry loss or establish
      deliberate small-fish predation by this species."

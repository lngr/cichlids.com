  diet:
    text: "Offer a suitable prepared staple with small invertebrate foods such as crustaceans and insect
      larvae. The natural feeding category is invertivore because animal prey dominates the
      species-specific feeding records. Sampling algae or vegetables in captivity does not make it an
      obligate plant grazer. Modest portions distributed where quieter fish can reach them help prevent
      competition and excess waste. There is no established species-specific protein-sensitivity flag,
      although poor feeding and water quality can still cause problems."

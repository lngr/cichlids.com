  habitat:
    text: "Vegetated shallows in the Malawi, Malombe and upper Shire system provide its feeding grounds. Fine
      sediment lies between Vallisneria and Ceratophyllum stands, with small prey in the bottom and in
      the water immediately above it. Published depth descriptions differ: FishBase gives 0 to 7 m,
      whereas Malawi-Guru gives 5 to 12 m. These observations support a shore-associated sediment habitat
      without establishing a single depth limit. Lake measurements describe alkaline water with
      relatively low calcium and magnesium hardness."

    rationale: "Generator and checker-c propose 6 to 10 years, checker-a 8 to 10, and checker-b 8 to 8;
      coordinate medians are 7 and 10 years. Keep this as a planning estimate. AquaInfo gives the wider
      species-specific range of 5 to 10 years, Nicks gives 6 to 8 years, and the NSW society article
      gives about 8 years. The decided 7 to 10 range is narrower than AquaInfo's 5 to 10 and excludes
      part of Nicks' 6 to 8; it represents a median expectation for well-kept fish, not demonstrated
      survival boundaries. Sources lack a tracked cohort and several original proposals are generic
      haplochromine estimates, so confidence stays low."

  sizeAndGrowth:
    text: "Use about 14 cm for a typical adult male and 12.5 cm for a female when planning this profile's
      social unit. Published sizes vary substantially, including a 16 cm maximum in FishBase and higher
      retailer estimates. The female figure has limited direct support and is not a proven ceiling.
      Maturation and colour depend on condition and social status; juvenile appearance does not reliably
      reveal the eventual sex ratio. A low-confidence lifespan estimate is 7 to 10 years, with published
      aquarium expectations spanning 5 to 10."

  khDkh:
    value:
      min: 5
      max: 8
    confidence: high
    rationale: "The decided natural range is 5 to 8 dKH with high confidence, shared by all four complete
      profiles. Measured bicarbonate alkalinity gives about 6.5 to 6.9 dKH in Branchu and 5.6 to 7.3 dKH
      in the FAO compilation. Rounding outward accommodates the measured lake variation. Sodium
      contributes to alkalinity, so KH can exceed GH. This natural KH fact carries no verification
      object."

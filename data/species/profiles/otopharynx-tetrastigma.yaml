    tolerance:
      value:
        min: 5
        max: 12
      confidence: low
      rationale: "The tally decides 5 to 12 dKH, unanimous within its two-degree agreement rule, with low
        confidence. Generator and checker-c propose 5 to 12, checker-a 5 to 14, and checker-b 4 to 10
        dKH; rounded medians give 5 to 12. The NSW society article recommends a single 120 ppm KH
        setting, about 6.7 dKH, rather than a tolerance range. The other intervals are inferences from
        alkaline pH guidance and buffered Malawi keeping practice. The wider checker-a estimate of 5 to
        14 dKH is retained in evidence; no read source directly demonstrates that interval. The decision
        contains natural 5 to 8 dKH water and is not a tested survival boundary."

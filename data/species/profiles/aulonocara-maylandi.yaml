  khDkh:
    value:
      min: 5
      max: 8
    confidence: "high"
    rationale: "The lake decision fixes 5 to 8 dKH with high confidence. Branchu Table 2 alkalinity
      converts to approximately 6.5 to 6.9 dKH; the 5 to 8 envelope also accommodates historical
      measurements incorporated in the lake synthesis. KH here expresses buffering alkalinity and is
      distinct from calcium and magnesium hardness. No GH care recommendation is converted into KH,
      and no verification object belongs on this natural KH fact."
    sources:
      - kind: "literature"
        title: "Branchu et al. (2010). Hydrochemistry (major and trace elements) of Lake Malawi (Nyasa),
          Tanzanian Northern Basin: local versus global considerations. Hydrology and Earth System
          Sciences Discussions 7, 4371-4409."
        url: "https://doi.org/10.5194/hessd-7-4371-2010"
        accessed: "2026-10-13"
    evidence:

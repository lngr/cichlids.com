      rationale: "Generator and checker-c proposed 6 to 8 years; checker-a 5 to 8; checker-b 8 to 10.
        Riverpark gives 5 to 8 for this species, Aquario about 8 and FedeAqua 10. The 5 to 10
        planning interval spans those direct species care estimates instead of preferring the
        generator congener estimate or the general FishyHub average of 6 to 8. FishyHub also
        mentions more than 10 as possible for peacocks, a wider unbounded genus claim not adopted as
        a maylandi maximum. The sources provide neither a tracked cohort nor validated typical
        survival, and Fischlexikon explicitly lacks a reliable maximum age. Confidence is therefore
        low; this interval is an uncertain husbandry expectation, not a survival distribution or
        guaranteed lifespan."

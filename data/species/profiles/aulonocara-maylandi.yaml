      rationale: "Generator, checker-c and tiebreaker-2 proposed level 1; checker-a, checker-b and
        tiebreaker-1 proposed level 0. The six votes split three to three, so the tally selects the
        higher level 1 by the conservative method with low confidence. FishBase, Malawi-Guru and
        Malawi.si describe benthic invertebrate feeding, not regular fish hunting; that supports
        their level-0 interpretations but does not rule out opportunistic fry consumption. General
        Aqua-Fish and FishyHub warnings and the Aqua Life species page describe possible small-fish
        predation. AquaInfo advises separating the female after fry release, which different
        reviewers interpreted as either compatible with level 0 or suggestive of level 1; it is not
        a recorded feeding observation. Aquario explicitly calls it non-predatory toward small fish,
        but combines the Kande taxon and gives a diet inconsistent with the better ecology sources.
        No source measures the rubric threshold of about 2 cm for A. maylandi. Level 1 is a cautious
        compatibility allowance, not a claim of routine piscivory, and the archive search yielded no
        quantitative predation evidence. Verification method: conservative; votes 3 of 6."

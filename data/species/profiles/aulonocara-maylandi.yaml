  breeding:
    text: "The female incubates the eggs and developing young in her mouth after spawning at a site
      near rock or sand. Species care accounts describe incubation lasting up to about four weeks,
      during which she may eat little. Keep refuges available and avoid repeated disturbance or
      pursuit by the male. If young are to be raised, suitable separate accommodation needs to be
      ready before release. Once free-swimming young have used their yolk, newly hatched Artemia or
      other suitably tiny foods can be offered. Community fry survival is uncertain, so retain
      reliable parentage and locality records for breeding stock."

  sexing:
    text: "Mature males are larger and have a much stronger yellow head and dorsal blaze, blue body
      tones and conspicuous anal-fin markings. Females are often silvery and much plainer. Young or
      subordinate fish can be difficult to identify by color, and similar peacock females make mixed
      breeding stock especially uncertain. A whitish blaze suggests checking the separate A.
      kandeense rather than treating it as a yellow sulphurhead locality variant. A Kande trade
      label without further identification is insufficient."

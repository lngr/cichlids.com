  problems:
    text: "Persistent hiding or missed meals calls for checking companions, refuge space and water
      quality. Fine sand supports feeding; sharp or coarse substrate can damage the mouth and gills
      or obstruct normal sifting. Swelling, damaged fins or unusual breathing needs investigation
      rather than assuming that a gentle fish is simply shy. Overfeeding and deteriorating water
      quality add stress and digestive risk. Mouthbrooding females may eat less naturally, but
      continuing harassment can worsen their condition. Appropriate invertebrate foods are
      supported; the profile does not establish a specific intolerance to their normal animal
      protein content."

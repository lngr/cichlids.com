  socialBehavior:
    text: "One male with four females spreads courtship pressure and gives every female more
      opportunities to leave his attention. Local breeding territories and regular conspecific
      pursuits can occur even in this generally gentle fish. Provide separate retreats and watch
      that every individual feeds and moves freely. Other peaceful species are normally left alone;
      the strongest species-specific descriptions direct territorial defence toward rival maylandi
      males. Several males can color and breed in a larger colony, but that needs more space than
      the minimum harem setup."

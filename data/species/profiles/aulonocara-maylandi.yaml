    - field: "features.feedingSpeed"
      proposals:
        - by: "generator"
          value: "slow"
        - by: "checker-a"
          value: "slow"
        - by: "checker-b"
          value: "slow"
        - by: "checker-c"
          value: "normal"
      decision: "slow"
      rationale: "Generator, checker-a and checker-b proposed slow; checker-c proposed normal.
        Malawi-Guru describes deliberate hovering before individual prey strikes, and Seriously Fish
        stresses timidity and browsing. These observations suggest disadvantage beside fast or
        forceful feeders, so slow is retained as a cautious food-competition mapping. Checker-c
        correctly notes that no source compares intake rates in a suitable quiet aquarium. There is
        no measured feeding-speed or food-loss trial, so confidence remains low; a rapid strike
        alone does not establish hasty feeding."

  diet:
    text: "Provide fine sinking cichlid food supplemented with small aquatic prey such as Artemia,
      Mysis or Daphnia, with some plant ingredients in the prepared ration. Sand-dwelling
      invertebrates form the normal natural diet. Offer modest portions and check that timid females
      receive food beside faster tankmates. Prey detection over sand is described for this species,
      with experimental lateral-line evidence available from the related A. stuartgranti. The
      profile nevertheless allows opportunistic fry or very small fish predation at level 1; that
      cautious rating has low confidence and no measured 2 cm limit. The negative bloat flag does
      not imply protection from digestive illness."

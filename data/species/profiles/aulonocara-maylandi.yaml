  temperatureC:
    value:
      min: 21
      max: 29
    confidence: "high"
    rationale: "The lake decision fixes 21 to 29 C with high confidence. Eccles reports 21 C inshore
      cooling in the southeastern arm and about 27 C in May in its readable abstract; the Ngochera
      and Bootsma study describes surface temperatures reaching 29 C. Branchu measures 22.8 to 25.4
      C along one northern depth profile and Vollmer documents seasonal surface warming and winter
      cooling. The adopted interval covers the lake across seasons and locations, rather than
      measuring the annual temperature at the two maylandi reefs. Eccles was not open access, so
      only its abstract is used."
    sources:
      - kind: "literature"
        title: "Eccles, D. H. (1974). An outline of the physical limnology of Lake Malawi (Lake Nyasa).
          Limnology and Oceanography 19(5), 730-742 (abstract only)."
        url: "https://doi.org/10.4319/lo.1974.19.5.0730"
        accessed: "2026-10-13"
      - kind: "literature"
        title: "Ngochera, M. J. and Bootsma, H. A. (2020). Spatial and temporal dynamics of pCO2 and CO2
          flux in tropical Lake Malawi. Limnology and Oceanography 65, 1594-1607."
        url: "https://doi.org/10.1002/lno.11408"
        accessed: "2026-10-13"
      - kind: "literature"
        title: "Branchu et al. (2010). Hydrochemistry (major and trace elements) of Lake Malawi (Nyasa),
          Tanzanian Northern Basin: local versus global considerations. Hydrology and Earth System
          Sciences Discussions 7, 4371-4409."
        url: "https://doi.org/10.5194/hessd-7-4371-2010"
        accessed: "2026-10-13"
      - kind: "literature"
        title: "Vollmer et al. (2005). Deep-water warming trend in Lake Malawi, East Africa. Limnology and
          Oceanography 50, 727-732."
        url: "https://doi.org/10.4319/lo.2005.50.2.0727"
        accessed: "2026-10-13"

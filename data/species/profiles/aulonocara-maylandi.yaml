  sizeAndGrowth:
    text: "Use about 12 cm for a typical adult male and 10 cm for a female when planning this group.
      Sex-specific care records support those figures, while unsexed sources reach 14 cm and
      FishBase lists a 15 cm scientific maximum. The 10 cm standard length given by Seriously Fish
      excludes the tail and is a different measure. Aquarium Glaser reports young males beginning to
      color at 5 to 7 cm; color development does not show that growth is complete. Published
      lifespan estimates span roughly 5 to 10 years, with little reliable follow-up."

  ph:
    value:
      min: 7.7
      max: 8.6
    confidence: "high"
    rationale: "The lake decision fixes the compiled surface-water envelope at pH 7.7 to 8.6 with high
      confidence. Branchu supplies the read limnological context and discusses 7.5 to 8.5 for the
      water column, including deeper water; this wider lower reach is not substituted for the
      surface envelope. Historical surface endpoints attributed to Jackson in the lake synthesis
      were not independently reread here. Aquarium recommendations belong to tolerance and do not
      establish these natural endpoints."
    sources:
      - kind: "literature"
        title: "Branchu et al. (2010). Hydrochemistry (major and trace elements) of Lake Malawi (Nyasa),
          Tanzanian Northern Basin: local versus global considerations. Hydrology and Earth System
          Sciences Discussions 7, 4371-4409."
        url: "https://doi.org/10.5194/hessd-7-4371-2010"
        accessed: "2026-10-13"
    evidence:
      - source:
          kind: "literature"
          title: "Branchu et al. (2010). Hydrochemistry (major and trace elements) of Lake Malawi (Nyasa),
            Tanzanian Northern Basin: local versus global considerations. Hydrology and Earth System
            Sciences Discussions 7, 4371-4409."
          url: "https://doi.org/10.5194/hessd-7-4371-2010"
          accessed: "2026-10-13"
        value:
          min: 7.5
          max: 8.5
        note: "Whole-water-column pH context, including deep water. It is not the complete compiled
          surface envelope."
    tolerance:
      value:
        min: 7.5
        max: 8.6
      confidence: "low"
      rationale: "Generator, checker-b and tiebreaker-1 proposed pH 7.5 to 8.6; checker-a, checker-c and
        tiebreaker-2 proposed 7.5 to 9.0. No proposal reached four agreeing votes, so the tally
        takes their intersection, 7.5 to 8.6, by the conservative method with low confidence.
        Seriously Fish and The Evolved Fish give the wider 7.5 to 9.0 range, as does the general
        Aqua-Fish guide. FishBase, AquaInfo, FedeAqua, Fischlexikon, my-fish and
        Einrichtungsbeispiele give 7.5 to 8.5, while Tropical Fish Site gives 7.6 to 8.6. These
        recommendations do not establish physiological endpoints. The conservative decision
        preserves the full natural range and declines to infer demonstrated long-term health at 9.0
        from broad care advice; Seriously Fish also combines this fish with A. kandeense. The
        retailer repetition is not independent confirmation."

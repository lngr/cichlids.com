    tolerance:
      value:
        min: 21
        max: 29
      confidence: "low"
      rationale: "Generator, checker-a, checker-b and checker-c all proposed 21 to 29 C; the tally
        records unanimous agreement, with low confidence retained. Seriously Fish recommends 25 to
        29 C, AquaInfo and Aquarium Glaser 22 to 26 C, Tropical Fish Site 23 to 28 C,
        Einrichtungsbeispiele 24 to 26 C and FedeAqua 24 to 28 C. The lower edge is widened to 21 C
        to contain the natural lake range supported by Eccles, rather than by a long-term captive
        trial. No read source demonstrates years of health at constant 21 C. About 24 to 26 C is a
        practical routine target, and the full interval is a planning envelope rather than a
        preferred setpoint range."

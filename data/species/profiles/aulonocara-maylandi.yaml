        checker-b supplied no synonyms. Retain the nominotypical name as an explicitly marked lookup
        alias supported by AquaInfo and older Seriously Fish usage, not as a separate valid taxon.
        All four agree that kandeensis belongs to A. kandeense and that the bare Kande label is

          - "Artemia"
          - "Mysis"
          - "Daphnia"
          - "A prepared food with some plant ingredients"
      rationale: "All four complete-profile runs agree on invertivore and bloatSensitive false, so the
        tally retains that value by unanimous verification with medium confidence. FishBase food
        records and the independent Malawi specialist identify sediment invertebrates as normal
        prey. Seriously Fish and AquaInfo support small aquatic animal foods with some plant
        ingredients in prepared feed. Their use does not turn the natural diet into omnivory. The
        negative bloat flag means no specific conflict with an appropriate invertebrate-rich ration
        was established; it does not imply immunity to digestive disease. Foods differ among the
        four proposals, but all are consistent with invertivory; the tally retains the generator
        food list exactly. The Schwalbe abstract supports lateral-line detection in A. stuartgranti
        only and is comparative evidence, not a maylandi feeding trial. Verification method:
        unanimous; votes 4 of 4."

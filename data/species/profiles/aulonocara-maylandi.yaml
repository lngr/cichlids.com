  note: "The Catalog of Fishes recognizes Aulonocara maylandi Trewavas, 1984 and A. kandeense Tawil
    and Allgayer, 1987 as separate valid species. A. maylandi kandeensis is the original subspecies
    name of A. kandeense, not a current synonym or locality variant of this profile. Seriously Fish
    retains the earlier combined treatment and is not followed for the Kande distribution. The
    unqualified trade label A. sp. 'Kande' is ambiguous: Malawi.si records the undescribed A. sp.
    'chitande type kande' alongside A. kandeense at the island, and CRC lists both separately.
    Without an identifying specimen or original trade context, the bare label is not merged into
    legacy entry 233. AquaInfo confirms the later separation, despite retaining parts of its earlier
    text.
    The legacy catalog also held the species under Aulonocara maylandi maylandi, and that entry maps to this profile."

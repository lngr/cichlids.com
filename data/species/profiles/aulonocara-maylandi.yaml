  compatibility:
    text: "A quiet species aquarium is a useful starting point, but selected peaceful Malawi fish can
      share a larger tank. Placidochromis electra and Copadichromis virginalis are conditional
      candidates based on their care accounts; they are not verified maylandi pairing trials and
      need space for both adult groups. Labidochromis caeruleus is specifically suggested by
      Seriously Fish, provided its activity does not suppress peacock feeding. Avoid forceful mbuna,
      including Melanochromis auratus, and protect fry and very small fish. Other Aulonocara species
      and Sciaenochromis fryeri share the two presumed hybrid groups. Those groups reflect broad
      warnings and anecdotal spawning reports, not confirmed maylandi crosses with every member."

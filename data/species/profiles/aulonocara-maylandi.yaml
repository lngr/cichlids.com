partners:
  suitable:
    - species: "Placidochromis electra"
      reason: "A relatively gentle sand-associated Malawi fish with overlapping food and water needs.
        Suitability is inferred from both care profiles rather than a specific pairing trial."
      condition: "A larger quiet community, preferably at least 150 cm long, with enough floor area and
        refuges for both adult social units."
    - species: "Copadichromis virginalis"
      reason: "A quiet utaka whose use of the water above the substrate complements the peacock. Both
        care profiles support the pairing at genus level."
      condition: "At least 150 cm length and 400 L as a cautious mixed-group allowance; open swimming
        space and separate spawning areas."
    - species: "Labidochromis caeruleus"
      reason: "Explicitly named by the peacock care sheet as a possible peaceful mbuna companion; some
        individuals may still outcompete timid peacocks."
      condition: "A larger aquarium with distinct rock shelter areas; retain only if all peacocks eat
        normally and remain unharassed."
  unsuitable:
    - species: "Aulonocara kandeense"
      reason: "Separately valid Kande Island species, not the white variant of this profile. It shares
        the presumed Aulonocara crossing group and can obscure breeding identity."
    - species: "Aulonocara stuartgranti"
      reason: "Shares the presumed Aulonocara crossing group, with look-alike females and potential male
        competition."
    - species: "Sciaenochromis fryeri"
      reason: "Shares the second presumed crossing group; care accounts describe courtship of peacock
        females and displacement of their males."
    - species: "Melanochromis auratus"
      reason: "A forceful mbuna is a poor temperament match for the weakly competitive sulphurhead; the
        mismatch follows the species warnings against aggressive mbuna."
    - species: "Fry and fish around 2 cm or smaller"
      reason: "The conservative level-1 decision allows opportunistic capture. No species-specific
        prey-size threshold is measured, so this is a precautionary planner category."
profile:
  overview:
    text: "The sulphurhead peacock is a small, gentle Aulonocara from two reefs in southeastern Lake
      Malawi. Adult males show a yellow head and dorsal blaze over a dark body with blue tones;
      females are much less conspicuous. This profile covers A. maylandi Trewavas, 1984. The former
      A. maylandi kandeensis is separately valid as A. kandeense, and the bare label A. sp. 'Kande'
      does not identify either fish reliably. The cichlids.com archive also lists sulphurhead and
      blue orchid breeding stock separately, although a sale list is weak taxonomic evidence."
    sources:
      - kind: "catalog-of-fishes"
        title: "Eschmeyer's Catalog of Fishes: species of Aulonocara, version updated 21 September 2026"
        url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=spec\
          ies&genus=Aulonocara"
        accessed: "2026-10-13"
      - kind: "database"
        title: "FishBase: Aulonocara maylandi species summary"
        url: "https://www.fishbase.se/summary/Aulonocara-maylandi.html"
        accessed: "2026-10-13"
      - kind: "database"
        title: "Malawi.si species directory: Aulonocara sp. 'chitande type kande', Kande Island"
        url: "https://www.malawi.si/MalawiByLocations/Kande%20Island/slides/Aulonocara%20sp.%20%27chitand\
          e%20type%20kande%27%20Kande%20Island.html"
        accessed: "2026-10-13"
      - kind: "website"
        title: "Schaefer, F. (2020). Aulonocara maylandi. Aquarium Glaser fish archive"
        url: "https://www.aquariumglaser.de/fischarchiv/aulonocara-maylandi/"
        accessed: "2026-10-13"
      - kind: "archive"
        title: "cichlids.com forum thread 58835"
        url: "https://www.cichlids.com/disc/read.php?3,58835"
        accessed: "2026-10-13"
  habitat:
    text: "Chimwalani Reef, formerly Eccles Reef, and Luwala Reef, formerly West Reef, contain the
      known southeastern populations. The fish uses sandy feeding ground adjoining rock shelters,
      with specialist accounts placing it around 12 to 18 m deep. The adopted natural Lake Malawi
      envelope is 21 to 29 C, pH 7.7 to 8.6, GH 3 to 5 dGH and KH 5 to 8 dKH. These are compiled
      lake conditions across locations and seasons, not an instruction to cycle an aquarium through
      all endpoints. Low calcium and magnesium hardness can coexist with alkaline, buffered water."
    sources:

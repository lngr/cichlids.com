  husbandry:
    text: >-
      For one male with four females, allow at least 300 L, 130 cm length and a planned 47.5 cm
      front-to-back depth. The depth is a layout estimate. Arrange stable shelters and visual
      breaks while leaving a generous fine-sand feeding area. Use an established biological
      filter, good gas exchange and regular water changes, and keep conditions steady; about 24
      to 26 C is a practical routine target. The planner tolerances are 21 to 29 C, pH 7.5 to
      8.6, GH 3 to 25 dGH and KH 5 to 12 dKH. Their endpoints are not proven ideal permanent
      setpoints. Measure GH and KH separately and assess existing water before adjusting
      minerals or buffering.
    sources:

      rationale: "Generator proposed 3 to 18 dGH and checker-b 3 to 20 dGH; checker-a, checker-c,
        tiebreaker-1 and tiebreaker-2 proposed 3 to 25 dGH. The tally selects 3 to 25 by qualified
        majority, four of six votes, with medium confidence. Fischlexikon recommends 3 to 15 dGH and
        supports the low end without confusing alkalinity with hardness. Seriously Fish recommends
        10 to 25 and my-fish repeats that range; The Evolved Fish also gives 10 to 25 but is a
        retailer, not independent husbandry research. AquaInfo gives 12 to 16, FedeAqua 10 to 20 and
        Tropical Fish Site 10 to 18 for breeding. FishBase gives a wider 10 to 30 dH range, which is
        not evidence of years of aquarium health at 30 dGH and is not adopted. The selected envelope
        contains natural 3 to 5 dGH; its upper part is based on care recommendations rather than a
        species-specific endpoint trial. Verification method: qualified-majority; votes 4 of 6."

          kind: "literature"
          title: "Branchu et al. (2010). Hydrochemistry (major and trace elements) of Lake Malawi (Nyasa),
            Tanzanian Northern Basin: local versus global considerations. Hydrology and Earth System
            Sciences Discussions 7, 4371-4409."
          url: "https://doi.org/10.5194/hessd-7-4371-2010"
          accessed: "2026-10-13"
        value:
          min: 6.5
          max: 6.9
        note: "Table 2 alkalinity of 2.334 to 2.461 meq/L multiplied by 2.8. The upper observation is at
          125 m."
    tolerance:
      value:
        min: 5
        max: 12
      confidence: "low"
      rationale: "Generator proposed 5 to 10 dKH, checker-b 5 to 15, and checker-a, checker-c,
        tiebreaker-1 and tiebreaker-2 5 to 12. The tally groups the generator range with the four 5
        to 12 proposals under the 2 dKH agreement rule and takes their median bounds, giving 5 to 12
        by qualified majority, five of six votes, with low confidence. JBL recommends 5 to 10 for
        Malawi aquaria and the Malawi.si regional guidance 6 to 12; Cuboid Aquatics gives 6 to 12
        specifically for stock sold as maylandi but remains a retailer source. OATA gives the wider
        10 to 15 dKH group range, repeated by Tropical Fish Co, while FishyHub gives 8 to 12 or more
        without a defined upper endpoint. Those broader general recommendations do not establish
        maylandi health at 15 dKH. Aqua-Fish discusses 4, 5 and 6 as buffering choices, not a
        measured lifetime tolerance. The adopted range contains natural 5 to 8 dKH and remains an
        extrapolation; an AquaBota congener page did not expose readable care data and is excluded."

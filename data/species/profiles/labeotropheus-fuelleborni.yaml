  ghDgh:
    value:
      min: 3
      max: 5
    confidence: "high"
    rationale: "All four runs propose 3 to 5 dGH and the waterbody decision retains it at high confidence. The FAO
      calcium and magnesium ranges convert to approximately 3.2 to 4.9 dGH using dGH = Ca/7.14 + Mg/4.34 with
      concentrations in mg/L. Paired upper-50-m measurements in Branchu give about 4.2 to 4.6 dGH. Alkaline pH
      and bicarbonate buffering are compatible with this relatively low calcium and magnesium hardness."
    sources:
      - *a7
      - *a6
      - *a4
      - *a5
      - *a8
    evidence:
      - source: *a6
        value: &a24
          min: 3.2
          max: 4.9
        note: "Converted Ca and Mg ranges from the historical measurements; rounded component envelope."
      - source: *a7
        value: &a25
          min: 4.2
          max: 4.6
        note: "Converted paired Ca and Mg measurements in the upper 50 m."
    tolerance:
      value:
        min: 3
        max: 25
      confidence: "medium"
      rationale: "Generator, checker-a, checker-b and checker-c all propose 3 to 25 dGH; tally retains unanimous
        verification and medium confidence. The 3 dGH lower endpoint contains the natural lake envelope
        supported by ion measurements. Seriously Fish gives 10 to 25 dGH; Aqua-Fish and Tropical Freshwater
        Fish both give the wider 12 to 30 dGH range. The 25 dGH ceiling deliberately retains the more cautious
        published upper recommendation instead of extending to 30 dGH. Einrichtungsbeispiele gives 5 to 15,
        Fischlexikon 3 to 15 and Monitarium 10 to 20 dGH. Agreement between agents is not a controlled
        long-term test at the endpoints; high GH is a reported aquarium tolerance rather than a natural
        requirement."

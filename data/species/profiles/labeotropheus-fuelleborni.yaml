  temperatureC:
    value:
      min: 21
      max: 29
    confidence: "high"
    rationale: "The waterbody decision fixes 21 to 29 C at high confidence, with all four full-profile runs
      proposing that range. Eccles reports 21 C inshore cooling and about 27 C in the upper water; Vollmer
      describes seasonal surface temperatures below 24 C to about 28 C, while the historical FAO compilation
      gives the narrower 23 to 25 C. These observations cover different seasons and sites. The 29 C ceiling is
      retained exactly from the lake decision; the Ngochera repository abstract confirms seasonal lake
      sampling but does not independently expose that endpoint. Its dissertation full text and the 1999 mixing
      chapter were not retrieved through fetch-oa, so no new numerical evidence is attributed to them."

  note: "Catalog of Fishes retains Labeotropheus fuelleborni Ahl, 1926 and eleven valid species in this genus.
    Pauers' 2018 study concerns ecology and experimental hybridization, not a taxonomic revision; the Pauers
    and Phiri revision of 2023 describes six species following collecting trips in 2018 and 2020. CRC instead
    follows Konings' broader synonymy and uses 1927. The Catalog controls the name, authority and species
    limits here. In particular, the robust Maleri population belongs to L. alticodia, Mumbo to L.
    artatorostris, Katale to L. chlorosiglos and Namalenje to L. obscurus under that treatment. They are not
    included as variants or synonyms of this profile. Legacy entry 318 has no verified collecting locality, so
    it cannot be reassigned to one of these species. Older husbandry sources may cover a broader species
    concept."

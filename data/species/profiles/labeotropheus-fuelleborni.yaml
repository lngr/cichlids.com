  maxSizeCm:
    value:
      male: 18
      female: 15
    confidence: "medium"
    rationale: "Generator, checker-b and checker-c propose males 18 cm and females 15 cm; checker-a proposes 17.5
      and 12 cm. Retain 18 and 15 cm as practical adult aquarium planning maxima: Malawi-Guru gives males
      about 18 cm and females 14 to 15 cm, and Aqua-Fish gives an unsexed aquarium range of 13 to 18 cm.
      Tropical Freshwater Fish gives 18 and 13 cm, while Oliver gives about 18 cm for both sexes. Female
      maxima remain less settled. Seriously Fish's 17.5 cm is standard length and is not converted directly
      into a total-length planning figure. FishBase's 30 cm male record and 8.7 cm female standard-length
      record are not typical aquarium maxima; Oliver also disputes the attribution of the male figure. These
      uncertainties prevent high confidence."

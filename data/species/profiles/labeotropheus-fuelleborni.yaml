  khDkh:
    value:
      min: 5
      max: 8
    confidence: "high"
    rationale: "All four runs propose the natural 5 to 8 dKH interval, retained at high confidence from the lake
      decision. FAO alkalinity of 2.00 to 2.59 meq/L converts to about 5.6 to 7.3 dKH. Branchu upper-30-m
      values of 2.3339 to 2.3978 meq/L give about 6.5 to 6.7 dKH; including its 125-m sample extends that
      study to about 6.9 dKH. Sodium contributes counterions to bicarbonate, so alkalinity expressed as KH can
      exceed GH. No verification object is assigned to this natural KH fact."
    sources:
      - *a7
      - *a6
      - *a4
      - *a5
      - *a8
    evidence:
      - source: *a6
        value: &a26
          min: 5.6
          max: 7.3
        note: "Converted alkalinity from the historical lake measurements."
      - source: *a7
        value: &a27
          min: 6.5
          max: 6.7
        note: "Converted upper-30-m alkalinity; including the 125-m sample gives about 6.5 to 6.9 dKH."
    tolerance:
      value:
        min: 5
        max: 15
      confidence: "low"
      rationale: "Generator, checker-a, checker-b and checker-c all propose 5 to 15 dKH; tally retains unanimous
        verification and low confidence. Monitarium explicitly gives 10 to 15 dKH and the LiveAquaria retailer
        gives the wider 10 to 20 dKH range. The selected ceiling follows the lower of those recommendations,
        while 5 dKH includes natural buffering supported by lake alkalinity measurements. Seriously Fish and
        Tropical Freshwater Fish do not state separate KH intervals, so checker-a's inferred KH evidence from
        their pH and GH advice is excluded. LiveAquaria remains a low-weight website source. The lake studies
        support the natural part of the envelope, not years of aquarium health at 15 dKH; the upper extension

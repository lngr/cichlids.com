partners:
  suitable:
    - species: "Maylandia estherae"
      reason: "Robust rock-dwelling mbuna with a compatible plant-rich feeding regime; choose an orange male form to
        reduce similarity to blue fuelleborni."
      condition: "At least the 600 L minimum with added room for both harems and separated rocky retreats; monitor
        for bullying and be ready to separate."
    - species: "Maylandia lombardoi"
      reason: "Assertive mbuna with a similar vegetable-based care diet; mature yellow males differ from the usual
        blue fuelleborni. This is a demanding combination."
      condition: "Prefer a tank larger than 600 L and longer than 150 cm; one male per species with females and
        distinct territories. Females and subordinate males remain blue, so rivalry is still possible."
    - species: "Pseudotropheus johannii"
      reason: "An assertive mbuna that accepts a plant-rich staple and whose horizontal male stripes differ from the
        typical vertical fuelleborni pattern."
      condition: "Use well-grown adults with additional space beyond the minimum social unit; avoid small or timid
        individuals and watch for persistent harassment."
  unsuitable:
    - species: "Labeotropheus trewavasae"
      reason: "Shares the presumed labeotropheus hybrid group; forced experiments produced fertile offspring.
        Similar shape also invites rivalry."
    - species: "Labeotropheus chlorosiglos"
      reason: "A separate valid species rather than a Katale colour form here; shares the presumed genus crossing
        group and similar territorial behaviour."
    - species: "Aulonocara stuartgranti"
      reason: "A comparatively peaceful peacock is vulnerable to harassment and loss of feeding access in this
        aggressive rocky community."
    - species: "Copadichromis borleyi"
      reason: "An open-water utaka whose feeding and space use fit poorly with a dominant rock-grazing mbuna
        community."
profile:
  overview:
    text: "A projecting fleshy snout above a downward-facing mouth gives Labeotropheus fuelleborni its distinctive
      profile. This robust mbuna spends much of its time grazing rock surfaces in Lake Malawi. Mature males
      are usually blue with dark markings, while orange and blotched forms add considerable variety. The valid
      name remains Labeotropheus fuelleborni Ahl, 1926. Several populations historically sold under this name
      are separate species in the Catalog, so a locality label and reliable breeding history are useful parts
      of the fish's identity. Strong territorial behavior makes this a demanding first cichlid."
    sources:
      - *a1
      - *a30
      - *a2
      - *a31
      - *a10
  habitat:
    text: "The species is native to Lake Malawi, with its type locality near Lumbila in Tanzania and
      experimentally studied stock from Chidunga Rocks. It feeds around shallow rocky shores and islands where
      water movement keeps oxygen available. Reproduce the useful features of this habitat with stable rock
      faces, crevices and sheltered paths. The decided natural lake ranges are 21 to 29 C, pH 7.7 to 8.6, GH 3
      to 5 dGH and KH 5 to 8 dKH. These span places and seasons rather than describing one constant aquarium
      setting. Calcium and magnesium hardness is relatively low even though bicarbonate provides substantial
      buffering."
    sources:
      - *a1
      - *a2
      - *a6
      - *a7
      - *a4
      - *a5
      - *a31
  sizeAndGrowth:
    text: "Allow for a typical adult aquarium planning maximum of about 18 cm for males and 15 cm for females.
      Published sex-specific figures differ, so these values should guide space planning rather than predict
      every individual. Standard-length records exclude the tail and cannot be treated as equivalent to
      aquarium total lengths. Heavy feeding can produce unusually large captive fish without demonstrating a
      healthier outcome. Juveniles need access to their adult space before territorial behavior intensifies.
      Husbandry sources suggest a lifespan envelope of roughly seven to twelve years, with limited evidence
      for precise age boundaries."
    sources:
      - *a28
      - *a10
      - *a12
      - *a29
      - *a3
      - *a23
      - *a11
  husbandry:
    text: >-
      For the recommended one male and four females, use at least 600 L with 150 cm length and
      about 55 cm front-to-back room. The depth is a layout allowance for separate rock
      structures and retreat routes. More fish may need a larger tank. Anchor rocks securely and
      leave swimming passages between them. Strong oxygenation, suitable biological filtration
      and regular matched-water changes are essential. A stable 24 to 26 C is a well-supported
      routine target. The recorded tolerances are 21 to 29 C, pH 7.5 to 8.8, GH 3 to 25 dGH and
      KH 5 to 15 dKH; temperature extremes and the KH extension have weaker long-term support.
      Test GH and KH separately and change conditions gradually.
    sources:
      - *a6
      - *a7
      - *a28
      - *a38
      - *a11
      - *a9
      - *a10
      - *a23
  socialBehavior:
    text: "Keep a single adult male with four females in the minimum arrangement. Male pursuit can become
      persistent, and rivals or unreceptive females need routes out of sight. The conspecific aggression
      rating is 3: injuries become a substantial concern when space, shelter or the sex ratio is inadequate. A
      female that hides constantly or misses meals may be under pressure before damage is obvious. Multiple
      male groups need much more room and active management. Robust heterospecific mbuna can distribute
      attention, but they also add territory and filtration demands."
    sources:
      - *a9
      - *a28
      - *a38
      - *a13
      - *a10
  diet:
    text: "Make a plant-rich mbuna formulation the main food, with spirulina-based flakes or pellets and rock
      biofilm available for grazing. Small accepted portions of vegetables provide variety. Tiny animals in
      the natural biofilm and opportunistically consumed fry do not change the aufwuchs feeding
      classification. Predation level 1 is a conservative low-confidence decision, so exposed fry and very
      small fish cannot be assumed safe. Avoid feeding to the fish's apparent appetite without checking body
      condition and waste production. Some animal food is accepted, but rich feeding is linked in care sources
      to digestive problems. The bloat sensitivity flag expresses a husbandry risk with multiple possible
      contributing causes."
    sources:
      - *a2
      - *a31
      - *a10
      - *a29
      - *a9
  breeding:
    text: "Females incubate eggs and young orally, usually releasing fry after roughly three to four weeks. The
      male courts multiple females and does not share brood care. A brooding female eats little and needs a
      refuge from pursuit; unnecessary capture can interrupt incubation. If young are to be raised, prepare a
      sheltered nursery with matched water and appropriate filtration. Finely divided suitable food can be
      provided after release. Community adults may consume exposed fry. Species and locality records matter
      because laboratory work has produced fertile fuelleborni and trewavasae hybrids under forced pairing."
    sources:
      - *a2
      - *a15
      - *a31
      - *a9
  sexing:
    text: "Use several clues together when choosing adults. Males normally become larger and more strongly blue,
      with conspicuous anal-fin markings; females are often greyish but may be orange or blotched. Rare
      blotched males make colour alone unreliable. Juvenile and subordinate patterns can also mislead.
      Brooding confirms a female in this maternal mouthbrooder. Ask for locality and breeding history as well
      as sexing confidence. Distinguishing recently separated Labeotropheus species can require more than
      judging colour or snout shape from a photograph."
    sources:
      - *a30
      - *a9
      - *a31
      - *a12
  compatibility:
    text: "Adult robust mbuna with a compatible plant-rich staple are conditional companions in spacious aquaria.
      Orange male Maylandia estherae, yellow male M. lombardoi and striped Pseudotropheus johannii are
      examples requiring close observation; appearance differences may reduce rivalry but cannot prevent
      attacks. The minimum aquarium describes the fuelleborni social unit, so additional groups need extra
      room. Peaceful peacocks and open-water utaka are poor matches for the aggression rating of 3. Other
      Labeotropheus species share the presumed hybrid group. The forced breeding experiments demonstrate
      interfertility, without demonstrating free-choice crosses among every group member. Locality lines of
      the same species can also lose identity when mixed."
    sources:
      - *a2
      - *a15
      - *a9
      - *a28
      - *a38
      - kind: "database"
        title: "Seriously Fish: Pseudotropheus estherae (valid name Maylandia estherae)"
        url: "https://www.seriouslyfish.com/species/pseudotropheus-estherae/"
        archived: seriouslyfish.com/species/pseudotropheus-estherae/2026-10-14T101015Z
        accessed: "2026-10-13"
      - kind: "database"
        title: "Seriously Fish: Pseudotropheus lombardoi (valid name Maylandia lombardoi)"
        url: "https://www.seriouslyfish.com/species/pseudotropheus-lombardoi/"
        archived: seriouslyfish.com/species/pseudotropheus-lombardoi/2026-10-14T101017Z
        accessed: "2026-10-13"
      - kind: "database"
        title: "Seriously Fish: Melanochromis johanni (valid name Pseudotropheus johannii)"
        url: "https://www.seriouslyfish.com/species/melanochromis-johanni/"
        archived: seriouslyfish.com/species/melanochromis-johanni/2026-10-14T101019Z
        accessed: "2026-10-13"
      - *a39
  problems:
    text: "Persistent harassment, inadequate oxygenation and excessive feeding are practical threats. Investigate
      missed meals, sustained hiding and fin damage early by checking water quality and the social
      arrangement. Abdominal swelling or abnormal breathing does not identify one cause on its own; persistent
      illness needs qualified assessment. New arrivals should be quarantined and acclimated to existing
      conditions. Keep refuges accessible as adults grow. Taxonomic confusion is another avoidable problem: a
      familiar old locality name may now designate a separate valid species, so species and breeding-line
      identity should be checked before combining stock."
    sources:
      - *a1
      - *a30
      - *a9
      - *a10
      - *a28

      rationale: "All four full-profile runs agree on aufwuchs and bloatSensitive true; tally assigns unanimous
        verification and high confidence. Pauers describes morphology specialized for removing attached algae,
        and FishBase, Seriously Fish and the husbandry directories favor a plant-rich staple. Small animal

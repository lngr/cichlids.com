    tolerance:
      value:
        min: 5
        max: 14
      confidence: low
      verification:
        method: median
        votes:
          agree: 3
          total: 6
      rationale: "The proposals in vote order are 5 to 8, 5 to 15, 5 to 8, 5 to 15, 5 to 15, 5 to 12 (dKH).\
        \ Without a qualified majority, the medians of all proposed minima and maxima are 5 and 13.5,\
        \ rounded to 5 to 14 dKH. The median 5 to 14 dKH contains the natural 5 to 8 range without\
        \ widening. Explicit recommendations include: OATA 10 to 15 dKH, JBL 5 to 10 and Malawi.si 6\
        \ to 12; the species-specific Portalpez sheet gives 4 to 8. They are recommendations or\
        \ extrapolations without species-specific multi-year tests. GH and KH cannot be converted\
        \ interchangeably; Seachem explicitly distinguishes carbonate buffering from GH. The median 5\
        \ to 14 dKH contains the natural 5 to 8 range and overlaps cited Malawi husbandry\
        \ recommendations, making it plausible with stable pH and separate GH and KH measurements.\
        \ Confidence is low because endpoint support is incomplete."

  compatibility:
    text: "A carefully selected community of similarly sized mbuna with compatible feeding needs is possible. Maylandia\
      \ congeners share a presumed crossing caution, which does not claim a verified hajomaylandi cross. Avoid close\
      \ visual rivals, very small peaceful fish and companions requiring an animal-protein staple. Existing mixed-stock\
      \ reports show aquarium use rather than universal success."
    sources:

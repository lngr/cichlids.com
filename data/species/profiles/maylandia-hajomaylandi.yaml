      rationale: "Generator, checker-b and checker-c propose level 2; checker-a proposes 3. Malawi-Guru describes\
        \ limited defence among neighbouring territories and NVC recommends several females per male. The very aggressive\
        \ forum label and severe warnings on Fishipedia, my-fish and Aquarist Atlas are retained, but do not establish\
        \ routine injuries in the recommended one-male harem. Level 2 describes regular hierarchy and chasing in\
        \ adequate space, with escalation possible under poor social conditions."

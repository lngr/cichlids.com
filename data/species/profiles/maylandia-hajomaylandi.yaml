  problems:
    text: "Stress can rise when rivals cannot escape or a female receives repeated attention. Severe\
      \ aggression warnings coexist with reports of restrained defence, so monitor the actual harem.\
      \ Inappropriate feeding and unstable water can compound these problems. The decided KH tolerance\
      \ of 5 to 14 dKH is a median estimate; broader husbandry recommendations remain in the evidence\
      \ and are not proven unsafe."
    sources:

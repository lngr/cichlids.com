  sexing:
    text: "Adult males usually show stronger blue colour, vertical barring and orange or yellow accents. Females\
      \ are generally beige to brown, with conspicuous yellow unpaired fins in the NVC description. Colours depend\
      \ on maturity and social state. The profile colour feature records the adult male palette, while female fin\
      \ colour can help distinguish the separate Pombo form."

        - by: checker-c
          value: hasty
      decision: hasty
      rationale: "Generator, checker-a and checker-c propose hasty; checker-b proposes normal because direct speed\
        \ observations are absent. The rubric explicitly uses Maylandia mbuna as its hasty example, so that planning\
        \ category is retained as a low-confidence genus inference. Grazing and plankton feeding alone cannot demonstrate\
        \ aquarium feeding speed."

        - by: checker-a
          value:
            type: aufwuchs
            bloatSensitive: true
            foods:
              - spirulina flakes
              - vegetable matter
              - quality cichlid pellets
              - occasional frozen mysis or brine shrimp
        - by: checker-b
          value:
            type: aufwuchs
            bloatSensitive: true
            foods:
              - rock biofilm
              - algae
              - phytoplankton
              - small invertebrates
        - by: checker-c
          value:
            type: aufwuchs
            bloatSensitive: true
            foods:
              - algae
              - phytoplankton
              - small invertebrates
      decision:
        type: aufwuchs
        bloatSensitive: true
        foods:
          - algae
          - biofilm
          - phytoplankton
          - small invertebrates
      rationale: "All four complete runs agree on aufwuchs and bloatSensitive true; the tally retains the generator\
        \ food list. CRC identifies algae combing, FishBase includes plankton feeding and Malawi-Guru distinguishes\
        \ phytoplankton foraging from territorial grazing. Zoopet, a retailer and a keeper use omnivore labels,\
        \ but their food acceptance does not establish a predominantly animal-based diet. NVC and other husbandry\
        \ sources support plant-rich feeding and restraint with animal protein. CRC and FishBase do not test bloat\
        \ sensitivity, so checker-c false flags derived from their silence are retained only as annotated dissenting\
        \ evidence. Medium confidence reflects the lack of a species-specific dietary trial. Verification method\
        \ unanimous."
    - field: features.aggressionConspecific

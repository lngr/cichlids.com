  habitat:
    text: "The species stays near sediment-covered rocks and sand patches around Chizumulu Island. Plankton feeding\
      \ also takes it into the water immediately above these substrates. The natural lake envelope is 21 to 29 C,\
      \ pH 7.7 to 8.6, 3 to 5 dGH and 5 to 8 dKH, based on lake studies rather than aquarium recipes."

  socialBehavior:
    text: "Expect a hierarchy and regular chasing within the harem. Males defend small cave or tunnel sites and\
      \ nearby feeding patches, and courtship can occur throughout the year. Unlike mbuna are usually tolerated,\
      \ but rivals and poorly sheltered females can face escalating pressure. A small keeping group with one male\
      \ is easier to plan than several competing males."

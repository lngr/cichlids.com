      decision:
        continent: Africa
        region: Lake Malawi
        waterbody: lake-malawi
        localities:
          - Chizumulu Island
      rationale: "The Catalog of Fishes, FishBase and the original-description abstract locate the species at Chizumulu\
        \ Island. Malawi.si also includes nearby Chiwi Rocks and Linganjala Reef. Lake Malawi is normalized to the\
        \ waterbody identifier lake-malawi; these reef records do not extend the profile to the distinct Pombo form."
    - field: features.ghDgh.tolerance
      proposals:
        - by: generator
          value:
            min: 3
            max: 15
        - by: checker-a
          value:
            min: 3
            max: 20
        - by: checker-b
          value:
            min: 3
            max: 20
        - by: checker-c
          value:
            min: 3
            max: 20
        - by: tiebreaker-1
          value:
            min: 3
            max: 20
        - by: tiebreaker-2
          value:
            min: 3
            max: 20
      decision:
        min: 3
        max: 20
      rationale: "The qualified majority decides 3 to 20 dGH with medium confidence: checker-a, checker-b, checker-c\
        \ and both tiebreakers propose that interval, while generator proposes 3 to 15. The natural 3 to 5 baseline\
        \ must remain included. FishBase lists 10 to 20 dH and my-fish explicitly recommends 10 to 20 dGH for aquarium\
        \ care; neither is accepted as a lake measurement. Fishipedia gives 8 to 15, Einrichtungsbeispiele 5 to\
        \ 15, OATA 12 to 18 and Malawi.si 3 to 15. Wider congener sources give 10 to 25 dGH in Seriously Fish and\
        \ up to 25 dH in Fishkeeper. Those wider congener values are preserved but do not justify exceeding the\
        \ species-supported upper value of 20. No multi-year endpoint trial was found."
    - field: features.khDkh.tolerance
      proposals:
        - by: generator
          value:
            min: 5
            max: 8
        - by: checker-a
          value:
            min: 5
            max: 15
        - by: checker-b
          value:
            min: 5
            max: 8
        - by: checker-c
          value:
            min: 5
            max: 15
        - by: tiebreaker-1
          value:
            min: 5
            max: 15
        - by: tiebreaker-2
          value:
            min: 5
            max: 12
      decision:
        min: 5
        max: 14
      rationale: "The proposals in vote order are 5 to 8, 5 to 15, 5 to 8, 5 to 15, 5 to 15, 5 to 12 (dKH).\
        \ Without a qualified majority, the medians of all proposed minima and maxima are 5 and 13.5,\
        \ rounded to 5 to 14 dKH. The median 5 to 14 dKH contains the natural 5 to 8 range without\
        \ widening. Explicit recommendations include: OATA 10 to 15 dKH, JBL 5 to 10 and Malawi.si 6\
        \ to 12; the species-specific Portalpez sheet gives 4 to 8. They are recommendations or\
        \ extrapolations without species-specific multi-year tests. GH and KH cannot be converted\
        \ interchangeably; Seachem explicitly distinguishes carbonate buffering from GH. The median 5\
        \ to 14 dKH contains the natural 5 to 8 range and overlaps cited Malawi husbandry\
        \ recommendations, making it plausible with stable pH and separate GH and KH measurements.\
        \ Confidence is low because endpoint support is incomplete."
    - field: features.maxSizeCm
      proposals:
        - by: generator
          value:
            male: 14
            female: 10
        - by: checker-a
          value:
            male: 13
            female: 10
        - by: checker-b
          value:
            male: 12
            female: 9
        - by: checker-c
          value:
            male: 14
            female: 10
      decision:
        male: 13.5
        female: 10
      rationale: "Generator proposed male 14 and female 10 cm; checker-a 13 and 10; checker-b 12 and 9; checker-c\
        \ 14 and 10. The per-sex medians are 13.5 and 10 cm. They lie among the species records of 12 cm in FishBase,\
        \ 13 cm in Zoopet and 14/10 cm in NVC, with an independent 12/10 cm aquarium account at Einrichtungsbeispiele.\
        \ NVC also reports aquarium males reaching 18 cm and Malawi.si reports 16 cm or more, but neither establishes\
        \ how typical those larger adults are. The decided planning maximum follows the proposal median rather than\
        \ the largest report and is not an absolute growth ceiling."
    - field: features.predation
      proposals:
        - by: generator
          value: 0
        - by: checker-a
          value: 1
        - by: checker-b
          value: 0
        - by: checker-c
          value: 0
        - by: tiebreaker-1
          value: 0
        - by: tiebreaker-2
          value: 0
      decision: 0
      rationale: "The settled qualified majority is level 0, with generator, checker-b, checker-c and both tiebreakers\
        \ agreeing, against checker-a at level 1. FishBase and CRC describe plankton feeding and rock-growth grazing\
        \ rather than fish prey. Checker-a inferred opportunistic fry predation from general mbuna practice; the\
        \ Malawi.si aquarium guide gives a general mouth-sized juvenile warning without a species observation or\
        \ a 2 cm threshold. Incidental fry capture remains possible under level 0. Quality Marine conflates Chizumulu\
        \ fish with the separate Pombo form, so its feeding account receives limited weight. The archive offers\
        \ no species-specific observation of fish prey. Verification method qualified-majority."
    - field: features.diet
      proposals:
        - by: generator
          value:
            type: aufwuchs
            bloatSensitive: true
            foods:
              - algae
              - biofilm
              - phytoplankton

  temperatureC:
    value:
      min: 21
      max: 29
    confidence: high
    rationale: "The natural value is the settled Lake Malawi envelope of 21 to 29 C with waterbody verification.\
      \ FAO compiles surface measurements of 23 to 25 C; seasonal limnology by Eccles, Vollmer and subsequent lake\
      \ work accounts for cooler littoral water and warmer surface periods. This lake-wide envelope is not a measurement\
      \ of all endpoints at Chizumulu. Species aquarium recommendations remain separate evidence and do not narrow\
      \ the natural range."

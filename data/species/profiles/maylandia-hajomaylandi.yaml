  sizeAndGrowth:
    text: "The planning maxima are 13.5 cm for males and 10 cm for females. Reports of aquarium males reaching 16\
      \ to 18 cm show that these are not absolute growth limits. Published and hobby size estimates mix wild and\
      \ captive fish. A lifespan of 5 to 10 years is provisional, with estimates ranging more widely and no reliable\
      \ growth schedule."

  note: "The Catalog of Fishes genus list updated 21 September 2026 accepts Maylandia hajomaylandi; its Metriaclima\
    \ query returned no records. FishBase follows Maylandia, whereas CRC and Konings, Geerts and Stauffer (2026)\
    \ use Metriaclima and dispute the availability of Maylandia. This profile follows the prescribed Catalog authority\
    \ while retaining the dissenting literature. Pseudotropheus greberi is an aquarium trade label, not a formally\
    \ described synonym."

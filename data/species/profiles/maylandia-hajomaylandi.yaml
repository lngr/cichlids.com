partners:
  suitable:
    - species: Lake Malawi mbuna with compatible plant-rich diets
      reason: Species-specific husbandry accounts allow robust companions of similar size and temperament.
      condition: Provide more space than the single-harem minimum and separate rock retreats.
    - species: Petrotilapia genalutea
      reason: Named by Malawi-Guru as a possible companion with compatible grazing ecology.
      condition: Use a larger structured community aquarium and monitor individual behaviour.
  unsuitable:
    - species: Maylandia zebra
      reason: Shares the presumed maylandia crossing group and may resemble a territorial rival.
    - species: Maylandia estherae
      reason: Shares the presumed maylandia crossing group; the caution concerns possible hybrid offspring.
    - species: Small peaceful community fish
      reason: Active territorial mbuna can outcompete or harass them; incidental fry capture remains possible.
    - species: Fish requiring an animal-protein staple
      reason: Their staple diet conflicts with the decided aufwuchs and bloat-sensitive feeding requirements.
profile:
  overview:
    text: "This Chizumulu Island mbuna combines a barred blue male with orange and yellow accents. The catalog name\
      \ is Maylandia hajomaylandi, although Metriaclima remains common in specialist literature. Greberi is an older\
      \ aquarium label. Fish sold as hajomaylandi Pombo represent a separate form and are not covered by this profile."

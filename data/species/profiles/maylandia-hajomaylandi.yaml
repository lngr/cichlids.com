  diet:
    text: "Use plant-rich mbuna foods as the staple. Natural feeding includes algae and biofilm grazing as well\
      \ as plankton and small invertebrates. Occasional appropriate invertebrate foods need not become a high-animal-protein\
      \ diet. The bloat-sensitive flag reflects husbandry cautions, with medium confidence rather than a species-specific\
      \ experimental result."
    sources:
      - kind: database

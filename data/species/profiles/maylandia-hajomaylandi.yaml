    tolerance:
      value:
        min: 3
        max: 20
      confidence: medium
      verification:
        method: qualified-majority
        votes:
          agree: 5
          total: 6
      rationale: "The qualified majority decides 3 to 20 dGH with medium confidence: checker-a, checker-b, checker-c\
        \ and both tiebreakers propose that interval, while generator proposes 3 to 15. The natural 3 to 5 baseline\
        \ must remain included. FishBase lists 10 to 20 dH and my-fish explicitly recommends 10 to 20 dGH for aquarium\
        \ care; neither is accepted as a lake measurement. Fishipedia gives 8 to 15, Einrichtungsbeispiele 5 to\
        \ 15, OATA 12 to 18 and Malawi.si 3 to 15. Wider congener sources give 10 to 25 dGH in Seriously Fish and\
        \ up to 25 dH in Fishkeeper. Those wider congener values are preserved but do not justify exceeding the\
        \ species-supported upper value of 20. No multi-year endpoint trial was found."

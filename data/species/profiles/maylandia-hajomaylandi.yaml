  breeding:
    text: "Females carry eggs and developing fry in the mouth after spawning near a male-held shelter. Hobby accounts\
      \ commonly describe incubation of about three weeks, with differences in brood counts and timing. Provide\
      \ quiet retreats for brooding females. Predation level 0 allows incidental fry losses and does not make released\
      \ young safe with every adult tankmate."

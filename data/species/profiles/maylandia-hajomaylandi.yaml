  husbandry:
    text: "For one male and three females, the profile uses 300 litres with a 135 cm length and 50 cm depth. The\
      \ footprint is an interpolation between specialist recommendations, not a directly tested minimum. Stabilize\
      \ rocks against digging, provide separated retreats over sand and leave swimming lanes. Mixed mbuna communities\
      \ need additional space. Maintain filtration, oxygenation and steady alkaline water."

    tolerance:
      value:
        min: 21
        max: 29
      confidence: low
      verification:
        method: unanimous
        votes:
          agree: 4
          total: 4
      rationale: "All four complete runs propose 21 to 29 C and the tally is unanimous with low confidence. Species\
        \ care recommendations of 23 to 27, 23 to 28, 24 to 26 and 24 to 28 C sit inside that range; congener guidance\
        \ includes 22 to 28 C and the forum gives 25.6 to 27.8 C. The full natural seasonal envelope must remain\
        \ included. It does not prove equally strong multi-year keeping evidence at the two extremes, so central\
        \ care temperatures provide the firmer routine guidance."

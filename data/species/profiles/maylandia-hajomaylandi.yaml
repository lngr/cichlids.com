      decision:
        volumeL: 300
        lengthCm: 135
        depthCm: 50
      rationale: "Generator proposed 300 L, 150 cm length and 50 cm depth; checker-a 200 L, 120 cm and 40 cm; checker-b\
        \ 300 L, 120 cm and 50 cm; checker-c 300 L, 150 cm and 50 cm. The component medians are 300 L, 135 cm and\
        \ 50 cm. NVC supports about 300 L at 150 cm, Malawi-Guru supports 300 L at 120 cm for a species tank, and\
        \ Zoopet offers 200 L at 120 cm. The 135 cm length interpolates between these supported footprints; no source\
        \ prescribes that exact length, and the 50 cm depth is a layout estimate rather than a cited minimum. The\
        \ recommendation is for one male with three females and broken sightlines. Fishipedia gives a wider 500\
        \ L and 140 cm recommendation, while retailer and wiki figures fall to about 132 to 284 L; those recommendations\
        \ do not override the named specialist accounts. Mixed communities require more space than this harem minimum."

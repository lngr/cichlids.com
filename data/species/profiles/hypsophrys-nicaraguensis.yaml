  territory:
    value:
      size: large
      breedingOnly: false
    confidence: medium
    rationale: Breeding pairs in Lake Xiloá defend an area with a typical radius of about 50 cm around
      several pits they dig in the soft sediment, about 1 m across and more than a third of a 150 cm
      tank; in the tank the male patrols the boundary of a territory around the cave while the
      female guards the brood. Seriously Fish calls the species territorial in general and describes
      a pair that defends its territory against all comers as soon as it has formed; a mated pair
      stays together and spawns repeatedly. The territory is therefore large and not limited to the
      breeding phase, although breeding intensifies the defence.

      rationale: Decided conservatively because the votes did not reach a qualified majority. The
        proposals were 22 to 30 C (generator), 23 to 30 C (checker-a), 19 to 34 C (checker-b), 23 to
        36 C (checker-c and tiebreaker-1) and 23 to 33 C (tiebreaker-2). Their intersection, 23 to
        30 C, is widened to 32 C so that it contains the decided natural range. Care sheets
        recommend 23 to 28 C (Seriously Fish), 23 to 27 C (FishProfiles, Fishkeeper), about 24 to 28
        C (LiveAquaria, Riverpark Aquatics) and 22 to 28 C (Aquarium Glaser), and a Costa Rican
        hatchery held wild brood fish for 14 months at 25 to 27 C. FishBase gives 23 to 36 C. The
        sources thus span 19 to 36 C, wider than the decided range; the upper part from 29 to 32 C
        rests on habitat measurements, not on long-term husbandry, so the well supported keeping
        range stays at about 24 to 28 C.

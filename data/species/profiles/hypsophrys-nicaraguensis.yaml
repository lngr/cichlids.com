  synonyms:
    - name: Heros nicaraguensis
      note: Original combination, Günther 1864, type locality Lake Nicaragua.
    - name: Cichlasoma nicaraguense
      note: Combination used by Villa 1982, Bussing 1987 and Conkel 1993; source of the legacy spelling.
    - name: Copora nicaraguensis
      note: Combination used by Burgess 2000.
    - name: Heros balteatus
      note: Gill 1877, described from Lake Nicaragua; junior synonym.
    - name: Cichlasoma spilotum
      note: Meek 1912, described from Victoria, Costa Rica; junior synonym and origin of the trade name
        spilotum.
    - name: Hypsophrys unimaculatus
      note: Agassiz 1859; an older name that Chakrabarty and Sparks (2007) treated as valid, while the
        Catalog of Fishes follows Kullander and Hartel (1997) in keeping the younger name in use.
  legacyNames:
    - Hypsophrys nicaraguense
    - Cichlasoma nicaraguense
  note: The legacy spelling uses the neuter ending of the former combination with Cichlasoma. The
    Catalog of Fishes lists Hypsophrys nicaraguensis as valid and as the only valid species of the
    genus; Neetroplus nematopus, which some authors move into Hypsophrys, stays valid in Neetroplus
    there. The public Cichlid Room Companion classification agrees.
    The legacy catalog also held the species under Cichlasoma nicaraguense, and that entry maps to this profile.

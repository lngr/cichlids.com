  maxSizeCm:
    value:
      male: 22
      female: 16
    confidence: medium
    rationale: Males clearly outgrow females. FishBase gives 16.5 cm standard length for the largest
      male (about 21 cm total length), 20 cm total length for females and 25 cm total length as
      overall maximum; Seriously Fish gives 25 cm for males and 20 cm for females as maxima. A
      wholesaler reports females usually at 10 to 12 cm and rarely up to 18 cm. Wild fish in Lake
      Xiloá stay much smaller (about 8 to 12 cm standard length in males). Well-kept aquarium males
      typically reach about 22 cm and females about 16 cm; the 25 and 20 cm figures are maxima.

    confidence: low
    rationale: "Decided by qualified majority (4 of 6 votes): generator proposed 3 to 9 dGH, checker-a
      and tiebreaker-1 3 to 8 dGH and checker-c 3 to 7 dGH; the median of the agreeing maxima is 8.
      Checker-b proposed 0.5 to 7.7 dGH and tiebreaker-2 5.6 to 7.7 dGH. Lake Nicaragua is
      moderately soft: calcium and magnesium give 3.3 to 3.5 dGH in the 1960s (Swain), 3.5 dGH in
      2013 and 3.5 dGH in the FAO tables, while a 1962 analysis gives 5.6 dGH for the Río San Juan
      and 8.4 dGH for the lake. The Tipitapa River, which carries Lake Managua water, holds 5.6 to
      7.7 dGH and Lake Managua about 6.4 dGH. The measured sources span 0.5 to 9.3 dGH, wider than
      the decided range: the very soft Río Puerto Viejo (0.5 to 2.7 dGH) and a lowland oxbow lake of
      the Matina basin (9.3 dGH) lie outside it. The FishBase figure of 9 to 20 dH matches aquarium
      care sheets rather than the habitat measurements."

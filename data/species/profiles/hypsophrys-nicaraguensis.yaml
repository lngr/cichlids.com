  habitat:
    text: The species lives on the Atlantic slope of Nicaragua and Costa Rica, from Lakes Nicaragua and
      Managua and the Río San Juan system south to the Río Matina basin, and it also inhabits the
      crater lake Xiloá. It is common in Lake Nicaragua, where it once made up about a fifth of a
      fishery survey catch, and it lives in lowland rivers with slow to moderate current. It prefers
      mud, sand and pebble bottoms. The water is warm, mostly about 24 to 30 C in the lakes and up
      to about 32 C in shallow river stretches, and neutral to alkaline at about pH 7 to 9. Lake
      Nicaragua is moderately soft with about 3 to 4 dGH and 3 to 5 dKH, while the water linked to
      Lake Managua is harder and far richer in bicarbonate, up to about 8 dGH and 16 dKH. Some Costa
      Rican rainforest rivers in the range are much softer and slightly acidic.

partners:
  suitable:
    - species: Heros efasciatus
      reason: Calm cichlid of similar size that tolerates neutral to alkaline water and does not compete
        hard for caves.
      condition: Tank of at least 180 cm with separate retreats.
    - species: Thorichthys meeki
      reason: Central American cichlid of moderate temperament with similar water needs; holds its own
        without dominating.
      condition: Tank of at least 180 cm with several caves.
    - species: Metynnis argenteus
      reason: Peaceful, robust schooling dither fish that draws aggression away from the female of the
        pair.
    - species: Pterygoplichthys gibbiceps
      reason: Large armoured catfish that ignores the cichlids and is too big to be threatened.
  unsuitable:
    - species: Amatitlania nigrofasciata
      reason: Aquarium crosses with the convict cichlid are reported, and the convict competes hard for
        the same caves.
    - species: Parachromis managuensis
      reason: Large piscivorous predator that injures or eats the much more peaceful Nicaragua cichlid.
    - species: Amphilophus citrinellus
      reason: Bigger and far more aggressive; competes for territories in the wild and dominates or kills
        it in a tank.
    - species: Neetroplus nematopus
      reason: Close relative from the same waters that fights intensely over caves.
    - species: Paracheirodon innesi
      reason: Tiny tetra that may be eaten and needs soft, acidic water.
profile:
  overview:
    text: "The Nicaragua cichlid, or moga, is a medium-sized Central American cichlid with an unusual
      look: a steep, rounded forehead, a small mouth set low on the head and a body that shines gold
      to copper, with a turquoise or copper head depending on its origin. It is the only valid
      member of the genus Hypsophrys and has been popular since the 1970s because it is calmer than
      most Central Americans of its size. It also breeds in a way unusual among its relatives: the
      eggs do not stick to the substrate and are laid in a cave or pit. A single pair in a roomy
      tank with caves and a sandy bottom shows it at its best, and it suits keepers who already have
      some experience with larger cichlids."
    sources:
      - kind: catalog-of-fishes
        title: "Eschmeyer's Catalog of Fishes, species of the genus Hypsophrys"
        url: https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Hypsophrys

    confidence: medium
    rationale: "Decided by qualified majority (4 of 6 votes): generator and checker-a proposed 7.0 to
      9.0, checker-c 7.0 to 9.3 and tiebreaker-1 7.0 to 8.9; checker-b proposed 6.3 to 8.9 and
      tiebreaker-2 8.0 to 8.9. Lake Nicaragua, the core of the range, is neutral to moderately
      alkaline: 7.2 to 7.7 in a 1956 survey, 8.2 to 8.9 at the surface and 7.4 to 7.8 near the
      bottom in the early 1960s (Swain), 7.0 in the FAO tables, 8.59 in 2018 and 8.94 in 2013. The
      Tipitapa River between the lakes measured 8.0 to 8.9, crater lake Xiloá 7.33 and a lowland
      oxbow lake of the Matina basin 7.47. FishBase gives 7.0 to 8.0. The measured sources span 6.3
      to 9.3, wider than the decided range: the soft Río Puerto Viejo reached down to 6.3, and the
      open water of Lake Managua reached 8.9 to 9.3 (Swain, ILEC seasonal means 9.18 to 9.26)."

  husbandry:
    text: A pair needs at least about 240 litres with a length of 120 cm; if other cichlids share the
      tank, plan on 180 cm. Furnish it with stones, roots and clay pots so that several caves and
      visual barriers exist, and use sand or fine gravel because the fish dig, especially before
      spawning. Plants must be robust or tied onto decor, such as Anubias or Java fern. A
      temperature of 24 to 28 C, a pH between 7 and 8 and moderately hard, well buffered water suit
      it well; it copes with the softer water of its home lake, but acidic water does not suit it.
      Strong filtration and regular water changes keep nitrate low, which matters for a fish that
      eats a lot of plant matter and detritus.

  diet:
    value:
      type: omnivore
      bloatSensitive: false
      foods:
        - cichlid pellets and flakes
        - vegetable matter such as blanched spinach or spirulina food
        - frozen bloodworm, shrimp and mysis
        - occasional earthworms
    confidence: medium
    rationale: Decided unanimously (4 of 4 votes for an omnivore without bloat sensitivity). In the wild
      juveniles feed on aquatic insects, adults on bottom detritus, seeds, leaves and snails
      (FishBase); gut contents from a Costa Rican river were mostly detritus and plant matter with
      insects, and the Cichlid Room Companion summary confirms a detritus and plant based diet. In
      the tank it accepts pellets, frozen and live foods and should receive plant matter. No source
      reports bloat. One German retailer page reads the diet as mainly animal food, which conflicts
      with the field data.

  diet:
    text: "In nature young fish feed on aquatic insects, and adults sift detritus and pick up seeds,
      leaves and snails with their small, low-set mouth. In the tank it accepts almost everything: a
      good cichlid pellet or flake should be the basis, supplemented by vegetable food such as
      spirulina pellets or blanched spinach, and occasionally by frozen bloodworm, mysis, shrimp or
      an earthworm. Fry or very small fish may be eaten if the opportunity arises, but fish are not
      a regular part of its diet. Several small meals a day are better than one large one."

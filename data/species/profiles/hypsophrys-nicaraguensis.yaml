    confidence: low
    rationale: "Decided by the median of all six votes because no range reached a qualified majority.
      The proposals were 23 to 30 C (generator), 24 to 30 C (checker-a), 19.5 to 32.4 C (checker-b),
      23 to 36 C (checker-c and tiebreaker-1) and 28.5 to 32.4 C (tiebreaker-2); the median of the
      minima is 23 C and the median of the maxima 32.4 C, rounded to 32 C. The measurements behind
      the votes: Lake Nicaragua surface water 25 to 28 C and Lake Managua 24.7 to 26 C in the early
      1960s (Swain), 25.4 to 29.3 C over the year in Lake Nicaragua (CIRA monitoring), 27.5 to 29.5
      C in the great lakes and Lake Xiloá in a recent survey (Collado et al.), 26 to 30 C for Lake
      Managua in the FAO tables, 28.5 to 32.4 C in the Tipitapa River between the two lakes, monthly
      means of 19.5 to 26 C in the Costa Rican Río Puerto Viejo in 1962 (Bussing 1993) and a single
      rainy-season reading of 21.2 C in Lake Nicaragua in 2013. FishBase and Molina-Arias quote 23
      to 36 C for Costa Rican collecting sites after Bussing. The measured sources therefore span
      19.5 to 36 C, wider than the decided range: the cool river winter means and the hot
      shallow-water extremes lie outside it, while the lake data lie inside."

  breeding:
    text: Breeding in the aquarium is quite possible. The female picks a cave or a pit dug into soft
      substrate, and spawning often takes place in the dark. The 200 to 400 eggs do not stick and
      simply lie on the floor of the cave. The female alone cares for the eggs and larvae while the
      male patrols the wider territory. The eggs hatch after two to three days, and a few days later
      the young swim freely; from then on both parents guard them. In the wild several females have
      been seen guarding their combined broods together. Newly hatched brine shrimp are a suitable
      first food. Leave the brood with the pair for a while, because taking it away too early can
      lead to fights between the partners.

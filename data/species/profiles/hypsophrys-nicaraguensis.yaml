  khDkh:
    value:
      min: 3
      max: 16
    confidence: low
    rationale: "Decided by the median of all six votes because no range reached a qualified majority.
      The proposals were 3 to 11 dKH (generator), 3 to 16 dKH (checker-a and tiebreaker-1), 0.5 to
      15 dKH (checker-b), 3 to 25 dKH (checker-c) and 4.6 to 15.7 dKH (tiebreaker-2); the median of
      the minima is 3 dKH and the median of the maxima 15.85 dKH, rounded to 16. Bicarbonate
      dominates the anions throughout the range. Lake Nicaragua holds 3.4 to 3.6 dKH (Swain), 3.8
      dKH (FAO), 4.4 dKH (2013) and 4.5 to 6.7 dKH (1956 survey); a 1962 analysis gives 4.8 dKH for
      the Río San Juan and 8.4 dKH for the lake. The sodium bicarbonate water of Lake Managua and
      the Tipitapa River is far more alkaline, 4.6 to 15.7 dKH, and a lowland oxbow lake of the
      Matina basin holds 10.5 dKH. The measured sources span about 0.5 to 24.4 dKH, wider than the
      decided range: the soft Río Puerto Viejo (about 0.5 to 2.7 dKH) lies below it and the FAO
      value for Lake Managua including carbonate (24.4 dKH) above it."
    sources:
      - kind: literature
        title: "Swain, F. M. (1966). Bottom sediments of Lake Nicaragua and Lake Managua, western Nicaragua.
          Journal of Sedimentary Research 36(2), 522-540."
        url: https://doi.org/10.1306/74d71500-2b21-11d7-8648000102c1865d
        accessed: 2026-10-13
      - kind: database
        title: "FAO inland-water inventory: Central America, Lake Nicaragua and Lake Managua measurement

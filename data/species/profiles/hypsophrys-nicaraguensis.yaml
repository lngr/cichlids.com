  sizeAndGrowth:
    text: Males grow much larger than females. Well-kept males usually reach about 22 cm total length
      and exceptional ones about 25 cm, while females mostly stay at 12 to 16 cm. Young females
      often grow faster at first, and the males catch up and overtake them later. Males mature at
      about 12 cm and females at about 9 cm, and older males develop a slight bump on the forehead.
      Wild fish in the crater lake Xiloá remain much smaller than tank-raised fish. With good care a
      lifespan of about 8 to 12 years can be expected.

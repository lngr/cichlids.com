  problems:
    text: "Most problems come from tanks that are too small or poorly equipped: without enough caves and
      space, pair formation can end with an injured or dead female. Mixing it with highly aggressive
      Central Americans leaves it permanently stressed, hidden and pale. Acidic water and large
      swings of pH are a common mistake when it is kept with soft-water fish. The diet should
      include plant matter; feeding only rich, meaty foods can lead to digestive trouble and fatty
      organs, and rotting leftovers spoil the water. Like other large cichlids it is prone to skin
      and head erosion when nitrate stays high, so regular water changes and good filtration are
      essential. Remove fry only after the partners are calm, or they may turn on each other."
    sources:
      - kind: database
        title: "Seriously Fish: Hypsophrys nicaraguensis (Nicaragua Cichlid)"
        url: https://www.seriouslyfish.com/species/hypsophrys-nicaraguensis/

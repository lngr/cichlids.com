            size: large
            breedingOnly: true
        - by: checker-c
          value:
            size: large
            breedingOnly: false
      decision:
        size: large
        breedingOnly: false
      rationale: Field data show a defended area about 1 m across around the breeding pits, so the
        territory is large. Seriously Fish calls the species territorial in general and describes a
        formed pair defending its territory against all comers; a mated pair stays together and
        breeds repeatedly, so the territory is not limited to the breeding phase. This is also the
        cautious choice for the compatibility check.

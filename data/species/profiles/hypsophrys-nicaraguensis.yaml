  sexing:
    text: Adult males are clearly larger, with a slight forehead bump, dark-edged scales that form a
      net-like pattern, strongly spotted fins and a red edge to the dorsal fin; their lengthwise
      band shrinks to a single dark blotch in the middle of the side. Females stay smaller, keep the
      dark lengthwise band together with the blotch, have less patterned fins and often look
      brighter. Sexing very young fish is hard, but differences appear as they grow. At breeding
      size the pointed genital papilla of the male confirms the sex.

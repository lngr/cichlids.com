  socialBehavior:
    text: This is a pair-forming cichlid. Towards other fish it is relatively tolerant for its size, but
      partners can be harsh to each other, and males in particular defend their patch vigorously.
      The safest way to obtain a pair is to raise about six juveniles together and remove the others
      once a pair has formed. A pair claims a sizeable territory around its cave, in the wild about
      a metre across, and chases intruders out of it; in nature it even takes on larger Amphilophus,
      while it tolerates small, established neighbours such as convict cichlids. A school of robust
      dither fish helps spread the attention of the male and protects the female.

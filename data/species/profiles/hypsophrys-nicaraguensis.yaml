        - by: checker-b
          value:
            male: 22
            female: 18
        - by: checker-c
          value:
            male: 25
            female: 20
      decision:
        male: 22
        female: 16
      rationale: Males agree within a few centimetres; 22 cm lies between the FishBase male (about 21 cm
        total length) and the 25 cm maxima. For females the sources range from usually 10 to 12 cm
        (wholesaler) to maxima of 18 to 20 cm (FishBase, Seriously Fish, wholesaler); 16 cm, the
        median of the proposals, describes a typical well-kept adult female. The Seriously Fish
        evidence is corrected to 25 cm for males and 20 cm for females.

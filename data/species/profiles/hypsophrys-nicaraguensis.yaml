  breeding:
    value: cave-spawner
    confidence: high
    rationale: All four runs agree. In rivers the pair digs tunnels into banks, in Lake Xiloá pits in
      soft sediment, and in the tank it spawns in a cave. Unlike most Central American substrate
      spawners the eggs are not adhesive and lie loose on the floor of the cave; the female guards
      eggs and larvae while the male defends the territory, and both parents guard the free-swimming
      young. The Cichlid Room Companion confirms a cave substrate breeder.

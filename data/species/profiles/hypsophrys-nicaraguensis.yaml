  compatibility:
    text: "Choose tankmates that are robust but not bullies. Calm South and Central American cichlids of
      similar size, such as severums or firemouths, work in a tank of about 180 cm, as do schooling
      dither fish like silver dollars and large armoured catfish. Avoid big predatory or very
      aggressive Central Americans such as jaguar cichlids, midas cichlids or the close relative
      Neetroplus nematopus, which fight over caves or kill the Nicaragua cichlid. Do not keep it
      with convict cichlids: besides the competition for caves, crosses with this species are
      reported from the hobby. Very small fish such as neon tetras may be eaten and need different
      water anyway."

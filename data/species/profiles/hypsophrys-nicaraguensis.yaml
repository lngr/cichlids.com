  predation:
    value: 1
    confidence: medium
    rationale: Decided by qualified majority (5 of 6 votes for level 1; checker-b proposed 0). The
      small, low-set mouth suits detritus, plant matter, seeds, snails and insect larvae, and
      FishBase, the Cichlid Room Companion summary and a gut-content study of a Costa Rican river
      list no fish as food, so levels 2 and 3 do not apply. In Lake Xiloá, however, the species is
      treated as a potential predator of the broods of neighbouring convict cichlids, so fry and
      very small fish are taken when the chance arises. Seriously Fish suggests only larger barbs
      and characins as tankmates. This matches level 1.

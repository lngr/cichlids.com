features:
  origin:
    value:
      continent: Central America
      region: "Atlantic slope of Nicaragua and Costa Rica: San Juan drainage with Lakes Nicaragua and
        Managua, south to the Río Matina drainage"
      waterbody: null
      localities:
        - Lake Nicaragua (Cocibolca)
        - Lake Managua (Xolotlán)
        - Lake Xiloá (crater lake)
        - Río San Juan
        - Río Frío, Caño Negro (Costa Rica)
        - Río Peñas Blancas, San Carlos basin (Costa Rica)
        - Río Puerto Viejo (Costa Rica)
        - Río Matina drainage (Costa Rica)
    confidence: high
    rationale: "The Catalog of Fishes and FishBase agree on the Atlantic slope of Nicaragua and Costa
      Rica, from the San Juan basin with Lake Nicaragua, the type locality, to the Matina drainage.
      Field studies record the species in the crater lake Xiloá, in a seasonal water body of the
      Caño Negro refuge on the Río Frío, in the Río Peñas Blancas (brood fish of a hatchery study)
      and in the Río Puerto Viejo. Lake Managua belongs to the same drainage: a visual-ecology study
      sampled the species in the turbid great lakes Nicaragua and Managua and traces the Xiloá
      population to a colonisation from Lake Managua. The range is not a lake of the waterbody
      table, so waterbody stays empty. An introduced population lives on Hawaii."

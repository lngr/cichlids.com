  sizeAndGrowth:
    text: "Males reach about 8 cm in total length and females about 7 cm. The largest type specimen of\
      \ N. falcicula measures 6.6 cm standard length, and wild males of the synonym N. chitamwebwai reach\
      \ 7.3 cm standard length and females 6.1 cm. No growth data from aquaria are published; Tanganyika.si\
      \ notes that tank-raised fish may grow slightly larger than wild ones. Males are a little larger\
      \ than females and have longer pectoral fins, but otherwise the sexes look alike."

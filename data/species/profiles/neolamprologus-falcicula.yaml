  temperatureC:
    value:
      min: 23
      max: 29
    confidence: high
    rationale: "The species lives only in Lake Tanganyika, so the natural range is the lake range of 23\
      \ to 29 C. Hourly buoy readings at Mpulungu span 23.85 to 29.01 C over a year (Verburg et al. 1997),\
      \ and the limnology thesis of Langenberg (2008) reviews a surface range of the same span; the cooler\
      \ south and the upwelling season set the lower end. FishBase lists 23 to 27 C, an aquarium figure\
      \ rather than a field measurement."
    sources:
    - kind: literature
      title: "Plisnier, P.-D., Langenberg, V., Mwape, L., Chitamwembwa, D., Tshibangu, K. and Coenen,\
        \ E. (1996). Limnological sampling during an annual cycle at three stations on Lake Tanganyika\
        \ (1993-1994). FAO/FINNIDA GCP/RAF/271/FIN-TD/46."

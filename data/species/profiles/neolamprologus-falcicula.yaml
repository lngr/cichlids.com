    \ species."
features:
  origin:
    value:
      continent: Africa
      region: Lake Tanganyika
      waterbody: lake-tanganyika
      localities:
      - "Magara, Burundi (type locality)"
      - "Mucansi, Burundi"
      - "Rutunga, Burundi, to the Malagarazi mouth, Tanzania (range given by the DRTA data sheet)"
      - "Cape Bangwe near Kigoma, Tanzania (type locality of the synonym N. chitamwebwai)"
    confidence: high
    rationale: "Lake Tanganyika is the only home of the species. The holotype comes from 10 m depth on\
      \ the Magara coast of Burundi (Catalog of Fishes), the Cichlid Room Companion shows a pair from\
      \ Mucansi on the same coast, and FishBase lists the species as a lake endemic. Tanganyika.si restricts\
      \ the name to the Burundian north coast, while the DRTA data sheet extends the range along the north-eastern\
      \ shore to the Malagarazi mouth in Tanzania. With N. chitamwebwai as a synonym, the Bangwe peninsula\
      \ near Kigoma joins the range. All four votes agree on the lake and differ only in the localities\
      \ they list, which are merged here."

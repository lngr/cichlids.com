  habitat:
    text: "The species is endemic to Lake Tanganyika; the type locality is the Magara coast of Burundi\
      \ at about 10 m depth. It lives between roughly 10 and 30 m, most often around 15 m, where rocks\
      \ meet sand, and digs its shelters at the foot of large stones. The lake water is hard and strongly\
      \ buffered, with a pH of 8.4 to 9.4, 10 to 13 dGH, 15 to 20 dKH and 23 to 29 C. Sources disagree\
      \ on the range: some restrict the species to Burundi, while the Catalog of Fishes treats N. chitamwebwai\
      \ from Cape Bangwe in Tanzania as a synonym, which extends it down the east coast. It shares its\
      \ habitat with N. brichardi and N. savoryi and dives for cover when approached."

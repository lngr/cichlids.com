  breeding:
    text: "The species spawns in caves. The pair digs a hollow beneath a rock, where the female lays the\
      \ eggs, and both partners guard eggs and fry and keep the young in their territory while they grow.\
      \ Broods are very small, about one to five fry according to one source, so the fish does not fill\
      \ a tank like the colonial princess cichlids. Tank breeding succeeds with a pair that formed in\
      \ a small group. Free-swimming fry take brine shrimp nauplii and fine powdered food; little more\
      \ is published about rearing them."
    sources:
    - kind: website
      title: "Tanganyika.si: Neolamprologus falcicula 'Magara'"
      url: "https://www.tanganyika.si/Tanganjika/Neolamprologus/Neolamprologus%20falcicula/slides/Neolamprologus%20falcicula%20%27Magara%27.html"

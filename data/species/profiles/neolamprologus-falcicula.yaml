  compatibility:
    text: "Small Tanganyika fish that use other parts of the tank or other shelters make suitable companions,\
      \ such as Cyprichromis in open water or sand-dwelling shell cichlids like Lamprologus ocellatus.\
      \ Other members of the princess cichlid complex, such as N. brichardi, N. pulcher and N. savoryi,\
      \ do not belong in the same tank, because the group is warned to hybridise and N. brichardi breeds\
      \ in large colonies. Large predators such as Cyphotilapia frontosa treat an 8 cm fish as prey, and\
      \ robust rock dwellers or Malawi cichlids kept in softer water are no match either."
    sources:
    - kind: database

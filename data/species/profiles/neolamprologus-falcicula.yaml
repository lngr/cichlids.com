  ghDgh:
    value:
      min: 10
      max: 13
    confidence: high
    rationale: "Magnesium dominates the hardness of the lake. The surface calcium and magnesium means\
      \ of the FAO/FINNIDA stations convert to 11.1 to 11.5 dGH (Plisnier et al. 1996) and the north basin\
      \ chemistry of Cohen et al. (1997) to about 12.2 dGH, and the older data of Talling and Talling\
      \ summarised in the FAO source book fall in the same band, so the natural range is 10 to 13 dGH.\
      \ FishBase gives 10 to 25 dGH as an aquarium range."

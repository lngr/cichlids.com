  - name: Lamprologus falcicula
    note: Original combination of Brichard (1989); type locality the Magara coast of Burundi at 10 m depth.
  - name: Neolamprologus chitamwebwai
    note: "Described by Verburg and Bills (2007) from Cape Bangwe near Kigoma, Tanzania. Kullander et\
      \ al. (2014) treat it as valid, and the Catalog of Fishes lists it as a synonym of N. falcicula\
      \ after Konings (2015, 2019); the Cichlid Room Companion and Tanganyika.si keep it apart."
  legacyNames:
  - Neolamprologus falcicula
  note: "The Catalog of Fishes lists Neolamprologus falcicula (Brichard 1989) as valid. Its entry, which\
    \ carries the original combination Lamprologus falcicula, stands in the Neolamprologus species list;\
    \ the Lamprologus list holds no entry for the name. Kullander et al. (2014) cite the species as cf.\
    \ falcicula, and Verburg and Bills (2007) regard its status as uncertain. The trade sells related\
    \ forms under this name, among them N. sp. 'falcicula cygnus' and fish from Kigoma sold as walteri\
    \ (N. walteri), so dealer care sheets under this name may describe those forms. Tanganyika.si restricts\
    \ the name to the Burundian coast."

  khDkh:
    value:
      min: 15
      max: 20
    confidence: high
    rationale: "The lake is bicarbonate water with a strong buffer. North basin alkalinity of 6.5 to 6.6\
      \ meq/L corresponds to 18.2 to 18.5 dKH (Cohen et al. 1997), and the titrated bicarbonate and carbonate\
      \ of the FAO/FINNIDA stations to about 15.4 to 20 dKH (Plisnier et al. 1996), which gives 15 to\
      \ 20 dKH. No source on the species states a carbonate hardness."

    tolerance:
      value:
        min: 22
        max: 29
      confidence: low
      rationale: "All four votes end the tolerance at the lake maximum of 29 C; the generator and checkers\
        \ a and b start at 22 C and checker-c at 23 C, which agree within 1 C, so the tally decides 22\
        \ to 29 C unanimously, with the low confidence the agents gave it. Care data for the species name\
        \ 23 to 27 C (FishBase, DRTA data sheet, Einrichtungsbeispiele), 24 to 26 C (two German dealers),\
        \ 23 to 26 C (Zoopet), 25 to 26 C (Cichlid-Forum profile) and 24 to 27 C (dealer sheets for the\
        \ Cygnus and Walteri forms); Seriously Fish gives 23 to 26 C for N. brichardi and 23 to 27 C for\
        \ N. pulcher. No source tests the margins: the lower limit of 22 C is a derived margin of one\
        \ degree below the lake minimum, and the upper limit is the lake maximum, which the tolerance\
        \ must contain."

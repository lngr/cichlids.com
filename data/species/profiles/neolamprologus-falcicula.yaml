  hybridGroups:
    value:
    - neolamprologus-brichardi-complex
    confidence: medium
    rationale: "All four votes name neolamprologus-brichardi-complex, the curated group that lists N.\
      \ falcicula with the basis presumed. Seriously Fish names the species on its N. brichardi and N.\
      \ pulcher pages among the members of the complex that hybridise freely in tanks, and Tanganyika.si,\
      \ Verburg and Bills (2007) and a Practical Fishkeeping report place it in the N. savoryi complex.\
      \ Sturmbauer et al. (2010) explain shared mitochondrial lineages among the helper species of this\
      \ complex by gene flow in the lake; a trade fish labelled N. falcicula in their tree fell outside\
      \ the complex, which points to a misidentified sample. No cross of N. falcicula with a named species\
      \ is documented, and no other group concerns it."

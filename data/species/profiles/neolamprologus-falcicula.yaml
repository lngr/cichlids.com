  sexing:
    text: "Males and females look much alike, and only the genital papilla tells them apart reliably.\
      \ Males are slightly larger and have longer pectoral fins. A dealer therefore advises buying a small\
      \ group of young fish and letting a pair form, and another warns that a large male with a much smaller\
      \ female rarely works."

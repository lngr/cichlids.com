  problems:
    text: "The commonest mistake is a tank that is too small or has too few caves, where rivals or partners\
      \ keep chasing each other until a weaker fish is hurt. Soft or acidic water and large swings in\
      \ water values are a risk for a species of hard lake water; stable, hard and alkaline water is safer,\
      \ kept clean by regular changes with matching water. Mixing it with similar princess cichlids can\
      \ produce hybrids. Fish sold as N. falcicula may be the Cygnus form, a separate taxon, so the origin\
      \ of the stock is worth asking about."
    sources:

      \ In the lake the relative N. walteri picks plankton at a lower rate than N. brichardi and the synonym\
      \ dives for cover when approached, while a dealer reports that the fish takes dry, frozen and live\
      \ food readily. It neither rushes food like mbuna nor feeds as slowly as discus; very hasty tankmates\

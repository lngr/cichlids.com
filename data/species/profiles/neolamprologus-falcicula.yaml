partners:
  suitable:
  - species: Cyprichromis leptosoma
    reason: Schools in open water above the rocks and competes neither for caves nor for the sand.
    condition: A tank of at least 120 cm for a school of the open-water fish.
  - species: Paracyprichromis nigripinnis
    reason: A calm plankton feeder of open water that uses another zone and leaves the cave pair alone.
  - species: Lamprologus ocellatus
    reason: "A small shell dweller of open sand with shelters of its own, different in shape and in breeding\
      \ site from the cave pair."
    condition: Snail shells on a sand area apart from the rock piles.
  unsuitable:
  - species: Neolamprologus brichardi
    reason: "Belongs to the same princess cichlid complex, which hobby sources warn may hybridise, and\
      \ its large breeding colonies crowd out a single pair."
  - species: Neolamprologus pulcher
    reason: A close look-alike of the same complex with the same warning about crosses.
  - species: Cyphotilapia frontosa
    reason: A large predator that swallows fish of 8 cm.
  - species: Maylandia zebra
    reason: "A Lake Malawi mbuna kept in softer and less alkaline water, which rushes food and harasses\
      \ small, shy fish."
profile:
  overview:
    text: "Neolamprologus falcicula is a small, quietly coloured cave breeder from the rocky northern\
      \ shores of Lake Tanganyika. It belongs to the princess cichlid group around N. savoryi and N. brichardi\
      \ but lives in pairs and forms none of the large helper colonies of its relatives. Adults are grey\
      \ to beige with a blue line below the eye and a sickle-shaped tail, while juveniles carry bright\
      \ orange-yellow markings that fade. It suits keepers who enjoy watching a single pair hold a cave\
      \ in a rock and sand aquarium. It is traded only occasionally, and dealers list the similar Cygnus\
      \ form under the same name, so the origin of a purchased fish is worth checking."
    sources:
    - kind: database
      title: "Cichlid Room Companion: Neolamprologus falcicula (public part of the species page)"
      url: "https://cichlidae.com/species.php?id=rv4dwfmcbcl7qTR9TKKvxQ"

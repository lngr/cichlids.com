    rationale: "Three votes give level 3 and checker-b level 2. The DRTA data sheet describes a pair territory\
      \ defended hard against every intruder, a German dealer finds pairs partly very aggressive towards\
      \ their own kind and keeps only one pair in small tanks, Tanganyika.si notes aggression towards\
      \ conspecifics, and the Cichlid-Forum profile rates the fish as highly aggressive to its own species.\
      \ On the other side a cichlids.com forum keeper finds it milder than N. brichardi, and one dealer\
      \ keeps groups of six to ten in large tanks. The specific reports of persistent attacks on rivals\
      \ weigh more than the general remarks, so level 3 fits."

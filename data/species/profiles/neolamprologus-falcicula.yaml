  husbandry:
    text: "One pair needs a tank of about 100 L and 80 cm length. A layer of fine sand and several rock\
      \ piles with caves and passages suit a fish that digs its shelter under stones. Keep the water hard\
      \ and alkaline: keepers report 23 to 27 C, pH 7.5 to 9.0 and 10 to 25 dGH, ranges that overlap the\
      \ lake values. No source gives a carbonate hardness for this species; general Tanganyika advice\
      \ of about 8 dKH or more holds the pH steady, and stable water close to the lake values of 15 to\
      \ 20 dKH is the safest choice."

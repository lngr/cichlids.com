  diet:
    text: "In the lake it picks small invertebrates from the sand and from stones, takes plankton just\
      \ above the bottom and grazes a little algae. In the aquarium it accepts frozen and live foods such\
      \ as copepods, brine shrimp, mysis, mosquito larvae and bloodworms, small enchytraeids and good\
      \ granules or flakes. Small, varied portions once or twice a day suit it. The diet is animal-based\
      \ without being fatty, and no tendency to bloat is reported. Fry need very fine food such as brine\
      \ shrimp nauplii."
    sources:

  socialBehavior:
    text: "The fish lives as a pair and defends its cave against any intruder. Adult rivals of its own\
      \ species are chased persistently, and a dealer finds pairs partly very aggressive towards their\
      \ own kind, so one pair is the safe unit for a 100 L tank. A male with two females works in a larger\
      \ setup with plenty of cover. Towards other species it is mostly tolerant and chases only fish that\
      \ come close to the nest, more so while it guards fry. In the wild it is shy and stays near the\
      \ bottom."
    sources:
    - kind: website
      title: "Tanganyika.si: Neolamprologus falcicula 'Magara'"
      url: "https://www.tanganyika.si/Tanganjika/Neolamprologus/Neolamprologus%20falcicula/slides/Neolamprologus%20falcicula%20%27Magara%27.html"

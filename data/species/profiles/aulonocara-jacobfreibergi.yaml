schemaVersion: 1
id: aulonocara-jacobfreibergi
legacyIds: [229, 232]
status: described

taxonomy:
  validName: Aulonocara jacobfreibergi
  genus: Aulonocara
  species: jacobfreibergi
  author: (Johnson, 1974)
  source: &cof
    kind: catalog-of-fishes
    title: "Eschmeyer's Catalog of Fishes, species list of the genus Aulonocara (jacobfreibergi, originally Trematocranus Johnson 1974, current status valid as Aulonocara jacobfreibergi)"
    url: https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Aulonocara
    accessed: 2026-10-12
  synonyms:
    - name: Trematocranus jacobfreibergi
      note: >-
        Original combination (Johnson 1974); the Catalog of Fishes and FishBase treat it as a
        synonym of the valid Aulonocara jacobfreibergi.
  legacyNames:
    - Aulonocara jacobfreibergi
    - Aulonocara mamelela
  note: >-
    The Catalog of Fishes lists the species as valid in Aulonocara (Marechal 1991, Tawil 2003,
    Konings 2016); the Cichlid Room Companion uses the same name. The type locality is given as
    off Makanjila, which Konings in Practical Fishkeeping considers a cover name chosen by the
    exporter to hide the true collecting site. Hobby names such as Trematocranus trevori or
    T. regina are not available names and are therefore not listed as synonyms. The Eureka red
    is a line-bred captive form of this species, not a separate taxon or a hybrid. The legacy entry
    Aulonocara mamelela carries the trade name of the yellowish Undu Reef population and maps to
    this profile.

names:

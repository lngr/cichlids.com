  predation:
    value: 1
    confidence: low
    rationale: >-
      The species hunts small invertebrates: it hovers above sand in front of its cave and strikes
      at crustaceans, snails and insect larvae that it detects with the enlarged sensory pores of
      its head (Seriously Fish, the Cichlid Room Companion, Konings in Practical Fishkeeping, the
      lateral-line study of Schwalbe et al. on the congener A. stuartgranti). No source lists fish
      as regular food, which rules out levels 2 and 3. The choice between 0 and 1 is open. Level 1
      rests on Guidarium, which tags the species as a fry predator, a UK breeder who warns that
      tankmates including the male eat released fry, a dealer page that names cichlid fry among
      the wild foods of peacocks, and Tropical Fish Hobbyist, which reports that peacocks take
      other food when the chance arises. Level 0 rests on the species descriptions that name only
      invertebrate food. The votes split: generator, checker-a and tiebreaker-1 proposed level 1,
      checker-b and tiebreaker-2 level 0. With 3 of 5 votes no qualified majority formed, so the
      vote count took the conservative value, the highest proposed level, 1. It lets the
      compatibility check protect fry and fish below 2 cm, which errs on the safe side. No diet
      study documents fish in the stomach contents, hence the low confidence.
    sources:
      - *sf
      - *crc
      - *fb
      - &schwalbe
        kind: literature
        title: "Schwalbe, M. A. B., Bassett, D. K. and Webb, J. F. (2012). Feeding in the dark: lateral-line-mediated prey detection in the peacock cichlid Aulonocara stuartgranti. Journal of Experimental Biology 215, 2060-2071 (abstract)."
        url: https://doi.org/10.1242/jeb.065920
        accessed: 2026-10-12
      - *pfk
      - *tfh
      - *guid
      - *barn
      - *afp
    evidence:
      - source: *sf
        value: 0
        note: sifts sand and hunts small invertebrates; fish not mentioned
      - source: *crc
        value: 0
        note: listed as crustacean and insect eater
      - source: *schwalbe
        value: 0
        note: congener; detects and takes small invertebrates on sand
      - source: *pfk
        value: 0
        note: locates crustaceans, snails and other invertebrates in the sand
      - source: *tfh
        value: 1
        note: genus account; mainly insect larvae and invertebrates, other food taken opportunistically
      - source: *guid
        value: 1
        note: tagged as fry predator
      - source: *barn
        value: 1
        note: tankmates including the male eat released fry
      - source: *afp
        value: 1
        note: names cichlid fry among the natural foods of peacocks
    verification:
      method: conservative
      votes: {agree: 3, total: 5}


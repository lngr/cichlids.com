        - Otter Point
        - Cape Maclear
        - Monkey Bay
        - Nkudzi
        - Nankumba
        - Domwe Island
        - Mumbo Island
        - Undu Reef (Tanzania)
    confidence: high
    rationale: >-
      Endemic to Lake Malawi according to the Catalog of Fishes, FishBase and Seriously Fish. Most
      known populations live in the south of the lake around the Nankumba peninsula (Otter Point,
      Cape Maclear, Monkey Bay, Nkudzi, Domwe and Mumbo islands), and the type is reported from
      off Makanjila in the south-east arm. Seriously Fish adds Undu Reef in Tanzania and several
      further southern reefs and islands, and gives Malawi, Mozambique and Tanzania as range
      countries, which the Cichlid Room Companion confirms.

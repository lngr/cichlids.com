        - {by: generator, value: {min: 5, max: 12}}
        - {by: checker-a, value: {min: 5, max: 8}}
        - {by: checker-b, value: {min: 4, max: 10}}
      decision: {min: 5, max: 10}
      rationale: >-
        Decided by the vote count (unanimous, 3 of 3 within the 2 dKH threshold): the medians of the
        bounds give 5 to 10 dKH. No source states a carbonate hardness for the species, so the
        confidence is low.

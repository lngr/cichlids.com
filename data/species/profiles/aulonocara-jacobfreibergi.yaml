  ghDgh:
    value: {min: 3, max: 5}
    confidence: high
    rationale: >-
      Lake Malawi endemic; the lake is soft water. Calcium and magnesium in the upper 50 m of the
      north basin give 4.2 to 4.6 dGH (Branchu et al. 2010), and the titrations of the 1960s
      compiled by the FAO give 3.2 to 4.9 dGH. Care sheets that call the lake hard confuse total
      hardness with alkalinity.
    sources: *lakesources
    evidence:
      - source: *branchu
        value: {min: 4.2, max: 4.6}
        note: north basin, upper 50 m
      - source: *fao
        value: {min: 3.2, max: 4.9}
        note: titrations of the 1960s
    verification:
      method: waterbody
      waterbody: lake-malawi
    tolerance:
      value: {min: 3, max: 19}
      confidence: low
      rationale: >-
        Aquarium sources accept far harder water than the lake: Seriously Fish, Guidarium and
        TropicalFreshwaterFish.com give 10 to 25 dGH, a UK breeder 10 to 20, FishBase after the
        Aquarien Atlas 9 to 19 and a care guide 8 to 15. Their lower limits of 8 to 10 reflect the
        belief that Malawi cichlids need hard water rather than an observed limit, and Tropical Fish
        Hobbyist notes that peacocks adapt to a wide range of water; the wild fish live permanently
        at 3 to 5 dGH, so the tolerance starts at the lake value. The votes split on the upper
        limit: the generator and checker-a proposed 25 dGH, checker-b 19, tiebreaker-1 and
        tiebreaker-2 20. The largest agreeing camp (19 and 20) has 3 of 5 votes, short of the four a
        qualified majority needs, so the vote count took the conservative value, the intersection
        of all votes, which ends at 19 dGH. A narrower tolerance makes the compatibility check warn
        earlier, which errs on the safe side for the fish. Water up to about 25 dGH is probably
        tolerated as well, but only the sheets that repeat this figure support it, so the range
        needs confirmation.
      sources:
        - *sf
        - *tff
        - *fb
        - *guid
        - &barn
          kind: website
          title: The Fish Barn, Aulonocara Eureka (Aulonocara jacobfreibergi 'Eureka') care sheet
          url: https://thefishbarn.co.uk/product/aulonocara-eureka/
          accessed: 2026-10-12
        - &tfh
          kind: literature
          title: Scott, B. M. (2024). Pretty Peacock Cichlids from Lake Malawi. Tropical Fish Hobbyist Magazine.
          url: https://www.tfhmagazine.com/articles/freshwater/pretty-peacock-cichlids-from-lake-malawi
          accessed: 2026-10-12
        - *gensou
        - *myfish
        - *branchu
        - *fao
      evidence:
        - source: *sf
          value: {min: 10, max: 25}
          note: aquarium recommendation
        - source: *tff
          value: {min: 10, max: 25}
          note: aquarium recommendation, given as dH
        - source: *guid
          value: {min: 10, max: 25}
          note: aquarium recommendation
        - source: *fb
          value: {min: 9, max: 19}
          note: aquarium values after Baensch and Riehl, given as dH
        - source: *barn
          value: {min: 10, max: 20}
          note: breeder recommendation for the Eureka line
        - source: *gensou
          value: {min: 8, max: 15}
        - source: *myfish
          value: {min: 10}
          note: hobbyist gives only a lower limit
        - source: *branchu
          value: {min: 4.2, max: 4.6}
          note: lake water, lower end of the tolerance
        - source: *fao
          value: {min: 3.2, max: 4.9}
          note: hardness the wild fish live in
      verification:
        method: conservative
        votes: {agree: 3, total: 5}

  khDkh:
    value: {min: 5, max: 8}
    confidence: high
    rationale: >-
      Lake Malawi endemic; the alkalinity of 2.33 to 2.46 meq/L in the Branchu profiles and 2.00 to
      2.59 meq/L in Jackson et al. (1963) gives 5 to 8 dKH. Carbonate hardness exceeds total
      hardness because sodium balances part of the bicarbonate.
    sources: *lakesources
    evidence:
      - source: *branchu
        value: {min: 6.5, max: 6.9}
        note: alkalinity 2.33 to 2.46 meq/L
      - source: *fao
        value: {min: 5.6, max: 7.3}
        note: alkalinity 2.00 to 2.59 meq/L
    verification:
      method: waterbody
      waterbody: lake-malawi
    tolerance:
      value: {min: 5, max: 10}
      confidence: low
      rationale: >-
        No species source gives a carbonate hardness: Seriously Fish, FishBase,
        TropicalFreshwaterFish.com and Guidarium state pH and total hardness only, and Guidarium
        merely asks for hard, alkaline water. Their pH ranges up to 8.6 to 9.0 imply well buffered
        water but no figure. A hobby breeder keeps the species above 5 dKH, and a genus-level care
        page names 4 to 6 with an unclear unit. The lower bound is the lake value the wild fish live
        in. The votes proposed upper limits of 12 (generator, general Lake Malawi practice), 8
        (checker-a, lake range only) and 10 (checker-b, estimate from the buffering needed for the
        pH range); they agree within the threshold, and the vote count takes the median, 10 dKH.
        Without a direct husbandry figure the upper bound needs confirmation.
      sources:
        - *fao
        - *branchu
        - *guid
        - *sf
        - *myfish
        - *aqs
        - &mk
          kind: model-knowledge
          title: General knowledge of Lake Malawi cichlid husbandry
      evidence:
        - source: *fao
          value: {min: 5.6, max: 7.3}
          note: carbonate hardness the wild fish live in
        - source: *branchu
          value: {min: 6.5, max: 6.9}
          note: lake water, lower end of the tolerance
        - source: *myfish
          value: {min: 5}
          note: hobbyist gives only a lower limit
        - source: *aqs
          value: {min: 4, max: 6}
          note: genus level, unit unclear
      verification:
        method: unanimous
        votes: {agree: 3, total: 3}

  maxSizeCm:
    value: {male: 15, female: 11}
    confidence: medium
    rationale: >-
      FishBase gives 15 cm total length for males or unsexed fish, and Guidarium, retailer sheets
      and a German breeding report give about 15 cm for adult aquarium males. Seriously Fish states
      150 to 170 mm for males, which marks the upper end; Konings reports that wild fish hardly
      exceed 10 cm while well-fed aquarium fish pass 15 cm. Females stay clearly smaller: a breeder
      gives about 10 cm, a care guide 10 to 12 cm and Guidarium up to 13 cm, so 11 cm is typical.
      Figures above 17 cm on hobby sites are exceptional and not used.

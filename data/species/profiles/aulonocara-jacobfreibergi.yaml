      method: waterbody
      waterbody: lake-malawi
    tolerance:
      value: {min: 7.5, max: 8.8}
      confidence: medium
      rationale: >-
        Care sheets agree on alkaline water with a lower limit of 7.5 (Guidarium 7.8). Their upper
        limits spread from 8.0 (FishBase after the Aquarien Atlas, a hobby breeder) over 8.5 to 8.6
        (Guidarium and retailer sheets) to 8.8 (TropicalFreshwaterFish.com) and 9.0 (Seriously
        Fish). The three votes proposed 8.8, 8.6 and 9.0 as upper limit, which agree within 0.3; the
        vote count takes the median, 8.8. The range contains the lake values of 7.7 to 8.6.

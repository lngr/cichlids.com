partners:
  suitable:
    - species: Labidochromis caeruleus
      reason: Calm mbuna with a yellow body that does not trigger the rivalry of blue peacock males and does not crowd them at feeding.
    - species: Otopharynx lithobates
      reason: Peaceful haplochromine of similar size from rocky shores with a different colour pattern.
    - species: Copadichromis borleyi
      reason: Open-water haplochromine that uses another zone of the tank and differs in pattern.
    - species: Placidochromis species of similar size
      reason: Calm sand-dwelling haplochromines with a matching diet and temperament.
      condition: choose forms whose males are not plain blue
    - species: Synodontis petricola
      reason: Robust catfish that clears leftovers on the bottom and ignores the cichlids.
      condition: tank of at least 150 cm
  unsuitable:
    - species: Aulonocara stuartgranti
      reason: Females look alike and the species cross readily; hybrid group aulonocara.
    - species: Aulonocara baenschi
      reason: Crosses with A. jacobfreibergi; hybrid group aulonocara.
    - species: Maylandia zebra
      reason: Boisterous, hasty mbuna that outcompetes peacocks at feeding and stresses them in their caves.
    - species: Melanochromis auratus
      reason: Very aggressive mbuna that harasses the calmer peacock males and females.
    - species: Sciaenochromis fryeri
      reason: Blue males with a similar look provoke rivalry fights with jacobfreibergi males.
      condition: possible only in very large tanks with plenty of caves

profile:
  overview:
    text: >-
      Aulonocara jacobfreibergi, known as the Malawi butterfly or fairy cichlid, is one of the
      larger peacock cichlids of Lake Malawi and one of the first to reach the hobby. Males are
      blue with a warmer head and back, broad pale fin edges and a deeply forked tail, which sets
      them apart from most relatives. Several wild forms and captive lines are traded, among them
      the yellowish 'lemon jake' from Undu Reef and the red Eureka line bred from Otter Point
      stock. Unlike most peacocks it lives close to caves rather than over open sand, and males are
      somewhat more combative than in other species of the genus. Kept as one male with several
      females in a roomy tank with caves and fine sand, it is a hardy and striking fish for the
      Lake Malawi community.
    sources:
      - *sf
      - *fb
      - *pfk
      - *elieson
  habitat:
    text: >-
      The species is endemic to Lake Malawi. Most known sites lie in the south of the lake, for
      example around Cape Maclear, Otter Point, Monkey Bay and the islands off the Nankumba
      peninsula, and further forms come from the Tanzanian coast. It lives in shallow water where
      rock meets sand and stays close to caves and crevices, which are often large with soft
      bottoms. Males hold their territories inside the caves, while females forage on the sand in
      front of them. The water of the lake is soft but alkaline and stable, with a pH of about 7.7
      to 8.6 and temperatures between 21 and 29 C over the year.
    sources:
      - *fb
      - *sf
      - *pfk
      - *crc
      - *fao
  sizeAndGrowth:
    text: >-
      Males usually reach about 15 cm in the aquarium, females stay clearly smaller at roughly 10
      to 12 cm. Wild fish rarely exceed 10 cm, and the larger aquarium sizes follow from rich and
      regular feeding; figures above 17 cm are exceptional. Young males show colour from a few
      centimetres and gain full colour over the following months, and most fish can be sexed at
      about four months. Growth is best when food is offered in several small portions a day.
    sources:
      - *fb
      - *pfk
      - *myfish
      - *sf
  husbandry:
    text: >-
      A tank with a base of at least 120 by 60 cm, about 360 litres, suits one male and four or
      more females. Build stable rock piles with caves and leave open areas of fine sand, since the
      fish sift the bottom for food and coarse gravel can harm their gills. Hardy plants such as
      Anubias or Vallisneria are left alone. Keep the temperature around 24 to 27 C and the pH at
      about 7.5 to 8.5; the species copes with moderately hard water but does not need it. Water
      quality matters more than exact values: the fish react badly to rising nitrate and sudden
      changes, so filter generously and change a good part of the water every week.
    sources:
      - *sf
      - *tff
      - *myfish
      - *tfh
  socialBehavior:
    text: >-
      Each male claims a cave or a stone and defends it against rival males all the time. In the
      wild several males may share a large cave, but in most tanks only one male should be kept.
      During courtship he chases females intensely, so a group of four or more females spreads his
      attention. Females keep a pecking order among themselves. Other fish are usually only
      displayed at and driven off from the cave, but males react strongly to tankmates with a
      similar blue pattern, including other peacocks.
    sources:
      - *sf
      - *pfk
      - *myfish
      - *elieson
  diet:
    text: >-
      In the lake the species feeds on small invertebrates such as insect larvae, crustaceans and
      snails. Like other peacocks it hovers above the sand and detects prey with enlarged sensory
      pores on the head, then strikes or takes a mouthful of sand and filters it. In the aquarium a
      fine-grade pellet or flake for carnivorous cichlids works well as a staple, with frozen
      mysis, Artemia or small larvae as additions. Some plant content in the dry food is useful,
      but it should not dominate. Feed small amounts several times a day rather than one large
      meal, and avoid fatty mammal meat.
    sources:
      - *sf
      - *crc
      - *pfk
      - *schwalbe
      - *barn
  breeding:
    text: >-
      The species is a maternal mouthbrooder and often spawns in a community tank. The male
      displays near his cave or on a flat stone and leads a ready female there. She lays a few eggs
      at a time and picks them up at once; the eggs are fertilised in her mouth while she snaps at
      the egg spots on the male's anal fin. She holds the brood for about three to four weeks
      without feeding and then releases 20 to 50 young. The fry take Artemia nauplii and fine dry
      food right away; in a community tank other fish, the male included, eat many of them. Move a
      holding female only with care, because stress can make her spit the brood, and a long
      absence costs her rank in the group.
    sources:
      - *sf
      - *myfish
      - *fb
      - *barn
  sexing:
    text: >-
      Adult males are larger and show blue bodies, a warm coloured head and back, pointed dorsal
      and anal fins and egg spots on the anal fin. Females are grey to brown with dark vertical
      bands and rounded fins, and they look very much like the females of other peacocks, so buying
      females of uncertain origin carries a risk of hybrids. Young males start to colour up at a
      few centimetres, and most fish can be sexed at about four months.
    sources:
      - *sf
      - *elieson
      - *afp
  compatibility:
    text: >-
      Good partners are calm haplochromines of similar size from the same lake, for example
      Otopharynx lithobates, Copadichromis or Placidochromis, and quiet mbuna such as Labidochromis
      caeruleus. Pick tankmates whose males are not mainly blue, since these trigger the strongest
      reactions. Keep it apart from other Aulonocara species and from other forms of its own
      species, because the fish cross readily. Most mbuna, such as Maylandia or Melanochromis, are
      too rough and too fast at feeding for this peacock. Fry and very small fish may be eaten.
    sources:
      - *sf
      - *elieson
      - *chin
      - *guid
  problems:
    text: >-
      The most common keeping mistake is a tank that is too small or too crowded with rough mbuna;
      peacocks then hide, lose colour and stop feeding well. A second one is unstable water: high
      nitrate and pH swings stress the fish and are linked to skin problems and raised scales, as
      one forum member reports from an overcrowded tank. Bloat can appear after overfeeding or
      fatty food, as in all Malawi cichlids. Coarse gravel damages the gills when the fish sift the
      bottom. Mixing different peacocks or locality forms leads to hybrids that can no longer be
      identified.
    sources:
      - *sf
      - *elieson
      - *barn
      - &archive14610
        kind: archive
        title: cichlids.com forum thread 14610
        url: https://www.cichlids.com/disc/read.php?2,14610
        accessed: 2026-10-12


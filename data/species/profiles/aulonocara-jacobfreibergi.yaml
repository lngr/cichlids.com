    - field: features.origin.value.localities
      proposals:
        - {by: generator, value: [Makanjila (type locality), Otter Point, Cape Maclear, Monkey Bay, Nkudzi, Domwe Island, Mumbo Island, Undu Reef (Tanzania)]}
        - {by: checker-a, value: [Makanjila (type locality), Otter Point, Cape Maclear, Monkey Bay, Nkudzi, Nankumba, Domwe Island, Mumbo Island, Undu Reef]}
        - {by: checker-b, value: [Otter Point, Cape Maclear, Monkey Bay, Nkudzi, Nankumba Peninsula, Domwe Island, Mumbo Island, Undu Reef]}
      decision: [Makanjila (type locality), Otter Point, Cape Maclear, Monkey Bay, Nkudzi, Nankumba, Domwe Island, Mumbo Island, Undu Reef (Tanzania)]
      rationale: >-
        The lists differ only in the type locality and in Nankumba; the union keeps both, since the

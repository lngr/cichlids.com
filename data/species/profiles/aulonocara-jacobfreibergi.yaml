        - {by: checker-a, value: {min: 7.5, max: 8.6}}
        - {by: checker-b, value: {min: 7.5, max: 9.0}}
      decision: {min: 7.5, max: 8.8}
      rationale: >-
        Decided by the vote count (unanimous, 3 of 3): the upper limits agree within 0.3, and the
        median of 8.6, 8.8 and 9.0 is 8.8.
    - field: features.ghDgh.tolerance
      proposals:
        - {by: generator, value: {min: 3, max: 25}}
        - {by: checker-a, value: {min: 3, max: 25}}
        - {by: checker-b, value: {min: 3, max: 19}}
        - {by: tiebreaker-1, value: {min: 3, max: 20}}
        - {by: tiebreaker-2, value: {min: 3, max: 20}}
      decision: {min: 3, max: 19}
      rationale: >-
        Decided by the vote count with the conservative method: the upper limits of 25 and of 19 to
        20 dGH lie more than 2 dGH apart, and the larger camp has only 3 of 5 votes. The
        intersection of all votes, 3 to 19 dGH, is the most cautious range.
    - field: features.khDkh.tolerance

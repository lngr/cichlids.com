    - field: features.maxSizeCm.value.female
      proposals:
        - {by: generator, value: 10}
        - {by: checker-a, value: 12}
        - {by: checker-b, value: 11}
      decision: 11
      rationale: >-
        Female sizes in the sources are about 10 cm (breeder), 10 to 12 cm (care guide) and up to
        13 cm (Guidarium); 11 cm is the middle of the typical figures. The male value of 15 cm is
        undisputed.
    - field: features.coloration.value
      proposals:
        - {by: generator, value: {baseColors: [blue, orange], pattern: bars}}
        - {by: checker-a, value: {baseColors: [blue, yellow], pattern: bars}}
        - {by: checker-b, value: {baseColors: [blue, orange], pattern: mixed}}
      decision: {baseColors: [blue, orange], pattern: bars}
      rationale: >-
        Konings and TropicalFreshwaterFish.com describe the southern forms common in the trade as
        blue with an orange to reddish-brown head and back and faint dark bars; yellow belongs to
        northern and Tanzanian forms such as Undu Reef. Yellow is left out also because the yellow
        Labidochromis caeruleus counts as a good partner.

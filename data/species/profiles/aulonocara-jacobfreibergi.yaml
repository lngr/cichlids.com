        - insect larvae
        - small crustaceans
        - frozen mysis and Artemia
        - fine-grade pellets and flakes with some plant content
    confidence: medium
    rationale: >-
      In the wild the species takes small invertebrates from the sand in front of its cave, found
      with the widened lateral line canals of the head: the Cichlid Room Companion lists it as a
      crustacean and insect eater, Konings names crustaceans and snails, Seriously Fish describes
      sand sifting and hunting of tiny prey, and Schwalbe et al. show lateral-line prey detection
      in the congener A. stuartgranti. Plant matter is no natural staple, so the type is
      invertivore, not omnivore as some dealer pages state. The bloat flag marks species that
      develop bloat on a high-protein diet. No source reports this for the species: a UK breeder
      asks for protein-rich food and links bloat in peacocks to excess plant matter, while
      Seriously Fish and Tropical Fish Hobbyist recommend some plant content in prepared food
      without naming bloat. A genus-level care page warns against worms and mammal meat, which led
      checker-b to set the flag; the other four votes left it off, and the vote count decided by
      qualified majority (4 of 5). Bloat from overfeeding or poor water remains possible as in all
      Malawi cichlids.

    de:
      - Feenbuntbarsch

variants:
  - name: Otter Point
    kind: locality
    note: Wild form from the southern lake near Cape Maclear; males blue with a brownish orange head and upper back.
  - name: Undu Reef
    kind: locality
    note: >-
      Naturally yellowish Tanzanian form, also traded as 'Mamelela'; the name 'lemon jake' is
      applied to it and to some captive strains.
  - name: Hongi Island
    kind: locality
    note: Tanzanian form traded under this name.
  - name: Cape Kaiser
    kind: locality
    note: Tanzanian form traded under this name.
  - name: Eureka
    kind: color-morph
    note: Captive line bred from Otter Point stock, with a strongly red body and a sky-blue dorsal fin.
  - name: Albino
    kind: color-morph
    note: Captive-bred albino line, often with an intense red or orange body.

features:

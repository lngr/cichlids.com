    verification:
      method: waterbody
      waterbody: lake-malawi
    tolerance:
      value: {min: 21, max: 29}
      confidence: medium
      rationale: >-
        Husbandry sources keep the species between 23 and 29 C, each with a narrower band:
        FishBase (after the Aquarien Atlas) 24 to 26 C, Guidarium and a hobby breeding report 24 to
        28 C, retailer sheets 23 to 26 or 23 to 28 C, and Seriously Fish and
        TropicalFreshwaterFish.com 25 to 29 C, which sets the upper bound. No care sheet goes below

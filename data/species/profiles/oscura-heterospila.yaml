  minTank:
    value:
      volumeL: 720
      lengthCm: 200
      depthCm: 60
    confidence: medium
    rationale: "Proposals were generator 720 L, 200 cm length and 60 cm depth; checker-a 450 L, 180 cm and 50
      cm; checker-b 720 L, 200 cm and 60 cm; checker-c 900 L, 250 cm and 60 cm. The component medians are
      720 L, 200 cm and 60 cm, retained for the selected adult pair. Ulas explicitly gives 200 by 60 by
      60 cm for a pair, equal to 720 L nominal rectangular volume before displacement, and 250 by 60 by
      60 cm or 900 L for five fish. The Nordic association and Zoopet give 700 L and 200 cm. Smaller
      sources list 450 L, 208 L, approximately 284 L or 341 L, or a 150 cm tank, often without equally
      clear adult social-unit justification. The median is directly supported for a pair and is below the
      largest source recommendation, rather than inflated by the five-fish proposal. Archived 60-gallon
      stocking is a proposal without a reported outcome."

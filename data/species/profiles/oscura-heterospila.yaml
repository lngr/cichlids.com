            region: "Atlantic drainages of southern Mexico and Guatemala, principally the Usumacinta and Candelaria
              systems"
            waterbody: null
            localities:
              - Rio Usumacinta at Montecristo
              - Candelaria River
              - Subin River at Sayaxche
      decision:
        continent: Central America
        region: Atlantic-slope Usumacinta and Candelaria drainages of southern Mexico and Guatemala
        waterbody: null
        localities:
          - Rio Usumacinta at Montecristo
          - Rio Candelaria
          - Rio Subin at Sayaxche
          - Rio San Pedro
          - Rio La Pasion
          - Lacantun sub-basin
          - Laguna Lachua
      rationale: "All four full-profile runs identify the same Mexican and Guatemalan Atlantic-slope range.
        Their locality lists differ: the generator includes Lake Lachua, checker-a specifies the
        Montecristo type locality and Subin at Sayaxche, checker-b adds San Pedro and La Pasion, and
        checker-c emphasizes Subin. The final locality list combines corroborated occurrences from the
        catalog, CRC photographs and fish surveys, including the Lacantun survey. Fishipedia also lists
        Motagua, but stronger read sources do not corroborate it. No named waterbody-table range applies.
        Legacy archive threads concern information scarcity and proposed stocking rather than natural
        chemistry."
    - field: features.temperatureC
      proposals:
        - by: generator
          value:
            min: 26
            max: 30
        - by: checker-a
          value:
            min: 25
            max: 30
        - by: checker-b
          value:
            min: 25
            max: 30
        - by: checker-c
          value:
            min: 24
            max: 30
      decision:
        min: 25
        max: 30
      rationale: "The tally retains 25 to 30 C with unanimous agreement under its 1 C threshold. Proposals were
        generator 26 to 30, checker-a 25 to 30, checker-b 25 to 30 and checker-c 24 to 30 C; 25 to 30 is
        the rounded midpoint of the agreeing bounds, not a decision with method median. Representative
        lowland measurements support it: the Tenosique dry-season site means are 28.3 to 30.2 C,
        lower-river rainy-season readings 25.6 to 30.7 C and the Lacantun survey means 23.6 to 29.6 C.
        Wider reports remain evidence: Soria-Reinoso et al. measured 20.8 to 29.8 C across the basin,
        including the cool upstream Ixcan, the lower-river study recorded 22.96 to 33.88 C in the dry
        season, San Pedro artificial drains had site-season means of 25.1 to 32.5 C, Ulas reports native
        25 to 33 C, and FAO compiles 21.0 to 36.3 C. Those endpoints do not establish typical conditions
        at identified capture sites or chronic aquarium limits. FishBase gives 26 to 30 C. Regional
        coverage and the distinction between averages and extremes keep confidence medium."
    - field: features.ph

      widely. CRC calls it suitable for beginners, Ulas reports manageable routine keeping, Aquarium Wiki
      and Aquariumpro give intermediate assessments, and the Nordic register plus several hobby pages
      advise experience. Moderate reflects care that is feasible with a very large aquarium and a means
      of managing pair and breeding aggression. A favorable temperament report does not remove those
      practical requirements, and conflicting source ratings prevent high confidence."

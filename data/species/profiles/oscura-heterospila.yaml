  social:
    value:
      structure: pair
    confidence: medium
    rationale: "Generator, checker-a and checker-b proposed pair; checker-c proposed a group of at least
      five. CRC reports monogamous mating, and the Nordic association plus Zoopet recommend an accepted
      adult pair after juvenile group formation. Ulas favors five fish and provides separate dimensions
      for both a pair and a group. The pair is selected as the minimum adult unit, with five-fish
      maintenance retained as a larger-tank alternative. Monogamous breeding alone does not forbid
      nonbreeding group life. Aquarium Wiki's 1:2 stocking ratio remains evidence but does not establish
      a harem system."

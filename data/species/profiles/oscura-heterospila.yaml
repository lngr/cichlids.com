      selected adult pair in the stated spacious aquarium. The Nordic register and Zoopet warn of strong
      conspecific aggression, whereas Ulas reports very mild interactions over almost six years,
      primarily in a group. Checker-c's level 1 applies to its five-fish group arrangement. Forum reports
      also describe timid groups and warn that an unusually aggressive male remains possible. Clear
      hierarchy and breeding-related pursuit fit level 2 without claiming that persistent injury is
      normal for a compatible pair. Conflicting experiences and unmeasured severity keep confidence low."

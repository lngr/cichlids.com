        longer specialist keeping account. Retailer recommendations also extend to 30 C. The decided span
        is narrower than the combined source envelope of 22 to 30 C and contains the decided natural
        range. Routine 24 to 28 C has better husbandry support than constant maintenance at 30 C; no
        multiyear endpoint trial was retrieved."

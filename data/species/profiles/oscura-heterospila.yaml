    value: normal
    confidence: medium
    rationale: "All four full-profile runs proposed normal. Ulas describes taking food at both the bottom and
      surface, followed by continued searching beneath litter; forum observers also report readiness to
      eat but otherwise timid fish. Normal is the closest rubric mapping without evidence of frantic
      competitive feeding or chronic inability to capture food. No measured comparative feeding-rate
      study was retrieved, and dominant companions may still suppress access."

  coloration:
    value:
      baseColors:
        - green
        - yellow
        - silver
        - black
      pattern: mixed
    confidence: medium
    rationale: "Generator proposed green, yellow and black with a mixed pattern; checker-a silver and black
      with spots; checker-b green, yellow, black and silver with mixed; checker-c green, silver and black
      with mixed. Ulas describes an olive to golden reflective background and dark irregular marks
      together with broad bars, while Fishipedia emphasizes a silver background. The revision confirms
      dark scales, bars and a caudal-peduncle blotch. Combining those adult backgrounds and retaining
      mixed better represents the evidence than spots alone. Pale breeding contrast is a temporary state
      rather than a separate color morph."

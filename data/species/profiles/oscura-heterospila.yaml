  aggressionHeterospecific:
    value: 2
    confidence: medium
    rationale: "All four full-profile runs proposed level 2. Ulas observed mild displays without pursuit,
      while the Nordic association reports increased aggression during spawning and recommends separate
      breeding space unless the tank is very large. Forum accounts allow gentler cichlids and
      livebearers. Retailers and hobby summaries range from peaceful to aggressive, and those conflicting
      rubric interpretations remain evidence. Territorial exclusion during brood defense fits level 2 for
      a properly housed pair; routine attacks beyond its territory are not established."

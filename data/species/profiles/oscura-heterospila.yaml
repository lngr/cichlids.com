  habitat:
    text: "The species occurs in the Usumacinta and Candelaria systems, including slower river areas, pools
      and connected lakes. Fish surveys also document San Pedro, La Pasion and the Lacantun sub-basin.
      Fine substrate, submerged roots, wood and rocky or vegetated margins provide feeding and shelter
      opportunities. The decided regional natural ranges are 25 to 30 C, pH 7.3 to 8.4, 14 to 20 dGH and
      7 to 8 dKH. The hardness and alkalinity values come from limited dry-season river sampling rather
      than a survey of every population. Lake Lachua is an exceptional occurrence: littoral means were
      28.2 to 29.1 C and pH 8.0 to 8.5, with reported hardness of 1038 to 1181 mg/L, approximately 58 to
      66 dGH if expressed as CaCO3 equivalent. That unusual hardness stays outside ordinary water and
      tolerance ranges. Wider seasonal basin measurements remain evidence rather than aquarium targets."

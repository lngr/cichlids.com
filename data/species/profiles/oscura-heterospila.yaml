  breeding:
    text: "Reproduction centers on a monogamous pair and an exposed spawning surface. Adults may dig near a
      stone or similar support and develop stronger pale-and-dark contrast as eggs are laid and
      fertilized. Both protect the eggs and later the brood. Association accounts place hatching around
      two to four days, with several more days before free swimming, depending on conditions. Suitable
      small fry foods include finely sized prepared food and newly hatched brine shrimp. A family may
      need separate space when territory defense disrupts companions. Successful spawning alone does not
      demonstrate that a crowded aquarium is suitable for long-term maintenance."

  ghDgh:
    value:
      min: 14
      max: 20
    confidence: medium
    rationale: "All four full-profile runs proposed 14 to 20 dGH, retained exactly by the unanimous tally.
      Cruz-Leyva et al. directly measured total hardness independently of alkalinity: six dry-season
      Tenosique site means of 250 to 352 mg/L as CaCO3 give 14.01 to 19.72 dGH after division by 17.848,
      rounded outward. This regional mainstem baseline has limited seasonal coverage and no simultaneous
      species record at every water sample. The much wider FishBase 3 to 69 dH range and the Nordic
      association's 69 dGH occurrence remain evidence. Granados-Dieseldorff et al. report Lachua hardness
      of 1038 to 1181 mg/L, approximately 58.16 to 66.17 dGH if expressed as CaCO3 equivalent. That
      exceptional mineral-rich karst habitat is described in the habitat text and excluded from ordinary
      natural and aquarium ranges. Fishipedia's 3 to 20 dGH compilation lacks a sampling series.
      Conductivity and dissolved inorganic carbon have not been treated as measured GH."

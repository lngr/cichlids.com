  compatibility:
    text: "Gentler Central American cichlids are potential companions when there is additional bottom area
      beyond the adult-pair minimum. The Dutch keeper account specifically names Thorichthys meeki,
      Thorichthys pasionis and Cribroheros robertsoni. Breeding may still require separation. Large
      forceful predators can overwhelm this relatively restrained species, while tiny fish remain an
      avoidable prey risk. Binns Hybrid Encyclopedia reports captive offspring with Super Red Texas and
      with 7 Blood; those domestic lines therefore have separate presumed crossing groups. The claims
      lack independent pedigree checks and information about same-species mates. The older Vieja name
      does not add this species to the existing vieja group. A legacy 60-gallon mixed-stocking question
      provides no confirmation of a successful combination."

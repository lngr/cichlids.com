  sexing:
    text: "Mature males usually grow larger and appear more elongated, with relatively larger dorsal and anal
      fins. Females tend to be smaller, but different ages or feeding histories can obscure that
      distinction. Juvenile markings and temporary breeding colors are unreliable sex indicators. Compare
      mature fish of similar age where possible and assess their behavior as candidate partners. The
      female size estimate remains less secure than the general observation that males grow larger."

          - Small crustaceans
          - Vegetable matter
      rationale: "The unanimous tally retains omnivore and bloatSensitive false with medium confidence; all
        four full-profile runs agree on those two hard fields while their example foods differ. CRC's
        detritus and insect feeding, the field isotope study's generalist classification and both
        association accounts support plant and animal intake. Fishipedia labels the fish carnivorous,
        interpreted by checker-b as invertivore, but its provisional page supplies no prey table and is
        outweighed by the direct field and specialist evidence. The foods list follows the tally exactly.
        The false bloat flag means that no characteristic protein-triggered syndrome was established, not
        that rich feeding was shown harmless. Ulas instead warns about excessive size and fat deposition.
        The read FishBase diet table contains no records."
    - field: features.aggressionConspecific
      proposals:
        - by: generator
          value: 3
        - by: checker-a
          value: 2
        - by: checker-b
          value: 2
        - by: checker-c
          value: 1
      decision: 2
      rationale: "Generator proposed 3, checker-a 2, checker-b 2 and checker-c 1. Level 2 is retained for the
        selected adult pair in the stated spacious aquarium. The Nordic register and Zoopet warn of
        strong conspecific aggression, whereas Ulas reports very mild interactions over almost six years,
        primarily in a group. Checker-c's level 1 applies to its five-fish group arrangement. Forum
        reports also describe timid groups and warn that an unusually aggressive male remains possible.
        Clear hierarchy and breeding-related pursuit fit level 2 without claiming that persistent injury
        is normal for a compatible pair. Conflicting experiences and unmeasured severity keep confidence
        low."
    - field: features.territory
      proposals:
        - by: generator
          value:
            size: large
            breedingOnly: true

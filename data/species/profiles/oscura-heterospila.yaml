            max: 20
        - by: checker-c
          value:
            min: 5
            max: 25
        - by: tiebreaker-1
          value:
            min: 3
            max: 20
        - by: tiebreaker-2
          value:
            min: 3
            max: 20
      decision:
        min: 3
        max: 20
      rationale: "The qualified-majority tally retains 3 to 20 dGH with 4 agreeing votes out of 6 and low
        confidence. Generator, tiebreaker-1 and tiebreaker-2 proposed 3 to 20; checker-a proposed 5 to
        20, checker-b 8 to 20 and checker-c 5 to 25 dGH. The agreeing cluster includes checker-a within
        the 2 dGH threshold, and its agreeing lower-bound midpoint rounds to 3. Tropischevissengids
        explicitly recommends 3 to 20 GH; Fishipedia gives the same numbers without a field protocol.
        Aquarium Wiki recommends 8 to 20, Aqualvera and The Evolved Fish 5 to 15, and Aquariumpro a wider
        5 to 25 dGH. The 20 upper endpoint contains the direct 14.01 to 19.72 dGH river baseline, while
        the 25 upper proposal lacks stronger long-term outcome data. FishBase's much wider 3 to 69 dH and
        the 69 dGH occurrence describe environment rather than chronic captive health. The reported
        Lachua extreme is excluded. The lower 3 endpoint remains weakly supported; a forum suggestion of
        breeding near 19.05 dGH is not an observed trial. Ulas supplies KH rather than GH, and no KH
        value has been relabeled."

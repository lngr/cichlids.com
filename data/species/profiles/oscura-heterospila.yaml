  predation:
    value: 1
    confidence: low
    rationale: "All four full-profile runs proposed level 1, retained with unanimous verification and low
      confidence. CRC describes detritus and insect feeding, the isotope study identifies a trophic
      generalist, and association accounts describe plant and invertebrate foods. None measures a
      fish-prey size limit or demonstrates regular piscivory. Incidental fry and very small fish capture
      is a provisional rubric inference; the 2 cm threshold belongs to the rubric rather than to an
      observed feeding trial. Forum advice allowing larger livebearers and tetras does not prove safety
      for tiny fish."

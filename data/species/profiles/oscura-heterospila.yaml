partners:
  suitable:
    - species: Thorichthys meeki
      reason: Explicitly recommended by NVC as a gentler companion with overlapping habitat and water needs.
      condition: Adult fish with separate territories in a furnished aquarium larger than the pair minimum;
        separate spawning fish if needed.
    - species: Thorichthys pasionis
      reason: NVC recommends this relatively restrained bottom-dwelling Central American companion.
      condition: Additional footprint and separate spawning refuges; avoid crowding or incompatible pairs.
    - species: Cribroheros robertsoni
      reason: NVC names it as a suitable companion with a compatible general habitat and temperament.
      condition: A larger mixed-species aquarium with ample feeding and refuge space; monitor competition and
        breeding.
  unsuitable:
    - species: Parachromis dovii
      reason: A very large aggressive fish predator can dominate and injure the less forceful Montecristo
        cichlid; inference from general species behavior.
    - species: Amphilophus labiatus
      reason: "Intense territorial aggression can overwhelm this relatively gentle fish; routine mixing is
        unsuitable, based on general behavior rather than a tested pair."
    - species: Boraras brigittae
      reason: "Tiny adult size makes this species vulnerable to an opportunistic adult omnivore; it also
        normally favors much softer acidic water. This is a compatibility inference, not a reported
        feeding trial."
    - species: 7 Blood
      reason: "Binns Hybrid Encyclopedia reports captive offspring with this domestic line; parentage and
        partner-choice conditions are unverified, supporting a presumed crossing risk."
    - species: Super Red Texas
      reason: "Binns Hybrid Encyclopedia reports captive offspring with this domestic line; parentage and
        partner-choice conditions are unverified, supporting a presumed crossing risk."
profile:
  overview:
    text: "A large bottom-foraging cichlid from Mexico and Guatemala, the Montecristo cichlid combines a
      reflective olive, golden or silver background with dark bars and uneven blotches. The accepted name
      is Oscura heterospila; Vieja heterospila and older Theraps combinations refer to the same species.
      Many keepers describe a restrained fish, but reports of breeding and conspecific aggression differ.
      An accepted pair in a spacious aquarium is the default arrangement here. The available husbandry
      accounts support a varied diet and careful social management more strongly than they support exact
      lifespan, female size or tolerance endpoints."

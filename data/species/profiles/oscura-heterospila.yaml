            size: large
            breedingOnly: true
      decision:
        size: large
        breedingOnly: true
      rationale: "Generator, checker-b and checker-c proposed a large breeding-only territory; checker-a
        proposed small and breeding-only. All describe an exposed spawning site and defended young, but
        no read account measures a 30 cm radius or tank fraction. A substantial bottom area is inferred
        from the adult pair, brood defense and specialist space recommendation, favoring large rather
        than small. Ulas reports few disputes outside spawning, so breedingOnly marks the dominant
        trigger rather than proving that a nonbreeding fish never defends a refuge."

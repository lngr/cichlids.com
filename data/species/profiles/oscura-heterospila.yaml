      note: Former combination listed by Catalog of Fishes.
    - name: Theraps heterospila
      note: Historical spelling in the generic placement discussed by the catalog.
  legacyNames:
    - Vieja heterospila
  note: "Eschmeyer's Catalog of Fishes accepts Oscura heterospila (Hubbs, 1936), the sole species of
    Oscura. Both the Oscura and legacy Vieja lists were checked. McMahan and colleagues erected Oscura in
    2015; Alda and colleagues later questioned the identity of a juvenile that had suggested placement
    inside Vieja. Theraps heterospila is retained as a historical spelling, not as a separate species.
    The former Vieja combination does not establish membership of the modern vieja crossing group."

      checker-b and checker-c proposed an empty list; checker-a, tiebreaker-1 and tiebreaker-2 proposed
      both ids. Each group therefore reaches the conservative rule's two-vote inclusion threshold,
      although no qualified majority was obtained. The empty proposals reflected absence from the curated
      file and the separate Oscura lineage; these do not negate the later gallery claims. Binns Hybrid

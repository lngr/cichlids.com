  sizeAndGrowth:
    text: "Plan for an adult male around 25 cm and a smaller female around 20 cm. The female number is a
      working estimate because reliable sex-specific maxima are scarce. FishBase lists 24 cm standard
      length, which excludes the tail and cannot be read as the same aquarium total length. Association
      and dealer maxima extend higher, but exceptionally large or overfed fish do not define typical
      healthy aquarium size. Forum accounts report slow growth, although growth differs with feeding and
      conditions. Lifespan guidance is provisionally 5 to 10 years; other care pages list 15 years
      without dated survival evidence."

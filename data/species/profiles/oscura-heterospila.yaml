    confidence: low
    rationale: "Proposals were generator 25 cm male and 22 female, checker-a 24 and 20, checker-b 25 and 20,
      and checker-c 25 and 20. Their per-sex medians are 25 and 20 cm, retained after source checking.
      Ulas reports typical large aquarium fish around 25 cm and describes males as larger; Zoopet also
      lists 25 cm. Fishipedia gives 20 to 24 cm, Tropischevissengids 22 to 25 cm, the Nordic register 30
      cm, and retailers may list 25.4 cm for either sex or 29 cm unsexed. FishBase's 24 cm is standard
      length and is not mechanically equated to aquarium total length. The decided female 20 cm remains
      an estimate from sexual size difference rather than a measured maximum. Larger published maxima and
      the generator's 22 cm female estimate remain evidence."

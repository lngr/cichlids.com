      rationale: "The conservative tally retains oscura-heterospila-seven-blood and
        oscura-heterospila-super-red-texas with 3 agreeing votes out of 6 and low confidence. Generator,
        checker-b and checker-c proposed an empty list; checker-a, tiebreaker-1 and tiebreaker-2 proposed

        although no qualified majority was obtained. The empty proposals reflected absence from the
        curated file and the separate Oscura lineage; these do not negate the later gallery claims. Binns
        Hybrid Encyclopedia labels captive offspring involving Oscura heterospila and the domestic lines
        Super Red Texas and 7 Blood. Repeated labels and the gallery index are one compilation, not
        independent corroboration. Parentage, fertility, breeding location and availability of
        conspecific mates are unspecified, so both pairwise groups have basis presumed. Unknown ancestral
        species are not substituted for the named lines. The existing vieja group is excluded because
        historical genus placement and generic congener warnings do not establish additional crosses."

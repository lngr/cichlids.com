  khDkh:
    value:
      min: 7
      max: 8
    confidence: medium
    rationale: "The tally decides 7 to 8 dKH with medium confidence. Generator, checker-b and checker-c
      proposed 7 to 8; checker-a proposed 5 to 10. The direct Tenosique alkalinity site means of 128 to
      135 mg/L as CaCO3 convert to 7.17 to 7.56 dKH-equivalent alkalinity, distinct from total hardness.
      At the reported alkaline pH this is a useful aquarium KH approximation, with limited regional and
      seasonal coverage. Ulas's wider 3 to 14 KH habitat guidance remains evidence. Checker-a also
      calculated 3.6 to 11.3 dKH from the carbon survey; that conversion assumes carbonate speciation and
      is retained as an inference, not as independently measured alkalinity. The narrower 7 to 8 decision
      therefore follows the direct alkalinity measurements. Natural KH intentionally carries no
      verification object."

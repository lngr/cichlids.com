    rationale: "Generator, checker-b and checker-c proposed sand, rock, wood and plants, with order varying;
      checker-a omitted wood. Sand or fine sediment follows the natural bottom descriptions, while litter
      searching, branches and roots support wood. Rocks provide exposed spawning surfaces and vegetation
      provides cover. The Lachua occurrence survey independently describes submerged roots, rocks and
      vegetation, although a lake-wide structure list does not establish preference for every
      microhabitat. These zones describe usable habitat structure, not a requirement for dense planting;
      open swimming room also remains necessary."

  diet:
    text: "Offer a balanced omnivore diet with plant material and modest portions of aquatic invertebrate
      food. Detritus and insect feeding in CRC, mixed foods in association accounts and generalist
      trophic ecology in the field study support this combination. The provisional Fishipedia carnivore
      label does not establish a fish-based diet. Allow bottom searching and ensure that more forceful
      companions do not monopolize food. Energy-rich feeding can increase fat deposition and adult size.
      No characteristic high-protein bloat syndrome was established for this species; that uncertainty
      does not demonstrate that excessive animal food is harmless. Very small fish and fry remain an
      opportunistic feeding risk."

  socialBehavior:
    text: "Use an accepted pair as the smallest recommended adult unit. Growing juveniles together can permit
      partner formation, but two opposite-sex adults are not automatically compatible. Hierarchy and
      pursuit can intensify as a pair forms or guards a brood. The Dutch association account describes
      very mild interactions in a group, while Nordic and other accounts warn of stronger conspecific
      aggression. Five adults are a documented husbandry alternative in a larger 250 by 60 by 60 cm
      aquarium, about 900 L nominal volume. Watch feeding access and hiding as well as overt injury, and
      retain a practical means of separating rejected or persistently chased fish."

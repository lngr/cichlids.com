  ph:
    value:
      min: 7.3
      max: 8.4
    confidence: medium
    rationale: "The tally retains pH 7.3 to 8.4 with unanimous agreement under its 0.3 pH threshold.
      Proposals were generator 7.3 to 8.5, checker-a 7.2 to 8.3, checker-b 7.2 to 8.5 and checker-c 7.3
      to 8.3; the decision rounds the midpoint of agreeing bounds and keeps method unanimous. The direct
      carbon survey measured 7.3 to 8.3, the Lacantun fish survey site means were 7.30 to 8.09, and
      Tenosique Table 1 gives 7.4 to 7.9. The Tenosique narrative instead claims 7.1 to 7.9; the table is
      preferred, while both readings remain in evidence. Wider reports include San Pedro site-season
      means of 6.7 to 7.8, lower-river readings of 7.50 to 8.93, FishBase 7.5 to 8.5, Lachua means 8.0 to
      8.5 and FAO's basin compilation 6.6 to 8.7. The decided range describes ordinary alkaline river
      conditions rather than every unusual or transient sample, and neither bound is a tested
      physiological limit."

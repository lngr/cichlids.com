      rationale: "All full-profile runs agree on Oscura heterospila, its authority and the three historical
        combinations. Generator and checker-c also retain Theraps heterospila as a spelling used in
        historical literature. The catalog records that spelling in its historical placement discussion,
        so it remains a search alias rather than a separate taxon."

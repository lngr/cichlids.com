      Texas and 7 Blood. Repeated labels and the gallery index are one compilation, not independent
      corroboration. Parentage, fertility, breeding location and availability of conspecific mates are
      unspecified, so both pairwise groups have basis presumed. Unknown ancestral species are not
      substituted for the named lines. The existing vieja group is excluded because historical genus

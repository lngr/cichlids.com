  problems:
    text: "Insufficient adult space, incompatible partners and excessively rich feeding are the main
      practical concerns in the read husbandry accounts. Persistent hiding, missed meals or repeated
      pursuit warrant a review of social conditions before injury becomes obvious. Keep water quality and
      oxygenation stable, quarantine additions and examine both husbandry and health when appetite or
      behavior changes. These are general preventive practices rather than evidence of a distinctive
      disease syndrome. Studies of microbial contamination in the native river provide environmental
      context and do not diagnose captive fish or justify routine medication."

        checker-b and checker-c proposed 23 to 30; checker-a proposed 22 to 30 C. Ulas recommends 23 to
        28 C for aquarium keeping, the Nordic association 23 to 27 C, Zoopet 26 to 28 C and Aquarium Wiki

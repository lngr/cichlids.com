  husbandry:
    text: "An accepted adult pair needs about 720 L nominal volume with a footprint at least 200 cm long and
      60 cm front to back. The supporting dimensions are 200 by 60 by 60 cm; actual water volume falls
      after substrate and furnishings are added. Provide fine rounded substrate, secure stones and wood,
      several retreats and broken sightlines. Preserve enough open bottom for feeding and a spawning
      surface. Routine 24 to 28 C has better specialist support than constant maintenance at the upper
      tolerance boundary. The decided provisional tolerances are 23 to 30 C, pH 7.0 to 8.5, 3 to 20 dGH
      and 3 to 14 dKH. Maintain stable chemistry, reliable filtration and regular water changes, and
      assess oxygenation carefully in warmer water."

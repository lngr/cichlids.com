    tolerance:
      value:
        min: 23
        max: 29
      confidence: medium
      rationale: "The tally decides 23 to 29 C unanimously with four votes: the generator and checker-a proposed 22 to 29 C, checker-b and checker-c 23 to 29 C, and the bounds lie within one degree. Care sources give 23 to 27 C (Seriously Fish, a Russian care page), 24 to 27 C (FishBase, the Aquarium Wiki, a UK shop), 23 to 26 C (both Fishkeeper pages) and 23 to 28 C (Fishipedia); Seriously Fish advises 25 to 26.5 C for breeding. The upper limit of 29 C is the lake maximum, which the tolerance contains, and lies above every care sheet. Imperial Tropicals gives a wider span of about 21 to 28 C (70 to 82 F), so the decided lower limit is narrower than that source. A long-time keeper stresses that the genus reacts to sudden changes of temperature, so a steady value matters more than the exact limits. Confidence stays medium as the tally suggests, because the upper end rests on lake data and not on husbandry reports."

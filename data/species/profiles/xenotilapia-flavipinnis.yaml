  compatibility:
    text: "Good companions are calm Tanganyika species that use other parts of the tank: Cyprichromis and Paracyprichromis shoal in open water, small shell dwellers such as Neolamprologus multifasciatus stay at their shells, and some quiet Lamprologus and Neolamprologus species keep to the rocks. Lake Malawi mbuna, restless grazers such as Tropheus, active or aggressive sand dwellers and large predators such as Cyphotilapia frontosa are unsuitable, because competition and pressure cause lasting stress that this species does not survive well. No crosses with other species are known."

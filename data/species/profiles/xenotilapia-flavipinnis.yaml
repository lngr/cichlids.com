  note: "The legacy catalog name is the valid name. The Catalog of Fishes lists Xenotilapia flavipinnis Poll 1985 as valid in its original genus, described in Revue de Zoologie Africaine 99(1) from Pt. Ruziba south of Bujumbura, Burundi, and names no synonym. The Cichlid Room Companion also has a page for Haplochromis flavipinnis, a different taxon that is not a synonym. All four runs agree on the taxonomy."

  problems:
    text: "Declining water quality is the main danger: Seriously Fish, Fishkeeper and importers all report that the species suffers quickly from it, so overstocking, overfeeding and missed water changes lead to losses. Gravel or sharp sand can injure the gills. Surplus fish in a tank too small for several territories can die from the stress of constant chasing. Startled fish dash into rocks or jump out of open tanks. A keeper of a related Xenotilapia reports fish that died one after another without visible cause and suspected stress from busy tankmates."

  habitat:
    text: "The species lives around the whole lake, with records from Burundi, DR Congo, Tanzania and Zambia and several geographic forms. It is common over shallow sand and in mixed zones of sand and rock and sometimes enters deeper water. Feeding schools can number several hundred fish, and pairs move towards rockier ground to spawn. The lake water is hard and strongly buffered, with a pH of 8.4 to 9.4, 10 to 13 dGH, 15 to 20 dKH and 23 to 29 degrees Celsius over the year."

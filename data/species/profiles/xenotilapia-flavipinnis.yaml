  husbandry:
    text: "A tank of about 200 litres and 100 cm length suits a group of six; two breeding pairs need about 130 cm. The floor needs a broad area of fine, soft sand, because gravel can lodge in the throat or harm the gills of a fish that sifts substrate all day. A few rock piles at the edges give cover and break sight lines between territories. Strong filtration and frequent partial water changes are essential, as the species is very sensitive to declining water quality. Hard, alkaline water of 23 to 27 degrees Celsius, pH 8.0 to 9.5 and 8 to 25 dGH matches the care advice, and steady values matter more than exact ones. A cover is needed, since startled fish jump."

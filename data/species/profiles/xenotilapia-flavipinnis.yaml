  sizeAndGrowth:
    text: "This is a small cichlid. FishBase gives 9.2 cm total length, Seriously Fish 9 cm standard length, Fishkeeper 9.5 cm and an importer about 10 cm, while Tanganyika.si names about 11 cm as the upper limit. Well-kept males reach about 10 cm and females about 9 cm. Care pages say males grow a little larger, though no sexed measurements exist."

  ph:
    value:
      min: 8.4
      max: 9.4
    confidence: high
    rationale: "The natural range is the lake range of pH 8.4 to 9.4 with verification by water body; all four runs proposed it. Over one year the pH at 40 m ranged from 8.47 to 9.40 off Bujumbura and Uvira and from 8.66 to 9.12 off Mpulungu (Plisnier et al. 1996), and surface water is about 8.8 to 9.2. The FAO source book quotes pH 7.3 to 7.8 after Talling and Talling (1965); this figure contradicts the measured alkalinity and all modern readings and stays out of the range."

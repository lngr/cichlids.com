  social:
    value:
      structure: group
      minGroup: 6
    confidence: medium
    rationale: "The generator, checker-a and checker-b propose a group of at least six, checker-c a pair. Field studies describe monogamous pairs with biparental care (Yanagisawa 1986, Sefc 2011, Kidd et al. 2012), and Tanganyika.si advises raising a small group, keeping the pair that forms and removing the others. Seriously Fish recommends a group of six to ten in which pairs form, because a lone pair squabbles; Fishkeeper advises ten or more, a Russian care page eight to ten and a forum keeper at least six. The group is the recommended social unit of most sources, so the structure is group with six fish; the single pair in a tank of about 100 cm is a working alternative described in the profile. Fishipedia calls dominant males polygamous, which contradicts the field studies."

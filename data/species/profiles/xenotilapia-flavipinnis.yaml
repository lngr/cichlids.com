  temperatureC:
    value:
      min: 23
      max: 29
    confidence: high
    rationale: "The species is a Lake Tanganyika endemic, so the natural range is the lake range of 23 to 29 C with verification by water body; all four runs proposed it. Hourly buoy readings off Mpulungu span 23.85 to 29.01 C (Verburg et al. 1997), and the southern basin is cooler and more variable during the upwelling months of June to September."

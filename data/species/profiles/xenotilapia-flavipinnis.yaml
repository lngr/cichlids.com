    confidence: high
    rationale: "The Catalog of Fishes, FishBase, the Cichlid Room Companion and Seriously Fish agree that the species is endemic to Lake Tanganyika; Seriously Fish names Burundi, DR Congo, Tanzania and Zambia as range states, and Tanganyika.si describes a lake-wide range with several geographic forms. The type locality is Ruziba near Bujumbura in Burundi. The localities merge the type locality with the collecting sites named by the four runs from Tanganyika.si, the Cichlid Room Companion and trade listings."

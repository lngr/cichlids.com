  sexing:
    text: "The sexes are hard to tell apart. Males tend to be a little more colourful, and some care pages say they grow slightly larger, but these differences are small. Examining the genital papilla is the only dependable method and needs an experienced hand. Most keepers do not sex the fish and instead watch a group of young fish for pairs, which reveal themselves by holding a patch of sand together."

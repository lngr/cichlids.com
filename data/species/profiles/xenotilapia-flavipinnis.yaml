  breeding:
    text: "The pair spawns on open sand within its territory. The female lays a few eggs at a time on a cleaned spot, steps aside for the male to fertilise them and then picks them up, repeating this until she holds the clutch. Broods are small, up to about 40 fry. She carries the eggs and young larvae for about 7 to 12 days and then passes the brood to the male, who holds it for roughly another 10 days. After release both parents guard the fry for about two weeks; field work by Yanagisawa showed that the male leads the guarding while the female feeds and recovers for the next spawning. Fry take Artemia nauplii or microworms as first food."
    sources:
      - kind: literature
        title: "Yanagisawa, Y. (1986). Parental care in a monogamous mouthbrooding cichlid Xenotilapia flavipinnis in Lake Tanganyika. Japanese Journal of Ichthyology 33(3), 249-261 (abstract)."

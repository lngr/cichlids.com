  aggressionConspecific:
    value: 2
    confidence: medium
    rationale: "The generator, checker-a and checker-b propose level 2, checker-c level 3. Young fish and non-breeding adults school; adults split into pairs that defend about 30 cm of sand against their own species. Tanganyika.si rates aggression between territorial pairs as high and warns that surplus fish that cannot rest on the sand may die of stress, an importer lists the fish as aggressive, and one forum keeper saw a formed pair harass the rest of the group in a 90 cm tank. Seriously Fish, Fishkeeper and a second forum keeper describe chasing by territorial pairs without injuries, with a group of six to ten in which a lone pair would squabble. No source reports common injuries, so level 2 fits a group in a tank of the recommended size; the risk to surplus fish in cramped tanks is part of the profile text."

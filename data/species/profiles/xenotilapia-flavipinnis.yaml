partners:
  suitable:
    - species: Cyprichromis leptosoma
      reason: A calm open-water shoaler of Lake Tanganyika that leaves the sand floor and its food to the sifters.
      condition: "Normal-sized forms, in a tank long enough for a shoal."
    - species: Paracyprichromis nigripinnis
      reason: A quiet midwater species that Seriously Fish names among good companions.
    - species: Neolamprologus multifasciatus
      reason: A tiny shell dweller that stays near its shells and does not contest open sand.
      condition: Place the shell bed in a separate corner.
    - species: Peaceful Lamprologus and Neolamprologus species
      reason: Seriously Fish names some of these small Tanganyika lamprologines among good companions; they keep to rocks or shells.
      condition: "Calm species only, with rockwork away from the open sand."
  unsuitable:
    - species: Lake Malawi mbuna
      reason: "Boisterous, territorial fish that outcompete a shy sifter at feeding; Seriously Fish advises against them."
    - species: Tropheus
      reason: Restless and quarrelsome grazers that unsettle a sensitive sand dweller.
    - species: Cyphotilapia frontosa
      reason: A large predator that can swallow a fish of 9 to 10 cm.
    - species: Active or aggressive sand-dwelling cichlids
      reason: "Tanganyika.si warns against them, because competition for the sand causes lasting stress that can kill this species."
profile:
  overview:
    text: "The yellow sand cichlid is a slender member of the tribe Ectodini, endemic to Lake Tanganyika and described by Poll in 1985 from Ruziba near Bujumbura in Burundi. Adults reach about 9 to 10 cm and show a silvery body with yellow fins. Schools roam the sand and sift it for tiny invertebrates, and adults form pairs that share the mouthbrooding and guard their young together. The fish is peaceful towards other species but reacts badly to poor water and rough tankmates, so it suits keepers who have some experience with Tanganyika tanks."
    sources:
      - kind: catalog-of-fishes
        title: "Eschmeyer's Catalog of Fishes: species of the genus Xenotilapia"
        url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Xenotilapia"
        accessed: 2026-10-17
        archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-446c8131/2026-10-14T171356Z

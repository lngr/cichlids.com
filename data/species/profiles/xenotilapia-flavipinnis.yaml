  diet:
    text: "In the wild the fish bites into the upper layer of sand and filters out small crustaceans and other invertebrates, often in large feeding schools. In the tank it takes most small foods, but frozen and live Daphnia, Cyclops and Artemia suit its habits best, along with fine flake and micro pellets. Several small portions a day work better than one large meal. As a slow feeder it needs tankmates that do not grab everything first, and leftovers that foul the sand harm this sensitive fish."

  territory:
    value:
      size: small
      breedingOnly: false
    confidence: medium
    rationale: "All runs agree on a small territory: Seriously Fish describes about 30 cm of sand per pair, roughly doubled just before spawning. On the flag the runs split two to two (generator and checker-b false, checker-a and checker-c true). In the lake the pair bond lasts for the breeding season, but Seriously Fish reports that aquarium pairs stay in their territory and defend it between spawnings, and Yanagisawa (1986) observed pairs that held a sand territory over several breeding cycles. Fishkeeper and Tanganyika.si describe how pairs claim the patch when they come into breeding condition. The rubric describes behaviour in a tank, so breedingOnly is false."

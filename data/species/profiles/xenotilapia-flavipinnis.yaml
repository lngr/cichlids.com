  socialBehavior:
    text: "Young fish and non-breeding adults live in schools. Mature fish pair off, and each pair claims a patch of sand about 30 cm across, which it defends against its own species and enlarges just before spawning. In the lake the bond lasts for a breeding season, whereas tank pairs often keep their patch permanently. Most keepers start with six to ten young fish and let pairs form, as a single pair tends to squabble; others keep only the pair that forms and remove the rest. Fish that cannot settle on the sand suffer from the pressure of territorial pairs and can die of stress in a crowded tank. Towards other species the fish is gentle and easily intimidated."

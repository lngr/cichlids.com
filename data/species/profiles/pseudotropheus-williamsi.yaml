    confidence: "high"
    rationale: "The settled natural interval is 21-29 C for Lake Malawi, with waterbody verification. The lake
      studies combine seasonal and regional conditions rather than a single preferred aquarium temperature.
      FAO reports a narrower 23-25 C surface sample interval, Vollmer describes roughly 23.5-28 C seasonal
      upper water, and the inherited Eccles abstract-based entry is 21-27 C. Eccles could not be rechecked:
      the DOI returned HTTP 403 and fetch-oa classified the work as not open access. Its inherited evidence
      remains explicitly limited to the earlier abstract reading."

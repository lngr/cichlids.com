    rationale: "All four profiles propose level 3. Malawi.si describes strong conspecific aggression and the
      Nordic register reports males excluding rivals from large territories. Fishipedia mentions potentially
      fatal male fights, while one northern-trade keeper reports much milder behavior. Persistent chasing with
      risks under inadequate space, cover or social ratios fits level 3 for the recommended adult harem;

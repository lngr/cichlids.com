        min: 21
        max: 30
      confidence: "low"
      rationale: "The tally decides 21-30 C with unanimous verification under its one-degree agreement threshold and
        low confidence. Generator proposed 21-29, checker-a 21-30, checker-b 20-30 and checker-c 21-30 C; the
        median endpoints of these agreeing proposals give 21-30. Species care advice mainly spans 23-28 C,
        FishBase and FishFish give 24-26, and the Tropaq northern trade-form page gives 25-30 C. The natural
        21-29 C interval is contained. The 20 C proposal has no direct species-specific chronic-limit
        evidence, while the 30 C endpoint has only weak trade-form support; the result is a husbandry
        estimate, not a demonstrated failure boundary."

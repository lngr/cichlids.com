  suitable:
    - species: "Robust Lake Malawi mbuna with dissimilar adult coloration"
      reason: "Species accounts allow substantial Malawi companions when territories and food access are maintained."
      condition: "The selected minimum houses the williamsi harem; mixed stocking may require substantially more
        space and separate refuges."
  unsuitable:
    - species: "Aulonocara baenschi"
      reason: "Timid peacock cichlids can be displaced from feeding and shelter by territorial mbuna; this is a
        behavior-based caution rather than a verified pair trial."
    - species: "Similar-looking male mbuna"
      reason: "Colour and shape resemblance can intensify challenges to perceived rivals."
profile:
  overview:
    text: "Pseudotropheus williamsi is a substantial Lake Malawi mbuna associated with shallow rocks and feeding
      space above them. Males and females differ in colour, and fish from different localities or trade lines
      can look quite different. Red Top Williamsi and Blue Lips are used in the hobby, but Blue Lips often
      denotes northern stock that CRC treats separately as undescribed. A locality label and reliable stock
      history are therefore useful when identifying fish. Its territorial behavior and adult size call for
      prior experience with Malawi cichlids."
    sources:
      - *a1
      - *a2
      - *a56
      - *a51
      - *a3
      - *a4
      - *a54
  habitat:
    text: "The species is endemic to Lake Malawi, with records from northern bays, several islands and the
      southeast arm. It inhabits shallow exposed rock habitat, often in the upper few metres, and catches
      drifting animal food as well as feeding from rock surfaces. The regional natural ranges are 21-29 C, pH
      7.7-8.6, 3-5 dGH and 5-8 dKH. The lake is alkaline without having high calcium-magnesium hardness;
      alkalinity and general hardness describe different aspects of its chemistry."
    sources:
      - *a2
      - *a56
      - *a51
      - *a10
      - *a32
      - *a3
      - *a4
      - *a54
      - *a15
      - *a33
      - *a14
  sizeAndGrowth:
    text: "Use about 16.5 cm for an adult male and 13 cm for an adult female when planning space. These are
      typical aquarium planning maxima rather than record limits. Fedeaqua gives broader sexed ranges of 16-18
      cm and 12-14 cm, while FishBase provides an unsexed or male maximum of 16.5 cm. Female measurements are
      less consistent across accounts. The selected lifespan estimate is roughly 5.5-8 years, with low
      confidence because the available figures come from care accounts rather than tracked longevity studies."
    sources:
      - *a2
      - *a16
      - *a51
      - *a3
      - *a52
  husbandry:
    text: "Plan at least 450 litres with a 150 cm length and 55 cm depth for one male and three females. Build
      stable rock cover with several routes between shelters and interrupted sight lines, while preserving
      swimming and feeding space above the rocks. Multiple adult males need substantially more room; a
      locality account suggests about 200 cm to separate their territories. Maintain clean, well-oxygenated
      water and avoid rapid chemistry changes. The selected long-term estimates are 21-30 C, pH 7.5-8.6, 3-20
      dGH and 5-14 dKH. The outer endpoints are uncertain husbandry estimates rather than experimentally
      demonstrated limits or daily operating targets. A secure cover is sensible for fish that can take
      insects at the surface."
    sources:
      - *a16
      - *a17
      - *a34
      - *a51
      - *a54
      - *a26
      - *a52
      - *a23
  socialBehavior:
    text: "The recommended starting unit is one male with three females. Males may chase rivals or females
      persistently, and their defended area can occupy a substantial part of the aquarium. Other robust Malawi
      cichlids can be considered when sufficient space and escape cover are available. Additional females or
      an alternative group arrangement cannot compensate for inadequate territory space. Some reports of
      unusually mild behavior, intense food competition or large mixed-sex groups concern northern Blue Lips
      stock, so they should not be assumed to predict every group of the described species."
    sources:
      - *a16
      - *a17
      - *a51
      - *a34
      - *a26
      - *a54
      - *a52
      - *a4
  diet:
    text: "The best-supported classification is omnivore. Natural food descriptions include plankton, insect
      larvae and other small invertebrates, together with material taken from rock biocover. Offer a varied
      suitable cichlid staple with both plant ingredients and modest animal-food components. Some care pages
      favor strongly plant-based feeding and warn about protein-related bloat. Special sensitivity is not
      established for this species, so the false sensitivity flag remains provisional and does not imply
      immunity. Avoid chronic overfeeding and check that all fish obtain food."
    sources:
      - *a56
      - *a2
      - *a16
      - *a34
      - *a3
      - *a4
      - *a26
      - *a48
  breeding:
    text: "Females incubate the eggs and developing young in their mouths. Males court within defended rocky areas
      and do not provide the same incubation care. Egg placement on a surface followed by mouth pickup is
      compatible with maternal mouthbrooding. Quiet shelter helps a holding female avoid repeated attention.
      Published hobby accounts provide incubation and brood-size estimates, but locality and stock identity
      are not always clear enough to treat them as fixed species limits."
    sources:
      - *a56
      - *a16
      - *a34
      - *a4
      - *a26
      - *a54
  sexing:
    text: "Dominant males of the described locality complex are often largely blue with contrasting dark fin
      markings; orange fin colour and pale lip markings are reported in care accounts. Females are generally
      less conspicuous and show two rows of dark flank spots. Northern fish sold as Blue Lips are commonly
      yellow or orange with blue lips, and they may represent the separately listed undescribed northern
      taxon. Colour, fin development and body size should be considered together; juveniles and subordinate
      males can obscure the adult contrast."
    sources:
      - *a51
      - *a34
      - *a2
      - *a54
      - *a26
      - *a48
  compatibility:
    text: "Use adult size, territorial behavior, feeding access and colour resemblance together when selecting
      companions. Substantial, differently patterned Malawi mbuna may work in a spacious tank with separate
      refuges. Small or timid fish can lose access to food or shelter, and similar-looking males may attract
      repeated challenges. The current predation level is 0, which still permits incidental loss of fry. No
      supported named hybrid group was located; the empty list does not establish that mixed-species breeding
      is impossible. Watch the actual group and separate individuals that cannot feed or leave shelter
      safely."
    sources:
      - *a51
      - *a34
      - *a16
      - *a64
      - *a54
      - *a26
      - *a3
      - *a4
  problems:
    text: "Repeated chasing, inadequate refuge space, poor feeding access and unstable water are the main
      management concerns described by the sources. A fish remaining hidden or missing meals needs prompt
      attention to the social arrangement. Surface feeding also creates an escape risk in an uncovered tank.
      Diet and bloat advice are inconsistent, with several warnings based on mbuna generally rather than
      verified illness in this species. Keep the diet varied and water quality stable without treating the
      provisional sensitivity flag as a health guarantee."
    sources:

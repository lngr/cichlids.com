    rationale: "Tally method qualified-majority. Five of six votes support aufwuchs with bloatSensitive false, at medium\
      \ confidence. All six agree on the feeding type; checker-a alone infers bloat sensitivity from grazing and\
      \ gut anatomy. FishBase, CRC, the feeding study and field observations support attached algal food. AquaInfo's\
      \ carnivorous label and animal-heavy advice, and Fishipedia's broad omnivore label, conflict with that ecological\
      \ evidence and remain cited. False records the lack of demonstrated species-specific protein-induced bloat,\
      \ rather than tolerance of unlimited rich food. Plant-rich staples with modest aquatic-invertebrate supplements\
      \ follow the stronger evidence."
  - field: features.aggressionConspecific

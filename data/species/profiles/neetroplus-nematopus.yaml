  temperatureC:
    value:
      min: 24
      max: 31
    confidence: low
    rationale: "The settled median is 24 to 31 C, with low confidence because the proposals do not form a qualified\
      \ majority. It covers the 24 C Costa Rican pool, Swain's great-lake surface readings of 24.7 to 28 C, FAO's\
      \ Managua range of 26 to 30 C, and JICA's 30.1 C point. The wider FishBase and NCS range is 21 to 34 C. Regional\
      \ Sarapiqui means of 19.8 to 23.7 C include higher sites without demonstrated species occurrence, while the\
      \ occupied lowland measurements reported by tiebreaker-1 span 22 to 26.1 C. Tipitapa reaches 32.4 C but is\
      \ not a species-specific collection series. These wider observations remain evidence; the tally describes\
      \ a provisional typical envelope rather than every occupied temperature or a physiological limit. Proposals:\
      \ generator 26 to 31; checker-a 21 to 31; checker-b 24 to 33; checker-c 24 to 30; tiebreaker-1 22 to 30; tiebreaker-2\
      \ 26 to 30."

  sizeAndGrowth:
    text: "Plan for a male around 13 cm and a female around 10 cm at the typical upper end of aquarium growth. Larger\
      \ published figures include exceptional specimens and measurements of standard length, which excludes the\
      \ caudal fin. Males generally become larger and develop more extended fins. A group of young fish can change\
      \ abruptly as a pair forms, so available space and spare accommodation matter before maturity. A lifespan\
      \ of roughly six to eight years is a low-confidence planning estimate based on a single published eight-year\
      \ figure rather than a measured survival distribution."

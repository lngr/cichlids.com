    rationale: "Large and breedingOnly false follow generator, checker-b and checker-c rather than checker-a's small\
      \ breeding-only proposal. NCS describes territorial aggression outside spawning; the Buen Suceso account observes\
      \ log defence without visible fry, and aquarium pairs can exclude rivals across much of a small tank. A cave\
      \ is the nesting focus but is not the entire defended area. The exact defended footprint is inferred, and\
      \ breeding strongly increases defence."

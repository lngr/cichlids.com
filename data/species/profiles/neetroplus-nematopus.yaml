    - by: checker-b
      value: 4
    - by: checker-c
      value: 4
    decision: 4
    rationale: "Level 4 follows the three agreeing proposals over checker-a's level 3. Nguyen records a pair killing\
      \ the other three adults after pair formation; Barberis also describes danger to the female after a failed\
      \ spawn. Those observations meet the rubric's lethal-aggression threshold rather than only persistent chasing.\
      \ The minimum assumes one established pair with cover and separation options, not a small group of rival adults."

    tolerance:
      value:
        min: 7
        max: 9.3
      confidence: low
      rationale: "The settled median is 7 to 9.3 with low confidence, including the decided natural range. Most\
        \ aquarium advice gives 7 to 8, AquaInfo gives 7 to 7.5 and Nguyen reports successful breeding at 8.2. The\
        \ wider proposal of 6 to 9.3 derives from occupied Sarapiqui readings of 6.1 to 7.15, while another gives\
        \ 6.5 to 9.3; neither is discarded as evidence. The upper boundary rests on repeated native Managua measurements,\
        \ not a multiyear aquarium exposure study. Equality with the natural range results from independently stated\
        \ husbandry advice at the lower end and habitat containment at the upper end; it does not establish injury\
        \ immediately outside either bound. The interval is a provisional population-wide envelope rather than a\
        \ routine pH target. Proposals: generator 7 to 9; checker-a 7 to 8.5; checker-b 6.5 to 9.3; checker-c 7\
        \ to 9.3; tiebreaker-1 6 to 9.3; tiebreaker-2 7 to 9.3."

      \ median of nine exceeds that source without independent longevity evidence, so the decision is 6 to 8 years\
      \ with low confidence. Six is an inferred planning lower bound, not a measured mortality threshold; the retained\
      \ 6-to-10 proposals are general cichlid extrapolations."

    tolerance:
      value:
        min: 21
        max: 31
      confidence: low
      rationale: "The qualified-majority tally is 21 to 31 C with low confidence. Care recommendations include Akvarij's\
        \ 21 to 28 C, Zoopet's 21 to 29 C, Fishipedia's 21 to 30 C, AquaInfo's 24 to 26 C and Fishkeeper's 24 to\
        \ 28 C. FishBase and NCS give a wider 21 to 34 C range, and the proposals span upper bounds from 30 to 33\
        \ C. The decided upper bound retains the natural 31 C ceiling without treating 34 C as demonstrated healthy\
        \ multiyear maintenance. Boundaries are provisional; routine maintenance around 25 to 28 C has stronger\
        \ husbandry support."

  ph:
    value:
      min: 7
      max: 9.3
    confidence: low
    rationale: "The settled median is pH 7 to 9.3 with low confidence. FAO reports 7 in Nicaragua and 8.7 in Managua;\
      \ Swain reports surface ranges of 8.2 to 8.9 and 8.9 to 9.3 respectively, with small daily changes. ILEC independently\
      \ reports Managua seasonal surface means of 9.18 to 9.26. This repeated alkaline evidence from a major native\
      \ lake supports keeping the upper boundary despite generator and checker-a excluding it as an altered or bloom-related\
      \ extreme. FishBase and most care sheets give only 7 to 8. The Sarapiqui study behind tiebreaker-1 reports\
      \ a wider lower range of 6.1 to 7.15 at occupied stations, so 7 is a tally-selected typical bound rather than\
      \ proof that acidic habitat is absent. The full source envelope is therefore broader than the decision. Deep\
      \ reducing-water readings are not aquarium targets. Proposals: generator 7 to 8.7; checker-a 7 to 8.5; checker-b\
      \ 7 to 9.3; checker-c 7 to 9.3; tiebreaker-1 6.1 to 9.3; tiebreaker-2 7 to 9.3."

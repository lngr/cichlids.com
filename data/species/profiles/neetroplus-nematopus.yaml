  ghDgh:
    value:
      min: 3
      max: 7
    confidence: low
    rationale: "The qualified-majority decision is 3 to 7 dGH, retaining the tally's low confidence. FAO's measured\
      \ calcium and magnesium sums of 1.24 and 2.29 meq/L convert to 3.48 and 6.42 dGH using 2.804 dGH per meq/L;\
      \ JICA independently gives 3.73 dGH for Nicaragua. Direct measurements outweigh FishBase's wider 9 to 20 dH\
      \ summary as a description of these lakes. The Costa Rican pool's 17 mg/L implies 0.95 dGH only if its ambiguous\
      \ unit means CaCO3 equivalents, and Tipitapa station means span 5.6 to 7.6 dGH without demonstrating species\
      \ capture at each station. Barlow's Nicaragua-to-Xiloa range is wider at 3.6 to 24.7 dGH; the unusually mineralized\
      \ crater lake is described separately. Thus the tally range is a provisional great-lake baseline with incomplete\
      \ river coverage, not the full geographic envelope."

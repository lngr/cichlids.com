  diet:
    text: "Make algal biofilm, vegetable-rich pellets and spirulina-based foods the foundation of feeding. Observations\
      \ in nature identify scraping of attached growth on rocks and wood. Small aquatic invertebrate foods can supplement\
      \ the plant-rich staple. Animal-heavy feeding advice in AquaInfo conflicts with the more specific ecological\
      \ accounts. A species-specific predisposition to protein-associated bloat is unconfirmed, which does not justify\
      \ unrestricted rich feeding. The predation score is zero under the rubric, allowing incidental fry consumption.\
      \ A dissenting hobby account reports feeding on dovii fry, so small offspring should not be treated as protected\
      \ by the adult's grazing diet."

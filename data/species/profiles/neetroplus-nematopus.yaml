  husbandry:
    text: "For one established adult pair, provide at least the proposed 200 litres with a footprint of 100 by 45\
      \ cm. This recommendation combines published husbandry advice with room for retreat; additional cichlid territories\
      \ require a larger aquarium. Arrange stable rockwork and wood so that fish can shelter out of one another's\
      \ view. Include several cavities and sandy areas, with heavy structures supported securely. Maintain effective\
      \ filtration, surface agitation and clean, oxygenated water. Routine temperatures around 25 to 28 C have better\
      \ aquarium support than the extremes of the tolerance. Keep water chemistry stable and distinguish alkalinity\
      \ from calcium-magnesium hardness when interpreting test results."

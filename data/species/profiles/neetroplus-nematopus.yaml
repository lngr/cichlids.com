  socialBehavior:
    text: "An established male-female pair is the recommended adult unit. Extra adults can face persistent attacks,\
      \ and an aquarium account records a breeding pair killing all three remaining conspecifics. A failed spawning\
      \ attempt can also expose a female to her partner's aggression. Provide a practical way to separate fish before\
      \ introducing them, and watch whether each partner can feed and use shelter. The defended area extends beyond\
      \ the nest entrance and territorial behaviour also occurs outside reproduction. Brood defence intensifies\
      \ attacks on intruders, so apparent compatibility before spawning does not establish lasting compatibility."
    sources:

  problems:
    text: "Social injury is a central risk, particularly at pair formation and after failed breeding. Regularly\
      \ check that both partners emerge, eat and retain intact fins. Chased fish need effective refuge or separation;\
      \ adding another rival can create further victims. Nitrite exposure, inadequate oxygen and accumulated food\
      \ waste compound social stress. Use a mature biological filter and adjust feeding and maintenance to observed\
      \ water quality. Abdominal swelling, loss of appetite or rapid breathing has several possible causes, so evaluate\
      \ water conditions and aggression rather than assuming a particular dietary syndrome. Persistent or worsening\
      \ illness warrants help from a qualified fish-health professional."
    sources:

  sexing:
    text: "Compare adults of similar age when using body size and fin shape to distinguish sexes. Males tend to\
      \ be larger, with longer dorsal and anal extensions; females have a more compact appearance. Normal coloration\
      \ is similar in both sexes. Reproductive darkening and the pale flank bar indicate breeding condition rather\
      \ than sex by themselves. The male's colour response can be less pronounced than the female's. Size differences\
      \ alone do not prove that two fish form a compatible pair, and repeated confinement or exclusion from food\
      \ indicates social pressure rather than courtship success."
    sources:
    - *id045
    - *id025
    - *id063
  compatibility:
    text: "Robust companions are possible in an aquarium substantially larger than the pair minimum. A legacy report\
      \ describes success with Jack Dempseys, but one account does not guarantee a repeatable combination. Give\
      \ each territorial fish separate cover and remove companions if attacks become sustained. Delicate community\
      \ fish are poor candidates, and large predators such as Parachromis dovii can consume this species despite\
      \ its defensive behaviour. NCS specifically warns about difficult combinations with Hypsophrys nicaraguensis.\
      \ Shared natural habitat is not proof of compatibility in a restricted aquarium. The empty hybrid-group list\
      \ means no supported crossing group is identified, rather than proven isolation from every other cichlid."
    sources:

partners:
  suitable:
  - species: Rocio octofasciata
    reason: A legacy keeping report describes success with Jack Dempseys; robust adults can withstand territorial
      displays.
    condition: "Conditional combination in a substantially larger tank than the pair minimum, with separate territories\
      \ and immediate separation available."
  unsuitable:
  - species: Hypsophrys nicaraguensis
    reason: NCS specifically warns that this combination is often extremely difficult despite natural coexistence.
  - species: Paracheirodon innesi
    reason: Its small size and peaceful behaviour expose it to territorial harassment and physical injury; a zero
      predation level does not imply safety from aggression.
  - species: Parachromis dovii
    reason: This native predator eats small cichlids including Neetroplus; defensive aggression does not prevent
      predation.
profile:
  overview:
    text: "A pair of this Central American rock grazer can dominate an aquarium despite its modest size. The familiar\
      \ grey or brown body and dark flank bar change markedly during reproduction, when the body darkens and the\
      \ bar becomes pale. Both sexes participate in brood defence. The trade name poor man's tropheus refers to\
      \ appearance and grazing habits; it does not imply African lake ancestry or mouthbrooding. Its strongest husbandry\
      \ requirement is control of social aggression, especially when young fish mature and form a pair."
    sources:
    - *id001
    - *id004
    - *id063
    - *id045
    - *id025
  habitat:
    text: "Populations occupy lakes Nicaragua and Managua, several Nicaraguan crater lakes and Atlantic-draining\
      \ rivers of Nicaragua and Costa Rica. Rock faces and submerged timber provide attached food, while cavities\
      \ and roots offer shelter. River observations include sandy pools as well as flowing channels. The principal\
      \ lakes differ chemically: Nicaragua has relatively low calcium-magnesium hardness, while sodium-rich Managua\
      \ has much greater alkalinity. The decided ranges describe typical conditions selected from uneven geographic\
      \ evidence. Occupied Sarapiqui stations include reports near 22 C and pH 6.1 below those typical bounds. Xiloa\
      \ is an unusually mineralized crater-lake habitat: Barlow reports about 24.7 dGH and 17.6 dKH there, outside\
      \ the typical GH range. Managua surface pH reaches 9.3 in repeated surveys; this is habitat evidence rather\
      \ than a routine aquarium target."

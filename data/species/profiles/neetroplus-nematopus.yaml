      volumeL: 200
      lengthCm: 100
      depthCm: 45
    rationale: "The component medians are 200 L, 100 cm length and 45 cm depth from generator's 200/100/40, checker-a's\
      \ 110/80/35, checker-b's 250/120/50 and checker-c's 200/100/50. This is a practical minimum for one established\
      \ pair with multiple retreats and a separation option. Akvarij recommends more than 200 L, Zoopet gives 150\
      \ L and 100 cm, and Barberis reports breeding in 250 L. The inferred 45 cm depth lies between the layout proposals;\
      \ no source measures a biological depth threshold. NCS's 400 L and 140 cm and Fishipedia's 300 L group advice\
      \ remain wider recommendations. Nguyen's smaller breeding aquarium also records fatalities among surplus adults,\
      \ so it does not establish an appropriate group minimum. Communities need more room than this pair minimum."

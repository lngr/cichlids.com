  breeding:
    text: "Spawning takes place in a cave or similarly sheltered cavity. Both parents defend the brood, with the\
      \ female often showing the more intense reproductive contrast and staying close to the refuge. Offer several\
      \ nest sites and space for retreat rather than relying on one confined cavity. Eggs develop within the sheltered\
      \ site before the young emerge and begin feeding. Small prepared foods and newly hatched Artemia suit free-swimming\
      \ fry. Reports differ on brood size and duration of care, so those observations do not establish a fixed schedule\
      \ for every pair. Growing offspring also require space apart from the territorial adults."

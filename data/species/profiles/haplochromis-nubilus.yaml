  compatibility:
    text: "A carefully chosen community with robust fish of comparable size can work, although the minimum tank\
      \ allocation covers only the nubilus harem. Jochman's bristlenose-catfish association is one positive account.\
      \ Fishkeeper also suggests selected Malawi mbuna, but their individual diet, temperament and space needs still\
      \ matter. Small, timid or slow-moving fish are poor companions because territorial chasing can prevent them\
      \ from feeding or resting. Predation level 0 means fish are not established routine prey; it does not protect\
      \ fry from accidental capture or small adults from injury. Three presumed crossing groups link nubilus with\
      \ Astatotilapia burtoni, Haplochromis elegans and Haplochromis phytophagus. The first two rest on experimental\
      \ crosses with unresolved mate choice; the third rests on close genetics. None establishes a general crossing\
      \ group for every Victorian cichlid."

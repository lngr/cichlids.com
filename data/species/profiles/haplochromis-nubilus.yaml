  socialBehavior:
    text: "A dominant male defends an area and chases other fish that approach. Defence can precede the construction\
      \ of a spawning pit, so it is not limited to the moment of breeding. Use one male with four females as the\
      \ ordinary adult arrangement. More females can spread courtship pressure, but each still needs access to cover.\
      \ Reports of a working one-male, five-female group sit beside accounts of fatal rivalry and severe female\
      \ injury under unsuitable ratios. Treat repeated pursuit, exclusion from food or a fish trapped at the surface\
      \ as reasons to reassess the arrangement. Extra adult males require substantially more space and cannot simply\
      \ be added to the stated minimum. A divider is not always enough to contain a determined fish."
    sources:
    - kind: website
      title: "Fishkeeper: Hap Nubilus"
      url: "https://www.fishkeeper.co.uk/fish/freshwater/cichlids/hap-nubilus"
      accessed: '2026-10-15'

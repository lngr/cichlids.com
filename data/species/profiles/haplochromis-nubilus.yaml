  sizeAndGrowth:
    text: "Use about 12 cm for an adult male and 9 cm for a female when planning space. Jochman reports captive\
      \ males approaching 12.7 cm and females near 8.9 cm, while FishBase gives a 9.3 cm standard-length record\
      \ that excludes the tail. Retailer estimates extend to 14 cm for males, but they are not the selected typical\
      \ maximum. Juveniles can reproduce while still small, so early breeding does not mean they have reached adult\
      \ size. Body colour also depends on dominance: a subordinate male may stay subdued beside a strongly coloured\
      \ rival. The provisional lifespan estimate is five to eight years, with eight years listed by Fishipedia and\
      \ the lower endpoint inferred rather than measured."

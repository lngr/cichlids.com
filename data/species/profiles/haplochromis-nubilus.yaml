  - field: features.hybridGroups
    proposals:
    - by: generator
      value:
      - haplochromis-nubilus-phytophagus
    - by: checker-a
      value:
      - astatotilapia-burtoni-haplochromis-nubilus
      - haplochromis-nubilus-phytophagus
    - by: checker-b
      value:

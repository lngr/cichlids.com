  problems:
    text: "Aggression is the most consequential management problem. An isolated target may deteriorate through persistent\
      \ chasing even before obvious wounds appear, so observe access to food and resting places as well as fins\
      \ and scales. Fatal conspecific attacks are reported, particularly with rival males or too few females. Stable\
      \ cover and a managed harem reduce the risk but do not guarantee a safe group. Dividers can fail if a fish\
      \ jumps over or digs underneath them; secure separate accommodation may be necessary. The species accepts\
      \ ordinary prepared and frozen foods, and no distinctive disease syndrome was established in the reviewed\
      \ evidence. Keep water quality and oxygenation consistent and avoid using the broad numerical tolerances as\
      \ reasons for abrupt chemistry changes. The two forum-archive name searches yielded no additional species-specific\
      \ experience."

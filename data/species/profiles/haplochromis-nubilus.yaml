  husbandry:
    text: "The planning minimum for one male and four females is 190 L with at least 120 cm length and 45 cm depth.\
      \ Provide sand, stable rock groups and hardy planting so that a pursued fish can leave the male's sight. Keep\
      \ clear routes between refuges and secure the lid. Efficient biological filtration, oxygenation and regular\
      \ partial water changes support the group. Fishkeeper's 24 to 26 C and pH 7.5 to 8.5 advice offers a better-supported\
      \ central keeping target than continuously using the limits of the broader planning envelope. The GH tolerance\
      \ of 1 to 25 dGH and KH estimate of 2 to 16 dKH combine habitat and husbandry evidence; neither is a tested\
      \ failure boundary. Match changes to the fish's existing water gradually, and keep spare accommodation available."

  sexing:
    text: "Look for the combination of size, adult fin development and social colour rather than a single juvenile\
      \ marking. A dominant mature male can become very dark with red on the caudal and anal fins and conspicuous\
      \ egg spots. Bars and an intermittent horizontal marking may show when the body is less dark. Females usually\
      \ retain subdued grey, olive or brown tones and are smaller. A subordinate male can also remain inconspicuous,\
      \ so a pale fish is not automatically female. Fishipedia's generic red-and-blue description and the orange-body\
      \ description on my-fish disagree with the specialist and breeder accounts; those descriptions are retained\
      \ as consulted evidence but are not used to characterize the typical displaying male."

  habitat:
    text: "Vegetated shorelines, wetland margins and nearby rivers are central to its distribution. Records include\
      \ Lake Victoria, Kyoga, Nabugabo and the papyrus-associated Lake Kanyaboli; older literature also names the\
      \ Edward-George system. The regional natural-water envelope is 22 to 30 C, pH 6.8 to 9.4, GH 1 to 3 dGH and\
      \ KH 2 to 6 dKH. These values combine lake and gulf measurements, rather than describe a single collecting\
      \ site. Lake Victoria is dilute and soft despite its frequently alkaline pH. Mbonde and colleagues measured\
      \ 24.9 to 32.3 C across Tanzanian bay samples, including unusually warm sheltered sites. That wider temperature\
      \ range remains environmental context and does not establish a suitable permanent aquarium setting."
    sources:

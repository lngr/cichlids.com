    - by: tiebreaker-1
      value:
      - astatotilapia-burtoni-haplochromis-nubilus
      - haplochromis-elegans-nubilus
      - haplochromis-nubilus-phytophagus
    - by: tiebreaker-2
      value:
      - astatotilapia-burtoni-haplochromis-nubilus
      - haplochromis-elegans-nubilus
      - haplochromis-nubilus-phytophagus
    decision:
    - astatotilapia-burtoni-haplochromis-nubilus
    - haplochromis-elegans-nubilus
    - haplochromis-nubilus-phytophagus
    rationale: "Retain the conservative union at low confidence. Generator, checker-b and checker-c proposed only\
      \ haplochromis-nubilus-phytophagus; checker-a also proposed astatotilapia-burtoni-haplochromis-nubilus; tiebreaker-1\
      \ and tiebreaker-2 proposed both of those plus haplochromis-elegans-nubilus. No identical list reaches four\
      \ votes. The respective groups have six, three and two supporting proposals, so all three meet the union rule.\
      \ Abila and Odhiambo support only close genetic relationship for phytophagus, without verified offspring.\
      \ Crapon de Caprona and Fritzsch's abstract reports fertile experimental offspring for burtoni females with\
      \ nubilus males, but lethal reciprocal offspring, and fertile elegans-male/nubilus-female offspring with biased\
      \ sex ratios. Access to conspecific mates is not established, so both experimental pairs are presumed. Kirschbaum\
      \ and Leveque summarize the same experiments rather than replicate them. Full texts of the original crossing\
      \ and microsatellite papers were not open access; only archived abstracts were used. The historical black\
      \ lividus parent is not securely identified and generates no additional group. General Victorian crossing\
      \ warnings do not establish an all-pairs group. The existing phytophagus group id is retained exactly."

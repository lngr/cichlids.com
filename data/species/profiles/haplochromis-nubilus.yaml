partners:
  suitable:
  - species: Ancistrus sp.
    reason: One breeder reports coexistence with bristlenose catfish in a structured aquarium.
    condition: Provide separate bottom refuges and allow extra space; an individual male can still make the association
      unsafe.
  - species: Selected Lake Malawi mbuna
    reason: Fishkeeper suggests robust mbuna as possible companions.
    condition: "Choose comparable size and compatible diet and chemistry, with additional community space and cover;\
      \ the suggestion is not a tested guarantee for every mbuna."
  unsuitable:
  - species: Astatotilapia burtoni
    reason: Presumed crossing risk from experimental fertile offspring in one direction; free partner choice is
      unverified.
  - species: Haplochromis elegans
    reason: Presumed crossing risk from fertile experimental offspring; access to conspecific mates was not established.
  - species: Haplochromis phytophagus
    reason: Presumed crossing risk from very close genetic relationship; hybrid offspring are not verified.
  - species: Neolamprologus multifasciatus
    reason: Small shell dwellers can be displaced or injured by territorial attacks; this concern does not require
      routine piscivory.
  - species: Symphysodon aequifasciatus
    reason: Its quiet social and feeding behavior is a poor match for persistent territorial chasing.
profile:
  overview:
    text: "A small aquarium can underestimate the space and management this cichlid needs. A male may concentrate\
      \ his attention on an unreceptive female or rival even when food and water conditions are adequate. Plan around\
      \ one male, four females and several routes into cover. Adult males commonly reach about 12 cm and can develop\
      \ a black body with red fin margins; females are smaller and much less conspicuous. The accepted name here\
      \ is Haplochromis nubilus, although Astatotilapia nubila remains common in aquarium references. It inhabits\
      \ the Lake Victoria region, including satellite lakes and rivers. Its diet is dominated by small invertebrates\
      \ and females carry the brood in their mouths. Selected mixed tanks are possible, but aggression and crossing\
      \ risk require experienced judgment."
    sources:
    - kind: catalog-of-fishes
      title: "Eschmeyer's Catalog of Fishes: Haplochromis species, updated 21 September 2026."

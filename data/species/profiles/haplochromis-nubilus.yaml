  diet:
    text: "Build the feeding routine around small animal foods and a suitable prepared staple. Insect larvae and\
      \ small crustaceans dominate the available species-specific field accounts, which is why the planner uses\
      \ invertivore. Broader omnivore descriptions and reports of plant grazing remain compatible with occasional\
      \ vegetable food. Small pellets or flakes can be supplemented with appropriately sized daphnia, brine shrimp\
      \ and insect larvae. Offer portions the group can finish without leaving accumulating waste, while checking\
      \ that subordinate females obtain food. No species-specific evidence establishes unusual bloat sensitivity.\
      \ Aqua-Pedia advises moderating protein, but its general digestive warning does not demonstrate that this\
      \ insect feeder requires a strict algae-based diet."
    sources:

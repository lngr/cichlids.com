  breeding:
    text: "The female incubates the eggs and developing young in her mouth after spawning over a male-selected site,\
      \ often a pit. The male displays and the female collects eggs during successive passes. Brood duration varies\
      \ among accounts: Jochman reports roughly two weeks, Fishkeeper up to three, and Balog about four weeks. Quiet\
      \ cover for the brooding female matters because the male can resume courting soon after spawning. Published\
      \ aquarium experience includes conditioning the sexes separately and bringing them together only when the\
      \ female is receptive, followed by protection of the brooding female. Tiny released fry accept fine prepared\
      \ food and newly hatched brine shrimp. Aquarium reports show that reproduction can be straightforward once\
      \ adult aggression is controlled, but spawning itself does not demonstrate a safe permanent pairing."

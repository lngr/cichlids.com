      \ and checker-c did not. Jochman describes a dominant male defending an area before constructing a spawning\
      \ pit, while Fishkeeper describes general territorial behavior. Retain small with breedingOnly false because\
      \ defense is not confined to the spawning event. No source measures the defended area, so the size is inferred."

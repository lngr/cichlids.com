  aggressionConspecific:
    value: 3
    confidence: medium
    rationale: "Generator and checker-c proposed 4; checker-a and checker-b proposed 3. Apply the rubric to one\
      \ male with four females in adequate space: Jochman reports a working one-male, five-female group with localized\
      \ chasing, while Fishkeeper warns of fatal harassment when only one female is present. Balog reports a dead\
      \ rival and badly injured female in a two-male, one-female setup. Those serious outcomes establish the need\
      \ for careful management but do not demonstrate unavoidable permanent injury in the recommended social unit.\
      \ Level 3 best represents persistent chasing with increased injury risk when cover, space or ratio is wrong;\
      \ level 4 evidence is retained."

    tolerance:
      value:
        min: 22
        max: 30
      confidence: low
      rationale: "The settled unanimous-within-threshold decision is 22 to 30 C, with low confidence. Generator\
        \ and checker-b proposed 22 to 30; checker-a and checker-c proposed 21 to 30. The median lower endpoint\
        \ of 21.5 rounds to 22 under the tally rule. This is narrower than FishBase's 21 to 30 environmental range\
        \ and AquaInfo's 21 to 30 aquarium recommendation; Imperial Tropicals gives approximately 21 to 29. Fishkeeper\
        \ recommends 24 to 26, Aqua-Pedia 22 to 27 and Aquarist Atlas 23 to 27. The selected envelope contains the\
        \ lake range, but no source demonstrates chronic failure at 21 C or just outside these endpoints. Stable\
        \ conditions near 24 to 26 C have stronger husbandry support than permanent use of the extremes."

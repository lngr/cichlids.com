    rationale: "Start with component medians: generator 180 L/120 cm/45 cm, checker-a 200/120/40, checker-b 150/120/40\
      \ and checker-c 240/120/45 give 190 L, 120 cm and 42.5 cm. Retain 190 L and 120 cm; round depth up to 45 cm\
      \ to preserve space around cover for one male and four females. Fishkeeper specifies four feet, about 122\
      \ cm, without volume or depth; Imperial Tropicals gives about 151 L, Aqua-Pedia 150 L, and Jochman reports\
      \ a successful 114 L aquarium. Nordiska Ciklidsallskapet recommends 200 L, while Aquarist Atlas gives 284\
      \ L, Interaquaristik 300 L and Fishipedia and Aquahaus 400 L. These wider recommendations remain visible.\
      \ The selected floor is for one managed harem, with no additional adult male or community allocation; depth\
      \ is a planning estimate, not a measured biological threshold."

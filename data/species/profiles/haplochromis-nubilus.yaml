      \ mg/L, equivalent to about 1.2 to 1.8 dGH. Burgis et al.'s gulf ions yield about 1.6 to 2.4 dGH. Rounding\
      \ the regional envelope gives 1 to 3, rather than equating alkaline pH with hard water. FishBase's incomplete\
      \ dH entry starting at 8 and harder aquarium recommendations are retained but do not replace measured habitat\
      \ GH."

    confidence: "low"
    rationale: "Retain the conservative tally decision [neolamprologus-multifasciatus-similis], with 3
      of 6 votes and confidence low. Generator, checker-a and checker-c propose no group; checker-b,
      tiebreaker-1 and tiebreaker-2 propose this two-member group. With no qualified majority, the
      tally keeps the group named by at least two votes. The 2007 phylogeny supports a close
      nuclear-marker relationship despite conflicting mitochondrial placement. A similis breeder on
      Dart Den and the Tankora care guide warn about this named pair without describing an observed
      hybrid brood or conspecific partner availability. This supports presumed basis under the
      rubric, not documented basis. Ancient-introgression hypotheses and silence in the other
      accounts do not establish a present-day cross or reproductive isolation. The Apistogramma.com
      discussion speculates about other ancestry without verifying a similis cross, so it adds no
      further groups. The cichlids.com archive excerpts contain keeping and colony reports, not a
      verified crossing report."

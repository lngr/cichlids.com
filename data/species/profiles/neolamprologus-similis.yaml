  sexing:
    text: "Size is the most useful adult clue: males are usually larger than females. Some mature males
      develop a slight forehead prominence, but this is not a dependable feature in every
      individual. Juveniles are difficult to sex, and behaviour around shells becomes more
      informative once breeding begins. Colour alone does not reliably separate the sexes."

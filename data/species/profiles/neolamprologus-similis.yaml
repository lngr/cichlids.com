  breeding:
    value: "shell-spawner"
    confidence: "high"
    rationale: "All runs agree on shell spawning. FishBase locates spawning inside the female's shell,
      Seriously Fish describes female egg care, and CRC classifies it as a cave-type substrate
      breeder in shell beds. Some field populations use stone crevices, but shell spawning is the
      useful aquarium category. Male participation in perimeter defence varies between accounts, so
      direct egg care is attributed to the female without asserting that males never defend the
      surroundings."

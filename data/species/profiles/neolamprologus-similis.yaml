  habitat:
    text: "Records place similis along central and southern parts of Lake Tanganyika, particularly the
      Congolese and Tanzanian shores. The type locality lies south of Zongwe. Shell beds are the
      usual setting, with some fish occupying deeper rocky rubble or stone crevices; FishBase
      reports shell-bed occurrences around 10 m and rocky sites below 25 m, reaching about 45 m. The
      2021 review also mentions Mbete Bay and Cape Kapembwa in a footnote on crevice use. Regional
      lake measurements give the natural ranges used here: 23 to 29 C, pH 8.4 to 9.4, GH 10 to 13
      dGH and alkalinity equivalent to 15 to 20 dKH. These describe the regional habitat rather than
      four independently tested aquarium health limits."

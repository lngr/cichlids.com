  breeding:
    text: "Eggs are deposited in the female's shell, where she protects the clutch and early fry. The
      male may mate with more than one female; accounts differ over his subsequent defence of the
      surrounding area, while direct care inside the shell is principally maternal. Free-swimming
      young take very small foods such as newly hatched Artemia. As they grow, some move into nearby
      vacant shells. A colony can contain multiple age classes, but other colony members or
      tankmates may eat fry, and the available space will eventually limit further growth."

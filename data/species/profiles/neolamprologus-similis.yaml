    rationale: "All four full-profile runs propose 10 to 13 dGH. Retain the tally waterbody decision
      with high confidence. Plisnier's second annual-cycle report gives surface calcium of 10.9 to
      11.6 mg/L and magnesium of 41.2 to 43.2 mg/L across stations, corresponding to about 11.1 to
      11.5 dGH; older compiled measurements give about 11.3 dGH. The wider rounded regional range
      includes the north-basin measurements retained from the inherited Cohen citations. FishBase's
      broader 7 to 30 dH and Seriously Fish's 8 to 25 dGH belong to species-summary or aquarium
      contexts and do not describe the lake chemistry."

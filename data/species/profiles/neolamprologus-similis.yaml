  diet:
    text: "Provide small animal foods that a tiny mouth can take easily. Natural stomach records include
      copepods, ostracods and insect larvae, with algal strands and sand also present. Small live or
      frozen prey can form the main ration, supplemented with suitably sized prepared foods. Spread
      food so subordinate fish can feed near cover. The profile classifies similis as an invertivore
      despite broader omnivore labels in some accounts. There is no supported special
      bloat-sensitivity restriction, but overfeeding and poor water quality can still cause
      problems."

  khDkh:
    value:
      min: 15
      max: 20
    confidence: "high"
    rationale: "All four full-profile runs propose 15 to 20 dKH. Retain the tally natural range and high
      confidence, without a verification object for this plain fact. The annual-cycle reports
      distinguish bicarbonate and carbonate alkalinity, which is converted using dKH = meq/L times
      2.8; the older lake compilation gives 6.71 meq/L, about 18.8 dKH. KH can exceed GH because
      sodium and potassium also balance bicarbonate. This is regional alkalinity context rather than
      a measured physiological limit of similis."

  compatibility:
    text: "A larger aquarium can accommodate selected small Tanganyika cichlids whose territories are
      separated from the shell bed. Small Julidochromis can use distinct rockwork, while
      Cyprichromis need their own much larger swimming space and social group. The 60-litre colony
      minimum does not cover these combinations. Avoid large predators and competing shell dwellers.
      N. multifasciatus is particularly unsuitable because it overlaps in habitat and belongs to the
      same presumed hybrid-risk group. That caution rests on relationship and hobby warnings, not a
      demonstrated brood from this pair. A dedicated similis aquarium remains useful when fry
      survival is the priority."

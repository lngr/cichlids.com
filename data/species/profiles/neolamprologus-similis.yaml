partners:
  suitable:
    - species: "Julidochromis transcriptus"
      reason: "A small rock dweller can use separate crevices away from the shell bed."
      condition: "A larger aquarium meeting both species' requirements, with distinct rock and shell
        territories."
    - species: "Cyprichromis leptosoma"
      reason: "Its open-water habitat can reduce direct overlap with occupied shells."
      condition: "A substantially larger aquarium meeting the swimming-space and social-group requirements
        of Cyprichromis."
  unsuitable:
    - species: "Neolamprologus multifasciatus"
      reason: "Competes for the same shell habitat and shares the presumed hybrid-risk group; a cross is
        plausible but not verified in the reviewed evidence."
    - species: "Lamprologus ocellatus"
      reason: "Competing shell territories can provoke persistent conflict over the same floor area."
    - species: "Cyphotilapia frontosa"
      reason: "Its much larger size and predatory feeding put adult similis as well as fry at risk."
    - species: "Altolamprologus calvus"
      reason: "Can take small fish and fry around the shell bed, making it a poor companion when colony
        survival and breeding are priorities."
profile:
  overview:
    text: "Neolamprologus similis is a small colonial cichlid from Lake Tanganyika. A sandy area with
      many empty snail shells provides both shelter and breeding space. Each fish protects a small
      patch within the colony, so a group needs usable floor area despite its modest body size.
      Bands continuing onto the head help distinguish it from the closely related N. multifasciatus.
      The two species share a presumed hybrid-risk group, although the reviewed evidence does not
      demonstrate an actual cross between them."

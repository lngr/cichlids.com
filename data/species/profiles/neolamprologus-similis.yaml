  husbandry:
    text: "Plan at least 60 litres with a 60 by 30 cm base for the recommended small colony. Cover the
      main floor with fine sand and provide several accessible empty snail shells per fish, spaced
      to allow separate retreats. Secure any stones against digging and keep filter intakes safe for
      fry. A pair-only recommendation of about 40 litres does not describe the colony unit used
      here. Keep conditions stable; around 25 to 26 C lies within the published aquarium advice. The
      broader working tolerances are 23 to 29 C, pH 7.5 to 9.4, GH 8 to 25 dGH and KH 10 to 25 dKH.
      The temperature endpoints and the derived KH bounds remain uncertain, so they should not be
      treated as targets or experimentally proven limits. Allow more room as the colony grows."

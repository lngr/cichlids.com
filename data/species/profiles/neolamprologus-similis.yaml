  sizeAndGrowth:
    text: "Adult males typically reach about 5 cm total length and females about 3.5 cm, with specialist
      accounts allowing some females around 4 cm. A standard-length figure excludes the tail and
      should not be compared directly with these total lengths. Successive broods can make the
      aquarium increasingly crowded even when individual fish remain small. Longevity is poorly
      documented: five to seven years is a provisional estimate, and the only explicit species
      figure located is Fishipedia's seven years."

  socialBehavior:
    text: "A colony of at least six fish is the practical starting unit used in this profile. Prefer
      more females than males when reliable sexing is possible. Individual shells still define
      defended positions, and males may associate with several females inside the wider colony.
      Local chasing and hierarchy are normal; repeated exclusion from food or shelter indicates that
      the current arrangement is failing. Colony reports in the legacy archive support group keeping
      but do not establish a precise adult minimum. Six is a husbandry recommendation, partly
      derived from advice to start with juveniles, rather than a fixed biological threshold."

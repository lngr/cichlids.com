  problems:
    text: "The most frequent practical difficulties arise when dominant fish monopolize shells or when
      successive broods outgrow the available floor area. Watch for fish that remain hidden, miss
      food or cannot reach a refuge. Shell entrances must be accessible and sufficiently open;
      narrow spirals can trap fish. Match replacement water carefully and avoid abrupt changes in
      temperature or mineral content. Species-specific evidence for feeding speed, lifespan and KH
      tolerance is limited, so these estimates deserve less certainty than the observed shell use
      and diet."

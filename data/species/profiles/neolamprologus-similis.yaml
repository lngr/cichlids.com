  social:
    value:
      structure: "group"
      minGroup: 6
    confidence: "medium"
    rationale: "Generator proposes a harem with two females per male, checker-a a harem with three, and
      checker-b and checker-c a group of six. FishBase and Tanganyika.si describe colonies;
      Tanganyika.si recommends starting with six juveniles, and Aquarium Co-Op independently advises
      at least six shell dwellers, with more females than males. Use a six-fish colony as the
      practical adult social unit while recognizing that six is a stocking recommendation derived
      partly from juvenile-group advice, not a measured adult threshold. Harems or pairs may form
      within the colony. The 2007 paper even labels monogamy as uncertain, so neither an invariant
      harem ratio nor obligatory pairing is justified."

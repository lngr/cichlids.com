  temperatureC:
    value:
      min: 23
      max: 29
    confidence: "high"
    rationale: "All four full-profile runs propose 23 to 29 C. Retain the tally waterbody decision with
      high confidence. Verburg et al. recorded 23.85 to 29.01 C at 1 m at Mpulungu; the annual-cycle
      reports describe cooler southern water during seasonal upwelling. The decided interval is a
      rounded regional habitat range, not a fish-specific endpoint experiment. FishBase gives 23 to
      28 C, Seriously Fish 24 to 27 C, and the other care sheets give narrower aquarium
      recommendations. They do not replace the lake measurements."

    tolerance:
      value:
        min: 8
        max: 25
      confidence: "medium"
      rationale: "Retain 8 to 25 dGH, method qualified-majority with 4 of 6 votes and confidence medium.
        Generator, checker-a, checker-b and tiebreaker-1 propose 8 to 25; checker-c and tiebreaker-2
        propose the wider 7 to 30 dGH interval from FishBase. Seriously Fish explicitly gives 8 to
        25 dGH for aquarium keeping, while AquaInfo gives 11 to 16, Fishkeeper 15 to 25 and
        Fishipedia 10 to 15. FishBase cites Baensch and Riehl's aquarium atlas for its environment
        line, so 7 to 30 is relevant dissenting husbandry evidence, not merely a rejected
        natural-water figure; the original atlas was not read. Aquarist Atlas repeats FishBase and
        adds no independent endpoint measurement. The decided interval contains the natural 10 to 13
        dGH and follows the more explicit aquarium recommendation. Neither set of endpoints is
        established by a long-term experiment. The blocked GCCA page remains an offline citation and
        contributes no readable confirmation."

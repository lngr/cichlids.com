  note: "The Catalog of Fishes accepts Neolamprologus similis Büscher 1992 and records its original
    description in that genus. Parentheses around the author are therefore omitted. The type
    locality is about 5 km south of Zongwe on the southwestern shore of Lake Tanganyika."

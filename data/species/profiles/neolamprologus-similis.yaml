        - "Cape Kabogo to Ikola, Tanzania"
        - "Kalugunga, Tanzania"
    confidence: "high"
    rationale: "All runs identify Lake Tanganyika. The generator emphasizes the southern basin and names
      Mbete Bay and Cape Kapembwa, checker-a gives the lake and southern distribution, checker-b
      emphasizes the central lake and uses the lake name as its waterbody identifier, and checker-c
      combines central and southern shores. Retain the canonical lake-tanganyika identifier and the
      combined geographic description: the Catalog fixes Zongwe as the type locality, FishBase
      describes a southern distribution, and Tanganyika.si gives central-shore limits. The 2021
      review mentions Mbete Bay and Cape Kapembwa in a rock-use footnote, but these are retained as
      literature context rather than treated as verified trade populations."

    confidence: "high"
    rationale: "All four full-profile runs propose pH 8.4 to 9.4. Retain the tally waterbody decision
      with high confidence from the annual-cycle lake measurements, including pH 8.47 to 9.40 at 40
      m at Bujumbura/Uvira. FishBase gives the different span 7.4 to 8.4, while the older FAO source
      book compiles 7.3 to 7.8. These summaries remain visible as conflicting evidence; the direct
      modern lake observations set the natural range. The inherited Cohen references are retained,
      but a fresh full-text request was refused as not open access and their reported values were
      not independently rechecked."

        rule and confidence low. Generator, checker-a and checker-b propose 10 to 25; checker-c
        proposes 12 to 25. None of the read care accounts reports a numerical KH tolerance for
        similis. This is an inferred aquarium interval based on alkaline pH guidance, mineral-rich
        keeping practice and containment of the natural 15 to 20 dKH. The pH evidence retained below
        is contextual, not a KH measurement, and the derived bounds are not experimentally
        established health limits."

  note: "The Catalog of Fishes retains Hemichromis elongatus (Guichenot, 1861), originally
    Chromichthys elongatus, with Hemichromis auritus as a synonym. Author names added to the synonym
    strings by checker-a are bibliographic differences rather than additional taxa. H. fasciatus is
    distinct. Older Cameroon and southern African records may involve other five-spotted species and
    are not automatically interchangeable with the Lower Guinea core. The 2021 revision was
    available only as an abstract; its subscription full text was not used. The Lake Tumba full text
    remained unavailable through the permitted tool, so its accessible abstract supplies no
    numerical limits."

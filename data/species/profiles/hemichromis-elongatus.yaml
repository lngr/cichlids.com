  temperatureC:
    value:
      min: 23
      max: 30
    confidence: "low"
    rationale: "The tally median is 23 to 30 C, with low confidence and no qualified majority. Generator
      proposed 23.9 to 28.1, checker-a 24 to 31, checker-b 23 to 29, checker-c 25 to 29,
      tiebreaker-1 21 to 31 and tiebreaker-2 23 to 31 C. Ogooue basin measurements are 23.9 to 28.1
      C, Nyanga measurements 25.4 to 28.6 C and Musolo occupied-station means 24 to 30.1 C. The
      median is a typical planning interval, narrower than the combined field accounts; the 21 to 26
      C secondary Ruki account and the 30.1 C Musolo mean remain in evidence. Neither was a chronic
      aquarium trial. FishBase 23 to 25 C comes from aquarium literature and does not establish a
      natural minimum. Older Cameroon identifications and the Okavango monitoring envelope of 15.7
      to 37.7 C do not define this species range; the latter is basin-wide, taxonomically uncertain
      and has an inconsistent reported maximum. The numerical median is plausible for ordinary
      tropical river habitats and is retained exactly."

profile:
  overview:
    text: "A bonded pair of Hemichromis elongatus can provide an engaging view of coordinated cichlid
      breeding, but keeping one safely requires preparation for serious aggression. Its body is
      usually olive, yellowish or bronze, with conspicuous dark flank marks and smaller red details.
      Large males may become almost black. It belongs to the five-spotted Hemichromis lineage and
      retains that genus in the current catalog. Plan for a dedicated aquarium and immediate
      separation options before obtaining adults."
    sources:
      - *a1
      - *a4
      - *a28
      - *a29
      - *a27
  habitat:
    text: "The best-supported range covers Lower Guinea coastal rivers and the middle Congo basin,
      including the Ntem, Woleu, Ogooue, Nyanga, Kouilou and Dja systems. Occupied settings include
      channels, smaller streams, pools and vegetated margins. Native-basin chemistry studies often
      describe very soft water, but most were not paired with identified fish captures. A Gabon
      collecting site explicitly listing this species reports 25.4 C, pH 7.5, GH 4 and KH 3, outside
      the decided typical hardness ranges. A secondary Ruki account gives 21 to 26 C and pH 4.2 to
      4.6 with the species present, but its original field report was unavailable. Lake Cayo station
      means of pH 8.29 to 10.54 concern a degraded ecosystem; species occurrence in the accessible
      account was interpreted differently by the tie-breakers. Those atypical lake readings are
      excluded from the natural and tolerance ranges. Far western and southern records also need
      identification checks."
    sources:

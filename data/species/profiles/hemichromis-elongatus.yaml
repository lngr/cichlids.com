  ph:
    value:
      min: 4.8
      max: 7.6
    confidence: "low"
    rationale: "The tally median is pH 4.8 to 7.6, with low confidence. Generator proposed 4.6 to 7.7,
      checker-a 6 to 7.3, checker-b 6.3 to 7.7, checker-c 4.9 to 5.8, tiebreaker-1 4.2 to 7.5 and
      tiebreaker-2 4.6 to 7.7. Acidic and near-neutral river conditions both occur in the evidence,
      so this interval does not fall in a chemically implausible gap between habitats. It is
      narrower than the complete Ogooue basin envelope of 4.63 to 7.62 and the combined secondary
      Ruki and Gabon collecting records of 4.2 to 7.5. The Ogooue endpoints are basin proxies
      without paired species captures, whereas Musolo occupied-station means are 5.75 to 6.75 and
      the Gabon collecting record is 7.5. Nyanga chemistry gives 4.99 to 5.76 but has internal
      conductivity-versus-ion concerns. FishBase supplies only an upper endpoint of 7; its lower
      endpoint is unknown. Lake Cayo station means of 8.29 to 10.54 describe a degraded lake, with
      target occurrence disputed between the two tie-breakers; they are excluded from typical
      keeping chemistry and discussed in the habitat text. No tally replacement is needed."

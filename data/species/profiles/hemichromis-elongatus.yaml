        recommendation is 6.5 to 7.5; the acidic extension is required by the habitat decision
        rather than verified by multi-year captive outcomes. The median is narrower at the acidic
        end than Ogooue basin measurements of 4.63 to 7.62 and the secondary Ruki account of 4.2 to
        4.6. It is also below the upper recommendations of Aqua-Fish at 7 to 8.1 and AKVARISTA at 6
        to 8, and narrower overall than checker-a's 5 to 8 on its upper side; those higher endpoints
        have weaker corroboration. The introduced Bangka population at pH 4 to 5 is retained as
        non-native field evidence, not proof of aquarium longevity. These disagreements justify
        retaining the median with low confidence."

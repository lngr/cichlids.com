  sizeAndGrowth:
    text: "The adult planning estimates are 18 cm for males and 15 cm for females. They summarize
      aquarium reports rather than measured maxima for each sex. Published figures mix length
      conventions: the 15 cm value in Seriously Fish and the 18.7 cm FishBase maximum are standard
      lengths, which exclude the tail. Females are generally smaller, but no strong female-specific
      maximum series was located. The available lifespan estimate is six to seven years and has low
      confidence because it comes principally from one general care account."
    sources:
      - *a28
      - *a29
      - *a34
      - *a4
  husbandry:
    text: "For an established adult pair, the decided minimum is 185 litres with a base 120 cm long and
      40 cm deep. This planning value sits between the roughly 170 and 200 litre care
      recommendations; the wider base allows cover and retreat routes beyond the specialist marginal
      120 by 30 cm minimum. Secure rocks and wood before adding a diggable substrate. Leave several
      ways for either partner to break visual contact, and favor plants attached to decor where
      digging would disturb roots. Provide effective filtration and regular water changes. Care
      literature supports a practical starting temperature around 24 to 25 C and pH 6.5 to 7.5. The
      wider tolerance values include uncertain extensions from habitat evidence and are not
      preferred targets."
    sources:
      - *a28
      - *a29
      - *a34
      - *a42
      - *a27
      - *a31
      - *a33
      - *a32
      - *a35
  socialBehavior:
    text: "The adult social recommendation is a compatible pair. Additional adults can be attacked
      severely, and even a female paired with a male may be injured if she is not receptive. A group
      of young fish can be used to obtain a pair, but the remaining fish need removal once pairing
      becomes clear. Observe whether each fish can move, feed and rest without persistent
      interception. Have a divider or another prepared aquarium available. Defense of eggs and fry
      increases the danger to every other fish in the enclosure."
    sources:
      - *a28
      - *a4
      - *a59
      - *a49
      - *a51
      - *a53
  diet:
    text: "Manage this species as a piscivore that also consumes aquatic invertebrates. A varied feeding
      program can use thawed shrimp, earthworms, mollusc flesh and suitable fish pieces, with an
      accepted carnivore preparation as part of the rotation. Match portions to what is consumed and
      remove leftovers. Live feeder fish are unnecessary for meeting the diet. CRC uses a broader
      omnivorous and predatory category, while the detailed species accounts specifically support
      fish eating. No special protein-related bloat sensitivity was documented, but this does not
      establish immunity to digestive problems."
    sources:
      - *a28
      - *a4
      - *a59
      - *a29
      - *a34
  breeding:
    text: "Both adults care for eggs placed on an exposed firm surface, followed by larvae held in
      shallow substrate pits. Suitable surfaces can include a stone, wood or the side of a pot; an
      enclosed cave is not essential. Care accounts report several hundred eggs and hatching in
      about two days under their stated conditions. The parents relocate the larvae before free
      swimming and may continue guarding the brood for several weeks. Newly swimming fry can receive
      suitably small foods such as Artemia nauplii. Other fish should already have separate housing,
      and the adults still need monitoring for aggression toward one another."
    sources:
      - *a28
      - *a4
      - *a59
      - *a29
  sexing:
    text: "Mature males generally become larger and develop longer dorsal and anal fin extensions. Color
      intensity changes with social status and breeding condition in both sexes, so it is unreliable
      on its own. Juveniles can be difficult to sex externally. Treat visual sex estimates as
      provisional and evaluate whether the adults actually cooperate. Identifying one male and one
      female does not establish that their introduction will be safe."
    sources:
      - *a28
      - *a29
      - *a34
  compatibility:
    text: "Dedicated housing is the normal recommendation. Small fish are potential prey, while fish too
      large to swallow can still suffer severe attacks. Some care pages suggest robust cichlids and
      archived keepers describe occasional mixed-tank success, but other accounts report fatalities
      among larger fish. There is no supported routine companion recommendation for the minimum pair
      aquarium. The empty hybrid-group list records a lack of substantiated named crosses and should
      not be interpreted as proof that crossing is impossible."
    sources:
      - *a28
      - *a29
      - *a50
      - *a54
      - *a30
      - *a1
      - *a69
      - *a31
      - *a2
      - *a72
      - *a70
      - *a71
      - *a73
      - *a9
      - *a62
  problems:
    text: "The principal husbandry risk is injury caused by incompatible adults, overcrowding or
      insufficient escape routes. Persistent hiding, missed meals and a fish repeatedly trapped in
      one area deserve prompt attention to social conditions. Digging can undermine unstable decor
      and disturb planting. Uneaten animal foods increase the waste load, making regular observation
      and maintenance essential. Broad water intervals should not encourage abrupt chemistry
      changes. Older trade identifications can also obscure which five-spotted species is actually
      being kept."

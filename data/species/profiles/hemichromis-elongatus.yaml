    confidence: "high"
    rationale: "The Catalog of Fishes defines the secure range as Lower Guinea coastal drainages and the
      middle Congo basin. FishBase specifies the Ntem, Woleu, Ogooue, Nyanga, Kouilou and Dja
      systems. Checker-a omitted Kouilou from its locality list; it is retained because FishBase
      explicitly includes it. Reports from far West Africa and southern Africa, older Cameroon
      identifications and the broader Lower Congo records need taxonomic care. The current catalog
      takes priority over Aquarismo Paulista treating H. fasciatus as a synonym. AquaInfo
      extractions contain map fragments and contribute no species measurements."

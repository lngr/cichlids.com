      rationale: "The tally median is 22 to 30 C with low confidence. Generator, checker-b and checker-c
        proposed 22 to 29, checker-a and tiebreaker-2 22 to 31, and tiebreaker-1 21 to 31 C. This
        median contains the decided natural 23 to 30 C range. Seriously Fish and Aqua-Fish recommend
        22 to 25 C, AquariumDomain 22.2 to 26.1 C, Einrichtungsbeispiele 23 to 27 C and MARE 2000 24
        to 28 C. The 30 C upper boundary is a habitat-driven extension rather than a demonstrated
        multi-year aquarium limit. The decision is narrower than the tie-breaker proposal of 21 to
        31 C, the Musolo occupied-station envelope of 24 to 30.1 C and the basin-wide Okavango
        extrema of 15.7 to 37.7 C retained under natural evidence; the latter do not establish
        species-specific chronic tolerance. Twenty-one degrees rests on a secondary field report and
        is not adopted as a normal long-term aquarium minimum."

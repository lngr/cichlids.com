  temperatureC:
    value: {min: 21, max: 29}
    confidence: high
    rationale: >-
      Lake Malawi endemic, so the natural range is the measured lake range. Inshore water cools to
      about 21 C in the windy season (Eccles 1974), the winter surface layer holds 23.5 to 24 C and
      summer surface water about 28 C (Vollmer et al. 2005), and a 2013 campaign measured 24 to
      29 C (Ngochera 2018). The species lives in the shallow, clear rocky littoral, inside the
      mixed upper layer that these values describe.

partners:
  suitable:
    - species: Aulonocara stuartgranti
      reason: Calm Malawi peacock of similar size with comparable water and space needs; named as a good match by Seriously Fish.
      condition: Females of both genera are grey; keep only males of the peacock if fry should stay pure.
    - species: Copadichromis borleyi
      reason: Peaceful open-water haplochromine of similar size that does not compete for the same rock spots.
    - species: Labidochromis caeruleus
      reason: One of the mildest mbuna, with a plant-leaning diet that suits the same feeding plan; often kept together by hobbyists.
      condition: Tank of at least 150 cm with plenty of rock.
    - species: Otopharynx lithobates
      reason: Calm sand and rock haplochromine of similar size and temperament from the same lake.
  unsuitable:
    - species: Protomelas fenestratus
      reason: Close relative with near-identical females; the two may cross in tanks and form a hybrid group.
    - species: Tropheus moorii
      reason: Species-only fish from Lake Tanganyika with harder water and a strict aufwuchs diet; it reacts badly to mixed communities.
    - species: Symphysodon aequifasciatus
      reason: Needs soft, acidic, warmer water and is a slow feeder that would lose every meal to this greedy hap.
    - species: Rocio octofasciata
      reason: Central American cichlid with different water needs and a protein-rich diet that leads to bloat in this aufwuchs feeder.
    - species: Melanochromis auratus
      reason: Very aggressive mbuna that harasses the calmer hap and its females in normal tanks.
      condition: Possible only in very large, heavily structured tanks.

profile:
  overview:
    text: >-
      Protomelas taeniolatus is a medium-sized haplochromine from Lake Malawi and one of the
      best-known non-mbuna in the trade, mostly as the Red Empress. Adult males are among the most
      colourful fish of the lake: a blue face on red or orange flanks in the common strain, mostly
      blue in forms such as Blue Fire. Females and young fish stay silver grey with dark stripes.
      The species grazes algae from rocks and needs a plant-based diet. In the aquarium it is calm
      towards other species, but males are rivals of each other and press females hard, so it is
      kept as one male with several females. A large tank with rocks and open swimming space suits
      it well.
    sources:
      - *sf
      - *elieson
      - *fb
      - *oliver
  habitat:
    text: >-
      The species is found around much of Lake Malawi, mostly in shallow water over rocky shores
      where the stones are free of sediment. Population studies show that fish on rocky stretches
      stay close to home, so neighbouring rock patches can hold genetically distinct groups. The
      colour forms in the trade come from different sites, for example Namalenje Island in Senga
      Bay for the Red Empress and Makanjila Point for Blue Fire. The lake water is clear, warm and
      moderately alkaline but soft, with a total hardness of only 3 to 5 dGH and a carbonate
      hardness of 5 to 8 dKH. Temperatures range from about 21 C in the cool season to 29 C at the
      surface in summer.
    sources:
      - *fb
      - *sf
      - *pereyra
      - *mm
      - *elieson
      - *branchu
      - *fao
      - *eccles
      - *ngochera
  sizeAndGrowth:
    text: >-
      Males usually reach about 15 cm in the aquarium and females about 12 to 13 cm. Wild fish
      described from the lake measure a little over 11 cm, while some trade sheets quote 20 cm or
      more; such figures describe rare individuals or confuse measurements and should not guide
      planning. Young fish grow quickly when fed well, and males begin to show colour at about 7 to
      9 cm. Full colour takes longer and depends on social rank: a subordinate male can stay dull
      for months. Because the fish tends to put on weight, a lean diet keeps growth healthy rather
      than fast.
    sources:
      - *elieson
      - *guid
      - *fb
      - *sf
  husbandry:
    text: >-
      Plan a tank of about 300 litres and 150 cm length for one male and three females. Stack rocks
      along the back and sides so that females can break line of sight, and leave the front and
      middle open for swimming. A sandy floor works well and gives the male a place to dig a
      spawning pit. Strong filtration and regular water changes matter because the fish eat a lot.
      In the aquarium the species does well at 24 to 27 C and a stable pH of about 7.8 to 8.5; it
      tolerates hard tap water but does not need it, and a well-buffered water keeps the pH steady.
      Avoid sudden swings in pH or temperature.
    sources:
      - *sf
      - *elieson
      - *guid
      - *fk
      - *wittig
  socialBehavior:
    text: >-
      Outside spawning the species is one of the calmer haplochromines and seldom starts trouble
      with other fish. Males, however, cannot share a normal tank with each other and treat females
      roughly when they want to spawn. A ratio of at least three females per male spreads this
      pressure, and rock piles let a chased female hide. When a male is ready to spawn he guards a
      small spot on a flat stone or a pit in the sand and drives other fish away from it; after
      spawning he leaves the site again. Several males can only be kept in very large tanks.
    sources:
      - *elieson
      - *sf
      - *cf1369
  diet:
    text: >-
      In the lake this fish lives mainly on the algae coat of the rocks, which it sucks from small
      gaps, and on small invertebrates and zooplankton when these are abundant; it has also been
      recorded eating the eggs and larvae of a catfish. In the aquarium a staple of spirulina or
      other vegetable flakes and pellets suits it best, with blanched spinach or lettuce now and
      then. Small frozen foods such as brine shrimp, Daphnia or mysis are a supplement, not the
      main course. Red meat such as beef heart and protein-rich cichlid pellets should be avoided.
      Feed small portions once or twice a day, because the fish eats greedily and easily becomes
      fat.
    sources:
      - *fb
      - *fbfood
      - *cf1369
      - *sf
      - *elieson
  breeding:
    text: >-
      Breeding works well when one male lives with several females. The male intensifies his
      colour, cleans a flat stone or digs a shallow pit and displays to the females. A ready female
      lays her eggs on the site in small batches and picks them up in her mouth, where the male
      fertilises them. She then carries the brood for about three weeks without eating and releases
      free-swimming young that take newly hatched brine shrimp or fine crushed food at once.
      Stressed females may swallow or spit out the brood early, so move a holding female only with
      care, or give her a quiet separate tank.
    sources:
      - *sf
      - *elieson
      - *fk
  sexing:
    text: >-
      Adult males are easy to recognise: they are larger, show strong blue, red or orange colours
      and develop longer dorsal, anal and pelvic fins. Females stay silver to grey with a dark
      stripe along the middle of the body, a second stripe below the dorsal fin and faint bars.
      Young fish all look like females until males start to colour at around 7 to 9 cm. Because the
      females resemble those of many other Malawi haplochromines, especially Protomelas fenestratus,
      buy them from a source that keeps the species pure.
    sources:
      - *sf
      - *oliver
      - *guid
  compatibility:
    text: >-
      Good companions are other calm Lake Malawi cichlids of similar size, such as peacocks of the
      genus Aulonocara, Copadichromis and peaceful sand and rock haplochromines. Mild mbuna can work
      in a spacious tank with enough rock. Very aggressive mbuna stress the calmer haps and their
      females. Do not keep it with Protomelas fenestratus or with other forms of the same species,
      because the look-alike females make crosses likely. Fish from soft, acidic water or species
      that need meaty foods do not fit, and fry or fish of about 2 cm may be eaten when they come
      within reach. Slow feeders lose out at feeding time.
    sources:
      - *sf
      - *sffen
      - *fk
      - *tpp
      - *elieson
  problems:
    text: >-
      The most common problem is digestive: a diet rich in animal protein, or simply too much food,
      can lead to bloat, a swollen belly and loss of appetite that often ends badly. A plant-based
      staple, small portions and a fasting day each week reduce the risk. Too few females or too
      little cover leave females battered and stressed, and stressed females may lose their broods.
      Keeping two males in a medium tank leads to constant fights. Pale colour in a male usually
      means low rank or poor water rather than illness. Kept in dirty water or with large swings in
      pH, the fish become more prone to infections. Mixing it with related Protomelas produces
      hybrids.
    sources:
      - *sf
      - *elieson
      - *fk
      - *arch2527


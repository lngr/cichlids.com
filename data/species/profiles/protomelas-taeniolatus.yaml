  predation:
    value: 1
    confidence: low
    rationale: >-
      The votes split between level 0 (checker-b, tiebreaker-2) and level 1 (generator, checker-a,
      tiebreaker-1), so the vote count chose the more cautious level 1. The species is mainly a
      grazer: FishBase describes it as feeding on aufwuchs from sediment-free rocks and adding small
      invertebrates and zooplankton when these are plentiful, and its ecology record classes it as
      a feeder on plants and detritus. Seriously Fish and the two Cichlid-Forum profiles name no
      fish in its diet, so levels 2 and 3 are ruled out. The case for level 1 rests on two
      observations: the FishBase food item table lists eggs and larvae of the catfish Bagrus
      meridionalis as prey after Ribbink and Lewis (1982), which is feeding on early fish stages
      when the chance arises, and Fishkeeper warns that much smaller tankmates may be eaten. Males
      reach about 15 cm, so fry and fish of about 2 cm fit easily into the mouth. The case for
      level 0 is that no source reports regular fry eating in the aquarium, and the 2020 revision
      of the genus names paedophagy as a trait of P. krampus, not of this species. Treating it as
      a fry eater costs little in tank planning, whereas the lower level could lead to losses of
      small tankmates; the confidence stays low until a source settles the question.
    sources:
      - *fb
      - &fbfood
        kind: database
        title: FishBase food items, Protomelas taeniolatus (after Ribbink and Lewis 1982 and Eccles and Trewavas 1989)
        url: https://www.fishbase.se/TrophicEco/FoodItemsList.php?vstockcode=2322&genus=Protomelas&species=taeniolatus

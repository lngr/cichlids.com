    verification:
      method: waterbody
      waterbody: lake-malawi
    tolerance:
      value: {min: 7.6, max: 8.8}
      confidence: medium
      rationale: >-
        Decided by qualified majority (4 of 5 votes within 0.3 pH). Species care sheets agree on
        alkaline water: Seriously Fish gives 7.6 to 8.8 with 8.0 to 8.5 for breeding, the two
        Cichlid-Forum profiles, That Pet Place and Guidarium 7.8 to 8.6, Fishkeeper and FishLore
        7.5 to 8.5, and a general Cichlid-Forum article 7.4 to 8.6 for Malawi species. Seriously
        Fish is the only species sheet whose range contains the whole lake range, and the median
        of the agreeing votes gives 7.6 to 8.8. Aqualog (7.0 to 8.0), Aquatic Community (7.0 to
        8.5) and FishProfiles (7.2 to 8.5) reach lower but follow generic templates; no source

      and FishLore list it as a herbivore. Seriously Fish and Fishkeeper ask for a mainly vegetable,
      high-fibre diet and warn that rich animal food harms long-term health or causes Malawi bloat;
      Seriously Fish and Elieson add that the species eats greedily and fattens easily, and a
      keeper in the cichlids.com archive lost a swollen male. This marks a bloat risk on

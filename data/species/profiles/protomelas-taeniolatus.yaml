  aggressionConspecific:
    value: 3
    confidence: medium
    rationale: >-
      Males do not tolerate each other in normal tanks; Elieson and Seriously Fish allow more than
      one male only in very large tanks. A courting male drives females hard, so they need several
      companions and hiding places, and FishProfiles reports males killing unwilling females. The
      Cichlid-Forum profile rates the behaviour towards its own species as aggressive. Injuries
      follow from a wrong ratio or too little cover, which is level 3; a harem in a suitable tank
      settles into a clear hierarchy.

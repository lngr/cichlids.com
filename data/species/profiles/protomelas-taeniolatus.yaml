  synonyms:
    - name: Haplochromis taeniolatus
      note: Original combination, Trewavas 1935; type locality the southern end of Lake Malawi.
    - name: Haplochromis cancellus
      note: Described by Greenwood 1963; a synonym since Eccles and Trewavas 1989.
    - name: Protomelas taeniolatus dejunctus
      note: >-
        Described by Stauffer 1993 as a subspecies from Chinyamwezi Island; the Catalog of Fishes
        treats it as a synonym following Konings 2016, while the Cichlid Room Companion keeps the
        subspecies.
    - name: Cyrtocara taeniolata
      note: >-
        Combination of older aquarium literature from the time when many Malawi haplochromines
        were placed in Cyrtocara; the Catalog of Fishes does not list it.
  legacyNames:
    - Protomelas taeniolatus
  note: >-
    The Catalog of Fishes lists the species as valid as Protomelas taeniolatus (Trewavas 1935),
    following Eccles and Trewavas 1989, Marechal 1991 and Konings 2016. The trade forms 'Red
    Empress', 'Super Red Empress' and 'Blue Fire' are sold under this name; Seriously Fish expects
    that some of them may prove to be separate species, because they reach different sizes.
names:
  trade:
    en:
      - Red Empress
      - Spindle hap
      - Super Red Empress
      - Blue Fire
variants:
  - name: Red Empress (Namalenje)
    kind: locality
    note: The common aquarium form from Namalenje Island in Senga Bay; males show red to orange flanks and a blue head.
  - name: Super Red Empress
    kind: color-morph
    note: Line-bred in European aquaria for more red; traces back to the Namalenje form.
  - name: Blue Fire (Makanjila Point)
    kind: locality
    note: Mainly blue males; some fish sold under this name may belong to a related undescribed form.
  - name: Chinyamwezi Island (dejunctus)
    kind: locality
    note: Population described as Protomelas taeniolatus dejunctus.


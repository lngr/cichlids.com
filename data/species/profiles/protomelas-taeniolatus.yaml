  disagreements:
    - field: taxonomy.synonyms
      proposals:
        - {by: generator, value: [Haplochromis taeniolatus, Haplochromis cancellus, Protomelas dejunctus, Cyrtocara taeniolata]}
        - {by: checker-a, value: [Haplochromis taeniolatus, Haplochromis cancellus, Protomelas taeniolatus dejunctus, Cyrtocara taeniolata]}
        - {by: checker-b, value: [Haplochromis taeniolatus, Haplochromis cancellus, Protomelas dejunctus]}
      decision: [Haplochromis taeniolatus, Haplochromis cancellus, Protomelas taeniolatus dejunctus, Cyrtocara taeniolata]
      rationale: >-
        The Catalog of Fishes files dejunctus under Protomelas and notes that Stauffer described it
        as a subspecies, so the subspecies name is used. The remark that it is a valid subspecies
        refers to the original description, not to Konings 2016, who synonymised it. Cyrtocara
        taeniolata is kept as an older aquarium combination, with the note that the Catalog of
        Fishes does not list it.
    - field: features.origin.value.waterbody
      proposals:
        - {by: generator, value: Lake Malawi}
        - {by: checker-a, value: Lake Malawi}
        - {by: checker-b, value: lake-malawi}
      decision: Lake Malawi
      rationale: Both spellings name the same entry of the water body table; the name form is used.
    - field: features.origin.value.localities
      proposals:
        - {by: generator, value: [Namalenje Island, Makanjila Point, Chinyamwezi Island]}
        - {by: checker-a, value: [Southern end of Lake Malawi (type locality), Chinyamwezi Island (type locality of dejunctus)]}
        - {by: checker-b, value: [Southern end of Lake Malawi (type locality), Chinyamwezi Island, Namalenje Island (Senga Bay), Thumbi West Island]}
      decision: [Southern end of Lake Malawi (type locality), Namalenje Island, Makanjila Point, Chinyamwezi Island]
      rationale: >-
        The type localities come from the Catalog of Fishes, Namalenje Island from Malawi Mayhem and
        Makanjila Point from Elieson. No input names a source for Thumbi West Island, and the
        Malawi Mayhem page names only Namalenje, so it is left out.
    - field: features.ph.tolerance
      proposals:
        - {by: generator, value: {min: 7.5, max: 8.8}}
        - {by: checker-a, value: {min: 7.5, max: 8.8}}
        - {by: checker-b, value: {min: 7.0, max: 8.8}}
        - {by: tiebreaker-1, value: {min: 7.6, max: 8.6}}
        - {by: tiebreaker-2, value: {min: 7.6, max: 8.8}}
      decision: {min: 7.6, max: 8.8}
      rationale: >-
        Decided by the vote count (qualified majority, 4 of 5 within 0.3 pH); the median of the
        agreeing bounds is 7.6 to 8.8. The lower value of checker-b rests on generic care sheets.
    - field: features.khDkh.tolerance
      proposals:
        - {by: generator, value: {min: 5, max: 14}}
        - {by: checker-a, value: {min: 5, max: 15}}
        - {by: checker-b, value: {min: 5, max: 15}}
      decision: {min: 5, max: 15}
      rationale: Decided by the vote count (unanimous within 2 dKH); the median of the bounds is 5 to 15.
    - field: features.predation
      proposals:
        - {by: generator, value: 1}
        - {by: checker-a, value: 1}
        - {by: checker-b, value: 0}
        - {by: tiebreaker-1, value: 1}
        - {by: tiebreaker-2, value: 0}
      decision: 1
      rationale: >-
        Decided by the vote count with the conservative method: 3 of 5 votes do not reach a
        qualified majority, so the highest proposed level applies with confidence low. Recorded
        catfish egg and larva feeding in the lake and a care sheet warning about small tankmates
        support it; no source reports regular fry eating in tanks.
    - field: features.diet.value.foods
      proposals:
        - {by: generator, value: [spirulina flakes and pellets, vegetable-based staple food, blanched spinach or lettuce, "occasional brine shrimp, Daphnia or mysis"]}
        - {by: checker-a, value: [spirulina flakes or pellets, blanched vegetables such as spinach or courgette, "small amounts of frozen or live crustaceans such as Mysis, Daphnia or brine shrimp"]}
        - {by: checker-b, value: [spirulina flake, blanched spinach, blanched lettuce, algae-based pellets, Daphnia, brine shrimp, bloodworm as a supplement]}
      decision: [spirulina flakes and pellets, vegetable-based staple food, blanched spinach or lettuce, "occasional brine shrimp, Daphnia or mysis"]
      rationale: >-
        Decided by the vote count (unanimous on aufwuchs and bloat sensitivity); the food list of
        the top candidate is kept. The lists agree in substance; bloodworm is left out because of
        the bloat risk.
    - field: features.maxSizeCm
      proposals:
        - {by: generator, value: {male: 15, female: 12}}
        - {by: checker-a, value: {male: 15, female: 12}}
        - {by: checker-b, value: {male: 15, female: 11}}
      decision: {male: 15, female: 12}
      rationale: >-
        Elieson and Guidarium put females at up to 13 cm, so 11 cm is too small for well-kept
        adults; 12 cm is the typical value.
    - field: features.aggressionConspecific
      proposals:
        - {by: generator, value: 3}
        - {by: checker-a, value: 3}
        - {by: checker-b, value: 2}
      decision: 3
      rationale: >-
        Seriously Fish and Elieson allow only one male in normal tanks, and courting males drive
        females hard enough that injuries follow from a wrong ratio or too little cover, which is
        level 3. Checker-b itself notes that level 3 applies when males meet.
    - field: features.habitatZones
      proposals:
        - {by: generator, value: [rock, openWater]}
        - {by: checker-a, value: [rock]}
        - {by: checker-b, value: [rock, sand]}
      decision: [rock]
      rationale: >-
        All proposals agree on rock, which FishBase and a population study confirm for the wild.
        Sand serves only as an optional spawning ground beside flat stones, and the open swimming
        space between rocks is a tank need, not open water of the lake.
    - field: features.coloration
      proposals:
        - {by: generator, value: {baseColors: [blue, red, orange], pattern: mixed}}
        - {by: checker-a, value: {baseColors: [blue, red, orange], pattern: mixed}}
        - {by: checker-b, value: {baseColors: [blue, red], pattern: mixed}}
      decision: {baseColors: [blue, red, orange], pattern: mixed}
      rationale: >-
        Oliver describes orange-red flanks and Wikipedia orange among the male colours, so orange
        is kept.
    - field: features.minTank
      proposals:
        - {by: generator, value: {volumeL: 300, lengthCm: 150, depthCm: 50}}
        - {by: checker-a, value: {volumeL: 300, lengthCm: 150, depthCm: 50}}
        - {by: checker-b, value: {volumeL: 240, lengthCm: 120, depthCm: 45}}
      decision: {volumeL: 300, lengthCm: 150, depthCm: 50}
      rationale: >-
        Elieson prefers more than 100 US gallons, Fishkeeper asks for 180 cm length and a care guide
        for 300 litres; 120 cm marks the lower end of the sources and leaves females little room to
        escape.
    - field: features.lifespanYears
      proposals:
        - {by: generator, value: {min: 8, max: 10}}
        - {by: checker-a, value: {min: 8, max: 10}}
        - {by: checker-b, value: {min: 5, max: 10}}
      decision: {min: 5, max: 10}
      rationale: >-
        Only checker-b found a species source (FishLore, five years or longer); the lower end of 8
        years rests on general knowledge alone, so the sourced lower end is used.

  ghDgh:
    value: {min: 3, max: 5}
    confidence: high
    rationale: >-
      Lake Malawi is soft water: calcium and magnesium are low and bicarbonate dominates. The
      north-basin profiles of Branchu et al. (2010) convert to 4.2 to 4.6 dGH in the upper 50 m,
      the 1960s titrations compiled by FAO to 3.2 to 4.9 dGH, so the natural range is 3 to 5 dGH.
      Care sheets that call the lake hard confuse hardness with alkalinity.
    sources: *lakesources
    evidence:
      - source: *branchu
        value: {min: 4.2, max: 4.6}
        note: upper 50 m of the north basin, computed from calcium and magnesium
      - source: *fao
        value: {min: 3.2, max: 4.9}
        note: 1960s titrations, computed from calcium and magnesium
    verification:
      method: waterbody
      waterbody: lake-malawi
    tolerance:
      value: {min: 3, max: 25}
      confidence: medium
      rationale: >-
        Care sheets ask for clearly harder water than the lake: Seriously Fish and Guidarium 10 to
        25 dGH, Fishkeeper up to 25, FishProfiles 10 to 20, FishLore 5 to 15 and a general
        Cichlid-Forum article 9 to 18 for African cichlids. The species is kept for years in such
        water, so the upper end is 25 dGH; the lower end is the soft lake water itself. Several
        sheets blur total and carbonate hardness, so the upper end is softer evidence than the
        lower one.
      sources:
        - *sf
        - *fk
        - *guid
        - *wittig
        - *branchu
        - *fl
        - *fprof
      evidence:
        - source: *sf
          value: {min: 10, max: 25}
          note: aquarium recommendation
        - source: *guid
          value: {min: 10, max: 25}
          note: aquarium recommendation
        - source: *fk
          value: {min: 10, max: 25}
          note: aquarium recommendation, only the upper limit is stated
        - source: *wittig
          value: {min: 9, max: 18}
          note: general figure for African cichlids
        - source: *fl
          value: {min: 5, max: 15}
          note: aquarium recommendation
        - source: *fprof
          value: {min: 10, max: 20}
          note: aquarium recommendation
        - source: *branchu
          value: {min: 4.2, max: 4.6}
          note: lake water the species lives in
      verification:
        method: unanimous
        votes: {agree: 3, total: 3}

  khDkh:
    value: {min: 5, max: 8}
    confidence: high
    rationale: >-
      Lake Malawi endemic: bicarbonate dominates the ions of the lake. Alkalinity of 2.33 to 2.46
      meq/L in the profiles of Branchu et al. (2010) gives 6.5 to 6.9 dKH, and 2.00 to 2.59 meq/L
      after Jackson et al. (1963) gives 5.6 to 7.3 dKH, so the natural range is 5 to 8 dKH.
      Sodium balances part of the bicarbonate, so carbonate hardness exceeds total hardness.
    sources: *lakesources
    evidence:
      - source: *branchu
        value: {min: 6.5, max: 6.9}
        note: computed from alkalinity profiles
      - source: *fao
        value: {min: 5.6, max: 7.3}
        note: computed from alkalinity after Jackson et al. 1963
    tolerance:
      value: {min: 5, max: 15}
      confidence: low
      rationale: >-
        No species care sheet gives a carbonate hardness of its own except a Singapore care guide
        with 6 to 10 dKH. Seriously Fish and Fishkeeper ask for hard, alkaline, well-buffered
        water, and Fishkeeper advises coral sand or aragonite, which raises carbonate hardness
        above the lake values; a general Cichlid-Forum article recommends 10 to 14 dKH for Rift
        Lake tanks. The tolerance runs from the lake range up to 15 dKH; the upper end is an
        estimate from this general aquarium practice, not a measured limit for the species.
      sources:
        - *wittig
        - *branchu
        - *fao
        - *fk
        - *sf
        - *fl
        - &gensou
          kind: website
          title: Gensou Premium Aquascaping, Protomelas taeniolatus care guide
          url: https://gensou.sg/protomelas-taeniolatus-care-guide/
          accessed: 2026-10-12
      evidence:
        - source: *wittig
          value: {min: 10, max: 14}
          note: general recommendation for Rift Lake aquaria
        - source: *gensou
          value: {min: 6, max: 10}
          note: aquarium recommendation
        - source: *branchu
          value: {min: 6.5, max: 6.9}
          note: lake water the species lives in
        - source: *fao
          value: {min: 5.6, max: 7.3}
          note: lake water the species lives in
      verification:
        method: unanimous
        votes: {agree: 3, total: 3}


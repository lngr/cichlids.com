  temperatureC:
    value:
      min: 21
      max: 29
    confidence: high
    rationale: The decided natural range of 21 to 29 C follows the lake-wide seasonal synthesis. Branchu measured 22.8 to 25.4 C in a northern-basin campaign; Vollmer documents seasonal cooling below 24 C and summer surface water around 28 C. Those individual surveys do not encompass every season and shoreline condition. Species care recommendations are retained separately as tolerance evidence.

  socialBehavior:
    text: "A practical breeding unit is one male with three females. Extra females distribute attention but cannot eliminate persistent pursuit. The strongest direct account describes several days of courtship and defense across at least 200 cm of aquarium length. This is a large breeding territory despite the small sand pit used for spawning. Another aquarium report describes a calm group with several males, showing that outcomes vary with setting and individuals. Watch whether every fish can feed, rest and leave the male's immediate area."
    sources:
      - kind: website
        title: "My experiences with the Malawi lake predator, Exochochromis anagenys"
        url: "https://www.foraquarist.com/en/inspiration/420-my-experiences-with-the-malawi-lake-predator-exochochromis-anagenys-oliver-1989"
        accessed: 2026-10-13
        archived: foraquarist.com/en/inspiration/420-my-experiences-with-the-malawi-lake-predator-exochochromis-anagenys-oliver-1/2026-10-14T230900Z
      - kind: website
        title: "Three spot Torpedo Cichlid, Exochochromis anagenysi, Aquatic Arts"
        url: "https://aquaticarts.com/products/threespot-torpedo-malawi-torpedo-exochochromis-anagenysi-locally-bred"
        accessed: 2026-10-13
        archived: aquaticarts.com/products/threespot-torpedo-malawi-torpedo-exochochromis-anagenysi-locally-bred/2026-10-14T230906Z
  diet:
    text: "Fish form the principal natural food. Captive accounts describe acceptance of suitable pellets, flakes and frozen animal foods, including crustaceans. Build feeding around a complete food appropriate for carnivorous cichlids and vary suitable portions rather than relying on live feeder fish. Being well fed does not remove the threat to small tankmates or released fry. No special tendency to bloat from a protein-rich diet is established for this species, but overfeeding, poor food or stress can still cause digestive problems."
    sources:
      - kind: database
        title: "Cichlid Room Companion species page, Exochochromis anagenys"
        url: "https://cichlidae.com/species.php?id=hxu6J6vxuIrfuwqlQZBJfA"
        accessed: 2026-10-13

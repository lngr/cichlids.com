        accessed: 2026-10-13
  sizeAndGrowth:
    text: "The working adult aquarium maxima are 28 cm for males and 23 cm for females. Direct keeper observations span 25 to 30 cm and 20 to 25 cm respectively, so individual fish can exceed those working figures. FishBase records 20 cm standard length without separating sexes; that excludes the caudal fin and cannot be compared directly with aquarium total lengths. Juveniles therefore need a plan for adult housing. Longevity is poorly established; approximately 6.5 to 11 years is a low-confidence planning estimate, not a measured survival range."
    sources:
      - kind: website
        title: "My experiences with the Malawi lake predator, Exochochromis anagenys"
        url: "https://www.foraquarist.com/en/inspiration/420-my-experiences-with-the-malawi-lake-predator-exochochromis-anagenys-oliver-1989"

    tolerance:
      value:
        min: 5
        max: 14
      confidence: low
      rationale: "The tally decides 5 to 14 dKH by qualified majority, with 5 of 6 agreeing within the two-degree threshold and low confidence. Generator, checker-b and tiebreaker-1 propose 5 to 14; checker-a and tiebreaker-2 propose 4 to 14; checker-c proposes 5 to 10. The agreeing lower-end median is 5 and the upper median is 14. Aquatic Arts recommends 8 to 14 dKH, Abysse gives a target of 10, and species aquarium reports record 4, 7.5 and 14 dKH. The 4 dKH observation remains evidence below the decided lower endpoint but has no verified long-term exposure history. The decided range is narrower than Malawi-Guru general Malawi guidance of 6 to 20 dKH; its preferred target is 8 to 10. Direct keeping observations support considering 14 rather than treating a target of 10 as a maximum, but do not prove safety for years. The natural 5 to 8 dKH range is contained. This is an inferred buffering envelope, not a GH conversion or an experimental tolerance interval."

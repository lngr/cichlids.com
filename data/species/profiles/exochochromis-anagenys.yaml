        accessed: 2026-10-13
        archived: aquaticarts.com/products/threespot-torpedo-malawi-torpedo-exochochromis-anagenysi-locally-bred/2026-10-14T230906Z
  problems:
    text: "The principal risks are swallowing smaller companions, repeated courtship pressure, stress from aggressive tankmates, and inadequate swimming space. Affected fish may hide continuously or fail to feed. Avoid sudden repeated rearrangements and investigate persistent changes in appetite or behavior. One aquarium report describes juvenile losses with digestive signs, without establishing a cause or a species-specific dietary syndrome. Water tolerances remain partly inferred, especially for hardness, and should not be read as proven safety at every endpoint. Secure openings to prevent startled fish from leaving the aquarium."

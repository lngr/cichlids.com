    tolerance:
      value:
        min: 3
        max: 23
      confidence: low
      rationale: "The tally median is 3 to 23 dGH with low confidence and 3 of 6 agreeing with the top proposal. Generator, checker-c and tiebreaker-2 propose 3 to 20; checker-a proposes 3 to 25; checker-b and tiebreaker-1 propose 3 to 30. Sorted upper endpoints are 20, 20, 20, 25, 30 and 30: their median 22.5 rounds to 23. Every lower proposal is 3. This middle envelope contains natural Malawi water without claiming that the narrowest care target determines survival. The decided range is narrower than FishBase 7 to 30 dH, repeated by the wiki and atlas sites, and Fischlexikon 8 to 25 dGH. AquaInfo and Cichlid Atlas recommend 10 to 20 dGH, AquaInfo separately lists 12 to 16, and Malawi-Guru gives a general 4 to 20 dGH. Species aquarium observations at 12, 13 and 14 dGH support keeping in harder water but do not establish long-term endpoints. Repeated FishBase figures are not independent measurements. No species-specific chronic hardness trial was found; 23 is a voting compromise, not a measured physiological boundary."

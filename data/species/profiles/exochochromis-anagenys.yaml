    tolerance:
      value:
        min: 21
        max: 30
      confidence: low
      rationale: "The tally decides 21 to 30 C by unanimous agreement within the one-degree comparison threshold, with low confidence. Generator and checker-a proposed 20 to 30 C; checker-b and checker-c proposed 21 to 29 C. The rounded medians of the agreeing endpoints produce 21 to 30 C and contain the natural 21 to 29 C range. FishBase gives 23 to 27 C, the Nordic register 23 to 28 C, and Aquatic Arts 24 to 28 C; these are preferred or reported conditions, not chronic limit experiments. Both endpoints remain inferred, and a routine target near 24 to 26 C is better supported than continuous maintenance at either extreme."

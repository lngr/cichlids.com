  lifespanYears:
    value:
      min: 6.5
      max: 11
    confidence: low
    rationale: "Proposal medians are 6.5 to 11 years, from generator 8 to 12, checker-a 5 to 10, checker-b 5 to 10 and checker-c 10 to 15. Retain this median as a low-confidence planning estimate rather than a measured survival interval. The wiki and Aquarist Atlas give 5 to 10 years, Fishipedia gives 10, and the Abysse retailer gives 15. Those claims bracket the median but have no identified longevity study; the generator and checker-c estimates alone would not justify high confidence or precise biological limits. AquaInfo gives an additional estimate of 12 to 15 years, broadening the published spread without supplying observed lifetime records."

      - kind: website
        title: "AquaInfo Exochochromis anagenys URL, retrieved lake-map fragment only."
        url: "https://aquainfo.nl/artikel/exochochromis-anagenys/"
        accessed: 2026-10-15
        archived: aquainfo.nl/artikel/exochochromis-anagenys/2026-10-14T231727Z
  husbandry:
    text: "For one adult male and three females, allow approximately 1000 litres with a 250 by 70 cm footprint. This follows a keeper who repeatedly bred the species and observed substantial courtship defense. Smaller recommendations exist, but their stocking assumptions are less explicit. Place visual barriers around the edges while preserving a long swimming lane. Provide effective filtration, oxygen exchange and regular water changes. Care recommendations cluster near 24 to 26 C; the broader decided tolerances are 21 to 30 C, pH 7.4 to 8.6, GH 3 to 23 dGH and KH 5 to 14 dKH. Their extremes are not routine targets. Fit a secure lid because disturbed fish can jump."
    sources:
      - kind: website
        title: "My experiences with the Malawi lake predator, Exochochromis anagenys"

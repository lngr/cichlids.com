  breeding:
    text: "The female broods eggs and developing young in her mouth. Spawning is associated with a prepared sand depression near a rock, while the male may defend a much wider area. One experienced keeper reports incubation of roughly four weeks and young around 10 to 12 mm when released. The same account describes repeated successful broods without extended care after release. In a mixed aquarium, released young can become prey. The space needed for courting adults remains a central breeding constraint. AquaInfo instead suggests roughly three weeks of incubation and some short care after release; those differences remain unresolved between aquarium accounts."

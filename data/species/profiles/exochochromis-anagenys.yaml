  sexing:
    text: "Mature males are usually larger and can develop stronger blue coloration, particularly around the head, together with conspicuous anal-fin egg spots. Females and less dominant males can retain similar yellow or silvery tones and dark flank spots. Young fish are difficult to distinguish visually. Locality descriptions and aquarium reports differ in the distribution of yellow and silver forms, so color alone should not determine sex or collection origin."
    sources:
      - kind: website
        title: "My experiences with the Malawi lake predator, Exochochromis anagenys"
        url: "https://www.foraquarist.com/en/inspiration/420-my-experiences-with-the-malawi-lake-predator-exochochromis-anagenys-oliver-1989"
        accessed: 2026-10-13
        archived: foraquarist.com/en/inspiration/420-my-experiences-with-the-malawi-lake-predator-exochochromis-anagenys-oliver-1/2026-10-14T230900Z
  compatibility:
    text: "Potential companions are Malawi fish of comparable adult size that will neither fit in the predator's mouth nor continually intimidate it. Large haplochromines are a more plausible starting point than small mbuna or peacock juveniles. Breeding defense and individual temperament can change a previously stable combination, so additional species need more space than the harem minimum. There is no species-only restriction. No specific hybrid group was established in the reviewed evidence; this leaves crossing risk uncertain rather than proving that hybridization cannot occur."
    sources:
      - kind: website
        title: "My experiences with the Malawi lake predator, Exochochromis anagenys"
        url: "https://www.foraquarist.com/en/inspiration/420-my-experiences-with-the-malawi-lake-predator-exochochromis-anagenys-oliver-1989"

partners:
  suitable:
    - species: Large Lake Malawi haplochromines
      reason: Comparable adult size can reduce prey risk and share the alkaline lake chemistry.
      condition: Choose individuals too large to swallow that do not bully this relatively sensitive predator; mixed stocking requires more space than the harem minimum.
  unsuitable:
    - species: Small Lake Malawi mbuna
      reason: The Nordic association identifies mbuna as natural prey; juveniles and smaller adults are at risk.
    - species: Small or juvenile Aulonocara
      reason: Prey size makes young peacocks unsafe even though their water requirements can overlap.
    - species: Tropheus moorii
      reason: Its aufwuchs-focused feeding and group requirements make it a poor husbandry match for a large piscivore.
profile:
  overview:
    text: "Exochochromis anagenys is an elongated fish predator endemic to Lake Malawi. A yellow or silvery body, dark flank spots and blue breeding coloration make adults conspicuous. Its comparatively calm behavior with large fish can be misleading: much smaller companions remain potential food. Plan for males around 28 cm and females around 23 cm, substantial swimming space and a breeding harem. Courtship can turn a quiet aquarium into a defended spawning area with prolonged female pursuit."
    sources:
      - kind: database
        title: "FishBase species summary, Exochochromis anagenys"
        url: "https://www.fishbase.se/summary/Exochochromis-anagenys.html"
        accessed: 2026-10-13
        archived: fishbase.se/summary/exochochromis-anagenys.html/2026-10-14T230855Z
      - kind: website
        title: "My experiences with the Malawi lake predator, Exochochromis anagenys"
        url: "https://www.foraquarist.com/en/inspiration/420-my-experiences-with-the-malawi-lake-predator-exochochromis-anagenys-oliver-1989"
        accessed: 2026-10-13
        archived: foraquarist.com/en/inspiration/420-my-experiences-with-the-malawi-lake-predator-exochochromis-anagenys-oliver-1/2026-10-14T230900Z
  habitat:
    text: "Records include Thumbi West Island and the southeastern arm of Lake Malawi. FishBase places the species over rock and sand, and the Nordic association emphasizes hunting near rocky habitat. The type material came from about 40 to 50 m. Use sand, separated rock structures and unobstructed swimming space. Published lake studies underpin the natural envelope of 21 to 29 C, pH 7.7 to 8.6, GH 3 to 5 dGH and KH 5 to 8 dKH. Malawi water combines modest general hardness with appreciable carbonate buffering."
    sources:
      - kind: database
        title: "FishBase species summary, Exochochromis anagenys"
        url: "https://www.fishbase.se/summary/Exochochromis-anagenys.html"
        accessed: 2026-10-13

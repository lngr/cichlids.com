      rationale: "The four proposals are generator 1000 L/250 cm/70 cm, checker-a 570/180/50, checker-b 1000/250/70 and checker-c 600/180/60. Their component medians are 800 L, 215 cm length and 65 cm depth. After checking the recommended adult social unit, use 1000 L and a 250 by 70 cm footprint: the direct breeding keeper explicitly ties these dimensions to an adult one-male, three-female harem and reports a 200 cm courtship defense zone. A 215 cm tank would leave little escape distance beyond that zone. This selected minimum equals the published recommendation rather than exceeding it. The Nordic 540 L/160 cm, Malawi Mayhem 568 L, retailer 473 L and Fischlexikon 600 to 800 L alternatives do not specify an equivalent breeding harem; the wiki 208 L figure is especially weak for adults. Confidence is medium. AquaInfo independently recommends 800 L and 220 cm for keeping and breeding, close to the proposal median, but gives no sex ratio or measured escape space. The 1000 L selection follows the account explicitly describing the selected harem."

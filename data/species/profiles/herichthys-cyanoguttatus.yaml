  diet:
    text: "Use balanced omnivore cichlid pellets as a staple, supplemented with aquatic insect larvae, earthworms,
      crustaceans and vegetable matter. Native diets vary among populations and seasons, with plant matter and
      detritus sometimes prominent. This eager feeder also takes small fish; companions that fit into its
      mouth are at risk even though fish are not its main dietary specialization. Live feeder fish are
      unnecessary. Avoid persistent excess feeding and ensure other occupants can reach their food. The
      sources do not establish a special high-protein bloat sensitivity for this species."
    sources:

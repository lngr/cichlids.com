        to 33 (C). Without a qualified majority, the medians of all proposed minima and maxima are
        11.5 and 33, rounded to 12 to 33 C. The median 12 to 33 C contains the natural 13 to 32
        range without widening. Aquarismo Paulista gives 18 to 32 C, FishProfiles 20 to 31 C, and
        Fishkeeping 20 to 28 C; the wider TFH care envelope is 20 to 33 C and the Nordic register
        gives 18 to 33 C. Berg recommends approximately 21.1 to 23.9 C, while AKVARISTA summarizes
        18 C breeding and 15 C winter holding. Short cold-survival experiments and historical river
        extremes do not demonstrate a chronic aquarium tolerance. Around 22 to 26 C is a practical
        routine band. The 12 to 33 C median is a plausible seasonal envelope for this subtropical
        cichlid, with 33 C supported by aquarium recommendations and the lower extension inferred
        from native seasonal exposure. The 12 C endpoint is not a supported constant aquarium
        setting, and acclimation and oxygenation matter. Confidence is low because endpoint support
        is incomplete."

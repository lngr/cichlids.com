  husbandry:
    text: >-
      For one established adult pair, use at least about 500 L and a 180 by 55 cm footprint. This is
      a conservative planning recommendation synthesized from pair-specific guidance. Arrange stable
      shelters with separate exits and broken sightlines, and keep a secure divider available.
      Support heavy rocks so digging cannot undermine them. Strong filtration, water movement and
      regular partial water changes help control the waste produced by large fish. Around 22 to 26 C
      is a practical maintenance band. The stored tolerances are 12 to 33 C, pH 6.0 to 8.3, GH 5 to
      30 dGH and KH 5 to 12 dKH; all have low confidence, and their endpoints are not demonstrated
      equally safe constant settings for years.

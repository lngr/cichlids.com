  compatibility:
    text: "The speciesOnly flag is false because selected single adults can share very large aquaria with robust
      fish, but a bonded breeding pair should have a separate tank. Conditional companion examples apply to a
      single nonbreeding adult and require substantially more space than the pair minimum. Predation level 2
      excludes small mouth-sized fish; aggression excludes quiet or vulnerable companions. H. carpintis and H.
      minckleyi each share a documented pairwise hybrid group with cyanoguttatus. The carpintis group rests on
      a reported wild hybrid zone and aquarium warnings; the minckleyi group rests on wild genetic mixing in
      Cuatro Cienegas. These findings do not demonstrate that carpintis and minckleyi cross with each other."

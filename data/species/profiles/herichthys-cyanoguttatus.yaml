      decision: 4
      rationale: "The generator, checker-b and checker-c propose 4; checker-a proposes 3 while acknowledging that
        randomly paired females can be killed. Seriously Fish and AquariumDomain document partner attacks,
        possible fatalities and separation, and Berg also describes severe partner injury or death. Managing
        the risk with space, compatible pairing and a divider does not make it level 3: those measures are
        part of the rubric context for level 4. A bonded adult pair remains at risk."

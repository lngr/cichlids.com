  legacyNames:
    - Herichthys cyanoguttatus
    - Cichlasoma cyanoguttatum
  note: "The original and current genus is Herichthys, so Baird & Girard, 1854 has no parentheses. The current
    Catalog of Fishes treats Parapetenia cyanostigma as a synonym of H. cyanoguttatus; its entry also records
    an older assignment to H. carpintis. That historical assignment does not override its stated current
    status. H. carpintis is a separate valid species, and Green Texas and Red Texas are ambiguous trade labels
    rather than synonyms. The legacy catalog held this species twice, as Herichthys cyanoguttatus and
    under the former combination Cichlasoma cyanoguttatum; both entries map to this profile."

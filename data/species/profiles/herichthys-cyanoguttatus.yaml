  habitat:
    text: "Native fish occupy the Rio Grande / Rio Bravo drainage and neighboring northeastern Mexican systems,
      including Rio San Fernando. Pools, runs, rocky or sandy bottoms, submerged branches and vegetated
      margins provide feeding and shelter. Native Devils River sampling also found juveniles in riffles. The
      adjudicated water values are 13 to 32 C, pH 7.3 to 8.3, GH 9 to 30 dGH and alkalinity equivalent to 5 to
      11 dKH. Temperature and GH are low-confidence medians of differently sampled river envelopes; historical
      measurements extend beyond them. Water samples do not establish fish occupancy at every extreme, and the
      Mexican range remains unevenly covered."
    sources:

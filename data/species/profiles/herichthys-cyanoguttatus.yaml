  origin:
    value: &a2
      continent: North America
      region: "Lower Rio Grande / Rio Bravo drainage of southern Texas and northeastern Mexico, including the Rio
        San Fernando system"
      waterbody: Rio Grande / Rio Bravo
      localities:
        - "Rio Grande near Brownsville, Texas"
        - "Devils River, Texas"
        - "Rio Salado and Sabinas tributaries, northeastern Mexico"
        - "Rio San Fernando, Tamaulipas"
    confidence: high
    rationale: "All full profiles place the native range in southern Texas and northeastern Mexico, but differ in
      river names and locality lists. The generator includes the lower Nueces and Rio Panal; checker-a
      emphasizes the Rio Grande and San Fernando; checker-b adds Pecos, Devils River and Salado; checker-c
      emphasizes the Rio Grande, Sabinas and San Fernando. Retain the shared Rio Grande / Rio Bravo core and
      supported tributaries, with Rio San Fernando as a separate drainage. Native Devils River occurrence is
      documented by Robertson and Winemiller. Central Texas and Louisiana records include introductions and
      uncertain trade identities. The 2020 Rio Panal material was associated with a restocking program and
      identified with mitochondrial data, so it does not alone establish indigenous status and is excluded
      from the native-locality list. The proposed Nueces extension has uneven support and is not used to
      enlarge that list; its measured water data remain labeled regional context."

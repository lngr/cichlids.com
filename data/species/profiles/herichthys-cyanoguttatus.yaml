      rationale: "The proposals in vote order are 5 to 26, 5 to 26, 5 to 34, 4.5 to 35.3, 4.5 to 35.3, 5 to 26
        (dGH). Without a qualified majority, the medians of all proposed minima and maxima are 5 and
        30, rounded to 5 to 30 dGH. The median 5 to 30 dGH contains the natural 9 to 30 range
        without widening. Seriously Fish, FishProfiles and Fishkeeping give 5 to 12 dGH; Berg gives
        8 to 25 dGH, Aqua-Fish 5 to 20 dGH, and the other TFH account approximately 4.5 to 11.2 dGH.
        The 5 to 30 dGH median covers the natural 9 to 30 range and is plausible for a river fish
        exposed to hard water, although the upper endpoint rests on field exposure rather than
        chronic captive evidence. Field exposure supports possible adaptation, not years of constant
        exposure. Salinity experiments are not converted to GH. Confidence is low because endpoint
        support is incomplete."
    verification:
      method: median
      votes:
        agree: 3
        total: 6
  khDkh:
    value:
      min: 5
      max: 11
    confidence: medium
    rationale: "generator proposed 4.8 to 9.5; checker-a proposed 5 to 11; checker-b proposed 5 to 11; checker-c
      proposed 4.6 to 14.7; tiebreaker-1 proposed 4.7 to 14.7; tiebreaker-2 proposed 4.4 to 11.3. Tally
      records four of six agreeing votes and rounds their median bounds to 5 to 11 dKH. Natural KH
      deliberately has no verification object. The quantity is titrated alkalinity expressed in aquarium dKH
      units by dividing mg/L as CaCO3 by 17.848, rather than total calcium-magnesium hardness. Falcon and
      Anzalduas give approximately 5.32 to 7.62 and 5.27 to 10.65 dKH; the selected interval is narrower than
      historical Brownsville titrations of approximately 4.82 to 14.68 dKH and DDS-37 of 5.0 to 14.7 dKH.
      Filtered NASQAN alkalinity spans 4.7 to 11.3 dKH. Field and laboratory alkalinity methods remain
      identified separately in the evidence. These are drainage measurements without simultaneous observations
      of fish at every sampling point. Different periods, field versus laboratory methods, and percentile
      versus full-range summaries explain much of the disagreement. Mexican tributaries and occupied refuges
      remain incompletely sampled."

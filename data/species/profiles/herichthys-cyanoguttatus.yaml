partners:
  suitable:
    - species: Rocio octofasciata
      reason: A robust adult is named as a possible companion in species care accounts; coexistence remains
        individual and conditional.
      condition: "Single nonbreeding Texas cichlid only; approximately 1000 L or more, a conservatively chosen 240
        cm length, visual barriers and immediate separation capacity. No breeding pair."
    - species: Astronotus ocellatus
      reason: "Care accounts name substantial adult Oscars as possible companions; predation risk is reduced by
        size, but serious attacks remain possible."
      condition: "Single nonbreeding Texas cichlid only; approximately 1000 L or more, a conservatively chosen 240
        cm length, shared water requirements and spare accommodation. No breeding pair."
  unsuitable:
    - species: Herichthys carpintis
      reason: Shares the documented carpintis-cyanoguttatus hybrid group; similar appearance also raises
        identification and rivalry concerns.
    - species: Herichthys minckleyi
      reason: Shares the documented cyanoguttatus-minckleyi hybrid group based on wild genetic introgression.
    - species: Paracheirodon innesi
      reason: Small adults are vulnerable to mouth-sized predation and territorial attacks.
    - species: Pterophyllum scalare
      reason: Large fins and comparatively vulnerable behavior make serious territorial injury likely.
    - species: Mikrogeophagus ramirezi
      reason: Small size and low ability to withstand persistent territorial attacks make it unsuitable.
profile:
  overview:
    text: "Herichthys cyanoguttatus is the Texas or Rio Grande cichlid, a large freshwater species from southern
      Texas and northeastern Mexico. A grey-to-olive body carries blue-green speckling and dark flank
      markings. Trade identity deserves attention: Green Texas often means H. carpintis, while Red Texas
      commonly refers to fish of mixed ancestry. Spot size and breeding coloration help identification, but
      locality and breeding records add confidence. This profile concerns identified cyanoguttatus. Its
      recommended adult unit is a bonded pair, with substantial space and provision for separating the
      partners."
    sources:

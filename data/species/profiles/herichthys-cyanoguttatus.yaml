      rationale: "All four full-profile votes agree on omnivore with bloatSensitive false, so the unanimous tally
        and medium confidence are retained. Their food examples differ: the generator lists pellets, insect
        larvae, earthworms, crustaceans and vegetables; checker-a additionally emphasizes snails and algae;

  temperatureC:
    value:
      min: 13
      max: 32
    confidence: low
    rationale: "generator proposed 18 to 32; checker-a proposed 14 to 32; checker-b proposed 11 to 31; checker-c
      proposed 9.5 to 34.5; tiebreaker-1 proposed 9.5 to 34.5; tiebreaker-2 proposed 18 to 31.5. No four-vote
      cluster settled the natural range. Tally takes the median of all minima, 12.5 C rounded to 13 C, and all
      maxima, 32 C. Historical Brownsville measurements reach 9.5 to 34.5 C across the DDS-37 and NASQAN
      series, wider than the selected 13 to 32 C; Laredo includes 3 to 33.5 C, and Anzalduas includes a 6 C
      cold event. Those ambient extremes are not demonstrated healthy fish habitat limits. The stored median
      is a low-confidence synthesis, not an observed complete range. These are drainage measurements without
      simultaneous observations of fish at every sampling point. Different periods, field versus laboratory
      methods, and percentile versus full-range summaries explain much of the disagreement. Mexican
      tributaries and occupied refuges remain incompletely sampled."

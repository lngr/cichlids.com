    rationale: "generator proposed 7.1 to 8.1; checker-a proposed 7.3 to 8.4; checker-b proposed 7.3 to 8.2;
      checker-c proposed 6.5 to 8.8; tiebreaker-1 proposed 7.2 to 8.8; tiebreaker-2 proposed 7.6 to 8.7. Tally
      records qualified-majority agreement of four of six votes and takes their median bounds, 7.3 to 8.3.
      Falcon and Anzalduas field records from 1980 to 1988 are predominantly 7.3 to 8.1; Yuan and Miyamoto
      give relevant station means around 7.8 to 8.2. The selected interval is narrower than the historical
      Brownsville field range of 6.5 to 8.8 reported by checker-c, the DDS-37 range of 7.2 to 8.8, the NASQAN
      range of 7.3 to 8.7, and Laredo at 7.1 to 8.5. They remain evidence, not discarded measurements.
      Laboratory pH does not expand the field envelope. These are drainage measurements without simultaneous
      observations of fish at every sampling point. Different periods, field versus laboratory methods, and
      percentile versus full-range summaries explain much of the disagreement. Mexican tributaries and
      occupied refuges remain incompletely sampled."

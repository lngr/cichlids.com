  problems:
    text: "Adult size, unstable pairing and repeated aggression are central husbandry problems. Injuries can be
      followed by infection, and a subordinate fish may lose access to both shelter and food. Digging can
      shift decor and expose equipment, while heavy feeding increases the need to remove accumulated waste.
      Check water quality and behavior when appetite, breathing or condition changes. Quarantine new fish and
      verify their identity before breeding them. The numerical tolerance boundaries should not encourage
      permanent maintenance at seasonal river extremes; secure routine conditions and early intervention give
      a better margin."
    sources:

  sizeAndGrowth:
    text: "Plan for a well-grown male around 30 cm and a female around 25 cm. FishProfiles supplies sex-specific
      aquarium sizes, while other maximum records use different length conventions or do not distinguish
      sexes. Young fish can breed well before reaching adult size, so a grow-out group needs alternative
      accommodation once a pair emerges. Males usually become larger and develop longer fin extensions. The
      lifespan estimate is about 10 to 12 years under good care, with low confidence because published hobby
      estimates are not tracked age cohorts."

  breeding:
    text: "A compatible pair deposits adhesive eggs on a cleaned hard surface and both parents protect the brood.
      Flat stones are useful, and larvae may be carried into excavated pits. This is open-substrate spawning
      even when a sheltered surface is chosen. Once the young swim freely, small live foods such as newly
      hatched Artemia and suitably fine prepared foods support early feeding. Brood care can sharply increase
      territorial attacks, including attacks on the female. A breeding pair needs its own aquarium and an
      available divider; arrange space for the offspring before raising a large brood."
    sources:

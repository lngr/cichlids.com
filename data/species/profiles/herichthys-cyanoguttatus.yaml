  sexing:
    text: "Adult males usually exceed females in size and develop longer, more pointed dorsal and anal fin
      extensions. A forehead hump can occur, but its absence does not rule out a male and females may also
      show one. Females can display a dark dorsal marking. These traits are less useful in juveniles, and both
      sexes change color while breeding. Compare adults of similar age and condition, and treat an actual
      spawning observation as stronger evidence than a single photograph. Breeding black extending toward the
      mouth is described for H. carpintis in the identification study and should prompt a species check."
    sources:

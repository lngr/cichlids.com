  socialBehavior:
    text: "Adult pairs can defend a substantial part of the aquarium, and partner aggression can become fatal. A
      pair bond therefore needs continued observation rather than an assumption of permanent peace. Repeated
      contact attacks, exclusion from food or a fish confined to one corner call for separation. Juvenile
      groups allow fish to select partners, but surplus individuals need other accommodation once a pair
      forms. A single adult is an alternative when safe pairing cannot be achieved. Both conspecific and
      heterospecific aggression are graded 4 for the adult-pair context, especially during brood defense."
    sources:
      - kind: literature

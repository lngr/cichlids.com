      rationale: "generator proposed 6 to 8.1; checker-a proposed 6 to 8.4; checker-b proposed 6 to 8.2; checker-c
        proposed 6 to 8.8; tiebreaker-1 proposed 6 to 8.8; tiebreaker-2 proposed 6 to 8.7. Tally records four
        of six agreeing votes and their median bounds of 6.0 to 8.3. Seriously Fish and Fishkeeping recommend
        6.0 to 7.5; Berg and Aqua-Fish reach 8.0, while Aquarismo Paulista gives 6.6 to 8.0. The upper 8.3
        endpoint includes the decided natural range but is an ecological extension, not demonstrated lifelong
        captive performance. The selected tolerance is narrower than the wider habitat-based proposals up to
        8.7 or 8.8 and than those underlying field measurements. Low confidence reflects that extension and
        uncertain independence of care advice; stable neutral to mildly alkaline water is better supported for
        routine care."
    verification:
      method: qualified-majority
      votes:
        agree: 4
        total: 6
  ghDgh:
    value:
      min: 9
      max: 30
    confidence: low
    rationale: "generator proposed 7.8 to 25.7; checker-a proposed 9 to 26; checker-b proposed 8 to 34; checker-c
      proposed 6.6 to 35.3; tiebreaker-1 proposed 9.8 to 35.3; tiebreaker-2 proposed 10.5 to 25.2. No
      four-vote cluster formed. Tally takes medians of all bounds: the minimum median is 8.5 dGH, rounded to
      9, and the maximum median is 30 dGH. Hardness uses calcium-magnesium measurements as CaCO3 divided by
      17.848, not conductivity, salinity or alkalinity. The chosen 9 to 30 dGH is narrower than Anzalduas at
      8.68 to 33.62 dGH and the historical Brownsville range of 7.84 to 35.30 dGH reported by checker-c;
      DDS-37 reported hardness independently reaches 10.1 to 35.3 dGH. Laredo spans 6.61 to 19.61 dGH and the
      2004 Nueces samples 7.84 to 16.25 dGH. This is a low-confidence median of differently sampled envelopes
      rather than a physiological boundary. These are drainage measurements without simultaneous observations
      of fish at every sampling point. Different periods, field versus laboratory methods, and percentile
      versus full-range summaries explain much of the disagreement. Mexican tributaries and occupied refuges
      remain incompletely sampled."

  sizeAndGrowth:
    text: "Plan for usual adult maxima around 6 cm in males and 4 cm in females. Some sources give smaller\
      \ males or use standard length rather than total length, so apparent precision is misleading. Choose\
      \ shells that accommodate grown fish and provide spare refuges. Shell access and consistent feeding of\
      \ both fish matter more than achieving an exact growth schedule. Husbandry references estimate around\
      \ 5 to 8 years of life, with no robust survival series confirming the full range."

  socialBehavior:
    text: "Start with a compatible male-female pair and enough alternatives to the occupied shell. The pair\
      \ defends a small area even between broods, and nearby adults can be chased. Persistent exclusion from\
      \ shelter or feeding calls for a change in the arrangement. Female-biased colonies are described in other\
      \ husbandry accounts, but additional adults require more space and population differences complicate\
      \ a single universal mating-system description."

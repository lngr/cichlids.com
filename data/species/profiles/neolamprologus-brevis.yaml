        \ support ordinary invertebrate feeding. Huyghe et al. 2025 placed brevis in a fish-rich metagenomic\
        \ cluster but also found substantial copepod material; DNA cannot distinguish fish eggs, juveniles,\
        \ whole adults or scales, and covers only recent meals. It therefore does not directly establish routine\

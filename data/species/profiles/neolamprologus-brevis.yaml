    confidence: high
    rationale: "The catalog and species databases agree on a Lake Tanganyika endemic. Checker-a added Wonzye\
      \ Point, Chezi and Chikonde Island; the field studies at these sites use varying brevis/calliurus concepts.\
      \ The shared lake origin is retained without treating every sampled population as unambiguously identified\
      \ brevis. The catalog places the type locality at Albertville on the Congolese shore."

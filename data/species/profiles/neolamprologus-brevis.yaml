  social:
    value:
      structure: pair
    confidence: medium
    rationale: "Generator, checker-b and checker-c proposed pair; checker-a proposed harem with three females\
      \ per male. Tanganyika.si, FishProfiles and my-fish support a compatible male-female pair, often sharing\
      \ a shell. Seriously Fish permits female-biased colonies and Practical Fishkeeping recommends three females\
      \ per male. The 2021 review distinguishes mono-bigamous brevis outside callipterus nests from polygamous\
      \ calliurus-like fish within them, whereas Ota 2012 pools those forms. Pair is retained as the smallest\
      \ recommended aquarium social unit with medium confidence, not as a claim of universal lifelong monogamy.\
      \ Additional adults require more territory."

  ph:
    value:
      min: 8.4
      max: 9.4
    confidence: high
    rationale: "The fixed lake envelope is pH 8.4 to 9.4, with waterbody verification and high confidence.\
      \ Plisnier and colleagues measured 8.47 to 9.40 at 40 m in the northern basin; the Langenberg thesis\
      \ reproduces that annual-cycle result. The inherited lake synthesis additionally describes surface pH\
      \ around 8.8 to 9.2. The anomalous 7.3 to 7.8 in the historical FAO source book is excluded because it\
      \ conflicts with the modern observations and high alkalinity. Natural endpoints are retained exactly\
      \ as decided."

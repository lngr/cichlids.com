      \ confidence. Generator, checker-c and both tie-breakers proposed neolamprologus-brevis-calliurus, neolamprologus-brevis-callipterus\
      \ and altolamprologus-fasciatus-neolamprologus-brevis; checker-a proposed an empty list, while checker-b\
      \ used neolamprologus-brevis-fasciatus for the same fasciatus partner. The decided spelling follows the\
      \ current Altolamprologus fasciatus name. Koblmuller et al. 2007 explicitly establish the very close\
      \ brevis/calliurus relationship and found four wild hybrids near Wonzye, two with callipterus paternal\
      \ ancestry and two with fasciatus paternal ancestry. Mothers were identified only as brevis/calliurus.\
      \ These are real wild lineage-level hybrids but not verified named brevis crosses; the 2021 review further\
      \ questions older brevis identifications within callipterus nests. Sturmbauer 2010 partly repeats the\
      \ observations and shares authors, so it is not independent brevis-parent confirmation. All three groups\
      \ therefore have presumed basis. The first is relationship-based, the others reflect credible but unresolved\
      \ maternal possibilities. No larger group is inferred by transitivity."

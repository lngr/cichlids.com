  sexing:
    text: "Compare mature fish of similar age: males are generally larger and may have heavier heads or longer\
      \ fin extensions. Some populations show yellowish female bellies. Color alone is unreliable across forms,\
      \ and juveniles are difficult to distinguish. Both sexes use shells, so shelter occupation by itself\
      \ cannot identify a female. An established pair with known breeding history is easier to assess than\
      \ two selected juveniles."

  khDkh:
    value:
      min: 15
      max: 20
    confidence: high
    rationale: "The fixed natural range is 15 to 20 dKH with high confidence and no verification object. It\
      \ represents carbonate alkalinity rather than calcium-magnesium hardness. The programme synthesis includes\
      \ bicarbonate 5.6 to 6.2 meq/L plus carbonate 0.06 to 1.02 meq/L, a mathematical bounding envelope from\
      \ separate concentration endpoints of about 15.8 to 20.2 dKH; the decided 15 to 20 interval is retained\
      \ exactly despite that slightly wider calculated envelope. Langenberg cites 6.7 to 6.9 meq/L alkalinity,\
      \ about 18.8 to 19.3 dKH. Branchu and Bergonzini provide an independent surface mean of about 18.4 dKH.\
      \ Programme values are inherited synthesis evidence; unusually dilute readings near the Ruzizi inflow\
      \ are excluded from the lake-wide envelope."

      rationale: "The tally decides 23 to 29 C with unanimous verification (4 of 4 within the 1 C agreement\
        \ threshold) and low confidence. Generator, checker-b and checker-c proposed 23 to 29 C; checker-a\
        \ proposed 22 to 29 C. The median agreeing lower bound is 23 C. Aqualog offers the wider lower-end\
        \ recommendation of 22 to 28 C, while Seriously Fish gives 23 to 27 C, Fluval 24 to 27 C, Practical\
        \ Fishkeeping 23 to 26 C and FishProfiles 23 to 25 C. The 29 C upper endpoint is retained to contain\
        \ natural exposure, not because a multi-year aquarium study validates it. Routine keeping around 25\
        \ to 26 C has stronger husbandry support."

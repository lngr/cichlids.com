    rationale: "The tally fixes invertivore and bloatSensitive false by unanimous agreement, 4 of 4, with medium\
      \ confidence; the foods list is retained exactly from its decision. FishBase food items identify planktonic\
      \ invertebrates, Tanganyika.si describes zooplankton feeding and the 2021 review supports small invertebrate\
      \ prey. FishProfiles, Fluval and the broad FishBase ecology field instead suggest omnivory, without species-specific\
      \ plant stomach contents. Huyghe et al. 2025 found enough fish material to cluster brevis with piscivores,\
      \ contrary to the older dietary classification, but could not resolve the ingested life stage or habitual\
      \ diet over time. That conflict limits confidence and does not alter the binding tally decision. The\
      \ false bloat flag expresses the absence of a demonstrated species-specific high-protein sensitivity,\
      \ not protection from digestive disease. CRC corroborates plankton feeding only."

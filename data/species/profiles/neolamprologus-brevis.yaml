  diet:
    text: "Offer small animal foods such as Cyclops, Daphnia and Artemia, with fine sinking pellets for variety.\
      \ Deliver modest portions where each fish can feed near its refuge and remove uneaten food. Natural-history\
      \ sources chiefly describe invertebrate feeding; a recent metagenomic study found substantial fish material\
      \ but could not identify its life stage or show a lasting dependence on whole fish. No special high-protein\
      \ bloat tendency is established."

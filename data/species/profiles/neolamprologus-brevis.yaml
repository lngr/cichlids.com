  breeding:
    text: "Eggs and early brood development occur within a shell, with the female providing the most consistently\
      \ reported care. Male attendance varies. Free-swimming young remain near shelter at first and need very\
      \ small foods such as newly hatched Artemia. Other colony members or tankmates may take fry even when\
      \ they leave adults alone. A separate rearing arrangement can improve survival without making species-only\
      \ adult keeping essential."

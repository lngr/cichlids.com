    rationale: "The fixed natural range is 10 to 13 dGH, with waterbody verification and high confidence. Calcium-magnesium\
      \ hardness is calculated separately from alkalinity. Programme means in the inherited synthesis convert\
      \ to 11.1 to 11.5 dGH, historical Talling values to about 11.4 dGH, and Branchu and Bergonzini surface\
      \ means to about 10.6 dGH. The wider adopted envelope covers the compiled lake measurements rather than\
      \ any single sample. Cohen 1997 is retained as lake-compilation provenance only because its full text\
      \ is not available through the permitted open-access route; its readings are not asserted as directly\
      \ checked evidence. The DOI-less programme reports likewise supply inherited synthesis evidence."

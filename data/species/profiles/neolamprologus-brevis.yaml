  problems:
    text: "Insufficient usable shells, territorial overlap and competition for food can leave a fish hiding\
      \ or losing condition. Keep track of both individuals rather than assuming shell sharing guarantees compatibility.\
      \ Abrupt water changes and accumulated uneaten food also cause trouble. Repeated chasing, damaged fins\
      \ or persistent breathing changes warrant prompt investigation of water quality and access to refuge.\
      \ Fry disappearance alone does not establish parental cannibalism."

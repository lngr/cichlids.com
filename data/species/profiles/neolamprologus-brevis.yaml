  temperatureC:
    value:
      min: 23
      max: 29
    confidence: high
    rationale: "The fixed lake envelope is 23 to 29 C, with waterbody verification and high confidence. Verburg\
      \ and colleagues report hourly buoy extremes of 23.85 to 29.01 C in the inherited limnological synthesis;\
      \ Plisnier and the Langenberg thesis describe southern seasonal surface means of 24.4 to 27.2 C. These\
      \ are different summaries of variable lake conditions, not preferred aquarium set points. The adopted\
      \ integer endpoints are retained exactly as decided. The DOI tool cannot retrieve the DOI-less programme\
      \ reports, so their numerical observations are inherited compilation evidence rather than independently\
      \ reread full texts."

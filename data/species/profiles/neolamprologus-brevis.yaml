  compatibility:
    text: "A larger Tanganyika aquarium can house brevis with suitable small fish occupying other zones, such\
      \ as a Cyprichromis group or small Julidochromis with separate rock territory. The minimum pair tank\
      \ is not a community allowance. Avoid large predators and forceful bottom rivals. Presumed crossing risks\
      \ concern calliurus, callipterus and Altolamprologus fasciatus; the reported wild hybrid mothers were\
      \ unresolved between brevis and calliurus."

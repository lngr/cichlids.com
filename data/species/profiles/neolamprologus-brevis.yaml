  legacyNames:
    - Neolamprologus brevis
  note: "The Catalog of Fishes current-status entries, accessed 2026-10-13, retain Neolamprologus brevis and\
    \ Neolamprologus calliurus as separate valid species. Its Lamprologus genus list was also queried and does\
    \ not place brevis there; Lamprologus brevis remains the original combination and an alternative specialist\
    \ usage. The calliurus record cites synonym treatments by Marechal and Poll 1991 and Takahashi et al. 2026\
    \ while still retaining valid calliurus status. Ota 2012 and Ma 2024 use a pooled brevis concept, whereas\
    \ Lein and Jordan 2021 distinguish the forms. The 2026 paper, DOI 10.1111/jfb.70640, was refused by fetch-oa\
    \ as not open access, so its synonym argument was not directly read. Calliurus is consequently not added\
    \ to accepted synonyms and legacyIds remain [82]. AquaInfo incorrectly includes ocellatus among synonyms;\
    \ that identification is rejected."

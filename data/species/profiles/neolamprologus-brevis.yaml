  habitat:
    text: "Sandy or muddy lake bottoms with scattered empty snail shells provide shelter and spawning sites.\
      \ Required aquarium zones are sand and shells; rocky shell-nest observations in studies combining brevis\
      \ with calliurus do not make rock obligatory here. Lake water is alkaline and strongly buffered, with\
      \ magnesium contributing much of its general hardness. Seasonal lake extremes are exposures rather than\
      \ routine aquarium targets."

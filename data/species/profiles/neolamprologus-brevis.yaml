  husbandry:
    text: "For one established pair, provide at least 60 L and a 60 by 30 cm floor. Use a deep layer of fine\
      \ sand and several clean shells with suitable openings. Install any heavy decorations securely and maintain\
      \ a mature biological filter, surface movement and regular water changes with matched replacement water.\
      \ Around 25 to 26 C is a sensible routine target. Measure GH and KH separately; the wider tolerance endpoints\
      \ have limited long-term evidence."

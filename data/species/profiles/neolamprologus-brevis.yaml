partners:
  suitable:
    - species: Cyprichromis leptosoma
      reason: "Uses the upper water column, reducing competition for shell sites. Seriously Fish specifically\
        \ allows Cyprichromis companions."
      condition: A larger Tanganyika community aquarium sized for a full Cyprichromis group; never the 60 L
        pair minimum.
    - species: Paracyprichromis nigripinnis
      reason: "A plausible small plankton-feeding neighbor above the shell territory; this is a habitat-based\
        \ recommendation, not a verified brevis-specific pairing trial."
      condition: A spacious community with its own shaded rock zone and a suitable social group; check feeding
        access for both species.
    - species: Julidochromis transcriptus
      reason: A small rock-associated julie can occupy a separate habitat zone; Seriously Fish allows smaller
        Julidochromis and Practical Fishkeeping stresses spatial separation.
      condition: "An established pair in a larger community, with rock and shell territories well apart; remove\
        \ an aggressive individual."
  unsuitable:
    - species: Cyphotilapia frontosa
      reason: "Its large predatory mouth creates an avoidable risk to tiny shell dwellers, despite occasional\
        \ archive reports of apparent coexistence."
    - species: Neolamprologus leleupi
      reason: "Bottom-territory overlap and stronger attacks can displace brevis from its shells, particularly\
        \ in small aquariums."
    - species: Neolamprologus calliurus
      reason: "Very similar disputed taxon, competing for the same shelters, with a presumed crossing risk\
        \ and difficulty preserving correctly identified stock."
    - species: Altolamprologus fasciatus
      reason: "A larger predatory tankmate; genetically supported wild crosses involve the unresolved brevis/calliurus\
        \ maternal lineage, so the brevis-specific hybrid risk is presumed."
    - species: Lamprologus ocellatus
      reason: Competes for the same shell sites; its stronger shell defense makes sharing a small sandy footprint
        unreliable.
    - species: Neolamprologus callipterus
      reason: "A very different-sized shell-nest builder competes over shell habitat; reported wild hybrids\
        \ have unresolved brevis/calliurus mothers, giving a weak presumed crossing risk."
profile:
  overview:
    text: "Neolamprologus brevis is a small Lake Tanganyika cichlid whose daily activity centers on an empty\
      \ snail shell. A compatible male and female may share one shelter and feed just above it. Brown-grey\
      \ coloration, pale flank bars and localized blue reflections are most evident at close range. The Catalog\
      \ of Fishes retains this name despite continuing Lamprologus usage and disagreement over the boundary\
      \ with calliurus. Sunspot is an aquarium color label; Katabe, Sambia and Kigoma identify geographical\
      \ forms or trade origins rather than additional species."
    sources:
      - kind: catalog-of-fishes
        title: "Eschmeyer's Catalog of Fishes: Neolamprologus, version updated 21 September 2026"
        url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Neolamprologus"
        archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-15c05e25/2026-10-14T101710Z
        accessed: '2026-10-13'
      - kind: catalog-of-fishes
        title: "Eschmeyer's Catalog of Fishes: Lamprologus"

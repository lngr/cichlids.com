    rationale: "Qualified majority of 5 of 6 votes for level 0 (generator, checker-a, checker-b, tiebreaker-1, tiebreaker-2); checker-c proposed level 1. The species is an open-water zooplankton feeder with a small protrusible mouth: FishBase names small crustaceans and plankton and its food table lists only zooplankton and benthic crustaceans, Seriously Fish describes zooplankton made up mostly of small crustaceans, the Cichlid Room Companion classes it as planktivorous, and tanganyika.si and DRTA name copepods. No field or stomach observation reports fish. The vote for level 1 rests on the Aquarium Wiki, which says the fish may threaten very small fish, and on generic TankFacts texts that list small fish as prey and also give an implausible 30 cm size; neither reports an observation. A cichlids.com keeper held a pair with small Cyprichromis juveniles without reported losses. Fry that drift into reach may be taken by chance, which level 0 allows."

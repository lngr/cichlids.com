  aggressionConspecific:
    value: 2
    confidence: low
    rationale: "The generator, checker-b and checker-c proposed level 2 and checker-a level 1. Seriously Fish calls the species peaceful and keeps it in groups with several females per male, the Cichlid-Forum profile calls it mildly aggressive towards its own kind, and tanganyika.si describes intense rivalry between breeding males at their display sites. A keeper reports that a single adult male used the whole of a 240 cm tank. Breeding males hold sites and chase rivals regularly, which goes beyond the short displays of level 1, while no source reports injuries in a group with enough space, which keeps it below level 3. The sources conflict and many keeping reports may concern B. horii, so confidence is low."

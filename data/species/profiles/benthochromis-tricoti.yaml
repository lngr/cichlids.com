      - kind: archive
        title: cichlids.com forum thread 13635
        url: "https://www.cichlids.com/disc/read.php?2,13635"
  problems:
    text: "Most problems come from fright and tank design. Startled fish dash into the glass or the decor, injure their large eyes and jump out of open tanks, so a cover and clear swimming space matter. Boisterous tankmates, bright light and frequent disturbance keep the fish hidden, thin and stressed. Wild-caught juveniles are often skinny on arrival and are hard to feed at first, so they need small foods and patience. Females may spit or lose their brood in a hectic tank, and fry are weak and hard to raise. Many fish sold under this name may be B. horii, which affects size and colour. The fish react badly to swings in water conditions and to long transport, and a sick fish is a case for a fish veterinarian or an experienced aquarium specialist."

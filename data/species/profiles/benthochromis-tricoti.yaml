        accessed: 2026-10-17
        archived: seriouslyfish.com/species/benthochromis-tricoti/2026-10-17T111714Z
      - kind: forum
        title: "Cichlid-Forum thread, Benthochromis tricoti"
        url: "https://www.cichlid-forum.com/threads/benthochromis-tricoti.219633/"
        accessed: 2026-10-17
        archived: cichlid-forum.com/threads/benthochromis-tricoti.219633/2026-10-17T111824Z
  sexing:
    text: "Males are larger and far more colourful than females. A mature male is mauve-grey to bluish with bright blue stripes along the flank, a yellow throat and long filaments on the pelvic fins and the tail. Males out of breeding mood can look silvery and lose most of this colour. Females are silvery grey without stripes. Juveniles are brown or silvery and cannot be sexed by eye, so a group bought young is grown on until the males show colour. The stripe count helps tell the species from B. horii, whose males have a third stripe and longer pelvic fins."
    sources:
      - kind: website
        title: Benthochromis tricoti 'Samazi' (tanganyika.si)
        url: "https://www.tanganyika.si/TanganjikaByLocations/Samazi/slides/Benthochromis%20tricoti%20%27Samazi%27.html"
        accessed: 2026-10-17
        archived: tanganyika.si/tanganjikabylocations/samazi/slides/benthochromis_tricoti__samazi_.html/2026-10-17T111801Z
      - kind: database
        title: "Seriously Fish: Benthochromis tricoti"
        url: "https://www.seriouslyfish.com/species/benthochromis-tricoti/"
        accessed: 2026-10-17
        archived: seriouslyfish.com/species/benthochromis-tricoti/2026-10-17T111714Z
      - kind: forum
        title: "Cichlid-Forum thread, Benthochromis tricoti"
        url: "https://www.cichlid-forum.com/threads/benthochromis-tricoti.219633/"
        accessed: 2026-10-17
        archived: cichlid-forum.com/threads/benthochromis-tricoti.219633/2026-10-17T111824Z
  compatibility:
    text: "Tankmates should be calm, not much faster than Benthochromis and free of fin-nipping habits. Seriously Fish lists Enantiopus, Xenotilapia, Cyprichromis, Paracyprichromis, Altolamprologus and Gnathochromis as workable, plus the small catfish Synodontis petricola, and the Cichlid-Forum profile adds Ectodus and Lestradea. Cyprichromis need a large tank, because spawning Cyprichromis harassed a female to death in one report. Tropheus, Malawi mbuna and other boisterous fish are unsuitable, and large open-water piscivores such as Bathybates are a risk. A species tank is the safest choice for breeding. The species does not eat fish and has no known hybrids."
    sources:
      - kind: database
        title: "Seriously Fish: Benthochromis tricoti"
        url: "https://www.seriouslyfish.com/species/benthochromis-tricoti/"
        accessed: 2026-10-17
        archived: seriouslyfish.com/species/benthochromis-tricoti/2026-10-17T111714Z

    rationale: "Unanimous with 4 of 4 votes. Seriously Fish prefers a species tank but reports the fish kept with calm Tanganyika cichlids such as Enantiopus, Xenotilapia, Cyprichromis, Paracyprichromis and Altolamprologus, and the Cichlid-Forum profile names Paracyprichromis, Lestradea and Ectodus as tankmates. Two cichlids.com threads describe the fish in mixed Tanganyika tanks, one with Cyprichromis leptosoma and Xenotilapia ochrogenys. DRTA recommends a pure species tank because other fish may nip the long fins; that source is recorded as the dissenting evidence. The hobby limits the species to calm company rather than to its own kind."

  beginnerSuitability:
    value: demanding
    confidence: medium
    rationale: "All four agents agree. The Cichlid Room Companion rates the species for advanced aquarists, while Seriously Fish and Fishipedia call it moderate and DRTA lists beginner level. The fish needs a very large, long tank, a group of six or more, dim light, a tight cover and calm tankmates; it panics easily, crashes into the glass and jumps, comes mostly wild caught at high cost, and females rarely carry broods to term. These needs outweigh the simple diet."

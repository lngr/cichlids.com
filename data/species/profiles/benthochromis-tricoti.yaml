        accessed: 2026-10-17
        archived: tanganyika.si/tanganjikabylocations/samazi/slides/benthochromis_tricoti__samazi_.html/2026-10-17T111801Z
      - kind: catalog-of-fishes
        title: "Eschmeyer's Catalog of Fishes: species of the genus Benthochromis"
        url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Benthochromis"
        accessed: 2026-10-17
        archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-4794b48a/2026-10-17T111706Z

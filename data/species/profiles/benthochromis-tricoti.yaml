        - Mpulungu (Zambia)
        - Moba (DR Congo)
    confidence: high
    rationale: "All four agents and every source place the species in Lake Tanganyika, where it is endemic and recorded from the waters of Burundi, DR Congo, Tanzania and Zambia. The Catalog of Fishes gives the type locality off Karema on the Tanzanian shore, trawled at 100 to 125 m. Most fish in the trade are wild caught in the south and pass through the Mpulungu market. The localities merge the lists of the agents; the country names that checker-c listed as localities are covered by the region, and its water body name is written as the table id lake-tanganyika."

    - name: Haplotaxodon tricoti
      note: Original combination of Poll 1948; Poll erected Benthochromis in 1986 with this species as its type species.
  legacyNames:
    - Benthochromis tricoti
  note: "The Catalog of Fishes (online version updated 21 September 2026) lists the species as valid in Benthochromis, with Haplotaxodon tricoti Poll 1948 as the original combination and the type locality off Karema, Tanzania, at 100 to 125 m. The species list of the legacy genus Haplotaxodon (accessed 2026-10-17, archived researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-b1e3ef81/2026-10-17T111708Z) holds only H. microlepis and H. trifasciatus. FishBase and the Cichlid Room Companion use the same name. The sister species B. horii Takahashi 2008 was traded under the name B. tricoti, so part of the keeping literature may concern that fish."
names:
  trade:
    en:
      - Benthochromis tricoti
      - Three-lined Cichlid
      - Giant Featherfin
variants:
  - name: Samazi
    kind: locality
    note: Label for fish collected near Samazi on the Tanzanian shore; tanganyika.si files the species under this name.
  - name: Mpulungu
    kind: locality
    note: "Label for wild fish from the southern, Zambian end of the lake that reach the trade through the Mpulungu market."
  - name: Kambwimba
    kind: locality
    note: Trade label used in a Cichlid-Forum species entry; the exact collecting site is not documented in the sources read.
  - name: Zambia
    kind: locality
    note: "Label for fish from the Zambian part of the lake. Some stock under this label may be B. horii, which lives off the Zambian shore."
features:
  origin:
    value:
      continent: Africa

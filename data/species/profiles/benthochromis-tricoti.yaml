        url: "https://www.tanganyika.si/TanganjikaByLocations/Samazi/slides/Benthochromis%20tricoti%20%27Samazi%27.html"
        accessed: 2026-10-17
        archived: tanganyika.si/tanganjikabylocations/samazi/slides/benthochromis_tricoti__samazi_.html/2026-10-17T111801Z
      - kind: website

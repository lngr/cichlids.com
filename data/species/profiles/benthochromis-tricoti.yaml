      - kind: forum
        title: "Cichlid-Forum thread, Benthochromis tricoti"
        url: "https://www.cichlid-forum.com/threads/benthochromis-tricoti.219633/"
        accessed: 2026-10-17
        archived: cichlid-forum.com/threads/benthochromis-tricoti.219633/2026-10-17T111824Z
  socialBehavior:
    text: "In the lake the species lives in schools, so keep at least six fish with several females for each male. The fish is shy and easily alarmed. Panicked fish crash into the glass and can jump out, and a hectic tank can make females abort their broods. Breeding males hold display sites and chase rival males, so a long tank with room to keep apart is needed when more than one male is kept. Outside breeding the group stays loose and calm. Aggression towards other species is low, and the species suffers more from boisterous tankmates than it causes trouble."
    sources:
      - kind: database
        title: "Seriously Fish: Benthochromis tricoti"
        url: "https://www.seriouslyfish.com/species/benthochromis-tricoti/"
        accessed: 2026-10-17
        archived: seriouslyfish.com/species/benthochromis-tricoti/2026-10-17T111714Z
      - kind: website
        title: Benthochromis tricoti 'Samazi' (tanganyika.si)
        url: "https://www.tanganyika.si/TanganjikaByLocations/Samazi/slides/Benthochromis%20tricoti%20%27Samazi%27.html"
        accessed: 2026-10-17
        archived: tanganyika.si/tanganjikabylocations/samazi/slides/benthochromis_tricoti__samazi_.html/2026-10-17T111801Z
      - kind: archive
        title: cichlids.com forum thread 14089
        url: "https://www.cichlids.com/disc/read.php?2,14089"
      - kind: website
        title: "Cichlid-Forum species profile: Benthochromis tricoti"
        url: "https://cichlid-forum.com/profiles/species.php?id=1482"
        accessed: 2026-10-17
        archived: cichlid-forum.com/profiles/species.php/q-0d26463e/2026-10-17T111807Z
  diet:
    text: "In the lake the fish picks copepods and other small crustaceans from the water. Its mouth is small and protrusible, so the staple foods are small frozen or live crustaceans such as Cyclops, Mysis, Artemia and Daphnia, with some krill. A good fine flake with vegetable matter completes the diet. Several small meals a day work best, because the fish feeds slowly and loses out to hasty feeders. Wild-caught fish may need time to accept prepared foods. No source reports a bloat problem."
    sources:
      - kind: database
        title: "Seriously Fish: Benthochromis tricoti"
        url: "https://www.seriouslyfish.com/species/benthochromis-tricoti/"
        accessed: 2026-10-17
        archived: seriouslyfish.com/species/benthochromis-tricoti/2026-10-17T111714Z

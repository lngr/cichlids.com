partners:
  suitable:
    - species: Paracyprichromis
      reason: Calm open-water cichlids of similar temperament that Seriously Fish and the Cichlid-Forum profile name as companions; a keeper found them more peaceful partners than Cyprichromis.
    - species: Xenotilapia
      reason: Peaceful sand-dwelling Tanganyikans listed by Seriously Fish; a cichlids.com thread keeps a pair with Xenotilapia ochrogenys.
    - species: Enantiopus
      reason: Gentle sand cichlids from the same lake that Seriously Fish lists and that leave shy open-water fish alone.
    - species: Ectodus
      reason: The Cichlid-Forum profile names Ectodus among suitable tankmates because of its calm nature.
    - species: Cyprichromis leptosoma
      reason: "A cichlids.com thread keeps a pair with them in a 135 gallon tank, and Seriously Fish lists the genus as workable."
      condition: Large tank only; a keeper reports that spawning Cyprichromis harassed a female to death.
    - species: Synodontis petricola
      reason: Seriously Fish lists this small Tanganyikan catfish as suitable; larger catfishes are best avoided.
  unsuitable:
    - species: Tropheus
      reason: "Boisterous and constantly active, so they stress the shy Benthochromis, and they need a plant-based diet instead of plankton foods."
    - species: Lake Malawi mbuna
      reason: "Fast and aggressive, with a different diet; Seriously Fish names boisterous fish of this kind as stressful tankmates."
    - species: Bathybates
      reason: Large open-water piscivores of the same lake that hunt fish of this size; this follows from their feeding habit and is not from a source about this species.
    - species: Fin-nibbling cichlids
      reason: "The long pelvic and tail filaments of the males invite nipping, so fish that pick at fins injure them."
profile:
  overview:
    text: "Benthochromis tricoti is a slender, large-eyed zooplankton feeder from the deep open water of Lake Tanganyika. Adult males are mauve-grey to bluish with two bright blue stripes along the flank and long trailing fins, and females are plain silvery grey. The species is rare in the hobby because it is hard to collect and ship and is costly. Many fish sold under its name were the sister species B. horii, described in 2008, so part of the keeping literature may concern that fish. B. tricoti needs a very large, long tank, calm tankmates and dim light. It suits experienced keepers who want a school of graceful open-water fish and accept that breeding rarely succeeds."
    sources:
      - kind: database
        title: "Seriously Fish: Benthochromis tricoti"
        url: "https://www.seriouslyfish.com/species/benthochromis-tricoti/"
        accessed: 2026-10-17
        archived: seriouslyfish.com/species/benthochromis-tricoti/2026-10-17T111714Z
      - kind: website
        title: Benthochromis tricoti 'Samazi' (tanganyika.si)
        url: "https://www.tanganyika.si/TanganjikaByLocations/Samazi/slides/Benthochromis%20tricoti%20%27Samazi%27.html"
        accessed: 2026-10-17
        archived: tanganyika.si/tanganjikabylocations/samazi/slides/benthochromis_tricoti__samazi_.html/2026-10-17T111801Z
      - kind: literature
        title: "Takahashi, T. (2008). Description of a new cichlid fish species of the genus Benthochromis from Lake Tanganyika. Journal of Fish Biology 72(3), 603-613 (abstract only)"
        url: "https://doi.org/10.1111/j.1095-8649.2007.01727.x"
        accessed: 2026-10-17
  habitat:
    text: "The species is endemic to Lake Tanganyika and is recorded from Burundi, DR Congo, Tanzania and Zambia. It lives in open water over the deeper parts of the lake, away from the rocky shore, above sandy or muddy bottoms. Depth reports differ: the type specimens were trawled at 100 to 125 m off Karema, museum material mostly comes from 40 to 85 m, and tanganyika.si places the highest abundance at about 160 to 200 m. The lake water is hard and strongly buffered, with a pH of 8.4 to 9.4, 10 to 13 dGH and 15 to 20 dKH. The lake temperature of 23 to 29 C includes the warm surface layer; the deep water where the species lives stays near the cool end of that range."
    sources:
      - kind: database
        title: "Seriously Fish: Benthochromis tricoti"
        url: "https://www.seriouslyfish.com/species/benthochromis-tricoti/"
        accessed: 2026-10-17
        archived: seriouslyfish.com/species/benthochromis-tricoti/2026-10-17T111714Z
      - kind: website
        title: Benthochromis tricoti 'Samazi' (tanganyika.si)

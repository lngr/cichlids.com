        url: "https://fao.org/fishery/static/LTR/FTP/TD46.PDF"
        archived: fao.org/fishery/static/ltr/ftp/td46.pdf/2026-10-14T094054Z
        accessed: 2026-10-12
  sizeAndGrowth:
    text: "In the aquarium adult males reach about 20 cm and females about 16 cm. FishBase lists 16.5 cm total length, a figure based on preserved specimens, and tanganyika.si gives up to 25 cm for males, which may include the larger B. horii. A keeper reports a male of more than 7 inches, about 18 cm, in a 240 gallon tank. Wild-caught juveniles arrive thin and silvery-brown at about 4 to 8 cm and take time to colour up. Males gain their long filaments, blue stripes and yellow throat only when mature and settled, while females stay plainer and smaller. Growth rates and the age at maturity are not documented."
    sources:
      - kind: database
        title: "FishBase: Benthochromis tricoti"
        url: "https://www.fishbase.se/summary/Benthochromis-tricoti.html"
        accessed: 2026-10-17
        archived: fishbase.se/summary/benthochromis-tricoti.html/2026-10-17T111709Z
      - kind: website
        title: "DRTA archive: Benthochromis tricoti"
        url: "https://www.drta-archiv.de/benthochromis-tricoti/"
        accessed: 2026-10-17
        archived: drta-archiv.de/benthochromis-tricoti/2026-10-17T111920Z
      - kind: forum
        title: "Cichlid-Forum thread, Benthochromis tricoti"
        url: "https://www.cichlid-forum.com/threads/benthochromis-tricoti.219633/"
        accessed: 2026-10-17
        archived: cichlid-forum.com/threads/benthochromis-tricoti.219633/2026-10-17T111824Z
  husbandry:
    text: "A group of six needs a tank of at least 150 cm length and 60 cm depth, about 540 L, and a longer tank is better. Keep most of the water column free of decor, use fine sand, keep the light subdued and provide some water movement. A few low rock piles are fine, but sharp rock is a risk because startled fish can injure their large eyes. A close-fitting cover is essential because frightened fish jump. Care sheets recommend 24 to 27 C, pH 7.5 to 9.0 and 10 to 25 dGH, and a stable temperature matters. Few sources state a carbonate hardness; a buffer of at least 8 dKH keeps the pH stable, and the lake itself has 15 to 20 dKH. Regular water changes and a fixed routine help the fish settle."
    sources:
      - kind: database
        title: "Seriously Fish: Benthochromis tricoti"
        url: "https://www.seriouslyfish.com/species/benthochromis-tricoti/"
        accessed: 2026-10-17
        archived: seriouslyfish.com/species/benthochromis-tricoti/2026-10-17T111714Z
      - kind: website

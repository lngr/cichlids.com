  temperatureC:
    value:
      min: 23
      max: 29
    confidence: high
    rationale: "Benthochromis tricoti is endemic to Lake Tanganyika, so the natural range is the lake range of 23 to 29 C. The FAO/FINNIDA buoy at Mpulungu recorded about 23.9 to 29.0 C near the surface, and the cooler south during upwelling sets the lower end. The species lives offshore below about 40 m, where the water stays near 23 to 24 C, so it meets the cool end of the range; FishBase gives 23 to 25 C for it, which lies inside the lake range. All four agents proposed the lake range."
    sources:
      - kind: literature
        title: "Plisnier, P.-D., Langenberg, V., Mwape, L., Chitamwembwa, D., Tshibangu, K. and Coenen, E. (1996). Limnological sampling during an annual cycle at three stations on Lake Tanganyika (1993-1994). FAO/FINNIDA Research for the Management of the Fisheries on Lake Tanganyika, GCP/RAF/271/FIN-TD/46."

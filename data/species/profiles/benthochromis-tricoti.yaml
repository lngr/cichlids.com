    tolerance:
      value:
        min: 22
        max: 29
      confidence: low
      rationale: "The vote is unanimous with 4 of 4 agreeing votes: generator, checker-a and checker-b proposed 22 to 29 C and checker-c 23 to 29 C, which lies within one degree. Care sheets recommend a narrow band in the mid twenties: Seriously Fish 24 to 27 C, DRTA and AquaInfo 24 to 26 C, the Cichlid-Forum profile 25 to 26 C, the Aquarium Wiki and Housaqua 25 to 27 C, TankFacts 24 to 28 C and Fishipedia 23 to 28 C; FishBase lists 23 to 25 C. The tolerance contains the natural lake range of 23 to 29 C, so its upper end lies above every care sheet and follows the surface maximum of the lake. The lower end of 22 C rests on the general practice of keeping Tanganyika cichlids and on the cool deep water the species inhabits; no source reports harm at either edge. Confidence stays low as the tally decided, because the edges are inferred rather than reported, and keepers aim for a stable 24 to 27 C."

    rationale: "The value is the median of the proposals: the generator, checker-a and checker-b proposed 20 cm for males and 16 cm for females, checker-c 18 and 15 cm. FishBase and Seriously Fish give 16.5 cm total length, a figure based on preserved specimens. Aquarium sources give larger males: DRTA 20 cm for males and 16 cm for females, AquaInfo, Fishipedia and the Aquarium Wiki about 20 cm, a keeper reports a male of more than 7 inches (about 18 cm), Housaqua 23 cm, and tanganyika.si and the Cichlid-Forum profile up to 25 cm. Much hobby material may concern the larger B. horii, so the highest figures are uncertain for this species. 20 and 16 cm lie inside the span of the sources and match the only source that sizes both sexes."

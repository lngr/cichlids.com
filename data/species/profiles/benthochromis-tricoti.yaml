      rationale: "Qualified majority of 4 of 6 votes: checker-a, checker-b, tiebreaker-1 and tiebreaker-2 proposed 8 to 25 dKH, while the generator proposed 12 to 22 and checker-c 10 to 20. The only species-specific figure is the DRTA care sheet with 12 to 18 dKH (15 to 18 in its text). The range is derived from the Seriously Fish advice of pH 7.5 to 9.0 and 10 to 25 dGH, since a pH of 7.5 or more needs a buffer of roughly 8 dKH, and from general Tanganyika practice: Aqulator advises 8 to 15 dKH, That Pet Place 12 to 15, guppys.life 12 to 25, and keepers report healthy Tanganyikans for years at about 10 to 14 dKH. The upper end follows the hardness ceiling of the species advice and has no measured basis. The range contains the natural 15 to 20 dKH. It is a derivation from related values, so confidence is low."

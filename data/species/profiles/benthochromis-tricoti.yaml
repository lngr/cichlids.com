        url: "https://cichlid-forum.com/profiles/species.php?id=1482"
        accessed: 2026-10-17
        archived: cichlid-forum.com/profiles/species.php/q-0d26463e/2026-10-17T111807Z
      - kind: forum
        title: "Cichlid-Forum thread, Benthochromis tricoti"
        url: "https://www.cichlid-forum.com/threads/benthochromis-tricoti.219633/"
        accessed: 2026-10-17

        url: "https://www.drta-archiv.de/benthochromis-tricoti/"
        accessed: 2026-10-17
        archived: drta-archiv.de/benthochromis-tricoti/2026-10-17T111920Z
  breeding:
    text: "The species is a maternal mouthbrooder. Males display at a spawning site, either a pit in the sand or a spot among flat stones. Clutches are very small, often 5 to 15 eggs, and the female broods for two months or more before releasing a few fry of about 2 cm. Aquarium spawnings occur, but raising fry is rare: keepers report that females spit the eggs after a short time or lose them in hectic tanks. One report links spawning to water changes. Many breeding records under this name may concern B. horii, so details differ between sources."
    sources:
      - kind: website
        title: Benthochromis tricoti 'Samazi' (tanganyika.si)
        url: "https://www.tanganyika.si/TanganjikaByLocations/Samazi/slides/Benthochromis%20tricoti%20%27Samazi%27.html"

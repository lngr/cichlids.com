partners:
  suitable:
    - species: Labeotropheus trewavasae
      reason: Robust rock grazer with a compatible plant-focused ration and a distinct body form.
      condition: "Conditional candidate in a tank larger than the johannii harem minimum, with room and refuges\
        \ for both adult social units; not a tested pairing guarantee."
    - species: Labeotropheus fuelleborni
      reason: Robust grazing mbuna with a different body shape; feeding requirements can overlap.
      condition: "Alternative to L. trewavasae, with a larger adult community footprint and separate refuges;\
        \ combining both Labeotropheus species adds their own hybrid risk."
    - species: Maylandia greshakei
      reason: Robust mbuna with a compatible plant-focused ration and a different pattern.
      condition: A larger community tank and separate rock shelters are needed; blue coloration can still provoke
        rivalry.
  unsuitable:
    - species: Pseudotropheus cyaneorhabdos
      reason: Close striped appearance invites rivalry and both species share the presumed melanochromis crossing
        group.
    - species: Melanochromis auratus
      reason: Strong aggression and overlapping appearance combine with shared presumed crossing risk.
    - species: Pseudotropheus interruptus
      reason: Close relative with difficult trade identification and plausible rivalry and crossing concerns;
        no secure free-choice cross was verified.
    - species: Aulonocara stuartgranti
      reason: "A quieter peacock may be excluded from shelter or feeding by active mbuna. Some care sheets\
        \ permit this, but it is not selected as a suitable pairing here."
profile:
  overview:
    text: "The name Pseudotropheus johannii applies to the Malawi mbuna whose mature males are usually blue-black\
      \ with pale longitudinal bands and whose females are yellow-orange. The older label Melanochromis johannii\
      \ remains widespread, along with the spelling johanni. Neither electric blue johanni nor a blue male\
      \ alone establishes identity: maingano, P. cyaneorhabdos, has blue-patterned females too, and P. interruptus\
      \ is another distinct relative. A known locality and traceable parent stock are useful when building\
      \ a breeding group. This small grazer can live with suitable other mbuna, but strong rivalry within its\
      \ own species makes adult stocking and shelter central to its care."
    sources:
      - kind: catalog-of-fishes
        title: "Eschmeyer's Catalog of Fishes: species of Pseudotropheus, online version updated 21 September\
          \ 2026"
        url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Pseudotropheus"
        archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-54fb6171/2026-10-14T101559Z
        accessed: '2026-10-13'
      - kind: literature
        title: "Konings, A. F. and Stauffer, J. R. (2012). Review of the Lake Malawi genus Melanochromis (Teleostei:\
          \ Cichlidae) with a description of a new species. Zootaxa 3258, 1-37."
        url: "https://doi.org/10.11646/zootaxa.3258.1.1"
        archived: doi.org/10.11646_zootaxa.3258.1.1/2026-10-13T071156Z
        accessed: '2026-10-13'
      - kind: database
        title: "FishBase: Pseudotropheus johannii species summary"
        url: "https://www.fishbase.se/summary/Pseudotropheus-johannii.html"
        archived: fishbase.se/summary/pseudotropheus-johannii.html/2026-10-14T102636Z

  sexing:
    text: "Established males usually have a blue-black body with pale blue longitudinal markings. Adult females\
      \ are yellow to orange and tend to be smaller. Young males begin with similar warm colors, and social\
      \ suppression can delay or mute the adult appearance. Some northern populations have reduced male bands,\
      \ so pattern alone is an imperfect identification test. Blue females in a mature group suggest maingano\
      \ or uncertain stock rather than confirming johannii. Orange females do not distinguish it from every\
      \ relative, including interruptus. Evaluate a mature group together with its locality and parent-stock\
      \ information."
    sources:

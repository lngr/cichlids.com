  temperatureC:
    value:
      min: 21
      max: 29
    confidence: high
    rationale: "The waterbody decision fixes the lake-wide seasonal envelope at 21 to 29 C for all Lake Malawi\
      \ endemics. Branchu reports campaign means of 24.48 to 26.15 C, the FAO compilation reports 23 to 25\
      \ C and Vollmer describes surface water reaching about 28 C with winter cooling below 24 C. Those narrower\
      \ measurements support the lake context without being misrepresented as its full extrema. The broader\
      \ prescribed envelope also draws on the Eccles and Ngochera work; their full texts were unavailable through\
      \ the permitted DOI tool, so they are not cited as directly read endpoint evidence."
    sources:
      - kind: literature
        title: "Branchu, P., Bergonzini, L., Ambrosi, J.-P., Cardinal, D., Delalande, M., Pons-Branchu, E.\
          \ et al. (2010). Hydrochemistry (major and trace elements) of Lake Malawi (Nyasa), Tanzanian Northern\
          \ Basin: local versus global considerations. Hydrology and Earth System Sciences Discussions 7, 4371-4409."
        url: "https://doi.org/10.5194/hessd-7-4371-2010"
        archived: doi.org/10.5194_hessd-7-4371-2010/2026-10-13T071931Z
        accessed: '2026-10-13'

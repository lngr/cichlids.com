    confidence: high
    rationale: "Generator proposed an eastern-shore range with Cape Ngombo, Masinje, Gome, Chiloelo, Chuanga\
      \ and Metangula; checker-a retained Masinje and Cape Ngombo, checker-b added Chuanga and checker-c added\
      \ Gome Rock. The Catalog establishes the native lake and type locality, while the Nordic register, Malawi.si\
      \ and AquaInfo independently support the wider eastern-shore distribution. Their locality records are\
      \ combined and the waterbody identifier is normalized to lake-malawi; introduced populations are excluded."

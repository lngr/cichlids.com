    tolerance:
      value:
        min: 21
        max: 29
      confidence: low
      rationale: "Generator, checker-a, checker-b and checker-c all proposed 21 to 29 C, retained by unanimous\
        \ tally agreement with low confidence. The range includes the full natural envelope by rule. Seriously\
        \ Fish recommends 23 to 27 C, Aqua-Fish 22 to 27 C, AquaInfo 22 to 26 C and the Nordic register and\
        \ Aquario 23 to 28 C. Glaser instead favors 26 to 28 C. These recommendations do not demonstrate lifelong\
        \ captive health at 21 or 29 C; stable routine maintenance around 24 to 26 C is better supported."

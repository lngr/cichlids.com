  sizeAndGrowth:
    text: "Use approximately 12 cm for an aquarium male and 10 cm for a female when planning adult space. The\
      \ female figure is a rounded estimate and publications mix standard length, total length and unspecified\
      \ aquarium measurements. Avoid treating these sizes as feeding targets. Juvenile males initially resemble\
      \ yellow-orange females, and rivalry can intensify when adult coloration appears. Fish that coexist while\
      \ small may later need different housing. Lifespan estimates span roughly 5 to 12 years, with no reliable\
      \ cohort study behind either endpoint; individual outcomes depend on care and are not guaranteed by that\
      \ range."

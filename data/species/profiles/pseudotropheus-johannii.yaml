  problems:
    text: "Repeated pursuit, damaged fins and exclusion from feeding are reasons to reassess adult space, refuges\
      \ and sex ratio. Young fish tolerating one another does not establish a lasting adult community. Rich\
      \ feeding, stress and poor water quality can coincide with digestive illness; abdominal swelling and\
      \ appetite loss alone do not identify a cause. Check water conditions and seek qualified help for persistent\
      \ signs. Archive accounts describe uncertain trade identity and individual illness, but cannot confirm\
      \ parentage or diagnose a disease. Keep new stock separate while assessing its health and identity before\
      \ introducing it to a breeding group."

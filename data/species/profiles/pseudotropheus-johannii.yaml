  habitat:
    text: "Native populations occur along the eastern shore of Lake Malawi in Malawi and Mozambique, including\
      \ Cape Ngombo, Masinje and localities toward Chuanga. They use rocky stretches and the adjoining sand-rock\
      \ transition. Plankton feeding above the bottom does not make them open-water specialists. Provide feeding\
      \ surfaces on rocks, individual refuges and sandy gaps for movement. The lake-wide natural envelope is\
      \ 21 to 29 C, pH 7.7 to 8.6, GH 3 to 5 dGH and KH 5 to 8 dKH. Calcium and magnesium hardness is low even\
      \ though the lake is alkaline and buffered; GH and KH therefore need separate interpretation."

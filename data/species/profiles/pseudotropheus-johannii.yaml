    confidence: high
    rationale: The waterbody decision retains 3 to 5 dGH. Branchu calcium and magnesium measurements give about
      4.2 to 4.6 dGH; the historical concentrations compiled by FAO span about 3.5 to 4.9 dGH. The rounded
      lake envelope reflects these measurements. Alkaline pH and bicarbonate buffering do not imply high calcium
      and magnesium hardness.

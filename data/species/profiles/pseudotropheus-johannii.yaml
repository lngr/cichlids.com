variants:
  - name: Gome
    kind: locality
    note: Traceable eastern-shore population with the familiar striped males; recorded in the Nordic register
      and Malawi.si.
  - name: Chiloelo
    kind: locality
    note: Recognized collection locality in Mozambique; retain provenance rather than treating it as a separate
      species.
  - name: Chiofu
    kind: locality
    note: Listed collection locality; no separate husbandry values are established.
  - name: Chuanga
    kind: locality
    note: Northern population; Malawi.si reports that males may have reduced or absent pale lateral bands.
  - name: Metangula
    kind: locality
    note: Northern population with reported reduction of male stripes. It is not the maingano form.

  husbandry:
    text: >-
      Plan a 300 litre aquarium with a base of at least 120 by 47.5 cm for one male and at least
      three females. Smaller recommendations exist, but this profile chooses more room for
      shelter and escape during adult pursuit. Build stable rock formations with several routes
      between refuges and clear gaps for swimming. Biological filtration, oxygenation and
      regular partial water changes support the stocking. A steady temperature near 24 to 26 C
      is a practical routine target. The decided aquarium envelopes are 21 to 29 C, pH 7.5 to
      8.8, GH 3 to 20 dGH and KH 5 to 15 dKH; these inferred limits do not demonstrate lifelong
      health at every endpoint. Measure each parameter and match replacement water gradually.
    sources:

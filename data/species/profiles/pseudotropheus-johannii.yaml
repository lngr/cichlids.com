    rationale: "Generator, checker-a, checker-b and checker-c all proposed [melanochromis], fixed by unanimous\
      \ agreement with medium confidence. Seriously Fish and the Nordic register independently warn against\
      \ crossing with species historically called Melanochromis, and Oliver gives the corresponding genus warning\
      \ for auratus. The existing group already includes Pseudotropheus johannii and has basis presumed. Neither\
      \ the 2012 taxonomic transfer nor general laboratory hybrid fertility proves a free-choice cross involving\
      \ this species. Archive thread 1510 claims a socolofi cross without secure identity or partner-choice\
      \ information. Fish Laboratory also claims johannii-cyaneorhabdos hybrids without documenting an event;\
      \ this does not change the decided group or justify a new one."

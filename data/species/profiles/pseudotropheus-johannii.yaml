  compatibility:
    text: "Mixed keeping is possible with robust, visibly distinct Malawi mbuna that share a plant-focused\
      \ feeding plan. Labeotropheus trewavasae, L. fuelleborni and Maylandia greshakei are conditional candidates\
      \ in a larger tank, based on the feeding and community guidance rather than a tested pairing guarantee.\
      \ They are alternatives, and the two Labeotropheus species add their own crossing risk if combined. Close\
      \ striped fish can provoke rivalry. P. cyaneorhabdos and Melanochromis auratus share the presumed melanochromis\
      \ crossing group with johannii. The warning rests on general crossing advice, with no free-choice johannii\
      \ cross established by the sources read. Very small fish and fry may still be taken opportunistically."

  diet:
    text: "Algae and the associated material on rocks are the main basis of the natural feeding niche. A small\
      \ field sample reported through FishBase contained only algal categories, while other accounts also record\
      \ plankton and small invertebrates. Use vegetable-rich mbuna food as the staple, with modest animal supplements\
      \ rather than a rich meaty daily ration. The data category is aufwuchs even though several sources use\
      \ omnivore. The bloat-sensitivity flag expresses reported husbandry concern, not proof that protein alone\
      \ causes disease. Offer restrained portions and check that subordinate fish obtain food; rapid feeding\
      \ is an inferred mbuna trait rather than a measured species-specific result."

  breeding:
    text: "The female carries eggs and developing young in her mouth, while the male may court other females.\
      \ Schwarze reported two releases after 19 and 20 days; care sheets commonly describe about three weeks.\
      \ Disturbance and harassment can disrupt incubation, so any move of a brooding female needs care. Reports\
      \ differ about taking released young back into the mouth: some describe further shelter and the first-hand\
      \ breeding account did not observe it. Do not assume released fry are safe among adults. Fine prepared\
      \ food or Artemia nauplii can support their growth in protected rearing space. A breeding tank may protect\
      \ fry without making species-only maintenance necessary throughout life."
    sources:
      - kind: literature
        title: "Schwarze, K. Breeding Melanochromis johannii. Hamilton and District Aquarium Society breeding\

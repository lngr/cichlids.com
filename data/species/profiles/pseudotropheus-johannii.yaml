  socialBehavior:
    text: "One male with at least three females is the minimum social unit used here. Each female needs cover\
      \ that interrupts a pursuing male's view. Additional adult males require substantially more space and\
      \ separate refuges; adding them to the minimum tank can turn repeated chasing into injury. The male may\
      \ defend a rocky site outside an immediate spawning event, although the size of that claim has not been\
      \ measured. The small-territory classification is provisional. Observe access to food and shelter as\
      \ well as visible wounds, since a fish confined to one corner can already be under sustained pressure."

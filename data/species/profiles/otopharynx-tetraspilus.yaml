        accessed: '2026-10-15'
        archived: fishi-pedia.com/fishes/otopharynx-tetraspilus/2026-10-15T093523Z
  breeding:
    text: "The female incubates eggs and young in her mouth. Spawning occurs over a small sand depression; the male\
      \ displays and fertilization accompanies egg collection. Reports describe broods held for about 20 days to\
      \ three weeks, with brood size varying between females. A holding female may eat little or nothing and benefits\
      \ from quiet retreats. Released fry accept small prepared foods and Artemia nauplii. The parents do not form\
      \ a lasting pair."
    sources:
      - kind: literature
        title: "Cichlid Room Companion: Otopharynx tetraspilus (Trewavas, 1935)"
        url: "https://cichlidae.com/article.php?id=JXpS9-KAoi8EVDJBB_qTcA"

  problems:
    text: "Restricted floor space and too few female retreats can turn courtship into chronic stress. Watch for\
      \ persistent hiding, lost condition and repeated exclusion from food. Avoid overfeeding and maintain oxygenation\
      \ and filtration. The broad FishBase environmental temperature and hardness figures do not establish safe\
      \ long-term extremes. No species-specific numerical KH trial underlies the selected tolerance, and no special\
      \ bloat susceptibility is established. Trade-name ambiguity and presumed congener crossing risk also matter\
      \ when preserving identifiable breeding stock."

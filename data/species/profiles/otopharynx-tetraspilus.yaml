  temperatureC:
    value:
      min: 21
      max: 29
    confidence: high
    rationale: "The settled lake decision is 21 to 29 C. Eccles reports 21 C inshore in the South-East Arm and about\
      \ 27 C in the upper layer by May; Vollmer describes summer surfaces near 28 C and winter values below 24 C.\
      \ The prescribed lake-wide seasonal envelope includes shallow-water variation. FishBase lists the wider 23\
      \ to 37 C environmental span, which does not establish long-term health at its upper end."

  sizeAndGrowth:
    text: "Allow for adult males around 16 cm and females around 13 cm. These are aquarium planning sizes; source\
      \ figures vary with sex and the fish observed. Young fish grow readily on appropriate portions, but strong\
      \ male colour develops later than basic body growth. A lifespan of 8 to 10 years is a low-confidence planning\
      \ estimate centred on care sheets that give ten years, rather than a measured survival interval."

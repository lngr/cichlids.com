        archived: malawi.si/slides/lake_malawi_aquarium_setup.html/2026-10-14T094756Z
  socialBehavior:
    text: "One male with three females is the selected aquarium unit. Males are often comparatively placid outside\
      \ reproduction, but courtship brings stronger colour, local territoriality and chasing. Provide several retreats\
      \ and sight breaks so females can leave the male's immediate area. Rival males need substantially more space\
      \ and may remain subdued. With dissimilar companions the usual behaviour is local display or avoidance, although\
      \ breeding defence can escalate."
    sources:
      - kind: literature
        title: "Cichlid Room Companion: Otopharynx tetraspilus (Trewavas, 1935)"
        url: "https://cichlidae.com/article.php?id=JXpS9-KAoi8EVDJBB_qTcA"

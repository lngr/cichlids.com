  husbandry:
    text: "Provide about 500 litres, at least 150 cm length and approximately 55 cm front-to-back space for one\
      \ male with three females. The depth is an inferred layout allowance. A mixed community needs more space;\
      \ Malawi-Guru starts such stocking near 600 litres. Leave a broad sand foreground, secure scattered rockwork\
      \ and plant cover that offer retreats without blocking swimming. Use effective biological filtration, aeration\
      \ and regular partial water changes. Test both GH and KH rather than treating them as the same property. Common\
      \ care recommendations cluster near 23 to 28 C; the broader recorded tolerances describe an uncertain keeping\
      \ envelope and are not targets for constant extremes."
    sources:
      - kind: website
        title: "Einrichtungsbeispiele: Otopharynx tetraspilus care profile"
        url: "https://www.einrichtungsbeispiele.de/zierfische/malawisee/otopharynx-tetraspilus-slnk.html"

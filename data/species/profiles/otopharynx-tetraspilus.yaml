        accessed: '2026-10-15'
        archived: borstein.info/profiles/malawi/ototetra.html/2026-10-15T093620Z
      - kind: database
        title: "Cichlid Room Companion: Otopharynx tetraspilus"
        url: "https://cichlidae.com/species.php?id=nVzCyeDoYbalsCBfqE_pnw"
        accessed: '2026-10-15'
        archived: cichlidae.com/species.php/q-4e0a09a2/2026-10-15T093516Z
      - kind: website
        title: "Einrichtungsbeispiele: Otopharynx tetraspilus care profile"
        url: "https://www.einrichtungsbeispiele.de/zierfische/malawisee/otopharynx-tetraspilus-slnk.html"
        accessed: '2026-10-15'
        archived: einrichtungsbeispiele.de/zierfische/malawisee/otopharynx-tetraspilus-slnk.html/2026-10-15T093534Z
  sexing:
    text: "Mature males are larger and show a blue head, blue-grey body, variable yellow areas and a pale dorsal-fin\
      \ blaze. Females and juveniles are less colourful, with dark flank blotches and smaller marks near the dorsal-fin\
      \ base. A trade name or a simple spot count does not resolve every similar Otopharynx form. Juvenile colour\
      \ alone is an uncertain way to assemble a harem; adult appearance and reliable stock identification are more\
      \ informative."
    sources:
      - kind: literature
        title: "Cichlid Room Companion: Otopharynx tetraspilus (Trewavas, 1935)"
        url: "https://cichlidae.com/article.php?id=JXpS9-KAoi8EVDJBB_qTcA"
        accessed: '2026-10-15'
        archived: cichlidae.com/article.php/q-42906d76/2026-10-15T093558Z
      - kind: website
        title: "Sam Borstein's Cichlids: Otopharynx tetraspilus"
        url: "http://www.borstein.info/profiles/malawi/ototetra.html"
        accessed: '2026-10-15'
        archived: borstein.info/profiles/malawi/ototetra.html/2026-10-15T093620Z
      - kind: database
        title: "Otopharynx tetraspilus, Lake Malawi cichlids by location, malawi.si"
        url: "https://malawi.si/Malawi/Otopharynx/Otopharynx%20tetraspilus/slides/Otopharynx%20tetraspilus.html"
        accessed: '2026-10-15'
        archived: malawi.si/malawi/otopharynx/otopharynx_tetraspilus/slides/otopharynx_tetraspilus.html/2026-10-15T093515Z
  compatibility:
    text: "Choose Malawi companions of suitable size and manageable temperament, with space for each breeding area.\
      \ Aquarium reports include Labidochromis caeruleus, Cyrtocara moorii, Aulonocara stuartgranti and Placidochromis\
      \ phenochilus. These examples depend on tank size and individual behaviour. Forceful territorial mbuna can\
      \ overwhelm this fish, while large piscivores can endanger smaller specimens. The otopharynx hybrid caution\
      \ rests on general warnings about congeners; it does not document a named cross involving tetraspilus."
    sources:
      - kind: literature
        title: "Cichlid Room Companion: Otopharynx tetraspilus (Trewavas, 1935)"
        url: "https://cichlidae.com/article.php?id=JXpS9-KAoi8EVDJBB_qTcA"
        accessed: '2026-10-15'
        archived: cichlidae.com/article.php/q-42906d76/2026-10-15T093558Z

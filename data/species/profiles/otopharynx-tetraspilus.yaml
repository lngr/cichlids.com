        accessed: '2026-10-15'
        archived: fishi-pedia.com/fishes/otopharynx-tetraspilus/2026-10-15T093523Z
  diet:
    text: "Treat the fish as an omnivore with a substantial plant component. Wild food summaries include algae,\
      \ plant fragments and small crustaceans. Offer a varied prepared cichlid diet with plant-based ingredients\
      \ and appropriately sized invertebrate foods such as Artemia or mysis. Fishipedia's herbivore label and other\
      \ grazing descriptions emphasize the plant side, while the mixed wild food records support omnivory. Fish\
      \ are not established routine prey, but exposed fry can suffer incidental losses. Measured portions help maintain\
      \ body condition and water quality."
    sources:

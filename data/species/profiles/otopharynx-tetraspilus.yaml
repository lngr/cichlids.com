partners:
  suitable:
    - species: Labidochromis caeruleus
      reason: Marcel reports compatible mixed keeping with this relatively mild mbuna.
      condition: "Ample sand and swimming room, protected female retreats and a tank larger than the harem minimum."
    - species: Cyrtocara moorii
      reason: Marcel reports this among compatible Malawi companions with a broadly manageable temperament.
      condition: A larger community aquarium sized for both adult groups.
    - species: Placidochromis phenochilus
      reason: A reported companion in Marcel's aquarium account.
      condition: Extra floor space and observation of breeding territoriality.
    - species: Aulonocara stuartgranti
      reason: A reported companion with compatible Malawi care requirements.
      condition: A spacious community aquarium with visual separation between breeding areas.
  unsuitable:
    - species: Other Otopharynx species
      reason: The presumed otopharynx group flags possible congener hybridization from general hobby warnings; no
        particular tetraspilus cross is verified.
    - species: Melanochromis auratus
      reason: Forceful territorial mbuna can place a relatively placid hap under chronic pressure.
    - species: Large piscivorous Malawi cichlids
      reason: Juveniles and much smaller individuals can be prey; adult suitability depends on the actual predator
        and size difference.
profile:
  overview:
    text: "Otopharynx tetraspilus is a spotted haplochromine from southern Lake Malawi and the upper Shire system.\
      \ Aquarium males develop blue and grey tones with yellow areas and a pale dorsal edge; females retain subdued\
      \ brown or silver tones with dark markings. Yellow Fin Mloto and Yellow Princess are trade names associated\
      \ with it. Similar names also accompany other Otopharynx forms, so identity matters when choosing breeding\
      \ stock."
    sources:
      - kind: database
        title: "Otopharynx tetraspilus, Lake Malawi cichlids by location, malawi.si"

  habitat:
    text: "The species occupies shallow sheltered bays with vegetation above sandy bottom. Malawi.si describes beds\
      \ of Vallisneria and Ceratophyllum, while Malawi-Guru also reports the rocky transition zone and neighbouring\
      \ sand. Its natural water envelope is 21 to 29 C, pH 7.7 to 8.6, GH 3 to 5 dGH and KH 5 to 8 dKH. Calcium-magnesium\
      \ hardness is low even though bicarbonate provides substantial buffering. Open swimming clearance in an aquarium\
      \ complements this bottom-associated habitat."

variants:
  - name: "Makobe Island"
    kind: "locality"
    note: "Documented population used in ecological and mate-choice studies. Keep a traceable collection line."
  - name: "Ruti Island"
    kind: "locality"
    note: "Widely traded collection label; listed by the Nordic register and FishFish."
  - name: "Mwanza red"
    kind: "locality"
    note: "Aquarium locality label illustrated by AquaInfo, not a separately described taxon."
  - name: "Python Island"
    kind: "locality"
    note: "Historical aquarium nyererei label. Genomic literature distinguishes the population as Pundamilia sp.
      'nyererei-like'; do not assume equivalence to Makobe fish or mix these lines."
  - name: "Luanso Island"
    kind: "locality"
    note: "Historical trade label for a colour-variable population with evidence of admixture. Identification as
      pure P. nyererei is not established."

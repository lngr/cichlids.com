      rationale: "Generator, checker-a, checker-b, tiebreaker-1 and tiebreaker-2 propose 1 to 15 dGH; checker-c
        proposes 1 to 20 dGH. The tally fixes 1 to 15 dGH by qualified majority, 5 of 6, with low confidence.
        Seriously Fish gives 4 to 15 dGH, FishFish 9 to 12 dGH and Akvazin a soft-water point of 1.5 dGH.
        Uncle Bill's 72 to 270 ppm converts to about 4.04 to 15.13 dGH if it means CaCO3 equivalents. The
        lower endpoint contains the natural 1 to 3 dGH. FishProfiles gives the wider 15 to 20 dH
        recommendation; AquaBota gives 8 to 16 dGH, NageoireBleue 8 to 18 dGH, and Fishkeeper an upper limit
        of 25 dH without a lower bound. These higher ceilings have no documented long-term endpoint tests and
        do not overturn the decided upper limit. AquaExperience gives the narrower 5 to 12 dGH band but has
        unrelated factual inconsistencies."

  problems:
    text: "Repeated pursuit and lack of escape routes are common causes of poor condition. Check whether every
      fish can feed and rest away from the dominant male before adding more stock. Maintain clean, oxygenated
      water and quarantine new arrivals. Appetite loss, abdominal swelling or unusual breathing need
      investigation rather than being automatically labelled bloat. Seek qualified fish-health advice when
      symptoms persist. Mixed collection lines and unverified trade names are another avoidable problem,
      especially when offspring are distributed as a pure population."

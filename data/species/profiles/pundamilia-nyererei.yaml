  sizeAndGrowth:
    text: "Plan for an adult male around 12 cm and a female around 9 cm in total length. The female figure is
      approximate and chiefly supported by one collaborative aquarium record. FishBase's 7.7 cm and Seriously
      Fish's 8 cm figures use standard length and leave out the tail. Young or subordinate males can remain
      inconspicuous until social conditions change. The retained lifespan estimate is 5 to 7 years with low
      confidence; published care estimates span 3.5 to 10 years and lack verified long-term survival records."

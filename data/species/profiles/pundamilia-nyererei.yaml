  breeding:
    text: "The female collects the eggs and incubates them in her mouth, commonly for about three weeks. The male
      defends the spawning area and does not form a parenting pair. A brooding female needs quiet cover and
      protection from repeated pursuit; returning an isolated female can require careful observation of the
      established group. Newly released fry can take Artemia nauplii and suitably fine prepared foods.
      Although predation is classified as level 0, chance fry consumption is possible and keeper reports
      include deliberate fry taking, so successful grow-out should not depend on adults leaving every young
      fish unharmed."

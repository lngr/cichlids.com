      rationale: "Generator and checker-b propose large with breedingOnly false; checker-a proposes small with
        false; checker-c proposes small with true. Retain large and false as a cautious spatial-planning
        inference from persistent dominance and territorial accounts. Maan and colleagues directly measured
        defended areas across repeated days and recorded many rocks per territory, but the accessible text
        does not supply a clear aquarium-equivalent boundary for the 30 cm versus 50 cm rubric. A spawning

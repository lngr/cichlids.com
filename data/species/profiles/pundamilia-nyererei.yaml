partners:
  suitable:
    - species: "Selected robust Lake Victoria cichlids"
      reason: "Seriously Fish and the Nordic register permit a carefully chosen community; this is a group-level
        option rather than a tested guarantee for any named pair."
      condition: "Use distinctly patterned, similarly sized adults with matching feeding and water requirements,
        their own social groups and separate retreats in a tank larger than the 250 L harem minimum; exclude
        the four listed crossing partners."
  unsuitable:
    - species: "Pundamilia pundamilia"
      reason: "Documented wild admixture creates a crossing conflict, even though some full-spectrum choice trials
        show strong isolation."
    - species: "Pundamilia igneopinnis"
      reason: "Genetically assigned hybrids occurred when females could also choose males of their own species."
    - species: "Pundamilia azurea"
      reason: "Fertile forced laboratory crosses support a presumed pairwise risk; a free-choice trial found no
        crossing between pure parents."
    - species: "Haplochromis chilotes"
      reason: "Fertile forced laboratory F1 and F2 crosses support a presumed pairwise risk. The older
        Paralabidochromis chilotes recommendation is removed from suitable partners."
    - species: "Pundamilia sp. 'crimson tide'"
      reason: "Aquarium warnings and uncertain keeper reports support a presumed crossing risk; parental identity
        and free partner choice are unconfirmed."
    - species: "Small or timid community fish"
      reason: "Persistent territorial pressure and unequal feeding access make these unsuitable, independently of
        the decided predation level 0."
profile:
  overview:
    text: "This red-backed cichlid inhabits rocky parts of southern Lake Victoria in Tanzania. Adult males combine
      conspicuous colour with strong territorial behaviour, so its small size does not make it a peaceful
      community fish. A single male with several females is the usual aquarium unit. The species is also a
      major research system for female mate choice, speciation and hybridization. Collection records matter:
      some fish historically labelled Python Island or Luanso nyererei represent distinct or admixed lineages
      rather than a verified population of the nominal species."
    sources:
      - kind: "catalog-of-fishes"
        title: "Eschmeyer's Catalog of Fishes: species of Pundamilia, updated 21 September 2026"
        url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Pu\
          ndamilia"
        archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-6dbe7142/2026-10-14T102808Z
        accessed: "2026-10-13"
      - kind: "literature"
        title: "Meier et al. (2017). Demographic modelling with whole-genome data reveals parallel origin of similar
          Pundamilia cichlid species after hybridization. Molecular Ecology."
        url: "https://doi.org/10.1111/mec.13838"
        archived: doi.org/10.1111_mec.13838/2026-10-13T153043Z
        accessed: "2026-10-13"
      - kind: "literature"
        title: "Meier et al. (2018). Genomics of Parallel Ecological Speciation in Lake Victoria Cichlids"
        url: "https://doi.org/10.1093/molbev/msy051"
        archived: doi.org/10.1093_molbev_msy051/2026-10-13T153653Z
        accessed: "2026-10-13"
      - kind: "literature"
        title: "Svensson et al. (2023, volume published 2024). Sympatry and parapatry among rocky reef cichlids of
          Lake Victoria explained by female mating preferences."
        url: "https://doi.org/10.1093/jeb/voad006"
        archived: doi.org/10.1093_jeb_voad006/2026-10-13T153046Z
        accessed: "2026-10-13"
  habitat:
    text: "Rocks provide shelter and male spawning territories; females also forage in the water above the reef.
      Makobe and Ruti are representative study localities. Older databases often give a depth band of 1 to 4
      m, while Maan and colleagues observed Makobe male territories at about 4 to 7 m, so depth varies by
      population and sampling context. Lake Victoria is naturally soft, with the decided lake-wide ranges of 1
      to 3 dGH and 2 to 6 dKH. Its temperature and pH ranges combine different places and seasons and should
      not be treated as constant conditions at every island."
    sources:
      - kind: "literature"
        title: "Svensson et al. (2023, volume published 2024). Sympatry and parapatry among rocky reef cichlids of
          Lake Victoria explained by female mating preferences."
        url: "https://doi.org/10.1093/jeb/voad006"

      rationale: "All four full-profile runs agree on invertivore and bloatSensitive false; the tally is unanimous,
        4 of 4, with medium confidence. Bouton's feeding abstract and the studies by Maan, Henning and
        Svensson support a diet dominated by plankton and other invertebrates. FishBase and several care
        databases use omnivore because algae and plants also occur; its two older diet records report plant
        contributions of 55 and 69 percent, so the category must not imply an exclusively animal diet.
        FishProfiles discourages high protein without documenting a specific bloat syndrome. False means that
        the special high-protein conflict flag is not established, not that digestive disease is impossible.
        Food-list wording differs among generator, checker-a, checker-b and checker-c; preserve the generator
        list exactly as the tally decides."
    - field: "features.hybridGroups"
      proposals:
        - by: "generator"
          value:
            - "pundamilia-nyererei-pundamilia"

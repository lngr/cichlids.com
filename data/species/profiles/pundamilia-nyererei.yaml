  hybridGroups:
    value:
      - "haplochromis-chilotes-pundamilia-nyererei"
      - "pundamilia-nyererei-azurea"
      - "pundamilia-nyererei-igneopinnis"
      - "pundamilia-nyererei-pundamilia"
      - "pundamilia-nyererei-sp-crimson-tide"
    confidence: "low"
    rationale: "The tally applies the conservative rule after six votes fail to reach a four-vote majority.
      Generator proposes the three nyererei pairs with pundamilia, igneopinnis and azurea; checker-a proposes
      a single nyererei-complex group; checker-b and tiebreaker-2 propose those three pairs plus chilotes;
      checker-c proposes only the pundamilia pair; tiebreaker-1 proposes all four pairs plus calliptera.
      Retain the union of identifiers supported by at least two runs, giving exactly the four decided pairs
      and low confidence with 2 of 6 agreeing on the whole set. The complex identifier and calliptera
      identifier each have only one vote and are excluded. Meier and colleagues infer wild nyererei-pundamilia
      admixture, supporting documented basis. Svensson and colleagues genetically confirm nyererei-igneopinnis
      mating with conspecific males available, also documented. The azurea and chilotes crosses were forced
      without conspecific male choice, so their basis is presumed; Svensson's free-choice experiment found no
      pure nyererei-azurea mating. Stelkens (2009) explicitly labels a calliptera cross as nyererei, whereas
      the 2019 study uses the distinct nyererei-like lineage; this identity discrepancy remains unresolved and
      exclusion by the tally support rule must not be read as proof of incompatibility. The presumed
      pundamilia-nyererei-sp-crimson-tide group rests on aquarium warnings and uncertain keeper reports, and is
      defined in the curated hybrid group file. Crossing is not transitive."

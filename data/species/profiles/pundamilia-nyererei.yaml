  sexing:
    text: "Mature males are larger and usually display red dorsal areas, yellow flanks, black vertical bars and
      locality-dependent blue highlights. Females tend to remain grey-brown with less intense markings.
      Juvenile and subordinate males may resemble females, so colour alone is unreliable in a newly acquired
      group. Anal-fin egg spots can help when considered with size, behaviour and mature colour, but
      collection records are necessary for identifying a locality line."

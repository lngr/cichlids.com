  ph:
    value:
      min: 6.8
      max: 9.4
    confidence: "high"
    rationale: "The decided lake-wide range is pH 6.8 to 9.4. FAO reports open-lake pH 8.0 to 8.5 and gulf values
      up to 9.0; Orina and colleagues report beach means of 7.08 to 9.3, with uncertainty reaching 9.4. The
      BCO-DMO series spans 6.7 to 9.0, wider at the lower end than the retained range; that low harbour
      endpoint is excluded from the curated envelope. Photosynthesis, place and sampling time affect pH."

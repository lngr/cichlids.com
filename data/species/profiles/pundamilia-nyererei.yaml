  husbandry:
    text: "Provide at least 250 litres with a 120 by 45 cm base for one male and three females. Stable rocks,
      several exits from refuges and complete breaks in sight lines are more useful than extra tank height.
      Keep an established filter, good oxygenation and regular partial water changes. Routine temperatures
      around 24 to 26 C and a stable pH within the central alkaline care bands have stronger husbandry support
      than continuous exposure to the natural extremes. The recorded tolerance envelopes are 22 to 30 C, pH
      6.8 to 9.4, 1 to 15 dGH and 2 to 12 dKH, all with low confidence. Habitat inclusion supplies some outer
      endpoints; they are not proven permanent aquarium setpoints."

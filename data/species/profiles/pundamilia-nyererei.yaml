      rationale: "Generator and checker-b propose 3; checker-a and checker-c propose 2. Choose 3 as a cautious
        aquarium classification because FishFish reports substantial attacks on community fish and
        FishProfiles describes extreme aggression toward other haplochromine males. AquaInfo reports good
        coexistence with unlike patterns and the archive describes only one dominant individual. The evidence
        is variable, but it supports robust, similarly sized adult companions rather than assuming all
        aggression stays within a small territory. Proposals: generator 3; checker-a 2; checker-b 3; checker-c
        2."

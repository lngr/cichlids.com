        male: 12
        female: 9
      rationale: "Generator, checker-b and checker-c propose male 12 cm and female 9 cm; checker-a proposes 11 and 9
        cm. Retain 12 and 9 cm as typical aquarium planning maxima: FishFish gives these sex-specific figures,
        while AquaInfo and the Nordic register support about 12 cm without separating sexes. The female
        maximum rests chiefly on one collaborative record and is approximate. FishBase gives 7.7 cm SL and
        Seriously Fish 8 cm SL, excluding the tail; these are not directly comparable total lengths. The
        multi-species mating study reports initial males at 9.9 to 10.9 cm TL and spawning females at 6.5 to
        9.7 cm TL, a wider female range than the retained 9 cm typical value but not a species-specific
        maximum series. The hobby claim of 17.8 cm aquarium males is excluded as atypical and poorly
        supported. Proposals: generator {\"male\":12,\"female\":9}; checker-a {\"male\":11,\"female\":9};
        checker-b {\"male\":12,\"female\":9}; checker-c {\"male\":12,\"female\":9}."

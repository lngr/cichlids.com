  diet:
    text: "Plankton and other small invertebrates dominate the stronger ecological accounts, so the retained
      category is invertivore. Algae also occur in recorded diets, and some databases use the broader label
      omnivore. Offer a balanced prepared cichlid food with plant ingredients alongside suitable invertebrate
      foods such as Artemia, Daphnia and insect larvae. Spread small portions across several feeding points so
      females receive food. The special high-protein bloat-sensitivity flag is not established, although
      excessive feeding and an unbalanced ration can still cause problems."

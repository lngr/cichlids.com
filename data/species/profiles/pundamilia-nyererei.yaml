  ghDgh:
    value:
      min: 1
      max: 3
    confidence: "high"
    rationale: "The decided lake-wide range is 1 to 3 dGH. FAO records historical calcium of 5 to 7 mg/L and
      magnesium of 2.3 to 3.5 mg/L, equivalent to 1.23 to 1.79 dGH using Ca/7.14 + Mg/4.34. Its Talling and
      Talling record gives about 1.38 dGH. These open-lake values support naturally soft water; the decided
      rounded lake-wide envelope also includes gulf measurements. Alkalinity must not be substituted for
      calcium and magnesium hardness."

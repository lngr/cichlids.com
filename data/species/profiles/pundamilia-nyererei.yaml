        propose level 0. The tally decides 0 by qualified majority, 4 of 6, with medium confidence. Bouton's
        feeding-study abstract, Maan's field study and Henning's ecological account identify zooplankton and
        insects as main prey; FishBase reports algae and insects, without fish items. This fits level 0 with
        chance fry uptake still possible. Akvazin includes small fish among feeds and two keeper reports
        describe fry being eaten; these low-weight observations explain the level-1 proposals but do not
        override the decided vote. Level 0 is a rubric interpretation, not proof that fry are always safe."

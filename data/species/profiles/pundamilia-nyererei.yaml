  socialBehavior:
    text: "A male may repeatedly chase rivals and females and can dominate much of the aquarium. Use at least
      three females per male and enough retreats for a persecuted fish to disappear from view. Rival adult
      males need substantially more room and should not be assumed safe in the minimum harem tank. Juveniles
      raised together can become less tolerant as they mature. Watch for damaged fins, continual hiding and
      missed meals, and provide a separate place for a fish that cannot escape pursuit."

  compatibility:
    text: "Selected robust cichlids with different patterns may share a larger, well-structured aquarium when
      feeding and water requirements overlap. The species-only flag is false, but a small harem tank is not a
      general community minimum. Avoid small or timid fish because territorial attacks and poor access to food
      remain concerns even at predation level 0. The crossing pairs with pundamilia and igneopinnis have
      documented evidence. Azurea and Haplochromis chilotes carry presumed risks from fertile forced
      laboratory crosses. Chilotes is therefore excluded as a recommended companion despite an older hobby
      list naming it. Pairwise evidence does not establish that every Pundamilia species can cross with every
      other member."

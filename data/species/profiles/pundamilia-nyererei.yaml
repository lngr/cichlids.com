        those failures explain the more severe proposals but do not establish unavoidable killing in the
        correctly arranged harem. AquaInfo reports less severe aggression. Persistent pursuit and the
        consequences of an unsuitable ratio fit level 3. Proposals: generator 3; checker-a 3; checker-b 4;
        checker-c 4."

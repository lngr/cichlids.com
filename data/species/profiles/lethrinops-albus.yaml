    tolerance:
      value:
        min: 21
        max: 29
      confidence: medium
      rationale: "Care sheets for the species recommend between 23 and 29 C: 23 to 28 C (Nordiska Ciklidsällskapet, Fishipedia, Imperial Tropicals), 24 to 28 C (Aquarist Atlas, Garnelio, Bay Bridge Aquarium), 24 to 27 C (Wet Spot), 24 to 26 C (Einrichtungsbeispiele, Cichliden-Keller, Aquaristik-Deals) and 23 to 29 C (Ron's Cichlids). All lie inside the lake range and none reports harm within it, so the tolerance equals the natural range it has to contain. The votes agree within one degree: checker-a, checker-b and checker-c proposed 21 to 29 C, the generator 21 to 30 C, adding one degree above the warmest care sheet without a source for 30 C; the vote decides 21 to 29 C. The cool end rests on lake measurements and no high-trust source gives an aquarium range, so the confidence is medium."

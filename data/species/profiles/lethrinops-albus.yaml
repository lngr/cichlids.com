  habitat:
    text: "The species occurs only in Lake Malawi. malawi.si records it at sandy sites from the north to the south of the lake, among them Lifubu, Senga Bay, Kambiri, Kande Island, Mphandikucha Island, Kirondo in Tanzania and Chilola Bay in Mozambique, while the Swedish register and Malawi-Guru know it mainly from the calm bays around Kande Island. It lives at 7 to 15 m on sand covered with fine sediment, mostly in the sand zone that borders rocks and scattered boulders, where shallower parts hold Vallisneria and hornwort. The lake water is soft, at about 3 to 5 dGH, and moderately alkaline, with a pH of 7.7 to 8.6 and 5 to 8 dKH; its temperature ranges from about 21 C in chilled inshore water to 29 C at the warm surface. The shallow sand habitat exposes the species to beach seining, and the IUCN assesses it as not threatened."

    rationale: "All four votes give false. malawi.si, the Swedish register, Aquarist Atlas, Ron's Cichlids, Imperial Tropicals and Garnelio name peaceful haplochromines, peacocks or other sand dwellers as tankmates. Malawi-Guru recommends a species tank without any other fish, catfish included, because the species is sensitive and asserts itself poorly; Einrichtungsbeispiele calls a species tank the best choice while allowing utaka, and a forum keeper prefers one for male colour. These preferences follow from the shyness of the fish and are not a restriction of the hobby as for Tropheus. Other Lethrinops are excluded through the hybrid group."

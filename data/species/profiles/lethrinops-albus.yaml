  feedingSpeed:
    value: slow
    confidence: low
    rationale: "The votes split two to two: the generator and checker-b chose normal because the fish forage actively in groups, checker-a and checker-c chose slow. Every source that addresses feeding competition points to slow: Ron's Cichlids advises tankmates that will not outcompete it, Aquarist Atlas says harassment by mbuna suppresses feeding, and Malawi-Guru and Einrichtungsbeispiele describe the species as sensitive and hardly able to assert itself. No source describes a normal or hasty pace. Sifting sand mouthful by mouthful is a deliberate way of feeding that loses food to rushing tankmates. No source measures feeding speed, so the confidence is low."

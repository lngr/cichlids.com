  diet:
    text: "In the lake the fish push the mouth into the sediment, take up sand, sort out insect larvae, small crustaceans, molluscs and other invertebrates and expel the sand through the gills; other fish often follow them to pick food from the stirred-up cloud. In the tank they accept good sinking pellets and flakes, which should be supplemented with frozen Mysis, Daphnia and small portions of bloodworm that sink to the sand. Several small meals suit a sifter better than one large one. Fatty foods such as beef heart or krill do not belong in the daily diet, and the plant-based low-protein diet of mbuna does not meet its needs."

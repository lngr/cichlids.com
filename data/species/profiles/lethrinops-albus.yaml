  sizeAndGrowth:
    text: "Well-kept males reach about 15 cm and females about 12 cm. Specialist sources give typical adult sizes of 14 to 15 cm for males and 11.5 to 12 cm for females, while FishBase lists 16.5 cm as the largest recorded length and some sheets name 17 cm for dominant males. Young fish in the trade are plain silvery, and males show their full colours only at maturity. Steady growth depends on varied small animal foods, clean water and a setup in which the fish can feed without pressure."

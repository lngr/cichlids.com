  socialBehavior:
    text: "Aggression within the species is low. Males clean and guard a small spawning spot against a stone and court passing females, but disputes stay at display and short chases, so several males in one group usually show colour. Outside spawning the fish move over the sand as a loose group and forage together, as they do in the lake. Towards other species they are peaceful and timid. Pushy tankmates keep them from feeding and courting, which shows as faded colour and hiding. A group with a moderate surplus of females spreads the courtship of the males."

      - Albus Kande
variants:
  - name: Kande Island
    kind: locality
    note: "The form of the trade, sold as captive-bred stock; males there defend a spawning spot against a stone and build no bower."
  - name: Mphandikucha Island
    kind: locality
    note: A population in shallow water where males defend a natural dip between sand ripples.

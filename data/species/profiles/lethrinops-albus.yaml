  hybridGroups:
    value:
      - lethrinops
    confidence: medium
    rationale: "All four votes name the listed genus group lethrinops, whose basis is presumed and which lists this species. The Swedish register advises against mixing L. albus with other Lethrinops because of the risk of crosses and gives the same warning for L. marginatus. Aquarist Atlas warns for the genus on its L. marginatus page, while its L. albus page names other Lethrinops as tankmates without addressing crossing. A forum keeper expects L. albus to cross with another Lethrinops. No cross of L. albus with a named partner is reported, so no further group applies."

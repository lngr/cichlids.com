  husbandry:
    text: "A group needs a tank of at least 300 L with 150 cm of length and about 50 cm of depth, and more room when other fish share it. The whole floor should carry a deep layer of fine sand, because the fish sift it all day; gravel or a thin layer prevents this feeding. A few large stones placed to the sides give males spawning landmarks, and Vallisneria can be planted as long as wide open sand remains. Care sheets recommend about 23 to 28 C and a pH of 7.5 to 8.5 in well-buffered water; the species tolerates 21 to 29 C, pH 7.4 to 8.6, 3 to 15 dGH and 5 to 14 dKH. Efficient filtration and regular partial water changes keep nitrate low. Keep at least six fish with more females than males."
    sources:

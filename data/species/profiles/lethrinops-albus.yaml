  compatibility:
    text: "Suitable companions are calm Malawi fish of similar size that do not dominate the sand, such as the peacock Aulonocara stuartgranti, utaka such as Copadichromis chrysonotus, Placidochromis electra and the catfish Synodontis njassae. Mbuna and other assertive rock dwellers, such as Maylandia zebra and Labeotropheus fuelleborni, take its food and keep it from breeding. Large predators such as Nimbochromis livingstonii eat juveniles and unsettle the group. Other Lethrinops are left out because the genus is presumed to cross in tanks, which the planner shows as a caution. Malawi-Guru goes further and recommends a species tank for this sensitive fish; most other sources accept peaceful company."

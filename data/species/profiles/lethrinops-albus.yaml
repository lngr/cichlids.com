    tolerance:
      value:
        min: 5
        max: 14
      confidence: low
      rationale: "No source states a carbonate hardness limit for this species; the only species figure, 10 to 15 dKH, comes from a generic shop sheet (Bay Bridge Aquarium) that files the fish under the wrong genus. Six votes reach no qualified majority: generator 4 to 12, checker-a 5 to 12, checker-b 5 to 12, checker-c 5 to 15, tiebreaker-1 4 to 15 and tiebreaker-2 4 to 15 dKH. The median of the minima is 4.5, rounded to 5, and the median of the maxima 13.5, rounded to 14, so the tolerance is 5 to 14 dKH with method median and low confidence; it contains the natural 5 to 8 dKH. The proposals derive from the pH advice and from Malawi keeping practice: general guides recommend 10 to 14 dKH (Cichlid-Forum article, Reef Solutions) and 10 to 15 dKH (malawicichlids.co.uk), and keepers report healthy Malawi fish at 6 to 12 dKH. The decided upper end is narrower than the 15 dKH of the shop sheet and the UK guide. Three proposals of 4 dKH reach below the lake minimum without a source that reports fish kept at that value."

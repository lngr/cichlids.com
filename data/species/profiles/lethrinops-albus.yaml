partners:
  suitable:
    - species: Aulonocara stuartgranti
      reason: A peaceful peacock of similar size that shares the sand zone without harassing sifters.
      condition: Tank of 150 cm or more with wide open sand.
    - species: Copadichromis chrysonotus
      reason: A calm utaka that stays in open water above the sand and leaves the sifters alone.
    - species: Placidochromis electra
      reason: A peaceful sand-dwelling haplochromine of comparable size and temperament.
    - species: Synodontis njassae
      reason: A Lake Malawi catfish that works the bottom without competing hard for food or space.
  unsuitable:
    - species: Maylandia zebra
      reason: "A boisterous mbuna that dominates the tank and outcompetes slow sifters, which stop feeding and breeding under the pressure."
    - species: Labeotropheus fuelleborni
      reason: A pushy rock dweller that harasses calm tankmates and takes their food.
    - species: Nimbochromis livingstonii
      reason: A large ambush predator that eats juveniles and stresses timid sand dwellers.
    - species: Lethrinops marginatus
      reason: A congener of the same hybrid group; sand-dwelling Lethrinops in one tank risk crossing.
profile:
  overview:
    text: "Lethrinops albus is a sand-dwelling haplochromine endemic to Lake Malawi, described by Regan in 1922. Its name refers to the pale, silvery colour of females and young fish, while breeding males turn metallic blue-green with yellow on the body and throat. Groups of these fish work the open sand for small invertebrates, taking in mouthfuls of substrate and sorting out the food. It counts among the calmest Malawi cichlids: several males show colour side by side, and the species gives way to boisterous tankmates rather than troubling them. The aquarium fish descend from the Kande Island population. A long tank with a deep bed of fine sand and peaceful companions suits it."
    sources:
      - kind: catalog-of-fishes
        title: "Eschmeyer's Catalog of Fishes, species of the genus Lethrinops"

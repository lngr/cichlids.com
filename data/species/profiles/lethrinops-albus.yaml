  sexing:
    text: "Males in breeding dress are easy to recognise by a metallic yellow to blue-green body, a green-blue head, a yellow throat and red and white markings in the fins, with egg spots on the anal fin. Females and young fish are silvery with a yellowish back and a whitish belly. Males out of colour are less pale below than females but can be mistaken for them. Males also grow about 3 cm larger."

    confidence: high
    rationale: "The Catalog of Fishes and FishBase give Lake Malawi as the only range, with the lake as type locality, and FishBase calls the species endemic. malawi.si records sandy sites in the north and south of the lake, including Kirondo in Tanzania and Chilola Bay in Mozambique. Malawi-Guru knows only the Kande Island population and the Swedish register lists Kande and Mphandikucha Islands, both narrower than the locality list. All agents agree on the lake; checker-c wrote the water body as the lake name instead of the table id lake-malawi."

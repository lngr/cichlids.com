  legacyNames:
    - Lethrinops albus
  note: "The legacy name is the valid name. The Catalog of Fishes lists Lethrinops albus Regan 1922 as valid in its original combination, with Lake Malawi (Lake Nyasa) as type locality and no synonyms; the genus list and the species query (checker-b) give the same status. FishBase and the Cichlid Room Companion use the same name. Turner (2022) places the species in the shallow-water group of Lethrinops, which may be separated from the deep-water species at genus level. The undescribed deep-water forms called Lethrinops sp. 'deep-water albus' and sp. 'deep-water albus yellow' are different fish and not part of this profile."
names:
  trade:
    en:

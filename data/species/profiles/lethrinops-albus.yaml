  khDkh:
    value:
      min: 5
      max: 8
    confidence: high
    rationale: "Lake Malawi is a water body of the table, so the natural carbonate hardness is the measured lake value, as all four votes propose; it carries no verification object. Alkalinity of 2.33 to 2.46 meq/L in the north basin (Branchu et al. 2010) and 2.00 to 2.59 meq/L in the 1960s titrations (FAO compilation) convert to about 5.6 to 7.3 dKH. Sodium balances part of the bicarbonate, so carbonate hardness exceeds total hardness in this water."
    sources:
      - kind: literature
        title: "Branchu, P., Bergonzini, L., Ambrosi, J.-P., Cardinal, D., Delalande, M., Pons-Branchu, E. et al. (2010). Hydrochemistry (major and trace elements) of Lake Malawi (Nyasa), Tanzanian Northern Basin: local versus global considerations. Hydrology and Earth System Sciences Discussions 7, 4371-4409."
        url: "https://hess.copernicus.org/preprints/7/4371/2010/hessd-7-4371-2010.pdf"
        accessed: 2026-10-12
        archived: hess.copernicus.org/preprints/7/4371/2010/hessd-7-4371-2010.pdf/2026-10-14T094507Z
      - kind: literature
        title: "Vanden Bossche, J.-P. and Bernacsek, G. M. (1990). Source book for the inland fishery resources of Africa, Vol. 1, CIFA Technical Paper 18/1, FAO. Lake Malawi/Nyasa: physical and chemical data after Jackson et al. (1963) and Talling and Talling (1965)."
        url: "https://www.fao.org/4/t0473e/T0473E05.htm"
        accessed: 2026-10-12
        archived: fao.org/4/t0473e/t0473e05.htm/2026-10-14T094507Z

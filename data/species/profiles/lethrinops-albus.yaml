  temperatureC:
    value:
      min: 21
      max: 29
    confidence: high
    rationale: "Lake Malawi is a water body of the table, so the natural range is the measured lake range with method waterbody, as all four votes propose. Eccles (1974) reports about 27 C in the upper 60 m by May and 21 C in chilled inshore water of the south-east arm in the cool windy season. Vollmer et al. (2005) give about 28 C for summer surface water and 23.5 to 24 C for the winter epilimnion, the FAO compilation gives 23 to 25 C at the surface and Branchu et al. (2010) 22.8 to 25.4 C over the north basin column in October. The species lives over sand at 7 to 15 m, inside the mixed upper layer."

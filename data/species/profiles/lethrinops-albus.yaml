  problems:
    text: "Most failures come from the setup: gravel or a thin sand layer prevents natural feeding, and rough tankmates leave the fish hungry, pale and shy. Malawi bloat, a digestive disease, is favoured by poor water, internal parasites and rich fatty food, so meals stay moderate and nitrate stays low. New fish can carry internal parasites and benefit from a quarantine period. Mixing with other Lethrinops risks hybrids. A fish that stops eating, swells or passes white stringy faeces needs prompt attention from an experienced keeper or a vet."
    sources:

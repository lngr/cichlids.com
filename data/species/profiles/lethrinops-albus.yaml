  breeding:
    text: "Lethrinops albus is a maternal mouthbrooder with a polygynandrous mating system, and pairs spawn throughout the year. At Kande Island a male cleans a spot against a stone instead of building a sand bower, while at Mphandikucha Island males use natural dips between sand ripples; females are courted nearby and led to the spot. The female broods the eggs and larvae for about 21 days and releases 30 to 40 fry, and the male takes no part in care. Moving a brooding female that is chased to a separate tank keeps her from spitting the brood early. The fry take freshly hatched brine shrimp and finely crushed flake from the start."

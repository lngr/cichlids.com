  maxSizeCm:
    value:
      male: 15
      female: 12
    confidence: high
    rationale: "All four agents propose 15 cm for males and 12 cm for females, which is the median. The Swedish register gives 15 and 12 cm, malawi.si 14 and 12 cm and Aquarist Atlas about 14 and 11.5 cm as typical adults; Imperial Tropicals and a cichlids.com sale list name males of 15 cm. FishBase lists 16.5 cm total length for a male or unsexed fish, and Fishipedia and German sheets give up to 17 cm for dominant males; these are upper bounds, not typical sizes. A forum post quotes 13 cm from a field guide. Several independent specialist sources agree, so the confidence is high."

  suitable:
    - species: "Cyprichromis leptosoma"
      reason: "Midwater activity reduces competition for the nesting cavity."
      condition: "Use a longer community aquarium sized for its group as well as the caudopunctatus pair."
    - species: "Altolamprologus calvus"
      reason: "A potential Tanganyika rock-zone partner when nest sites are separated."
      condition: "Use a larger tank with distinct territories; caudopunctatus fry are vulnerable to predation."
    - species: "Julidochromis transcriptus"
      reason: "Separate rock crevices can allow coexistence away from the excavated sand-side nest."
      condition: "Provide a larger footprint and separate rock structures with broken sightlines."
  unsuitable:
    - species: "Neolamprologus multifasciatus"
      reason: "In a compact aquarium its shell colony overlaps the nesting pair's defended area; Tavares directly
        observed local attacks."
      condition: "This is a space-dependent conflict; larger mixed arrangements have also been reported."
    - species: "Lamprologus ocellatus"
      reason: "Defended shell sites and opportunistic shell use make substrate conflict likely in the pair-minimum
        tank."
    - species: "Neolamprologus pulcher"
      reason: "A growing breeding colony can displace the pair from the same rock and sand territory in an ordinary
        community aquarium."
    - species: "Lake Malawi mbuna"
      reason: "Their boisterous territorial activity is inconsistent with the protected nesting areas recommended
        for caudopunctatus."
profile:
  overview:
    text: "A hovering colony of caudopunctatus can make the lower half of a Tanganyika aquarium unusually lively.
      These small cichlids alternate between feeding above the sand and guarding a sheltered nest. Their pale
      bodies, reflective tail spots and yellow fins give way to darker bars during some displays. The
      predictable adult unit is a bonded pair, although nonbreeders shoal and several pairs can live near one
      another when space permits. Shells are useful aquarium shelters, but the species also excavates cavities
      beneath rocks. A prepared beginner can maintain it in stable alkaline water; breeding brings territorial
      disputes and a need for protected retreat routes."
    sources:
      - *a3
      - *a46
      - *a44
      - *a8
  habitat:
    text: "The species belongs to southern Lake Tanganyika. The type locality is Cape Kabeyeye in Zambia; accounts
      also report the Congolese shore and Tanzania. Sand and rocks meet across its shallow intermediate
      habitat. Reproducing pairs remove sand from beneath stones to make cavities, while nonbreeding adults
      gather in midwater and pick zooplankton above the bottom. Open swimming space therefore belongs
      alongside the nesting substrate in an aquarium. The natural regional water envelope is 23 to 29 C, pH
      8.4 to 9.4, GH 10 to 13 dGH and KH 15 to 20 dKH. These figures come from lake limnology and describe
      habitat conditions rather than experimentally established captive limits."
    sources:
      - *a44
      - *a2
      - *a3
      - *a10
      - *a31
      - *a40
      - *a32
      - *a23
      - *a27
      - *a12
      - *a28
      - *a29
      - *a30
  sizeAndGrowth:
    text: "Plan for typical adult total lengths around 7.7 cm in males and 6.9 cm in females. Published
      sex-specific aquarium figures differ: Seriously Fish gives 7.8 and 7.2 cm, while Tavares describes about
      7.6 and 6.4 cm. FishBase records 6.5 cm for male or unsexed fish. Scientific standard-length
      measurements exclude the tail and cannot be compared directly with these aquarium figures. Larger
      unsexed dealer maxima remain in the evidence without setting the typical adult size. Juveniles look
      similar across sexes, so a reliable pair usually becomes apparent through its shared nesting behavior.
      Lifespan is provisionally estimated at 5 to 8 years, with no species-specific longevity study
      establishing that interval."
    sources:
      - *a3
      - *a2
      - *a44
      - *a9
      - *a8
      - *a15
      - *a69
      - *a70
      - *a68
  husbandry:
    text: "For one adult pair, use a base at least 76 cm long and 33 cm deep, with approximately 82 L as the
      volume floor. This reconciles the proposed volumes around the published pair recommendation; a community
      or another pair needs a larger footprint. Place stable rocks on a secure foundation and add sand that
      the fish can excavate without undermining them. Offer several cavities, visual barriers and optional
      roomy shells. Keep an open area above the sand for feeding. A routine temperature near 24 to 27 C fits
      the main specialist recommendation. The tallied aquarium envelopes are 23 to 29 C, pH 7.8 to 9.4, GH 8
      to 24 dGH and KH 10 to 20 dKH; their outer endpoints are not proven physiological thresholds. Maintain
      filtration, oxygenation and regular water renewal while avoiding abrupt chemical changes."
    sources:
      - *a3
      - *a4
      - *a10
      - *a31
      - *a40
      - *a32
      - *a8
      - *a9
      - *a23
      - *a27
      - *a12
      - *a28
      - *a29
      - *a30
  socialBehavior:
    text: "Pair bonding matters more than simply putting two adults together. Genetic and field studies identify
      monogamous breeding pairs within colonies, and both parents normally defend the cavity and developing
      young. Nonbreeders can form substantial shoals. In an aquarium, provide enough separate hiding places
      for a partner or surplus juvenile to leave a confrontation. Displays and chasing generally focus on the
      nest boundary, but a female may temporarily exclude her male. The behavior is graded at level 2 toward
      both conspecifics and other species in a suitable setup. A larger colony requires several distinct nest
      sites and more floor area than the pair minimum."
    sources:
      - *a44
      - *a3
      - *a46
      - *a9
  diet:
    text: "Small animal prey dominate the natural diet, particularly plankton and other invertebrates. Offer
      mouth-sized crustaceans and insect foods with a suitable small prepared food, varying the menu and
      checking that both partners feed. Some husbandry accounts also include vegetable ingredients. The
      compatibility diet is invertivore with no established special bloat-sensitivity flag. Predation level 1
      reflects observations of conspecific young being eaten by nonbreeding fish, even though plankton remains
      the ordinary food. The rubric warns about fry and very small fish up to about 2 cm, but studies have not
      measured that exact prey-size boundary for caudopunctatus. Egg consumption and missing fry alone cannot
      identify all predation events."
    sources:
      - *a2
      - *a46
      - *a44
      - *a3
      - *a9
      - *a47
  breeding:
    text: "A bonded pair spawns inside a cavity and guards the brood. Under rocks in sand, the pair can enlarge
      its own nesting space; shells and other narrow shelters are accepted in captivity. Both parents
      participate, though their roles and access to the nest can change as a brood develops. Once fry swim
      outside, nearby fish may be chased more persistently. Fine first foods and protected filter intakes help
      the small young survive. Research documents parental care extending for several weeks and brood adoption
      under some conditions. Successful breeding in a small experimental or breeder tank does not establish
      that vessel as an appropriate general adult minimum."
    sources:
      - *a44
      - *a3
      - *a46
      - *a9
      - *a47
  sexing:
    text: "Juveniles and similarly sized adults are difficult to sex by appearance. Males tend to reach a larger
      size, and Tavares reports slightly longer male pelvic fins, but neither clue guarantees the sex of an
      individual. Scientific accounts also describe the species as sexually monomorphic. Allowing compatible
      partners to select one another is more dependable than forcing an assumed pair. Coordinated cavity
      preparation and shared brood attendance provide stronger evidence of a breeding relationship than
      temporary tolerance between two young fish. Surplus fish need room and an alternative arrangement once
      persistent chasing develops."
    sources:
      - *a44
      - *a3
      - *a71
      - *a9
      - *a8
  compatibility:
    text: "Community keeping is supported, provided neighbors have separate space. Cyprichromis can occupy the
      water above the nesting pair, while suitable Julidochromis or Altolamprologus may coexist around
      separate rock structures in a larger tank. These examples are conditional possibilities rather than
      guarantees of fry survival. Shell colonies compete near the same lower territory, and Tavares observed
      conflict with neighboring multifasciatus even though he maintained a mixed aquarium. Boisterous mbuna
      and larger predators are poor choices. The profile assigns no hybrid group because no named crossing
      relationship was established in the reviewed material; this does not prove that hybridization is
      impossible."
    sources:
      - *a3
      - *a63
      - *a57
      - *a8
      - *a9
  problems:
    text: "Crowded nest sites, unstable rocks and a forced pairing are common routes to persistent conflict. A
      retreat should remain available even to the male of a bonded pair, especially once the female is
      guarding young. Shell use does not mean that every shell-dwelling neighbor is compatible. Fry can
      disappear through predation or filtration, and studies show that some nonbreeding conspecifics consume
      young. Stable mineral content and clean, oxygenated water are central to routine care. No
      species-specific disease susceptibility was established in the reviewed references. Feeding speed,
      lifespan and the outer tolerance endpoints remain uncertain, so the numerical profile should be read
      with its confidence and evidence."
    sources:
      - *a3
      - *a44
      - *a46
      - *a71
      - *a8
      - *a9
      - *a47

  predation:
    value: 1
    confidence: "low"
    rationale: "The tally conservatively decides level 1 with three agreeing votes out of six. Generator,
      checker-b and checker-c proposed 0 from plankton and invertebrate diet summaries; checker-a,
      tiebreaker-1 and tiebreaker-2 proposed 1 from reports of conspecific young being eaten. Cunha-Saraiva
      and colleagues explicitly describe young consumed by nonbreeding fish, and their 2018 larval fostering
      experiment records one brood consumed in sixteen trials. Those observations support opportunistic fry
      predation while FishBase, CRC and the 2012 study support a normally planktonic diet. Egg consumption
      alone would not establish level 1, and missing fry in a community tank do not identify the predator. No
      qualified majority exists, so confidence stays low under the conservative rule. The approximate 2 cm
      limit belongs to the rubric category and has not been measured for this species; ordinary hunting of
      larger fish is not established."

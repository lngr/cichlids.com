      decision:
        min: 8
        max: 24
      rationale: "Tally method unanimous. Keep the unanimous tally of 8 to 24 dGH with medium confidence. Generator
        proposes 10 to 24 dGH; checker-a, checker-b and checker-c propose 8 to 24 dGH. These agree within the
        two-degree rule and the agreeing-bound median is 8 to 24. Seriously Fish gives 8 to 24 dGH in its
        summary and 8 to 25 in its text; the latter is a wider source interval. Fishkeeper also reaches 25 dGH
        in its 15 to 25 range, while Aqua-Pedia gives 8 to 20 and Tavares reports success at 15 dGH. Preserve
        both wider source maxima rather than implying they are invalid; the tally selects 24 rather than
        proving a failure threshold at 25. FishBase leaves the upper bound open after 15 dGH, so the inherited
        15 to 24 evidence entry is an earlier rendering, not an upper limit stated by FishBase. The range
        contains the natural 10 to 13 dGH."

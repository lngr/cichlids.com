      confidence: "low"
      rationale: "Keep the unanimous tally range of 23 to 29 C and low confidence. Generator proposes 22 to 30 C,
        checker-a 22 to 29 C, and checker-b and checker-c 23 to 29 C; the differences agree within the
        one-degree rule and the agreeing-bound medians round to 23 and 29. Seriously Fish recommends 24 to 27
        C, Fishkeeper 23 to 25 C, and LiveAquaria and AquariumDomain about 22.2 to 27.8 C. The generator
        extends these and the natural range to a wider 22 to 30 C by model estimate. Preserve that wider
        proposal and evidence, but the tally does not establish 22 or 30 C as long-term limits. Its envelope
        includes the measured natural range; equality with that range is a consequence of the tally and
        limited endpoint evidence, not proof of harm outside it."

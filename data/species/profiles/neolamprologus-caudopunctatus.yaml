  ph:
    value:
      min: 8.4
      max: 9.4
    confidence: "high"
    rationale: "Keep the tallied natural range of 8.4 to 9.4 and waterbody verification. The FAO/FINNIDA
      limnological programme reports surface pH around 8.8 to 9.2 and an annual deeper-water span of 8.47 to
      9.40. Cohen and Langenberg provide corroborating lake chemistry. FishBase gives 7.5 to 8.5 and Tavares
      describes habitat pH 7.8 to 8.8; retain those differing reports as evidence without substituting them
      for the measured regional envelope. The older FAO source-book range of 7.3 to 7.8 is inconsistent with
      the modern lake measurements."
    sources:
      - &a31
        kind: "literature"

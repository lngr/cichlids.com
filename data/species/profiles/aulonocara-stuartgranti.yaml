  ghDgh:
    value: {min: 3, max: 5}
    confidence: high
    rationale: >-
      Lake Malawi endemic, so the natural range is the measured range of the lake. Calcium and
      magnesium of the upper 50 m in the north basin give 4.2 to 4.6 dGH (Branchu et al. 2010),
      and the 1960s titrations compiled by FAO give 3.2 to 4.9 dGH. The lake is soft water with a
      moderate bicarbonate buffer; care sheets that call for hard water describe keeping practice,
      not the habitat.
    sources: *lakesources
    evidence:
      - source: *branchu
        value: {min: 4.2, max: 4.6}
        note: upper 50 m of the north basin, computed from calcium and magnesium
      - source: *fao
        value: {min: 3.2, max: 4.9}
        note: 1960s titrations, computed from calcium and magnesium
    verification:
      method: waterbody
      waterbody: lake-malawi
    tolerance:
      value: {min: 3, max: 25}
      confidence: medium
      rationale: >-
        Care sheets agree that the species does well in moderately hard to hard water, with upper
        limits of 15 to 30 dGH; Seriously Fish, Fishkeeper and Guidarium share 25 dGH, the value
        most sources reach. Their lower limits of 8 to 12 dGH reflect hobby habit rather than a
        need, since the fish live in lake water of 3 to 5 dGH, so the tolerance starts at the
        natural range. A laboratory group stayed healthy for a month at about 17 dGH, and a forum
        keeper bred the species at about 21 dGH. All three votes (generator, checker-a, checker-b)
        proposed 3 to 25 dGH.
      sources:
        - *sf
        - *fk
        - *guid
        - *fpedia
        - *yanar
        - *branchu
        - *fprof
        - *fishbarn
        - *garnelio
        - *a21846
      evidence:
        - source: *sf
          value: {min: 10, max: 25}
          note: aquarium recommendation
        - source: *fk
          value: {min: 0, max: 25}
          note: hard water recommended, only an upper limit given

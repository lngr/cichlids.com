  predation:
    value: 1
    confidence: medium
    rationale: >-
      A benthic invertebrate feeder that hovers over sand and strikes at small buried prey, which
      it detects with its widened lateral line canals (FishBase; Schwalbe et al. 2012 and 2016;
      Seriously Fish). It has no specialisation for fish, but as a hunter of small moving animals it
      takes fry and very small fish within reach, as the rubric describes for level 1; dwarf
      shrimps are eaten as well. No source reports regular predation on larger fish. All three
      votes (generator, checker-a, checker-b) proposed level 1.
    sources:
      - *fb
      - &schwalbe2012
        kind: literature
        title: "Schwalbe, M. A. B., Bassett, D. K. and Webb, J. F. (2012). Feeding in the dark: lateral-line-mediated prey detection in the peacock cichlid Aulonocara stuartgranti. Journal of Experimental Biology 215(12), 2060-2071 (abstract)."
        url: https://doi.org/10.1242/jeb.065920
        archived: doi.org/10.1242_jeb.065920/2026-10-12T203641Z
        accessed: 2026-10-13
      - *schwalbe2016
      - *sf
      - *garnelio
    evidence:
      - source: *fb
        value: 1
        note: feeds on sand-dwelling invertebrates
      - source: *schwalbe2012
        value: 1
        note: detects and eats small invertebrate prey living in sand
      - source: *schwalbe2016
        value: 1
        note: feeds on benthic invertebrates in Lake Malawi
      - source: *sf
        value: 1
        note: sifts sand and hunts small prey above the bottom
      - source: *garnelio
        value: 1
        note: dwarf shrimps and small invertebrates are eaten
    verification:

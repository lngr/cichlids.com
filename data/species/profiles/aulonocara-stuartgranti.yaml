  temperatureC:
    value: {min: 21, max: 29}
    confidence: high
    rationale: >-
      Lake Malawi endemic, so the natural range is the measured range of the lake. Inshore water
      in the south-east arm cools to about 21 C in the windy season, while the upper 60 m reach
      27 C by May (Eccles 1974); the surface layer holds 23.5 to 24 C in winter and about 28 C in
      summer (Vollmer et al. 2005), and a 2013 campaign found 24 to 29 C (Ngochera 2018). The
      species lives in the shallow intermediate zone inside this mixed upper layer.

  ph:
    value: {min: 7.7, max: 8.6}
    confidence: high
    rationale: >-
      Lake Malawi endemic, so the natural range is the measured range of the lake. Surface pH is
      7.7 to 8.6 in the 1960s survey of Jackson et al. compiled by FAO; profiles of the north basin
      span 7.5 to 8.5 over the whole water column, the lowest values belonging to deep water below
      the shallow intermediate zone this species inhabits (Branchu et al. 2010).
    sources: *lakesources
    evidence:
      - source: *fao
        value: {min: 7.7, max: 8.6}
        note: surface water after Jackson et al. (1963)
      - source: *branchu
        value: {min: 7.5, max: 8.5}
        note: whole water column of the north basin, lower values in deep water
    verification:
      method: waterbody
      waterbody: lake-malawi
    tolerance:
      value: {min: 7.5, max: 8.6}
      confidence: low
      rationale: >-
        Decided by the vote count with the conservative method. Generator, checker-a and
        tiebreaker-1 proposed 7.5 to 8.6; checker-b and tiebreaker-2 proposed 7.5 to 9.0. The upper
        limits differ by 0.4, more than the 0.3 that counts as agreement, and the larger camp holds
        only 3 of 5 votes, so the intersection of all proposals, 7.5 to 8.6, applies; it contains
        the natural lake range. The sources support this cautious range: nearly all care sheets
        put the lower limit at 7.5 (Seriously Fish, Fishkeeper, Fishipedia, FishProfiles,
        Garnelio, The Fish Barn) and the upper limit between 8.2 and 8.6 (Fishkeeper, Fishipedia,
        Guidarium, FishProfiles and several retailers), while 9.0 rests on Seriously Fish alone,
        which gives the same value on its other Aulonocara pages. Aqualog and a shop listing with
        7.0 to 8.0 do not even cover the lake range. Laboratory holding at 7.6 to 7.8 for a month
        and a two-week holding of juveniles at about 7.1 show short-term survival, not long-term
        health. Values up to 9.0 are probably tolerated but remain unconfirmed.
      sources:
        - *sf
        - *fk
        - *fpedia
        - *guid
        - *aqualog
        - *pfk

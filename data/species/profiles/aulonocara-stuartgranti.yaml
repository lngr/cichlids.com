  aggressionConspecific:
    value: 2
    confidence: medium
    rationale: >-
      Males hold display sites and chase rival males and courted females; in tanks of normal size
      a subordinate male stays pale and can be harassed badly. With one male and four or more
      females in a large enough tank the chasing stays within a hierarchy and injuries are rare
      (Seriously Fish, Fishkeeper, FishProfiles), which is level 2. A retailer guide reports
      deaths of subordinate males in small tanks, which the recommended structure avoids.
    sources:
      - *sf
      - *fk
      - *fprof
      - *gensou
      - *cforum
    evidence:
      - source: *sf
        value: 2
        note: territorial males, one male with four to six females
      - source: *fk
        value: 2
        note: too many males lead to territorial disputes and stress
      - source: *fprof
        value: 1
        note: males may fight, injuries seldom result
      - source: *gensou
        value: 3
        note: two males in a small tank end with the subordinate dying

  aggressionHeterospecific:
    value: 1
    confidence: medium
    rationale: >-
      Seriously Fish, Fishkeeper and Practical Fishkeeping describe a relatively peaceful fish for
      a Malawi cichlid, kept with calm haplochromines and placid mbuna. Males react to fish with a
      similar colour pattern, which the coloration feature covers, and defend their display spot,
      but they do not pursue other species through the tank. Guidarium rates it semi-aggressive.

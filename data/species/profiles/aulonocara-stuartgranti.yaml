      votes: {agree: 3, total: 3}

  diet:
    value:
      type: invertivore
      bloatSensitive: false
      foods:
        - insect larvae and small crustaceans sifted from sand
        - fine cichlid pellets and flakes
        - frozen mysis, brine shrimp and krill
        - bloodworm and mosquito larvae
        - food with Spirulina or other plant matter
    confidence: medium
    rationale: >-
      In the lake it takes small invertebrates from and above the sand, on which FishBase,
      Seriously Fish and the two lateral-line studies agree. Fishkeeper calls it omnivorous because
      it accepts plant-enriched prepared food, which describes aquarium feeding rather than the
      natural diet. It is no aufwuchs grazer and takes a protein-rich cichlid diet, so it is not
      flagged as bloat-sensitive; FishProfiles advises against a very high protein share, which is
      a feeding recommendation, not a conflict with meat-eating tankmates. All three votes
      (generator, checker-a, checker-b) proposed an invertivore without bloat sensitivity.
    sources:

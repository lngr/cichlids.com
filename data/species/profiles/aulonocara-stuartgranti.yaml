        note: invertebrate prey living in sand
      - source: *schwalbe2016
        value: {type: invertivore, bloatSensitive: false}
        note: benthic invertebrates in Lake Malawi
      - source: *sf
        value: {type: invertivore, bloatSensitive: false}
        note: benthic sifter; small meaty foods with some plant content in the aquarium
      - source: *fk
        value: {type: omnivore, bloatSensitive: false}
        note: called omnivorous; meaty frozen foods plus some vegetables

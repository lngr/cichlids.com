schemaVersion: 1
id: aulonocara-stuartgranti
legacyIds: [242, 241, 236, 226]
status: described

taxonomy:
  validName: Aulonocara stuartgranti
  genus: Aulonocara
  species: stuartgranti
  author: Meyer & Riehl, 1985
  source: &cof
    kind: catalog-of-fishes
    title: "Eschmeyer's Catalog of Fishes, species list of the genus Aulonocara (stuartgranti valid; hansbaenschi and steveni synonyms of A. stuartgranti after Konings 2016)"
    url: https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Aulonocara
    archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-b79476cc/2026-10-14T094505Z
    accessed: 2026-10-13
  synonyms:
    - name: Aulonocara hansbaenschi
      note: >-
        Meyer, Riehl & Zetzsche, 1987, described from 8 km south of Masinje on the eastern shore.
        Treated as valid by Eccles & Trewavas (1989), Marechal (1991) and Tawil (2003); the
        Catalog of Fishes lists it as a synonym of A. stuartgranti following Konings (2016).
    - name: Aulonocara steveni
      note: >-
        Meyer, Riehl & Zetzsche, 1987, described from Kande Island. Treated as valid by Eccles &
        Trewavas (1989), Marechal (1991) and Tawil (2003); the Catalog of Fishes lists it as a
        synonym of A. stuartgranti following Konings (2016).
  legacyNames:
    - Aulonocara stuartgrandi
    - Aulonocara steveni
    - Aulonocara ngara
    - Aulonocara hansbaenschi
  note: >-
    The legacy catalog held this species under four names: Aulonocara stuartgrandi, a misspelling
    of the epithet stuartgranti, which honours the exporter Stuart M. Grant, Aulonocara steveni,
    Aulonocara ngara and Aulonocara hansbaenschi.
    The Catalog of Fishes lists A. stuartgranti as valid (type locality Mpanga Rocks, Chilumba)
    and, following Konings (2016), places both A. steveni (Kande Island) and A. hansbaenschi
    (south of Masinje) in its synonymy, so fish traded under either name belong here. The species
    is widespread and forms many regional colour populations. Some of them may prove to be
    separate species: Seriously Fish names two isolated south-western forms, Aulonocara sp.
    'stuartgranti maleri' and A. sp. 'stuartgranti mbenji', and the Cichlid Room Companion lists
    the Maleri form as an undescribed species of its own. Aulonocara baenschi, A. korneliae and
    A. hueseri were once treated as forms of A. stuartgranti and are valid species. The trade name
    Aulonocara ngara refers to the Ngara population of A. stuartgranti, and the Catalog of Fishes
    lists no such name.


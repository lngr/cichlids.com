  khDkh:
    value: {min: 5, max: 8}
    confidence: high
    rationale: >-
      Lake Malawi endemic, so the natural range is the measured range of the lake. Alkalinity is
      2.33 to 2.46 meq/L in the north-basin profiles of Branchu et al. (2010), which is 6.5 to 6.9
      dKH, and 2.00 to 2.59 meq/L in the survey of Jackson et al. compiled by FAO, which is 5.6 to
      7.3 dKH. Sodium balances part of the bicarbonate, so carbonate hardness exceeds total
      hardness.
    sources: *lakesources
    evidence:
      - source: *branchu
        value: {min: 6.5, max: 6.9}
        note: alkalinity 2.33 to 2.46 meq/L
      - source: *fao
        value: {min: 5.6, max: 7.3}
        note: alkalinity 2.00 to 2.59 meq/L after Jackson et al. (1963)
    verification:
      method: waterbody
      waterbody: lake-malawi
    tolerance:
      value: {min: 5, max: 12}
      confidence: low
      rationale: >-
        Decided by the vote count with the conservative method. Generator, checker-b and
        tiebreaker-2 proposed 5 to 15 dKH, checker-a 5 to 12 dKH and tiebreaker-1 5 to 20 dKH.
        The upper limits lie more than 2 dKH apart and the largest camp holds only 3 of 5 votes, so
        the intersection of all proposals, 5 to 12 dKH, applies; it contains the natural lake
        range. Species-specific carbonate hardness figures are rare: the only ones found come from
        retailers, 6 to 30 dKH at Garnelio and 8 to 12 dKH in a Singapore care guide, while a
        genus-level hobby article advises at least 10 dKH and a genus-level guide gives 4 to 6 dKH,
        which stays below the lake maximum. The species databases state only total hardness and
        hard, alkaline water. The lower limit is the lake minimum, in which wild fish live; the
        upper limit of 12 dKH is the cautious end of thin evidence, and higher buffering as in
        many Malawi tanks is probably tolerated but unconfirmed.
      sources:
        - *branchu
        - *fao
        - *garnelio
        - *gensou
        - *cforum
        - &aqsource
          kind: website
          title: "Aquarium Source: Peacock Cichlid care guide (genus Aulonocara)"
          url: https://www.aquariumsource.com/peacock-cichlid/
          archived: aquariumsource.com/peacock-cichlid/2026-10-14T094547Z
          accessed: 2026-10-13
        - kind: model-knowledge
          title: General hobby practice for Lake Malawi haplochromines
      evidence:
        - source: *branchu
          value: {min: 6.5, max: 6.9}
          note: natural lake water, the lower end of the tolerance
        - source: *fao
          value: {min: 5.6, max: 7.3}
          note: natural lake water
        - source: *garnelio
          value: {min: 6, max: 30}
          note: retailer care data
        - source: *gensou
          value: {min: 8, max: 12}
          note: retailer care guide
        - source: *cforum
          value: {min: 10, max: 10}
          note: genus-level hobby article, minimum recommendation only
        - source: *aqsource
          value: {min: 4, max: 6}
          note: genus-level guide, below the lake maximum
        - source:
            kind: model-knowledge
            title: General hobby practice for Lake Malawi haplochromines
          value: {min: 5, max: 15}
          note: buffered Malawi tanks in general
      verification:
        method: conservative
        votes: {agree: 3, total: 5}


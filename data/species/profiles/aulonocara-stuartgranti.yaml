    rationale: >-
      The dominant male holds a display and spawning site, usually a flat stone, a cave entrance or
      a shallow pit in the sand near rocks, and defends the area around it; in the lake such
      territories are about half a metre across (genus-level account). Seriously Fish and
      Fishkeeper call the males territorial, and a dominant male keeps the spot as long as he
      holds his rank, not only while spawning.

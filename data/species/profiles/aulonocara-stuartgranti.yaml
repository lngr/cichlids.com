  disagreements:
    - field: legacyIds
      proposals:
        - {by: generator, value: [242]}
        - {by: checker-a, value: [242]}
        - {by: checker-b, value: [242]}
      decision: [242, 241]
      rationale: >-
        Legacy entry 241, Aulonocara steveni, names a synonym of A. stuartgranti according to the
        Catalog of Fishes (after Konings 2016), so it maps to this profile as well.
    - field: taxonomy.legacyNames
      proposals:
        - {by: generator, value: [Aulonocara stuartgrandi]}
        - {by: checker-a, value: [Aulonocara stuartgrandi]}
        - {by: checker-b, value: [Aulonocara stuartgrandi]}
      decision: [Aulonocara stuartgrandi, Aulonocara steveni]
      rationale: The legacy catalog listed the species under both names; entry 241 joins this profile.
    - field: taxonomy.synonyms
      proposals:
        - {by: generator, value: ["Aulonocara hansbaenschi Meyer, Riehl & Zetzsche, 1987", "Aulonocara steveni Meyer, Riehl & Zetzsche, 1987"]}
        - {by: checker-a, value: ["Aulonocara hansbaenschi Meyer, Riehl & Zetzsche, 1987", "Aulonocara steveni Meyer, Riehl & Zetzsche, 1987"]}
        - {by: checker-b, value: [Aulonocara hansbaenschi, Aulonocara steveni]}
      decision: [Aulonocara hansbaenschi, Aulonocara steveni]
      rationale: >-
        All runs name the same two synonyms, confirmed in the Catalog of Fishes. The name field
        carries the plain binomen so that it matches legacy and trade names; author, year and type
        locality go into the note.
    - field: features.origin.value.waterbody
      proposals:
        - {by: generator, value: Lake Malawi}
        - {by: checker-a, value: Lake Malawi}
        - {by: checker-b, value: lake-malawi}
      decision: Lake Malawi
      rationale: Both spellings name the same entry of the water body table; the name form is used, as in the other proposals.
    - field: features.origin.value.localities
      proposals:
        - {by: generator, value: ["Mpanga Rocks, Chilumba (type locality)", Ngara, Maulana, Usisya, Chitimba Bay, Mdoka, Chirwa Island, Mbowe Island, Hai Reef, Ndumbi, Hongi Island, Mbamba Bay, Cobue, Metangula, Chiloelo, Thumbi West Island]}
        - {by: checker-a, value: ["Mpanga Rocks, Chilumba (type locality)", Ngara, Chitimba Bay, Usisya, Mbamba Bay, Cobue, Metangula, Thumbi West Island]}
        - {by: checker-b, value: [Ngara, Mdoka, Chilumba, Maulana, Chirwa Island, Chitimba Bay]}
      decision: ["Mpanga Rocks, Chilumba (type locality)", Ngara, Maulana, Usisya, Chitimba Bay, Mdoka, Chirwa Island, Mbowe Island, Hai Reef, Ndumbi, Hongi Island, Mbamba Bay, Cobue, Metangula, Chiloelo, Thumbi West Island]
      rationale: >-
        The lists are selections from the same population list of Seriously Fish; the longest list
        contains the others and shows the spread along both shores.
    - field: features.ph.tolerance
      proposals:
        - {by: generator, value: {min: 7.5, max: 8.6}}
        - {by: checker-a, value: {min: 7.5, max: 8.6}}
        - {by: checker-b, value: {min: 7.5, max: 9.0}}
        - {by: tiebreaker-1, value: {min: 7.5, max: 8.6}}
        - {by: tiebreaker-2, value: {min: 7.5, max: 9.0}}
      decision: {min: 7.5, max: 8.6}
      rationale: >-
        Decided by the vote count with the conservative method: the upper limits of 8.6 and 9.0
        differ by more than 0.3 and the larger camp has only 3 of 5 votes. The intersection of all
        votes, 7.5 to 8.6, is the most cautious range and contains the lake range; 9.0 rests on
        Seriously Fish alone.
    - field: features.khDkh.tolerance
      proposals:
        - {by: generator, value: {min: 5, max: 15}}
        - {by: checker-a, value: {min: 5, max: 12}}
        - {by: checker-b, value: {min: 5, max: 15}}
        - {by: tiebreaker-1, value: {min: 5, max: 20}}
        - {by: tiebreaker-2, value: {min: 5, max: 15}}
      decision: {min: 5, max: 12}
      rationale: >-
        Decided by the vote count with the conservative method: the upper limits of 12, 15 and 20
        dKH lie more than 2 dKH apart and the largest camp has only 3 of 5 votes. The intersection
        of all votes, 5 to 12 dKH, is the most cautious range; no species database states a
        carbonate hardness.
    - field: features.diet.value.foods
      proposals:
        - {by: generator, value: [insect larvae and small crustaceans sifted from sand, fine cichlid pellets and flakes, "frozen mysis, brine shrimp and krill", bloodworm and mosquito larvae, food with Spirulina or other plant matter]}
        - {by: checker-a, value: [sinking cichlid pellets and granules, flake food with a share of Spirulina, "frozen mysis, Artemia and Cyclops", mosquito larvae]}
        - {by: checker-b, value: [bloodworm, Artemia, mosquito larvae, fine prepared foods with some vegetable matter]}
      decision: [insect larvae and small crustaceans sifted from sand, fine cichlid pellets and flakes, "frozen mysis, brine shrimp and krill", bloodworm and mosquito larvae, food with Spirulina or other plant matter]
      rationale: >-
        Type and bloat sensitivity agree in all votes (unanimous, 3 of 3); the vote count takes the
        food list of the first agreeing vote, which covers the items of the other lists.
    - field: features.maxSizeCm
      proposals:
        - {by: generator, value: {male: 13, female: 10}}
        - {by: checker-a, value: {male: 12, female: 9}}
        - {by: checker-b, value: {male: 14, female: 10}}
      decision: {male: 13, female: 10}
      rationale: >-
        Fishipedia and Guidarium give 13 cm for dominant males and Seriously Fish 13 cm standard
        length, while FishBase, Fishkeeper and Practical Fishkeeping name about 12 cm for typical
        males; 13 cm marks the typical maximum of well-kept males. The 14 cm of checker-b rests on
        no stated source. Females reach 9.4 cm in the laboratory and 10 cm at Guidarium.
    - field: features.social.value.ratio
      proposals:
        - {by: generator, value: 4}
        - {by: checker-a, value: 4}
        - {by: checker-b, value: 3}
      decision: 4
      rationale: >-
        Seriously Fish recommends at least four females per male and Fishkeeper five or more; three
        appears only in Fishipedia and a retailer sheet, so four is used.
    - field: features.coloration
      proposals:
        - {by: generator, value: {baseColors: [blue, yellow, orange], pattern: bars}}
        - {by: checker-a, value: {baseColors: [blue, yellow], pattern: bars}}
        - {by: checker-b, value: {baseColors: [blue, yellow, orange], pattern: mixed}}
      decision: {baseColors: [blue, yellow, orange], pattern: bars}
      rationale: >-
        Orange belongs to the colours of the widely traded Ngara form and of the orange flanks of
        other populations, so it is kept for the colour conflict check. Seriously Fish and
        Practical Fishkeeping describe mood-dependent vertical bars, which makes bars the pattern.

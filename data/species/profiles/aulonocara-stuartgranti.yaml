partners:
  suitable:
    - species: Copadichromis borleyi
      reason: >-
        Calm open-water haplochromine of similar size that uses the upper water layers and does not
        compete for the sand zone.
    - species: Cyrtocara moorii
      reason: >-
        Peaceful sand-dwelling haplochromine with the same water needs; its plain blue colour and
        hump differ enough from a peacock male.
    - species: Placidochromis electra
      reason: Peaceful haplochromine of similar size from the same lake; feeding styles are compatible.
      condition: Blue males of both species may compete; a yellow or orange peacock form avoids this.
    - species: Labidochromis caeruleus
      reason: >-
        One of the few mbuna calm enough for peacocks; its yellow colour and small size cause
        little rivalry.
    - species: Otopharynx lithobates
      reason: >-
        Moderately peaceful haplochromine of the rock-sand transition zone with similar size and
        water needs.
  unsuitable:
    - species: Aulonocara jacobfreibergi
      reason: "Another peacock: the females look alike and the species hybridise."
    - species: Aulonocara baenschi
      reason: Another peacock, formerly treated as a form of this species; crosses readily.
    - species: Maylandia zebra
      reason: Aggressive mbuna that harasses peacocks and outcompetes them at feeding.
    - species: Chindongo demasoni
      reason: Highly aggressive small mbuna that keeps peacocks under constant stress.
    - species: Nimbochromis livingstonii
      reason: Large ambush predator that eats females and young of this species.
    - species: Tropheus moorii
      reason: >-
        Lake Tanganyika aufwuchs feeder with different water needs, a strict plant diet and
        species-only keeping.

profile:
  overview:
    text: >-
      Aulonocara stuartgranti is a peacock cichlid from Lake Malawi and one of the most variable
      species of its genus. Depending on where a population lives, adult males shine in metallic
      blue, yellow or orange, while females stay grey-brown with faint dark bars. More than twenty
      local populations are known, and many reach the trade under their locality names, such as
      Ngara, Chilumba, Maulana or Usisya; fish sold as Aulonocara steveni or A. hansbaenschi belong
      to this species as well. In the wild it hunts small animals hidden in the sand, which it
      finds with the large sensory pores on its head. In the aquarium it is a calm, medium-sized
      cichlid for a spacious tank with sand and a few rock piles, kept as one male with several
      females. Its main risks are crossing with other peacocks, harassment by boisterous mbuna and
      unstable water.
    sources:
      - *cof
      - *fb
      - *sf
      - *schwalbe2012
  habitat:
    text: >-
      The species lives only in Lake Malawi, along long stretches of shore in Malawi, Tanzania and
      Mozambique; the type locality is Mpanga Rocks near Chilumba in the north. It inhabits the
      transition zone where rocky slopes give way to open sand with scattered stones, usually
      somewhat deeper than the algae-grazing mbuna of the surf zone. Males hold spots near crevices
      or overhangs, and the fish forage over the neighbouring sand. The lake water is soft but well
      buffered: about 3 to 5 dGH total hardness, 5 to 8 dKH carbonate hardness and a pH of 7.7 to
      8.6. The temperature ranges from about 21 °C close to shore in the cool, windy season to
      29 °C at the surface in summer. Conditions in the lake change only slowly, so stable water
      matters more in the tank than exact numbers.
    sources:
      - *cof
      - *fb
      - *sf
      - *cforum
      - *branchu
      - *fao
      - *eccles
      - *vollmer
      - *ngochera
  sizeAndGrowth:
    text: >-
      Dominant males reach about 13 cm total length in the aquarium, most males 12 cm; FishBase
      gives 11.8 cm. Females stay smaller at roughly 9 to 10 cm. Juveniles of both sexes are
      silvery brown with dark bars. Young males start to colour up after a few months but often
      need most of the first year for their full colours, and the rate depends on food,
      temperature and rank: a subordinate male may stay drab as long as a stronger male is
      present. With good care the species lives for roughly six to ten years.
    sources:
      - *fb
      - *fk
      - *fpedia
      - *sf
      - *guid
      - *schwalbe2016
  husbandry:
    text: >-
      A tank of about 240 litres with a base of at least 120 by 45 cm suits one male with four or
      more females. Cover most of the floor with fine sand, because the fish sift it for food and
      coarse gravel hinders feeding and can hurt the gills. Build a few stable rock piles with
      caves and leave open sand between them; set the rocks directly on the glass so that digging
      cannot topple them. Peacocks rarely eat plants but may uproot them. The species reacts badly
      to rising nitrate and to sudden changes in water chemistry, so it belongs only in a mature
      tank with strong filtration and weekly water changes of a third or more. Keep the water at
      24 to 27 °C and pH 7.5 to 8.6; total hardness may range from soft lake-like water to about
      25 dGH, and a carbonate hardness of 5 to about 12 dKH keeps the pH stable.
    sources:
      - *sf
      - *fk
      - *fpedia
      - *fprof
      - *branchu
      - *fao
  socialBehavior:
    text: >-
      Males are territorial and defend a spot around a cave or overhang that serves as their
      display site. Rival males flare their fins, chase and sometimes nip each other; with a single
      male, or several males in a large tank with enough visual barriers, injuries are uncommon.
      One male with four or more females spreads his courtship over several fish so that no female
      is driven to exhaustion. Females are peaceful and move loosely through the tank. Towards other
      species the peacock is mild: it mostly ignores fish that look different, but males chase
      tankmates whose colour and shape resemble a rival, especially other blue or yellow peacocks
      and haplochromines. Aggressive mbuna easily intimidate this species, and a stressed male
      loses his colours and hides most of the day.
    sources:
      - *sf
      - *fk
      - *fprof
      - *cforum
  diet:
    text: >-
      In the lake the species feeds on small invertebrates in the sand. It hovers just above the
      bottom, senses buried insect larvae and small crustaceans with the pressure-sensitive canals
      of its lateral line and strikes at them, taking in mouthfuls of sand that it expels through
      the gills. Laboratory studies showed that it can find such prey even in complete darkness.
      In the aquarium it takes fine pellets and flakes for carnivorous cichlids, frozen mysis,
      brine shrimp, krill and bloodworm, plus a share of food with Spirulina or other plant matter.
      Offer several small portions a day rather than one large meal. Avoid mammal meat such as beef
      heart and do not overfeed; a normal protein-rich cichlid diet suits it far better than it
      suits algae-grazing mbuna.
    sources:
      - *fb
      - *schwalbe2012
      - *schwalbe2016
      - *sf
      - *fk
  breeding:
    text: >-
      Aulonocara stuartgranti is a maternal mouthbrooder that often spawns in a community tank.
      The male intensifies his colours, cleans a flat stone or digs a shallow pit in the sand near
      his shelter and courts passing females with spread fins and quivering. The pair circle each
      other; the female lays a few eggs at a time and takes them into her mouth, and the eggs are
      fertilised while she nibbles at the egg spots on the male's anal fin. She carries the brood
      for about three to four weeks without eating and then releases a few dozen free-swimming
      fry. A holding female can be moved to a separate tank after a few days, but moving her too
      early may make her spit or swallow the eggs, and a long absence can cost her rank in the
      group. The fry accept newly hatched brine shrimp at once.
    sources:
      - *sf
      - *fk
      - *crc
      - *cforum
  sexing:
    text: >-
      Adult males are easy to recognise: they are larger, show the full metallic colour of their
      population and carry egg spots on the anal fin. Females and juveniles are grey to brownish
      with darker vertical bars and no bright colours. Young males can look like females for
      months, and subordinate males often stay drab while a dominant male is present, so a group
      of young fish is best sexed at five to six months; venting is the most reliable method at
      that age. Because the females of different Aulonocara species and colour forms are hard to
      tell apart, buy females only from a source that keeps each population separate.
    sources:
      - *sf
      - *fk
      - *fprof
  compatibility:
    text: >-
      The species fits a peaceful Lake Malawi community of open-water and sand-dwelling
      haplochromines of similar size, such as Copadichromis borleyi, Cyrtocara moorii or
      Placidochromis electra, and a few calm mbuna like Labidochromis caeruleus. Keep only one
      Aulonocara species and one population per tank: peacock females look alike and the species
      cross readily, which is why many trade lines are already mixed. Avoid aggressive mbuna such
      as Maylandia and Chindongo, which outcompete peacocks at feeding and keep them under stress.
      Large predatory haplochromines like Nimbochromis livingstonii eat females and young. Blue or
      yellow males of other haplochromines can trigger fights and suppress the colours of the
      weaker male. Fish from Lake Tanganyika or from soft, acidic water are poor choices because
      their water and food needs differ.
    sources:
      - *sf
      - *fk
      - *pfk
      - *cforum
      - *a15785
      - *a14959
  problems:
    text: >-
      Most problems come from water quality. In a new tank, after skipped water changes or with too
      many fish, the species reacts with clamped fins, faded colours, hiding and a higher disease
      risk, so stock it only into a mature, well-filtered tank. Too few females per male lead to
      harassed females that lose weight or drop their broods. Mixing peacock species or colour
      forms produces hybrids that should not be passed on. A coarse or sharp substrate hinders
      natural feeding and can injure the gills. Mammal meat and overfeeding can cause digestive
      trouble and bloat; if a fish stops eating, swells or produces white, stringy droppings, test
      the water and consult a fish veterinarian. Aggressive mbuna as tankmates cause chronic stress
      that shows as constant hiding and weight loss.
    sources:
      - *sf
      - *fk
      - *fprof
      - *cforum


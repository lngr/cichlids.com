  sizeAndGrowth:
    text: "The most useful sex-specific aquarium account places adult males at roughly 30 to 36 cm and females at
      23 to 25 cm. The profile rounds typical upper sizes to 35 and 25 cm. FishBase supports a 35 cm
      total-length maximum but does not provide a separate female figure. Growth rate and breeding readiness
      vary with individual history, nutrition and social conditions. Juvenile striping and subdued color can
      change markedly as the fish matures. Do not judge eventual aquarium needs from the size at purchase, or
      assume that a large fish has already found a compatible partner."
    sources:
      - kind: "literature"
        title: "Libasci (2020). Vieja melanarum. Greater Chicago Cichlid Association breeding report."
        url: "https://www.gcca.net/art-pics/cichlid-profiles-list/central-american-cichlids/496-vieja-melanarum.html"
        accessed: "2026-10-13"

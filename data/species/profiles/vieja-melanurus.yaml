  predation:
    value: 1
    confidence: "low"
    rationale: "Four of six votes support level 1, so the qualified-majority decision is retained at low
      confidence. Frias-Quintana et al. include fish larvae in the food spectrum, while the Caobas study
      sampled plant-feeding juveniles and cannot establish an adult prey-size ceiling. Generator and checker-c
      proposed level 2; checker-a, checker-b and both tie-breakers proposed level 1. Higham et al. filmed an
      8.1 cm standard-length fish capturing 2 to 3 cm guppies, and Libasci reported seven tetra tankmates
      disappearing. Those observations establish a larger small-fish risk than fry alone, but do not establish
      routine consumption of every mouth-sized fish. The rubric ceiling near 2 cm is therefore a compatibility
      classification with contrary evidence, not a demonstrated safe boundary for larger tankmates. Proposals:
      generator proposed 2; checker-a proposed 1; checker-b proposed 1; checker-c proposed 2; tiebreaker-1
      proposed 1; tiebreaker-2 proposed 1."

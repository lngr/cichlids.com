        - by: "checker-a"
          value: "moderate"
        - by: "checker-b"
          value: "moderate"
        - by: "checker-c"
          value: "moderate"
      decision: "moderate"
      rationale: "Checker-a, checker-b and checker-c proposed moderate; generator proposed demanding. The Nordic
        register, Zoopet and Seriously Fish use intermediate or moderate care ratings. Retain moderate because
        routine feeding and water management are feasible with an appropriately large adult aquarium. Pair
        aggression, filtration demands and separation capacity still require experience; this rating is not a
        recommendation for a small first aquarium."

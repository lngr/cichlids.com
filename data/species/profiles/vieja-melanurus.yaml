partners:
  suitable:
    - species: "Cincelichthys pearsei"
      reason: "A large plant-oriented adult is a conditional candidate under the general robust-cichlid community
        advice."
      condition: "A substantially larger aquarium than the pair minimum, separate territories, similar adult size,
        overlapping water conditions and separation capacity are necessary. This exact pairing is an inference
        rather than a verified species-specific trial."
  unsuitable:
    - species: "Poecilia reticulata"
      reason: "Direct laboratory captures establish small-fish risk despite the plant-heavy diet and the voted
        predation level 1."
    - species: "Paracheirodon innesi"
      reason: "Small delicate fish and their juveniles face predation and territorial injury; the voted rubric
        cutoff does not prove adult small tetras safe."
    - species: "Symphysodon aequifasciatus"
      reason: "A comparatively timid feeder is poorly matched to a powerful territorial redhead and its routine
        harder water."
    - species: "Amphilophus citrinellus"
      reason: "A retained crossing group and territorial conflict concern this pairing."
    - species: "Mayaheros urophthalmus"
      reason: "Artificial fertilization produced hybrid offspring; free partner choice was not tested."
    - species: "blood parrot cichlid"
      reason: "Fisher et al. obtained viable offspring using female blood-parrot eggs and redhead sperm."
    - species: "Flowerhorn"
      reason: "The existing Midas group includes this domestic line; variable ancestry and aggression add
        uncertainty."
    - species: "Parachromis dovii"
      reason: "Severe aggression adds injury risk, and an unverified gallery supports the retained presumed crossing
        group."
    - species: "Geophagus brasiliensis"
      reason: "An indexed historical cross supports a weak presumed risk, with original parent identification
        unresolved."
    - species: "Cincelichthys bocourti"
      reason: "A named gallery offspring label supports a retained presumed crossing group without verified
        parentage."
    - species: "Mesoheros festae"

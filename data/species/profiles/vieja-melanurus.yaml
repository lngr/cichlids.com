  note: "Eschmeyer's Catalog recognizes Vieja melanurus (Günther, 1862) and treats Cichlasoma synspilum Hubbs,
    1935 as a junior synonym. Both the legacy and current genus are Vieja, so the same genus listing resolves
    both. Melanurus and synspilum are indeclinable nouns; melanura, synspila and synspilus occur as historical
    spellings. Care records under the synonym are assigned to the accepted species. CRC independently verifies
    the name. The legacy catalog held the species three times, as Vieja synspila, Cichlasoma synspilum and
    Vieja melanurus; all three entries map to this profile."

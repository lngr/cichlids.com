  breeding:
    text: "An established pair prepares a hard surface and attaches eggs to it. A flat stone, wood surface or
      sheltered pot may be selected; the species is not restricted to caves. Both parents guard the brood and
      can displace other large fish across much of the aquarium. Husbandry accounts describe hatching after
      roughly two or three days and free swimming several days later, with temperature affecting timing. Offer
      suitably small fry foods such as newly hatched Artemia and arrange grow-out space before a brood becomes
      crowded. Monitor the adults as well as the fry, since renewed spawning or a very large brood can change
      the social balance. A brief experimental temperature manipulation is not a routine breeding
      requirement."
    sources:
      - kind: "database"
        title: "Seriously Fish: Vieja synspila (Redhead Cichlid)"
        url: "https://www.seriouslyfish.com/species/vieja-synspila/"

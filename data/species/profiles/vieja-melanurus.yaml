  temperatureC:
    value:
      min: 25
      max: 30
    confidence: "low"
    rationale: "The median decision summarizes heterogeneous field-based proposals rather than all observed
      habitat temperatures. Caobas measurements were 25.1 to 29.3 C; Peten upper waters and regional river
      measurements support the upper twenties. The decided 25 to 30 C range is narrower than the 22.2 to 30.7
      C freshwater station means in Soria-Reinoso et al. (2021) and the 22.96 to 33.88 C lower-basin range in
      the 2022 water-quality study. Frias-Quintana et al. collected this species at a mean 32.1 C, and the
      Sanchez preprint records a 32 C occupied backwater. These observations remain evidence and are not
      discarded as aquarium recommendations. The median is a low-confidence planning summary, not exhaustive
      annual limits; deep lake water and unrelated upstream stations are not proof of occupied habitat.
      Proposals: generator proposed {\"min\":28.3,\"max\":32}; checker-a proposed {\"min\":24,\"max\":30};
      checker-b proposed {\"min\":25.1,\"max\":30.2}; checker-c proposed {\"min\":25,\"max\":30}; tiebreaker-1
      proposed {\"min\":25.1,\"max\":32.1}; tiebreaker-2 proposed {\"min\":22.2,\"max\":30.7}."

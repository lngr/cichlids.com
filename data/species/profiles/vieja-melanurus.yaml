        url: "https://www.gcca.net/art-pics/cichlid-profiles-list/central-american-cichlids/496-vieja-melanarum.html"
        accessed: "2026-10-13"
  sexing:
    text: "Mature males generally become larger and can develop a conspicuous forehead hump and extended dorsal
      and anal fins. These traits are less useful in juveniles and do not replace observation of several
      characteristics together. Both sexes can develop attractive adult color, and locality variation can
      alter the appearance. A small fish is not necessarily female if growth has been restricted. Reproductive
      behavior can help confirm sex, but the safety of the partnership still requires separate assessment.
      Different head shapes or body sizes alone are insufficient grounds to force two adults into a pair."
    sources:
      - kind: "database"
        title: "Seriously Fish: Vieja synspila (Redhead Cichlid)"
        url: "https://www.seriouslyfish.com/species/vieja-synspila/"
        archived: seriouslyfish.com/species/vieja-synspila/2026-10-14T094918Z
        accessed: "2026-10-13"
      - kind: "literature"
        title: "Libasci (2020). Vieja melanarum. Greater Chicago Cichlid Association breeding report."
        url: "https://www.gcca.net/art-pics/cichlid-profiles-list/central-american-cichlids/496-vieja-melanarum.html"
        accessed: "2026-10-13"
  compatibility:
    text: "A carefully planned community with other large robust fish is possible, but the 700 litre pair minimum
      is not a mixed-community allowance. Small tetras, guppies and juveniles are poor choices. Although the
      tally assigns predation level 1, direct captures of 2 to 3 cm guppies and a breeder's lost tetra group
      leave the exact prey-size boundary uncertain. Several potential breeding partners also conflict through
      the retained hybrid groups. These include Midas, Mayan, Dovii, bocourti, festae, Jack Dempsey and
      fenestrata cichlids, the historically identified brasiliensis parent and the Flowerhorn, blood parrot
      and Red Mammon domestic lines. Laboratory crosses demonstrate biological compatibility in some pairs;
      gallery labels provide much weaker support for others. No crossability is inferred from chains of shared
      partners."

  ghDgh:
    value:
      min: 10
      max: 20
    confidence: "low"
    rationale: "The median decision preserves a low-confidence 10 to 20 dGH regional summary despite much wider
      published chemistry. Cruz-Leyva et al. measured 250 to 352 mg/L as CaCO3, about 14.0 to 19.7 dGH; Perez
      et al. report calcium plus magnesium equivalent to about 12.3 to 17.9 dGH in Peten. Echeverria-Galindo
      et al. provide a wider 4.3 to 22.6 dGH surface-water envelope at Yaxha and Macanche. The matched PANGAEA
      sites span 4.37 to 72.8 dGH, and Yanez-Montalvo et al. give Bacalar values equivalent to 73.58 to 90.2
      dGH. The median omits these peripheral values and is not a species-wide physiological limit. Hardness
      was calculated from calcium and magnesium; sulfate-rich waters can have high GH with much lower KH.
      Checker-a estimated part of its range from conductivity, which is weaker than measured ions and cannot
      substitute for GH. Proposals: generator proposed {\"min\":14,\"max\":20}; checker-a proposed
      {\"min\":8,\"max\":18}; checker-b proposed {\"min\":14,\"max\":20}; checker-c proposed
      {\"min\":4,\"max\":23}; tiebreaker-1 proposed {\"min\":4,\"max\":91}; tiebreaker-2 proposed
      {\"min\":12.3,\"max\":17.9}."

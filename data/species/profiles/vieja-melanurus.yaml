  minTank:
    value:
      volumeL: 700
      lengthCm: 200
      depthCm: 60
    confidence: "medium"
    rationale: "Generator proposed 700 L with 180 by 65 cm footprint; checker-a 500 L with 120 by 60, checker-b
      600 L with 200 by 60, and checker-c 700 L with 200 by 60. Select 700 L and 200 by 60 cm for one
      compatible adult pair, following Zoopet's 700 L and 200 cm recommendation and the Nordic 200 cm
      recommendation. Seriously Fish gives 500 L and 120 by 60 by 60 cm, whose dimensions calculate to only
      432 L gross. AquaInfo gives 200 cm in prose and a wider 250 cm in its table. The selected minimum is
      below that 250 cm alternative and is a practical synthesis, not a proven injury-free threshold. A 200 by
      60 by about 60 cm tank provides roughly 720 L gross; additional adult tankmates need substantially more
      space."

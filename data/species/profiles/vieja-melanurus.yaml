        title: "FishBase: Vieja melanurus summary"
        url: "https://www.fishbase.se/summary/Vieja-melanurus.html"
        archived: fishbase.se/summary/vieja-melanurus.html/2026-10-14T094909Z
        accessed: "2026-10-13"
  husbandry:
    text: "Allow at least 700 litres with a 200 by 60 cm footprint for one bonded adult pair. A mixed adult
      community needs substantially more room. Use sand or fine gravel, stable hard spawning surfaces and
      secured wood or stones that separate sightlines. Leave enough turning and swimming space, and keep heavy
      objects stable against digging. Adults may consume or uproot plants. Provide substantial biological
      filtration, oxygenation and regular water changes matched to the replacement water. Around 24 to 28 C
      and stable neutral to moderately alkaline water have stronger routine-care support than the provisional
      tolerance endpoints. Keep a divider or separate aquarium available before aggression becomes an
      emergency."
    sources:
      - kind: "database"
        title: "Seriously Fish: Vieja synspila (Redhead Cichlid)"
        url: "https://www.seriouslyfish.com/species/vieja-synspila/"
        archived: seriouslyfish.com/species/vieja-synspila/2026-10-14T094918Z

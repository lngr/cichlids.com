      decision:
        size: "large"
        breedingOnly: false
      rationale: "Generator, checker-a and checker-b proposed a large territory not restricted to breeding;
        checker-c proposed a large breeding-only territory. Seriously Fish discusses individual territories in
        mixed keeping independently of egg guarding, while regional guides emphasize much stronger brood
        defense. Retain a large territory with breedingOnly false because breeding intensity does not
        establish complete absence of an adult spatial claim at other times. Territorial extent is a rubric
        inference, not a measured field radius."

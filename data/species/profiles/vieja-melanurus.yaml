    confidence: "low"
    rationale: "Four of six proposals agree within the KH voting threshold, and their rounded median gives 6 to 9
      dKH at low confidence. This field deliberately has no verification object. Perez et al. directly
      measured bicarbonate equivalent to 5.3 to 6.2 dKH; Hillesheim et al. report a charge-balance mean
      equivalent to about 9.1 dKH, and Cruz-Leyva et al. measured about 7.17 to 7.56 dKH alkalinity. The
      selected range excludes some source endpoints. The wider Yaxha to Macanche surface envelope is 5.4 to
      13.2 dKH, the matched PANGAEA samples span 5.28 to 17.61, and the 2025 Bacalar and Cenote Azul study
      gives 5.76 to 9.89. These remain locality-specific evidence, not equivalent to one observed aquarium
      interval. KH expresses carbonate alkalinity here; neither GH nor conductivity was substituted for it.
      Proposals: generator proposed {\"min\":7.2,\"max\":9.1}; checker-a proposed {\"min\":5,\"max\":9};
      checker-b proposed {\"min\":7,\"max\":10}; checker-c proposed {\"min\":5,\"max\":14}; tiebreaker-1
      proposed {\"min\":5,\"max\":18}; tiebreaker-2 proposed {\"min\":5.3,\"max\":9.1}."

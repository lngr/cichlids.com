    rationale: "The Catalog establishes the three-country Atlantic-slope range and type locality at Lake Peten.
      McMahan et al. voucher Peten, Yaxha, Macanche and Perdida populations, while the Nordic register and the
      Caobas field study establish southern Yucatan habitats. The broader Atlantic-lowland description
      reconciles the input locality selections; Belizean waters are not all part of the Usumacinta basin.
      Introduced populations are excluded."

        proposes 6.5 to 8.6; tiebreaker-2 proposes 6.5 to 8.5 (pH). The rounded median of all minima
        and all maxima is 6.8 to 8.5 pH. This contains natural 6.8 to 8.5 without widening.
        Confidence is low. Aquarium Guide recommends 6.5 to 7.5; the median excludes the 8.6 and 8.8
        proposal endpoints. Aqua-Fish gives 7 to 8.1, FishBase and the Nordic register 7 to 8, and
        the GarnelenTv retailer 7 to 8.5. The Caobas measurement of 6.55 and Perdida measurement of
        8.8 remain outside this voted envelope. Natural exposure and short-term rearing at 8.2 do
        not prove multi-year captive health at either endpoint. The median lower bound is 6.75,
        rounded to 6.8. The range is plausible because it contains the natural summary and its edges
        lie within explicit aquarium advice."

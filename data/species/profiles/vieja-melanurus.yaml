        accessed: "2026-10-13"
  diet:
    text: "Offer a balanced cichlid food with substantial plant ingredients, supplemented with algae or spirulina
      foods and suitable vegetable pieces. Modest aquatic invertebrate portions can add variety. Field
      juveniles consumed much algae, while digestive studies and aquarium accounts support mixed feeding. The
      voted omnivore classification is therefore compatible with a strongly plant-oriented diet. No special
      high-protein bloat predisposition was established. That absence does not make poor feeding harmless.
      Small fish can be captured, including guppies used in laboratory observations, so feeder fish are
      unnecessary and the predominantly plant diet is no assurance of small-tankmate safety."
    sources:
      - kind: "literature"
        title: "Valtierra-Vega and Schmitter-Soto (2000). Habitos alimentarios de las mojarras (Perciformes:

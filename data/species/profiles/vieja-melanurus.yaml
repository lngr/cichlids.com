profile:
  overview:
    text: "Vieja melanurus is the accepted name for the redhead cichlid often sold as synspilum or synspila. It
      develops into a powerful adult with a warm-colored head, reflective flanks and dark markings toward the
      tail. Plan for about 35 cm males and 25 cm females, with variation among individuals and localities. A
      compatible pair needs a large permanent aquarium and provision for separation if the partnership fails.
      Small juveniles give little indication of the space and social demands of mature fish. This species is
      best approached as a long-term project, with an uncertain planning lifespan of 10 to 15 years."
    sources:
      - kind: "catalog-of-fishes"

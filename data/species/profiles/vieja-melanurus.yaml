  problems:
    text: "The main preventable problems are insufficient adult space, incompatible partners, unstable decor and
      continued crowding as juveniles grow. A large appetite and substantial body mass place demands on
      filtration and oxygen supply. Check water quality and social access to shelter and food when an
      individual becomes withdrawn, stops feeding or breathes differently. These signs alone do not identify a
      particular disease. Separate injured or persistently harassed fish and obtain appropriate diagnostic
      help for continuing illness. The tolerance envelopes have low confidence, especially at their endpoints,
      and published native-water extremes should not be treated as instructions to reproduce unusual chemistry
      in an aquarium. Trade labels also deserve scrutiny because selected lines and deliberate hybrids can
      obscure ancestry."

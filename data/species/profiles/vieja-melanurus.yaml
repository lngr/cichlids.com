      decision: 2
      rationale: "Generator, checker-b and checker-c proposed level 2; checker-a proposed level 3. The Nordic
        register and AquaInfo concentrate aggression around reproduction and otherwise allow robust adult
        communities. Seriously Fish describes moderate aggression and separate territories. Level 2 represents
        territorial displacement under the rubric's adequate-tank assumption; robust companions alone do not
        demonstrate attacks beyond the territory. Individual temperament and breeding can still require
        separation."

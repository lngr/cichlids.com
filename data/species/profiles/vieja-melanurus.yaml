      rationale: "Generator and checker-c proposed 35 cm males and 25 cm females; checker-a proposed 35 and 28, and
        checker-b 35 and 30. The sex-specific Libasci aquarium account gives males 12 to 14 inches and females
        9 to 10 inches, approximately 35.6 and 25.4 cm at the upper ends. Rounded typical maxima of 35 and 25
        are retained rather than inferred larger female sizes. FishBase independently supports 35 cm total
        length for males or unsexed fish; Seriously Fish labels 35 cm as standard length, so the measurements
        are not interchangeable. One direct female-size account limits confidence."

        archived: en.aqua-fish.net/fish/redhead-cichlid/2026-10-14T103802Z
        accessed: "2026-10-13"
  habitat:
    text: "Native populations occupy Atlantic lowlands of southern Mexico, Guatemala and Belize, including the
      Usumacinta system and lakes of Peten and southern Yucatan. Slow river margins, soft bottoms, submerged
      wood and vegetation provide feeding and shelter, especially for young fish. The voted natural summaries
      are 25 to 30 C, pH 6.8 to 8.5, GH 10 to 20 and KH 6 to 9. They compress a much wider set of field
      observations. Caobas has pH readings below the summary, while Bacalar calcium and magnesium imply much
      higher GH than ordinary aquarium recommendations. GH and KH must be distinguished because sulfate-rich
      water can be very hard without proportionately high carbonate buffering."
    sources:
      - kind: "catalog-of-fishes"

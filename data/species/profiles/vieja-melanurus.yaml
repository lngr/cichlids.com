        accessed: "2026-10-13"
  socialBehavior:
    text: "Adults form pairs and may cooperate closely in brood care, but placing a male and female together does
      not ensure a safe partnership. Repeated pursuit, a partner confined to a shelter or failure to obtain
      food calls for prompt reassessment and possibly separation. Additional adult pairs need distinct
      territories and substantially more space. Brood defense can intensify behavior even in fish that were
      manageable outside reproduction. The profile grades conspecific aggression at 3 and heterospecific
      aggression at 2 under adequate husbandry. These are planning categories rather than guarantees for a
      particular individual. A lone adult is a practical alternative when pairing remains unsafe."
    sources:
      - kind: "database"
        title: "Seriously Fish: Vieja synspila (Redhead Cichlid)"
        url: "https://www.seriouslyfish.com/species/vieja-synspila/"

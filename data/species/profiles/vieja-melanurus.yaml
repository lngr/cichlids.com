      occupied-water observations. Valtierra-Vega and Schmitter-Soto measured 6.55 to 8.23 at Caobas with the
      taxon present, and Perez et al. measured Peten surface water at 8.2 to 8.5. Thus the decided 6.8 to 8.5
      excludes the Caobas lower observation. Echeverria-Galindo et al. also report 8.7 at Yaxha and 8.8 at
      Perdida, while the PANGAEA shallow-water subset spans 7.14 to 8.55. The lower Usumacinta survey has a
      wider 7.5 to 8.93 basin range without individual fish linkage. These wider observations are retained
      explicitly. Aquarium pH recommendations and deep, poorly oxygenated lake readings do not establish the
      natural range. Proposals: generator proposed {\"min\":7.1,\"max\":8}; checker-a proposed

    tolerance:
      value:
        min: 7
        max: 25
      confidence: "low"
      rationale: "No qualified majority settles the 6 proposals. generator proposes 8 to 25; checker-a
        proposes 8 to 20; checker-b proposes 8 to 25; checker-c proposes 4 to 25; tiebreaker-1
        proposes 4 to 91; tiebreaker-2 proposes 5 to 25 (dGH). The rounded median of all minima and
        all maxima is 7 to 25 dGH. This contains natural 10 to 20 without widening. Confidence is
        low. FishBase gives 9 to 20, Seriously Fish 10 to 15 and Aqua-Fish a wider 8 to 21. Aquarium
        Guide gives 5 to 20, while GarnelenTv and Reef Trak give wider upper recommendations of 25
        dGH. The 4 to 91 proposal extends to native Bacalar chemistry rather than a chronic aquarium
        trial. Published native ranges of 4.3 to 22.6, 4.37 to 72.8 and 73.58 to 90.2 dGH extend
        outside the decided envelope. It contains the tally's natural summary, not every source
        measurement. Do not interpret 25 as a demonstrated lethal threshold or recreate sulfate-rich
        native hardness by raising KH. The median lower bound is 6.5, rounded to 7. The range is
        plausible because it contains natural 10 to 20 dGH and its edges lie within explicit
        aquarium advice."

    tolerance:
      value:
        min: 24
        max: 31
      confidence: "low"
      rationale: "The four proposals agree within the 1 C threshold, so their rounded median gives 24 to 31 C with
        unanimous verification and low confidence. Seriously Fish and FishBase give 24 to 30 C, Aqua-Fish 25
        to 28, the Nordic register 24 to 28 and Zoopet 23 to 27. Libasci states a broader 24.4 to 31.1 C range
        and describes a brief warming near 31.1 C before spawning. The generator extension to 32 C follows one
        field observation and is not adopted. A 35-day developmental study near 29.72 C is short-duration
        evidence. The outer 31 C endpoint is not established by years of healthy adult maintenance; routine

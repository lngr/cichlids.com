      - "parachromis-dovii-vieja-melanurus"
      - "vieja"
      - "vieja-bifasciata-melanurus"
      - "vieja-maculicauda-melanurus"
      - "vieja-melanurus-blood-parrot"
      - "cincelichthys-bocourti-vieja-melanurus"
      - "mayaheros-urophthalmus-vieja-melanurus"
      - "mesoheros-festae-vieja-melanurus"
      - "vieja-melanurus-midas"
      - "vieja-melanurus-red-mammon"
      - "rocio-octofasciata-vieja-melanurus"
      - "vieja-fenestrata-melanurus"
    confidence: "low"
    rationale: "No list obtains a qualified majority, so the conservative tally retains each exact group id named
      by at least two votes. Generator and checker-c each proposed four groups, checker-a only the Midas
      group, checker-b six groups, and both tie-breakers twelve groups; every full list is recorded in the
      disagreement proposals. Fisher et al. directly produced redhead crosses with Midas and Mayan cichlids
      and viable offspring from female blood parrots fertilized with redhead sperm. These were artificial
      fertilizations, so the new Mayan and blood-parrot pairs are presumed. The five additional retained pairs
      with bocourti, festae, octofasciata, fenestrata and Red Mammon rest on Binns gallery labels without
      verified pedigrees or conspecific partner availability. The Geophagus pair rests on an indexed Astle
      report whose original account was not available. Dovii evidence is another unverified gallery label. The
      existing Midas registry also includes Flowerhorn and retains its existing documented basis, although the
      papers read here do not demonstrate free partner choice and Flowerhorn COI data do not prove every
      ancestral cross. The trimaculatus and maculicauda additions each have only one vote. The two
      tie-breakers use different literal ids for the same managuensis and motaguensis pairs; neither id
      reaches two votes, so neither pair is included. This omission is an identifier consequence, not evidence
      of reproductive isolation. No wider crossing group is inferred transitively. Proposals: generator
      proposed
      [\"vieja-melanurus-midas\",\"parachromis-dovii-vieja-melanurus\",\"vieja-melanurus-mayaheros-urophthalm\
      us\",\"vieja-melanurus-blood-parrot\"]; checker-a proposed [\"vieja-melanurus-midas\"]; checker-b
      proposed
      [\"vieja-melanurus-midas\",\"parachromis-dovii-vieja-melanurus\",\"vieja-melanurus-mayaheros-urophthalm\
      us\",\"vieja-melanurus-blood-parrot\",\"vieja-melanurus-amphilophus-trimaculatus\",\"vieja-maculicauda-\
      melanurus\"]; checker-c proposed
      [\"vieja-melanurus-midas\",\"parachromis-dovii-vieja-melanurus\",\"vieja-melanurus-mayaheros-urophthalm\
      us\",\"vieja-melanurus-blood-parrot\"]; tiebreaker-1 proposed
      [\"vieja-melanurus-midas\",\"parachromis-dovii-vieja-melanurus\",\"geophagus-brasiliensis-vieja-melanur\
      us\",\"mayaheros-urophthalmus-vieja-melanurus\",\"vieja-melanurus-blood-parrot\",\"vieja-melanurus-cinc\
      elichthys-bocourti\",\"vieja-melanurus-parachromis-managuensis\",\"rocio-octofasciata-vieja-melanurus\",\
      \"mesoheros-festae-vieja-melanurus\",\"vieja-fenestrata-melanurus\",\"vieja-melanurus-parachromis\
      -motaguensis\",\"vieja-melanurus-red-mammon\"]; tiebreaker-2 proposed
      [\"vieja-melanurus-midas\",\"parachromis-dovii-vieja-melanurus\",\"geophagus-brasiliensis-vieja-melanur\
      us\",\"mayaheros-urophthalmus-vieja-melanurus\",\"vieja-melanurus-blood-parrot\",\"vieja-melanurus-cinc\
      elichthys-bocourti\",\"parachromis-managuensis-vieja-melanurus\",\"rocio-octofasciata-vieja-melanurus\",\
      \"mesoheros-festae-vieja-melanurus\",\"vieja-fenestrata-melanurus\",\"parachromis-motaguensis-vie\
      ja-melanurus\",\"vieja-melanurus-red-mammon\"].
      The curated data/species/hybrid-groups.yaml file defines vieja with basis presumed from
      specialist and husbandry-database congener crossing warnings, with catalog taxonomy and a
      systematic revision supporting the related lineage rather than verified crosses between every
      pair. The curated data/species/hybrid-groups.yaml file defines vieja-maculicauda-melanurus
      with basis presumed from a named aquarium spawning report and specialist warnings, with
      taxonomy and sister-species research providing context but no independent parentage
      verification or evidence of conspecific mate availability. The curated data/species/hybrid-groups.yaml file defines vieja-bifasciata-melanurus with basis presumed from specialist
      reports of pairing risk and mixed-trait wild fish alongside labelled captive-offspring
      photographs, without verified genetic parentage or documented conspecific mate availability."

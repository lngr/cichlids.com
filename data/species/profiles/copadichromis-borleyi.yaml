  disagreements:
    - field: taxonomy.synonyms
      proposals:
        - by: generator
          value: [Haplochromis borleyi, Cyrtocara borleyi]
        - by: checker-a
          value: [Haplochromis borleyi, Cyrtocara borleyi]
        - by: checker-b
          value: [Haplochromis borleyi]
      decision: [Haplochromis borleyi, Cyrtocara borleyi]
      rationale: Cyrtocara borleyi is a combination of the aquarium literature of the 1980s under which the species was sold; listing it helps users find the species and is marked as no separate nominal species.
    - field: features.origin.value
      proposals:
        - by: generator
          value: {waterbody: Lake Malawi, localities: [Nkhata Bay, Kadango, Mbenji Island, Mpanga Rocks, Chimwalani Reef, Namalenje, Mara Point, Tchulutcha Reef, Crocodile Rocks, Cape Ngombo]}
        - by: checker-a
          value: {waterbody: Lake Malawi, localities: [Nkhata Bay, Kadango, Mbenji Islands, Mara Point, Namalenje, Chimwalani Reef]}
        - by: checker-b
          value: {waterbody: lake-malawi, localities: [Nkhata Bay, Kadango, Mbenji Island, Chimwalani Reef]}
      decision: {waterbody: Lake Malawi, localities: [Nkhata Bay, Kadango, Mbenji Island, Mpanga Rocks, Chimwalani Reef, Namalenje, Mara Point, Tchulutcha Reef, Crocodile Rocks, Cape Ngombo, Ipembi Rocks, Nkhungu Reef, Tawain Reef, Selena-Kasinda]}
      rationale: The waterbody spellings name the same table entry, so the readable name is kept. The localities are the union of all proposals plus the further collecting sites listed by Seriously Fish, which the adjudicator read.
    - field: features.predation
      proposals:
        - by: generator
          value: 1
        - by: checker-a
          value: 1
        - by: checker-b
          value: 0
        - by: tiebreaker-1
          value: 1
        - by: tiebreaker-2
          value: 0
      decision: 1
      rationale: Decided by the tally with method conservative (3 of 5 votes agree, below the qualified majority of 4); the most cautious proposal, level 1, applies with low confidence.
    - field: features.diet.value.foods
      proposals:
        - by: generator
          value: [zooplankton, small crustaceans, insect larvae, Artemia, Mysis, Daphnia, small pellets, flake food, spirulina flake]
        - by: checker-a
          value: [zooplankton, Artemia, Mysis, Daphnia, small frozen foods, flake and pellets, some plant matter]
        - by: checker-b
          value: [zooplankton, Artemia, Daphnia, insect larvae, spirulina flake]
      decision: [zooplankton, small crustaceans, insect larvae, Artemia, Mysis, Daphnia, small pellets, flake food, spirulina flake]
      rationale: The tally decided the diet unanimously (3 of 3) on type invertivore and bloatSensitive false and took the food list of the first vote; it contains the items of the other lists except their wording.
    - field: features.hybridGroups
      proposals:
        - by: generator
          value: [copadichromis]
        - by: checker-a
          value: []
        - by: checker-b
          value: []
        - by: tiebreaker-1
          value: [copadichromis]
        - by: tiebreaker-2
          value: [copadichromis]
      decision: [copadichromis]
      rationale: Decided by the tally with method conservative (3 of 5 votes agree, below the qualified majority of 4); the most common named group applies with low confidence. The group is added to hybrid-groups.yaml with all 25 valid Copadichromis species, because the Seriously Fish warnings on five species pages are phrased for the whole genus; the narrower scopes of tiebreaker-2 (three species) and the generator (seven traded species) would leave species under the same warning without a conflict.
    - field: features.maxSizeCm
      proposals:
        - by: generator
          value: {male: 16, female: 13}
        - by: checker-a
          value: {male: 16, female: 13}
        - by: checker-b
          value: {male: 16, female: 12}
      decision: {male: 16, female: 13}
      rationale: Wikipedia, after Konings and Staeck and Linke, gives about 13 cm for females; the 12 cm of checker-b is an estimate from the dimorphism without a source.
    - field: features.coloration
      proposals:
        - by: generator
          value: {baseColors: [blue, red, orange, yellow], pattern: plain}
        - by: checker-a
          value: {baseColors: [blue, red, orange], pattern: plain}
        - by: checker-b
          value: {baseColors: [orange, red, blue], pattern: plain}
      decision: {baseColors: [blue, red, orange, yellow], pattern: plain}
      rationale: The yellow fin forms are traded as this species and English Wikipedia describes yellow to red flanks in males, so yellow stays among the base colours; leaving it out would hide look-alike conflicts with yellow species.
    - field: features.feedingSpeed
      proposals:
        - by: generator
          value: hasty
        - by: checker-a
          value: normal
        - by: checker-b
          value: hasty
      decision: hasty
      rationale: The only direct report (archive thread 15794) describes the male as the fastest at feeding, and hasty protects slow-feeding tankmates; checker-a's argument that care sheets do not describe a glutton is noted in the rationale, and the confidence stays low.
    - field: features.minTank
      proposals:
        - by: generator
          value: {volumeL: 375, lengthCm: 150, depthCm: 50}
        - by: checker-a
          value: {volumeL: 300, lengthCm: 150, depthCm: 45}
        - by: checker-b
          value: {volumeL: 300, lengthCm: 150, depthCm: 45}
      decision: {volumeL: 300, lengthCm: 150, depthCm: 45}
      rationale: Seriously Fish gives 150 by 45 by 45 cm and about 300 litres as the species minimum; the larger figure of the generator leans on M. K. Oliver's 380 litres, which applies to utaka groups of six or more rather than to one male with three females.
    - field: features.lifespanYears
      proposals:
        - by: generator
          value: {min: 8, max: 10}
        - by: checker-a
          value: {min: 8, max: 10}
        - by: checker-b
          value: {min: 8, max: 12}
      decision: {min: 8, max: 10}
      rationale: A retailer states 8 to 10 years and Animal-World 7 to 10 years for Lake Malawi cichlids; the upper bound of 12 years of checker-b rests on general knowledge only.

  ghDgh:
    value:
      min: 3
      max: 5
    confidence: high
    verification:
      method: waterbody
      waterbody: lake-malawi
    rationale: >-
      Lake Malawi endemic, so the natural range is the measured lake range: calcium and magnesium
      measured in the north basin in 1993 (Branchu et al. 2010) and the titrations of the 1960s compiled
      by FAO give 3 to 5 dGH. Care sheets that ask for 10 dGH and more describe aquarium practice, not
      the habitat.
    sources:
      - *branchu
      - *fao
      - *eccles
      - *vollmer05
      - *vollmer99
      - *ngochera
    evidence:
      - source: *branchu
        value:
          min: 4.2
          max: 4.6
        note: north basin, upper 50 m, 1993
      - source: *fao
        value:
          min: 3.2
          max: 4.9
        note: titrations of the 1960s
    tolerance:
      value:
        min: 3
        max: 25
      confidence: medium
      verification:
        method: unanimous
        votes:
          agree: 3
          total: 3
      rationale: >-
        Care sheets ask for much harder water than the lake has: Seriously Fish 10 to 25 dGH, Fishkeeper
        up to 25, FishProfiles 12 to 20, OATA 12 to 18 for Malawi cichlids and FishBase from 15; one
        retailer gives 6 to 10. The upper bound is the highest care-sheet value. The species lives in
        the lake at 3 to 5 dGH, so the tolerance starts there to contain the natural range. No source
        reports problems from soft or hard water as long as the carbonate hardness keeps the pH up.
      sources:

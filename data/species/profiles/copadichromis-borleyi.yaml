  khDkh:
    value:
      min: 5
      max: 8
    confidence: high
    verification:
      method: waterbody
      waterbody: lake-malawi
    rationale: >-
      Lake Malawi endemic, so the natural range is the measured lake range: an alkalinity of 2.0 to 2.6
      meq/L (Jackson et al. 1963 in the FAO source book; Branchu et al. 2010) corresponds to 5 to 8 dKH.
      Carbonate hardness exceeds total hardness because sodium balances part of the bicarbonate.
    sources:
      - *branchu
      - *fao
      - *eccles
      - *vollmer05
      - *vollmer99
      - *ngochera
    evidence:
      - source: *branchu
        value:
          min: 6.5
          max: 6.9
        note: 2.33 to 2.46 meq/L alkalinity
      - source: *fao
        value:
          min: 5.6
          max: 7.3
        note: 2.00 to 2.59 meq/L alkalinity, 1960s
    tolerance:
      value:
        min: 5
        max: 15
      confidence: low
      verification:
        method: unanimous
        votes:
          agree: 3
          total: 3
      rationale: >-
        Carbonate hardness figures are scarce: LiveAquaria gives 10 to 15 dKH for this species and OATA
        the same range for Malawi cichlids in general, while Seriously Fish and FishBase state only total
        hardness and pH and stress hard, alkaline, stable water. The lower bound is the natural lake
        value of 5 dKH, which the tolerance contains, and the upper bound follows the two care-sheet
        figures. A stable, well-buffered pH matters more than the exact value; the thin evidence keeps
        the confidence low.
      sources:
        - *la
        - *oata
        - *branchu
        - *sf
        - *fb
      evidence:
        - source: *la
          value:
            min: 10
            max: 15
          note: aquarium recommendation
        - source: *oata
          value:
            min: 10
            max: 15
          note: recommendation for Malawi cichlids in general
        - source: *branchu
          value:
            min: 6.5
            max: 6.9
          note: natural lake value, which the tolerance contains

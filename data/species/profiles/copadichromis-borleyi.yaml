  synonyms:
    - name: Haplochromis borleyi
      note: Original combination of Iles (1960), type locality Nkhata Bay; the Catalog of Fishes lists the species as valid in Copadichromis since Eccles and Trewavas (1989), most recently in Fricke et al. (2024).
    - name: Cyrtocara borleyi
      note: Combination of the aquarium literature of the 1980s, when many Malawi haplochromines were placed in Cyrtocara; not a separate nominal species.
  legacyNames:
    - Copadichromis borleyi
  note: >-
    The Catalog of Fishes (queried for Copadichromis on 2026-10-13) lists Copadichromis borleyi (Iles
    1960) as valid, described as Haplochromis borleyi from Nkhata Bay in Lake Malawi in the issue dated
    May 1959 that appeared in 1960, and records an introduced population in Morelos, Mexico. No other
    nominal species is a synonym of it. The Cichlid Room Companion confirms the name and places the
    species in the quadrimaculatus group. Trade names such as Haplochromis 'Red Kadango', red fin and
    yellow fin borleyi refer to colour forms of this species; the OB (orange blotch) borleyi of the
    trade is a cross with a peacock and no pure form.

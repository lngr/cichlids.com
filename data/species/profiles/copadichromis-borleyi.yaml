    rationale: >-
      Endemic to Lake Malawi, where it lives along the rocky coasts of Malawi, Mozambique and Tanzania.
      The type locality is Nkhata Bay (Catalog of Fishes). Seriously Fish lists a long series of
      collecting sites, Fishkeeper names the localities of the traded colour forms, and the Cichlid Room
      Companion shows a male from Chimwalani Reef. The Catalog of Fishes and a 2022 survey of the
      Amacuzac river record a population released in Morelos, Mexico, which does not change the native
      range.

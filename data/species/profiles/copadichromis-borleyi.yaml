  predation:
    value: 1
    confidence: low
    verification:
      method: conservative
      votes:
        agree: 3
        total: 5
    rationale: >-
      The vote did not settle: generator, checker-a and tiebreaker-1 proposed level 1, checker-b and
      tiebreaker-2 level 0, so the tally took the most cautious proposal, level 1, with low confidence.
      Every source written about the species describes a specialised zooplankton feeder (FishBase,
      Seriously Fish, Kassam et al. 2003, the Cichlid Room Companion, the utaka literature), and none
      names fish as food, which by itself fits level 0. The case for level 1 rests on indirect and
      low-weight evidence: the congener C. quadrimaculatus switches to larval and juvenile lake sardines
      when they are available (Allison et al. 1996), a breeder in the cichlids.com archive reports small
      fish taken besides crustaceans, a retailer calls the fish peaceful only towards tankmates too large
      for its mouth, and the highly protrusible mouth that catches free-swimming plankton also takes
      free-swimming fry. Against this, stomachs of C. virginalis held almost only zooplankton with scales
      as the sole fish remains (Duponchelle et al.). Fry and fish up to about 2 cm in the tank should
      therefore be regarded as at risk; larger tankmates are never hunted.

partners:
  suitable:
    - species: Aulonocara stuartgranti
      reason: Peaceful peacock of similar size that uses the rocks and the bottom while the borleyi shoal swims higher; Seriously Fish names Aulonocara as good tankmates.
      condition: Avoid peacock males with the same blue and red colours as the borleyi male, never keep OB peacocks with it, and do not breed from mixed tanks, as peacock males may court borleyi females.
    - species: Cyrtocara moorii
      reason: Calm sand-dwelling hap of the same water and temperament; named as a good tankmate by Seriously Fish.
      condition: Tank of at least 150 cm length.
    - species: Placidochromis electra
      reason: Peaceful sand hap that does not compete for the open water.
      condition: Feed so that the slower hap gets its share.
    - species: Otopharynx lithobates
      reason: Mild hap of rocky shores with similar size and needs.
    - species: Labidochromis caeruleus
      reason: One of the mildest mbuna; it keeps to the rocks and leaves the open-water shoal alone. Fishkeeper accepts mild mbuna, while Seriously Fish advises against mbuna in general.
      condition: Large tank with plenty of rockwork and the mbuna diet without excess protein.
    - species: Synodontis multipunctatus
      reason: Bottom-dwelling catfish of the African lakes, a common partner in Malawi communities (Fishkeeper names Synodontis).
  unsuitable:
    - species: Copadichromis azureus
      reason: Another utaka of the same genus and hybrid group; the species may hybridise and their silvery females are hard to tell apart.
    - species: Copadichromis trewavasae
      reason: Same genus and hybrid group with a similar build; risk of hybrids and of rivalry between blue males.
    - species: Melanochromis auratus
      reason: Aggressive mbuna that harasses calm open-water haps; Seriously Fish advises against any mbuna company.
    - species: Maylandia estherae
      reason: Robust, quarrelsome mbuna that claims most of the tank and stresses the peaceful utaka.
    - species: Nimbochromis venustus
      reason: Large predatory hap that eats juveniles and females of borleyi size and dominates the open water.
    - species: Tropheus moorii
      reason: Aggressive Tanganyika herbivore that needs a different diet and attacks fish entering its space.
profile:
  overview:
    text: >-
      Copadichromis borleyi is a utaka, one of the Lake Malawi haplochromines that live in shoals above
      the rocks and feed on drifting plankton. In the hobby it is best known as the red fin borleyi or
      Kadango, after the red-finned form from the south-western shore. Mature males turn metallic blue
      on the head and back with red, orange or yellow flanks, while females keep the silvery juvenile
      dress with dark spots and coloured fins. It is a calm fish for a large Malawi tank with peaceful
      haps and peacocks. Its demands are mainly space, stable alkaline water and a harem of one male
      with several females. Mbuna and other Copadichromis are poor company, the first because of their
      aggression, the second because the species of the genus may cross.
    sources:
      - *fb
      - *sf
      - *fk
      - *aq
      - *crc
  habitat:
    text: >-
      The species is endemic to Lake Malawi and occurs along many rocky coasts of Malawi, Mozambique and
      Tanzania. It keeps to the water column near large boulders and reefs, usually between about 5 and
      20 metres depth, often where rocks border sandy areas. Shoals of females and young drift above the
      rocks, sometimes mixed with other utaka, and face the gentle current to pick out passing plankton.
      Breeding males stay near a boulder top that serves as their spawning site. The lake water there
      is warm, between about 21 and 29 C, soft at 3 to 5 dGH and alkaline at pH 7.7 to 8.6, with more
      carbonate hardness than total hardness. A population released by fishkeepers lives in the
      Amacuzac river in Mexico.
    sources:
      - *fb
      - *sf
      - *fk
      - *crc
      - *oliver
      - *branchu
      - *fao
      - *eccles
      - *amacuzac
  sizeAndGrowth:
    text: >-
      Males usually grow to about 16 cm in the aquarium, females stay noticeably smaller at around 13 cm.
      Hobby sources sometimes give 18 to 20 cm, which describes exceptional males rather than the typical
      adult. The body is fairly deep for a utaka and the eyes are large. Juveniles of both sexes look
      like females, silvery with dark flank spots and red or yellow fins. Males gain their blue colour
      gradually as they mature, so a group of young fish shows its sexes only after some months. With
      good care these fish live for many years; retailers give about eight to ten.
    sources:
      - *wikien
      - *wikide
      - *fb
      - *sf
      - *fk
      - *rp
  husbandry:
    text: >-
      Plan a tank of at least 150 cm length, 45 cm front to back and about 300 litres for one male and
      three or more females; a larger group of utaka needs more room. The fish swim in the upper and
      middle water, so leave most of the volume open and place rock piles at the ends or the back, with
      a few flat stones that a male can use as a spawning site. A sand bottom suits the species. Hardy
      plants such as Vallisneria or Anubias are usually left alone. Strong filtration and regular
      partial water changes keep nitrate low. Aim for 24 to 27 C and a stable pH around 8; the fish
      tolerate soft water like the lake as well as moderately hard tap water, provided the carbonate
      hardness keeps the pH steady.
    sources:
      - *sf
      - *fk
      - *oata
      - *oliver
      - *it
      - *branchu
  socialBehavior:
    text: >-
      Outside spawning these utaka are sociable shoaling fish that rarely fight. Once a male matures he
      claims a stone or a spot on top of a rock pile, darkens to full colour and displays to every
      female that swims past. His courtship can be rough, so a single female would be chased constantly;
      three or more spread his attention. Two males need a long tank with separate spawning sites, each
      with its own females. Towards other species the borleyi is mild and more often the victim than the
      bully, especially next to mbuna. A breeding male may still chase fish with similar blue and red
      colouring away from his site.
    sources:
      - *sf
      - *fk
      - *wikide
      - *arch15794
  diet:
    text: >-
      In the lake the borleyi eats zooplankton. It spots single tiny crustaceans in the current and sucks
      them in by shooting its mouth forward into a short tube. In the aquarium it accepts nearly any food
      of the right size. A good base is a quality flake or small sinking pellet, supplemented with frozen
      Mysis, Artemia, Daphnia and similar small crustaceans, and some food with spirulina or other plant
      matter. Feed small portions two or three times a day rather than one large meal. The fish feed
      eagerly in open water and grab food quickly, so slow sand haps in the same tank should get their
      share as well. Fry and very small fish may be eaten.
    sources:
      - *fb
      - *sf
      - *oliver
      - *kassam03
      - *fk
      - *arch15794
      - *arch15160
  breeding:
    text: >-
      The borleyi is a maternal mouthbrooder. A ripe male cleans a flat stone or scoops a shallow pit and
      courts females with quivering displays. The female lays a few eggs at a time and takes them into
      her mouth at once; the male fertilises them as she nibbles at the egg spots on his anal fin. A
      brood holds up to about 60 eggs. The female carries them for three to four weeks and eats little
      during that time. Stress can make her spit or swallow the brood, so move her with care or leave
      her in the group. The released fry are large enough for Artemia nauplii and crushed flakes. A
      species tank with one male and three or four females gives the best results.
    sources:
      - *fb
      - *sf
      - *fk
      - *crc
  sexing:
    text: >-
      Adult males are easy to recognise: they are larger, have longer fins and show a metallic blue head
      and back with red, orange or yellow flanks according to the form, plus egg spots on the anal fin
      and light edges on the dorsal and pelvic fins. Females stay silvery grey to brownish with two or
      three dark spots along the side and coloured but shorter fins. Juveniles look like females, so
      young groups cannot be sexed reliably. The first sign of a male is usually a bluish sheen on the
      head. Buying six or more juveniles and keeping one male later is a practical approach.
    sources:
      - *wikien
      - *sf
      - *fk
      - *aq
  compatibility:
    text: >-
      Good companions are other calm Lake Malawi fish of similar size: peacocks of the genus Aulonocara,
      Cyrtocara moorii, Placidochromis and Otopharynx species, and Synodontis catfish. Mild rock
      dwellers such as Labidochromis caeruleus can work in large, well-structured tanks, although
      Seriously Fish advises against mbuna altogether. Avoid robust mbuna like Melanochromis or
      Maylandia, which hound the peaceful utaka, and large predatory haps that can swallow females. Do
      not keep a second Copadichromis species, as the genus is reported to hybridise, and avoid male
      peacocks with the same blue and red colours, which provoke rivalry and may court borleyi females.
      Very small fish and the fry of other species are at risk. Tanganyika cichlids such as Tropheus
      need other food and are no match.
    sources:
      - *sf
      - *fk
      - *aq
      - *it
      - *aw
  problems:
    text: >-
      The most common mistake is a tank that is too small or too crowded with aggressive mbuna, which
      leaves the borleyi stressed, hiding and pale. A single female with a male is another frequent
      error, because she is driven hard. Unstable pH after missed water changes and rising nitrate
      stress the fish over time. Large, rich meals make the fish fat and foul the water; small, varied
      portions are safer. Females that are stripped or moved while holding may lose condition. Be
      careful with the trade name: fish sold as OB borleyi are hybrids with peacocks and should not be
      bred with pure stock. Keepers in the archive report external parasites on borleyi, so quarantine
      new arrivals before adding them.
    sources:
      - *sf
      - *fk
      - *it
      - *oata

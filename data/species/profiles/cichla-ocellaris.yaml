  habitat:
    text: "Native records connect the Marowijne, Suriname, Corantijn, Demerara and Essequibo drainages
      with the upper Branco in Brazil. They do not establish occurrence throughout the eastern
      Amazon. River channels, quieter bays, rocky reaches and wooded shores provide different
      habitats as the fish grow. In Brokopondo Reservoir, adults use open water while juveniles also
      occupy the margins. The working natural ranges are 25 to 31 C, pH 5.1 to 7.3, GH 0 to 1 dGH
      and KH 0 to 1 dKH. Sipaliwini main-river samples were narrower at about 0.11 to 0.19 dGH and
      0.45 to 0.58 dKH. Mol and colleagues also report wider observations of 25.0 to 33.4 C in the
      pre-dam river and pH up to 7.8 in an older reservoir surface campaign. These observations
      remain habitat context rather than permanent aquarium targets; deep oxygen-poor reservoir
      layers are unsuitable reference water."

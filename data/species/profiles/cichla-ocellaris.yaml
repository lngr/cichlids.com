      compatibility or space is inadequate, while not establishing routine killing of correctly
      housed partners. AquariumDomain's hierarchy account supports level 2 and Aqua-Fish's peaceful
      classification translates to 0; both remain in evidence. The selected adult unit is an
      established compatible pair, not two arbitrary adults or an undersized group."

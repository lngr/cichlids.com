  diet:
    text: "Treat C. ocellaris as a specialized fish predator when assessing companions. Its local
      feeding can be more flexible than that label suggests: four full stomachs examined in
      Brokopondo contained shrimp. Offer a varied animal-food diet using suitable fish, prawns and
      mussels, with a complete carnivore pellet where the individual accepts it. Wild-caught fish
      may need a gradual transition to prepared foods. These fish take food quickly, so check that
      companions receive their share and remove leftovers before they impair water quality.
      Unscreened live feeders can introduce infection, and repeated use of a single food can leave
      nutritional gaps. The absence of the special high-protein bloat flag does not imply immunity
      to digestive disease."

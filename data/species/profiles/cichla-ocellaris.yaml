      rationale: "All four full-profile runs proposed 0 to 15 dGH and the tally retains that range and
        medium confidence. Seriously Fish directly advises up to 15 dGH; Fishkeeper agrees, although
        these care sheets are not independent chronic experiments. The near-zero lower end includes
        measured native water. Studio Scaped gives 5 to 15, AquariumDomain mentions 5 to 15 in its
        habitat prose without measurements, and The Fish Collection advises 2 to 10 dGH. Wider
        contrary advice remains explicit: Aqua-Fish gives 7 to 20 dGH and the historical composite
        Tropical Freshwater Fish sheet 2 to 20 dH. These lower-trust or taxonomically broad accounts
        do not establish years of healthy keeping at 20 dGH for the current Guianan species."

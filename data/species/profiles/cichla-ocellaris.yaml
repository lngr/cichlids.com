      rationale: "The tally retains 0 to 1 dGH with medium confidence. Generator proposed 0.1 to 0.2,
        checker-a 0 to 3, and checker-b and checker-c 0 to 1 dGH. The rounded agreeing median
        provides a regional very-soft-water category rather than a claim of exact zero hardness.
        Sipaliwini main-river measurements of 1.95 to 3.40 mg/L as CaCO3 convert to 0.109 to 0.191
        dGH using 17.848 mg/L per dGH. Other Suriname report samples span about 0.07 to 0.84 dGH.
        Checker-b derives an upper Branco envelope of 0.69 dGH from separate calcium and magnesium
        maxima, not a paired sample. Checker-a retains wider Iwokrama kit readings of 2.2 to 5.6
        dGH, which are questionable beside the same survey's very low conductivity. Those readings
        remain visible; they do not establish a typical species-wide upper value. Conductivity-based
        hardness inferences are retained as inferences, not direct measurements."
    - field: "features.khDkh"
      proposals:
        - by: "generator"
          value:
            min: 0.4
            max: 0.6
        - by: "checker-a"
          value:
            min: 0
            max: 2
        - by: "checker-b"
          value:
            min: 0
            max: 1
        - by: "checker-c"
          value:
            min: 0
            max: 1
      decision:
        min: 0
        max: 1
      rationale: "The tally decides 0 to 1 dKH with low confidence; natural KH carries no verification
        object. Generator proposed 0.4 to 0.6, checker-a 0 to 2, and checker-b and checker-c 0 to 1
        dKH. Main Sipaliwini alkalinity of 8.1 to 10.4 mg/L as CaCO3 converts to 0.454 to 0.583 dKH;
        the accompanying fish survey establishes the species in that river system, without proving
        occurrence beside every water sample. Palumeu main-river samples give 0.11 to 0.37 dKH as a
        catchment comparison. The rounded tally category represents weak buffering, not exact
        absence of alkalinity. Wider Iwokrama kit estimates of 1.1 to 4.5 dKH remain in evidence but
        are doubtful beside very dilute conductivity. Checker-b's original low-KH inference is
        superseded in evidential weight by readable alkalinity measurements, which are distinct from
        GH. The Konashen repository record could be read, but its full chapter was not obtained
        through the permitted OA route and supplies no measurements here."
    - field: "features.khDkh.tolerance"
      proposals:
        - by: "generator"
          value:
            min: 0
            max: 6
        - by: "checker-a"
          value:
            min: 0
            max: 10
        - by: "checker-b"
          value:
            min: 0
            max: 8
        - by: "checker-c"
          value:
            min: 0
            max: 5
        - by: "tiebreaker-1"
          value:
            min: 0
            max: 8
        - by: "tiebreaker-2"
          value:
            min: 0
            max: 8
      decision:
        min: 0
        max: 8
      rationale: "The tally retains 0 to 8 dKH with qualified-majority verification, five of six votes
        agreeing within the two-degree comparison rule, and low confidence. Generator proposed 0 to
        6, checker-a 0 to 10, checker-b 0 to 8, checker-c 0 to 5, tiebreaker-1 0 to 8, and
        tiebreaker-2 0 to 8 dKH. The Fish Collection explicitly recommends 2 to 8 dKH, but its broad
        distribution account mixes Cichla ranges and it supplies no chronic trial. The lower
        endpoint is extended to the rounded near-zero category supported by Sipaliwini and regional
        Palumeu alkalinity; it assumes stable pH and maintenance rather than proving completely
        unbuffered water safe. The wider AquariumDomain claim of 5 to 15 KH is retained, but its
        narrative calls the same numbers unspecified dH and pairs them with pH 5.0 to 6.5, leaving
        the hardness category ambiguous. Seriously Fish supplies pH and GH advice, not KH; retained
        0 to 6, 0 to 8 and 0 to 10 derived envelopes are agent inferences rather than measurements
        stated by that source. Cichlid Atlas gives a qualitative warning about hard alkaline
        conditions without isolating a numerical KH cause. The archive search, public CRC, FishBase,
        regional Amazon hydrochemistry and bibliographic records establish no long-term KH endpoint.
        No GH or conductivity number is converted to KH."

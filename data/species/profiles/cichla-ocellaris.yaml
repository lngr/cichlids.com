    rationale: "All four full-profile runs proposed level 3 and the tally retains unanimous verification
      and high confidence. FishBase, CRC and Seriously Fish identify fish specialization and a
      serious risk to smaller tankmates. Mol and colleagues classify Brokopondo fish as piscivores,
      but the four examined full C. ocellaris stomachs contained shrimp. The retained evidence
      interpretations of levels 2 and 3 from that study distinguish the small local stomach sample
      from its broader ecological category. That sample cannot establish absence of pronounced fish
      predation."

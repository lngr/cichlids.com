  husbandry:
    text: "For one established compatible adult pair, use a provisional minimum of 3400 litres with at
      least 305 cm of length and 122 cm front-to-back depth. This follows published adult enclosure
      dimensions and does not guarantee that any two adults will coexist. Leave an open swimming
      corridor and turning space, using secure wood, some smooth rock and optional robust plants
      around the margins. Provide filtration that can process heavy feeding waste, effective gas
      exchange and a consistent water-replacement routine. A steady temperature around 26 to 28 C
      and pH around 6 to 7 is a practical starting point. The broader planning tolerances are 24 to
      31 C, pH 5.1 to 7.5, GH 0 to 15 dGH and KH 0 to 8 dKH; their endpoints are provisional,
      especially warm-water and KH limits. Weakly buffered water needs pH monitoring, and hardness
      should not be changed abruptly."

        and the upper 7.5 advice of Aqua-Fish, Aquatic Community, Studio Scaped and The Fish
        Collection. Seriously Fish and Fishkeeper advise 6.5 to 7.0, while the association and
        AquaInfo advise 6 to 7. AquariumDomain gives 5.0 to 6.5, and the historical composite
        Tropical Freshwater Fish account gives the wider 5.5 to 8.0. Neither its 8.0 upper endpoint
        nor the extra 5.0 lower endpoint is established as a chronic limit for correctly identified
        C. ocellaris. The selected lower bound is inherited from field occurrence; both ends remain
        provisional rather than experimentally determined failure thresholds."

  breeding:
    value: "open-substrate-spawner"
    confidence: "high"
    rationale: "All full-profile runs agree on exposed-substrate spawning. CRC explicitly identifies
      this mode, FishBase describes eggs deposited on a cleared horizontal surface and parental
      transfer of larvae, and the hatchery account reports spawning on hard surfaces. Carrying
      larvae does not establish mouthbrooding. Aqua-Fish instead describes pit spawning and no
      home-aquarium reproduction; that weaker account is retained as a disagreement among sources
      and may confuse the larval holding site with the egg substrate."

    confidence: "low"
    rationale: "The proposal medians are 9 to 15 years: generator 10 to 15, checker-a 8 to 15, checker-b
      8 to 12, and checker-c 10 to 15. Use 10 to 15 as a coarse planning interval because the newly
      checked retailer account explicitly states that interval and Aqua-Fish estimates around 15
      years. Neither provides identified individual survival records. The 9-year median minimum has
      no direct evidential advantage over a rounded decade. Introduced fish aged to six years
      demonstrate observed age rather than a six-year lifespan. This is a low-confidence commitment
      estimate, not a survival distribution or an upper physiological limit."

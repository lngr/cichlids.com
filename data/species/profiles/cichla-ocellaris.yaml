  khDkh:
    value:
      min: 0
      max: 1
    confidence: "low"
    rationale: "The tally decides 0 to 1 dKH with low confidence; natural KH carries no verification
      object. Generator proposed 0.4 to 0.6, checker-a 0 to 2, and checker-b and checker-c 0 to 1
      dKH. Main Sipaliwini alkalinity of 8.1 to 10.4 mg/L as CaCO3 converts to 0.454 to 0.583 dKH;
      the accompanying fish survey establishes the species in that river system, without proving
      occurrence beside every water sample. Palumeu main-river samples give 0.11 to 0.37 dKH as a
      catchment comparison. The rounded tally category represents weak buffering, not exact absence
      of alkalinity. Wider Iwokrama kit estimates of 1.1 to 4.5 dKH remain in evidence but are
      doubtful beside very dilute conductivity. Checker-b's original low-KH inference is superseded
      in evidential weight by readable alkalinity measurements, which are distinct from GH. The
      Konashen repository record could be read, but its full chapter was not obtained through the
      permitted OA route and supplies no measurements here."

    rationale: "The component medians are 60 cm male and 55 cm female: generator proposed 60/60,
      checker-a 60/50, checker-b 60/50, and checker-c 70/60 cm. Retain these as approximate typical
      aquarium planning maxima. The association gives 60 cm without sex-specific measurements; the
      older composite care sheet gives about 61 cm in aquaria. AquariumDomain gives a wider unsexed
      typical range near 61 to 71 cm, Aqua-Fish 68 to 74 cm, and The Fish Collection 60 to 75 cm.
      These pages have uncertain modern species identification and do not outweigh the more
      conservative 60 cm typical value. FishBase's 74 cm TL and Seriously Fish's 75 cm SL are upper
      size accounts with different length conventions, not measured typical maxima per sex. Males
      tend to be larger, but 55 cm for females is an inferred median, not a demonstrated ceiling;
      larger fish of either sex remain possible. The forum and introduced-population size records
      are kept without converting them into expected aquarium size."

      note: "Muller and Troschel, 1849; the Catalog lists this Essequibo name as a synonym of Cichla
        ocellaris."
  legacyNames:
    - "Cichla ocellaris"
  note: "The Catalog of Fishes accepts Cichla ocellaris Bloch & Schneider, 1801 and places Acharnes
    speciosus in its synonymy. The Acharnes genus query returned no separate records, but the
    synonym is present in the Cichla list. CRC attributes the name to Schneider alone; the Catalog
    authorship takes precedence. Cichla temensis, C. monoculus, C. kelberi and C. nigromaculata
    remain separate valid species here. The broader species concept proposed by Willis and
    colleagues is retained as evidence rather than adopted. The Catalog corrects the original Indian
    Ocean type locality to Suriname."

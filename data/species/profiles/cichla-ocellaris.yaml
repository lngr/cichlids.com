  hybridGroups:
    value:
      - "cichla-ocellaris-temensis"
    confidence: "medium"
    rationale: "All four full-profile runs proposed only cichla-ocellaris-temensis; retain the tally's
      unanimous verification and medium confidence. Willis and colleagues report Cuyuni C. ocellaris
      with nuclear haplotypes associated with C. temensis, supporting wild introgression under the
      currently retained Catalog species boundaries. This resolves checker-a's uncertainty about the
      locality. The already listed two-member group includes C. ocellaris and needs no amendment.
      The authors' proposed broader C. ocellaris species concept and vague trade-hybrid warnings do
      not justify adding C. monoculus or other congeners; crossability is not transitive. The study
      does not quantify aquarium crossing frequency."

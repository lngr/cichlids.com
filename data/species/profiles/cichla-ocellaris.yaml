  temperatureC:
    value:
      min: 25
      max: 31
    confidence: "medium"
    rationale: "The tally retains 25 to 31 C, with unanimous agreement under its one-degree comparison
      rule. Generator and checker-c proposed 25 to 31, checker-a 24 to 30, and checker-b 25 to 32 C.
      Mol and colleagues describe main-channel temperatures of 27 to 31 C, while their wider pre-dam
      measurement range is 25.0 to 33.4 C and established reservoir observations include 28 to 32 C
      and 29.1 to 33.1 C. The chosen interval represents typical occupied waters, not every recorded
      temperature. The warmer endpoints, cool forest streams at 24.4 to 28.6 C and Palumeu
      main-river readings at 22.9 to 23.9 C remain in evidence. The Palumeu comparison lacks
      confirmed fish occurrence at each chemistry station. FishBase 24 to 27 C traces to aquarium
      literature and does not replace field observations."

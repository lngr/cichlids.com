        Generator lists suitable whole fish, prawns, mussels and accepted carnivore pellets;
        checker-a adds lancefish, whitebait and earthworms; checker-b and checker-c use fish flesh,
        shrimp, mussels and pellets. These food-list differences do not change the dietary class.
        CRC and Seriously Fish directly support piscivory and animal foods. The Brokopondo study's
        four shrimp-only full stomachs are retained as invertivore evidence for that local sample,
        alongside the study's broader piscivore designation. The special herbivore-associated
        high-protein bloat flag is false by dietary interpretation, not proof against other
        digestive illness. Pellet acceptance is individual; the retailer account reports
        pellet-trained stock but does not establish acceptance by every wild-caught fish."
    - field: "features.aggressionConspecific"
      proposals:
        - by: "generator"
          value: 3
        - by: "checker-a"
          value: 3
        - by: "checker-b"
          value: 3
        - by: "checker-c"
          value: 2
      decision: 3
      rationale: "Generator, checker-a and checker-b proposed level 3; checker-c proposed level 2.
        Fishkeeper favors a single fish or established pair, and AquaInfo reports damaging rivalry
        in small groups. These observations support persistent chasing and injury risk when pair
        compatibility or space is inadequate, while not establishing routine killing of correctly
        housed partners. AquariumDomain's hierarchy account supports level 2 and Aqua-Fish's
        peaceful classification translates to 0; both remain in evidence. The selected adult unit is
        an established compatible pair, not two arbitrary adults or an undersized group."

  sizeAndGrowth:
    text: "The approximate aquarium planning maxima are 60 cm for males and 55 cm for females.
      Confidence in the sex difference is low because the sources describe larger males without
      measuring separate typical maxima. A female can exceed the estimate, and unusually large males
      also occur. Published upper sizes of 74 cm total length and 75 cm standard length should not
      be treated as interchangeable measurements or expected size for every fish. Growth makes
      usable turning room and uninterrupted swimming length more useful planning checks than the
      size of a youngster at purchase. Allow for larger individuals when choosing permanent housing.
      Longevity advice suggests a commitment of roughly 10 to 15 years, but documented individual
      lifespan records are lacking."

      decision: 2
      rationale: "Generator, checker-b and checker-c proposed level 2; checker-a proposed level 3.
        Seriously Fish permits large mixed companions and describes moderate territorial aggression.
        Spawning pairs driving fish from their defended area supports level 2. Checker-a maps the

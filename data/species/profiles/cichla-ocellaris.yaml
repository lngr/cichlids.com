  compatibility:
    text: "Mixed keeping is possible in very large systems with robust adults that are comfortably too
      large to swallow. Large arowanas, armored catfishes and substantial cichlids are the
      categories supported by the care literature. The named examples below are conditional
      candidates, and their own adult space needs must fit the combined aquarium. Small tetras and
      dwarf cichlids remain prey even if they have survived alongside a young peacock bass.
      Territorial chasing and feeding competition also require monitoring. C. temensis shares a
      documented hybrid group with this species: Willis and colleagues inferred wild gene exchange
      in Cuyuni River fish. That finding supports a hybrid warning without establishing how often
      the pair crosses in aquaria or extending the risk to every Cichla."

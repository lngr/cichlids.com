    tolerance:
      value:
        min: 24
        max: 31
      confidence: "low"
      rationale: "The tally keeps 24 to 31 C with low confidence: generator and checker-c proposed 24 to
        31, checker-a 23 to 30, and checker-b 24 to 32 C. The agreeing endpoints are summarized by
        their median within the unanimous comparison band; this is not verification method median.
        Seriously Fish and Fishkeeper advise 24 to 27 C, the association 24 to 30, Aqua-Fish and
        Aquatic Community 23 to 27, the older composite Tropical Freshwater Fish sheet 23 to 28,
        AquariumDomain about 24.4 to 28.9, and The Fish Collection 26 to 30 C. AquaInfo instead
        restricts advice to 23 to 25 C, which conflicts with measured occupied native water. The
        decided range excludes the proposed 23 and 32 C endpoints but includes the natural 31 C
        upper bound. None of the read sources demonstrates years of aquarium health at 31 C. Acute
        cold or heat experiments on introduced or historically identified fish do not establish
        chronic endpoints for the Guianan taxon."

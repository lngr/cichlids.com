  sexing:
    text: "Young fish are difficult to sex reliably. Mature males tend to grow larger and may develop a
      forehead swelling, but neither size nor head shape alone guarantees sex. The 55 cm female
      planning figure is inferred and cannot be used to identify an individual. Spawning behavior
      provides stronger evidence of a functioning pair than external size comparisons. Species
      markings and a credible collection history are also important because juvenile Cichla sold
      under the same trade name can belong to different species."

      L and a 304.8 by 121.92 cm footprint. This uses the strongest published adult standard rather
      than an exact interpolated threshold. AquaInfo's wider adult recommendation is 2500 to 5000 L
      without a footprint; it supports this scale but recommends a different group arrangement. The
      association gives 1500 L and 250 cm; AquariumDomain about 1325 L and up to 244 by 91 cm; The
      Fish Collection 760 L for one adult and about 1136 to 1893 L for a pair or community. These
      smaller or ambiguous recommendations remain cited. The selected minimum is a provisional
      planning allowance for one already compatible adult pair, with separation available; no source
      tests a precise pair minimum. Large groups or mixed displays require additional room."

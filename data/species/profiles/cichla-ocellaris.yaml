partners:
  suitable:
    - species: "Osteoglossum bicirrhosum"
      reason: "A fully grown arowana is a large companion of the category allowed by the care literature;
        it must be too large to swallow."
      condition: "Only in a substantially enlarged display that also meets the arowana adult swimming
        requirements; monitor feeding competition and pairing aggression."
    - species: "Pterygoplichthys gibbiceps"
      reason: "A fully grown large armored catfish is a candidate from the large-catfish category, with a
        different main feeding zone."
      condition: "Use only a large adult with ample bottom space and a protected resting site; watch for
        nighttime disturbance or rasping."
    - species: "Astronotus ocellatus"
      reason: "A robust fully grown oscar is a candidate from the large-cichlid category and can share
        warm water."
      condition: "Both fish must be comfortably outside each other's prey size and have separate retreat
        areas in a display larger than the pair minimum; this exact pairing is an inference."
  unsuitable:
    - species: "Paracheirodon axelrodi"
      reason: "Its small adult size makes it prey for an adult peacock bass."
    - species: "Apistogramma cacatuoides"
      reason: "A small dwarf cichlid cannot safely share the predator's feeding and territory space."
    - species: "Cichla temensis"
      reason: "The curated hybrid group reflects wild introgression with C. ocellaris, making this a poor
        combination for preserving species identity and breeding lines."
profile:
  overview:
    text: "Cichla ocellaris is a large peacock cichlid from the Guiana Shield and upper Rio Branco.
      Adult fish combine strong swimming and prey capture with conspicuous dark markings and a tail
      eyespot. A young fish sold under this name may belong to another Cichla species, so collection
      history and reliable identification matter. This account follows the Catalog of Fishes and
      keeps C. monoculus and C. temensis separate. A permanent adult enclosure is the central
      requirement: the species can outgrow ordinary home aquaria long before its full size is
      reached."
    sources:

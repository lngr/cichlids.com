  problems:
    text: "The main long-term problems arise when growth overtakes available housing, waste exceeds
      filtration capacity, or a pair becomes incompatible. Keep a secure cover and avoid sharp
      structures where startled fish can injure themselves. Monitor breathing, appetite and injuries
      together with water quality; persistent abnormalities need qualified aquatic advice rather
      than a diagnosis from one sign alone. Water stability matters most when buffering is weak. The
      uncertain tolerance boundaries are planning estimates, not targets to test on fish. Broad
      trade labels, historical species aggregates and poorly documented hybrids make identification
      a further source of uncertainty."

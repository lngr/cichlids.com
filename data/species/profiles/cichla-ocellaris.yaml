  ghDgh:
    value:
      min: 0
      max: 1
    confidence: "medium"
    rationale: "The tally retains 0 to 1 dGH with medium confidence. Generator proposed 0.1 to 0.2,
      checker-a 0 to 3, and checker-b and checker-c 0 to 1 dGH. The rounded agreeing median provides
      a regional very-soft-water category rather than a claim of exact zero hardness. Sipaliwini
      main-river measurements of 1.95 to 3.40 mg/L as CaCO3 convert to 0.109 to 0.191 dGH using
      17.848 mg/L per dGH. Other Suriname report samples span about 0.07 to 0.84 dGH. Checker-b
      derives an upper Branco envelope of 0.69 dGH from separate calcium and magnesium maxima, not a
      paired sample. Checker-a retains wider Iwokrama kit readings of 2.2 to 5.6 dGH, which are
      questionable beside the same survey's very low conductivity. Those readings remain visible;
      they do not establish a typical species-wide upper value. Conductivity-based hardness
      inferences are retained as inferences, not direct measurements."

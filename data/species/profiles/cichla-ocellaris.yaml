      rationale: "The tally decides pH 5.1 to 7.3 with unanimous agreement under the 0.3 comparison rule.
        Generator, checker-b and checker-c proposed 5.1 to 7.3; checker-a proposed 5.1 to 7.0,
        excluding the artificial reservoir. Mol and colleagues measured 5.1 to 6.0 in the undammed
        Suriname River and 6.7 to 7.3 in Brokopondo surface water in 2004. The species occupies both
        settings, so established reservoir surface water is relevant despite the artificial origin
        of the lake. The wider 1981 surface range of 6.2 to 7.8 is retained but does not define
        typical conditions. Iwokrama, Sipaliwini and Palumeu comparisons also support acidic to
        near-neutral regional water. Deep anoxic reservoir layers are unsuitable habitat proxies.
        SWRIS data-request pages and the Leentvaar repository abstract add no readable numerical
        series."

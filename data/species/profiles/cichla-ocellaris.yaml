    kind: "locality"
    note: "A native regional population with a mitochondrial lineage differentiated from the Marowijne
      population; not a separate species or a guaranteed aquarium color form."
  - name: "Marowijne drainage"
    kind: "locality"
    note: "A native regional population discussed separately in the genetic study; locality claims in
      the trade need collection records."
features:
  origin:
    value:
      continent: "South America"
      region: "Guiana Shield coastal drainages and upper Rio Branco in the northern Amazon basin"
      waterbody: null
      localities:
        - "Marowijne (Maroni) drainage"
        - "Suriname River and Brokopondo Reservoir"
        - "Corantijn (Courantyne), including Sipaliwini"
        - "Demerara River"
        - "Essequibo and Cuyuni rivers"
        - "Upper Rio Branco, Brazil"
    confidence: "high"
    rationale: "The generator names the Marowijne to Essequibo rivers and upper Branco; checker-a adds
      the intervening Corantijn and Demerara drainages; checker-b uses the same coastal-drainage and
      upper Branco scope; checker-c gives fewer named localities and notes Brazil without a precise
      eastern Amazon site. The Catalog, FishBase, the association register and the revision
      summarized by USFWS support a Guianan species with upper Branco records. These records connect
      it to the Amazon basin but do not establish a broad eastern Amazon distribution. Wider Amazon
      and Orinoco claims in hobby accounts often use an older aggregate of currently separate Cichla
      species. Native Suriname field surveys support the included reservoir and Sipaliwini
      occurrences."

  breeding:
    text: "A compatible pair deposits eggs on an exposed hard surface and defends the brood. Both
      parents participate in care, including moving newly hatched larvae into prepared depressions.
      That transfer is different from brooding eggs or fry in the mouth as a reproductive mode. A
      flat stone or suitable wooden surface can serve as a spawning site. Pair defense can make an
      otherwise workable mixed aquarium unsafe, so prepare separate accommodation before encouraging
      reproduction. Reports differ in detail and some refer to historically broad species
      identifications; locality records help keep offspring correctly identified."

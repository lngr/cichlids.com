  socialBehavior:
    text: "An established compatible pair is the adult unit used for this profile. Schooling in nature
      and successful group keeping do not mean that two unfamiliar adults form a safe pair. Sources
      disagree over small groups: some describe a manageable hierarchy, while others report serious
      rivalry and recommend much larger groups. Watch for one fish controlling food, swimming space
      or resting sites, and retain a practical separation option. Territorial defense becomes
      stronger with spawning, but it is not restricted to reproduction. The pair minimum does not
      provide a group-housing standard."

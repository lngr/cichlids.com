  temperatureC:
    value:
      min: 21
      max: 29
    confidence: high
    rationale: "Retain the tally waterbody decision of 21 to 29 C at high confidence. Eccles describes the cool\
      \ inshore endpoint in its abstract; Vollmer documents seasonal upper-water cooling and warming, and the later\
      \ Ngochera and Bootsma publication corroborates 29 C. Branchu campaign means of 24.48 to 26.15 C and the FAO\
      \ historical 23 to 25 C interval sample only part of this envelope. The range describes natural sites and\
      \ seasons rather than a constant captive setting. The full Eccles text was unavailable through fetch-oa; its\
      \ abstract is sufficient for the temperatures cited. The non-DOI 1999 mixing chapter and 2018 dissertation\
      \ full text were not fetched; no numerical evidence is assigned to those unread works."
    sources:
    - kind: literature
      title: "Eccles, D. H. (1974). An outline of the physical limnology of Lake Malawi (Lake Nyasa). Limnology\

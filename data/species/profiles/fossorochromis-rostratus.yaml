partners:
  suitable:
  - species: Cyrtocara moorii
    reason: Calm substantial Malawi sand follower with a documented feeding association in the wild.
    condition: "Established adults in an aquarium with extra room for both social units, beyond the base harem minimum."
  - species: Placidochromis electra
    reason: A specialist-directory companion with compatible sand and invertebrate-feeding requirements.
    condition: "Established adults comfortably too large to swallow, with extra sand area and volume for both species.\
      \ Juveniles may be at risk."
  - species: Placidochromis phenochilus
    reason: A compatible sand follower identified by Malawi-Guru for a large Malawi community.
    condition: "Established adults comfortably too large to swallow, with extra sand area and volume for both species.\
      \ Juveniles may be at risk."
  unsuitable:
  - species: Melanochromis auratus
    reason: The mbuna temperament and rock-territory pressure can repeatedly intimidate this calmer sand-feeding
      fish.
  - species: Paracheirodon innesi
    reason: Very small adults are prey candidates and their usual water requirements are poorly matched to an alkaline
      Malawi setup.
  - species: Champsochromis caeruleus
    reason: A breeder reports an accidental named-parent aquarium cross. The crossing group has presumed basis because
      conspecific mate availability and parentage are unverified.
    condition: A caution for pure-species breeding projects; not a claim that every adult display pairing produces
      hybrids.
profile:
  overview:
    text: "A sand-diving escape is the behaviour that makes this large Malawi cichlid memorable. Fossorochromis\
      \ rostratus searches the bottom for tiny animals, while mature dominant males develop striking iridescent\
      \ colour. Females and young fish are much less conspicuous. It can live with other calm, substantial Malawi\
      \ cichlids, provided the aquarium offers generous swimming room. Choose it for a long-term large-tank project.\
      \ A young fish looking comfortable in a small aquarium gives little indication of the space and social management\
      \ an adult harem will need."
    sources:
    - kind: catalog-of-fishes
      title: "Eschmeyer's Catalog of Fishes: species of Fossorochromis"
      url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Fossorochromis"
      accessed: '2026-10-13'

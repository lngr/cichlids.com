  compatibility:
    text: "A spacious community with calm, substantial adult Malawi cichlids is possible. Cyrtocara moorii is a\
      \ well-supported companion, and Malawi-Guru also names Placidochromis electra and Placidochromis phenochilus.\
      \ Allow additional space for their adult social units and keep each fish comfortably too large to swallow.\
      \ Aggressive mbuna can intimidate this sand feeder. Small tankmates and fry remain at risk even though natural\
      \ feeding accounts primarily describe invertebrates. Ron's Cichlids reports an accidental cross with Champsochromis\
      \ caeruleus. Free partner choice and parentage checks are unstated, so the planner treats that pair as a presumed\
      \ crossing risk rather than a confirmed free-choice cross."
    sources:

  socialBehavior:
    text: "The chosen adult unit is one male with three females. Plain-looking juveniles can mature into competing\
      \ males, and colour alone cannot guarantee a safe sex ratio. Breeding males may defend a substantial part\
      \ of the aquarium and pursue rivals or females. The Nordic register describes milder breeding behaviour, so\
      \ individual and contextual variation remains important. A GCCA keeper recorded a fatal rival attack in a\
      \ much smaller tank with two males. Provide refuge and routes away from a courting male, and watch for persistent\
      \ pursuit, missed meals or damage. Multiple mature males need substantially more room than the stated harem\
      \ minimum."
    sources:
    - kind: literature
      title: "Borstein, R. (2002). Fossorochromis rostratus. Greater Chicago Cichlid Association breeding report."

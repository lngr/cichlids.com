  sizeAndGrowth:
    text: "Allow for a well-grown aquarium male of about 35 cm and a female of about 25 cm. Some unsexed care-sheet\
      \ figures are smaller, while others extend to 40 cm; standard and total length also measure different parts\
      \ of a fish. The selected sizes are practical sex-specific adult estimates. The GCCA keeper needed roughly\
      \ two years for males to reach a mature appearance. A subordinate adult may still resemble a female. Eight\
      \ to ten years is a provisional lifespan expectation, with published estimates spanning five to fifteen, so\
      \ this is a substantial long-term commitment."
    sources:

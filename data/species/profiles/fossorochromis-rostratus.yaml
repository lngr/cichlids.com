  ph:
    value:
      min: 7.7
      max: 8.6
    confidence: high
    rationale: Retain the tally waterbody decision of pH 7.7 to 8.6 at high confidence. The FAO compilation attributes
      that surface interval to Jackson et al. Branchu discusses 7.5 to 8.5 for the water column. Its lower 7.5 endpoint
      includes deeper water and does not replace the decided surface envelope for this mainly shallow-water fish.
      Aquarium recommendations determine tolerance separately.

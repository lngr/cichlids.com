      confidence: low
      rationale: "All four runs propose 21 to 29 C, retained exactly with unanimous verification and low confidence.\
        \ Seriously Fish gives 25 to 29 C, AquaInfo 22 to 26, Aqua-Fish 25 to 27, the Nordic and Aquainfo.dk tables\
        \ 23 to 28, and GCCA about 23.9 to 26.7. The natural cool endpoint of 21 C must be included, but the care\
        \ sources do not establish multi-year captive health there. These are recommended intervals rather than\
        \ controlled longevity trials. About 24 to 26 C is a practical central setting."

  breeding:
    text: "The female mouthbroods the eggs and young for about three weeks. A male can court several females and\
      \ may use a sand depression or a flat surface. Mature size and a stable social group matter more than attempting\
      \ to trigger spawning in young fish. Provide sheltered areas where a brooding female can withdraw without\
      \ losing all contact with the group. Brooding reduces feeding and can cost body condition. Stressful moves\
      \ may interrupt the brood. If you intend to raise fry, prepare suitable separate space before release and\
      \ offer appropriately small aquatic foods."
    sources:
    - kind: literature
      title: "Borstein, R. (2002). Fossorochromis rostratus. Greater Chicago Cichlid Association breeding report."
      url: "https://www.gcca.net/art-pics/cichlid-profiles-list/malawi-cichlids/62-fossorochromis-rostratus.html"

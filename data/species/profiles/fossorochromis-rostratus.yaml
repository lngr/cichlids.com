  problems:
    text: "A cramped aquarium can turn a sudden escape dive into a collision. Sharp gravel may injure the snout\
      \ or eyes, while insecure rocks can move as sand is displaced. Persistent bullying may leave a fish hiding\
      \ and missing meals, and male rivalry can escalate quickly during breeding. Poor water quality, injuries and\
      \ prolonged stress can increase infection risk. Overfeeding and unsuitable fatty foods add digestive risks,\
      \ including swelling sometimes described as bloat. Swelling or refusal of food has several possible causes.\
      \ Check water quality and social pressure promptly and seek qualified help for persistent symptoms."
    sources:
    - kind: literature
      title: "Borstein, R. (2002). Fossorochromis rostratus. Greater Chicago Cichlid Association breeding report."

  habitat:
    text: "Fossorochromis rostratus lives across Lake Malawi, with occurrence also reported in connected Lake Malombe.\
      \ It searches broad sandy shallows for invertebrates, and can disappear into the substrate when disturbed.\
      \ Open water above the bottom accommodates roaming feeding groups. Mothers with young have also been observed\
      \ over rock, so sparse rocky refuges have a reproductive role alongside the essential sand. Natural lake ranges\
      \ used here are 21 to 29 C, pH 7.7 to 8.6, GH 3 to 5 dGH and KH 5 to 8 dKH. These measurements span sites\
      \ and seasons; aquarium settings should remain steady."
    sources:
    - kind: literature
      title: "Ribbink, A. J. et al. (1980). Parental behaviour and mixed broods among cichlid fish of Lake Malawi.\
        \ South African Journal of Zoology 15(1), 1-6."
      url: "https://doi.org/10.1080/02541858.1980.11447677"
      accessed: '2026-10-13'

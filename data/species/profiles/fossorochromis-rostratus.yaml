    note: Regan 1922 name explicitly treated as a synonym by the Catalog of Fishes.
  legacyNames:
  - Fossorochromis rostratus
  - Cyrtocara rostrata
  note: "The Catalog of Fishes accepts Fossorochromis rostratus (Boulenger, 1899) and treats Haplochromis macrorhynchus\
    \ as its junior synonym. The legacy genus is unchanged. Former genus combinations are retained separately from\
    \ that junior synonym. The GCCA article gives 1898, which is rejected in favour of the catalog authority; the\
    \ CRC public summary independently confirms the valid name.
    The legacy catalog also held the species under Cyrtocara rostrata, and that entry maps to this profile."

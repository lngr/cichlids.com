  husbandry:
    text: "One adult male with three females needs at least 1000 litres, 250 cm of length and 60 cm of front-to-back\
      \ space. Meet the volume and footprint requirements together. Keep much of the floor exposed sand, with clear\
      \ swimming routes and secure stones at the margins. A soft sand layer about 5 to 10 cm deep permits digging\
      \ and escape dives. Rocks must remain stable when sand beneath them moves. Maintain effective biological filtration,\
      \ oxygenation and regular water changes. About 24 to 26 C is a practical central setting. The recorded tolerance\
      \ envelopes are 21 to 29 C, pH 7.5 to 8.8, GH 3 to 25 dGH and KH 5 to 12 dKH; confidence is lowest at poorly\
      \ tested temperature and KH endpoints. Test GH and KH separately and keep alkaline conditions stable."
    sources:
    - kind: literature
      title: "JBL: Carbonate hardness aquarium husbandry booklet, pages 3 to 6."
      url: "https://www.jbl.de/en/download/8737/Ratgeber/JBL-Karbonathaerte_de.pdf"
      accessed: '2026-10-13'

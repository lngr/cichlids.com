  sexing:
    text: "Bright colour identifies a dominant mature male more reliably than it identifies every male. Females\
      \ and subordinate males may share a pale body and dark flank markings. This means that buying several plain\
      \ fish does not guarantee several females. The colourful male is generally larger and may change intensity\
      \ with rank or breeding activity. Allow juveniles time to develop, and reassess the sex ratio when the group\
      \ begins courting. Locality labels such as Chesese or Otter Point refer to origin; they should not be treated\
      \ as a reliable method of sexing or as established separate colour breeds."
    sources:

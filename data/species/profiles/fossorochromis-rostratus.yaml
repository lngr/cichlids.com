  aggressionConspecific:
    value: 3
    confidence: medium
    rationale: "Generator proposes level 2; all three checkers propose 3. Adopt level 3 because large spawning territories\
      \ and strong male rivalry make sustained reproductive pursuit a plausible risk even in a one-male harem. The\
      \ Nordic register instead describes mild spawning aggression, and AquaInfo describes generally tolerant fish.\
      \ GCCA documents a fatal rival attack with two males in an undersized 65 US gallon tank; that establishes\
      \ danger from the wrong ratio and space, not routine level-4 behaviour under the stated adult setup. The exact\
      \ chasing and injury rate in a 1000 L harem is not measured, so medium confidence is retained."

  diet:
    text: "Base feeding on its natural role as an invertebrate eater. Offer a suitable sinking cichlid food and\
      \ small supplementary portions of aquatic crustaceans such as Artemia or Mysis. This gives bottom-feeding\
      \ opportunities without requiring live fish. Appetite can be strong once fish settle, so spread food and check\
      \ that quieter individuals receive some. Remove leftovers before they become a water-quality problem. A protein-rich\
      \ invertebrate diet suits the species; fatty mammalian foods and oversized meals do not. Its large mouth still\
      \ makes small tankmates unsafe even though fish are not its principal wild food."
    sources:
    - kind: literature
      title: "Ribbink, A. J. et al. (1980). Parental behaviour and mixed broods among cichlid fish of Lake Malawi.\
        \ South African Journal of Zoology 15(1), 1-6."

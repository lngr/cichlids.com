schemaVersion: 1
id: mesoheros-festae
legacyIds: [690]
status: described

taxonomy:
  validName: Mesoheros festae
  genus: Mesoheros
  species: festae
  author: (Boulenger, 1899)
  source: &cof
    kind: catalog-of-fishes
    title: "Eschmeyer's Catalog of Fishes, species list of the genus Mesoheros (entry festae, Heros)"
    url: https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Mesoheros
    archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-50069fba/2026-10-14T101605Z
    accessed: 2026-10-13
  synonyms:
    - name: Heros festae
      note: Original combination, Boulenger 1899; type locality Rio Guayas at Guayaquil, Ecuador. Also used by Ortega and Vari (1986).
    - name: Cichlaurus festae
      note: Combination used by Ovchynnyk (1967).
    - name: Nandopsis festae
      note: Combination used by Burgess (2000).
    - name: Cichlasoma festae
      note: Used by Kullander (2003) as incertae sedis in 'Cichlasoma' and by later checklists; the common trade name and the name of the Ecuadorian aquaculture papers.
    - name: Amphilophus festae
      note: Hobby name found on care sheets; not a combination listed by the Catalog of Fishes.
    - name: Herichthys festae
      note: Hobby name found on care sheets; not a combination listed by the Catalog of Fishes.
  legacyNames:
    - Cichlasoma festae
  note: >-
    Boulenger described the species in 1899 as Heros festae from the Rio Guayas at Guayaquil.
    Ovchynnyk (1967) placed it in Cichlaurus, Ortega and Vari (1986) kept it in Heros, Burgess (2000)
    put it in Nandopsis, and Kullander (2003) listed it as incertae sedis in 'Cichlasoma', the name
    under which the trade and the legacy catalog know it. McMahan et al. (2015) and Musilová et al.
    (2015) erected Mesoheros for this species and its Pacific-slope relatives, followed by Říčan et
    al. (2016) and later authors; the Catalog of Fishes lists it as valid as Mesoheros festae, with
    Pacific drainages of Ecuador and Peru as range and an introduced population in Singapore. The
    Catalog lists no separate festae entry under Cichlasoma, since the species is filed under its
    original genus Heros. FishBase uses the name Mesoheros festae in its title but keeps the older
    placement in its remarks, treating the species as incertae sedis in Cichlasoma pending a
    revision of the heroine cichlids. The Cichlid Room Companion also uses Mesoheros festae. The
    common name red terror is shared in the trade with Mayaheros urophthalmus, a different species.

names:
  trade:
    en: [Red terror, True red terror, Festae cichlid, Festa's cichlid, Guayas cichlid]
    de: [Tigerbuntbarsch, Red Terror]
    es-419: [Vieja colorada, Vieja roja]

features:
  origin:
    value:
      continent: South America
      region: Pacific slope of Ecuador and northernmost Peru, from the Esmeraldas to the Tumbes drainage
      waterbody: null
      localities:
        - Rio Esmeraldas drainage, Ecuador, including the Santiago-Cayapas system
        - Rio Guayas basin (Daule, Babahoyo and Vinces rivers), Ecuador
        - Abras de Mantequilla wetland, Los Rios, Ecuador
        - Rio Tumbes, Peru
    confidence: high
    rationale: >-
      The Catalog of Fishes gives the Pacific drainages of Ecuador and Peru, and FishBase and the
      Freshwater Fishes of Western Ecuador database narrow this to the coastal rivers between the
      Esmeraldas in Ecuador and the Tumbes in Peru; the type locality is the Rio Guayas at Guayaquil.
      Field studies confirm wild fish in the Babahoyo River of the Guayas basin and in the
      Santiago-Cayapas watershed of Esmeraldas province. One older author restricted the species to
      the Guayas drainage, which later records contradict. The public part of the Cichlid Room
      Companion page adds Colombia to the range, which the Catalog of Fishes does not support. An
      introduced population in Singapore is not part of the natural range. The species lives in
      rivers, not in a lake of the waterbody table. All three runs agree on the origin.

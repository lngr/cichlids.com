  ph:
    value: {min: 6.2, max: 8.0}
    confidence: medium
    verification: {method: unanimous, votes: {agree: 3, total: 3}}
    rationale: >-
      The rivers of the range are near neutral to slightly alkaline. The 28 Pacific rivers of the
      HYBAM study range from pH 6.6 to 7.8, with station means of 6.3 for the Esmeraldas and 6.2 for
      the Tumbes. In the Guayas basin the 2013 dry-season survey found a median of 7.6 and a mean of
      7.7 with a standard deviation of 0.5; its extremes of 6.6 and 8.9 include a reservoir and
      eutrophic still water where algae raise the pH. The wild fish of the Babahoyo were caught at
      pH 7.0 to 7.3, and the soft Santiago-Cayapas streams averaged 7.0 with single readings from 5.6
      to 8.0. The range 6.2 to 8.0 joins the low river means with the bulk of the Guayas sites and
      leaves out photosynthetic peaks and acid mine or blackwater readings. The three proposals (6.2
      to 8.0, 6.5 to 8.0 and 6.0 to 8.0) agree within the threshold of the vote count.
    sources:
      - *moquet
      - *nguyen
      - *damanik
      - *gonzalez
      - *rebolledo
      - &laccei
        kind: literature
        title: >-
          Goyburo, C., Villamar, K., Villalta, M., Cedeño, J. A., Vitvar, T., Valverde-Armas, P. and
          Jiménez-Oyola, S. (2023). Hydrochemical characterization of water in Santa Rosa community,
          southern Ecuador. Proceedings of the LACCEI 2023 conference.
        url: https://doi.org/10.18687/laccei2023.1.1.594
        archived: doi.org/10.18687_laccei2023.1.1.594/2026-10-13T002740Z
        accessed: 2026-10-13
    evidence:
      - source: *moquet
        value: {min: 6.2, max: 7.8}
        note: station means 6.3 (Esmeraldas) and 6.2 (Tumbes); 6.6 to 7.8 across the 28 sampled rivers; single Esmeraldas samples in the supplementary table reach 8.8
      - source: *damanik
        value: {min: 7.2, max: 8.2}
        note: Guayas basin mean plus or minus one standard deviation; extremes 6.6 to 8.9
      - source: *nguyen
        value: {min: 6.6, max: 8.9}
        note: same Guayas survey, extremes; median 7.6
      - source: *gonzalez
        value: {min: 7.0, max: 7.3}
        note: Babahoyo River collecting site of wild fish and fish farm
      - source: *rebolledo
        value: {min: 5.6, max: 8.0}
        note: unmined control streams of the Santiago-Cayapas watershed, mean 7.0; downstream sites 5.9 to 8.0
      - source: *laccei
        value: {min: 4.56, max: 8.13}
        note: Santa Rosa river system in El Oro; the low values come from mining-affected streams
      - source: *fishbase
        value: {min: 7.0}
        note: lower limit only, aquarium value
    tolerance:
      value: {min: 6.0, max: 8.0}
      confidence: medium
      verification: {method: unanimous, votes: {agree: 3, total: 3}}
      rationale: >-
        Seriously Fish, Tropical Freshwater Fish and Fishkeeper all give pH 6.0 to 8.0 and describe a
        species that adapts to a wide range of water; Guidarium gives 6.5 to 8.0, FishProfiles a
        narrower 7.0 to 7.8 and FishBase a lower limit of 7.0. Juveniles grew in an Ecuadorian feed
        trial at pH 6.7 plus or minus 0.5, and wild fish were held for two days at pH 5.6 before
        slaughter, a short exposure that says nothing about long-term keeping. The range 6.0 to 8.0
        contains the natural range of 6.2 to 8.0.
      sources:
        - *sf
        - *tff
        - *fp
        - *fishbase
        - *fk
        - *guidarium
        - *sjar
        - *hidro
      evidence:

  ghDgh:
    value: {min: 1, max: 5}
    confidence: medium
    verification: {method: unanimous, votes: {agree: 3, total: 3}}
    rationale: >-
      The coastal rivers carry soft water. Total hardness calculated from the HYBAM major-ion means
      is 2.2 dGH for the Esmeraldas (0.22 mmol/L calcium, 0.17 mmol/L magnesium; 1.3 to 3.1 dGH
      within one standard deviation) and 3.1 dGH for the Tumbes (0.8 to 5.4 dGH within one standard
      deviation). The Santiago-Cayapas streams are softer still, with conductivities of about 11 to
      74 uS/cm and little magnesium, and the Santa Rosa river in the far south gives 1.2 to 7.2 dGH
      from calcium and magnesium, the upper values from sulfate-rich mining streams. No direct
      hardness measurement exists for the Guayas basin; its median conductivity of about 123 uS/cm in
      the dry-season survey resembles the 121 and 127 uS/cm of the two HYBAM stations, so its water
      is taken as similarly soft. The FishBase limit of 15 dH is an aquarium value. The proposals (1
      to 5, 1 to 6 and 1 to 5 dGH) agree within the threshold of the vote count.
    sources:
      - *moquet
      - *nguyen
      - *fishbase
      - *rebolledo
      - *damanik
      - *gonzalez
      - *laccei
    evidence:
      - source: *moquet
        value: {min: 0.8, max: 5.4}
        note: calculated from calcium and magnesium means and standard deviations of the Esmeraldas and Tumbes stations
      - source: *rebolledo
        value: {min: 0.3, max: 2}
        note: estimated from conductivity and magnesium of the control streams; calcium not reported
      - source: *damanik
        value: {min: 2, max: 7}
        note: estimated from a mean conductivity of 200 uS/cm in the Guayas basin; no ions measured
      - source: *laccei
        value: {min: 1.2, max: 7.2}
        note: calculated from calcium and magnesium of one river in the dry season, median 4.0
      - source: *fishbase
        value: {max: 15}
        note: aquarium value after Baensch and Riehl, not a habitat measurement
    tolerance:
      value: {min: 1, max: 18}
      confidence: medium
      verification: {method: unanimous, votes: {agree: 3, total: 3}}
      rationale: >-
        All three runs proposed 1 to 18 dGH. Care sheets agree that the species accepts a wide

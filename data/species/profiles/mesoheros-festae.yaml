partners:
  suitable:
    - species: Pterygoplichthys pardalis
      reason: Large armoured catfish that lives on the bottom, is too big to eat and is protected by its armour; care sheets name large armoured catfish as tankmates.
      condition: Tank of at least 1000 litres with caves for the catfish.
    - species: Parachromis managuensis
      reason: Of similar size, robustness and temperament, so it can hold its own against an adult red terror.
      condition: At least 1000 litres and many visual barriers; both introduced at the same size; separate when a pair spawns.
    - species: Vieja melanurus
      reason: Large, robust Central American cichlid of comparable size that feeds largely on plant matter and competes less for the same food.
      condition: At least 1000 litres; works better with a single red terror than with a breeding pair. Keep separate for breeding because of the presumed hybrid risk.
    - species: Andinoacara rivulatus
      reason: Lives in the same rivers of western Ecuador and is a robust, assertive cichlid that tolerates similar water.
      condition: Only in very large tanks with adult green terrors of 25 cm or more; remove when the red terrors breed.
  unsuitable:
    - species: Mayaheros urophthalmus
      reason: Look-alike with the same bar pattern; it provokes rival aggression, and both species are hard to tell apart in the trade.
    - species: Pterophyllum scalare
      reason: Slow, tall-bodied fish that fits into the mouth of an adult and would be harassed and eaten.
    - species: Symphysodon aequifasciatus
      reason: Peaceful, slow feeder that needs warmer, softer water and calm surroundings; it would be outcompeted and attacked.
    - species: Amatitlania nigrofasciata
      reason: Much smaller barred cichlid that is eaten or killed by an adult, and whose similar bars trigger rival behaviour.
    - species: Paracheirodon innesi
      reason: Small schooling fish that is simply food for the red terror.

profile:
  overview:
    text: >-
      Mesoheros festae, the red terror, is a large, colourful cichlid from the Pacific side of
      Ecuador and northern Peru. The trade knows it as Cichlasoma festae; since 2015 it has been
      placed in the genus Mesoheros. In its home country it is a valued food fish called vieja
      colorada. Young fish and females are bright red to orange with broad black bars, while big
      males turn greener and show blue spangles. The species is known as one of the most aggressive
      cichlids in the hobby: pairs are hard to form, a mismatched partner may be killed, and breeding
      fish attack everything in their tank. It is a fish for experienced keepers with a tank of at
      least 2 m. Its water needs are simple, and it is hardy once settled. The look-alike Mayaheros
      urophthalmus is often sold under the same name, so buy from a dealer who knows the difference.
    sources:
      - *cof
      - *sf
      - *fk
      - *depaul
      - *glaser
  habitat:
    text: >-
      The species lives in the coastal rivers west of the Andes, from the Esmeraldas drainage in
      northern Ecuador through the large Guayas basin to the Tumbes River in Peru. It is found in
      small and medium rivers, their tributaries and lowland wetlands such as Abras de Mantequilla,
      and prefers slow stretches near the bank with submerged plants and fallen wood. These rivers
      carry soft water with little carbonate: long-term monitoring of the Esmeraldas and Tumbes shows
      about 2 to 3 dGH and about 2.5 dKH. River temperatures where the fish lives mostly lie between
      about 22 and 30 C, with means near 25 to 26 C, and the pH is mostly between about 6.2 and 8. A
      population introduced through the aquarium trade is established in Singapore.
    sources:
      - *fishbase
      - *depaul
      - *moquet
      - *damanik
      - *rebolledo
      - *mercury
      - *fk
  sizeAndGrowth:
    text: >-
      Red terrors grow large and heavy. In the aquarium males usually reach 35 to 40 cm and females
      about 30 cm; reports of 50 cm fish are exceptional records, and wild fish caught for food
      rarely exceed 25 cm. Growth is fast in the first year: the sexes start to differ in colour at
      about 10 cm, and pairs usually mature when the male is around 18 to 20 cm and well over a year
      old. Juveniles raised in Ecuadorian net cages grew from about 6 to 12 cm standard length in
      half a year. Plan the tank for the adult size from the start, because shops rarely take back a
      fully grown red terror.
    sources:
      - *glaser
      - *fp
      - *sf
      - *tff
      - *gonzalez
      - &rbt
        kind: literature
        title: >-
          Rodríguez, J. M., Angón, E., González, M. A., Perea, J., Barba, C. and García, A. (2017).
          Allometric relationship and growth models of juveniles of Cichlasoma festae (Perciforme:
          Cichlidae), a freshwater species native in Ecuador. Revista de Biología Tropical 65(3).
        url: https://doi.org/10.15517/rbt.v65i3.26173
        archived: doi.org/10.15517_rbt.v65i3.26173/2026-10-13T002657Z
        accessed: 2026-10-13
  husbandry:
    text: >-
      A single adult pair needs about 750 litres and a tank of at least 200 by 60 cm; tankmates call
      for 1000 litres or more. Use soft sand or fine rounded gravel, because these fish dig a lot.
      Build caves and cover from large rocks and wood and bond the rockwork with silicone so it
      cannot collapse. Leave open swimming space in front. Rooted plants will be uprooted; floating
      plants or plants tied to wood may survive. Protect the heater or use an external heater, and
      fit a heavy, tight lid against jumping. Strong filtration and large, frequent water changes
      keep nitrate low. The species adapts to most tap water: a temperature of 25 to 28 C, pH 6.5 to
      7.8 and soft to medium-hard water suit it well.
    sources:
      - *sf
      - *fk
      - *fp
      - *tff
  socialBehavior:
    text: >-
      Red terrors are fiercely territorial towards their own kind. Placing an adult male and female
      together often ends with the weaker fish badly hurt or killed. The safer way is to raise a group
      of six to ten juveniles and let a pair form by itself, then rehome the rest. Even an
      established male may press a female that is not ready to spawn, so keep a tank divider at hand.
      Towards other species they defend a large area and, when breeding, attack every fish in the
      tank as well as the keeper's hands. Individual temperament varies: some fish stay manageable
      with large companions, others tolerate no tankmates at all.
    sources:
      - *sf
      - *fk
      - *tff
      - *glaser
      - *fp
      - *arch347
  diet:
    text: >-
      In the wild the red terror feeds mainly on crustaceans such as small shrimps and other bottom
      invertebrates, also takes small fish and fry, and possibly some fruits and seeds. In the tank it
      accepts almost everything. A good large cichlid pellet makes a suitable staple, supplemented
      with frozen shrimp, krill, mussel, earthworms and similar foods. A small plant share such as a
      spirulina-based food adds variety. Feed adults a moderate amount once or twice a day rather
      than overfeeding, because the large amounts of waste quickly spoil the water. Live feeder fish
      are not needed and can bring in disease.
    sources:
      - *fishbase
      - *depaul
      - *sf
      - *tff
      - *fk
      - *fp
  breeding:
    text: >-
      The species spawns on open but sheltered surfaces such as vertical slate, flat wood or the
      inside of a rock cave. Before spawning the pair intensifies its colours, courts with jaw
      locking and tail beating, and digs several pits in the substrate. The female lays up to about
      3000 eggs, which hatch in about three days; the parents then carry the larvae into the pits.
      The fry swim freely a few days later and take newly hatched brine shrimp and fine dry food.
      Both parents guard them for several weeks, and the male becomes extremely aggressive. A
      divider between male and female after spawning protects the female. Think about where
      hundreds of fast-growing juveniles will go before letting a pair breed.
    sources:
      - *fk
      - *sf
      - *fp
      - *glaser
      - *fishbase
  sexing:
    text: >-
      Juveniles cannot be sexed reliably until about 10 cm. From then on females keep the bright red
      to orange body with strong black bars and usually develop dark front parts of the dorsal fin
      and dark ventral fins, while losing most of their blue spangling. Males grow clearly larger,
      lose much of the red outside breeding, turn more greenish or yellowish, and keep blue spots in
      the fins and on the body. Old males can develop a fatty hump on the forehead. During breeding
      both sexes show their strongest colours, so compare fish of the same age.
    sources:
      - *fp
      - *tff
      - *fk
      - *sf
      - *glaser
  compatibility:
    text: >-
      Many keepers maintain red terrors alone or as a single pair. If tankmates are wanted, they
      must be equally large and robust, such as big Central American cichlids like Parachromis
      managuensis or Vieja melanurus, or large armoured catfish. Keep Vieja melanurus separate for
      breeding because of the presumed hybrid risk. This only works in tanks of 1000
      litres or more with plenty of visual barriers, and every tankmate may need to be moved out once
      a pair breeds. Any fish that fits into the mouth will be eaten, which at full size means fish
      of around 15 cm. Avoid Mayaheros urophthalmus and other barred look-alikes, which trigger
      rival fights, as well as calm, slow species such as angelfish or discus.
    sources:
      - *sf
      - *tff
      - *fk
      - *fp
      - *glaser
  problems:
    text: >-
      The most common mistake is a tank that is too small: a 5 cm juvenile soon becomes a 35 cm
      fighter. The second is putting an adult male and female together without a divider, which can
      end with a dead partner. Insufficiently secured rockwork can collapse when the fish dig, and
      unprotected heaters get broken. Heavy feeding of large cichlids leads to high nitrate and poor
      water quality, which in large neotropical cichlids is linked to head and lateral line erosion
      and to intestinal flagellate problems; keep the water clean, the diet varied and seek expert
      advice when lesions or white stringy faeces appear. Uncontrolled breeding produces far more
      large juveniles than the trade can absorb. Finally, check the identity of the fish: many fish
      sold as red terrors are Mayaheros urophthalmus.
    sources:
      - *sf
      - *fk
      - *glaser
      - *fp
      - *mk


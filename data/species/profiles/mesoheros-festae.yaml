  khDkh:
    value: {min: 1, max: 4}
    confidence: medium
    verification: {method: unanimous, votes: {agree: 3, total: 3}}
    rationale: >-
      Bicarbonate is the main anion of the Pacific rivers of Ecuador and northern Peru. The HYBAM
      stations give 0.91 mmol/L in the Esmeraldas and 0.90 mmol/L in the Tumbes, about 2.5 dKH; one
      standard deviation spans 1.5 to 3.6 dKH and 1.7 to 3.4 dKH. The Santa Rosa river in the south
      carries 0.2 to 2.7 dKH, and the very soft Santiago-Cayapas streams cannot hold much more. The
      somewhat higher conductivity of the Guayas basin suggests a little more bicarbonate there, but
      no alkalinity was measured. The proposals (1 to 4, 1 to 5 and 0.5 to 3 dKH) agree within the
      threshold of the vote count.
    sources:
      - *moquet
      - *damanik
      - *rebolledo
      - *laccei
    evidence:
      - source: *moquet
        value: {min: 1.5, max: 3.6}
        note: bicarbonate means plus or minus one standard deviation of the Esmeraldas and Tumbes stations
      - source: *damanik

      pattern: bars
    confidence: medium
    rationale: >-
      Juveniles and females are vivid red to orange with about seven to nine broad black bars and a
      black spot at the upper base of the tail, and females keep this pattern for life. Adult males
      turn greenish or yellowish with blue spangling, keep red in the fins and show intense red
      again while breeding; their bars fade with age but remain visible, the second bar often forked
      in a Y. The dominant colours of the adult male are therefore red, green and black on a barred
      pattern. The pattern resembles Mayaheros urophthalmus and, less closely, other barred
      cichlids.

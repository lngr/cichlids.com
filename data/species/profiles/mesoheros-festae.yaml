      verification: {method: conservative, votes: {agree: 3, total: 5}}
      rationale: >-
        The tolerance votes did not reach a qualified majority either: the generator proposed 23 to
        29 C, checker-a and tiebreaker-2 20 to 30 C, checker-b and tiebreaker-1 22 to 30 C. The
        conservative method takes the intersection of all five, 23 to 29 C, which is narrower than
        the decided natural range of 22 to 30 C, so the tolerance was widened to contain that
        natural range and is 22 to 30 C. Care sheets put the long-term aquarium range between 24 and
        29 C: Seriously Fish and Tropical Freshwater Fish 25 to 29 C, Fishkeeper 25 to 28 C,
        FishProfiles 24.4 to 27.8 C and FishBase, after an aquarium atlas, 26 to 28 C. The wider
        proposals of 20 to 30 C rest on the river measurements and on aquaculture stock held for a
        month at 19.5 C; these show that the fish survives cooler and warmer phases, but no source
        documents years at the edges. Keepers do best at 25 to 28 C.

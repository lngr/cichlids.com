          note: aquarium recommendation, optimum 7.0
        - source: *fp
          value: {min: 7.0, max: 7.8}
          note: aquarium recommendation
        - source: *fishbase
          value: {min: 7.0}
          note: lower limit only, aquarium value
        - source: *fk
          value: {min: 6.0, max: 8.0}
          note: aquarium recommendation, wide adaptability stated
        - source: *guidarium

        note: estimated from conductivity only; no alkalinity measured
      - source: *laccei
        value: {min: 0.2, max: 2.7}
        note: calculated from bicarbonate of one river in the dry season, median 1.4
    tolerance:
      value: {min: 1, max: 12}
      confidence: low
      verification: {method: unanimous, votes: {agree: 3, total: 3}}
      rationale: >-
        No species database states a carbonate hardness for this species. Seriously Fish and FishBase
        give only total hardness limits of 18 and 15 dGH with pH up to 8, which implies that
        moderately buffered tap water is kept without trouble; a care guide gives 2 to 10 dKH. In
        tap water of that total hardness the carbonate hardness rarely exceeds about 12 dKH, so the
        upper limit is an inference. The lower limit is the soft natural water. The proposals (1 to
        12, 1 to 10 and 0.5 to 12 dKH) agree within the threshold of the vote count; the value needs
        confirmation.

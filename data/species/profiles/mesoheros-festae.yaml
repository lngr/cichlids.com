  temperatureC:
    value: {min: 22, max: 30}
    confidence: low
    verification: {method: median, votes: {agree: 3, total: 5}}
    rationale: >-
      The five votes did not reach a qualified majority, so the count used the median method for a
      natural water range. The proposals were 23 to 29 C (generator), 20 to 29 C (checker-a), 22 to
      30 C (checker-b), 22 to 30 C (tiebreaker-1) and 20 to 30 C (tiebreaker-2). The minima sorted
      are 20, 20, 22, 22, 23, whose median is 22 C; the maxima sorted are 29, 29, 30, 30, 30, whose
      median is 30 C. The decided 22 to 30 C carries low confidence. It is narrower than the full
      spread of the sources, about 20 to 30 C: the Santiago-Cayapas streams of the Esmeraldas
      drainage measured 22.0 to 29.9 C at control and downstream sites (23.7 to 28.4 C at the
      unmined control sites), the Babahoyo River in the Guayas basin 19.7 C at the collecting site
      of wild fish, the lowland rivers of the Guayas basin below 250 m 22.6 C upwards with a mean of
      26.0 C at the end of the dry season, and the long-term HYBAM stations means of 24.5 C
      (Esmeraldas, standard deviation 1 C) and 24.9 C (Tumbes). Single extremes of 19 C at foothill
      sites and 34 C at a shallow exposed site lie outside this river range. The cooler Guayas
      readings between about 20 and 22 C are therefore left out. The 26 to 28 C in FishBase comes
      from an aquarium atlas and is no habitat measurement.

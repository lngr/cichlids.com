  problems:
    text: "The most common mistake is buying juveniles for a mixed mbuna tank: as the livingstonii
      grows, the smaller fish vanish one by one. A second is a tank that is too short, which leads
      to stress, hiding and persistent attacks on females. Live feeder fish bring a risk of
      parasites and bacterial disease and train the fish to hunt its tankmates, and meat from
      mammals or birds is hard for it to digest. Large meat-eating fish soil the water quickly, and
      nitrate that builds up between too few water changes weakens their resistance to infections.
      The typical resting on the bottom is normal behaviour, while refusal to eat, clamped fins or
      rapid breathing point to real problems."

    tolerance:
      value:
        min: 21
        max: 29
      confidence: medium
      rationale: All four runs propose 21 to 29 C. Care sheets recommend narrower bands between 22 and 28
        C (AquaInfo 22 to 26, Garnelio 22 to 28, Nordiska Ciklidsällskapet 23 to 28, Seriously Fish
        and Tropical Freshwater Fish 24 to 28, FishBase 25 to 28, Fishkeeper 24 to 26), with 25 to
        28 C for breeding. The tolerance has to contain the natural lake range, and the fish live
        through 21 C and 29 C in the wild, so the long-term range equals the lake range; the
        comfortable middle for permanent keeping is 24 to 28 C.

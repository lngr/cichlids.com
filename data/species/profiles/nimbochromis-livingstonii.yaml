  temperatureC:
    value:
      min: 21
      max: 29
    confidence: high
    rationale: "The species is endemic to the Lake Malawi system, so the natural range is the measured
      range of the lake: about 21 C in inshore water of the cool, windy season (Eccles 1974) up to
      about 28 to 29 C at the surface in the hot season (Vollmer et al. 2005 and later campaigns).
      All four runs give this range. The FishBase figure of 25 to 28 C lies inside it."

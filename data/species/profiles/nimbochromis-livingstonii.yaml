    confidence: high
    rationale: All four runs agree. The Catalog of Fishes and FishBase place the species in Lakes Malawi
      and Malombe and the upper Shire River, and FishBase and Seriously Fish describe it as
      widespread in the lake, mainly in sheltered, vegetated bays over soft bottoms but also over
      rock and down to more than 100 m. No geographic forms are known in the hobby.

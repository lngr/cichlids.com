      pattern: spots
    confidence: medium
    rationale: All four runs name brown, white and blue; the pattern splits between mixed (generator,
      checker-b) and spots (checker-a, checker-c). The body is silvery to cream with large,
      irregular dark brown blotches that partly join (FishBase, AquaInfo); adult males add a blue
      sheen and turn deep blue when breeding, so that the blotches nearly vanish. The blotches are
      neither bars nor stripes but large spots, so the pattern is spots; each fish has its own
      blotch layout (Aquarium Glaser).

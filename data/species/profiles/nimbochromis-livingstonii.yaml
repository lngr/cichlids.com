    value: maternal-mouthbrooder
    confidence: high
    rationale: All four runs agree. The male cleans a flat stone or digs a shallow pit, often at the
      edge of rocks, and the female takes the eggs into her mouth and broods up to about 100 eggs
      for about three weeks (FishBase, Seriously Fish, Fishkeeper, Tropical Freshwater Fish,
      Nordiska Ciklidsällskapet, AquaInfo, Oliver); the Cichlid Room Companion confirms maternal
      mouthbrooding.

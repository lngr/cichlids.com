      McKaye 1981). AquaInfo and Nordiska Ciklidsällskapet warn of male pressure on females,
      Garnelio and Malawi-Guru ask for surplus females and cover, and the Aquarium Glaser archive
      calls the fish quite aggressive among each other. That is persistent chasing of rivals and
      females with injuries when space or the ratio is wrong; no source reports routine killing of
      partners.

  habitat:
    text: "The species occurs throughout Lake Malawi and also in Lake Malombe and the upper Shire River.
      It is most common in shallow, sheltered bays where Vallisneria grows over sand or mud, and it
      often waits at the boundary between plant beds and open sand. It also turns up over rocks and
      has been recorded below 100 m. Each adult defends a large feeding area, so the fish is never
      numerous in one place. The lake water is soft but alkaline: pH about 7.7 to 8.6, total
      hardness 3 to 5 dGH, carbonate hardness 5 to 8 dKH and temperatures between about 21 and 29
      C."

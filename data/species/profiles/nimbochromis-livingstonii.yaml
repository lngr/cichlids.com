  aggressionHeterospecific:
    value: 2
    confidence: medium
    rationale: "Three runs give level 2, checker-c level 1. Apart from eating fish that fit its mouth,
      it is tolerant of other species too large to be prey: Seriously Fish calls it generally
      peaceful with such fish, and AquaInfo and Malawi-Guru describe only brief displays at the
      territory border. Fishkeeper and Tropical Freshwater Fish, however, recommend only robust
      haplochromines of similar size, and a fish that holds a year-round feeding territory drives
      other species out of it. Level 2 covers this chasing without injuries; predation is rated
      separately."

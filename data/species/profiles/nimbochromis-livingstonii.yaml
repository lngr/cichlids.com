  hybridGroups:
    value:
      - nimbochromis
    confidence: low
    rationale: "The group nimbochromis covers the five valid species of the genus (Catalog of Fishes):
      N. fuscotaeniatus, N. linni, N. livingstonii, N. polystigma and N. venustus. Malawi-Guru and
      the wholesaler Aquarium Glaser both warn in general terms that Nimbochromis species can cross
      when kept together, a US retailer has offered fish sold as a cross of N. venustus and N.
      livingstonii without saying how they arose, and a phylogenomic study recovers the genus as a
      well-supported close lineage (Masonick et al. 2022). No cross between named species with free
      choice of partners is documented, so the group has the basis presumed. Seriously Fish and
      FishBase give no crossing warning and Fishkeeper even names other Nimbochromis as tankmates;
      an archive report of a male spawning with a female of an unidentified other species names no
      partner. Four of five votes support the group, checker-b votes for none because it found no
      warning."

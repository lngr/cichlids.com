  breeding:
    text: The species is a maternal mouthbrooder. A ripe male turns deep blue and prepares a flat stone
      or a shallow pit in the sand. The female lays a few eggs at a time, the male fertilises them
      and she picks them up in her mouth, until she has spawned. A large female can carry up to
      about 100 eggs for about three weeks and eats little during that time. She is easily stressed
      and may spit out the brood when moved, so she is best left in place or moved very carefully.
      The released fry are large enough for newly hatched brine shrimp at once. Breeding works best
      in a group of one male with three to six females at 25 to 28 C.

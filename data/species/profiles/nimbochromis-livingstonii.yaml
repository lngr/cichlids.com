  khDkh:
    value:
      min: 5
      max: 8
    confidence: high
    rationale: Measured alkalinity of Lake Malawi converts to 6.5 to 6.9 dKH in the profiles of Branchu
      et al. (2010) and to 5.6 to 7.3 dKH in the data of Jackson et al. (1963) compiled by FAO, so
      the natural range is 5 to 8 dKH. All four runs give this range. Sodium balances part of the
      bicarbonate, which is why the carbonate hardness exceeds the total hardness.

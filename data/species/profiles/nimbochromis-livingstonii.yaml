partners:
  suitable:
    - species: Dimidiochromis compressiceps
      reason: Large Lake Malawi predator of similar size and temper that care sheets name as a tankmate.
      condition: Tank of at least 200 cm; both added at a similar size.
    - species: Fossorochromis rostratus
      reason: Large, robust sand-dwelling haplochromine of the same lake, far too big to be prey.
      condition: Tank well over 200 cm because of its size.
    - species: Synodontis njassae
      reason: Lake Malawi catfish that uses the bottom and caves at night and grows beyond prey size.
      condition: Only adult catfish; small ones can be eaten.
    - species: Sciaenochromis fryeri
      reason: Robust haplochromine from Lake Malawi whose adults are above the prey size of the
        livingstonii.
      condition: Add as adults or together as juveniles of similar size.
  unsuitable:
    - species: Labidochromis caeruleus
      reason: Adults of about 8 to 10 cm fit into the mouth of an adult livingstonii and are typical prey.
    - species: Chindongo saulosi
      reason: Small mbuna below the prey threshold; it gets eaten.
    - species: Nimbochromis venustus
      reason: Close relative with similar blotched females; hobby sources warn that Nimbochromis species
        may cross in tanks.
    - species: Tropheus moorii
      reason: Needs Lake Tanganyika water and a plant-based diet; the meaty foods of the livingstonii
        cause bloat in Tropheus.
    - species: Amphilophus citrinellus
      reason: Central American cichlid that needs other water and is more aggressive; archive members
        advise against mixing.
profile:
  overview:
    text: "Nimbochromis livingstonii is one of the best-known predators of Lake Malawi. Its silvery body
      carries irregular brown blotches that make it look like a dead fish in the first stages of
      decay, and the fish uses this disguise: it lies on its side on the sand and waits until small
      cichlids come close to inspect the supposed carcass, then it strikes. Fishermen at the lake
      call it kaligono, the sleeper. In the aquarium it is a calm, rather sedentary fish that grows
      to about 25 cm and eats any tankmate small enough to swallow. It suits keepers with a very
      large tank who choose its companions by size. Mature males turn a striking blue when they are
      ready to spawn, while females keep the camouflage pattern for life."
    sources:
      - kind: literature
        title: "McKaye, K. R. (1981). Field observation on death feigning: a unique hunting behavior by the
          predatory cichlid, Haplochromis livingstoni, of Lake Malawi. Environmental Biology of

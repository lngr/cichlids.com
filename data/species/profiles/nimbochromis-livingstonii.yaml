  sexing:
    text: Adult males are larger and show a blue sheen over the brown and white blotches, which becomes
      a deep, almost uniform blue during courtship. They usually carry yellow egg spots on the anal
      fin. Females and juveniles keep the silvery to cream body with irregular brown blotches and
      have few or no egg spots. Adults are hard to find in the trade, so a group of six to eight
      juveniles grown on together is the usual start for a harem.

  predation:
    value: 3
    confidence: high
    rationale: A specialised ambush piscivore. In the lake it lies on its side on the sand like a dead
      fish and strikes at small cichlids that come to inspect it (McKaye 1981; reviewed by Humphreys
      and Ruxton 2018 and by Pembury Smith and Ruxton 2020). FishBase gives a fish diet with trophic
      level 4.2, Seriously Fish calls it a pure fish eater in nature, Oliver and Malawi-Guru
      describe the same hunting habit, and every care sheet warns that smaller tankmates get eaten.
      Fish are its main food, which is level 3; with 25 cm males the prey threshold of the check
      covers fish up to about 8 cm. All four votes agree.
    sources:
      - kind: literature
        title: "McKaye, K. R. (1981). Field observation on death feigning: a unique hunting behavior by the

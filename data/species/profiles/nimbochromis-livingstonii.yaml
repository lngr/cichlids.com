  ghDgh:
    value:
      min: 3
      max: 5
    confidence: high
    rationale: "Lake Malawi water is soft: calcium and magnesium measured in the upper 50 m of the north
      basin (Branchu et al. 2010) give 4.2 to 4.6 dGH, and the 1960s titrations compiled by FAO give
      3.2 to 4.9 dGH. All four runs give 3 to 5 dGH. The FishBase figure of 9 to 19 dH is an
      aquarium value and does not describe the lake."

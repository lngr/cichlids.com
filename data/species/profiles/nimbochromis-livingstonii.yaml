# Adjudicated species profile for legacy catalog entry 406 (Nimbochromis livingstoni).
schemaVersion: 1
id: nimbochromis-livingstonii
legacyIds:
  - 406
  - 290
status: described
taxonomy:
  validName: Nimbochromis livingstonii
  genus: Nimbochromis
  species: livingstonii
  author: (Günther, 1894)
  source:
    kind: catalog-of-fishes
    title: "Eschmeyer's Catalog of Fishes, species of the genus Nimbochromis"
    url: https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Nimbochromis
    archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-c444a769/2026-10-14T101944Z
    accessed: 2026-10-13
  synonyms:
    - name: Hemichromis livingstonii
      note: Original combination of Günther (1894); holotype from the upper Shire River and Lake Malawi.
    - name: Haplochromis livingstonii
      note: Combination of the older literature up to the revision of Eccles and Trewavas (1989); McKaye
        (1981) writes Haplochromis livingstoni.
    - name: Cyrtocara livingstonii
      note: Combination of the period in which most Malawi haplochromines were placed in Cyrtocara.
    - name: Paratilapia livingstonii
      note: Historical combination listed in the FishBase synonym table; the Catalog of Fishes species
        entry does not record it.
    - name: Astatotilapia livingstonii
      note: Historical combination listed in the FishBase synonym table; the Catalog of Fishes species
        entry does not record it.
  legacyNames:
    - Nimbochromis livingstoni
    - Cyrtocara livingstonii
  note: The Catalog of Fishes (online version of 21 Sep. 2026, accessed 2026-10-13) treats Hemichromis
    livingstonii Günther 1894 as valid in Nimbochromis, following Eccles and Trewavas (1989), Snoeks
    and Manuel (2004) and Konings (2016), and gives the distribution as Lakes Malawi and Malombe and
    the upper Shire River. The legacy spelling livingstoni with one final i is an incorrect
    subsequent spelling that is common in the hobby. The journal volume of the description carries
    the year 1893, which the Cichlid Room Companion uses; the Catalog of Fishes dates the
    publication to 1894.
    The legacy catalog also held the species under Cyrtocara livingstonii, and that entry maps to this profile.

  territory:
    value:
      size: large
      breedingOnly: false
    confidence: low
    rationale: "The runs split: generator small and checker-b small for breeding only, checker-a and
      checker-c large and year-round. In the lake each adult defends a feeding territory of about 15
      by 40 m along the edge of sand and Vallisneria beds (McKaye 1981), FishBase calls it solitary
      and territorial, and Malawi-Guru describes feeding territories of several dozen metres per
      fish that exist outside the spawning season. The territory is therefore not tied to breeding.
      How much of a tank an adult claims is not stated by any aquarium source; for a 25 cm fish with
      a year-round territory the large class is the cautious choice, and it needs confirmation."

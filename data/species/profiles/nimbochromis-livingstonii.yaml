        proposes 3 to 25; checker-b proposes 3 to 22; checker-c proposes 3 to 25; tiebreaker-1
        proposes 3 to 20 (dGH). The rounded median of all minima and all maxima is 3 to 22 dGH. This
        contains natural 3 to 5 without widening. Confidence is low. The care sheets span a wider
        range of 3 to 25 dGH: Fischlexikon 3 to 15, DRTA 5 to 10, Garnelio 5 to 20, FishBase 9 to
        19, AquaInfo 12 to 16, B-Aqua 10 to 20, Tropical Freshwater Fish 10 to 22, Seriously Fish
        and Guidarium 10 to 25, and Fishkeeper up to 25. The median upper limit of 22 dGH has direct
        care-sheet support and lies within several broader aquarium ranges; total hardness and
        alkalinity are distinct quantities. The lower end is the natural lake value, which the fish
        live in; the higher lower limits of the care sheets are recommendations, not observed harm.
        The median is plausible because it contains soft natural lake water and a directly
        recommended aquarium maximum."

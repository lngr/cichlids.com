    value:
      - sand
      - plants
      - rock
    confidence: high
    rationale: Three runs give sand, plants and rock; checker-c adds open water. The species lives over
      soft sand or mud, often at the edge of Vallisneria beds in sheltered bays, and also over rock,
      where breeding males build their nests (FishBase, McKaye 1981, Seriously Fish, Oliver). It is
      a bottom-oriented ambush hunter, so the open swimming space that care sheets ask for is a tank
      layout feature, not a habitat zone.

  compatibility:
    text: "Every tankmate must be well above prey size: with an adult length of 25 cm, anything below
      about 8 cm is at risk, and many common mbuna such as Labidochromis caeruleus or Chindongo
      saulosi disappear. Good companions are large Lake Malawi haplochromines like Dimidiochromis
      compressiceps, Fossorochromis rostratus or Sciaenochromis fryeri and robust Synodontis catfish
      of the same lake. Other Nimbochromis are a poor choice: a German Malawi directory and a
      wholesaler warn that the species of the genus may cross, and their females look alike. Fish
      from Lake Tanganyika or Central America need other water or other food and do not belong in
      its tank."

            breedingOnly: true
        - by: checker-c
          value:
            size: large
            breedingOnly: false
      decision:
        size: large
        breedingOnly: false
      rationale: McKaye (1981), FishBase and Malawi-Guru describe year-round feeding territories of many
        metres, so the territory is not tied to breeding; no aquarium source gives its extent in a
        tank, and large is the cautious class for a 25 cm fish. Confidence low.

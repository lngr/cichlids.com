      rationale: Fishkeeper, Tropical Freshwater Fish and AquaInfo describe a territorial fish that suits
        only robust tankmates of similar size, and the year-round feeding territory means other
        species are chased out of it; level 1 understates this.
    - field: features.territory
      proposals:

  socialBehavior:
    text: In the wild it lives alone and defends a feeding area all year. In the tank it can be kept as
      a single fish or as one male with at least three females, which spreads the male's attention.
      Males chase rivals and unwilling females persistently, so two males need a very large tank and
      visual barriers. An adult claims a sizeable area around its favourite resting spot and drives
      other fish out of it, but towards species too big to eat it mostly displays and chases rather
      than attacks. The species spends much time motionless near the bottom, sometimes even on its
      side; healthy fish do this, so it is no reason for alarm when the fish otherwise behaves
      normally.

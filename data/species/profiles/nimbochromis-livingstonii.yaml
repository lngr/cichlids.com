  diet:
    text: In nature it feeds almost entirely on fish, mostly small cichlids. In the aquarium it accepts
      dead food willingly, so feeder fish are unnecessary; they can bring in disease and teach the
      fish to hunt its tankmates. A good diet combines whole small marine fish such as lancefish or
      whitebait with prawns, krill, mussel, mysis and other frozen crustaceans and large pellets for
      carnivorous cichlids; a small share of plant-based food rounds it off. Meat from mammals or
      birds is hard for these fish to digest and does not belong in the diet.

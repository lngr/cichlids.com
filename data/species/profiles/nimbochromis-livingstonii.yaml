  husbandry:
    text: "A group of one male and three females needs a tank of about 200 cm length, 60 cm front-to-back
      depth and around 600 litres. Open sand, a few sturdy rock structures set directly on the
      bottom glass and clumps of Vallisneria or other robust plants along the back and sides suit
      it; plenty of open floor matters, because the fish likes to rest on the sand. The water should
      be alkaline and well buffered: pH 7.5 to 8.8, 21 to 29 C with 24 to 28 C as the comfortable
      middle, a total hardness of up to about 22 dGH and a carbonate hardness of about 5 to 13 dKH.
      Strong filtration and large weekly water changes are needed, because the fish eats meaty food
      and produces much waste. Strong currents across the whole tank are best avoided."

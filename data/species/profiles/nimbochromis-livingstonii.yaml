  sizeAndGrowth:
    text: Males reach about 25 cm in total length, females stay smaller at around 20 cm. Larger fish are
      reported now and then, but 25 cm is a realistic size for a well-kept adult male. Young fish
      grow quickly on a varied meaty diet and soon outgrow tanks that look large when they are
      bought at 5 cm, so the tank should be planned for the adult size from the start. The fish has
      a deep, compressed body, a large head and a wide mouth that takes surprisingly big prey. Hobby
      sources give a lifespan of about 8 to 10 years.

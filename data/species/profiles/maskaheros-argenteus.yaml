  ghDgh:
    value:
      min: 14
      max: 20
    confidence: low
    rationale: 'The tally selects 14 to 20 dGH by qualified majority, four of five votes. Generator, checker-b,
      checker-c and tiebreaker-1 proposed 14 to 20; checker-a proposed the wider 7 to 20 dGH from conductivity estimates.
      The dry-season middle-Usumacinta study measured hardness means of 250 to 352 mg/L as CaCO3, equivalent to
      14.01 to 19.72 dGH using 17.848 mg/L per degree. Conductivity cannot uniquely determine calcium and magnesium
      hardness, so the lower inferred bound is not adopted. Lachua reports H of 1038 to 1181 mg/L, conditionally
      58.16 to 66.17 dGH if expressed as CaCO3; the unstated reporting basis and unexpectedly high values remain
      unresolved. The bull-shark study has a wider ion-derived value of 57.2 dGH in river water at 1.77 ppt salinity,
      which is excluded as brackish. Thus only one directly applicable quantitative hardness campaign establishes
      the selected range. The major-ion paper DOI 10.1016/j.apgeochem.2021.105157 was unavailable as open-access
      full text in the input research. The low-confidence decision is a regional proxy, not proof of species-wide
      limits.'
    sources:
      - kind: literature
        title: 'De la Cruz-Leyva et al. (2020). Resistencia de Salmonella spp a antibioticos y fluctuacion fisicoquimica
          del agua a nivel espacial en la cuenca media del rio Usumacinta, Mexico.'

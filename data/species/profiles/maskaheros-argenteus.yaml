  problems:
    text: 'A tank chosen for juvenile size can become inadequate as adults claim space. Unsecured rocks can shift
      during digging, live plants may be damaged, and uneaten food adds to the filtration load. Persistent chasing
      can prevent a partner from feeding or resting before obvious wounds appear. Maintain alternative housing and
      monitor the fish through spawning cycles. Poor appetite, abnormal breathing or persistent injury require investigation;
      the profile does not establish a diagnosis or a species-specific medication routine.'

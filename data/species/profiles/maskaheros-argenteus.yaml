    rationale: 'The tally uses the median of all five proposals to select 7 to 8 dKH: generator 7 to 8, checker-a
      5 to 14, checker-b 7 to 11.3, checker-c 7 to 8, and tiebreaker-1 7 to 8. No verification object is attached
      to this natural KH fact. Direct alkalinity means of 128 to 135 mg/L as CaCO3 convert to 7.17 to 7.56 dKH and
      support rounding outward to 7 to 8. This is alkalinity expressed as aquarium buffering equivalent, independently
      of GH. The wider checker-a estimate of 5 to 14 derives from an unsupported GH proportion; checker-b extends
      to 11.3 from dissolved inorganic carbon. Soria-Reinoso measured DIC of 15.6 to 48.3 mg C/L: all-carbon-as-bicarbonate
      conversion gives 3.6 to 11.3 dKH, with adjusted estimates of approximately 3.3 to 11.3 or 6.6 to 11.2 depending
      on stations and assumptions. None is an alkalinity titration because dissolved CO2 and carbonate speciation
      matter. These broader proxies do not replace the one readable direct regional campaign; confidence remains

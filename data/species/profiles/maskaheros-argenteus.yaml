  sizeAndGrowth:
    text: 'Allow for a male around 35 cm and a female around 30 cm at the upper end of ordinary aquarium growth.
      Sex-specific maxima are less secure than the broad conclusion that this is a large adult fish. Some databases
      give 27 to 30 cm without separate female figures, and the 30 cm standard length in Seriously Fish excludes
      the tail. Plan accommodation for adults from the beginning. Longevity estimates range from 4 to 5 years to
      about 10; the selected 5 to 10 year planning interval remains uncertain and is not a verified maximum lifespan.'

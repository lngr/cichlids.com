  husbandry:
    text: 'An established adult pair needs at least 700 L with 200 cm length and 60 cm front-to-back depth in the
      adopted recommendation. Build retreats and sight barriers that remain usable by both fish, and secure heavy
      rocks against digging. Sand, stable hardscape and effective filtration suit the adult tank. Keep water conditions
      stable and maintain a regular water-change routine. The broad recorded tolerances are 22 to 31 C, pH 6.7 to
      8.5, 8 to 20 dGH and 4 to 15 dKH. Their edges have weaker support than ordinary near-neutral or moderately
      alkaline conditions around 26 to 28 C. In particular, 31 C was retained to contain natural exposure and has
      not been demonstrated as healthy for years.'

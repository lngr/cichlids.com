  origin:
    value:
      continent: Central America
      region: Usumacinta River basin on the Atlantic slope of southern Mexico and northern Guatemala
      waterbody: null
      localities:
        - 'Rio San Roman at its confluence with Rio Salinas, Chiapas'
        - 'Rio San Pedro and its wetlands, Tabasco and Guatemala'
        - 'Rio La Pasion, Guatemala'
        - 'Lacantun River and tributaries, including Tzendales, Chiapas'
        - 'Lake Lachua river mouths, Alta Verapaz, Guatemala'
    confidence: high
    rationale: 'The four full-profile proposals agree on the Usumacinta drainage but name different verified sites.
      Generator includes San Roman/Salinas, San Pedro, La Pasion and Lacantun/Tzendales; checker-a narrows this
      to the type locality and San Pedro wetlands; checker-b includes Lacantun tributaries; checker-c adds Lachua
      river mouths. The final locality list combines these supported records. The Catalog fixes the basin and type
      locality, the revision supplies San Pedro and La Pasion vouchers, and fish surveys independently record Lacantun
      and Lachua occurrences. A basin-level waterbody identifier is left null because no fixed lake table represents
      the whole drainage. CRC public taxonomy agrees, but its Morocco and broad Grijalva wording conflicts with
      the authoritative native-range evidence and is not adopted.'

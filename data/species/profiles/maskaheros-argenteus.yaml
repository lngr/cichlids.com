partners:
  suitable: []
  unsuitable:
    - species: Small tetras and other tiny fish
      reason: Opportunistic small-fish ingestion and strong territorial behaviour make tiny companions vulnerable;
        the precise prey-size limit is unmeasured.
    - species: Small or timid cichlids
      reason: Adult territorial attacks can exclude them from food and shelter even when they are too large to swallow.
    - species: Maskaheros regani
      reason: A similar close relative may provoke territorial conflict and shares the presumed maskaheros crossing
        group; an actual hybrid has not been verified.
    - species: Vieja bifasciata
      reason: 'Similarly large territorial adults, particularly breeding fish, present a substantial aggression
        risk. This species is separate from argenteus and is not a confirmed crossing partner.'
profile:
  overview:
    text: 'A silver body with a dark facial mask makes this substantial Usumacinta cichlid easy to recognize as
      an adult. Its accepted name is Maskaheros argenteus; Vieja argentea and Paraneetroplus argenteus remain familiar
      trade labels. Vieja bifasciata is a separate species that shares parts of its drainage, rather than a form
      of the white cichlid. Keeping an adult pair requires room and an effective way to separate incompatible partners.
      A quiet juvenile is a poor guide to the eventual demands of the fish.'
    sources:
      - kind: catalog-of-fishes
        title: 'Eschmeyer''s Catalog of Fishes: Maskaheros argenteus, species record 61740'
        url: 'https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?spid=61740'
        archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-216b2463/2026-10-14T101149Z
        accessed: '2026-10-13'
      - kind: literature
        title: 'McMahan et al. (2015). Taxonomy and systematics of the herichthyins (Cichlidae: Tribe Heroini),
          with the description of eight new Middle American Genera.'
        url: 'https://doi.org/10.11646/zootaxa.3999.2.3'
        archived: doi.org/10.11646_zootaxa.3999.2.3/2026-10-13T073405Z
        accessed: '2026-10-13'

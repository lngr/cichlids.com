  breeding:
    text: 'Both parents participate in an exposed-substrate spawning cycle, preparing a stone, root or depression
      and defending the developing brood. A cave may shelter larvae or occasionally a clutch, but the species is
      not restricted to cave breeding. Pair coexistence is often the main obstacle. Keep a separation option available
      before encouraging reproduction. Published care accounts commonly place hatching around two to three days,
      with free swimming several days later; conditions affect timing. Provide suitable small fry foods and arrange
      growing space, since later spawning can change parental treatment of older young.'

  habitat:
    text: 'Records span the Usumacinta basin of Mexico and northern Guatemala, including the San Pedro, La Pasion,
      Lacantun and Lachua river-mouth systems. These fish use structured waters with sediment, rocks and submerged
      roots; vegetation can also occur. The natural values selected here are 23 to 31 C, pH 7.1 to 8.3, 14 to 20
      dGH and 7 to 8 dKH. They summarize regional observations and agent decisions rather than a complete distribution
      measured beside identified fish. Several field studies contain wider ranges, and hardness coverage is especially
      limited. Salt-influenced downstream observations and unresolved Lachua hardness units do not establish aquarium
      requirements.'
    sources:

      decision:
        type: omnivore
        bloatSensitive: false
        foods:
          - Plant-rich cichlid pellets
          - Spirulina foods
          - Leafy vegetables
          - Small portions of aquatic invertebrates
      rationale: 'All four full-profile votes agree on omnivore and bloatSensitive false; the tally retains the
        generator food list. Generator recommends plant-rich pellets, spirulina, greens and small invertebrate portions;
        checker-a also proposes prawn, mussel and white fish; checker-b emphasizes plants, algae pellets, larvae
        and crustaceans; checker-c lists plant material, algae foods, larvae, crustaceans and balanced pellets.
        The Nordic register, AquaInfo and Zoopet independently support plant and animal foods, while Seriously Fish
        emphasizes a plant-biased wild diet. FishFish gives a conflicting piscivore label without a supporting feeding
        study. Aqua-Pedia asserts protein-related bloat but discloses generated care data and gives no original
        observation. The false flag records no established species-specific bloat sensitivity, rather than proving
        immunity or endorsing a meat-only diet. CRC verifies omnivory only. The inaccessible 2019 trophic paper
        DOI 10.1007/s10641-019-00884-5 contributes no species-specific stomach-content percentages. Tally method:
        unanimous; agreement count 4 of 4.'

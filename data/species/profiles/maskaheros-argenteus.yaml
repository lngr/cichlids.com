  diet:
    text: 'Offer a mixed diet with a substantial plant component. Complete plant-rich cichlid pellets, spirulina
      foods and suitable greens can form the routine, with small portions of aquatic invertebrates for variety.
      The evidence combines descriptions of plant-biased wild feeding with broader omnivory. Small fish can be eaten
      opportunistically; the selected predation level does not establish a precise biological prey boundary. No
      reliable species-specific evidence establishes a special high-protein bloat syndrome, so the false bloat flag
      represents uncertainty rather than permission to omit plant food.'

      confidence: low
      rationale: 'The tally selects 22 to 31 C with low confidence by qualified majority, four of five votes. Generator,
        checker-b, checker-c and tiebreaker-1 proposed 22 to 31; checker-a proposed 24 to 30. AquaInfo prose gives
        22 to 30, while its structured table begins at 24; the Nordic register gives 24 to 28, Zoopet 25 to 30 and
        Seriously Fish 26 to 30. The 31 C endpoint is an inferred extension to contain the decided natural range
        and the San Pedro dry-season occurrence, not a demonstrated multiyear health limit. Archive experience at
        25.6 C supports ordinary husbandry only. Neither outer endpoint is established by a controlled lifelong
        trial; an everyday target around 26 to 28 C has stronger shared support.'

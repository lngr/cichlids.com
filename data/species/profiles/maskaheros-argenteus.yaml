  compatibility:
    text: 'Mixed keeping is conditionally possible, which is why speciesOnly is false, but an adult pair occupies
      considerable territory. Robust adults with compatible water and feeding needs may coexist in a tank appreciably
      larger than the pair minimum, with separate usable areas and prompt removal possible. The suitable-partner
      list is left empty because the sources read do not establish named adult pairings as reliably successful.
      Small or timid fish can be eaten or excluded from resources. Maskaheros regani carries a presumed crossing
      caution based on close relationship; no observed argenteus-regani cross was found. Vieja bifasciata is an
      aggression concern rather than an established hybrid partner.'

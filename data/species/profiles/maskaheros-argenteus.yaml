      note: Historical combination listed by the Catalog.
  legacyNames:
    - Vieja argentea
  note: 'The Catalog current-status line accepts Maskaheros argenteus (Allgayer, 1991). Vieja and Paraneetroplus
    genus lists were also read; neither is the current placement of this species. McMahan and colleagues erected
    Maskaheros for argenteus and regani in 2015, retaining bifasciata in Vieja. Vieja bifasciata is a distinct co-occurring
    species, not a synonym, colour form or established crossing partner of argenteus. The Catalog historical 2015
    citation line gives 1981, but the original description and current status both give 1991, so that isolated year
    is treated as a typo. CRC verifies the current genus; its public Morocco and broad Grijalva wording is unsupported
    by the authoritative range and is not adopted.'

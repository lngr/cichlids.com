    confidence: low
    rationale: 'The tally selects 23 to 31 C by qualified majority, with four of five votes agreeing within the
      1 C threshold. Generator proposed 23 to 30.7, checker-a 25 to 32, checker-b 23.6 to 31, checker-c 22 to 31,
      and tiebreaker-1 23 to 31 C. This is the rounded median of agreeing bounds, not a measured species-wide limit.
      Lacantun station means span 23.6 to 29.6 C and San Pedro dry-season sampling records the species at 31 C.
      Wider measurements remain outside the decision: Salcedo-Garduno reports 22.96 to 33.88 C, Cuevas-Lara freshwater
      stations 22.2 to 30.7 C, San Pedro seasonal sites 25.1 to 32.5 C, and Soria-Reinoso basin stations 20.8 to
      29.8 C. Species occupancy at every endpoint is unconfirmed; the 20.8 C headwater, 33.88 C lower-river extreme
      and 32 C oligohaline Vallisneria site do not establish long-term habitat limits. Low confidence acknowledges
      the narrowed regional proxy.'

      rationale: 'The conservative tally selects [maskaheros] with low confidence. Generator and tiebreaker-1 proposed
        [maskaheros]; checker-a, checker-b and checker-c proposed []. With five votes and no qualified majority,
        the rule retains each group named by at least two votes, so the two positive proposals retain this group
        despite three empty proposals. The verification count of three agreeing votes describes the leading empty
        candidate, not three endorsements of the final conservative group. McMahan and colleagues place Maskaheros
        argenteus and M. regani in a small shared evolutionary lineage; the Catalog validates both names. Under
        the rubric, this close relationship supports a presumed two-member group. Neither reference describes hybrids,
        free partner choice or an interfertility test. The empty proposals reflect a lack of observed crosses rather
        than demonstrated isolation. Vieja bifasciata remains a separate species in a different genus and is not
        added as a crossing partner. Tally method: conservative; agreement count 3 of 5.'

  sexing:
    text: 'Males usually grow larger and deeper-bodied, with a more developed forehead and longer fin extensions.
      Females can also have extended fins, making that feature alone unreliable. Dark spotting is often denser in
      mature males, although individuals vary. Use several adult characteristics together; juvenile colour is insufficient
      for a dependable sex determination. Correctly identifying opposite sexes still does not establish that two
      individuals will form a safe pair.'

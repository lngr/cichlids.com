      rationale: 'The tally decides level 1 by qualified majority, four of five votes: generator proposed 2; checker-a,
        checker-b, checker-c and tiebreaker-1 proposed 1. The Nordic register includes small fish within a broad
        mixed diet, and Zoopet warns that small companions can be eaten. Both support opportunistic predation but
        supply neither a prey-size distribution nor the frequency required for level 2. The rubric 2 cm boundary
        is therefore a planning assumption, not a measured biological cutoff. FishFish calls the species piscivorous,
        whereas Seriously Fish emphasizes plant feeding and the morphometric paper gives only indirect herbivore/omnivore
        context. Those conflicts leave low confidence; territorial attacks alone are not feeding evidence. Tally
        method: qualified-majority; agreement count 4 of 5.'

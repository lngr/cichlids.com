  socialBehavior:
    text: 'The useful adult social unit is a compatible male-female pair. Starting with juveniles can help partners
      select each other, but surplus adults need another home once territories develop. Watch for a partner remaining
      hidden, failing to eat or receiving repeated attacks. Separation may be necessary even in a spacious aquarium,
      and spawning can intensify the conflict. Reports of calmer older fish show individual variation without removing
      the need for alternative housing.'

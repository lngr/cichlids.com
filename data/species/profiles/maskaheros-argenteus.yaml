    tolerance:
      value:
        min: 8
        max: 20
      confidence: low
      rationale: 'The conservative tally selects 8 to 20 dGH with low confidence. Generator, checker-a and tiebreaker-1
        proposed 8 to 20; checker-b and checker-c proposed the wider 5 to 20. With five votes and only three agreeing
        within 2 dGH, the rule takes the intersection of all proposals, which already contains the decided natural
        14 to 20 dGH. Aqua-Pedia gives 8 to 20 but discloses generated data; the retailer also gives 8 to 20. Seriously
        Fish supports 10 to 15 and AquaInfo 12 to 16. Aqua-Fish gives the wider 5 to 20 and Fishkeeper gives only
        an upper bound of 18; neither establishes a proven low-hardness endpoint. Aqua-Fish also describes naturally
        soft acidic water, conflicting with regional field chemistry. The conservative lower limit avoids treating
        its lone 5 dGH recommendation as well established. GH does not measure carbonate buffering, and no multiyear
        controlled endpoint trial was found.'

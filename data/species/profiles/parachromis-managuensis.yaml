legacyIds: [766, 697]
status: described

taxonomy:
  validName: Parachromis managuensis
  genus: Parachromis
  species: managuensis
  author: (Günther, 1867)
  source: &cof
    kind: catalog-of-fishes
    title: "Eschmeyer's Catalog of Fishes, species list of Parachromis (entry Heros managuensis Günther 1867, current status valid as Parachromis managuensis); Cichlasoma also queried"
    url: https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Parachromis
    archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-251c79f3/2026-10-14T101709Z
    accessed: 2026-10-13
  synonyms:
    - name: Heros managuensis
      note: Original combination of Günther (1867); type locality Lake Managua, Nicaragua.
    - name: Cichlasoma managuense
      note: Combination used by Villa, Bussing, Conkel and many aquarium books until about 2000; the legacy catalog spelled it Cichlasoma managuensis.
    - name: Nandopsis managuensis
      note: Combination of Burgess (2000), common in the hobby around that time.
    - name: Parachromis gulosus
      note: Agassiz 1859 from Lake Nicaragua; Kullander and Hartel (1997) treated it as available and valid, while the Catalog of Fishes regards it as probably not available and lists it as a synonym of the younger name managuensis.
  legacyNames:
    - Parachromis managuensis
    - Cichlasoma managuensis
  note: >-
    The Catalog of Fishes lists Heros managuensis Günther 1867 (holotype from Lake Managua) as
    valid in Parachromis and records the combination Cichlasoma managuense for Villa (1982),
    Bussing (1987), Conkel (1993) and others. Its species list of Cichlasoma holds no separate
    managuensis entry, because the species was described in Heros. The legacy entry 697
    "Cichlasoma managuensis" is therefore the older generic placement of the same species as entry
    766. The name Parachromis gulosus Agassiz 1859 consists of a single sentence without
    distinguishing characters; the Catalog notes that it would typically be regarded as not
    available and follows Bussing (1998) and Kullander (2003) in keeping managuensis. The Cichlid
    Room Companion gives the year 1866, the volume year of the journal; the Catalog of Fishes dates
    the description 1867.


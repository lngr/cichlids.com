  ph:
    value: {min: 7.0, max: 9.0}
    verification:
      method: unanimous
      votes: {agree: 3, total: 3}
    confidence: medium
    rationale: >-
      Decided unanimously by the vote count (3 of 3); the proposals of 7.2 to 9.3, 7.0 to 9.0 and
      7.0 to 8.9 agree within 0.3, and the decided range is their median. Both large lakes are
      alkaline: Swain (1966) measured surface pH 8.2 to 8.9 in Lake Nicaragua and 8.9 to 9.3 in
      Lake Managua, and 7.4 to 7.8 in the bottom water of Lake Nicaragua. The ILEC database gives
      surface means of about 9.2 to 9.3 for Lake Managua in 1988, Härer et al. (2021) measured 8.59
      and 8.69 in the two lakes, and the Río Tipitapa between them ranged from 8.0 to 8.9. FishBase
      gives 7.0 to 8.7 and an undated Nicaraguan fisheries account 7.2 to 8.4. The single Lake
      Managua readings above 9.0 lie just outside the decided range and are covered by the
      tolerance. No measurements were found for the Caribbean-slope rivers.

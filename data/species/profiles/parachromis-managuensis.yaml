      Decided unanimously by the vote count (3 of 3; generator and checker-a proposed 3 to 8 dGH,
      checker-b 5 to 8 dGH). Swain (1966) gives 14.7 mg/L calcium and 5.4 mg/L magnesium for the
      surface water of Lake Nicaragua and 13.2 and 7.2 mg/L for its bottom water, which is 3.3 to

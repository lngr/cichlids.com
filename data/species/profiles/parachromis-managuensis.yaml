  khDkh:
    value: {min: 4, max: 16}
    verification:
      method: median
      votes: {agree: 2, total: 5}
    confidence: low
    rationale: >-
      No proposal reached a qualified majority, so the vote count takes the median of all five
      votes. The generator proposed 3 to 16 dKH, checker-a 3 to 10, checker-b 4 to 13,
      tie-breaker 1 4 to 16 and tie-breaker 2 3.5 to 24. The minima 3, 3, 3.5, 4 and 4 have the
      median 3.5, which rounds to 4; the maxima 10, 13, 16, 16 and 24 have the median 16. The
      decided range of 4 to 16 dKH is narrower than the range the sources measure in the native
      habitat, which spans about 3.4 dKH in Lake Nicaragua to about 24 dKH in Lake Managua: soft
      Lake Nicaragua holds a total alkalinity of 60 to 65 mg/L CaCO3, about 3.4 to 3.6 dKH (Swain
      1966; the compilation of Cole 1976 gives 1.25 to 1.35 meq/L, 3.5 to 3.8 dKH), while the
      bicarbonate-rich water of Lake Managua and its outflow, the Río Tipitapa, reaches 82 to 280
      mg/L CaCO3 (4.6 to 15.7 dKH, highest at the Lake Managua end in the dry season), and the
      same compilation gives 8.7 meq/L, about 24 dKH, for Lake Managua itself. Checker-a ended at
      10 dKH because it read the Tipitapa alkalinity as mg/L bicarbonate instead of CaCO3, although
      the paper reports the bicarbonate in meq/L as well (1.64 to 5.54 meq/L, 4.6 to 15.5 dKH).
    sources:
      - *swain
      - *tip
      - &cole
        kind: literature
        title: >-
          Cole, G. A. (1976). Limnology of the Great Lakes of Nicaragua. In: Thorson, T. B. (ed.),
          Investigations of the Ichthyofauna of Nicaraguan Lakes, University of Nebraska-Lincoln
          (values read only in the Aquarists Atlas compilation; the full text sits behind a bot
          check and was not read)
        url: http://digitalcommons.unl.edu/ichthynicar/3
        archived: digitalcommons.unl.edu/ichthynicar/3/2026-10-14T102206Z
        accessed: 2026-10-13

      votes: {agree: 3, total: 3}
    confidence: high
    rationale: >-
      Decided unanimously by the vote count (3 of 3). Adults are pronounced piscivores. FishBase
      calls the species highly predaceous, feeding mainly on small fishes and macroinvertebrates.
      Gut contents of introduced populations consist mostly of fish: about 82 to 85 percent in the
      Penjalin Reservoir on Java, native fish and shrimp in the Feitsui Reservoir in Taiwan, and
      studies in Brazil call it a piscivore that threatens native fish. Seriously Fish describes it
      as almost exclusively carnivorous and a predator of smaller fish, and the Cichlid Room
      Companion confirms the classification as piscivorous predator. Juveniles in Jamaica fed

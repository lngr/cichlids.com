      reason: Large, sturdy Central American cichlid with comparable temperament that is too big to be prey.
      condition: Very large tank with many visual barriers; separate if the jaguar cichlids spawn.
    - species: Vieja melanura
      reason: Large, heavy-bodied herbivorous cichlid that occupies different food niches and grows too big to be eaten.
      condition: Very large tank, tankmates of equal or larger size.
    - species: Pterygoplichthys gibbiceps
      reason: Armoured catfish that grows big, stays near the bottom and is protected by its bony plates.
  unsuitable:
    - species: Parachromis dovii
      reason: Even larger and more aggressive guapote; two of these predators in one tank fight until one is badly hurt.
    - species: Hypsophrys nicaraguensis
      reason: Medium-sized peaceful cichlid that becomes prey or is chased to death.
    - species: Herichthys carpintis
      reason: Hobby reports of crosses with Texas cichlids, and the two fight for the same territory.
    - species: Small tetras, livebearers and dwarf cichlids
      reason: Any fish that fits into the mouth is eaten.
    - species: Symphysodon aequifasciatus
      reason: Slow, shy feeder that needs soft, warm water and calm tankmates; it would be harassed or eaten.
    - species: Lake Malawi mbuna
      reason: Too small, different water chemistry and constant fighting with a predator many times their size.

profile:
  overview:
    text: >-
      The jaguar cichlid is one of the classic big predators of Central America. Its silvery to
      golden body is covered with black spots and blotches, which give the fish its common name.
      The species was described as Heros managuensis from Lake Managua in Nicaragua, and older
      books list it as Cichlasoma managuense or Nandopsis managuensis. Males grow to about 45 cm in
      aquaria and more in the wild, so the fish needs a very large tank, strong filtration and an
      owner who can handle an aggressive, intelligent predator. Kept right, a single fish or a pair
      becomes an impressive show fish. A breeding pair can produce thousands of fry, and released
      fish have founded invasive populations on several continents, so keepers must never set them
      free.
    sources:
      - *cof
      - *sf
      - *fb
  habitat:
    text: >-
      The natural range covers the Caribbean side of Central America from the Río Ulúa in Honduras
      through Nicaragua to the Río Matina in Costa Rica. The species is common in Lake Managua and
      Lake Nicaragua. It favours warm, turbid and nutrient-rich lakes with muddy bottoms, but also
      lives in rivers, ponds and springs over sand and detritus, and copes with water poor in
      oxygen. Lake Nicaragua has soft water of about 3 dGH and 3.5 dKH with pH around 8 and
      temperatures of 25 to 29 C. Lake Managua is warmer, up to about 32 C at the surface, more
      alkaline with pH above 9, and rich in sodium bicarbonate, so that its outflow reaches about
      16 dKH and the lake itself more.
    sources:
      - *fb
      - *sf
      - *swain
      - *vammen
      - *ilec
      - *tip
  sizeAndGrowth:
    text: >-
      Jaguar cichlids grow fast. An introduced wild population in Brazil reached maturity at about
      six months and 13 to 14 cm total length, and its fish grew towards an asymptotic length of
      about 34 cm within their first years. Aquarium males usually end at 40 to 45 cm, females at
      30 to 35 cm. Wild fish can exceed 50 cm and weigh more than a kilogram. Growth slows once the
      fish are adult, but even a half-grown fish outgrows a medium tank, so plan the final tank
      before buying a juvenile. Fish in small tanks become stunted and unhealthy rather than
      staying small by choice.
    sources:
      - *fb
      - *guid
      - *growth
  husbandry:
    text: >-
      A pair of adults needs a tank of around 750 litres with a length of at least 200 cm. Use a
      soft sand bottom, since the fish dig a lot, and create territory boundaries with large roots
      and stones that are glued or set directly on the glass floor so they cannot topple. A flat
      stone serves as a spawning site. Rooted plants are dug up; robust ferns tied to wood survive.
      The fish are heavy feeders and produce much waste, so strong filtration and large weekly
      water changes are required. Temperatures of 24 to 28 C suit them, and they accept a wide
      range of water from slightly acidic to clearly alkaline and from soft to hard. A heavy,
      tight cover is needed because they jump.
    sources:
      - *sf
      - *fk
      - *guid
  socialBehavior:
    text: >-
      Adults are territorial at all times and keep other fish at a distance, with attacks growing
      much worse when a pair spawns. Two males cannot share a tank. A male that is ready to spawn
      may chase and badly injure a female that is not, so a pair should form from a group of
      juveniles, and a tank divider should be at hand. Many keepers prefer a single fish. Where
      tankmates are planned, they must be large, sturdy fish of similar size, and the tank must
      offer many visual barriers.
    sources:
      - *sf
      - *fk
      - *guid
  diet:
    text: >-
      In the wild adults hunt mainly smaller fish and also take crustaceans, insects and other
      invertebrates, while juveniles feed mostly on invertebrates. In the tank they accept a varied
      diet of quality pellets for large cichlids, frozen krill, shrimp and mussel, and pieces of
      white fish. Feeder fish are unnecessary and carry the risk of disease. Feed juveniles small
      portions several times a day and adults once a day, with a fasting day now and then, because
      overfed fish foul the water quickly.
    sources:
      - *fb
      - *fk
      - *jamaica
  breeding:
    text: >-
      The jaguar cichlid spawns on open, hard surfaces. The pair cleans a flat stone, the female
      lays a large clutch and both parents guard it. After hatching the larvae are moved to pits
      that the parents dig in the sand. The fry swim free after a few days and take newly hatched
      brine shrimp. Parents care for them for about six weeks and may then spawn again, at which
      point older fry are in danger. A single spawn from large adults can number thousands of
      eggs, so keepers should plan in advance where the young fish will go.
    sources:
      - *sf
      - *fk
      - *crc
  sexing:
    text: >-
      Males grow larger and develop longer, pointed dorsal and anal fins. Their pattern breaks into
      many spots and blotches, and they often show a purple or bronze sheen. Females stay smaller
      and rounder, and usually keep a dark horizontal band along the flank from their juvenile
      pattern. Juveniles cannot be sexed reliably; a group of six youngsters gives a good chance
      of a pair.
    sources:
      - *sf
      - *guid
      - *arch2890
  compatibility:
    text: >-
      Any fish small enough to be swallowed will be eaten. Possible tankmates are large, robust
      cichlids of similar size such as oscars or trimacs, big plant-eating cichlids like Vieja, and
      large armoured catfish, and only in very large tanks with many visual barriers. Even then a
      breeding pair may turn on them. Avoid the larger and fiercer Parachromis dovii, peaceful
      medium cichlids, small community fish and slow, delicate species such as discus. A hobby
      report mentions a cross of Texas cichlids and jaguar cichlids in an aquarium, so do not keep
      them together.
    sources:
      - *fk
      - *sf
      - *af
      - *arch134
  problems:
    text: >-
      The most common mistake is buying a cute juvenile for a tank that cannot hold the adult;
      cramped fish become stunted, stressed and aggressive. Overfeeding and weak filtration lead to
      high nitrate and poor water, which favour head and lateral line erosion, fin rot and
      bacterial infections. Live feeder fish can carry parasites and disease. A male may injure an
      unready female, so watch new pairs closely. Unsecured rocks can fall and crack the glass when
      the fish dig. The fish jump through gaps in the cover. Finally, never release unwanted fish;
      the species has become invasive in many countries.
    sources:
      - *sf
      - *fk
      - kind: literature
        title: "Evidence of naturalisation of the invasive jaguar cichlid Parachromis managuensis (Günther, 1867), in Queensland, Australia. BioInvasions Records 9(1), 146-157 (2020), abstract"
        url: https://doi.org/10.3391/bir.2020.9.1.19
        archived: doi.org/10.3391_bir.2020.9.1.19/2026-10-13T000725Z
        accessed: 2026-10-13

provenance:
  runs:
    - {role: generator, model: claude-opus-5-5, date: 2026-10-13}
    - {role: checker, model: claude-opus-5-5, date: 2026-10-13}
    - {role: checker, model: claude-sonnet-5-5, date: 2026-10-13}
    - {role: checker, model: claude-opus-5-5, date: 2026-10-13}
    - {role: checker, model: claude-sonnet-5-5, date: 2026-10-13}
    - {role: adjudicator, model: claude-opus-5-5, date: 2026-10-13}
  disagreements:
    - field: taxonomy.synonyms
      proposals:
        - {by: generator, value: "Parachromis gulosus: later authors regard it as the same species and keep the younger name"}
        - {by: checker-a, value: "Parachromis gulosus: listed as a synonym following Bussing (1998) and later authors"}
        - {by: checker-b, value: "Parachromis gulosus: older name treated as not available by the Catalog"}
      decision: "Parachromis gulosus is a synonym; the Catalog regards the name as probably not available and keeps managuensis after Bussing (1998) and Kullander (2003)"
      rationale: >-
        The synonym list itself agrees; only the notes on P. gulosus differ. The Catalog of Fishes
        entry states both points: the name lacks distinguishing characters and would typically be
        regarded as not available, and later authors treat it as the same species as the younger
        managuensis. The note combines both.
    - field: features.origin.value.region
      proposals:
        - {by: generator, value: "Atlantic drainages of Honduras, Nicaragua and Costa Rica, including the Great Lakes of Nicaragua"}
        - {by: checker-a, value: "Atlantic slope of Honduras, Nicaragua and Costa Rica, from the Río Ulúa to the Río Matina, including Lakes Managua and Nicaragua"}
        - {by: checker-b, value: "Atlantic and Pacific-draining lowland lakes and rivers of Honduras, Nicaragua and Costa Rica, including the great lakes Managua and Nicaragua"}
      decision: "Atlantic slope of Honduras, Nicaragua and Costa Rica, from the Río Ulúa to the Río Matina, including Lakes Managua and Nicaragua"
      rationale: >-
        FishBase and Seriously Fish describe the native range as Atlantic slope. The two great lakes
        drain through the Río San Juan to the Caribbean, so the Pacific drainage of checker-b has no
        support. The localities of all runs are merged; the Río Tipitapa and Tisma lagoons are left
        out because no source read documents the species there.
    - field: features.temperatureC.tolerance
      proposals:
        - {by: generator, value: {min: 23, max: 32}}
        - {by: checker-a, value: {min: 23, max: 32}}
        - {by: checker-b, value: {min: 22, max: 32}}
      decision: {min: 23, max: 32}
      rationale: Decided by the vote count with method unanimous (3 of 3); the proposals agree within 1 C.
    - field: features.ph
      proposals:
        - {by: generator, value: {min: 7.2, max: 9.3}}
        - {by: checker-a, value: {min: 7.0, max: 9.0}}
        - {by: checker-b, value: {min: 7.0, max: 8.9}}
      decision: {min: 7.0, max: 9.0}
      rationale: >-
        Decided by the vote count with method unanimous (3 of 3); the proposals agree within 0.3
        and the decided range is the median of their bounds. Lake Managua readings of 9.1 to 9.3
        lie inside the tolerance.
    - field: features.ph.tolerance
      proposals:
        - {by: generator, value: {min: 6.5, max: 9.3}}
        - {by: checker-a, value: {min: 6.0, max: 9.0}}
        - {by: checker-b, value: {min: 6.0, max: 8.9}}
        - {by: tiebreaker-1, value: {min: 6.0, max: 9.0}}
        - {by: tiebreaker-2, value: {min: 6.0, max: 9.0}}
      decision: {min: 6.0, max: 9.0}
      rationale: >-
        Decided by the vote count with method qualified-majority (4 of 5). The generator's lower
        bound of 6.5 lies between two groups of care sheets; the majority follows the two care
        sheets that accept pH 6.0.
    - field: features.ghDgh
      proposals:
        - {by: generator, value: {min: 3, max: 8}}
        - {by: checker-a, value: {min: 3, max: 8}}
        - {by: checker-b, value: {min: 5, max: 8}}
      decision: {min: 3, max: 8}
      rationale: >-
        Decided by the vote count with method unanimous (3 of 3); the proposals agree within 2 dGH.
        Checker-b used only the Río Tipitapa; the soft water of Lake Nicaragua sets the lower bound
        near 3 dGH.
    - field: features.ghDgh.tolerance
      proposals:
        - {by: generator, value: {min: 3, max: 18}}
        - {by: checker-a, value: {min: 3, max: 18}}
        - {by: checker-b, value: {min: 5, max: 18}}
      decision: {min: 3, max: 18}
      rationale: Decided by the vote count with method unanimous (3 of 3); the proposals agree within 2 dGH.
    - field: features.khDkh
      proposals:
        - {by: generator, value: {min: 3, max: 16}}
        - {by: checker-a, value: {min: 3, max: 10}}
        - {by: checker-b, value: {min: 4, max: 13}}
        - {by: tiebreaker-1, value: {min: 4, max: 16}}
        - {by: tiebreaker-2, value: {min: 3.5, max: 24}}
      decision: {min: 4, max: 16}
      rationale: >-
        Decided by the vote count with method median (confidence low), because no proposal reached
        a qualified majority. The median of the minima 3, 3, 3.5, 4, 4 is 3.5, rounded to 4; the
        median of the maxima 10, 13, 16, 16, 24 is 16. The measured natural range is wider, from
        about 3.4 dKH in Lake Nicaragua to about 24 dKH in Lake Managua. Checker-a read the Tipitapa
        alkalinity as bicarbonate instead of CaCO3 and so ended at 10 dKH.
    - field: features.khDkh.tolerance
      proposals:
        - {by: generator, value: {min: 3, max: 16}}
        - {by: checker-a, value: {min: 3, max: 15}}
        - {by: checker-b, value: {min: 3, max: 14}}
      decision: {min: 3, max: 16}
      rationale: >-
        Decided by the vote count with method unanimous (3 of 3); the proposals agree within 2
        dKH. The upper bound of 15 is widened to 16 so that the tolerance contains the natural
        range of 4 to 16 dKH. Evidence entries that attributed carbonate hardness values to Seriously Fish and
        Fishkeeper, which state general hardness only, are left out.
    - field: features.maxSizeCm
      proposals:
        - {by: generator, value: {male: 40, female: 30}}
        - {by: checker-a, value: {male: 45, female: 35}}
        - {by: checker-b, value: {male: 50, female: 38}}
      decision: {male: 45, female: 35}
      rationale: >-
        Care sheets give 40 to 46 cm as the aquarium maximum and keepers report males of 40 to 45
        cm and females of 30 to 35 cm. The 50 cm of checker-b rests on wild records and a single
        forum figure in standard length; 40 cm of the generator sits below two of three care-sheet
        maxima. The upper end of typical aquarium sizes is taken, which also keeps the prey
        threshold of the compatibility check on the cautious side.
    - field: features.aggressionHeterospecific
      proposals:
        - {by: generator, value: 4}
        - {by: checker-a, value: 4}
        - {by: checker-b, value: 3}
      decision: 4
      rationale: >-
        Fishkeeper advises removing tankmates when the pair breeds, Guidarium recommends a single
        fish, and keepers report injured and killed tankmates of similar size; this is level 4.
        Checker-b weighted the possible robust tankmates higher, which level 4 also allows in very
        large tanks.
    - field: features.habitatZones
      proposals:
        - {by: generator, value: [openWater, sand, wood, rock]}
        - {by: checker-a, value: [sand, wood, rock]}
        - {by: checker-b, value: [sand, rock, wood]}
      decision: [openWater, sand, wood, rock]
      rationale: >-
        All runs agree on sand, wood and rock. Open water is added because FishBase classes the
        species as benthopelagic and Aqua-Fish.net stresses open swimming space in the middle
        levels; an active predator of this size uses the water column.
    - field: features.coloration
      proposals:
        - {by: generator, value: {baseColors: [silver, yellow, black], pattern: spots}}
        - {by: checker-a, value: {baseColors: [silver, black, yellow], pattern: spots}}
        - {by: checker-b, value: {baseColors: [silver, green, yellow], pattern: spots}}
      decision: {baseColors: [silver, yellow, black], pattern: spots}
      rationale: >-
        The black spots and blotches dominate the adult pattern and name the fish; the greenish tint
        that FishBase mentions is a sheen on the silvery to golden body rather than a base colour.
    - field: features.minTank
      proposals:
        - {by: generator, value: {volumeL: 750, lengthCm: 200, depthCm: 70}}
        - {by: checker-a, value: {volumeL: 650, lengthCm: 180, depthCm: 60}}
        - {by: checker-b, value: {volumeL: 500, lengthCm: 150, depthCm: 60}}
      decision: {volumeL: 750, lengthCm: 200, depthCm: 70}
      rationale: >-
        Guidarium already asks for 680 L and 180 cm for a single male, so a pair of adults needs
        more; 150 cm and 500 L fall below the single-fish recommendations of two care sheets.
        Confidence stays low because no source gives a pair tank.
    - field: features.lifespanYears
      proposals:
        - {by: generator, value: {min: 12, max: 18}}
        - {by: checker-a, value: {min: 10, max: 15}}
        - {by: checker-b, value: {min: 10, max: 15}}
      decision: {min: 10, max: 15}
      rationale: >-
        Aqua-Fish.net gives up to 15 years or more in captivity, which fits the range of the two
        checkers; the generator's 18 years has no source.
    - field: variants
      proposals:
        - {by: generator, value: [Gold color-morph]}
        - {by: checker-a, value: []}
        - {by: checker-b, value: []}
      decision: []
      rationale: >-
        None of the sources read mentions a gold or other captive colour line, so the variant is
        left out until a source confirms it.

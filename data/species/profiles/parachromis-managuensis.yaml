    value: 4
    confidence: medium
    rationale: >-
      The species claims a large area and attacks fish of similar size, most of all while
      breeding, when Fishkeeper advises moving tankmates out. Guidarium recommends keeping it
      alone, Aqua-Fish.net calls it aggressive to other fish and advises a separate tank for a
      breeding pair, and keepers report that it dominates and injures even large cichlids. Robust
      cichlids and armoured catfish of similar size are possible only in very large tanks with many
      visual barriers, which fits level 4.

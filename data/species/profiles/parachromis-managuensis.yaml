features:
  origin:
    value:
      continent: Central America
      region: Atlantic slope of Honduras, Nicaragua and Costa Rica, from the Río Ulúa to the Río Matina, including Lakes Managua and Nicaragua
      waterbody: null
      localities:
        - Lake Managua (Xolotlán), Nicaragua, type locality
        - Lake Nicaragua (Cocibolca), Nicaragua
        - Río Caño Negro, Río Escondido basin, Nicaragua
        - Río Ulúa, Honduras
        - Río Matina, Costa Rica
    confidence: high
    rationale: >-
      The Catalog of Fishes gives Honduras, Nicaragua and Costa Rica as native range with Lake
      Managua as type locality and lists many introductions elsewhere (Mexico, Guatemala, El
      Salvador, Cuba, Florida, Hawaii, Asia and others). FishBase and Seriously Fish place the
      range on the Caribbean side from the Río Ulúa in Honduras to the Río Matina in Costa Rica.
      The species is part of the current fish list of Lake Nicaragua, and a reproductive study
      covers a native population in the Río Caño Negro of the Río Escondido basin. Lake Managua
      drains through the Río Tipitapa into Lake Nicaragua and from there through the Río San Juan
      to the Caribbean, so the whole range belongs to the Atlantic slope. The species lives in more
      than one lake and in rivers, so no single water body of the table applies.

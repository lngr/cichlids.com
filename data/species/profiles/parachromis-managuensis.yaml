      - *swain
      - *ilec
      - *fb
      - *tip
      - &harer
        kind: literature
        title: "Härer, A., Ibrahim, A., Torres-Dowdall, J. and Meyer, A. (2021). Heterogeneity across Neotropical aquatic environments affects prokaryotic and eukaryotic biodiversity based on environmental DNA. Environmental DNA 4(2), 469-484."
        url: https://doi.org/10.1002/edn3.267
        archived: doi.org/10.1002_edn3.267/2026-10-13T000709Z
        accessed: 2026-10-13

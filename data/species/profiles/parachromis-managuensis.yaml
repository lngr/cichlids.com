    value: 4
    confidence: medium
    rationale: >-
      Adults do not tolerate others of their kind except a bonded partner. A male that is ready to
      spawn chases and can badly injure or kill a female that is not; Fishkeeper advises keeping a
      divider at hand, and Seriously Fish describes the same male aggression towards unwilling
      females. Two males cannot share a tank, and keepers report fights to the death. This matches
      level 4.
    sources:
      - *fk
      - *sf
      - *guid
      - *arch2684
      - *arch2890

  temperatureC:
    value: {min: 25, max: 32}
    verification:
      method: unanimous
      votes: {agree: 3, total: 3}
    confidence: medium
    rationale: >-
      Decided unanimously by the vote count (3 of 3). The value rests on measurements from the
      native range. Lake Nicaragua is a shallow, wind-mixed lake whose surface water measured 25 to
      28 C in the 1960s (Swain 1966) and 25.4 to 29.3 C through 2002 and 2003 (CIRA/UNAN). Lake
      Managua measured 24.7 to 26 C in the dry season (Swain 1966), and profiles of 1988 and 1989
      show 26 to 27 C on a windy day and up to 32 C at the surface on calm afternoons (ILEC). The
      Río Tipitapa, which carries Lake Managua water to Lake Nicaragua, held 28.5 to 32.4 C in the
      rainy and the dry season. FishBase and the Caño Negro study give 25 to 36 C after Bussing
      (1998); the upper part describes warm, oxygen-poor floodplain water that the species
      tolerates rather than its typical habitat, and no measurement behind it could be read.
    sources:

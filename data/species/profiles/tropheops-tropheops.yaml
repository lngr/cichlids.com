  habitat:
    text: "Rock surfaces provide food, territorial sites and nearby refuges. FishBase records the species between\
      \ the Maleri Islands and Chinyamwezi Rocks; specialist accounts describe further populations around the\
      \ Nankumba Peninsula. Malawi-Guru reports most observations at about 5 to 15 m depth, with deeper occurrences\
      \ where competing Tropheops are absent. Fish can take phytoplankton just above the substrate, so open\
      \ lanes around the rocks belong in the aquarium layout. Lake studies describe alkaline water with only\
      \ about 3 to 5 dGH and 5 to 8 dKH. The natural temperature range of 21 to 29 C spans seasons and locations\
      \ rather than a single preferred tank setting."
    sources:
    - *id002
    - *id003
    - *id043
    - *id042
    - *id079
    - *id012
    - *id021
    - *id013
    - *id022
    - *id045
    - *id017
    - *id028
  sizeAndGrowth:
    text: "About 14 cm is the working male adult ceiling, supported by the FishBase total-length record. A\
      \ female ceiling of roughly 12 cm is an estimate based on smaller adult females and the median input\
      \ proposals. The much larger 20 cm standard-length figure in Seriously Fish remains disputed and should\
      \ not be treated as a confirmed typical aquarium size. Growth and body condition depend on husbandry,\
      \ and rich feeding is not a reason to aim for an unusually large fish. The provisional five-to-seven-year\
      \ lifespan estimate is based on weak care-page evidence rather than a tracked longevity study."
    sources:
    - *id002
    - *id003
    - *id042
    - *id043
    - *id069
    - *id019
    - *id040
    - *id041
    - *id056
    - *id065
  husbandry:
    text: "For the recommended harem, the decided minimum is 160 litres with a tank at least 120 cm long and\
      \ 40 cm from front to back. Secure rock structures should provide separate feeding surfaces and breaks\
      \ in direct views, with sand and unobstructed routes between refuges. A community aquarium needs more\
      \ room than this species-unit minimum. Stable temperatures near the central husbandry recommendations,\
      \ such as 24 to 28 C, are a better routine target than the uncertain tolerance endpoints. Maintain oxygenation\
      \ and filtration suited to the stocking. Total hardness and buffering are separate measurements; raising\
      \ GH is not automatically required to recreate Malawi water."
    sources:
    - *id003
    - *id019
    - *id042
    - *id002
    - *id045
  socialBehavior:
    text: "Male courtship and defence can put sustained pressure on females and rivals. One male with at least\
      \ three females spreads attention, but layout and the temperament of individual fish still matter. Several\
      \ males need substantially more space than the stated harem minimum. The aggression grades distinguish\
      \ strong conspecific harassment from interspecific chasing focused around a rock territory. Watch whether\
      \ subordinate fish can reach food and refuges rather than assuming that a nominal sex ratio solves aggression."
    sources:
    - *id053
    - *id003
    - *id042
    - *id043
    - *id045
  diet:
    text: "Make algae-based prepared food and other suitable plant material the main menu. Natural feeding\
      \ includes attached algal growth and, when available, plankton, so the species is an aufwuchs feeder\
      \ with some flexibility rather than a fish predator. Small invertebrate supplements can add variety without\
      \ becoming the staple. The bloat-sensitive flag follows digestive cautions in husbandry sources, not\
      \ a controlled comparison of disease rates. Avoid animal meat and routine rich feeding; provide portions\
      \ that all members of the harem can reach."
    sources:
    - *id043
    - *id002
    - *id003
    - *id053
  breeding:
    text: "The female incubates the eggs in her mouth after spawning at a rock surface or prepared substrate\
      \ site. Reports place incubation at roughly three to four weeks and the brood at up to about forty eggs.\
      \ Courtship can increase chasing, so access to cover remains essential. Brood loss in a community and\
      \ occasional fry consumption can occur even though the predation decision is level 0. The crossing caution\
      \ covers the named species T. gracilior and T. romandi as well as T. tropheops; its evidence is a general\
      \ older warning, not a verified mating observed with free choice."
    sources:
    - *id003
    - *id002
    - *id043
    - *id042
  sexing:
    text: "Adult females are generally smaller and less intensely coloured, but young fish and subordinate\
      \ males can be difficult to classify. Dominant males are described as grey-blue in one species account,\
      \ with small yellow-orange anal-fin markings. Other traded fish can look markedly different because a\
      \ shared nickname does not establish the same species. Treat colour and egg spots as clues that need\
      \ confirmation rather than a complete sex or species diagnosis."
    sources:
    - *id003
    - *id042
    - *id043
  compatibility:
    text: "Choose robust mbuna with compatible feeding needs and enough room for separate territories. Peaceful\
      \ peacocks and utaka may be persistently displaced or outcompeted. The species does not require a species-only\
      \ aquarium, but similarly coloured rivals can still provoke stronger defence. A presumed crossing caution\
      \ applies to the three named Tropheops species in the curated group. General assertions that every Tropheops\
      \ crosses with every other member exceed the evidence reviewed here. Additional trade forms need careful\
      \ identification before they can be assessed reliably."
    sources:
    - *id003
    - *id042
    - *id053
    - *id045
  problems:
    text: "The clearest husbandry risks are sustained harassment, poor access to food or refuge, unstable water\
      \ and digestive trouble from unsuitable feeding. A fish remaining hidden or losing body condition deserves\
      \ attention even when the stocking list appears compatible. Crowding is described by some care sources\
      \ as a way to dilute aggression, but it also raises demands on filtration and observation. Misidentified\
      \ trade forms create another risk because their adult size, colour and crossing relationships may differ\
      \ from this profile."
    sources:
    - *id003
    - *id042
    - *id019

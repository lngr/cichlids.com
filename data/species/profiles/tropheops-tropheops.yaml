profile:
  overview:
    text: "The name Tropheops tropheops applies to a described Lake Malawi mbuna, although shops still use\
      \ its earlier Pseudotropheus combination. Its small downward-facing mouth is adapted to working attached\
      \ algae from rocks. A keeper can expect an active territorial fish rather than a schooling community\
      \ species. Plan around one male with at least three females and provide robust mbuna companions only\
      \ when there is enough additional space. The trade label covers many lookalikes, so a locality or breeder\
      \ record is more useful than a colour nickname for checking identity."

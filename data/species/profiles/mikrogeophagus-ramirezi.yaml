  breeding:
    text: Rams spawn in the open. The pair cleans a flat stone, a piece of wood, a broad leaf or a pit
      in the sand, and the female lays rows of small adhesive eggs that the male fertilises; a brood
      often holds a few hundred eggs. Both parents fan and guard the clutch. The eggs hatch after
      two to three days, and the fry become free-swimming about five days later; they then need very
      fine food such as infusoria and microworms before Artemia nauplii. Soft water of about pH 6, a
      temperature at the upper end of the range and very clean water raise the hatching rate. Young
      pairs often eat their first clutches, and many farmed fish breed poorly; patience or a breeder
      with good stock helps.

    tolerance:
      value:
        min: 4.5
        max: 7
      confidence: medium
      rationale: "Decided by qualified majority (4 of 6 votes): checker-a, checker-b and both tie-breakers
        proposed pH 4.5 to 7.0, the generator 5.0 to 7.0, and checker-c 4.0 to 7.2. Care sheets
        agree on an upper limit of pH 7.0 (Seriously Fish, the Practical Fishkeeping breeding
        article for farmed fish, Fishkeeper, Tetra, Aqualog for the bred form,
        Zoetwateraquarium.nl); the cichlids.com archive links pH above about 7.2 in hard water with
        losses. The lower limits range from 4.0 (Seriously Fish) to 5.0 in most care sheets, with
        Aqualog for wild fish, Maletti and FishBase at 5 to 6. The natural minimum of pH 4.7 must
        lie inside the tolerance, so 4.5 is the lowest value that several sources support. The wider
        source range of 4.0 to 7.2 (Seriously Fish and the Practical Fishkeeping article on blue
        strains for the lower end, that article and Aquarium Source with up to 7.2 and 7.5 for
        farmed fish at the upper end) is not taken for long-term keeping."

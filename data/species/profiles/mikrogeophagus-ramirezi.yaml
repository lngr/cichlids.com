    value:
      min: 4.7
      max: 6.7
    confidence: medium
    rationale: "Decided unanimously by the vote (4 of 4): checker-a and checker-c proposed pH 4.7 to
      6.7, checker-b 4.7 to 6.5 and the generator 5.0 to 6.8; the medians give 4.7 to 6.7. In-situ
      readings in the Mitimiti stream, a Meta tributary with the species, span pH 4.71 to 6.54
      across stations and seasons, Mikolji read pH 6.2 at an occupied site in Monagas, and a
      collector reports 5.8 and 6.7 at two lower Orinoco sites. Wikipedia gives 5.2 to 6.7 after a
      hobby handbook, and FishBase 5 to 6 from an aquarium atlas. A biotope page claims 4.5 to 7.2
      without measurements, and Caño Maraca, a western llanos creek without a confirmed ram record,
      has site means of 6.5 to 6.8; both lie slightly beyond the decided range. Confidence medium
      because the measured series comes from one stream."

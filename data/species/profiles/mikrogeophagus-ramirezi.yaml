    confidence: medium
    rationale: The generator and checker-c listed yellow, blue, black and red, checker-a and checker-b
      yellow, blue and black. The adult male has a yellow to golden head and front body, many
      iridescent blue spangles on body and fins, a black bar through the eye, a black flank spot and
      a black front edge of the dorsal fin. Red appears in the eye and as narrow edges of the fins,
      and a Dutch care sheet calls these accents orange rather than red; the pink to red belly is a
      mark of the female. Because the rubric lists the dominant colours of the male, red is left out
      as an accent, and the pattern is mixed. Bred strains differ (gold, electric blue, black).

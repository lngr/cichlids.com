    tolerance:
      value:
        min: 26
        max: 31
      confidence: medium
      rationale: "Decided unanimously by the vote (4 of 4): the generator proposed 26 to 31 C, checker-a
        25 to 30 C, checker-b 24 to 31 C and checker-c 26 to 30 C; the medians give 26 to 31 C.
        Husbandry sources agree on warm water: Seriously Fish, FishBase, the TFH species profile and
        Maletti give 27 to 30 C, Practical Fishkeeping recommends 26 to 30 C and names 25 C as the
        lowest acceptable value, and the TFH profile adds that breeding pairs like it warmer still.
        Care sheets reach lower (24 to 30 C at Aqualog, 24 to 28 C at Tetra, 22 to 26 C at Aquarium
        Source and 22 C in a Practical Fishkeeping table whose text asks for more than 25 C), but
        several sources link cool water to disease and poor colour, so 24 C and below is not taken
        as a long-term value. At the upper end a laboratory study kept rams for four weeks at 35 C
        with reduced hypoxia tolerance, which shows survival, not years of health; 31 C covers the
        warm breeding water some keepers use."

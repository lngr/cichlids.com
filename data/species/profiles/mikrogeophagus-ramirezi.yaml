  predation:
    value: 0
    confidence: medium
    rationale: "Decided by qualified majority (5 of 6 votes): the generator, checker-a, checker-b and
      both tie-breakers proposed level 0, checker-c level 1. The ram is a small sediment sifter that
      picks benthic invertebrates from soft substrate (López-Fernández et al. 2014), field work
      places it among the small invertivorous cichlids of vegetated llanos stream margins (Montaña
      et al. 2008), and a comparative diet study groups Mikrogeophagus with the microinvertivore
      dwarf cichlids. FishBase, Seriously Fish, the TFH species profile and Maletti recommend small
      tetras such as neons and cardinals as tankmates. Checker-c relied on a fish food maker's
      advice page that says rams eat guppy fry; that supports occasional fry losses, which level 0
      already allows, but no source describes regular hunting of fry or small fish. The Cichlid Room
      Companion summary lists the ram as insectivorous, which agrees."

  aggressionConspecific:
    value: 2
    confidence: medium
    rationale: All files agree on level 2. Juveniles live in groups, but adults pair off and the male
      drives rival males away from the pair (Seriously Fish, Maletti, AquaInfo). Several pairs can
      share a tank with enough space and cover, and aggression rises during spawning. Mikolji saw
      wild adults display at each other at a shared feeding spot, and archive posts describe a male
      chasing his female persistently in a small tank without serious injuries. Regular chasing with
      rare injuries fits level 2.

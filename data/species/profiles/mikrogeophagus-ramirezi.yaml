      at a ram site. At the measured pH of 4.7 to 6.5 and conductivities of 5 to 77 uS/cm in the
      Mitimiti stream almost no bicarbonate can be present, a Capanaparo savanna water body is given
      with 0.5 mg/l, and a German hobby lexicon reports less than 1 dKH for the native water. A
      biotope page claims 3 to 4 dKH for llanos water, which contradicts its own description of
      acidic, very soft water and is not used. Confidence low because the range is inferred from pH
      and conductivity."

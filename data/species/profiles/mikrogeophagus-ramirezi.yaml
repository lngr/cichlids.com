  sizeAndGrowth:
    text: "The ram is a true dwarf. Wild fish stay at about 4 to 5 cm total length, and well-kept
      aquarium males reach about 6 cm, females about 5 cm. Farmed strains sometimes grow slightly
      larger, and the balloon form has a much shorter, deeper body. Males are larger and develop
      longer fin extensions, especially in the first rays of the dorsal fin. Young fish grow quickly
      with frequent feeding of small live and frozen food and are mature after a few months. The
      species is short-lived for a cichlid: wild fish probably live little more than a year, and
      aquarium fish typically reach two to four years, with weak strains often less."

  sexing:
    text: "Adult males are larger and have longer fins; the front rays of the dorsal fin are usually
      extended, and the overall colour is more intense. Females stay smaller and show a pink to red
      belly that becomes stronger before spawning. The dark flank spot of females often carries blue
      scales in its upper part. In some farmed strains these features are less clear: gold and
      electric blue fish may lack the pink belly, and some strains are sold mostly as males. With
      young fish the sex is difficult to tell, so buying a small group is the safer approach."

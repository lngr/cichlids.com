        url: https://www.seriouslyfish.com/species/mikrogeophagus-ramirezi/
        archived: seriouslyfish.com/species/mikrogeophagus-ramirezi/2026-10-14T101619Z
        accessed: 2026-10-13
      - kind: literature
        title: "Tropical Fish Hobbyist Magazine species profile: Mikrogeophagus ramirezi"
        url: https://www.tfhmagazine.com/articles/freshwater/mikrogeophagus-ramirezi
        archived: tfhmagazine.com/articles/freshwater/mikrogeophagus-ramirezi/2026-10-14T101637Z

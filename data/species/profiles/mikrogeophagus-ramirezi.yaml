  socialBehavior:
    text: Young rams live peacefully in groups. As they mature, they form pairs that stay together, and
      the male tolerates no rival close to his partner. Between males there is much fin spreading
      and short chasing, which rarely causes injuries if the tank offers enough space and visual
      barriers. Adults keep to a small home spot where they feed and rest; around the spawning site
      a breeding pair defends an area of roughly half a metre across while it has eggs or fry.
      Towards other species the ram is gentle and rather shy; it drives intruders away from its spot
      and its brood with displays and short dashes but does not hunt or injure them. The best way to
      get a compatible pair is to raise a small group of young fish and let pairs form on their own.

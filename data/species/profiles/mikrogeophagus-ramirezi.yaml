  temperatureC:
    value:
      min: 26
      max: 30
    confidence: medium
    rationale: "Decided unanimously by the vote (4 of 4): the generator and checker-c proposed 26 to 30
      C, checker-a 25 to 30 C and checker-b 26 to 31 C, and the medians give 26 to 30 C. The value
      rests on measurements at ram sites: Cortés Hernández et al. recorded station means of 25.9 to
      30.4 C in a Meta tributary where the species was caught, and Mikolji read 27.8 C in the
      shallow margin where adult rams lived in a Monagas morichal. Llanos streams studied by fish
      ecologists lie in the same band (26 to 30 C in Central Llanos streams, site means of 26.2 to
      30.5 C in Caño Maraca, although these papers do not confirm the ram at their sites). The
      sources reach wider: one shallow Meta station reached 36.1 C at low water, a collector reports
      30 to 33 C at two lower Orinoco sites and a biotope page gives 22 to 32 C over the seasons
      without naming measurements; these are short extremes or unverified spans and lie outside the
      decided range. FishBase gives 27 to 30 C, but from an aquarium handbook. Confidence medium
      because only one study gives a series of readings at a ram site."

  ghDgh:
    value:
      min: 0
      max: 2
    confidence: low
    rationale: "Decided by qualified majority (5 of 6 votes): checker-a and both tie-breakers proposed 0
      to 2 dGH, checker-b 0.2 to 2 dGH and the generator 0 to 4 dGH, which agree; checker-c proposed
      0 to 6.2 dGH. No study measured total hardness at a ram site, so the value rests on
      conductivity: the Mitimiti stream holds only 5 to 77 uS/cm (mostly below 25 uS/cm) at pH 4.7
      to 6.5, and Venezuelan ram habitats are reported with 3 to 40 uS/cm. Even if every ion were
      calcium or magnesium bicarbonate, the highest reading would mean about 2 dGH, and most
      readings point to well below 1 dGH; a Capanaparo savanna water body is given with about 0.3
      dGH. Wider figures exist: a collector reports 30 and 110 ppm hardness at two lower Orinoco
      sites (about 1.7 and 6.2 dGH if the unit is calcium carbonate, which is not stated), and Caño
      Maraca, an Andean-influenced creek without a confirmed ram record, reaches conductivities that
      suggest 3 to 8 dGH. The aquarium values of FishBase (5 to 12 dH) and Seriously Fish (1 to 10
      dGH) are keeping recommendations, not habitat data. Confidence low because the range is
      derived, not measured."

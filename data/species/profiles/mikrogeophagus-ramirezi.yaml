  compatibility:
    text: The ram suits a quiet community of fish that share its need for warm, soft water. Good
      companions are small tetras such as cardinal and rummy-nose tetras, hatchetfish, peaceful
      Corydoras that tolerate warmth, and in larger tanks discus or angelfish. Shoaling midwater
      fish help rams to feel secure. Avoid aggressive or boisterous fish, such as most medium and
      large cichlids, fin-nipping barbs, and any species that needs hard, alkaline or cool water,
      including African rift lake cichlids and goldfish. Several pairs of rams can share a large
      tank with enough cover. No crosses with other species are known from the wild or from tanks
      where the fish could choose their partners; fish farms produce a convict cichlid cross
      artificially.

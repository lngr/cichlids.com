  problems:
    text: "Most losses come from water that is too cool, too hard or polluted. Rams kept below about 26
      C or moved into a new, immature tank often lose colour, eat poorly and fall ill. Rising
      nitrate and organic waste are linked to pits and erosion around the head and lateral line, a
      condition similar to hole-in-the-head. Large sudden water changes and swings in pH also stress
      them. Many farmed fish are weak: some strains are inbred, coloured with hormones or
      carotenoid-rich food before sale, and prone to disease, infertility and short lives, and
      balloon fish often have swim bladder problems. Quarantine new fish, choose healthy stock from
      a careful breeder, and keep the water warm, soft and stable."

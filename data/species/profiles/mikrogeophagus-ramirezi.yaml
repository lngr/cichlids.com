  hybridGroups:
    value: []
    confidence: medium
    rationale: "Decided by qualified majority (5 of 6 votes): the generator, checker-a, checker-b and
      both tie-breakers proposed no group, checker-c a new two-member group of Amatitlania
      nigrofasciata and Mikrogeophagus ramirezi with the basis presumed. The only reported cross of
      the ram is an ornamental hybrid of a convict cichlid line and the ram from Chinese fish farms;
      Zhao et al. (2026) state that it was produced by artificial hybridisation and bought their
      stock from a commercial supplier, and a related abstract (Xiao et al. 2025) uses the same
      label. A deliberate farm cross shows no free choice of partners, and the two species belong to
      different tribes and live in different regions, so it does not found a group. Practical
      Fishkeeping and a hobby site speculate that the Electric Blue Acara arose from a forced cross
      with a ram, which is unconfirmed. The congeners M. altispinosus and M. maculicauda live far
      away in the Guaporé and Mamoré basins, and no source reports a cross with them; the Catalog of
      Fishes, FishBase and Seriously Fish mention no hybrids."

  synonyms:
    - name: Apistogramma ramirezi
      note: Original combination of Myers & Harry (1948), type locality Orinoco system, Venezuela.
    - name: Papiliochromis ramirezi
      note: Combination in Papiliochromis Kullander, 1977, an objective junior synonym of Mikrogeophagus;
        widely used in hobby and scientific literature until Mikrogeophagus became accepted.
    - name: Microgeophagus ramirezi
      note: Spelling of the genus from aquarium literature; Microgeophagus of Frey (1957) is an
        unavailable name, and the Catalog of Fishes lists no genus of that spelling.
  legacyNames:
    - Microgeophagus ramirezi
  note: The Catalog of Fishes (accessed 2026-10-13) lists the species as valid in Mikrogeophagus,
    distributed in the Orinoco River basin of Colombia and Venezuela; queries for the genera
    Microgeophagus and Papiliochromis return no records. The genus holds two further valid species,
    M. altispinosus from Bolivia and western Brazil and M. maculicauda from the upper Rio Guaporé.
    Gold, electric blue, long-finned and balloon fish of the trade are captive strains of this
    species, not hybrids.

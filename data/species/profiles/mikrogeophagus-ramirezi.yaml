partners:
  suitable:
    - species: Paracheirodon axelrodi
      reason: Warm, soft-water tetra of the same region; a calm shoal in midwater makes rams less shy.
    - species: Hemigrammus rhodostomus
      reason: Peaceful soft-water tetra that tolerates the high temperatures rams need.
    - species: Carnegiella strigata
      reason: Surface-dwelling hatchetfish that never competes with rams on the bottom.
    - species: Symphysodon aequifasciatus
      reason: Shares the need for warm, soft, clean water and ignores rams.
      condition: Tank of at least 300 litres with calm, discus-friendly decor.
    - species: Corydoras sterbai
      reason: Peaceful bottom catfish that accepts warm water; it competes only mildly for sinking food.
      condition: Enough sinking food so that the slow-feeding rams get their share.
  unsuitable:
    - species: Amatitlania nigrofasciata
      reason: Aggressive cichlid of harder water that injures rams; fish farms also cross the two species
        artificially.
    - species: Maylandia zebra
      reason: Lake Malawi mbuna that needs hard, alkaline water and harasses small, slow fish.
    - species: Puntigrus tetrazona
      reason: Boisterous fin-nipping barb that stresses and outcompetes rams.
    - species: Carassius auratus
      reason: Cool-water fish; the temperatures of both species do not overlap.
    - species: Andinoacara pulcher
      reason: Larger, more aggressive cichlid that dominates the bottom and the food.
profile:
  overview:
    text: "The ram is one of the most colourful dwarf cichlids and one of the few that are farmed in
      large numbers. Adult males show a golden body with shining blue spangles, a black bar through
      a red eye and a dark spot on the flank. The species comes from the savanna streams and swamps
      of the Orinoco basin in Venezuela and Colombia. Almost all fish in the trade are captive-bred,
      often in Asian farms, and many belong to strains such as German Blue, Gold, Electric Blue,
      long-finned or balloon forms. The ram is peaceful and suits a calm soft-water community, but
      it is less hardy than its popularity suggests: it needs warm, soft and very clean water, and
      many fish die because their keepers treat it like a general community fish."
    sources:
      - kind: catalog-of-fishes
        title: "Eschmeyer's Catalog of Fishes, species of the genus Mikrogeophagus"
        url: https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Mikrogeophagus
        archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-4850bd76/2026-10-14T101616Z
        accessed: 2026-10-13
      - kind: database

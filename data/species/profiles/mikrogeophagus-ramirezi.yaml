  husbandry:
    text: A pair needs a tank of at least 60 by 30 cm, about 54 litres; several pairs or a community
      need more length. Keep the water at 26 to 30 C, up to 31 C for breeding, with soft, acidic to
      neutral water of about pH 4.5 to 7, a total hardness below about 9 dGH and a carbonate
      hardness of no more than about 4 dKH; softer water is better, and breeding needs very soft
      water. Rams react badly to nitrate and other waste, so the tank must be biologically mature
      before they move in, and frequent small water changes with water of similar values are better
      than rare large ones. Filtration should be gentle. Furnish the tank with fine sand for
      sifting, plants, wood and a few caves for cover, some flat stones as spawning sites and dried
      leaves if you like. Dim light and calm dither fish make the ram bolder.
    sources:

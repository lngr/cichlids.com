      - kind: literature
        title: "Maletti, G. The German ram Mikrogeophagus ramirezi. Tropical Fish Hobbyist Magazine (online
          article)"
        url: https://www.tfhmagazine.com/articles/freshwater/the-german-ram-mikrogeophagus-ramirezi
        archived: tfhmagazine.com/articles/freshwater/the-german-ram-mikrogeophagus-ramirezi/2026-10-14T101639Z
        accessed: 2026-10-13
  habitat:
    text: "In the wild the ram lives in the llanos, the wide seasonally flooded grasslands of the
      Orinoco basin. It favours shallow, slow-flowing water at the edges of streams, morichal swamps
      and flooded meadows, often less than half a metre deep, with dense aquatic plants, leaf
      litter, woody debris and a soft layer of organic mud over sand. Such sites lie in full sun and
      warm up strongly. Measurements in a Colombian stream with rams gave about 26 to 30 C and pH
      4.7 to 6.5 with very low conductivity, and a reading at a Venezuelan site gave 27.8 C and pH
      6.2: the water is warm, acidic and almost free of minerals. In the rainy season the fish
      spread over the flooded plains; in the dry season they gather in the remaining channels and
      pools."
    sources:
      - kind: literature
        title: "Mikolji, I. (2011). Mikrogeophagus ramirezi: an odyssey to their natural habitat. Tropical
          Fish Hobbyist Magazine (print issue June 2011, online full article)"
        url: https://www.tfhmagazine.com/articles/freshwater/mikrogeophagus-ramirezi-an-odyssey-to-their-natural-habitat-full-article
        archived: tfhmagazine.com/articles/freshwater/mikrogeophagus-ramirezi-an-odyssey-to-their-natural-habitat-full-article/2026-10-14T101619Z
        accessed: 2026-10-13

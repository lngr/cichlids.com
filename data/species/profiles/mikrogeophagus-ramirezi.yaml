  diet:
    text: Rams are micropredators of small invertebrates. In the wild they spend most of the day taking
      mouthfuls of soft sediment, chewing it, keeping insect larvae, small crustaceans and similar
      prey and expelling sand and debris through the gills. In the aquarium they eat frozen and live
      bloodworm, Artemia, Daphnia, mosquito larvae and grindal worms, together with small sinking
      granules or flakes. Wild-caught fish may refuse dry food at first. Because rams feed slowly
      and deliberately, make sure the food reaches the bottom and is not eaten by faster tankmates
      first. Several small meals a day suit them better than one large meal, and leftovers should be
      removed to keep the water clean.

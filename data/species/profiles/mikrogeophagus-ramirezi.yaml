  territory:
    value:
      size: small
      breedingOnly: false
    confidence: medium
    rationale: "The proposals split: the generator proposed a small territory claimed only while
      breeding, checker-a and checker-c a small territory held all the time, and checker-b a large
      territory claimed only while breeding. Seriously Fish says that breeding pairs hold an area of
      a couple of feet across, about 60 cm; that is roughly 30 cm around the spawning site and well
      short of a third of a 150 cm tank, so the size is small, not large. Outside breeding, Mikolji
      found the same adults on one small patch of a stream over several years and saw them drive
      other fish from their feeding spot, and a wholesaler observed wild fish marking territories
      quickly in a photo tank. Because adults also defend a feeding spot outside breeding, the
      territory is not limited to breeding; defence is strongest while the pair has eggs or fry."

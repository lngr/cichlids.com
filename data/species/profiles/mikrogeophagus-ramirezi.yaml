variants:
  - name: Wild type Venezuela
    kind: locality
    note: Wild-caught fish from the Venezuelan llanos; rarely offered and more demanding about soft,
      warm and clean water than farmed stock.
  - name: Wild type Colombia
    kind: locality
    note: Wild-caught fish exported from the Colombian Orinoquia.
  - name: German Blue
    kind: color-morph
    note: Captive strain close to the wild colour with strong blue iridescence; bred in Europe and in
      Asian farms.
  - name: Gold
    kind: color-morph
    note: Xanthic captive strain in which yellow replaces most of the dark and blue pigment.
  - name: Electric Blue
    kind: color-morph
    note: Captive strain with an almost uniformly metallic blue body.
  - name: Long-fin (veil-tail, lyre-tail)
    kind: color-morph
    note: Captive strain with elongated fins, in blue and gold forms.
  - name: Balloon
    kind: color-morph
    note: Short-bodied captive strain; prone to swim bladder and health problems.
features:
  origin:
    value:
      continent: South America
      region: Orinoco basin, llanos of Venezuela and Colombia
      waterbody: null
      localities:
        - Orinoco system, Venezuela (type locality)
        - Caño La Guardia, Capanaparo drainage, Apure, Venezuela
        - Mitimiti stream, Meta drainage, Puerto Gaitán, Meta, Colombia
        - Morichal stream north of Temblador near the Orinoco Delta, Monagas, Venezuela
        - Rivers Guaviare and Inírida, Colombian Orinoquia
        - Rivers draining to the Gulf of Paria, Venezuela
    confidence: high
    rationale: All files agree. The Catalog of Fishes gives the Orinoco basin of Colombia and Venezuela
      with the type locality in the Orinoco system of Venezuela, and FishBase and Seriously Fish
      name the llanos of both countries. Field records place the species in Caño La Guardia, a
      morichal of the Capanaparo system in Apure (Montaña et al. 2008), in the Mitimiti stream of
      the Meta drainage near Puerto Gaitán (Cortés Hernández et al. 2023) and in a morichal near
      Temblador in Monagas (Mikolji 2011); a morphometric study of wild populations cites further
      records from the Guaviare and Inírida in Colombia to drainages of the Gulf of Paria. A single
      photograph said to come from the Rio Purus in Brazil is unconfirmed and not counted.

  aggressionHeterospecific:
    value: 1
    confidence: medium
    rationale: The generator, checker-a and checker-b proposed level 1, checker-c level 2. Seriously
      Fish, Maletti, Practical Fishkeeping and Tetra describe the ram as peaceful towards other fish
      and a poor competitor, and recommend it for quiet communities of small tetras. Breeding pairs
      keep tankmates away from eggs and fry, and Mikolji saw wild adults drive intruders off their
      feeding spot; the TFH article on the German ram notes that territorial chasing grows at
      spawning. These defences stay close to the pair and do not injure tankmates, and the sources
      do not describe chasing other species through the tank, so level 1 is kept, with the note that
      brood care brings it close to level 2 for small fish near the brood.

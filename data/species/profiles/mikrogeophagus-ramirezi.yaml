      López-Fernández et al. (2014) show the ram to be a sediment sifter that feeds on benthic
      invertebrates, Montaña et al. (2008) place it among the small invertivorous cichlids of a
      morichal stream, and a comparative study of Neotropical cichlid diets puts Mikrogeophagus in
      the microinvertivore group. Mikolji watched wild adults spend most of their time taking and
      sifting mouthfuls of soft sediment. Seriously Fish, the TFH species profile and other care
      sheets recommend live and frozen invertebrates with small sinking dry food, and the Cichlid
      Room Companion summary (insectivorous) agrees. No source reports bloat on a protein-rich diet;
      the health problems of rams are tied to poor water instead."

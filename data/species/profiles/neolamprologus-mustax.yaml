  diet:
    text: "Provide small foods based on aquatic invertebrates, such as mysis, brine shrimp and daphnia, alongside
      suitable sinking granules. Offer portions that both adults can reach among the rocks. Field evidence
      describes very infrequent brood consumption alongside an invertebrate-focused diet. Predation level 0
      includes the possibility of accidental fry taking, so a brood is not guaranteed to remain untouched.
      There is no documented special requirement for the low-protein diet of an algal grazer."

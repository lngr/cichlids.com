        - by: checker-b
          value: demanding
        - by: checker-c
          value: demanding
      decision: demanding
      rationale: "Generator, checker-b and checker-c propose demanding; checker-a proposes moderate. CRC explicitly
        rates the species for advanced aquarists, while the Nordic register is intermediate and DRTA
        beginner-friendly. The higher-trust CRC assessment and specialist reports of male-female aggression
        outweigh the easier ratings for a general recommendation. Water stability and compatible adult pairing
        require experience; the score does not imply high aggression toward every other fish."

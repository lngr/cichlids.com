      rationale: "All four profiles identify Lake Tanganyika. Generator lists the southern lake, Zambia and southern
        DRC; checker-a adds Cape Nundo and Moliro Bay to Chituta Bay; checker-b lists the southern lake and
        Cape Nundo; checker-c lists the southern lake and Zambia with southern DRC. The catalog fixes Cape
        Nundo as the type locality. The merged locality summary retains the confirmed southern distribution.
        The specialist account excludes the stretch between Chituta Bay and the Kalambo River and treats
        farther-north mustax-like intermediates cautiously, so a continuous whole-lake distribution is not
        inferred. The IUCN page was inaccessible with HTTP 403."

    tolerance:
      value:
        min: 7.8
        max: 9.4
      confidence: low
      rationale: "The tally decides pH 7.8 to 9.4 with unanimous verification, 4 of 4 agreeing within 0.3 pH, and
        low confidence. Generator, checker-b and checker-c proposed 7.8 to 9.4; checker-a proposed 7.5 to 9.4.
        Aqua-Fish gives 7.8 to 8.9; the wider low-pH advice is DRTA 7.5 to 8.5, Imperial Tropicals 7.5 to 8.6
        and NVC 7.5 to 8.8, while general Tanganyika.si guidance extends to 8.0 to 9.5. These wider
        recommendations remain evidence, but do not establish harm thresholds outside the decided range. The
        median lower bound is 7.8 and the upper bound contains the lake maximum. No species-specific longevity
        experiment establishes the endpoints."

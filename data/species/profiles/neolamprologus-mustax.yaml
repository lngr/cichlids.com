      Here dKH expresses aquarium-test alkalinity. Plisnier reports bicarbonate of 5.6 to 6.2 meq/L with
      additional carbonate of 0.06 to 1.02 meq/L; Langenberg cites lake alkalinity of 6.7 to 6.9 meq/L,
      equivalent to about 18.8 to 19.3 dKH. The synthesis allows the lower annual-cycle results. Natural KH
      has no verification object."

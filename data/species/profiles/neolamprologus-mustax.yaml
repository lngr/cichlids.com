      rationale: "The qualified-majority tally decides level 0 with medium confidence, 4 of 6 votes. Generator and
        checker-b proposed 1; checker-a, checker-c and both tiebreakers proposed 0. Ochi, Hata and Hori report
        rare brood consumption in stomach samples, so the dissent reflects a real observation rather than
        evidence to discard. Rubric level 0 explicitly permits accidental fry taking; the abstract does not
        show routine fish hunting or a prey-size threshold approaching 2 cm. FishBase and CRC describe
        invertebrate feeding, and NVC reports resident moorii juveniles being left uneaten. Level 0 is
        plausible under that rubric, but does not guarantee fry safety. The 2007 full text is closed access
        and its publisher URL was inaccessible; the archived OpenAlex abstract supports only the reported
        observation. Zimmermann et al. discuss widespread opportunistic fry taking among the broader community
        without an extractable mustax-specific result."

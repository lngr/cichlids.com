  sizeAndGrowth:
    text: "Use approximately 10 cm for adult males and 7 cm for females as working aquarium maxima. The female
      figure comes from a sex-specific husbandry account; the widely cited 9 cm FishBase maximum is male or
      unsexed. Young fish cannot be sexed reliably by length alone. An aquarium lifespan of 8 to 12 years is a
      care-sheet estimate with low confidence, not a measured expectation for every fish."

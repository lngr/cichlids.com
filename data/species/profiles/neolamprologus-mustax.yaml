  temperatureC:
    value:
      min: 23
      max: 29
    confidence: high
    rationale: "The settled waterbody decision is 23 to 29 C with high confidence. Verburg et al. recorded 23.85
      to 29.01 C at 1 m off Mpulungu, supporting seasonal variation in the southern lake. FishBase gives the
      narrower species summary of 23 to 25 C, which does not cover the whole seasonal lake record. All four
      natural-range proposals were 23 to 29 C."

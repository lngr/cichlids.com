  ghDgh:
    value:
      min: 10
      max: 13
    confidence: high
    rationale: >-
      All four natural-range proposals and the waterbody decision are 10 to 13 dGH with high confidence. The
      second FAO annual-cycle report gives mean surface calcium of 10.9 to 11.6 mg/L and magnesium of 41.2 to
      43.2 mg/L. Station-specific conversion using dGH = Ca/7.14 + Mg/4.34 gives approximately 11.1 to 11.5
      dGH. The decided range accommodates the broader lake synthesis rather than treating station means as
      extremes. GH is distinct from alkalinity.

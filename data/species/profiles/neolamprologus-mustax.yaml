  minTank:
    value:
      volumeL: 300
      lengthCm: 120
      depthCm: 50
    confidence: medium
    rationale: "Generator proposed 300 L with 120 by 50 cm, checker-a 128 L with 80 by 40 cm, checker-b 200 L with
      90 by 45 cm and checker-c 300 L with 120 by 50 cm. Component medians are 250 L, 105 cm length and 47.5
      cm depth. Source checking favors 300 L: Tanganyika.si explicitly recommends it for intraspecific
      aggression and NVC recommends 300 to 400 L to allow coexistence without injuries. In contrast DRTA gives
      70 cm, Aqua-Fish 90 cm, the Nordic register 80 cm and 130 L, and Coburg and Abysse 100 L. Aquarist Atlas
      relays a much larger approximately 750 L pair recommendation attributed to Konings, which was not
      checked in the original book. The final 300 L follows the two medium-trust accounts that explain the
      male-female conflict; it is not chosen merely because it is the largest agent proposal. A 120 by 50 cm
      footprint is an explicitly inferred practical layout for one adult pair, not a measured source
      threshold. Additional species require more room."

        which was not checked in the original book. The final 300 L follows the two medium-trust accounts that
        explain the male-female conflict; it is not chosen merely because it is the largest agent proposal. A
        120 by 50 cm footprint is an explicitly inferred practical layout for one adult pair, not a measured
        source threshold. Additional species require more room."

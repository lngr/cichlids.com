  habitat:
    text: "The confirmed range includes southern Zambian shores and the southern Congolese sector, with Cape Nundo
      as the type locality. Reports place fish in shallow rocky areas as well as deeper crevices: association
      accounts give about 3 to 25 m, while a specialist emphasizes occurrences below 20 m. These observations
      do not justify restricting the species to deep water. The natural lake ranges used here are 23 to 29 C,
      pH 8.4 to 9.4, GH 10 to 13 dGH and alkalinity 15 to 20 dKH. Seasonal and regional measurements explain
      their breadth."
    sources:

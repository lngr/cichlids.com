  sexing:
    text: "Adult males usually become larger. A fuller female body or a slight hump on an older male may help, but
      neither identifies juveniles securely. The Nordic association regards comparison of the genital openings
      as more dependable than color. Locality and individual color variation are substantial, so selecting a
      male and female solely by brightness is unreliable."

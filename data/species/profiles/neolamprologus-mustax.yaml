  note: "The Catalog of Fishes recognizes Neolamprologus mustax (Poll, 1978), originally described as
    Lamprologus mustax, with Cape Nundo in southern Lake Tanganyika as its type locality. Both the current and
    original genera were queried. Historical use of petricola in the aquarium trade is a misidentification,
    not an additional accepted synonym."

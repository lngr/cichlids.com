  breeding:
    text: "Eggs are placed on a protected surface inside a cave or beneath a rock. Published husbandry accounts
      differ: one describes clutches of 20 to 50 with the female providing most direct care, while another
      gives up to 80 and describes early care by both adults. The precise clutch and male contribution should
      therefore remain expectations rather than guarantees. Supply several nesting shelters and very small
      first foods for fry, progressing to newly hatched brine shrimp as they grow."

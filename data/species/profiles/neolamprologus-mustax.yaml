        max: 22
      confidence: low
      rationale: "The settled qualified-majority decision is 10 to 22 dKH, 4 of 6 agreeing within 2 dKH at each
        endpoint, with low confidence. Generator proposed 12 to 22, checker-a 8 to 20, checker-b 12 to 25,
        checker-c 10 to 25, and both tiebreakers 10 to 22 dKH. Generator, checker-a and both tiebreakers form
        the agreeing cluster; the median of their endpoints is 10 to 22. Abysse gives a species-specific KH
        target of 10, not a complete tolerance, while Tanganyika.si recommends 11 to 22 for the lake community
        and AquaInfo 10 to 15. The decision is narrower than the proposals reaching 25, for which no read
        source gives a numerical recommendation. Values below 10 in checker-a are inferred rather than
        reported KH limits. GH and pH do not uniquely determine KH. This provisional husbandry interval
        contains natural 15 to 20 dKH and is not an experimentally established long-term survival envelope."

    tolerance:
      value:
        min: 23
        max: 29
      confidence: low
      rationale: "The tally decides 23 to 29 C with unanimous verification, 4 of 4 agreeing within the 1 C
        comparison threshold, and low confidence. Generator and checker-b proposed 23 to 29 C, checker-a 22 to
        29 C and checker-c 22 to 30 C. The median lower bound of 22.5 rounds to 23; the upper median is 29.
        The wider Imperial Tropicals recommendation is 70 to 82 F, approximately 21.1 to 27.8 C; that dealer
        range remains visible but is not a demonstrated long-term lower limit. Aqua-Fish recommends 23 to 26
        C, DRTA 24 to 26 C with 25 to 28 C for breeding, and the Nordic register 24 to 27.5 C. The upper bound
        includes the natural lake range. These are keeping recommendations, not controlled chronic-tolerance
        measurements; routine keeping near the middle of the range is better supported."

    rationale: "Generator proposed 4, checker-a 2 and checker-b and checker-c 3. Tanganyika.si and NVC
      specifically describe male aggression toward females and the need for substantial rock cover; this
      supports persistent harassment at level 3. DRTA and a Cichlid-Forum profile describe milder behavior,

  socialBehavior:
    text: "A compatible male-female pair is the recommended adult unit. A male can pressure a female even after a
      pair has formed, so she needs more than one retreat and access to food outside his immediate view. Harem
      arrangements are mentioned in husbandry advice but require more space and careful management.
      Conspecific aggression is graded 3; behavior toward unrelated species is usually much milder and graded
      1. Adult fish defend a localized shelter beyond the breeding period."

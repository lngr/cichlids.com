  compatibility:
    text: "Selected Tanganyika species can share a sufficiently large aquarium with mustax. Open-water
      Cyprichromis offer a different spatial niche; other cave users need independent shelter zones. Avoid
      adults that repeatedly displace mustax from its retreats. Similar yellow lamprologines can also compete
      for the same rock spaces. Tiny shell-dwelling colonies may suffer territorial disturbance even without
      routine fish predation. No supported hybrid group is assigned, and intermediate-looking wild forms do
      not by themselves demonstrate a named cross."
    sources:

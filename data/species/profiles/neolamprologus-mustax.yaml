  problems:
    text: "Repeated chasing, a fish confined to one corner, damaged fins or one adult missing meals indicate that
      the social arrangement needs attention. A large nominal volume cannot compensate for a dominant fish
      controlling every shelter. Dense rockwork also makes leftover animal food easy to miss, so observe
      feeding and keep filtration and water changes consistent. Check both water conditions and interactions
      when appetite falls rather than assuming a particular disease from that sign alone."

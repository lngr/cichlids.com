partners:
  suitable:
    - species: Cyprichromis leptosoma
      reason: Open-water swimming reduces competition for the rock shelters used by mustax.
      condition: Provide room for a Cyprichromis group above the rocks and size the aquarium for both social units.
    - species: Altolamprologus calvus
      reason: "A possible Tanganyika companion mentioned at genus level in the husbandry advice, conditional on
        distinct shelter territories."
      condition: Use a tank larger than the pair minimum with separate cave clusters; observe both species and their
        fry.
  unsuitable:
    - species: Neolamprologus leleupi
      reason: Similar appearance and the same rock-and-cave niche can create direct territorial competition.
      condition: An unfavorable default combination in a limited footprint; no hybrid claim is implied.
    - species: Neolamprologus multifasciatus
      reason: A small shell-dwelling colony can be crowded or excluded from its area by territorial adults.
      condition: "Avoid mixing in a small shared footprint; the concern is territorial pressure, not established
        routine predation on adult shell dwellers."
    - species: Tropheus moorii
      reason: Active grazing fish impose a different feeding regime and can add sustained competition around rocks.
      condition: An unfavorable routine pairing for the quiet shelter access and invertebrate feeding needed here.
profile:
  overview:
    text: "Neolamprologus mustax is a southern Lake Tanganyika rock dweller whose aquarium requirements are shaped
      by relations between adults. Its small size can be misleading: males may repeatedly pressure females,
      and a compatible pair needs numerous retreats. Yellow, orange and grey-brown forms occur, usually with a
      pale area beneath the head. This is an invertebrate feeder and cave spawner best suited to keepers able
      to manage territorial fish."
    sources:
      - kind: database
        title: "Cichlid Room Companion: Neolamprologus mustax"

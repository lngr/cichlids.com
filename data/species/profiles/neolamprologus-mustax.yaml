  husbandry:
    text: "For one established adult pair, provide at least 300 litres with an inferred footprint of 120 by 50 cm.
      Arrange secure rock structures with several accessible caves and routes that break lines of sight. Allow
      for digging when supporting the stones. Maintain good filtration and surface movement, remove uneaten
      food and change water regularly. The decided working tolerances are 23 to 29 C, pH 7.8 to 9.4, GH 8 to
      19 dGH and KH 10 to 22 dKH. These broad limits have low confidence; stable conditions near the middle
      are better supported than routine keeping at their extremes."

partners:
  suitable:
  - species: Xiphophorus hellerii
    reason: Adult swordtails are active upper-water dithers mentioned as a group by the breeder; this
      concrete candidate is inferred.
    condition: Only full-sized individuals beyond swallowing size in a spacious tank with escape cover;
      fry are at risk.
  - species: Poecilia latipinna
    reason: A robust molly candidate inferred from the breeder recommendation; use captive freshwater
      stock.
    condition: Full-sized adults only; overlapping stable chemistry and substantially more than the pair
      minimum.
  - species: Metynnis hypsauchen
    reason: Large-bodied tetra relative chosen by inference from the breeder advice for robust large characins.
    condition: Adults in an appropriately sized school in a tank at least 180 cm long; breeding aggression
      can still require separation.
  unsuitable:
  - species: Paracheirodon innesi
    reason: Small adult size presents a swallowing risk and little resistance to territorial displacement.
  - species: Amphilophus citrinellus
    reason: A larger look-alike rival; the genus crossing warning also makes it unsuitable for preserving
      a pure line.
  - species: Parachromis dovii
    reason: Much larger and strongly predatory; regional coexistence does not establish aquarium safety.
profile:
  overview:
    text: "Amphilophus lyonsi combines a yellow to orange body with red areas, dark side markings and\
      \ blue iridescence. Plan around an established pair and provide enough space to protect either partner\
      \ when their relationship changes. It is often more manageable with dissimilar fish than several\
      \ larger congeners, but that does not remove territorial or swallowing risks. The accepted species\
      \ was originally described in Cichlasoma and is native to the Pacific side of Costa Rica and Panama.\
      \ FishBase lists it as Endangered, and a 2022 study reported its rediscovery in southern Costa Rica.\
      \ Clearly identified captive stocks and accurate breeding records are especially useful for this\
      \ geographically restricted fish."

  diet:
    text: "Use a varied omnivore diet with a balanced pellet or flake containing plant ingredients as\
      \ the staple. Small portions of aquatic invertebrate foods can add variety. The wild diet includes\
      \ seeds and detritus as well as insects, so it does not justify a fish-only or meat-only feeding\
      \ plan. The CRC feeding label emphasizes insects, while more detailed sources show mixed feeding.\
      \ Growing juveniles deserve particular attention: breeders report digestive problems when baby brine\
      \ shrimp remains the main food as they grow. Introduce suitable fine prepared and vegetable-containing\
      \ foods gradually. Adjust portions to body condition and remove uneaten food."
    sources:

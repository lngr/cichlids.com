  husbandry:
    text: "For an established pair, use at least 300 litres with a footprint around 120 by 50 cm. Larger\
      \ adults or additional fish call for more space. Lay secure rocks and wood on a stable base, provide\
      \ separate retreats, and leave a broad sand area for digging. Maintain effective biological filtration\
      \ and oxygenation, with regular partial water changes. Keep temperature and chemistry steady instead\
      \ of repeatedly adjusting them to a single number. A middle temperature around 26 to 27 C is a sensible\
      \ working choice. Keep a divider or separate aquarium ready before introducing two adults, because\
      \ an apparently settled partnership can change."

      \ proposed those two pairs plus amphilophus-lyonsi-flowerhorn. No complete proposal reaches a qualified\
      \ majority, so the tally takes the union of group ids named by at least two votes. The Flowerhorn\
      \ pair has only one vote and is excluded, while its weak acquisition report and the French production\
      \ claim remain evidence. Imperial Tropicals warns generally about crossing lyonsi with congeners\
      \ and explicitly discusses citrinellus and trimaculatus, supporting presumed groups rather than\
      \ verified crosses. A WaFishBox suggestion of a trimaculatus cross is visual speculation without\
      \ known parentage. The genus group contains the currently valid Amphilophus names from the catalog;\
      \ its all-to-all risk is a low-confidence general warning, not proof of every possible pair. The\
      \ two pair groups overlap that broader caution but are retained exactly as tallied. The existing\
      \ documented Midas and trimaculatus-midas groups are not expanded by transitivity."

    rationale: "Male proposals are generator 20, checker-a 22, checker-b 20 and checker-c 20 cm, giving\
      \ a median of 20. Female proposals are 15, 16, 15 and 16 cm respectively, giving a median of 15.5,\
      \ rounded to a practical 16 cm adult planning value. Beerlink reports 18 cm males and 15 cm females\
      \ with somewhat larger captive fish; the breeder gives an unsexed 15.2 to 17.8 cm and Practical\
      \ Fishkeeping expects unsexed adults of 20 to 25 cm. These support a well-grown 20 cm male and a\
      \ smaller female without adopting the largest claim. The French 25 and 20 cm aquarium maxima, the\
      \ archive male report near 25 cm and the Canadian unsexed 30.5 cm claim remain wider evidence. FishBase's\
      \ 15 cm is standard length, not directly comparable total aquarium length. Unsexed entries repeated\
      \ for both sexes in evidence do not establish equal sex sizes."

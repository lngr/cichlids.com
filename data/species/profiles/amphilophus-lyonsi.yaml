  compatibility:
    text: "The 300 litre pair minimum does not establish space for additional fish. Adult swordtails,\
      \ robust mollies or large characins are conditional candidates inferred from breeder advice, provided\
      \ they cannot be swallowed and have room beyond the pair's territory. Small schooling fish and delicate\
      \ companions are poor choices, and large aggressive predators can overwhelm the pair. Hybrid warnings\
      \ cover a presumed Amphilophus genus group and two overlapping presumed pairs with citrinellus and\
      \ trimaculatus. They reflect a breeder's general warning and uncertain hobby identification, without\
      \ verified free-choice lyonsi offspring. A separate Flowerhorn acquisition report remains weak evidence\
      \ and did not obtain enough votes for inclusion. The documented Midas groups have not been extended\
      \ to lyonsi."

  habitat:
    text: "Native records place this fish in Pacific-draining lowland rivers of southern Costa Rica and\
      \ western Panama, particularly the Coto and Dupi basins. It uses sandy river bottoms with moderate\
      \ or slower current and nearby shelter. Habitat summaries give 26 to 29 C. A collecting account\
      \ relayed by Beerlink reports pH 7.2 and GH 1.5 dGH; a regional Golfo Dulce survey instead found\
      \ pH 7.75 to 8.0, GH equivalent to 4.8 to 12 dGH and alkalinity equivalent to 4.79 to 13.91 dKH.\
      \ Those regional samples were not matched to individual lyonsi captures. The final GH and KH medians\
      \ are therefore provisional summaries, not newly measured species limits, and the wider observations\
      \ remain visible in the evidence. Regional temperatures up to 33 C and pH from 6.3 to 8.5 do not\
      \ establish suitable lifelong aquarium conditions. Only the abstract of the 2022 rediscovery paper\
      \ was accessible through the permitted full-text tool."

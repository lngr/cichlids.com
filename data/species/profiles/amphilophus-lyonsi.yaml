  problems:
    text: "Crowded housing and forced pairing can produce continuous harassment even when the aquarium\
      \ water looks satisfactory. Check for a fish that remains hidden, stops feeding or shows fin damage,\
      \ and separate incompatible animals promptly. Food variety is another important point, especially\
      \ while juveniles move from tiny live foods to prepared diets. Breeders report bloat and losses\
      \ during this stage; swelling alone does not establish a cause. Poor water quality, oxygen shortages,\
      \ infection and social stress can also produce illness. Quarantine additions and seek qualified\
      \ help for persistent symptoms. Avoid treating reported coastal habitat influences as a reason to\
      \ add salt routinely."
    sources:

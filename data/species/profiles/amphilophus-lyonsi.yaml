  sizeAndGrowth:
    text: "Allow for a well-grown aquarium male around 20 cm and a female around 16 cm. Accounts of 18\
      \ cm males and 15 cm females also note somewhat larger captive adults, while broader aquarium predictions\
      \ reach 25 cm. FishBase gives 15 cm standard length, which excludes the tail and cannot be treated\
      \ as the same measure. Size planning here uses typical adult expectations rather than the largest\
      \ retailer claim. Young fish become deeper-bodied as they mature and develop stronger warm colours\
      \ and side markings. The estimated lifespan of eight to twelve years lacks species-specific survival\
      \ records."
    sources:
    - kind: database
      title: "FishBase: Amphilophus lyonsi species summary"

      - small crustaceans
    confidence: medium
    rationale: "The qualified majority selects omnivore with bloatSensitive true, with five of six votes.\
      \ Generator, checker-b, checker-c and both tiebreakers proposed that combination; checker-a proposed\
      \ omnivore with bloatSensitive false. The different food lists describe complementary plant and\
      \ animal foods, and the tally retains the generator list. FishBase and detailed husbandry accounts\
      \ support mixed feeding despite CRC's insectivorous summary, which remains evidence for invertivore.\
      \ The bloat flag follows Imperial Tropicals' juvenile Artemia observations and Beerlink's reports\
      \ during food transition. It is strongest for growing juveniles; a controlled adult high-protein\
      \ intolerance has not been demonstrated, and the flag does not imply an aufwuchs diet. FishBase's\
      \ supplementary food-item and diet-composition pages supply no visible quantitative rows, so the\
      \ summary rather than those empty tables supports the mixed-food claim."

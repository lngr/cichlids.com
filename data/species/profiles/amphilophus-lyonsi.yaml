  breeding:
    text: "A settled pair lays eggs on a surface and both parents protect the brood. Sand excavation provides\
      \ pits where larvae can be gathered before the young swim freely. Begin with appropriately housed\
      \ juveniles if a proven compatible pair is unavailable, and have homes ready for fish excluded during\
      \ pairing. A separate breeding aquarium simplifies management and helps preserve parentage records.\
      \ Offer fry suitably small foods, then broaden their diet as they develop. Avoid continuing an exclusively\
      \ brine-shrimp-based diet through the vulnerable juvenile stage. Spawning success does not guarantee\
      \ partner safety, so continue watching both adults and keep separation possible."

  sexing:
    text: "Adult size and proportions are more useful than juvenile color for estimating sex. Males generally\
      \ grow larger and may develop a heavier head and more extended fin tips. Females can show a dorsal\
      \ mark, but this is not a dependable rule for every individual. Both sexes change their appearance\
      \ with mood and reproduction, and color differences reported from one aquarium strain may reverse\
      \ in another. Do not force two fish together solely because they appear to be a male and a female.\
      \ A naturally formed pair provides better evidence of compatibility than a visual sex estimate alone."
    sources:

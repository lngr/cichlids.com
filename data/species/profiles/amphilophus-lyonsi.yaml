      confidence: medium
      rationale: "The qualified majority decides 24 to 29 C with five of six votes. Generator, checker-c\
        \ and both tiebreakers proposed 24 to 29; checker-b proposed 25 to 29; checker-a proposed 22 to\
        \ 31. Practical Fishkeeping suggests 25 to 29 C, the breeder 25.6 to 28.9 C and Beerlink and the\
        \ Nordic register 26 to 29 C. TankBud supports 24 to 29 C, while the Canadian sheet gives 23.3\
        \ to 28.3 C. The selected range is narrower than checker-a's inferred 22 to 31 and the regional\
        \ Terraba field range of 20.7 to 31.8 C. Fischlexikon's cooler 22 to 27 C recommendation remains\
        \ evidence. Short field extrema and low-trust cooler advice do not establish lifelong aquarium\
        \ health at those endpoints; this is maintenance guidance rather than a tested physiological limit."

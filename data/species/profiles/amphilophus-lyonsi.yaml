    rationale: "The qualified majority selects level 2 with five of six votes: generator, checker-b, checker-c\
      \ and both tiebreakers proposed 2; checker-a proposed 1. Imperial Tropicals excludes fish small\
      \ enough to swallow, and Beerlink and other hobby accounts include fish among opportunistic foods.\
      \ These observations support a mouth-sized prey warning beyond the 2 cm limit of level 1, although\
      \ feeding frequency is not quantified. FishBase emphasizes seeds and insects, while CRC summarizes\
      \ insect feeding; neither account establishes a fish-dominated diet or proves that mouth-sized companions\
      \ are safe."

  ghDgh:
    value:
      min: 2
      max: 10
    confidence: low
    rationale: "The tally selects a low-confidence median of 2 to 10 dGH. Generator and both tiebreakers\
      \ proposed 1.5 to 12; checker-a proposed 2 to 7; checker-b and checker-c each proposed the single\
      \ 1.5 observation. The minima have median 1.5, rounded by the tally to 2, and the maxima have median\
      \ 9.5, rounded to 10. This numerical synthesis is not a newly measured interval and is narrower\
      \ than the combined source envelope of 1.5 to 12 dGH. Beerlink relays Werner's 1.5 dGH habitat point;\
      \ Umana measured regional total hardness equivalent to 4.8 to 12 dGH, including the Coto basin but\
      \ without capture-matched samples. Both wider endpoints remain in the evidence. Conductivity-derived\
      \ estimates are retained as estimates rather than hardness measurements."

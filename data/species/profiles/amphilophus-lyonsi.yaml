  khDkh:
    value:
      min: 3
      max: 10
    confidence: low
    rationale: "The tally's low-confidence median is 3 to 10 dKH, retained here without a natural-water\
      \ verification object. Generator and both tiebreakers proposed 4 to 14; checker-a proposed 2 to\
      \ 6; checker-b proposed 1 to 4; checker-c proposed 1 to 5. The median minima and maxima are 3 and\
      \ 10. Umana measured regional alkalinity of 85.5 to 248.2 mg/L as CaCO3, equivalent to 4.79 to 13.91\
      \ dKH. That wider field envelope underlies the 4 to 14 proposals but is not a measured species-specific\
      \ range. The decided median is narrower than that regional envelope, whose upper value remains explicit\
      \ evidence. The other proposals were estimates from regional chemistry or soft-water keeping. Neither\
      \ GH nor conductivity determines KH, and no capture-matched alkalinity series was available."

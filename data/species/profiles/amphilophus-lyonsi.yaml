  socialBehavior:
    text: "House an adult pair that has shown it can remain together, with retreats accessible to both\
      \ fish. Juveniles may begin in a group, but established partners can drive others away and a smaller\
      \ female can face repeated pressure. Watch for a fish losing access to food or remaining hidden,\
      \ and separate incompatible animals before injuries develop. Beerlink describes an alternative strategy\
      \ of about six adults in a tank longer than two metres; that arrangement requires much more room\
      \ than the pair minimum. Dissimilar species can sometimes coexist in adequate space, while spawning\
      \ sharply increases defence of the pair's area."

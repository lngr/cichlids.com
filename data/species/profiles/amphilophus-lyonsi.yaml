    confidence: high
    rationale: "The catalog and FishBase place this species on the Pacific slope of southern Costa Rica\
      \ and western Panama, including the Coto and Dupi basins. All four complete profiles agree geographically\
      \ despite different locality wording. The 2013 checklist gives Coto records at 10 to 20 m elevation,\
      \ and the 2022 abstract confirms rediscovery in southern Pacific Costa Rica. Claims of a northern\
      \ Central American range in retailer and hobby pages, and the older Practical Fishkeeping lake attribution,\
      \ do not outweigh those records. The forum archive adds an identification mention without environmental\
      \ data."

  note: "The catalog retains Amphilophus lyonsi (Gosse, 1966), originally described as Cichlasoma lyonsi\
    \ from a tributary of the Rio Coto in Costa Rica. Both Amphilophus and Cichlasoma genus lists were\
    \ checked; the Cichlasoma list contains currently placed species only and adds no conflicting lyonsi\

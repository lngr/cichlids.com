  minTank:
    value:
      volumeL: 300
      lengthCm: 120
      depthCm: 50
    confidence: medium
    rationale: "Proposals are generator 300 L, 120 by 50 cm; checker-a 250 L, 120 by 45 cm; checker-b\
      \ 300 L, 150 by 50 cm; checker-c 300 L, 120 by 45 cm. Component medians are 300 L, 120 cm length\
      \ and 47.5 cm depth; round depth to the practical 50 cm footprint for a compatible adult pair. The\
      \ breeder's 75 US gallons is about 284 L and supports the selected volume. Practical Fishkeeping's\
      \ 120 by 45 by 45 cm is a juvenile starting tank with a possible adult upgrade, not a firm adult\
      \ minimum. The 50 cm depth is a modest planning allowance for adult turning and retreat routes,\
      \ not a quoted experimental threshold. Larger recommendations remain evidence: 454 L from the Canadian\
      \ retailer, 500 L from Fischlexikon, 400 L from TankBud, 160 cm and 540 L from the Nordic register,\
      \ and more than 200 cm for Beerlink's six-fish strategy. Extra fish require more space than this\
      \ pair minimum."

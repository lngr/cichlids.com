  ghDgh:
    value: {min: 3, max: 5}
    confidence: high
    rationale: >-
      Lake Malawi endemic, so the natural range is the total hardness of the lake computed from
      measured calcium and magnesium (dGH = Ca/7.14 + Mg/4.34): 4.2 to 4.6 dGH in the upper 50 m of
      the north basin (Branchu et al. 2010) and 3.2 to 4.9 dGH from the 1960s titrations in the FAO
      source book. The lake is soft; care sheets that ask for 10 to 25 dGH describe aquarium
      practice and no habitat measurement. All three full profiles proposed this range.
    sources: [*branchu, *fao, *eccles, *vollmer05, *vollmer99, *ngochera]
    evidence:
      - source: *branchu
        value: {min: 4.2, max: 4.6}
        note: computed from Ca and Mg, upper 50 m
      - source: *fao
        value: {min: 3.2, max: 4.9}
        note: computed from Jackson et al. 1963 and Talling and Talling 1965
    verification: {method: waterbody, waterbody: lake-malawi}
    tolerance:
      value: {min: 3, max: 20}
      confidence: medium
      rationale: >-
        Care sheets keep the species in harder water than the lake: FishBase and FishProfiles 5 to
        12 dH, Fishkeeper up to 20 dH, Seriously Fish and Guidarium 10 to 25 dGH. The upper bound of
        20 dGH is covered by most statements; 25 dGH rests on two hobby sheets alone. The lower bound
        is the natural lake value of 3 dGH, which the tolerance must contain; wild fish live in this
        soft water. The vote count decided the range unanimously (3 of 3, all three full profiles
        proposed 3 to 20 dGH).
      sources: [*fishbase, *sf, *fishprofiles, *fishkeeper, *guidarium, *branchu]
      evidence:
        - source: *fishbase
          value: {min: 5, max: 12}
          note: given as dH
        - source: *fishprofiles
          value: {min: 5, max: 12}
          note: given as dH
        - source: *sf
          value: {min: 10, max: 25}
        - source: *fishkeeper
          value: {max: 20}
          note: only an upper limit given, as dH
        - source: *guidarium
          value: {min: 10, max: 25}
        - source: *branchu
          value: {min: 4.2, max: 4.6}
          note: natural lake water, lower end of the tolerance
      verification:
        method: unanimous
        votes: {agree: 3, total: 3}

  khDkh:
    value: {min: 5, max: 8}
    confidence: high
    rationale: >-
      Lake Malawi endemic, so the natural range is the measured alkalinity of the lake: 2.33 to
      2.46 meq/L in the Branchu et al. (2010) profiles (6.5 to 6.9 dKH) and 2.00 to 2.59 meq/L in
      Jackson et al. (1963) in the FAO source book (5.6 to 7.3 dKH), with dKH = meq/L x 2.8. All
      three full profiles proposed this range.
    sources: [*branchu, *fao, *eccles, *vollmer05, *vollmer99, *ngochera]
    evidence:
      - source: *branchu
        value: {min: 6.5, max: 6.9}
        note: alkalinity profiles, north basin
      - source: *fao
        value: {min: 5.6, max: 7.3}
        note: Jackson et al. 1963
    verification: {method: waterbody, waterbody: lake-malawi}
    tolerance:
      value: {min: 5, max: 10}
      confidence: low
      rationale: >-
        No species database, book or paper gives a carbonate hardness for this species; Seriously
        Fish, FishBase, FishProfiles and Fishkeeper state only total or unspecified hardness. Explicit
        KH figures come from hobby pages alone: a species care guide aims at 6 to 10 dKH, a retailer
        guide to Malawi tanks accepts 6 to 20 dKH with 8 to 10 as the optimum, and a general mbuna
        page suggests 10 to 12 dKH. The lower bound of 5 dKH is the natural lake value, which the
        tolerance must contain. The five votes differ: generator 5 to 10, checker-a 5 to 12,
        checker-b 4 to 15, tiebreaker-1 5 to 20 and tiebreaker-2 5 to 10 dKH. With only 3 of 5
        votes agreeing there is no qualified majority, so the vote count took the conservative
        value, the intersection of all five ranges: 5 to 10 dKH, with confidence low. The narrower
        range warns earlier when a tankmate needs much harder water; it covers the species care
        guide and the optimum of the retailer guide.
      sources:
        - *branchu
        - *fao
        - *gensou
        - &garnelio
          kind: website
          title: Garnelio blog, The Malawi aquarium (archived copy of 2025-08-15)
          url: https://web.archive.org/web/20250815214454/https://www.garnelio.de/en/blog/ornamental-fish/the-malawi-aquarium
          accessed: 2026-10-13
        - &tropicaltank
          kind: website
          title: "The Tropical Tank: Malawi mbuna cichlids, keeping and breeding (water chemistry)"
          url: https://thetropicaltank.co.uk/mbuna2.htm
          accessed: 2026-10-13
        - *fishbase
        - *fishprofiles
        - *sf
        - *fishkeeper
      evidence:
        - source: *branchu
          value: {min: 6.5, max: 6.9}
          note: natural lake water
        - source: *fao
          value: {min: 5.6, max: 7.3}
          note: natural lake water, Jackson et al. 1963
        - source: *gensou
          value: {min: 6, max: 10}
          note: species-specific aquarium target
        - source: *garnelio
          value: {min: 6, max: 20}
          note: acceptable range for Malawi tanks in general, optimum 8 to 10
        - source: *tropicaltank
          value: {min: 10, max: 12}
          note: general target for mbuna, described as not critical
        - source: *fishbase
          value: {min: 5, max: 12}
          note: unspecified dH, no KH value
        - source: *fishprofiles
          value: {min: 5, max: 12}
          note: unspecified dH, no KH value
      verification:
        method: conservative
        votes: {agree: 3, total: 5}

  maxSizeCm:
    value: {male: 13, female: 11}
    confidence: medium
    rationale: >-
      The feature is the typical maximum of well-kept adult aquarium fish. FishBase gives 11.7 cm
      total length for wild fish, Seriously Fish 11.3 cm standard length (about 13.5 to 14 cm total
      length), FishProfiles 12 cm and Guidarium about 14 cm for males and 11 cm for females;
      Fishkeeper's 15 cm is a top value. Adult laboratory fish of Pauers and co-workers had mean
      total lengths of 11.4 to 12.0 cm in males (standard deviation up to 0.66 cm) and 10.9 cm in
      females, so well-kept males reach about 13 cm and females about 11 cm. Mbuna grow larger in
      the aquarium than in the lake (Genner and Turner 2005).
    sources:
      - *fishbase
      - *sf
      - *fishprofiles
      - *pauers2023
      - &genner
        kind: literature
        title: >-
          Genner, M. J. and Turner, G. F. (2005). The mbuna cichlids of Lake Malawi: a model for
          rapid speciation and adaptive radiation. Fish and Fisheries 6, 1-34.
        url: https://doi.org/10.1111/j.1467-2679.2005.00173.x
        accessed: 2026-10-13
      - *guidarium
      - *fishkeeper
    evidence:
      - source: *fishbase
        value: {male: 11.7, female: 11.7}
        note: total length, male or unsexed
      - source: *sf
        value: {male: 14, female: 14}
        note: 11.3 cm standard length converted to total length, sexes not separated
      - source: *fishprofiles
        value: {male: 12, female: 12}
      - source: *pauers2023
        value: {male: 12.0, female: 10.9}
        note: mean total length of adult aquarium fish
      - source: *guidarium
        value: {male: 14, female: 11}
      - source: *fishkeeper
        value: {male: 15, female: 15}
        note: sexes not separated

  predation:
    value: 0
    confidence: medium
    rationale: >-
      A specialised scraper of epilithic algae with a subterminal mouth under a fleshy snout and
      chisel-like teeth. Ribbink et al. (1983) and FishBase name small crustaceans, worms, plankton
      and insects only as secondary food; Pauers et al. (2018) describe the snout and jaws as tools
      for scraping algae, and Genner and Turner (2005) class Labeotropheus with the algae scrapers.
      No study or database reports fish in the diet. FishProfiles alone lists small live fish among
      the foods, which contradicts all other sources and the feeding anatomy, so it is discounted.
      Fry may be taken by chance, as in any mbuna. The vote count decided level 0 unanimously (3 of
      3).
    sources:
      - *fishbase
      - &ribbink
        kind: literature
        title: >-
          Ribbink, A. J., Marsh, A. C., Marsh, B. A. and Sharp, B. J. (1983). The zoogeography,
          ecology and taxonomy of the genus Labeotropheus Ahl, 1927, of Lake Malawi (Pisces:
          Cichlidae). Zoological Journal of the Linnean Society 79(3), 223-243 (abstract).
        url: https://doi.org/10.1111/j.1096-3642.1983.tb01166.x
        accessed: 2026-10-13
      - *pauers2018
      - *genner
      - *sf
      - *fishprofiles
      - *fishkeeper
    evidence:
      - source: *fishbase
        value: 0
        note: scrapes algae, also small crustaceans and worms
      - source: *ribbink
        value: 0
        note: crops epilithic algae, secondarily plankton and insects
      - source: *pauers2018
        value: 0
        note: snout and jaws adapted to scraping epilithic algae
      - source: *genner
        value: 0
        note: Labeotropheus scrapes algae
      - source: *fishkeeper
        value: 0
        note: primarily vegetarian diet
      - source: *fishprofiles
        value: 1
        note: lists small live fish among foods; isolated statement
    verification:
      method: unanimous
      votes: {agree: 3, total: 3}

  diet:
    value:
      type: aufwuchs
      bloatSensitive: true
      foods:
        - spirulina flakes and pellets
        - vegetable-based mbuna pellets
        - blanched spinach, peas, cucumber
        - mysis or brine shrimp as a rare treat
    confidence: high
    rationale: >-
      Field studies show a specialised grazer that crops filamentous epilithic algae, mainly from
      the undersides and vertical faces of rocks (Ribbink et al. 1983), with its body held almost
      parallel to the rock (Pauers et al. 2018); FishBase, Genner and Turner (2005) and the
      Cichlid Room Companion agree. Seriously Fish asks for vegetable food as a large share of the
      diet. Fishkeeper and a hobby care guide warn that food rich in animal protein causes Malawi
      bloat, the typical risk of aufwuchs-feeding mbuna. The vote count decided aufwuchs with
      bloat sensitivity unanimously (3 of 3) and took the food list of the generator.
    sources:
      - *ribbink
      - *pauers2018
      - *genner
      - *fishbase
      - *sf
      - &crc
        kind: database
        title: "Cichlid Room Companion: Labeotropheus trewavasae (public summary)"
        url: https://cichlidae.com/species.php?id=ymgJaejTeVwk0Y5IKPMmwQ
        accessed: 2026-10-13

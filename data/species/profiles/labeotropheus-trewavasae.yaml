partners:
  suitable:
    - species: Labidochromis caeruleus
      reason: One of the calmer mbuna; its yellow colour and shape differ from red top males, so it is not taken for a rival, and it shares the water values and the plant-based diet.
      condition: Only in a tank of at least 120 cm with dense rockwork, so that it can avoid the more aggressive Labeotropheus males.
    - species: Pseudotropheus crabro
      reason: Robust mbuna of similar size with a brown and yellow pattern that does not resemble L. trewavasae.
    - species: Iodotropheus sprengerae
      reason: Rust-brown mbuna of similar size and diet whose colour differs from blue red top males.
      condition: Only in a densely stocked mbuna tank with many caves.
    - species: Synodontis multipunctatus
      reason: Robust catfish that tolerates Malawi water and stays out of the cichlids' way.
      condition: Only in a tank of at least 150 cm.
  unsuitable:
    - species: Labeotropheus fuelleborni
      reason: Crosses with L. trewavasae in aquaria in both directions and is a direct rival of the same shape (hybrid group labeotropheus).
    - species: Labeotropheus simoneae
      reason: Slender Labeotropheus that the hobby sells as a colour form of L. trewavasae; mixed forms can hybridise (hybrid group labeotropheus).
    - species: Maylandia callainos
      reason: Blue males look like rivals, which leads to constant fighting.
    - species: Aulonocara jacobfreibergi
      reason: Peaceful peacock that suffers from constant chasing and needs more protein-rich food.
    - species: Copadichromis borleyi
      reason: Calm open-water hap that is stressed by aggressive mbuna.
    - species: Tropheus moorii
      reason: Kept as a species-only group; two aggressive grazers compete for the same rock surfaces.
    - species: Nimbochromis livingstonii
      reason: A large predatory hap that eats young mbuna and needs meaty food that causes bloat in L. trewavasae.

profile:
  overview:
    text: >-
      Labeotropheus trewavasae is a slender mbuna from the rocky shores of Lake Malawi, easily
      recognised by its fleshy, overhanging snout and the mouth set low beneath it. With this
      tool it scrapes algae from rock surfaces, often from the undersides and crevices that other
      grazers cannot reach. Males of most forms are blue with a red or orange dorsal fin, which
      gave the fish its trade name red top, while females are brownish, speckled or orange
      blotched. Dozens of colour forms are known from different stretches of coast, and several
      of them have been described as separate species since 2016. The fish is hardy and very
      attractive, but it is one of the more quarrelsome mbuna. It belongs in a well-structured
      rock tank with other robust mbuna, one male and several females, and a diet that is mostly
      vegetable.
    sources:
      - *cof
      - *ribbink
      - *sf
  habitat:
    text: >-
      The species lives only in Lake Malawi. The type population comes from the rocky shore at
      Nkhata Bay, and further slender populations live at many islands and headlands, for example
      at Chidunga Rocks, Thumbi West and Mumbo Island. Compared with its stocky relative
      L. fuelleborni it prefers deeper and more broken rock habitat with many crevices, and it has
      been recorded down to more than 30 metres. The water of the lake is warm, soft and moderately
      alkaline: 21 to 29 C, pH 7.7 to 8.6, about 3 to 5 dGH and 5 to 8 dKH. Rock surfaces there
      carry a dense film of algae with small invertebrates, the food the fish is built for.
    sources:
      - *cof
      - *ribbink
      - *pauers2018
      - *sf
      - *branchu
      - *fao
      - *eccles
  sizeAndGrowth:
    text: >-
      Well-kept adult males reach about 13 cm total length and females about 11 cm; wild fish stay
      a little smaller, and figures of 15 cm in some care sheets are exceptions. The body is long
      and low, clearly slimmer than that of L. fuelleborni, with a short, deep head. Young fish grow
      steadily on a vegetable diet, and males develop the blue body and the coloured dorsal fin as
      they mature. In laboratory ponds with strong current, fish with deeper bodies foraged better
      than slender ones, so this slender grazer does best with moderate flow and plenty of grazing
      surfaces. With good care they live about eight to ten years.
    sources:
      - *fishbase
      - *sf
      - *pauers2023
      - *pauers2018
      - *genner
      - *fishipedia
  husbandry:
    text: >-
      Plan a tank of at least 120 cm length and about 240 litres for one male with three or more
      females. Build stable rock piles from the bottom almost to the surface with many caves and
      gaps, and use rounded stones, because sharp rock can damage the grazing lips. A sandy
      bottom is fine; plants are usually eaten. Keep the temperature between about 24 and 27 C
      and the water alkaline at pH 7.5 to 8.5 with a stable carbonate buffer of about 6 to 10 dKH.
      Moderately hard tap water is tolerated well. Strong filtration, good oxygen supply and regular
      large water changes keep nitrate low. Bright light lets algae grow on the rocks, which the
      fish graze all day.
    sources:
      - *fishkeeper
      - *sf
      - *gensou
  socialBehavior:
    text: >-
      Males claim a patch of rock with a flat stone near a cave and defend it all year against
      rivals. They aim their attacks above all at males of their own kind, so two males need a
      large tank and plenty of visual barriers. A male kept with only one female will harass her
      until she is exhausted, which is why a group of one male with at least three females is the
      rule. Other mbuna are chased away from the territory as well, and peaceful fish suffer from
      it, but robust mbuna draw less anger than conspecifics. Stocking the tank fairly densely with
      robust mbuna spreads the aggression across many fish.
    sources:
      - *pauers2020
      - *pauers2023
      - *sf
      - *fishkeeper
  diet:
    text: >-
      In the lake this mbuna grazes algae from rocks and takes small invertebrates living in the
      algal film; plankton and insects are only a secondary food. In the aquarium the menu should
      therefore be mainly plant-based: spirulina flakes or pellets, mbuna pellets with a low
      protein content and blanched vegetables such as spinach, peas or cucumber. Small portions
      several times a day suit a grazer better than one large meal. Brine shrimp or mysis can be
      offered now and then, but protein-rich food such as bloodworms or beef heart should be
      avoided, because it can cause Malawi bloat.
    sources:
      - *ribbink
      - *fishbase
      - *fishkeeper
      - *sf
  breeding:
    text: >-
      Breeding is not difficult in a harem. The male cleans a flat stone near his cave and
      displays in full colour to lure a ripe female. The pair circles head to tail; the female
      lays a few eggs at a time and takes them into her mouth at once. While she nips at the egg
      spots on the male's anal fin, she takes in sperm and the eggs are fertilised. A brood holds
      about 10 to 40 eggs. The female carries them for about three to four weeks without eating
      and then releases free-swimming young. Move her only with care, as stressed females may
      spit or swallow the brood. The fry take crushed flakes and fine live food at once.
    sources:
      - *sf
      - *fishkeeper
      - *pauers2018
  sexing:
    text: >-
      Adult males are easy to tell apart in most forms: they are blue, often with faint dark
      bars, and carry a red, orange or yellow dorsal fin and clear egg spots on the anal fin.
      Females are usually brown, olive or speckled, and orange blotched females occur in several
      populations; their egg spots are faint or absent. Males also grow a little larger. Because
      the colours vary so much between localities, and some females or rare males show blotched
      patterns, sexing young fish is uncertain until they are nearly adult.
    sources:
      - *sf
      - *fishprofiles
      - *tfwf
  compatibility:
    text: >-
      Combine it only with other robust mbuna of similar size whose males look different, for
      example Pseudotropheus crabro, Iodotropheus sprengerae or, in a large and densely decorated
      tank, yellow Labidochromis caeruleus. Peaceful peacocks and open-water haps suffer from its
      attacks and need more protein in their food. Do not keep it with other Labeotropheus, because
      L. trewavasae and L. fuelleborni cross in the aquarium, the colour forms of the genus may
      hybridise and the hybrids cannot be told apart. Blue mbuna such as Maylandia males are
      treated as rivals. Large predators eat young mbuna and need meaty food that does not suit
      this grazer.
    sources:
      - *sf
      - *pauers2018
      - *pauers2023
      - *fishkeeper
  problems:
    text: >-
      The most common mistake is a diet too rich in protein: frozen bloodworms, beef heart or
      fish-based pellets can lead to Malawi bloat, which often ends fatally. A second risk is the
      wrong group: a single female or two males in a small tank leads to constant chasing,
      injured fins and exhausted females. Sharp or unstable rock can injure the lips or collapse
      when the fish dig. Mixing several Labeotropheus forms leads to hybrids. Poor water quality
      with rising nitrate weakens these fish quickly, so changes of a large share of the water
      every week matter. Stressed fish lose colour and stop eating; check the group structure and
      the water first.
    sources:
      - *fishkeeper
      - *sf
      - *gensou


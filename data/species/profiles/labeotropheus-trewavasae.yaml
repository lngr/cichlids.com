variants:
  - name: "'Nkhata Bay'"
    kind: locality
    note: Type population of the species.
  - name: "'Thumbi West'"
    kind: locality
    note: The classic red top form of the trade from Thumbi West Island in the south of the lake.
  - name: "'Chidunga Rocks'"
    kind: locality
    note: Population of the laboratory stocks of Pauers and co-workers in the south-west of the lake.
  - name: "'Mumbo Island'"
    kind: locality
  - name: "'Chilumba'"
    kind: locality
    note: >-
      Trade name for slender forms from the Luromo Peninsula near Chilumba, including blotched
      fish sold as marmalade cat; several populations of this area are the type populations of
      L. simoneae, L. chirangali, L. aurantinfra or L. candipygia under the Catalog of Fishes.
  - name: OB (orange blotch)
    kind: color-morph
    note: Blotched females, rarely males, occur in several populations.


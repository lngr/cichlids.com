  aggressionConspecific:
    value: 3
    confidence: medium
    rationale: >-
      Seriously Fish calls it very aggressive towards its own kind and advises dense stocking and
      several females per male; Fishkeeper warns that a male kept with a single female harasses her,
      sometimes to death. In arena experiments males aimed more aggression at conspecific rivals
      than at males of L. fuelleborni (Pauers and Grudnowski 2020; Pauers et al. 2023), and in the
      lake territorial males of mbuna hold their sites for long periods (Genner and Turner 2005).
      Persistent chasing with injuries under the wrong ratio or too little space fits level 3; no
      source reports routine killing of rivals in adequate tanks. All three full profiles proposed
      level 3.

    - field: features.origin.value.waterbody
      proposals:
        - {by: generator, value: Lake Malawi}
        - {by: checker-a, value: Lake Malawi}
        - {by: checker-b, value: lake-malawi}
      decision: Lake Malawi
      rationale: Both spellings name the same entry of the water body table; the name form is used, as in the other proposals.
    - field: features.origin.value.localities
      proposals:
        - {by: generator, value: [Nkhata Bay (type locality), Chidunga Rocks, Thumbi West Island, Mumbo Island]}
        - {by: checker-a, value: [Nkhata Bay, Thumbi West Island, Mumbo Island, Masinje Rocks, Boadzulu Island]}
        - {by: checker-b, value: null}
      decision: [Nkhata Bay (type locality), Chidunga Rocks, Thumbi West Island, Mumbo Island, Masinje Rocks, Boadzulu Island]
      rationale: >-
        The proposals complement each other. Nkhata Bay rests on the Catalog of Fishes, Chidunga
        Rocks on the laboratory stocks of Pauers and co-workers, the southern islands and Masinje
        Rocks on Seriously Fish. Localities of Seriously Fish that are type localities of species
        described since 2016 (Maleri, Namalenje, Chitande, Chirwa, Mphanga Rocks) are left out,
        because under the Catalog of Fishes their slender Labeotropheus belong to other species.

  ph:
    value: {min: 7.7, max: 8.6}
    confidence: high
    rationale: >-
      Lake Malawi endemic, so the natural range is the measured pH of the lake. Jackson et al.
      (1963) in the FAO source book give 7.7 to 8.6 for surface water; Branchu et al. (2010) give
      7.5 to 8.5 for the whole column of the north basin, the lower values belonging to deep water.
      The single value of 8.0 on the FishBase page lies inside this range. All three full profiles
      proposed this range.
    sources: [*fao, *branchu, *eccles, *vollmer05, *vollmer99, *ngochera]
    evidence:
      - source: *fao
        value: {min: 7.7, max: 8.6}
        note: surface water, Jackson et al. 1963
      - source: *branchu
        value: {min: 7.5, max: 8.5}
        note: whole water column, lower values at depth
    verification: {method: waterbody, waterbody: lake-malawi}
    tolerance:
      value: {min: 7.5, max: 8.8}
      confidence: medium
      rationale: >-
        Husbandry sources agree on alkaline water: Seriously Fish 7.6 to 8.8 with 8.0 as ideal and
        8.2 to 8.5 for breeding, Fishkeeper and Fishipedia 7.5 to 8.5, FishProfiles 8.0 to 8.5,
        Guidarium 7.8 to 8.6, a hobby care guide 7.6 to 8.6 and FishBase a single 8.0. The range
        7.5 to 8.8 joins these statements and contains the lake range. The vote count decided it
        unanimously (3 of 3, all three full profiles proposed 7.5 to 8.8).
      sources: [*sf, *fishprofiles, *fishipedia, *fishbase, *fishkeeper, *guidarium, &gensou {kind: website, title: "Gensou: Labeotropheus trewavasae care guide", url: "https://gensou.sg/labeotropheus-trewavasae-care-guide/", accessed: 2026-10-13}]

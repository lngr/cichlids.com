schemaVersion: 1
id: labeotropheus-trewavasae
legacyIds: [319]
status: described

taxonomy:
  validName: Labeotropheus trewavasae
  genus: Labeotropheus
  species: trewavasae
  author: Fryer, 1956
  source: &cof
    kind: catalog-of-fishes
    title: "Eschmeyer's Catalog of Fishes: species of the genus Labeotropheus (online version of 21 Sep. 2026)"
    url: https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Labeotropheus
    accessed: 2026-10-13
  legacyNames:
    - Labeotropheus trewavasae
  note: >-
    The Catalog of Fishes lists Labeotropheus trewavasae Fryer 1956 as valid, with the rocky shores
    at Nkhata Bay as type locality. It lists ten further names in the genus: L. fuelleborni Ahl
    1926 (with L. curvirostris as its synonym) and nine species described by Pauers and co-workers,
    L. chlorosiglos and L. simoneae (Pauers 2016), L. artatorostris (Pauers 2017) and L. alticodia,
    L. aurantinfra, L. candipygia, L. chirangali, L. obscurus and L. rubidorsalis (Pauers and Phiri
    2023). The descriptions rest on body shape, meristics and male nuptial colour of populations
    that the trade sells as colour forms of L. trewavasae or L. fuelleborni. The Catalog keeps all
    of them valid. Konings (2024) treats aurantinfra, candipygia, chirangali, rubidorsalis and
    simoneae as synonyms of L. trewavasae and alticodia, artatorostris, chlorosiglos and obscurus
    as synonyms of L. fuelleborni, and the Cichlid Room Companion follows the broad concept as
    well. This profile follows the Catalog: in the strict sense L. trewavasae is the slender
    Labeotropheus of the Nkhata Bay type population and of the slender populations that no
    description assigns to another species. Husbandry data in care sheets and hobby literature
    refer to the broad concept; no source reports keeping requirements that differ between the
    slender forms.


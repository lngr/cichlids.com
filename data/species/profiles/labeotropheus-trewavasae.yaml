  temperatureC:
    value: {min: 21, max: 29}
    confidence: high
    rationale: >-
      Lake Malawi endemic, so the natural range is the measured temperature range of the lake.
      Eccles (1974) reports 27 C in the upper 60 m by May and 21 C inshore in the cool, windy
      season; Vollmer et al. (2005) give winter epilimnion values of about 23.5 C and summer surface
      water of about 28 C; a 2013 campaign (Ngochera 2018) measured 24 to 29 C. The species lives in
      shallow to moderately deep rocky water, so the full range applies. The 21 to 24 C on the
      FishBase page are an aquarium figure and no habitat measurement. All three full profiles
      proposed this range.
    sources:
      - &branchu
        kind: literature
        title: >-
          Branchu, P., Bergonzini, L., Ambrosi, J.-P., Cardinal, D., Delalande, M.,
          Pons-Branchu, E. et al. (2010). Hydrochemistry (major and trace elements) of Lake Malawi
          (Nyasa), Tanzanian Northern Basin: local versus global considerations. Hydrology and
          Earth System Sciences Discussions 7, 4371-4409.
        url: https://hess.copernicus.org/preprints/7/4371/2010/hessd-7-4371-2010.pdf
        accessed: 2026-10-12
      - &fao
        kind: literature
        title: >-
          Vanden Bossche, J.-P. and Bernacsek, G. M. (1990). Source book for the inland fishery
          resources of Africa, Vol. 1, CIFA Technical Paper 18/1, FAO. Lake Malawi/Nyasa: physical
          and chemical data after Jackson et al. (1963) and Talling and Talling (1965).
        url: https://www.fao.org/4/t0473e/T0473E05.htm
        accessed: 2026-10-12
      - &eccles
        kind: literature
        title: >-
          Eccles, D. H. (1974). An outline of the physical limnology of Lake Malawi (Lake Nyasa).
          Limnology and Oceanography 19(5), 730-742 (abstract).
        url: https://doi.org/10.4319/lo.1974.19.5.0730
        accessed: 2026-10-12
      - &vollmer05
        kind: literature
        title: >-
          Vollmer, M. K., Bootsma, H. A., Hecky, R. E., Patterson, G., Halfman, J. D., Edmond,
          J. M., Eccles, D. H. and Weiss, R. F. (2005). Deep-water warming trend in Lake Malawi,
          East Africa. Limnology and Oceanography 50(2), 727-732.
        url: https://www.dora.lib4ri.ch/empa/dload/empa:1253/PDF/view
        accessed: 2026-10-12
      - &vollmer99
        kind: literature
        title: >-
          Vollmer, M. K., Weiss, R. F. and Bootsma, H. A. (1999). Lake Malawi/Nyasa deep water
          renewal. In: Bootsma, H. A. and Hecky, R. E. (eds.), Water Quality Report, SADC/GEF Lake
          Malawi/Nyasa Biodiversity Conservation Project, chapter 4.
        url: https://sites.uwm.edu/hbootsma/files/2020/11/Ch4-Lake-Internal-Mixing.pdf
        accessed: 2026-10-12
      - &ngochera
        kind: literature
        title: >-
          Ngochera (2018). Carbon Dynamics in Tropical Lake Malawi. PhD dissertation, University
          of Wisconsin-Milwaukee.
        url: https://minds.wisconsin.edu/handle/1793/91765
        accessed: 2026-10-12
    evidence:
      - source: *eccles
        value: {min: 21, max: 27}
        note: inshore minimum in the cool season, upper 60 m by May
      - source: *vollmer05
        value: {min: 23.5, max: 28}
        note: winter epilimnion to summer surface water
      - source: *ngochera
        value: {min: 24, max: 29}
        note: 2013 campaign
    verification: {method: waterbody, waterbody: lake-malawi}
    tolerance:
      value: {min: 21, max: 29}
      confidence: medium
      rationale: >-
        Care sheets lie between 21 and 28 C: FishBase and Fishkeeper 21 to 24, FishProfiles 21 to 25
        with up to 27 for breeding, Fishipedia 23 to 28, Seriously Fish and Guidarium 24 to 28. The
        laboratory stocks of Pauers and co-workers lived and bred for years at 28 C (2018) and 25 C
        (2023). The tolerance has to contain the natural lake range, which the fish meet in the wild
        every year, so it equals 21 to 29 C; the upper end rests on the lake measurements, no
        aquarium source goes beyond 28 C. The vote count decided the range unanimously (3 of 3):
        generator and checker-a proposed 21 to 29 C, checker-b 22 to 28 C, which lies within 1 C.
      sources:

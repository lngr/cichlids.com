        - {by: tiebreaker-1, value: {min: 5, max: 20}}
        - {by: tiebreaker-2, value: {min: 5, max: 10}}
      decision: {min: 5, max: 10}
      rationale: >-
        Decided by the vote count as the conservative value (3 of 5 agree, no qualified majority,
        confidence low): the intersection of all five ranges. No species source of kind literature
        or database states a carbonate hardness; the upper bounds above 10 dKH rest on general
        mbuna pages or on total hardness used as a proxy.
    - field: features.diet.value.foods
      proposals:
        - {by: generator, value: [spirulina flakes and pellets, vegetable-based mbuna pellets, "blanched spinach, peas, cucumber", mysis or brine shrimp as a rare treat]}
        - {by: checker-a, value: [spirulina flakes and pellets, blanched spinach and other vegetables, occasional small frozen crustaceans]}
        - {by: checker-b, value: [spirulina flakes, algae wafers, blanched greens, occasional frozen foods]}
      decision: [spirulina flakes and pellets, vegetable-based mbuna pellets, "blanched spinach, peas, cucumber", mysis or brine shrimp as a rare treat]
      rationale: >-
        The diet is decided by the vote count (unanimous on type aufwuchs and bloatSensitive true),
        which takes the food list of the top candidate. It names the plant-based staples that all
        proposals share and limits animal food to rare treats, as Fishkeeper advises.
    - field: features.maxSizeCm.value
      proposals:
        - {by: generator, value: {male: 12, female: 11}}
        - {by: checker-a, value: {male: 13, female: 11}}
        - {by: checker-b, value: {male: 13, female: 11}}
      decision: {male: 13, female: 11}
      rationale: >-
        The feature is the typical maximum of well-kept aquarium fish. The generator's 12 cm is
        close to the mean of adult laboratory males (11.4 to 12.0 cm total length, Pauers et al.
        2023); the larger males of such a stock, the 11.3 cm standard length of Seriously Fish
        (about 13.5 to 14 cm total length) and the 14 cm of Guidarium support 13 cm. All proposals
        agree on 11 cm for females.
    - field: features.aggressionHeterospecific.value
      proposals:
        - {by: generator, value: 3}
        - {by: checker-a, value: 2}
        - {by: checker-b, value: 2}
      decision: 3
      rationale: >-
        All three runs read the same facts: chasing beyond the spawning site, unsuitable for
        peaceful peacocks and utaka, suitable only with other robust mbuna. The rubric defines
        level 3 as aggression that requires tankmates of comparable size and robustness, which
        matches these statements; checker-a named them the upper edge of level 2 and checker-b
        called level 3 possible. Since a too low level would let the compatibility check accept
        peaceful tankmates, the higher level is kept.
    - field: features.territory.value
      proposals:
        - {by: generator, value: {size: small, breedingOnly: false}}
        - {by: checker-a, value: {size: small, breedingOnly: false}}
        - {by: checker-b, value: {size: large, breedingOnly: false}}
      decision: {size: small, breedingOnly: false}
      rationale: >-
        Fishkeeper and Seriously Fish describe a spawning site on a flat stone near a cave, which
        fits the small class; checker-b gave large as an estimate with confidence low and no source
        for a territory of a third of the tank.
    - field: features.coloration.value
      proposals:
        - {by: generator, value: {baseColors: [blue, red], pattern: bars}}
        - {by: checker-a, value: {baseColors: [blue, red], pattern: bars}}
        - {by: checker-b, value: {baseColors: [blue, orange], pattern: mixed}}
      decision: {baseColors: [blue, red], pattern: bars}
      rationale: >-
        The common red top trade forms have blue males with faint bars and a red to orange dorsal
        fin, as two runs and TropicalFreshwaterFish describe. Checker-b's orange and mixed pattern
        reflect the variability between populations and the orange blotch females, which the
        confidence low and the rationale cover.
    - field: features.minTank.value
      proposals:
        - {by: generator, value: {volumeL: 240, lengthCm: 120, depthCm: 45}}
        - {by: checker-a, value: {volumeL: 240, lengthCm: 120, depthCm: 45}}
        - {by: checker-b, value: {volumeL: 250, lengthCm: 120, depthCm: 50}}
      decision: {volumeL: 240, lengthCm: 120, depthCm: 45}
      rationale: >-
        All proposals agree on 120 cm length. The sources range from 154 L (Seriously Fish base)
        through 200 L (Guidarium) to 250 L (a hobby care guide); a standard 120 by 45 cm tank of
        about 240 L meets them, and no source asks for 50 cm depth.

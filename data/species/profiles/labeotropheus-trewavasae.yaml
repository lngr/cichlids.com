        - {by: checker-b, value: {min: 22, max: 28}}
      decision: {min: 21, max: 29}
      rationale: Decided by the vote count (unanimous, 3 of 3 within 1 C, confidence medium); the median of the agreeing bounds is 21 to 29 C, which equals the natural lake range that the tolerance must contain.

  temperatureC:
    value:
      min: 21
      max: 29
    confidence: "high"
    rationale: "All four natural-water proposals agree on the required lake envelope of 21 to 29 C.
      Eccles reports seasonal inshore cooling to 21 C and water near 27 C in May; Vollmer describes
      summer surface water near 28 C and winter water below 24 C. These lake studies support
      seasonal variation, rather than a species-specific optimum. The 29 C endpoint is retained from
      the settled lake synthesis; the accessible thesis abstract does not independently establish
      that endpoint."

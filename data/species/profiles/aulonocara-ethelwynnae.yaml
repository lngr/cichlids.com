      - *a25
      - *a45
  socialBehavior:
    text: "One male with four females spreads courtship attention in an ordinary aquarium. A male
      defends a small site and regularly chases rivals, but the species is comparatively mild toward
      unrelated companions. Several males require substantially more room and escape routes.
      Persistent hiding or exclusion from food indicates that the social arrangement is failing,
      even if the nominal ratio is correct."
    sources:
      - *a6
      - *a32
      - *a3
      - *a7
      - *a33
      - *a26
      - *a17
  diet:
    text: "Provide varied small prepared foods supplemented with suitable aquatic invertebrates, and
      include some plant-containing prepared food. Fine sand allows the normal prey-searching
      behaviour. Protein-rich aquatic prey fits the natural diet, while repeated heavy meals or a
      narrow fatty diet are poor practice. Some sources caution about protein or digestive trouble,
      but the evidence does not establish a species-specific tendency to bloat on high protein. The
      false flag does not mean immunity to digestive illness."
    sources:
      - *a5
      - *a6
      - *a3
      - *a7
      - *a17
      - *a18
      - *a16
      - *a26
      - *a29
      - *a27
      - *a28
      - *a23
      - *a21
      - *a30
      - *a22
      - *a46
      - *a47
      - *a31
      - *a32
      - *a48
  breeding:
    text: "The female collects the eggs and incubates them in her mouth. Spawning takes place at the
      male's defended sand or rock site, and aquarium accounts describe oral care lasting several
      weeks. Brooding females may eat little. Excessive handling or harassment can interrupt
      incubation; released fry face predation in a community. Breeding fish require reliable species
      identification because similar peacock females are difficult to separate."
    sources:
      - *a32
      - *a6
      - *a33
      - *a3
  sexing:
    text: "Adult males are usually larger and develop stronger colour, especially in the fins and head.
      Females and immature males remain subdued and barred. Specialist locality accounts describe
      black dorsal-fin lappets in females and nonbreeding males as one identification clue. Colour
      alone cannot establish pure ancestry or distinguish every Chitande-type female."
    sources:
      - *a6
      - *a3
      - *a18
      - *a7
      - *a26
      - *a8
  compatibility:
    text: "Calm Malawi haps with different patterns can share a sufficiently spacious aquarium. Most
      boisterous mbuna make poor companions, although the species account allows peaceful
      Labidochromis caeruleus under suitable conditions. Ordinary feeding speed does not guarantee
      food access beside aggressive fish. Other peacocks and Sciaenochromis fryeri carry presumed
      crossing risks; no named cross involving ethelwynnae is verified here. Incidental fry capture
      remains possible even at predation level 0."
    sources:
      - *a6
      - *a3
      - *a7
      - *a35
      - *a1
      - *a36
      - *a37
      - *a32
      - *a28
      - *a26
      - *a23
      - *a38
      - *a39
      - *a30
      - *a49
      - *a50
      - *a40
      - *a34
  problems:
    text: "Poor feeding access, relentless chasing and unstable water are the main preventable risks
      described by the care accounts. Fine sand matters because coarse substrate can obstruct
      feeding and injure the gills. Feed varied portions and keep waste from accumulating. Digestive
      problems need attention, but a nonspecific report from mixed wild-caught stock cannot
      establish protein-triggered bloat in this species. Uncertain locality labels and mixed peacock
      breeding can also undermine the identity of captive stock."

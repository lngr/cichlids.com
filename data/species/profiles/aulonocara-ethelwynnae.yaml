      decision: *a52
      rationale: "Generator proposed 20 to 30 C, checker-a and checker-b each proposed 21 to 29 C, and
        checker-c proposed 21 to 30 C. All four agree within the one-degree voting threshold; the
        tally rounds their endpoint medians to 21 to 30 C with unanimous verification and medium
        confidence. Seriously Fish and FishBase give 22 to 26 C, Ciklid gives 23 to 28 C, Aqua-Fish
        and AquaticCommunity give 23 to 25 C, and Imperial Tropicals gives about 23.3 to 27.8 C. The
        decided envelope contains the natural 21 to 29 C range and adds an inferred upper margin; 30
        C is not a demonstrated lifetime optimum or tested physiological limit."
    - field: "features.khDkh.tolerance"

      - *a7
      - *a16
      - *a26
      - *a20
      - *a15
  sizeAndGrowth:
    text: "Typical aquarium planning sizes are about 10.5 cm for males and 8.5 cm for females.
      Sex-specific accounts span 10 to 11 cm and 8 to 9 cm respectively. Smaller museum
      standard-length records and larger retailer figures are not directly comparable. The estimated
      lifespan of 7 to 10 years has weak support and should not be read as a documented longevity
      boundary."
    sources:
      - *a3
      - *a6
      - *a5
      - *a26
      - *a17
      - *a18
      - *a16
      - *a41
      - *a29
      - *a42
  husbandry:
    text: "Plan at least 235 litres with a base 120 cm long and 45 cm deep for one male and four
      females; a community needs more room. Use fine sand and separated rock shelters, leaving clear
      feeding areas. Establish biological filtration before introduction and maintain stable
      chemistry with regular water changes. A steady temperature in the mid-20s C is better
      supported by husbandry sources than routine use of the tolerance endpoints. KH tolerance is
      provisional and is not a target to maximize."
    sources:
      - *a6
      - *a3
      - *a26
      - *a7
      - *a17
      - *a18
      - *a28
      - *a8
      - *a9

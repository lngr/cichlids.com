        size and robustness can also disadvantage this quiet species."
profile:
  overview:
    text: "This small Malawi peacock is associated with Chitande Island and the northwestern shore
      between Ngara and Chilumba. Males develop blue fins and a brown to yellowish body with dark
      vertical bars. Females are less colourful. It searches sand for small animal prey and suits a
      calm aquarium with one male and several females. Nkhata Bay fish sold as Chitande Type North
      are treated separately in specialist accounts."
    sources:
      - *a2
      - *a6
      - *a5
      - *a3
      - *a4
      - *a1
      - *a7
      - *a43
      - *a16
      - *a44
      - *a28
      - *a9
      - *a10
      - *a11
      - *a12
      - *a13
      - *a14
      - *a26
      - *a8
  habitat:
    text: "Sand broken by scattered rocks provides both feeding ground and male display sites. Females
      and young fish gather in shallower areas; accounts disagree over male depths, with Seriously
      Fish giving about 6 to 7 m and Malawi specialists describing about 15 to 25 m. Lake water is
      alkaline but relatively soft in calcium and magnesium, while its alkalinity provides
      substantial buffering. These properties should be considered separately."
    sources:
      - *a5
      - *a3
      - *a9
      - *a10
      - *a11
      - *a12
      - *a13
      - *a14
      - *a4

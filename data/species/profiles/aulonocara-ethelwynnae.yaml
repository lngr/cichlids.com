            min: 5
            max: 15
      decision: *a53
      rationale: "Generator, checker-b and tiebreaker-1 proposed 5 to 20 dKH; checker-a proposed 4 to 18,
        checker-c 4 to 12, and tiebreaker-2 5 to 15 dKH. Under the two-degree agreement threshold
        the tally groups four of six votes and retains 5 to 20 dKH by qualified majority with low
        confidence. Malawi-Guru explicitly regards 6 to 20 dKH as acceptable for Malawi aquaria; the
        minimum is widened to 5 to contain the natural 5 to 8 dKH range. JBL recommends 5 to 10,
        OATA 10 to 15, and Aquarist Atlas about 6 to 8 dKH. An aquarium report lists this species at
        15 dKH but gives no species-specific lifetime outcome. The upper limit is a group-level
        extrapolation, not a tested boundary; pH and GH recommendations are not numerical KH
        measurements."

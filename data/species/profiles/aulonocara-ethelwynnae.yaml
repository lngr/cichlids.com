  ghDgh:
    value:
      min: 3
      max: 5
    confidence: "high"
    rationale: "All four proposals retain 3 to 5 dGH. Calcium and magnesium measurements compiled by FAO
      yield about 3.2 to 4.9 dGH; Branchu northern-basin measurements in the upper 50 m yield
      roughly 4.2 to 4.6 dGH. The rounded lake envelope describes naturally soft water despite
      substantial alkalinity. Aquarium recommendations of 10 to 25 dGH and Aqua-Fish's wider 14 to
      28 dGH concern keeping practice, not natural hardness."

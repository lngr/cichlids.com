    rationale: "Generator, checker-a and checker-b proposed 2; checker-c proposed 1 following the Nordic register,\
      \ which describes little hostility to other aquarium residents. Callipterus describes energetic defense near\
      \ spawning sites, while the CRC expert describes mixed housing with robust fish and Cichlid-Forum reports\

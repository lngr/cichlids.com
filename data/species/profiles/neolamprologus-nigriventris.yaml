  - field: "features.aggressionConspecific"
    proposals:
    - by: "generator"
      value: 3
    - by: "checker-a"
      value: 3
    - by: "checker-b"
      value: 3
    - by: "checker-c"
      value: 4
    decision: 4
    rationale: "Generator, checker-a and checker-b proposed 3, interpreting lethal attacks as a consequence of inadequate\
      \ cover; checker-c proposed 4. The additional readable CRC expert response describes repeated conspecific\
      \ deaths even in community attempts, as well as unpredictable adult males. Together with the weak-pair and\
      \ lethal-attack accounts at Tanganyika.si and Destination Tanganyika, this supports rubric level 4 and a need\
      \ for experienced management and separation. The Nordic register directly recommends pairs because of aggression.\
      \ This decision does not assert that every compatible pair will fight, and its strength rests on husbandry\
      \ reports rather than measured attack rates."

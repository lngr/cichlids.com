    tolerance:
      value: &id056
        min: 22
        max: 30
      confidence: "low"
      rationale: "The tally retains 22 to 30 C at low confidence by unanimous agreement within its one-degree matching\
        \ threshold. Generator, checker-a and checker-c proposed 22 to 30; checker-b proposed 23 to 29. FishBase\
        \ gives 24 to 28 C, the Nordic register 24 to 27.5, Fishipedia 24 to 26 and Cichlid-Forum approximately\
        \ 25 to 26. These are preferred or environmental bands. The extra margin is a keeping estimate, not a tested\
        \ multi-year boundary. Tanganyika.si cautions that around 30 C is only tolerated briefly, so the upper endpoint\
        \ has particularly weak long-term support; routine care should stay around 24 to 27 C."

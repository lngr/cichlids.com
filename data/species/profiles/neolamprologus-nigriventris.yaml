profile:
  overview:
    text: "This small Congolese Lake Tanganyika endemic is recognized by the contrast between its pale upper body\
      \ and dark belly. It stays near rocks within a sandy transition habitat and feeds mainly on small invertebrates.\
      \ Aquarium males are provisionally planned at 12 cm, with females smaller, although published sizes vary.\
      \ A compatible pair is the recommended adult unit. Managing that pair is the main challenge: serious conspecific\
      \ aggression can require separation even after the fish appear settled. The pair minimum is 200 litres with\
      \ a 100 by 40 cm footprint and numerous separate refuges. Mixed Tanganyika housing is possible, but delicate\
      \ bottom fish and shell-dweller broods are poor matches."
    sources:
    - *id001
    - *id002
    - *id003
    - *id012
    - *id033
    - *id026
  habitat:
    text: "The known range lies on the southwestern Congolese shore of Lake Tanganyika. Kiku and Lunangwa Fjord\
      \ are recorded localities, with the specialist distribution account extending north to several kilometres\
      \ south of Kapampa. FishBase places the fish mainly around 15 to 45 m deep, with a recorded limit of 46 m.\
      \ Sand between larger rocks provides both feeding ground and shelter. The decided natural lake ranges are\
      \ 23 to 29 C, pH 8.4 to 9.4, GH 10 to 13 dGH and KH 15 to 20 dKH. These summarize lake measurements across\
      \ places and seasons; they do not show that this fish regularly experiences every combination of their extremes."
    sources:
    - *id002
    - *id003
    - *id047
    - *id013
    - *id001
    - *id012
    - *id021
    - *id016
    - *id022
    - *id023
    - *id024
  sizeAndGrowth:
    text: "The working adult maxima are 12 cm for males and an estimated 9.5 cm for females. FishBase records 10.3\
      \ cm total length for a male or unsexed fish, whereas Zoopet lists 12 cm and Cichlid-Forum approximately 12.7\
      \ cm. Tanganyika.si reports aquarium individuals reaching about 15 cm. That larger report remains relevant,\
      \ but is not used as the typical maximum of every well-kept male. Separate female aquarium measurements were\
      \ not found. The smaller female value reflects observed sexual size differences and the median of the submitted\
      \ estimates. No source supplies a species-specific growth timetable, so age or maturity should not be inferred\
      \ from length alone."
    sources:
    - *id002
    - *id003
    - *id012
    - *id025
    - *id026
    - *id018
  husbandry:
    text: "Provide a mature aquarium with fine substrate, stable rockwork and multiple cavities that cannot all\
      \ be watched from one position. A pair needs at least 200 litres, a 100 cm length and a practical depth of\
      \ 40 cm; a mixed community or a group being raised for pairing needs more room. The numerical depth is an\
      \ estimate rather than a published species threshold. Routine recommendations cluster around 24 to 27 C and\
      \ strongly alkaline water. Decided tolerances are 22 to 30 C, pH 7.5 to 9.4, GH 8 to 25 and KH 11 to 24. Their\
      \ endpoints are uncertain, especially temperature and KH; the upper temperature endpoint is not an established\
      \ long-term target. Regular water changes and subdued illumination suit the reported habitat and husbandry\
      \ experience."
    sources:
    - *id012
    - *id003
    - *id025
    - *id013
    - *id032
    - *id033
    - *id030
    - *id021
    - *id016
    - *id022
    - *id023
    - *id024
  socialBehavior:
    text: "Treat the pair as a managed stocking unit rather than a promise of lifelong harmony. The Nordic register\
      \ recommends pair keeping, and specialist accounts describe selecting a pair from juveniles and removing surplus\
      \ adults. Reports of males spawning with several females successively do not establish that a fixed harem\
      \ is easier or safer to maintain. Some established pairs remain productive, while others become unstable.\
      \ Serious injuries and deaths have been reported among adults, including in mixed tanks. Provide the smaller\
      \ fish with independent retreats and keep a way to separate the pair. Persistent exclusion from shelter or\
      \ feeding areas calls for intervention rather than waiting for a hierarchy to settle."
    sources:
    - *id003
    - *id012
    - *id047
    - *id025
    - *id026
    - *id033
  diet:
    text: "Stomach observations summarized by FishBase identify small aquatic invertebrates, including crustaceans,\
      \ copepods, insect larvae and snail material. Minor algae and sand in the same samples do not establish a\
      \ grazing diet. Offer varied appropriately sized animal foods and a good prepared food that the fish accepts.\
      \ Observe both adults during feeding because a subordinate fish can be prevented from taking its share. The\
      \ omnivore label on Fishipedia conflicts with the more specific stomach evidence and is not the selected feeding\
      \ category. No source establishes a special bloat susceptibility. Occasional predation on tiny fish or fry\
      \ remains plausible from aquarium reports, although fish are not documented as a major natural food."
    sources:
    - *id002
    - *id003
    - *id012
    - *id025
    - *id017
    - *id026
    - *id018
  breeding:
    text: "Eggs are placed inside a cave or sheltered crevice. The public CRC page confirms cave spawning, and aquarium\
      \ accounts describe narrow protected nesting spaces. Published brood figures are inconsistent: Tanganyika.si\
      \ gives 50 to 100 eggs, Zoopet 30 to 70, and Callipterus up to 50. The CRC expert describes reports of only\
      \ 6 to 12 young as substantial aquarium results. Egg counts and surviving young are different measures, so\
      \ these figures should not be combined into one expected yield. Accounts also differ about the male contribution\
      \ to guarding; the female commonly stays near the nest. A successful spawning does not establish that aggression\
      \ within the pair has ceased."
    sources:
    - *id045
    - *id003
    - *id047
    - *id026
    - *id032
    - *id033
  sexing:
    text: "Mature males tend to be larger than females, and Zoopet also describes somewhat more pointed fins. These\
      \ differences are difficult to use in juveniles or between fish of different ages. The Nordic register considers\
      \ comparison of the genital openings more dependable than size alone. Color contrast is shared by the sexes\
      \ and varies with condition, so a pale upper body or dark phase does not reliably identify sex. The estimated\
      \ male and female maximum lengths in the compatibility data are planning values, not diagnostic cutoffs. Pairing\
      \ behavior can help identify a compatible combination, but continued tolerance and access to separate refuges\
      \ matter more than a brief display or one spawning."
    sources:
    - *id012
    - *id047
    - *id025
    - *id026
  compatibility:
    text: "The fish can share a suitably spacious Tanganyika aquarium with robust companions, but the strongest\
      \ direct accounts concern similar-sized lamprologines rather than a tested list of individual species. Adult\
      \ Altolamprologus calvus is therefore a possible companion only where separate rock territories and escape\
      \ routes are available. Cyprichromis leptosoma is a tentative option in a larger aquarium with a distinct\
      \ open-water area; a direct species-pair trial was not found. Avoid small shell dwellers because a hobby account\
      \ reports brood raids and fatal extraction of females from shells. Similar-looking N. pectoralis may add territorial\
      \ competition, but no crossing involving N. nigriventris was established. Additional conspecific adults are\
      \ a separate serious risk."
    sources:
    - *id012
    - *id003
    - *id025
    - *id033
    - *id018
    - *id026
  problems:
    text: "The most consequential problem is aggression within the species. A weak pair can deteriorate, and cover\
      \ does not guarantee that two adults remain compatible. Watch for torn fins, persistent hiding, loss of feeding\
      \ access or a fish trapped away from its refuge, and separate individuals when necessary. The lower-trust\
      \ shell-dweller account describes a specific risk that broad community labels miss. Water stability and cleanliness\
      \ also matter; do not treat broad estimated tolerances as proof that abrupt changes or continual exposure\
      \ at their edges are harmless. Evidence for species-specific disease patterns, lifespan and long-term chemical\
      \ failure thresholds remains sparse. Do not infer a diagnosis or a specialized disease tendency merely from\
      \ those gaps."
    sources:
    - *id003
    - *id012
    - *id002
    - *id025
    - *id033
    - *id018
    - *id030

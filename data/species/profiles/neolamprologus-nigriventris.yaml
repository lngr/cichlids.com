  temperatureC:
    value:
      min: 23
      max: 29
    confidence: "high"
    rationale: "The settled lake decision is retained exactly at 23 to 29 C with high confidence. Verburg and colleagues\
      \ measured 23.85 to 29.01 C at the southern buoy, supporting seasonal lake variation. FishBase reports 24\
      \ to 28 C for the species and the Nordic register recommends 24 to 27.5 C; neither replaces the lake-wide\
      \ natural range. The range is habitat context, not a recommendation to maintain a constant temperature at\
      \ either extreme."

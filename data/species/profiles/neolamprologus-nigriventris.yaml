  ph:
    value:
      min: 8.4
      max: 9.4
    confidence: "high"
    rationale: "The settled natural range remains 8.4 to 9.4 with high confidence. Plisnier and colleagues report\
      \ 8.47 to 9.40 at 40 m over a year. FishBase gives the wider lower-reaching species interval 7.5 to 9.0. The\
      \ older FAO source book gives 7.3 to 7.8, conflicting with the modern monitoring and strong alkalinity; it\
      \ stays cited but does not set the decision. Natural lake variation and aquarium recommendations are kept\
      \ distinct."

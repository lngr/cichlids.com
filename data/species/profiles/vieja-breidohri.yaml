        - Lagos de Colon
    - by: checker-a
      value:
        continent: Central America
        region: "Upper Grijalva River basin, Chiapas (Mexico)"
        waterbody: null
        localities:
        - Presa La Angostura (Belisario Dominguez reservoir)
        - Lagos de Colon
    - by: checker-b
      value:
        continent: Central America
        region: Upper and middle Grijalva basin in Chiapas and adjacent northern Guatemala
        localities:
        - Presa de la Angostura
        - Lagos de Colon
        - Rio Salado
    - by: checker-c
      value:
        continent: Central America
        region: "Middle and upper Grijalva basin, Chiapas in Mexico and northern Guatemala"
        localities:
        - Presa de la Angostura (Belisario Dominguez reservoir)
        - Lagos de Colon
    decision:
      continent: Central America
      region: "Upper and middle Grijalva basin, Chiapas, Mexico and northern Guatemala"
      waterbody: null
      localities:
      - Presa de la Angostura (Belisario Dominguez reservoir)
      - Rio Salado
      - Lagos de Colon
    rationale: "The Catalog of Fishes identifies the Atlantic-slope Grijalva system in southern Mexico and northern\
      \ Guatemala. Primary studies document Angostura and Lagos de Colon specimens; Beerlink adds the sandy, stony\
      \ Rio Salado. Retain the broader catalog distribution rather than checker-a's Mexico-only wording. The Nordic\
      \ register's Pacific-slope statement is a geographic error. Angostura is an impounded part of the Grijalva,\
      \ not a separate Rio Angostura drainage, and no named waterbody-table entry applies. Lower Usumacinta, Malpaso,\
      \ Penitas, Montebello and Cuban literature retained by checkers does not supply this species' native water\
      \ endpoints."
  - field: features.temperatureC
    proposals:
    - by: generator
      value:
        min: 25
        max: 32
    - by: checker-a
      value:
        min: 24
        max: 30
    - by: checker-b
      value:
        min: 25
        max: 32
    - by: checker-c
      value:
        min: 24
        max: 30
    - by: tiebreaker-1
      value:
        min: 25
        max: 32
    - by: tiebreaker-2
      value:
        min: 24
        max: 30
    decision:
      min: 25
      max: 31
    rationale: "Tally method median. The settled tally uses the median of all six minima and maxima, rounded to\
      \ whole degrees: 25 to 31 C. generator proposed 25 to 32; checker-a proposed 24 to 30; checker-b proposed\
      \ 25 to 32; checker-c proposed 24 to 30; tiebreaker-1 proposed 25 to 32; tiebreaker-2 proposed 24 to 30. The\
      \ two camps concern the FishBase environmental summary of 24 to 30 C and the archived ten-station INAPESCA\
      \ reservoir survey of 25 to 32 C. The decided range is narrower at the hot end than the latter source range\
      \ and omits FishBase's 24 C endpoint. CESACH observations of 29 to 29.7 C and collecting reports of 30 C lie\
      \ inside it. This numerical compromise is a provisional typical habitat envelope, not a demonstrated seasonal\
      \ limit. Lower Grijalva observations of 24 to 31 C are downstream comparisons; Montebello lake measurements\
      \ of 17.5 to 24.2 C do not describe occupied habitat. Confidence remains low; no aquarium recommendation determines\
      \ the natural value."
  - field: features.temperatureC.tolerance
    proposals:
    - by: generator
      value:
        min: 24
        max: 32
    - by: checker-a
      value:
        min: 20
        max: 31
    - by: checker-b
      value:
        min: 23
        max: 32
    - by: checker-c
      value:
        min: 23
        max: 30
    - by: tiebreaker-1
      value:
        min: 23
        max: 32
    - by: tiebreaker-2
      value:
        min: 23
        max: 30
    decision:
      min: 23
      max: 32
    rationale: "Tally method median. Retain the low-confidence median tolerance of 23 to 32 C. generator proposed\
      \ 24 to 32; checker-a proposed 20 to 31; checker-b proposed 23 to 32; checker-c proposed 23 to 30; tiebreaker-1\
      \ proposed 23 to 32; tiebreaker-2 proposed 23 to 30. Rounded medians of all minima and maxima give 23 and\
      \ 32; there is no qualifying source-supported majority. This contains the decided natural 25 to 31 C. Species-specific\
      \ guidance gives 23 to 27 C in the Nordic register, 23 to 28 C in Zoopet, 24 to 29 C in Einrichtungsbeispiele\
      \ and 24 to 30 C in Beerlink's table, with 26 to 28 C preferred in the article. The wider dealer and Fishkeeper\
      \ source range of 20 to 30 C is narrowed at the cool end, while the hot end of 32 comes from archived field\
      \ exposure rather than evidence of years of aquarium health. Routine keeping around 26 to 28 C has better\
      \ support; the outer limits remain provisional."

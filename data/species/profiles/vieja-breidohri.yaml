  ph:
    value:
      min: 7.5
      max: 8.4
    confidence: medium
    rationale: "Retain the source-supported qualified-majority tally of pH 7.5 to 8.4 with four agreeing votes out\
      \ of six. generator proposed 7.4 to 8.4; checker-a proposed 7.5 to 8.4; checker-b proposed 7.7 to 8.4; checker-c\
      \ proposed 7.5 to 8; tiebreaker-1 proposed 7.4 to 8.4; tiebreaker-2 proposed 7.5 to 7.7. Archived Angostura\
      \ measurements include 7.9 to 8.4 in the INAPESCA surface survey and 7.7 at Buenavista; Hohl reports a collecting-site\
      \ value of 7.5. The 2016 assessment gives a wider shallow-water source range of 7.4 to 8.4, whose lower edge\
      \ is narrowed to 7.5 by the tally. FishBase states only the lower endpoint 7.5 and cannot supply an upper\
      \ bound. Deep reservoir water reportedly reaching pH 6 with accumulated carbon dioxide is excluded from the\
      \ typical oxygenated habitat. Downstream Grijalva and unrelated highland lakes remain comparison evidence\
      \ only."

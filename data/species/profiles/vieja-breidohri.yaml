  socialBehavior:
    text: "A pair can exclude other adults and a courting male may pursue a reluctant female persistently. Observe\
      \ whether each fish can rest and feed without repeated displacement, and provide a means of separation if\
      \ retreats stop working. Strong territory defense is principally associated with reproduction; milder behavior\
      \ outside breeding does not guarantee acceptance of another adult. Juvenile or mixed-age groups are alternative\
      \ approaches mentioned by keepers, but the evidence does not establish a reliable minimum adult group size\
      \ or obligatory harem."

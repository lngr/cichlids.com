  diet:
    text: "Use both plant ingredients and aquatic invertebrate foods. Wild fish examined from Lagos de Colon had\
      \ mostly mollusks with some seeds and fish scales, whereas accounts from other settings emphasize algae and\
      \ detritus. This supports flexible omnivory rather than obligate grazing or a fish-based diet. Balanced pellets,\
      \ vegetables, algae-based foods and appropriately sized invertebrates can provide variety. Check that the\
      \ smaller partner obtains food. A species-specific bloat syndrome has not been established, and that uncertainty\
      \ does not justify overfeeding."
    sources:
    - kind: literature
      title: "Gonzalez-Diaz et al. (2022), comparative oral and pharyngeal jaws of Vieja bifasciata, V. breidohri\

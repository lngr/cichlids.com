        \ 6.5 to 7.8 and dealer ranges of 6.5 to 8 and 6 to 8 are retained as dissenting evidence; their low endpoints\
        \ do not displace the settled neutral lower boundary. The upper endpoint contains natural pH 8.4. Seriously\
        \ Fish's 7 to 8.5 account concerns bifasciata and is comparison evidence only. These are husbandry recommendations\
        \ rather than experimentally determined physiological endpoints."

  habitat:
    text: "The species belongs to the Atlantic-slope Grijalva drainage of southern Mexico and adjacent northern\
      \ Guatemala. Records include the Angostura reservoir and Lagos de Colon; specialist accounts also describe\
      \ the shallow, flowing Rio Salado over sand and stones. The decided natural ranges are 25 to 31 C, pH 7.5\
      \ to 8.4, 4 to 10 dGH and 8 to 9 dKH. These summarize uneven evidence rather than define every locality. Retained\
      \ reservoir measurements extend to 32 C and slightly above 10 dGH, and a collecting account reports 12 dKH\
      \ with 10 dGH. The local alkalinity conversion assumes CaCO3 equivalents. A reservoir assessment describes\
      \ deeper carbon-dioxide-rich water near pH 6; this is outside the usual oxygenated habitat represented by\
      \ the profile. Neither highland Montebello lakes nor downstream chemistry substitutes for occupied sites."
    sources:
    - kind: catalog-of-fishes
      title: "Eschmeyer's Catalog of Fishes, species of Vieja"
      url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Vieja"

  problems:
    text: "Loss of safe resting space can turn prolonged courtship or brood defense into damaging harassment. Watch\
      \ for a fish confined to one corner or missing meals, and separate incompatible adults before injuries accumulate.\
      \ Digging can undermine unsecured decor and plants may be consumed. Feeding and maintenance must match the\
      \ waste produced by adult fish. Persistent high temperature increases oxygen demand; the outer tolerance is\
      \ not a routine target. Quarantine arrivals and investigate abnormal breathing, appetite loss or damage instead\
      \ of assuming that one symptom identifies a particular disease."

  temperatureC:
    value:
      min: 25
      max: 31
    confidence: low
    rationale: "The settled tally uses the median of all six minima and maxima, rounded to whole degrees: 25 to\
      \ 31 C. generator proposed 25 to 32; checker-a proposed 24 to 30; checker-b proposed 25 to 32; checker-c proposed\
      \ 24 to 30; tiebreaker-1 proposed 25 to 32; tiebreaker-2 proposed 24 to 30. The two camps concern the FishBase\
      \ environmental summary of 24 to 30 C and the archived ten-station INAPESCA reservoir survey of 25 to 32 C.\
      \ The decided range is narrower at the hot end than the latter source range and omits FishBase's 24 C endpoint.\
      \ CESACH observations of 29 to 29.7 C and collecting reports of 30 C lie inside it. This numerical compromise\
      \ is a provisional typical habitat envelope, not a demonstrated seasonal limit. Lower Grijalva observations\
      \ of 24 to 31 C are downstream comparisons; Montebello lake measurements of 17.5 to 24.2 C do not describe\
      \ occupied habitat. Confidence remains low; no aquarium recommendation determines the natural value."

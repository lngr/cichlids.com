  note: "The Catalog of Fishes retains Vieja breidohri, with the original description in Paratheraps and historical\
    \ placements in Cichlasoma and Paraneetroplus. The legacy genus is already current. A separate Paratheraps genus\
    \ query returns no records. Herichthys breidohri appears in aquarium synonym lists but is not corroborated as\
    \ a formal combination by the catalog, so it is recorded here as a hobby usage rather than included among confirmed\
    \ synonyms."

  ghDgh:
    value:
      min: 4
      max: 10
    confidence: low
    rationale: "Retain the tally median of 4 to 10 dGH with low confidence. generator proposed 4.5 to 10.1; checker-a\
      \ proposed 8 to 15; checker-b proposed 4.4 to 10.1; checker-c proposed 4 to 10; tiebreaker-1 proposed 4.4\
      \ to 10.1; tiebreaker-2 proposed 4.5 to 10. The rule uses all six proposals and rounds both median endpoints\
      \ to integers; The tally explicitly retains method median with five close proposals out of six; that settled\
      \ method and low confidence are preserved. Archived Buenavista hardness of 80 mg/L corresponds to about 4.48\
      \ dGH under the conventional CaCO3-equivalent assumption. INAPESCA reports EDTA total hardness of 104 to 179\
      \ mg/L, or about 5.83 to 10.03 dGH, outward-rounded by agents to 5.8 to 10.1. The decided upper endpoint of\
      \ 10 is narrower than that source range; its lower endpoint of 4 reflects integer rounding rather than a recorded\
      \ 4 dGH sample. Hohl reports 10 dGH from a collecting locality. The 2016 assessment's wider 140 to 200 mg/L\
      \ passage, about 7.84 to 11.21 degrees, conflates hardness and alkalinity and cannot securely expand GH. Conductivity-based\
      \ 8 to 15 estimates and generic hard-water descriptions are retained without treating them as measurements."
    sources:

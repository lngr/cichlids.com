  hybridGroups:
    value:
    - vieja
    - vieja-bifasciata-breidohri
    confidence: medium
    rationale: "Retain the qualified-majority tally of vieja and vieja-bifasciata-breidohri with four agreeing votes\
      \ out of six. Generator, checker-b, checker-c and tiebreaker-2 proposed both; checker-a proposed only vieja;\
      \ tiebreaker-1 also proposed herichthys-carpintis-vieja-breidohri, rocio-octofasciata-vieja-breidohri and\
      \ vieja-breidohri-zonata. Both decided groups already include the species and have presumed basis. Specialist\
      \ congener warnings support the genus risk, while Binns labels bifasciata and breidohri captive offspring\
      \ without pedigree checks or evidence of access to same-species mates. Binns also labels the three dissenting\
      \ direct pairings, so these are retained as evidence rather than dismissed as solely compound-hybrid ancestry.\
      \ They did not receive the votes needed to change the settled group list. The jaw study establishes close\
      \ relationship without testing crosses; no transitive pairing is inferred."

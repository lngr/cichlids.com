      \ predation. CRC's algae-feeding classification and Fishkeeper's plant emphasis do not exclude opportunistic\
      \ predation. The stocking calculator's carnivorous claim lacks observations and loses to primary dietary evidence.\
      \ The rubric's approximate 2 cm prey threshold is a classification convention, not a measured ceiling. No\
      \ species-specific posts were found in the cichlids.com archive."

  husbandry:
    text: "The recommended social unit is a compatible adult pair, with at least 648 litres, 200 cm length and about\
      \ 60 cm front-to-back space. Sand, supported stones and roots should divide the aquarium into usable retreats\
      \ while leaving room to swim. A larger mixed community or group needs additional space. Maintain strong filtration,\
      \ oxygenation and regular water renewal. Routine temperatures around 26 to 28 C have clearer husbandry support\
      \ than the outer 23 to 32 C tolerance. The high endpoint mainly reflects brief field exposure and lacks proof\
      \ of long-term aquarium health. Aquarium tolerances are pH 7 to 8.5, GH 4 to 23 dGH and KH 3 to 12 dKH; their\
      \ boundaries are recommendations or inferences, not physiological trial results. Measure GH and alkalinity\
      \ separately."

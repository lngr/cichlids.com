  khDkh:
    value:
      min: 8
      max: 9
    confidence: low
    rationale: "Retain the tally median of 8 to 9 dKH with low confidence; natural KH deliberately has no verification\
      \ object. generator proposed 7.8 to 7.8; checker-a proposed 8 to 14; checker-b proposed 7.8 to 7.9; checker-c\
      \ proposed 5 to 10; tiebreaker-1 proposed 7.8 to 7.9; tiebreaker-2 proposed 7.8 to 12. Integer rounding of\
      \ all minima and maxima produces this interval. It is an inferred central alkalinity estimate rather than\
      \ a measured basin-wide seasonal range. Archived Buenavista alkalinity of 140 mg/L corresponds to about 7.84\
      \ dKH assuming CaCO3 equivalents, whose basis is not printed beside the table. Hohl independently reports\
      \ 12 dKH with 10 dGH at a collecting locality; KH can exceed GH because alkalinity includes contributions\
      \ from alkali carbonates. The decision is narrower than the combined reported 7.84 to 12 dKH observations\
      \ and the ambiguous 2016 source range of about 7.84 to 11.21 dKH. These wider observations remain visible\
      \ in evidence and are contained by the aquarium tolerance. Conductivity or pH cannot determine KH, and aquarium\
      \ acceptance up to 20 dKH does not measure natural water."

partners:
  suitable:
  - species: Large armoured catfish
    reason: Species-specific care guidance names robust armoured catfish as possible companions; suitability depends
      on the actual species and adult size.
    condition: "An expanded aquarium with separate refuges, compatible water needs and close observation during\
      \ spawning; the adult-pair minimum is not a community allowance."
  unsuitable:
  - species: Very small fish and fry
    reason: Opportunistic consumption fits predation level 1; young fish around the rubric's 2 cm threshold can
      be taken.
  - species: Small delicate community fish
    reason: Territorial exclusion and harassment make these unreliable companions even when their adult length exceeds
      the level-1 prey threshold.
  - species: Vieja bifasciata
    reason: Both decided presumed hybrid groups concern this pairing; Binns labels captive offspring without verified
      pedigree or free mate choice.
  - species: Other Vieja species
    reason: "The decided genus group represents a presumed crossing risk based on specialist warnings, not a verified\
      \ cross for every pair."
profile:
  overview:
    text: "A settled pair of Angostura cichlids can be relatively tolerant of substantial companions, but reproduction\
      \ changes its behavior sharply. Adult males are commonly larger and bluer than females, with red accents and\
      \ dark markings that vary with condition. Vieja breidohri remains the accepted name; older aquarium labels\
      \ may use Paratheraps or Paraneetroplus. Plan accommodation for adult fish and for separating an incompatible\
      \ partner. Moderate care difficulty reflects those practical demands."
    sources:

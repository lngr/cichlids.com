  sexing:
    text: "Mature males generally grow larger and develop longer fin extensions and a stronger forehead profile.\
      \ Females can show a darker dorsal-fin area, but stock, age and reproductive condition affect appearance.\
      \ Use several traits together; juvenile color alone cannot establish sex or guarantee pair compatibility.\
      \ Similar Vieja hartwegi are sometimes confused with this species in the trade, so breeding stock identification\
      \ deserves attention."

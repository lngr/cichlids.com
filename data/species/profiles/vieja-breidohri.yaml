  sizeAndGrowth:
    text: "Allow for typical adult aquarium males around 25 cm and females around 19 cm. The female estimate sits\
      \ between reported ordinary sizes of 18 and 20 cm and has no precise biological cutoff. Some contemporary\
      \ stocks remain smaller, while early imports reportedly reached 30 to 35 cm and may have involved identification\
      \ or ancestry differences. FishBase standard lengths exclude the tail. The estimated 9 to 10-year lifespan\
      \ is uncertain and should be treated as a planning allowance."

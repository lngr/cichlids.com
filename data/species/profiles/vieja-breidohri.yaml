  compatibility:
    text: "Territorial exclusion and persistent pursuit are the main concerns in an appropriately spacious aquarium.\
      \ Robust fish of comparable size can be conditional companions; the NBAT keeper reported a mixed aquarium\
      \ with grammodes, which withdrew during spawning. Small or delicate fish can be harassed, and fry or very\
      \ small fish may be eaten opportunistically. Predation level 1 does not document regular hunting of all mouth-sized\
      \ fish. The decided presumed crossing risks are the broader Vieja group and the specific bifasciata pairing.\
      \ Additional labelled pair crosses are retained in the evidence without being included in the settled group\
      \ list."

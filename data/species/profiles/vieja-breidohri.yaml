  breeding:
    text: "Both adults defend offspring after spawning on cleaned hard substrate, commonly stone or wood with nearby\
      \ cover. Reported brood sizes vary from about 100 to 300 eggs. Eggs usually hatch within a few days, and parents\
      \ may transfer larvae to a depression before the young begin swimming. Exact timing varies among keeper accounts\
      \ and with conditions. Provide fry-sized food and grow-out accommodation. A pair that tolerates companions\
      \ before spawning may exclude them once it has offspring."

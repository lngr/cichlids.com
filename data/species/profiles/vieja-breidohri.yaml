  maxSizeCm:
    value:
      male: 25
      female: 19
    confidence: medium
    rationale: "Start from the sex-specific medians of the four proposals: generator 22/18 cm, checker-a 25/20 cm,\
      \ checker-b 25/18 cm and checker-c 25/20 cm, giving 25 cm male and 19 cm female. The firsthand NBAT account\
      \ supports ordinary aquarium males near 25 cm and females near 18 cm; Einrichtungsbeispiele gives 25/20. The\
      \ female decision interpolates those ordinary source values and is not a directly measured 19 cm ceiling.\
      \ Beerlink's 21.5 to 22 cm males represent smaller contemporary stocks. Historical imports of 30 to 35 cm\
      \ and forum males of 30.5 cm are not adopted as typical maxima. FishBase's 16.8 and 25 cm standard lengths\
      \ exclude the tail and are not interchangeable with aquarium total length."

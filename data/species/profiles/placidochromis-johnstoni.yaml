  khDkh:
    value:
      min: 5
      max: 8
    confidence: "high"
    rationale: "Keep the decided natural range of 5 to 8 dKH with high confidence. Jackson measurements compiled
      by FAO give alkalinity equivalent to about 5.6 to 7.3 dKH; Branchu profiles give approximately 6.5 to
      6.9 dKH. These are rounded regional bounds, not a species tolerance experiment. Sodium contributes to
      bicarbonate balance, so alkalinity expressed as KH can exceed calcium-magnesium hardness. This natural
      feature has no verification object."

  breeding:
    text: "Females incubate eggs and young in the mouth. Males can mate with several females, and the practical
      harem arrangement does not imply a lasting pair bond. FishBase gives a clutch maximum near 120 eggs;
      brood size and success will vary. Hobby descriptions suggest release after roughly three weeks, but
      detailed timing for this species is less secure than the maternal mouthbrooding mode itself. Vegetation
      and quiet retreat space can help a brooding female avoid repeated attention. Newly released fry need
      small food and suitable rearing conditions. A separate breeding or rearing aquarium serves fry
      protection, rather than defining this species as unsuitable for community keeping."

  sizeAndGrowth:
    text: "For planning, use approximate adult maxima of 19 cm for males and 15.5 cm for females. These are a
      synthesis of conflicting proposals, and the female figure is especially uncertain. FishBase records 20
      cm total length without a separate female maximum; practical accounts describe smaller typical adults,
      while some dealers advertise larger fish. No source supports predicting an individual's exact final
      size. Buy juveniles with room for their adult group from the outset. Growth and colour should be
      assessed separately because a suppressed adult male can remain dull despite adequate body growth."

      rationale: "The tally decides 21 to 30 C, unanimous within the one-degree agreement rule, with low confidence.
        Generator and checker-b proposed 20 to 30 C; checker-a and checker-c proposed 21 to 30 C. The agreeing
        lower endpoints have a median of 20.5 C, rounded to 21 C. Read husbandry ranges include DRTA 22 to 27
        C, Aquarismo Paulista and Atlas 24 to 28 C, Gaus 24 to 26 C, and Ron's approximately 23.3 to 28.9 C.
        The adopted working interval contains the natural range and adds a provisional warm margin. No study
        establishes its endpoints as long-term physiological limits, and it is not a recommendation to
        maintain the warm edge routinely."

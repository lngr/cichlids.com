  suitable:
    - species: "Copadichromis species"
      reason: "Potential companions among calm Malawi haps with compatible adult size and a different feeding
        emphasis."
      condition: "A larger community aquarium than the minimum species-group setup, with feeding access for all fish."
    - species: "Aulonocara species"
      reason: "Hobby accounts allow suitable peacocks with Malawi haps, subject to individual temperament and size."
      condition: "Choose calm adults and monitor social suppression; this is a candidate group, not a tested species
        pairing."
  unsuitable:
    - species: "Fish and fry below about 2 cm"
      reason: "Opportunistic fry predation is recorded, so very small companions are vulnerable."
    - species: "Highly aggressive Malawi mbuna"
      reason: "Persistent pressure can suppress feeding and display in this generally restrained hap."
    - species: "Fish requiring acidic water"
      reason: "Their long-term water needs conflict with this species' alkaline tolerance."
profile:
  overview:
    text: "Placidochromis johnstoni brings the foraging behaviour of Malawi's vegetated margins into a spacious
      aquarium. It searches the bottom for small animals and often travels with other fish. A dominant male
      can show a strong blue sheen and dark bars, while females and subordinate males remain less conspicuous.
      Plan the aquarium around one male and three females, with a sandy floor and plant cover. Its generally
      restrained interactions make a suitable Malawi community possible, but fry and tiny fish can become
      prey. Fish sold as johnstoni solo should not automatically receive this profile: specialist accounts
      distinguish that trade taxon from the described species."
    sources:
      - kind: "database"

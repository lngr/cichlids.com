  socialBehavior:
    text: "A female-biased unit of one male and three females is the selected aquarium arrangement. It represents
      practical keeping advice rather than a permanent family or the full size of a wild school. Larger groups
      are described, including groups with more than one male, but usually only the dominant male develops
      full display colour. Expect hierarchy and some chasing, with room for a lower-ranking fish to withdraw.
      Reports disagree on defended spawning patches: field summaries describe no observed site defence, while
      several care accounts describe small breeding areas. The profile therefore does not require a fixed
      territory, but still allows for local courtship displays and aquarium displacement."

      small breeding-only territory. Malawi.si explicitly reports no observed spawning-site defence, and Rizzo
      describes nominal johnstoni males without a nest or territory. These species-specific field accounts
      outweigh generic courtship reconstruction. DRTA and Malawi-Guru instead describe small defended sand
      sites, and Gaus and Ron's mention breeding territoriality. Keep those opposing accounts, but do not

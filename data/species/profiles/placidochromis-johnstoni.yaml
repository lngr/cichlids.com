        OATA gives the wider group recommendation of 12 to 18 dGH, repeated dependently by Tropical Fish Co;
        Rizzo recommends at least 18 dGH for several Placidochromis. These wider recommendations do not
        establish a species requirement or proven ceiling. The retained 5 to 20 dGH dealer entries are checker
        interpretations of nonnumeric hard-water wording, not measurements or stated ranges. Neither hardness
        advice nor the median demonstrates injury outside 3 to 15 dGH."

    tolerance:
      value:
        min: 5
        max: 15
      confidence: "low"
      rationale: "The tally decides a provisional 5 to 15 dKH at qualified majority, four of six votes agreeing
        within 2 dKH, with low confidence. Generator, tiebreaker-1 and tiebreaker-2 proposed 5 to 15 dKH;
        checker-a proposed 4 to 15; checker-b proposed 5 to 12; checker-c proposed 5 to 10. OATA gives 10 to
        15 dKH for Malawi aquaria generally, repeated by Tropical Fish Co. DRTA instead specifies above 12 dKH
        without an upper limit. The natural 5 to 8 dKH must remain included, so the DRTA lower threshold is
        not obligatory. The ceiling of 15 is inferred from group care guidance, not measured species
        tolerance. The 10 and 12 dKH ceilings would exclude part of that guidance; 4 dKH is an unsupported
        buffering estimate. GH and pH cannot be converted numerically into KH."

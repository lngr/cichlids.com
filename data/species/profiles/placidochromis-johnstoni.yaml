  compatibility:
    text: "Select companions that tolerate alkaline Malawi conditions, reach a compatible adult size and do not
      monopolise the tank or feeding area. Calm haps and suitable peacocks are candidates in a larger
      aquarium; individual behaviour and the complete stocking still matter. Very small fish and fry are at
      risk, while particularly aggressive mbuna can cause prolonged suppression. No named hybrid group
      involving nominal johnstoni was established in the reviewed material. Atlas gives a broad congener
      warning, but that alone does not identify a specific crossing partner. The existing warning for electra
      and phenochilus should not be extended to johnstoni without supporting evidence."

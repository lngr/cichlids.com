  problems:
    text: "Loss of colour can reflect social rank, so inspect access to food, shelter and swimming space before
      treating colour as a health diagnosis. Repeated chasing, persistent hiding or poor body condition
      warrant a review of the social balance and stocking. Keep oxygen and filtration adequate and test water
      when appetite or breathing changes. Numerical hardness advice differs sharply among sources; avoid
      changing chemistry simply to satisfy every care sheet at once. A lifespan of roughly 8 to 12 years is
      only a low-confidence planning estimate. Neither the source search nor a profile value can promise a
      particular lifespan for an individual fish."

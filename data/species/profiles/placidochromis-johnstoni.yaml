  husbandry:
    text: "The minimum selected for one male with three females is 400 litres, 150 cm length and 50 cm
      front-to-back depth. Increase space for more adults or a mixed community. Leave a long swimming route
      over sand and use plants or scattered shelter to break sight lines. Filter and aerate effectively,
      remove accumulated waste and keep replacement water consistent. A mid-twenties temperature is the usual
      care target. The recorded working tolerances are 21 to 30 C, pH 7.5 to 8.8, GH 3 to 15 dGH and KH 5 to
      15 dKH; their outer edges, especially temperature and KH, have weak long-term evidence and are not
      routine operating targets."

  habitat:
    text: "The native range includes Lake Malawi, Lake Malombe and the upper Shire River. Sheltered sedimentary
      margins and aquatic vegetation are characteristic habitats; sand between plants offers feeding ground,
      while stones may occur nearby. The natural regional ranges are 21 to 29 C, pH 7.7 to 8.6, GH 3 to 5 dGH
      and KH 5 to 8 dKH. The low calcium-magnesium hardness and appreciable bicarbonate buffering describe
      different properties of the water. Aquarium advice calling Malawi water hard should not replace those
      measurements. Provide open bottom space alongside sheltered vegetation rather than filling the whole
      floor with rock piles."

  sexing:
    text: "Mature males typically develop stronger blue or turquoise colour with dark vertical bars; females are
      more subdued, with grey, beige or silvery tones. Adult fin shape can help, with males described as
      having longer, more pointed dorsal and anal fins. Juvenile colour is unreliable, and a subordinate male
      may resemble a female for an extended period. Judge sex from several mature characteristics and known
      breeding history where available. Yellowish fin accents may be present, but the selected dominant male
      colours are blue and black. Trade labels and a temporary failure to colour up are insufficient for
      identifying a different taxon."

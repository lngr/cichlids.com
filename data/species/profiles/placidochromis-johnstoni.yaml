    confidence: "high"
    rationale: "The settled natural range is 21 to 29 C for Lake Malawi, with high confidence and waterbody
      verification. Eccles reports southern inshore cooling to 21 C and an upper-layer temperature near 27 C;
      the FAO compilation reports 23 to 25 C in its survey. Vollmer documents seasonal surface variation. The
      full lake synthesis is broader than any one of these campaigns. Aquarium recommendations retained below
      do not define natural water measurements. Branchu entries inherited with the full 21 to 29 C span are
      synthesis attributions, not temperature bounds directly established by that hydrochemistry paper."

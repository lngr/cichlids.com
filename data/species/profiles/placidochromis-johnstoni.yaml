  diet:
    text: "Use a varied staple suited to an invertebrate-feeding Malawi hap, supplemented with appropriately sized
      aquatic invertebrate foods. Wild accounts describe prey exposed from sediment around vegetation; fry may
      also be taken. Acceptance of pellets, plant material or other prepared foods does not make algae grazing
      its principal ecological role. Offer portions that fish can take without leaving persistent waste, and
      check that quieter individuals actually feed. No special protein-associated bloat sensitivity was
      established for nominal johnstoni, although inappropriate feeding and poor water quality can still cause
      problems."

  sexing:
    text: "Adult size is useful when judging sex, because males become much larger and usually develop longer dorsal and anal extensions. Males commonly show stronger blue markings and may develop a forehead swelling. Females are generally greyer or greener and less elongated, although appearance varies with population and reproductive condition. Juveniles are much harder to judge reliably, and a dark side stripe does not identify a sex. Avoid presenting an early guess as a guaranteed pair. Courtship and repeated successful spawning provide stronger practical confirmation than colour or fin shape considered on their own."

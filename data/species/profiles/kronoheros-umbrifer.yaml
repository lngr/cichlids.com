  khDkh:
    value:
      min: 1
      max: 4
    confidence: low
    rationale: "unanimous decision {\"min\":1,\"max\":4} from proposals: generator {\"min\":2,\"max\":3}; checker-a {\"min\":0.2,\"max\":3.6}; checker-b {\"min\":0.5,\"max\":4}; checker-c {\"min\":0.5,\"max\":4}. All four natural KH proposals agree within the tally threshold, and rounded agreeing bounds give 1 to 4 dKH. This plain natural feature carries no verification object. Anchique E4 bicarbonate values imply about 2.07 to 2.21 dKH if the unstated unit is mg/L HCO3; treating them as CaCO3 would instead give about 2.52 to 2.70. Grande de Bete and the middle Atrato compilation give about 0.54 to 3.59 dKH. The wider regional source coverage includes 0.2 to 3.6 dKH in the Atrato compilation and 0.3 to 1.4 at Paredes, all retained in evidence. Regional occupancy, alkalinity speciation and the Anchique unit ambiguity prevent higher confidence. Alkalinity expressed as CaCO3 is used as a KH proxy, not a GH measurement."

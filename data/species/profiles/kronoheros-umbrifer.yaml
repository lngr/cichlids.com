  socialBehavior:
    text: "A compatible male and female may form a pair and cooperate in territorial defence, but their relationship can break down. Watch whether both fish feed freely and can move through the aquarium. Persistent hiding, torn fins or a fish pinned at the surface require separation rather than waiting for a hierarchy to settle. Raising juveniles together can help find a pair, but surplus fish need separate accommodation. A single adult is a reasonable alternative to breeding. Adults can claim most of the aquarium, and spawning increases the danger to any other resident."

    tolerance:
      value:
        min: 1
        max: 13
      confidence: low
      rationale: "median decision {\"min\":1,\"max\":13} from proposals: generator {\"min\":2,\"max\":15}; checker-a {\"min\":0.2,\"max\":10}; checker-b {\"min\":0.5,\"max\":15}; checker-c {\"min\":0.5,\"max\":8}; tiebreaker-1 {\"min\":0.5,\"max\":15}; tiebreaker-2 {\"min\":0.5,\"max\":8}. No four-vote cluster settles the interval. The medians of all six proposed minima and maxima are rounded to integers, giving 1 to 13 dKH; the unrounded upper median is 12.5. This contains the decided natural 1 to 4 dKH. The Fish Farmer's Daughter actually publishes KH 5 to 15 for farm-bred stock, a wider upper recommendation than the selected range, but its unit is not expanded and no multi-year endpoint study is supplied. The 8 and 10 dKH alternatives are keeper-model inferences rather than independently published numeric tolerances. Regional field alkalinity can be below 1 dKH and Stalsberg reports 6 dKH at probable Nicanor; neither establishes captive extremes. Only one numerical species-specific breeder source was found, so confidence remains low."

  diet:
    text: "Fish are the main natural prey, with crustaceans providing additional food. In captivity a suitable large-carnivore pellet can form the staple, supplemented with appropriately sized thawed aquatic foods and occasional earthworms. A rapid feeding response is not a reason to keep adding food. Offer measured portions and remove uneaten pieces before they burden the filter. Routine feeder fish are unnecessary and can introduce pathogens. The species is not assigned the special high-protein bloat flag used for herbivorous cichlids, but poor food quality and overfeeding can still cause health problems. Appetite alone does not demonstrate a balanced diet."

  husbandry:
    text: "Provide a 1200 litre aquarium with a footprint of at least 240 by 80 cm for the recommended managed adult pair, with a secure divider and a refuge for the smaller fish. These dimensions are an inferred planning minimum and cannot guarantee safety. Preserve open swimming space and anchor heavy wood and rocks against digging. Strong biological filtration, good oxygen exchange and water changes must match the large waste load. Routine temperatures near 25 to 28 C have better husbandry support than either end of the decided 20 to 30 C tolerance. The remaining working tolerances are pH 6 to 8, GH 1 to 18 dGH and KH 1 to 13 dKH, with weak numerical endpoint evidence especially for hardness. Keep replacement water stable rather than aiming at those limits."

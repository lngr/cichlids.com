  temperatureC:
    value:
      min: 25
      max: 30
    confidence: low
    rationale: "median decision {\"min\":25,\"max\":30} from proposals: generator {\"min\":30,\"max\":30}; checker-a {\"min\":25,\"max\":32}; checker-b {\"min\":25,\"max\":30}; checker-c {\"min\":25,\"max\":27}; tiebreaker-1 {\"min\":21,\"max\":30}; tiebreaker-2 {\"min\":25,\"max\":30}. The median of all six minima and maxima gives 25 to 30 C, with low confidence because the regional measurements do not establish a complete capture-linked thermal envelope. Anchique E4 was 30 C in both campaigns, and the species was recorded only at E4, including the low-rainfall sample. Atrato regional means of 25.6 to 26.6 C and rainy-season Tuira corridor means of 27.9 to 29.4 C support the central interval. Wider source coverage remains in evidence: Guarino seasonal means are 21.30 to 24.87 C, Paredes surface measurements 29.3 to 33.3 C, and Magdalena-system swamp averages 30.3 to 32.0 C. The cooler tributary and hotter floodplain results are regional context without proven species occupancy at those endpoints. FishBase 19 to 28 C derives from an aquarium reference and does not set this natural range. No exceptional mineral habitat is used."

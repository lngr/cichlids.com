  problems:
    text: "The common failures are inadequate adult space, uncontrolled aggression and maintenance that falls behind the waste load. A juvenile community can fail abruptly when the umbee matures, so arrange spare housing before injuries occur. Damaged fish are more vulnerable to secondary infection, while poor water quality can produce distress that is easily mistaken for a feeding problem. Live feeders add avoidable pathogen exposure. Quarantine newcomers, test water when behaviour changes and seek qualified help for persistent illness rather than guessing at medication. Secure equipment and use care during maintenance near a defending pair, since large fish can strike hands and tools."

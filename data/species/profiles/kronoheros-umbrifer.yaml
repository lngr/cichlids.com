      confidence: medium
      rationale: "qualified-majority decision {\"min\":6,\"max\":8} from proposals: generator {\"min\":6.5,\"max\":8}; checker-a {\"min\":6,\"max\":8}; checker-b {\"min\":6,\"max\":8}; checker-c {\"min\":6,\"max\":8}; tiebreaker-1 {\"min\":6,\"max\":8.1}; tiebreaker-2 {\"min\":6,\"max\":8}. Five votes agree within 0.3 pH, giving a rounded median of 6 to 8. NCS explicitly recommends 6 to 8; the breeder and dealers generally give 6.5 to 8, and FishBase gives 7 to 7.9 from aquarium literature. The chosen range contains natural pH 6.1 to 7.9. Wider evidence remains: a forum recommendation reaches 8.1, and Guarino field seasonal means reach 8.11, although field observations do not demonstrate multi-year aquarium health at those values. Agreement is broad enough for medium confidence but the endpoints are recommendations rather than experimental thresholds."

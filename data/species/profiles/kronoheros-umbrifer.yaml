  breeding:
    text: "The pair deposits eggs on an exposed surface, often a flat rock, after preparing a site. Females remain close to the eggs and larvae while males defend a wider area. Large females can produce thousands of eggs, so prepare space for the resulting juveniles before encouraging reproduction. Parents may transfer newly hatched larvae into a pit. A female refuge and a divider remain important even after successful spawning, because aggression within the pair can change quickly. Newly swimming fry can take small appropriate foods, but feeding them heavily requires close attention to water quality."

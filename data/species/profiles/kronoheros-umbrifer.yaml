      confidence: low
      rationale: "median decision {\"min\":20,\"max\":30} from proposals: generator {\"min\":23,\"max\":30}; checker-a {\"min\":22,\"max\":32}; checker-b {\"min\":20,\"max\":30}; checker-c {\"min\":19,\"max\":28}; tiebreaker-1 {\"min\":19,\"max\":30}; tiebreaker-2 {\"min\":19,\"max\":30}. No four-vote cluster settles the interval. The medians of the six proposed minima and maxima, rounded to integers, give 20 to 30 C and already contain the decided natural range. The wider husbandry source interval of 19 to 28 C from NCS and FishBase is retained, including its cooler endpoint below this decision; Tropical Aquarium gives 25 to 30 C and Cichlidamerique combines cooler maintenance with warm spawning conditions. Most routine recommendations center near 25 to 28 C. The checker-a proposal extending to 32 C follows warmer regional water, not a demonstrated long-term captive health series. Both endpoints of the selected range remain uncertain, so confidence is low."

    tolerance:
      value:
        min: 1
        max: 18
      confidence: low
      rationale: "median decision {\"min\":1,\"max\":18} from proposals: generator {\"min\":0.3,\"max\":20}; checker-a {\"min\":0.5,\"max\":15}; checker-b {\"min\":0.5,\"max\":15}; checker-c {\"min\":0.5,\"max\":20}; tiebreaker-1 {\"min\":0.5,\"max\":14}; tiebreaker-2 {\"min\":0.3,\"max\":20}. No four-vote cluster settles the interval. The medians of all proposed minima and maxima are rounded to integers, giving 1 to 18 dGH, which contains the natural tally interval of 1 to 5. The unrounded median upper bound is 17.5. Wider source ranges remain visible: Komnino gives 5 to 20 degrees total hardness, and the retailers give hardness 9 to 20 without expanded units. Nittanwith recommends 5 to 15 dH and Tropical Aquarium 6 to 14 dH. Field estimates below 1 dGH are retained but are not controlled aquarium trials. The 18 dGH endpoint is a vote-derived compromise rather than a measured lifelong health boundary; confidence is low."

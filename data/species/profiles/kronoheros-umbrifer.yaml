  sizeAndGrowth:
    text: "Plan around a male approaching 60 cm total length and a female around 40 cm, with variation between individuals and lines. The often-cited scientific maximum of 47.5 cm is standard length, which excludes the tail and should not be compared directly with aquarium total lengths. Juveniles can grow into imposing fish and may outgrow a temporary aquarium well before their owner expects. Secure the adult installation before buying them. Claims of metre-long aquarium fish in old discussions are not a sound basis for planning, but smaller supplier estimates should not justify cramped permanent housing either."

  coloration:
    value:
      baseColors:
        - blue
        - brown
        - green
      pattern: spots
    confidence: medium
    rationale: "Generator and checker-b proposed blue/brown/green with spots; checker-a brown/blue with spots; checker-c blue/brown/grey with spots. Blue spotting and a brown or copper ground have the best common support, while green or turquoise tones vary with locality. Retain green from the two matching proposals and the population descriptions, rather than treating grey female coloration as the typical male. NCS reports unspotted Panamanian forms, so this pattern describes commonly traded adult males, not every locality."

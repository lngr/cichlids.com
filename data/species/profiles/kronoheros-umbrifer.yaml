variants:
  - name: Common Blue Umbee
    kind: locality
    note: Magdalena basin aquarium stocks; blue spotting. Trade provenance should be checked.
  - name: Panama Green Umbee
    kind: locality
    note: Panamanian river populations; differs from the commonly traded Colombian blue fish.
  - name: Rio Sansonsito
    kind: locality
    note: Panamanian locality line offered by Imperial Tropicals.
  - name: Gorillus Black
    kind: locality
    note: Trade line associated by NCS with Rio Playas and San Rafael; precise provenance needs confirmation.
  - name: Gorillus Blue
    kind: color-morph
    note: Trade label within the dark Colombian group; collection locality unresolved.
  - name: Location X
    kind: locality
    note: NCS associates this old trade label with Guatape; identification is not independently confirmed.
  - name: Location Z
    kind: locality
    note: Old locality code with unresolved origin; do not treat it as a distinct species.

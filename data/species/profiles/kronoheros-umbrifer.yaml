  ghDgh:
    value:
      min: 1
      max: 5
    confidence: low
    rationale: "qualified-majority decision {\"min\":1,\"max\":5} from proposals: generator {\"min\":0.3,\"max\":0.4}; checker-a {\"min\":0.5,\"max\":4.5}; checker-b {\"min\":0.5,\"max\":2.5}; checker-c {\"min\":0.5,\"max\":3}; tiebreaker-1 {\"min\":0.5,\"max\":5}; tiebreaker-2 {\"min\":0.3,\"max\":6}. The five-vote cluster settles at 1 to 5 dGH after integer rounding of agreeing bounds, rather than combining every regional extreme. Grande de Bete measured 10 to 40 mg/L total hardness as CaCO3, or 0.56 to 2.24 dGH; Guarino seasonal means of 26.67 to 85 mg/L give 1.49 to 4.76 dGH, and the Chucunaque sample gives 4.92 dGH. The wider source coverage extends from the unusually soft Anchique E4 estimate of 0.34 to 0.36 dGH to Stalsberg's 6 dH at probable Nicanor. Paredes reports 0.5 to 4.5 dGH. Retain those values even outside the decision: rounding 0.5 upward does not prove that softer water is harmful. Anchique table units and extraction remain uncertain, and several sites are regional proxies, so confidence is low. GH is converted from calcium-carbonate-equivalent total hardness, never from conductivity or alkalinity."

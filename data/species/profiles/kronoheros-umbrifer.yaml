  habitat:
    text: "The native range spans four principal river systems in Colombia and eastern Panama. Open channels and structured margins provide hunting space and shelter. The selected natural interval is 25 to 30 C, pH 6.1 to 7.9, GH 1 to 5 dGH and KH 1 to 4 dKH. These are uncertain summaries combining an Anchique occurrence station with regional Atrato, Magdalena and Panamanian measurements. Regional studies also include cooler tributaries, warmer shallow floodplains and more acidic wetlands without confirming this species at every endpoint. Dry-season saline corridor measurements are not freshwater husbandry targets. The very low Anchique hardness and bicarbonate conversions retain table-unit caveats; wider values stay visible in the evidence."

  minTank:
    value:
      volumeL: 1200
      lengthCm: 240
      depthCm: 80
    confidence: low
    rationale: "Proposals were generator 1500 L/250 by 80 cm, checker-a 800 L/240 by 60 cm, checker-b 1200 L/240 by 80 cm and checker-c 1200 L/240 by 90 cm. Component medians give 1200 L with a 240 by 80 cm footprint for one compatible adult pair managed with a divider and female refuge. The 1200 L NCS headline supports the volume, although its body text gives 700 L; other sources give roughly 570 to 950 L, often for one fish. The footprint is a husbandry inference for a male near 60 cm and two defendable areas, rather than a published species-wide threshold. Exceptional mixed-display recommendations near 1900 to 2271 L concern a different social unit. A larger proposal alone does not justify 1500 L as the minimum, and no volume guarantees pair safety."

    confidence: low
    rationale: "qualified-majority decision {\"min\":6.1,\"max\":7.9} from proposals: generator {\"min\":7.2,\"max\":7.6}; checker-a {\"min\":6,\"max\":7.6}; checker-b {\"min\":6.1,\"max\":7.9}; checker-c {\"min\":6.1,\"max\":7.6}; tiebreaker-1 {\"min\":6.1,\"max\":8.1}; tiebreaker-2 {\"min\":6.1,\"max\":7.9}. Five of six votes fall within the tally agreement threshold; the rounded median of that cluster is 6.1 to 7.9. Grande de Bete measurements of 6.16 to 6.82 and Anchique E4 measurements of 7.26 to 7.56 support mildly acidic to mildly alkaline native freshwater, while a Chucunaque regional sample gives 7.9. Retain the wider source ranges of 5.6 to 7.6 in the Atrato compilation, 5.4 to 6.5 at La Honda, 5.0 to 6.7 in mining-affected Atrato samples, and 6.71 to 8.11 for Guarino seasonal means. These studies do not tie every endpoint to an identified umbee, so the selected typical range is narrower than all regional observations and confidence remains low. Aquarium sheets are not used as field measurements."

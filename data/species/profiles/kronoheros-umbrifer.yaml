partners:
  suitable: []
  unsuitable:
    - species: Paracheirodon innesi
      reason: Adult size is far below the swallowing threshold of a large fish predator.
    - species: Pterophyllum scalare
      reason: Delicate body and trailing fins offer poor defence against severe adult aggression.
    - species: Astronotus ocellatus
      reason: Large size does not make an oscar safe from a dominant umbee; the forum account specifically warns against this pairing.
    - species: Vieja maculicauda
      reason: "The conservative stocking decision excludes routine heterospecific companions; severe aggression is compounded by a weak named-pair hybrid warning, recorded as presumed rather than demonstrated."
profile:
  overview:
    text: "An umbee is a long-term commitment to a very large predatory cichlid. A mature male combines a powerful body with reflective blue markings, while a female remains substantially smaller. The valid name is Kronoheros umbrifer, although several older combinations remain common on shop labels. Its native range includes eastern Panama and western and central Colombia. This is an engaging display fish for an experienced keeper who can provide a dedicated aquarium, substantial filtration and a workable separation plan. A quiet juvenile gives little indication of the space and management an adult will demand."
    sources:
      - kind: catalog-of-fishes
        title: "Eschmeyer's Catalog of Fishes: Kronoheros"
        url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Kronoheros"
        archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-29c27396/2026-10-14T173053Z

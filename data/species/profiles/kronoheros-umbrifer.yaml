  compatibility:
    text: "The recommended adult aquarium is dedicated to this species, holding one fish or a carefully managed pair. Small companions face predation, and even robust large fish can suffer lethal attacks. Sources describing mixed displays refer to exceptional space and often a single nonbreeding adult, so no routinely suitable heterospecific partner is listed. A separate presumed hybrid caution pairs this species with Vieja maculicauda. It rests on one named-pair warning from Cichlidamerique, without a verified brood or parentage record, and has low confidence. Silence in other care sheets does not establish reproductive isolation."

    rationale: "The Catalog and FishBase anchor the species near Cape Zongwe. Tanganyika.si describes the Longola
      to Kanoni shore, while the NCS register includes Kiku and Tembwe Deux. Kamakonde is the type locality of
      the synonym helianthus, so the accepted species includes that yellow-orange population as well. These
      locality names identify reported populations rather than an unbroken surveyed range."

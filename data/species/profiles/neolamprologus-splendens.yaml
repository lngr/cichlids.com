    tolerance:
      value:
        min: 23
        max: 29
      confidence: medium
      rationale: "The tally decides 23 to 29 C by unanimous agreement within its one-degree matching rule.
        Generator, checker-a and checker-c propose 23 to 29 C; checker-b proposes 22 to 30 C. The latter is a
        wider inference without a measured long-term endpoint. Seriously Fish gives 23 to 27 C under the
        synonym helianthus, NCS gives 24 to 27.5 C, and Fishipedia gives 23 to 28 C. The decision includes the
        whole natural interval but does not claim failure beyond it; the equality with the natural interval
        follows containment of these interior husbandry recommendations."
      sources:

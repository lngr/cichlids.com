  minTank:
    value:
      volumeL: 150
      lengthCm: 100
      depthCm: 40
    confidence: medium
    rationale: "Generator and checker-c propose 150 L, 100 cm length and 40 cm depth; checker-b 150 L, 100 cm and
      35 cm; checker-a 100 L, 80 cm and 35 cm. The component medians are 150 L, 100 cm and 37.5 cm. NCS
      explicitly recommends 150 L and 100 cm, which anchors the pair minimum; depth is rounded to a practical
      40 cm to fit separate caves and stable rockwork, not presented as a measured threshold. Tanganyika.si
      gives 100 L, Seriously Fish gives 70 L and a 75 by 30 cm footprint for helianthus, and Fishipedia
      recommends the wider 200 to 300 L pair or small-harem setup. The 150 L value follows the specialist
      association and lies within the source recommendations; community stocking needs more space."

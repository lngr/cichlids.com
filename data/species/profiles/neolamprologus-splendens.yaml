  sexing:
    text: "Adult males tend to be somewhat larger, while colour alone does not reliably separate the sexes. NCS
      describes examination of the genital openings as more dependable for mature fish. Size differences in
      juveniles are insufficient to identify a compatible pair. Observe social behaviour carefully when fish
      mature and retain a way to separate incompatible adults."
    sources:

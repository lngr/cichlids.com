  husbandry:
    text: "For one compatible pair, use at least 150 litres with about 100 cm length and 40 cm depth. Secure the
      rocks on a stable base and provide several caves with interrupted sightlines before adding fine sand.
      Maintain effective filtration and steady alkaline water; temperature near 25 to 27 C lies within several
      care recommendations. Community tanks and expanding families require additional space beyond this pair
      minimum."

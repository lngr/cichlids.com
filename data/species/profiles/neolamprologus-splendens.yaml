  socialBehavior:
    text: "Adults defend cave-centred patches and can chase conspecifics persistently. A pair is the recommended
      minimum unit, although each partner needs access to shelter and some locality accounts also permit a
      small harem. Published accounts differ markedly in aggression and bond strength. A fish excluded from
      food or held in a corner needs intervention and a separate refuge or accommodation."

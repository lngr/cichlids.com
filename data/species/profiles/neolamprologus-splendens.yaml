    rationale: "Generator and checker-c propose a six-year point; checker-a and checker-b propose 5 to 8 years
      from group knowledge. Their component medians are 5.5 to 7 years. Fishipedia reports six years,
      Aqua-Fish gives 5 to 8 years under the synonym helianthus, and Abysse gives ten years without a
      long-term record. The explicit 5 to 8 year care estimate contains the six-year figure and avoids
      implying half-year precision from the proposal median. The retailer maximum does not establish typical
      longevity, and the evidence remains weak."

  problems:
    text: "Persistent chasing and loss of access to caves or food are the main warning signs of an unsuitable
      social arrangement. Excavation can destabilize poorly supported rocks, and accumulated food in crevices
      can impair water quality. Sudden changes in temperature or mineral chemistry add stress. General forum
      recommendations sometimes confuse this fish with shell dwellers; its well-supported habitat and breeding
      requirements centre on rock caves."

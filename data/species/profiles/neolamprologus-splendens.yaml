  coloration:
    value:
      baseColors:
        - brown
        - black
        - yellow
        - orange
      pattern: mixed
    confidence: medium
    rationale: "Generator proposes yellow and black with a mixed pattern; checker-a brown and black with plain
      coloration; checker-b black with bars; checker-c silver, grey and black with a mixed pattern. These
      describe different populations and interpretations. Tanganyika.si describes dark violet-to-black
      locality fish and juvenile body bars that fade with age, while Seriously Fish describes yellow-orange
      helianthus with a dark V-shaped cheek marking. The Catalog synonymy includes that form within splendens,
      so the feature represents dark and yellow-orange adults with a mixed pattern. The facial mark prevents a
      wholly plain classification; persistent adult body bars and a uniformly silvery species are less well
      supported."

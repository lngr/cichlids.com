partners:
  suitable:
    - species: Cyprichromis leptosoma
      reason: Uses open water above the rock territories; keep only in a long aquarium with a proper shoal.
      condition: "A substantially larger community aquarium than the 150 L pair minimum, with separate territories
        and the partner species social requirements met."
    - species: Julidochromis ornatus
      reason: "A smaller rock species can use a separate section of a large, divided rocky layout."
      condition: "A substantially larger community aquarium than the 150 L pair minimum, with separate territories
        and the partner species social requirements met."
    - species: Altolamprologus calvus
      reason: "A robust, unrelated rock-dweller may occupy a distinct cave zone in a spacious Tanganyika aquarium."
      condition: "A substantially larger community aquarium than the 150 L pair minimum, with separate territories
        and the partner species social requirements met."
  unsuitable:
    - species: Neolamprologus brichardi
      reason: Member of the presumed Brichardi-complex hybrid group; similar cave territories also overlap.
    - species: Neolamprologus pulcher
      reason: "Member of the same presumed hybrid group, with a risk of unwanted crossing."
    - species: Neolamprologus savoryi
      reason: Member of the same presumed hybrid group and a close relative with overlapping breeding niches.
profile:
  overview:
    text: "A small cave-breeding lamprologine from the Congolese shore of Lake Tanganyika, Neolamprologus
      splendens includes populations traded under helianthus in the Catalog of Fishes treatment. Dark locality
      fish and yellow-orange forms can therefore appear under the same accepted name. A branching rock layout
      and a compatible adult pair are central to its care."
    sources:
      - kind: database
        title: "FishBase: Neolamprologus splendens summary"

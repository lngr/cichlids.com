    value:
      min: 10
      max: 13
    confidence: high
    rationale: "The decided natural interval is 10 to 13 dGH. Plisnier reports surface calcium of 10.9 to 11.6
      mg/L and magnesium of 41.2 to 43.2 mg/L; the station-paired concentrations yield about 11.1 to 11.5 dGH
      using Ca/7.14 + Mg/4.34. The FAO compilation after Talling and Talling and the wider lake chemistry
      synthesis support the rounded lake interval. FishBase gives a wider environment range of 10 to 25 dH,
      which is retained but does not determine natural lake hardness."

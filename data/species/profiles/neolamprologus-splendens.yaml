  sizeAndGrowth:
    text: "The planning maxima are approximately 8.5 cm for males and 7.5 cm for females. Specialist accounts
      describe aquarium adults around 8 to 9 cm, but separate female maxima are poorly documented. Wild fish
      can be smaller. An estimated lifespan of 5 to 8 years has low confidence; published care pages give
      differing ages without individual long-term records."

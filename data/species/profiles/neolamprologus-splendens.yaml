  diet:
    text: "Offer foods suited to a small invertebrate feeder, including suitable pellets and small frozen or live
      crustaceans. NCS describes zooplankton as natural food, and experimental feeding work records Daphnia
      capture under helianthus. Fish eating is not established beyond the incidental fry capture allowed by
      predation level 0. Algae-based feeding advice on one general care page conflicts with the specialist
      accounts; no species-specific bloat tendency is documented."

    confidence: high
    rationale: "The decided natural range is 23 to 29 C for Lake Tanganyika. Verburg et al. report hourly Mpulungu
      buoy temperatures of 23.85 to 29.01 C; the lake synthesis represents seasonal variation with integer
      bounds. Plisnier and Langenberg describe the seasonal mixing context. FishBase gives the narrower
      species environment interval of 24 to 28 C, which does not replace the lake measurements."

  compatibility:
    text: "A dedicated pair aquarium simplifies territorial management. In a substantially larger tank, unrelated
      Tanganyika fish using other areas can be possible companions; Cyprichromis need open swimming room and
      their own adequate group. Julidochromis and Altolamprologus require separate cave areas and careful
      observation. Members of the presumed brichardi-complex hybrid group present an additional crossing risk
      based on specialist warnings and close relationship, rather than a verified cross for every named pair."

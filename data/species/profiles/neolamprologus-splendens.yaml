  habitat:
    text: "Reported localities include the Cape Zongwe area, Kanoni and Kiku, with Kamakonde represented by the
      synonym helianthus. Specialist locality observations place darker fish among shallow rocks at about 2 to
      9 m. Crevices provide shelter and spawning sites; fine sand around secure rocks permits excavation. The
      natural water intervals summarize lake measurements across seasons and sites, with magnesium-rich
      hardness and substantial carbonate alkalinity."

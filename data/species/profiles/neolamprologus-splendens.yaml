  breeding:
    text: "Eggs are deposited inside a cave or sheltered rock crevice. Husbandry accounts describe the female
      tending the clutch and the male defending nearby space, with earlier broods sometimes tolerated around
      the parents. Accounts of dark locality fish emphasize smaller broods and looser pair associations than
      the familiar large princess-cichlid colonies. Provide separate shelters and enough room for growing
      offspring, rather than assuming every group forms a stable colony."

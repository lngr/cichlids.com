    tolerance:
      value:
        min: 10
        max: 22
      confidence: low
      rationale: "The tally uses the median method and decides 10 to 22 dKH with low confidence. All six proposals
        are retained: generator 12 to 25, checker-a 8 to 20, checker-b 12 to 24, checker-c 10 to 25,
        tiebreaker-1 8 to 20, and tiebreaker-2 10 to 20. The median minima are 10 and the median maxima are
        22, already containing natural KH 15 to 20. Monitarium recommends 10 to 20, Abysse gives a single
        target of 10, Practical Fishkeeping gives 8 to 18 for Tanganyikans, and AquaInfo gives 10 to 15 for
        that group. The adopted interval is narrower than the wider inferred proposals of 12 to 25, 12 to 24
        and 10 to 25; those upper extensions have no direct long-term trial behind them. Conversely, 22
        exceeds the explicit numerical recommendations and is retained solely as the required low-confidence
        synthesis of the votes. Seachem explains independent adjustment of KH and GH but establishes no
        tolerance endpoint. Evidence entries based on pH or GH are labelled as context, not measurements in
        dKH."

    tolerance:
      value:
        min: 8
        max: 25
      confidence: medium
      rationale: "The tally decides 8 to 25 dGH by qualified majority, five of six votes. Generator, checker-a,
        tiebreaker-1 and tiebreaker-2 propose 8 to 25; checker-c proposes 10 to 25, within the two-degree
        matching rule; checker-b proposes 9 to 19. Seriously Fish gives 8 to 25 dGH for the synonym
        helianthus, making it more directly applicable than the 9 to 19 dGH brichardi proxy. Aqua-Fish gives
        the wider 7 to 25 dGH recommendation; its 7 dGH endpoint has weaker support than the specialist
        recommendation. Monitarium and Practical Fishkeeping give 10 to 20, and AquaInfo 12 to 20; these are
        preferred care intervals rather than demonstrated harm limits. The natural 10 to 13 dGH interval is
        contained. No read source establishes controlled long-term endpoints."

  khDkh:
    value:
      min: 15
      max: 20
    confidence: high
    rationale: "The decided natural interval is 15 to 20 dKH. Plisnier reports bicarbonate-dominated alkalinity
      with 5.6 to 6.2 meq/L bicarbonate and station-dependent carbonate. The FAO compilation gives total
      alkalinity of 6.71 meq/L, about 18.8 dKH, and Langenberg cites 6.7 to 6.9 meq/L, about 18.8 to 19.3 dKH.
      Conversion uses dKH = meq/L times 2.8. The lake synthesis includes the lower station values and keeps
      carbonate buffering distinct from calcium and magnesium hardness."

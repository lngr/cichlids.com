        \ and rounds their median endpoints to 24 to 30 C. Seriously Fish gives 24 to 30 C, Fishkeeper and Zoopet\
        \ 25 to 30 C, and Aqua-Fish 24 to 28 C. Traas reports adult maintenance and breeding around 28 to 29 C.\
        \ The generator extension to 31 C and checker-c extension to 30.2 C use habitat observations; checker-a\
        \ includes 23 C from a regional reading. Those extensions are not multi-year adult outcome studies. The\
        \ decided upper bound is narrower than the Tenosique 28.3 to 30.2 C field interval, and the rounded natural\
        \ value fits it. The 2025 embryo study at 27.3 to 29.1 C is short early-development evidence. Confidence\
        \ remains low at the long-term endpoints. generator proposed 24 to 31; checker-a proposed 23 to 30; checker-b\

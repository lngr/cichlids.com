  sizeAndGrowth:
    text: "Use approximately 42.5 cm for a large adult male and 35 cm for a female when planning space. These sex-specific\
      \ care estimates are stronger than interpolation from unsexed fishery catches, but sources disagree about\
      \ both size and length convention. Some husbandry pages report unsexed ceilings around 45 cm; FishBase gives\
      \ 20 cm standard length, which should not cap aquarium planning. Growth depends on condition, food and housing,\
      \ and no reliable sex-specific aquarium growth distribution was found. Evaluate a juvenile against its eventual\
      \ body size and provide room for normal movement and partner avoidance throughout development."

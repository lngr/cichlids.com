  temperatureC:
    value:
      min: 26
      max: 30
    confidence: medium
    rationale: "The tally selects 26 to 30 C by qualified majority, using whole-degree medians of the four agreeing\
      \ lowland proposals. Tenosique site means span 28.3 to 30.2 C; a Bitzal juvenile was captured at 30 C and\
      \ Bleher recorded 29.2 C at occupied Lacanja. The 30.2 C measurement remains in evidence even though the encoded\
      \ maximum rounds to 30. The wider source envelopes are 26 to 35 C for Centla lagoons, 20.8 to 29.8 C for the\
      \ carbon survey, 23.6 to 29.6 C for Lacantun site means, and 22.96 to 33.88 C for the lower river survey.\
      \ Those endpoints lack paired pearsei occurrence. The 26 C lower endpoint has only regional proxy and compiled\
      \ support; FishBase cites aquarium literature and is not an independent field series. This range represents\
      \ selected lowland conditions rather than the full seasonal distribution. generator proposed 26 to 30.2; checker-a\
      \ proposed 23 to 30; checker-b proposed 26 to 30; checker-c proposed 26 to 30.2; tiebreaker-1 proposed 23\
      \ to 30.2; tiebreaker-2 proposed 26 to 30.2."

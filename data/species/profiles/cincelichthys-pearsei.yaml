partners:
  suitable:
  - species: Large armoured catfish
    reason: Fishkeeper and Seriously Fish allow appropriately sized robust catfish; their feeding must not force
      a meat-heavy ration on pearsei.
    condition: "More floor space and volume than the 900 L pair minimum, safe refuges and independent observation\
      \ of both species at meals."
  - species: Oscura heterospila
    reason: Specialist regional advice includes pearsei among relatively mild companion candidates. Dietary compatibility
      still needs assessment because the species consumes substantial animal food.
    condition: A substantially larger aquarium with separated feeding and retreat areas; suitability depends on
      individual temperament and ration management.
  unsuitable:
  - species: Cincelichthys bocourti
    reason: Shares the presumed crossing group retained by the tally; the named published warning supports caution
      even though parentage and free mate choice remain unverified.
  - species: Parachromis managuensis
    reason: A forceful predatory cichlid is a poor default companion for a relatively mild plant-feeding pair and
      conflicts with the conservatively flagged dietary risk.
  - species: Parachromis dovii
    reason: Large predatory fish present territorial and feeding conflicts with plant-focused pearsei care.
  - species: Small community fish
    reason: Small fish can be displaced or injured by a large territorial pair. Predation level 0 does not make
      them suitable companions; routine fish hunting is not the claimed mechanism.
  - species: "Fast, aggressive feeders"
    reason: "They may monopolize meals before this deliberate grazer receives its share, especially when their staple\
      \ food is rich in animal protein."
profile:
  overview:
    text: "Pearse's cichlid is a substantial plant-feeding fish from southeastern Mexico and northern Guatemala.\
      \ Cincelichthys pearsei is its accepted name; Cichlasoma, Herichthys, Vieja and Theraps remain common in older\
      \ references. Its rounded body, small mouth and dark lower-body colouring distinguish it from many large Central\
      \ American cichlids. Everyday behaviour can be restrained, but a pair still needs room to defend and retreat.\
      \ Adult size and waste production determine the commitment: arrange the final aquarium before acquiring young\
      \ fish and expect roughly a decade or more of care, with the longevity estimate uncertain."
    sources:
    - kind: catalog-of-fishes
      title: "Eschmeyer's Catalog of Fishes: species of Cincelichthys"
      url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Cincelichthys"
      accessed: "2026-10-13"

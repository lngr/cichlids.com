  breeding:
    text: "The pair deposits eggs on a prepared substrate, an exposed firm surface or a cleared depression, and\
      \ both parents protect the offspring. Sheltered sites are possible, although open-substrate spawning is the\
      \ best-supported category. Brood defense enlarges the area unavailable to companions. Published hatching times\
      \ vary: the 2025 early-development study observed hatching after about two days in warm controlled conditions,\
      \ while hobby accounts give longer schedules. Judge the actual brood rather than a fixed timetable. Prepare\
      \ suitably fine food, grow-out space and a way to protect displaced adults before encouraging reproduction.\
      \ The pearsei and bocourti crossing risk remains presumed rather than a verified free-choice breeding result."

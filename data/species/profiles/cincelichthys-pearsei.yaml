      \ 7 to 11 dKH, with low confidence and no natural verification object. Tenosique titrated alkalinity of 128\
      \ to 135 mg/L as CaCO3 converts to 7.17 to 7.56 dKH. Centla total alkalinity of 116 to 198 mg/L converts to\
      \ the wider 6.5 to 11.09 dKH regional interval, partly including brackish stations; both rounded endpoints\
      \ are narrower than that source. The carbon study permits only an approximate bicarbonate-equivalent 3.64\
      \ to 11.26 dKH estimate before carbonate speciation, not a direct KH measurement. Its highest DIC gives roughly\
      \ 10.1 to 11.2 dKH across the regional pH range. The 2025 carbon work reuses this dataset and is not independent\
      \ titration evidence. The encoded range is provisional buffering context, not a measured annual pearsei limit.\
      \ generator proposed 6.5 to 11.1; checker-a proposed 4 to 11; checker-b proposed 3 to 12; checker-c proposed\
      \ 7 to 8; tiebreaker-1 proposed 7 to 11.2; tiebreaker-2 proposed 6.5 to 11.1."

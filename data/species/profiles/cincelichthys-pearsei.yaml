  problems:
    text: "Common failures involve inadequate floor space, unstable water quality, monopolized food or an overly\
      \ rich ration. Watch each fish's body condition and access to meals, especially in a mixed aquarium, and investigate\
      \ changes in appetite, breathing or interactions promptly. Digestive swelling is not a diagnosis of the conservatively\
      \ flagged bloat risk: the source discussion is anecdotal, and several causes can produce similar signs. Maintain\
      \ a separate observation space for arrivals and a separation option for conflict. The numeric tolerance endpoints,\
      \ especially KH, remain provisional rather than evidence that repeated abrupt chemistry changes or sustained\
      \ extreme conditions are harmless."

  diet:
    text: "Provide a nutritionally complete plant-focused ration using algae ingredients and appropriate vegetable\
      \ supplements. Pearsei eats algae and larger plant material, so aufwuchs is the closest available nutritional\
      \ category. Its small mouth needs suitably sized food, and the direct care description of deliberate feeding\
      \ supports checking that faster companions leave it enough. The tally conservatively flags bloat sensitivity\
      \ because the independent runs divide evenly. That is a precaution supported mainly by anecdotal digestive\
      \ complaints, with no confirmed species-specific protein-induced syndrome. Avoid making rich animal food the\
      \ staple; occasional supplements described by keepers do not overturn the dominant plant-feeding evidence."

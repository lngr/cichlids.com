  compatibility:
    text: "Mixed stocking is possible with extra floor space, appropriately sized companions and restrained behaviour.\
      \ Large armoured catfish are directly suggested in care accounts; Oscura heterospila is a conditional regional\
      \ candidate whose more animal-rich feeding must be managed separately. Fast competitors, tiny community fish\
      \ and forceful predators are poor defaults. Predation level 0 reflects plant-feeding evidence and allows incidental\
      \ fry intake; territorial injury and displacement can still make a combination unsuitable. Cincelichthys bocourti\
      \ shares a presumed crossing group based on Traas's warning and close relationship, with an additional unverified\
      \ offspring sale claim. The archive search produced a proposed stocking list, without a successful outcome."
    sources:
    - kind: database

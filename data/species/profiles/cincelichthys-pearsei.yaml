  husbandry:
    text: "For one compatible adult pair, provide about 900 litres gross with a floor at least 250 cm long and 60\
      \ cm deep. This combines the longer pair recommendation with a suitable floor width; companions need more\
      \ space. Anchor rocks and wood over a soft substrate so each fish can leave the other's sight without becoming\
      \ trapped. Plant foliage is likely to be eaten. Match filtration and oxygenation to the feeding load, remove\
      \ settled waste and replace water regularly. The encoded aquarium tolerances are 24 to 30 C, pH 7 to 8.6,\
      \ GH 3 to 25 and KH 4 to 12. Endpoint certainty is limited, particularly for KH; stable familiar conditions\
      \ matter more than targeting an extreme."

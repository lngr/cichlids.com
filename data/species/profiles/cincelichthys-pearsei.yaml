  habitat:
    text: "Records cover vegetated river margins, lowland channels and lake shores across the Atlantic slope, including\
      \ the Grijalva and Usumacinta systems and Campeche drainages. A Centla inventory captured a juvenile in Bitzal\
      \ marginal vegetation; surveys and collecting accounts also identify Lachua and Lacanja. The tally encodes\
      \ natural conditions as 26 to 30 C, pH 7.3 to 8.6, GH 7 to 20 and KH 7 to 11. GH and KH are low-confidence\
      \ medians across different regional proxies. Their figures do not reproduce every measured extreme or establish\
      \ preferred aquarium settings, and some regional surveys include salt-influenced stations."

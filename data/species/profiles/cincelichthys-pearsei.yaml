  sexing:
    text: "Mature males usually grow larger and show a steeper forehead, sometimes developing a noticeable frontal\
      \ swelling. Females are generally smaller and less heavily built. Colour changes with origin, condition and\
      \ reproductive state, so a single colour difference is weak evidence of sex. Juveniles and differently aged\
      \ fish are particularly difficult to compare. Use several mature traits together and treat sales labels cautiously.\
      \ An apparent male and female are also not automatically compatible partners; continued feeding access and\
      \ unharassed rest remain more useful husbandry observations than a confident label alone."
    sources:

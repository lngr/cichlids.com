  ghDgh:
    value:
      min: 7
      max: 20
    confidence: low
    rationale: "No four votes agree, so the tally uses the median of all six minima and maxima: 7 to 20 dGH, with\
      \ low confidence. The median lower bound is a compromise rather than a new field measurement. Tenosique hardness\
      \ of 250 to 352 mg/L as CaCO3 converts to 14.01 to 19.72 dGH by division by 17.848. The wider freshwater regional\
      \ envelope is approximately 4.2 to 19.72 dGH when the 74.9 mg/L Centla minimum is included; the encoded 7\
      \ minimum excludes this softer proxy and must not erase it. Centla freshwater rainy-season classes are about\
      \ 75 to 149 mg/L, or 4.2 to 8.35 dGH, with some harder lagoons. The full Centla table reaches 2352 mg/L, about\
      \ 131.8 dGH, in a survey including brackish lagoons; those coastal extremes are not assigned to freshwater\
      \ pearsei. The Grijalva table gives 173 to 295 with an ambiguous per-100-mL heading; conditional mg/L conversion\
      \ is 9.69 to 16.53 dGH and includes a spring. FishBase 3 to 14 is an aquarium-derived compilation. Lachua\
      \ hardness of 1038 to 1181 mg/L lacks a sufficiently clear equivalent basis and is not converted. Conductivity\
      \ and bicarbonate are not substituted for total hardness. generator proposed 4 to 20; checker-a proposed 14\
      \ to 20; checker-b proposed 3 to 15; checker-c proposed 10 to 20; tiebreaker-1 proposed 10 to 20; tiebreaker-2\
      \ proposed 4 to 20."

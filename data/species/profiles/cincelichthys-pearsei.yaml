  socialBehavior:
    text: "A compatible pair is the recommended adult unit. Juveniles can be raised together to allow partner selection,\
      \ with surplus fish rehoused once a pair forms. Monitor whether both partners can eat, rest and move without\
      \ repeated cornering. Conspecific rivalry and defense against other species are rated 2 in adequate space.\
      \ The territory is classed as large and can be defended outside reproduction, with stronger activity around\
      \ a brood. Cover and spare separation capacity help manage individual differences; the generally mild descriptions\
      \ in some keeper accounts do not guarantee that every pairing will remain stable."

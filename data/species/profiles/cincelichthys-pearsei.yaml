  note: "The Catalog of Fishes accepts Cincelichthys pearsei (Hubbs, 1936). The current Cincelichthys and legacy\
    \ Cichlasoma lists were both queried on 2026-10-13; the legacy list contains no pearsei entry. Legacy query:\
    \ https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Cichlasoma.\

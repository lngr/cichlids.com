      replacement partners. Seriously Fish and Maidenhead advise removing surplus adults once a pair
      forms; more than one pair requires substantially more room. FishProfiles describes severe
      rejection of unwanted females. This supports persistent space-sensitive chasing without
      implying that a compatible pair routinely injures each other. The recommended adult unit
      remains one established pair.

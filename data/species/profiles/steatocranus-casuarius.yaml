  predation:
    value: 1
    confidence: low
    rationale: All four full-profile runs propose level 1 and the tally retains unanimous verification
      with low confidence. FishBase's algae-dominated diet argues against habitual piscivory but
      does not exclude fry capture. Seriously Fish permits suitably sized community fishes and
      recommends small animal foods. The forum prediction that shell dwellers will be eaten is not
      an observed feeding event and does not establish level 2. Level 1 is a cautious inference of
      occasional fry and very small fish capture; its 2 cm boundary belongs to the rubric and has
      not been measured for this species.

  sizeAndGrowth:
    text: "A well-kept adult male can reach about 12 cm, while a female commonly remains near 8 cm. The
      published measurements mix total and standard length, so comparisons should allow for
      differences in technique. The larger head and body of a mature male require more space than
      the appearance of juveniles suggests. No dependable age-specific growth schedule was found.
      The numerical lifespan range of 6.5 to 10 years is a median of uncertain planning estimates;
      broader published estimates span 5 to 10 years and do not establish a precise survival limit."

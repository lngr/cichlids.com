  aggressionHeterospecific:
    value: 2
    confidence: medium
    rationale: "All four profiles choose level 2. Seriously Fish and Maidenhead describe local defense
      of caves and young alongside suitable community fishes, corroborated by Aquarium Glaser's
      relatively moderate assessment. Atlarium and parts of the Dietzenbach account make stronger
      warnings about bottom fish; those are retained without applying level 3 to typical suitably
      housed adults. Territorial attacks can still become serious when tankmates cannot leave the
      brood area. Thread 8184 does not identify its aggressive fish reliably and cannot establish
      this species' behavior."

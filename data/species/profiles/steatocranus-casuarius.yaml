    tolerance:
      value:
        min: 24
        max: 29
      confidence: medium
      rationale: "The qualified-majority tally decides 24 to 29 C with five of six agreeing votes and
        medium confidence. Seriously Fish and Maidenhead independently recommend 24 to 28 C. The 29
        C upper extension contains the measured typical natural range; Tropical Freshwater Fish also
        reaches 29 C for breeding, which is not a multi-year maintenance trial. The wider source
        bands of 22 to 28 C from LiveAquaria, 23 to 28 C from Aquatic Community, and Dietzenbach's
        explicitly brief 23 to 30 C exposure remain recorded. The wider field extrema of 20 to 31.7
        C do not establish chronic captive-health limits. Routine care near 24 to 27 C with reliable
        oxygenation has firmer support than continuous maintenance at 29 C. generator proposed
        {\"min\":24,\"max\":29}; checker-a proposed {\"min\":22,\"max\":29}; checker-b proposed
        {\"min\":24,\"max\":29}; checker-c proposed {\"min\":24,\"max\":30}; tiebreaker-1 proposed
        {\"min\":24,\"max\":29}; tiebreaker-2 proposed {\"min\":24,\"max\":29}."

  problems:
    text: "Loss of oxygen supply, unstable rockwork and an incompatible adult pairing are practical
      hazards. Warm water increases the need for dependable gas exchange. A fish that refuses food
      may be newly stressed or unable to reach the bottom rather than simply disliking the menu.
      Excessively fatty meals are associated with intestinal problems in the importer account.
      Changes in breathing, appetite or hiding should prompt checks of water quality and social
      pressure. These signs do not identify a disease by themselves. Stable conditions matter
      especially when buffering is weak, and gradual acclimation is preferable to abrupt chemistry
      changes."

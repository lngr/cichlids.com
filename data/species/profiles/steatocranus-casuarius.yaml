  husbandry:
    text: "Provide one established pair with at least about 98 litres and an 80 by 30 cm base. A
      community needs additional floor area and enough swimming space for its other inhabitants.
      Support stones securely before adding a diggable sand layer, leaving several cavities and
      broken sight lines. Arrange circulation so that moving water and surface exchange coexist with
      sheltered resting spaces. A mature filter and regular waste removal help maintain the
      oxygen-rich conditions the fish needs. Around 24 to 27 C is a useful routine target within the
      decided tolerance. The 29 C endpoint has weaker long-term support. Very low rounded GH or KH
      endpoints describe soft native water and do not require forcing an aquarium to zero minerals
      or buffering."

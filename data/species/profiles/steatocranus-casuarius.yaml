  ghDgh:
    value:
      min: 0
      max: 1
    confidence: medium
    rationale: "The unanimous tally rounds the median of the agreeing proposals to whole degrees and
      decides 0 to 1 dGH. Zero is a rounding endpoint for extremely soft water, not an observation
      of water containing no calcium or magnesium. Deronde and Symoens' paired monthly Ca and Mg
      measurements convert to 0.367 to 0.638 dGH using Ca/7.14 + Mg/4.34. The Borges and Bouillon
      dataset independently gives approximately 0.491 to 0.649 dGH near the Malebo outlet. Moukolo's
      historical paired study means cover the wider 0.49 to 1.33 dGH interval, which is retained;
      those are study means rather than seasonal extrema. Checker-a's conductivity and TDS
      conversions are weaker estimates because neither quantity uniquely determines GH. FishBase's
      much wider 5 to 19 dH summary lacks collecting-site measurements and is retained as
      contrasting husbandry information rather than natural chemistry. Confidence remains medium.
      generator proposed {\"min\":0.3,\"max\":0.7}; checker-a proposed {\"min\":0.5,\"max\":1.5};
      checker-b proposed {\"min\":0.4,\"max\":0.8}; checker-c proposed {\"min\":0.5,\"max\":1.5}."

    tolerance:
      value:
        min: 0
        max: 18
      confidence: low
      rationale: "The qualified-majority tally decides 0 to 18 dGH with four of six agreeing votes and low
        confidence. Whole-degree rounding and containment of natural 0 to 1 dGH explain the zero
        endpoint; no source demonstrates healthy aquarium fish at a precisely mineral-free boundary.
        Seriously Fish recommends 2 to 15 dGH and Maidenhead allows an upper limit of 18. The wider
        5 to 19 dH FishBase summary and 5 to 20 dGH recommendations from FishProfiles and
        Dietzenbach remain evidence, as does Dietzenbach's narrower 5 to 15 prose range. The
        decision follows the tally rather than treating the largest recommendation as a measured
        physiological ceiling. The archive confirms breeding in hard well water without a numeric
        GH; checker-a's 2 to 20 entry is a keeper-range interpretation, not a measurement in that
        post. Native Ca and Mg measurements support the lower extension, but no controlled long-term
        endpoint trial was found. generator proposed {\"min\":0.3,\"max\":18}; checker-a proposed
        {\"min\":0.5,\"max\":15}; checker-b proposed {\"min\":0.4,\"max\":18}; checker-c proposed
        {\"min\":0.5,\"max\":15}; tiebreaker-1 proposed {\"min\":0.3,\"max\":19}; tiebreaker-2
        proposed {\"min\":0.3,\"max\":18}."

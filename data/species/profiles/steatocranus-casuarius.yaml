        deep. Generator proposed 110 L and 90 by 30 cm; checker-a 80 L and 80 by 30 cm; checker-b
        100 L and 80 by 35 cm; checker-c 96 L and 80 by 30 cm. The chosen footprint follows
        FishBase's 80 cm recommendation and lies above Seriously Fish's 75 by 30 cm, approximately
        68 L minimum. Tropical Freshwater Fish recommends 75 to 98 L at about 76 cm, supporting the
        decided volume. Maidenhead prefers about 91 cm, Zierfische Direkt gives 120 L at 80 cm, and
        Dietzenbach gives 160 to 240 L at 100 cm; those larger alternatives remain cited.
        LiveAquaria gives inconsistent 30 and 50 US gallon suggestions in different sections. There
        is no measured threshold at 98 L; the figure summarizes pair recommendations without
        adopting the largest proposal as obligatory. Communities and additional pairs need more
        room."

  diet:
    text: "Treat this species as a grazing omnivore. Plant-containing prepared food can accompany small
      invertebrate foods, with portions delivered where the fish can reach them near the substrate.
      FishBase emphasizes algae in nature, but the husbandry accounts do not establish a necessary
      low-protein diet. The bloatSensitive flag is false because a specific protein-linked
      restriction is unsupported, rather than because intestinal disease is impossible. Aquarium
      Glaser reports serious problems with excessively fatty foods. Variety and moderate portions
      remain appropriate, and the intake of bottom fish should be checked when faster companions
      feed above them."

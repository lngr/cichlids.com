  temperatureC:
    value:
      min: 26
      max: 29
    confidence: low
    rationale: "The tally retains 26 to 29 C with unanimous agreement under the 1 C comparison
      threshold. Kelemen et al. actually measured 26.0 to 29.0 C at Kinshasa across 30 observations,
      making this stronger than an envelope derived from the 27.7 C mean and 1.6 C standard
      deviation in Moukandi N’kaya et al. The latter source reports the wider 20.0 to 31.7 C
      monitoring range; these isolated station extrema remain in evidence rather than defining the
      typical habitat. FAO reports a 27.3 C observation. Borges supplies two local measurements of
      27.3 and 27.8 C. These mainstem observations are proxies for the fish's sheltered rocky
      habitat rather than measurements at occupied caves. Confidence stays low exactly as tallied.
      generator proposed {\"min\":26,\"max\":29}; checker-a proposed {\"min\":25,\"max\":29};
      checker-b proposed {\"min\":26,\"max\":29}; checker-c proposed {\"min\":26,\"max\":30}."

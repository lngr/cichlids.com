    tolerance:
      value:
        min: 0
        max: 10
      confidence: low
      rationale: "The qualified-majority tally decides 0 to 10 dKH with five of six agreeing votes and low
        confidence. The zero endpoint follows rounding and containment of the decided natural range,
        rather than a measured mineral-free aquarium threshold. Zierfische Direkt recommends 2 to 10
        and Dietzenbach and LiveAquaria give 3 to 10 dKH; these dealer recommendations carry limited
        evidential weight. Atlarium's 2 to 7 recommendation remains as the narrower alternative,
        while JBL's 4 to 6 target concerns a regional assemblage that explicitly includes the
        species rather than full species-specific tolerance. The two JBL URLs hold the same brochure
        and are one underlying source. Wang's chemistry supports very low natural buffering but
        total titration alkalinity includes organic acids. Neither long-term survival at the exact
        lower endpoint nor every combination of KH, pH and temperature inside the separate intervals
        has been established. generator proposed {\"min\":0.2,\"max\":7}; checker-a proposed
        {\"min\":0.5,\"max\":10}; checker-b proposed {\"min\":0.2,\"max\":10}; checker-c proposed
        {\"min\":0.1,\"max\":10}; tiebreaker-1 proposed {\"min\":0.1,\"max\":10}; tiebreaker-2
        proposed {\"min\":0.1,\"max\":10}."

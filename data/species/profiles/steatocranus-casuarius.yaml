  habitat:
    text: "The species occurs in Pool Malebo and the lower Congo in both Congo republics. Rocks and
      protected spaces allow it to use rapids habitat while escaping the strongest current. Regional
      measurements support typical temperatures of 26 to 29 C and extremely low mineral content;
      direct calcium and magnesium data near Kinshasa convert to well below 1 dGH. The natural pH
      decision of 5.6 to 7.3 is a provisional regional envelope. Longer monitoring records span 20
      to 31.7 C and pH 5.1 to 8.9, and an older series spans pH 5.0 to 7.6. Those wider station
      observations are not demonstrated normal conditions at occupied shelters or safe aquarium
      targets. Alkalinity is low, and a substantial organic contribution means titration alkalinity
      and carbonate-only KH differ. Mainstem observations provide context rather than precise
      measurements at individual fish refuges."

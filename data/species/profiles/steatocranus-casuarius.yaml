  khDkh:
    value:
      min: 0
      max: 1
    confidence: medium
    rationale: "The tally rounds agreeing ranges to 0 to 1 dKH. Its zero endpoint means very weak
      buffering after whole-degree rounding, not a requirement for precisely zero carbonate. Wang's
      total alkalinity of 85 to 235 micromol/kg converts to approximately 0.24 to 0.66 dKH as
      titration alkalinity. Organic acids contribute 11 to 61 percent, so that total overstates
      carbonate-only alkalinity. Combining unpaired extremes yields approximate carbonate envelopes
      of 0.09 to 0.59 or 0.11 to 0.61 dKH, not directly observed paired endpoints. Other mainstem
      samples give total-alkalinity equivalents of about 0.52 to 1 dKH. Deronde and Symoens' older
      acid titration includes humate contributions and reports carbonate equivalents; the FAO
      compilation cannot be converted again as raw bicarbonate. Moukolo's bicarbonate study means
      give about 0.33 to 0.86 dKH. The profile retains these distinctions and the tally's medium
      confidence; natural KH carries no verification object. generator proposed
      {\"min\":0.2,\"max\":0.9}; checker-a proposed {\"min\":0.5,\"max\":1}; checker-b proposed
      {\"min\":0.2,\"max\":1}; checker-c proposed {\"min\":0.1,\"max\":1}."

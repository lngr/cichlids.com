  breeding:
    text: "Eggs are laid inside a sheltered cavity. Both adults protect the family, commonly with the
      female attending the eggs and the male guarding the surrounding area. Published accounts give
      clutches up to about 150 eggs and variable development times. Expect hatching after several
      days and another interval before the young leave the shelter; temperature and the particular
      brood affect timing. Small live foods and suitably fine prepared food can feed mobile fry.
      Parents may defend offspring for many weeks, changing their tolerance of otherwise acceptable
      companions. Secure the spawning structure and plan accommodation for surplus adults and
      growing young."

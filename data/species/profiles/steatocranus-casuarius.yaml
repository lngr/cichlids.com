        Zierfische Direkt 5 to 8, and Dietzenbach 8 to 10. These unreferenced husbandry estimates
        support a broad planning horizon, not a survival distribution or an exact age of 6.5 years.
        Checker-a relies on general model knowledge rather than a species age record. A full post in
        cichlids.com thread 15563 independently reports seven years of keeping before a power
        failure killed the fish; this confirms survival to seven rather than a biological maximum.
        Confidence stays low."

partners:
  suitable:
    - species: Phenacogrammus interruptus
      reason: An adult shoal uses midwater and is specifically recommended as dither fish in the read
        breeding account.
      condition: Use a longer community aquarium that meets the tetra shoal's needs; keep a quiet margin
        outside the main current.
    - species: Alestopetersius caudalis
      reason: A proposed alestid companion that occupies water above the cave territory; inferred from the
        recommended alestid group.
      condition: Keep an adult shoal in a larger tank with compatible water and monitor breeding defense.
    - species: Synodontis brichardi
      reason: Seriously Fish specifically lists this current-adapted catfish as an option.
      condition: Provide a substantially larger footprint and separate secure shelters; it can compete for
        caves and threaten eggs.
  unsuitable:
    - species: Pelvicachromis pulcher
      reason: Another cave-breeding cichlid concentrates activity in the same floor territory; established
        sources advise against additional cichlids in ordinary-sized tanks.
    - species: Neolamprologus multifasciatus
      reason: "A floor-dwelling shell colony competes with the defended cave area, and its fry face
        possible opportunistic predation. The archive warning predicts predation without observing
        it; overlapping chemical tolerances do not remove the territorial conflict."
    - species: Symphysodon aequifasciatus
      reason: "Typical discus care favors calm feeding and limited territorial disturbance, making a pair
        defending a rocky cave in a current-rich setup a poor ordinary community choice. This is a
        husbandry judgment rather than proof that their numerical water tolerances never overlap."
profile:
  overview:
    text: "Steatocranus casuarius is a Congo river cichlid best observed close to the aquarium floor.
      Adults rest near shelters and travel in brief bursts, a behavior associated with their reduced
      swim bladder. The forehead swelling becomes particularly noticeable in mature males. A
      compatible pair offers a more dependable adult arrangement than a collection of unrelated
      fish. Its appeal lies in shelter construction and family behavior as much as appearance.
      Reliable oxygenation and room to avoid a defended cave are central to successful keeping."

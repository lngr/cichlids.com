  compatibility:
    text: "Suitable larger alestid tetras can use water above the shelters in a sufficiently spacious
      aquarium. Seriously Fish also names rheophilic Synodontis and other current-adapted catfishes,
      although these need separate retreats and can compete for cavities. False speciesOnly permits
      such communities without guaranteeing every pairing. Avoid another cave-territorial cichlid in
      the minimum pair tank. Level 1 predation describes a plausible risk to fry and very small
      fish, with no measured prey-size limit for this species. Shell-dwellers also share the
      defended floor, and archive predictions of their being eaten are not verified feeding records.
      Broad chemistry tolerances do not resolve territorial conflicts."

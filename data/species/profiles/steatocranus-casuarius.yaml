  sexing:
    text: "Adult size and the prominence of the forehead swelling help distinguish the sexes when
      comparing similar-aged fish. Males are usually larger and have a more developed hump, but
      females can also carry one. Juveniles are harder to sex and the presence of a hump alone is
      insufficient. Species identification also matters. Frank Schaefer reports that S. casuarius
      and S. gibbiceps can arrive together in exports, with the centers of body scales darker in
      casuarius and lighter in gibbiceps. A mixed shipment is evidence of possible misidentification
      rather than evidence of hybrid offspring."

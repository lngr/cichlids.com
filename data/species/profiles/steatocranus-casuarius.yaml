  socialBehavior:
    text: "Use a compatible adult pair as the social unit. A group of juveniles can provide
      opportunities for partner selection, but excluded fish need alternative accommodation once a
      pair forms. Males and females bought separately may reject one another. Persistent hiding,
      loss of access to food or confinement above the defended bottom can signal that an adult is
      being driven away. Cave ownership extends outside breeding, while eggs and young intensify
      defense. The small territory category does not mean companions can safely crowd its entrance.
      Additional pairs require substantially more space and separate retreats."

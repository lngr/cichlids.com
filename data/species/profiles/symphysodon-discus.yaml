  hybridGroups:
    value:
      - "symphysodon"
    confidence: "high"
    rationale: "All four votes retain the existing symphysodon group and the tally assigns high
      confidence. Amado et al. find wild genetic admixture involving Heckel-related and brown
      populations; Bleher reports natural contact-area mixed forms, and UF/IFAS describes fertile
      crossing across discus forms. Historical names are interpreted according to each author's
      biological populations rather than mechanically translating haraldi to its present synonym.
      Leibel questions successful crosses with western green discus, and Bleher reports limited
      fertility of some wild mixed forms. Group membership records the curated crossing warning and
      does not establish identical crossability or fertility for every modern species pair. The
      listed group already includes S. discus."

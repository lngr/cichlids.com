    tolerance:
      value:
        min: 25
        max: 32
      confidence: "low"
      rationale: "The tally decides 25 to 32 C by qualified majority, five of six votes, with low
        confidence. Generator, checker-b and tiebreaker-1 proposed 25 to 32; checker-c and
        tiebreaker-2 proposed 26 to 32; checker-a proposed 26 to 30. The agreeing cluster's rounded
        median gives 25 to 32. Tropical Freshwater Fish gives 27 to 32 and MARE 2000 28 to 32; Bayer
        sets a 26 C floor and prefers 28 to 32. FishProfiles gives a wider 27 to 33 C, and Aqueon
        specifically suggests about 32.2 C for wild Heckels; the decided upper endpoint does not
        include those higher recommendations. The 25 C lower boundary is supported by wild
        occurrence rather than demonstrated multi-year aquarium health. Routine maintenance near 28
        to 30 C has stronger support than continuous use of either outer endpoint."

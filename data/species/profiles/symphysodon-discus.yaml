    tolerance:
      value:
        min: 3.8
        max: 6.5
      confidence: "low"
      rationale: "No qualified majority settles the 6 proposals. generator proposes 3.8 to 6.5; checker-a
        proposes 4 to 7; checker-b proposes 4.2 to 6.5; checker-c proposes 3.8 to 6.5; tiebreaker-1
        proposes 3.8 to 6.5; tiebreaker-2 proposes 3.8 to 7 (pH). The rounded median of all minima
        and all maxima is 3.8 to 6.5 pH. This contains natural 3.8 to 5.2 without widening.
        Confidence is low. FishProfiles gives 5 to 6.5, Tropical Freshwater Fish 5.5 to 6.5 and MARE
        2000 5 to 6.5. Wider evidence includes Bayer's maintenance recommendation of 6 to 7 for
        acclimated wild Heckels, Akvaforum's maintenance point of 6.7, Zoopet's 6 to 7, AquaInfo's
        6.5 to 6.8 and Diskusmann's 5.5 to 6.8. The latter also discusses cross stock; general
        non-Heckel guidance is wider at 5 to 7 or 5.5 to 7.5. The median upper edge of 6.5 agrees
        with several Heckel care sheets, while higher species-specific maintenance reports show that
        it is not a measured physiological ceiling. FishFish is stricter at 4.5 to 5.5. The 3.8
        endpoint represents natural occurrence rather than a chronic aquarium trial; acute low-pH
        experiments do not establish lifetime tolerance. The median is plausible as an envelope
        containing the natural blackwater range and several Heckel maintenance recommendations, with
        uncertain chronic endpoints."

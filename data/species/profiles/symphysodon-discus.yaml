    confidence: "high"
    rationale: "This profile describes wild Heckel discus, with the Rio Negro system as the water-data
      focus. The Catalog lists the lower Negro, Ururum, Nhamunda and Abacaxis basins. Amado et al.
      identify Negro Heckel and Abacaxis fish as the same taxon and also discuss Uatuma and
      Trombetas records. Bleher questions the Trombetas attribution, so that drainage is
      acknowledged as disputed rather than added as an aquarium locality variant. Other discus
      phenotypes and domestic strains are excluded."

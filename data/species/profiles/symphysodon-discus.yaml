        tiebreaker-1 and tiebreaker-2 proposed 3.8 to 5.2; checker-c proposed 3.8 to 5.3 and agrees
        within the pH threshold. Checker-a proposed 4.0 to 6.2 and checker-b 4.2 to 6.2. Bleher's
        identified Heckel observations reach 3.8 and Fernandez measured 5.0 and 5.2 during Demini
        collecting. FishBase's wider 4.2 to 6.2 range and the CRC verification of Geisler's 4.8 to
        6.2 compilation remain visible as competing evidence. The original Geisler locality table
        was not read. Silva et al. report Negro seasonal means of 4.62 to 5.29 at Manaus, a regional
        comparison rather than occupied-refuge extremes. The decision retains the specified Rio
        Negro blackwater scope. Verification method: qualified-majority (4 of 6 votes)."
    - field: "features.khDkh"

      rationale: "The tally selects 0 to 3 dGH by qualified majority, five of six proposals within its
        two-degree agreement window, with medium confidence. Generator proposed 0 to 4, checker-a 0
        to 8, checker-b 0 to 5, and checker-c and both tie-breakers 0 to 3. Tropical Freshwater Fish
        gives 0 to 3 and FishFish 1 to 3; the lower boundary contains the natural 0 to 1 range.
        Wider recommendations remain explicit: MARE 2000 gives 1 to 5, B-Aqua's prose 2 to 5,
        Nordiska Ciklidsallskapet a point at 5, FishProfiles 3 to 15, AquaInfo 3 to 12 in its
        mixed-stock prose, and Diskusmann 2 to 10 while also discussing crosses. Generic discus
        accounts reaching 8 do not isolate wild Heckels. These are care recommendations rather than
        controlled chronic limits; the decided median of the agreeing proposals favors very soft
        water."

partners:
  suitable:
    - species: "Paracheirodon axelrodi"
      reason: "A calm soft-water tetra that can share the warm aquarium without competing as strongly as
        large active cichlids."
      condition: "Use a settled shoal of full-grown fish, sufficient feeding access, and a shared
        temperature and pH; fry are not protected."
    - species: "Petitella bleheri"
      reason: "A suitable rummynose tetra choice for warm, soft, acidic water; shoaling activity can fit a
        quiet community."
      condition: "Use full-grown fish in a shoal and check that their activity does not prevent Heckels
        from feeding."
    - species: "Mikrogeophagus ramirezi"
      reason: "Warm-water dwarf cichlid that occupies mainly the lower area and can coexist with discus."
      condition: "Use a larger aquarium than the minimum Heckel setup, with a separate bottom territory
        and pH around 5.5 to 6.0 rather than the lowest wild Heckel extreme."
  unsuitable:
    - species: "Symphysodon aequifasciatus"
      reason: "Shares the curated symphysodon hybrid group; mixed breeding compromises species identity
        and its care cannot simply be substituted for wild Heckel care."
    - species: "Symphysodon tarzoo"
      reason: "Shares the curated symphysodon crossing group. Mixing breeding stocks creates an ancestry
        concern; its habitat and domestic descendants do not define Heckel requirements."
    - species: "Amphilophus labiatus"
      reason: "Persistent territorial aggression and feeding pressure are unsuitable for timid Heckels."
    - species: "Puntigrus tetrazona"
      reason: "Active feeding and fin-nipping risk are incompatible with deliberate-feeding discus;
        routine temperature requirements also differ."
profile:
  overview:
    text: "Heckel discus is the wild Symphysodon discus of Brazilian Amazon blackwaters. Its dark middle
      body bar stands out against a brownish background crossed by blue markings, although the
      intensity changes with condition and locality. The Catalog of Fishes separates it from S.
      aequifasciatus and S. tarzoo and currently places S. haraldi under S. tarzoo. Historical
      articles apply those names differently. Collection information matters, and this profile
      excludes domestic discus strains and other wild discus lineages."
    sources:
      - kind: "catalog-of-fishes"
        title: "Eschmeyer's Catalog of Fishes: Symphysodon species, version updated 21 September 2026"
        url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=specie\
          s&genus=Symphysodon"
        archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-c2d49a45/2026-10-14T103216Z
        accessed: "2026-10-13"
      - kind: "literature"
        title: "Bleher, H. (2009). Definitive guide to Discus: part one. Practical Fishkeeping."
        url: "https://www.practicalfishkeeping.co.uk/features/definitive-guide-to-discus-part-one/"
        archived: practicalfishkeeping.co.uk/features/definitive-guide-to-discus-part-one/2026-10-14T103239Z
        accessed: "2026-10-13"
  habitat:
    text: "The Rio Negro system provides the main habitat model: quiet flooded margins with submerged
      branches and forest cover over fine sand. Water levels alter the available refuge and feeding
      area. The decided natural ranges are 26 to 31 C and pH 3.8 to 5.2, with GH 0 to 1 dGH and
      provisional KH 0 to 1 dKH. Collecting records are wider in temperature, reaching 25 to 31.7 C,
      and some broader species summaries reach pH 6.2. Mineral content and carbonate buffering are
      extremely low; a near-zero reading does not mean chemically pure water."

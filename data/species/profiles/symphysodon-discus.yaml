  sizeAndGrowth:
    text: "Allow for an adult aquarium total length up to about 20 cm in either sex, while recognizing
      that some Heckel care sheets give 18 cm. Sex-resolved growth records are too limited to
      justify a smaller female maximum. Published wild standard lengths use a different measurement
      and should not be compared directly with total length. Reliable feeding access and consistent
      water quality matter during growth. The 10 to 15 year lifespan is a weak aquarium estimate,
      with conflicting shorter and longer reports rather than a Heckel lifetime study."

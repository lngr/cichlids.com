    confidence: "low"
    rationale: "The tally fixes 0 to 1 dKH with low confidence. Generator and checker-b proposed 0 to 1,
      checker-a 0 to 0.5, and checker-c 0 to 0.2; all fall in its two-degree agreement window, and
      whole-degree rounding produces 0 to 1. This is a coarse habitat envelope rather than a
      measured 1 dKH upper limit. JBL reports zero by field titration and Caraballo et al. summarize
      Negro alkalinity below 0.05 meq/L, equivalent to below 0.14 dKH. Their mixed-water study lake
      is not substituted for Negro habitat. AquaInfo summarizes upper and middle Negro KH below 1;
      CRC verifies an older 0.08 to 0.56 range. The numerical Gonzalez table and the raw
      hardness/alkalinity tables of the Moringa study were not recoverable in the permitted
      extraction, so their input conversions are excluded from evidence. Total alkalinity can
      include organic contributions and does not precisely equal carbonate hardness. FishBase's
      general dH figure is not KH evidence."

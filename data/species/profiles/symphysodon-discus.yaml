  legacyNames:
    - "Symphysodon discus"
  note: "The Catalog of Fishes, updated 21 September 2026 and accessed 13 October 2026, lists S.
    discus, S. aequifasciatus and S. tarzoo as valid. It places S. haraldi under S. tarzoo and
    willischwartzi under S. discus. Older taxonomic treatments use haraldi, aequifasciatus and
    tarzoo for different biological sets; the 2011 genetic study additionally distinguishes unnamed
    evolutionary units. This profile covers wild Heckel discus, with Rio Negro blackwater as the
    natural-water scope, and acknowledges conspecific Abacaxis populations. Other discus lineages
    and domestic strains are excluded. Color or a central bar alone does not prove pure ancestry."

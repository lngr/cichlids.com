  socialBehavior:
    text: "A group of at least six adults distributes dominance more effectively than a few isolated
      rivals. Regular chasing and displacement can occur even in a peaceful-looking group. Check
      that each fish reaches food and maintains condition, especially an individual that stays
      behind shelter. Pairs form within the group and defend a localized breeding area. Persistent
      exclusion calls for more space or separate management rather than assuming that an absence of
      visible injuries means the group is working."
    sources:
      - kind: "literature"
        title: "Candidate Species for Florida Aquaculture: Discus Symphysodon spp., a Profitable but
          Challenging Species for Florida Aquaculture (UF/IFAS EDIS FA166)"

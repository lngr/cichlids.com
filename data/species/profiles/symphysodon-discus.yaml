        accessed: "2026-10-13"
  breeding:
    text: "Both parents guard eggs attached to a cleaned exposed surface such as wood or a suitable
      vertical spawning support. Free-swimming offspring then feed from parental skin mucus before
      taking more external food. Established breeding pairs may need separate management from the
      adult group, and successful maintenance does not ensure successful breeding. Record parental
      species and collection information because natural admixture and aquarium crosses can obscure
      ancestry. The shared symphysodon crossing group records that concern without implying that
      every modern species pairing has identical fertility."
    sources:
      - kind: "literature"
        title: "Buckley, J. (2012). Parental care and the development of the parent offspring conflict in
          discus fish (Symphysodon spp.). PhD thesis, University of Plymouth."
        url: "https://doi.org/10.24382/2203"

      confidence: "low"
      rationale: "The tally selects 0 to 1 dKH by qualified majority, five of six proposals within its
        two-degree agreement window, and retains low confidence. Generator proposed 0 to 4,
        checker-a 0 to 5, checker-b 0 to 2, and checker-c and both tie-breakers 0 to 1. The agreeing
        minima are zero and their median maximum is 1. MTF's wild-discus table gives 0 to 1 but is a
        retailer website; Diskusmann gives a species-specific breeding point at 1, and
        Interaquaristik requests near-unmeasurable KH without a numerical cutoff. Wider guidance is
        Aqueon 1 to 4, Fast Aquatics 0 to 3, AquaInfo 2 to 8 and the general UF/IFAS alkalinity
        recommendation equivalent to about 3.4 to 5 dKH. None establishes multi-year Heckel health
        throughout those intervals. The chosen ceiling is provisional, with habitat occurrence
        supporting the low end. CRC's below-2 advice verifies but does not originate the range. GH
        and conductivity are not evidence of KH, and every pH/KH combination inside these separate
        envelopes is not automatically suitable."

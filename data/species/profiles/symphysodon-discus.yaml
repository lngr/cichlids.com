variants:
  - name: "Rio Demini"
    kind: "locality"
    note: "Heckel population in a Rio Negro tributary; locality should be supported by collection
      records."
  - name: "Novo Airao"
    kind: "locality"
    note: "Rio Negro Heckel population sampled in the genetic study; not a separate species."
  - name: "Rio Nhamunda"
    kind: "locality"
    note: "Confirmed Heckel locality outside the Negro drainage; neighboring brown discus and wild
      admixture require attention to provenance."
  - name: "Rio Abacaxis"
    kind: "locality"
    note: "Yellowish to reddish Heckel population formerly named willischwartzi; a valid locality form
      within S. discus, not a domestic strain."

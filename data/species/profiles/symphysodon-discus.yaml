  ghDgh:
    value:
      min: 0
      max: 1
    confidence: "medium"
    rationale: "All four full-profile runs proposed 0 to 1 dGH, and the tally retains that range and
      medium confidence. FishBase states 0 to 1 dH. JBL found regional GH below field-test
      resolution; a separate Manaus drainage study reports natural surface-water total hardness
      below 1.78 mg/L, equivalent to below 0.10 dGH at 17.848 mg/L per degree. Neither regional
      series sampled every occupied Heckel refuge. Zero is a practical near-zero boundary, not an
      absence of calcium and magnesium. CRC verification gives 0.01 to 0.27 dGH and agrees with very
      soft water. Gonzalez's accessible extraction omits the numerical body of Table 1, so the
      calcium/magnesium conversion supplied in an input is not presented as independently checked
      evidence. Conductivity is not converted to GH."
    sources:
      - kind: "literature"
        title: "Gonzalez, R. J., Patrick, M. L. and Val, A. L. (2024). Ion uptake in naturally acidic water.
          Journal of Comparative Physiology B 194, 685-696, Table 1."

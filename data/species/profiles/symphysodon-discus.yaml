  problems:
    text: "Loss of condition can follow repeated missed meals, unstable replacement water, accumulated
      waste or inadequate oxygen in warm water. Newly acquired fish need quarantine and close
      observation before joining an established group. Discus can carry skin, gill and intestinal
      parasites, but dark color or abnormal feces alone does not identify a cause. Head and
      lateral-line lesions have several proposed causes; one controlled nutrition study did not
      reproduce them simply through a dietary calcium/phosphorus imbalance. Persistent symptoms need
      qualified assessment."
    sources:
      - kind: "literature"
        title: "Candidate Species for Florida Aquaculture: Discus Symphysodon spp., a Profitable but
          Challenging Species for Florida Aquaculture (UF/IFAS EDIS FA166)"

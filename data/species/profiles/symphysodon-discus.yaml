  temperatureC:
    value:
      min: 26
      max: 31
    confidence: "medium"
    rationale: "The tally fixes 26 to 31 C with unanimous agreement of four votes under the
      range-agreement rule. Generator and checker-b proposed 25 to 31.7 C, checker-a 26 to 30 C, and
      checker-c 26 to 31 C. The rounded median of that agreeing cluster is 26 to 31 C. Bleher's
      wider measured Heckel field envelope is 25 to 31.7 C, with a mean of 28.6 C; the decided range
      therefore does not reproduce every observed extreme. Fernandez measured 29 C at Demini capture
      sites and 31 C at the surface. JBL measured 28.9 to 30.3 C in the Negro. FishBase's 26 to 30 C
      is tied to aquarium literature, and the hematology introduction repeats a genus range; neither
      is an independent measurement of natural endpoints. The parasitology paper measured 27.0 to
      29.1 C while collecting other ornamental species, so it is a regional comparison only."

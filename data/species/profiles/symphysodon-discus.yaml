  sexing:
    text: "External appearance provides little certainty about sex. Color and the strong middle bar
      occur in both sexes, and head shape or size alone is unreliable. During spawning the female's
      egg-laying papilla is broader and the male's is narrower, but viewing conditions can make this
      difficult to judge. Seeing an individual deposit eggs provides stronger evidence. Two fish
      staying together do not establish that they are a fertile male-female pair."
    sources:
      - kind: "literature"
        title: "Livengood, E. J., Ohs, C. L. and Chapman, F. A. Candidate Species for Florida Aquaculture:

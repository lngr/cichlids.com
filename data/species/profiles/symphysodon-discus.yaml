  compatibility:
    text: "A Heckel group can share a larger aquarium with carefully chosen calm fish when temperature,
      chemistry and feeding access suit all residents. Adult cardinal tetras and appropriate
      rummynose tetras are conditional possibilities; warm-water dwarf cichlids need their own
      bottom space. Very small fry have no guarantee of safety, and some care sources warn that tiny
      fish can be swallowed despite the decided predation level of zero. Avoid persistent
      fin-nippers and aggressive large cichlids. Other discus species share the symphysodon crossing
      warning, and their requirements and domestic-stock history should not be substituted for wild
      Heckel care."
    sources:
      - kind: "literature"
        title: "Amado, M. V., Farias, I. P. and Hrbek, T. (2011). A Molecular Perspective on Systematics,
          Taxonomy and Classification Amazonian Discus Fishes of the Genus Symphysodon.

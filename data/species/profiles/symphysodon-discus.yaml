  maxSizeCm:
    value:
      male: 20
      female: 20
    confidence: "medium"
    rationale: "Generator proposed 18 cm for both sexes, checker-a 18 for males and 16 for females, and
      checker-b and checker-c 20 for both. FishFish explicitly gives 20 cm for each sex, while
      Nordiska Ciklidsallskapet and Zoopet list 20 cm without separating sexes. Their aquarium
      planning maximum is retained rather than using the larger standard-length values on some hobby
      pages. FishProfiles instead gives 18 for both; Diskusmann estimates 19 and 17 but also

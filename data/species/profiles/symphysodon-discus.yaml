  diet:
    text: "Heckels eat both plant-derived material and small animals. Identified wild gut observations
      include substantial detritus, plants and algae together with invertebrates. A varied complete
      aquarium ration with plant ingredients and suitable small aquatic invertebrates reflects that
      mixed diet better than an exclusively animal-food label. Acclimating wild fish may need time
      to accept prepared food. Place meals where less assertive individuals can feed and remove
      leftovers. The profile has no special dietary bloat flag, which does not remove the need for
      balanced nutrition."
    sources:
      - kind: "literature"
        title: "Bleher, H. (2009). Definitive guide to Discus: part two. Practical Fishkeeping."
        url: "https://www.practicalfishkeeping.co.uk/features/definitive-guide-to-discus-part-two/"
        archived: practicalfishkeeping.co.uk/features/definitive-guide-to-discus-part-two/2026-10-14T103329Z

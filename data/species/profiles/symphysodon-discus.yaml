  breeding:
    value: "open-substrate-spawner"
    confidence: "high"
    rationale: "All four runs agree on open-substrate spawning. FishBase and species-specific care
      describe eggs attached to exposed surfaces with parental guarding; the extension account and
      parental-care thesis support subsequent mucus feeding. Carrying or moving young briefly in the
      mouth does not change this classification. Much experimental mucus research concerns domestic
      or unspecified discus, so it supports the shared mechanism rather than Heckel-specific
      timing."

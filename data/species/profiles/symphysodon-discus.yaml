  husbandry:
    text: "Plan at least 375 L with a 150 by 50 cm footprint for six adults and approximately 50 cm
      water height. Wood should provide retreat while leaving open feeding spaces. Keep lighting
      subdued, water movement gentle and oxygen supply adequate. Routine temperature around 28 to 30
      C has stronger practical support than the full 25 to 32 C tolerance. The provisional chemistry
      tolerances are pH 3.8 to 6.5, GH 0 to 3 dGH and KH 0 to 1 dKH. Their endpoints are not equally
      demonstrated chronic settings. Prepare replacement water consistently and monitor pH, hardness
      and nitrogen waste; very low buffering makes stability particularly important. Additional
      companions need extra room and filtration capacity."
    sources:
      - kind: "literature"
        title: "Versyck, K. Symphysodon discus husbandry account and species table. AquaInfo."

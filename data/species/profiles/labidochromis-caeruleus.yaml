  predation:
    value: 1
    confidence: high
    rationale: >-
      A small-mouthed picker of invertebrates (insect larvae, small crustaceans, snails) that
      takes fry and very small fish when the chance arises. FishBase lists unidentified bony fish
      next to benthic invertebrates among its food items, Aquadiction warns that it endangers
      shrimps, snails and small fish, and Seriously Fish notes that stressed brooding females may
      eat their own brood; the archive reports adults eating fry in community tanks. The Israeli
      checklist names only invertebrates as wild food, which rules out regular piscivory. The
      rubric uses this species as its example of level 1. Decided unanimously by the vote count
      (3 of 3).
    sources:

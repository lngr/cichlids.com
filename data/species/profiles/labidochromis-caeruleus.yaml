  temperatureC:
    value: {min: 21, max: 29}
    confidence: high
    rationale: >-
      Lake Malawi endemic, so the natural range is the measured temperature range of the lake.
      Eccles (1974) reports 27 C in the upper 60 m by May and 21 C inshore in the cool, windy
      season; Vollmer et al. (2005) give winter epilimnion values of about 23.5 C and summer surface
      water of about 28 C; a 2013 campaign (Ngochera 2018) measured 24 to 29 C. FishBase gives 23
      to 26 C, but that figure comes from an aquarium atlas and is no habitat measurement.
    sources:
      - &branchu
        kind: literature
        title: "Branchu, P., Bergonzini, L., Ambrosi, J.-P., Cardinal, D., Delalande, M., Pons-Branchu, E. et al. (2010). Hydrochemistry (major and trace elements) of Lake Malawi (Nyasa), Tanzanian Northern Basin: local versus global considerations. Hydrology and Earth System Sciences Discussions 7, 4371-4409."

partners:
  suitable:
    - species: Iodotropheus sprengerae
      reason: Small, mild mbuna of similar size with a different colour; same water and plant-rich diet.
    - species: Sciaenochromis fryeri
      reason: Blue hap that leaves mbuna alone and differs too much in colour to be taken as a rival; a common pairing in hobby tanks.
      condition: Tank of at least 150 cm; feed the hap's protein share sparingly so the labidos do not overeat.
    - species: Aulonocara stuartgranti
      reason: Peaceful peacock that shares the water values; the two species ignore each other in practice.
      condition: Tank of at least 150 cm with open sand areas for the peacocks.
    - species: Synodontis multipunctatus
      reason: Bottom-dwelling catfish from the African rift lakes that tolerates the same water and is left alone.
  unsuitable:
    - species: Labidochromis chisumulae
      reason: Closest relative with similar females; the two may hybridise (hybrid group labidochromis).
    - species: Labidochromis mbenjii
      reason: Congener with look-alike females; mixing Labidochromis species risks hybrids (hybrid group labidochromis).
    - species: Melanochromis auratus
      reason: Far more aggressive mbuna with yellow females; labidos are harassed and lose condition.
    - species: Chindongo demasoni
      reason: Highly aggressive dwarf mbuna that persecutes calmer species in all but very crowded large tanks.
    - species: Pterophyllum scalare
      reason: Soft, acidic water species from South America; water needs and diet do not match, and the labidos nip slow, long-finned fish.
    - species: Paracheirodon innesi
      reason: Small soft-water tetra that needs acidic water and is at risk from adult mbuna.

profile:
  overview:
    text: >-
      Labidochromis caeruleus is a small rock-dwelling cichlid (mbuna) from the north of Lake
      Malawi and one of the most widely kept African cichlids. The hobby knows it mainly as the
      bright yellow form with jet-black fin markings, often sold as Electric Yellow or Yellow Lab;
      the fish at the type locality in Nkhata Bay are white with a faint blue sheen. Compared with
      most mbuna it is calm: it holds no feeding territory, tolerates other males fairly well and
      rarely damages tankmates. That makes it a good first species for a Malawi tank and a
      colourful, peaceful element in mixed communities. Almost all fish in the trade are bred in
      captivity and adapt easily to aquarium life.
    sources:
      - *sf
      - *glaser
      - *oliver
      - *cof
  habitat:
    text: >-
      The species is endemic to Lake Malawi, where it lives along the northern coasts of Malawi,
      Tanzania and Mozambique. The yellow form occurs only on a short stretch of the Malawian shore
      between Charo and Lion's Cove. Unlike many mbuna it stays mostly in deeper water, typically
      between about 10 and 40 m, over rocks covered with fine sediment, and it also enters dense
      beds of Vallisneria. The lake water there is soft but clearly alkaline: about 3 to 5 dGH, 5 to
      8 dKH and pH 7.7 to 8.6, with temperatures between 21 and 29 C over the year. The aquarium
      should copy the rocky part of this habitat over a sand floor.
    sources:
      - *sf
      - *cicek
      - *dewiki
      - *branchu
      - *fao5
      - *eccles
  sizeAndGrowth:
    text: >-
      Wild specimens are small; museum fish reach a little over 8 cm standard length. In the
      aquarium males usually end up at about 10 cm total length and females at about 8 cm; only
      very old males in large tanks reach 12 to 13 cm. Growth is quick in the first year.
      Overfeeding makes the fish grow faster but also fat, which shortens their life; a lean diet
      gives slower growth and better long-term health. With good care a lifespan of six to ten
      years is realistic.
    sources:
      - *fishbase
      - *sf
      - *glaser
      - *ag
      - *aqd
  husbandry:
    text: >-
      For one male and three females a tank of about 90 cm length and 150 L is the minimum; a
      breeding harem does better in 120 cm, and mixed mbuna groups need 120 to 150 cm or more. Build
      stacks of stone with many caves and gaps over a sandy floor, and leave a few open patches of
      sand and some flat stones as spawning sites. Keep the water alkaline and well buffered,
      around pH 7.5 to 8.5, at 24 to 27 C. Hard tap water is fine; soft, acidic or unstable water
      is not. Mbuna produce a lot of waste for their size, so strong filtration and large weekly
      water changes keep nitrate low and colours bright.
    sources:
      - *sf
      - *tff
      - *glaser
      - *fishbase
      - *tt
  socialBehavior:
    text: >-
      This is one of the mildest mbuna. It lives in loose groups with a pecking order instead of
      rigid territories, and several males can usually share a tank. A male that is ready to spawn
      cleans a small site and courts females with displays and persistent chasing, so one male with
      at least three females keeps the pressure spread. Towards other species it is mostly
      indifferent; it confronts fish of similar shape or colour now and then but seldom injures
      them. Its calm nature means it is more often the victim than the aggressor when combined with
      robust mbuna.
    sources:
      - *sf
      - *glaser
      - *liveaquaria
      - *t10873
  diet:
    text: >-
      In the lake it picks insect larvae, small crustaceans and tiny snails from rock surfaces,
      sediment and plant leaves, and it takes plankton as well. In the aquarium it eats any
      suitable food, but the staple should be a quality flake or pellet with a high share of plant
      matter such as spirulina. Frozen crustaceans like Mysis or brine shrimp make good supplements
      a few times a week. Avoid bloodworms, tubifex and other worms, and feed small portions once
      or twice a day; overfed fish turn fat and become prone to bloat and other disease.
    sources:
      - *cicek
      - *glaser
      - *sf
      - *tt
      - *t10873
  breeding:
    text: >-
      Breeding is easy and often happens without any effort in a community tank. The male cleans a
      flat stone or digs a shallow pit in the sand, shows his most intense colours and leads ripe
      females there. The female lays a few eggs at a time, takes them into her mouth and has them
      fertilised while she nips at the egg-like spots on the male's anal fin. A brood holds about 5
      to 30 eggs, depending on the female's size. She carries the young for three to four weeks
      without eating and then releases fully formed fry that take brine shrimp nauplii at once. In
      a mixed tank most fry are eaten, so many keepers move the brooding female to a separate tank
      shortly before release; a female moved too early or chased may spit or swallow the brood,
      and one kept away too long can lose her rank in the group.
    sources:
      - *sf
      - *enwiki
      - *dewiki
      - *tff
  sexing:
    text: >-
      Sexing is not easy, because both sexes share the yellow colour and black fin markings.
      Adult males grow somewhat larger, become brighter when they spawn and usually show more black
      in the fins, especially the pelvic fins; dominant males may also develop a brownish patch
      between eye and mouth. The black of the pelvic fins appears earlier in young males, so a
      group of fish around 4 to 5 cm gives the best first hints. Older females increasingly take on
      male colours, which makes size and behaviour more reliable than colour in adults.
    sources:
      - *glaser
      - *sf
      - *tt
  compatibility:
    text: >-
      Good tankmates are other calm Malawi species with different colours and the same water needs,
      such as Iodotropheus sprengerae, peacocks like Aulonocara stuartgranti, mild haps such as
      Sciaenochromis fryeri in larger tanks, and rift-lake Synodontis catfish. Do not keep it with
      other Labidochromis species such as L. chisumulae, L. mbenjii or the undescribed L. sp.
      'Hongi', or with other colour forms of its own species, since the hobby warns that they
      cross. A single Electric Yellow without conspecifics may even spawn with mbuna of other
      genera; hobby reports name red zebras (Maylandia estherae) and Dimidiochromis, so keep it in a
      proper group. Very aggressive mbuna such as Melanochromis auratus or Chindongo demasoni stress
      and harass it. Soft-water fish from South America or Asia need different water and are
      either too slow or too small to live safely with mbuna; fry and very small fish are eaten.
    sources:
      - *sf
      - *tawil
      - *tff
      - *liveaquaria
      - *t49138
      - *t37908
      - *t13578
      - *t1348
  problems:
    text: >-
      The most frequent keeping mistake is a protein-rich diet: worms and heavy feeding can lead to
      the swelling and loss of appetite known as Malawi bloat, which is often fatal if not caught
      early. A plant-based staple and small portions prevent most cases. Another common error is
      wrong water: in soft or acidic water, or with falling pH from missed water changes, the fish
      lose colour and become prone to infections. Mixing them with much more aggressive mbuna leads
      to chronic stress, hiding and poor feeding. Females carrying eggs that are moved or chased may
      spit or swallow the brood, and isolated females can lose rank when they return. Tank hybrids
      with yellow congeners or with red zebras are sold as yellow labs, so buying from breeders who
      keep the line pure avoids passing hybrids on.
    sources:
      - *sf
      - *glaser
      - *t10873
      - *t1103
      - *t49138


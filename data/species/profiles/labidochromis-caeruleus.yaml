  disagreements:
    - field: features.origin.value.waterbody
      proposals:
        - {by: generator, value: Lake Malawi}
        - {by: checker-a, value: Lake Malawi}
        - {by: checker-b, value: lake-malawi}
      decision: Lake Malawi
      rationale: Both spellings name the same entry of the water body table; the name form is used, as in the other proposals.
    - field: features.origin.value.localities
      proposals:
        - {by: generator, value: [Nkhata Bay, Lion's Cove, Charo, Mbowe Island, Lundo Island, Cape Kaiser]}
        - {by: checker-a, value: [Nkhata Bay (type locality), Lion's Cove, Charo, Cape Kaiser to Lundo]}
        - {by: checker-b, value: [Nkhata Bay, northern and north-western coast]}
      decision: [Nkhata Bay, Lion's Cove, Charo, Mbowe Island, Lundo Island, Cape Kaiser]
      rationale: >-
        The proposals describe the same range. Named places are kept as single localities, each
        backed by Seriously Fish, Oliver or the Catalog of Fishes; the type locality and the coastal
        stretches are explained in the rationale.
    - field: features.ph.tolerance
      proposals:
        - {by: generator, value: {min: 7.2, max: 8.8}}
        - {by: checker-a, value: {min: 7.5, max: 8.6}}
        - {by: checker-b, value: {min: 7, max: 8.9}}
      decision: {min: 7.2, max: 8.8}
      rationale: Decided by the vote count (unanimous, 3 of 3 within 0.3 pH); the median of the agreeing bounds is 7.2 to 8.8.
    - field: features.ghDgh.tolerance
      proposals:
        - {by: generator, value: {min: 3, max: 25}}
        - {by: checker-a, value: {min: 3, max: 20}}
        - {by: checker-b, value: {min: 3, max: 25}}
        - {by: tiebreaker-1, value: {min: 3, max: 25}}
        - {by: tiebreaker-2, value: {min: 3, max: 25}}
      decision: {min: 3, max: 25}
      rationale: Decided by the vote count (qualified majority, 4 of 5); checker-a's upper bound of 20 dGH differs by more than 2 dGH.
    - field: features.khDkh.tolerance
      proposals:
        - {by: generator, value: {min: 5, max: 15}}
        - {by: checker-a, value: {min: 5, max: 12}}
        - {by: checker-b, value: {min: 5, max: 12}}
        - {by: tiebreaker-1, value: {min: 5, max: 12}}
        - {by: tiebreaker-2, value: {min: 5, max: 12}}
      decision: {min: 5, max: 12}
      rationale: Decided by the vote count (qualified majority, 4 of 5, confidence low); the generator's upper bound of 15 dKH rests on LiveAquaria alone.
    - field: features.diet.value.foods
      proposals:
        - {by: generator, value: [insect larvae, small crustaceans, small snails, zooplankton, spirulina-based flakes and pellets, frozen crustaceans such as Mysis or brine shrimp]}
        - {by: checker-a, value: [insect larvae and other small benthic invertebrates, zooplankton, spirulina-based flakes and pellets in the aquarium]}
        - {by: checker-b, value: [small invertebrates, insect larvae, algae, spirulina, vegetable matter]}
      decision: [insect larvae, small crustaceans, small snails, zooplankton, spirulina-based flakes and pellets, frozen crustaceans such as Mysis or brine shrimp]
      rationale: >-
        The diet is decided by the vote count (unanimous on type invertivore and bloatSensitive
        true), which takes the food list of the top candidate. It covers the wild foods named by
        the Israeli checklist and Aquarium Glaser and the aquarium staples; algae as a wild food is
        documented only for the congener L. vellicans.
    - field: features.hybridGroup.value
      proposals:
        - {by: generator, value: labidochromis}
        - {by: checker-a, value: labidochromis}
        - {by: checker-b, value: null}
        - {by: tiebreaker-1, value: labidochromis}
        - {by: tiebreaker-2, value: null}
      decision: labidochromis
      rationale: >-
        Decided by the vote count as the conservative value (3 of 5, no qualified majority, confidence
        low): the most common named group. The null votes rightly note that no tank cross between
        described Labidochromis species is documented; the group rests on the warnings of Seriously
        Fish and Tawil and on the species' proven readiness to cross with other mbuna. The group is
        added to the curated list with the look-alike congeners common in the trade.
    - field: features.maxSizeCm.value
      proposals:
        - {by: generator, value: {male: 12, female: 10}}
        - {by: checker-a, value: {male: 10, female: 8}}
        - {by: checker-b, value: {male: 10, female: 8}}
      decision: {male: 10, female: 8}
      rationale: >-
        The feature is the typical maximum of well-kept aquarium fish, not a record. Aquarium
        Glaser, Aquarium-Guide, Aqualog and The Tropical Tank give 8 to 10 cm; 12 to 15 cm are reached
        only by very old males, so the generator's 12 cm describes the upper tail rather than the
        typical adult.
    - field: features.aggressionHeterospecific.value
      proposals:
        - {by: generator, value: 1}
        - {by: checker-a, value: 1}
        - {by: checker-b, value: 2}
      decision: 1
      rationale: >-
        Seriously Fish, Aquarium Glaser, The Tropical Tank and TropicalFreshwaterFish describe a fish
        that ignores other species outside spawning and is often the target in mixed tanks. The
        aggressive tag of Aqualog and the semi-aggressive rating of LiveAquaria concern look-alike
        fish, which the hybrid group and coloration already cover.
    - field: features.habitatZones.value
      proposals:
        - {by: generator, value: [rock, plants, sand]}
        - {by: checker-a, value: [rock, sand, plants]}
        - {by: checker-b, value: [rock, sand]}
      decision: [rock, sand, plants]
      rationale: >-
        Seriously Fish names Vallisneria beds as one of two wild biotopes, so plants belong to the
        zones the species uses in the wild; sand serves as spawning ground and covers the rocks
        with sediment.
    - field: features.feedingSpeed.value
      proposals:
        - {by: generator, value: normal}
        - {by: checker-a, value: normal}
        - {by: checker-b, value: hasty}
      decision: normal
      rationale: >-
        No source grades the feeding speed. TropicalFreshwaterFish reports that it is harassed by
        more aggressive mbuna, and it picks food rather than rushing it like the Maylandia grazers
        that the rubric names as hasty; checker-b's value rested on model knowledge alone.
    - field: features.minTank.value
      proposals:
        - {by: generator, value: {volumeL: 150, lengthCm: 90, depthCm: 45}}
        - {by: checker-a, value: {volumeL: 200, lengthCm: 100, depthCm: 40}}
        - {by: checker-b, value: {volumeL: 154, lengthCm: 90, depthCm: 45}}
      decision: {volumeL: 154, lengthCm: 90, depthCm: 45}
      rationale: >-
        Seriously Fish gives 90 x 45 cm and about 154 L for the harem, FishBase 80 cm and the archive
        90 cm; the larger figures of Aqualog and Aquarium-Guide are general recommendations. The
        value takes the Seriously Fish figures, which the generator rounded to 150 L.
    - field: features.lifespanYears.confidence
      proposals:
        - {by: generator, value: low}
        - {by: checker-a, value: medium}
        - {by: checker-b, value: low}
      decision: medium
      rationale: >-
        All runs propose 6 to 10 years; checker-a found Aquarium-Guide (up to 10 years) and
        Aquadiction (up to 8 years), which the adjudicator confirmed, so the value no longer rests
        on model knowledge.

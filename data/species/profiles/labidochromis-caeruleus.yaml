variants:
  - name: Yellow (Lion's Cove, Charo to Mbowe Island)
    kind: color-morph
    note: >-
      Bright yellow with a black band in the dorsal fin and black pelvic and anal fin edges; known
      from a short stretch of the north-western shore and by far the most common form in the
      hobby, almost exclusively tank-bred.
  - name: Nkhata Bay
    kind: locality
    note: Population of the type locality; nearly white fish with a faint blue sheen and a black band in the dorsal fin.
  - name: Lundo Island
    kind: locality
    note: Blue fish with clear dark bars, Tanzanian coast.
  - name: Cape Kaiser
    kind: locality
    note: Almost pure white fish without obvious black markings, Tanzanian coast.

features:
  origin:
    value:
      continent: Africa
      region: Lake Malawi
      waterbody: Lake Malawi
      localities:
        - Nkhata Bay
        - Lion's Cove
        - Charo
        - Mbowe Island
        - Lundo Island
        - Cape Kaiser
    confidence: high
    rationale: >-
      Endemic to Lake Malawi; the type locality is Nkhata Bay. The species lives along the northern
      part of the lake on the Malawian, Tanzanian and Mozambican coasts (Seriously Fish names one
      stretch from Cape Kaiser to Lundo and another that ends at Charo), and the yellow form is
      known only between Charo and Lion's Cove. Oliver shows Konings' field photos of colour forms
      at Mbowe Island, Cape Kaiser and Lundo Island. Introduced populations in Israel and Hong Kong
      are not part of the native range.
    sources:
      - *cof

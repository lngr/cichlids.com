  khDkh:
    value: {min: 5, max: 8}
    confidence: high
    rationale: >-
      Lake Malawi endemic, so the natural range is the measured alkalinity of the lake: 2.33 to
      2.46 meq/L in the Branchu et al. (2010) profiles (6.5 to 6.9 dKH) and 2.00 to 2.59 meq/L in
      Jackson et al. (1963) in the FAO source book (5.6 to 7.3 dKH), with dKH = meq/L x 2.8.
    sources:
      - *branchu
      - *fao5
      - *fao6
      - *eccles
      - *vollmer05
      - *vollmer99
      - *ngochera
    evidence:
      - source: *branchu
        value: {min: 6.5, max: 6.9}
        note: alkalinity profiles, north basin
      - source: *fao5
        value: {min: 5.6, max: 7.3}
        note: Jackson et al. 1963
    tolerance:
      value: {min: 5, max: 12}
      confidence: low
      rationale: >-
        Few care sheets give a carbonate hardness for this species. The Tropical Tank recommends
        10 to 12 dKH and names 5 to 6 dKH as the lowest acceptable value; LiveAquaria gives 10 to
        15 dKH; a shop guide gives 8 to 12 dKH and a product maker asks for more than 4 dKH for
        Malawi cichlids in general. The lake itself holds 5 to 8 dKH, which sets the lower bound,
        and an archive keeper held the fish at 9 dKH and pH 8.0 without losses. The upper bound of
        12 dKH is the highest value that more than one sheet supports; only LiveAquaria goes
        beyond it. Decided by qualified majority of the vote count (4 of 5; one vote put the upper
        bound at 15 dKH). The confidence stays low because the bounds rest on few care sheets.
      sources:
        - *tt
        - *liveaquaria
        - *branchu
        - *fao5
        - &gensou
          kind: website
          title: Gensou, Labidochromis caeruleus yellow lab deep dive
          url: https://gensou.sg/labidochromis-caeruleus-yellow-lab-deep-dive/
          accessed: 2026-10-12

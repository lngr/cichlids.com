schemaVersion: 1
id: labidochromis-caeruleus
legacyIds: [322]
status: described

taxonomy:
  validName: Labidochromis caeruleus
  genus: Labidochromis
  species: caeruleus
  author: Fryer, 1956
  source: &cof
    kind: catalog-of-fishes
    title: Eschmeyer's Catalog of Fishes, species list of the genus Labidochromis (Labidochromis caeruleus Fryer 1956, current status valid)
    url: https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Labidochromis
    accessed: 2026-10-12
  synonyms: []
  legacyNames:
    - Labidochromis caeruleus
  note: >-
    The Catalog of Fishes lists the species as valid, described by Fryer in 1956 from Nkhata Bay
    (spelled Nkata Bay in the original), and records no synonym; the author stands without
    parentheses because the species was described in Labidochromis. The first aquarium imports
    were sold as "Labidochromis tanganyicae", a trade label without nomenclatural standing. The
    legacy entry refers to the yellow aquarium form; the fish of the type locality are white with
    a faint blue sheen. Whether the yellow fish are a colour form of L. caeruleus or a separate
    species has not been tested; current usage keeps all colour forms in L. caeruleus.


  ghDgh:
    value: {min: 3, max: 5}
    confidence: high
    rationale: >-
      Lake Malawi endemic, so the natural range is the measured total hardness of the lake: 4.2
      to 4.6 dGH in the north basin computed from calcium and magnesium (Branchu et al. 2010) and
      3.2 to 4.9 dGH from the 1960s titrations in the FAO source book. The lake is soft; care
      sheets that call Malawi water hard confuse hardness with alkalinity.
    sources:
      - *branchu
      - *fao5
      - *fao6
      - *eccles
      - *vollmer05
      - *vollmer99
      - *ngochera
    evidence:
      - source: *branchu
        value: {min: 4.2, max: 4.6}
        note: north basin, upper 50 m, computed from calcium and magnesium
      - source: *fao5
        value: {min: 3.2, max: 4.9}
        note: Jackson et al. 1963 and Talling and Talling 1965
    verification: {method: waterbody, waterbody: lake-malawi}
    tolerance:
      value: {min: 3, max: 25}
      confidence: medium
      rationale: >-
        In the aquarium the species is kept almost always in moderately hard to hard tap water and
        lives long in it. Care sheets give 10 to 25 dGH (Seriously Fish), 10 to 30 dGH
        (TropicalFreshwaterFish, aqua-fish.net), 9 to 16 dGH (FishProfiles), 5 to 19 dGH
        (Aquarium-Guide) and 10 to 15 dGH (Aquadiction); Fishkeeper names 25 dGH as upper limit and
        The Tropical Tank only a minimum of 7 dGH. Aquarium Glaser calls hardness unimportant as
        long as the water is not soft and acidic, and an archive keeper ran a Malawi tank at 13 dGH
        without losses. The lower bound is the natural lake hardness, which the fish tolerate when
        carbonate hardness and pH stay in range; no care sheet reports harm from soft water with a
        high pH. The upper bound follows the most reliable care sheets. Decided by qualified
        majority of the vote count (4 of 5; one vote put the upper bound at 20 dGH).
      sources:
        - *sf
        - *tff
        - &aquafish
          kind: database
          title: aqua-fish.net, Electric yellow cichlid (Labidochromis caeruleus)
          url: https://en.aqua-fish.net/fish/electric-yellow-cichlid
          accessed: 2026-10-12
        - *fishprofiles
        - *ag
        - *aqd
        - &fishkeeper
          kind: database
          title: Fishkeeper (Maidenhead Aquatics), Yellow Labidochromis
          url: https://fishkeeper.co.uk/fish/freshwater/cichlids/yellow-labidochromis
          accessed: 2026-10-12
        - *tt
        - *glaser
        - *branchu
        - &aqsource
          kind: website
          title: Aquarium Source, yellow lab cichlid
          url: https://www.aquariumsource.com/yellow-lab-cichlid
          accessed: 2026-10-12
        - &aquariadise
          kind: website
          title: Aquariadise, how to take care of a yellow lab cichlid
          url: https://www.aquariadise.com/yellow-lab-cichlid/
          accessed: 2026-10-12
        - &t9341
          kind: archive
          title: cichlids.com forum thread 9341
          url: https://www.cichlids.com/disc/read.php?1,9341
      evidence:
        - source: *sf
          value: {min: 10, max: 25}
          note: aquarium recommendation
        - source: *tff
          value: {min: 10, max: 30}
          note: given as dH
        - source: *aquafish
          value: {min: 10, max: 30}
        - source: *fishprofiles

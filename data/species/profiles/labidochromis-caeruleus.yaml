          kind: website
          title: NT Labs, Fish of the week, electric yellow cichlid
          url: https://nt-labs.com/knowledge-hub/fish-of-the-week-electric-yellow-cichlid/
          accessed: 2026-10-12
        - *glaser
        - *t9341
      evidence:

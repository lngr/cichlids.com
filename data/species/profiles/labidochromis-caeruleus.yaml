    confidence: medium
    rationale: >-
      Wild museum specimens reach 8.1 cm standard length (FishBase). Aquarium fish usually grow to
      about 8 to 10 cm total length: Aquarium Glaser names about 8 cm as the usual size,
      Aquarium-Guide and Aqualog 8 to 10 cm, The Tropical Tank 10 cm, Seriously Fish 10 cm standard

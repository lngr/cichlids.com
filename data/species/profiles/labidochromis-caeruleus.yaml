          note: ideal 10 to 12, lowest acceptable 5 to 6
        - source: *liveaquaria
          value: {min: 10, max: 15}
        - source: *branchu
          value: {min: 6.5, max: 6.9}
          note: natural lake water in which the species lives
        - source: *fao5
          value: {min: 5.6, max: 7.3}
          note: natural lake water, Jackson et al. 1963
        - source: *gensou
          value: {min: 8, max: 12}
          note: shop recommendation
        - source: *t9341

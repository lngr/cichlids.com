  ph:
    value: {min: 7.7, max: 8.6}
    confidence: high
    rationale: >-
      Lake Malawi endemic, so the natural range is the measured pH of the lake. Surface water has
      pH 7.7 to 8.6 (Jackson et al. 1963 in the FAO source book); Branchu et al. (2010) report 7.5
      to 8.5 over the whole water column, the lower values from deep water that this rock dweller
      does not use.
    sources:
      - *branchu
      - *fao5
      - *fao6
      - *eccles
      - *vollmer05
      - *vollmer99
      - *ngochera
    evidence:
      - source: *fao5
        value: {min: 7.7, max: 8.6}
        note: lake surface water, Jackson et al. 1963
      - source: *branchu
        value: {min: 7.5, max: 8.5}
        note: whole water column, lower values in deep water
    verification: {method: waterbody, waterbody: lake-malawi}
    tolerance:
      value: {min: 7.2, max: 8.8}
      confidence: medium
      rationale: >-
        Care sheets give lower limits between 7.0 and 7.8 and upper limits between 8.5 and 8.6
        (Seriously Fish 7.7 to 8.6, FishProfiles 7.5 to 8.6, The Tropical Tank 7.6 to 8.6,
        Aquarium-Guide and Aquadiction 7.5 to 8.5, LiveAquaria 7.8 to 8.5); TropicalFreshwaterFish
        and a retailer sheet go down to 7.0, Aqualog gives 7 to 8 and the English Wikipedia up to
        8.9. Aquarium Glaser names no figures and only warns against soft, acidic water. The fish do
        well for years in mildly to clearly alkaline water, while acidic or drifting pH is the
        common failure. Decided unanimously by the vote count (3 of 3 within 0.3 pH) as the median
        of the bounds, 7.2 to 8.8, which contains the lake range.
      sources:
        - *sf
        - *fishprofiles
        - *tt
        - *ag
        - *aqd
        - *liveaquaria
        - *tff

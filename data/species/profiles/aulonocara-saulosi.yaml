      value:
        min: 21
        max: 30
      confidence: low
      verification:
        method: unanimous
        votes:
          agree: 4
          total: 4
      rationale: "The settled tolerance is 21 to 30 C, with low confidence and unanimous agreement under the 1 C\
        \ comparison rule. Proposals are generator 21 to 30, checker-a 21 to 29, checker-b 21 to 30 and checker-c\
        \ 20 to 30 C. The decision excludes checker-c's wider lower margin of 20 C because the lake minimum is 21\
        \ C and no species-specific long-term evidence supports the extra degree. Nordic guidance gives 23 to 28\
        \ C, Fishipedia 23 to 27 C and the A. stuartgranti proxy 23 to 29 C. The extension to 30 C is a provisional\
        \ margin rather than a demonstrated long-term boundary or a preferred keeping temperature."

partners:
  suitable:
  - species: Peaceful Copadichromis species
    reason: Species guidance identifies this group as a potential companion with a different feeding position.
    condition: Choose a species of compatible adult size and provide the space its own social group requires.
  - species: Peaceful Lethrinops or Nyassachromis species
    reason: Elieson identifies these calmer Malawi groups as possible companions.
    condition: Provide adequate floor area and check feeding competition; the peacock minimum does not define a
      mixed-community tank size.
  unsuitable:
  - species: Other Aulonocara species
    reason: The presumed genus group records crossing risk and similar males may be treated as rivals.
  - species: Sciaenochromis fryeri
    reason: The presumed intergeneric group records peacock-directed spawning reports; male fryeri can also dominate
      peacock males.
  - species: Aggressive Lake Malawi mbuna
    reason: Species accounts describe this peacock as poorly suited to forceful or boisterous companions.
  - species: Fry and fish up to about 2 cm
    reason: The conservative predation level allows opportunistic capture; direct species-specific prey-size evidence
      is absent.
profile:
  overview:
    text: "Aulonocara saulosi is a Lake Malawi peacock known as Greenface or Emerald Face. Its type area lies near\
      \ Masinje. It is a different fish from the Taiwan Reef mbuna Chindongo saulosi. A small harem, calm companions\
      \ and room to forage over sand suit this relatively restrained peacock."
    sources:
    - *source001
    - *source005
    - *source006
  habitat:
    text: "Sand patches adjoining rocks provide its feeding habitat. FishBase records depths of 7 to 40 m, with\
      \ encounters concentrated around 12 m. Specialist accounts describe additional southern and eastern localities\
      \ beyond Masinje. The adopted lake envelope is 21 to 29 C, pH 7.7 to 8.6, GH 3 to 5 dGH and KH 5 to 8 dKH.\
      \ The alkaline water has modest calcium and magnesium hardness."
    sources:
    - *source005
    - *source011
    - *source016
    - *source015
  sizeAndGrowth:
    text: "Use about 13 cm for an adult male and 11 cm for a female when planning space. FishBase reports 9.2 cm\
      \ standard length, which excludes the tail fin and does not provide separate female measurements. Specialist\
      \ total-length figures vary. A planning lifespan of six to nine years is approximate; species-specific longevity\
      \ evidence is sparse."
    sources:
    - *source020
    - *source006
    - *source005
    - *source025
    - *source013
  husbandry:
    text: "Provide at least 300 L with a footprint about 125 by 45 cm for one male and three females. Leave much\
      \ of the floor as fine sand and arrange secure rocks as retreats and visual barriers. Use effective filtration,\
      \ good oxygenation and regular water changes. Species care recommendations cluster around 23 to 28 C. The\
      \ broader tolerance envelopes describe uncertain keeping limits and do not make their extremes preferred targets."
    sources:
    - *source020
    - *source034
    - *source019
  socialBehavior:
    text: "Males court several females rather than forming a lasting pair. A hierarchy and chasing are expected\
      \ in an aquarium, so females need routes out of the male's view. The Nordic account describes a small breeding\
      \ station near sand; Malawi.si describes roaming fish without a permanent territory. These observations favour\
      \ mild breeding defence rather than a large year-round territory."
    sources:
    - *source020
    - *source011
    - *source003
    - *source034
  diet:
    text: "The natural diet consists mainly of invertebrates obtained from sand. Offer suitably small cichlid pellets\
      \ or granules with varied invertebrate foods, and check that each fish gets a share. Prepared foods with some\
      \ plant ingredients can contribute variety. Species-specific evidence does not establish unusual bloat sensitivity.\
      \ The conservative predation assessment allows capture of fry or very small fish, although direct observations\
      \ for this peacock are lacking."
    sources:
    - *source005
    - *source006
    - *source034
    - *source036
  breeding:
    text: The female incubates eggs and young in her mouth. The Nordic account describes roughly three weeks of
      brooding and broods of a few dozen. Give brooding females quiet shelter and monitor harassment. Mixed peacock
      breeding can compromise offspring identity because females of different species are difficult to distinguish.
      The public CRC account confirms maternal mouthbrooding but does not supply detailed breeding observations.
    sources:
    - *source020
    - *source003
    - *source053
  sexing:
    text: "Adult males develop blue or greenish facial colour according to population, against a dark body with\
      \ a black marking near the dorsal-fin edge. Females and juveniles are brownish or silvery and can show subdued\
      \ bars. Size and colour help distinguish mature fish; juvenile colour alone is insufficient. A Greenface trade\
      \ label does not establish the collection locality."
    sources:
    - *source020
    - *source011
    - *source006
  compatibility:
    text: "Selected peaceful Malawi cichlids can share a sufficiently spacious aquarium. Elieson identifies calm\
      \ Copadichromis, Lethrinops and Nyassachromis as possible companions. Boisterous mbuna can overwhelm this\
      \ peacock. Other Aulonocara carry a presumed crossing risk. Reports of Sciaenochromis fryeri spawning with\
      \ peacock females support a second presumed risk, without establishing a named fryeri and saulosi brood. Keep\
      \ fry and very small fish out of an adult community."
    sources:
    - *source006
    - *source019
    - *source060
    - *source065
    - *source057
  problems:
    text: "Persistent chasing, hiding and missed meals indicate that the group or layout needs attention. Maintain\
      \ stable alkaline water and distinguish buffering from GH when assessing water supplies. A natural habitat\
      \ range is not a proven physiological failure threshold. Large retailer size claims, conflicting KH attributions\
      \ and genus-wide feeding descriptions add uncertainty, so the feature evidence preserves them alongside the\
      \ stronger species accounts."
    sources:
    - *source020
    - *source024
    - *source015
    - *source035
    - *source033

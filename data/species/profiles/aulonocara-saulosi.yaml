      \ use invertebrates and do not establish fish predation. WetWebMedia reports tolerance of released fry by\
      \ their own mothers, a narrower situation. Level 1 therefore protects fry and fish around 2 cm without claiming\
      \ a measured saulosi prey-size threshold or regular piscivory. Verification method: conservative."

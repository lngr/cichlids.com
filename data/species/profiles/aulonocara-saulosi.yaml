  temperatureC:
    value:
      min: 21
      max: 29
    confidence: high
    rationale: "Lake Malawi seasonal and regional measurements support a combined natural envelope of 21 to 29 C.\
      \ FishBase gives 22 to 26 C for this species; FAO lists a 23 to 25 C surface campaign and Branchu measures\
      \ 22.8 to 25.4 C through a northern water column. Those narrower observations do not cover all lake seasons.\
      \ The broader lake envelope governs the value, with waterbody verification; evidence distinguishes individual\
      \ campaigns from inherited lake-wide syntheses."

    rationale: "The conservative tally selects level 1 with low confidence after a 3:3 split. Generator, checker-a\
      \ and tiebreaker-1 propose 1; checker-b, checker-c and tiebreaker-2 propose 0. FishBase and species-specific\
      \ specialist accounts establish sand-associated invertebrate feeding, which supports the level 0 interpretation\
      \ but does not test fish capture. Furry Critter and Aqua-Fish give broader peacock warnings about small tankmates\

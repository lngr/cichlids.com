partners:
  suitable:
    - species: Cyathopharynx furcifer
      reason: Large, calm open-water Tanganyikan of similar temperament and the same water.
      condition: Tank of at least 240 cm; add the featherfins as adults.
    - species: Ophthalmotilapia ventralis
      reason: Peaceful Tanganyikan that uses the open water and is too large to be eaten as an adult.
      condition: Only fully grown fish of 12 cm or more.
    - species: Altolamprologus calvus
      reason: Slow, armoured cave dweller that ignores the frontosa and is ignored in return.
      condition: Add as adults of at least 12 cm, never as juveniles.
    - species: Synodontis multipunctatus
      reason: Robust Tanganyikan catfish that uses the bottom and is too spiny and large to be eaten.
      condition: Brood parasite of mouthbrooders; can disturb frontosa broods, so not in a breeding tank.
  unsuitable:
    - species: Tropheus moorii
      reason: Hasty, quarrelsome aufwuchs feeder that stresses the calm frontosa and needs a low-protein diet the frontosa does not share.
    - species: Cyprichromis leptosoma
      reason: Small open-water fish that the frontosa hunts at night.
    - species: Neolamprologus multifasciatus
      reason: Shell dweller small enough to be swallowed whole.
    - species: Cyphotilapia gibberosa
      reason: Sister species from the south of the lake in the same hybrid group; both cross and the offspring cannot be identified.
    - species: Maylandia zebra
      reason: Hasty, aggressive Malawi mbuna with a plant-based diet; it outcompetes the frontosa at feeding.
    - species: Amphilophus citrinellus
      reason: Aggressive Central American cichlid that attacks the slow frontosa and needs different water.

profile:
  overview:
    text: >-
      Cyphotilapia frontosa is one of the classic large cichlids of Lake Tanganyika. Its broad black
      bars on a white body, the blue fins and the growing forehead hump of adult males make it a
      showpiece for big tanks. Despite its size it is a calm colony fish that moves slowly and lives
      for many years. In 2003 the southern populations were described as a species of their own,
      Cyphotilapia gibberosa, and genetic data support the split; this includes all blue 'Zaire'
      forms such as Moba, as well as Mpimbwe, Kipili and the Zambian forms. This profile covers only
      the northern species: Burundi, the seven-bar Kigoma form and the other northern localities.
      Buy fish with a clear locality name and keep forms apart, because the two species and their
      forms cross readily.
    sources:
      - *cof
      - *sf
      - *takahashi2003
      - *jackson2024
  habitat:
    text: >-
      The species lives only in the northern half of Lake Tanganyika, from Burundi south to Bulu
      Point on the Tanzanian coast and Cape Tembwe on the Congo coast. It prefers rocky slopes covered
      with sediment, with boulders and sand between them, mostly at 15 to 50 metres and occasionally
      much deeper. Large fish stay deeper than young ones. In the wild the fish form loose schools of
      dozens to hundreds above the rocks. The lake water is warm, very stable, hard and strongly
      alkaline, with a pH near 9 and a high carbonate hardness. Because it lives so deep, wild fish
      have to be brought up slowly over days, which made wild imports expensive.
    sources:
      - *fishbase
      - *sf
      - *adw
      - *plisnier1
      - *cohen
  sizeAndGrowth:
    text: >-
      Males usually reach about 33 cm in the aquarium, rarely more; females stay at about 25 cm.
      Growth is slow: young fish of 3 to 5 cm need several years to reach adult size, and sexual
      maturity comes after about two to three years. The hump on the forehead only develops with age
      and is much larger in males. Fish kept too long in small tanks remain stunted and do not reach
      their full size or colour, so plan the final tank from the start.
    sources:
      - *fishbase
      - *fk
      - *tfwf
      - *sf
  husbandry:
    text: >-
      A group needs a tank of at least 240 x 60 x 60 cm, about 860 litres, and more depth is
      welcome. Use sand and a few large, stable rock structures with caves big enough for the largest
      male, but leave most of the tank open for swimming. Avoid sharp edges because the fish startle
      easily. The water should be hard and alkaline, pH about 8 to 9, at 24 to 26 C; soft tap water
      needs buffering to a carbonate hardness of about 10 dKH or more. Frontosa react badly to
      nitrate build-up and to an immature filter, so install strong filtration with gentle flow and
      change 30 to 50 percent of the water every week. Subdued light suits these deep-water fish.
    sources:
      - *sf
      - *fk
      - *tfwf
      - *fstores
  socialBehavior:
    text: >-
      Frontosa live in groups with a clear ranking. One dominant male, sometimes two in large tanks,
      claims the best cave and displays to rivals, while the other fish share the open water. Keep at
      least five fish, ideally one male with three or more females, so that courtship and aggression
      are spread out. Fights rarely cause injuries if the tank is large enough. Towards other species
      the frontosa is calm and even shy, but it is a predator: fish small enough to fit into its mouth
      are eaten, mostly at night or at dawn while they rest.
    sources:
      - *sf
      - *fk
      - *tfwf
      - *archive13172
  diet:
    text: >-
      In the wild the frontosa eats fish, mussels, snails, shrimps and even jellyfish; larger adults
      take more fish. Studies disagree on whether fish or invertebrates make up the larger share, so
      the catalog treats it as a fish eater when it checks tankmates. In the aquarium a quality
      sinking pellet for large carnivorous cichlids works well as the staple, completed with frozen
      krill, Mysis, shrimp, mussel or cockle meat and pieces of marine fish. A food with some
      spirulina adds variety. Do not feed beef heart, chicken or other mammal and bird meat, because
      the fish cannot digest these fats well. Live feeder fish are not needed and bring a risk of
      disease. Feed adults once a day, enough to be eaten within a few minutes, and make sure that
      faster tankmates do not take all the food.
    sources:
      - *jackson2026
      - *huyghe2025
      - *sf
      - *fk
  breeding:
    text: >-
      The frontosa is a maternal mouthbrooder. A mature male cleans a spot, often in or near a cave,
      and courts one female after another. Each female lays only 10 to 50 large eggs, which she takes
      into her mouth one by one. She carries the brood for five to seven weeks and feeds the young
      inside her mouth with small food particles, so they leave as well-developed fry of about 1.5 cm.
      Feed brooding females small food such as Artemia, as they keep eating. Fry accept Artemia
      nauplii and crushed flakes at once and grow slowly. Breeding needs patience: fish rarely spawn
      before they are three years old.
    sources:
      - *sf
      - *fk
      - *fishbase
      - *tfwf
  sexing:
    text: >-
      Juveniles cannot be sexed. Adult males grow much larger than females, develop a bigger forehead
      hump and longer fins, especially the ventral and dorsal fins. Females stay smaller with a lower
      hump and shorter fins. In a group the largest fish with the biggest hump is usually the
      dominant male, but slow growth means that the sexes only become clear after two to three years.
      Venting by an experienced keeper is the only reliable method for younger fish.
    sources:
      - *sf
      - *fk
  compatibility:
    text: >-
      The best companions are calm Lake Tanganyika fish that are too large to be eaten and do not
      outcompete the frontosa at feeding. Featherfin cichlids such as Cyathopharynx and
      Ophthalmotilapia, adult Altolamprologus calvus and robust Synodontis catfish are proven choices.
      Small species such as Cyprichromis, shell dwellers and juvenile fish of any kind end up as food.
      Hasty and pushy fish like Tropheus or Malawi mbuna stress the frontosa and take its food, and
      aggressive Central American cichlids do not belong with it. Never mix it with Cyphotilapia
      gibberosa or keep different locality forms together, because they cross.
    sources:
      - *tfwf
      - *fk
      - *sf
      - *jackson2024
  problems:
    text: >-
      The most common mistake is a tank that is too small: the fish then stunt, grow nervous and the
      dominant male harasses the others. Rapid changes in hardness or pH, high nitrate and a new,
      immature filter are poorly tolerated; signs are clamped fins, fast breathing and fish gasping
      at the surface. Fatty meat from mammals or birds leads to fat deposits and organ damage over the
      years. Feeder fish can introduce parasites. Frontosa startle easily, so sudden light or
      movement can make them crash into rocks or the glass. Stripping females of their brood too early
      weakens them. If a fish lies apart and stops eating, check the water values first and consult a
      fish veterinarian.
    sources:
      - *sf
      - *fk
      - kind: archive
        title: cichlids.com forum thread 999
        url: https://www.cichlids.com/disc/read.php?1,999
        accessed: 2026-10-12


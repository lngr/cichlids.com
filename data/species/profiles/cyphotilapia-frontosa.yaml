  predation:
    value: 2
    confidence: high
    rationale: >-
      All three votes agree on level 2, which the rubric illustrates with this very species. Fish
      are a regular prey: FishBase lists fish next to snails and mussels, Seriously Fish describes a
      generalised predator that takes much smaller fishes, Tanganyika.si calls adults primarily
      piscivorous and reports tankmates up to nearly half the frontosa's length being eaten, and
      Jackson et al. (2026) summarise field reports of adults hunting Cyprichromis and
      Paracyprichromis and find fish dominant in the isotope signal at the Burundi site. In the
      tank it hunts slowly, mostly at dusk and at night, and swallows resting fish that fit into its
      mouth; keepers in the cichlids.com archive report small Malawi cichlids disappearing this
      way. Molluscs, crustaceans and jellyfish make up a large share of the wild diet at many

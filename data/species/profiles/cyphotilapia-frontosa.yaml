    pt-BR: [Frontosa]

variants:
  - name: Burundi
    kind: locality
    note: Six dark bars on a white body, blue-tinged fins; the most common northern form in the trade, often captive bred.
  - name: Kigoma
    kind: locality
    note: Seven-bar form from the type locality region in Tanzania; the only form with seven body bars.
  - name: Mwamgongo
    kind: locality
    note: North of Kigoma; fish show six or seven bars, some with different counts on each side.
  - name: Bulu Point
    kind: locality
    note: Southern end of the range on the Tanzanian coast.
  - name: Cape Kabogo
    kind: locality
    note: Central Tanzanian coast; carries some gibberosa ancestry from the hybrid zone.
  - name: Kavala
    kind: locality
    note: Congo coast, sold as 'Zaire Kavalla'.
  - name: Kitumba
    kind: locality
    note: Congo coast; whether it belongs to C. frontosa or C. gibberosa is unresolved.
  - name: Red (Copperband)
    kind: color-morph
    note: Captive strain with reddish-brown instead of black bars.
  - name: Black Widow
    kind: color-morph
    note: Captive strain in which the bars are broken into large blotches.


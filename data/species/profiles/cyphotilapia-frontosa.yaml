  ph:
    value: {min: 8.4, max: 9.4}
    confidence: high
    rationale: >-
      Lake endemic, so the natural pH is the measured range of Lake Tanganyika. Over an annual cycle
      at Bujumbura, Kigoma and Mpulungu the surface water has pH 8.8 to 9.2 and the water at 40 m
      8.47 to 9.40, which gives 8.4 to 9.4. An older compilation of pH 7.3 to 7.8 contradicts the
      high alkalinity and all modern measurements and is not used.
    sources: *lakesources
    evidence:
      - source: *plisnier1
        value: {min: 8.47, max: 9.4}
        note: 40 m depth over one year; surface water 8.8 to 9.2
    verification:
      method: waterbody
      waterbody: lake-tanganyika
    tolerance:
      value: {min: 8.0, max: 9.4}
      confidence: medium
      rationale: >-
        Seriously Fish, Fishkeeper and Fishkeeping World give pH 8.0 to 9.0, and FishBase after the
        Aquarien Atlas gives 8.0 without an upper limit. A minority goes lower: FishProfiles and
        Fishstores 7.8, TropicalFreshwaterFish 7.5 with an optimum of 8.2, Aqua-Fish 7.0. The lower
        limit follows the most frequent value of 8.0; the upper limit is the lake maximum of 9.4,
        because the tolerance contains the natural range. A stable pH matters more than the exact
        figure. The votes agree within 0.3 pH (8.0, 8.0 and 7.8 as lower bounds); the median is 8.0
        to 9.4.
      sources:

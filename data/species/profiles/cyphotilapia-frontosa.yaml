schemaVersion: 1
id: cyphotilapia-frontosa
legacyIds: [35]
status: described

taxonomy:
  validName: Cyphotilapia frontosa
  genus: Cyphotilapia
  species: frontosa
  author: (Boulenger, 1906)
  source: &cof
    kind: catalog-of-fishes
    title: Eschmeyer's Catalog of Fishes, species list of the genus Cyphotilapia (online version of 21 Sep. 2026)
    url: https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Cyphotilapia
    accessed: 2026-10-12
  synonyms:
    - name: Paratilapia frontosa
      note: Original combination, Boulenger 1906, type locality Kigoma, Tanzania.
    - name: Pelmatochromis frontosus
      note: Earlier combination listed by FishBase and Seriously Fish.
    - name: Cyphotilapia frontosus
      note: Spelling with a masculine ending, listed by FishBase.
  legacyNames:
    - Cyphotilapia frontosa
  note: >-
    The Catalog of Fishes lists two valid species in the genus. Cyphotilapia frontosa lives in the
    northern half of Lake Tanganyika; C. gibberosa Takahashi and Nakaya 2003, described from the
    southern half (holotype from Kasenga, Zambia), has three instead of two scale rows between the
    upper and lower lateral line, a deeper body, a longer dorsal-fin base and longer pectoral fins.
    Konings (2015, 2019) treats C. gibberosa as a synonym of C. frontosa; the catalog follows
    Jackson et al. (2024), whose ddRAD data separate a northern and a southern species with a
    narrow hybrid zone in the middle of the east coast. This profile covers the northern species:
    the six-bar forms from Burundi and the Congo coast north of Cape Tembwe, the seven-bar Kigoma
    form, Mwamgongo, Cape Kabogo, Karilani Island and Bulu Point. The blue southern forms belong to
    C. gibberosa and need a profile of their own: all fish sold as 'Blue Zaire' (Moba, Kapampa,
    Mikula), the Tanzanian forms Mpimbwe, Kipili, Ikola, Kantalamba and Wampembe, and the Zambian
    forms. The placement of 'Kitumba' is unresolved. Legacy entry 35 predates the split, when the
    genus counted as monotypic, so the legacy photos stored under it probably include forms of C.
    gibberosa as well, above all the blue 'Zaire' and Zambian fish.

names:
  trade:
    en: [Frontosa, Humphead cichlid, Front]

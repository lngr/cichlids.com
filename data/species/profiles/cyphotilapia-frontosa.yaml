      waterbody: Lake Tanganyika
      localities:
        - Burundi coast (Bujumbura, Magara, Nyanza)
        - Kigoma (type locality)
        - Mwamgongo
        - Cape Kabogo
        - Karilani Island
        - Bulu Point
        - Kavala
        - Kabimba
        - Ubwari
        - Cape Tembwe
    confidence: high
    rationale: >-
      Endemic to Lake Tanganyika. The Catalog of Fishes and FishBase restrict it to the northern
      half of the lake, and the description of C. gibberosa places the southern populations in that
      species. Seriously Fish names Cape Tembwe on the western and Bulu Point on the eastern shore
      as the southern limits. Jackson et al. (2024) sampled the species from Burundi to Karilani
      Island and Cape Kabogo, where the populations carry the most gibberosa ancestry, and found C.
      gibberosa further south. It lives on sediment-covered rocky slopes, mostly at 15 to 50 m.

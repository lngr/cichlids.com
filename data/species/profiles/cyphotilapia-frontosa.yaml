  temperatureC:
    value: {min: 23, max: 29}
    confidence: high
    rationale: >-
      Lake endemic, so the natural temperature is the measured range of Lake Tanganyika. Hourly buoy
      readings at Mpulungu span 23.85 to 29.01 C; the south of the lake is cooler and more variable
      from June to September because of upwelling. This gives 23 to 29 C. The species lives mostly
      at 15 to 50 m, below the warmest surface layer.
    sources: &lakesources
      - &plisnier1
        kind: literature
        title: >-
          Plisnier, P.-D., Langenberg, V., Mwape, L., Chitamwembwa, D., Tshibangu, K. and Coenen,
          E. (1996). Limnological sampling during an annual cycle at three stations on Lake
          Tanganyika (1993-1994). FAO/FINNIDA Research for the Management of the Fisheries on Lake
          Tanganyika, GCP/RAF/271/FIN-TD/46.
        url: https://fao.org/fishery/static/LTR/FTP/TD46.PDF
        accessed: 2026-10-12
      - &plisnier2

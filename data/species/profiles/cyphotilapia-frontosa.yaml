  disagreements:
    - field: taxonomy.synonyms
      proposals:
        - by: generator
          value: [Paratilapia frontosa, Pelmatochromis frontosus, Cyphotilapia frontosus]
        - by: checker-a
          value: [Paratilapia frontosa, Pelmatochromis frontosus, Cyphotilapia frontosus]
        - by: checker-b
          value: [Paratilapia frontosa]
      decision: [Paratilapia frontosa, Pelmatochromis frontosus, Cyphotilapia frontosus]
      rationale: >-
        FishBase lists the Pelmatochromis combination and the masculine spelling next to the
        original combination; both occur in older literature and the trade and help to find the
        species, so all three are kept with notes.
    - field: features.origin.value.waterbody
      proposals:
        - by: generator
          value: Lake Tanganyika
        - by: checker-a
          value: Lake Tanganyika
        - by: checker-b
          value: lake-tanganyika
      decision: Lake Tanganyika
      rationale: Both spellings name the same entry of the water body table; the name form is used, as in the other proposals.
    - field: features.origin.value.localities
      proposals:
        - by: generator
          value: [Burundi coast (Bujumbura, Magara, Nyanza), Kigoma, Mwamgongo, Cape Kabogo, Karilani Island, Bulu Point, Kavala, Kabimba, Ubwari, Cape Tembwe]
        - by: checker-a
          value: [Kigoma (type locality), Bujumbura, Magara, Nyanza, Bulu Point, Kabimba, Kavala, Ubwari, Tembwe]
        - by: checker-b
          value: [Kigoma, Burundi]
      decision: [Burundi coast (Bujumbura, Magara, Nyanza), Kigoma (type locality), Mwamgongo, Cape Kabogo, Karilani Island, Bulu Point, Kavala, Kabimba, Ubwari, Cape Tembwe]
      rationale: >-
        The lists do not contradict each other; the generator's list is the most complete and
        includes the southernmost populations sampled by Jackson et al. (2024). The type locality
        is marked as in checker-a.
    - field: features.ph.tolerance
      proposals:
        - by: generator
          value: {min: 8.0, max: 9.4}
        - by: checker-a
          value: {min: 8.0, max: 9.4}
        - by: checker-b
          value: {min: 7.8, max: 9.4}
      decision: {min: 8.0, max: 9.4}
      rationale: Decided by the vote count (unanimous, 3 of 3 within 0.3 pH); the median of the agreeing bounds is 8.0 to 9.4.
    - field: features.ghDgh.tolerance
      proposals:
        - by: generator
          value: {min: 8, max: 25}
        - by: checker-a
          value: {min: 8, max: 25}
        - by: checker-b
          value: {min: 8, max: 22}
        - by: tiebreaker-1
          value: {min: 8, max: 25}
        - by: tiebreaker-2
          value: {min: 10, max: 22}
      decision: {min: 10, max: 22}
      rationale: >-
        Decided by the vote count (conservative, 3 of 5): the top proposal of 8 to 25 dGH has only
        three agreeing votes, fewer than the four a qualified majority needs, so the tolerance is
        the intersection of all votes, 10 to 22 dGH, which contains the natural 10 to 13 dGH.
        Confidence is low.
    - field: features.khDkh.tolerance
      proposals:
        - by: generator
          value: {min: 10, max: 20}
        - by: checker-a
          value: {min: 10, max: 20}
        - by: checker-b
          value: {min: 12, max: 20}
      decision: {min: 10, max: 20}
      rationale: Decided by the vote count (unanimous, 3 of 3 within 2 dKH); the median of the agreeing bounds is 10 to 20.
    - field: features.maxSizeCm
      proposals:
        - by: generator
          value: {male: 33, female: 25}
        - by: checker-a
          value: {male: 30, female: 25}
        - by: checker-b
          value: {male: 35, female: 25}
      decision: {male: 33, female: 25}
      rationale: >-
        All agree on 25 cm for females. For males FishBase gives 33 cm total length and Seriously
        Fish about 32 cm total length, while TropicalFreshwaterFish, Tanganyika.si and Animal
        Diversity Web give 35 cm and Aqua-Fish 25 to 30 cm in the tank. 33 cm is the median
        proposal and matches the two most reliable databases.
    - field: features.diet
      proposals:
        - by: generator
          value: {type: piscivore, bloatSensitive: false, foods: [sinking cichlid pellets and sticks, krill and Mysis, shrimp and prawn, mussel and cockle meat, whole marine fish pieces, some spirulina-based food]}
        - by: checker-a
          value: {type: piscivore, bloatSensitive: false, foods: [small fish, mussels, snails, shrimps and other crustaceans, jellyfish (Limnocnida), zooplankton, insect larvae]}
        - by: checker-b
          value: {type: invertivore, bloatSensitive: false, foods: [mussels, snails, crustaceans, fish, zooplankton]}
        - by: tiebreaker-1
          value: {type: piscivore, bloatSensitive: false, foods: [fish, molluscs, crustaceans, insect larvae, zooplankton]}
        - by: tiebreaker-2
          value: {type: invertivore, bloatSensitive: false, foods: [molluscs, macro-invertebrates, small fish]}
      decision: {type: piscivore, bloatSensitive: false}
      rationale: >-
        Decided by the vote count (conservative, 3 of 5): piscivore has three votes and
        invertivore two, so no proposal reached a qualified majority and the strictest proposed
        type, piscivore, applies with low confidence; bloatSensitive is false in every vote. The
        food list merges the wild prey named by the checkers and tie-breakers with the aquarium
        foods of the generator.
    - field: features.territory
      proposals:
        - by: generator
          value: {size: small, breedingOnly: false}
        - by: checker-a
          value: {size: small, breedingOnly: false}
        - by: checker-b
          value: {size: small, breedingOnly: true}
      decision: {size: small, breedingOnly: false}
      rationale: >-
        Seriously Fish describes the alpha male selecting a particular cave without tying it to spawning;
        only some sources mention loosely defended spawning sites. A lasting claim on a cave is the
        better description and the more cautious value for the compatibility check.
    - field: features.habitatZones
      proposals:
        - by: generator
          value: [rock, sand, openWater]
        - by: checker-a
          value: [rock, sand, openWater]
        - by: checker-b
          value: [rock, sand]
      decision: [rock, sand, openWater]
      rationale: >-
        The species is benthopelagic and schools in the water column above the rocks (Seriously
        Fish, FishBase, Animal Diversity Web), and the tank needs plenty of open swimming space, so
        open water is part of its habitat even though it does not live in the pelagic zone.
    - field: features.social
      proposals:
        - by: generator
          value: {structure: group, minGroup: 5}
        - by: checker-a
          value: {structure: group, minGroup: 5}
        - by: checker-b
          value: {structure: harem, ratio: 4}
      decision: {structure: group, minGroup: 5}
      rationale: >-
        The species lives in large aggregations and the care sources name a minimum group of five
        rather than a fixed harem; the recommended female surplus is described in the rationale.
    - field: features.minTank
      proposals:
        - by: generator
          value: {volumeL: 860, lengthCm: 240, depthCm: 60}
        - by: checker-a
          value: {volumeL: 860, lengthCm: 240, depthCm: 60}
        - by: checker-b
          value: {volumeL: 600, lengthCm: 200, depthCm: 50}
      decision: {volumeL: 860, lengthCm: 240, depthCm: 60}
      rationale: >-
        Seriously Fish, Fishkeeper and Tanganyika.si agree on about 860 to 1000 litres and 240 cm
        for a group of adults; the smaller figures of 470 to 600 litres refer to three adults or
        to young fish and fall short of the minimum group of five.

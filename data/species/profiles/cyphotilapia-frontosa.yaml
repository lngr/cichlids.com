  diet:
    value:
      type: piscivore
      bloatSensitive: false
      foods:
        - fish
        - mussels and snails
        - shrimps and other crustaceans
        - jellyfish (Limnocnida)
        - zooplankton and insect larvae
        - sinking pellets and sticks for large carnivorous cichlids
        - frozen krill, Mysis, shrimp and mussel meat
        - pieces of marine fish
    confidence: low
    rationale: >-
      The diet is carnivorous throughout; plant matter plays no real role. The sources split on
      whether fish or invertebrates dominate, and so did the five votes: three chose piscivore and
      two invertivore. For piscivore speak the metagenomic gut content study of Huyghe et al.
      (2025), which places wild C. frontosa from the Kigoma area in the fish-eating cluster of
      Tanganyikan cichlids while C. gibberosa falls among the invertebrate feeders, field reports
      of adults hunting small cichlids, Tanganyika.si and the summary line of the Cichlid Room
      Companion. For invertivore speak the isotope mixing model of Jackson et al. (2026), which
      gives mussels, jellyfish and fish similar shares and fish the main share only at Burundi,
      based on juveniles and small adults; Seriously Fish describes a generalised predator of fish,
      macro-invertebrates and molluscs, and Animal Diversity Web names shellfish first. FishBase
      and Fishkeeper call the species omnivorous with shellfish and fish. With no four-vote majority
      the vote count takes the conservative value, the strictest diet type proposed: piscivore,
      with low confidence. The compatibility check thus treats the species as a fish eater on a
      high-protein diet, which is the cautious reading for tankmates. Invertebrates remain a large
      part of the natural diet, especially in young fish. All votes agree that the species is not
      bloat-sensitive: no source reports bloat, and the only feeding warning concerns fatty meat of
      mammals and birds.

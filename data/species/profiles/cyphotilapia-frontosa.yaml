  hybridGroups:
    value: [cyphotilapia]
    confidence: medium
    rationale: >-
      All three votes agree on the group cyphotilapia with the members Cyphotilapia frontosa and
      Cyphotilapia gibberosa. The two sister species differ only in scale counts and body
      proportions (Takahashi and Nakaya 2003), and the Catalog of Fishes records both the
      synonymisation by Konings and the revalidation. Jackson et al. (2024) found a hybrid zone in
      the middle of the east coast with introgression in both directions, and Tanganyika.si reports
      that the intermediate central populations may be of hybrid origin, so the two cross under
      natural conditions. In the trade the blue southern forms are often sold as frontosa, and
      Seriously Fish stresses that populations are labelled by locality to keep pure lines. Keeping
      both species, or different locality forms, in one tank produces crosses that cannot be told
      apart from either parent.

  ghDgh:
    value: {min: 10, max: 13}
    confidence: high
    rationale: >-
      Lake endemic, so the natural total hardness is the measured range of Lake Tanganyika,
      magnesium-rich water in which magnesium far exceeds calcium. With dGH = Ca/7.14 + Mg/4.34, the
      surface means of the FAO/FINNIDA programme at Bujumbura, Kigoma and Mpulungu give 11.1 to 11.5
      dGH, the north basin data of Cohen et al. 12.2 to 12.3 dGH and the values of Talling and
      Talling 11.3 dGH. This gives 10 to 13 dGH.
    sources: *lakesources
    evidence:
      - source: *plisnier1
        value: {min: 11.1, max: 11.5}
        note: surface means at Bujumbura, Kigoma and Mpulungu, computed from Ca and Mg
      - source: *cohen
        value: {min: 12.2, max: 12.3}
        note: north basin surface water, computed from Ca 12.2 to 12.4 and Mg 45.4 to 45.7 mg/L
      - source: *faosb
        value: {min: 11.3, max: 11.3}
        note: Ca 9.8 and Mg 43.3 mg/L after Talling and Talling (1965), computed
    verification:
      method: waterbody
      waterbody: lake-tanganyika
    tolerance:
      value: {min: 10, max: 22}
      confidence: low
      rationale: >-
        The care sources ask for hard water but differ widely in the band: FishBase after the
        Aquarien Atlas 8 to 12 dGH, TropicalFreshwaterFish 8 to 22 with 12 preferred, Seriously
        Fish 10 to 25, Fishkeeper 15 to 25, Fishstores 12 to 20, Guidarium 12 to 25 and Fishkeeping
        World 12 to 14; Aqua-Fish gives 12 to 30 without saying which hardness it means, and the
        Flowgrow database 7 to 14 together with a pH that contradicts all other sources. Accordingly
        the five votes split: three proposed 8 to 25, one 8 to 22 and one 10 to 22, so no proposal
        reached the four agreeing votes a qualified majority needs. The value is therefore the
        conservative one, the intersection of all votes: 10 dGH, the lower bound of Seriously Fish
        and of the natural lake range, to 22 dGH, the upper bound of TropicalFreshwaterFish. The
        narrower range makes the compatibility check warn earlier, and it still contains the
        natural 10 to 13 dGH. Fish are kept in softer water down to about 8 dGH and in harder water
        up to 25 dGH according to some care sheets, so the limits are cautious rather than
        measured. Stable water matters more than the exact figure; carbonate hardness and pH
        are the decisive values for this species.
      sources:
        - *sf
        - *fk
        - *tfwf
        - *fishbase
        - *fstores
        - &guidarium
          kind: database
          title: Guidarium, Frontosa
          url: https://guidarium.com/fishes/frontosa
          accessed: 2026-10-12
        - &flowgrow
          kind: database
          title: Flowgrow database, Cyphotilapia frontosa
          url: https://www.flowgrow.de/db/fish/cyphotilapia-frontosa
          accessed: 2026-10-12
        - *aquafish
        - *fkw
        - *bya
        - *plisnier1
      evidence:
        - source: *sf
          value: {min: 10, max: 25}
          note: aquarium recommendation
        - source: *fk
          value: {min: 15, max: 25}
          note: aquarium recommendation, given as dH
        - source: *tfwf
          value: {min: 8, max: 22}
          note: aquarium recommendation, given as dH, 12 preferred
        - source: *fishbase
          value: {min: 8, max: 12}
          note: aquarium value after Riehl and Baensch
        - source: *fstores
          value: {min: 12, max: 20}
          note: aquarium recommendation
        - source: *guidarium
          value: {min: 12, max: 25}
          note: aquarium recommendation
        - source: *flowgrow
          value: {min: 7, max: 14}
          note: low weight; its pH of 7 to 8 contradicts the lake and the other sources
        - source: *aquafish
          value: {min: 12, max: 30}
          note: German degrees without saying whether total or carbonate hardness
        - source: *fkw
          value: {min: 12, max: 14}
          note: aquarium recommendation
        - source: *bya
          value: {min: 10, max: 20}
          note: aquarium recommendation
        - source: *plisnier1
          value: {min: 11.1, max: 11.5}
          note: natural lake water
      verification:
        method: conservative
        votes: {agree: 3, total: 5}

  khDkh:
    value: {min: 15, max: 20}
    confidence: high
    rationale: >-
      Lake endemic, so the natural carbonate hardness is the measured range of Lake Tanganyika,
      strongly buffered bicarbonate water. With dKH = meq/L x 2.8, the alkalinity of 6.5 to 6.6
      meq/L (Cohen et al.), 6.71 meq/L (Talling and Talling) and 6.7 to 6.9 meq/L (Edmond et al.
      1993 as cited by Langenberg) gives 18.2 to 19.3 dKH; the bicarbonate and carbonate titrations
      of the FAO/FINNIDA programme reach down to about 15.4 dKH. This gives 15 to 20 dKH. Sodium and
      potassium bicarbonate make the carbonate hardness exceed the total hardness.
    sources: *lakesources
    evidence:
      - source: *cohen
        value: {min: 18.2, max: 18.5}
        note: alkalinity 6.5 to 6.6 meq/L, north basin
      - source: *faosb
        value: {min: 18.8, max: 18.8}
        note: alkalinity 6.71 meq/L after Talling and Talling (1965)
      - source: *langenberg
        value: {min: 18.8, max: 19.3}
        note: alkalinity 6.7 to 6.9 meq/L after Edmond et al. (1993)
    verification:
      method: waterbody
      waterbody: lake-tanganyika
    tolerance:
      value: {min: 10, max: 20}
      confidence: low
      rationale: >-
        Few care sources give a carbonate hardness for this species. Fishstores names 12 to 20 dKH;
        Aqua-Fish gives 12 to 30 German degrees without saying whether this is total or carbonate
        hardness. Seriously Fish and the other care sheets ask for hard, alkaline and stable water
        and warn that untreated soft tap water is unsuitable. A pH of 8 or more, the floor of the
        pH tolerance, needs a strong carbonate buffer in the aquarium; about 10 dKH as the lower
        limit comes from general Tanganyika husbandry knowledge, not from a figure for this
        species. The upper limit is the natural maximum. The votes agree within 2 dKH (10, 10 and
        12 as lower bounds); the median is 10 to 20. Needs confirmation.
      sources:
        - *fstores
        - *aquafish
        - *sf
        - *cohen
        - kind: model-knowledge
          title: General husbandry knowledge on buffering Lake Tanganyika aquaria
      evidence:
        - source: *fstores
          value: {min: 12, max: 20}
          note: aquarium recommendation, not below 12
        - source: *aquafish
          value: {min: 12, max: 30}
          note: German degrees, type of hardness not stated
        - source: *cohen
          value: {min: 18.2, max: 18.5}
          note: natural lake water, north basin
        - source:
            kind: model-knowledge
            title: General husbandry knowledge on buffering Lake Tanganyika aquaria
          value: {min: 10, max: 20}
          note: estimate of the buffer needed to hold pH 8 or more
      verification:
        method: unanimous
        votes: {agree: 3, total: 3}


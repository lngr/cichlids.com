  diet:
    value:
      type: aufwuchs
      bloatSensitive: true
    confidence: low
    rationale: "The settled tally conservatively selects aufwuchs with bloatSensitive true and confidence low.
      Generator proposed omnivore/true, checker-a invertivore/false, checker-b omnivore/false, checker-c
      aufwuchs/true, and both tiebreaker-1 and tiebreaker-2 omnivore/true. No proposal has the required
      qualified majority: the tally reports the largest agreeing coalition as 3 of 6, which is not three votes
      for aufwuchs. Its conservative rule selects the most restrictive proposed diet and retains a positive
      bloat flag. Einrichtungsbeispiele recommends plant-based feeding, and Cichlid Atlas recommends a
      plant-rich staple while warning about protein-heavy feeding. NVC and AquaInfo emphasize small animal
      prey, Malawi.si describes invertebrates with detritus, and Fishipedia uses an animal-food category; all
      dissenting interpretations remain evidence. Upstream Fryer diatom records were not independently
      verifiable through fetch-oa because the paper is non-OA. The bloat flag is a precaution drawn from group
      husbandry advice, without confirmed species-specific disease cases. Plant-based staple feeding is
      consistent with this planner decision, with animal foods supplementary."

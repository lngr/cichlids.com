  habitatZones:
    value:
      - sand
    confidence: high
    rationale: "Generator proposed sand, checker-a sand plus rock, and checker-b and checker-c sand plus
      openWater. FishBase identifies an open sandy bottom and NVC describes sediment feeding. Rocks can
      provide aquarium shelter without becoming the defining natural habitat, and swimming just above sand
      does not establish a separate open-water specialization. Sand alone therefore represents the supported
      ecological requirement; the other proposals and their supporting evidence remain recorded."

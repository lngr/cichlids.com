partners:
  suitable:
    - species: Calm Lake Malawi cichlids with a plant-based staple diet
      reason: "Sources support a carefully selected Malawi community, provided companions do not monopolize feeding
        or harass the group."
      condition: Size the complete community beyond this species minimum where necessary and retain a broad sand area.
  unsuitable:
    - species: Melanochromis auratus
      reason: Its forceful territorial behavior can overwhelm this comparatively calm substrate forager.
    - species: Fish needing an animal-protein-rich staple diet
      reason: Their feeding requirement conflicts with the settled aufwuchs diet and positive bloat-sensitive flag.
profile:
  overview:
    text: "A group of Gephyrochromis moorii needs a broad sandy floor where the fish can search the substrate
      together. This Lake Malawi mbuna relative is generally calmer than many rock-dwelling forms, although
      adult males still compete. Males develop blue and silvery areas with orange upper coloration; females
      are usually smaller and less vivid. The species retains its original scientific name and is a maternal
      mouthbrooder. Feeding accounts disagree about the balance of algae and animal prey, so this profile uses
      the pipeline's cautious plant-based feeding decision. It remains suitable for a carefully chosen Malawi
      community."
    sources:

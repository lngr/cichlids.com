    - field: partners
      proposals:
        - by: generator
          value:
            suitable:
              - species: Copadichromis borleyi
                reason: A robust open-water Malawi cichlid with compatible lake chemistry; choose similar-sized adults and
                  adequate swimming room.
              - species: Placidochromis electra
                reason: A comparatively calm sand-associated Malawi hap that uses similar water; provide a long tank and avoid
                  crowding.
              - species: Gephyrochromis lawsi
                reason: A close ecological match with similar sand-oriented habits; use a spacious tank and monitor male
                  competition.
            unsuitable:
              - species: Melanochromis auratus
                reason: Persistent aggression and strong rock territory defense are likely to overwhelm the calmer
                  sand-dweller.
              - species: Pseudotropheus crabro
                reason: "A larger, forceful mbuna that can dominate food and shelter in a mixed tank."
              - species: Neolamprologus leleupi
                reason: A Lake Tanganyika species with different natural water chemistry and a territorial rock-dwelling
                  lifestyle.
      decision:
        suitable:
          - species: Calm Lake Malawi cichlids with a plant-based staple diet
            reason: "Sources support a carefully selected Malawi community, provided companions do not monopolize feeding
              or harass the group."
            condition: Size the complete community beyond this species minimum where necessary and retain a broad sand
              area.
        unsuitable:
          - species: Melanochromis auratus
            reason: Its forceful territorial behavior can overwhelm this comparatively calm substrate forager.
          - species: Fish needing an animal-protein-rich staple diet
            reason: Their feeding requirement conflicts with the settled aufwuchs diet and positive bloat-sensitive flag.
      rationale: The proposed named companions are ecological suggestions rather than verified pairings. An
        animal-rich diet for some suggested haps conflicts with the settled aufwuchs decision. The final
        recommendations therefore require a matching plant-based staple and calm behavior; shared lake
        chemistry alone is insufficient. No hybrid warning is invented for Gephyrochromis lawsi.

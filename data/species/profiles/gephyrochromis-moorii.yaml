    confidence: high
    rationale: "The Catalog of Fishes and FishBase establish Lake Malawi endemism, and the CRC photograph and
      specialist locality account confirm Msuli Point. Some hobby text restricts the species to the south,
      while other accounts include northern sites; the final profile therefore does not impose a southern-only
      range. Lake Malawi is normalized to the canonical lake-malawi identifier."

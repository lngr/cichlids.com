  breeding:
    text: "The female incubates eggs and developing young in her mouth after spawning over the substrate. The male
      does not form a lasting pair with her, and the stocking ratio does not imply exclusive mating. Aquarium
      accounts describe a holding period near three weeks. Give a carrying female ways to avoid repeated
      disturbance and feeding competition. The legacy archive includes two listings of a five-adult breeder
      group with fry, apparently repeating one offer; they support captive breeding experience without
      establishing a minimum colony size, clutch count or breeding success rate."

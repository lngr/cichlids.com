        to 16. The lower endpoint includes measured natural water, while the upper endpoint follows the
        species-specific FishBase 9 to 19 dH entry. Aquarium advice includes AquaInfo prose near 10 dGH and
        its tabulated 12 to 16, Aquarium Wiki 8 to 12 degrees of unspecified hardness, Cichlid Atlas 10 to 18,
        Fishipedia 8 to 15 and Einrichtungsbeispiele 5 to 15. Malawi-Guru gives a wider general Malawi
        allowance of 4 to 20 dGH, preferring 6 to 12; that group advice does not require extending this
        species to 20. These recommendations support a practical envelope but do not demonstrate physiological
        failure at the endpoints."

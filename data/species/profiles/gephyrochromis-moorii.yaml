  husbandry:
    text: "For one male with three females, use at least 300 L and a footprint around 120 by 50 cm. Cover a
      substantial floor area with fine sand and arrange a few stable shelters so subordinate fish can escape
      view. Keep filtration and oxygen exchange effective and replace water regularly. Maintain a steady
      alkaline system, using the narrower care recommendations as routine targets rather than operating at the
      edges of the estimated tolerances. The adopted long-term envelopes are 21 to 30 C, pH 7.5 to 8.8, GH 3
      to 19 dGH and KH 5 to 18 dKH. Their uncertain endpoints are compatibility estimates, not experimentally
      demonstrated limits."

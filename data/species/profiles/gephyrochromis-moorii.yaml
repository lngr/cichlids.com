  maxSizeCm:
    value:
      male: 12.5
      female: 10.5
    confidence: medium
    rationale: "The sex-specific medians are 12.5 cm for males and 10.5 cm for females: generator proposed 13/11,
      checker-a 12/10, checker-b 13/11.5 and checker-c 12/10 cm. FishBase gives 12 cm total length without sex
      separation, NVC and Malawi.si about 13 cm, and Tropical Fish Keeping about 13.3 cm male and 11.4 cm
      female. The Nordic register gives a larger 14 cm maximum, while akwarium gives 10 cm overall and Cichlid
      Atlas describes smaller typical aquarium fish. The median is therefore within the read source span and
      avoids treating the largest register maximum as typical. Females are consistently described as smaller,
      but the 10.5 cm estimate is less secure than the male size because most sources do not measure the sexes
      separately."
    sources:
      - kind: database
        title: "FishBase: Gephyrochromis moorii"
        url: "https://www.fishbase.se/summary/Gephyrochromis-moorii.html"
        archived: fishbase.se/summary/gephyrochromis-moorii.html/2026-10-15T085501Z

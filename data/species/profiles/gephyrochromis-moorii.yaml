  sizeAndGrowth:
    text: "The selected typical aquarium maxima are approximately 12.5 cm for males and 10.5 cm for females. These
      are medians of the supplied estimates, checked against published figures around 12 to 14 cm for larger
      adults. The female number is less certain because most accounts state only that females remain smaller.
      Provide adult space from the outset rather than using juvenile size to judge stocking. A lifespan of
      roughly five to eight years is plausible from hobby references, but is not supported by a measured
      survival study."

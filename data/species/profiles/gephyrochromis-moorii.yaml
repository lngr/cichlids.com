  sexing:
    text: "Adult males are usually larger and show stronger blue or silver coloration with orange on the upper
      body and fins. Females are more subdued, often brownish. Locality, dominance and stress can alter the
      appearance, and immature or subordinate males can be mistaken for females. Use adult development and an
      experienced assessment when establishing the sex ratio. The profile's two size figures are planning
      estimates rather than a diagnostic test for sex."

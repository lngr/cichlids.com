  compatibility:
    text: "Select calm Malawi companions of comparable size whose staple feeding can remain plant-based. Preserve
      space for the group to feed over sand and avoid crowding it with more forceful territory holders. Some
      sources suggest calm sand-associated or midwater cichlids, but individual named pairings are not
      established here as guaranteed combinations. Large animal-food requirements conflict with the selected
      diet. Predation is level 0, meaning fry may be swallowed incidentally without classifying the species as
      a deliberate small-fish hunter. No applicable named hybrid group was found; that absence does not prove
      crossing impossible."
    sources:

  problems:
    text: "Repeated harassment, loss of feeding access and deteriorating water quality are the main practical
      problems to prevent. Keep the open floor usable and check that females and subordinate fish can retreat.
      Avoid overfeeding and a persistently rich animal-food diet under the selected precautionary feeding
      classification. The bloat flag comes from husbandry advice for related Malawi fish, rather than a
      confirmed special disease of this species. Water chemistry sources disagree about hardness, so
      distinguish measured lake GH and KH from aquarium recommendations instead of adding minerals simply
      because the fish is a Malawi cichlid."

  diet:
    text: "Use a plant-based prepared staple, with limited small invertebrate supplements rather than an
      animal-protein-rich feeding regime. This follows the settled aufwuchs classification and positive
      bloat-sensitive flag. NVC and AquaInfo emphasize invertebrate feeding, Malawi.si describes mixed
      substrate foods, and other care pages recommend plant material. These accounts do not establish an
      obligate algae-only diet. The conservative choice protects the planner against an unsuitable rich
      feeding regime while the evidence remains unsettled. Species-specific bloat cases or controlled dietary
      trials were not confirmed in the accessible sources."

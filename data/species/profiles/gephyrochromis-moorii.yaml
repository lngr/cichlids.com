    tolerance:
      value:
        min: 5
        max: 18
      confidence: low
      rationale: "The tally selects 5 to 18 dKH by the median method with confidence low because six proposals
        produce no qualified majority. The proposals are generator 4 to 12, checker-a 4 to 15, checker-b 5 to
        25, checker-c 5 to 12, tiebreaker-1 5 to 20 and tiebreaker-2 5 to 20 dKH. The median minimum is 5 and
        median maximum is 17.5, rounded to 18; the result contains natural 5 to 8 dKH. It is narrower than
        Malawi-Guru general guidance of 6 to 20 dKH, preferably 8 to 10, and the Tropical Fish Keeping species
        recommendation of 15 to 25 dKH. Both wider intervals remain evidence. The former extrapolates group
        keeping practice; the latter gives no chronic-health observations and confuses some acei trade names.
        Earlier 4 to 12 and 4 to 15 proposals were inferred from pH and hardness advice. No source establishes
        a species-specific chronic KH limit, and GH cannot be numerically converted into KH; this median is a
        provisional estimate rather than a measured cutoff."

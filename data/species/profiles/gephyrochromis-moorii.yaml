      verification object. Branchu alkalinity converts to about 6.5 to 6.9 dKH; the Jackson et al. values
      compiled by FAO convert to about 5.6 to 7.3 dKH. The outward-rounded lake envelope remains distinct from
      GH because alkalinity and calcium-magnesium hardness measure different properties."

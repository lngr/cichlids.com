  temperatureC:
    value:
      min: 21
      max: 29
    confidence: high
    rationale: "All four natural-range proposals are 21 to 29 C, retained exactly from the settled lake-malawi
      decision with waterbody verification and high confidence. This is the compiled seasonal and regional
      lake envelope, not an aquarium target or one northern collection measurement. Eccles supplies the
      historical cold-season context, Vollmer describes seasonal surface variation, and the Branchu northern
      profile and FAO compilation provide measured subsets. The Eccles DOI currently returns HTTP 403, so its
      upstream attribution is retained with offline status; its non-OA full text was not independently read.
      Narrower FishBase and aquarium intervals remain evidence rather than replacing the natural envelope."

    tolerance:
      value:
        min: 7.5
        max: 8.8
      confidence: low
      rationale: "The tally retains pH 7.5 to 8.8 with unanimous verification and confidence low under the 0.3-pH
        agreement rule. Proposals were generator 7.5 to 8.8, checker-a 7.2 to 8.8, checker-b 7.5 to 8.6 and
        checker-c 7.5 to 8.8. Read aquarium sources generally recommend 7.5 to 8.6, and none establishes a
        tested long-term boundary at 8.8. The lower 7.2 proposal was an extrapolation rather than a measured
        failure threshold. The adopted range contains natural lake water while allowing a modest inferred
        margin."

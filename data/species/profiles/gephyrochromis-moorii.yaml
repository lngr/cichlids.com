  ghDgh:
    value:
      min: 3
      max: 5
    confidence: high
    rationale: "All four natural proposals are 3 to 5 dGH, retained with the tally waterbody verification and high
      confidence. Branchu calcium and magnesium give about 4.2 to 4.6 dGH in the upper northern-basin water;
      the FAO compilation gives approximately 3.2 to 4.9 dGH. These measurements outweigh the FishBase 9 to 19
      dH environment entry and aquarium recommendations of 5 to 18 dGH for natural chemistry. Lake Malawi can
      be alkaline while having low total hardness; alkalinity does not establish high GH."

  legacyNames:
    - Gephyrochromis moorii
  note: "The current Catalog of Fishes accepts the original combination Gephyrochromis moorii Boulenger, 1901.
    Its original Lake Tanganyika type locality was corrected to Lake Malawi by Trewavas in 1946. The Tilapia
    moorii label proposed by checker-a and checker-c is present on a hobby page, but is not supported here as
    a synonym by the Catalog or the public CRC entry."

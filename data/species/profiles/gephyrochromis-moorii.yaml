  social:
    value:
      structure: harem
      ratio: 3
    confidence: medium
    rationale: "Generator and checker-a proposed one male with three females; checker-b proposed a group of at
      least three and checker-c a group of at least four. FishBase records wild groups of three to seven,
      while AquaInfo describes groups of four to eight organized around one mature colored male with females
      and sometimes immature males. Akwarium recommends two to three females per male and Aquarium Wiki gives
      1:2. One male with three females is the practical four-adult stocking unit used here, not a claim of
      exclusive natural mating. CRC describes mating involving multiple partners. The two five-adult
      breeder-stock listings are duplicate practical reports, not independent tests of a minimum group size."

  socialBehavior:
    text: "One male with three females is the practical four-adult group used for this profile. Wild observations
      of groups with three to seven fish do not make three an experimentally established aquarium minimum. A
      male may exclude rivals from a feeding patch as well as become more assertive during courtship, so local
      defense is not restricted to breeding. Most accounts suggest manageable chasing when space and sex
      balance are appropriate. Multiple mature males need more room and refuge options than this minimum
      assumes. Persistent pursuit or a fish that cannot feed signals a stocking problem."
    sources:

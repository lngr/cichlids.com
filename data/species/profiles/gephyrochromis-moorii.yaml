  habitat:
    text: "Lake Malawi is the confirmed native waterbody, with a verified photographic record at Msuli Point and
      records elsewhere around the lake. Claims restricting the species to southern shores do not capture all
      locality evidence. FishBase places it above sand at 6 to 25 m, while NVC reports observations extending
      to 37 m. The aquarium should preserve that sand association rather than treating every mbuna as a rock
      specialist. Place shelters around the edges and keep the central feeding floor accessible. Measured lake
      chemistry is alkaline but comparatively low in calcium-magnesium hardness; higher hardness figures on
      care pages describe different evidence."

      \ 3.5; and tiebreaker-2 2 to 14. Stalsberg directly recorded KH 1 to 3 at occupied Panamanian sites. Official\
      \ Panamanian alkalinity measurements convert to 1.40 to 3.47 dKH in Chiriqui Viejo and 1.68 to 2.30 in Santa\
      \ Maria, extending slightly above the decided upper endpoint. The decided range is much narrower than regional\
      \ Rincon bicarbonate-equivalent 2.49 to 7.38 and Golfo Dulce alkalinity-equivalent 4.79 to 13.91 dKH. These\
      \ Costa Rican basin proxies do not establish the chemistry of the identified Panamanian capture sites and\
      \ have uncertain applicability after the species split. Retain their wider ranges without treating GH or conductivity\
      \ as KH. The chosen core is provisional rather than proof that every population occupies only this alkalinity.\

  note: "The name and synonym list follow the Catalog of Fishes, which accepts Talamancaheros sieboldii and T. underwoodi\
    \ separately but retains Pacific Costa Rica and Panama for sieboldii. CRC still includes underwoodi in its synonymy,\
    \ whereas NVC treats the Costa Rican fish as underwoodi. Historical locality and ecological records are retained\
    \ with that limitation. The former genus Tomocichla now includes the distinct Caribbean-slope tuba and asfraci;\
    \ no Caribbean occurrence is accepted for sieboldii. The Bussing (1975) and Rican et al. (2016) OA results exposed\
    \ abstracts and bibliographic material only, so no full-text details are inferred from them. The cichlids.com\
    \ archive search for sieboldii returned no posts. GCCA access was blocked in the input research and supplies\
    \ no evidence."

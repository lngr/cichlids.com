    tolerance:
      value:
        min: 22
        max: 30
      confidence: medium
      rationale: "The qualified-majority tally decides 22 to 30 C at medium confidence, with five of six votes agreeing\
        \ within 1 C. Generator, checker-b, tiebreaker-1 and tiebreaker-2 proposed 22 to 30 C; checker-a proposed\
        \ the wider 20 to 30 C and checker-c 22 to 29 C. NCS recommends 22 to 28 C, French breeding advice reaches\
        \ 29 C and the natural capture readings reach 29.8 C, supporting inclusion of 30 C. NVC recommends a warmer\
        \ minimum of 26 C. The wider 20.7 to 31.8 C Terraba field series retained by checker-a does not demonstrate\
        \ chronic aquarium tolerance, especially under the older species concept. This working interval contains\
        \ the natural range but its endpoints are less well documented than the central husbandry temperatures.\
        \ The exceptional 38 C spring report is not generalized."

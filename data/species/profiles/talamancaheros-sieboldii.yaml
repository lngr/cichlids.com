    confidence: medium
    rationale: "All four full profiles propose a Pacific-slope distribution. Generator and checker-b qualify Costa\
      \ Rican records after the underwoodi split; checker-a includes the Terraba, Rincon, Tusubres and Culebra records\
      \ directly; checker-c includes Costa Rica and western Panama. Retain the Catalog distribution and explicitly\
      \ qualify the older Costa Rican localities. NVC assigns those fish to underwoodi, while CRC retains the broader\
      \ concept. Stalsberg provides explicit Panamanian capture records, which anchor the decided chemistry. Neither\
      \ Catalog genus page supports a Caribbean distribution for sieboldii; Caribbean tuba and asfraci are separate\
      \ species."

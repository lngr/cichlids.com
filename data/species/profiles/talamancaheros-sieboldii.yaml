    - *id023
    - *id024
    - *id025
    - *id026
    - *id008
    - *id028
    - *id016
    - *id018
    - *id029
    - *id030
    - *id015
    - *id032
    - *id033
    - *id034
    - *id031
    - *id019
    - *id035
    - *id037
  socialBehavior:
    text: "A settled pair is the recommended adult social unit. These fish may initially hide and later become much\
      \ more assertive, so quiet behavior during the first week does not predict adult compatibility. Rival adults\
      \ and unwanted partners can receive persistent attention. Arrange shelters with several exits and break sight\
      \ lines across the aquarium. During reproduction the defended area becomes especially difficult for neighbors\
      \ to use. Watch for a fish that cannot leave cover, feed or rest, and have a divider or a separate aquarium\
      \ ready. Pair formation should be observed rather than assumed from sex alone."
    sources:
    - *id005
    - *id021
    - *id013
  diet:
    text: "Make vegetable-based prepared foods and grazing opportunities the foundation of the adult menu. Smooth\
      \ stones with algae and biofilm offer useful feeding surfaces. Adults also take small animal foods, and young\
      \ fish rely more heavily on aquatic insects in nature. Small supplementary portions of Daphnia or Artemia\
      \ can provide variety without replacing the plant component. Their willingness to accept rich foods does not\
      \ make those foods appropriate as the staple. Avoid mammal meat and repeated heavy feeds of worms. Digestive\
      \ cautions in husbandry accounts support restraint, although the frequency and causes of bloat have not been\
      \ measured."
    sources:
    - *id007
    - *id010
    - *id005
    - *id021
  breeding:
    text: "Pairs typically select a sheltered hard surface, often inside a cavity, and clean it before spawning.\
      \ Provide enough room for both adults to retreat from each other. The female tends the immediate nest while\
      \ the male commonly patrols farther away, and both take part in protecting mobile young. Accounts describe\
      \ clutches around 300 eggs, hatching after roughly two to three days under warm conditions. Development depends\
      \ on temperature, so treat these as approximate timings. Free-swimming fry can receive appropriately sized\
      \ Artemia and finely divided food. Other fish may need removal when brood defence intensifies."
    sources:
    - *id010
    - *id021
    - *id005
    - *id013
  sexing:
    text: "Adult size is helpful because males generally grow noticeably larger than females. NCS also describes\
      \ greater fin extension in males. During breeding the female commonly develops a sharply contrasting pale\
      \ body with dark head and throat markings, but color changes with mood and locality and should not be used\
      \ alone. Juveniles are harder to separate reliably, and a small individual is not automatically female. Photographs\
      \ of older stocks may depict the broader historical species concept. Keep collection information with breeding\
      \ fish instead of assigning a modern species name from a single color pattern."
    sources:
    - *id005
    - *id021
    - *id001
  compatibility:
    text: "Adults defend substantial areas and intensify that defence around a brood. A pair aquarium makes this\
      \ easier to manage, while robust mixed communities are possible in larger space. Cribroheros altifrons, Andinoacara\
      \ coeruleopunctatus and grown Hypostomus panamensis are conditional candidates suggested by habitat and husbandry\
      \ context, not guaranteed aquarium combinations. Provide each companion with retreat space beyond the pair\
      \ minimum and ensure the cichlid receives its vegetable-rich ration. Small fish and fry can be eaten, and\
      \ delicate fish may lose access to food or shelter. No hybrid group is assigned on the available evidence;\
      \ keep collection information with Talamancaheros breeding stocks because older names and identifications\
      \ overlap."
    sources:
    - *id005
    - *id013
    - *id021
    - *id032
    - *id022
    - *id038
    - *id037
    - *id020
    - *id028
    - *id023
  problems:
    text: "Common problems begin with crowding, an incompatible pair or water that becomes dirty despite looking\
      \ clear. Chasing and panic flights can damage the skin; sharp decoration adds another route to injury. Husbandry\
      \ accounts describe persistent sores in poorly suited aquarium conditions, so changes in skin condition deserve\
      \ prompt attention. Reduced appetite can reflect adjustment, social pressure, water problems or illness and\
      \ cannot identify a disease on its own. Check the environment and seek qualified help for persistent symptoms.\
      \ Avoid overfeeding and a meat-heavy adult diet, and do not copy extreme hot-spring temperatures into routine\
      \ care."
    sources:
    - *id005
    - *id013

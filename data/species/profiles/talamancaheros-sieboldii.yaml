  temperatureC:
    value:
      min: 24
      max: 30
    confidence: medium
    rationale: "The qualified-majority tally decides 24 to 30 C with medium confidence, from five agreeing votes\
      \ out of six under the 1 C agreement rule. Proposals were generator 25 to 30, checker-a 23 to 29, checker-b\
      \ 24 to 30, checker-c 24 to 28, tiebreaker-1 24 to 30 and tiebreaker-2 24 to 30 C. Stalsberg recorded 25.2\
      \ to 29.8 C at capture sites and 24.5 C in nearby Santa Maria water; the monitoring tables give 24 to 28 and\
      \ 24.5 to 27.6 C. The narrower typical interval does not encompass the full regional records: Rincon 22 to\
      \ 32.5 C, Terraba 20.7 to 31.8 C, Golfo Dulce rivers 26 to 33 C and Sierpe 27.4 to 30.3 C. Those Costa Rican\
      \ series have uncertain applicability after the taxonomic split and are not species-wide aquarium targets.\
      \ The 20.57 to 21.4 C upper Gariche station lacks established species occupancy. NVC reports an exceptional\
      \ 38 C Caldera spring population, which remains habitat context and is excluded from the natural target and\
      \ tolerance."

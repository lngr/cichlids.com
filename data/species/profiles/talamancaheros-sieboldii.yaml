partners:
  suitable:
  - species: Cribroheros altifrons
    reason: A similarly sized regional cichlid is a possible companion when it can keep a separate territory; reported
      shared habitat is not an aquarium trial.
    condition: "A substantially larger aquarium than the pair minimum, compatible individuals and a removal plan."
  - species: Andinoacara coeruleopunctatus
    reason: A robust regional cichlid found with sieboldii in collecting reports; supplementary animal food must
      be delivered separately from the grazing staple.
    condition: Large adults in a substantially larger community aquarium; monitor breeding defence.
  - species: Hypostomus panamensis
    reason: "A robust armored bottom fish reported from the regional assemblage; vegetable foods can suit both,\
      \ but nest access may provoke conflict."
    condition: A sufficiently grown individual with its own refuge in a larger aquarium; protect the cichlid nest.
  unsuitable:
  - species: Paracheirodon innesi
    reason: Tiny size exposes it to opportunistic predation and territorial attacks.
  - species: Symphysodon aequifasciatus
    reason: Deliberate feeding and quiet resting requirements conflict with an assertive current-loving grazing
      cichlid.
  - species: Talamancaheros underwoodi
    reason: A similar close relative creates identification and territorial problems in breeding stocks; no specific
      hybrid cross is asserted.
profile:
  overview:
    text: Talamancaheros sieboldii is a river cichlid whose understated everyday colors change strikingly when a
      pair starts breeding. Adults spend much of their time around stones and graze the growth on hard surfaces.
      Plan for a substantial aquarium and an established pair rather than a collection of rival adults. The older
      names Tomocichla sieboldii and Cichlasoma sieboldii remain common in aquarium literature. Identification deserves
      care because Costa Rican fish were historically included under this name and some modern sources separate
      them as Talamancaheros underwoodi.
    sources:
    - *id001
    - *id005
    - *id007
    - *id010
    - *id012
  habitat:
    text: "This is a Pacific-slope river cichlid associated especially with stones, sand and flowing water. Panamanian\
      \ collecting records include boulder channels and mixed sand-rock beds; association accounts also describe\
      \ sheltered water and woody cover. The decided natural planning ranges are 24 to 30 C, pH 7 to 8.5, GH 1 to\
      \ 2 and KH 1 to 3. These are provisional typical values anchored by capture-site observations. Wider official\
      \ river and Costa Rican regional measurements remain evidence, but do not all coincide with identified adults\
      \ under the current species concept. NVC reports breeding fish in the Caldera springs at 38 C, an exceptional\
      \ thermal habitat that is excluded from routine aquarium targets. Older Costa Rican records need care because\
      \ some modern references assign those populations to underwoodi."
    sources:
    - *id006
    - *id007
    - *id013
    - *id005
    - *id001
    - *id009
    - *id010
    - *id011
    - *id012
    - *id002
    - *id003
    - *id004
    - *id020
    - *id008
    - *id044
    - *id045
    - *id014
    - *id015
    - *id016
    - *id017
    - *id018
    - *id019
    - *id027
    - *id030
    - *id046
    - *id031
    - *id026
  sizeAndGrowth:
    text: "For aquarium planning, expect males around 20 cm and females around 15 cm when fully grown. Larger maxima\
      \ occur in reference works, including a FishBase record of 25 cm standard length, which excludes the tail.\
      \ That record is a different measure from a typical adult aquarium length. Juvenile size is therefore a poor\
      \ guide to the space eventually needed. Sexual maturity can arrive well before maximum size. A lifespan of\
      \ roughly eight to twelve years is only an estimate here because a documented species-specific longevity series\
      \ was not found."
    sources:
    - *id005
    - *id007
    - *id021
    - *id032
  husbandry:
    text: "Plan at least 540 litres with a 180 by 60 cm footprint for a compatible adult pair. Secure rounded stones,\
      \ provide sheltered spawning sites and leave routes between retreats. Sand permits normal digging, while branches\
      \ can add shelter. Use effective filtration, strong surface movement and regular water changes, with calmer\
      \ resting places outside the main flow. The working tolerances are 22 to 30 C, pH 7 to 8.5, GH 1 to 20 and\
      \ KH 1 to 8. These are practical ranges with uncertain endpoints, especially for hardness, rather than experimental\
      \ failure thresholds. Very soft native water shows that high GH is unnecessary. Let shy arrivals settle quietly\
      \ and check water quality and social pressure when feeding is poor."
    sources:
    - *id005
    - *id021
    - *id013
    - *id007
    - *id006
    - *id002
    - *id022
    - *id014
    - *id003

  ghDgh:
    value:
      min: 1
      max: 2
    confidence: medium
    rationale: "The qualified-majority tally decides 1 to 2 dGH at medium confidence with four of six proposals\
      \ agreeing within 2 dGH. Generator, checker-b and tiebreaker-1 proposed 1 to 2; checker-a 1 to 7; checker-c\
      \ 0.8 to 4; and tiebreaker-2 1 to 12. Stalsberg directly measured 1 or 2 dH at four identified occupied Panamanian\
      \ sites. These species-linked readings anchor the decision, but one collector and unspecified test resolution\
      \ limit precision. The decided range is narrower than the official river monitoring envelopes: Chiriqui Viejo\
      \ 1.57 to 3.81 and Santa Maria 0.90 to 2.19 dGH. It is also narrower than Rincon 2.38 to 6.88, regional Golfo\
      \ Dulce 4.80 to 11.99 and Sierpe freshwater 2.74 to 9.56 dGH. Those broader samples are not measurements beside\
      \ taxonomically verified adults, and the Costa Rican studies predate the underwoodi split. FishBase 9 to 19\
      \ and Cichlidamerique 10 to 20 lack comparable site metadata. All are retained as dissenting evidence. The\
      \ decision describes the provisional occupied-site core rather than a demonstrated boundary for every population;\
      \ the much broader tolerance prevents treating harder aquarium water as automatically unsuitable."

  temperatureC:
    value: {min: 23, max: 29}
    confidence: high
    verification:
      method: waterbody
      waterbody: lake-tanganyika
    rationale: >-
      The species is a Lake Tanganyika endemic, so the natural range is the measured lake range.
      Hourly buoy readings off Mpulungu in the south run from just under 24 to 29 C, with the
      cooler values during the upwelling season from June to September. The species lives in the
      rocky littoral down to about 30 to 40 m, inside this range. All three runs proposed this
      range. The 23 to 25 C in FishBase goes back to an aquarium handbook and does not describe
      the habitat.
    sources:
      - &verburg1997
        kind: literature
        title: "Verburg, P., Huttula, T., Kakogozo, B., Kihakwi, A., Kotilainen, P., Makasa, L. and Peltonen, A. (1997). Hydrodynamics of Lake Tanganyika and meteorological results. FAO/FINNIDA GCP/RAF/271/FIN-TD/59."
        url: https://fao.org/fishery/static/LTR/FTP/TD59.PDF
        archived: fao.org/fishery/static/ltr/ftp/td59.pdf/2026-10-14T094105Z
        accessed: 2026-10-12
      - &plisnier1996a
        kind: literature
        title: "Plisnier, P.-D., Langenberg, V., Mwape, L., Chitamwembwa, D., Tshibangu, K. and Coenen, E. (1996). Limnological sampling during an annual cycle at three stations on Lake Tanganyika (1993-1994). FAO/FINNIDA Research for the Management of the Fisheries on Lake Tanganyika, GCP/RAF/271/FIN-TD/46."
        url: https://fao.org/fishery/static/LTR/FTP/TD46.PDF
        archived: fao.org/fishery/static/ltr/ftp/td46.pdf/2026-10-14T094054Z
        accessed: 2026-10-12
      - &langenberg2008
        kind: literature
        title: Langenberg, V. T. (2008). On the limnology of Lake Tanganyika. PhD thesis, Wageningen University.
        url: https://edepot.wur.nl/121977
        archived: edepot.wur.nl/121977/2026-10-14T094112Z
        accessed: 2026-10-12
    evidence:
      - source: *verburg1997
        value: {min: 23.85, max: 29.01}
        note: Hourly buoy readings at Mpulungu over the measuring period.
    tolerance:
      value: {min: 23, max: 29}
      confidence: medium
      verification:
        method: unanimous
        votes: {agree: 3, total: 3}
      rationale: >-
        Care sheets mostly name 24 to 28 C (Seriously Fish, Tropical Freshwater Fish) or 24 to
        27 C (The Tropical Tank). The tolerance has to contain the natural range, so it spans the
        lake range of 23 to 29 C; its upper end lies 1 C above the warmest care-sheet value, and
        long periods at 29 C are not documented in aquaria. Aqualog and the retailer LiveAquaria
        go down to 22 C, a wider lower end that no specialist source confirms. The generator and
        checker-a proposed 23 to 29 C, checker-b 22 to 29 C; these agree within 1 C.

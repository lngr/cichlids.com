partners:
  suitable:
    - species: Cyprichromis leptosoma
      reason: Peaceful open-water planktivore that is too large to be eaten as an adult and serves as dither fish; same water needs.
      condition: Add adult Cyprichromis; their fry will be eaten.
    - species: Julidochromis marlieri
      reason: Rock-dwelling Tanganyikan of similar size that uses different crevices and is robust enough as an adult.
      condition: Only adults; small juveniles fit into the mouth of a grown Altolamprologus.
    - species: Neolamprologus pulcher
      reason: Mid-sized lamprologine of the same rock habitat; adults are not prey and both take meaty foods.
      condition: Enough rockwork for two breeding territories.
    - species: Synodontis multipunctatus
      reason: Tanganyika catfish that occupies the bottom and is ignored by this calm cichlid.
  unsuitable:
    - species: Tropheus moorii
      reason: Boisterous, fast-feeding aufwuchs eater that needs a low-protein diet and stresses the slow, shy Altolamprologus.
    - species: Neolamprologus multifasciatus
      reason: Adults of 2.5 to 4.5 cm are small enough to be eaten, and the shell-dweller colony loses its fry.
    - species: Maylandia zebra
      reason: Hyperactive Lake Malawi mbuna that outcompetes it at feeding time; softer lake water and an aufwuchs diet do not match.
    - species: Altolamprologus calvus
      reason: Closest relative of very similar shape and habits, so the two compete for the same narrow crevices; no cross is documented, but the split is young and a single hobby report claims crosses.
      condition: Possible in very large tanks with plenty of crevices; not for breeding tanks.

profile:
  overview:
    text: >-
      Altolamprologus compressiceps is one of the oddest-looking cichlids of Lake Tanganyika. Its
      body is tall and extremely flat, the dorsal fin starts high above the small head, and the
      snout ends in a mouth that can be shot forward to suck prey from cracks in the rock. Many
      locality forms reach the trade, from golden yellow to almost black, often with bright red or
      orange fins. The species is slow-growing, long-lived for its size and calm in a suitable
      tank, which makes it a classic of the Tanganyika community aquarium. It is, however, a
      predator of small fish and fry, it is outcompeted by fast, rough feeders, and it needs hard,
      alkaline, very clean water. Hobbyists who want to keep it should plan the stocking around it
      rather than adding it to an existing mixed tank.
    sources:
      - *cof
      - *sf
      - *tsibulu
  habitat:
    text: >-
      The species lives all around Lake Tanganyika, but only where rocks or rubble provide many
      narrow gaps. Adults are found mostly between a few metres and about 15 m, single fish
      down to 30 or 40 m; juveniles stay in shallower water. Wide sandy beaches act as barriers,
      so populations on separate rocky stretches developed their own colours. The lake water is
      warm (about 23 to 29 C), hard and strongly buffered, with a pH of 8.4 to 9.4. There the fish
      move slowly along rock faces, hang motionless in front of a crevice and strike at shrimp
      hidden inside. In the southwest it shares the coast with its close relative A. calvus.
    sources:
      - *koblmueller
      - *spreitzer
      - *sf
      - *tsibulu
      - *plisnier1996a
  sizeAndGrowth:
    text: >-
      Males usually reach 12 to 15 cm total length in the aquarium, females stay clearly smaller at
      about 8 to 10 cm. The size difference is the most reliable way to tell the sexes apart in
      adult fish. Growth is very slow: young fish bought at 3 cm need well over a year to reach
      sexual maturity, and males keep growing for several years. Patience is part of keeping this
      species, and fast growth through heavy feeding is neither possible nor healthy. Because of the
      small head and narrow body, the fish look smaller from the front than their length suggests,
      but even a medium-sized specimen can swallow surprisingly large prey.
    sources:
      - *fishbase
      - *sf
      - *cf
      - *tsibulu
      - *ttt
  husbandry:
    text: >-
      A pair needs a tank of at least 120 cm length and about 200 litres. Build tall rock piles
      with many crevices, some so narrow that only a female can squeeze in, and place the rocks
      directly on the glass before adding sand. Keep the water hard and alkaline, roughly pH 8 to
      9, 24 to 28 C and a total hardness well above 8 dGH, with strong carbonate buffering; a
      crushed coral or aragonite substrate helps. The species reacts badly to rising nitrate and
      other waste, so strong filtration and generous weekly water changes are essential. Avoid
      sudden changes in water chemistry when moving new fish. A tight cover is advisable because
      startled fish can jump.
    sources:
      - *sf
      - *tsibulu
      - *ttt
      - *liveaquaria
      - *glaser
  socialBehavior:
    text: >-
      Towards other species this cichlid is calm and somewhat shy; it rarely chases anything that
      it cannot eat. Males tolerate each other poorly, so a single pair is the simplest setup. In a
      large tank a male with two females or a bigger group can work if there are enough crevices.
      In the wild the fish live mostly alone and meet only for spawning, and in the aquarium the
      male also stays near the female only during breeding. Lively, peaceful dither fish such as
      Cyprichromis reduce shyness and bring the fish into the open.
    sources:
      - *sf
      - *tsibulu
      - *sefc2011
      - *archive13731
  diet:
    text: >-
      In nature the diet consists mainly of small atyid shrimp picked from rock crevices, with
      other small arthropods, eggs and fry as additions. In the tank offer frozen mysis, krill,
      chopped shrimp, bloodworm and brine shrimp, alongside quality carnivore pellets or granules
      that sink slowly. Feed small portions once or twice a day and make sure the fish actually
      gets its share, since it eats slowly. Live feeder fish are unnecessary and bring a risk of
      disease. Plant-based foods are accepted but do not need to make up a large part of the diet.
    sources:
      - *spreitzer
      - *mushagalusa2019
      - *fbfood
      - *koblmueller
      - *sf
      - *tsibulu
  breeding:
    text: >-
      Breeding is done in a narrow cave or crack whose entrance admits the female but not the
      larger male; small flowerpots, slate stacks or a large snail shell also work. The female lays
      about 50 to 200 eggs inside, and the male fertilises them by releasing milt at the entrance.
      The larvae hatch after three to five days and swim free about a week later, when they accept
      newly hatched brine shrimp. The female guards the brood, while the male patrols outside for a
      short time. In a community tank most fry are eaten, so raising them usually requires removing
      them or setting up a separate tank.
    sources:
      - *tsibulu
      - *sf
      - *ttt
  sexing:
    text: >-
      Adult males are much larger than females, often by a third or more, and develop a deeper body
      and somewhat longer fin tips. Colour differences between the sexes are minor. Juveniles cannot
      be sexed reliably, so most keepers buy a group of five or six young fish and let a pair form
      as they grow. A breeding female is easy to recognise by her behaviour, since she is the one
      disappearing into the narrow spawning crevice while the male waits outside.
    sources:
      - *sf
      - *cf
      - *tsibulu
      - *ttt
  compatibility:
    text: >-
      Good tankmates are calm Tanganyikan cichlids too big to be swallowed, such as adult
      Cyprichromis, Julidochromis, mid-sized Neolamprologus and Synodontis catfish. Avoid any fish
      small enough to fit into its mouth, roughly anything under 5 cm, which includes small
      shell-dwellers and fry. Fast, rough feeders such as Tropheus, Petrochromis or Lake Malawi
      mbuna push it away from food and keep it hidden; Tropheus also needs a low-protein diet. Keep
      only one locality form in a tank. A. calvus competes for the same crevices; no cross between
      the two species is documented, but because they split only recently and one hobby report
      claims crosses, they are best not bred side by side. Lake Malawi and soft-water species need
      different water.
    sources:
      - *sf
      - *tsibulu
      - *ttt
      - *tff
      - *koblmueller
      - *archive13809
  problems:
    text: >-
      Typical mistakes are stocking it with small fish, which disappear one by one, and with
      boisterous species that steal its food until it becomes thin and hides. Poor water quality,
      high nitrate and swings in pH show up as clamped fins, loss of appetite and infections, so
      stable hard water and regular water changes matter more than with many other cichlids. Live
      feeder fish can bring in parasites. Overfeeding fatty food to try to speed up growth leads to
      fatty organs rather than larger fish. Mixing locality forms in one tank produces offspring
      that cannot be traced to a population and blurs the distinct wild forms.
    sources:
      - *sf
      - *glaser
      - *tff
      - *ttt


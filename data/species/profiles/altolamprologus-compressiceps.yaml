status: described

taxonomy:
  validName: Altolamprologus compressiceps
  genus: Altolamprologus
  species: compressiceps
  author: (Boulenger, 1898)
  source: &cof
    kind: catalog-of-fishes
    title: "Eschmeyer's Catalog of Fishes, species of the genus Altolamprologus"
    url: https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Altolamprologus
    archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-5396359b/2026-10-14T094042Z
    accessed: 2026-10-13
  synonyms:
    - name: Lamprologus compressiceps
      note: Original combination of Boulenger (1898), type locality Kinyamkolo (Mpulungu), Lake Tanganyika.
    - name: Neolamprologus compressiceps
      note: Combination listed as a synonym by FishBase and used in older hobby literature.
  legacyNames:
    - Altolamprologus compressiceps
  note: >-
    The Catalog of Fishes lists the species as valid in Altolamprologus, a genus of three valid
    species together with A. calvus and A. fasciatus (the latter placed in Altolamprologus by
    Konings 2019). A query of the original genus Lamprologus returns no separate entry. The small
    shell-dwelling trade form Altolamprologus sp. 'compressiceps shell' (Sumbu, Cameron Bay,
    Chimba) is an undescribed form or dwarf ecotype and not part of this profile.


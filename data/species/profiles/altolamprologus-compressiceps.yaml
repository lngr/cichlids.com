  ph:
    value: {min: 8.4, max: 9.4}
    confidence: high
    verification:
      method: waterbody
      waterbody: lake-tanganyika
    rationale: >-
      Measured lake value: over an annual cycle of the FAO/FINNIDA programme the pH lay at about
      8.8 to 9.2 at the surface and between 8.47 and 9.40 at 40 m, which gives 8.4 to 9.4. All
      three runs proposed this range. Aquarium figures such as 6.5 to 7.5 in FishBase or 7.0 to
      8.0 at Aqualog do not describe the habitat, and the 7.3 to 7.8 of an older FAO compilation
      contradicts the high alkalinity of the lake.
    sources:
      - *plisnier1996a
      - &plisnier1996b
        kind: literature
        title: "Plisnier, P.-D. (1996). Limnological sampling during a second annual cycle (1994-1995) and some comparisons with year one on Lake Tanganyika. FAO/FINNIDA GCP/RAF/271/FIN-TD/56."
        url: https://fao.org/fishery/static/LTR/FTP/TD56.PDF
        archived: fao.org/fishery/static/ltr/ftp/td56.pdf/2026-10-14T094059Z
        accessed: 2026-10-12
    evidence:
      - source: *plisnier1996a
        value: {min: 8.47, max: 9.4}
        note: Surface 8.8 to 9.2 and 40 m 8.47 to 9.40 over an annual cycle.
      - source: *plisnier1996b
        value: {min: 8.4, max: 9.4}
        note: Second annual cycle at the same stations.
    tolerance:
      value: {min: 7.8, max: 9.4}
      confidence: medium
      verification:
        method: qualified-majority
        votes: {agree: 4, total: 5}
      rationale: >-
        Specialist care sheets ask for alkaline water ending at pH 9.0: The Tropical Tank 7.8 to
        9.0 and Seriously Fish 8.0 to 9.0, matched by the retailer and aggregator pages of
        LiveAquaria, Riverpark Aquatics and Guidarium at 7.8 to 9.0. The lower bound of 7.8 is the
        lowest value most species-specific sources support. Lower figures come from generic
        entries: Tropical Freshwater Fish allows 7.2, Aqualog gives 7.0 to 8.0 and FishBase 6.5 to
        7.5, and the last two do not even contain the lake values. The upper bound is raised to
        the lake maximum of 9.4 because the tolerance must contain the natural range; a breeder in
        the cichlids.com archive kept and bred the species at about pH 9.0. The generator,
        checker-a and both tie-breakers proposed 7.8 to 9.4; checker-b proposed 7.0 to 9.4 after
        the Aqualog value.
      sources:

  ghDgh:
    value: {min: 10, max: 13}
    confidence: high
    verification:
      method: waterbody
      waterbody: lake-tanganyika
    rationale: >-
      Measured lake value. Magnesium far exceeds calcium in Lake Tanganyika; the surface means of
      the FAO/FINNIDA programme at Bujumbura, Kigoma and Mpulungu correspond to 11.1 to 11.5 dGH,
      the north-basin chemistry of Cohen et al. (1997) to about 12.2 dGH and the values of Talling
      and Talling (1965) to about 11.4 dGH, which gives 10 to 13 dGH. All three runs proposed this
      range.
    sources:
      - *plisnier1996a
      - &cohen1997
        kind: literature
        title: "Cohen, A. S., Talbot, M. R., Awramik, S. M., Dettman, D. L. and Abell, P. (1997). Lake level and paleoenvironmental history of Lake Tanganyika, Africa, as inferred from late Holocene and modern stromatolites. GSA Bulletin 109(4), 444-460 (Table 1, north basin surface water chemistry)."
        url: https://awramik.faculty.geol.ucsb.edu/pubs/COHE9740.pdf
        archived: awramik.faculty.geol.ucsb.edu/pubs/cohe9740.pdf/2026-10-14T094107Z
        accessed: 2026-10-12
      - &bossche1990
        kind: literature
        title: "Vanden Bossche, J.-P. and Bernacsek, G. M. (1990). Source book for the inland fishery resources of Africa, Vol. 1, CIFA Technical Paper 18/1, FAO. Lake Tanganyika: physical and chemical data after Talling and Talling (1965)."
        url: https://www.fao.org/4/t0473e/T0473E10.htm
        archived: fao.org/4/t0473e/t0473e10.htm/2026-10-14T094112Z
        accessed: 2026-10-12
    evidence:
      - source: *plisnier1996a
        value: {min: 11.1, max: 11.5}
        note: Surface means at three stations, computed from calcium and magnesium.
      - source: *cohen1997
        value: {min: 12.2, max: 12.2}
        note: North basin surface water.
      - source: *bossche1990
        value: {min: 11.4, max: 11.4}
        note: Computed from calcium and magnesium after Talling and Talling (1965).
    tolerance:
      value: {min: 8, max: 20}
      confidence: low
      verification:
        method: conservative
        votes: {agree: 3, total: 5}
      rationale: >-
        Care sheets agree on hard water but differ in width: Seriously Fish 7 to 25 dGH, Tropical
        Freshwater Fish 7 to 18, The Tropical Tank 12 to 20, FishBase 8 to 12 after aquarium
        literature, and Seriously Fish 8 to 20 for the congener A. calvus. The proposals were
        8 to 20 (generator), 7 to 20 (checker-a and tiebreaker-1) and 7 to 25 (checker-b and
        tiebreaker-2). No range reached four agreeing votes, so the vote count applied the
        conservative rule and took the intersection of all proposals, 8 to 20 dGH, which contains
        the lake range of 10 to 13 dGH. The sources reach wider, from 7 dGH (Seriously Fish,
        Tropical Freshwater Fish) up to 25 dGH (Seriously Fish); the narrower range makes the app
        warn earlier and is kept at low confidence.
      sources:
        - *sf
        - *tff
        - *ttt
        - *fishbase
        - &sfcalvus
          kind: database
          title: "Seriously Fish: Altolamprologus calvus (Calvus Cichlid)"
          url: https://www.seriouslyfish.com/species/altolamprologus-calvus/
          archived: seriouslyfish.com/species/altolamprologus-calvus/2026-10-14T094043Z
          accessed: 2026-10-13
        - *guidarium
      evidence:
        - source: *sf
          value: {min: 7, max: 25}
          note: Aquarium recommendation.
        - source: *tff
          value: {min: 7, max: 18}
          note: Given as dH without naming total or carbonate hardness; read as total hardness.
        - source: *ttt
          value: {min: 12, max: 20}
          note: Aquarium recommendation.
        - source: *fishbase
          value: {min: 8, max: 12}
          note: Aquarium literature figure, given as dH.
        - source: *sfcalvus
          value: {min: 8, max: 20}
          note: Value for the congener A. calvus.
        - source: *guidarium
          value: {min: 10, max: 25}
          note: Aggregated care guide.

  khDkh:
    value: {min: 15, max: 20}
    confidence: high
    rationale: >-
      Measured lake value. Alkalinity of 6.5 to 6.9 meq/L in several studies corresponds to about
      18 to 19 dKH, and the titrations of the FAO/FINNIDA programme reach down to about 15.4 dKH,
      which gives 15 to 20 dKH. The lake is strongly buffered, so its carbonate hardness exceeds
      its total hardness. All three runs proposed this range.
    sources:
      - *cohen1997
      - *langenberg2008
      - *bossche1990
      - *plisnier1996a
    evidence:
      - source: *cohen1997
        value: {min: 18.2, max: 18.5}
        note: Alkalinity 6.5 to 6.6 meq/L in the north basin.
      - source: *langenberg2008
        value: {min: 18.8, max: 19.3}
        note: Alkalinity 6.7 to 6.9 meq/L after Edmond et al. (1993).
      - source: *bossche1990
        value: {min: 18.8, max: 18.8}
        note: Alkalinity 6.71 meq/L after Talling and Talling (1965).
      - source: *plisnier1996a
        value: {min: 15.4, max: 20}
        note: Bicarbonate plus carbonate titrations of the programme.
    tolerance:
      value: {min: 10, max: 20}
      confidence: low
      verification:
        method: qualified-majority
        votes: {agree: 4, total: 5}
      rationale: >-
        Few care sheets state a carbonate hardness. LiveAquaria gives 10 to 20 dKH and The
        Tropical Tank 14 to 20 dKH; both end at the upper lake value. The lower bound of 10 dKH
        fits the lower pH bound of 7.8 shared by the specialist sheets, since well-aerated water
        of 10 dKH stays at about pH 8. The upper bound of 20 dKH is the lake maximum, and the lake
        studies show that the species lives permanently at 15 to 20 dKH. The generator and both
        tie-breakers proposed 10 to 20 dKH and checker-b 10 to 22 dKH, which agrees within 2 dKH;
        checker-a proposed the stricter 14 to 20 dKH of The Tropical Tank. The evidence is thin
        and one of the two care sheets is a retailer page, hence low confidence.
      sources:
        - *ttt
        - *liveaquaria
        - *cohen1997
        - *plisnier1996a
        - *sf
      evidence:
        - source: *ttt
          value: {min: 14, max: 20}
          note: Aquarium recommendation.
        - source: *liveaquaria
          value: {min: 10, max: 20}
          note: Retailer care note.
        - source: *cohen1997
          value: {min: 18.2, max: 18.5}
          note: Natural lake water in which the species lives permanently.
        - source: *plisnier1996a
          value: {min: 15.4, max: 20}
          note: Natural lake water in which the species lives permanently.

  maxSizeCm:
    value: {male: 15, female: 10}
    confidence: medium
    rationale: >-
      Males grow clearly larger than females. Cichlid-Forum and The Tropical Tank give about 15 cm
      for males and 10 cm for females, tanganyika.si 12 to 15 cm for males and about 9 cm for
      females, and Tropical Freshwater Fish 15 cm. Seriously Fish gives up to 12.5 cm for males
      and 9 to 10 cm for females, apparently as standard length, which fits a male of about 15 cm
      total length. FishBase lists 12.3 cm total length for wild males or unsexed fish, which lies
      below well-grown aquarium males. The values are typical well-kept adults, not record fish.

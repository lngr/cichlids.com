  predation:
    value: 2
    confidence: medium
    verification:
      method: qualified-majority
      votes: {agree: 4, total: 5}
    rationale: >-
      In the lake the species is a stalking specialist on atyid shrimp in rock crevices; diet
      records give zoobenthos, mainly shrimp, as almost all of its food, and fish fry appear only
      as a minor item. Fish are therefore not a main food, which excludes level 3. Its deep,
      compressed body and long protrusible mouth let it take prey well beyond 2 cm, and the
      husbandry sources treat it as a hunter of small fish: Seriously Fish counts smaller fishes
      among its natural prey and advises against any tankmate small enough to be eaten, Tropical
      Freshwater Fish warns against fish below about 8 cm, Cichlid-Forum names juveniles and adult
      shell-dwellers of 4 to 5 cm as prey, the wholesaler Aquarium Glaser calls clearly smaller
      tankmates prey, and a keeper in the cichlids.com archive lost all zebra danios kept as
      dither fish. These warnings fit level 2, with a mouth threshold of about 5 cm for a 15 cm
      male. The Tropical Tank and tanganyika.si mention only fry and very small fish, which
      would be level 1. The generator, checker-a and both tie-breakers voted 2; checker-b voted
      1 because field data do not show fish as regular prey.

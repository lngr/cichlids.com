  - name: "'Kigoma red fin'"
    kind: locality
    note: Kigoma area, Tanzania; also traded as 'Kigoma orange top'.
  - name: "'Black cheek'"
    kind: locality
    note: Cape Kagobo, Tanzania.
  - name: "'Gold head'"
    kind: locality
    note: Southeastern coast from Malasa (Tanzania) to Chituta (Zambia), including Kasanga; yellow head.
  - name: "'Fire fin'"
    kind: locality
    note: Mutondwe Island near Mpulungu, Zambia; bright orange-red fins.
  - name: "'Nangu black'"
    kind: locality
    note: Nangu, Zambia; dark, nearly anthracite body.
  - name: "'Congo black'"
    kind: locality
    note: Congolese coast from Kanoni to Kavalla; dark forms also sold as 'black pearl'.
  - name: "'Chaitika gold'"
    kind: locality
    note: Zambian coast; golden yellow form, also spelled 'Chatika gold'.

features:
  origin:
    value:
      continent: Africa
      region: Lake Tanganyika
      waterbody: Lake Tanganyika
      localities:
        - Kinyamkolo (Mpulungu), Zambia (type locality)
        - Kasakalawe, Zambia
        - Mutondwe Island, Zambia
        - Nangu, Zambia
        - Chituta, Zambia
        - Nkamba Bay, Zambia
        - Kasanga, Tanzania
        - Nkondwe Island, Tanzania
        - Cape Kagobo, Tanzania
        - Kigoma, Tanzania
        - Bujumbura, Burundi
        - Kiku, Democratic Republic of the Congo
        - Kavalla, Democratic Republic of the Congo
    confidence: high
    rationale: >-
      Endemic to Lake Tanganyika, where it occurs all around the lake on rocky shores; the type
      locality Kinyamkolo lies near Mpulungu at the southern end. The Catalog of Fishes, FishBase
      and the population genetic studies of the genus agree. A. calvus shares only the
      southwestern part of the range. The localities merge the sampling sites and trade-form
      origins named by all runs.

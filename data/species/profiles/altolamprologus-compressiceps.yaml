  disagreements:
    - field: taxonomy.synonyms
      proposals:
        - {by: generator, value: [Lamprologus compressiceps, Neolamprologus compressiceps]}
        - {by: checker-a, value: [Lamprologus compressiceps]}
        - {by: checker-b, value: [Lamprologus compressiceps]}
      decision: [Lamprologus compressiceps, Neolamprologus compressiceps]
      rationale: >-
        The FishBase synonym list includes Neolamprologus compressiceps, a combination used in
        older hobby literature, so it is listed as a synonym for search. The Catalog of Fishes
        lists only the original combination, which all runs give.
    - field: features.origin.value.localities
      proposals:
        - {by: generator, value: [Kinyamkolo (Mpulungu), Burundi coast, Kigoma, Cape Kagobo, Kasanga, Chituta, Mutondwe Island, Nangu, Kavalla]}
        - {by: checker-a, value: [Kinyamkolo (Mpulungu), Kigoma, Nkondwe Island, Mutondwe Island, Kasakalawe]}
        - {by: checker-b, value: [Mpulungu (Kinyamkolo), Kasakalawe, Nkamba Bay, Kigoma, Bujumbura, Kiku, Mutondwe Island]}
      decision: merged list of all named localities
      rationale: >-
        The lists do not contradict each other; they name different sampling sites and trade-form
        origins of a lake-wide species, so they are merged.
    - field: features.maxSizeCm
      proposals:
        - {by: generator, value: {male: 14, female: 9}}
        - {by: checker-a, value: {male: 15, female: 10}}
        - {by: checker-b, value: {male: 13, female: 9}}
      decision: {male: 15, female: 10}
      rationale: >-
        Cichlid-Forum and The Tropical Tank give 15 and 10 cm, tanganyika.si up to 15 and about
        9 cm, and Seriously Fish gives up to 12.5 cm for males, apparently standard length, and
        9 to 10 cm for females. The lower FishBase value describes wild museum material, not
        well-grown aquarium adults.
    - field: features.predation
      proposals:
        - {by: generator, value: 2}
        - {by: checker-a, value: 2}
        - {by: checker-b, value: 1}
        - {by: tiebreaker-1, value: 2}
        - {by: tiebreaker-2, value: 2}
      decision: 2
      rationale: >-
        Decided by the vote count as a qualified majority of 4 of 5 votes. The husbandry sources
        warn against small adult fish of several centimetres, which exceeds level 1.
    - field: features.hybridGroups
      proposals:
        - {by: generator, value: []}
        - {by: checker-a, value: []}
        - {by: checker-b, value: [altolamprologus]}
        - {by: tiebreaker-1, value: []}
        - {by: tiebreaker-2, value: []}
      decision: []
      rationale: >-
        Decided by the vote count as a qualified majority of 4 of 5 votes. No documented cross
        with A. calvus exists, the genetic studies find little if any gene flow, and the
        hybridisation warning of Seriously Fish concerns locality forms within the species.
    - field: features.ph.tolerance
      proposals:
        - {by: generator, value: {min: 7.8, max: 9.4}}
        - {by: checker-a, value: {min: 7.8, max: 9.4}}
        - {by: checker-b, value: {min: 7.0, max: 9.4}}
        - {by: tiebreaker-1, value: {min: 7.8, max: 9.4}}
        - {by: tiebreaker-2, value: {min: 7.8, max: 9.4}}
      decision: {min: 7.8, max: 9.4}
      rationale: >-
        Decided by the vote count as a qualified majority of 4 of 5 votes. The lower bound of 7.0
        rests on a generic lexicon value that excludes most of the lake range.
    - field: features.ghDgh.tolerance
      proposals:
        - {by: generator, value: {min: 8, max: 20}}
        - {by: checker-a, value: {min: 7, max: 20}}
        - {by: checker-b, value: {min: 7, max: 25}}
        - {by: tiebreaker-1, value: {min: 7, max: 20}}
        - {by: tiebreaker-2, value: {min: 7, max: 25}}
      decision: {min: 8, max: 20}
      rationale: >-
        Decided by the vote count with the conservative method (3 of 5 agreeing votes, no
        qualified majority): the intersection of all proposals, 8 to 20 dGH, which contains the
        lake range. The sources reach from 7 to 25 dGH.
    - field: features.khDkh.tolerance
      proposals:
        - {by: generator, value: {min: 10, max: 20}}
        - {by: checker-a, value: {min: 14, max: 20}}
        - {by: checker-b, value: {min: 10, max: 22}}
        - {by: tiebreaker-1, value: {min: 10, max: 20}}
        - {by: tiebreaker-2, value: {min: 10, max: 20}}
      decision: {min: 10, max: 20}
      rationale: >-
        Decided by the vote count as a qualified majority of 4 of 5 votes; checker-b's 10 to 22
        agrees within 2 dKH. Checker-a followed the stricter 14 dKH of The Tropical Tank alone.
    - field: features.territory
      proposals:
        - {by: generator, value: {size: small, breedingOnly: true}}
        - {by: checker-a, value: {size: small, breedingOnly: true}}
        - {by: checker-b, value: {size: small, breedingOnly: false}}
      decision: {size: small, breedingOnly: true}
      rationale: >-
        Seriously Fish, Cichlid-Forum and tanganyika.si describe a fish without a marked
        territory outside spawning that guards only the breeding cave; the permanent territory
        of checker-b rests on less specific care sheets.
    - field: features.habitatZones
      proposals:
        - {by: generator, value: [rock]}
        - {by: checker-a, value: [rock]}
        - {by: checker-b, value: [rock, sand]}
      decision: [rock]
      rationale: >-
        The species is bound to rock and rubble and does not use open sand; sand is only the base
        of the rockwork in the tank, and the Cichlid Room Companion confirms sediment-free rocky
        habitat.
    - field: features.coloration
      proposals:
        - {by: generator, value: {baseColors: [brown, yellow], pattern: bars}}
        - {by: checker-a, value: {baseColors: [brown, yellow, black], pattern: bars}}
        - {by: checker-b, value: {baseColors: [brown, yellow, orange], pattern: mixed}}
      decision: {baseColors: [brown, yellow, black], pattern: bars}
      rationale: >-
        The dark vertical bars are present in all forms and named by every description. Brown and
        yellow are the common body colours and several traded forms are almost black; orange and
        red occur mainly in the fins.
    - field: features.feedingSpeed
      proposals:
        - {by: generator, value: slow}
        - {by: checker-a, value: slow}
        - {by: checker-b, value: normal}
      decision: slow
      rationale: >-
        Specialist sources describe a slow stalker and advise against fast, competitive feeders
        because they take its food; no source supports a normal pace.
    - field: features.minTank
      proposals:
        - {by: generator, value: {volumeL: 200, lengthCm: 120, depthCm: 45}}
        - {by: checker-a, value: {volumeL: 200, lengthCm: 120, depthCm: 45}}
        - {by: checker-b, value: {volumeL: 240, lengthCm: 120, depthCm: 45}}
      decision: {volumeL: 200, lengthCm: 120, depthCm: 45}
      rationale: >-
        Tropical Freshwater Fish, tanganyika.si and LiveAquaria cluster around 200 litres for a
        pair at 120 cm length; only Seriously Fish implies about 240 litres through its base area
        at full height.
    - field: features.lifespanYears
      proposals:
        - {by: generator, value: {min: 6, max: 10}}
        - {by: checker-a, value: {min: 10, max: 15}}
        - {by: checker-b, value: {min: 8, max: 12}}
      decision: {min: 8, max: 12}
      rationale: >-
        No reliable source gives a lifespan; all three values are estimates. The median of the
        estimates is taken at low confidence.

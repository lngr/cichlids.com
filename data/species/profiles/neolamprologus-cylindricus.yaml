  socialBehavior:
    text: "One compatible adult pair is the recommended unit. Wild adults can occupy separate refuges and the pair\
      \ relationship need not remain stable between broods. A temporary juvenile group may let partners select one\
      \ another, but excluded adults cannot safely remain indefinitely. Dominant males can kill subordinates, and\
      \ a male can also turn on a former partner. Persistent hiding, missed meals or confinement near the surface\
      \ require prompt separation. Breeding can greatly enlarge the defended area. The compatibility features therefore\
      \ assign conspecific aggression 4, heterospecific aggression 3 and a large territory."
    sources:
    - kind: literature
      title: "Borstein, R. (2004). Neolamprologus cylindricus. Greater Chicago Cichlid Association breeding report"
      url: "https://www.gcca.net/art-pics/cichlid-profiles-list/tanganyikan-cichlids/107-neolamprologus-cylindricus.html"

  sexing:
    text: "Adult males generally grow larger than females, while the sexes share the same basic barred pattern.\
      \ Relative size helps most when comparing adults of similar age. Fin shape and the fuller body of a ripe female\
      \ can provide clues, but neither is dependable in young fish. Yellow or orange head markings are also unreliable\
      \ because trade forms and age-related fading complicate their interpretation. An experienced keeper can examine\
      \ the genital papilla when sex determination is necessary. A male and female are not automatically a compatible\
      \ pair."

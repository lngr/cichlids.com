    tolerance:
      value:
        min: 23
        max: 29
      confidence: medium
      rationale: "All four runs proposed 23 to 29 C, and the tally retains that interval with unanimous verification\
        \ and medium confidence. B-Aqua recommends 23 to 28 C, Aqua-Fish 24 to 27 C, AquariumDomain about 24.4 to\
        \ 27.8 C and Fishkeeper 24 to 26 C. The adopted upper endpoint is expanded to include the natural range\
        \ rather than demonstrated by years of aquarium observation at 29 C. The central mid-twenties are more consistently\
        \ supported for routine keeping."

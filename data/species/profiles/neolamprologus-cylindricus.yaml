  legacyNames:
  - Neolamprologus cylindricus
  note: "The Catalog of Fishes recognizes Neolamprologus cylindricus Staeck & Seegers, 1986 in its original genus.\
    \ Neolamprologus leleupi and Neolamprologus longior are separately valid species; longior was first described\
    \ as a leleupi subspecies. Lamprologus cylindricus is an alternative combination used in the hobby, not an independently\
    \ described synonym established by the catalog. Lamprologus adriani and the Forsberg 1985 attribution in B-Aqua\
    \ are not adopted. The public CRC page confirms the name and cave breeding. Similar shape does not establish\
    \ a closest-relative relationship with leleupi or longior."

variants:
- name: Kalambo Lodge
  kind: locality
  note: Named locality stock in Tanganyika.si; no separate species or care category is implied.
- name: Green
  kind: color-morph
  note: Tanganyika.si associates this greener form with Izinga Island and reports a different body-bar count.
- name: Gold Head
  kind: color-morph
  note: "Trade labels for fish with warm head markings. Tanganyika.si attributes a possible longior cross to Konings,\
    \ while Smith's CRC review disputes a leleupi-cross interpretation and reports fading juvenile markings. These\
    \ accounts do not establish that all Golden or Gold Head fish share one pedigree."

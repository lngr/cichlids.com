  temperatureC:
    value:
      min: 23
      max: 29
    confidence: high
    rationale: The tally fixes the lake-wide natural interval at 23 to 29 C with waterbody verification. Plisnier
      et al. measured southern seasonal surface means of 24.4 and 27.2 C and documented cooler upwelling; Langenberg
      reproduces those observations and the cool-season isotherms. These narrower observations corroborate lake
      seasonality rather than independently establishing every endpoint of the prescribed synthesis. The two publications
      partly share data. Aquarium recommendations are kept in tolerance.
    sources:
    - kind: literature
      title: "Plisnier et al. (1999). Limnological annual cycle inferred from physical-chemical fluctuations at\
        \ three stations of Lake Tanganyika. Hydrobiologia 407, 45-58"
      url: "https://doi.org/10.1023/a:1003762119873"
      archived: doi.org/10.1023_a_1003762119873/2026-10-13T163945Z
      accessed: '2026-10-13'
    - kind: literature
      title: "Langenberg, V. T. (2008). On the limnology of Lake Tanganyika. PhD thesis, Wageningen University"
      url: "https://doi.org/10.18174/121977"
      archived: doi.org/10.18174_121977/2026-10-13T092439Z
      accessed: '2026-10-13'

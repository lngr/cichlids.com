partners:
  suitable:
  - species: Altolamprologus calvus
    reason: "A robust, differently shaped Tanganyikan cichlid listed among conditional companions; fry are still\
      \ at risk."
    condition: "Adults only in at least 300 L and 150 cm length, with separate rock retreats and removal available\
      \ if exclusion occurs."
  - species: Altolamprologus compressiceps
    reason: Its deep compressed body differs from cylindricus; compatible food and lake chemistry make it a conditional
      option.
    condition: At least 300 L and 150 cm length with distinct territories; assess this as an alternative to calvus
      rather than automatically adding both.
  - species: Cyprichromis leptosoma
    reason: An open-water shoal reduces direct competition for cave sites and is named as a companion group by specialist
      care sources.
    condition: Maintain an appropriate adult shoal in at least 300 L and 150 cm length with unobstructed swimming
      space; separate if a spawning pair drives it into a corner.
  unsuitable:
  - species: Neolamprologus leleupi
    reason: Similar body shape and competing rock territories can provoke severe aggression; sources also give a
      presumed named crossing risk.
  - species: Neolamprologus longior
    reason: "Similar cave use and body outline invite conflict, and specialist databases warn of crossing with cylindricus."
  - species: Neolamprologus multifasciatus
    reason: "Small adults and fry can be attacked or eaten, particularly where the shell patch borders a breeding\
      \ territory; unsuitable in the minimum pair tank."
profile:
  overview:
    text: "Neolamprologus cylindricus combines a slender barred body with strong territorial behavior. It is endemic\
      \ to southeastern Lake Tanganyika and belongs to the cave-breeding lamprologines. The pale and dark bars and\
      \ blue fin edges distinguish it from the yellow fish often sold as leleupi or longior. All three names remain\
      \ valid in the Catalog of Fishes. A compatible pair offers interesting brood care, but even a small adult\
      \ can injure rivals and dominate a substantial aquarium area."
    sources:
    - kind: catalog-of-fishes
      title: "Eschmeyer's Catalog of Fishes: species of Neolamprologus, update of 21 September 2026"
      url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Neolamprologus"
      archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-15c05e25/2026-10-14T101710Z
      accessed: '2026-10-13'
    - kind: database
      title: "FishBase: Neolamprologus cylindricus species summary"
      url: "https://www.fishbase.se/summary/Neolamprologus-cylindricus.html"
      archived: fishbase.se/summary/neolamprologus-cylindricus.html/2026-10-14T101816Z
      accessed: '2026-10-13'
    - kind: literature
      title: "Borstein, R. (2004). Neolamprologus cylindricus. Greater Chicago Cichlid Association breeding report"
      url: "https://www.gcca.net/art-pics/cichlid-profiles-list/tanganyikan-cichlids/107-neolamprologus-cylindricus.html"
      accessed: '2026-10-13'
  habitat:
    text: "Rock crevices in the shallow southeastern lake provide shelter and feeding sites. FishBase places this\
      \ fish mainly in the upper 10 m of the rocky habitat. The type locality lies south of the Kalambo River mouth\
      \ in Zambia; the known range also includes Tanzania. Natural lake ranges are 23 to 29 C, pH 8.4 to 9.4, GH\
      \ 10 to 13 dGH and KH 15 to 20 dKH. Southern upwelling causes seasonal cooling. These lake-wide values describe\
      \ habitat chemistry and seasonal conditions, while aquarium tolerance is estimated separately."
    sources:
    - kind: catalog-of-fishes
      title: "Eschmeyer's Catalog of Fishes: species of Neolamprologus, update of 21 September 2026"
      url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Neolamprologus"

    - neolamprologus-cylindricus-longior
    confidence: low
    rationale: "The generator, checker-b, checker-c, tiebreaker-1 and tiebreaker-2 proposed both cylindricus-leleupi\
      \ and cylindricus-longior pairwise ids; checker-a proposed only cylindricus-leleupi. The tally retains both\
      \ by qualified majority, 5 of 6 votes, with low confidence. B-Aqua explicitly cautions about each pair; Dubosc\
      \ adds a warning under historically combined leleupi/longior names. My-fish and Fishkeeper specifically warn\
      \ about leleupi, while Tanganyika.si attributes possible Golden cylindricus ancestry to longior. A 2012 forum\
      \ fish was identified as leleupi x cylindricus without verified parents or mate-choice circumstances. Both\
      \ groups therefore have presumed basis. Smith's CRC review, used only for verification, disputes hybrid interpretation\
      \ of juvenile gold heads; appearance alone does not establish parentage. Sturmbauer et al. place cylindricus\
      \ in mitochondrial clade I and leleupi/longior in clade VI, so resemblance is not evidence that all three\
      \ are closest relatives. No free-choice cross or hybrid fertility was verified, and no all-pairs or genus-wide\
      \ group is inferred. Aquatics Unlimited was blocked and is not counted as read crossing evidence."

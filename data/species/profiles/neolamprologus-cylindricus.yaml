  compatibility:
    text: "A dedicated pair aquarium is often easier to manage, but species-only housing is not obligatory. In at\
      \ least about 300 litres and 150 cm length, robust adult Altolamprologus calvus or A. compressiceps can be\
      \ assessed as conditional companions with separate retreats. A suitable Cyprichromis leptosoma shoal uses\
      \ open water, provided the spawning pair cannot confine it. These combinations require observation and do\
      \ not guarantee coexistence. Small shell dwellers are poor choices in the minimum pair tank because of territorial\
      \ pressure and risk to fry. Avoid leleupi and longior: each shares a separate presumed crossing caution with\
      \ cylindricus as well as competing cave use. No verified free-choice crossing or fertility result establishes\
      \ either caution as documented."
    sources:
    - kind: literature
      title: "Borstein, R. (2004). Neolamprologus cylindricus. Greater Chicago Cichlid Association breeding report"

      confidence: medium
      rationale: "The generator and checker-c proposed 7.8 to 9.5, checker-a 7.5 to 9.4 and checker-b 8.0 to 9.4.\
        \ The tally treats all four as agreeing within its pH threshold and takes the median bounds, rounded to\
        \ 7.8 and 9.5, with unanimous verification and medium confidence. Fischlexikon gives 7.8 to 9.0 and AquariumDomain\
        \ 8.5 to 9.5. Wider lower extensions in B-Aqua at 7.5 and FishBase at 7.0 lack long-term outcome evidence;\
        \ the adopted lower bound is more cautious than those proposals. This is a care-sheet estimate that contains\
        \ natural pH, not a controlled chronic-tolerance result. Aquatics Unlimited and Gensou were blocked and\
        \ are excluded from the supporting source count."

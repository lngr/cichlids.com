  problems:
    text: "Aggression is the principal practical difficulty. A damaged or repeatedly cornered fish needs protection\
      \ even when water tests are satisfactory. Check feeding access, oxygenation and waste trapped among rocks,\
      \ and keep replacement water similar in temperature and chemistry. Quarantine new arrivals and investigate\
      \ persistent appetite loss or abnormal behavior. A failed pair may need permanent separation. Golden or Gold\
      \ Head labels do not establish hybrid parentage: hobby sources disagree about the ancestry of these fish,\
      \ and juvenile warm markings can fade. The profile retains only presumed pairwise crossing cautions and makes\
      \ no claim that all Neolamprologus interbreed."
    sources:
    - kind: literature
      title: "Borstein, R. (2004). Neolamprologus cylindricus. Greater Chicago Cichlid Association breeding report"

  ph:
    value:
      min: 8.4
      max: 9.4
    confidence: high
    rationale: "The tally fixes the lake-wide natural interval at 8.4 to 9.4 with waterbody verification. Plisnier\
      \ et al. report 8.47 to 9.40 at 40 m in the north and 8.66 to 9.12 at Mpulungu; Langenberg reproduces these\
      \ annual measurements. The narrower southern interval does not replace the common lake-wide range. The old\
      \ FAO compilation gives 7.3 to 7.8, conflicting with these modern measurements, and is not adopted as pH evidence."
    sources:
    - kind: literature
      title: "Plisnier et al. (1999). Limnological annual cycle inferred from physical-chemical fluctuations at\
        \ three stations of Lake Tanganyika. Hydrobiologia 407, 45-58"
      url: "https://doi.org/10.1023/a:1003762119873"

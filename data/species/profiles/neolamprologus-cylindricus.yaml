  breeding:
    text: "Mutual acceptance between the adults matters more than any spawning stimulus. Offer several narrow sheltered\
      \ cavities. Eggs are deposited on a protected internal surface; the female remains near the eggs and early\
      \ young while the male typically defends the surroundings. Both adults contribute to brood protection. Published\
      \ hatch times and brood counts vary, so observe development instead of relying on a fixed schedule. Free-swimming\
      \ young can take freshly hatched Artemia and other appropriately small foods. Breeding may force companions\
      \ far from the nest, and the parents themselves still need monitoring."

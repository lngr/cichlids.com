  diet:
    text: "Small aquatic invertebrates form the main natural diet. Offer suitably sized carnivore pellets and vary\
      \ them with Mysis, Artemia, Daphnia or finely chopped aquatic crustaceans. Check that the less dominant partner\
      \ receives food and remove uneaten portions from shelters. Reports also include small fish and fish larvae,\
      \ so fry and tiny companions may be consumed. This supports predation level 1 rather than specialized piscivory.\
      \ No evidence establishes a special protein-related bloat sensitivity, although digestive illness can still\
      \ occur."

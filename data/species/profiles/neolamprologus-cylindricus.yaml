  husbandry:
    text: "For one already compatible pair, plan at least 210 litres and a footprint of 120 by 40 cm. Build stable\
      \ rock shelters with broken sight lines and several escape routes. Juvenile pair selection and a mixed community\
      \ require more space. Mature filtration, regular maintenance and good oxygenation are essential. Routine temperatures\
      \ around 24 to 27 C have stronger husbandry support than continuously using either tolerance endpoint. Recorded\
      \ tolerances are 23 to 29 C, pH 7.8 to 9.5, GH 10 to 20 dGH and KH 15 to 20 dKH. Keep chemistry stable and\
      \ measure GH and KH separately; these boundaries are care estimates rather than experimental lifetime limits.\
      \ Have a divider or spare aquarium available before introducing adults."
    sources:
    - kind: database
      title: "Tanganyika.si: Neolamprologus cylindricus, Kalambo Lodge"
      url: "https://tanganyika.si/Tanganjika/Neolamprologus/Neolamprologus%20cylindricus/slides/Neolamprologus%20cylindricus%20%27Kalambo%20Lodge%27.html"

      \ rounded typical maxima of 13 and 10 cm are adopted. Aqua-Fish independently gives an unsexed aquarium interval\
      \ of 11 to 13 cm. FishBase 10.4 cm is male/unsexed total length, not a female aquarium maximum. Tanganyika.si\
      \ gives 11 to 12 cm and B-Aqua gives separate standard-length estimates, so neither is silently treated as\
      \ an identical total-length measurement. Confidence stays medium because sexed numerical evidence is limited."

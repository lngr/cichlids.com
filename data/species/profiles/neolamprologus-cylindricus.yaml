  sizeAndGrowth:
    text: "Allow for an adult male around 13 cm and a female around 10 cm. The sexed breeding account reports males\
      \ about 12.7 cm and females about 8.9 to 10.2 cm; many fish remain below these upper values. FishBase's 10.4\
      \ cm record is male or unsexed total length and does not establish the female aquarium maximum. Young fish\
      \ develop dominance as they mature, so extra adults may need removal. Two care databases estimate 10 to 12\
      \ years with good care, although neither provides validated ages."

    confidence: high
    rationale: "All four profiles identify the same southeastern Lake Tanganyika endemic, with differently worded\
      \ regional and locality lists. The Catalog of Fishes fixes the type locality in Zambia south of the Kalambo\
      \ mouth. Tanzania and Zambia are supported by FishBase and the public CRC summary. More precise range endpoints\
      \ proposed by the generator and the checkers disagree across hobby sources, so they are not encoded as verified\
      \ boundaries. B-Aqua includes Congo and Tanganyika.si puts the type locality in Tanzania; neither conflicts\
      \ with the authoritative Zambian type record adopted here."

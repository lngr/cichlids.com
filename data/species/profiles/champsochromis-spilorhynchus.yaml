profile:
  overview:
    text: "A substantial aquarium and careful control of male courtship are central to keeping
      Champsochromis spilorhynchus. This fish-eating cichlid lives in the Lake Malawi system and
      pursues smaller fishes in open water. Its deep-bodied profile and dark marking in front of the
      eye help distinguish it from Champsochromis caeruleus. It is a maternal mouthbrooder, with
      successful captive breeding reported, but its space requirements make it a demanding species."
    sources:
      - *a3
      - *a4
      - *a1
  habitat:
    text: "Records extend from Lake Malawi into Lake Malombe and the upper Shire River. Adults use water
      above sand and mud and can range offshore; shallow vegetated bays also matter, especially to
      younger fish. Preserve a long open swimming lane, with sand below and refuges or planted
      margins that do not block it. The natural planning baseline is 21 to 29 C, pH 7.7 to 8.6, GH 3
      to 5 dGH and KH 5 to 8 dKH. These lake-wide ranges combine places and seasons; every
      individual collection site need not span the entire envelope."
    sources:
      - *a2
      - *a4
      - *a3
      - *a7
      - *a31
      - *a9
      - *a20
      - *a12
  sizeAndGrowth:
    text: "Allow for typical adult planning sizes of approximately 35 cm for males and 30 cm for
      females. Malawi.si separates the sexes at about these values, whereas FishBase lists 30 cm
      total length without a female maximum. Seriously Fish gives 35 cm standard length, a
      measurement excluding the tail, so the numbers cannot be compared as if they used one
      convention. Adult size varies and the female estimate is less securely documented. Fishipedia
      suggests about ten years of life, a provisional hobby estimate rather than a verified maximum
      age."
    sources:
      - *a7
      - *a2
      - *a4
      - *a28
      - *a29
  husbandry:
    text: "For one male with three females, provide at least 1000 L, 250 cm of length and about 70 cm of
      front-to-back space. The depth is a practical allowance for turning adults and maintaining
      separate refuges. Additional large companions require a larger system. Use mature biological
      filtration, good surface movement and regular maintenance, and monitor water quality as
      feeding and growth increase the load. Routine temperature guidance is concentrated around 24
      to 27 C. Keep alkaline conditions stable and measure GH and KH separately: Malawi water has
      low calcium-magnesium hardness despite appreciable alkalinity. The wider tolerance limits
      express uncertainty around husbandry experience and should not be interpreted as preferred
      endpoints."
    sources:
      - *a4
      - *a7
      - *a31
      - *a28
      - *a9
  socialBehavior:
    text: "One male with at least three females is the practical group used here. Males can pursue
      unreceptive females intensely and challenge rival males, making retreat space and supervision
      necessary. Adults are largely solitary outside breeding in field accounts. A large breeding
      area is plausible, but evidence for its exact size is weak: Malawi-Guru describes large sand
      structures in the lake, while aquarium reports describe spawning without construction. Large
      tankmates may be tolerated quite calmly; that behavior does not remove the risk of swallowing
      smaller animals."
    sources:
      - *a4
      - *a7
      - *a31
      - *a3
  diet:
    text: "Plan a varied animal-based diet appropriate for a fish predator. Suitable aquarium items
      include shrimp, mussel, cockle and fish portions; accepted carnivore pellets can contribute
      without becoming the only food. Live feeder fish are unnecessary. Give portions that maintain
      a lean adult condition and remove uneaten food. Wild prey includes smaller haplochromines and
      juvenile utaka. No established need for the low-protein plant diet used for some grazing
      cichlids was found; this does not exclude digestive illness or problems caused by excess
      feeding."
    sources:
      - *a4
      - *a2
      - *a3
      - *a28
      - *a15
  breeding:
    text: "The female gathers the eggs and broods them in her mouth. Aquarium accounts describe roughly
      three to four weeks before fry release, and large broods are possible. Courtship can be
      forceful, so multiple females and accessible retreats are important. Disturbance or capture
      may cause a holding female to lose the brood; decisions about separation need to balance
      immediate harassment against disruption. Reports disagree about sand construction: a lake
      account describes substantial breeding structures, but no constructed spawning site is
      reported in the specialist aquarium account. Construction should not be assumed necessary for
      spawning."
    sources:
      - *a4
      - *a3
      - *a2
      - *a31
      - *a7
  sexing:
    text: "Adult males usually grow larger and develop stronger display colour than females. Extended
      soft fin rays may become apparent in mature males; females generally lack the same extensions.
      Juveniles can be difficult to sex before these differences develop. The dark facial mark is a
      species character shared by both sexes and is not a reliable sex test."
    sources:
      - *a4
      - *a28
      - *a7
  compatibility:
    text: "Assess body size before temperament. A fish that can be swallowed remains unsuitable even if
      the predator appears calm toward larger companions. Large Fossorochromis and some robust
      Malawi predators are conditional possibilities in systems larger than the minimum harem
      aquarium; mbuna and small utaka are poor choices. Fishipedia favors species-focused housing,
      while Seriously Fish permits sufficiently large companions. No supported hybrid group was
      found for this species, and a cross involving Champsochromis caeruleus does not establish one
      for spilorhynchus. The forum archive contributes only congener context and unrelated
      broad-search hits, with no exact-name experience to settle these questions."
    sources:
      - *a4
      - *a31
      - *a29
      - *a3
      - *a37
      - *a38
      - *a39
      - *a40
      - *a41
      - *a42
      - *a43
      - *a44
  problems:
    text: "Loss of small companions, female harassment and insufficient room for adult swimming are the
      clearest foreseeable problems. Watch courting males and provide refuge before females become
      exhausted or injured. Excess food and the waste from a large predator can degrade water
      quality quickly; steady filtration and maintenance remain essential even in a large tank. No
      well-supported species-specific bloat syndrome was found. Appetite changes, heavy breathing,
      wounds or deteriorating body condition warrant checking both the social setting and water
      quality."
    sources:
      - *a4
      - *a7
      - *a15
      - *a2

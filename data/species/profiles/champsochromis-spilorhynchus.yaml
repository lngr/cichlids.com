    tolerance:
      value: &a46
        min: 21
        max: 30
      confidence: "low"
      rationale: "The settled tally gives 21 to 30 C, unanimous under the one-degree agreement rule, with
        low confidence. Proposals were generator 21 to 29, checker-a 21 to 30, checker-b 21 to 29
        and checker-c 20 to 30 C. The rounded median of these agreeing endpoints gives 21 to 30,
        containing the natural 21 to 29 C range. Seriously Fish recommends 24 to 27, Zoopet 23 to 27
        and Aqualog 22 to 25 C; the retailer gives about 23.3 to 28.9 C. The wider checker-c lower
        proposal of 20 C lacks direct support and is not retained. The 30 C upper endpoint is an
        inferred allowance, not a demonstrated multiyear exposure result; routine husbandry is
        better documented near 24 to 27 C."

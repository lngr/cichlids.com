  temperatureC:
    value:
      min: 21
      max: 29
    confidence: "high"
    rationale: "The settled lake decision is 21 to 29 C with waterbody verification and high confidence.
      All four runs proposed that range. It synthesizes regional and seasonal lake studies rather
      than one species experiment: FAO compiles 23 to 25 C surface readings, and Vollmer et al.
      describe summer water around 28 C and cooler winter mixing. The inherited synthesis also cites
      Eccles and Ngochera. Eccles could not be reread because the DOI endpoint returns 403 and
      fetch-oa reports no open access; only the Ngochera repository abstract was accessible, so
      neither is treated here as a newly checked numerical endpoint. FishBase gives 24 to 26 C for
      species ecology, while aquarium recommendations belong separately in tolerance."

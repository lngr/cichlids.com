    - field: features.beginnerSuitability
      proposals:
        - by: generator
          value: demanding
        - by: checker-a
          value: moderate
        - by: checker-b
          value: demanding
        - by: checker-c
          value: demanding
      decision: demanding
      rationale: "Generator, checker-b and checker-c propose demanding; checker-a moderate. CRC, a high-trust specialist\
        \ database, gives a broad beginner-species label and DRTA also labels it suitable for beginners. Those labels\
        \ are retained as dissenting evidence. The more detailed captive observations at Fishkeeper explicitly report\
        \ deaths of unreceptive females, and Oliver warns against this species for new Malawi keepers. These observations\
        \ of actual husbandry consequences carry more relevance for the practical suitability decision than an unexplained\
        \ categorical label. The demanding decision reflects the experienced aggression management required by the\
        \ level-4 conspecific rating, rather than difficult feeding or water preparation."

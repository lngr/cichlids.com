        \ qualified-majority decision is omnivore with bloatSensitive true, four of six votes, confidence medium.\
        \ The revision, FishBase and CRC support mixed plant and animal feeding. Atlas explicitly connects excess\
        \ protein feeding with mbuna bloat, while the dissenting scientific accounts do not test bloat and their\
        \ silence cannot establish resistance. The two Atlas domains contain the same account. Aqua-Fish advises\
        \ restricted rich animal foods, DRTA fiber and Fischlexikon avoidance of unsuitable mammalian fats; these\
        \ are supporting husbandry context, not controlled protein trials. Abysse's algivorous label and AquaInfo's\
        \ herbivore metadata are retained, but detailed accounts of invertebrates, fry, eggs and plankton rule out\
        \ a strict plant-only interpretation. AquaInfo's English URL is unreadable, while its Dutch archived HTML\
        \ is readable. The decided food list is copied exactly from the tally; suitable aquarium foods are discussed\
        \ separately."
    - field: features.aggressionConspecific
      proposals:
        - by: generator
          value: 3
        - by: checker-a
          value: 4
        - by: checker-b
          value: 3
        - by: checker-c
          value: 3
      decision: 4
      rationale: "Generator, checker-b and checker-c propose level 3; checker-a proposes 4. The median proposal\
        \ is 3, but direct captive reports are more specific than a general aggression label: Fishkeeper reports\
        \ fatal harassment of lone or unreceptive females and Oliver describes lethal male dominance. These observations\
        \ meet level 4 even though appropriate space, a single male and several females reduce the risk. Forum thread\
        \ 59529 adds an unverified account of pursuit of a brooding female, not a mortality measurement."
    - field: features.aggressionHeterospecific
      proposals:
        - by: generator
          value: 2
        - by: checker-a
          value: 3
        - by: checker-b
          value: 2
        - by: checker-c
          value: 2
      decision: 2
      rationale: "Generator, checker-b and checker-c propose 2; checker-a proposes 3. Malawi.si specifically distinguishes\
        \ strong conspecific aggression from relative tolerance of other species, supporting territorial displacement\
        \ at level 2. Fishkeeper and Aqua-Fish use stronger general aggression descriptions and require robust companions,\
        \ but do not document routine attacks beyond the territory in an adequately arranged adult tank. Their level-3\
        \ interpretations remain evidence; tolerance does not make delicate companions suitable."

    tolerance:
      value: &id074
        min: 20
        max: 30
      confidence: low
      rationale: "Generator, checker-b and checker-c propose 20 to 30 C; checker-a proposes 21 to 29 C. All four\
        \ agree within the tally's one-degree comparison rule, giving unanimous verification and a decided 20 to\
        \ 30 C with low confidence. This inferred keeping interval contains the natural 21 to 29 C range and extends\
        \ beyond it; it is not a demonstrated long-term survival threshold. Fishkeeper and FishBase give 24 to 26\
        \ C, Aqua-Fish 22 to 27 C, Atlas approximately 24 to 28 C, and related Seriously Fish profiles 23 to 28\
        \ C. These narrower husbandry targets do not establish harm outside them. The Atlas domains carry the same\
        \ account and do not provide independent corroboration."

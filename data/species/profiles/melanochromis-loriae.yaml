            max: 16
        - by: tiebreaker-2
          value:
            min: 3
            max: 12
      decision: *id076
      rationale: "Settled tally method median. No qualified majority exists among six proposals: generator 3 to\
        \ 10, checker-a 3 to 25, checker-b 3 to 15, checker-c 3 to 15, tiebreaker-1 3 to 16 and tiebreaker-2 3 to\
        \ 12 dGH. The endpoint medians are 3 and 15, so the settled method is median with low confidence and votes\
        \ 3 of 6. The lower endpoint contains the natural lake minimum rather than imposing care sheets' higher\
        \ minima. AquaInfo recommends 12 to 16 dGH; DRTA gives 5 to 12; Fischlexikon gives the wider 5 to 20 with\
        \ 5 to 12 preferred; Aqua-Fish, Mongabay and related Seriously Fish accounts give the wider 10 to 25, and\
        \ Fishkeeper states an upper value of 25. Atlas gives an upper GH value near 10 but its extracted narrative\
        \ omits the numeric panel. These are conflicting recommendations, not demonstrated injury thresholds. The\
        \ middle interval is plausible for Malawi keeping and does not need a water-plausibility replacement. A\
        \ broader aquarium recommendation does not contradict softer natural water, which is a different fact."

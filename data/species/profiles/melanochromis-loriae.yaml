  temperatureC:
    value:
      min: 21
      max: 29
    confidence: high
    rationale: "The lake-wide natural interval is 21 to 29 C and retains the settled waterbody decision. FAO compiles\
      \ 23 to 25 C surface readings, Branchu measures 25.4 C at the surface to 22.8 C at depth in one campaign,\
      \ and Vollmer documents seasonal surface warming to about 28 C and cooling below 24 C. The full synthesis\
      \ also includes cooler littoral and warmer seasonal observations rather than treating one campaign as the\
      \ entire habitat. FishBase's 24 to 26 C species summary is narrower and remains evidence. Some inherited entries\
      \ attach the aggregate 21 to 29 C interval to one study; the direct readings added below distinguish measurement\
      \ from synthesis. Eccles is retained as an inherited citation, but its full text is not open access and its\
      \ publisher page is blocked."
    sources:

    confidence: high
    rationale: "All runs agree on Lake Malawi. Their locality lists are complementary, except for spelling variants\
      \ and whether the introduced population is included. The revision defines the native northern-half distribution\
      \ from Mphanga Rocks and Lutara to Kande Island and Tumbi Point, including Likoma and Chizumulu; Thumbi West\
      \ is introduced. Malawi.si adds Chiwi Rocks. Chisumulu is standardized to Chizumulu. The DRTA and Fischlexikon\
      \ statement that it is absent from the east coast conflicts with the revision and is not adopted."

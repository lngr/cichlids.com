partners:
  suitable:
    - species: Robust Lake Malawi mbuna with contrasting patterns
      reason: Species-specific husbandry accounts allow other assertive mbuna; individual behavior and feeding needs
        determine whether a particular combination works.
      condition: "Use an aquarium larger than the 400 L single-harem minimum, with separate rock refuges and close\
        \ observation during introductions."
  unsuitable:
    - species: Melanochromis auratus
      reason: Shares the presumed melanochromis hybrid group and a similar striped pattern; substantial aggression
        adds to the concern.
    - species: Pseudotropheus johannii
      reason: Shares the curated presumed melanochromis hybrid group despite its valid genus combination; its similar
        pattern can also trigger rivalry.
    - species: Aulonocara stuartgranti
      reason: A quieter non-mbuna is a poor companion for a strongly territorial mbuna; specialist husbandry advice
        warns against this social combination.
    - species: Fish fry and very small fish
      reason: Opportunistic predation at level 1 exposes fry and fish around 2 cm or smaller to being eaten.
profile:
  overview:
    text: "Melanochromis loriae is a Lake Malawi mbuna whose appearance changes markedly with sex and social status.\
      \ Pale females and young fish carry dark horizontal lines; dominant adult males show pale-blue lines against\
      \ a dark body. Melanochromis parallelus is a synonym and remains a useful name when tracing aquarium records.\
      \ The species takes both rock biofilm and animal food, including fry. In captivity its main challenge is social\
      \ management: males can kill females or rivals when the group and shelter are unsuitable. A carefully arranged\
      \ single-male harem provides a practical basis for keeping it, with robust mbuna companions possible in a\
      \ larger aquarium."
    sources:
      - *id002
      - *id053
      - *id017
      - *id047
      - *id065
      - *id009
  habitat:
    text: "The native range spans rocky shores and reefs in the northern half of Lake Malawi, including Likoma and\
      \ Chizumulu islands. Thumbi West holds an introduced population. Most observations fall between about 5 and\
      \ 20 m depth, with FishBase listing records from 3 to 40 m. Rock is the main habitat, with use of sandy gaps\
      \ and intermediate edges; plankton can draw fish into the water above the rocks. Accounts disagree about sediment\
      \ loading, so a single sediment-rich or sediment-free label is too restrictive. The natural lake intervals\
      \ are 21 to 29 C, pH 7.7 to 8.6, GH 3 to 5 dGH and KH 5 to 8 dKH. Lake alkalinity exceeds total hardness,\
      \ which explains why alkaline water here is relatively soft."
    sources:
      - *id002
      - *id009
      - *id047
      - *id053
      - *id014
      - *id012
      - *id015
      - *id031
  sizeAndGrowth:
    text: "Typical adult aquarium maxima are estimated at about 13 cm for males and 10.5 cm for females. Some specialist\
      \ accounts give males to 15 cm, while other care sheets describe adults around 10 to 13 cm. FishBase's 11.4\
      \ cm maximum uses standard length, excluding the tail, so it is not directly comparable to aquarium total\
      \ lengths. Excess feeding can increase size without improving condition. A provisional captive lifespan estimate\
      \ is six to eight years; the upper figure comes from hobby accounts, while the lower figure is an estimate\
      \ rather than a measured age limit."
    sources:
      - *id047
      - *id022
      - *id009
      - *id018
      - *id044
  husbandry:
    text: "Allow at least 400 L and a practical footprint around 150 by 50 cm for one male with five females. Arrange\
      \ stable rocks into several sheltered routes and visual barriers, with sand between structures and enough\
      \ space for subordinate fish to retreat. The 50 cm depth is an inferred working dimension. Provide strong\
      \ oxygenation and filtration and maintain clean water. Routine care advice clusters around 24 to 28 C and\
      \ stable alkaline pH; the wider recorded tolerances are provisional keeping intervals rather than targets\
      \ to pursue. They are 20 to 30 C, pH 7.5 to 8.9, GH 3 to 15 dGH and KH 5 to 12 dKH. Increasing hardness is\
      \ not a substitute for checking pH and alkalinity separately. Additional species need additional space beyond\
      \ the harem minimum."
    sources:
      - *id047
      - *id022
      - *id017
      - *id014
      - *id036
      - *id041
      - *id063
  socialBehavior:
    text: "An adult male with five females is the recommended aquarium unit. A male can pursue unreceptive or brooding\
      \ females persistently, and deaths are reported when protection and group structure are inadequate. Several\
      \ males need much more space than this minimum and are unsuitable for a routine harem setup. Established fish\
      \ may also defend rockwork against newcomers outside a spawning event. Territory size is poorly quantified;\
      \ the profile treats it as a cave and its surroundings rather than assuming defense of half the aquarium.\
      \ Wild feeding groups can contain many individuals, including breeding-colored males without territories,\
      \ but those observations do not demonstrate safety for a confined mixed-male group."
    sources:
      - *id017
      - *id022
      - *id002
      - *id062
      - *id047
      - *id063
  diet:
    text: "Provide a varied omnivore diet with a substantial algae and plant component and suitable small aquatic\
      \ animal foods. Wild observations include rock biofilm, invertebrates, plankton, fry and catfish eggs; females\
      \ also remove parasites or fungal growth from larger fish. That cleaning behavior is an opportunistic food\
      \ source rather than a reason to mix delicate large fish with this mbuna. The profile flags bloat sensitivity\
      \ because husbandry advice warns about excessive rich protein feeding, although a controlled species-specific\
      \ susceptibility trial is lacking. Use portions that maintain good condition and allow subordinate fish to\
      \ feed; avoid making fatty mammalian ingredients a dietary staple."
    sources:
      - *id002
      - *id009
      - *id023
      - *id017
      - *id038
      - *id053
      - *id047
  breeding:
    text: "Females incubate eggs and developing young in the mouth. Spawning occurs beside or on rocks and commonly\
      \ within a cave; the male provides no mouthbrooding care. Male attention can become dangerous before or after\
      \ spawning, so shelter for females is essential. Hobby accounts describe incubation near three to four weeks,\
      \ with variation in temperature and observation methods. A breeding-only species tank is compatible with allowing\
      \ other mbuna in an ordinary display aquarium. Free-swimming fry can be eaten by adults and should not be\
      \ assumed to survive in a community."
    sources:
      - *id053
      - *id017
      - *id047
      - *id018
      - *id009
  sexing:
    text: "Mature dominant males are dark blue to black with contrasting light-blue horizontal markings. Females,\
      \ juveniles and subordinate males can be much paler with dark lines, so a pale fish is not necessarily female.\
      \ The revision identifies a broad dark band in the male dorsal fin and characteristic dark markings in the\
      \ female tail. Similar striped congeners can be difficult to identify from color alone; a reliable species\
      \ identification needs more than the trade name white auratus. The adult-male colors encoded in the planner\
      \ are blue and black, while white mainly describes the female and juvenile appearance."
    sources:
      - *id002
      - *id017
      - *id047
      - *id009
      - *id063
  compatibility:
    text: "A larger Malawi aquarium can hold this species with robust mbuna that differ clearly in appearance, provided\
      \ each fish has refuge and the diets fit. General claims of tolerance toward other species do not imply a\
      \ calm community fish. Timid peacocks and other gentle non-mbuna face excessive social pressure. Other members\
      \ of the curated melanochromis group carry a presumed hybrid risk; this is a genus-level caution rather than\
      \ a documented cross involving loriae. The revision reports no apparent hybrids with heterochromis at their\
      \ introduced shared locality. Fry and fish about 2 cm or smaller may be taken opportunistically."
    sources:
      - *id017
      - *id022
      - *id047
      - *id002
      - *id033
      - *id063
  problems:
    text: "Watch for repeated targeting of one fish, loss of body condition and prolonged hiding. A brooding female\
      \ can be both unwilling to feed and exposed to harassment; the forum archive supplies one practical example\
      \ of that combination without controlled husbandry data. Rockwork needs several escape routes rather than\
      \ isolated caves that trap a weaker fish. Poor water quality and an unsuitable rich diet add stress to an\
      \ already aggressive social system. Swelling, abnormal feces or appetite loss do not identify a cause on their\
      \ own. This species is rated demanding because preventing injury requires active management, despite simpler\
      \ beginner labels in some databases."
    sources:
      - *id017
      - *id062
      - *id022
      - *id038
      - *id053
      - *id063
      - *id047

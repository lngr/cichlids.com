  territory:
    value:
      size: small
      breedingOnly: false
    confidence: medium
    rationale: "Generator, checker-b and checker-c proposed a small territory with breedingOnly true; checker-a\
      \ proposed small with breedingOnly false. The small cave-centered classification agrees across runs and\
      \ with the roughly 30 cm shelter association in FishBase. The field study measured breeding-female home\
      \ ranges of about 0.10-0.57 square metres but sampled breeding groups, so it cannot show that territoriality\
      \ disappears outside spawning. General cave defense and the continuing need for separate refuges in the\
      \ husbandry accounts support breedingOnly false. Defense intensifies during reproduction; the flag does\
      \ not imply a measured nonbreeding territory size."
    sources:
    - kind: literature
      title: "Satoh, S., Yoshio, Y. and Morita, M. (2025). Social composition and relatedness of the cooperatively\

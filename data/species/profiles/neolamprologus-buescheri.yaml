    rationale: "The natural 23-29 C lake envelope is retained exactly. Verburg and colleagues recorded hourly\
      \ near-surface values of 23.85-29.01 C at Mpulungu, while the Plisnier surveys describe cooler southern\
      \ upwelling. These measurements support a rounded lake-wide envelope rather than the narrower aquarium recommendations.\
      \ Inherited care-sheet evidence is retained as keeping advice and does not determine the natural range."

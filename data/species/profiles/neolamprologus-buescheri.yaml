  breeding:
    text: "Eggs are deposited inside a cave or narrow crevice. The female provides care close to the eggs, while\
      \ the surrounding territory may also be defended by the male and smaller helpers. A 2025 field study found\
      \ 1-7 mature eggs per female, with a median of three, and similarly small broods near the start of free\
      \ swimming. Aquarium accounts often report around 5-20 eggs, and the Nordic association reports a much wider\
      \ 3-70 range. Those aquarium figures are retained as separate reports rather than replacing the direct field\
      \ results. Young can take suitably small live foods such as newly hatched brine shrimp. Growing juveniles\
      \ may eventually be driven away, so prolonged parental tolerance should not be assumed."

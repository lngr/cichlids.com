  social:
    value:
      structure: harem
      ratio: 3
    confidence: medium
    rationale: "All runs recommend a harem, but generator and checker-b propose two females per male and checker-a\
      \ and checker-c three. The numerical starting median is 2.5; three is the practical whole-fish interpretation\
      \ of the several-female recommendation in Seriously Fish and Fishkeeper. Tanganyika.si explicitly allows\
      \ a male with two females, and the Foraquarist breeder describes stable pairs; these remain alternatives\
      \ rather than proof of a universal ratio. Satoh and colleagues directly observed males visiting multiple\
      \ female territories, often with smaller helpers. The field work does not establish a fixed natural sex\
      \ ratio or justify stocking several adult males in the minimum aquarium."

  maxSizeCm:
    value:
      male: 9
      female: 7
    confidence: medium
    rationale: "The proposals are generator 10/7 cm, checker-a 8/7, checker-b 9/6.5 and checker-c 8/6, male/female\
      \ respectively. Their medians are 8.5/6.75 cm; the final 9/7 cm values round that starting point to useful\
      \ whole-centimetre planning estimates. FishBase gives an unsexed 8 cm total-length maximum, whereas Tanganyika.si\
      \ and the Foraquarist breeder report males around 10 cm and females around 7 cm. The field sample has males\
      \ up to 7.245 cm and females up to 5.375 cm standard length, excluding the tail; Seriously Fish's 7 cm is\
      \ also standard length. These measures are not interchangeable. The chosen sex-specific estimates lie within\
      \ the reported aquarium values rather than treating the largest proposal as decisive."

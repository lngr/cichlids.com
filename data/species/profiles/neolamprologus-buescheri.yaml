  problems:
    text: "Watch for a fish that remains trapped behind a rock, stops feeding, has torn fins or cannot leave its\
      \ refuge. These can be signs of sustained social exclusion even when the rest of the aquarium looks calm.\
      \ A layout that works for juveniles may fail as males mature or females begin breeding. Persistent chasing\
      \ requires prompt separation rather than waiting for a pair or hierarchy to settle. Rockwork also makes\
      \ missing fish and uneaten food harder to detect, so maintain observation and cleaning access. Legacy forum\
      \ accounts describe both successful breeding communities and later breakdowns in apparently stable tanks.\
      \ The sources do not establish a distinctive disease syndrome or a measured maximum lifespan."
    sources:
    - kind: database

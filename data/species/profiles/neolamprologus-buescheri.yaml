  habitat:
    text: "The species occurs around southern Lake Tanganyika, from the western coast near Tembwe II around Zambia\
      \ to the eastern coast toward Samazi. It occupies crevices in rocky habitat, often with sediment and nearby\
      \ sand. Many accounts place it deeper than 20 m, although populations occur around 10 m at some sites. The\
      \ Kombe field observations included shallower rocky slopes. Fish usually remain close to refuge. Natural\
      \ water values represent the measured lake envelope: 23-29 C, pH 8.4-9.4, 10-13 dGH and 15-20 dKH. These\
      \ lake-wide values do not imply that every collecting site experiences all endpoints."

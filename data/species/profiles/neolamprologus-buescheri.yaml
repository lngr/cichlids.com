        \ the natural 15-20 dKH envelope. JBL explicitly recommends the wider lower-bound range 8-20 dKH for its\
        \ Tanganyikan feeding group, including buescheri in the earlier edition; aquarium accounts report 12 and\
        \ 15 dKH as point readings. These remain in evidence even though they do not define the median endpoints.\
        \ The 25 and 30 upper proposals were inferred from pH and GH advice, which cannot be converted into KH;\
        \ no read source proves either higher boundary. The retained 23 dKH maximum is a required voting synthesis\
        \ rather than a directly demonstrated long-term limit, so confidence stays low. The JBL editions share\
        \ authorship and are not independent corroboration."

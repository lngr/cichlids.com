  compatibility:
    text: "Species-only housing is often the easiest arrangement to manage, but selected Tanganyikan communities\
      \ are possible in larger aquaria. Open-water Cyprichromis can reduce direct competition for crevices if\
      \ the tank also meets their own group and swimming-space requirements. They can still be chased when they\
      \ approach a defended cave. Other rock breeders compete for the same shelter and are poor choices at the\
      \ stated minimum. Seriously Fish permits some Julidochromis or Altolamprologus combinations only in sufficiently\
      \ large, divided layouts, whereas Tanganyika.si advises against similar rock dwellers. Shell dwellers receive\
      \ conflicting hobby recommendations; the clearer warnings from Seriously Fish and Fishkeeper are preferred\
      \ here. Fry and tiny fish are vulnerable to opportunistic feeding, and large predators may in turn threaten\
      \ buescheri."

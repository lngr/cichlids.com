  socialBehavior:
    text: "Plan for a single adult male and several females, with three females used here as the aquarium recommendation.\
      \ A compatible pair can also work, but an established pair is not evidence that any two adults will accept\
      \ each other. Dominant males may kill other males, and a rejected female needs an escape option. Cave-centered\
      \ defense is treated as continuing territorial behavior that intensifies around reproduction. In the wild,\
      \ females may share shelters with smaller helpers, and males visit several female territories. These groups\
      \ include relatives and carefully negotiated social ranks. Their existence does not justify crowding unrelated\
      \ adults or keeping multiple males in the minimum tank."
    sources:
    - kind: literature
      title: "Satoh, S., Yoshio, Y. and Morita, M. (2025). Social composition and relatedness of the cooperatively\
        \ breeding cichlid Neolamprologus buescheri inhabiting the deep water of Lake Tanganyika. Hydrobiologia."
      url: "https://doi.org/10.1007/s10750-025-05967-2"

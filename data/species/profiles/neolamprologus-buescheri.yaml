partners:
  suitable:
  - species: Cyprichromis leptosoma
    reason: "Midwater use reduces competition for buescheri caves, although intruders near the nest may still\
      \ be chased."
    condition: "Use a larger Tanganyika community, around 300 L or more, that also meets the Cyprichromis group\
      \ and swimming-space requirements; the 103 L buescheri minimum does not cover this combination."
  unsuitable:
  - species: Neolamprologus multifasciatus
    reason: Small shell dwellers and their young are vulnerable to harassment; Seriously Fish and Fishkeeper specifically
      discourage shell-dweller combinations.
  - species: Julidochromis transcriptus
    reason: Overlapping crevice use invites territorial conflict in a small aquarium.
    condition: Unsuitable at the stated minimum; some sources allow other rock breeders only in much larger aquaria
      with independent territories.
  - species: Altolamprologus calvus
    reason: Competes for rock shelter and cannot be added safely merely because the water ranges agree.
    condition: Unsuitable at the stated minimum; any larger mixed layout needs separate territories.
  - species: Lake Malawi mbuna
    reason: Boisterous grazing cichlids bring incompatible feeding priorities and social pressure to this shelter-focused
      Tanganyikan setup.
profile:
  overview:
    text: "Neolamprologus buescheri is a small Tanganyikan cichlid whose daily activity centers on rock shelter.\
      \ Its pale and dark horizontal pattern varies between localities, and fish from Kombe can look especially\
      \ dark. Small body size does not make it an easy community fish: competition among adults can end in serious\
      \ injury or death. A keeper needs to manage caves and social relationships as carefully as water quality.\
      \ Recent field research reveals breeding females living with smaller helpers and males moving among several\
      \ female territories. The trade fish called Neolamprologus sp. 'Ubwari Buescheri' has its own entry and\
      \ is not included here."
    sources:
    - kind: literature
      title: "Satoh, S., Yoshio, Y. and Morita, M. (2025). Social composition and relatedness of the cooperatively\
        \ breeding cichlid Neolamprologus buescheri inhabiting the deep water of Lake Tanganyika. Hydrobiologia."
      url: "https://doi.org/10.1007/s10750-025-05967-2"

  diet:
    text: "Insect larvae and other small invertebrates are the main natural foods. Offer varied, appropriately\
      \ sized animal foods alongside a suitable prepared diet; frozen or live crustaceans and insect larvae are\
      \ useful options. Tank-bred fish often accept flakes and small pellets, while newly imported fish may need\
      \ time to adapt. Account for food trapped in the rockwork when feeding and cleaning. Occasional fry-taking\
      \ is reported in hobby accounts and supports predation level 1, although a species-specific prey-size limit\
      \ has not been measured. No special tendency toward protein-related bloat is established for this species."

  husbandry:
    text: "The recorded minimum for one male with three females is approximately 103 L with a 90 by 38 cm base.\
      \ That minimum assumes multiple sheltered female areas, several escape routes and a means of separating\
      \ incompatible fish. Published alternatives recommend 200 L for a harem or a four-foot tank, giving more\
      \ room for layout and maintenance. Build stable rock piles over sand, with narrow passages and visual barriers.\
      \ Keep filtration, surface movement and water changes consistent. Care recommendations commonly lie around\
      \ 24-28 C. The profile retains the tally's wider tolerance of 23-29 C, pH 8.0-9.4, 8-25 dGH and 10-23 dKH;\
      \ the outer endpoints, particularly KH, have limited long-term evidence and are not targets to chase. A\
      \ mixed community requires a larger aquarium and open space for its other residents."

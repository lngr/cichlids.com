    rationale: "Generator, checker-a and checker-b propose 5-8 years; checker-c proposes 8-12 years. The component\
      \ median is 5-8 years and is retained. Fishipedia lists longevity of eight years and the Coburg retailer\
      \ gives 5-8 years, but neither provides a longitudinal dataset. The primary life-history papers show slow\
      \ juvenile growth and small clutches, not a measured adult lifespan. The longer 8-12 proposal is model knowledge\
      \ without species-specific confirmation, so confidence stays low."

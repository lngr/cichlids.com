  sexing:
    text: "Adult males generally grow larger, but color and markings do not reliably separate the sexes. Size\
      \ depends on age and rank, so the largest fish in an unsexed group is not a sufficient sexing test. Territorial\
      \ behavior can help an experienced observer, and breeder inspection of mature genital papillae may provide\
      \ additional information. The field studies confirmed larger breeding males than females, but they also\
      \ found size overlap between some social classes. A juvenile group may reveal its sex composition only after\
      \ aggression escalates, making spare housing important."
    sources:
    - kind: literature
      title: "Satoh, S., Yoshio, Y. and Morita, M. (2025). Social composition and relatedness of the cooperatively\
        \ breeding cichlid Neolamprologus buescheri inhabiting the deep water of Lake Tanganyika. Hydrobiologia."
      url: "https://doi.org/10.1007/s10750-025-05967-2"

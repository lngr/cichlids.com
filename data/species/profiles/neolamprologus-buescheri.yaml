  sizeAndGrowth:
    text: "Use about 9 cm for males and 7 cm for females as practical adult planning estimates. Reports differ:\
      \ FishBase lists 8 cm total length without a female maximum, while locality and breeder accounts give males\
      \ around 10 cm and females around 7 cm. Seriously Fish reports 7 cm standard length, which excludes the\
      \ tail. The primary field sample likewise measured standard length, with males larger than females. Juveniles\
      \ grow slowly; the field growth study found roughly 15 mm standard length after ten weeks of free swimming.\
      \ A lifespan estimate of 5-8 years has only weak secondary support and should not be treated as a measured\
      \ species maximum."

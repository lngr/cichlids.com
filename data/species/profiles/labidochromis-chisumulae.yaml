  temperatureC:
    value:
      min: 21
      max: 29
    confidence: high
    rationale: 'The tally assigns the lake-wide natural envelope of 21 to 29 C with high confidence. Eccles reports 21
      C inshore cooling and about 27 C in the upper 60 m in its abstract; Vollmer describes winter surface cooling below
      24 C and summer water near 28 C. Branchu measured 25.4 C at the surface and 22.8 C at 240 m in October 1993. These
      are lake observations, not species-specific lifetime aquarium limits or a Chisumulu annual record. The 29 C upper
      endpoint is retained exactly from the adjudication contract; the Ngochera repository abstract confirms seasonal
      sampling but gives no numerical maximum, and its full dissertation and the 1999 mixing report were not retrievable
      through the DOI-only full-text tool. No new numerical evidence is claimed from them.'
    sources:
    - kind: literature
      title: 'Branchu et al. (2010). Hydrochemistry (major and trace elements) of Lake Malawi (Nyasa), Tanzanian Northern

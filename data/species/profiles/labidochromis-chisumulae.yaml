  problems:
    text: 'Persistent hiding or failure to feed calls for attention to cover, sex ratio and tankmate pressure. A male
      can harass females even when the group looks peaceful at first. Overfeeding and unstable water add avoidable stress.
      Digestive symptoms have multiple possible causes, so the absence of a special bloat flag should not be used to
      dismiss illness. Monitor appetite, breathing and body condition, check water quality after a change, and seek qualified
      help when deterioration persists. Uncertain stock identity and mixed parentage can also undermine a breeding project.'

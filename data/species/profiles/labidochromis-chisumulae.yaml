partners:
  suitable:
  - species: Mild Lake Malawi mbuna of similar adult size
    reason: Species accounts support calm companions with compatible water and feeding requirements. This is a conditional
      category rather than a tested guarantee.
    condition: 'A larger aquarium than the four-adult minimum; for a mixed mbuna setup use at least 400 L, plentiful
      separate refuges and compatible groups. Exclude other Labidochromis from a pure-species breeding project.'
  - species: Small peaceful Aulonocara or other Malawi haplochromines
    reason: The specialist species account and Bartal article allow smaller mild Malawi companions; invertebrate feeding
      can fit a balanced shared routine.
    condition: 'Adults too large to be swallowed, additional open sand and swimming room, appropriate space for each
      social unit, and regular checks that every fish obtains food.'
  unsuitable:
  - species: Other Labidochromis species
    reason: The shared presumed labidochromis group expresses a plausible crossing risk based on general hobby cautions;
      named free-choice crosses of chisumulae were not verified.
  - species: Large fish-eating Malawi cichlids
    reason: Small adult females and juveniles can be prey for predators that swallow smaller cichlids.
  - species: Highly aggressive mbuna
    reason: Forceful companions can repeatedly displace these relatively mild fish from shelter and food.
  - species: Exposed fry and fish about 2 cm or smaller
    reason: Predation level 1 requires a precaution for very small fish even though the exact prey-size boundary is inferred.
profile:
  overview:
    text: 'This small mbuna offers a marked change between pale young fish and a displaying adult male. Mature males
      develop blue and dark vertical markings on a white background; females remain much paler. Labidochromis chisumulae
      is a described species from Chisumulu Island in Lake Malawi, also sold as the clown lab. A calm appearance still
      leaves room for dominance disputes and male pursuit, so plan around a properly furnished adult group.'
    sources:
    - kind: catalog-of-fishes
      title: 'Eschmeyer''s Catalog of Fishes: Labidochromis species list'
      accessed: '2026-10-13'
      url: 'https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Labidochromis'
    - kind: database

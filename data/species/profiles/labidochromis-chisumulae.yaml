    - kind: website
      title: 'Laferriere, N. Malawi Mayhem: Labidochromis chisumulae aquarium observations'
      accessed: '2026-10-13'
      url: 'https://www.malawimayhem.com/articles_chisumulae.shtml'
  breeding:
    text: 'A carrying female incubates the eggs and developing young in her mouth. Spawning has been observed without
      a fixed defended nest. Husbandry accounts describe small broods, often around 10 to 20 young, and incubation of
      roughly three to four weeks, with timing varying between fish and conditions. Cover helps a carrying female avoid
      persistent attention. Newly free-swimming young accept small prepared food and newly hatched Artemia. Fry raised
      among adults remain vulnerable, so a separate rearing arrangement provides better protection.'

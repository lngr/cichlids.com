      concentrations convert to about 4.2 to 4.6 dGH; the historical FAO compilation yields about 3.2 to 4.9 dGH using
      Ca mg/L divided by 7.14 plus Mg mg/L divided by 4.34. Hard aquarium recommendations belong to tolerance and do
      not replace the softer lake measurements.

  husbandry:
    text: 'For one male with three females, the planning minimum is 200 L with roughly 100 by 45 cm of floor space. The
      footprint is a layout allowance for refuge passages. Some specialists favor 300 L and 120 cm, and a mixed mbuna
      community warrants at least 400 L. Secure the rocks, provide several exits from shelter and use mature filtration
      with good surface movement. Routine temperatures near 24 to 26 C have better aquarium support than the ends of
      the 21 to 29 C tolerance. The selected pH tolerance is 7.4 to 8.6, GH 3 to 20 dGH and KH 5 to 12 dKH. These husbandry
      envelopes contain the natural ranges and are not experimentally established lifetime limits. Keep replacement water
      consistent and measure GH and KH separately.'
    sources:
    - kind: database
      title: 'Malawi.si: Labidochromis chisumulae ''Chizumulu Island'''
      accessed: '2026-10-13'
      url: 'https://www.malawi.si/Malawi/Labidochromis/Labidochromis%20chisumulae/slides/Labidochromis%20chisumulae%20%27Chizumulu%20Island%27.html'

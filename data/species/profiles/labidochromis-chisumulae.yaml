  ph:
    value:
      min: 7.7
      max: 8.6
    confidence: high
    rationale: The tally retains pH 7.7 to 8.6 from the measured lake surface envelope. The FAO compilation gives these
      same surface bounds after Jackson et al. (1963). Branchu discusses 7.5 to 8.5 in a whole-column chemical context;
      that wider depth coverage does not justify lowering the littoral value to 7.5. Alkaline pH does not imply high
      calcium and magnesium hardness.
    sources:
    - kind: literature
      title: 'Branchu et al. (2010). Hydrochemistry (major and trace elements) of Lake Malawi (Nyasa), Tanzanian Northern

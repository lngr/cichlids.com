      rationale: 'Qualified-majority tally decision: 21 to 29 C, 5 of 6 agreeing votes, confidence low. Generator, checker-b,
        checker-c, tiebreaker-1 and tiebreaker-2 proposed 21 to 29 C; checker-a proposed 23 to 28 C. The selected tolerance
        contains the full natural lake range. Species care intervals are narrower: AquaInfo 22 to 26 C, Nordic register
        23 to 28 C, B-Aqua and FishFish 22 to 28 C, and DRTA 22 to 27 C. The successful breeding report records 25.6
        C. These sources favor routine conditions near 24 to 26 C and do not establish years of healthy aquarium exposure
        to either outer endpoint. The lake sources are habitat evidence rather than independent chronic-tolerance experiments.'

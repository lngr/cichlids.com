  socialBehavior:
    text: 'Begin with one male and three females, and provide cover that lets each fish leave a feeding or courtship
      encounter. The expected inner-species pattern is a hierarchy with chasing; the available reports do not establish
      routine severe injury in a suitable group. Successful groups with several males exist, but they need more space
      and shelter. Detailed accounts and mobile-spawning observations favor no lasting defended territory, although some
      care sheets describe temporary courtship defense. Suitable dissimilar companions usually face little directed aggression.'
    sources:
    - kind: literature

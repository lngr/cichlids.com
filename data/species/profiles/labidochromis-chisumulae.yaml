      accessed: '2026-10-13'
      url: 'https://www.malawi.si/Malawi/Labidochromis/Labidochromis%20chisumulae/slides/Labidochromis%20chisumulae%20%27Chizumulu%20Island%27.html'
  habitat:
    text: 'The aquarium needs passages through rockwork as well as a sand margin. Natural accounts place the fish on
      sediment-coated rocks and in the adjoining sand-rock transition, commonly around 3 to 20 m deep. The assigned lake
      habitat envelope is 21 to 29 C, pH 7.7 to 8.6, GH 3 to 5 dGH and KH 5 to 8 dKH. These are broad lake values rather
      than measurements of every Chisumulu site. Calcium and magnesium hardness is relatively low despite the alkaline
      pH and appreciable buffering.'
    sources:
    - kind: database
      title: 'de Lange, J. AquaInfo: Labidochromis chisumulae'

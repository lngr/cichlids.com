  compatibility:
    text: 'The species can live with suitable other Malawi cichlids, provided the aquarium accommodates all adult groups.
      Species accounts allow similar-sized mild mbuna and smaller peaceful peacocks or haplochromines. These categories
      are conditional, not guarantees for every individual combination. Forceful mbuna and large fish-eating companions
      are poor choices. General Labidochromis crossing cautions justify a presumed hybrid conflict with other group members;
      no verified named chisumulae cross with free access to its own mates was found. Very small fish and exposed fry
      receive a predation caution.'

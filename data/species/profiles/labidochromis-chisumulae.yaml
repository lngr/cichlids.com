  sizeAndGrowth:
    text: 'Allow for aquarium males reaching about 10 cm and females about 8 cm. Several accounts describe smaller adults,
      and the 6.6 cm FishBase figure is standard length without the tail rather than a directly comparable aquarium total
      length. Feeding heavily to increase size serves no care purpose. The life-expectancy entry represents an approximate
      eight-year estimate from secondary care databases; it does not promise eight years or define an observed survival
      interval.'

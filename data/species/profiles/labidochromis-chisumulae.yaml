      rationale: 'Unanimous tally agreement within the 0.3 pH comparison allowance retains 7.4 to 8.6 with medium confidence.
        Generator, checker-b and checker-c proposed 7.4 to 8.6; checker-a proposed 7.5 to 8.6. Borstein reports successful
        maintenance and breeding at pH 7.4. AquaInfo, B-Aqua and the Nordic register recommend 7.5 to 8.5, while the
        Cichlid-Forum species sheet reaches 8.6. The endpoints therefore combine a reported aquarium condition and recommendations
        while containing the natural range; they are not measured injury thresholds.'

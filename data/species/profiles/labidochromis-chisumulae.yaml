      describes tolerance of appropriate animal food in moderation, while Borstein uses prepared foods containing vegetable
      matter. The false flag means that special protein-triggered susceptibility is not established; it does not demonstrate
      immunity to bloat. CRC confirms insectivory only. The uncertainty about the negative susceptibility inference prevents
      a stronger confidence claim.'

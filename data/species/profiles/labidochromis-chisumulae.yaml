  khDkh:
    value:
      min: 5
      max: 8
    confidence: high
    rationale: The tally retains the natural lake alkalinity equivalent of 5 to 8 dKH with high confidence. Branchu profile
      alkalinity of about 2.334 to 2.461 meq/L converts to 6.5 to 6.9 dKH; the FAO historical interval of 2.00 to 2.59
      meq/L converts to 5.6 to 7.3 dKH using a factor of 2.8. Some Branchu samples are deeper than the species habitat.
      Bicarbonate associated with sodium helps explain why the alkalinity equivalent exceeds GH. Natural KH has no verification
      object.

      url: 'https://malawi-guru.de/labidochromis-chisumulae-mbuna-verzeichnis/'
  diet:
    text: 'The natural feeding specialization is small invertebrate prey. A varied staple of appropriately sized prepared
      food can be combined with modest portions of small frozen crustaceans and vegetable-containing food. Snails and
      insect larvae are among the reported natural items. Incidental algae and acceptance of mixed food do not make this
      a strict plant grazer. The profile does not assign the special protein-sensitive bloat flag, but neither the flag
      nor these feeding observations establish immunity to digestive illness. Keep portions controlled and ensure subordinate
      fish receive food.'

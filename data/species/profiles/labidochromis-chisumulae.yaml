  sexing:
    text: 'Judge fully grown fish over time. A displaying male develops stronger blue, dark bars and a dark eye-to-jaw
      marking; females usually remain cream-white with much weaker markings. A subordinate male can suppress color and
      be mistaken for a female. The similar trade form chisumulae mbweca is excluded from this species profile, and females
      can be difficult to distinguish. The name zebroides on a care sheet is also insufficient identification because
      the taxonomic catalog recognizes a separate Labidochromis zebroides.'

  - field: features.minTank
    proposals:
    - by: generator
      value:
        volumeL: 1000
        lengthCm: 250
        depthCm: 70
    - by: checker-a
      value:
        volumeL: 500
        lengthCm: 150
        depthCm: 60
    - by: checker-b

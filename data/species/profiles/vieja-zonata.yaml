      \ the fish as herbivorous and Seriously Fish emphasizes natural herbivory. Their approximate aufwuchs mappings\
      \ remain evidence, but no source establishes obligatory biofilm grazing. NVC warns of intestinal trouble with\
      \ an unsuitable protein-heavy, fibre-poor diet, supporting the dietary sensitivity flag cautiously rather\
      \ than diagnosing a specific bloat syndrome. The 2024 laboratory colony bred for at least two years on a 42\
      \ percent protein pellet; this limits any claim that a single protein percentage is inherently unsafe. Medium\
      \ confidence reflects these distinctions."
  - field: features.aggressionConspecific
    proposals:
    - by: generator
      value: 4
    - by: checker-a
      value: 3
    - by: checker-b
      value: 4
    - by: checker-c
      value: 4
    decision: 4
    rationale: "The generator and checkers-b and -c proposed 4; checker-a proposed 3. The retained Werner account\
      \ describes fatal partner injury after repeated disputes even in a 220 cm, 720 L aquarium. Glaser reports\
      \ strongly aggressive conspecific individuals, and Seriously Fish requires intervention when pair violence\
      \ escalates. These specific observations outweigh the calmer general descriptions in the Atlas and the Aqua-Fish\
      \ peaceful label. Level 4 expresses the risk requiring experienced pair management, not a claim that every\
      \ adult behaves identically. The historical non-DOI report is inherited evidence rather than an independently\
      \ fetched full text in this adjudication."

  - name: Vieja coatlicue
    note: Junior synonym under the integrated 2019 revision and the current Catalog of Fishes.
  - name: Paratheraps zonatus
    note: Historical aquarium combination recorded by the Nordic cichlid association.
  - name: Theraps zonatus
    note: Historical aquarium combination recorded by the Nordic cichlid association.
  legacyNames:
  - Vieja zonata
  note: "The Catalog of Fishes accepts Vieja zonata (Meek, 1905) and includes Atlantic populations formerly named\
    \ coatlicue. Vieja is both the legacy and current genus. The historical Cichlasoma genus query was also checked,\
    \ but the original zonatum entry is on the valid Vieja page. Older aquarium identifications may involve guttulata\
    \ or mixed collecting stocks, so locality labels and historical husbandry observations require caution."
names:
  trade:
    en:
    - Oaxaca cichlid
    de:
    - Gürtelbuntbarsch
variants:
- name: Niltepec
  kind: locality
  note: Type locality and historical collection label; some older hobby identifications need reassessment.
- name: Coatzacoalcos
  kind: locality
  note: Former trade label Vieja sp. Coatzacoalcos and former name coatlicue. Colour differences do not define a
    separate valid species.
- name: Río Chalchijapa
  kind: locality
  note: Locality identified on the public CRC profile photograph; preserve stock provenance rather than assuming
    a fixed colour morph.
- name: Río Uxpanapa
  kind: locality
  note: Type locality of the synonym coatlicue; retained as locality information rather than a separate species.
features:
  origin:
    value:
      continent: Central America
      region: "Isthmus of Tehuantepec in southern Mexico, Pacific drainages of Oaxaca and adjacent Chiapas and the\
        \ Atlantic Rio Coatzacoalcos drainage"
      waterbody: null
      localities:
      - Niltepec
      - Rio Tequisistlan
      - Rio Tehuantepec
      - Rio Los Perros
      - Rio Ostuta
      - Rio Novillero
      - Rio Tapanatepec
      - Rio Coatzacoalcos
      - Rio Almoloya
      - Rio Sarabia
      - Rio Uxpanapa
    confidence: high
    rationale: "The accepted species extends across both slopes of the Isthmus of Tehuantepec. The Catalog and McMahan\
      \ et al. (2019) include the Coatzacoalcos populations formerly described as coatlicue, and the Zoque inventory\
      \ independently records the species on the Atlantic side. FishBase and Seriously Fish retain an incomplete\
      \ Pacific-only account. Localities are collecting or drainage labels, not assertions that identical water\
      \ chemistry occurs throughout them. Central America follows the project geographic convention for this Middle\
      \ American fish."

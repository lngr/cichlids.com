      foods:
      - Plant-rich complete cichlid food
      - Algae and spirulina foods
      - Suitable vegetables
      - Small portions of aquatic invertebrates
    confidence: medium
    rationale: "All four votes agree on omnivore and bloatSensitive true; the tally retains the generator food list.\
      \ NVC and NCS describe plant material together with animal food, while CRC classifies the fish as herbivorous\
      \ and Seriously Fish emphasizes natural herbivory. Their approximate aufwuchs mappings remain evidence, but\
      \ no source establishes obligatory biofilm grazing. NVC warns of intestinal trouble with an unsuitable protein-heavy,\
      \ fibre-poor diet, supporting the dietary sensitivity flag cautiously rather than diagnosing a specific bloat\
      \ syndrome. The 2024 laboratory colony bred for at least two years on a 42 percent protein pellet; this limits\
      \ any claim that a single protein percentage is inherently unsafe. Medium confidence reflects these distinctions."

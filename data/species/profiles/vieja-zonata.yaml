  compatibility:
    text: "This species can share an appropriately spacious aquarium with carefully selected robust adults, so species-only\
      \ keeping is not obligatory. NVC reports combinations with Trichromis salvini and Thorichthys panchovillai;\
      \ these are individual experiences requiring more space than the pair minimum. Suitable large catfish are\
      \ candidates rather than assured companions. Avoid swallowable fish and delicate species that cannot cope\
      \ with territorial attacks or food competition. Other Vieja carry a presumed crossing risk, including a specifically\
      \ reported bifasciata pairing whose parentage and mate-choice circumstances remain unverified. Breeding can\
      \ make an otherwise workable community unsafe."

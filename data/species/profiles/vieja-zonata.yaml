    tolerance:
      value:
        min: 23
        max: 31
      confidence: medium
      rationale: "The four proposals are generator 23 to 30.5 C, checker-a and checker-b 23 to 31 C, and checker-c\
        \ 23 to 30 C. They agree within the vote threshold, giving the exact tally decision of 23 to 31 C with medium\
        \ confidence. Seriously Fish and NCS recommend 23 to 30 C, while NVC recommends 24 to 28 and Aqua-Fish 23\
        \ to 26. The laboratory broodstock spawned for at least two years at 25 plus or minus 1 C. The upper endpoint\
        \ is widened to contain the decided natural maximum of 31 C; no source demonstrates healthy chronic maintenance\
        \ at that endpoint. Routine care around 24 to 28 C has stronger practical support than constant exposure\
        \ to the top of this provisional envelope."

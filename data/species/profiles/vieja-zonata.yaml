  problems:
    text: "Adult space, identity and pair safety deserve attention before purchase. Digging can destabilize decoration,\
      \ and enthusiastic feeding can overload filtration. Plant food is part of routine nutrition rather than an\
      \ occasional treat. Check water quality and seek qualified advice for swelling, loss of appetite or abnormal\
      \ breathing; such signs do not identify one disease. Quarantine new arrivals. Historical forum accounts confuse\
      \ identities and exaggerate sizes, so neither a trade label nor a generic aggression anecdote should replace\
      \ the species-specific evidence."
    sources:
    - kind: literature
      title: "Werner, U. (2009). Wieder aufgetaucht: Der Gürtelbuntbarsch Vieja zonata. DCG-Informationen Sonderheft\

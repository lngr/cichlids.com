  husbandry:
    text: "The minimum in this profile applies to one established adult pair: 660 litres, 200 cm length and 60 cm\
      \ depth. A larger layout gives more options for cover and escape routes. Build stable rock or wood barriers\
      \ over a digging substrate, keeping heavy objects secure against undermining. Strong filtration, surface movement\
      \ and regular water changes matter with large adults. A routine 24 to 28 C is better supported than constant\
      \ exposure to the tolerance maximum of 31 C. Keep water chemistry steady. Have a suitable divider or separate\
      \ aquarium available before putting adults together; successful spawning does not guarantee continued pair\
      \ safety."

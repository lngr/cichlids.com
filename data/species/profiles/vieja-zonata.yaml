    - by: checker-c
      value:
        volumeL: 720
        lengthCm: 200
        depthCm: 60
    decision:
      volumeL: 660
      lengthCm: 200
      depthCm: 60
    rationale: "The generator proposed 1000 L, 250 cm length and 70 cm depth; checker-a 500 L, 150 cm and 60 cm;\
      \ checker-b 600 L, 200 cm and 60 cm; checker-c 720 L, 200 cm and 60 cm. The coordinate medians decide 660\
      \ L, 200 cm and 60 cm for one established adult pair. NVC and NCS prose independently give 200 cm as the minimum\
      \ length, whereas their stricter summary recommendations reach 250 cm and NCS lists 1000 L. Seriously Fish\
      \ specifies 500 L and a 120 by 60 by 60 cm footprint-height combination, whose multiplication actually gives\
      \ 432 L; Atlas gives a smaller volume range and inconsistently expressed footprint units. These inconsistencies\
      \ limit precision. A 200 by 60 by approximately 55 cm aquarium gives 660 gross litres, so the volume is a\
      \ design synthesis rather than a tested threshold. It exceeds the Seriously Fish pair volume to accommodate\
      \ the supported 35 cm male and the longer specialist footprint, but stays below the largest published 1000\
      \ L recommendation. The fatal-injury account does not prove a larger universal minimum: an incompatible pair\
      \ needs separation even in a large tank. Group keeping or additional large fish requires more space."

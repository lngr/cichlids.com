partners:
  suitable:
  - species: Trichromis salvini
    reason: NVC reports this combination as workable with zonata; both are territorial substrate spawners.
    condition: "A community aquarium substantially larger than the 660 L pair minimum, distinct territories and\
      \ immediate separation capacity."
  - species: Thorichthys panchovillai
    reason: NVC reports a group kept with zonata. Its smaller size means the result is dependent on temperament
      and must be watched closely.
    condition: "A community aquarium substantially larger than the pair minimum, with adult fish, separate territories\
      \ and prompt removal if harassment begins."
  - species: Pterygoplichthys gibbiceps
    reason: "A large robust armoured catfish fits the general catfish option in NVC; this specific pairing is an\
      \ inferred candidate, not a documented trial."
    condition: "A very large aquarium beyond the pair minimum, its own shelter and suitable adult size; remove if\
      \ either fish injures the other or interferes with spawning."
  unsuitable:
  - species: Vieja bifasciata
    reason: Presumed pairwise hybrid risk plus competition between similarly shaped territorial adults.
  - species: Paracheirodon innesi
    reason: Small adult size makes it vulnerable to swallowing by an adult zonata; a neon community is unsuitable
      for the territorial adult pair.
  - species: Symphysodon aequifasciatus
    reason: "A delicate, deliberate feeder is exposed to intimidation and food competition from a large territorial\
      \ fish."
profile:
  overview:
    text: "A keeper planning for Vieja zonata should start with adult space and a way to separate fish. This Mexican\
      \ cichlid can become a substantial blue-green and dark-patterned centerpiece, but pairing adults can be difficult.\
      \ The accepted species includes the Atlantic Coatzacoalcos fish previously called Vieja coatlicue as well\
      \ as Pacific populations around the Isthmus of Tehuantepec. Locality and mood affect appearance, and some\
      \ older aquarium identifications are disputed. Preserve collecting or stock information when available."

  habitat:
    text: "River channels, creeks and quieter margins provide the natural setting, with soft bottoms and locally\
      \ rocky or vegetated areas. The current range includes Pacific Oaxaca and adjacent Chiapas and the Atlantic\
      \ Coatzacoalcos drainage. Natural water values in this profile are uncertain regional summaries. The inputs\
      \ retain one Niltepec collecting reading of pH 7.5, GH 12 and KH 18. Lower Tehuantepec seasonal means of 26.7\
      \ to 30.5 C, pH 8.0 to 8.3 and about 8.1 to 8.4 dGH pool freshwater with estuarine stations. Los Perros monitoring\
      \ found 25 to 33.1 C and pH 7.1 to 9.3; the highest temperatures came from polluted lower reaches and the\
      \ unusual alkaline episode was not typical. Those observations remain context and do not enlarge the decided\
      \ natural range or aquarium tolerance."

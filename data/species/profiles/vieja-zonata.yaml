  khDkh:
    value:
      min: 18
      max: 18
    confidence: low
    rationale: "Four of six tally votes support the single Niltepec value of 18 dKH: generator, checker-c, tiebreaker-1\
      \ and tiebreaker-2. Checker-a proposed 2 to 8 and checker-b 3 to 12 from regional extrapolation or explicit\
      \ inference. Checker-c had not authenticated the historical measurement, whereas the generator and both tiebreakers\
      \ retained Werner's archived collecting report. Identical endpoints represent one reported observation, not\
      \ a uniform habitat requirement. The neighboring coastal bicarbonate interval of 2.2 to 4.4 dKH and the statewide\
      \ converted mean of about 8.5 are not species-site measurements. Neither GH nor conductivity establishes KH.\
      \ Alkalinity can exceed GH when bicarbonate is balanced by other cations, so KH 18 beside GH 12 is not intrinsically\
      \ impossible. Niltepec is a flowing river habitat without evidence of exceptional karst chemistry. Confidence\
      \ remains low because analytical details, independent replication and historical stock identity are unresolved.\
      \ The non-DOI Werner full text could not be independently fetched through the required DOI-only tool; its\
      \ archived observations are retained from the supplied inputs. Natural KH carries no verification object."

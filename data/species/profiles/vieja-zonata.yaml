  breeding:
    text: "Prepare growing space before allowing a pair to raise a large brood. Eggs are attached to a cleaned solid\
      \ surface, and both adults care for the developing offspring. Several hundred eggs are possible, with published\
      \ husbandry accounts spanning roughly 100 to 1000. Hatching commonly takes two or three days, followed by\
      \ free swimming several days later. Newly hatched Artemia or other appropriately small fry foods can be offered\
      \ once feeding begins. Parental aggression can change during spawning or before another brood, so watch the\
      \ adults and move juveniles when necessary."

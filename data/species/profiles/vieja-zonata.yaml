  temperatureC:
    value:
      min: 26
      max: 31
    confidence: low
    rationale: "The tally uses the median of six proposals because no qualified majority forms. Generator and tiebreaker-2\
      \ proposed 26.7 to 30.5 C, checker-a and tiebreaker-1 proposed 25 to 31 C, checker-b proposed 23 to 31 C,\
      \ and checker-c proposed 26 to 28 C. The rounded endpoint medians decide 26 to 31 C with low confidence. Moreno-Ruiz\
      \ et al. report lower Tehuantepec seasonal means of 26.7 to 30.5 C across freshwater and estuarine stations.\
      \ The Los Perros study reports a wider basin range of 25 to 33.1 C and 25.8 to 31 C at P1 to P4; the hottest\
      \ polluted downstream readings do not define typical habitat. Glaser gives a natural summary of 26 to 28 C\
      \ without a station series. The wider FishBase 23 to 30 C account derives from Conkel and exposes no field\
      \ protocol. The median is a provisional regional summary rather than the full measured habitat envelope or\
      \ a constant aquarium target. No exceptional chemistry makes the decided range implausible, so it is retained\
      \ exactly."

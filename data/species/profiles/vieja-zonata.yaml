      confidence: low
      rationale: "Generator, checker-c and both tiebreakers propose 4 to 18 dKH; checker-a proposes 2 to 14 and\
        \ checker-b 3 to 15. The four-of-six qualified majority decides 4 to 18 with low confidence. Aquasistema\
        \ recommends a point near 4 without a duration study, and the retained Niltepec collecting observation of\
        \ 18 requires the tolerance to reach 18. A forum reading near 2 lacks a documented long-term healthy outcome,\
        \ and interpretations from pH or GH supply no measured KH limits. This is a provisional husbandry envelope\
        \ between a retail care point and a single habitat point, not verified years of survival throughout the\
        \ interval. The natural 18 dKH observation is contained exactly."

  diet:
    text: "Plant-rich complete food should form the foundation, with suitable vegetables or algae foods and modest\
      \ portions of aquatic invertebrates for variety. Accounts describe plant debris as well as animal material,\
      \ so the compatibility category is omnivore with dietary sensitivity. The flag reflects a husbandry warning\
      \ about unsuitable rich, fibre-poor feeding, not a proven clinical diagnosis or a universal protein cutoff.\
      \ A laboratory colony reproduced for at least two years on a 42 percent protein pellet. One historical stock\
      \ rushed offered food vigorously; control portions by body condition and remove uneaten food. Small companions\
      \ can still be swallowed despite the strong plant bias."

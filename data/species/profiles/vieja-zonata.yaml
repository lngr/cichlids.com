  sizeAndGrowth:
    text: "Allow for an aquarium male around 35 cm and a female around 30 cm. The sex-specific account supports\
      \ larger adults than several older summaries near 25 cm, which also mix total and standard length. Some historical\
      \ stocks remained smaller. Juvenile size therefore offers little reassurance about the eventual space needed.\
      \ The provisional lifespan estimate of 9 to 12 years has low confidence; no longitudinal source establishes\
      \ a typical survival distribution."

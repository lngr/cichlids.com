  socialBehavior:
    text: "Pair cooperation and partner aggression can occur in the same fish. Both parents may defend a brood together,\
      \ then begin serious disputes when conditions change or the brood disappears. The retained historical account\
      \ includes a fatal partner attack despite substantial tank space. Other accounts describe calmer adults or\
      \ group keeping, so temperament and stock matter. The recommended social unit is a compatible pair rather\
      \ than any arbitrarily selected male and female. Persistent hiding, restricted access to food or repeated\
      \ attacks require prompt separation."
    sources:
    - kind: literature

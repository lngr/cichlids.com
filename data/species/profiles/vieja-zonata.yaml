  ph:
    value:
      min: 7.5
      max: 8.3
    confidence: low
    rationale: "The tally decides the endpoint medians at 7.5 to 8.3 with low confidence. Generator and checker-c\
      \ proposed the single point 7.5, checker-a proposed 7.0 to 8.3, checker-b and tiebreaker-2 proposed 7.5 to\
      \ 8.3, and tiebreaker-1 proposed 7.1 to 8.3. These six proposals do not form a qualified majority. The Niltepec\
      \ reading of 7.5 retained in the inputs and the lower Tehuantepec seasonal means of 8.0 to 8.3 support the\
      \ decided endpoints, but do not establish an annual species-wide interval. Los Perros has a wider measured\
      \ range of 7.1 to 9.3, typically 7.1 to 8.1 after excluding the unusual March 2017 event. The neighboring\
      \ coastal survey gives an interquartile range of 7.0 to 8.2 without matching fish collections. These lower\
      \ and exceptional higher observations remain evidence outside the narrower tally range. FishBase supplies\
      \ only a maximum of 7.5, not a complete range. Aquarium recommendations remain separate from field evidence."

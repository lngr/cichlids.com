  lifespanYears:
    value:
      min: 9
      max: 12
    confidence: low
    rationale: "Generator and checker-a proposed 10 to 15 years, checker-b 8 to 12, and checker-c 8 to 10. The endpoint\
      \ medians are 9 and 13.5 years. The Aquarium Wiki states 8 to 12 and Aqua-Fish up to 10 without cohort evidence;\
      \ neither supports 13.5 or 15. The final provisional range keeps the median lower estimate of 9 and caps the\
      \ upper estimate at the largest species-specific source value of 12, rather than extending it with general\
      \ model knowledge. The laboratory observation of adults maintained for at least two years is a minimum duration,\
      \ not a maximum lifespan. Both endpoints are planning estimates with low confidence."

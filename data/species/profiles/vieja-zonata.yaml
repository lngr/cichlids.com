  sexing:
    text: "Adult body shape helps more than juvenile color. Males generally become larger and heavier through the\
      \ head and develop longer fin extensions. Females can show a dorsal-fin patch in some populations, but that\
      \ marking is not universal. Color shifts with breeding condition and collecting origin, making brightness\
      \ an unreliable standalone test. A mature female can also be larger than a younger male. Where safely observable\
      \ during spawning, the laying tube gives a more useful clue than color alone."
    sources:

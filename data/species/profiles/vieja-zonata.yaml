  aggressionConspecific:
    value: 4
    confidence: medium
    rationale: "The generator and checkers-b and -c proposed 4; checker-a proposed 3. The retained Werner account\
      \ describes fatal partner injury after repeated disputes even in a 220 cm, 720 L aquarium. Glaser reports\
      \ strongly aggressive conspecific individuals, and Seriously Fish requires intervention when pair violence\
      \ escalates. These specific observations outweigh the calmer general descriptions in the Atlas and the Aqua-Fish\
      \ peaceful label. Level 4 expresses the risk requiring experienced pair management, not a claim that every\
      \ adult behaves identically. The historical non-DOI report is inherited evidence rather than an independently\
      \ fetched full text in this adjudication."

    tolerance:
      value:
        min: 7
        max: 8.5
      confidence: medium
      rationale: "All four proposals give 7.0 to 8.5, which is the unanimous tally decision at medium confidence.\
        \ Seriously Fish recommends 7.0 to 7.5, NVC 7.5 to 8.5, the Atlas and NCS summary 7.0 to 8.0, and Aqua-Fish\
        \ 7.0 to 8.1. Werner's retained breeding account gives pH 7.0, while the independently read laboratory colony\
        \ reproduced for at least two years at 8.0 plus or minus 0.5. Together these support a practical neutral-to-alkaline\
        \ envelope containing the decided natural range, without establishing controlled physiological boundaries."

  ghDgh:
    value:
      min: 10
      max: 12
    confidence: low
    rationale: "The tally uses a low-confidence median of six proposals. Generator and tiebreaker-1 proposed 12\
      \ to 12 dGH, checker-a proposed 3 to 12, checker-b proposed 8 to 20, checker-c proposed 12 to 20, and tiebreaker-2\
      \ proposed 8 to 12. The median minima and maxima decide 10 to 12 dGH. The inputs preserve a direct Niltepec\
      \ reading of 12; lower Tehuantepec seasonal hardness of 144.9 to 150.6 as CaCO3 converts to about 8.1 to 8.4\
      \ dGH if the implied concentration unit is mg/L. Those pooled freshwater and estuarine means lie below the\
      \ decision and remain contextual evidence. The wider 12 to 20 dGH summaries in FishBase and Glaser do not\
      \ expose the measurements behind 20. The neighboring coastal survey gives 2 to 4.4 dGH as an interquartile\
      \ regional proxy, not a matched zonata habitat series. The 10 to 12 decision is a vote compromise rather than\
      \ newly measured limits. Conductivity of about 200 to 1524 microsiemens/cm is retained as reported context\
      \ only and cannot be converted to GH without ionic or titration data. The decided range is chemically plausible\
      \ and is retained exactly."
    sources:

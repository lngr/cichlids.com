  diet:
    value:
      type: omnivore
      bloatSensitive: false
      foods:
      - balanced sinking cichlid pellets
      - aquatic invertebrates
      - vegetable matter
    confidence: medium
    rationale: "The tally decides omnivore with bloatSensitive false by a qualified majority of five of six runs,\
      \ with medium confidence. Generator, checker-b, checker-c, tiebreaker-1 and tiebreaker-2 propose false; checker-a\
      \ proposes true. All propose omnivory, with different example foods retained in the disagreement record. Seriously\
      \ Fish supports animal and plant foods. AquaInfo's narrative emphasizes invertebrates but its structured field\
      \ says omnivore; NCS lists animal prey and accepts prepared foods. Checker-a interprets the mammalian-meat\
      \ warning as protein-related bloat, whereas the majority distinguishes unsuitable meat and overeating from\
      \ the rubric-specific syndrome. Cichlidamerique links swelling to rich or fatty feeding while also recommending\
      \ roughly 40 percent protein food, so its dissenting true interpretation remains evidence without proving\
      \ general protein intolerance. FishBase's trophic estimate is modelled from relatives and CRC's public page\
      \ has no feeding test. False does not mean immunity to digestive disease."
    sources:

      accessed: '2026-10-15'
      archived: ciklid.org/artregister/art.php/q-d4db440f/2026-10-15T120609Z
    - kind: website
      title: "Beerlink, R.: Darienheros calobrensis. AquaInfo / NVC"
      url: "https://aquainfo.nl/en/article/darienheros-calobrensis/"
      accessed: '2026-10-15'
      archived: aquainfo.nl/en/article/darienheros-calobrensis/2026-10-15T120608Z
  diet:
    text: "Use a balanced sinking food with both animal and vegetable ingredients, supplemented with suitable aquatic\
      \ invertebrates. Bottom searching is characteristic, but the available accounts do not establish a measured\
      \ feeding speed. Distribute portions so both adults can feed and avoid oversized meals. Small-fish consumption\
      \ in nature does not make live feeder fish necessary. Mammalian meat is unsuitable. Reports of overeating\
      \ and abdominal swelling warrant attention to food quality and quantity; they do not demonstrate the specialized\
      \ protein-related bloat sensitivity used by the planner. The false bloat flag therefore carries uncertainty\
      \ and does not guarantee freedom from digestive illness."

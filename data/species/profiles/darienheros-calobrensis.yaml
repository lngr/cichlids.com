  problems:
    text: "Common avoidable problems include crowded adults, unstable rock piles, accumulated waste and a partner\
      \ unable to escape. Check feeding access and injuries as carefully as water quality. A fish that stops eating,\
      \ breathes rapidly, develops damaged skin or becomes swollen needs prompt investigation of its environment\
      \ and appropriate expert assessment. These signs do not identify one disease. Specialist accounts report health\
      \ difficulties associated with poor hygiene and excessive feeding, but their proposed causes are not established\
      \ diagnoses. Quarantine additions and maintain equipment consistently rather than relying on routine medication."

  sizeAndGrowth:
    text: "A male planning size of about 25 cm agrees with the main species accounts. The female figure of 20 cm\
      \ is inferred from smaller female size, with no reliable sex-specific maximum established. Sources also mix\
      \ standard and total length, so exact comparisons require care. Juveniles can look subdued and their social\
      \ relationships change as they mature. The only read numerical lifespan claim is 5 to 8 years from a general\
      \ hobby care page; it is weak guidance rather than a biological age limit. Provide adult accommodation before\
      \ growing fish form territories."

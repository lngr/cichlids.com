  sexing:
    text: "Adult males tend to become larger and deeper through the body, with longer fin extensions. A stronger\
      \ forehead or hump may develop, but its absence does not establish that a fish is female. Both sexes can change\
      \ their head profile when breeding. These tendencies are much less useful in small juveniles. Judge several\
      \ traits together and treat a seller's visual sexing of young fish as provisional. Even a correctly identified\
      \ male and female need careful introduction and may never form a safe pair."

  habitat:
    text: "The species inhabits Pacific-slope waters of eastern Panama, including the Bayano and Darien river systems.\
      \ Records include quieter water with rocky shelter and flowing, turbid collecting sites with marginal roots.\
      \ Regional Bayano river monitoring supports a natural estimate of 25 to 29 C, pH 7.2 to 8.2 and 2 to 6 dGH.\
      \ These are basin proxies with incomplete seasonal coverage. Natural KH of 1 to 6 dKH is a median synthesis:\
      \ the wider measured river alkalinity envelope is 1.66 to 7.22 dKH, with its high endpoint occurring once.\
      \ The artificial reservoir measurements of pH 7.95 to 9.06 and 29.3 to 30.3 C are separate context rather\
      \ than a target for river-based keeping."

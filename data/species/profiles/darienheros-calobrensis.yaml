    rationale: "The tally is unanimous within the 1 C agreement threshold and retains 25 to 29 C. Bayano river stations\
      \ 1 to 5 and 9 measure 25.5 to 29 C over four campaigns; a Rio Terable collection gives about 27.8 C. These\
      \ are drainage proxies with incomplete seasonal coverage, not chemistry sampled beside identified fish at\
      \ every station. Checker-a proposes the wider 24 to 30 C from regional Capira and Pacora data, whereas generator,\
      \ checker-b and checker-c propose 25 to 29 C. The Pacora source concerns Isthmoheros tuyrensis and gives the\
      \ wider 23 to 31.6 C; Capira lowland seasonal means span 25 to 29.7 C. FishBase gives 27 to 32 C from Conkel's\
      \ book through a secondary summary. Reservoir observations of 29.3 to 30.3 C are retained separately rather\
      \ than extending the river ideal."

  legacyNames:
  - Amphilophus calobrensis
  note: "The Catalog of Fishes accepts Darienheros calobrensis and records Cichlasoma calobrense, Amphilophus calobrense\
    \ and Amphilophus calobrensis in its nomenclatural history. Both the valid and legacy genera are checked. Astatheros\
    \ calobrensis and Cichlaurus calobrensis are historical usages reported by the Nordic association and AquaInfo;\
    \ they are not separate species in this profile. The 2016 transfer is supported by the catalog, while the readable\
    \ revision text is limited to a repository abstract."

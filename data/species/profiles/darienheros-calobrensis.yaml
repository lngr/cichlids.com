  husbandry:
    text: "Plan at least 540 L with a floor about 180 by 60 cm for a compatible adult pair, and provide an immediately\
      \ usable divider. Arrange secure rocks and fine substrate so each fish can search for food and move out of\
      \ sight. A routine temperature near 26 to 28 C has support in the care accounts; the wider 22 to 31 C tolerance\
      \ carries substantial uncertainty at its endpoints. Regional river chemistry supplies the natural-water estimates,\
      \ while aquarium recommendations supply the broader tolerances. Maintain strong filtration and regular waste\
      \ removal. Stable replacement water and gradual adjustment matter more than chasing a numerical endpoint."

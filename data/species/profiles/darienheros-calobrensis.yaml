partners:
  suitable:
  - species: Barbonymus schwanenfeldii
    reason: "Large agile shoaling tinfoil barbs match the companion category suggested by Seriously Fish. This is\
      \ a conditional candidate, not a documented individual pairing."
    condition: "Adults in a shoal, aquarium exceeding 1000 litres with ample swimming length, and no unseparated\
      \ spawning pair."
  - species: Balantiocheilos melanopterus
    reason: Adult bala sharks are the large shoaling silver-shark category suggested by Seriously Fish. Juveniles
      remain vulnerable.
    condition: Full-sized shoal in a long aquarium exceeding 1000 litres; remove or separate the cichlids before
      spawning.
  - species: Pterygoplichthys gibbiceps
    reason: A large armoured loricariid fits the robust-catfish category in Seriously Fish; species-level suitability
      is inferred.
    condition: Adult individual with its own refuge and food in more than 1000 litres; separate from a nesting pair.
  unsuitable:
  - species: Paracheirodon innesi
    reason: Small adult size creates prey risk and offers no protection from territorial attacks.
  - species: Apistogramma cacatuoides
    reason: A small bottom-territorial cichlid cannot safely share shelter and spawning space with this much larger
      species.
  - species: Symphysodon aequifasciatus
    reason: The shy feeding behaviour and low tolerance of harassment make discus unsuitable companions for an aggressive
      pair.
profile:
  overview:
    text: "Darienheros calobrensis is a substantial Panamanian cichlid with thick lips and a habit of investigating\
      \ the bottom. Adults combine dark markings with red spotting and a yellowish head. The familiar trade name\
      \ is redspot cichlid. Its accepted genus is Darienheros; Amphilophus calobrensis and Cichlasoma calobrense\
      \ are earlier names. This fish suits keepers who can provide a large aquarium and separate adults when necessary.\
      \ Watching a settled pair care for young is rewarding, but compatibility between two adults cannot be assumed."

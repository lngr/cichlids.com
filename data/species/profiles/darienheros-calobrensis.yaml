  breeding:
    text: "A compatible pair prepares a firm spawning surface and guards the offspring. Eggs may be placed on exposed\
      \ stone or inside shelter, so a single prescribed nest shape is unnecessary. Give the adults a dedicated breeding\
      \ aquarium with protected retreat space. Watch both partners throughout egg and fry care, because cooperation\
      \ can turn into aggression. Small live foods suitable for newly swimming fry provide a practical first food.\
      \ Arrange growing space before encouraging repeated spawning, and avoid sudden changes to the family group\
      \ without considering the female's safety."
    sources:
    - kind: database
      title: "Nordiska Ciklidsallskapet: Darienheros calobrensis"

      min: 1
      max: 6
    rationale: "The tally's median decision is 1 to 6 dKH with low confidence; natural KH carries no verification\
      \ object. All proposals are generator: 1.5 to 7.5; checker-a: 2.5 to 5; checker-b: 1 to 5; checker-c: 1 to\
      \ 8; tiebreaker-1: 1 to 5; tiebreaker-2: 1.5 to 7.5 dKH. The median balances inclusion versus exclusion of\
      \ the isolated station-4 alkalinity result, not a measured physiological boundary. The full Bayano river source\
      \ range is wider at 1.66 to 7.22 dKH, converted from 29.6 to 128.94 mg/L as CaCO3 by division by 17.848. Without\
      \ that isolated result, river values span 1.66 to 4.03 dKH; including reservoir observations gives 1.66 to\
      \ 4.19 dKH. Chucunaque gives 3.88 dKH, Capira lowland seasonal means about 2.7 to 5 dKH, and ARAP reports\
      \ a reservoir mean equivalent to about 3.25 dKH under the CaCO3 assumption. These drainage proxies do not\
      \ document occupied microhabitats. GH and pH are not converted into KH. The outlying result remains in evidence\
      \ and does not make 6 dKH a measured upper limit."

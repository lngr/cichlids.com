  ghDgh:
    value:
      min: 2
      max: 6
    confidence: medium
    rationale: "The unanimous tally decides 2 to 6 dGH after threshold agreement and whole-degree rounding. Proposals\
      \ are generator 2.5 to 6, checker-a 3 to 6, checker-b 2 to 6 and checker-c 2 to 6 dGH. Bayano river titrations\
      \ span 45.4 to 100.38 mg/L as CaCO3, or 2.54 to 5.62 dGH after division by 17.848. Checker-b's extraction\
      \ stops at 97.88 mg/L, or 5.49 dGH; the 100.38 result at station 5 confirms the wider measured endpoint. The\
      \ Chucunaque sample gives 4.92 dGH and Capira seasonal means span about 2.6 to 6.3 dGH, slightly beyond the\
      \ chosen ideal. These are regional proxies rather than species-linked measurements. Conductivity is context\
      \ and is not converted into GH. FishBase's incomplete 15 to unknown dH field cannot establish a closed natural\
      \ range."
    sources:
    - kind: literature
      title: "Autoridad del Canal de Panama (2017): Estudio de Calidad de Agua del Rio Bayano, tables 1 and 4 to\
        \ 12"

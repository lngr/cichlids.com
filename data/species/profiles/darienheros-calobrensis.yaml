      \ roughly 40 percent protein food, so its dissenting true interpretation remains evidence without proving\
      \ general protein intolerance. FishBase's trophic estimate is modelled from relatives and CRC's public page\
      \ has no feeding test. False does not mean immunity to digestive disease."

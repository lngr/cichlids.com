  socialBehavior:
    text: "Pair formation is the central challenge. Two fish of opposite sexes may fight, and growing up together\
      \ does not guarantee acceptance. Observe where each adult rests and whether both can feed without retreating\
      \ continuously. A fish confined to one corner needs protection. The comparatively mild group-keeping account\
      \ differs from sources describing lethal mate attacks, so this profile uses a pair with a separation plan\
      \ as its default. Breeding intensifies defence and can make previously tolerated companions unsafe. A divider\
      \ remains useful even after several successful spawns."
    sources:
    - kind: database
      title: "Seriously Fish: Darienheros calobrensis"
      url: "https://www.seriouslyfish.com/species/amphilophus-calobrensis"

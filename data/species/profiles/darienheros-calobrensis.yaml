  compatibility:
    text: "The minimum pair aquarium is not a community recommendation. In systems exceeding 1000 litres, large\
      \ agile shoaling fishes or substantial armoured catfish are possible companions, with separate retreats and\
      \ close observation. The named suitable partners are examples of those categories rather than guaranteed combinations.\
      \ Small fishes risk being eaten, while timid or smaller territorial cichlids risk persistent displacement.\
      \ A nesting pair needs physical separation from companions. No supported hybrid group is assigned, but this\
      \ does not prove that crosses are impossible or justify mixing uncertain breeding stock."

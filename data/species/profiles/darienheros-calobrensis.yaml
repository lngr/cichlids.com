    rationale: "The Catalog of Fishes and FishBase place the species on Panama's Pacific slope. The Darien surveys\
      \ document eastern river populations, while CRC identifies a Bayano-drainage stock. AquaInfo includes Atlantic\
      \ drainages, but that broader distribution conflicts with the taxonomic authorities and is excluded. Locality\
      \ lists across the four full profiles are merged only where supported by these sources; Rio Calobre is retained\
      \ as the type locality without assigning it to a western drainage by place-name resemblance. The older canal\
      \ study is regional ecological context, not a source of usable species-linked chemistry in its extracted text.\
      \ The Rican revision is readable only as a repository abstract. One checker records a failed CRC archival\
      \ request; the public page is readable through the project tool and confirms monogamous mating, without access\
      \ to subscriber content. Both calobrensis and calobrense return no cichlids.com archive posts."

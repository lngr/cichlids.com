    tolerance:
      value:
        min: 22
        max: 31
      confidence: low
      rationale: "The tally decides 22 to 31 C by the median of six proposals with low confidence. All proposals\
        \ are generator: 22 to 32; checker-a: 22 to 30; checker-b: 22 to 30; checker-c: 22 to 30; tiebreaker-1:\
        \ 22 to 32; tiebreaker-2: 22 to 32 C. Three runs propose an upper limit of 30 C and three propose 32 C,\
        \ so their median is 31 C; this is an uncertain husbandry synthesis rather than a demonstrated chronic threshold.\
        \ Seriously Fish recommends 22 to 27 C, AquaInfo and Cichlidamerique 26 to 28 C, and NCS the wider 27 to\
        \ 32 C. FishBase also prints 27 to 32 C, attributed to Conkel (1993); only its bibliography and secondary\
        \ summary are readable, not the book. The chosen range is narrower than the combined 22 to 32 C source envelope\
        \ and retains the dissenting 32 C advice in evidence. Bayano observations up to 30.3 C include reservoir\
        \ sites; Pacora observations of 23 to 31.6 C concern another cichlid. Neither establishes long-term aquarium\
        \ endpoints. A routine target near 26 to 28 C has better support than continuous keeping near the tolerance\
        \ extremes."

  ph:
    value:
      min: 7.2
      max: 8.2
    confidence: medium
    rationale: "The unanimous tally uses its 0.3 pH agreement threshold to decide 7.2 to 8.2. Proposals are generator\
      \ 7.2 to 8.2, checker-a 7 to 8.5, checker-b 7.2 to 8.2 and checker-c 7.2 to 8. Bayano river stations give\
      \ 7.21 to 7.95, the Chepo collecting account gives approximately 7.8 to 8.2, and a Chucunaque laboratory sample\
      \ gives 7.9. Direct occupied-habitat measurements support the upper extension over FishBase's general 6.5\
      \ to 7.5. The wider Pacora range of 7.01 to 8.5 concerns another species. Capira is another regional proxy;\
      \ its table actually includes a seasonal site mean of 9.43, beyond checker-a's extracted 7.2 to 8.7. Bayano\
      \ reservoir values reach 9.06. These broader regional and reservoir values remain evidence but do not define\
      \ typical calobrensis river conditions."
    sources:
    - kind: literature
      title: "Autoridad del Canal de Panama (2017): Estudio de Calidad de Agua del Rio Bayano, tables 1 and 4 to\
        \ 12"
      url: "https://pancanal.com/wp-content/uploads/2021/09/Estudio-de-Calidad-de-Agua_Bayano.pdf"
      accessed: '2026-10-15'
      archived: pancanal.com/wp-content/uploads/2021/09/estudio-de-calidad-de-agua_bayano.pdf/2026-10-15T120654Z

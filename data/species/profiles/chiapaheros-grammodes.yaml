  diet:
    text: "Use the piscivore category while providing varied animal-based nutrition. A complete carnivorous-cichlid\
      \ pellet can be supplemented with shrimp, worms, insects and occasional fish portions. Natural accounts\
      \ also identify substantial insect feeding, without quantifying the relative share of fish. Vigorous\
      \ intake can produce substantial waste, so watch both portions and access for a subordinate partner.\
      \ The false bloat-sensitivity flag does not exclude digestive disease; juvenile intestinal problems\
      \ are reported."

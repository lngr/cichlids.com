  problems:
    text: "Chronic harassment can appear first as missed feeding, prolonged hiding or poor growth. Act\
      \ before visible wounds become severe. Heavy feeding in warm water also increases the demand on\
      \ filtration and oxygenation. Wild upper Grijalva specimens of this species carried multiple parasite\
      \ taxa in a published survey, supporting careful quarantine of new arrivals. Stable chemistry and\
      \ planned separation facilities are more useful than treating broad tolerance limits or previous\
      \ peaceful periods as guarantees."

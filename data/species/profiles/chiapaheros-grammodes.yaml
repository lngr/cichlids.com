      \ 1000 L; these wider-space recommendations are retained rather than turned into the minimum for\
      \ every pair. The forum 75-US-gallon suggestion is weaker single-keeper evidence. Mixed adult communities\
      \ require more room and a separation plan; the pair minimum is not a tested safe community threshold."

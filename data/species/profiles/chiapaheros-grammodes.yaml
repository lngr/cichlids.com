  sizeAndGrowth:
    text: "Plan for a typical male near 25 cm and a smaller female near 20 cm; the female figure is an\
      \ estimate. Some care accounts give maxima near 30 cm. FishBase instead reports 20.3 cm standard\
      \ length, excluding the tail, and cannot be compared directly with aquarium total length. Juvenile\
      \ tolerance of neighbours does not predict adult compatibility. Longevity estimates centre on ten\
      \ years, with an eight-to-ten-year planning span and low confidence."

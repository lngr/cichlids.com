  ph:
    value:
      min: 7
      max: 8.5
    confidence: medium
    rationale: "The qualified-majority tally selects 7.0 to 8.5. Stream accounts give 7 to 8 and INAPESCA\
      \ measured 7.9 to 8.4 in La Angostura. Historical monitoring is wider: Tilapia Agua Azul reproduces\
      \ 6.9 to 8.5 across campaigns, the older fisheries report gives 6 to 7.3, and the Santo Domingo\
      \ authority series gives 7.49 to 8.56. These series are retained without implying that fish were\
      \ caught at every sampling station. The selected range represents ordinary neutral to alkaline basin\
      \ water rather than every deep reservoir or historical extreme. It is narrower than the total source\
      \ envelope and is not a physiological exclusion boundary. Proposals: generator {\"min\": 7, \"max\"\
      : 8.4}; checker-a {\"min\": 7.2, \"max\": 8.2}; checker-b {\"min\": 6.9, \"max\": 8.5}; checker-c\
      \ {\"min\": 7.6, \"max\": 8.4}; tiebreaker-1 {\"min\": 7, \"max\": 8.6}; tiebreaker-2 {\"min\":\
      \ 7.4, \"max\": 8.4}."

          value:
            min: 20
            max: 32
        - by: tiebreaker-2
          value:
            min: 24
            max: 30
      decision:
        min: 22
        max: 30
      rationale: "The settled median is 22 to 30 C, with low confidence because no qualified majority\
        \ formed. The lower bound is a planning compromise between the 20 C and 24 C proposals, not a\
        \ newly measured minimum. Miller reports stream observations of 20 to 29 C; INAPESCA reports the\
        \ wider reservoir surface interval 25 to 32 C, and the later Bio-World survey includes 24.7 to\
        \ 31.2 C. The latter minimum came from deep water and warm surface maxima do not establish sustained\
        \ preferred conditions. Both cooler stream records and hotter reservoir observations remain evidence.\
        \ The decided range is plausible for ordinary freshwater keeping; the FAO basin-wide 24 to 39.1\
        \ C compilation includes unmatched lower-river chemistry and does not delimit this upper-basin\
        \ species. Proposals: generator {\"min\": 20, \"max\": 30}; checker-a {\"min\": 24, \"max\": 29};\
        \ checker-b {\"min\": 20, \"max\": 32}; checker-c {\"min\": 24, \"max\": 30}; tiebreaker-1 {\"\
        min\": 20, \"max\": 32}; tiebreaker-2 {\"min\": 24, \"max\": 30}."

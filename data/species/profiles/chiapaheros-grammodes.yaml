        max: 30
      rationale: "The settled median tolerance is 20 to 30 C with low confidence. The median retains the\
        \ cool limit supported by NCS and the habitat accounts while declining to make brief warm reservoir\
        \ surfaces a chronic aquarium recommendation. The wider 20 to 32 C proposals from checker-b and\
        \ tiebreaker-1 were widened for their proposed habitat envelope, not supported by multiyear keeping\
        \ at 32 C. Their INAPESCA source reports 25 to 32 C surface water and remains evidence. FishProfiles\
        \ and Aquatic Community advise 22 to 27 C, Aqua-Fish 24 to 29 C, Fishipedia 24 to 30 C, and Imperial\
        \ Tropicals about 21.1 to 27.8 C. Around 24 to 27 C has the broadest routine husbandry overlap.\
        \ Exact outer limits have not been experimentally established. Proposals: generator {\"min\":\
        \ 20, \"max\": 30}; checker-a {\"min\": 22, \"max\": 30}; checker-b {\"min\": 20, \"max\": 32};\

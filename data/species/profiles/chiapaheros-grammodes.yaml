  socialBehavior:
    text: "A pair bond can persist while still requiring intervention when aggression escalates. A subordinate\
      \ fish that hides continuously, cannot feed or is repeatedly attacked needs separation. Additional\
      \ adults are rivals, and a juvenile group should not be treated as a permanent social unit. Territorial\
      \ defence affects other species as well as partners and becomes particularly demanding around spawning.\
      \ A single adult remains an alternative if a safe pair cannot be maintained."

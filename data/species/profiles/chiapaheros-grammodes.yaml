partners:
  suitable: []
  unsuitable:
    - species: Paracheirodon innesi
      reason: An adult is small enough to be prey and cannot tolerate this predator in a normal community
        aquarium.
    - species: Mikrogeophagus ramirezi
      reason: Small size and limited defensive ability make predation and territorial injury plausible.
    - species: Vieja hartwegi
      reason: The existing presumed pairwise hybrid group records a crossing concern in addition to territorial
        risk.
    - species: Parachromis dovii
      reason: A much larger aggressive adult creates a serious injury risk for grammodes in an enclosure
        sized for the latter.
profile:
  overview:
    text: A large mouth and patterned head accompany the predatory habits of this upper Grijalva cichlid.
      Males normally need allowance for about 25 cm of aquarium length. The valid name is Chiapaheros
      grammodes; Cichlasoma grammodes persists in older aquarium references. Keeping a compatible pair
      is a substantial behavioural commitment because either partner may need physical protection. Its
      Mini-dovii nickname is not a statement of close taxonomic relationship.
    sources:

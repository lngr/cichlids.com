        \ here does not mean an exclusively fish diet. The false sensitivity flag is inferred from animal-food\
        \ husbandry and the absence of a reported specialist high-protein syndrome, rather than proof\
        \ that intestinal problems cannot occur. Beerlink describes juvenile digestive problems. The AquaInfo\
        \ and NVC versions share an author and are not independent diet studies. Proposals: generator\
        \ {\"type\": \"piscivore\", \"bloatSensitive\": false, \"foods\": [\"complete carnivorous cichlid\

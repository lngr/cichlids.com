  compatibility:
    text: "Both aggression categories are level 4 and small fish face substantial predation risk. Dedicated\
      \ keeping of one adult or a compatible pair is the simplest arrangement. Some accounts permit large\
      \ robust companions in substantially larger enclosures, which is why speciesOnly is false, but no\
      \ named combination is recommended here as verified safe. A mixed aquarium needs separate retreats\
      \ and immediate removal options. Vieja hartwegi additionally shares the presumed crossing group,\
      \ whose captive and suggested wild evidence does not establish free-choice parentage."

      rationale: "The qualified-majority decision is 4 to 11 dGH. Direct La Angostura hardness results\
        \ of 80 mg/L, 104 to 179 mg/L by EDTA, and later values up to 187 mg/L as CaCO3 span about 4.48\
        \ to 10.48 dGH after division by 17.848. These occupied-basin measurements carry more weight for\
        \ typical water than indirect conductivity estimates. Wider retained source ranges include 3.64\
        \ to 17.41 dGH in the historical Tilapia Agua Azul table, 4.93 to 12.53 dGH in its separate prose,\
        \ and 10 to 33 dGH in FishBase and the Beerlink account. The old table has inconsistent component\
        \ rows and the summaries lack matched sampling data. Headwater observations near San Cristobal\
        \ are regional context rather than confirmed grammodes sites; none of these wider intervals is\
        \ silently replaced or converted into a typical habitat claim. Proposals: generator {\"min\":\
        \ 4, \"max\": 18}; checker-a {\"min\": 6, \"max\": 16}; checker-b {\"min\": 5, \"max\": 13}; checker-c\
        \ {\"min\": 4, \"max\": 11}; tiebreaker-1 {\"min\": 4, \"max\": 11}; tiebreaker-2 {\"min\": 4,\
        \ \"max\": 11}."

    tolerance:
      value:
        min: 6.8
        max: 8.5
      confidence: low
      rationale: "The tally calls the four proposals unanimous under its 0.3 pH agreement threshold and\
        \ selects 6.8 to 8.5, with low confidence. This contains the natural range. Most care advice gives\
        \ 7 to 8, Aqua-Fish reaches 8.1 and Zoopet reaches 8.5; the modest downward extension is inferred.\
        \ Checker-b proposed the wider 6.5 to 8.5 interval, retained as model-derived evidence rather\
        \ than a demonstrated long-term limit. No source establishes failure immediately outside the decided\
        \ interval. Proposals: generator {\"min\": 6.8, \"max\": 8.5}; checker-a {\"min\": 6.8, \"max\"\

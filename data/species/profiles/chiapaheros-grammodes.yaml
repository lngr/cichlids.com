  khDkh:
    value:
      min: 4
      max: 8
    confidence: low
    rationale: "The tally selects 4 to 8 dKH with low confidence; natural KH has no verification object.\
      \ The measured La Angostura alkalinity series of 75 to 138.33 mg/L plus a separate 140 mg/L result\
      \ gives approximately 4.20 to 7.84 dKH when interpreted as CaCO3 equivalents. Reporting that abbreviates\
      \ the basis as CO3 makes this conversion provisional. The historical bicarbonate table yields 3.08\
      \ to 7.84 dKH if expressed as HCO3, or the wider 3.75 to 9.57 dKH under the alternative CaCO3 interpretation.\
      \ Hard headwater values of 10 to 17 dKH are not confirmed occupied sites, and an ambiguous 140 to\
      \ 200 mg/L paragraph could describe GH or alkalinity. All remain evidence. Conductivity-based KH\
      \ estimates from checker-a are retained as its inference and are not quantitative field measurements.\
      \ Proposals: generator {\"min\": 3, \"max\": 8}; checker-a {\"min\": 5, \"max\": 16}; checker-b\
      \ {\"min\": 3, \"max\": 8}; checker-c {\"min\": 4, \"max\": 8}; tiebreaker-1 {\"min\": 4, \"max\"\
      : 8}; tiebreaker-2 {\"min\": 4, \"max\": 8}."

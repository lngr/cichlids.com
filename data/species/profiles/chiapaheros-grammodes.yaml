        \ 10 to 30 dGH, Aqua-Fish gives 9 to 21 dGH and Beerlink discusses 10 to 33 dGH in the species\
        \ husbandry account, matching the FishBase summary. The lower endpoint is widened to contain the\
        \ native-basin measurements and the decided natural range. Healthy multiyear aquarium maintenance\
        \ at each exact endpoint has not been established; this remains a planning envelope rather than\
        \ a laboratory tolerance result. Proposals: generator {\"min\": 4, \"max\": 30}; checker-a {\"\
        min\": 6, \"max\": 30}; checker-b {\"min\": 5, \"max\": 33}; checker-c {\"min\": 4, \"max\": 33};\

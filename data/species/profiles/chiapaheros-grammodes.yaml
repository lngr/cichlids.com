  sexing:
    text: "Compare mature fish rather than relying on a single juvenile. Males generally become larger\
      \ and may develop a stronger forehead profile, longer fin extensions and more obvious markings on\
      \ the gill covers. Red patterning also differs between the sexes, while breeding females may darken\
      \ markedly. Size, condition and maturity influence these clues. A nominal male and female are not\
      \ necessarily a compatible pair."

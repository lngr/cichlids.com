  husbandry:
    text: "Provide a compatible adult pair with at least 600 litres, 200 cm length and about 60 cm front-to-back\
      \ space. The depth is a practical layout allowance rather than a measured biological minimum. Arrange\
      \ stable hardscape with several retreats and broken sightlines, and keep a divider or separate enclosure\
      \ available. Effective filtration, oxygenation and consistent water changes matter for this river-associated\
      \ predator. Around 24 to 27 C overlaps several care recommendations. Wider tolerance estimates are\
      \ uncertain planning boundaries, not preferred operating targets."

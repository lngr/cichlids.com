  aggressionHeterospecific:
    value: 4
    confidence: medium
    rationale: "Generator and checker-c propose 4; checker-a and checker-b propose 3. The numerical median\
      \ lies between rubric categories, so it cannot itself be used as a grade. Level 4 is selected from\
      \ the warnings restricting companions to very robust large fish in very large aquaria and reports\
      \ of lethal pair aggression. Level 3 evidence and successful mixed keeping remain relevant, so the\
      \ grade is a management risk rather than inevitable killing or dominance. The archive death of a\
      \ grammodes establishes that the species can itself be injured by stronger neighbours."

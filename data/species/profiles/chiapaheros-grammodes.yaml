  habitat:
    text: "The native range lies in the upper Grijalva drainage of Chiapas and western Guatemala. Records\
      \ include flowing channels, tributaries, La Angostura reservoir and Columbus Lakes. Rock and sand\
      \ are the strongest substrate associations. The decided typical water ranges are 22 to 30 C, pH\
      \ 7.0 to 8.5, GH 4 to 11 dGH and provisional KH 4 to 8 dKH. Cooler stream observations of 20 to\
      \ 29 C and reservoir surface readings up to 32 C remain relevant seasonal context. Older hardness\
      \ measurements are much wider than recent regional series. Reservoir chemistry and fish captures\
      \ were not consistently measured together, so these ranges do not describe every occupied microhabitat."
    sources:

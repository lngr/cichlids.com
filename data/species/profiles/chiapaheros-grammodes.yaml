  breeding:
    text: Both adults protect the brood after spawning on a firm substrate. Sheltered stones or sloping
      surfaces can be used without an obligatory enclosed cave. Provide a retreat for the female and watch
      the pair after spawning because previous success does not guarantee continued safety. Fry take small
      foods such as newly hatched brine shrimp. Reports of young grazing on parental skin do not replace
      feeding the brood or monitoring the adults for damage.

  ph:
    value: &id060
      min: 3.5
      max: 5.8
    confidence: low
    rationale: "The median tally selects 3.5 to 5.8, with low confidence and no qualified majority. Proposals\
      \ were generator 4.0 to 5.5, checker-a 4.3 to 6.5, checker-b 3.5 to 5.3, checker-c 3.5 to 6.0, tiebreaker-1\
      \ 3.5 to 6.0 and tiebreaker-2 3.5 to 5.5. The lower endpoint relies partly on Newman relaying Goulding,\
      \ whose original book was not read. Negro field observations and the Orinoco seasonal collecting\
      \ account support strongly acidic regional water. Kuchler and colleagues report a wider basin range\
      \ of 3.89 to 6.07, with the upper endpoint in chemically distinct Branco water; the blackwater subset\
      \ reaches 5.80. Silva and colleagues include tributary values to 6.70. The broader Amazonian blackwater\
      \ context of 2.8 to 5.0 is not a daemon locality series. These wider values remain evidence rather\
      \ than redefining the characteristic habitat. FishBase states only a lower bound of 6.0 and no upper\
      \ bound or field station. Some Cinaruco full texts were unavailable as open access; no unseen numerical\
      \ readings from them were used."
    sources:
    - &id019
      kind: literature
      title: Silva et al. (2019). A contribution to the hydrochemistry and water typology of the Amazon
        River and its tributaries
      url: "https://doi.org/10.14393/rcg207246295"

      \ 0 to 0.01 mg/L corresponds to about 0 to 0.00046 dKH; a different regional alkalinity series gives\
      \ approximately 0.056 to 0.280 dKH equivalent. These are different analytical quantities in humic\
      \ water. Near-zero carbonate buffering and regional variation support the rounded planning band,\

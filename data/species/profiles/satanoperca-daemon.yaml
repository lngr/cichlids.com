  temperatureC:
    value: &id059
      min: 27
      max: 31
    confidence: low
    rationale: "The unanimous tally selects 27 to 31 C from generator 28 to 31 and checker-a, checker-b\
      \ and checker-c 27 to 31. This is a regional planning envelope, with low confidence because collection-site\
      \ seasonal coverage is incomplete. FishBase gives 27 to 30 C. Wider regional source ranges remain\
      \ evidence: Oliveira and Ferreira measured 28.4 to 34.7 C; Fonseca and colleagues 28.0 to 34.6 C;\
      \ the Amazon review gives 28 to 32 C; drought-recovery observations give 30.20 to 35.35 C. The Krib\
      \ reproduces seasonal collecting-area observations of 25.5 to 32.5 C. These surveys differ in location,\
      \ season and exposure, and do not establish that every extreme is a routine temperature for every\
      \ population. Their extremes are retained without extending the tallied typical range."

profile:
  overview:
    text: "A group of Satanoperca daemon brings almost continuous bottom browsing to a spacious aquarium.\
      \ Its two flank marks and tail-base ocellus distinguish the threespot eartheater from similar congeners.\
      \ Adults usually tolerate quiet companions, yet the combination of adult size, social hierarchy\
      \ and sensitivity to poor conditions makes this a demanding species. Plan around a group of at least\
      \ five and an established aquarium rather than the size of juveniles offered for sale."
    sources:
    - *id002
    - *id018
    - *id027
    - *id001
  habitat:
    text: "This species occupies parts of the Negro, Casiquiare and upper Orinoco drainages in Brazil,\
      \ Colombia and Venezuela. Sand, submerged timber and seasonal access to sheltered marginal waters\
      \ shape its feeding habitat. CRC emphasizes main channels, while detailed accounts also describe\
      \ floodplain margins and lagoons. The natural planning bands are 27 to 31 C, pH 3.5 to 5.8, GH 0\
      \ to 1 dGH and KH 0 to 1 dKH. They summarize typical regional conditions rather than complete measurements\
      \ for all populations. Regional studies report surface temperatures into the mid-30s; a secondary\
      \ Orinoco collecting account reports seasonal temperatures from 25.5 to 32.5 C. Those broader observations\
      \ remain relevant context rather than permanent aquarium targets. Very low measured calcium, magnesium\
      \ and bicarbonate support the dilute blackwater chemistry; a zero hardness endpoint means practical\
      \ near-zero values. Other retained regional publications concern community ecology, water treatment\
      \ or different study organisms and supply context only; the dolphin survey concerns another basin.\
      \ The former Cichlid-Forum article URL now shows an unrelated index, and the archived cichlids.com\
      \ thread found by an epithet search is unrelated to this species."
    sources:
    - *id002
    - *id019
    - *id004
    - *id033
    - *id022

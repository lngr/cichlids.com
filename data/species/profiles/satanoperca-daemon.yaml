    text: "Use about 25 cm for adult planning for either sex. Some sources report 30 cm total length,\
      \ and standard-length figures elsewhere exclude the tail, making direct comparisons unreliable.\
      \ A smaller female limit is not established. Newman followed juveniles from approximately 5.5 to\

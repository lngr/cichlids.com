  diet:
    text: "Supply several small meals that reach the bottom and allow every fish time to feed. Fine prepared\
      \ sinking foods, small insect larvae and Artemia can provide variety, with vegetable-containing\
      \ foods also included. Natural feeding emphasizes small invertebrates extracted from sediment, together\
      \ with some seeds and detritus. Faster companions may take a disproportionate share, so watch individual\
      \ body condition. The protein-related bloat flag is false because the read evidence does not establish\
      \ that mechanism; serious abdominal swelling is nevertheless reported and balanced feeding and water\
      \ quality remain essential."
    sources:
    - *id002
    - *id018
    - *id010
    - *id027
    - *id011
    - *id056
    - *id012
    - *id013
  breeding:
    text: "Both parents participate in open substrate spawning. They excavate a site, deposit and fertilize\
      \ eggs, then cover the brood with bottom material and defend it. This species is not a mouthbrooder.\
      \ Successful rearing is less consistently reported than spawning attempts. Experienced accounts\
      \ describe coarse material at the nesting site as relevant to brood development, while ordinary\
      \ feeding areas still need fine sand. Extra nesting space and the ability to separate displaced\
      \ fish matter. Newly free-swimming fry accept very small foods such as Artemia nauplii, with particular\
      \ care needed to prevent waste accumulation."
    sources:
    - *id002
    - *id003
    - *id018
    - *id010
    - *id027
    - *id009
  sexing:
    text: "Reliable external sex differences are limited. A mature female carrying eggs can appear fuller,\
      \ but body shape, color and fin development do not reliably identify juveniles. The ovipositor and\
      \ observed egg laying provide stronger information during reproduction. Group formation allows natural\
      \ partner selection; courtship alone cannot prove that the two fish are of different sexes. No consistent\
      \ sex-specific maximum length was established by the reviewed sources."
    sources:
    - *id002
    - *id010
    - *id009
  compatibility:
    text: "Quiet upper-water companions can work when water requirements overlap and the aquarium has\
      \ capacity beyond the daemon group minimum. Mesonauta insignis, Pterophyllum scalare and Uaru amphiacanthoides\
      \ are conditional examples from the husbandry accounts, with additional room for their own needs.\
      \ Avoid aggressive bottom competitors and fish that consistently monopolize food. Alkaline African\
      \ lake communities are a poor match to the decided water targets. Potamotrygon mixed setups carry\
      \ a reported risk of nighttime loss of cichlids. Predation level 0 allows incidental loss of extremely\
      \ small fry; it does not guarantee fry survival. No hybrid group is assigned because a named cross\
      \ involving daemon was not established."
    sources:
    - *id002
    - *id010
    - *id027
    - *id038
    - *id018
    - *id039
    - *id057
    - *id011
    - *id012
    - *id013
    - *id014
  problems:
    text: "Declining appetite, poor body condition, persistent social exclusion and deteriorating water\
      \ warrant prompt attention. Published accounts report head and lateral-line erosion and episodes\
      \ of abdominal swelling, including losses following disturbed maintenance. These observations do\
      \ not establish a single cause or a treatment protocol. The reported swelling is not evidence by\
      \ itself for protein-induced bloat. Maintain stable replacement-water preparation, keep filters\
      \ effective and avoid overloading the aquarium. Persistent illness requires a qualified diagnosis\
      \ rather than assuming that a pH adjustment will resolve it."
    sources:
    - *id002
    - *id010
    - *id027

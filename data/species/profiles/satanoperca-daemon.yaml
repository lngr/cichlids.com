    text: "Keep an adult group of at least five with enough feeding area and shelter for subordinate fish\
      \ to move away and resume browsing. A hierarchy with displays and chasing is expected, but an individual\
      \ repeatedly excluded from food or confined near the surface needs intervention. Breeding pairs\
      \ defend a broad area and may displace both conspecifics and other fishes. The territorial flag\
      \ applies during reproduction; it does not describe permanent solitary territories. Monogamous pair\
      \ formation is compatible with normal group housing."

  husbandry:
    text: "For five or more adults, provide at least a 210 by 60 cm base and approximately 756 L. Preserve\
      \ broad sand feeding areas between stable pieces of wood and sheltered retreats. Mature biological\
      \ filtration, effective collection of suspended particles and well-oxygenated water are central\
      \ requirements; direct strong filter returns away from browsing fish. Seriously Fish recommends\
      \ replacing 50 to 70 percent of the water weekly, with replacements prepared to match conditions.\
      \ The decided husbandry envelopes are 24 to 31 C, pH 3.5 to 6.3, GH 0 to 5 dGH and KH 0 to 3 dKH.\
      \ Warm, soft, acidic water around 28 to 30 C is the better-supported starting point; the cool end\
      \ is disputed. Glaser reports success in moderately hard, slightly alkaline water, and a breeding\
      \ diary records GH 10, so the adopted upper limits must not be mistaken for demonstrated failure\
      \ thresholds. Monitor stability carefully when buffering is low."

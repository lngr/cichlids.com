    tolerance:
      value:
        min: 24
        max: 31
      confidence: low
      rationale: "All four tolerance proposals are 24 to 31 C, retained with unanimous verification and\
        \ low confidence. Seriously Fish and NCS state 24 to 28 C; Newman recommends 29 to 31 C and describes\
        \ extended growth at 31 C. Glaser recommends above 28 C without an upper endpoint; Mikolji advises\
        \ against temperatures below 26 C and favors 29 C. The adopted envelope includes both published\
        \ numerical recommendations and the decided natural range. It does not imply equal long-term support\
        \ at all temperatures: the cool end is disputed, and about 28 to 30 C is a reasonable routine\
        \ target. No controlled multiyear endpoint study was found."

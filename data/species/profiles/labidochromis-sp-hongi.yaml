  habitat:
    text: "The species lives along just under 70 km of the Tanzanian coast of Lake Malawi, from Liuli in
      the north to Undu Reef in the south, with known populations at Hongi Island and Lundo Island.
      It stays in fairly shallow water, mostly at 5 to 10 m, where large boulders give way to sand.
      Lake Malawi water is soft but well buffered and alkaline: about 3 to 5 dGH and 5 to 8 dKH, pH
      7.7 to 8.6 and 21 to 29 C over the year. In the aquarium the fish do well in harder tap water
      as long as it is alkaline and stable; soft, acidic water is unsuitable."

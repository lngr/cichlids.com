    tolerance:
      value:
        min: 21
        max: 29
      confidence: medium
      rationale: The tally decides 21 to 29 C unanimously (4 of 4 votes). Generator, checker-a and
        checker-c proposed 21 to 29 C; checker-b proposed 22 to 28 C, which agrees within 1 C. Care
        sheets for this species give 23 to 27 C (Ciklider.se), 22 to 28 C (Aqualog, Aquarium
        Glaser), 23 to 28 C (Nordic cichlid society register, Riverpark), 22 to 26 C (AquaInfo) and
        24 to 28 C (Sims), general Malawi and mbuna sheets 23 to 27 C (OATA) and 24 to 26 C
        (Practical Fishkeeping), and Seriously Fish 24 to 28 C for the congener L. caeruleus. The
        tolerance has to contain the natural lake range of 21 to 29 C, which wild fish meet every
        year, so it reaches beyond the care sheets; the comfort zone of the husbandry literature
        lies around 24 to 27 C.

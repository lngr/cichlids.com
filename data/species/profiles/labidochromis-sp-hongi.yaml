  socialBehavior:
    text: The dominant male claims a cave or rock pile and defends it hard against other males, and also
      chases females that are not ready to spawn. Subordinate males and females move around in a
      loose group without a fixed home. A male may also bluff at much larger tankmates near his
      rocks. Aggression spreads best over several females per male in a well-structured tank; a
      single female or two males in a small tank lead to injuries. Females also form a ranking among
      themselves. Brooding females need hiding places, or they can be moved to a separate tank.
    sources:

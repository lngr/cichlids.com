  note: Undescribed species without a scientific name. The Catalog of Fishes (genus Labidochromis,
    queried on 2026-10-13) lists 18 valid species and L. mathotho of uncertain status, but no taxon
    and no synonym for the Hongi fish; FishBase and Seriously Fish have no page for it either. The
    trade name refers to Hongi Island on the Tanzanian shore of Lake Malawi. The placement in
    Labidochromis is provisional and follows hobby usage, the Swedish species database Ciklider.se
    and the Cichlid Room Companion. Red Top, Super Red Top and Sweden are aquarium lines of the same
    fish, listed under trade names and variants.
names:
  trade:
    en:
      - Red Top Hongi

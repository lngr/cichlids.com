  temperatureC:
    value:
      min: 21
      max: 29
    confidence: high
    verification:
      method: waterbody
      waterbody: lake-malawi
    rationale: The species is endemic to Lake Malawi, so the natural range is the measured lake range of
      21 to 29 C. Eccles (1974) reports 21 C in inshore water during the cool windy season and 27 C
      in the upper 60 m by May, Vollmer et al. (2005) give winter epilimnion values of about 23.5 C
      and summer surface water near 28 C, and a 2013 campaign summarised by Ngochera (2018) found 24
      to 29 C. The fish live at about 5 to 10 m depth and meet this whole seasonal range.

        dGH (OATA). The sources reach up to 25 dGH: Seriously Fish gives 10 to 25 dGH for L.
        caeruleus and the Fishkeeper data bank an upper limit of 25 dGH for this species, but most
        sheets stop at 20. The lower limit is the natural 3 dGH, which the tolerance must contain;
        the care sheets start higher because they describe aquarium water, not because soft lake
        water harms the fish. Aquarium Glaser considers hardness unimportant as long as the water is
        not soft and acidic."

    value: 1
    confidence: low
    verification:
      method: unanimous
      votes:
        agree: 4
        total: 4
    rationale: "The tally decides level 1 unanimously (4 of 4 votes). No source reports fish in the
      diet: Ciklider.se describes algae and small invertebrates from the rock cover, the Cichlid
      Room Companion lists algae picking and plankton feeding, and Aquarium Glaser calls the species
      an omnivore. AquaInfo warns that released fry are eaten, Genner and Turner (2005) name fry
      among the foods of mbuna, Practical Fishkeeping says the same of mbuna in general, and the
      congener L. caeruleus is the rubric example of level 1. The species therefore takes fry and
      very small fish when the chance arises, but nothing supports a higher level. The confidence
      stays low because the fry predation rests on general mbuna and genus evidence rather than on
      observations of this fish."

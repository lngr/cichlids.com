  breeding:
    text: The species is a maternal mouthbrooder and breeds readily in the aquarium. The male displays
      in front of his cave and leads a ripe female inside, where the pair circle each other while
      she lays eggs in small batches and picks them up; she takes in sperm near the egg spots on his
      anal fin. A normal brood counts about 15 to 30 young. The female carries them for a little
      over three weeks and eats little during that time. Moving her to a quiet tank shortly before
      release protects the fry, which can be raised on crushed flakes and small live food.
    sources:
      - kind: database

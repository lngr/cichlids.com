partners:
  suitable:
    - species: Pseudotropheus cyaneorhabdos
      reason: Small mbuna of similar temperament with dark horizontal stripes on blue, so it does not look
        like a rival; same water and plant-based diet.
      condition: Tank of at least 120 cm with plenty of rock caves.
    - species: Iodotropheus sprengerae
      reason: Small brownish-lilac aufwuchs eater of the rock zone, clearly different in colour and shape;
        shares water and food.
      condition: Enough caves so that it can avoid the territorial Hongi male.
    - species: Synodontis njassae
      reason: Lake Malawi catfish that lives on the bottom and in crevices, outside the territorial
        conflicts of the mbuna; same water.
      condition: Group of several catfish and caves near the ground.
  unsuitable:
    - species: Labidochromis caeruleus
      reason: Same genus; the hobby warns that Labidochromis species cross, and the pale females of both
        are hard to tell apart.
    - species: Labidochromis sp. 'Perlmutt'
      reason: Undescribed congener; a cichlids.com forum keeper reports crosses with the Hongi fish.
    - species: Chindongo demasoni
      reason: Very aggressive blue barred mbuna with a similar pattern; constant rivalry with the Hongi
        male.
    - species: Aulonocara stuartgranti
      reason: Calm sand-zone cichlid that needs protein-rich invertebrate food, which causes bloat in the
        Hongi fish; its males are harassed by the territorial Hongi male.
    - species: Paracheirodon innesi
      reason: Small, peaceful soft-water tetra that needs acidic water; it would be harassed, and its
        young would be eaten.
profile:
  overview:
    text: The Red Top Hongi is a small, colourful rock cichlid (mbuna) from the Tanzanian shore of Lake
      Malawi. It has no scientific name yet and is traded as Labidochromis sp. 'Hongi', after Hongi
      Island, home of its most colourful wild population. Adult males are blue with dark vertical
      bars and a yellow-orange blaze running from the snout over the back; aquarium lines such as
      Red Top or Sweden show much more red. Females are brownish. The fish is hardy and breeds
      readily, but the dominant male is far more quarrelsome than its peaceful-looking relative, the
      yellow L. caeruleus, so it needs a roomy rock tank and several females.
    sources:
      - kind: database
        title: "Persson, M.: Labidochromis sp. 'hongi'. Ciklider.se species description"
        url: https://www.ciklider.se/artbeskrivning/labidochromis-sp-hongi/

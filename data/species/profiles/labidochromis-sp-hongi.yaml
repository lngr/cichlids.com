  sizeAndGrowth:
    text: Males usually reach about 10 cm in the aquarium and females about 8 cm; single tank-raised
      males can grow to around 12 cm. Juveniles look like females, brownish with faint bars, and
      young males take on the blue body and orange top as they gain rank. Only the dominant male
      shows full colour all the time, while subordinate males stay drab. Growth is quick on a good
      diet. Overfeeding with rich food makes them fat rather than larger and raises the risk of
      bloat.

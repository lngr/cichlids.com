  diet:
    value:
      type: aufwuchs
      bloatSensitive: true
      foods:
        - algae and biofilm from the rock cover
        - small invertebrates and plankton taken with it
        - spirulina-based or vegetable flakes and pellets
        - small crustaceans such as mysis or cyclops as an occasional supplement
    confidence: low
    verification:
      method: conservative
      votes:
        agree: 3
        total: 5
    rationale: "The tally decides aufwuchs with bloat sensitivity conservatively (3 of 5 votes,
      confidence low). The generator, checker-a and checker-c proposed aufwuchs and bloat-sensitive;
      checker-b and tiebreaker-1 proposed omnivore and bloat-sensitive. Without a qualified majority
      of four votes the tally takes the strictest type, aufwuchs, and bloat sensitivity, which every
      run proposed. The sources split in the same way: Ciklider.se describes a herbivore that feeds
      mainly on algae with some small invertebrates from the aufwuchs and asks for plant-rich food,
      the Nordic cichlid society register describes grazing on the rock biofilm, and the Fishkeeper
      data bank asks for a plant-based staple and warns of bloat on protein-rich food, as do OATA
      and Practical Fishkeeping for mbuna in general. The Cichlid Room Companion files the fish both
      as algae picker and as planktivore, and AquaInfo, malawi.si, Aqualog, Aquarium Glaser,
      Wikipedia and several retailers call it an omnivore; a university display sheet names small
      invertebrates. No stomach-content study exists. In practice the fish needs a plant-based,
      low-protein staple and takes small animal food as a supplement; the aufwuchs value makes the
      stocking planner treat it like other algae-grazing mbuna, which is the safer side for a
      bloat-sensitive fish."

  diet:
    text: "In the lake the species picks algae from the carpet on the rocks together with the small
      invertebrates living in it, and it also takes plankton. In the aquarium it eats almost
      everything, but the main food should be plant-based: spirulina or vegetable flakes and pellets
      made for mbuna. Small crustaceans such as mysis or cyclops are fine as an occasional
      supplement. Rich, protein-heavy foods intended for predatory cichlids make mbuna fat and can
      trigger bloat. Feed small portions once or twice a day, since mbuna rush their food and
      quickly overeat. Colour foods intensify the red of the aquarium lines but are not needed for
      health."
    sources:

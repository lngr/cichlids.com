  maxSizeCm:
    value:
      male: 10
      female: 8
    confidence: medium
    rationale: Sources differ widely, from 8 to 9 cm (Aqualog, Ciklider.se with 9 cm for males) to an
      unsexed 15 cm (Fishkeeper data bank). Sexed figures are 10 and 8 cm (malawi.si), 11 and 9 cm
      (Fischlexikon) and 12.7 and 8.9 cm (Wikipedia); Aquarium Glaser gives about 12 cm without sex,
      Riverpark 10 cm, and a cichlids.com archive post puts adult males at about 10 cm. The
      generator and checker-b proposed 10 cm for males and 8 cm for females, checker-a and checker-c
      11 and 9 cm. The decided 10 and 8 cm is the median of the sexed figures and the typical size
      of well-kept adults; the larger figures read as single large tank specimens or rounded maxima,
      and Fischlexikon notes that heavy feeding produces oversized fish.

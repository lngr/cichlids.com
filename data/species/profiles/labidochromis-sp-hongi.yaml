  compatibility:
    text: The Red Top Hongi suits a mixed mbuna tank with species of similar size and temper that look
      clearly different, for example Pseudotropheus cyaneorhabdos or Iodotropheus sprengerae, and
      with Lake Malawi catfish such as Synodontis njassae. Other Labidochromis, including the yellow
      L. caeruleus, do not belong in the same tank, because the hobby warns that the species of the
      genus cross and their females look alike. Other blue barred mbuna in small tanks, very
      aggressive species such as Chindongo demasoni, and calm sand-zone haplochromines such as
      peacocks, which need protein-rich food and suffer from the territorial male, are poor
      companions. Small tetras or other soft-water fish do not fit the water and may be eaten.
    sources:
      - kind: database
        title: "Persson, M.: Labidochromis sp. 'hongi'. Ciklider.se species description"

  husbandry:
    text: A group of one male and three or more females needs a tank of about 250 litres and at least
      120 cm length; more males need a much longer tank. Build stable rock piles with many caves and
      visual barriers on fine sand, and leave open swimming space in front, so that females and
      lower-ranking males can escape the dominant male. Strong filtration and large weekly water
      changes keep nitrate low. Keep the water alkaline and buffered, with pH around 7.5 to 8.5,
      carbonate hardness of at least 5 dKH and a temperature of 24 to 27 C. Rocks must stand
      directly on the tank bottom, since the fish like to dig along their sides.
    sources:

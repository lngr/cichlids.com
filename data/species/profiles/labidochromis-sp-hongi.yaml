  sexing:
    text: Adult males are larger, about 2 cm longer than females, and carry the blue body with dark bars
      and the yellow, orange or red blaze over head and back. They have clear egg spots on the anal
      fin. Females are brownish to lilac with faint bars. Subordinate males can look like females
      for a long time, so sexing young fish is uncertain; waiting until the group has grown up and
      the dominant male colours up is the most reliable way.
    sources:

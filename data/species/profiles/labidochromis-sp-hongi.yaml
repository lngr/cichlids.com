      - Red Top Kimpuma
      - Hongi Super Red Top
      - Red Top Lab
      - Hongi Sweden
variants:
  - name: Hongi Island
    kind: locality
    note: Name-giving wild population; its males are the most colourful of the wild forms, blue with
      dark bars and a yellow-orange blaze over head and back.
  - name: Lundo Island
    kind: locality
    note: Wild population on the Tanzanian shore that hobby sources also count among the attractive
      forms.
  - name: Red Top / Super Red Top
    kind: color-morph
    note: Aquarium line selected for a large red-orange area on head, back and dorsal fin, far more
      intense than in wild fish.
  - name: Sweden
    kind: color-morph
    note: Very red captive line from Swedish breeders; the red needs colour-rich food to stay intense.
features:
  origin:
    value:
      continent: Africa
      region: Lake Malawi
      waterbody: lake-malawi
      localities:
        - Hongi Island (Tanzania)
        - Lundo Island (Tanzania)
        - Tanzanian shore between Liuli and Undu Reef
    confidence: high
    rationale: All runs agree on the Tanzanian shore of Lake Malawi. Ciklider.se gives a stretch of just
      under 70 km from Liuli in the north to Undu Reef in the south, with the most colourful fish at
      Hongi Island; the Nordic cichlid society register, the Fishkeeper data bank and the
      cichlid-forum article add Lundo Island as a second known population. The public summary of the
      Cichlid Room Companion confirms a native range in the Tanzanian part of the lake. Several
      independent species databases agree, so the confidence is high.

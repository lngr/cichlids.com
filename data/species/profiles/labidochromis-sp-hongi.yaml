  problems:
    text: The most common problem is Malawi bloat, a swollen belly with loss of appetite that often ends
      fatally. It is linked to rich, protein-heavy food, overfeeding and poor water quality, so a
      plant-based diet and frequent water changes are the best prevention. Too small a tank, too few
      females or too little rock cover lead to torn fins and stressed, hiding fish. Soft or acidic
      water and swings in pH weaken the fish. Mixing with other Labidochromis can give hybrids. Fish
      that suddenly stop eating, hide or breathe fast should be checked by an experienced keeper or
      a fish vet.

    rationale: The generator, checker-a and checker-c proposed level 2, checker-b level 3. Aquarium
      Glaser notes that a dominant male defends his territory even against much larger fish, the
      Nordic cichlid society register describes intruders being driven from the defended site, and
      Ciklider.se and Riverpark recommend tankmates of similar size and temperament; malawi.si
      describes the fish as fairly tolerant of other species. AquaInfo and the cichlid-forum article
      describe fiercer defence and nipping at larger fish, but no source reports attacks across the
      whole tank. The aggression centres on the male's rock territory, which is level 2.

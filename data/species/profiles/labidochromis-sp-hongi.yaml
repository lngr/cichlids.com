  ph:
    value:
      min: 7.7
      max: 8.6
    confidence: high
    verification:
      method: waterbody
      waterbody: lake-malawi
    rationale: The species is endemic to Lake Malawi, so the natural range is the measured surface pH of
      the lake, 7.7 to 8.6, after the data of Jackson et al. (1963) compiled by FAO. Branchu et al.
      (2010) give 7.5 to 8.5 for the whole water column of the north basin, the lower values
      belonging to deep water that this shallow-water fish does not use.

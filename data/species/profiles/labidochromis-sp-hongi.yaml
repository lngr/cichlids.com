  khDkh:
    value:
      min: 5
      max: 8
    confidence: high
    verification:
      method: waterbody
      waterbody: lake-malawi
    rationale: The species is endemic to Lake Malawi, so the natural range is the measured lake range of
      5 to 8 dKH. Alkalinity is 2.33 to 2.46 meq/L in the profiles of Branchu et al. (2010), about
      6.5 to 6.9 dKH, and 2.00 to 2.59 meq/L in the data of Jackson et al. (1963) compiled by FAO,
      about 5.6 to 7.3 dKH. Sodium balances part of the bicarbonate, so the carbonate hardness
      exceeds the total hardness.

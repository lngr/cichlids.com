    tolerance:
      value:
        min: 5
        max: 15
      confidence: low
      rationale: The tally decides 5 to 15 dKH unanimously (4 of 4 votes) with low confidence. No species
        database gives a carbonate hardness for this fish; the OATA sheet recommends 10 to 15 dKH
        for Malawi cichlids, and the AquaBota and Aquarist Atlas pages give 8 to 15 dKH. Practical
        Fishkeeping, Seriously Fish (for L. caeruleus) and Aquarium Glaser stress well-buffered,
        stable water without numbers. The tolerance runs from the natural 5 dKH measured in the lake
        (Branchu et al. 2010; FAO after Jackson et al. 1963) up to the 15 dKH of the care sheets; a
        stable buffer that holds the pH in range matters more than the exact value.

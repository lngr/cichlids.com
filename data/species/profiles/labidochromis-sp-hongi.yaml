  aggressionConspecific:
    value: 3
    confidence: medium
    rationale: All four runs agree on level 3. Ciklider.se calls the species strongly territorial and
      aggressive, above all towards other males; Aquarium Glaser and the cichlid-forum article
      describe dominant males that defend their site hard and chase and nip both rivals and females,
      and a cichlids.com archive post counts it among the more aggressive Labidochromis. AquaInfo
      reports fatal fights between adult males, which points towards level 4, but malawi.si and the
      Fishkeeper data bank describe the aggression as manageable with several females per male and
      plenty of rock cover. Level 3 fits a harem in a tank of the recommended size.

  hybridGroups:
    value:
      - labidochromis
    confidence: medium
    verification:
      method: unanimous
      votes:
        agree: 4
        total: 4
    rationale: "The tally decides the group labidochromis unanimously (4 of 4 votes). The Hongi fish is
      an undescribed member of Labidochromis, and the hobby warns that the species of this genus
      cross when kept together: Seriously Fish advises against mixing Labidochromis species, Acuario
      Adictos repeats this warning in its account of the Hongi fish, Wikipedia states that the genus
      hybridises easily, and Ciklider.se asks for tankmates that look clearly different to avoid
      hybrids. A cichlids.com archive post mentions crosses with the undescribed L. sp. Perlmutt,
      but without any detail on partner choice, so it is community experience only. No cross between
      the Hongi fish and a named species is documented, which matches the presumed basis of the
      group; the species is added to its members."

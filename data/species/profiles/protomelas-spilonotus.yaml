  sexing:
    text: "Mature displaying males are usually larger and more colourful, with more extended dorsal and anal fins. Females are relatively subdued. Young or socially suppressed males can resemble females, so assess mature development and repeated behaviour rather than one pale photograph. Locality affects male colour, and a yellow or orange head is not sufficient to identify a species. Correct both identification and sex before assuming a purchased group supplies one male and three females."

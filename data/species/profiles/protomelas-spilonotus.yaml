  sizeAndGrowth:
    text: "Allow for working aquarium maxima of 25 cm in males and 19 cm in females. These sex-specific estimates remain uncertain because published adult lengths differ. FishBase's unsexed 16.7 cm figure and an exceptionally large Mara Rocks keeper account are different kinds of observation. Moderate portions and body-condition monitoring are preferable to accelerating growth. The 8 to 10 year lifespan is a provisional planning estimate, with no verified age series for the described species."

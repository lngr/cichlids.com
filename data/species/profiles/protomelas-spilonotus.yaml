  diet:
    text: "Use complete cichlid pellets as a staple and vary appropriately sized portions with Daphnia, Cyclops, Artemia and mysis. Animal invertebrates dominate the reported natural prey. Regular fish feeding is not established, and live feeder fish are unnecessary. Feeding speed is provisionally normal; observe access to food because strong appetite alone does not establish how quickly this fish outcompetes neighbours. A false bloat-sensitivity flag means special protein-related susceptibility is unproven, not that digestive illness cannot occur."

  temperatureC:
    value:
      min: 21
      max: 29
    confidence: "high"
    rationale: "All four proposals were 21 to 29 C; retain the mandatory Lake Malawi seasonal envelope. Eccles's accessible abstract reports a 21 C inshore minimum and an approximately 27 C warm upper layer; Vollmer describes summer surface temperatures around 28 C and cooler winters. Branchu measured 25.4 C at the surface and 22.8 C at 240 m during one campaign. These narrower observations are not substituted for the full lake envelope. Ngochera's repository abstract gives no numerical upper temperature, and its full dissertation and the 1999 internal-mixing report were not read through the permitted OA route, so the prescribed 29 C endpoint is not independently reconfirmed here."

  compatibility:
    text: "Assess companions at their adult size and with enough room for all territories. Published large-hap companion lists support only conditional pairings, especially when the companion is a predator able to swallow smaller fish. Small timid fish and strictly algae-feeding mbuna are poor matches. The spilonotus complex carries a presumed crossing caution based on close relationship among the described species and its Tanzania, Mozambique and Likoma relatives. No free-choice cross was verified. P. similis remains outside that group and has different feeding priorities."

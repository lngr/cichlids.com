  husbandry:
    text: "Start with at least 600 litres and 200 cm length for one male and three females. A 60 cm front-to-back depth is an inferred allowance for turning room and shelters. Secure rocks near the margins, retain an open lane and use sand where digging occurs. Provide established filtration, oxygenation and regular water changes. A stable 24 to 26 C is a practical routine target. The broader tolerances are 21 to 29 C, pH 7.5 to 8.7, GH 3 to 16 and KH 5 to 15; their endpoints are not uniformly supported by long-term aquarium trials."

partners:
  suitable:
    - species: "Nimbochromis venustus"
      reason: "Conditional inference from published recommendations of robust Nimbochromis companions; adult sizes must prevent either fish becoming prey."
      condition: "A substantially larger adult predator aquarium than the 600 L harem minimum, with adequate retreats and separation available."
    - species: "Dimidiochromis compressiceps"
      reason: "Conditional inference from the species care accounts accepting robust Dimidiochromis; vulnerable females or juveniles can be prey."
      condition: "Use a much larger aquarium than the harem minimum and evaluate each adult fish size and behaviour."
  unsuitable:
    - species: "Protomelas sp. 'spilonotus tanzania'"
      reason: "Separate undescribed look-alike in the presumed spilonotus hybrid group; breeding identity and potential crossing are concerns, without a verified cross."
    - species: "Protomelas sp. 'spilonotus mozambique'"
      reason: "Close undescribed relative assigned to the same presumed hybrid group; pairwise crossing remains untested."
    - species: "Protomelas sp. 'spilonotus likoma'"
      reason: "Close undescribed relative assigned to the same presumed hybrid group; pairwise crossing remains untested."
    - species: "Protomelas similis"
      reason: "Separate plant-feeding species with different habitat and feeding priorities; shared genus and trade confusion do not establish hybrid-group membership."
    - species: "Chindongo demasoni"
      reason: "Small algae-feeding mbuna with different dietary emphasis and social requirements; a poor match for this adult harem."
    - species: "Paracheirodon axelrodi"
      reason: "Small timid fish poorly suited to a large territorial Malawi community and its water conditions; harm may occur even with predation level 0."
profile:
  overview:
    text: "The legacy name refers here to the described Protomelas spilonotus, an active Lake Malawi haplochromine. A shop label saying Tanzania or Liuli usually identifies its undescribed relative, Protomelas sp. 'spilonotus tanzania'. P. similis is a separate valid species with different feeding ecology. Obtain locality and parent-stock information before choosing breeding fish. Allow for large adults and male courtship pressure; a young fish's shop size gives little indication of its eventual housing needs."
    sources:
      - kind: "catalog-of-fishes"
        title: "Eschmeyer's Catalog of Fishes: Protomelas, update of 21 September 2026"
        url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Protomelas"
        accessed: "2026-10-13"

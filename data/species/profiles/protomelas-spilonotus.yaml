  socialBehavior:
    text: "Manage the male's attention by keeping at least three females and several routes into cover. Persistent pursuit within the species warrants intervention before injuries appear. Robust companions may coexist, but breeding males can displace fish near their spawning site. The compact territory classification describes a defended area rather than a small aquarium requirement. Several adult males call for much larger housing than the minimum harem. Keep an established separation option available for a fish that cannot feed or leave its shelter."

  legacyNames:
    - "Protomelas spilonotus"
  note: "Legacy entry 457 retains the described Protomelas spilonotus (Trewavas, 1935), whose original combination is Haplochromis spilonotus and whose type locality is Chilumba. The Catalog of Fishes separately validates P. similis (Regan, 1922). Nordic and Malawi specialist databases treat Tanzania or Liuli stock as the undescribed P. sp. 'spilonotus tanzania', with separate Mozambique and Likoma relatives; these informal names are not synonyms or locality variants of the described species. Retail use of Insignis and a retailer URL containing similis do not establish synonymy. FishBase associates P. similis with vegetation and plant feeding rather than the rocky-shore invertivory described here. No specimen identity is supplied to justify reassigning the legacy entry. CRC verifies the names and maternal mouthbrooding, but its detailed subscriber profile could not be read."

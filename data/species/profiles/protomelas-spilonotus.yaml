  breeding:
    text: "The female carries the eggs and developing young in her mouth after spawning. Use confidently identified stock from one locality and provide brooding females with quiet retreats. Around three weeks is a useful observation guide, with substantial variation between accounts. Brood-size claims from uncertain trade stocks are not guarantees for the described species. A prepared nursery offers released fry small foods and protection from adult fish. Maintain the species and locality information with each batch of young."

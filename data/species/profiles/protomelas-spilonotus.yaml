  habitat:
    text: "Open swimming room beside rock shelters is central to the layout. The described species feeds away from clean rocky shore faces, commonly in the upper few metres. Some complex-wide accounts describe depths of 5 to 15 m, so that deeper range is not applied to every population. The natural water is soft and alkaline: GH measures calcium and magnesium, while KH here represents bicarbonate alkalinity. Rockwork should provide retreats without filling the swimming lane."

    - field: "features.habitatZones"
      proposals:
        - by: "generator"
          value:
            - "rock"
            - "openWater"
        - by: "checker-a"
          value:
            - "rock"
            - "sand"
            - "openWater"
        - by: "checker-b"
          value:
            - "rock"
            - "openWater"
        - by: "checker-c"
          value:
            - "rock"
            - "openWater"
      decision:
        - "rock"
        - "openWater"
      rationale: "Generator, checker-b and checker-c proposed rock and openWater; checker-a additionally proposed sand. FishBase and Malawi.si place foraging fish in midwater beside clean rock faces and spawning sites among rocks. Sand is useful aquarium substrate but does not need to be added as a primary wild habitat requirement. FishBase's usually shallower-than-5 m account is preferred over transferring a 5 to 15 m complex-wide depth statement to all stocks."
    - field: "features.hybridGroups"
      proposals:
        - by: "generator"
          value: []
        - by: "checker-a"
          value: []
        - by: "checker-b"
          value:
            - "protomelas-spilonotus-complex"
        - by: "checker-c"
          value: []
        - by: "tiebreaker-1"
          value:
            - "protomelas-spilonotus-complex"
        - by: "tiebreaker-2"
          value:
            - "protomelas-spilonotus-complex"
      decision:
        - "protomelas-spilonotus-complex"
      rationale: "The generator, checker-a and checker-c proposed no group; checker-b, tiebreaker-1 and tiebreaker-2 proposed protomelas-spilonotus-complex. With only 3 of 6 supporting either value, no qualified majority exists. The tally therefore conservatively retains the group named by at least two runs, with low confidence and conservative verification, 3 of 6. Bandhauer and Hoernlimann identify P. spilonotus and the undescribed Tanzania, Mozambique and Likoma forms as very close relatives, and Malawi.si independently supports the species-group relationships. The rubric permits presumed membership from such close relationship. No named wild or captive cross with demonstrated conspecific mate choice was found, and every pair remains untested. Neither P. similis nor the taeniolatus complex is included merely through genus membership. Empty proposals describe absent crossing reports, not proven reproductive isolation."
    - field: "features.coloration"
      proposals:
        - by: "generator"
          value:
            baseColors:
              - "blue"
              - "yellow"
              - "black"
            pattern: "mixed"
        - by: "checker-a"
          value:
            baseColors:
              - "blue"
              - "yellow"
            pattern: "mixed"
        - by: "checker-b"
          value:
            baseColors:
              - "blue"
              - "yellow"
              - "black"
            pattern: "mixed"
        - by: "checker-c"
          value:
            baseColors:
              - "blue"
              - "yellow"
              - "black"
            pattern: "mixed"
      decision:
        baseColors:
          - "blue"
          - "yellow"
          - "black"
        pattern: "mixed"
      rationale: "The generator, checker-b and checker-c proposed blue, yellow and black with mixed markings; checker-a proposed blue and yellow with the same mixed pattern. Retain black because the lateral marking and dorsal blotches are relevant dark pattern elements. Adult males are mainly blue with variable pale or yellow head colour. Do not use the orange-yellow Tanzania trade phenotype as the defining appearance of the described species."
    - field: "features.feedingSpeed"
      proposals:
        - by: "generator"
          value: "hasty"
        - by: "checker-a"
          value: "normal"
        - by: "checker-b"
          value: "normal"
        - by: "checker-c"
          value: "hasty"
      decision: "normal"
      rationale: "The generator and checker-c proposed hasty; checker-a and checker-b proposed normal. Strong appetite and seasonal plankton feeding do not demonstrate the rubric's sustained rushing and meal monopolization in captivity. Ready food acceptance without an established comparative feeding disadvantage supports normal provisionally. The enthusiastic-feeding reports remain alternative interpretations rather than a measured speed test."
    - field: "features.minTank"
      proposals:
        - by: "generator"
          value:
            volumeL: 600
            lengthCm: 200
            depthCm: 60
        - by: "checker-a"
          value:
            volumeL: 500
            lengthCm: 200
            depthCm: 50
        - by: "checker-b"
          value:
            volumeL: 600
            lengthCm: 200
            depthCm: 60
        - by: "checker-c"
          value:
            volumeL: 600
            lengthCm: 200
            depthCm: 60
      decision:
        volumeL: 600
        lengthCm: 200
        depthCm: 60
      rationale: "The generator, checker-b and checker-c proposed 600 L, 200 cm length and 60 cm depth; checker-a proposed 500 L, 200 cm and 50 cm. Retain the two named-species care accounts' 600 L and 200 cm recommendation for one male with three females instead of checker-a's unsupported volume compromise. The 60 cm front-to-back depth is a layout inference for large adults and rock shelters, supported by regional non-mbuna examples rather than a species experiment. Smaller retailer minima and Stigliano's successful approximately 473 L colony do not establish a reliable minimum for identified adults. Multi-male or predator communities need appreciably more space."
    - field: "features.lifespanYears"
      proposals:
        - by: "generator"
          value:
            min: 8
            max: 10
        - by: "checker-a"
          value:
            min: 7
            max: 10
        - by: "checker-b"
          value:
            min: 6
            max: 8
        - by: "checker-c"
          value:
            min: 8
            max: 10
      decision:
        min: 8
        max: 10
      rationale: "The generator and checker-c proposed 8 to 10 years, checker-a 7 to 10, and checker-b 6 to 8. Retain 8 to 10 only as a weak general Malawi-hap planning estimate. The retailer's up-to-eight-year claim gives no lower endpoint, while the 7 to 10 and 8 to 10 trade estimates concern Tanzania stock. No verified age series for the described species establishes any of these ranges; the choice is not a pooled or median measured survival result."
    - field: "features.beginnerSuitability"
      proposals:
        - by: "generator"
          value: "demanding"
        - by: "checker-a"
          value: "moderate"
        - by: "checker-b"
          value: "moderate"
        - by: "checker-c"
          value: "moderate"
      decision: "moderate"
      rationale: "The generator proposed demanding; all three checkers proposed moderate. Straightforward feeding and routine maintenance support moderate once adequate housing and Malawi experience are available. The generator's emphasis on a 200 cm aquarium and male management remains valid, but it does not by itself establish unusually delicate care. This rating does not remove the adult space requirement or identity checks."

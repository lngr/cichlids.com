  problems:
    text: "Identity mistakes and inadequate adult space are major avoidable problems. A female hiding continuously, missing meals or losing condition needs a prompt change in management. Check oxygenation, filtration and water quality when breathing or appetite changes, and match replacement water to the established aquarium. Avoid chasing a hardness target through repeated unstable adjustments. Quarantine new arrivals and obtain qualified help for persistent illness. Moderate beginner suitability assumes a prepared large aquarium and competent observation of social pressure."

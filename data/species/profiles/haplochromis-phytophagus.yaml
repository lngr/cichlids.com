  ghDgh:
    value:
      min: 1
      max: 3
    confidence: "low"
    rationale: "The tally retains 1 to 3 dGH with unanimous threshold agreement (4 of 4, low confidence);
      agreement permits endpoints within 2 dGH, so the votes are not identical measurements. Muyodi reports 32
      mg/L hardness at River Yala, equivalent to about 1.79 dGH, a regional proxy. The Anyona abstract
      describes soft Kanyaboli water. Checker-b reports a direct composite-sample value of 36.6 mg/L, about
      2.05 dGH, from Githaiga; fetch-oa did not retrieve that paper or supplement for rechecking. Checker-c
      reports Anyona titration values of 4 to 46 mg/L, about 0.224 to 2.577 dGH, whose lower end lies below
      the decision; that full thesis was not readable here. The FAO Lake Victoria compilation provides an
      independently readable historical comparator, about 1.2 to 1.8 dGH from its calcium and magnesium

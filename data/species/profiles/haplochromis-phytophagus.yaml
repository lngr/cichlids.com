features:
  origin:
    value:
      continent: "Africa"
      region: "Lake Victoria basin and connected Kyoga system; satellite-lake refuges in Kenya and Uganda"
      waterbody: null
      localities:
        - "Lake Kanyaboli, Yala Swamp, Kenya"
        - "Lake Kyoga, Uganda"
        - "Lake Nawampasa, Uganda"
        - "Kisumu, Lake Victoria, Kenya (historical type locality)"
    confidence: "high"
    rationale: "Kanyaboli is directly documented by genetic samples and a 2020 to 2021 fish survey. The Ugandan
      biodiversity portal independently lists Xystichromis phytophagus at both Kyoga and Nawampasa. These
      records correct the earlier runs that could not substantiate Uganda. The sources do not provide
      comparable population estimates across the three lakes, so they cannot establish which refuges hold most
      living fish. Lake Victoria is retained as historical type locality and basin context; reports of
      disappearance from the main lake are not treated as a complete present-day extinction census. No single
      registered waterbody represents these distinct occupied lakes, so waterbody is null and
      satellite/regional measurements support the tally decisions."

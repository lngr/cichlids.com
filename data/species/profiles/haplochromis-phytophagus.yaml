profile:
  overview:
    text: "Christmas fulu males develop a striking display as they mature, but their colour comes with persistent
      pursuit of other adults. A carefully planned female-rich colony is more dependable than an unsexed group
      in a small aquarium. Haplochromis phytophagus is the accepted Catalog name; Xystichromis phytophagus
      remains common in the trade. Populations are recorded in satellite waters of the Lake Victoria basin and
      the connected Kyoga system. Traceable captive breeding helps preserve distinct stocks, while the present
      distribution and relative population sizes remain incompletely surveyed."
    sources:
      - *a1
      - *a28
      - *a3
      - *a4
      - *a5
  habitat:
    text: "The best recent species-specific sampling comes from Lake Kanyaboli in Kenya, where a year-long survey
      recorded the fish in both seasons. Uganda's biodiversity portal also lists it from Lake Kyoga and Lake
      Nawampasa. These records do not establish that Uganda holds most surviving fish. The historical type
      locality is Kisumu in Lake Victoria, from which older accounts report disappearance. Vegetated shallows
      with sand or soft sediment provide cover and feeding surfaces. Water differs among these lakes: the
      profile ranges summarize voted evidence and do not cover every recorded station, especially the 11 dKH
      Nawampasa reading."
    sources:
      - *a31
      - *a2
      - *a3
      - *a4
      - *a5
      - *a25
  sizeAndGrowth:
    text: "Allow for males around 11.5 cm total length and females around 9 cm. The female estimate has less
      independent numerical support. FishBase reports 8.6 cm standard length, which excludes the tail and
      cannot be treated as the same measurement. Males that look quiet as juveniles can change markedly once
      they mature and compete for space. Reassess the sex ratio as the group grows rather than judging adult
      compatibility from a peaceful juvenile group."
    sources:
      - *a31
      - *a28
      - *a18
  husbandry:
    text: >-
      The recommended adult unit is one male with six females in at least 300 litres and a floor
      about 110 by 42.5 cm. Arrange dense cover so a female can move completely out of the
      male's view, and secure heavy decorations before adding a diggable substrate. Routine
      maintenance around 24 to 28 C has better husbandry support than the hottest swamp reports.
      Acclimate gradually to stable replacement water and use filtration and regular partial
      changes to control waste. The wider tolerance bands include uncertain endpoints and should
      not be read as experimentally proven targets.
    sources:
      - *a15
      - *a28
      - *a8
  socialBehavior:
    text: "A male may pursue rivals and unreceptive or brooding females repeatedly. Several females distribute
      that attention but do not guarantee safety. Pit-centred defence is classified as a small territory, with
      continuing dominance treated cautiously as more than a brief spawning event. Keep a second male out of
      the minimum setup; larger multi-male arrangements need separated sight lines and more space. A fish that
      remains cornered, loses condition or cannot reach food needs a change in layout or stocking and, when
      necessary, separation."
    sources:
      - *a28
      - *a8
  diet:
    text: "Use a complete plant-rich flake or small pellet as the staple and offer modest invertebrate
      supplements. The Kanyaboli stomach study found substantial insects as well as plant remains and algae,
      supporting an omnivore classification under this rubric. Older grazing descriptions capture part of the
      diet. No specific protein-induced bloat predisposition was established, but that does not justify
      excessive animal food or portions. Distribute food so quieter females get access and remove avoidable
      leftovers."
    sources:
      - *a2
      - *a31
      - *a28
  breeding:
    text: "The male courts around a prepared substrate depression, and the female collects the eggs and incubates
      them in her mouth. Male care does not form a lasting pair or family; after spawning he seeks further
      mates. Brooding females need protected cover and monitoring because they can still be chased. Plan
      accommodation for young before breeding a colony. A separate nursery can improve survival, while
      transfers can stress a holding female. Released fry can take suitably small prepared food and newly
      hatched aquatic invertebrates."
    sources:
      - *a28
      - *a8
  sexing:
    text: "Displaying adult males show red and green areas with blue and dark markings. Females tend to stay
      subdued and are smaller. Subordinate males can suppress their display, so a plain juvenile or a dull
      fish in a shop is not a dependable female identification. Known sexes make the recommended group easier
      to establish. When starting with juveniles, arrange room or rehoming options for surplus males as their
      roles become clear."
    sources:
      - *a28
      - *a18
      - *a21
  compatibility:
    text: "This fish can share a suitably enlarged aquarium with selected unrelated companions. A species-specific
      care account reports Brycinus sadleri and Synodontis afrofischeri, although adult space, refuges and fry
      losses still require consideration. Persistent male aggression makes delicate fishes and forceful
      territorial cichlids poor choices. Keep breeding haplochromine stocks identifiable. A presumed pairwise
      caution with Haplochromis nubilus rests on very close genetic relationship; it is not a verified hybrid
      event and does not imply that every Victorian species crosses with every other."
    sources:
      - *a8
      - *a28
      - *a2
      - *a35
  problems:
    text: "Repeated pursuit can keep a female from feeding even when the tank contains plenty of food. Check
      access to shelter and feeding space before simply increasing portions. Digging can undermine unsecured
      rocks or plants, while leftover food increases the maintenance load. The voted natural KH band of 4 to 7
      and conservative tolerance of 2 to 7 dKH omit a published 11 dKH Nawampasa reading; this is an
      unresolved evidence difference rather than a claim that the wild fish could not live there. Protect
      stocking identity and monitor water quality and fish condition as well as numerical chemistry."
    sources:
      - *a28
      - *a8
      - *a25

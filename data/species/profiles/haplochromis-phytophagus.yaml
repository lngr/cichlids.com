    rationale: "The tally selects 25 to 30 C by qualified majority (4 of 6, low confidence), using its agreement
      threshold and rounded medians rather than the union of field extremes. The Kanyaboli seasonal means are
      27.9 +/- 1.4 and 28.2 +/- 0.7 C; their combined mean-plus/minus-SD envelope is 26.5 to 29.3 C, not
      observed annual extrema. Kyoga measurements in Ongom span 24.5 to 27 C and Obubu Table 8 spans 25.6 to
      30.4 C in 2020. Those wider regional endpoints, 24.5 to 30.4 C together, are excluded by the tally
      rounding and should not be mistaken for a complete species-specific collection envelope. The secondary
      Yala range of 25 to 33 C in Aquatic Community is wider again; its primary collecting record was not
      read. Nambi reports 25.9 to 29.4 C in its Results, with a different minimum in its table. Lake Victoria
      values are historical comparison only because the living refuge lakes are distinct. Proposals: generator
      {\"min\":26,\"max\":30}; checker-a {\"min\":22,\"max\":30}; checker-b {\"min\":25.8,\"max\":28.2};

    confidence: "medium"
    rationale: "The tally selects pH 6.9 to 8.4 by qualified majority (4 of 6, medium confidence). This is the
      rounded median of agreeing proposals, not the full measured span. Kanyaboli seasonal means near 7.1 to
      7.2 and Newman's Nawampasa kit range of about 7.0 to 7.5 provide locality context. Checker-c reports an
      Anyona Table 4 range of 6.7 to 8.5, wider than the decision; that thesis table could not be
      independently read here. Western Kyoga measurements in Ongom span 5.7 to 8.5, Obubu gives 6.5 to 8.5 in
      2010 and 6.9 to 9.9 in 2020, and Nambi reports 7.0 to 9.6. These wider basin ranges include sampling
      stations without simultaneous phytophagus identification and are not substituted for the voted
      representative range. Secondary Yala accounts give 7.5 to 8.2. The Lake Victoria comparator of 6.8 to
      9.4 does not establish satellite-lake chemistry. Proposals: generator {\"min\":7,\"max\":8.2}; checker-a
      {\"min\":6.8,\"max\":9.4}; checker-b {\"min\":7,\"max\":8.2}; checker-c {\"min\":6.7,\"max\":8.5};

            min: 10
            max: 24
        - by: "tiebreaker-2"
          value:
            min: 10
            max: 24
      decision:
        min: 10
        max: 25
      rationale: "Keep the qualified-majority tally decision of 10 to 25 dKH, with five agreeing votes out of six
        and low confidence. Generator proposed 15 to 25 dKH; checker-a, checker-b and checker-c proposed 10 to
        25; tiebreaker-1 and tiebreaker-2 proposed 10 to 24. The last five proposals agree within the
        two-degree threshold and their median upper bound is 25. Abysse recommends KH 10, Aquarium.org.il

  ph:
    value:
      min: 8.4
      max: 9.4
    confidence: "high"
    rationale: "The natural Lake Tanganyika range is 8.4 to 9.4. Plisnier and colleagues measured 8.47 to 9.40 at
      40 m in the northern station and describe surface changes with mixing and photosynthesis. The broader
      regional synthesis applies to this lake endemic. The old FAO source book lists 7.3 to 7.8, which
      conflicts with the later lake surveys and is retained as dissenting evidence rather than used for the
      decision. Cohen and colleagues remain cited from the inputs, but their full text was unavailable through
      the open-access tool during adjudication and supplies no newly verified claim here."

        African lake cichlids, and JBL 7 to 20 for Malawi and Tanganyika aquaria together. The last is a wider
        group recommendation extending below this decision. The 25 dKH upper bound is an inferred margin
        beyond the explicit species recommendation of 24, not a measured survival limit. Related pH and GH
        advice supplies context only and is not converted into KH. The natural 15 to 20 dKH is fully included.
        Both JBL product URLs returned notification text rather than usable product guidance; their archived
        references are retained with offline markers, and the readable manufacturer booklet supplies the
        numerical advice. Neither these sources nor the archive establishes multi-year endpoints."

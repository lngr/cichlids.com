profile:
  overview:
    text: "Callochromis macrops uses the sandy shallows of Lake Tanganyika to feed and breed. Its large eyes and
      the bright display colours of adult males make it distinctive, but its behaviour determines how it
      should be housed. Females and young fish are much less conspicuous. The usual aquarium unit is one male
      with at least three females, with enough open sand for foraging and enough separate refuges for females
      to escape pursuit. It feeds mainly on small bottom-dwelling invertebrates and is not classified as a
      fish predator. A carefully chosen Tanganyika community is possible, although competing sand dwellers and
      rival males can create serious pressure. Locality forms differ in appearance and can interbreed within
      the species."
    sources:
      - *a2
      - *a3
      - *a4
  habitat:
    text: "Records extend around much of Lake Tanganyika, with the far northern or northeastern shore outside the
      principal reported range. Sheltered sandy bays, river-mouth areas and shallow vegetated margins provide
      feeding habitat, commonly at about 1 to 6 m depth. Nearby rocks offer cover. Some occupied bays contain
      considerable suspended sediment, but this does not make dirty aquarium water desirable. The natural lake
      ranges used here are 23 to 29 C, pH 8.4 to 9.4, GH 10 to 13 dGH and KH 15 to 20 dKH. They summarize
      regional lake measurements rather than four experimentally established aquarium limits. A fine sand
      floor with open feeding space and refuges reproduces the useful physical features of this habitat."
    sources:
      - *a2
      - *a3
      - *a9
      - *a8
      - *a7
  sizeAndGrowth:
    text: "Allow for typical adult aquarium maxima of about 15 cm for males and 10 cm for females. Published
      figures differ: FishBase reports 13.5 cm total length without separating the sexes, Seriously Fish gives
      13.5 cm standard length, and specialist accounts describe males around 15 to 16 cm or larger. Standard
      length excludes the tail, so these numbers are not interchangeable. The sexes also differ in appearance.
      Mature males develop locality-dependent display colours, whereas females remain mainly silver or sandy
      grey. Juvenile groups may seem manageable before male courtship and territorial behaviour develop.
      Choose the aquarium and social group for adults rather than their purchase size."
    sources:
      - *a2
      - *a4
      - *a22
      - *a3
      - *a6
      - *a25
      - *a10
      - *a16
      - *a11
      - *a23
      - *a7
      - *a24
  husbandry:
    text: "The decided minimum is approximately 243 L with a 120 by 45 cm base for one male and at least three
      females. Published recommendations also extend to 300, 400 or 450 L; extra room becomes particularly
      useful when adding community fish. Keep much of the floor open and provide a sufficiently deep layer of
      fine sand for feeding and bower construction. Place stable rock refuges at the margins, with optional
      hardy plants as additional cover. Regular maintenance, effective filtration and good oxygen exchange
      matter more than reproducing natural turbidity. The tallied aquarium tolerances are 23 to 30 C, pH 7.7
      to 9.5, GH 10 to 30 dGH and KH 10 to 25 dKH. Their endpoints are not routine targets or proven
      physiological limits. Species accounts commonly recommend 23 or 24 to 27 C; the broader temperature
      interval includes seasonal lake conditions. KH is particularly uncertain and must be measured
      independently of GH."
    sources:
      - *a3
      - *a4
      - *a9
      - *a7
      - *a17
      - *a10
      - *a11
      - *a18
      - *a19
      - *a1
      - *a6
      - *a5
      - *a31
      - *a32
      - *a26
      - *a33
      - *a34
      - *a29
      - *a20
      - *a21
  socialBehavior:
    text: "A male can repeatedly chase rivals and potential mates. One male with several females spreads
      attention, but each female still needs a usable escape route and refuge. Avoid placing a second adult
      male in the minimum aquarium. Males defend more space than the visible sand mound: Staeck reports
      breeding territories of about 1 to 2 square metres in the lake. The territory is therefore classified as
      large and associated with breeding. A retained bower can support repeated spawning without proving that
      the male defends the same area throughout the year. Mixed-community reports range from mild disputes to
      serious breeding conflict, so monitor how individual fish use the floor and whether any female is
      excluded from food or shelter."
    sources:
      - *a2
      - *a3
      - *a4
      - *a26
      - *a34
      - *a7
      - *a27
  diet:
    text: "The diet is centred on small animal prey recovered from sand, including insect larvae, crustaceans and
      small molluscs. This supports the invertivore category. Supply suitably sized sinking foods, with varied
      small frozen or live foods and an appropriate prepared diet. Check that enough food reaches the
      substrate when upper-water fish feed first. Sand sifting does not itself prove slow feeding, and eager
      food acceptance does not prove that this fish monopolizes meals; feeding speed remains normal with low
      confidence. No reviewed source establishes a special high-protein bloat sensitivity. That does not
      remove the need for a varied diet, moderate portions and clean water."
    sources:
      - *a3
      - *a4
      - *a22
      - *a7
  breeding:
    text: "The female carries the brood in her mouth after spawning at a male's sand bower. Courtship involves
      male colour displays and an orange-red anal-fin marking. Hobby accounts commonly interpret that marking
      as inducing a female to take sperm directly into her mouth, but Morita and colleagues observed a
      different sequence in the lake: males deposited sperm in the bower before females laid eggs, and females
      collected the eggs promptly without the described anal-fin nuzzling. The direct field observations take
      priority for that detail. Maternal mouthbrooding itself is well supported across sources. Brooding lasts
      about three weeks in the aquarium accounts, with duration varying with conditions. Give brooding females
      access to quiet refuges and avoid unnecessary disturbance."
    sources:
      - *a2
      - *a3
      - *a4
      - *a7
      - *a27
  sexing:
    text: "Adult males are larger and generally more colourful, especially during courtship. Females retain mainly
      silver, grey or sandy tones. Male colour varies substantially by locality: some southern forms show
      strong red or orange, while other populations have more yellow, brown or grey. Blue fin edging is also
      reported. Mood and social status affect the display, so a subdued fish should not be sexed from colour
      alone. Compare several mature fish and use size, colour development and behaviour together. Young fish
      may not yet show reliable differences. The final group should contain only one mature male in a
      minimum-sized setup."
    sources:
      - *a3
      - *a4
      - *a22
      - *a7
  compatibility:
    text: "Suitable companions use space away from the open sand and can tolerate territorial chasing. Open-water
      Cyprichromis are a better starting point than additional bottom competitors. Robust rock-associated fish
      such as Altolamprologus may work in a larger aquarium with distinct refuges. Julidochromis are
      conditional candidates where rock territories remain separate from the feeding floor. Other sand
      sifters, including Xenotilapia ochrogenys and Enantiopus melanogenys, compete for the same resource and
      are poor choices in an ordinary setup. Small shell dwellers also face displacement and stress from
      overlapping floor territories. This caution follows space and aggression evidence rather than
      demonstrated fish predation. Geographic forms of C. macrops may interbreed, but no named interspecific
      hybrid group is established by the reviewed evidence."
    sources:
      - *a3
      - *a4
      - *a26
      - *a33
      - *a29
      - kind: "archive"
        title: "cichlids.com forum thread 18886"
        url: "https://www.cichlids.com/disc/read.php?2,18886"
        accessed: "2026-10-15"
  problems:
    text: "The main predictable problem is persistent social pressure. A male can injure rivals or exhaust females
      when the group, space or shelter arrangement is unsuitable. Watch for fish confined to a corner, missing
      meals or continually hiding. Another common failure is allocating the whole floor to rocks or other
      bottom fish, leaving too little sand for feeding and display. Coarse gravel prevents the normal sifting
      behaviour. Uneaten food and waste still require removal even though the fish moves the sand. The sources
      reviewed do not establish a distinctive disease syndrome for this species. Changes in appetite, body
      condition or breathing call for a check of water quality and social conditions. Lifespan is uncertain;
      the approximate 8 to 10 year expectation comes from low-trust hobby guidance, with a longer 15-year
      claim also retained in evidence."
    sources:
      - *a3
      - *a4
      - *a35
      - *a30
      - *a11
      - *a36
      - *a17

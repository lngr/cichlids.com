      min: 10
      max: 13
    confidence: "high"
    rationale: "The natural range is 10 to 13 dGH. The FAO lake surveys report calcium and magnesium
      concentrations and describe the analytical methods; hardness calculated from these ions is consistent
      with the older FAO compilation and the lake synthesis. This is general hardness, not carbonate hardness,
      and the wider aquarium recommendation does not replace it."

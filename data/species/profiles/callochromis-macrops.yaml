      decision:
        - "sand"
        - "rock"
        - "plants"
      rationale: "Generator, checker-b and checker-c include sand, rock and plants; checker-a includes sand and rock
        only because planting is optional in aquaria. Seriously Fish and Staeck document vegetated shallow
        habitats, and FishBase places feeding adults on sand near rocks. Plants are therefore a documented
        habitat zone even though dense planting is not a care requirement. Fine sand and open floor space
        remain essential, with rocks and optional plant cover providing refuges. Coburg's claim that plants
        are rare has less weight than the specialist habitat accounts."

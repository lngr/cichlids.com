  khDkh:
    value:
      min: 15
      max: 20
    confidence: "high"
    rationale: "The natural range is 15 to 20 dKH. The FAO lake surveys and the limnological synthesis report
      bicarbonate and carbonate alkalinity; conversion uses 2.8 dKH per meq/L. The older FAO compilation
      reports 6.71 meq/L, approximately 18.8 dKH. This describes lake buffering and carries no verification
      object. Aquarium KH is judged separately and cannot be calculated from GH."

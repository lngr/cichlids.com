    - field: "features.aggressionHeterospecific"
      proposals:
        - by: "generator"
          value: 2
        - by: "checker-a"
          value: 1
        - by: "checker-b"
          value: 2
        - by: "checker-c"
          value: 2
      decision: 2
      rationale: "Generator, checker-b and checker-c propose level 2; checker-a proposes level 1. Seriously Fish
        allows robust tankmates in other zones but discourages competing bottom fish, which supports
        territorial exclusion rather than displays alone. Staeck and Graffagnino report stronger conflict,
        especially under breeding or space pressure, while the forum account is milder. Level 2 describes a
        suitably housed harem; the evidence does not establish routine attacks throughout a properly sized
        community."
    - field: "features.territory"
      proposals:
        - by: "generator"
          value:
            size: "small"
            breedingOnly: true
        - by: "checker-a"
          value:
            size: "large"
            breedingOnly: false
        - by: "checker-b"
          value:
            size: "small"
            breedingOnly: true
        - by: "checker-c"
          value:
            size: "large"
            breedingOnly: true
      decision:
        size: "large"
        breedingOnly: true
      rationale: "Generator and checker-b proposed small breeding territories by treating the approximately 30 cm
        bower as the defended area. Checker-a proposed large with breedingOnly false because adult bowers can
        persist; checker-c proposed large with breedingOnly true. Staeck distinguishes the nest from its
        surrounding territory and reports about 1 to 2 square metres, with nearby nests 2 to 3 m apart. This
        direct spatial account outweighs an inference from nest diameter and meets the rubric for large.
        Morita and colleagues independently observed bower spawning but do not measure territory size. The
        documented territorial function is courtship and spawning; a persistent nest alone does not establish
        year-round defence, so breedingOnly remains true."

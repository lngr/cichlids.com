    - field: "features.ghDgh.tolerance"
      proposals:
        - by: "generator"
          value:
            min: 10
            max: 30
        - by: "checker-a"
          value:
            min: 10
            max: 30
        - by: "checker-b"
          value:
            min: 8
            max: 30
        - by: "checker-c"
          value:
            min: 10
            max: 30
      decision:
        min: 10
        max: 30
      rationale: "Keep the unanimous tally decision of 10 to 30 dGH with medium confidence. Generator, checker-a and
        checker-c proposed 10 to 30 dGH; checker-b proposed the wider 8 to 30 dGH, which agrees within the
        two-degree voting threshold. The median lower bound is therefore 10. Seriously Fish explicitly
        recommends 10 to 30 dGH, while Graffagnino gives 8 to 12 dGH and Coburg 150 to 300 ppm, approximately
        8.4 to 16.8 dGH. All proposals and the wider combined source interval of 8 to 30 dGH remain
        represented in evidence. The decided lower bound is the tallied recommendation, not proof of harm at 8
        or 9 dGH."

  ph:
    value: {min: 7.7, max: 8.6}
    confidence: high
    verification:
      method: waterbody
      waterbody: lake-malawi
    rationale: >-
      Lake Malawi endemic, so the natural range is the measured surface pH of the lake, 7.7 to 8.6
      after Jackson et al. (1963) as compiled by FAO. Branchu et al. (2010) give 7.5 to 8.5 for the
      whole water column, the low values coming from deep water that this rock-dwelling species
      does not use. All four votes copied this range.
    sources:
      - *fao
      - *branchu
      - *eccles
      - *vollmer2005
      - *vollmer1999
      - *ngochera
    evidence:
      - source: *fao
        value: {min: 7.7, max: 8.6}
        note: Lake surface water.
      - source: *branchu
        value: {min: 7.5, max: 8.5}
        note: Whole water column; the lower values belong to deep water.
    tolerance:
      value: {min: 7.5, max: 8.6}
      confidence: medium
      verification:
        method: unanimous
        votes: {agree: 4, total: 4}
      rationale: >-
        Three votes proposed 7.5 to 8.6 and checker-b proposed 7.5 to 8.8; the bounds agree within
        0.3, and the median of the upper bounds is 8.6. Care sheets give lower limits of 7.5 to 7.8
        and upper limits of 8.5 or 8.6. Tropical Freshwater Fish goes further, up to 8.8, which is
        wider than the decided range; FishBase (7.5 to 8.2) and Aqua-Fish (7.5 to 8.0) are
        narrower. The range covers the natural surface values and the agreement of most sources.
        A falling pH from poor buffering is the usual failure in mbuna tanks.
      sources:
        - *fishkeeper
        - *aquainfo
        - *ciklider
        - *drta

  aggressionConspecific:
    value: 4
    confidence: medium
    rationale: >-
      The generator, checker-a and checker-b proposed level 3, checker-c level 4. The GCCA breeding
      report states from first-hand experience that dominant males kill subordinate males and can
      harass females to death, and that the keeper had to build a large rock pile that blocked the
      male's view before the females could brood in a 100-gallon tank. Aqua-Fish independently
      reports lethal attacks on males and on females and advises removing surplus males;
      Fishkeeper warns that a single female with a male may die, and Guidarium calls dominant
      males extremely aggressive. Both GCCA and Aqua-Fish advise against the species for
      beginners. This matches level 4 (kills rivals or partners unless given space, cover or
      separation; needs experience) better than level 3, which the majority based on the absence
      of reported deaths. AquaInfo calls the species calm and barely territorial, which no other
      source supports.

  ghDgh:
    value: {min: 3, max: 5}
    confidence: high
    verification:
      method: waterbody
      waterbody: lake-malawi
    rationale: >-
      Lake Malawi endemic, so the natural range is the total hardness of the lake, 3 to 5 dGH,
      computed from the calcium and magnesium measured by Branchu et al. (2010) in the upper 50 m
      and by the 1960s titrations compiled by FAO. Lake Malawi is soft water; the hard water that
      many care sheets describe mixes up hardness and alkalinity. All four votes copied this range.
    sources:
      - *branchu
      - *fao
      - *eccles
      - *vollmer2005
      - *vollmer1999
      - *ngochera
    evidence:
      - source: *branchu
        value: {min: 4.2, max: 4.6}
        note: Upper 50 m of the north basin, computed from calcium and magnesium.
      - source: *fao
        value: {min: 3.2, max: 4.9}
        note: 1960s calcium and magnesium titrations.
    tolerance:
      value: {min: 3, max: 25}
      confidence: medium
      verification:
        method: qualified-majority
        votes: {agree: 4, total: 5}
      rationale: >-
        The generator, checker-a, checker-b and tiebreaker-1 proposed 3 to 25 dGH; checker-c
        proposed 3 to 20 dGH because it judged the 25 dGH end too weakly supported. Four species
        care sheets name 25 dGH as the upper limit (Fishkeeper, Guidarium, Tropical Freshwater
        Fish and Aqua-Fish), while DRTA (5 to 15), AquaInfo (12 to 16) and two retailer
        sheets (up to 20) stay lower. The care sheets set their lower limits of 5 to 12 dGH far
        above the lake because they confuse hardness with alkalinity; wild fish live at 3 to 5 dGH
        and a keeper in the archive held the species at 5 dGH, so the lower bound follows the lake.
        All upper-limit sources are hobby care sheets, and stable carbonate buffering matters more
        for this species than total hardness.
      sources:
        - *fishkeeper
        - *guidarium
        - *tff
        - *aquafish
        - *tropicaltank
        - *aquainfo
        - *drta
        - *sims
        - *animallux
        - *branchu
        - *fao
        - &thread13949
          kind: archive
          title: cichlids.com forum thread 13949
          url: https://www.cichlids.com/disc/read.php?2,13949
          accessed: 2026-10-13
      evidence:
        - source: *fishkeeper
          value: {max: 25}
          note: Upper limit only.
        - source: *guidarium
          value: {min: 10, max: 25}
        - source: *tff
          value: {min: 12, max: 25}
        - source: *aquafish
          value: {min: 12, max: 25}
        - source: *tropicaltank
          value: {min: 7}
          note: Lower limit only.
        - source: *aquainfo
          value: {min: 12, max: 16}
        - source: *drta
          value: {min: 5, max: 15}
        - source: *sims
          value: {min: 10, max: 20}
        - source: *animallux
          value: {min: 8, max: 20}
        - source: *branchu
          value: {min: 4.2, max: 4.6}
          note: Natural lake water; sets the lower bound.
        - source: *fao
          value: {min: 3.2, max: 4.9}
          note: Natural lake water.
        - source: *thread13949

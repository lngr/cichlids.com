  temperatureC:
    value: {min: 21, max: 29}
    confidence: high
    verification:
      method: waterbody
      waterbody: lake-malawi
    rationale: >-
      The species lives only in Lake Malawi, so the natural range is the measured temperature of
      the lake. Eccles (1974) reports 21 C inshore in the south-east arm in the cool, windy season
      and 27 C in the upper 60 m by May; Vollmer et al. (2005) give about 23.5 to 24 C for the
      winter epilimnion and about 28 C for summer surface water, and a later campaign found up to
      29 C. All four votes copied this range.
    sources:
      - &eccles
        kind: literature
        title: "Eccles, D. H. (1974). An outline of the physical limnology of Lake Malawi (Lake Nyasa). Limnology and Oceanography 19(5), 730-742 (abstract)."

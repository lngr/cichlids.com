    rationale: >-
      All four votes agree that no curated group concerns the species. No source read reports a
      cross of P. crabro with another species, in the wild or in the tank. The Catalog of Fishes
      and the Melanochromis revision of Konings and Stauffer (2012) keep it in Pseudotropheus, so

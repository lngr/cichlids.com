  khDkh:
    value: {min: 5, max: 8}
    confidence: high
    verification:
      method: waterbody
      waterbody: lake-malawi
    rationale: >-
      Lake Malawi endemic, so the natural range is the carbonate hardness of the lake, 5 to 8 dKH,
      converted from the alkalinity of 2.0 to 2.6 meq/L measured by Jackson et al. (1963, after
      FAO) and Branchu et al. (2010). Carbonate hardness exceeds total hardness there because sodium
      balances part of the bicarbonate. All four votes copied this range.
    sources:
      - *branchu
      - *fao
      - *eccles
      - *vollmer2005
      - *vollmer1999
      - *ngochera
    evidence:
      - source: *branchu
        value: {min: 6.5, max: 6.9}
        note: Alkalinity 2.33 to 2.46 meq/L.
      - source: *fao
        value: {min: 5.6, max: 7.3}
        note: Alkalinity 2.00 to 2.59 meq/L.
    tolerance:
      value: {min: 5, max: 15}
      confidence: medium
      verification:
        method: qualified-majority
        votes: {agree: 4, total: 5}
      rationale: >-
        The generator, checker-a, checker-c and tiebreaker-1 proposed 5 to 15 dKH; checker-b
        proposed 5 to 12 dKH as an estimate because it found no species figure. Two species care
        sheets give carbonate hardness: AquariumDomain names 10 to 15 dKH and The Tropical Tank
        prefers 10 to 12 with 6 as the minimum; two retailer sheets agree (LiveAquaria 10 to 15,
        Animallux 6 to 12). The value 12 is a preferred range rather than a limit, so 15 is the only
        stated upper limit. The lower bound follows the lake, where the species lives at 5 to 8 dKH,
        and a keeper in the archive held it at 8 dKH. The evidence is thin and rests on hobby care
        sheets.

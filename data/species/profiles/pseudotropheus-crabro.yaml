schemaVersion: 1
id: pseudotropheus-crabro
legacyIds: [466, 383]
status: described

taxonomy:
  validName: Pseudotropheus crabro
  genus: Pseudotropheus
  species: crabro
  author: (Ribbink & Lewis, 1982)
  source: &cof
    kind: catalog-of-fishes
    title: "Eschmeyer's Catalog of Fishes, species of the genus Pseudotropheus"
    url: https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Pseudotropheus
    archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-54fb6171/2026-10-14T101559Z
    accessed: 2026-10-13
  synonyms:
    - name: Melanochromis crabro
      note: Original combination of Ribbink and Lewis (1982); type locality Maleri Island at 15 to 18 m depth.
    - name: Pseudotropheus chamaeleo
      note: Nomen nudum of Staeck (1977) from Likoma Island, placed by the Catalog of Fishes in the synonymy of P. crabro; the trade also spells it chameleo.
    - name: Maylandia crabro
      note: Combination used by some hobby and specialist sources; the Catalog of Fishes does not record it.
    - name: Metriaclima crabro
      note: Combination used in the hobby and in the legacy catalog; the Catalog of Fishes does not record it.
  legacyNames:
    - Pseudotropheus crabro
    - Metriaclima crabro
  note: >-
    The Catalog of Fishes lists Melanochromis crabro Ribbink & Lewis 1982 with the current status
    "Valid as Pseudotropheus crabro", after Marechal (1991), Konings-Dudin et al. (2009), Konings
    and Stauffer (2012), Konings (2016) and Stauffer et al. (2016). The legacy catalog held the
    species twice, as entry 466 (Pseudotropheus crabro) and as entry 383 (Metriaclima crabro);
    both map to this profile. The Cichlid Room Companion files a blue form, P. sp. 'crabro blue',
    as a separate undescribed taxon that this profile does not cover.

names:

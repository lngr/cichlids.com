      284 L, DRTA 400 L and 130 cm, AquaInfo 150 cm; the GCCA keeper bred the species only after
      adding extensive rockwork to a 379 L tank. Given the lethal male aggression, the decision
      takes the middle of these figures with the longer length: 300 L, 150 cm long and 50 cm
      front to back, which leaves room for several rock piles that break the male's line of sight.
      Tropical Freshwater Fish (114 L, 81 cm) is too small for adult males.
    sources:
      - *fishkeeper
      - *guidarium
      - *ciklider
      - *aquafish
      - *drta
      - *aquainfo
      - *gcca
      - *liveaquaria
      - *tff
    evidence:
      - source: *fishkeeper
        value: {lengthCm: 120}
      - source: *guidarium
        value: {volumeL: 200, lengthCm: 120}
      - source: *ciklider
        value: {volumeL: 250}
        note: For one male with females.
      - source: *aquafish
        value: {volumeL: 284}
        note: Given as 75 US gallons for a harem.
      - source: *drta
        value: {volumeL: 400, lengthCm: 130}
      - source: *aquainfo
        value: {lengthCm: 150}
      - source: *gcca
        value: {volumeL: 379}
        note: Tank of the successful breeding report (100 US gallons).
      - source: *liveaquaria
        value: {volumeL: 265}
        note: Given as 70 US gallons.
      - source: *tff
        value: {volumeL: 114, lengthCm: 81}
        note: Too small; outlier.

  lifespanYears:
    value: {min: 5, max: 10}
    confidence: low
    rationale: >-
      The proposals were 6 to 10 years (generator, checker-a, both from general mbuna knowledge)
      and 5 to 10 years (checker-b, checker-c, from care sheets). Aqua-Fish gives about 10 years,
      Riverpark 5 to 8 years and Aquariadise more than 10; DRTA claims 10 to 20 years without
      support. The decision follows the stated figures, 5 to 10 years; the sources are few and
      mostly retailers, so the confidence is low.
    sources:
      - *aquafish
      - *riverpark
      - &aquariadise
        kind: website
        title: "Aquariadise: Bumblebee Cichlid"
        url: https://www.aquariadise.com/bumblebee-cichlid/
        archived: aquariadise.com/bumblebee-cichlid/2026-10-14T102609Z
        accessed: 2026-10-13
      - *drta
    evidence:
      - source: *aquafish
        value: {min: 10, max: 10}
        note: About ten years.
      - source: *riverpark
        value: {min: 5, max: 8}
      - source: *drta
        value: {min: 10, max: 20}
        note: Unsupported high figure.

  breeding:
    value: maternal-mouthbrooder
    confidence: high
    rationale: >-
      All four proposals agree. All mbuna are maternal mouthbrooders (Genner and Turner). The GCCA
      report, Fishkeeper, Aqua-Fish, Ciklider.se and AquaInfo describe the female taking the eggs
      into her mouth and carrying them for about 18 to 25 days; the Cichlid Room Companion confirms
      the breeding mode.
    sources:
      - *genner
      - *gcca
      - *fishkeeper
      - *aquafish
      - *ciklider
      - *aquainfo
      - *crc
    evidence:
      - source: *genner
        value: maternal-mouthbrooder
      - source: *gcca
        value: maternal-mouthbrooder
        note: Females hold 18 to 21 days; about 16 young from a stripped female.
      - source: *fishkeeper
        value: maternal-mouthbrooder
        note: Brooding up to about 25 days.
      - source: *aquafish
        value: maternal-mouthbrooder
        note: About 18 to 21 days; 25 to 30 young per spawn.
      - source: *ciklider
        value: maternal-mouthbrooder
        note: 10 to 30 young after about three weeks.
      - source: *crc
        value: maternal-mouthbrooder
        note: Verification only.

  beginnerSuitability:
    value: moderate
    confidence: medium
    rationale: >-
      The generator, checker-a and checker-b proposed moderate, checker-c demanding. The fish is
      hardy, eats everything and breeds readily, which is why LiveAquaria, AquariumDomain and the
      Cichlid Room Companion rate it easy. Its aggression rules out a beginner's community tank:
      GCCA, Aqua-Fish and Oliver advise against it for novices, and Sims rates it for intermediate
      keepers. The difficulty lies in stocking and tank layout, not in feeding, water or health,
      so moderate (some experience with mbuna needed) fits better than demanding; the aggression
      level of 4 carries the warning about male rivalry.
    sources:
      - *gcca
      - *aquafish

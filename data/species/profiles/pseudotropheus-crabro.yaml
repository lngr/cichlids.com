          kind: website
          title: "Animallux (retailer): Pseudotropheus crabro"
          url: https://animallux.pt/loja/10487-pseudotropheus-crabro.html
          archived: animallux.pt/loja/10487-pseudotropheus-crabro.html/2026-10-14T102600Z

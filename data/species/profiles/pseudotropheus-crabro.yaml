partners:
  suitable:
    - species: Labeotropheus fuelleborni
      reason: A robust mbuna of similar size whose shape and colour differ clearly, so it is not taken for a rival.
      condition: Tank of at least 150 cm with several separate rock piles.
    - species: Maylandia callainos
      reason: A sturdy, plain blue mbuna without bars that holds its own against an aggressive tankmate.
      condition: Tank of at least 150 cm with several separate rock piles.
    - species: Maylandia greshakei
      reason: A robust mbuna of similar temperament with an unbarred blue and orange colour.
      condition: Tank of at least 150 cm with several separate rock piles.
    - species: Synodontis multipunctatus
      reason: Care sheets suggest it as a fast, armoured bottom dweller for mbuna tanks.
      condition: The crabro cleans catfish in the lake and may pester them in the tank as well; watch the catfish for damaged skin or fins.
  unsuitable:
    - species: Maylandia lombardoi
      reason: Barred blue females and yellow males resemble the crabro, and the species is just as aggressive; look-alikes are treated as rivals.
    - species: Melanochromis auratus
      reason: Yellow and black and highly aggressive; the similar colours provoke constant fights.
    - species: Aulonocara
      reason: Peaceful peacocks are bullied and cannot compete at feeding times.
    - species: Tropheus moorii
      reason: A Lake Tanganyika aufwuchs grazer best kept with its own species; it does not belong in a tank with aggressive mbuna.
    - species: Poecilia reticulata
      reason: Small, peaceful community fish are harassed and their young are eaten.

profile:
  overview:
    text: >-
      The bumblebee or hornet cichlid is a mbuna from the rocky shores of Lake Malawi. Its common
      names refer to the dark brown bars on a golden yellow body that juveniles, females and
      subordinate males wear. Dominant males can turn almost black within moments, which earned
      the species the trade name chamaeleo. In the lake it lives an unusual life: it picks
      parasites from the skin of the large kampango catfish and, when the catfish breed, darkens
      and slips into their nests to eat the eggs. In the aquarium it is hardy, eats any food and
      breeds readily, but its males are among the most combative mbuna and can kill rivals and
      females. It suits a large rock aquarium with other robust mbuna, kept as one male with
      several females. Described in 1982 as Melanochromis crabro, it is placed in Pseudotropheus
      and is sometimes sold as Metriaclima or Maylandia crabro.
    sources:
      - *cof
      - *oliver
      - *aqualog
      - *konings
      - *gcca
      - *fishkeeper
  habitat:
    text: >-
      Pseudotropheus crabro lives only in Lake Malawi. It is known from many islands and reefs of
      the southern and central lake, among them Maleri, Mbenji, Chinyankwazi, Likoma and
      Chizumulu, from Nkhata Bay and from the Mozambican shore; the far north of the lake has no
      populations. It is found mostly in large caves and beside big boulders, where the kampango
      catfish rests by day, and it visits the catfish nests at the edge of rock and sand. The type
      specimens came from 15 to 18 m depth. Lake Malawi water is soft but alkaline: about 21 to 29
      C over the year, pH 7.7 to 8.6, total hardness 3 to 5 dGH and carbonate hardness 5 to 8 dKH.
      Carbonate hardness exceeds total hardness there, so the lake is not hard water, as it is
      often described.
    sources:
      - *cof
      - *fishbase
      - *oliver
      - *ciklider
      - *konings
      - *branchu
      - *fao
      - *eccles
  sizeAndGrowth:
    text: >-
      In the lake this mbuna stays fairly small, usually about 9 to 12 cm. Aquarium fish grow
      larger on rich food: males typically reach about 15 cm in total length and females about
      12 cm. The young grow fast and already show the barred pattern. With age, dominant males
      spend more and more time in the dark dress. Figures of 20 cm on some care sheets go beyond
      what most keepers see, and figures of 10 cm underestimate grown males.
    sources:
      - *fishbase
      - *aqualog
      - *guidarium
      - *drta
      - *gcca
  husbandry:
    text: >-
      One male with three or more females needs a tank of at least 150 cm length and about 300
      litres. Build several stable rock piles from the floor nearly up to the surface, with many
      caves and crevices, so that each fish can get out of the male's sight; set the rocks on the
      glass before adding the sand, because mbuna dig. Mbuna tanks are usually stocked densely to
      spread aggression, which creates a heavy waste load, so strong filtration and large weekly
      water changes are essential. The species copes with a wide range of water: about 24 to 27 C
      is a good permanent setting, pH 7.5 to 8.6, total hardness from soft up to about 25 dGH and
      carbonate hardness from 5 up to about 15 dKH. Stable alkaline buffering matters more than
      the exact hardness.
    sources:
      - *fishkeeper
      - *guidarium
      - *aquainfo
      - *drta
      - *gcca
      - *tropicaltank
  socialBehavior:
    text: >-
      Each adult male claims a cave and its surroundings and defends it all year. A dominant male
      turns dark and drives off rivals and females that are not ready to spawn, often with long
      chases. Several keepers report that dominant males kill subordinate males and can harass
      females to death, so keep a single male with at least three females and remove surplus
      males from a group of young fish as they colour up. Rock piles that block the male's view
      help a lot: a male that cannot see the females from his cave leaves them alone more often.
      Towards other species the crabro is quarrelsome as well; it dominates calmer tankmates and
      attacks fish with a similar barred pattern and newcomers to the tank.
    sources:
      - *gcca
      - *aquafish
      - *fishkeeper
      - *guidarium
      - *aquariumdomain
  diet:
    text: >-
      In the wild the bumblebee cichlid eats whatever it finds. It removes fish lice from the
      kampango catfish, steals the catfish's eggs and also feeds on zooplankton, algae from the
      rocks and insect larvae. In the aquarium it accepts all common foods. A good base is a
      quality cichlid pellet or flake with a plant share such as spirulina, together with frozen
      foods like mysis, daphnia or brine shrimp; it tolerates more animal food than the
      algae-grazing mbuna. Feed small portions once or twice a day rather than one large meal. The
      species eats fast and greedily, so slower tankmates may go short.
    sources:
      - *genner
      - *oliver
      - *fishkeeper
      - *aquainfo
      - *aquariumdomain
  breeding:
    text: >-
      The crabro is a maternal mouthbrooder and breeds readily in a harem tank. The darkened male
      courts ripe females with shaking and circling displays and leads them to a flat stone in or
      near his cave. The pair circles, the female lays a few eggs at a time and takes them into her
      mouth, where they are fertilised as she nips at the egg spots on the male's anal fin. She
      carries the brood for about 18 to 21 days, up to 25, eats little in that time and then
      releases about 15 to 30 young that take crushed flake and newly hatched brine shrimp. Females
      do not guard the free young. Harassment by the male can make females spit or swallow the
      eggs, so many keepers move a holding female to a separate tank.
    sources:
      - *gcca
      - *aquafish
      - *fishkeeper
      - *ciklider
      - *genner
  sexing:
    text: >-
      Adult males are larger than females and usually darker. A dominant male spends much of the
      day in a dark brown to black dress, while females and subordinate males keep the yellow body
      with brown bars. The colour alone is not reliable, because subordinate males can stay barred
      and female-like for a long time and females can turn dark briefly. Males often have clearer
      egg spots on the anal fin, but some females show them too. The safest way to a harem is to
      raise six or more young fish together and remove surplus males as they colour up.
    sources:
      - *gcca
      - *fishkeeper
      - *aquafish
      - *aqualog
  compatibility:
    text: >-
      Keep this species only with other robust mbuna of similar size whose colours and shapes
      differ clearly, for example Labeotropheus or plain blue Maylandia species. Avoid barred mbuna
      such as Maylandia lombardoi and yellow and black Melanochromis, because look-alikes are
      treated as rivals. Peaceful Malawi haplochromines such as peacocks are bullied, fish from Lake
      Tanganyika such as Tropheus do not belong with it, and small community fish are harassed and
      their young eaten. Fast, armoured catfish such as Synodontis multipunctatus are often
      suggested, but the crabro cleans catfish in the wild and may pester them in the tank too.
      Its own fry survive reliably only in a separate tank.
    sources:
      - *fishkeeper
      - *ciklider
      - *guidarium
      - *gcca
      - *tff
      - &thread13905
        kind: archive
        title: cichlids.com forum thread 13905
        url: https://www.cichlids.com/disc/read.php?2,13905
        accessed: 2026-10-13
  problems:
    text: >-
      Most problems come from aggression. Too few females, a second male, too small a tank or too
      little rock lead to torn fins, injured or dead females and fish hiding in corners; watch the
      group daily and remove a fish that is chased persistently. Brooding females under constant
      pressure often lose their clutch. Dense stocking quickly raises nitrate, so large regular
      water changes matter, and a drop in pH from poor buffering stresses the fish. No source
      reports bloat as a particular weakness of this species, but overfeeding and poor water raise
      the risk in any mbuna tank. Catfish in the tank may be pestered by its cleaning habit.
    sources:
      - *gcca
      - *fishkeeper
      - *aquafish
      - *tropicaltank
      - *thread13905


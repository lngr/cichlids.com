  disagreements:
    - field: taxonomy.synonyms
      proposals:
        - {by: generator, value: Pseudotropheus chamaeleo}
        - {by: checker-a, value: Pseudotropheus chamaeleo}
        - {by: checker-b, value: Pseudotropheus chamaeleo}
        - {by: checker-c, value: Pseudotropheus chameleo}
      decision: Pseudotropheus chamaeleo
      rationale: The Catalog of Fishes spells the nomen nudum of Staeck (1977) chamaeleo; chameleo is a trade spelling, noted in the synonym note. Metriaclima crabro is added as a hobby combination because legacy entry 383 used it.
    - field: features.origin.value.localities
      proposals:
        - {by: generator, value: [Maleri Island, Mbenji Islands, Chinyankwazi Island, Chiyamwezi Island, Likoma Island, Chisumulu Island, Eccles Reef, West Reef, Nkhata Bay, Cobue (Mozambique)]}
        - {by: checker-a, value: [Maleri Island, Eccles Reef, West Reef, Chinyankwazi Island, Chinyamwezi Island, Mbenji Island, Likoma Island, Chizumulu Island, Nkhata Bay, Nametumbwe]}
        - {by: checker-b, value: [Eccles Reef, West Reef, Chinyankwazi Island, Chiyamwezi Island, Maleri Island, Mbenji Island, Likoma Island, Chisumulu Island, Nkata Bay]}
        - {by: checker-c, value: [Maleri Island, Mbenji Island, Likoma Island, Chizumulu Island, Nkhata Bay]}
      decision: [Maleri Island, Mbenji Islands, Chinyankwazi Island, Chinyamwezi Island, Likoma Island, Chizumulu Island, Eccles Reef, West Reef, Nkhata Bay, Cobue (Mozambique), Nametumbwe (Mozambique)]
      rationale: The lists complement each other; the decision merges them in current spelling. The waterbody is given as the table id lake-malawi.
    - field: features.ph.tolerance
      proposals:
        - {by: generator, value: {min: 7.5, max: 8.6}}
        - {by: checker-a, value: {min: 7.5, max: 8.6}}
        - {by: checker-b, value: {min: 7.5, max: 8.8}}
        - {by: checker-c, value: {min: 7.5, max: 8.6}}
      decision: {min: 7.5, max: 8.6}
      rationale: Decided by tally.yaml, method unanimous (4 of 4, bounds within 0.3); the median of the upper bounds is 8.6. The 8.8 of checker-b follows a single care sheet.
    - field: features.ghDgh.tolerance
      proposals:
        - {by: generator, value: {min: 3, max: 25}}
        - {by: checker-a, value: {min: 3, max: 25}}
        - {by: checker-b, value: {min: 3, max: 25}}
        - {by: checker-c, value: {min: 3, max: 20}}
        - {by: tiebreaker-1, value: {min: 3, max: 25}}
      decision: {min: 3, max: 25}
      rationale: Decided by tally.yaml, method qualified-majority (4 of 5). Four care sheets name 25 dGH as the upper limit; checker-c judged that end too weakly supported.
    - field: features.khDkh.tolerance
      proposals:
        - {by: generator, value: {min: 5, max: 15}}
        - {by: checker-a, value: {min: 5, max: 15}}
        - {by: checker-b, value: {min: 5, max: 12}}
        - {by: checker-c, value: {min: 5, max: 15}}
        - {by: tiebreaker-1, value: {min: 5, max: 15}}
      decision: {min: 5, max: 15}
      rationale: Decided by tally.yaml, method qualified-majority (4 of 5). Two species care sheets give 10 to 15 dKH and 6 to 12 dKH, where 12 is a preferred value rather than a limit; checker-b estimated 12 without a species figure.
    - field: features.maxSizeCm
      proposals:
        - {by: generator, value: {male: 14, female: 11}}
        - {by: checker-a, value: {male: 15, female: 12}}
        - {by: checker-b, value: {male: 12, female: 10}}
        - {by: checker-c, value: {male: 15, female: 13}}
      decision: {male: 15, female: 12}
      rationale: Most aquarium sources give about 15 cm for males; female figures range from 11 to 14 cm, with 12 cm in the middle. Checker-b based its value on the wild standard length, which understates well-kept aquarium fish.
    - field: features.predation
      proposals:
        - {by: generator, value: 1}
        - {by: checker-a, value: 1}
        - {by: checker-b, value: 1}
        - {by: checker-c, value: 0}
        - {by: tiebreaker-1, value: 1}
      decision: 1
      rationale: Decided by tally.yaml, method qualified-majority (4 of 5). Several sources report egg and fry eating; checker-c relied on a field observation of egg eating only.
    - field: features.diet
      proposals:
        - {by: generator, value: {type: omnivore, bloatSensitive: true}}
        - {by: checker-a, value: {type: omnivore, bloatSensitive: false}}
        - {by: checker-b, value: {type: omnivore, bloatSensitive: false}}
        - {by: checker-c, value: {type: omnivore, bloatSensitive: false}}
        - {by: tiebreaker-1, value: {type: omnivore, bloatSensitive: false}}
      decision: {type: omnivore, bloatSensitive: false}
      rationale: Decided by tally.yaml, method qualified-majority (4 of 5). The generator set the bloat flag as a general mbuna precaution; no source reports bloat for this species, whose wild diet has a large animal share. The food lists differed and the tally took that of checker-a.
    - field: features.aggressionConspecific
      proposals:
        - {by: generator, value: 3}
        - {by: checker-a, value: 3}
        - {by: checker-b, value: 3}
        - {by: checker-c, value: 4}
      decision: 4
      rationale: The GCCA breeding report and Aqua-Fish independently report dominant males killing subordinate males and females and advise against the species for beginners, which matches level 4; the majority based level 3 on the absence of such reports, which these sources contradict.
    - field: features.aggressionHeterospecific
      proposals:
        - {by: generator, value: 3}
        - {by: checker-a, value: 3}
        - {by: checker-b, value: 2}
        - {by: checker-c, value: 3}
      decision: 3
      rationale: GCCA and AquariumDomain report that calmer tankmates are dominated or killed and advise robust tankmates, which is level 3.
    - field: features.territory
      proposals:
        - {by: generator, value: {size: small, breedingOnly: false}}
        - {by: checker-a, value: {size: small, breedingOnly: false}}
        - {by: checker-b, value: {size: small, breedingOnly: false}}
        - {by: checker-c, value: {size: large, breedingOnly: false}}
      decision: {size: small, breedingOnly: false}
      rationale: Sources describe a territory around a cave; the harassment of fish within the male's sight that checker-c read as a large territory is covered by the aggression level.
    - field: features.habitatZones
      proposals:
        - {by: generator, value: [rock]}
        - {by: checker-a, value: [rock]}
        - {by: checker-b, value: [rock]}
        - {by: checker-c, value: [rock, sand]}
      decision: [rock]
      rationale: The species lives in caves and among boulders; it visits the rock-sand edge at catfish nests to feed but does not depend on open sand.
    - field: features.minTank
      proposals:
        - {by: generator, value: {volumeL: 250, lengthCm: 120, depthCm: 45}}
        - {by: checker-a, value: {volumeL: 300, lengthCm: 150, depthCm: 50}}
        - {by: checker-b, value: {volumeL: 200, lengthCm: 120, depthCm: 40}}
        - {by: checker-c, value: {volumeL: 400, lengthCm: 150, depthCm: 50}}
      decision: {volumeL: 300, lengthCm: 150, depthCm: 50}
      rationale: Sources range from 200 to 400 L and 120 to 150 cm; the decision takes the middle volume with the longer length because of the lethal male aggression.
    - field: features.lifespanYears
      proposals:
        - {by: generator, value: {min: 6, max: 10}}
        - {by: checker-a, value: {min: 6, max: 10}}
        - {by: checker-b, value: {min: 5, max: 10}}
        - {by: checker-c, value: {min: 5, max: 10}}
      decision: {min: 5, max: 10}
      rationale: The care sheets that state a lifespan give 5 to 8 and about 10 years; the 6-year minimum of the generator and checker-a came from general mbuna knowledge only.
    - field: features.beginnerSuitability
      proposals:
        - {by: generator, value: moderate}
        - {by: checker-a, value: moderate}
        - {by: checker-b, value: moderate}
        - {by: checker-c, value: demanding}
      decision: moderate
      rationale: Care, feeding and breeding are easy; the difficulty lies in stocking and tank layout, which moderate covers together with aggression level 4. Sources range from easy to not for beginners.

profile:
  overview:
    text: "A shoal of Cyprichromis microlepidotus brings activity above the rockwork of a Tanganyika aquarium.
      Males vary greatly in color, while females usually remain subdued. Its main needs are company,
      uninterrupted swimming space and food small enough to swallow. Peaceful behavior toward other species
      can coexist with vigorous competition between displaying males. The planning minimum is ten fish; larger
      schools require proportionately more space."
    sources:
      - *a12
      - *a2
      - *a26
      - *a17
  habitat:
    text: "This Lake Tanganyika endemic occurs chiefly along the northern shores, with records extending down the
      eastern side. Ubwari is the type locality. Fish school in the water column beside rocky slopes and over
      patches of sand. Locality accounts span roughly 5 to 40 m depth, with broader reports reaching 45 m. The
      natural water figures summarize lake monitoring rather than measurements from every population. Adequate
      open water above low rockwork matters more than substrate choice."
    sources:
      - *a1
      - *a2
      - *a26
      - *a7
      - *a10
      - *a6
      - *a9
      - *a27
  sizeAndGrowth:
    text: "Allow for males around 11 cm and females around 10 cm as typical adult planning sizes. The female
      figure is approximate. Published sizes use different length measures and range higher in some locality
      accounts, including 12 to 15 cm in the NVC description. These reports remain relevant when buying
      unusually large stock. The reviewed evidence does not establish a reliable aquarium growth curve or a
      fixed age at maturity."
    sources:
      - *a2
      - *a26
      - *a17
  husbandry:
    text: "For ten adults, the published starting minimum is 243 L with a 120 by 45 cm footprint and about 45 cm
      height. Extra swimming room becomes valuable as males establish display areas or other fish are added.
      Keep the upper water column open and use a secure cover. Strong filtration, oxygenation and consistent
      water conditions suit the species. The listed tolerance endpoints are planning estimates and
      recommendations, not experimentally proven boundaries; the KH interval is particularly uncertain."
    sources:
      - *a12
      - *a26
      - *a13
      - *a9
      - *a21
      - *a20
  socialBehavior:
    text: "Males compete for temporary spawning spaces suspended above the bottom. A sufficiently large school
      distributes attention and lets subordinate fish retreat, but crowding can turn displays into stronger
      attacks. Begin with at least ten and favor several females per male. Association accounts often
      recommend twelve or more in larger tanks. Other suitable species usually pass through these spaces
      without challenge. Fish from different geographic populations can interbreed, so locality identity
      matters when producing young."
    sources:
      - *a12
      - *a2
      - *a26
      - *a17
      - *a9
  diet:
    text: "Recorded wild prey includes copepods and other drifting invertebrates. Feed small suspended foods that
      every fish can actually swallow, using appropriately sized crustaceans and fine prepared food. Several
      modest feedings suit the species. Check the smaller or subordinate fish individually for food intake.
      Routine fish hunting is not supported by the stronger evidence, although accidental fry loss remains
      possible. The absence of a specific bloat flag does not remove the need for balanced feeding and clean
      water."
    sources:
      - *a2
      - *a12
  breeding:
    text: "Females collect and incubate eggs after spawning in the water column within a male display area. The
      field study reports about nine eggs; other accounts range from five to ten to roughly 25, so brood size
      is variable. Incubation commonly lasts about three to four weeks. Disturbance can cause premature
      release or brood loss. Released young often coexist with adults of their own species, but feeding access
      and the other tank inhabitants affect survival."
    sources:
      - *a2
      - *a12
      - *a35
      - *a34
      - *a17
  sexing:
    text: "Adult males generally show stronger color and attain greater size than females. The latter are commonly
      beige, brown or silvery. Male blue, yellow, black or reddish tones vary with locality and display state,
      and individuals within one population can differ. Juveniles or subdued males can be difficult to assess
      from a single photograph. Compare several adults and their behavior; a visible brood confirms a
      mouthbrooding female."
    sources:
      - *a12
      - *a26
      - *a17
  compatibility:
    text: "Quiet Tanganyika bottom dwellers can complement the school because they occupy different spaces. Milder
      Julidochromis, Altolamprologus and shell dwellers are options when their own territories fit the
      aquarium. Large predators threaten smaller fish, and boisterous mbuna can disrupt feeding and social
      behavior. Other open-water shoalers compete for the same swimming volume and need a larger setup. No
      interspecific hybrid group is established here; that is a limit of the evidence, not proof that crossing
      cannot occur."
    sources:
      - *a12
      - *a2
      - *a26
      - *a8
  problems:
    text: "Watch for fish hiding away from the school, losing condition or being repeatedly driven from display
      areas. Check food size and access as well as water quality and social pressure. Jumping makes an
      unsecured aquarium risky. Rapid chemistry changes can add stress, while mouthbrooding females may lose a
      brood after disturbance. The reviewed sources do not identify a distinctive disease syndrome or justify
      a specific treatment. The KH median has little direct support at its upper endpoint and should not be
      read as a target."
    sources:
      - *a12
      - *a2
      - *a17
      - *a20
      - *a21
partners:
  suitable:
    - species: "Julidochromis transcriptus"
      reason: "A relatively small rock dweller can use the lower aquarium while the school swims above it."
      condition: "Provide separate rock cover and enough additional space for the pair's own territory."
    - species: "Altolamprologus calvus"
      reason: "An adult rock-oriented fish can occupy a different part of a quiet Tanganyika setup."
      condition: "Use appropriately sized Cyprichromis and shelter for small fish; mouthbrooder fry may be eaten."
    - species: "Neolamprologus multifasciatus"
      reason: "A shell-bed colony uses the bottom while the school occupies open water."
      condition: "Retain an unobstructed swimming column and allow space for the colony's own territory."
    - species: "Cyprichromis leptosoma"
      reason: "Locality accounts report mixed wild schools with this similarly pelagic species."
      condition: "Use a larger aquarium for both adult schools; wild association alone does not demonstrate
        long-term aquarium compatibility or absence of crossing."
  unsuitable:
    - species: "Cyphotilapia frontosa"
      reason: "A large predator presents a risk to smaller Cyprichromis, especially juveniles."
    - species: "Tropheus moorii"
      reason: "A vigorous grazing community can create feeding and social conditions poorly suited to a quiet
        plankton feeder."
    - species: "Maylandia zebra"
      reason: "Boisterous mbuna can harass the school and dominate access to food."
    - species: "Neolamprologus brichardi"
      reason: "An expanding breeding colony can claim space needed by the school in a minimum-sized aquarium."

      probably represent one collecting event. The independently checked Sandkam dataset gives 7.84 to 8.08 in
      lower Aripo AHP rows; association with pulcher is inferred from the Lower Aripo occurrence study rather
      than a fish inventory at each chemistry reading. The final interval is narrower than checker-b's
      regional 6.8 to 8.5 proposal and checker-a's 6.5 to 8.2 proposal; those combine drainage proxies or
      aquarium data with taxonomically uncertain Colombian records. The Grant report was not retrieved through
      the permitted full-text route in adjudication, and the accessible Banerjee text lacks readable numeric
      station endpoints, so neither supplies new quantitative evidence here. A regional exposure envelope is
      not a species-wide physiological limit."

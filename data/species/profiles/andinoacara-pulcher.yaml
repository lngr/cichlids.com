    rationale: "The tally uses median, with low confidence and 3 of 6 votes in its leading agreement cluster.
      generator proposed {\"min\":23.97,\"max\":29.58}; checker-a proposed {\"min\":24,\"max\":28}; checker-b
      proposed {\"min\":25,\"max\":30}; checker-c proposed {\"min\":24.9,\"max\":25.7}; tiebreaker-1 proposed
      {\"min\":23.97,\"max\":29.58}; tiebreaker-2 proposed {\"min\":23.97,\"max\":29.58}. The median endpoints
      are 23.985 and 29.58 C before integer rounding to 24 and 30 C. The directly checked Zanghi data contain
      134 species-positive events spanning 23.97 to 29.58 C, including both extremes in the Arima River. The
      final lower bound is therefore 0.03 C narrower than that measured range and the upper bound is rounded
      upward, not a new observation. Sandkam gives 24.9 to 25.7 C for three lower Aripo samples; Stalsberg and
      the Nordic collecting record give 25 C and likely describe one event. These limited seasonal
      observations have more relevance than air temperatures, laboratory settings for Saxatilia or uncertain
      Orinoco identifications in the other proposals. The median is binding despite the stronger
      locality-linked support for the wider Zanghi envelope; it is not a complete annual or geographical
      limit."

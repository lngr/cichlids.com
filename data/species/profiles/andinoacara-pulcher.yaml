profile:
  overview:
    text: "Blue acaras form breeding pairs and show blue-green markings against a subdued body. The accepted name
      is Andinoacara pulcher, with Aequidens pulcher retained as the legacy name. The current Catalog anchors
      its range to Trinidad and Tobago and adjacent Venezuela. Andinoacara latifrons is a separate Colombian
      species, and mainland fish sold as blue acaras may include other unresolved lineages. A known locality
      helps interpret the identity of breeding stock. This profile describes ordinary pulcher; electric-blue
      fish are a captive colour form with strain-dependent and incompletely documented ancestry."
    sources:
      - kind: catalog-of-fishes
        title: "Eschmeyer's Catalog of Fishes: Andinoacara species list, updated 21 September 2026"
        url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=An\
          dinoacara"
        archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-edb10200/2026-10-14T094407Z
        accessed: 2026-10-13
      - kind: literature
        title: "Musilova, Schindler and Staeck (2009). Description of Andinoacara stalsbergi and annotations on the
          phylogeny of the genus"
        url: "https://doi.org/10.3897/vz.59.e30965"
        archived: doi.org/10.3897_vz.59.e30965/2026-10-12T202649Z
        accessed: 2026-10-13
      - kind: literature
        title: "De la Ossa-Guerra, Santos and Artoni (2020). Genetic Diversity of the Cichlid Andinoacara latifrons as
          a Conservation Strategy in Different Colombian Basins"
        url: "https://doi.org/10.3389/fgene.2020.00815"
        archived: doi.org/10.3389_fgene.2020.00815/2026-10-13T195208Z
        accessed: 2026-10-13
      - kind: database
        title: "Seriously Fish: Andinoacara pulcher"
        url: "https://www.seriouslyfish.com/species/andinoacara-pulcher/"
        archived: seriouslyfish.com/species/andinoacara-pulcher/2026-10-14T094410Z
        accessed: 2026-10-13
      - kind: website
        title: "Maidenhead Aquatics Fishkeeper: Blue Acara"
        url: "https://www.fishkeeper.co.uk/fish/freshwater/cichlids/blue-acara"
        archived: fishkeeper.co.uk/fish/freshwater/cichlids/blue-acara/2026-10-14T094416Z
        accessed: 2026-10-13
  habitat:
    text: "The species uses flowing streams and quieter waters, searching near the bottom and using cover.
      Trinidad field observations provide the strongest locality-linked environmental evidence. The profile
      stores 24 to 30 C and pH 7.5 to 8.1 as low-confidence median decisions across conflicting proposals, not
      the exact endpoints of one survey. The directly checked 2022 data span 23.97 to 29.58 C at 134
      observations with the species present. The natural hardness envelopes are GH 4 to 6 dGH and KH 6 to 7 dKH, combining a
      species-linked collection with regional Tumpuna River chemistry in the Caroni drainage. The Tumpuna
      station has no accompanying fish inventory. Conflicting collection metadata and sparse seasonal
      coverage limit how well these envelopes represent every native population."
    sources:
      - kind: literature
        title: "Grant (1968). Report on a paper industry for Trinidad and Tobago, Table 21"
        url: "https://downloads.unido.org/ot/46/83/4683494/00001-10000_00707.pdf"
        archived: downloads.unido.org/ot/46/83/4683494/00001-10000_00707.pdf/2026-10-14T230356Z
        accessed: 2026-10-15
      - kind: literature
        title: Zanghi et al. (2024). Multiple environmental stressors affect predation pressure in a tropical
          freshwater system
        url: "https://doi.org/10.1038/s42003-024-06364-6"
        archived: doi.org/10.1038_s42003-024-06364-6/2026-10-13T195712Z

  socialBehavior:
    text: "One established adult pair is the recommended social unit. Young fish can grow together until partners
      form, but surplus adults need separate accommodation once the pair excludes them. Buying one male and
      one female does not ensure compatibility. During spawning, parents defend a sizeable area and can
      displace bottom fish repeatedly. Observe whether both partners can rest and eat, and whether companions
      can remain outside the brood territory. Persistent pursuit, injury or a fish trapped in hiding calls for
      separation. The level 2 aggression grades assume adequate space and a compatible pair; individual fish
      or unsuitable setups can be more troublesome."

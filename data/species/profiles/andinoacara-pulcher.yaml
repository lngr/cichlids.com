  breeding:
    text: "Pairs deposit eggs on an exposed prepared surface and share care of the brood. Several stable flat
      surfaces give them options without forcing one nesting site. Slightly soft, mildly acidic water and
      temperatures near 25 to 28 C are common breeding recommendations, rather than evidence for the limits of
      long-term tolerance. Both parents guard the developing eggs and mobile young, with roles that can vary
      between pairs. Prepare suitably small first foods and protect filter intakes before the young swim
      freely. Brood defence can disrupt an otherwise workable community, so spare housing remains useful.
      Picking up a stray young fish is parental transport, not a mouthbrooding reproductive strategy."

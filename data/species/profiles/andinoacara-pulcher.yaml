  compatibility:
    text: "Mixed housing is possible with robust companions that are too large to swallow and have room to avoid
      the brood. Full-sized red-eye tetras, Congo tetras and bristlenose catfish are conditional examples
      inferred from the larger-characin and loricariid recommendations; their juveniles can remain vulnerable.
      Tiny tetras and dwarf bottom fish face predation or repeated displacement. Green terrors add a size and
      aggression mismatch, as well as a presumed crossing concern. The two pairwise hybrid groups concern
      pulcher with latifrons and pulcher with rivulatus, both with weak evidence and neither with verified
      free partner choice. They do not establish that every Andinoacara species crosses with every other one.
      Similar water tolerances alone cannot ensure a safe community."

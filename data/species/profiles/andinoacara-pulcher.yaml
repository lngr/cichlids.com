  predation:
    value: 2
    confidence: medium
    rationale: "Qualified-majority selects level 2, with 5 of 6 votes and medium confidence. Generator, checker-b,
      checker-c and both tiebreakers proposed 2; checker-a proposed 1. Seriously Fish, Fishkeeping,
      FishProfiles and the genus specialist warn about fish that can be swallowed, so a fry-only 2 cm planning
      ceiling is insufficient for adults. The Trinidad field study records attacks on guppies averaging 2.45
      cm through a protective cylinder; it does not demonstrate ingestion or quantify routine fish
      consumption. The Lower Aripo account describes opportunistic piscivory within predominantly benthic
      feeding. Level 2 is therefore the decided gape-based aquarium warning, not evidence that fish dominate
      the diet."

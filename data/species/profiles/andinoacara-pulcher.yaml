  diet:
    value:
      type: invertivore
      bloatSensitive: false
    confidence: low
    rationale: "Conservative is the binding method at low confidence, with 3 of 6 votes for invertivore. Generator
      and checker-b proposed invertivore with animal-food lists, and tiebreaker-2 proposed invertivore;
      checker-a and checker-c proposed omnivore with mixed-food lists, and tiebreaker-1 proposed omnivore.
      Every proposal set bloatSensitive to false. The full food-list proposals are preserved in provenance. No
      class reaches four votes, so the tally chooses invertivore as the stricter of the proposed feeding
      types. Lower Aripo literature emphasizes benthic invertebrates and the Nordic register identifies insect
      larvae as the main natural food. Conversely, the 2024 paper classifies pulcher as omnivorous and care
      accounts support plant-containing foods. The Lorica stomach-content study used Sinu fish of uncertain
      pulcher versus latifrons identity and is not decisive for Trinidad pulcher. Invertivore is a cautious
      animal-dominated planning category, not proof that plant or detrital food is absent. False
      bloatSensitive reflects the lack of an established specialist protein-related restriction, not immunity
      to digestive disease."

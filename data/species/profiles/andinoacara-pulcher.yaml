  diet:
    text: "The tally conservatively classifies pulcher as an invertivore, with low confidence, because votes split
      evenly between that category and omnivore. Field accounts emphasize bottom-associated invertebrates and
      the Nordic register identifies insect larvae as principal food, while other literature and care records
      describe mixed feeding. Use a complete cichlid food and vary it with appropriate aquatic invertebrate
      foods such as insect larvae, Artemia or small crustaceans. Plant-containing prepared foods remain
      compatible with this animal-biased classification. Adult fish can eat small tankmates that fit their
      mouths, so routine feeding does not remove the predation risk. No established specialist high-protein
      bloat restriction was found, but overfeeding and poor water quality can still harm health."

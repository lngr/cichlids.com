  sizeAndGrowth:
    text: "Allow for a broad-bodied adult rather than the small fish sold in shops. The planning maxima are 16 cm
      for males and 15 cm for females, both with low confidence because sex-specific measured aquarium maxima
      are scarce. Some accounts estimate smaller females, but an explicit 15 cm female entry is preferable to
      assuming they always stop at 12 or 13 cm. Most routine aquarium expectations are near 13 to 16 cm;
      larger reported sizes are not the typical planning target. Standard length excludes the tail and must
      not be compared directly with total length. A growing pair needs clear escape routes and feeding access
      as well as swimming space."

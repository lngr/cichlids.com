variants:
  - name: Trinidad
    kind: locality
    note: Type-region stock is the best geographic anchor for the described species. Keep traceable locality lines
      separate from unidentified mainland blue acaras.
  - name: Electric blue
    kind: color-morph
    note: A widely traded captive colour form associated with pulcher. Pedigrees and claims of hybrid ancestry are
      not independently established for every strain; this profile does not assert a confirmed cross with a
      ram cichlid.

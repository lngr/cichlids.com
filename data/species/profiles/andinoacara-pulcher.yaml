  note: "The current Catalog accepts Andinoacara pulcher (Gill, 1858) and Andinoacara latifrons (Steindachner,
    1878) as separate species. Both Andinoacara and the legacy Aequidens genus lists were read on 2026-10-13;
    the legacy query is
    https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Aequ\
    idens. The Catalog places pulcher in Trinidad and Tobago and adjacent Venezuela, and latifrons in
    Colombian Magdalena, Atrato, Sinu and San Juan basins. Colombian blue-acara records need specimen-level
    reassessment rather than automatic synonymy or reassignment. The 2009 phylogeny also identifies unresolved
    mainland blue-acara lineages. CRC independently confirms the combination and original description; its
    public page provides no usable diet, breeding or habitat details. FishBase .se timed out during
    adjudication and the .us and .org mirrors returned bot checks, so no inaccessible FishBase text was used
    as fresh evidence."

    confidence: high
    rationale: "All roles anchor the species to Trinidad and adjacent Venezuela, but differ in the localities and
      regional wording. The current Catalog determines the accepted distribution, while Trinidad field
      observations support the listed river localities. Apure and Colombian records are not adopted without
      reliable identification because the 2009 revision finds multiple mainland lineages and the 2020 study
      identifies Colombian latifrons populations. The regional statement does not assert that every historical
      Colombian pulcher record is latifrons."

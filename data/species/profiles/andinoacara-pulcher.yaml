  sexing:
    text: "Males often develop longer or more pointed dorsal and anal fin tips, and females may have a rounder
      outline. Males also tend to become larger, but these are variable tendencies rather than reliable tests
      for every fish. Juveniles and selected colour strains are especially difficult to identify by
      appearance. The profile's cautious 15 cm female planning maximum does not imply that every female
      reaches that length or that both sexes grow identically. Partner formation and reproductive behaviour
      add information, but a display or a defended patch alone does not prove sex. Arrange separate
      accommodation for surplus adults before encouraging a juvenile group to form pairs."

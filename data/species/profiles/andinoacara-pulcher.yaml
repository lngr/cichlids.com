      [\"andinoacara-latifrons-pulcher\",\"andinoacara-pulcher-rivulatus\"]. Both new groups have basis
      presumed. For pulcher-latifrons, the 2009 phylogeny and 2020 genetic discussion support close
      relationship, and AquaInfo raises possible natural crossing without documented hybrid offspring. For
      pulcher-rivulatus, the specialist record attributes apparently fertile aquarium hybrids to rivulatus and
      pulcher or cf. pulcher, leaving blue-parent identification and access to same-species mates unverified.
      Seriously Fish warns about mixed ancestry in trade stock without naming parents. The selected pairwise
      groups do not establish a genus-wide all-pairs group or a latifrons-rivulatus cross. Captive
      electric-blue origin claims do not justify a ram-cichlid group."

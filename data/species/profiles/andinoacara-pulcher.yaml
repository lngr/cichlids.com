  husbandry:
    text: "Provide one compatible adult pair with at least 200 L and a base about 120 by 40 cm. Place shelter so
      either fish can withdraw from view without entering a dead end. Sand allows digging, and wood with
      securely attached plants supplies cover; flat stones offer spawning surfaces. Use a mature biological
      filter and regular partial water changes. The decided aquarium tolerances are 22 to 30 C, pH 6.5 to 8.1,
      GH 4 to 25 dGH and KH 3 to 8 dKH. These broad care envelopes have uneven endpoint evidence, especially
      for constant high temperature, harder water and KH. An overlapping central temperature around 24 to 27 C
      is a practical starting point. Avoid abrupt chemical changes and allow extra floor space for a
      community."

    confidence: low
    rationale: "Qualified-majority selects two pairwise groups, with 4 of 6 votes and low confidence. generator
      proposed [\"andinoacara-latifrons-pulcher\",\"andinoacara-pulcher-rivulatus\"]; checker-a proposed
      [\"andinoacara\"]; checker-b proposed
      [\"andinoacara-latifrons-pulcher\",\"andinoacara-pulcher-rivulatus\"]; checker-c proposed
      [\"andinoacara-pulcher-rivulatus\"]; tiebreaker-1 proposed

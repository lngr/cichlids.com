  ghDgh:
    value:
      min: 4
      max: 6
    confidence: low
    rationale: "The qualified-majority 4 to 4 dGH point decision, with 5 of 6 votes, represents one
      collecting event reported by Stalsberg and the Nordic register, rather than a natural range. The
      adjudicated 4 to 6 dGH range combines that reading with regional Tumpuna River chemistry in Grant's
      UNIDO report, Table 21: total hardness 104 mg/L as CaCO3 equals 5.83 dGH,
      using 17.848 mg/L per degree. The regional endpoint rounds outward to a whole degree. Tumpuna supplies
      a comparable freshwater river measurement in the native Trinidad Caroni drainage, without confirmation
      of the species at the sampling station. The report treats its chemistry as comparable to the neighbouring
      Guanapo. Sparse site and seasonal coverage and conflicting collecting metadata limit confidence. The
      4 to 25 dGH aquarium tolerance contains this regional range."

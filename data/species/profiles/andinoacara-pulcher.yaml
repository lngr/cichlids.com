  problems:
    text: "Crowding, incompatible partners, tiny companions and accumulated waste are common practical failures.
      Digging may uproot plants or move loose decor, so use stable structures with usable retreat paths. Check
      water quality and social pressure when a fish hides persistently, stops eating, breathes rapidly or
      develops damaged fins. Quarantine new stock and seek qualified help for unresolved illness rather than
      assigning a diagnosis from one sign. Trade identification is another concern: similar blue acaras, young
      green terrors and fish with mixed ancestry may have different adult needs. Broad tolerance values should
      not encourage repeated adjustments or permanent use of poorly supported endpoints."

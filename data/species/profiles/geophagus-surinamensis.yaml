profile:
  overview:
    text: 'This profile applies to true Geophagus surinamensis from the Guianas. The shop name is also used for
      other eartheaters, including altifrons, proximus, sveni and neambi, so locality and adult identification matter.
      These are separate species rather than forms of surinamensis. A 2021 sequence study interpreted five records
      bearing its name as misidentified altifrons; this small sample does not identify every fish in the trade.
      Expect a large sand-sifting fish whose social group needs substantial floor space and regular care.'
    sources:
      - *id001
      - *id002
      - *id003
      - *id024
      - *id007
  habitat:
    text: 'The restricted native range includes the Saramacca, Suriname and Marowijne systems. Fine sandy margins
      provide feeding ground, with branches and other cover nearby. One identified collection site measured 30 C,
      pH 5.5, reported GH 0 and KH 0.5. Historical pre-dam catchment measurements cover 24.4 to 33.4 C and pH 5.1
      to 6.9. The stored temperature of 24 to 32 C is a rounded vote synthesis within that wider context. Natural
      GH 0 to 1 and KH 0 to 1 are provisional representations with little direct measurement; zero does not mean
      chemically empty water.'
    sources:
      - *id002
      - *id003
      - *id004
      - *id005
      - *id019
  sizeAndGrowth:
    text: 'Use 25 cm for males and 20 cm for females as provisional adult aquarium planning sizes. The species-focused
      register gives around 20 cm overall, while other care sources give larger fish and do not always distinguish
      the true species. Scientific standard length excludes the tail, and cannot be substituted directly for total
      length. Juveniles gain adult coloration as they mature. The approximate lifespan entry of eight to ten years
      is poorly documented and is not an upper biological limit.'
    sources:
      - *id003
      - *id009
      - *id008
      - *id002
      - *id010
  husbandry:
    text: 'A group of six adults is planned for at least 600 litres and a floor of 180 by 60 cm. Leave
      broad areas of smooth fine sand exposed, with secure woody shelter around the edges.
      Established biological filtration, accessible mechanical filtration and regular water
      replacement help handle suspended particles and waste. Match replacement water carefully and
      keep it well oxygenated. Routine maintenance around 26 to 29 C has better support than
      constant heat near the stored 32 C ceiling. Decided tolerances are 22 to 32 C, pH 5.1 to 7, GH
      0 to 11 and KH 0 to 5, with especially weak evidence for temperature and hardness endpoints.'
    sources:
      - *id003
      - *id008
      - *id009
      - *id010
      - *id007
      - *id020
  socialBehavior:
    text: 'Keep a conspecific group and allow pairs to emerge. Six adults is the chosen planning unit; recommendations
      elsewhere range from five to seven or more. A hierarchy can produce repeated chasing, and a breeding pair
      can expel neighbors from its immediate brood area. Neither normal group behavior nor brood defense is expected
      to cause regular injuries in adequate space. Check whether every subordinate eats and can rest under cover.
      Sustained exclusion or fin damage calls for a review of space and social arrangements.'
    sources:
      - *id003
      - *id008
      - *id009
      - *id012
      - *id011
      - *id014
  diet:
    text: 'Provide fine complete sinking food with animal and vegetable ingredients, supplemented with suitably
      small invertebrate foods. Spread modest portions across feeding areas so subordinates can eat. Sand processing
      supplies natural browsing opportunities but does not replace a balanced ration. The decided omnivore classification
      includes occasional consumption of fry or fish around the rubric tiny-prey category. No specialized high-protein
      bloat tendency is established for this species, although unsuitable portions, overfeeding and poor water quality
      can still cause problems.'
    sources:
      - *id002
      - *id003
      - *id009
      - *id010
  breeding:
    text: 'True surinamensis is treated as a biparental mouthbrooder with delayed larval uptake. Eggs initially
      develop on a prepared surface; after hatching the parents provide oral protection. Both adults can guard the
      brood, with stronger local territorial behavior during care. Immediate egg uptake reported in some broad trade-name
      accounts is less reliable for the identified species. Released young are vulnerable to other fishes. Preserve
      adult identification and locality records when maintaining a breeding line.'
    sources:
      - *id003
      - *id009
      - *id002
      - *id010
  sexing:
    text: 'Adult females may be smaller and have shorter fin extensions than males, but these tendencies overlap.
      Juveniles and stressed fish cannot be reliably sexed from coloration or a single fin detail. Letting partners
      emerge from a group avoids relying on uncertain juvenile sex assignments. Observed spawning and parental behavior
      provide stronger evidence than appearance alone, and species identification still requires more than a shop
      label.'
    sources:
      - *id003
      - *id009
      - *id008
  compatibility:
    text: 'A calm community is possible alongside the conspecific group. Larger peaceful tetras and compatible catfish
      are conditional choices when adult size, water conditions, space and feeding access fit. Fry and fishes under
      about 2 cm face opportunistic predation, and forceful territorial cichlids can interfere with feeding and
      rest. No hybrid group is assigned because no supported named true G. surinamensis cross was established; this
      does not prove reproductive isolation. Lookalike Geophagus still require secure identification and parentage
      records for breeding.'
    sources:
      - *id003
      - *id008
      - *id012
      - *id011
      - *id024
  problems:
    text: 'Insufficient floor space, rough substrate, an immature filter or accumulated waste can undermine keeping
      success. Sifting suspends particles, so inspect mechanical filtration and secure decorations against digging.
      Repeated hiding, missed meals, damaged fins or abnormal breathing merit a review of water quality and social
      pressure. These signs alone do not diagnose a disease. Stock obtained under the broad surinamensis trade name
      may also differ from the fish described here, changing adult size and breeding expectations.'
    sources:
      - *id003
      - *id010
      - *id014
      - *id007

  note: 'Legacy entry 734 denotes the valid Guianan species Geophagus surinamensis (Bloch, 1791). Geophagus altifrons,
    G. proximus, G. sveni and G. neambi are separate valid species, not current synonyms or variants. Unverified
    aquarium stock and legacy photographs cannot be assigned from the trade label alone. The Catalog distribution
    is broader than the restricted range in FishBase and the Nordic specialist register; it does not justify combining
    Amazonian husbandry or ecology with native Guianan data. Ximenes and colleagues found five database sequences
    labelled surinamensis that they interpreted as misidentified altifrons, without establishing the identity of
    all traded fish. The public Cichlid Room Companion page confirms the accepted name and original combination
    but exposes no feeding, breeding or habitat summary. The Maroni ion studies were unavailable to the input researchers
    through fetch-oa, so their unseen tables do not support hardness endpoints.'

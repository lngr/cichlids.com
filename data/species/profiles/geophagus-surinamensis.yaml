          analysis or fish-matched stations.'
      - source: *id006
        value: null
        note: No KH measurement; conductivity and pH do not yield the 0 to 2 dKH proposed by checker-a.
      - source: *id020
        value:
          min: 2
          max: 3
        note: Aquarium advice for Tapajos redhead; excluded as natural surinamensis KH.
    tolerance:
      value:
        min: 0
        max: 5
      confidence: low
      rationale: 'The proposals in vote order are 0.5 to 3, 0 to 8, 0 to 6, 0.1 to 6, 0.5 to 3, 0 to 3 (dKH).
        Without a qualified majority, the medians of all proposed minima and maxima are 0.05 and
        4.5, rounded to 0 to 5 dKH. The median 0 to 5 dKH contains the natural 0 to 1 range without
        widening. Aqua-Pedia gives 1 to 6 dKH and discloses generated data and Monitarium gives 3 to
        8 dKH and contains identification and breeding errors. Monks gives 2 to 3 dKH for the
        Tapajos redhead, providing congener analogy only. Stalsberg and Landburg describe native or
        regional water rather than chronic captive limits. No two reliable numerical
        species-specific husbandry sources establish these endpoints; the broader published KH
        ranges remain weak evidence. GH and conductivity are not converted to KH. The 0 to 5 dKH
        envelope is plausible for adaptable soft-water eartheaters, with buffering and gradual
        acclimation more useful than an unverified numerical ceiling. A rounded zero includes dilute
        natural water and does not prescribe mineral-free water. Confidence is low because endpoint
        support is incomplete.'
      sources:
        - *id020
        - *id018
        - *id004
        - *id002
        - *id013
        - *id009

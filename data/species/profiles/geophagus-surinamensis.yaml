  ghDgh:
    value:
      min: 0
      max: 1
    confidence: low
    rationale: 'The tally classifies agreement as unanimous under its 2 dGH matching threshold and retains 0 to
      1 dGH with low confidence. Generator proposed 0 to 0, checker-a 0 to 3, and checker-b and checker-c 0 to 1;
      the median upper bound is 1. Stalsberg reports dH 0 at an occupied site, with unspecified test resolution.
      The chosen upper bound is inferred rather than a measured basin maximum. FishBase gives the wider 5 to 19
      dH range without field-station attribution, which is rejected as native evidence. Mol et al. and the Lely
      and Nassau survey corroborate low mineralization but supply no GH measurements. Checker-a inferred 0 to 3
      from conductivity; that conversion is not accepted. A second independent numerical field GH source is absent,
      so voting agreement cannot remove the evidence gap.'

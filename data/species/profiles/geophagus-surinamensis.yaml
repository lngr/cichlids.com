        and 32.7, rounded to 22 to 33 C. The median 22 to 33 C contains the natural 24 to 32 range
        without widening. The adjudicated 22 to 32 C range replaces the median 22 to 33 C decision
        because its upper endpoint derives from hot habitat observations and recommendations for
        different species, without species-specific evidence for healthy long-term aquarium keeping
        at that temperature. NCS recommends 22 to 30 C; FishFish gives 24 to 29, Zoopet 24 to 27 and
        Aqua-Fish 22 to 27. Seriously Fish allows altifrons 26 to 32 and brokopondo 25 to 33, but
        these are different species. Mol et al. report the wider habitat envelope of 24.4 to 33.4 C,
        which is not a chronic aquarium trial. Long-term health at constant 32 C lacks verification;
        ordinary maintenance around 26 to 29 C has better husbandry support. Confidence is low

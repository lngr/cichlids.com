  khDkh:
    value:
      min: 0
      max: 1
    confidence: low
    rationale: 'Retain the tally natural value of 0 to 1 dKH and low confidence, without a verification object.
      Generator proposed 0.5 to 0.5, checker-a 0 to 2, and checker-b and checker-c 0.1 to 0.5. Tally range matching
      accepts these proposals and rounds median bounds of 0.1 and 0.5 to integers 0 and 1. Stalsberg measured 0.5
      dKH with the species present. Landburg measured alkalinity 1.9 to 6.65 mg/L as CaCO3, equivalent to approximately
      0.106 to 0.373 dKH, in the Palumeu watershed. Those stations are regional context without verified surinamensis
      captures, and organic alkalinity may contribute. Zero and one are rounded synthesis bounds rather than observed
      species endpoints. Checker-a inferred KH from conductivity and pH; that inference is rejected. WetWebMedia
      2 to 3 dKH describes congener aquarium advice and is excluded from the natural value.'
    sources:
      - *id004
      - &id020
        kind: website
        title: 'WetWebMedia: Geophagus correspondence, including Neale Monks on Tapajos redhead water chemistry,
          9 August 2017'
        url: 'http://www.wetwebmedia.com/FWSubWebIndex/eartheatfaqs.htm'
        archived: wetwebmedia.com/fwsubwebindex/eartheatfaqs.htm/2026-10-14T095938Z
        accessed: '2026-10-13'

  temperatureC:
    value:
      min: 24
      max: 32
    confidence: low
    rationale: 'The binding tally uses median verification with 3 of 6 votes supporting its leading range, because
      no qualified majority emerged. Generator proposed 30 to 30 C, checker-a 22 to 25 C, checker-b 27 to 31 C,
      and checker-c, tiebreaker-1 and tiebreaker-2 each 24.4 to 33.4 C. Median minima and maxima are 24.4 and 32.2
      C, rounded to 24 and 32. Mol et al. actually report a wider regional envelope of 24.4 to 33.4 C, including
      main-river observations of 25 to 33.4 C; the decided upper bound is a voting synthesis, not the measured maximum.
      Stalsberg recorded 30 C beside collected fish. The Lely and Nassau survey concerns other stream fish communities,
      and FishBase 22 to 25 C cites an aquarium atlas; neither establishes occupied lowland endpoints for this species.
      This low-confidence interval is incomplete habitat context rather than a physiological limit.'

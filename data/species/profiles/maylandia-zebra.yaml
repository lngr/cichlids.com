  predation:
    value: 1
    confidence: low
    rationale: "Decided by the vote count (conservative, 3 of 5) with low confidence. Three votes
      (checker-b and both tie-breakers) chose level 0: every field record of the diet lacks fish.
      The FishBase stomach data after Ribbink et al. (1983) and Reinthal (1990) show 60 to 81
      percent plant material and in one sample invertebrates, with a trophic level of 2.3; FishBase,
      Oliver after Fryer and Iles (1972) and the abstract of Streelman et al. (2007) describe
      combing of loose aufwuchs from rock and plankton feeding; Seriously Fish recommends a
      plant-based diet; the Cichlid Room Companion classes it as an algae comber. Two votes
      (generator and checker-a) chose level 1 because fry are eaten in tanks: Seriously Fish expects
      lower fry survival when the species spawns in a community tank, archive keepers report that
      released fry survive only where the adults cannot reach them, and a young zebra ate the small
      shrimp in its tank. No proposal reached the qualified majority of 4 of 5 votes, so the higher
      level applies, and the compatibility check treats fry and fish below about 2 cm as prey. No
      source reports hunting of larger fish, so levels 2 and 3 are excluded."
    sources:

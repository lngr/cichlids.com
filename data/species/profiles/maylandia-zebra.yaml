    confidence: high
    rationale: The Catalog of Fishes and FishBase give Lake Malawi as the only range, and the species is
      one of the few mbuna found at most rocky sites around the lake. FishBase names Likoma and
      Chizumulu islands. Konings and Stauffer (2006) assign the barred populations at Namalenje
      Island and Makanjila Point and the non-barred or intermediate populations at Maleri Island,
      Membe Island near Chizumulu, Cobwe in Mozambique, Jalo Reef near Nkhotakota and Undu Reef in
      Tanzania to the species. Husemann et al. (2017) collected their study fish at Mazinzi Reef,
      and Mumbo Island is the type locality of the synonym Metriaclima melabranchion. The Cichlid
      Room Companion confirms a lake species of rocky habitats.

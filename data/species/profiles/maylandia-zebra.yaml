partners:
  suitable:
    - species: Labidochromis caeruleus
      reason: Yellow, fairly calm mbuna with a different colour and the same water values and plant-rich
        diet; it does not trigger rival behaviour in zebra males.
      condition: Tank of at least 150 cm with plenty of rock caves.
    - species: Iodotropheus sprengerae
      reason: Brown-violet rock dweller of moderate aggression that shares the water values and the
        herbivorous diet and looks clearly different.
      condition: Tank of at least 150 cm with many caves, because it is smaller and less robust than a
        zebra male.
    - species: Pseudotropheus crabro
      reason: Robust, yellow-brown barred mbuna of similar size that holds its own against zebra males and
        looks clearly different.
      condition: Only in tanks of 150 cm or more with plenty of caves.
    - species: Synodontis njassae
      reason: Lake Malawi catfish that uses the bottom and the caves at night and is too spiny and robust
        to be harassed.
  unsuitable:
    - species: Maylandia estherae
      reason: Same hybrid group; females accept males of the other species and the offspring are hybrids.
    - species: Maylandia callainos
      reason: Same hybrid group and similar blue colour; males fight as rivals and the species cross.
    - species: Maylandia greshakei
      reason: Same hybrid group; the light-blue males provoke rival fights and the species cross.
    - species: Cynotilapia afra
      reason: Blue body with dark bars like a zebra male; both species treat each other as rivals and
        fight constantly.
    - species: Aulonocara jacobfreibergi
      reason: Peaceful peacock cichlid that is harassed by zebra males and needs a more protein-rich diet
        than the bloat-prone zebra.
    - species: Tropheus moorii
      reason: Lake Tanganyika species that is kept in species tanks only and needs much harder water.
    - species: Paracheirodon innesi
      reason: Small soft-water tetra that needs acidic water and would be chased constantly; it cannot
        live in alkaline Malawi water.
profile:
  overview:
    text: The zebra mbuna is the type species of the blue zebra group of Lake Malawi and one of the
      classic rock cichlids of the hobby. Older books call it Pseudotropheus zebra, many scientists
      Metriaclima zebra; the Catalog of Fishes lists it as Maylandia zebra. Males are light blue
      with black vertical bars, while females are brownish and in some lines orange or blotched. The
      fish combs algae from rocks, lives in a harem around a male's cave and is a maternal
      mouthbrooder. It is hardy and breeds readily, but males are among the more aggressive mbuna,
      so it belongs in a spacious rock tank with robust partners and several females per male. Many
      fish sold as zebras belong to related species such as the red zebra, the cobalt zebra or the
      red top ice blue zebra, which cross with it easily.
    sources:
      - *a1
      - *a3
      - *a8
      - *a35
  habitat:
    text: "The species occurs only in Lake Malawi, along rocky coasts, offshore reefs and island shores
      in Malawi, Mozambique and Tanzania. It lives on bare rock as well as on rock covered with
      sediment, and has been recorded from about 6 to 28 metres depth. The lake water is warm,
      moderately alkaline and soft: about 21 to 29 C depending on season and depth, pH 7.7 to 8.6, 3
      to 5 dGH and 5 to 8 dKH. Its carbonate hardness is higher than its total hardness because
      sodium balances part of the bicarbonate. Populations differ in male colour from island to
      island; some have strong black bars, others almost plain blue bodies, and isolated reefs often
      hold forms that do not occur elsewhere."
    sources:
      - *a2
      - *a3
      - *a14
      - *a13
      - *a5
      - *a6
  sizeAndGrowth:
    text: "Wild males measure up to about 11 cm in standard length. In the aquarium, well-fed males
      usually reach about 13 cm total length, a few even more, while females stay around 10 cm.
      Young fish grow quickly on a plant-based diet. Older males become noticeably heavier than
      females and develop a steeper forehead. Size matters for tank planning: a fully grown zebra is
      a stocky, strong fish that can dominate smaller mbuna, so partners should reach a similar
      adult size. With good care the species lives for many years; five to ten years are a realistic
      expectation, but no study has measured its lifespan."
    sources:
      - *a2
      - *a8
      - *a11
      - *a10
      - *a20
  husbandry:
    text: Plan a tank of at least 120 cm length and about 200 litres for one male and three females, and
      more space if other mbuna share it. Pile stones into stable stacks with many caves and gaps so
      that subordinate fish can escape the male's view, and use sand as the substrate. Strong
      lighting lets algae grow on the rocks, which the fish graze all day. Keep the temperature
      between about 24 and 27 C and the pH between 7.6 and 8.6; a steady pH matters more than a high
      hardness, and the lake itself is soft. Coral sand or a carbonate buffer keeps the pH up in
      soft tap water. Strong filtration and large weekly water changes are essential, because mbuna
      react badly to accumulating waste.
    sources:
      - *a8
      - *a9
      - *a2
      - *a14
      - *a16
      - *a17
  socialBehavior:
    text: "A mature male claims a cave or a gap between rocks and defends it against rival males for a
      long time. He displays to every female that passes and chases those that are not ready to
      spawn. With too few females, one female receives all his attention and can be injured, so keep
      at least three females per male and only one male in a tank of about 200 litres. Females are
      less aggressive and move in loose groups. Towards other species the male is also pushy: he
      chases fish of similar colour or shape across the tank, and calm species such as peacocks lose
      condition under the pressure."
    sources:
      - *a8
      - *a3
      - *a35
      - *a20
      - *a31
      - *a34
  diet:
    text: "In the lake the zebra mbuna positions itself at a right angle to the rock and combs the loose
      layer of algae and small organisms from the surface with many rapid bites. It also rises into
      open water to take zooplankton and picks up small invertebrates; fish play no part in its
      natural diet. In the aquarium the diet should be based on plant matter: spirulina flakes or
      pellets, algae wafers, blanched spinach or nori. Small amounts of frozen crustaceans can be
      given once or twice a week. Meat from warm-blooded animals, rich flake foods for predatory
      cichlids and generous portions lead to obesity and digestive problems. Several small portions
      a day suit the species better than one large meal, because it rushes food and eats until
      nothing is left."
    sources:
      - *a23
      - *a2
      - *a3
      - *a24
      - *a8
      - *a9
  breeding:
    text: Breeding is simple in a harem. The male cleans a flat stone or a spot in his cave and courts
      with intense colours and quivering. The female lays a few eggs at a time and takes them into
      her mouth; when she snaps at the yellow egg spots on the male's anal fin, he releases sperm
      and the eggs in her mouth are fertilised. A clutch usually holds 10 to 15 eggs, large females
      carry more. The female broods for three to four weeks without eating and then releases
      free-swimming young, which she guards for a few days at most. The fry take crushed flakes and
      newly hatched brine shrimp at once. In a community tank most young are eaten by the adults, so
      many keepers move the brooding female to a separate tank.
    sources:
      - *a8
      - *a35
      - *a20
      - *a26
  sexing:
    text: "Adult males are easy to recognise: they are blue with clear black bars in most populations
      and carry several distinct yellow to orange egg spots on the anal fin. Females are grey-brown
      to dark brown, sometimes with blue highlights, and in some lines orange or orange with black
      blotches; their egg spots are fewer and paler or missing. Males grow larger and develop a
      steeper forehead with age. Juveniles of both sexes look alike and often show female colours
      for months, and subordinate males in a crowded tank may keep a dull colour, so sexing young
      fish is unreliable. Buying six or more juveniles and removing surplus males later is the usual
      approach."
    sources:
      - *a3
      - *a8
      - *a20
  compatibility:
    text: The zebra mbuna fits a Malawi rock tank with other robust mbuna that differ in colour and
      shape and eat a similar plant-based diet, for example yellow Labidochromis caeruleus,
      Pseudotropheus crabro or a Lake Malawi Synodontis. Do not combine it with other Maylandia
      species such as the red zebra, the cobalt zebra or the red top ice blue zebra, because they
      cross. Fish with a similar blue barred pattern, such as Cynotilapia afra, provoke endless
      fights. Peaceful peacocks and other gentle haps suffer from its pressure and need a more
      protein-rich diet that harms the zebra. Small tetras, livebearers and soft-water fish are
      unsuitable for their water needs, and fry and fish below about 2 cm are eaten.
    sources:
      - *a8
      - *a1
      - *a37
      - *a4
      - *a3
  problems:
    text: "The most common mistake is a diet too rich in protein: bloodworms, meaty foods or large daily
      portions lead to fat deposits and to bloat, a severe digestive disease of mbuna that often
      ends fatally. A second mistake is a wrong sex ratio or a small tank, which leads to torn fins,
      injured females and stressed fish hiding in corners. Keeping several Maylandia species
      together produces hybrids that should not be passed on, and many fish sold as zebras are
      already such crosses or belong to related species. Poor water quality from too few water
      changes, rising nitrate and a falling pH weakens the fish. Brooding females that are disturbed
      or harassed may spit or swallow their brood. Fish that stop eating, swell or sit apart need
      attention early; consult an experienced keeper or a vet."
    sources:
      - *a8
      - *a9
      - *a28
      - *a29

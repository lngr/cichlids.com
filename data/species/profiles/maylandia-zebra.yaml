  disagreements:
    - field: taxonomy.synonyms
      proposals:
        - by: generator
          value:
            - Tilapia zebra Boulenger, 1899
            - Pseudotropheus zebra
            - Metriaclima zebra
            - Metriaclima melabranchion Stauffer, Bowers, Kellogg & McKaye, 1997
        - by: checker-a
          value:
            - Tilapia zebra
            - Pseudotropheus zebra
            - Metriaclima zebra
            - Metriaclima melabranchion
        - by: checker-b
          value:
            - Tilapia zebra
            - Pseudotropheus zebra
            - Metriaclima zebra
            - Metriaclima melabranchion
            - Maylandia melabranchion
      decision:
        - Tilapia zebra
        - Pseudotropheus zebra
        - Metriaclima zebra
        - Metriaclima melabranchion
        - Maylandia melabranchion
      rationale: All runs name the same nominal species. The Catalog of Fishes lists melabranchion under
        both Metriaclima and Maylandia before its synonymy with the zebra, so both combinations help
        to find the species. Authors and years belong in the notes, not in the names.
    - field: features.origin.value.waterbody
      proposals:
        - by: generator
          value: Lake Malawi
        - by: checker-a
          value: Lake Malawi
        - by: checker-b
          value: lake-malawi
      decision: Lake Malawi
      rationale: Both spellings name the same entry of the water body table; the name form is used, as in
        the other proposals.
    - field: features.origin.value.localities
      proposals:
        - by: generator
          value:
            - Namalenje Island
            - Maleri Island
            - Makanjila Point
            - Chizumulu Island
            - Membe Island
            - Cobwe (Mozambique)
            - Jalo Reef near Nkhotakota
            - Undu Reef (Tanzania)
            - Lundu (Tanzania)
        - by: checker-a
          value:
            - Likoma Island
            - Chizumulu Island
            - Mazinzi Reef
            - Lundu (Tanzania)
            - Mumbo Island
        - by: checker-b
          value:
            - Likoma Island
            - Chizumulu Island
            - Mumbo Island
      decision:
        - Namalenje Island
        - Maleri Island
        - Makanjila Point
        - Chizumulu Island
        - Membe Island
        - Likoma Island
        - Mumbo Island
        - Cobwe (Mozambique)
        - Jalo Reef near Nkhotakota
        - Undu Reef (Tanzania)
        - Mazinzi Reef
      rationale: The lists complement each other. Every locality kept is named by Konings and Stauffer
        (2006), FishBase, the Catalog of Fishes or Husemann et al. (2017), which were checked for
        this decision. Lundu rests only on a photo caption of the Cichlid Room Companion, which
        serves for verification and not as the origin of a value, so it is left out.
    - field: features.khDkh.tolerance
      proposals:
        - by: generator
          value:
            min: 5
            max: 15
        - by: checker-a
          value:
            min: 5
            max: 15
        - by: checker-b
          value:
            min: 5
            max: 14
      decision:
        min: 5
        max: 15
      rationale: "Decided by the vote count: unanimous (3 of 3), because the bounds differ by less than
        the 2 dKH threshold; the median of the agreeing bounds is 5 to 15 dKH, the OATA maximum.
        Confidence low, since the only external husbandry source covers Malawi cichlids in general."
    - field: features.maxSizeCm
      proposals:
        - by: generator
          value:
            male: 13
            female: 10
        - by: checker-a
          value:
            male: 13
            female: 10
        - by: checker-b
          value:
            male: 15
            female: 12
      decision:
        male: 13
        female: 10
      rationale: Checker-b follows the 152 mm standard length of Seriously Fish, which gives no female
        figure. FishBase (11.3 cm standard length in the wild), a dealer sheet (10 to 13 cm),
        Fishipedia (11 cm), aquarium-ratgeber.com (13 cm) and an archive keeper (about 13 cm) all
        point to about 13 cm for well-kept males, so the Seriously Fish value reads as a record
        rather than a typical size.
    - field: features.predation
      proposals:
        - by: generator
          value: 1
        - by: checker-a
          value: 1
        - by: checker-b
          value: 0
        - by: tiebreaker-1
          value: 0
        - by: tiebreaker-2
          value: 0
      decision: 1
      rationale: "Decided by the vote count: conservative (3 of 5), confidence low. Three votes chose
        level 0 because the field diet contains no fish, two chose level 1 because fry are eaten in
        tanks. Without a qualified majority of 4 of 5 votes the higher level applies."
    - field: features.diet.value.foods
      proposals:
        - by: generator
          value:
            - loose aufwuchs (filamentous algae, diatoms and the organisms in them)
            - zooplankton
            - small benthic invertebrates
        - by: checker-a
          value:
            - loose aufwuchs combed from rock (algae, diatoms and the small animals in it)
            - zooplankton taken in open water above the rocks
            - in the aquarium plant-based flake or pellets with spirulina, blanched vegetables, nori
        - by: checker-b
          value:
            - algae and biofilm from rock
            - zooplankton
            - small benthic invertebrates
            - spirulina flakes
            - blanched greens
      decision:
        - loose aufwuchs (filamentous algae, diatoms and the organisms in them)
        - zooplankton
        - small benthic invertebrates
      rationale: "Decided by the vote count: unanimous (3 of 3) on type aufwuchs and bloatSensitive true;
        the food lists differ only in wording and in the aquarium foods, which the diet section of
        the profile describes. The tally keeps the generator's list of natural foods."
    - field: features.territory
      proposals:
        - by: generator
          value:
            size: small
            breedingOnly: false
        - by: checker-a
          value:
            size: small
            breedingOnly: false
        - by: checker-b
          value:
            size: large
            breedingOnly: false
      decision:
        size: small
        breedingOnly: false
      rationale: Konings and Stauffer (2006) describe the territory as a space between rocks, often with a
        sandy floor, and mbuna males hold such sites for many months (Genner and Turner 2005). That
        is a cave with its surroundings, the rubric's small. Checker-b chose large with low
        confidence and without a source that states a size.
    - field: features.habitatZones
      proposals:
        - by: generator
          value:
            - rock
            - openWater
        - by: checker-a
          value:
            - rock
            - openWater
        - by: checker-b
          value:
            - rock
      decision:
        - rock
        - openWater
      rationale: FishBase states that the species feeds on plankton in the open water above the rocks, so
        it uses the water column as well as the rock surface. All runs agree that sand is only the
        floor of spawning sites.
    - field: features.minTank
      proposals:
        - by: generator
          value:
            volumeL: 200
            lengthCm: 120
            depthCm: 40
        - by: checker-a
          value:
            volumeL: 200
            lengthCm: 120
            depthCm: 40
        - by: checker-b
          value:
            volumeL: 205
            lengthCm: 120
            depthCm: 38
      decision:
        volumeL: 200
        lengthCm: 120
        depthCm: 40
      rationale: All runs use the Seriously Fish footprint of 120 by 38 cm; the difference is rounding.
        The rounded value matches the Seriously Fish limit of one male below 200 litres and standard
        tank sizes.
    - field: features.lifespanYears
      proposals:
        - by: generator
          value:
            min: 6
            max: 10
        - by: checker-a
          value:
            min: 5
            max: 10
        - by: checker-b
          value:
            min: 6
            max: 10
      decision:
        min: 5
        max: 10
      rationale: The only species-specific figures are 5 to 8 years (dealer care sheet) and 8 years
        (Fishipedia), so the lower bound follows the dealer sheet. The upper bound of 10 years rests
        on general hobby knowledge in all runs; confidence stays low.

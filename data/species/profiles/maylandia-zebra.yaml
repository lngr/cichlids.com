variants:
  - name: Namalenje Island
    kind: locality
    note: Classic form with light-blue males, distinct black bars and a dark head and throat.
  - name: Maleri Island
    kind: locality
    note: Light-blue males with faint or no bars; placed in M. zebra by Konings and Stauffer (2006).
  - name: Makanjila Point
    kind: locality
    note: Part of the territorial males carry a red dorsal fin, the others a light-blue one.
  - name: Chizumulu Island
    kind: locality
    note: Barred, faintly barred and intermediate males around the island.
  - name: OB (orange blotch)
    kind: color-morph
    note: Females, rarely males, mottled orange and black instead of brown.
  - name: Orange female morph
    kind: color-morph
    note: Plain orange females that occur naturally in some populations.
  - name: Albino
    kind: color-morph
    note: Aquarium strain with a pale body and red eyes.

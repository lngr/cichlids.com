  synonyms:
    - name: Tilapia zebra
      note: Original combination, Boulenger 1899; holotype BMNH 1891.12.17.7 from Lake Malawi.
    - name: Pseudotropheus zebra
      note: Combination used in most literature and in the hobby before 1997.
    - name: Metriaclima zebra
      note: Combination of Stauffer et al. 1997 as type species of Metriaclima, used by many
        ichthyologists and by the Cichlid Room Companion; the Catalog of Fishes treats Metriaclima
        as a synonym of Maylandia.
    - name: Metriaclima melabranchion
      note: Described by Stauffer, Bowers, Kellogg and McKaye 1997 from Mumbo Island; a synonym of the
        zebra after Ciccotto et al. 2011 according to the Catalog of Fishes.
    - name: Maylandia melabranchion
      note: Combination of the same synonym in Maylandia.
  legacyNames:
    - Pseudotropheus zebra
    - Metriaclima zebra
  note: "The Catalog of Fishes (online version of 21 Sep 2026) lists Tilapia zebra Boulenger 1899 with
    the current status valid as Maylandia zebra and treats Metriaclima as a synonym of Maylandia;
    Metriaclima melabranchion from Mumbo Island is a junior synonym after Ciccotto et al. (2011).
    The legacy entries 494 (Pseudotropheus zebra) and 830 (Metriaclima zebra) hold this one species
    under its two older genus names. Maylandia zebra in the strict sense is the blue fish with dark
    bars and, since the revision of Konings and Stauffer (2006), also includes light-blue
    populations without bars such as Maleri Island. Several fish that the trade sells as zebras are
    separate species: the red zebra Maylandia estherae, the cobalt zebra Maylandia callainos and the
    red top ice blue zebra Maylandia greshakei, besides undescribed forms such as Metriaclima sp.
    'zebra gold'. Older legacy content and photos labelled Pseudotropheus zebra may show these
    relatives or their hybrids rather than M. zebra."

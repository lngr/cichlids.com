  khDkh:
    value:
      min: 5
      max: 8
    confidence: high
    rationale: "Lake Malawi endemic, so the natural range is the measured lake range: alkalinity of 2.33
      to 2.46 meq/L in the north basin profiles (Branchu et al. 2010) and 2.00 to 2.59 meq/L in the
      1960s data compiled by FAO correspond to about 5.6 to 7.3 dKH, so the lake has 5 to 8 dKH.
      Sodium balances part of the bicarbonate, which is why the carbonate hardness exceeds the total
      hardness."

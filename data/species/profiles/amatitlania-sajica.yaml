  temperatureC:
    value:
      min: 23
      max: 30
    confidence: "low"
    rationale: "The settled tally gives 23 to 30 C by qualified majority, 4 of 6 votes, with low confidence.\
      \ Generator and tiebreaker-2 proposed 25 to 30 C; checker-a proposed 22 to 30 C; checker-b, checker-c\
      \ and tiebreaker-1 proposed 23 to 30 C. FishBase supplies the latter range and links it to Bussing\
      \ (1998); contrary descriptions of that reference as an aquarium atlas are retained as agent interpretations,\
      \ not a demonstrated field method. Beerlink explicitly reports natural temperatures of 25 to 30\
      \ C but gives no station series. The selected typical interval is narrower than the Terraba monitoring\
      \ range of 20.7 to 31.8 C, the Rincon basin range of 22 to 32.5 C, Umana's regional 26 to 33 C and\
      \ the coastal survey's 25.2 to 34.1 C. Those wider measurements cover entire regional samples without\
      \ matching every extreme to sajica captures. Palo Seco records 29 C at a named locality. Neither\
      \ husbandry recommendations nor short field peaks establish the complete native envelope, so the\
      \ tally remains a provisional typical range."

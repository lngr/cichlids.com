    value:
    - "amatitlania-nigrofasciata-sajica"
    confidence: "low"
    rationale: "The tally keeps amatitlania-nigrofasciata-sajica with low confidence. Generator and checker-b\
      \ proposed the id amatitlania-nigrofasciata-sajica, checker-a, checker-c and tiebreaker-2 proposed\
      \ amatitlania-nigrofasciata-sajica; both ids name the same sajica-convict pair and form one group under\
      \ the id with the members in alphabetical order, so five of six votes name this pair. Tiebreaker-1\
      \ proposed amatitlania-nigrofasciata-sajica plus amatitlania-nanolutea-sajica, amatitlania-sajica-thorichthys-maculipinnis,\
      \ amatitlania-sajica-hypsophrys-nicaraguensis and amatitlania-sajica-polar-blue. The four additional\
      \ groups appeared in one vote only, so their Binns photo-label evidence remains without those IDs\
      \ entering the decision. Maidenhead reports traded sajica-convict hybrids, AquaInfo and Think Fish\
      \ name the pairing, and forum accounts report putative offspring. Pedigrees, modern convict identification\
      \ and availability of conspecific mates are unverified, so the pairwise group has basis presumed.\
      \ Genus-wide warnings do not justify a larger all-to-all crossing group."

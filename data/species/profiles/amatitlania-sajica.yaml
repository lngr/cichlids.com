        \ is 16, between 12 and 20. No qualified majority fixes a single interval, so this synthesis reflects\
        \ the proposals without letting the narrowest care sheet determine the whole tolerance. It is\
        \ narrower than the 1 to 20 proposals and Maidenhead's recommendation allowing up to 20 dKH, and\
        \ excludes checker-b's uncertain 0.2 dKH lower extension. The breeder documented reproduction\
        \ at 2 to 5 dKH, Garnelio recommends 1 to 4, Atlarium 5 to 10, ExpoAqua 3 to 12 and a specialist\
        \ forum recommends sajica for 5 to 6. None demonstrates the complete 1 to 16 interval over years,\
        \ and 16 is a median ceiling rather than a directly tested threshold. Qualitative archive soft\
        \ water supplies no numeric KH. The decided natural 3 to 7 dKH is contained."

  sizeAndGrowth:
    text: "Typical aquarium planning sizes are about 12 cm for males and 8.5 cm for females, summarizing\
      \ source accounts of females around 8 to 9 cm. Larger individuals have been reported, including\
      \ males near or above 15 cm, but they are not the usual sex-specific planning maxima. Standard lengths\
      \ exclude the tail and cannot be substituted directly for aquarium total length. Juveniles therefore\
      \ need permanent adult space from the start. The lifespan estimate of 5 to 9 years summarizes conflicting\
      \ hobby estimates; it is not established by tracked age records."

    rationale: "The tally selects 2 to 7 dGH by median with low confidence, retaining the 3 of 6 agreeing-vote\
      \ count. Generator proposed 4.8 to 12, checker-a 1 to 3, checker-b 0.4 to 0.4, checker-c 2.4 to\
      \ 6.9, tiebreaker-1 2.8 to 7.7 and tiebreaker-2 2.4 to 6.9 dGH. The endpoint medians are 2.4 and\
      \ 6.9, rounded to integers. The result is a plausible soft-water regional synthesis, not a precise\
      \ species-wide field envelope. Rincon titrations of 42.4 to 122.8 mg/L as CaCO3 convert to 2.38\
      \ to 6.88 dGH. The selected range is narrower than Umana's regional 4.8 to 12 dGH and the figure-derived\
      \ Esquinas estimate of 2.8 to 7.7 dGH; those remain in evidence without replacing the tally. Terraba's\
      \ 1.1 to 2.9 dGH is a converted mean plus or minus variation, not observed extrema. Palo Seco's\
      \ 0.4 dGH assumes that its 7 mg/L label means CaCO3 equivalents, which is unconfirmed. FishBase\
      \ prints only a lower dH number of 15; any 20 dGH completion is an input estimate. Jaco groundwater\
      \ at 5 to 15.8 dGH concerns the wrong water type. Neither conductivity nor aquarium KH is used as\
      \ a GH measurement."

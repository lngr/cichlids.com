  problems:
    text: "The most common preventable trouble is treating a breeding pair as ordinary community fish.\
      \ Persistent pursuit, torn fins or a partner confined to one corner call for prompt separation and\
      \ a review of territory and shelter. A small tank or a trio can leave the weaker fish with no escape.\
      \ Overfeeding, decaying food and weak circulation increase waste and oxygen stress, particularly\
      \ at high temperatures. Quarantine new arrivals and check water quality when appetite, breathing\
      \ or appearance changes. Such signs can reflect several problems and do not identify a particular\
      \ disease. Avoid replacing observation with indiscriminate medication. An overly rich diet also\
      \ departs from the plant-heavy feeding pattern documented in the wild."

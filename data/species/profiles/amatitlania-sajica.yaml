  compatibility:
    text: "A sufficiently spacious aquarium can accommodate robust adult swordtails or suitable medium-sized\
      \ shoaling fish, provided their own water needs overlap and they can leave the nest area. Similar-sized\
      \ firemouths are a conditional possibility only with separate territories in a much larger tank.\
      \ Fry and fish around 2 cm or less may be taken opportunistically; delicate companions can also\
      \ suffer territorial pursuit. Sajica-convict hybrids are reported in the trade and in hobby accounts,\
      \ although parentage and same-species partner availability remain unverified. The two retained hybrid-group\
      \ identifiers describe this same pairwise presumed risk. Photo labels also report crossings with\
      \ nanolutea, maculipinnis, nicaraguensis and Polar Blue, but those single-vote additions did not\
      \ enter the settled group decision. A broad warning about related cichlids does not prove every\
      \ possible cross. An unusual successful tank with very large predators is insufficient evidence\
      \ of safe long-term companionship."

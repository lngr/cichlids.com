partners:
  suitable:
  - species: "Xiphophorus hellerii"
    reason: "Robust adult swordtails can occupy the upper and middle water away from the nest."
    condition: "A larger community aquarium with compatible water and retreat space; fry are at risk."
  - species: "Psalidodon anisitsi"
    reason: "Buenos Aires tetras are active and robust enough for an appropriately sized specialist community."
    condition: "Keep an adult shoal with ample swimming room outside the pair territory; verify temperature\
      \ overlap."
  - species: "Thorichthys meeki"
    reason: "Maidenhead names similarly sized firemouths as a possible cichlid companion."
    condition: "A substantially larger aquarium than the pair minimum with separate territories; monitor\
      \ both species during spawning."
  unsuitable:
  - species: "Amatitlania nigrofasciata"
    reason: "Specific captive hybridization warnings and a similar territorial breeding niche make this\
      \ combination unsuitable for keeping pure lines."
  - species: "Paracheirodon innesi"
    reason: "Very small juveniles can be taken opportunistically, while delicate adults may suffer repeated\
      \ territorial pursuit around a nest; habitual predation on adult neon tetras is not established."
  - species: "Pterophyllum scalare"
    reason: "Long-finned and less robust fish can be harmed by territorial sajica; a forum discussion\
      \ cautions against relying on their different body shape."
  - species: "Parachromis managuensis"
    reason: "A much larger predator poses a long-term safety risk; one unusual breeding account is insufficient\
      \ to recommend cohabitation."
profile:
  overview:
    text: "The T-bar cichlid is a compact Costa Rican fish with a strong pair bond and conspicuous parental\
      \ behavior. Its dark flank markings can form a T, while the brown body and iridescent fins change\
      \ considerably with mood. The accepted name is Amatitlania sajica; shops may still use Cryptoheros\
      \ or Archocentrus. It often fits a thoughtfully arranged community, but spawning changes the social\
      \ balance quickly. A compatible pair and visible escape routes matter more than its reputation as\
      \ a peaceful cichlid. Captive-bred fish are widely established in the hobby. Do not confuse modest\
      \ adult size with harmless behavior."

      rationale: "The tally retains 2 to 20 dGH by qualified majority, 5 of 6 agreeing votes under the\
        \ 2 dGH threshold, with low confidence. Proposals were generator 4.8 to 20, checker-a 1 to 20,\
        \ checker-b 0.4 to 20, checker-c 2.4 to 20, tiebreaker-1 2.8 to 20 and tiebreaker-2 2.4 to 20.\
        \ The median lower bound of the agreeing set is 2.4, rounded to 2; all upper proposals are 20.\
        \ The decision is narrower than checker-a's 1 to 20 and checker-b's 0.4 to 20, whose lowest endpoints\
        \ are not demonstrated long-term aquarium limits. Direct reproduction at 2 to 4 dGH complements\
        \ AquaInfo's 12 to 16 dGH and care recommendations reaching 20. That combination supports flexible\
        \ hardness, although it is not a lifetime endpoint experiment. Natural 2 to 7 dGH is contained.\
        \ Retained entries interpreting Maidenhead's 20 dKH as GH or giving numeric hardness to qualitative\
        \ archive soft water are uncertain input interpretations, not source measurements."
    verification:
      method: "median"
      votes:
        agree: 3
        total: 6
  khDkh:
    value:
      min: 3
      max: 7
    confidence: "low"
    rationale: "The settled tally gives 3 to 7 dKH by median with low confidence; natural KH deliberately\
      \ has no verification object. Generator proposed 4.8 to 14, checker-a 1 to 3, checker-b 0.2 to 0.2,\
      \ checker-c 2.5 to 7.4, tiebreaker-1 3.6 to 7.8 and tiebreaker-2 2.5 to 7.4 dKH. The endpoint medians\
      \ are 2.5 and 7.4, rounded to integers. Rincon bicarbonate concentrations of 54.3 to 160.8 mg/L\
      \ yield approximately 2.49 to 7.38 dKH under bicarbonate-dominated chemistry. The decided typical\
      \ range is narrower than that converted range, Umana's regional alkalinity range of 4.8 to 14 dKH\
      \ and the figure-derived Esquinas range of 3.6 to 7.8 dKH. All are retained as regional evidence\
      \ rather than proven occupied species limits. Checker-a inferred KH from GH and pH, which is not\
      \ an alkalinity measurement. Checker-b's Palo Seco conversion assumes that an ambiguous 3 mg/L label\
      \ means CaCO3 equivalents. The Jaco groundwater estimate of 5.2 to 16.2 dKH is outside the appropriate\
      \ stream-habitat basis. The median is a plausible provisional buffering range; it does not establish\
      \ that GH and KH are interchangeable."
    sources:

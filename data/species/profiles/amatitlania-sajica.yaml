  sexing:
    text: "Adult males are normally larger and deeper-bodied, with more extended fins and sometimes a\
      \ forehead swelling as they age. Male fins often show red together with blue iridescence; females\
      \ commonly show yellow-orange fins with a dark border. These color clues vary between fish and become\
      \ especially conspicuous around reproduction. Body size alone is unreliable in a shop group of mixed\
      \ ages. The original description also distinguishes the reproductive papilla, but this is not a\
      \ reason to handle or stress a fish merely to identify its sex. Observe mature fish together and\
      \ confirm compatibility rather than assuming any male and female will form a safe pair."
    sources:
    - kind: "literature"

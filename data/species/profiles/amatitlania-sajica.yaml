  breeding:
    text: "Give the pair sheltered nesting choices such as a rock crevice or a clay pot with a suitable\
      \ opening. They usually attach eggs inside cover, although exposed spawning can occur. Both parents\
      \ participate in protection, with the female often staying nearer the eggs and the male patrolling\
      \ farther away. Around 26 C, several accounts report hatching after about three days and free swimming\
      \ roughly five days later. Brood size varies with female size and condition, commonly involving\
      \ tens to a few hundred eggs. Feed free-swimming fry small foods such as newly hatched brine shrimp.\
      \ Protect filter intakes and arrange homes for growing juveniles before repeated spawning overcrowds\
      \ the tank."
    sources:

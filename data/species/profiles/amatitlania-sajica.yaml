  beginnerSuitability:
    value: "moderate"
    confidence: "medium"
    rationale: "Generator, checker-b and checker-c proposed moderate; checker-a proposed easy. The public\
      \ CRC explicitly identifies an intermediate aquarium level. Nordic, NVC and several retail accounts\
      \ describe accessible feeding and reproduction, which explain the easier assessments. Pair selection,\
      \ partner pursuit and brood defense still require observation and a separation option, so moderate\
      \ fits full adult care. Unread subscriber content and a blocked GCCA page supply no evidence."

  habitat:
    text: "This species comes from the Pacific side of Costa Rica, with records in the Sierpe, Terraba,\
      \ Esquinas and Rincon drainages and a field account from Palo Seco. It feeds and nests around quieter\
      \ stream margins with gravel, sand, stones and submerged cover, despite living in flowing waters.\
      \ The adopted typical water ranges are 23 to 30 C, pH 7.3 to 8.0, GH 2 to 7 dGH and KH 3 to 7 dKH.\
      \ These are uncertain regional syntheses rather than measurements of every occupied microhabitat.\
      \ Native catchment studies report broader chemistry and seasonal temperature ranges. In the Rincon\
      \ study, Chocuaco lagoon reached pH 6.62 with dissolved oxygen close to zero; sajica occupancy there\
      \ was not demonstrated, and these conditions do not define aquarium care. Coastal field readings\
      \ up to 34.1 C also lack capture-linked occupancy evidence. Palo Seco reported GH 7 mg/L and KH\
      \ 3 mg/L without analytical equivalents, so its unusually low converted hardness estimates remain\
      \ uncertain."

  socialBehavior:
    text: "Keep adults as a compatible male and female rather than a permanent trio or an assortment of\
      \ rivals. A juvenile group can help fish choose partners, but spare adults need another home once\
      \ pairs establish territories. A settled pair may display, chase and guard a cave without dominating\
      \ the whole aquarium. Breeding can intensify this behavior sharply, and a rejected partner may lose\
      \ access to food or shelter. Check both fish daily for persistent pursuit, hiding or fin damage.\
      \ Have a divider or separate aquarium ready. Reports of rival deaths explain why a reputation for\
      \ relative calm is not a guarantee."

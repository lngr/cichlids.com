      rationale: "The tally retains 23 to 30 C with unanimous verification, 4 of 4 votes within the 1\
        \ C agreement threshold, and medium confidence. Generator, checker-b and checker-c proposed 23\
        \ to 30 C; checker-a proposed 22 to 30 C. FishBase and the Nordic register support 23 to 30 C;\
        \ the breeder used 25 to 28.9 C, Maidenhead 24 to 28 C and AquaInfo 25 to 29 C. The decision is\
        \ narrower than the inferred 20 to 28 C archive representation and excludes checker-a's 22 C lower\
        \ limit. The archive gives room-temperature success without a measured lower endpoint, so 20 C\
        \ is an agent estimate rather than a demonstrated lifetime limit. Cooler commercial recommendations\
        \ and wider river peaks remain cited. The tolerance contains the decided natural range; the warmer\
        \ upper edge requires oxygenated water and is not the routine target."
    verification:
      method: "qualified-majority"
      votes:
        agree: 4
        total: 6
  ph:
    value:
      min: 7.3
      max: 8
    confidence: "low"
    rationale: "The tally selects pH 7.3 to 8.0 by median, 3 of 6 votes in the largest agreeing set, with\
      \ low confidence. Proposals were generator 7.75 to 8.0, checker-a 7.0 to 8.0, checker-b 7.6 to 8.0,\
      \ checker-c 7.0 to 8.2, tiebreaker-1 7.6 to 8.0 and tiebreaker-2 6.4 to 8.2. No qualified majority\
      \ settled the field envelope; the median lower endpoint is rounded from 7.3 and the median upper\
      \ endpoint is 8.0. This plausible mildly alkaline synthesis is not a measured species-wide bound.\
      \ Terraba has an annual mean of 7.6, Palo Seco a single reading of 8.0, and Esquinas accounts describe\
      \ values near 8. The decision is narrower than Rincon's basin range of 6.62 to 8.17 and the coastal\
      \ range of 6.42 to 7.67; their observations remain evidence of geographic variation rather than\
      \ exact occupied limits. Rincon's lowest pH was from nearly anoxic Chocuaco lagoon, without demonstrated\
      \ sajica occupancy. The 2023 survey narrative gives a wider 6.3 to 8.5 but contradicts its pH table,\
      \ so it cannot define reliable endpoints. FishBase provides only 7.0 with no upper bound; estimated\
      \ completions and aquarium care values do not become natural measurements."

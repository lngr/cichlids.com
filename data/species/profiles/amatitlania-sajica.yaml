    confidence: "high"
    rationale: "The four profiles agree on a Costa Rican Pacific-slope endemic. The Catalog of Fishes\
      \ is the nomenclatural and distribution authority; its type locality is a Sierpe tributary near\
      \ Palmar Sur. The combined locality list retains the Terraba survey, association collecting records\
      \ in Rincon and Esquinas, and the Palo Seco field account. Different wording and partial locality\
      \ lists are reconciled without extending the range into Panama. Maidenhead mentions Panama and Aquainfo.dk\
      \ introduces a South American origin, but those statements conflict with the catalog and original-description\
      \ distribution."

  diet:
    text: "Offer an omnivorous diet with a substantial plant component. The original gut study found mainly\
      \ algae and seeds, with animal remains in only a small minority of fish. A good everyday combination\
      \ is vegetable flakes or pellets alongside a balanced small cichlid food. Add modest portions of\
      \ brine shrimp, insect larvae or similar frozen invertebrates for variety. Rich animal food should\
      \ not replace the plant portion simply because the fish accepts it eagerly. Feed small amounts that\
      \ are consumed promptly and ensure a shy partner gets a share. No special protein-triggered bloat\
      \ syndrome was established in the sources, but overfeeding still damages water quality."
    sources:

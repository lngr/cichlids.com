  minTank:
    value:
      volumeL: 110.0
      lengthCm: 85.0
      depthCm: 37.5
    confidence: "low"
    rationale: "For one compatible adult pair, generator proposed 200 L/120 cm length/40 cm depth; checker-a\
      \ and checker-b each proposed 100/80/35; checker-c proposed 120/90/40. The medians are 110 L, 85\
      \ cm length and 37.5 cm depth. Nordic guidance supports 100 L and 80 cm, Guidarium 110 L and 80\
      \ cm, Think Fish 90 cm and Coburg 120 L. These place the selected volume and length within the published\
      \ pair-housing band. Depth is a practical median of the layout inferences, not a measured biological\
      \ threshold. Maidenhead allows 60 cm for a single compatible pair, the NVC article recommends 120\
      \ cm, AquaInfo 180 cm, and Riverpark about 284 L. All larger advice remains cited, but does not\
      \ establish that every settled pair requires the largest aquarium. Several sheltered retreats and\
      \ sight barriers are necessary at this modest minimum; additional fish require more space and an\
      \ independent territory assessment."

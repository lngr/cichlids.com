  husbandry:
    text: "The planning minimum for one compatible adult pair is 110 litres with a footprint at least\
      \ 85 cm long and 37.5 cm deep. These dimensions summarize differing care recommendations and depend\
      \ on adequate shelter, rather than guaranteeing that every pair will remain compatible. Provide\
      \ several caves, stable stones and wood arranged so each fish can retreat out of sight. Set heavy\
      \ structures securely before adding sand or fine gravel, because nesting fish dig. Rooted plants\
      \ near the nest may be displaced; sturdy plants attached to wood offer alternative cover. Use effective\
      \ filtration, surface movement and sheltered resting places. Around 25 to 27 C is a useful routine\
      \ temperature within the decided tolerance. Keep water conditions stable and replace water regularly.\
      \ Additional tankmates need more room than this pair minimum."

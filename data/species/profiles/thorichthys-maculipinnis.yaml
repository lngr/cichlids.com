      - *a13
      - *a19
  husbandry:
    text: "For the recommended six adults, provide at least 300 litres and a footprint of 150 by 50 cm. Arrange
      fine smooth sand with secure wood and stones that divide sight lines while leaving feeding areas
      accessible. Cover should offer more than one escape route. Maintain effective filtration and gas
      exchange, and keep routine temperature around 24 to 26 C. The reported tolerance reaches 30 C, but
      long-term keeping above 28 C is disputed by CRC. Larger communities need additional room. An established
      pair can be housed separately under the smaller pair recommendations."

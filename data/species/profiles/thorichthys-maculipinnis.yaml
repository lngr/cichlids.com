    confidence: "medium"
    rationale: "The qualified majority is 22 to 30 C: generator, checker-b, checker-c, tiebreaker-1 and
      tiebreaker-2 proposed this range, while checker-a proposed 24 to 30 C. CRC records an Otapa low near 22
      C and dry-season water near 30 C; DCG reports regional collecting-site temperatures of 25 to 30 C. The
      single cool reading is interpreted within the wider regional seasonal account. FishBase and AquaInfo
      give 25 to 28 C, Fishipedia gives 23 to 28 C, the La Antigua collector measured 25.6 C, and the
      lower-basin crustacean survey gives 27.5 to 28.9 C. A keeper repeats a single Tonto confluence reading
      of 31 C, which remains evidence without defining the typical upper endpoint. These observations do not
      establish years of safe aquarium exposure at either extreme."

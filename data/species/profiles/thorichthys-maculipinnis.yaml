    tolerance:
      value: &a40
        min: 22
        max: 30
      confidence: "low"
      rationale: "The qualified majority retains 22 to 30 C, proposed by generator, checker-a, checker-c and both
        tiebreakers; checker-b proposed the wider 20 to 30 C based on Heimrich advice of 20 to 27 C. AquaInfo
        and NCS recommend 22 to 28 C, Fishkeeper recommends 24 to 30 C, Aqualog 24 to 29 C and Garnelio 22 to
        28 C. The shared 22 to 30 C decision combines husbandry advice with required containment of the
        seasonal natural range. It has low confidence because CRC explicitly warns against sustained aquarium
        temperatures above 28 C. Aim around 24 to 26 C with strong gas exchange; 30 C is a disputed upper
        boundary rather than a proven permanent maintenance temperature. Successful breeding at 28 C and
        experimental holding at 26 to 28 C do not resolve long-term limits. Matching the natural endpoints
        does not establish injury immediately outside them."

      selections of neighboring rivers. The Catalog supplies the accepted range framework and CRC and the DCG
      collecting account establish additional occupied Veracruz drainages. The Aqua-Pedia Coatzacoalcos claim
      and retailer claims extending into Guatemala are not adopted as established native range. CRC regards
      northern Cazones populations as likely introductions; the 2024 overview also distinguishes introduced
      Morelos populations. The dryland-stream study concerns upper-basin stations without demonstrated
      occupation by this fish and cannot set its water chemistry."

profile:
  overview:
    text: "Often traded as Ellioti, this Mexican cichlid is accepted here as Thorichthys maculipinnis. Adults
      combine blue reflective markings with a red or orange underside. Its interest extends beyond color:
      loose feeding associations give way to territorial pairs during reproduction. This profile recommends a
      small adult group and allows for substantial differences between individual fish. Clean water, usable
      floor space and a way to protect excluded fish are central to successful keeping."
    sources:
      - *a1
      - *a10
      - *a2
      - *a3
      - *a20
      - *a4
      - *a19
      - *a35
      - *a24
      - *a21
      - *a6
      - *a13
      - *a12
      - *a15
      - *a11
      - *a16
      - *a9
  habitat:
    text: "Occupied lowland waters extend from the Actopan area through neighboring Veracruz drainages to the
      Papaloapan system. Shallow margins contain fine sediment, stones, fallen leaves and submerged wood, with
      variable clarity and little obligatory aquatic vegetation. Regional field accounts support approximately
      22 to 30 C, pH 7 to 8, GH 4 to 11 and KH 5 to 13. A keeper reports a single Tonto confluence reading of
      31 C, pH 6.75 and GH 5; it is retained as an isolated observation rather than a typical habitat range.
      Mineralized upper-basin dryland streams lack demonstrated species occurrence at the studied stations."
    sources:
      - *a2
      - *a5
      - *a3
      - *a1
      - *a20
      - *a4
      - *a19
      - *a35
      - *a24
      - *a21
      - *a6
      - *a7
      - *a8
      - *a9
  sizeAndGrowth:
    text: "Allow for males around 15 cm and females around 12 cm in total length. Breeding can begin well before
      these sizes, and a reproductive pair should not be mistaken for fully grown fish. Female upper size
      remains an approximation. Published standard-length records use a different measurement and are not
      aquarium total-length targets. A typical expectation of seven to eight years is better supported than
      retailer claims reaching twelve."
    sources:
      - *a6
      - *a10
      - *a2
      - *a7

  problems:
    text: "Investigate persistent hiding alongside group relationships and water conditions. Damaged fish may have
      lost access to safe space, while heat and weak gas exchange can compound oxygen stress. Rough substrate
      impairs safe bottom foraging and uneaten food degrades the same area where the fish feeds. Digestive
      swelling and appetite loss have several possible causes; the precautionary diet flag is not a diagnosis.
      Quarantine arrivals and respond to continuing aggression before injuries accumulate."

  aggressionConspecific:
    value: 3
    confidence: "medium"
    rationale: "Generator, checker-a and checker-b proposed level 3; checker-c proposed 2 for a well-spaced group.
      CRC reports conspecific deaths in cramped aquaria and NCS notes occasional serious within-species
      problems. The magazine records exclusion of an extra female, and the aggression forum includes both
      uneventful groups and fatalities after transfer. AquaInfo and Fishkeeper emphasize display and
      comparatively mild disputes. Level 3 reflects persistent pressure on subordinate adults and the need for
      retreats and intervention during pair formation, while these dissenting observations explain why injury
      is not inevitable in the recommended spacious group."

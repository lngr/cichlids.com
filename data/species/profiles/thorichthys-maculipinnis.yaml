      - *a3
      - *a8
  socialBehavior:
    text: "Group members forage near one another, but a developing pair changes the distribution of space. Nest
      defense is usually local, with displays and chases; subordinate conspecifics can nevertheless face
      persistent exclusion. Assess access to food and shelter for every fish. Cornering, repeated injury or
      inability to leave cover requires intervention. Sources range from peaceful group accounts to deaths in
      cramped or newly changed setups, so the recommended group size does not guarantee harmony."
    sources:
      - *a10
      - *a2
      - *a6
      - *a13
      - *a12
      - *a15
      - *a4
      - *a19
      - *a11
      - *a16
      - *a9
      - *a26
  diet:
    text: "Use a varied menu of small aquatic-invertebrate foods and suitable sinking prepared food, with some
      plant-containing food as part of that variety. Bottom foraging is an essential opportunity to provide:
      experiments with fish named T. ellioti demonstrated retrieval of buried insect larvae. The conservative
      bloat-sensitive flag reflects disputed digestive warnings, particularly about excessive feeding and
      unsuitable animal protein. It does not mean that normal aquatic invertebrates are inappropriate or that
      the fish requires an algae-based diet. Avoid terrestrial meat and monitor appetite and condition."
    sources:

      - *a10
  breeding:
    text: "Pairs attach eggs to a firm surface and both parents protect the brood. Exposed stones and wood can be
      used, as can sheltered pottery. Newly hatched larvae may be moved among shallow pits before the young
      swim with their parents. A vanished clutch can therefore reflect relocation. Provide food small enough
      for the young and protect filter intakes. Reproductive territories include courtship before eggs appear;
      repeated spawning also requires adequate space for the resulting juveniles."
    sources:
      - *a10
      - *a2
      - *a6
      - *a11
      - *a13
      - *a4
      - *a15
      - *a16
      - *a9
  sexing:
    text: "Compare mature fish of similar age rather than relying on color alone. Males generally grow larger and
      develop longer fin extensions; females may have a rounder abdomen and a dark dorsal-fin mark. These
      clues vary with population, maturity and reproductive state. Behavior can help reveal a pair, but two
      fish judged to be opposite sexes may still be incompatible. Continue watching both partners after
      spawning begins."
    sources:

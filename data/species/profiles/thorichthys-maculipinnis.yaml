  compatibility:
    text: "Adult swordtails and substantial mollies are supported companion options where water requirements
      overlap and the aquarium has extra community space. Their fry remain at risk. Calm, robust schooling
      fish may also work, while very small fish, fin nippers and assertive large cichlids create avoidable
      problems. A reported firemouth and Ellioti cross supports the presumed hybrid caution. NCS additionally
      warns about five members of the Helleri group; that dissenting proposal remains in evidence although the
      final vote retains only the existing firemouth pair group."
    sources:

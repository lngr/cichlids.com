        title: cichlids.com forum thread 17421
        url: "https://www.cichlids.com/disc/read.php?2,17421"
        accessed: "2026-10-13"
  husbandry:
    text: "For one male and three females, use at least 200 litres with a base of 120 by 40 cm. Build separated\
      \ retreats and visual barriers with securely placed stones, retain swimming space, and use a soft sandy\
      \ substrate. Plants can provide additional cover. Mixed communities need a larger aquarium than this\
      \ minimum. Maintain filtration and water movement, and measure GH and KH separately. Temperatures around\
      \ 25 to 27 C and stable pH around 7.5 to 8.0 fall within the better supported husbandry recommendations.\
      \ The broader tolerance envelopes, especially their extreme pH and KH endpoints, are provisional and\
      \ do not define preferred set points."
    sources:
      - kind: database
        title: "Seriously Fish: Haplochromis latifasciatus"
        url: "https://www.seriouslyfish.com/species/haplochromis-latifasciatus/"
        accessed: "2026-10-13"
      - kind: database
        title: "Nordiska Ciklidsallskapet: Astatotilapia latifasciata species register"
        url: "https://www.ciklid.org/artregister/art.php?ID=301"
        accessed: "2026-10-13"
      - kind: database
        title: "Fischlexikon: Haplochromis latifasciatus"
        url: "https://www.fischlexikon.eu/fischlexikon/fische-suchen.php?fisch_id=0000001446"
        accessed: "2026-10-13"
      - kind: database
        title: "Einrichtungsbeispiele: Haplochromis latifasciatus husbandry profile."
        url: "https://www.einrichtungsbeispiele.de/zierfische/afrika/haplochromis-latifasciatus-slnk.html"
        accessed: "2026-10-13"
      - kind: website
        title: "Imperial Tropicals breeder care sheet: Zebra Obliquidens"
        url: "https://imperialtropicals.com/products/zebra-obliquidens-dominate-male-3"
        accessed: "2026-10-13"
  socialBehavior:
    text: "A male can pursue females repeatedly and exclude rivals from a spawning patch. Several females distribute\
      \ attention, but each still needs a retreat that remains accessible when the male is displaying. The\
      \ selected harem is a husbandry arrangement for a polygamous fish, not a permanent pair bond. Adding\
      \ another male to the minimum aquarium increases competition. Most territorial defense is associated\
      \ with reproduction, although unusually aggressive individuals may be difficult even with suitable cover.\
      \ Persistent hiding, missed food and damaged fins are useful signs that the arrangement needs adjustment."
    sources:
      - kind: database
        title: "Seriously Fish: Haplochromis latifasciatus"
        url: "https://www.seriouslyfish.com/species/haplochromis-latifasciatus/"
        accessed: "2026-10-13"
      - kind: database
        title: "Nordiska Ciklidsallskapet: Astatotilapia latifasciata species register"
        url: "https://www.ciklid.org/artregister/art.php?ID=301"
        accessed: "2026-10-13"
      - kind: website
        title: "Imperial Tropicals breeder care sheet: Zebra Obliquidens"
        url: "https://imperialtropicals.com/products/zebra-obliquidens-dominate-male-3"
        accessed: "2026-10-13"
  diet:
    text: "Feed as an invertebrate eater. The strongest species accounts emphasize insects and aquatic insect\
      \ larvae; varied aquarium foods do not turn it into an algae specialist. Use balanced cichlid pellets\
      \ with animal ingredients and rotate small invertebrate foods such as Daphnia, Artemia and insect larvae.\
      \ Some spirulina-containing food can be part of that rotation. Modest servings and access for subordinate\
      \ females matter more than maximizing appetite. Special high-protein bloat sensitivity is not established,\
      \ but digestive problems can still occur."
    sources:
      - kind: database
        title: "Nordiska Ciklidsallskapet: Astatotilapia latifasciata species register"
        url: "https://www.ciklid.org/artregister/art.php?ID=301"
        accessed: "2026-10-13"
      - kind: database
        title: "Fischlexikon: Haplochromis latifasciatus"
        url: "https://www.fischlexikon.eu/fischlexikon/fische-suchen.php?fisch_id=0000001446"
        accessed: "2026-10-13"
      - kind: database
        title: "Seriously Fish: Haplochromis latifasciatus"
        url: "https://www.seriouslyfish.com/species/haplochromis-latifasciatus/"
        accessed: "2026-10-13"
      - kind: website
        title: "AquariumDomain species profile: Zebra Obliquidens"
        url: "https://www.aquariumdomain.com/SpeciesProfiles/AfricanCichlids/ZebraObliquidens.shtml"
        accessed: "2026-10-13"
  breeding:
    text: "Only the female incubates the eggs and young in her mouth. Spawning usually centers on a selected\
      \ substrate patch or flat surface, with the male displaying to several females. Incubation commonly lasts\
      \ about three weeks, during which feeding may stop. Disturbance or harassment can lead to brood loss,\
      \ and moving a female can complicate her later return to the group. Released fry can take suitably small\
      \ foods such as Artemia nauplii. Separate rearing improves protection when brood survival matters. Clearly\
      \ identified breeding fish should be kept away from other related mixed-sex haplochromine groups."
    sources:
      - kind: database
        title: "FishBase species summary: Haplochromis latifasciatus"
        url: "https://www.fishbase.se/summary/Haplochromis-latifasciatus.html"
        accessed: "2026-10-13"
      - kind: database
        title: "Seriously Fish: Haplochromis latifasciatus"
        url: "https://www.seriouslyfish.com/species/haplochromis-latifasciatus/"
        accessed: "2026-10-13"
      - kind: database
        title: "Fischlexikon: Haplochromis latifasciatus"
        url: "https://www.fischlexikon.eu/fischlexikon/fische-suchen.php?fisch_id=0000001446"
        accessed: "2026-10-13"
  sexing:
    text: "Mature males usually show stronger yellow and red coloration and are larger than females. Females\
      \ retain dark bars over a less intensely colored body, so bars alone do not identify sex. Young fish\
      \ and suppressed males can resemble females. Egg spots may contribute to a broader assessment but are\
      \ not a reliable sole test. Liang and colleagues found bar-number variation between stocks, so counting\
      \ bars is also unsuitable for sexing."
    sources:
      - kind: literature
        title: Liang et al. (2020). Developmental and Cellular Basis of Vertical Bar Color Patterns in the
          East African Cichlid Fish Haplochromis latifasciatus.
        url: "https://doi.org/10.3389/fcell.2020.00062"
        accessed: "2026-10-13"
      - kind: database
        title: "Seriously Fish: Haplochromis latifasciatus"
        url: "https://www.seriouslyfish.com/species/haplochromis-latifasciatus/"
        accessed: "2026-10-13"
      - kind: database
        title: "Nordiska Ciklidsallskapet: Astatotilapia latifasciata species register"
        url: "https://www.ciklid.org/artregister/art.php?ID=301"
        accessed: "2026-10-13"
      - kind: database
        title: "Fischlexikon: Haplochromis latifasciatus"
        url: "https://www.fischlexikon.eu/fischlexikon/fische-suchen.php?fisch_id=0000001446"
        accessed: "2026-10-13"
  compatibility:
    text: "Everyday maintenance can include suitably sized adult cichlids, provided temperament, water conditions\
      \ and retreat space overlap. Restrained mbuna and carefully selected male peacocks are possibilities\
      \ in an enlarged setup. Very small fish and fry can be eaten, and aggressive companions can prevent females\
      \ from feeding or resting. Related Victoria-basin haplochromines are poor partners for a breeding line\
      \ because the species accounts warn of crossing. The empty curated hybrid-group list means that no supported\
      \ named member set was established, not that hybridisation is impossible."
    sources:
      - kind: database
        title: "Seriously Fish: Haplochromis latifasciatus"
        url: "https://www.seriouslyfish.com/species/haplochromis-latifasciatus/"
        accessed: "2026-10-13"
      - kind: database
        title: "Nordiska Ciklidsallskapet: Astatotilapia latifasciata species register"
        url: "https://www.ciklid.org/artregister/art.php?ID=301"
        accessed: "2026-10-13"
      - kind: website
        title: "Imperial Tropicals breeder care sheet: Zebra Obliquidens"
        url: "https://imperialtropicals.com/products/zebra-obliquidens-dominate-male-3"
        accessed: "2026-10-13"
  problems:
    text: "Uneven male pressure is a common practical concern. A fish that stays hidden or repeatedly loses\
      \ access to food needs attention even before injuries appear. Preserve water quality and oxygenation,\
      \ particularly in warm conditions. Appetite loss during mouthbrooding can be normal, but persistent deterioration\
      \ requires checking the fish and its surroundings. Avoid abrupt changes in pH or minerals. The adopted\
      \ KH tolerance of 6 to 12 dKH is particularly uncertain because its upper endpoint derives from the conservative\
      \ vote calculation rather than a direct maintenance study. Watch behavior and health instead of treating\
      \ an endpoint as a goal."
    sources:
      - kind: literature
        title: Newman (1997). Cichlid Conservation in Uganda. Field account republished by AquaInfo.
        url: "https://aquainfo.nl/en/cichlid-conservation-in-uganda/"
        accessed: "2026-10-13"

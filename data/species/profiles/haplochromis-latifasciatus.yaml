      reason: Opportunistic predation is classified at level 1; the rubric uses a 2 cm screening threshold.
    - species: Strongly aggressive mbuna
      reason: "Persistent harassment can overwhelm females and brooding fish, so these are poor default companions."
profile:
  overview:
    text: "The zebra obliquidens sold as Astatotilapia latifasciata is listed by the Catalog of Fishes as Haplochromis\
      \ latifasciatus. It is a Uganda endemic associated with Kyoga and Nawampasa, rather than a Lake Victoria\
      \ endemic. Its dark body bars remain visible in both sexes, while displaying males develop stronger yellow\
      \ and red areas. The separate species H. obliquidens is not this fish. FishBase still reports a critically\
      \ endangered assessment dated 1996, which should not be mistaken for a recent population census."
    sources:
      - kind: catalog-of-fishes
        title: "Eschmeyer's Catalog of Fishes: species of Haplochromis"
        url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Haplochromis"
        accessed: "2026-10-13"
      - kind: database
        title: "FishBase species summary: Haplochromis latifasciatus"
        url: "https://www.fishbase.se/summary/Haplochromis-latifasciatus.html"
        accessed: "2026-10-13"
      - kind: database
        title: "Seriously Fish: Haplochromis latifasciatus"
        url: "https://www.seriouslyfish.com/species/haplochromis-latifasciatus/"
        accessed: "2026-10-13"
      - kind: database
        title: "Nordiska Ciklidsallskapet: Astatotilapia latifasciata species register"
        url: "https://www.ciklid.org/artregister/art.php?ID=301"
        accessed: "2026-10-13"
  habitat:
    text: "Vegetated shores and shallow water are central to its native setting. Newman's Nawampasa field account\
      \ describes dense submerged plants above mud and accumulated plant material. The two lakes have their\
      \ own chemistry; Victoria-basin membership does not justify substituting Lake Victoria measurements.\
      \ The natural values retained here are rounded decisions from incomplete Kyoga and Nawampasa evidence.\
      \ Wider field readings include 24.5 to 30.4 C, pH 6.5 to 9.9, and substantially softer regional mean\
      \ hardness than the chosen GH interval. These lake observations do not identify the conditions occupied\
      \ by every wild individual."
    sources:
      - kind: literature
        title: Newman (1997). Cichlid Conservation in Uganda. Field account republished by AquaInfo.
        url: "https://aquainfo.nl/en/cichlid-conservation-in-uganda/"
        accessed: "2026-10-13"
      - kind: literature
        title: "Ongom, Andama and Lukubye (2017). Physico-Chemical Quality of Lake Kyoga at Selected Landing\
          \ Sites and Anthropogenic Activities. Table 1."
        url: "https://doi.org/10.4236/jwarp.2017.911080"
        accessed: "2026-10-13"
      - kind: literature
        title: "Obubu et al. (2022). Determination of the Connectedness of Land Use, Land Cover Change to Water\
          \ Quality Status of a Shallow Lake: A Case of Lake Kyoga Basin, Uganda."
        url: "https://doi.org/10.3390/su14010372"
        accessed: "2026-10-13"
      - kind: literature
        title: Obubu et al. (2023). Identification and characterization of fish breeding habitats on Lake Kyoga
          as an approach to sustainable fisheries management.
        url: "https://doi.org/10.47853/fas.2023.e24"
        accessed: "2026-10-13"
      - kind: literature
        title: "Mungoma (1988). Horizontal differentiation in the limnology of a tropical river-lake (Lake\
          \ Kyoga, Uganda). Abstract only."
        url: "https://doi.org/10.1007/bf00014336"
        accessed: "2026-10-13"
      - kind: database
        title: "Seriously Fish: Haplochromis latifasciatus"
        url: "https://www.seriouslyfish.com/species/haplochromis-latifasciatus/"
        accessed: "2026-10-13"
      - kind: database
        title: "Nordiska Ciklidsallskapet: Astatotilapia latifasciata species register"
        url: "https://www.ciklid.org/artregister/art.php?ID=301"
        accessed: "2026-10-13"
  sizeAndGrowth:
    text: "Allow for typical aquarium adults around 13 cm in males and 10 cm in females. These are approximate\
      \ sex-specific planning values, not absolute growth limits. Standard length excludes the tail, so the\
      \ 12.5 cm standard-length figure in Seriously Fish cannot be compared directly with total length. A pigment\
      \ study examined laboratory females around 12 cm standard length, illustrating the existence of larger\
      \ specimens. Reports of rapid juvenile growth in the archive are individual experiences and do not establish\
      \ a growth timetable. A tentative lifespan expectation is 8 to 10 years, with little direct age evidence."
    sources:
      - kind: literature
        title: Liang et al. (2020). Developmental and Cellular Basis of Vertical Bar Color Patterns in the
          East African Cichlid Fish Haplochromis latifasciatus.
        url: "https://doi.org/10.3389/fcell.2020.00062"
        accessed: "2026-10-13"

  ph:
    value:
      min: 6.8
      max: 9.6
    confidence: medium
    rationale: "The qualified-majority decision is 6.8 to 9.6, with four of six votes agreeing within the pH\
      \ threshold. Fishing areas in Ongom reach 6.8 to 7.5, the 2023 shallow fish-habitat survey reaches 7.0\
      \ to 9.6, and Newman reports about 7.0 to 7.5 in Nawampasa. Obubu's eastern-arm series has a wider union\
      \ of 6.5 to 9.9; it documents lake variation but not this species occupying every extreme. Waste-associated\
      \ readings down to 5.7 are also outside the selected envelope. The tally favors the fish-habitat interpretation\
      \ over both the 9.0 ceiling and the broader 6.5 to 9.9 proposal. Seasonal photosynthesis can produce\
      \ transient high pH. The Naigaga abstract contains no confirmable numeric pH range. generator proposed\
      \ {\"min\": 6.8, \"max\": 9}; checker-a proposed {\"min\": 7, \"max\": 9.6}; checker-b proposed {\"min\"\

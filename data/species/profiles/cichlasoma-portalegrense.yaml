  temperatureC:
    value:
      min: 12
      max: 28
    confidence: medium
    rationale: "Retain the tally range of 12 to 28 C. Mirim monitoring measured 11.69 to 27.93 C, while northern\
      \ Tramandai seasonal averages were 11.3 to 27 C. The decision describes a typical seasonal envelope of the\
      \ occupied coastal drainage systems, with regional rather than capture-linked evidence. Wider observations\
      \ remain in evidence: Mangueira water reached 10 to 28 C, Guaiba 10.4 to 29.5 C, and impacted Pelotas waterways\
      \ 9.9 to 32.8 C. The selected range does not cover every transient regional extreme. FishBase 16 to 24 C derives\
      \ from aquarium literature and does not replace field temperatures. Unanimous is the tally method under its\
      \ range-agreement rules, rather than a claim that every proposed endpoint was identical."

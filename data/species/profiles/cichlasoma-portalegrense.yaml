  breeding:
    text: "Both adults protect eggs attached to a prepared exposed surface, often a stone or a broad leaf. They\
      \ may later move the larvae into shallow substrate pits. Several care accounts report clutches of up to about\
      \ 500 eggs, but clutch size and survival vary. Temperature affects development, so watch for free swimming\
      \ before beginning suitably small fry food such as newly hatched Artemia. Reproduction increases territorial\
      \ chasing and can require removal of companions from the defended area."
    sources:
      - *id016
      - *id013
      - *id014
      - *id002
  sexing:
    text: "Adult males generally become larger and develop more extended dorsal and anal fin tips. Females tend\
      \ to stay smaller and may become fuller before spawning. Colors and markings change with condition and reproduction,\
      \ making color alone unreliable for sexing. Juvenile fin shape is also uncertain. An observed compatible pair\
      \ is a stronger starting point than two fish selected solely for apparent sex, and their behavior still needs\
      \ monitoring after a move."
    sources:
      - *id016
      - *id013
      - *id017
      - *id014
      - *id019
  compatibility:
    text: "Suitable companions need to tolerate moderately cool maintenance, avoid tiny prey size and have space\
      \ outside the pair's brood territory. Robust peaceful tetras or suitable armored catfish are possible in a\
      \ larger aquarium. The named partner examples are reasoned options rather than documented trials. Historical\
      \ forum accounts use common names and uncertain identifications, so their mixed stock lists do not establish\
      \ safe combinations. One report describes a port acara pairing with a blue acara but records no hybrid offspring.\
      \ No named crossing group is supported here. Avoid very small fish, much more aggressive cichlids and species\
      \ that require continuous high tropical temperatures."
    sources:

  note: "The Catalog of Fishes accepts Cichlasoma portalegrense, with Acara portalegrensis as the original combination.\
    \ The Aequidens query contains no matching entry. Historical aquarium names have covered several different acaras.\
    \ The Catalog also lists Bolivia, while FishBase and modern regional inventories support the southern coastal\
    \ drainages; Bolivia and Paraguay are therefore not used to select habitat measurements. The public CRC page\
    \ confirms the combination and medium adult size but supplies no public numerical water or feeding data."

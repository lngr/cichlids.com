  khDkh:
    value:
      min: 1
      max: 5
    confidence: low
    rationale: "Retain the tally estimate of 1 to 5 dKH with low confidence and no natural verification object.\
      \ This describes total alkalinity in aquarium degree equivalents. Tramandai measurements of 0.15 to 1.05 meq/L\
      \ convert to 0.42 to 2.94 dKH; the upper endpoint occurred near sewage input. Sinos alkalinity converts to\
      \ 1.33 to 3.79 dKH. Mangueira studies give the wider intervals 2.6 to 5.7 and 3.5 to 5.7 dKH. The decision\
      \ summarizes typical regional buffering and is narrower than the complete source envelope. Checker-a inferred\
      \ KH from pH and conductivity, but these cannot determine a numerical alkalinity; its estimate stays as explicitly\
      \ inferred evidence. Measurements are regional water-type proxies rather than fish-specific physiological\
      \ limits."

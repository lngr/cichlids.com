      rationale: "The proposal medians are 7 to 10 years: generator and checker-b gave 8 to 10, checker-a 5 to 8\
        \ and checker-c 6 to 10. Retain the median as a provisional aquarium planning span. The Aquarium Wiki states\
        \ the wider 6 to 10 years, while PortalPez and Fishipedia give about ten years. No read age determination\
        \ or tracked aquarium cohort establishes this interval. The selected minimum is a synthesis rather than\
        \ a measured lower lifespan, and the maximum does not exceed the cited ten-year estimates."

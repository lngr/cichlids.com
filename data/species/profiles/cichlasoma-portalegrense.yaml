  husbandry:
    text: "Provide at least 180 litres with a base about 100 by 40 cm for one compatible adult pair. Companions\
      \ require a larger aquarium. Sand and securely supported wood can divide the floor into shaded areas, with\
      \ robust plants and a smooth egg surface available. Protect plant roots against digging. Keep water movement\
      \ gentle enough to leave quiet resting places and maintain effective filtration with regular partial changes.\
      \ Routine keeping around 18 to 24 C is better supported than the outer seasonal tolerance of 11 to 29 C. Those\
      \ endpoints do not establish healthy permanent exposure for years. Soft water and stable pH near neutral are\
      \ sensible starting conditions; very low KH needs particular attention to pH stability."
    sources:

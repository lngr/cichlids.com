    tolerance:
      value:
        min: 11
        max: 29
      confidence: low
      rationale: "Retain the qualified-majority tally tolerance of 11 to 29 C with low confidence. Routine recommendations\
        \ are narrower: Maidenhead and AquaInfo 18 to 24 C, FishBase 16 to 24 C, Fischlexikon 15 to 26 C and Mare\
        \ 2000 22 to 28 C. The Nordic association gives 24 to 29 C. The lower endpoint is inferred from seasonal\
        \ winter habitat measurements near 11 C and the upper from the association recommendation; neither is established\
        \ by multiyear constant-exposure trials. Wider regional water observations of 10 to 28 C at Mangueira and\
        \ 11 to 32.9 C in monitored Tramandai lagoons remain evidence, not aquarium limits. These endpoints require\
        \ gradual seasonal interpretation. About 18 to 24 C has better support for ordinary maintenance."

          value:
            baseColors:
              - green
              - grey
              - brown
            pattern: mixed
      decision:
        baseColors:
          - green
          - grey
          - brown
        pattern: mixed
      rationale: "Choose green, grey and brown base colors with a mixed pattern. Generator included blue and checker-b\
        \ included black; those are better treated as iridescence or dark markings than stable ground colors. Checker-a\
        \ selected stripes, while generator, checker-b and checker-c selected mixed. A lateral band, scale edging,\
        \ a tail-base blotch and reflective fin spots together fit mixed more fully than stripes alone. Color intensity\
        \ varies with sex and reproductive state. Sources differ in the emphasis they give the lateral stripe versus\
        \ the additional markings."

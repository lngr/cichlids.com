  socialBehavior:
    text: "An established compatible pair is the recommended adult unit. Additional adults can become rivals, and\
      \ opposite sexes alone do not ensure compatibility. Brood defense may occupy a large part of the floor even\
      \ when the fish were previously calm. Use visual barriers and allow an escape route from the nesting area.\
      \ Have a divider or spare aquarium available if one adult cannot feed or remain visible without being chased.\
      \ The territorial expansion belongs chiefly to reproduction, although minor disputes can happen at other times."
    sources:
      - *id016
      - *id013
      - *id014
      - *id019
  diet:
    text: "Use a varied omnivore diet built around appropriately sized sinking prepared food, with small crustaceans,\
      \ insect larvae and a plant-containing component. The available field study describes flexible mixed feeding\
      \ with a strong animal-food contribution. Both adults need access to meals, especially when one has become\
      \ subordinate. Opportunistic losses of fry and fish around 2 cm or smaller are plausible, so very small companions\
      \ are a poor choice. No specialized protein-related bloat sensitivity is established for this species."
    sources:

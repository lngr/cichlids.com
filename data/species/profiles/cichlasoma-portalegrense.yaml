    rationale: "All four profiles concern the same southern coastal fish. FishBase identifies the Patos and Tramandai\
      \ basins, the Catalog includes Uruguay, and modern inventories document the Mirim system and coastal lagoons.\
      \ The Catalog also includes Bolivia; older aquarium accounts extend to Paraguay and the Rio de la Plata. These\
      \ broader records remain cited but are not treated as verified localities for selecting water chemistry because\
      \ Heijns documents historical misidentification under the port-acara name. None of these basins invokes a\
      \ fixed lake table entry."

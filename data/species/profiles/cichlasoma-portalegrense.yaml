    rationale: "The male and female medians are 14 and 11.5 cm. Generator and checker-b proposed 15/12 cm, checker-a\
      \ 13/11 and checker-c 13/10. Retain those medians as planning estimates for typical well-grown aquarium adults.\
      \ The male lies between AquaInfo's 15 cm and the 12.5 to 12.9 cm maxima at Maidenhead and FishBase; the cited\
      \ lake survey reached 12.8 cm. Females are consistently described as smaller, but 11.5 cm is an inferred sex-specific\
      \ estimate. Tropical Freshwater Fish gives a wider usual size up to 20 cm and maximum 25 cm, Fishipedia also\
      \ reaches 25, while Mare 2000 gives 8 to 10 cm in aquaria. Historical identity problems documented by Heijns\
      \ reduce the weight of the largest claims. Neither sex-specific value exceeds the largest source claim."

partners:
  suitable:
    - species: Hyphessobrycon anisitsi
      reason: A robust subtropical tetra that uses the middle water; choose adults safely beyond tiny prey size.
      condition: Larger community aquarium at about 20 to 23 C with a full shoal and escape space.
    - species: Hoplosternum littorale
      reason: A robust armored catfish from the same broad region can cope with cooler conditions.
      condition: Much more space than the pair minimum and separate resting areas; guard against brood attacks.
    - species: Ancistrus cirrhosus
      reason: An adult armored grazer offers a different feeding niche and accepts moderate temperatures.
      condition: Generous floor space and its own shelter at about 22 to 24 C; eggs may be eaten and nesting conflict
        needs monitoring.
  unsuitable:
    - species: Paracheirodon simulans
      reason: Very small adults and warmer specialist requirements make this a poor match for an adult acara pair.
    - species: Symphysodon aequifasciatus
      reason: Routine discus warmth and restrained feeding conflict with cooler acara maintenance and brood defense.
    - species: Amphilophus labiatus
      reason: A much larger and more forceful territorial cichlid can seriously injure or exclude port acaras.
profile:
  overview:
    text: "The port acara is a compact cichlid from southern South America, currently named Cichlasoma portalegrense.\
      \ Its subdued body colors gain reflective highlights, and dark markings become stronger around reproduction.\
      \ A settled pair provides an engaging display of brood care. Identity matters because the same trade name\
      \ has been applied to several different acaras. Its coastal southern distribution also makes cooler seasonal\
      \ conditions relevant when choosing companions."

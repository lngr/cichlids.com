      decision:
        volumeL: 180
        lengthCm: 100
        depthCm: 40
      rationale: "For one compatible adult pair, retain component-wise proposal medians of 180 L and a 100 by 40\
        \ cm footprint. Generator and checker-b proposed 200 L, 100 by 40 cm; checker-a 150 L, 90 by 40 cm; checker-c\
        \ 160 L, 100 by 40 cm. The resulting layout can be supplied by a 100 by 40 by 45 cm tank. Tropical Freshwater\
        \ Fish gives 151 L and 91 cm, Fischlexikon 100 cm for a pair, and Zoopet 120 L and 90 cm. Conversely AquaInfo\
        \ recommends 140 cm and FishFish 300 L for two fish; these larger recommendations are retained. The decision\
        \ is an intermediate pair-only synthesis within the sourced volume and length span, not a minimum for a\
        \ mixed cichlid community. The 40 cm depth is a layout inference, since none of the read sources establishes\
        \ a measured minimum depth. More space is required for companions and brood avoidance."

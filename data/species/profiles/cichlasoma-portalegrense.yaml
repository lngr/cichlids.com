  ghDgh:
    value:
      min: 1
      max: 5
    confidence: low
    rationale: "Retain the tally estimate of 1 to 5 dGH with low confidence. Direct regional total-hardness measurements\
      \ deserve more weight than the conductivity-based estimates retained from checker-a. Pedrozo and Rocha measured\
      \ 13.0 to 47.6 mg/L as CaCO3, equivalent to 0.73 to 2.67 dGH; Sinos studies extend from about 0.39 to 3.95\
      \ dGH. Mangueira measurements of 58.7 to 116.0 mg/L give a wider 3.3 to 6.5 dGH interval, and the regional\
      \ review includes a coastal Cidreira mean near 6.7 dGH. The decided 1 to 5 is a typical regional estimate\
      \ and does not encompass all those measurements. Some sampled waters were affected by sewage, and no study\
      \ establishes the same values at each fish capture. Conductivity does not uniquely determine calcium and magnesium\
      \ hardness. FishBase 3 to 10 dH is retained without treating it as a demonstrated field series."

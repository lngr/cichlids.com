  ph:
    value:
      min: 6
      max: 8
    confidence: medium
    rationale: "Retain the qualified-majority tally range of 6 to 8. JICA measured Mirim water within this interval;\
      \ subsequent Mirim observations span 6.93 to 8.08 and Tramandai lagoon measurements 6.67 to 8.02. Regional\
      \ annual pH medians of 6.00 to 7.95 support the same typical interval. Wider field ranges are retained: Lagoa\
      \ Negra 5.78 to 9.15, Mangueira 7.4 to 9.2, regional Tramandai extremes 2.5 to 9.1 and impacted Pelotas waterways\
      \ 5.4 to 8.2. Lagoa Negra had repeated mildly acidic readings, but only one reading at 9.15; the 2.5 regional\
      \ reading was questioned in its study. Those observations do not require every seasonal extreme to become\
      \ an ideal aquarium target. FishBase 6.5 to 7.0 is a narrower summary without a site-resolved field series.\
      \ Confidence remains medium because the evidence is regional and not measured beside identified captured individuals."

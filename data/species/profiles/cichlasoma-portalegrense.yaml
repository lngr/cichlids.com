  problems:
    text: "Incorrect identity, incompatible adults and insufficient space for brood defense are the main planning\
      \ concerns. Digging may expose unstable decoration or uproot plants. Repeated hiding, missed meals or damaged\
      \ fins can indicate social pressure. Keep waste from accumulating, check water when behavior changes and avoid\
      \ abrupt shifts even within a listed tolerance. The outer water endpoints are uncertain and should not be\
      \ treated as conditions to maintain continuously. Reliable locality information and a practical separation\
      \ option make long-term care easier."
    sources:
      - *id016
      - *id013
      - *id017

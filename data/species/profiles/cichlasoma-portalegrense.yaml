  habitat:
    text: "The most secure records concern the Patos-Mirim system and nearby southern Brazilian coastal basins,\
      \ with Uruguay included in the taxonomic catalog. Lagoa Negra and other occupied waters have shallow vegetated\
      \ margins and sandy or muddy ground. Regional measurements support a typical natural envelope of 12 to 28\
      \ C, pH 6 to 8, about 1 to 5 dGH and 1 to 5 dKH, but the hardness estimates are weakly linked to individual\
      \ fish records. Wider seasonal values occur: Mangueira water reached 10 to 28 C and pH 7.4 to 9.2, while a\
      \ Lagoa Negra series recorded pH 5.78 to 9.15, with just one reading above 7.30. These are habitat observations\
      \ rather than aquarium targets. Some regional datasets include polluted or brackish sites; neither sewage\
      \ influence nor salt addition belongs in a habitat recreation."

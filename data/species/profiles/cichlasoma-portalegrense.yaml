  sizeAndGrowth:
    text: "Allow for a typical well-grown male around 14 cm and a smaller female around 11.5 cm. These are planning\
      \ estimates assembled from conflicting descriptions, with the female size less directly documented. Reliable\
      \ modern figures commonly fall around 12.5 to 15 cm for the species. Much larger historical claims remain\
      \ uncertain because stock identity has often been confused. An estimated lifespan of 7 to 10 years is also\
      \ provisional. Space for an adult pair depends on breeding behavior as well as body length."

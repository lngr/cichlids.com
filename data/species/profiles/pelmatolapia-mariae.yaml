    rationale: "All four votes select false, with medium confidence. Graffagnino documents mixed aquarium keeping,
      while Fishkeeper and the Nordic register contemplate robust companions in very large aquariums. Physical
      separation during spawning can be necessary. Wild mixed-species groups alone do not prove aquarium
      compatibility, but the aquarium observations also do not support an obligation to keep only
      conspecifics. Severe aggression remains represented separately by level 4 and does not make mixed
      keeping routine or safe for every individual."

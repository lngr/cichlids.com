  sizeAndGrowth:
    text: "Allow for a well-grown male around 30 cm and a female around 25 cm. Males generally grow larger,
      although individuals vary. Small pairs can reproduce well before reaching these dimensions, so breeding
      is not evidence that growth has finished. Wild record lengths exceed the aquarium planning sizes and use
      different length conventions. A provisional aquarium lifespan of five to eight years has limited
      support; field ageing records include fish in an 8+ year class and do not establish a hard age limit.
      Plan permanent housing before buying juveniles."

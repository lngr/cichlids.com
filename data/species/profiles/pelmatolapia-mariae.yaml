  socialBehavior:
    text: "A pair formed from compatible fish is the supported adult social unit. A male and female placed
      together can fail to bond, and even a breeding pair may need separation. Extra adults face a serious
      risk of persecution. Watch for persistent hiding, damaged fins and loss of feeding access, and intervene
      before injuries escalate. The defended area becomes especially large during spawning and brood care;
      less intense behavior outside reproduction does not guarantee partner safety. Grouping juveniles for
      pair selection requires a plan for moving the remaining fish."

    confidence: "medium"
    rationale: "Five of six votes support omnivore with bloatSensitive false; checker-a agrees on omnivore but
      proposes true from advice to limit protein-rich food. Native Ogun stomach contents contain predominantly
      algae and plants with some crustaceans, FishBase includes insects and shrimp, and Graffagnino reports
      growth and breeding on mixed plant and animal foods. CRC labels the dominant feeding role herbivorous
      and Florida Museum emphasizes attached algae; their aufwuchs-mapped evidence is retained. That
      ecological emphasis does not establish the mandatory low-protein requirement of the rubric aufwuchs
      category. Generic advice against excessive protein or overfeeding does not demonstrate a particular
      protein-induced bloat syndrome. False therefore means no established special susceptibility, not
      immunity to intestinal illness. The tally fixes both the combined value and medium confidence."

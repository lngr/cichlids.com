  khDkh:
    value:
      min: 1
      max: 5
    confidence: "low"
    rationale: "The tally selects 1 to 5 dKH with low confidence from four proposals that agree within its
      two-degree threshold; this natural fact has no verification object. Ethiope surface bicarbonate 40 to 65
      mg/L in Table 3 gives about 1.84 to 2.98 dKH using 21.8 mg/L per degree, while the narrative maximum of
      70 gives 3.21. Erinle total alkalinity 67.8 to 85.3 mg/L as CaCO3 gives 3.80 to 4.78 dKH using 17.848
      mg/L per degree. These support weak to moderate freshwater buffering. Wider regional results remain:
      generator includes near-zero buffering and a 2024 Ethiope report implies 10.42 to 26.49 dKH from
      bicarbonate, but that paper has an unresolved conductivity and major-ion contradiction. Umuaja 3.27 to
      4.11 dKH assumes conventional CaCO3 alkalinity units, which are incompletely specified. KH is an
      alkalinity equivalent and is neither GH nor salinity. Proposals: generator 0 to 4; checker-a 0.5 to 3;
      checker-b 1 to 5; checker-c 1 to 5."
    sources:

  ghDgh:
    value:
      min: 1
      max: 3
    confidence: "low"
    rationale: "All four natural-hardness proposals agree within the rubric threshold; the tally selects 1 to 3
      dGH with low confidence. Ethiope surface total hardness 25.5 to 35 mg/L as CaCO3 converts to 1.43 to
      1.96 dGH using 17.848 mg/L per degree. The rounded interval allows ordinary freshwater variation.
      Checker-a proposes the wider 1 to 4 dGH from regional ions and lagoon conductivity; conductivity alone
      cannot determine GH. The 2024 hydrochemical paper implies 13.44 to 29.13 dGH but pairs these
      concentrations with conductivity only 9.81 to 111.5 microsiemens/cm, an unresolved inconsistency. Umuaja
      reports 0.56 to 0.81 dGH despite calcium and magnesium implying greater hardness. These wider and
      conflicting observations remain evidence. FishBase 5 to 19 dGH describes generalized keeping conditions,
      not a local field series. The selected freshwater reference does not reconstruct hardness from coastal
      salinity. Proposals: generator 1 to 3; checker-a 1 to 4; checker-b 1 to 3; checker-c 1 to 3."
    sources:
      - kind: "literature"
        title: "Omo-Irabor and Olobaniyi (2007). Investigation of the Hydrological Quality of Ethiope River Watershed,
          Southern Nigeria"
        url: "https://doi.org/10.4314/jasem.v11i2.54978"

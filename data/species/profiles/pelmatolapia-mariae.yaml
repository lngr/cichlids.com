  sexing:
    text: "Adult males generally grow longer and develop more extended fins. Pale caudal-fin spotting can help
      identify a male, while females often develop red coloration around the belly during reproduction. Color
      and proportions overlap and change with condition, so they are less dependable in juveniles. Compare
      fish of similar age and use reproductive behavior together with visible differences. A correct
      male-female identification does not establish compatibility; a naturally formed pair also needs
      monitoring."

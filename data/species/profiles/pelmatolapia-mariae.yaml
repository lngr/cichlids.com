    tolerance:
      value:
        min: 5.3
        max: 8.4
      confidence: "low"
      rationale: "The six proposals lack a qualified majority, so the tally retains the median interval 5.3 to 8.4
        with low confidence. The lower median is 5.3 and the upper median is 8.4 after rounding; this also
        contains the decided natural range. Their equality results from independent endpoint voting and
        containment, not evidence of harm immediately outside native values. Published aquarium
        recommendations include FishBase and Akvaforum 6 to 8, Zoopet 6 to 7.5, the Atlas 6.5 to 8 and the
        Nordic discussion 5 to 8; Graffagnino reports successful reproduction at 7.6. The decision is narrower
        than checker-b 5.4 to 8.8 and checker-c and tiebreaker-2 5 to 9. Native lower Ogun measurements
        reaching 8.7 and lagoon readings reaching 8.8 or 9.15 remain evidence but are not chronic aquarium
        trials. No source tests the selected endpoints over years; retain stable conditions and gradual
        acclimation. Proposals: generator 5.3 to 8; checker-a 6 to 8; checker-b 5.4 to 8.8; checker-c 5 to 9;
        tiebreaker-1 5.3 to 8; tiebreaker-2 5 to 9."

  husbandry:
    text: "For one compatible adult pair, use at least the adopted 540 L recommendation with a length of 160 cm
      and a practical depth of 60 cm. The depth is an inferred allowance rather than a tested limit. Provide
      fine substrate, secure rocks and wood, and retreats that break the line of sight without trapping the
      smaller fish. Protect equipment from digging and keep a sturdy divider ready. Effective biological
      filtration, surface movement and regular water changes are necessary for these large feeders. Plants may
      be consumed or uprooted. Published keeping advice supports cooler maintenance than some native field
      readings; do not use the low-confidence tolerance endpoints as routine targets. Acclimate gradually and
      keep the water stable."

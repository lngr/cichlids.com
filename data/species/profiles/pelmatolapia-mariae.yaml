  ph:
    value:
      min: 5.3
      max: 8.4
    confidence: "low"
    rationale: "No qualified majority settles the six proposals. The tally takes the median lower endpoint, 5.3,
      and median upper endpoint, 8.35 rounded to 8.4, with low confidence. This spans acidic Ethiope surface
      water and alkaline native river and lagoon settings without asserting that one population encounters the
      complete interval. The decided 5.3 to 8.4 is narrower than lower Ogun 6.6 to 8.7, the Ologe/Badagry
      combined 6 to 8.8, and the Aby-Tendo-Ehy individual readings extending about 5.3 to 9.15; all remain in
      evidence. Umuaja 4.25 to 7.93 also remains, but negative chloride and hardness inconsistent with calcium
      weaken its extreme low reading. Otamiri Table 1 gives an implausible pH 0.50 minimum, while its coherent
      station means span 5.33 to 6; those means support the acidic end. The median is a planning reference
      rather than a tested optimum or a complete occurrence envelope. Proposals: generator 5.3 to 6.5;
      checker-a 6.3 to 7.8; checker-b 5.4 to 8.8; checker-c 5.3 to 8.7; tiebreaker-1 5.3 to 8; tiebreaker-2
      5.3 to 8.7."
    sources:
      - kind: "literature"
        title: "Omo-Irabor and Olobaniyi (2007). Investigation of the Hydrological Quality of Ethiope River Watershed,
          Southern Nigeria"
        url: "https://doi.org/10.4314/jasem.v11i2.54978"
        archived: "doi.org/10.4314_jasem.v11i2.54978/2026-10-13T162437Z"
        accessed: "2026-10-15"
      - kind: "literature"

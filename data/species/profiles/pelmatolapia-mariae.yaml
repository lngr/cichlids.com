  predation:
    value: 1
    confidence: "medium"
    rationale: "The qualified majority selects level 1 with five of six votes; checker-a proposes 0. The FWS
      assessment relays consumption of smaller fishes at Rogers Spring, and Galvani and Coleman identify
      mariae as a brood predator while using a model of it in convict-fry defense experiments. These support
      opportunistic fry predation despite a plant-dominated diet. The model experiment is not a live feeding
      trial. Native gut studies and the Mitchell catchment samples support limited piscivory rather than a
      fish-based diet. Aquarium Wiki gives a broader smaller-fish warning, retained as level-2 evidence, but
      does not document frequency or prey size. Regular swallowing of all mouth-sized fish is unproven. The
      approximately 2 cm boundary comes from the rubric, not a measured cutoff. Confidence remains medium as
      tallied."

  lifespanYears:
    value:
      min: 5
      max: 8
    confidence: "low"
    rationale: "Proposal medians are 8 to 11 years: generator 8 to 10, checker-a 8 to 12, checker-b 5 to 8 and
      checker-c 8 to 12. Aquarium Wiki supplies the only read numerical aquarium interval, 5 to 8 years. The
      Australian government report records mariae age classes through 8+ years in the Mulgrave River,
      supporting substantial longevity but not a typical captive interval of 8 to 11 or an eleven-year
      ceiling. The 10 and 12 upper proposals are extrapolations without longitudinal aquarium data. The
      published 5 to 8 interval is therefore adopted with low confidence; eight is not a demonstrated maximum
      attainable age."

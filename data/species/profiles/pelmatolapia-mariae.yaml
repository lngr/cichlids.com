    tolerance:
      value:
        min: 20
        max: 32
      confidence: "low"
      rationale: "Without a qualified majority, the tally uses the median proposal endpoints: 20 to 31 C before
        widening the upper limit to 32 C to contain the decided natural interval. Confidence is low. FishBase
        and Akvaforum recommend 20 to 25 C, Glaser 20 to 23 C for maintenance, Zoopet 22 to 25 C, Fishkeeper
        24 to 28 C, and the Atlas about 22.2 to 27.8 C. Graffagnino reports breeding at 26.7 C and describes
        warmer spawning conditions. Native measurements support inclusion of 32 C under the containment rule,
        but do not establish years of aquarium health at that endpoint. The much wider 11 to 37 C survival
        envelope and the Ehy field range of 25.5 to 35.8 C are not long-term keeping limits. The upper
        endpoint is uncertain and is not a recommended routine target. Proposals: generator 20 to 28;
        checker-a 22 to 32; checker-b 20 to 32; checker-c 20 to 30; tiebreaker-1 20 to 32; tiebreaker-2 20 to
        30."

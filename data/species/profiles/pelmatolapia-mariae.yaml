  temperatureC:
    value:
      min: 26
      max: 32
    confidence: "medium"
    rationale: "The qualified majority selects 26 to 32 C with four of six votes. Native measurements include 26.4
      to 31 C at Erinle, 26.5 to 27.2 C at Umuaja and 28.3 to 31.4 C at Abraka. Other sampled rivers are
      cooler: lower Ogun monthly means are 25.5 to 28.5 C and Otamiri readings are 24.6 to 28 C. The selected
      interval is a rounded typical warm-water reference, not the full distribution of field readings. Wider
      lagoon evidence remains explicit: Tendo spans 25.3 to 31.8 C and Ehy 25.5 to 35.8 C. The Ehy maximum is
      not adopted as a permanent aquarium setting. FishBase 20 to 25 C is aquarium-derived advice and does not
      override native measurements. Proposals: generator 25 to 28; checker-a 25 to 31; checker-b 26 to 32;
      checker-c 25 to 30; tiebreaker-1 26 to 32; tiebreaker-2 25 to 29."

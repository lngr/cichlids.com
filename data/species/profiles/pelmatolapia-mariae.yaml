    tolerance:
      value:
        min: 0
        max: 12
      confidence: "low"
      rationale: "The qualified majority selects 0 to 12 dKH with five of six votes and low confidence. No read
        source states numerical long-term KH limits. The endpoints are an explicit inference from broad pH and
        GH husbandry advice, successful breeding at pH 7.6, regional low-alkalinity water and ordinary
        tap-water keeping. GH is not converted into KH. The decision is narrower than checker-c 0 to 15 dKH;
        neither its 15 ceiling nor the selected 12 ceiling has a chronic trial behind it. Zero is a rounded
        near-zero-buffering category and does not imply that unstable pH is harmless. The inferred interval
        contains the decided native 1 to 5 dKH. Proposals: generator 0 to 12; checker-a 1 to 12; checker-b 1
        to 12; checker-c 0 to 15; tiebreaker-1 0 to 12; tiebreaker-2 0 to 12."

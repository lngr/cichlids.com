  diet:
    text: "Offer a vegetable-rich staple, suitable plant foods and limited small invertebrate foods for variety.
      Native stomach studies and introduced-population research show plants and algae dominating the diet,
      with smaller animal components. This profile uses omnivore for that flexibility while retaining the
      strong plant emphasis. Adults feed eagerly, so portion size should follow body condition and water
      quality rather than appetite. Overfeeding and a consistently meat-heavy menu are inappropriate. A
      particular protein-induced bloat susceptibility is not established, but the absence of that flag does
      not protect against digestive disease."

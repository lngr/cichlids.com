      rationale: "For one compatible adult pair, proposal medians are 470 L, 155 cm length and 55 cm depth:
        generator 750/200/60, checker-a 400/150/50, checker-b 375/150/50 and checker-c 540/160/60. The Nordic
        specialist register explicitly recommends 540 L and 160 cm, while Zoopet gives 375 L and 150 cm and
        Aquarium Wiki 246 L. The more specific specialist recommendation supports moving slightly above the
        median for this large pair with documented partner attacks. A 60 cm front-to-back depth is an inferred
        turning and retreat allowance, not a published threshold. Fischlexikon's larger 750 L recommendation
        remains cited but does not justify imposing 750 L or the generator's unsourced 200 cm footprint.
        Akvaforum's 400 L is a member-tank average. Graffagnino's 180 US gallon mixed aquarium is an
        observation, not a pair minimum; extra companions require additional room and may still require
        separation."

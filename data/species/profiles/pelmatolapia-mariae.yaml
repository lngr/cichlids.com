  problems:
    text: "Social injury, unsuitable permanent housing and excessive feeding are central preventable problems.
      Persistent hiding or poor feeding can reflect intimidation as well as illness. Check water quality and
      examine the social situation before drawing conclusions from nonspecific symptoms. Plant fragments and
      large food portions increase the waste load, so remove leftovers and maintain filtration. Very weak
      buffering requires attention to pH stability. Broad tolerance does not excuse abrupt changes or poor
      water quality. Quarantine additions, provide adequate space for offspring and never release unwanted
      fish into natural waters."

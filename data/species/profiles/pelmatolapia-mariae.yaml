partners:
  suitable:
    - species: "Synodontis angelicus"
      reason: "A large individual shares the mixed aquarium in Graffagnino's account. Distinct shelter use can
        reduce direct territorial overlap, but does not remove the risk of attack."
      condition: "Only an aquarium substantially larger than the adult-pair minimum, with secure separate refuges
        and immediate separation available; the reported brood is protected by a divider."
  unsuitable:
    - species: "Coptodon zillii"
      reason: "FWS reports wild hybrids with this species under the name Tilapia zillii, citing Taylor, Snyder and
        Courtenay (1986). This crossing evidence conflicts with the empty tallied hybrid-group list and
        warrants caution independently of territorial aggression."
    - species: "Astronotus ocellatus"
      reason: "The Nordic species register reports lethal attacks on full-grown oscars during breeding; comparable
        adult size does not ensure protection."
    - species: "Paracheirodon innesi"
      reason: "A small, easily intimidated fish exposed to severe territorial attacks; very small juveniles also
        fall within the opportunistic fry-predation category."
    - species: "Apistogramma cacatuoides"
      reason: "Its much smaller size and bottom territory leave it vulnerable to a large spotted-tilapia pair."
    - species: "Symphysodon aequifasciatus"
      reason: "Deliberate feeding and sensitivity to prolonged social pressure make it poorly suited to this
        forceful territorial feeder."
profile:
  overview:
    text: "Pelmatolapia mariae combines a striking spotted adult pattern with conspicuous parental behavior. Young
      fish show much stronger vertical bars. The aquarium name Tilapia mariae denotes the same species. This
      is a substantial cichlid of West and Central African coastal waters, and adult males need room to reach
      about 30 cm. Its adaptable feeding and water requirements make basic maintenance manageable, but its
      social behavior requires experience. A compatible pair can injure each other or kill large neighbors,
      particularly during reproduction."
    sources:

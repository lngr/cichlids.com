    rationale: "The Catalog of Fishes and FishBase support this coastal native distribution, including a gap
      between the Pra River in Ghana and Benin. Native field surveys add river, reservoir and lagoon
      localities. The agents describe the same geographical range with different locality lists; the combined
      list retains supported sites. Introduced populations inform feeding and growth evidence but do not
      define native water values."

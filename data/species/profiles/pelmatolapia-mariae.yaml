  habitat:
    text: "The native range follows coastal rivers and lagoons from Ivory Coast to Cameroon, with a distribution
      gap between the Pra River in Ghana and Benin. The species occupies freshwater and brackish settings over
      soft or rocky bottoms, with submerged debris and vegetation. Nigerian and Ivorian studies show
      substantial variation among sites and seasons. The selected freshwater reference is 26 to 32 C, pH 5.3
      to 8.4, GH 1 to 3 dGH and KH 1 to 5 dKH. These intervals describe a planning reference rather than every
      recorded habitat. Ehy lagoon readings reach 35.8 C and native lagoon pH reaches about 9.15; other
      studies report cooler or more acidic water. Such readings do not define permanent aquarium targets. Some
      regional chemistry tables have internal inconsistencies. Freshwater keeping does not require added
      salt."

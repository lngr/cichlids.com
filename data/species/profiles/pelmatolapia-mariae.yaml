  compatibility:
    text: "Mixed keeping is possible only as a closely managed arrangement in an aquarium larger than the pair
      minimum. Graffagnino reports large catfish and other companions, but separates the breeding pair with a
      divider. Other specialist accounts describe attacks severe enough to kill full-grown oscars. Similar
      adult size therefore gives no guarantee of safety. Avoid small, delicate or easily intimidated species,
      and maintain separate refuges and a prompt removal option for any proposed companion. Opportunistic fry
      predation is an additional risk. FWS also reports wild hybrids with redbelly tilapia, Coptodon zillii,
      at Perrine in Florida; this crossing report remains relevant despite the empty hybrid-group vote."
    sources:
      - kind: "literature"

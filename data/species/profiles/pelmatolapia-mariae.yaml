  breeding:
    text: "Both parents defend adhesive eggs deposited on a cleaned firm surface. Stone and wood are common sites,
      and the parents can move eggs or larvae to a prepared depression. Hatching and the onset of free
      swimming depend on temperature; several days pass before larvae feed freely. Brood sizes vary strongly
      with the adults, from small aquarium clutches to thousands of eggs. Offer appropriately small food after
      free swimming begins. A divider may be needed to protect other fish or one parent. A plan for growing
      and placing the offspring is essential because a single brood can require considerable space."

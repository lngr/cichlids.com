  problems:
    text: "Persistent hiding, refusal of food or a fish trapped near the surface can reflect social pressure\
      \ rather than a need for another partner. Check territory layout and separate an adult that cannot retreat\
      \ safely. Overfeeding, crowded fry and neglected filter maintenance can quickly reduce water quality.\
      \ Common freshwater problems such as ich and fin infections remain possible; test the water and seek\
      \ appropriate assessment if disease signs appear. New fish should be observed separately before introduction.\
      \ Avoid abrupt pH or hardness changes, routine salt dosing and attempts to force breeding through heat.\
      \ Fry need protected filter intakes and a planned destination as they grow."
    sources:
    - kind: database
      title: "Seriously Fish: Pelvicachromis pulcher"
      url: "https://www.seriouslyfish.com/species/pelvicachromis-pulcher/"
      accessed: '2026-10-13'

  temperatureC:
    value:
      min: 24
      max: 26
    confidence: medium
    rationale: "The tally fixes 24 to 26 C by qualified majority, five of six votes, using the median endpoints\
      \ of the agreeing proposals. The Nigerian review attributes this field range to Nwadiaro, whose full\
      \ text was unavailable; its abstract supplies no numeric temperatures. Judy measured 24 C at Ndonga and\
      \ the independent ADGP collecting record gives 25.6 C with pulcher present. The regional Ethiope table\
      \ measured 25.8 to 26.4 C and Aubin reports the wider native-stream range 24 to 28 C; these remain visible\
      \ as source statements rather than replacing the tally. A secondary book summary gives 27.5 C without\
      \ a precise original record. The decided range is an incomplete sampled habitat baseline, not an exhaustive\
      \ seasonal or physiological limit. Proposals: generator 24 to 26.4; checker-a 24 to 26; checker-b 24\
      \ to 28; checker-c 24 to 26; tiebreaker-1 24 to 26; tiebreaker-2 24 to 26."

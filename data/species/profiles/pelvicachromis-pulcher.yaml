      url: "https://www.gcca.net/art-pics/cichlid-profiles-list/west-african-cichlids/162-pelvicachromis-pulcher"
      accessed: '2026-10-13'
    - kind: literature
      title: "Hill. Kribensis: The river rainbows. Practical Fishkeeping"
      url: "https://www.practicalfishkeeping.co.uk/features/kribensis-the-river-rainbows/"
      accessed: '2026-10-13'
  socialBehavior:
    text: "Plan for a compatible male and female rather than a collection of unrelated adults. A purchase labelled\
      \ as a pair may only contain two sexes, and one fish can reject the other. Provide an escape route and\
      \ separate a fish that is persistently cornered. Extra females are not a reliable solution because an\
      \ established pair may exclude them. During brood care the defended space spreads beyond the cave as\
      \ the young move to feed. Some wild males use different reproductive tactics, but that does not change\
      \ the ordinary aquarium recommendation. Outside breeding periods, domestic fish often coexist quietly\
      \ with suitable peaceful companions."
    sources:
    - kind: database
      title: "Seriously Fish: Pelvicachromis pulcher"
      url: "https://www.seriouslyfish.com/species/pelvicachromis-pulcher/"
      accessed: '2026-10-13'

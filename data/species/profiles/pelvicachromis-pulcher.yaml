  legacyNames:
  - Pelvicachromis pulcher
  note: Both Pelvicachromis and the original genus Pelmatochromis were queried. The valid name is unchanged.
    The type locality is the junction of the Ethiope and Jamieson rivers in the Niger Delta. The common name
    kribensis does not make the separately valid species Pelvicachromis kribensis a synonym. Aquarium colour
    strains remain forms of this described species; P. sacrimontis is a separate species despite misleading
    trade labels.

  sexing:
    text: "Look at several traits together when choosing adults. The male is usually longer and more slender,\
      \ with more extended tips to the dorsal and anal fins and a less rounded tail outline. The female is\
      \ compact, with a fuller abdomen and shorter fin extensions. Her red to violet belly becomes especially\
      \ conspicuous during courtship, when she bends and displays toward the male. Spots in the fins can occur\
      \ in either sex and are an unreliable shortcut. Domestic colour forms may soften or exaggerate markings.\
      \ Be cautious with unsexed young fish and with unusually large red trade fish that could be the separate\
      \ species Pelvicachromis sacrimontis."

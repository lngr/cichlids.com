      value: 3
    - by: checker-c
      value: 3
    decision: 3
    rationale: "Generator, checker-b and checker-c propose level 3; checker-a proposes level 2. Repeated husbandry\
      \ accounts describe sustained partner rejection and suppression of spare adults around pairing or brood\
      \ care. Level 3 captures the need for retreat and possible separation, while a compatible adult pair\
      \ in the recommended tank is ordinarily manageable. Death with a mismatched pair is not evidence that\
      \ level 4 describes normal maintenance."

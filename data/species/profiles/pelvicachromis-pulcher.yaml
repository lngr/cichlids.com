    - kind: literature
      title: "Ibim and Eziefule (2019). The Pelvicachromis pulcher: A Local Aquarium Species"
      url: "https://doi.org/10.4314/jasem.v23i7.8"
      accessed: '2026-10-13'
  diet:
    text: "Feed small portions that reach the lower part of the tank. A sinking omnivore food containing plant\
      \ ingredients can form the basis, supported by suitable flakes, occasional soft vegetables and modest\
      \ servings of daphnia or Artemia. Natural diet reports include substantial algae, plant remains and detritus,\
      \ so an exclusively rich animal-food menu is a poor match. Small invertebrates remain legitimate parts\
      \ of the diet. Watch each adult eat, since a shy fish can miss food in a busy community. Remove leftovers\
      \ rather than compensating with larger meals. Kribs can also take fry or very small fish and should not\
      \ be expected to protect unrelated young."
    sources:
    - kind: database
      title: "FishBase species summary: Pelvicachromis pulcher"

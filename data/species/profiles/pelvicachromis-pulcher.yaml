  sizeAndGrowth:
    text: "Allow for a male around 10 cm long and a female approaching 8 cm when planning the aquarium. Females\
      \ are usually noticeably smaller and deeper-bodied. Published maximum lengths vary, and a scientific\
      \ record does not mean every domestic adult will reach that size. Young fish need time and consistent\
      \ feeding before body shape and fin development make sexing reliable. A breeder report describes fry\
      \ only a little over 1 cm after two months, illustrating why growth should not be judged from adult trade\
      \ photographs. A lifespan of about five to eight years is a tentative husbandry estimate rather than\
      \ a firmly measured expectation."

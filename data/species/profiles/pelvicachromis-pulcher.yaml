  khDkh:
    value:
      min: 0
      max: 3
    confidence: low
    rationale: "The tally fixes 0 to 3 dKH with low confidence using the rounded median endpoints of the four\
      \ qualifying proposals, rather than a measured species-wide alkalinity envelope. Its internal qualified-majority\
      \ result is recorded in the disagreement rationale; natural KH carries no verification object. Ethiope\
      \ bicarbonate gives 1.83 to 2.98 dKH from Table 3 and 1.83 to 3.21 from the narrative, while Kaizer and\
      \ Osakwe give 0.069 to 0.108 dKH. Illushi regional alkalinity gives the wider 0.224 to 3.249 dKH range;\
      \ Osse gives 0.448 to 2.689 in the abstract, with a lower discussion minimum of 0.336. The 2017 Ethiope\
      \ proxy is still wider at 0.14 to 6.16 dKH and lacks confirmed fish occupancy. These disparate field\
      \ ranges remain evidence, and the rounded upper bound 3 does not encompass every source maximum. Zero\
      \ denotes an unresolved near-zero endpoint. KH is derived only from alkalinity or bicarbonate, never\
      \ from GH or TDS. No readable species-linked field series establishes exact endpoints. Proposals: generator\
      \ 0.05 to 3.3; checker-a 0.5 to 2; checker-b 0.1 to 6.2; checker-c 0.1 to 6.2; tiebreaker-1 0 to 3.3;\
      \ tiebreaker-2 0.2 to 3.3."
    sources:
    - kind: literature
      title: "Omo-Irabor and Olobaniyi (2007). Investigation of the Hydrological Quality of Ethiope River Watershed,\
        \ Southern Nigeria"

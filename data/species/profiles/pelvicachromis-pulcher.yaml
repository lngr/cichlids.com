  breeding:
    text: "A sheltered cave is the centre of spawning, with eggs attached inside it. The female usually handles\
      \ most close care while the male watches the surrounding space; both accompany the young once they emerge.\
      \ Hatching commonly takes two or three days, followed by several more days before the family becomes\
      \ visible outside. Offer newly hatched Artemia or another appropriately small fry food and keep water\
      \ quality steady. Check that the adults still tolerate each other, especially around the next spawn.\
      \ Developmental pH can affect offspring sex ratios, but sources disagree about the direction, so simple\
      \ claims about guaranteed male or female broods are unreliable."
    sources:

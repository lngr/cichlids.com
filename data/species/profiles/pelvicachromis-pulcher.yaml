      \ maintenance choice rather than extending it from isolated hard-water breeding examples. Nominal zero\
      \ means very dilute aquarium water rather than pure water; practical buffering and collection history\
      \ still matter. Confidence remains medium. Proposals: generator 0 to 12; checker-a 0.5 to 12; checker-b\
      \ 0 to 12; checker-c 0.6 to 12."

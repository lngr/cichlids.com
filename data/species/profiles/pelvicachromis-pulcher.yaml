    confidence: high
    rationale: "All four proposals describe the same native coastal West African distribution with different\
      \ regional emphasis and locality lists. Retain the generator's eastern Benin through southern Nigeria\
      \ to western Cameroon wording, including the Catalog type locality at the Ethiope-Jamieson junction,\
      \ the freshwater Sombreiro and Ndonga collecting locality. Checker-a adds the broader Niger Delta wording,\
      \ checker-b emphasizes the same rivers, and checker-c emphasizes the lower Niger and Cross basin. These\
      \ are complementary records rather than separate origins. Introduced populations are excluded and domestic\
      \ trade strains usually lack a collecting locality."

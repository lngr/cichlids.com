  habitat:
    text: "The species comes from coastal river systems extending from eastern Benin across southern Nigeria\
      \ into western Cameroon. Its name-bearing material came from the meeting of the Ethiope and Jamieson\
      \ rivers in the Niger Delta. Freshwater field studies in this region describe acidic, very soft water,\
      \ with strong differences in buffering between sites or studies. These measured ranges are a partial\
      \ picture rather than a map of every population. Vegetated shallows, submerged roots and rock bases around\
      \ sandy feeding areas offer cover. Sources disagree about brackish occurrence, so this profile uses freshwater\
      \ measurements and recommends freshwater maintenance without routine salt addition."

  husbandry:
    text: "Give one compatible pair at least 100 litres with an 80 by 40 cm floor. Build several retreats using\
      \ secure wood, planting and caves, with sightlines broken between them. Fine sand allows normal feeding\
      \ and the small excavations made around a nest. Maintain domestic fish steadily around 25 to 26 C with\
      \ gentle circulation and effective biological filtration. Soft to moderately hard freshwater is practical;\
      \ do not chase the lowest natural readings with abrupt chemical changes. Very weak buffering needs extra\
      \ pH checks. Change part of the water regularly and protect filter intakes if fry appear. A community\
      \ needs more space than the minimum pair aquarium."
    sources:
    - kind: database
      title: "Nordiska Ciklidsallskapet species register: Pelvicachromis pulcher"
      url: "https://www.ciklid.org/artregister/art.php?ID=191"
      accessed: '2026-10-13'

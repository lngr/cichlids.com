  ghDgh:
    value:
      min: 1
      max: 2
    confidence: low
    rationale: "The tally treats all four ranges as unanimous within the 2 dGH agreement threshold, then rounds\
      \ their median endpoints to 1 to 2 dGH. This is narrower than the underlying 0.67 to 1.23 dGH Sombreiro\
      \ hardness reported through Ibim and Eziefule and the proposal envelopes reaching 0.5 to 2. The integer\
      \ lower bound is a vote-rounding artifact, not a measured minimum. Ethiope surface titrations of 25.5\
      \ to 35 mg/L CaCO3 independently give 1.43 to 1.96 dGH, and Kaizer and Osakwe's calcium and magnesium\
      \ endpoints imply about 1.09 to 1.15 dGH. The first study combines field-locality evidence with a regional\
      \ proxy; neither regional survey sampled fish concurrently. Conductivity, TDS and aquarium GH advice\
      \ are not substituted for measured total hardness. Confidence remains low as decided. Proposals: generator\
      \ 0.6 to 2; checker-a 0.5 to 2; checker-b 0.7 to 2; checker-c 0.6 to 2."

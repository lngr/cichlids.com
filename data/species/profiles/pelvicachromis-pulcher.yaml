partners:
  suitable:
  - species: Trigonostigma heteromorpha
    reason: Adult harlequin rasboras use the middle water and share a suitable warm freshwater range.
    condition: Keep a school in a tank at least 100 cm long with refuge beyond the breeding territory; exclude
      tiny juveniles.
  - species: Hyphessobrycon herbertaxelrodi
    reason: Adult black neon tetras are peaceful schooling fish that can stay above the cave territory.
    condition: Use a school in a planted community tank at least 100 cm long and monitor the pair during brood
      care.
  - species: Phenacogrammus interruptus
    reason: Adult Congo tetras are too large for opportunistic fry predation and mainly use the middle and
      upper water.
    condition: A school needs a larger aquarium of at least 120 cm; this is not a companion for the minimum
      pair tank.
  unsuitable:
  - species: Apistogramma cacatuoides
    reason: Another breeding dwarf cichlid competes for the same caves and bottom territory; the minimum krib
      tank cannot offer separate territories.
  - species: Rubricatochromis guttatus
    reason: A breeding jewel cichlid can dominate or injure kribs; husbandry literature advises against mixing
      kribs with jewel cichlids.
  - species: Neolamprologus brichardi
    reason: Its strongly alkaline Lake Tanganyika water and expanding breeding territory are a poor match for
      a soft-water river cichlid.
  - species: Pelvicachromis taeniatus
    reason: Similar adults compete for floor territory. A named hobby warning and close-relationship research
      support a presumed pairwise crossing caution with low confidence.
  - species: Pelvicachromis sacrimontis
    reason: The more robust congener competes for the same shelters. A trade claim of sterile first-generation
      crosses conflicts with the revision's aquarium observations; the retained hybrid caution is weak and
      presumed.
profile:
  overview:
    text: "A pair of kribs makes its home around a shelter near the aquarium floor, then turns that corner\
      \ into a nursery. This small West African cichlid is especially interesting when the female displays\
      \ her bright belly and both adults escort a moving group of young. Pelvicachromis pulcher is the valid\
      \ species behind the familiar names krib and kribensis. Most shop fish descend from domestic strains,\
      \ including an established pale albino form. They are generally approachable first cichlids, provided\
      \ their keeper allows for territorial breeding behaviour. Their adaptability does not remove the need\
      \ for clean water, compatible partners and shelter."
    sources:
    - kind: catalog-of-fishes
      title: "Eschmeyer's Catalog of Fishes: species of Pelvicachromis"
      url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Pelvicachromis"
      accessed: '2026-10-13'

      rationale: "The tally fixes 22 to 28 C by qualified majority, four of six votes, for acclimated domestic\
        \ strains. The breeder sheet explicitly gives this tolerance and the independent Polish species sheet\
        \ and FischLex agree. Seriously Fish, AquaInfo and Hill recommend the narrower central 24 to 27 C interval;\
        \ routine 25 to 26 C maintenance fits that shared guidance. Gussone's 24 plus or minus 1 C laboratory\
        \ holding temperature is a successful condition, not a long-term endpoint experiment. No multiyear\
        \ study at the selected extremes was found; confidence stays medium. Proposals: generator 24 to 27;\
        \ checker-a 24 to 28; checker-b 22 to 28; checker-c 22 to 28; tiebreaker-1 22 to 28; tiebreaker-2 22\

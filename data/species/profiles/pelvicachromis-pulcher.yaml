  ph:
    value:
      min: 5.5
      max: 7
    confidence: medium
    rationale: "The tally fixes 5.5 to 7.0 by qualified majority, four of six votes. The median lower endpoint\
      \ of the agreeing proposals is 5.5, while their upper median rounds to 7.0. Nigerian habitat is reported\
      \ as 5.6 to 6.2, Judy measured 7.0 at Ndonga, and ADGP independently measured 5.4 at Ndonga. The selected\
      \ lower bound is therefore a rounded vote result rather than the lowest reading. The Ethiope surface\
      \ table reaches 5.28 to 5.86 and its narrative 5.44 to 5.86; Kaizer and Osakwe give 5.57 to 6.42. Those\
      \ regional measurements lack a simultaneous fish census. A wider pH 5 to 8 FishBase summary and a secondary\
      \ pH 8 book claim do not identify verified collection-site extrema. Groundwater is excluded. Proposals:\
      \ generator 5.28 to 6.42; checker-a 5.6 to 7; checker-b 5.4 to 7; checker-c 5.4 to 6.9; tiebreaker-1\
      \ 5.28 to 6.2; tiebreaker-2 5.6 to 7."

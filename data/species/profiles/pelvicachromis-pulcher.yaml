  compatibility:
    text: Choose peaceful adult schooling fish that spend much of their time above the floor. Harlequin rasboras
      and black neon tetras are reasonable examples in a larger planted community; Congo tetras require a substantially
      larger tank of their own. Leave a clear retreat beyond the family territory and watch how companions
      respond after spawning. Very small juveniles can be eaten. Other cave-breeding dwarf cichlids and forceful
      jewel cichlids make poor choices for the minimum tank. Bottom catfish may disturb a nest even when otherwise
      compatible. Keeping similar Pelvicachromis species together adds competition and an uncertain crossing
      risk; both curated pairwise groups are presumed cautions. The sacrimontis claim is especially weak because
      the taxonomic revision reports contrary aquarium observations.

  sexing:
    text: "Juvenile appearance rarely gives a secure sex determination. Adult males generally grow
      larger and heavier, often with longer fin extensions and a more pronounced forehead; female
      dorsal markings can be darker. Both sexes change color during reproduction, so brightness
      alone is unreliable. Compare fish of similar age and locality and use observed reproductive
      behavior to strengthen an identification. The legacy sexing question contributes practical
      context but no tested diagnostic method."

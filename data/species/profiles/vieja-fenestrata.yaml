  socialBehavior:
    text: "An observed compatible pair is the recommended adult unit. Another mature pair introduces
      rivalry, and one male plus one female does not necessarily form a stable bond. Conspecific
      aggression is graded 3 because sustained pursuit can cause injury, while a specialist report
      also warns of potentially lethal attacks after failed reproduction. Inspect access to food,
      resting space and refuges, especially during spawning. Keep a practical separation option
      available before aggression escalates. Robust heterospecifics are possible only with
      sufficient independent territories and continued observation."

        9.5. The FAO compilation gives 6.0 to 8.3 and the Papaloapan monitoring study 5.55 to 8.22,
        including affected downstream water. INEGI also records regional field pH outside the
        decision, with marked differences between field and stored-sample results. These
        observations remain evidence and the low pH observations are not all dismissed as pollution.
        Their duration, fish occupancy and representativeness are insufficient to substitute every
        extreme for the typical target. FishBase gives only a lower figure of 7.5, not a complete
        interval. Proposals: generator {\"min\":6.6,\"max\":8.3}; checker-a {\"min\":6,\"max\":8};
        checker-b {\"min\":6.8,\"max\":8.5}; checker-c {\"min\":7,\"max\":8.5}; tiebreaker-1

  diet:
    text: "Make plant-rich prepared food the main ration, with appropriate vegetables and algae-based
      foods for variety. Modest aquatic invertebrate supplements fit the mixed wild diet. The
      omnivore category describes this mixture and does not call for equal plant and animal
      portions. CRC uses a broad herbivorous label; the fuller accounts also document animal foods.
      The special bloat-sensitivity flag is false because a species-specific syndrome is unproven,
      although that does not justify excessive rich feeding. Opportunistic predation on fry and tiny
      fish remains plausible, so the low predation grade does not make small companions safe."

  khDkh:
    value:
      min: 4
      max: 10
    confidence: "low"
    rationale: "The tally uses the median because no qualified majority settles carbonate hardness: the
      six minima have median 3.5 and the six maxima median 9.5, rounded to 4 to 10 dKH. Natural KH
      deliberately carries no verification object. Regional evidence includes Catemaco 4 dKH
      reported secondhand, collecting readings of 5 dKH at Catemaco and dos Canos and 8 dKH at
      Obispo, and a secondary regional range of 5 to 13 dKH. INEGI freshwater bicarbonate subsets
      span 2.66 to 14.78 dKH, wider than the decided median, or 2.8 to 10.2 dKH under the narrower
      site selection. Both wider ranges stay visible; the median represents the competing locality
      selections rather than erasing measured freshwater extremes. Bicarbonate is converted as
      HCO3/61.016 times 2.8 where measured carbonate is zero. GH and conductivity are not
      substitutes for alkalinity. Coatzacoalcos and introduced-population chemistry provide context
      only, and no comprehensive seasonal fish-linked survey establishes these endpoints. Proposals:
      generator {\"min\":4,\"max\":6}; checker-a {\"min\":2,\"max\":7}; checker-b
      {\"min\":4,\"max\":8}; checker-c {\"min\":4,\"max\":13}; tiebreaker-1 {\"min\":3,\"max\":15};
      tiebreaker-2 {\"min\":3,\"max\":11}."

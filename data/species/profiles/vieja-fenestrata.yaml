        describes pursuit beyond territorial boundaries. Together these fit level 3. NCS gives a
        calmer mixed-community account, retained as level-2 evidence, but does not negate individual
        escalation or breeding defense. Routine killing of comparable heterospecific adults is not
        established. Proposals: generator 2; checker-a 3; checker-b 3; checker-c 3."

  problems:
    text: "A juvenile-sized aquarium, insecure heavy decor and an incompatible pair can become major
      problems as these fish mature. Digging changes boundaries and may undermine structures, while
      sustained chasing can prevent feeding even before injuries are obvious. Rich feeding and
      inadequate waste removal can overwhelm filtration; a legacy aquarium account illustrates
      ammonia trouble without establishing a safe stocking minimum. When appetite, breathing or
      behavior changes, check water and access to refuge along with the social arrangement. Broad
      care ranges and absence of a special bloat flag do not establish protection from illness."

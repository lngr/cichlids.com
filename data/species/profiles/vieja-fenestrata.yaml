  compatibility:
    text: "The decided species-only flag is false, but heterospecific aggression is level 3: companions
      need comparable robustness and a tank larger than the pair minimum. The suitable examples are
      conditional husbandry inferences, not documented successful combinations for every named
      species. Tiny fish and delicate slow feeders face predation or territorial stress. Other Vieja
      add resemblance, rivalry and presumed crossing risks. The genus group and the specific
      bifasciata and melanurus groups are all presumed; captive photograph labels and general
      specialist warnings do not establish verified pedigrees or unrestricted partner choice."

    below; former generic combinations are included for identification. Vieja guttulata remains a
    separate valid species despite earlier synonymy. All runs agree on the valid name, author and
    status. The public CRC account confirms the nominal synonyms. Coatzacoalcos distribution
    uncertainty is addressed under origin rather than changing the taxon."

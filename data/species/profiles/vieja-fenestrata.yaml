    - field: "features.feedingSpeed"
      proposals:
        - by: "generator"
          value: "normal"
        - by: "checker-a"
          value: "normal"
        - by: "checker-b"
          value: "hasty"
        - by: "checker-c"
          value: "normal"
      decision: "normal"
      rationale: "Generator, checker-a and checker-c select normal; checker-b selects hasty from an
        avid-feeding collecting account, continuous food-seeking in NVC and complete consumption in
        a forum post. Those observations show willingness to feed but do not establish the rubric
        behavior of rushing and taking all food in a correctly stocked adult aquarium. Normal
        remains provisional because no source measures competitive feeding speed. The alternative
        hasty evidence is retained. Proposals: generator \"normal\"; checker-a \"normal\"; checker-b
        \"hasty\"; checker-c \"normal\"."
    - field: "features.minTank"
      proposals:
        - by: "generator"
          value:
            volumeL: 700
            lengthCm: 200
            depthCm: 60
        - by: "checker-a"
          value:
            volumeL: 270
            lengthCm: 120
            depthCm: 50
        - by: "checker-b"
          value:
            volumeL: 700
            lengthCm: 200
            depthCm: 60
        - by: "checker-c"
          value:
            volumeL: 600
            lengthCm: 200
            depthCm: 60
      decision:
        volumeL: 650
        lengthCm: 200
        depthCm: 60
      rationale: "The component medians are 650 L, 200 cm length and 60 cm depth for a compatible adult
        pair. NCS explicitly recommends 700 L and 200 cm; Fishipedia gives 600 L for mixed keeping,
        placing the median volume between independently stated recommendations. NVC warns that even
        200 cm can constrain some individuals. The smaller Seriously Fish pair recommendation of
        about 205 L and 120 by 45 cm, Guidarium 450 L and 150 cm, Aqua-Fish 500 L and laboratory
        pair tanks of 240 L remain evidence. Small controlled breeding tanks do not settle permanent
        adult housing. Depth 60 cm is an inferred turning and refuge allowance for two large adults,
        not a published measured minimum. Extra tankmates require additional room; the selected
        numbers do not exceed the largest relevant published volume or length. Proposals: generator
        {\"volumeL\":700,\"lengthCm\":200,\"depthCm\":60}; checker-a
        {\"volumeL\":270,\"lengthCm\":120,\"depthCm\":50}; checker-b
        {\"volumeL\":700,\"lengthCm\":200,\"depthCm\":60}; checker-c
        {\"volumeL\":600,\"lengthCm\":200,\"depthCm\":60}."
    - field: "features.lifespanYears"
      proposals:
        - by: "generator"
          value:
            min: 10
            max: 15
        - by: "checker-a"
          value:
            min: 8
            max: 15
        - by: "checker-b"
          value:
            min: 8
            max: 15
        - by: "checker-c"
          value:
            min: 10
            max: 15
      decision:
        min: 9
        max: 15
      rationale: "The endpoint medians are 9 to 15 years. Aqua-Fish lists eight years, Fishipedia fifteen
        and NCS documents a single sixteen-year aquarium male. These observations support a broad
        planning expectation, not a survivorship distribution or a nine-year minimum guarantee. The
        lower endpoint remains inferred and the upper endpoint is below the oldest reported
        individual. Proposals: generator {\"min\":10,\"max\":15}; checker-a {\"min\":8,\"max\":15};
        checker-b {\"min\":8,\"max\":15}; checker-c {\"min\":10,\"max\":15}."
    - field: "features.beginnerSuitability"
      proposals:
        - by: "generator"
          value: "demanding"
        - by: "checker-a"
          value: "moderate"
        - by: "checker-b"
          value: "demanding"
        - by: "checker-c"
          value: "moderate"
      decision: "moderate"
      rationale: "Generator and checker-b select demanding; checker-a and checker-c select moderate.
        Seriously Fish, NCS and the CRC public classification independently support an intermediate
        keeping level. NVC emphasizes experienced management and serious partner risk. Moderate is
        retained for a suitable established pair in the specified large tank because routine feeding
        and reproduction are manageable, while recognizing that recognizing harassment and
        separating fish require preparation. This is not a first small-aquarium recommendation.
        Proposals: generator \"demanding\"; checker-a \"moderate\"; checker-b \"demanding\";
        checker-c \"moderate\"."
    - field: "features.temperatureC.tolerance"
      proposals:
        - by: "generator"
          value:
            min: 22
            max: 30
        - by: "checker-a"
          value:
            min: 22
            max: 30
        - by: "checker-b"
          value:
            min: 23
            max: 30
        - by: "checker-c"
          value:
            min: 22
            max: 30
      decision:
        min: 22
        max: 30
      rationale: "The unanimous tally selects 22 to 30 C and contains the natural 23 to 30 C interval.
        Fishipedia gives 22 to 30 C, Seriously Fish 23 to 30 C, NCS 24 to 30 C with 24 to 28 C
        preferred in its prose, NVC 25 to 28 C and Aqua-Fish 23 to 27 C. The larval-development
        study maintained adults for at least two years at 27 to 29 C; that supports the middle of
        the envelope, not lifetime trials at its endpoints. The lower endpoint has species husbandry
        support rather than being copied from one cold field reading. Proposals: generator
        {\"min\":22,\"max\":30}; checker-a {\"min\":22,\"max\":30}; checker-b
        {\"min\":23,\"max\":30}; checker-c {\"min\":22,\"max\":30}."
    - field: "features.ph.tolerance"
      proposals:
        - by: "generator"
          value:
            min: 6.5
            max: 8.5
        - by: "checker-a"
          value:
            min: 6
            max: 8.5
        - by: "checker-b"
          value:
            min: 6.8
            max: 8.5
        - by: "checker-c"
          value:
            min: 7
            max: 8.5
        - by: "tiebreaker-1"
          value:
            min: 7
            max: 8.5
        - by: "tiebreaker-2"
          value:
            min: 7
            max: 8.5
      decision:
        min: 7
        max: 8.5
      rationale: "The qualified-majority tally selects 7.0 to 8.5. NCS independently recommends both
        endpoints, so equality with the natural target is not a claim inferred solely from habitat
        occupancy. NVC and Atlas recommend 7.0 to 8.0, Aqua-Fish 7.2 to 8.4 and Fishipedia 7.2 to
        8.0; Seriously Fish supplies a single neutral target. Wider source observations include
        mildly acidic Catemaco water and juvenile growth at pH 6.5 during a 30-day experiment. Those
        observations justify retaining uncertainty but do not establish lifelong adult keeping at
        the lower boundaries proposed by the dissenting runs. The selected limits are husbandry
        recommendations rather than physiological failure thresholds. Proposals: generator
        {\"min\":6.5,\"max\":8.5}; checker-a {\"min\":6,\"max\":8.5}; checker-b
        {\"min\":6.8,\"max\":8.5}; checker-c {\"min\":7,\"max\":8.5}; tiebreaker-1
        {\"min\":7,\"max\":8.5}; tiebreaker-2 {\"min\":7,\"max\":8.5}."
    - field: "features.ghDgh.tolerance"
      proposals:
        - by: "generator"
          value:
            min: 3
            max: 20
        - by: "checker-a"
          value:
            min: 2
            max: 20
        - by: "checker-b"
          value:
            min: 3
            max: 20
        - by: "checker-c"
          value:
            min: 2
            max: 20
      decision:
        min: 3
        max: 20
      rationale: "The unanimous tally selects 3 to 20 dGH from proposals whose minima differ by one
        degree. Fishipedia gives 3 to 20 dGH, FishBase 10 to 20 dH, Guidarium 8 to 20 dGH and
        Seriously Fish an upper recommendation of 15 dGH. The wider Aqua-Fish recommendation of 11
        to 23 dGH is retained but does not establish healthy lifelong keeping at 23 dGH. Softer
        native populations make a mandatory hard-water minimum inappropriate. The displayed zero in
        the Seriously Fish range is an unbounded lower display value, not evidence for keeping fish
        for years in mineral-free water. The endpoints lack controlled lifetime evidence and remain
        low-confidence planning limits. Proposals: generator {\"min\":3,\"max\":20}; checker-a
        {\"min\":2,\"max\":20}; checker-b {\"min\":3,\"max\":20}; checker-c {\"min\":2,\"max\":20}."
    - field: "features.khDkh.tolerance"
      proposals:
        - by: "generator"
          value:
            min: 2
            max: 12
        - by: "checker-a"
          value:
            min: 2
            max: 12
        - by: "checker-b"
          value:
            min: 2
            max: 12
        - by: "checker-c"
          value:
            min: 2
            max: 15
        - by: "tiebreaker-1"
          value:
            min: 2
            max: 18
        - by: "tiebreaker-2"
          value:
            min: 2
            max: 12
      decision:
        min: 2
        max: 12
      rationale: "The qualified-majority tally selects the inferred 2 to 12 dKH proposal supported by four
        of six votes; the other proposals are 2 to 15 and 2 to 18 dKH. No read account supplies
        directly tested long-term KH limits. The envelope is derived from neutral to moderately
        alkaline pH advice, the broad GH keeping recommendations and Central American cichlid
        buffering practice, while containing the decided natural 4 to 10 dKH. A Tenixtepec aquarium
        has approximately 9.2 dKH and its introduced habitat approximately 10.1 dKH, conditional on
        the reported mg/L values being expressed as CaCO3. These are points, not lifetime
        experiments. Wider regional bicarbonate measurements of 2.66 to 14.78 dKH and secondary
        collecting reports of 5 to 13 dKH are retained; occurrence alone does not establish
        sustained aquarium health at their upper endpoints. Both selected limits are explicit
        inferences with low confidence. Proposals: generator {\"min\":2,\"max\":12}; checker-a
        {\"min\":2,\"max\":12}; checker-b {\"min\":2,\"max\":12}; checker-c {\"min\":2,\"max\":15};
        tiebreaker-1 {\"min\":2,\"max\":18}; tiebreaker-2 {\"min\":2,\"max\":12}."

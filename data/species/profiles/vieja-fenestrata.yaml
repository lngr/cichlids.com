    tolerance:
      value:
        min: 2
        max: 12
      confidence: "low"
      rationale: "The qualified-majority tally selects the inferred 2 to 12 dKH proposal supported by four
        of six votes; the other proposals are 2 to 15 and 2 to 18 dKH. No read account supplies
        directly tested long-term KH limits. The envelope is derived from neutral to moderately
        alkaline pH advice, the broad GH keeping recommendations and Central American cichlid
        buffering practice, while containing the decided natural 4 to 10 dKH. A Tenixtepec aquarium
        has approximately 9.2 dKH and its introduced habitat approximately 10.1 dKH, conditional on
        the reported mg/L values being expressed as CaCO3. These are points, not lifetime
        experiments. Wider regional bicarbonate measurements of 2.66 to 14.78 dKH and secondary
        collecting reports of 5 to 13 dKH are retained; occurrence alone does not establish
        sustained aquarium health at their upper endpoints. Both selected limits are explicit
        inferences with low confidence. Proposals: generator {\"min\":2,\"max\":12}; checker-a
        {\"min\":2,\"max\":12}; checker-b {\"min\":2,\"max\":12}; checker-c {\"min\":2,\"max\":15};
        tiebreaker-1 {\"min\":2,\"max\":18}; tiebreaker-2 {\"min\":2,\"max\":12}."

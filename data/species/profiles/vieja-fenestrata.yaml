  habitat:
    text: "Its secure core includes the Papaloapan system, Lake Catemaco and Veracruz coastal rivers
      north toward Chachalacas. Lake margins, soft substrates, vegetation and submerged structures
      provide foraging and shelter, with some populations also using river channels. Catemaco is
      native habitat with productive, frequently mixed water. Its 2016 survey recorded 22 to 30 C
      across depths, surface pH 6.6 to 9.0 and bottom pH down to 6.3; other surveys report pH 6.0 to
      9.4 and a thesis summary reaches 9.5. These variable observations remain distinct from the
      typical freshwater target of 23 to 30 C and pH 7.0 to 8.5. The provisional hardness target is
      3 to 11 dGH and buffering target 4 to 10 dKH. Regional freshwater bicarbonate measurements
      span a wider 2.66 to 14.78 dKH, with incomplete fish-site linkage. Coatzacoalcos native status
      is disputed, while Tenixtepec and Santa Agueda populations are reported as introduced.
      Brackish and marine occurrences are acknowledged by the Catalog and CRC but do not define a
      freshwater aquarium target."

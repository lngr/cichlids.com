    value:
      volumeL: 650
      lengthCm: 200
      depthCm: 60
    confidence: "medium"
    rationale: "The component medians are 650 L, 200 cm length and 60 cm depth for a compatible adult
      pair. NCS explicitly recommends 700 L and 200 cm; Fishipedia gives 600 L for mixed keeping,
      placing the median volume between independently stated recommendations. NVC warns that even
      200 cm can constrain some individuals. The smaller Seriously Fish pair recommendation of about
      205 L and 120 by 45 cm, Guidarium 450 L and 150 cm, Aqua-Fish 500 L and laboratory pair tanks
      of 240 L remain evidence. Small controlled breeding tanks do not settle permanent adult
      housing. Depth 60 cm is an inferred turning and refuge allowance for two large adults, not a
      published measured minimum. Extra tankmates require additional room; the selected numbers do
      not exceed the largest relevant published volume or length. Proposals: generator
      {\"volumeL\":700,\"lengthCm\":200,\"depthCm\":60}; checker-a

  breeding:
    text: "Pairs attach eggs to a prepared firm surface and protect their developing offspring. Rocks
      and wood provide options, with adjacent loose substrate for excavation and room for a parent
      to withdraw. Laboratory observations found hatching after 58 to 60 hours under warm controlled
      conditions, consistent with the roughly two to three days reported in hobby accounts. Timing
      varies with conditions and the accounts differ in the interval before free swimming. Offer
      appropriately small food once the fry begin feeding independently. Repeated spawning can
      change the parents' tolerance of their brood and each other, making separate growing space and
      a divider useful."

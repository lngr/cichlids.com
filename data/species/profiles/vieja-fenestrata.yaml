variants:
  - name: "Catemaco pale form"
    kind: "color-morph"
    note: "NCS reports a naturally occurring yellow-white or pink form alongside normally coloured fish
      in Lake Catemaco; keep locality records."
  - name: "Marbled"
    kind: "color-morph"
    note: "Listed as an aquarium breeding form by NCS; marbling does not by itself verify pure ancestry."
features:
  origin:
    value:
      continent: "Central America"
      region: "Atlantic slope of Veracruz and adjacent Oaxaca, Mexico, chiefly the Papaloapan basin and
        coastal rivers north toward Chachalacas"
      waterbody: null
      localities:
        - "Rio de la Lana"
        - "Rio Papaloapan"
        - "Lake Catemaco"
        - "Rio Jamapa"
        - "Rio La Antigua"
        - "Rio Actopan"
        - "Chachalacas basin"
    confidence: "medium"
    rationale: "Central America is retained as the aquarium biogeographic category for this southern
      Mexican cichlid; geographically Mexico belongs to North America, as the Catalog and FishBase
      state. Papaloapan and the Veracruz coastal drainages are the secure core. NCS lists Macaya in
      the Coatzacoalcos basin as probably introduced and NVC questions the eastern boundary, whereas
      Atlas includes Coatzacoalcos. That drainage remains disputed context and does not determine
      the natural chemistry. Introduced Tenixtepec and Santa Agueda fish likewise do not define
      native endpoints."

  husbandry:
    text: "For a compatible adult pair, start with the decided minimum of 650 litres, 200 cm length and
      60 cm front-to-back depth. NCS recommends 700 litres at that length, and individual pairs may
      still require more space or separation. Arrange secure wood and stone so that both fish have
      sheltered routes and cannot be trapped behind one refuge. Place heavy structures securely
      before the fish excavate around them. Sand or fine substrate accommodates digging, while
      plants may become food or be uprooted. Effective filtration, surface exchange, regular waste
      removal and water testing support a stable environment. The broad tolerances are 22 to 30 C,
      pH 7.0 to 8.5, 3 to 20 dGH and an inferred 2 to 12 dKH; their endpoints are not proven failure
      boundaries."

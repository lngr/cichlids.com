  ph:
    value:
      min: 7
      max: 8.5
    confidence: "medium"
    rationale: "The qualified-majority tally selects pH 7.0 to 8.5 from five agreeing votes out of six
      under the pipeline agreement threshold. CNA annual means give 7.1 to 7.8 in the Papaloapan and
      7.25 to 8.5 in Catemaco. This is a rounded typical freshwater target, not the full measured
      distribution. Wider source ranges include Catemaco surface pH 6.6 to 9.0 with bottom readings
      to 6.3, a phytoplankton survey at 6.0 to 9.4 and a thesis summary at 8.0 to 9.5. The FAO
      compilation gives 6.0 to 8.3 and the Papaloapan monitoring study 5.55 to 8.22, including
      affected downstream water. INEGI also records regional field pH outside the decision, with
      marked differences between field and stored-sample results. These observations remain evidence
      and the low pH observations are not all dismissed as pollution. Their duration, fish occupancy
      and representativeness are insufficient to substitute every extreme for the typical target.
      FishBase gives only a lower figure of 7.5, not a complete interval. Proposals: generator
      {\"min\":6.6,\"max\":8.3}; checker-a {\"min\":6,\"max\":8}; checker-b
      {\"min\":6.8,\"max\":8.5}; checker-c {\"min\":7,\"max\":8.5}; tiebreaker-1
      {\"min\":7,\"max\":8.5}; tiebreaker-2 {\"min\":7,\"max\":8.5}."

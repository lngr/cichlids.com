    rationale: "Three runs select level 3 and checker-b level 4. Seriously Fish describes serious mate
      harassment requiring intervention and NCS excludes rival mature pairs, fitting persistent
      chasing and injury risk. Beerlink reports possible lethal aggression after failed breeding,
      retained as evidence for level 4. Because the rubric describes an established suitable social
      unit with adequate space and cover, that conditional mortality warning does not establish
      routine lethal behavior in every suitable pair. Safe refuges and provision for separation
      remain necessary; the Aqua-Fish peaceful account is outweighed by the specialist warnings.
      Proposals: generator 3; checker-a 3; checker-b 4; checker-c 3."

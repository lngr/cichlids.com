      rationale: "Central America is retained as the aquarium biogeographic category for this southern
        Mexican cichlid; geographically Mexico belongs to North America, as the Catalog and FishBase
        state. Papaloapan and the Veracruz coastal drainages are the secure core. NCS lists Macaya
        in the Coatzacoalcos basin as probably introduced and NVC questions the eastern boundary,
        whereas Atlas includes Coatzacoalcos. That drainage remains disputed context and does not
        determine the natural chemistry. Introduced Tenixtepec and Santa Agueda fish likewise do not
        define native endpoints."

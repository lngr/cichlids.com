  ghDgh:
    value:
      min: 3
      max: 11
    confidence: "low"
    rationale: "The qualified-majority tally selects 3 to 11 dGH from five agreeing votes out of six. A
      secondary Catemaco collecting record gives 3 dGH; direct collecting observations give 4 dGH
      there and in dos Canos, widened regionally to 11 dGH in Obispo. Papaloapan monitoring means
      are about 7.5 and 8.2 dGH. INEGI freshwater river subsets support approximately 3.33 to 11.72
      dGH, wider at the upper end than the decision, while a more restricted main-channel subset
      gives 3.6 to 8.9 dGH. Those locality-linked measurements outweigh FishBase environment data of
      10 to 20 dH without a traceable site series. The lower-trust river compilation gives only 5 to
      6 dGH. The wider Coatzacoalcos regional ion span of 0.8 to 18.1 dGH, statewide Oaxaca extremes
      and introduced populations remain evidence but do not define native endpoints. Hardness is
      converted from CaCO3 at 17.848 mg/L per dGH, never from conductivity; incomplete fish-site
      linkage and secondary records keep confidence low. Proposals: generator {\"min\":5,\"max\":6};
      checker-a {\"min\":2,\"max\":9}; checker-b {\"min\":4,\"max\":11}; checker-c
      {\"min\":3,\"max\":11}; tiebreaker-1 {\"min\":3,\"max\":12}; tiebreaker-2
      {\"min\":3,\"max\":9}."

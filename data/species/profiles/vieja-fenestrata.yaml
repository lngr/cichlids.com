partners:
  suitable:
    - species: "Rocio octofasciata"
      reason: "A comparatively robust Central American cichlid with an overlapping keeping envelope;
        proposed rather than a source-documented pair."
      condition: "A substantially larger tank than the pair minimum, distinct territories and immediate
        separation if harassment persists."
    - species: "Cincelichthys pearsei"
      reason: "A large plant-biased cichlid with broadly compatible feeding needs; its calmer behaviour
        makes shelter and observation essential."
      condition: "A very large aquarium with adequate turning room for both species and no trapped
        subordinate fish."
    - species: "Pterygoplichthys gibbiceps"
      reason: "A large armoured catfish is a possible companion outside the cichlid nesting area; this is
        a conditional husbandry inference."
      condition: "A much larger footprint for the catfish adult size, separate refuge and supplementary
        feeding."
  unsuitable:
    - species: "Paracheirodon innesi"
      reason: "Fry and tiny juveniles may be prey; adults remain unsuitable because they cannot cope with
        territorial pressure from this large cichlid."
    - species: "Symphysodon aequifasciatus"
      reason: "A delicate and slower-feeding fish is a poor match for territorial competition and
        disturbance."
    - species: "Vieja melanurus"
      reason: "Presumed hybrid risk in two curated groups, together with similar appearance and
        territorial rivalry."
    - species: "Vieja bifasciata"
      reason: "Both the genus group and a specific presumed crossing group warn of unwanted hybrid
        offspring."
profile:
  overview:
    text: "Vieja fenestrata is a substantial southern Mexican cichlid whose changing colors and parental
      behavior reward a spacious aquarium. Plants and detritus dominate its mixed feeding, while
      adult pairs can make considerable demands on each other and their neighbors. The accepted name
      refers to the Atlantic Veracruz species; the Pacific-slope Vieja guttulata is currently
      separate. Pale Catemaco fish and marbled aquarium forms require locality and ancestry records
      rather than identification by color alone."

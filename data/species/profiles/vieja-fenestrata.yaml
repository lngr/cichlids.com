  temperatureC:
    value:
      min: 23
      max: 30
    confidence: "medium"
    rationale: "The unanimous tally combines proposals differing by one degree and selects 23 to 30 C.
      Catemaco surface temperatures in the 2016 microbial-web study span 23 to 30 C; the wider
      all-depth source range is 22 to 30 C, including a cool bottom observation. FAO also reports
      the wider Papaloapan envelope of 22 to 30 C. Annual lake means of 25.3 to 28.6 C cannot
      establish seasonal endpoints. Regional readings of 17 to 34 C and an isolated collecting value
      near 32 C are retained as context, without turning every cold station or hot excursion into a
      routine ideal. No named waterbody table applies. Proposals: generator {\"min\":22,\"max\":30};
      checker-a {\"min\":23,\"max\":30}; checker-b {\"min\":23,\"max\":30}; checker-c
      {\"min\":22,\"max\":30}."

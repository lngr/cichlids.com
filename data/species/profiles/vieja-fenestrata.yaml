  sizeAndGrowth:
    text: "The planning maxima are 32.5 cm for males and 25 cm for females. They combine differing
      reports and length conventions, so they should be treated as approximate expectations rather
      than precise limits. Standard length excludes the tail; a published 25 or 30 cm SL is not
      directly comparable with aquarium total length. Exceptionally old males reported at 40 to 41
      cm are outside the typical values. Provide adult space while fish are still small; the sources
      do not establish a dependable month-by-month adult growth schedule."

    tolerance:
      value:
        min: 7
        max: 8.5
      confidence: "medium"
      rationale: "The qualified-majority tally selects 7.0 to 8.5. NCS independently recommends both
        endpoints, so equality with the natural target is not a claim inferred solely from habitat
        occupancy. NVC and Atlas recommend 7.0 to 8.0, Aqua-Fish 7.2 to 8.4 and Fishipedia 7.2 to
        8.0; Seriously Fish supplies a single neutral target. Wider source observations include
        mildly acidic Catemaco water and juvenile growth at pH 6.5 during a 30-day experiment. Those
        observations justify retaining uncertainty but do not establish lifelong adult keeping at
        the lower boundaries proposed by the dissenting runs. The selected limits are husbandry
        recommendations rather than physiological failure thresholds. Proposals: generator
        {\"min\":6.5,\"max\":8.5}; checker-a {\"min\":6,\"max\":8.5}; checker-b
        {\"min\":6.8,\"max\":8.5}; checker-c {\"min\":7,\"max\":8.5}; tiebreaker-1
        {\"min\":7,\"max\":8.5}; tiebreaker-2 {\"min\":7,\"max\":8.5}."

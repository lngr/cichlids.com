    tolerance:
      value:
        min: 0
        max: 15
      confidence: medium
      rationale: "The tally unanimously decides 0 to 15 dGH with medium confidence. Generator and checker-a propose\
        \ 0.2 to 15, while checker-b and checker-c propose 0 to 15. Seriously Fish gives 1 to 15 and the Danish\
        \ breeder reports successful keeping and reproduction at 15. The lower endpoint contains very dilute habitat\
        \ water and denotes the near-zero measurement class, not a recommendation for unmineralized pure water.\
        \ Maidenhead and FishBase stop at 12, while the wider Aquarium Industries range of approximately 5.6 to\
        \ 16.8 dGH and Fishtopia's 5 to 20 dGH remain evidence. Their higher endpoints have less independent long-term\
        \ support than 15. The Krib and other forum experiences show that some stocks reproduce more reliably in\
        \ softer water; tolerance does not guarantee equal breeding performance throughout the interval."

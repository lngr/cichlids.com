  khDkh:
    value:
      min: 0
      max: 1
    confidence: low
    rationale: "The tally decides 0 to 1 dKH with low confidence; natural KH carries no verification object. Generator\
      \ proposes 0.2 to 1, checker-a 0.2 to 1.5 and checker-b and checker-c 0 to 1. INTEGEMS regional alkalinity\
      \ of 8 to 18 mg/L as CaCO3 converts to about 0.45 to 1.01 dKH. FAO Jong bicarbonate of 5.8 to 16.5 mg/L gives\
      \ about 0.27 to 0.76 dKH using HCO3/21.8, and ESIA surface-water bicarbonate gives about 0.28 to 0.64 dKH.\
      \ The rounded envelope represents weak buffering and regional variation rather than measured zero alkalinity.\
      \ The checkers' Mattru Jong bicarbonate-derived value of about 0.31 dKH is consistent, but its numerical table\
      \ cells are unavailable in the readable extraction. Their literal alkalinity conversion spans 0.056 to 22.97\
      \ dKH; the high value conflicts with bicarbonate and conductivity and is retained only as disputed evidence.\
      \ The biotope estimate of 1.1 dKH and conductivity-derived estimates up to 1.5 dKH are weaker than measured\
      \ alkalinity. Barrie's ambiguously labelled calcium-carbonate parameter would imply 1.4 to 6.2 dKH only if\
      \ it were alkalinity, which the text does not establish. Groundwater in the hydrological assessment is not\
      \ fish-habitat water. No direct KH series accompanies identified thomasi at the collecting sites."
    sources:
    - kind: literature
      title: "Vanden Bossche and Bernacsek (1990). Source book for the inland fishery resources of Africa, volume\

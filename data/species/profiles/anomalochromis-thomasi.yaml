  note: "The Catalog of Fishes accepts Anomalochromis thomasi (Boulenger, 1915), originally described as Paratilapia\
    \ thomasi from Maka in Sierra Leone. The Pelmatochromis genus query contains no separate thomasi record; the\
    \ historical combinations are independently listed by husbandry and association sources. Both legacy entries\
    \ therefore belong to this profile. Imported geographic forms have uncertain boundaries, but the taxonomic catalog\
    \ recognizes one accepted Anomalochromis species."
names:
  trade:
    en:
    - African butterfly cichlid
    - Dwarf jewel cichlid
variants:
- name: Sierra Leone form
  kind: locality
  note: Classical aquarium form with a rounded flank blotch and a violet sheen; locality labels do not prove collection
    origin.
- name: Guinea form
  kind: locality
  note: Imported form with a more oval flank blotch and stronger dark markings; possible taxonomic differences remain
    unresolved.
- name: Gold
  kind: color-morph
  note: Photographically labelled in the Nordic association register; origin and inheritance are not established
    by the read text.
features:
  origin:
    value:
      continent: Africa
      region: "Upper Guinean coastal drainages of Guinea, Sierra Leone and western Liberia"
      waterbody: null
      localities:
      - Konkoure drainage
      - Rokel/Seli drainage
      - Moa drainage
      - Mano drainage
      - Sewa drainage
      - Saint John drainage
      - Soukou River
      - Samatou
      - Maferenya area
      - Dixinn area
    confidence: high
    rationale: "The accepted species occupies Upper Guinean coastal freshwaters in Guinea, Sierra Leone and western\
      \ Liberia. FishBase bounds the distribution by the Konkoure and Saint John drainages, while Guinea collecting\
      \ reports identify occupied sites at Soukou, Samatou, Maferenya and toward Dixinn. The proposals differ in\
      \ their selection of localities rather than in the three-country range. The Nigerian locality in the my-fish\
      \ heading conflicts with its own habitat account and the stronger distribution evidence and is excluded. CRC's\
      \ river-pool category agrees with collecting reports; its broad lake-margin teaser describes only part of\
      \ the habitat variety."

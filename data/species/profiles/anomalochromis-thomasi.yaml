  temperatureC:
    value:
      min: 23
      max: 30
    confidence: low
    rationale: "The tally decides 23 to 30 C by the median method, with low confidence, rather than by a qualified\
      \ majority. Generator proposes 23 to 28 C; checker-a and checker-b each propose 24 to 30 C; checker-c, tiebreaker-1\
      \ and tiebreaker-2 each propose 22.8 to 30 C. The median lower endpoint is 22.9 C before the tally's whole-degree\
      \ rounding to 23 C. Stuchlik records the species at Soukou at 22.8 C and at other Guinea sites at 26.7, 28.7\
      \ and 30 C, supporting this rounded envelope. These are site observations rather than long-term thermal limits.\
      \ The wider regional Rokel/Seli range of 21 to 32 C and FAO Jong readings of 28 to 34 C include main-channel\
      \ or upland conditions without equivalent species occupancy. They remain evidence but do not extend the typical\
      \ habitat range. The narrower FishBase header of 23 to 27 C cites aquarium literature; its habitat narrative\
      \ separately supports approximately 30 C in the dry season."

  sizeAndGrowth:
    text: "Use about 8 cm for an adult male and 6 cm for a female when planning stocking. Published maxima vary\
      \ with population and length convention, and some accounts give larger fish. Juveniles develop gradually and\
      \ can appear much less colourful than adults. An aquarium lifespan around four to five years is an approximate\
      \ expectation supported by care accounts rather than age-validated research."

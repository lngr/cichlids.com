  maxSizeCm:
    value:
      male: 8
      female: 6
    confidence: medium
    rationale: "All four full-profile proposals are 8 cm for males and 6 cm for females, so their medians are 8\
      \ and 6. Loiselle explicitly prints those sex-specific aquarium sizes; Seriously Fish gives an unsexed 8 cm\
      \ SL, and the Nordic account gives 8 cm with females 1 to 2 cm smaller. FishBase reports 5 cm SL and 6.5 cm\
      \ TL, Maidenhead 6.5 cm, Aqua-Fish 4 to 5 cm, the Danish breeder 9 and 7 cm, and Tropical Freshwater Fish\
      \ 10 and 7 cm. These differences involve populations, length conventions and occasional larger adults. The\
      \ decided values describe typical aquarium planning maxima rather than record fish; confidence remains medium\
      \ because sex-specific lengths are not standardized across sources."

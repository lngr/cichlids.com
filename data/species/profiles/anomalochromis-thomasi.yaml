    tolerance:
      value:
        min: 0
        max: 8
      confidence: low
      rationale: "The tally unanimously decides 0 to 8 dKH with low confidence under its two-degree agreement threshold.\
        \ Generator, checker-b and checker-c propose 0 to 8; checker-a proposes 0.2 to 10. Aquariumz gives 4 to\
        \ 8 and the Italian synthesis 2 to 8, both without controlled long-term observations. The lower endpoint\
        \ is extended to include native weak buffering. Seriously Fish gives pH and GH advice but no explicit KH\
        \ limit, so the entries derived from that source are inferences rather than KH measurements. The wider 0.2\
        \ to 10 proposal is similarly inferred. Flowgrow also displays a carbonate-hardness field of 0 to 30 with\
        \ a dGH unit label; this unusually broad, ambiguously labelled entry is retained as evidence rather than\
        \ accepted as an established KH limit. The selected envelope combines habitat alkalinity with keeping practice\
        \ across mildly acidic and alkaline water. Neither near zero nor 8 dKH is a tested physiological boundary,\
        \ and suitable pH and stability remain necessary."

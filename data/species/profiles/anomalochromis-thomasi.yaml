  sexing:
    text: "Compare mature fish of the same form: males usually become larger, while a female carrying eggs has a\
      \ fuller abdomen. Fin extension and dark markings can help but vary with condition and population. Juveniles\
      \ are difficult to sex reliably. Observing a functioning pair gives better evidence of compatibility than\
      \ assuming that two fish sold as opposite sexes will accept one another."

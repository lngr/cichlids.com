  diet:
    text: "Feed varied small prepared foods containing both animal and plant ingredients, supplemented with aquatic\
      \ invertebrates such as Artemia, Daphnia and insect larvae. This substrate picker can lose food to faster\
      \ companions, so check that both adults receive a share. Eggs, fry and very small fish can be eaten opportunistically.\
      \ Its mixed diet does not require live fish or a specialized low-protein feeding regime."

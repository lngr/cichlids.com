    tolerance:
      value:
        min: 5.4
        max: 8
      confidence: medium
      rationale: "The tally's qualified majority decides pH 5.4 to 8.0 with medium confidence. Generator and both\
        \ tiebreakers propose 5.4 to 8, checker-a and checker-c 5.5 to 8, and checker-b 5.4 to 7.5. Seriously Fish\
        \ recommends 5.5 to 7.5 and reports breeding on either side of neutral; FishBase, the Nordic register and\
        \ Aqua-Fish support the upper endpoint of 8. The lower endpoint expands by 0.1 to contain the natural range.\
        \ The Danish breeder records keeping and reproduction at 7.5 and 15 dGH. Narrower advice from Maidenhead,\
        \ Loiselle and the Victorian society remains evidence. Aquarium Industries recommends 5 to 6.5, extending\
        \ farther into acidity than the decision, but does not document lifelong results at 5; that endpoint has\
        \ insufficient independent support. Forum success and contrary advice at similar alkaline, moderately hard\
        \ conditions show population and husbandry variation rather than a universal requirement for strongly acidic\
        \ water."

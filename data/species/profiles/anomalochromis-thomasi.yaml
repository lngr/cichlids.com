partners:
  suitable:
  - species: Hyphessobrycon pulchripinnis
    reason: A peaceful adult midwater characin is a plausible companion without occupying the spawning surface.
    condition: Inferred example from the recommended characin group. Provide a proper shoal and extra community
      space with overlapping water needs; fry remain at risk.
  - species: Nannostomus beckfordi
    reason: Quiet upper-water behaviour can reduce competition for the bottom territory.
    condition: Inferred example from the recommended characin group. Use adult fish in a suitable shoal with sufficient
      space and shared water conditions.
  - species: Trichogaster chuna
    reason: A calm small gourami can use a different part of a planted aquarium.
    condition: "Inferred example from the recommended small anabantoids. Provide extra space and distinct retreats,\
      \ and ensure both species can feed."
  unsuitable:
  - species: Hemichromis fasciatus
    reason: "Adult size, predation and strong territorial behaviour create a substantial mismatch."
  - species: Melanochromis auratus
    reason: Forceful territorial behaviour and feeding competition threaten this mild substrate feeder.
  - species: Cyphotilapia frontosa
    reason: "A large predatory adult can treat this dwarf cichlid as prey, and its strongly alkaline lake setting\
      \ is a poor habitat match."
profile:
  overview:
    text: "A compatible pair of Anomalochromis thomasi suits a calm planted aquarium. Adults develop reflective\
      \ scales and changeable dark markings, and both parents tend the brood. The name dwarf jewel does not imply\
      \ the temperament of larger jewel cichlids. Imported geographic forms vary, and locality labels alone do not\
      \ resolve their identity."

  compatibility:
    text: Choose gentle adult companions with overlapping water needs and enough room beyond the breeding site.
      Peaceful characins or small anabantoids can work; the suggested partners are examples inferred from those
      groups rather than tested pairings. Allow for slow feeding and occasional brood defence. Very small fish and
      young shrimp can become food. Large predators and forceful territorial cichlids present unsuitable size or
      behaviour mismatches.

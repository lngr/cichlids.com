  ghDgh:
    value:
      min: 0
      max: 1
    confidence: low
    rationale: "The tally's qualified majority decides 0 to 1 dGH with low confidence. Generator proposes 0.2 to\
      \ 4, checker-a 0.2 to 1.5, checker-b and checker-c 0 to 1, tiebreaker-1 0 to 4 and tiebreaker-2 0 to 1. INTEGEMS\
      \ measures regional river hardness of 5 to 12 mg/L as CaCO3, about 0.28 to 0.67 dGH. FAO Jong calcium and\
      \ magnesium give about 0.22 to 0.44 dGH using Ca/7.14 + Mg/4.34. The Mattru Jong river values retained from\
      \ the checkers are 4 to 6 mg/L as CaCO3, about 0.22 to 0.34 dGH; numerical table cells are absent from the\
      \ available full-text extraction, limiting independent confirmation. Zero is a coarse lower class boundary\
      \ for extremely dilute water, not a measured absence of minerals. Conductivities of 6 to 22 microsiemens/cm\
      \ at occupied Guinea sites corroborate dilution but cannot be converted directly to GH. The wider regional\
      \ SL 76 stream range of 0.5 to 4 dGH, the Liberian proxy of about 1.1 dGH, and the biotope page's 3.9 dGH\
      \ estimate remain evidence; they do not establish typical occupied-site hardness. The latter conflicts with\
      \ its listed conductivity of 15 microsiemens/cm. ESIA ion-derived values of about 2.6 to 7.3 dGH also conflict\
      \ with its conductivity and TDS and are not used to set the target. FishBase's 5 to 12 dH is unlocalized and\
      \ is not substituted for regional field chemistry."
    sources:
    - kind: literature
      title: "Vanden Bossche and Bernacsek (1990). Source book for the inland fishery resources of Africa, volume\

  habitat:
    text: "This species occupies coastal freshwaters from Guinea through Sierra Leone to western Liberia, including\
      \ forest streams, river pools and shallow wetland or reservoir margins. Fine sediment, shaded banks and submerged\
      \ cover are common. Guinea sites with the fish present measure 22.8 to 30 C and pH 5.63 to 6.32. Regional\
      \ chemistry supports extremely soft, weakly buffered water, although GH and KH series at identified collecting\
      \ sites are lacking. Regional Jong main-channel readings reach 34 C; these do not establish a typical habitat\
      \ temperature for this species."

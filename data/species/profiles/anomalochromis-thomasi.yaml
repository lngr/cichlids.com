  predation:
    value: 1
    confidence: low
    rationale: "The tally's qualified majority decides level 1, with low confidence: generator, checker-b, checker-c,\
      \ tiebreaker-1 and tiebreaker-2 propose 1, while checker-a proposes 0. Loiselle includes this species in an\
      \ account warning that fish shorter than about 1.9 cm can be eaten. A retailer also lists small fish as food,\
      \ and breeding discussions describe repeated consumption of free-swimming offspring. These observations support\
      \ opportunistic fry and very-small-fish predation, although brood cannibalism alone would not establish hunting\
      \ of other species. The peaceful community recommendations and Aquario's non-predatory label are retained\
      \ as dissenting evidence; they do not establish safety for fry. CRC describes omnivorous substrate picking\
      \ rather than regular piscivory. The rubric's approximately 2 cm category is a planning threshold, not an\
      \ experimentally measured maximum prey size for this fish."

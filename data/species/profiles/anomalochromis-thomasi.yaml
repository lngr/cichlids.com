  aggressionConspecific:
    value: 1
    confidence: medium
    rationale: "Generator and checker-a propose level 1; checker-b and checker-c propose 2. The decided social unit\
      \ is one established compatible adult pair, and accounts emphasize a stable bond with occasional disputes\
      \ rather than a lasting dominance hierarchy within that pair. Level 1 therefore describes its usual displays\
      \ and short chases. The level-2 evidence remains relevant to exclusion of additional adults during breeding\
      \ and to unsuccessful pairings. Reports that surplus fish need removal do not require every compatible pair\
      \ to receive that score. Persistent pursuit or failure to feed indicates an unsuitable pairing or arrangement\
      \ rather than the expected behaviour at the recommended stocking unit."

  problems:
    text: "A fish that hides continuously or misses meals may lack cover or face social exclusion. Check water quality,\
      \ access to food and the behaviour of companions before changing the stock. Very soft water can drift in pH,\
      \ and abrupt adjustments add stress. Brood loss alone does not identify a disease or prove unsuitable chemistry.\
      \ Observe new arrivals separately and investigate appetite loss, rapid breathing or injury before choosing\
      \ treatment."

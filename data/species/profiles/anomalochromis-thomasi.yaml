  husbandry:
    text: Provide one compatible pair with at least 80 L and an 80 by 30 cm base. Break sight lines with wood and
      planting while leaving accessible feeding patches. Fine sand and several flat surfaces offer resting and spawning
      choices. A routine temperature around 24 to 26 C lies within the commonly recommended keeping band. Use effective
      filtration with gentle circulation and regular partial water changes. Weak buffering calls for monitoring
      of pH stability.

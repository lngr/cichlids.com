  socialBehavior:
    text: "The minimum adult unit is an established pair. A larger loose group can also work, and raising juveniles\
      \ together allows partner selection, but surplus adults can be excluded when breeding begins. The pair usually\
      \ shows mild disputes within itself and chases intruders from the spawning area. Persistent pursuit, damaged\
      \ fins or inability to feed require reassessment of the pairing, cover and available space."

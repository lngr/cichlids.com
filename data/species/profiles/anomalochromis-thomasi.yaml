    tolerance:
      value:
        min: 22
        max: 30
      confidence: medium
      rationale: "The tally's qualified majority decides 22 to 30 C with medium confidence. Generator proposes 22\
        \ to 28, checker-a 21 to 30, checker-b 23 to 30, and checker-c, tiebreaker-1 and tiebreaker-2 each 22 to\
        \ 30 C. Loiselle explicitly prints 22 to 30 C for aquarium maintenance, and it contains the decided natural\
        \ range. Seriously Fish, Maidenhead, FishBase and the Victorian society give the narrower 23 to 27 C; AquaInfo\
        \ gives 23 to 28 in its main section and 22 to 28 in its conclusion. These recommendations are preferred\
        \ keeping targets rather than demonstrated damage thresholds. Flowgrow's wider 21 to 30 C remains evidence,\
        \ but its isolated lower endpoint lacks stronger long-term support. The upper endpoint is supported by husbandry\
        \ literature as well as field occurrence; no controlled multi-year trial establishes equivalent performance\
        \ at every temperature within this envelope."

  breeding:
    text: "Eggs are laid on an exposed surface, often a stone or broad leaf, and both adults contribute to care.\
      \ Larvae can be moved into shallow pits before free swimming. Keep suitable tiny foods available, including\
      \ newly hatched Artemia or microworms. Early broods can be lost, and successful reproduction varies among\
      \ pairs and water conditions. A separate breeding aquarium reduces repeated intrusion into the guarded area."
    sources:

  lifespanYears:
    value:
      min: 4
      max: 5
    confidence: low
    rationale: "Generator proposes 4 to 5 years, checker-a 4 to 6, checker-b 5 to 8 and checker-c 3 to 5. The component\
      \ medians are 4 and 5.5 years. The adopted approximate expectation of 4 to 5 years keeps the median lower\
      \ bound but sets the upper target to the independently stated five-year figures rather than inventing precision\
      \ at 5.5. Flowgrow and Fishtopia give about four years, my-fish about five and Aqua-Fish 3 to 5; Aquariumz\
      \ gives the wider 5 to 8 years without a documented longevity series. Checker-a's six-year endpoint is an\
      \ estimate. Loiselle describes a relatively long-lived dwarf cichlid without a numerical age. Confidence remains\
      \ low because no age-validated population record establishes these aquarium endpoints."

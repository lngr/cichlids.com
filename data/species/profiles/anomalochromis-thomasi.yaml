  ph:
    value:
      min: 5.4
      max: 7.2
    confidence: low
    rationale: "The tally decides pH 5.4 to 7.2 by the median method, with low confidence. Generator and tiebreaker-2\
      \ propose 5.4 to 7.4; checker-a proposes 5.5 to 7.8; checker-b and tiebreaker-1 propose 5.4 to 7.0; checker-c\
      \ proposes 5.6 to 7.0. The median of the six minima is 5.4 and of the maxima is 7.2. Occupied Guinea sites\
      \ measure 5.63 to 6.32, including Soukou at 5.83; nearby Jare measures 6.78 without a confirmed species record\
      \ at that reading. Regional acidic streams and the Jong annual series of 5.44 to 6.76 support the acidic portion.\
      \ The decided range is a typical regional habitat synthesis, not the full observed chemistry of every drainage.\
      \ Wider source ranges remain evidence: FAO regional rivers span 5.4 to 7.4, Payne's Rokel/Seli study 6.8 to\
      \ 7.8, Barrie's Rokel series 6.5 to 8.0 and the heterogeneous ESIA surface sites 4.92 to 8.26. None establishes\
      \ that this fish routinely occupies all those main-channel or chemically inconsistent stations. FishBase and\
      \ the Nordic register give 6 to 8 without locality-resolved measurements; those summaries do not outweigh\
      \ field observations for the natural target."

    tolerance:
      value:
        min: 6.3
        max: 8.9
      confidence: low
      rationale: "Retain the tally median of 6.3 to 8.9 with low confidence because the six proposals lack a qualified\
        \ majority: generator 6.5 to 8.9, checker-a 5.5 to 8.3, checker-b 6.5 to 9, checker-c 6 to 9, tiebreaker-1\
        \ 5.5 to 8.9 and tiebreaker-2 6.5 to 8.9. The median minimum is 6.25, rounded to 6.3, and the median maximum\
        \ is 8.9; the result contains the decided natural range. A median reflects the differing recommendations\
        \ without allowing one narrow proposal to impose the range. Scott reports approximately 5.5 to 7.8 or 7.9\
        \ across emergency aquaria; their duration does not demonstrate lifelong health. Cichlidamerique repeats\
        \ a claim from 5 to above 7 without a complete upper bound or independent protocol. Those broader acidic\
        \ keeping claims and the wider native basin pH 6 to 9.6 remain evidence rather than automatic tolerance\
        \ limits. The trial pH 7.6 to 8.1 and neutral-to-alkaline care recommendations provide narrower observations.\
        \ Neither endpoint of the decided tolerance is a demonstrated chronic failure threshold."

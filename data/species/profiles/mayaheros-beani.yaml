  diet:
    text: "Use a complete cichlid food containing plant ingredients as the staple, with controlled portions of aquatic\
      \ invertebrates for variety. Digestive-enzyme research supports omnivory with an animal-food bias, while the\
      \ wild proportions of different foods remain poorly quantified. Small fish are potential prey; live feeder\
      \ fish are unnecessary. Keep meal size controlled and avoid treating the strong feeding response as a measure\
      \ of nutritional need. Captive digestive swelling is reported, but a high-protein diet alone is not an established\
      \ explanation for every case."

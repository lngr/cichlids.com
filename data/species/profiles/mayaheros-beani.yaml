  breeding:
    text: "Spawning occurs on an exposed prepared surface, followed by defense of eggs and young by both parents.\
      \ Rock crevices used as shelters do not make this a cave-spawning species. Successful introductions require\
      \ close observation, ample space and immediate access to separation. The Nordic account describes eggs hatching\
      \ after about three days and young swimming freely roughly six to eight days later, with timing dependent\
      \ on conditions. Aggression among growing juveniles also requires planning for separate space."

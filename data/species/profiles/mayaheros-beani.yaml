  sizeAndGrowth:
    text: "Plan for a well-grown male around 30 cm and a female around 25 cm. The female estimate has less independent\
      \ support. Aquarium accounts include 35 cm fish and exceptional individuals around 41 cm, so the planning\
      \ sizes are not absolute biological limits. Standard-length measurements from wild fish cannot be compared\
      \ directly with aquarium total lengths. Juveniles grow quickly, while aggression can create large differences\
      \ between individuals. A ten-year lifespan is a provisional care-sheet estimate rather than a measured survival\
      \ distribution."

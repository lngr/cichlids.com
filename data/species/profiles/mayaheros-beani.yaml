  aggressionHeterospecific:
    value: 4
    confidence: medium
    rationale: "All four profiles select level 4. Scott describes a serious risk to other fishes and an independent\
      \ breeder reports exclusion of every tankmate from a 150 gallon aquarium, with coexistence only in a much\
      \ larger pond. NVC advises separate housing. Fishipedia implies level 2 and the Swell robust-companion advice\
      \ maps approximately to level 3, but those generalized recommendations are less informative than detailed\
      \ aquarium accounts. The all-tankmates-killed passage of legacy thread 2010 concerns Neolamprologus christyi,\
      \ so only its separate general statement about beani aggression applies here."

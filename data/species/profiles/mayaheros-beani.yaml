  compatibility:
    text: "The profile recommends exclusive housing with one adult and gives no suitable shared-tank companions.\
      \ General care pages permit large robust fishes, and an aquarium breeder reports coexistence in a very large\
      \ pond, but these accounts do not establish routine safety in the recommended tank. Small fish face predation;\
      \ equally large fishes face serious attacks. The Binns photographic compilation attributes captive offspring\
      \ to a cross with Herichthys carpintis. Without verified parentage or evidence of conspecific mate availability,\
      \ that report supports a presumed pairwise hybrid caution."

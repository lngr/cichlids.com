    rationale: "The Catalog of Fishes places the species on the Mexican Pacific slope from Sonora to Jalisco. The\
      \ generator emphasizes Sinaloa to Jalisco, checker-a uses Presidio to Santiago, checker-b uses Sonora to Jalisco,\
      \ and checker-c expands the same catalog distribution into lower river valleys. Retain the catalog extent\
      \ and the supported core drainages rather than treating the differing geographic summaries as different species.\
      \ Mexico belongs to North America. San Pedro and Aguamilpa studies establish occurrence in the region; their\
      \ chemistry is not necessarily measured alongside individual fish."

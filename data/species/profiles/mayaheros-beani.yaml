  khDkh:
    value:
      min: 3
      max: 8
    confidence: medium
    rationale: "Retain the tally value of 3 to 8 dKH and its medium confidence, without a natural-water verification\
      \ object. The generator, checker-c and both tiebreakers propose 2.7 to 7.6, checker-a 4 to 12, and checker-b\
      \ 3 to 8 dKH. At freshwater stations in the San Pedro study, paired carbonate plus bicarbonate spans 0.97\
      \ to 2.69 mmol of charge per litre. Multiplication by 2.804 gives 2.72 to 7.54 dKH; the tally expresses the\
      \ result in whole degrees. The checker-a 4 to 12 proposal is a pH-based inference rather than a measured carbonate\
      \ series. Charge units already include valence, so carbonate must not be doubled. This is alkalinity in aquarium\
      \ KH units and can exceed calcium-magnesium hardness where sodium contributes to the ion balance."

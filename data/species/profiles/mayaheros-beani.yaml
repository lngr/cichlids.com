  sexing:
    text: "Adult males generally become larger and develop longer fin extensions and a heavier head. These tendencies\
      \ overlap between the sexes and give poor guidance for juveniles or fish of different ages. Locality variation\
      \ and reproductive color changes further limit color-based sexing. The genital papilla can provide a stronger\
      \ indication near spawning, but unnecessary handling adds stress. Breeder records and observations of egg\
      \ laying provide useful context alongside adult morphology."

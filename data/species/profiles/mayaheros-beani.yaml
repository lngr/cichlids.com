  aggressionConspecific:
    value: 4
    confidence: high
    rationale: "All four profiles select level 4. Lethal attacks in the juvenile culture experiment and independent\
      \ aquarium accounts of dangerous partner interactions support the rubric. The experiment uses small tanks\
      \ and cannot define adult stocking density, but the aquarium pairing reports establish that this is not merely\
      \ an experimental artifact. Fishipedia suggests a milder level near 2; the mortality and separation reports\
      \ carry more weight. The episode of a fish killing every tankmate in legacy thread 2010 concerns another species\
      \ and is not direct beani mortality evidence."

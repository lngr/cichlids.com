partners:
  suitable: []
  unsuitable:
  - species: Paracheirodon innesi
    reason: Its small adult size makes it potential prey and it cannot withstand the aggression of an adult green
      guapote.
  - species: Herichthys carpintis
    reason: "Severe aggression makes ordinary shared housing unsuitable, and a labelled captive cross adds a presumed\
      \ hybrid risk."
  - species: Astronotus ocellatus
    reason: A large body does not provide dependable protection from the attacks described in green guapote keeping
      accounts.
  - species: Mayaheros beani
    reason: A second adult can suffer lethal partner or rival attacks. A managed breeding introduction requires
      separate accommodation and does not constitute a routine companion recommendation.
profile:
  overview:
    text: "The green guapote is a Mexican Pacific-slope cichlid with metallic green or silver coloration and dark\
      \ spotting. Its size and intense aggression shape every housing decision. A single adult in a dedicated large\
      \ aquarium is the routine recommendation. Golden and pale locality stocks occur, so appearance alone does\
      \ not establish collection origin or sex. Breeding behavior is biparental, but forming a pair requires experience\
      \ and access to separate accommodation."
    sources:
    - kind: catalog-of-fishes
      title: "Eschmeyer's Catalog of Fishes: Mayaheros"
      url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Mayaheros"
      accessed: '2026-10-15'
      archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-53c4f361/2026-10-14T101215Z
    - kind: database
      title: "FishBase: Mayaheros beani"
      url: "https://www.fishbase.se/summary/Mayaheros-beani.html"
      accessed: '2026-10-15'
      archived: fishbase.se/summary/mayaheros-beani.html/2026-10-15T094504Z
    - kind: database
      title: "Nordiska Ciklidsallskapet: Mayaheros beani"

  problems:
    text: "Fighting injuries, excessive meals and poor water quality are major preventable problems. Digestive swelling\
      \ appears in keeper reports even with mixed plant and animal feeding, so it does not identify a single nutritional\
      \ or infectious cause. Monitor appetite, body condition and waste accumulation together. Quarantine arrivals\
      \ and obtain qualified help for persistent swelling, appetite loss or damaged tissue. Keep the cover secure\
      \ and maintain accessible separate accommodation before attempting introductions. Habitat and parasite reports\
      \ add context without establishing a diagnosis for a particular aquarium fish."

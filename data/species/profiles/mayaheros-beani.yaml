      url: "https://www.tfhmagazine.com/articles/freshwater/cichlasoma-beani-a-rare-middle-american-cichlid-top-of-the-food-chain"
      accessed: '2026-10-15'
      archived: tfhmagazine.com/articles/freshwater/cichlasoma-beani-a-rare-middle-american-cichlid-top-of-the-food-chain/2026-10-15T094524Z
  habitat:
    text: "Native populations occupy Mexican Pacific drainages from Sonora toward Jalisco, including the Presidio,\
      \ San Pedro and Santiago systems. Rivers, pools and reservoirs provide shelter among stones, with sand and\
      \ variable vegetation. The decided representative freshwater envelope is 23 to 32 C, pH 7.3 to 8.9, 2 to 6\
      \ dGH and 3 to 8 dKH. The San Pedro ion study supplies the pH and hardness evidence across freshwater stations,\
      \ rather than measurements accompanying identified fish. A separate regional prawn survey measures 22.3 to\
      \ 32.6 C and pH 6 to 9.6, including repeated low-pH observations; these wider basin conditions remain context\
      \ beyond the selected representative ranges. Saline river-mouth stations are excluded from freshwater aquarium\
      \ chemistry. Alkalinity and general hardness differ because sodium also contributes to the ion balance."
    sources:
    - kind: catalog-of-fishes
      title: "Eschmeyer's Catalog of Fishes: Mayaheros"
      url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Mayaheros"
      accessed: '2026-10-15'

    tolerance:
      value:
        min: 20
        max: 32
      confidence: low
      rationale: "Retain the qualified-majority tally of 20 to 32 C with low confidence. Proposals are generator\
        \ 21 to 30, checker-a 20 to 32, checker-b 22 to 32, checker-c 20 to 32, tiebreaker-1 20 to 33 and tiebreaker-2\
        \ 20 to 32 C. Breeding at 20 to 21.1 C supports cooler maintenance, while the culture trial lasts six weeks\
        \ at 26 to 30 C and does not establish lifelong limits. The upper bound contains the decided natural range.\
        \ The wider regional field series is 22.3 to 32.6 C and Glaser reports 16 to 34 C; neither demonstrates\
        \ sustained aquarium health at the extremes. Advice from NCS 21 to 25, AquaInfo 23 to 25, Swell 24 to 28\
        \ and Cichlidamerique 22 to 30 C supports flexibility but not precise chronic thresholds. Upper-end exposure\
        \ remains uncertain; it is not a preferred constant setting."

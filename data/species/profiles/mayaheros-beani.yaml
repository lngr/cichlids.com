  maxSizeCm:
    value:
      male: 30
      female: 25
    confidence: medium
    rationale: "The sex-specific proposal medians are 30 cm male and 25 cm female: generator 30/25, checker-a 30/25,\
      \ checker-b 35/30, checker-c 30/23. Retain 30/25 for typical well-kept aquarium adults. FishBase and NCS give\
      \ 30 cm overall, and Glaser explicitly gives 30 cm males and 25 cm females. NVC reports aquarium fish reaching\
      \ 35 cm; Scott describes an exceptional fish around 40.6 to 41 cm. Those wider observations remain evidence\
      \ of individual variation rather than typical maxima. A breeder reports females near 17.8 cm without establishing\
      \ their maximum. Wild maxima of 30 cm standard length in both sexes use a different length convention and\
      \ are not sex-specific typical aquarium total lengths. Confidence is medium because the female figure has\
      \ limited independent confirmation."
    sources:
    - kind: database

  temperatureC:
    value:
      min: 23
      max: 32
    confidence: medium
    rationale: "Retain the qualified-majority tally of 23 to 32 C. The culture paper measures 26 to 30 C during\
      \ collection, reports occupied shallows at 32 C, and cites 23 to 25 C as a regional habitat description. The\
      \ generator proposes 23 to 30, checker-a 23 to 32, checker-b 22 to 30, checker-c 23 to 32, tiebreaker-1 22\
      \ to 33, and tiebreaker-2 23 to 32 C. The wider 22.3 to 32.6 C series in the Macrobrachium river study is\
      \ retained as regional context rather than a fish-associated series; NVC gives 22 to 30 C and Glaser gives\
      \ a wider 16 to 34 C without station-level data. The decided range represents a freshwater habitat envelope\
      \ and its upper boundary is not a constant aquarium target. FishBase 23 to 25 C derives from aquarium literature.\
      \ The reservoir evidence described as below 26 C does not independently establish an exact 22 C endpoint."

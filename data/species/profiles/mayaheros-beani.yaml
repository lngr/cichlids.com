  social:
    value:
      structure: solitary
    confidence: medium
    rationale: "The generator and checker-c recommend solitary maintenance; checker-a and checker-b recommend a\
      \ pair. Choose one adult as the routine social unit because Scott describes dangerous introductions and unstable\
      \ pair bonds, and NCS and NVC require separation facilities even for established pairs. CRC and FishBase support\
      \ monogamous, biparental reproduction, which establishes breeding biology rather than reliable permanent aquarium\
      \ cohabitation. A managed breeding pair remains possible in a separate, larger assessment. The speciesOnly\
      \ decision restricts mixing species and does not make groups of beani safe."

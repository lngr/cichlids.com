      \ tiebreaker-2 propose 7.3 to 8.9, checker-a proposes 7.1 to 8.1, and tiebreaker-1 proposes 6 to 8.9. The\
      \ separate Macrobrachium study reports a wider basin envelope of 6 to 9.6, including repeated 6.0 readings\
      \ at Tuxpan; these demonstrate additional regional variability but are not measurements paired with beani\
      \ captures. The tally selects the repeated alkaline freshwater chemistry series as its representative range\
      \ rather than the union of all river surveys. Retain that limitation explicitly. Sinaloa values of 7.1 to\
      \ 8.0 come from neighboring river and drain sites, Santiago seasonal means of 6.7 to 7.8 are not species-site\
      \ limits, and culture pH 7.6 to 8.1 is laboratory water. FishBase supplies only the lower endpoint 7.5. Exclude\
      \ marine-influenced stations from the freshwater decision."

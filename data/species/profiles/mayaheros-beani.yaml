      \ specifies 720 litres and 200 cm, Fishipedia gives 500 litres under less restrictive pairing or community\
      \ assumptions, and NVC and AquaInfo specify 250 cm, with NVC explicitly discussing a pair. Adopt the directly\
      \ stated NCS 720 litres and 200 cm for the recommended single adult rather than presenting the synthetic 610/190\
      \ median as a sourced threshold. Depth 60 cm is an inferred turning and rockwork allowance, also the proposal\
      \ median. The 1000 litre and 70 cm pair estimates are not stated source measurements. This decision stays\
      \ below the largest source length and does not claim that a divided pair fits the single-adult minimum."

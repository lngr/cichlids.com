  husbandry:
    text: "Provide one adult with at least 720 litres, 200 cm length and an estimated 60 cm front-to-back depth.\
      \ Use a sandy floor and firmly supported rocks with several sheltered spaces, leaving room to turn and swim.\
      \ Strong filtration, oxygenation and regular partial water changes address the waste load of a large fish.\
      \ A secure cover prevents jumping. Stable conditions around 23 to 26 C provide a practical starting point\
      \ within the published keeping advice. The broader tolerances of 20 to 32 C, pH 6.3 to 8.9, 2 to 23 dGH and\
      \ 2 to 15 dKH are uncertain envelopes, especially at their endpoints. A breeding installation needs its own\
      \ space assessment and a secure means of separating adults."

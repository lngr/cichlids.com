  socialBehavior:
    text: "Both conspecific and heterospecific aggression reach the highest rubric level. Even small juveniles can\
      \ injure or kill each other, and adult pair bonds do not guarantee safety. One adult is the recommended social\
      \ unit. Shelter and visual barriers help organize space but cannot guarantee protection for another fish.\
      \ Persistent hiding, damaged fins or exclusion from feeding require physical separation. A compatible breeding\
      \ pair is a managed exception with separation facilities, rather than an alternative routine group arrangement."

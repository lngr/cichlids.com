    rationale: "Retain the qualified-majority tally of 2 to 6 dGH. The generator and checker-b propose 2 to 6, checker-a\
      \ 8 to 20, and checker-c plus both tiebreakers 1.9 to 6. The freshwater San Pedro Table 1 paired calcium plus\
      \ magnesium concentrations span 0.69 to 2.13 mmol of charge per litre. Multiplication by 2.804 gives 1.93\
      \ to 5.97 dGH; the tally rounds this to whole degrees. Direct regional measurements outweigh the broader FishBase\
      \ 10 to 23 dH and Fishipedia 10 to 30 dGH without field methods. Cichlidamerique also gives aquarium advice\
      \ of 8 to 30 and an incomplete habitat claim of at least 20 dGH. The checker-a 8 to 15 evidence attributed\
      \ to Scott is an inference from qualitative hardness language, not a measured source range. The marine-influenced\
      \ stations do not define freshwater hardness."

  hybridGroups:
    value:
    - amphilophus-trimaculatus-petenia-splendida
    - flowerhorn-petenia-splendida
    - parachromis-dovii-petenia-splendida
    - parachromis-managuensis-petenia-splendida
    confidence: low
    rationale: "The conservative tally retains the union supported by at least two runs, with low confidence. Generator,\
      \ checker-a, checker-b and checker-c proposed only parachromis-dovii-petenia-splendida. Tiebreaker-1 proposed\
      \ that pair plus amphilophus-trimaculatus-petenia-splendida, flowerhorn-petenia-splendida, parachromis-managuensis-petenia-splendida\
      \ and petenia-splendida-vieja-melanurus. Tiebreaker-2 proposed the same first four pairs and omitted the Vieja\
      \ pair. The three additional accepted pairs therefore each have two votes; the Vieja pair has only one and\
      \ is excluded by the conservative rule despite its retained NCBI listing. Binns labels the four accepted captive\
      \ crosses, and an independent MonsterFishKeepers compilation also names the trimaculatus cross. A separate\
      \ public breeder account reports the dovii cross and a backcross. None establishes verified parentage or free\
      \ choice of conspecific mates, so every accepted group remains presumed. Binns pages are one compilation,\
      \ not independent confirmations. A genus-only Herichthys label cannot establish a named pair, and pairwise\
      \ crossings do not justify a wider transitive group."

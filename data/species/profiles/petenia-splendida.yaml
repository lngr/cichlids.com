      rationale: "The qualified-majority tally selects 5 to 20 dGH from generator, checker-b, checker-c and tiebreaker-2.\
        \ Checker-a proposed 8 to 30 and tiebreaker-1 proposed the wider 5 to 39 to include the collecting-site\
        \ hardness. FishProfiles and Aqua-Fish give 5 to 20; AquaInfo favors 8 to 12, and Aquarium Industries 150\
        \ to 250 ppm as CaCO3 converts to 8.4 to 14.0 dGH. PFK and FishBase give an open-ended lower preference\
        \ of 15 dGH without a numerical maximum. Mendez et al. measured the wider native 32.4 to 38.5 dGH range,\
        \ up to 38.6 with alternative rounding, which conflicts with the ion-based 12.3 to 17.9 and river 14.0 to\
        \ 19.7 readings. Preserve this discrepancy without claiming that 20 dGH is a physiological ceiling or extending\
        \ chronic husbandry claims to 39 dGH. Exceptional Lachua readings of approximately 58.2 to 66.2 dGH are\
        \ excluded. Evidence for the soft endpoint and long-term extremes is weak, so confidence remains low."

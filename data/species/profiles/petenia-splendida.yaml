    value:
      min: 25
      max: 31
    confidence: medium
    rationale: "The unanimous tally rounds the agreeing proposals to 25 to 31 C: generator 24.9 to 30.7, checker-a\
      \ 25 to 30, checker-b 24 to 31 and checker-c 25 to 31. Native Peten Itza collection sites measured 24.9 to\
      \ 30.7 C and middle Usumacinta station means 28.3 to 30.2 C. The wider Calakmul study range of 22 to 32 C\
      \ and Lacantun station-mean range of 23.6 to 29.6 C describe entire surveys, not confirmed individual limits\
      \ of this species. Lake-column minima also include deep water. Retain those wider source ranges as context\
      \ rather than expand the typical occupied habitat band."

partners:
  suitable:
  - species: Cincelichthys pearsei
    reason: "Large deep-bodied adults are plausible companions under the published large, mild Central American\
      \ cichlid rule; this is an inferred match rather than a tested guarantee."
    condition: "Adults too large to swallow, substantially more space than the pair minimum, and monitoring during\
      \ reproduction."
  - species: Cincelichthys bocourti
    reason: Large robust adults can fit the relatively mild large-cichlid community described by hobby sources;
      individual compatibility remains an inference.
    condition: Comparable adult size and a much larger aquarium with separate feeding and retreat areas.
  unsuitable:
  - species: Paracheirodon innesi
    reason: Its small adult size puts it well inside the prey range of an adult bay snook.
  - species: Poecilia reticulata
    reason: Even adult guppies are readily swallowable and cannot be protected by the snook having a mild territorial
      temperament.
  - species: Parachromis dovii
    reason: "Very aggressive adult behavior makes this a poor companion, and the decided presumed pair group adds\
      \ a crossing risk."
  - species: Amphilophus trimaculatus
    reason: A decided presumed pairwise crossing risk links this fish with Petenia splendida; evidence consists
      of named hobby offspring reports without verified mate-choice conditions.
  - species: Flowerhorn
    reason: A decided presumed pairwise crossing risk links this fish with Petenia splendida; evidence consists
      of named hobby offspring reports without verified mate-choice conditions.
  - species: Parachromis managuensis
    reason: A decided presumed pairwise crossing risk links this fish with Petenia splendida; evidence consists
      of named hobby offspring reports without verified mate-choice conditions.
profile:
  overview:
    text: "Bay snook is a freshwater cichlid from the Atlantic drainages of Central America. Its mouth extends forward\
      \ when capturing prey, and fish form the main part of its natural diet. The red bay snook sold in aquariums\
      \ belongs to Petenia splendida alongside silver-green and yellow forms. A large adult can coexist with appropriately\
      \ sized companions, but restrained territorial behavior does not make swallowable fish safe. This is an intermediate-level\
      \ species whose main demands are adult space, waste management and a workable separation plan for pairs. The\
      \ accepted crossing risks concern four particular pairs and remain presumed rather than genetically confirmed."
    sources:
    - kind: catalog-of-fishes
      title: "Eschmeyer's Catalog of Fishes: species in Petenia"

    rationale: "The tally selects 5 to 8 dKH from generator, checker-a and checker-b proposals of 5 to 8 and checker-c\
      \ 5 to 10. Perez et al. bicarbonate of 1.9 to 2.2 meq/L gives 5.3 to 6.2 dKH; Usumacinta alkalinity of 128\
      \ to 135 mg/L as CaCO3 gives 7.2 to 7.6 dKH. Hillesheim et al. calculated 3.24 meq/L bicarbonate by ionic\
      \ balance, about 9.1 dKH, a wider source endpoint retained as dissenting evidence. The selected typical range\
      \ prioritizes directly titrated buffering values. Sulfate hardness contributes to GH but not carbonate alkalinity.\

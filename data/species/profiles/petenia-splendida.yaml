  husbandry:
    text: "A bonded adult pair needs about 750 litres and a footprint at least 250 cm long and 60 cm deep. A mixed\
      \ community requires additional room. Keep an open swimming lane and stable wood or smooth rocks that break\
      \ sight lines and provide separate retreats. Sand or rounded fine gravel suits the soft-bottom habitat. Provide\
      \ biological filtration capable of handling large carnivores, remove food residues and maintain regular water\
      \ changes. Ordinary maintenance around 25 to 28 C lies within the decided temperature tolerance of 24 to 31\
      \ C. Test GH and KH separately and maintain stable buffering rather than repeatedly adjusting chemistry. The\
      \ pH, GH and KH tolerance estimates have uneven support, especially the provisional 4 to 10 dKH interval."

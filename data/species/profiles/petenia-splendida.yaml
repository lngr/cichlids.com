    rationale: "The proposal medians are 725 L, 225 cm length and 60 cm depth: generator 600/200/60, checker-a 700/200/60,\
      \ checker-b 750/250/60 and checker-c 750/250/60. Check those medians against the recommended bonded adult\
      \ pair: Aqua-Fish explicitly gives at least 750 L for pairs and AquaInfo specifies 250 cm length. Adopt their\
      \ supported 750 L and 250 cm rather than an unpublished midpoint. PFK gives the smaller 180 by 45 by 45 cm\
      \ setup, about 364.5 L, without clearly specifying a pair; FishProfiles gives still smaller, internally inconsistent\
      \ adult advice. The Nordic association recommends 250 cm and 1000 L, a larger source value retained without\
      \ treating it as a measured universal minimum. Depth of 60 cm is an inferred turning and retreat allowance\
      \ for a typical 40 cm male, greater than the PFK 45 cm because the social unit is a pair. This is a synthesis,\
      \ not a tested threshold; mixed adult communities need additional space."

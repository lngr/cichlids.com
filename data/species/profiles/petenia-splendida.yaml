    tolerance:
      value:
        min: 6.8
        max: 8.5
      confidence: medium
      rationale: "The qualified-majority tally selects 6.8 to 8.5 from checker-a, checker-b, checker-c and both\
        \ tie-breakers; generator proposed the wider 6.0 to 8.5. Aqua-Fish recommends 6.8 to 7.8, while several\
        \ specialist or commercial accounts prefer 7.0 to 7.5. Native collections and independent lake limnology\
        \ reach 8.5, so a husbandry upper limit of 7.5 or 7.8 would omit occupied habitat. FishProfiles gives 6.0\
        \ to 8.0, a wider acidic extension retained in evidence without prolonged adult outcomes. Aquaculture supports\
        \ maintenance near neutral pH but does not establish the endpoint limits. Medium confidence reflects that\
        \ distinction."

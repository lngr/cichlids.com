  problems:
    text: "Limited adult space, swallowed companions, incompatible pairs and deteriorating water quality are the\
      \ main preventable problems. A large expanding mouth can capture surprisingly bulky prey, so apparent calmness\
      \ is insufficient evidence of a safe combination. Persistent hiding, missed meals and damaged fins warrant\
      \ reassessing the social arrangement and separating an affected fish. Heavy feeding increases the burden on\
      \ filtration, especially when meat remains in the substrate or shelters. Quarantine new stock and check water\
      \ quality promptly after changes in appetite or activity. The hardness disagreement between native studies\
      \ remains unresolved; exceptional local chemistry and provisional tolerance endpoints should not be presented\
      \ as measured lifetime requirements."
    sources:
    - kind: website
      title: "Aquarium Industries: Petenia Splendida Red Snook care sheet"
      url: "https://www.aquariumindustries.com.au/wp-content/uploads/2015/03/Petenia-splendida.pdf"

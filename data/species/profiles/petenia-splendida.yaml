    rationale: "Generator and checker-c proposed hasty; checker-a and checker-b proposed normal. Aquarium Industries\
      \ describes particularly greedy feeding and FishProfiles reports eager acceptance of sizeable foods, so hasty\
      \ best represents settled, trained fish. The American Aquarium Products keeper account instead describes one\
      \ fish waiting until companions had eaten, retained as slow evidence. That individual observation and Wikipedia\
      \ hunting mechanics do not outweigh the broader feeding accounts, but competition and confidence can change\
      \ an individual response."

    rationale: "Generator and checker-a proposed 3; checker-b and checker-c proposed 2. For the rubric reference\
      \ condition of a bonded pair in the recommended large tank, several husbandry accounts support hierarchy and\
      \ spawning-season chasing, so level 2 best describes ordinary maintenance. A hormonal reproduction study reports\
      \ a male killing a female in group broodstock tanks containing two males and four females with PVC shelters.\

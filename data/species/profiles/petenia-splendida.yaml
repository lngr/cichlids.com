  socialBehavior:
    text: "The recommended adult unit is a mutually compatible pair. Juveniles can be raised together while partners\
      \ form, but unmatched adults need alternative accommodation. In a suitable pair aquarium, hierarchy and breeding-season\
      \ chasing are the usual concern. Severe outcomes remain possible: a reproductive experiment reported a male\
      \ killing a female after spawning in group broodstock housing. Provide escape routes and a practical way to\
      \ separate fish before introducing a pair. Among suitably large companions, bay snooks often show relatively\
      \ restrained aggression until they defend eggs or fry. Group keeping appears in some accounts, but a dependable\
      \ minimum adult group and sex ratio for home aquariums are not established."

    tolerance:
      value:
        min: 24
        max: 31
      confidence: medium
      rationale: "The qualified-majority tally selects 24 to 31 C, supported by generator, checker-b, checker-c,\
        \ tiebreaker-1 and tiebreaker-2; checker-a proposed 22 to 32 C. Aquarium recommendations include AquaInfo\
        \ and Aquarium Industries 24 to 26 C, Aqua-Fish 25 to 28 C and the Nordic register 26 to 30 C. Native collections\
        \ reached 30.7 C, requiring a rounded upper endpoint of 31 C. FishProfiles gives the wider lower range of\
        \ 22 to 27 C, and the aquaculture paper cites a wider culture range of 26 to 34 C, but neither establishes\
        \ healthy multiyear adult maintenance at these outer limits. Brief tank commissioning at 21.7 C is not chronic\
        \ evidence. The tolerance contains the decided natural range and has medium confidence because endpoint\
        \ performance is incompletely documented."

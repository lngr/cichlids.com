  compatibility:
    text: "Adult Cincelichthys pearsei and Cincelichthys bocourti can be candidates in a substantially larger community\
      \ aquarium when their body depth prevents swallowing and their temperament permits coexistence. These suggested\
      \ matches are inferred from husbandry guidance, not controlled combination trials. Small tetras and livebearers\
      \ are prey, and very aggressive large cichlids can injure the snook. The decided presumed crossing pairs link\
      \ Petenia with Amphilophus trimaculatus, Flowerhorn, Parachromis dovii and Parachromis managuensis. Hobby\
      \ photographs and compilations identify offspring but do not establish verified parentage or free mate choice.\
      \ A separate proposed Vieja melanurus pair is retained in dissenting evidence and omitted by the tally rule;\
      \ omission does not prove reproductive isolation."

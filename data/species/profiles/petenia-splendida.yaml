  habitat:
    text: "The native range includes southern Mexico, Guatemala and Belize, with populations in lakes, slow river\
      \ reaches, wetlands and lowland pools. Peten Itza collections found yellow fish among plants at 0.5 to 1.5\
      \ m and silver fish over mud or stones at 2 to 3 m. The typical profile ranges are 25 to 31 C, pH 7.3 to 8.5,\
      \ 12 to 20 dGH and 5 to 8 dKH, synthesized from field studies. Wider observations remain relevant: Usumacinta\
      \ prose reports pH 7.1 despite a table minimum of 7.4; San Pedro seasonal means reach 7.2. Peten Itza collecting-site\
      \ hardness of 578 to 688 mg/L as CaCO3, about 32.4 to 38.5 dGH, conflicts with independent ion analyses and\
      \ remains unresolved. Lachua is an exceptional sulfate-rich karst habitat: site means span 28.2 to 29.1 C,\
      \ pH 8.0 to 8.5 and hardness 1038 to 1181 mg/L, about 58.2 to 66.2 dGH if reported as CaCO3 equivalents. The\
      \ paper does not fully clarify that hardness convention. These unusual local readings are described here without\
      \ expanding the ordinary aquarium ranges."
    sources:
    - kind: database
      title: "FishBase: Petenia splendida"
      url: "https://www.fishbase.se/summary/Petenia-splendida.html"
      archived: fishbase.se/summary/petenia-splendida.html/2026-10-14T170550Z

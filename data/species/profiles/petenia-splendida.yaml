    rationale: "The unanimous tally selects 12 to 20 dGH: generator, checker-a and checker-b proposed 12 to 20,\
      \ while checker-c proposed 12 to 18. Perez et al. measured surface Ca 2.9 and Mg 1.5 meq/L, totaling 12.3\
      \ dGH; separately reported ion extrema give an enclosing 12.3 to 17.9 dGH, without proving that the maxima\
      \ coincided. Usumacinta hardness means of 250 to 352 mg/L as CaCO3 give 14.0 to 19.7 dGH. Mendez et al. report\
      \ a much wider, conflicting collecting-site range of 32.4 to 38.5 dGH, with small conversion differences up\
      \ to 38.6 among runs. The chemically resolved ion analyses and river measurements determine the representative\
      \ range, while the higher field readings remain unresolved evidence. Lachua hardness of approximately 58.2\
      \ to 66.2 dGH under a CaCO3-equivalent assumption belongs to an exceptional sulfate-rich karst setting and\
      \ is described separately. Conductivity and alkalinity are not GH."

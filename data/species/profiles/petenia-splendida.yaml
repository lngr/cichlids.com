  diet:
    text: "Use a complete carnivore pellet as the main aquarium food when the fish accepts it, with varied animal\
      \ foods such as thawed freshwater fish pieces, shrimp, krill or earthworms. Acceptance of prepared foods does\
      \ not change the natural piscivore classification. Introduce unfamiliar foods gradually and check which fish\
      \ actually eats them. Settled snooks can take food eagerly, so offer measured portions and remove leftovers.\
      \ Some individuals hang back behind tankmates and may need attention at feeding time. Routine live feeder\
      \ fish are unnecessary and can introduce infections or provide an unbalanced diet. The profile does not identify\
      \ a special high-protein bloat predisposition, but digestive illness can still occur."

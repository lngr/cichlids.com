  sexing:
    text: "Males usually grow larger than females, but size alone does not reliably sex juveniles or fish with different\
      \ growth histories. Field descriptions found females relatively deeper-bodied and males more elongated; these\
      \ are tendencies rather than an individual diagnostic test. Red coloration identifies a morph, not a sex.\
      \ Mature fish with a known spawning history are more useful for pairing than guesses based on juvenile color.\
      \ Even correctly sexed adults can reject one another. A fish that cannot feed or rest because of repeated\
      \ pursuit needs to be separated, regardless of the apparent accuracy of its sex identification."

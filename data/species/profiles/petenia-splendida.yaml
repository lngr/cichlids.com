  sizeAndGrowth:
    text: "For aquarium planning, allow roughly 40 cm for a well-grown male and 30 cm for a female. These are typical\
      \ adult allowances, and some specimens exceed them. Published captive accounts disagree substantially; FishBase\
      \ records 50 cm standard length, which is an unsexed or male species maximum rather than a routine adult aquarium\
      \ target. Arrange the permanent aquarium while the fish is still young. Growth changes with food, water quality\
      \ and available space, and restricting growth through poor conditions is not a husbandry method. Published\
      \ ordinary lifespan estimates span five to twelve years, with little independently documented longevity data."

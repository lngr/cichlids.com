  breeding:
    text: "Pairs lay eggs on exposed hard surfaces and both parents can guard the brood. Provide a suitable spawning\
      \ surface alongside retreats rather than assume a shelter makes an incompatible pair safe. Hobby accounts\
      \ place hatching around three days after laying and free swimming several days later, with temperature affecting\
      \ timing. Newly hatched Artemia are an appropriate first food for free-swimming fry. Brood defense can occupy\
      \ a large part of the aquarium, so community companions may require removal. Successful spawning does not\
      \ guarantee lasting pair compatibility. Commercial hormone experiments establish aspects of reproduction but\
      \ do not establish normal household aggression rates or lifelong water tolerance endpoints."

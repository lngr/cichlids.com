  sizeAndGrowth:
    text: "Use typical adult maxima of about 12 cm for males and 9 cm for females when planning space. Some aquarium\
      \ references give 13 to 14 cm males and 10 cm females, and captive individuals may exceed the typical figure.\
      \ The smaller FishBase record is standard length and should not be treated as an aquarium total-length ceiling.\
      \ Five to eight years is a provisional lifespan estimate; reports of eight to ten years are less well supported\
      \ and no verified longevity series was found."

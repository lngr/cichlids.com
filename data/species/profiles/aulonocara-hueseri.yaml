  temperatureC:
    value:
      min: 21
      max: 29
    confidence: high
    rationale: "The tally assigns the Lake Malawi habitat envelope of 21 to 29 C with high confidence. Eccles reports\
      \ seasonal littoral cooling to 21 C and upper-water warming to 27 C in the readable abstract. Vollmer and\
      \ colleagues describe summer surface water near 28 C; Ngochera and Bootsma report surface temperatures reaching\
      \ 29 C. These are lake-wide observations, not measurements confined to Likoma Island or constant aquarium\
      \ limits. The 1999 mixing chapter and the full 2018 dissertation have no DOI in the supplied references and\
      \ were not retrieved as full texts; the readable 2020 paper supplies independent support for the warm endpoint."
    sources:
    - kind: literature
      title: "Eccles, D. H. (1974). An outline of the physical limnology of Lake Malawi (Lake Nyasa). Limnology\
        \ and Oceanography 19(5), 730-742 (abstract)."

      url: "https://www.practicalfishkeeping.co.uk/features/aulonocara-hueseri/"
      archived: practicalfishkeeping.co.uk/features/aulonocara-hueseri/2026-10-14T094551Z
      accessed: '2026-10-13'
  habitat:
    text: "Around Likoma the fish uses sandy bottom interrupted by rocks, often at depths of about 5 to 15 m. Sand\
      \ provides its feeding ground and small rock shelters serve males as sites and females as cover. More distant\
      \ distribution records in FishBase and the older magazine account remain disputed. The adopted natural lake\
      \ envelope is 21 to 29 C, pH 7.7 to 8.6, GH 3 to 5 dGH and KH 5 to 8 dKH. These lake-wide values distinguish\
      \ relatively soft calcium-magnesium water from its alkaline buffering."

    confidence: high
    rationale: "All runs identify Lake Malawi. Generator specifies the east coast of Likoma, checker-b and checker-c\
      \ specify Likoma, while checker-a also accepts Nkhata Bay, Domwe, Thumbi West, Monkey Bay and Nankumba from\
      \ FishBase and the older magazine account. The current Catalog of Fishes distribution, Oliver's locality account\
      \ and two specialist directories support Likoma most specifically, so only Likoma is accepted. The other records\
      \ remain visible in evidence and provenance. A type locality alone would not establish range restriction;\
      \ the independent distribution accounts provide that additional support."

  problems:
    text: "Food exclusion and prolonged social pressure can undermine an otherwise suitable setup. Check feeding\
      \ access, refuge space and water tests if a fish stays hidden or loses condition. Rough substrate can interfere\
      \ with normal sand feeding. There is no established requirement for a plant-based low-protein diet under the\
      \ bloat rubric, but intestinal disease and overfeeding remain possible. Distinguish expected mouthbrooding\
      \ fasting from persistent illness, and seek qualified aquatic health advice for ongoing abnormal breathing,\
      \ swelling or refusal of food."

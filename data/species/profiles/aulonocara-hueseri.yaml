    rationale: The tally fixes Lake Malawi total hardness at 3 to 5 dGH with high confidence. Calcium and magnesium
      in Branchu's upper-water samples imply about 4.2 to 4.6 dGH; the older ion analyses reproduced by FAO imply
      approximately 3.2 to 4.9 dGH. Outward rounding gives the adopted envelope. General hardness measures calcium
      and magnesium and is distinct from alkalinity.

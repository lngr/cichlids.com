    tolerance:
      value:
        min: 21
        max: 29
      confidence: low
      rationale: "All four proposals, generator, checker-a, checker-b and checker-c, are 21 to 29 C. The tally accepts\
        \ this unanimously with low confidence and requires the tolerance to contain the natural lake range. Species\
        \ recommendations are narrower: Aqua-Fish and DRTA give 22 to 27 C, AquaInfo 22 to 26 C, Zoopet 23 to 27\
        \ C and the aquarium wiki 22 to 28 C; Seriously Fish allows 23 to 29 C for the related A. stuartgranti.\
        \ A stable 24 to 26 C is well supported for routine keeping. Multi-year health at the extremes has not been\
        \ demonstrated for hueseri."

  predation:
    value: 1
    confidence: low
    rationale: "Generator, checker-c and tiebreaker-2 propose level 1; checker-a, checker-b and tiebreaker-1 propose\
      \ level 0. With three votes on each side, the tally applies its conservative fallback and chooses the higher\
      \ risk, level 1, with low confidence. FishBase and species specialists identify sand invertebrates as normal\
      \ prey, while the Aqua-Fish genus guide warns that peacocks may take very small fish and fry. This allows\
      \ opportunistic capture under the rubric, without asserting habitual piscivory. The approximately 2 cm boundary\
      \ is the rubric's planning threshold, not a measured hueseri prey limit; neither the ecological accounts nor\
      \ related-species experiments directly resolve levels 0 and 1."

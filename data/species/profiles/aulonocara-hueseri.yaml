  aggressionHeterospecific:
    value: 1
    confidence: medium
    rationale: All four proposals are level 1. The species magazine and two specialist directories describe a quiet
      peacock that can share with peaceful Malawi fish but is easily suppressed by stronger companions. Local displaying

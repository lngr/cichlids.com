partners:
  suitable:
  - species: Copadichromis borleyi
    reason: The species magazine permits peaceful Copadichromis; a compatible borleyi group is a conditional option.
    condition: "Provide a larger mixed aquarium accommodating both adult groups, with open swimming space and separate\
      \ retreats; monitor dominant males and feeding access."
  - species: Placidochromis electra
    reason: "Its care sheet allows quiet Aulonocara companions, with compatible sand-associated habitat."
    condition: Use more space than the hueseri minimum and monitor rivalry between blue males and access to sand.
  - species: Labidochromis caeruleus
    reason: The magazine permits especially calm Labidochromis as an exception among mbuna.
    condition: "A quiet group only, in a larger aquarium with separate rock cover and ample sand; monitor food competition."
  unsuitable:
  - species: Aulonocara stuartgranti
    reason: Shares the presumed aulonocara hybrid group; similar males may also compete and females are easily confused.
  - species: Sciaenochromis fryeri
    reason: Shares the presumed sciaenochromis-fryeri-aulonocara group and may dominate the smaller blue peacock.
  - species: Melanochromis auratus
    reason: A forceful mbuna conflicts with the species-specific advice to avoid aggressive companions and can suppress
      feeding.
profile:
  overview:
    text: "Aulonocara hueseri combines a quiet temperament with a striking adult male: blue areas meet yellow flanks,\
      \ dark fins and a pale dorsal edge. It is securely associated with Likoma Island in Lake Malawi. Night Peacock,\
      \ White Top and Midnight are overlapping trade names. Females are much less conspicuous and can be confused\
      \ with other peacocks, making reliable stock identification especially valuable for breeding."
    sources:
    - kind: catalog-of-fishes
      title: "Eschmeyer's Catalog of Fishes: species of Aulonocara"
      url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Aulonocara"
      archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-b79476cc/2026-10-14T094505Z
      accessed: '2026-10-13'

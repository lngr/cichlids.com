  compatibility:
    text: "Peaceful Malawi companions can work in a larger community aquarium. Quiet Copadichromis or Placidochromis\
      \ electra are conditional options, and a calm Labidochromis caeruleus group is a more cautious exception among\
      \ mbuna. Similar blue males may suppress colour or provoke rivalry. Other Aulonocara and Sciaenochromis fryeri\
      \ share presumed hybrid groups with hueseri. Boisterous mbuna are poor companions. The conservative predation\
      \ rating allows occasional capture of fry and very small fish, so such fish are unsuitable as protected residents;\
      \ a species-specific 2 cm prey limit has not been measured."

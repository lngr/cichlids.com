  diet:
    text: "Its normal prey consists of small animals in the sand. Offer fine prepared cichlid food and modest supplements\
      \ of Artemia, Daphnia or small aquatic insect larvae, spreading portions so every fish can feed. Experiments\
      \ on A. stuartgranti show lateral-line involvement in locating invertebrates; that provides context for the\
      \ genus, rather than a hueseri-specific trial. Acceptance of mixed prepared foods does not make this fish\
      \ primarily an algae grazer. Normal feeding speed is provisional. Avoid large portions and remove uneaten\
      \ food."

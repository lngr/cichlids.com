  socialBehavior:
    text: "A one-male, three-female aquarium unit avoids a direct male rival and distributes courtship attention.\
      \ Larger mixed-sex groups need additional space. Expect displays and brief chases even though this is a comparatively\
      \ gentle peacock. Males may retain a small cave or crevice outside active spawning, with stronger defence\
      \ near breeding. Females need independent access to food and shelter. Persistent cornering, injury or loss\
      \ of feeding access calls for a change in stocking or space."
    sources:

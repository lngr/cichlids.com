  husbandry:
    text: "For one male and three females, plan at least 400 litres, 150 cm length and about 50 cm front-to-back\
      \ depth. The depth is a practical footprint estimate. Keep broad areas of fine sand between stable rock refuges\
      \ and break sight lines so each female can escape attention. Mature filtration, good oxygen exchange and regular\
      \ partial water changes support stable conditions. A routine temperature near 24 to 26 C is well supported.\
      \ The tallied aquarium envelopes are 21 to 29 C, pH 7.5 to 8.6, GH 3 to 20 dGH and KH 5 to 12 dKH; the endpoints\
      \ have limited long-term evidence and are not targets for deliberate extremes."

  breeding:
    text: "The female incubates the developing brood in her mouth after spawning at a male site. Read care accounts\
      \ suggest roughly several weeks of incubation, with duration varying. A holding female may temporarily refuse\
      \ food and needs quiet refuge from courtship and tankmates. A mature separate fry aquarium helps protect released\
      \ young, which can take tiny live foods and fine prepared food. Protect stock identity by excluding other\
      \ peacocks and electric blue haps from breeding arrangements; the relevant crossing groups express presumed\
      \ risk."

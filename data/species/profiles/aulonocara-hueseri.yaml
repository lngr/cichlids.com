  sexing:
    text: "Adult males generally grow larger and show the strongest blue and yellow contrast with dark fins and\
      \ pale edging. Females and young fish are grey or brown with subdued bars. Immature or socially suppressed\
      \ males may resemble females, so colour alone is an uncertain sex test. Fin spots can support identification\
      \ but do not establish it on their own. Obtain reliably identified, sexed adults when setting a female ratio;\
      \ a generic-looking female peacock cannot be assigned to hueseri just from muted colour."

profile:
  overview:
    text: "Apistogramma hongsloi offers a compact cichlid with conspicuous courtship and close brood care.\
      \ Its natural home is the Orinoco drainage of Colombia and Venezuela. Most colorful shop fish come from\
      \ aquarium breeding lines, while wild populations can look much more subdued. The name remains valid\
      \ in the Catalog of Fishes. Red-streak forms are familiar in the hobby, but a trade label alone does\
      \ not identify a collecting locality. Ask whether fish are captive bred and whether the seller has reliable\
      \ information about their origin."
    sources:
    - *id001
    - *id006
    - *id007
    - *id008
    - kind: website
      title: Mikolji articles index reached by the former hongsloi article address
      url: "https://www.mikolji.com/article/dwarf-cichlid-apistogramma-hongsloi-wild/"
      archived: mikolji.com/article/dwarf-cichlid-apistogramma-hongsloi-wild/2026-10-15T060651Z
      accessed: '2026-10-15'
  habitat:
    text: "This Orinoco dwarf cichlid occupies sheltered shallow water over sand with submerged leaves, branches\
      \ and patches of plants. Native stream reports include 25.5 C at a collecting site and 26 to 28 C in\
      \ repeated observations; the decided typical range is 26 to 29 C. The full surveyed Mitimiti stream reached\
      \ 36.06 C at another station, and an older account reports a savanna-lagoon peak of 31 C. These wider\
      \ readings describe habitat context rather than constant aquarium targets. Acidic collecting and regional\
      \ reports together span pH 4.0 to 6.8; the profile uses the low-confidence tally median of 4.3 to 6.8.\
      \ GH and KH are close to the reporting limits, with decided ranges of 0 to 1 degree each. Neither conductivity\
      \ nor the reported below-5 pH statement establishes a numerical hardness range."
    sources:
    - *id017
    - *id008
    - *id007
    - *id009
    - *id002
    - *id001
    - *id006
    - *id003
    - *id004
    - *id029
    - *id005
    - *id018
    - *id010
    - *id011
    - *id019
  sizeAndGrowth:
    text: "Plan around an adult male of about 7 cm total length and a female around 5 cm. Published figures\
      \ differ partly because standard length excludes the tail and aquarium strains differ from museum material.\
      \ A small fish still needs substantial usable bottom area when it becomes territorial. Watch the growth\
      \ and body condition of each individual rather than assuming all members of a shipment will mature together.\
      \ Young fish may show little of the adult male's color. Several years of care are a realistic commitment,\
      \ although the numerical lifespan estimate here has limited species-specific support."
    sources:
    - *id002
    - *id006
    - *id012
    - *id008
    - *id013
    - *id016
    - *id018
    - *id014
    - *id009
    - *id028
  husbandry:
    text: "Provide about 100 litres and an 80 by 35 cm base for the recommended male and two females. Arrange\
      \ multiple cavities with separate approaches and use wood and plants to interrupt sight lines. Leave\
      \ feeding patches of fine sand and keep the current gentle. Soft acidic water is the preferred starting\
      \ point; the broader maintenance tolerances of 23 to 30 C, pH 4.3 to 7.0, GH 0 to 15 and KH 0 to 4 are\
      \ allowances with differing evidence strength, not equally supported breeding targets. Low carbonate\
      \ buffering requires consistent maintenance and observation. Avoid routinely holding fish at temperature\
      \ extremes, and match changes to the condition and history of the stock."
    sources:
    - *id011
    - *id006
    - *id012
    - *id008
    - *id013
    - *id014
    - *id016
    - *id018
    - *id007
  socialBehavior:
    text: "Judge the fish by their access to space and shelter. A male may associate with more than one female,\
      \ but each female needs an area where she can withdraw and rear young. The sources disagree about whether\
      \ the species is best described as paired or polygynous; field observations and CRC support a harem,\
      \ while FishBase describes pair care. A compatible pair is also possible. During brood care, a female\
      \ can drive the male away forcefully. Provide a way to separate fish if one remains hidden, misses food\
      \ or cannot leave the defended area."
    sources:
    - *id004
    - *id002
    - *id008
    - *id006
    - *id012
    - *id013
    - *id015
    - *id009
    - *id016
    - *id007
    - *id018
  diet:
    text: "Offer small animal foods in portions the fish can actually reach. Frozen or live Daphnia, Artemia\
      \ and suitably sized insect larvae can be alternated with small sinking prepared foods accepted by the\
      \ individual fish. The natural diet centers on bottom-dwelling invertebrates, so this is not an algae-grazing\
      \ cichlid needing a strongly plant-based menu. Place some food near cover when companions dominate the\
      \ open water. Check that every female eats rather than judging feeding success by the male alone. Uneaten\
      \ food should not accumulate beneath leaves or inside spawning shelters."
    sources:
    - *id006
    - *id012
    - *id008
    - *id013
    - *id002
    - *id015
    - *id009
    - *id016
    - *id030
    - *id018
  breeding:
    text: "Expect spawning in a protected cavity rather than an exposed nest in open water. Several small caves\
      \ give the female choices and help keep breeding territories apart. Published accounts describe roughly\
      \ 60 to 90 eggs, with the female tending the clutch and leading the fry after they become mobile. Adult\
      \ maintenance tolerances should not be mistaken for ideal breeding conditions: soft, acidic water is\
      \ the more dependable starting point for sensitive stocks. Newly swimming fry need food small enough\
      \ to swallow, such as freshly hatched Artemia. Watch the male closely because the guarding female may\
      \ force him out."
    sources:
    - *id002
    - *id006
    - *id012
    - *id007
    - *id004
    - *id016
  sexing:
    text: "Adult males are usually larger and show more developed fin extensions and stronger colors than females.\
      \ Females remain smaller, and their appearance changes noticeably as brood care begins. Use body proportions\
      \ and fins alongside color; a dominant male's brightness is not a reliable template for young or subordinate\
      \ fish. Aquarium color strains can also differ substantially from wild populations. Confirm the sex of\
      \ each fish before planning a harem, and allow juveniles time to mature if the seller cannot identify\
      \ them confidently. A photograph of one unusually colorful fish is not enough to establish its locality."
    sources:
    - *id006
    - *id007
    - *id008
    - *id017
    - *id013
    - *id004
    - *id016
    - *id018
  compatibility:
    text: "Quiet upper-water fishes can leave the bottom available for territories. Suitable adult pencilfish\
      \ are candidates when their water needs match and food reaches every cichlid; exact pairings still require\
      \ observation. Tiny fry and shrimp can be eaten, although the level-1 fish-predation classification is\
      \ provisional and its 2 cm limit has not been measured for this species. Breeding females may chase companions\
      \ away from the nest. Other Apistogramma can compete for the same refuges, and mixing uncertain forms\
      \ obscures stock identity. No hybrid group is assigned by the settled evidence tally, but that is not\
      \ proof of reproductive isolation. General crossing warnings and an unsupported named A. macmasteri warning\
      \ remain unresolved. Large predatory or forceful territorial fishes are unsuitable companions."
    sources:
    - *id006
    - *id008
    - *id009
    - *id007

  ph:
    value:
      min: 4.3
      max: 6.8
    confidence: low
    rationale: "The tally applies the median rule because no proposal has four agreeing votes. Generator proposed\
      \ 4.5 to 6.8, checker-a 4.7 to 6.5, checker-b 4.0 to 6.8, checker-c 5.5 to 6.0, and tiebreaker-1 and\
      \ tiebreaker-2 each 4.0 to 6.8. The minima median is 4.25, rounded by the tally to 4.3, and the maxima\
      \ median is 6.8. Keep 4.3 to 6.8 with low confidence: 4.3 is a synthesis endpoint rather than a measured\
      \ threshold. The combined collecting and regional evidence is wider at 4.0 to 6.8: Batzer reports acidic\
      \ collecting waters at 4.0 to 4.5, the regional revision includes 5.5, 5.87 and 6.8, and Mitimiti measurements\
      \ span 4.71 to 6.54. Mikolji states only below 5, so entries encoding that threshold do not constitute\
      \ a point measurement or establish a minimum. FishBase gives the narrower 5.5 to 6.0 summary. Directly\
      \ located field reports explain the divergence from that compilation. The median is plausible for typical\
      \ acidic habitat conditions but does not encompass every reported locality."

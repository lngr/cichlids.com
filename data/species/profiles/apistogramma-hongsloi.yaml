  problems:
    text: "The most preventable problems begin with unstable water, uneaten food or a fish trapped in another\
      \ individual's territory. A small aquarium can look peaceful until spawning changes the relationship\
      \ between adults. Missing meals, damaged fins or prolonged hiding warrant checking water quality and\
      \ social pressure promptly. Introduced fish can also bring parasites or other infections, so quarantine\
      \ and observation are useful precautions. This species has no demonstrated special protein-induced bloat\
      \ flag in the sources used here; that does not make overfeeding harmless. Persistent abnormal breathing,\
      \ swelling or loss of condition needs competent assessment rather than guessing at a medication."
    sources:

      rationale: "The tally gives 23 to 30 C with unanimous agreement under the one-degree rule. Generator\
        \ and checker-a proposed 23 to 29, while checker-b and checker-c proposed 23 to 30. Seriously Fish\
        \ gives 23 to 29 and AquaInfo 23 to 30. Wider published advice includes 21 to 30 from the Nordic association\
        \ and 22 to 30 from Igualador; the 23 C lower limit follows the better-supported routine care band\
        \ rather than its coldest outlier. Several general guides give 23 to 28 or 24 to 28. The endpoints\
        \ are maintenance allowances rather than preferred constant settings, and prolonged keeping near 30\
        \ C is less well supported than the central band."

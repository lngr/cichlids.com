      rationale: "The tally median is 4.3 to 7.0 with low confidence. Generator and checker-a proposed 4.5\
        \ to 7.0, checker-b 4.0 to 7.0, checker-c 4.8 to 7.0, and both tiebreakers 4.0 to 7.0. The lower median\
        \ 4.25 rounds to 4.3, containing the decided natural range. The broader combined evidence reaches pH\
        \ 4.0 through native collecting accounts and 7.6 in an aqua-fish care sheet; the latter is a low-trust\
        \ alkaline outlier. Seriously Fish and the Nordic association independently give 5.5 to 7.0, AquaInfo\
        \ 5.5 to 6.5, Reef Trak 5.0 to 6.8, and Guidarium 5.5 to 7.0. Mailing-list breeding reports include\
        \ 4.8, 5.4 and 6.0 to 6.5, while specialist discussions describe maintenance near 6.8 to 7.0. The extension\
        \ to 4.3 is inferred from natural occurrence and tally synthesis, not established by a lifetime aquarium\
        \ health trial. Adult maintenance does not guarantee egg development."

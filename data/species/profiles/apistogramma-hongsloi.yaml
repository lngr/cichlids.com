      \ identifies the Cataniapo, Suapure and Capanaparo occurrences, and the Mitimiti survey confirms the\
      \ species in the middle Meta drainage. These locality lists supplement one another. No named lake table\
      \ applies. Searches of the cichlids.com archive for hongsloi found no posts; broader Apistogramma results\
      \ provide only genus-level experience. The helkeri paper was available only as an abstract, and its use\
      \ is limited to an identification caution."

  temperatureC:
    value:
      min: 26
      max: 29
    confidence: medium
    rationale: "The qualified-majority tally gives 26 to 29 C from five of six agreeing proposals under the\
      \ one-degree rule. Generator and checker-b proposed 25.5 to 28 C, checker-a 26 to 29 C, checker-c 23\
      \ to 30 C, and both tiebreakers 25.5 to 29 C. The 25.5 C collecting point, Mikolji stream observations\
      \ of 26 to 28 C and Mitimiti stations 1 and 2 at 26.12 to 28.33 C support a warm stream envelope; whole-degree\
      \ tally rounding explains the 26 C lower boundary. The Mitimiti association does not prove occupancy\
      \ in every station-season combination. Wider sources remain visible: FishBase gives 23 to 30 C, Batzer\
      \ combines 25.5 to 31 C including a lagoon peak, and the full Mitimiti survey spans 25.92 to 36.06 C.\
      \ The 36.06 C reading belongs to station 3, associated with another assemblage, and neither it nor the\
      \ lagoon peak defines the routine aquarium ideal. The current Mikolji article address leads to an index;\
      \ the authorized translation independently exposes the reported stream figures, while the inherited original\
      \ attribution remains cited."

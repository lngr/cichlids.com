    value:
      type: invertivore
      bloatSensitive: false
      foods:
        - sinking pellets and flakes
        - frozen or live small crustaceans such as Artemia and Mysis
        - insect larvae such as bloodworm
        - some plant-based food such as Spirulina
    confidence: medium
    rationale: "Four of five votes (checker-a, checker-b, tiebreaker-1, tiebreaker-2) chose invertivore
      without the bloat flag; the generator chose invertivore with the bloat flag. The type is
      undisputed: FishBase states that A. stuartgranti feeds on sand-dwelling invertebrates and
      lists only zoobenthos as food, the Journal of Experimental Biology studies describe
      invertebrate prey located in sand by the widened lateral line canals, and Seriously Fish
      describes a substrate-sifting benthophage. The flag is uncertain. Tropical Fish Hobbyist and
      FishProfiles advise a lower protein share for peacocks, but the natural food of the parent
      form is animal protein, Seriously Fish recommends chironomid larvae, Tubifex and Artemia
      without a bloat warning, and Fishkeeper recommends meaty frozen foods. The rubric flag marks
      species whose gut is adapted to plant food and which suffer on the diet of a carnivorous
      tankmate; an invertivore does not fit that pattern. The cautious feeding advice of two sources
      keeps the confidence at medium."

          value:
            volumeL: 240
            lengthCm: 120
            depthCm: 45
        - by: checker-a
          value:
            volumeL: 240
            lengthCm: 120
            depthCm: 45
        - by: checker-b
          value:
            volumeL: 243
            lengthCm: 120
            depthCm: 45
      decision:
        volumeL: 240
        lengthCm: 120
        depthCm: 45
      rationale: All rest on the 120 by 45 cm base of Seriously Fish; 243 L is its exact conversion and
        240 L the rounded value that Practical Fishkeeping also gives. The difference has no effect
        on the compatibility check.
    - field: features.lifespanYears

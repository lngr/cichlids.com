  hybridGroup:
    value: aulonocara
    confidence: high
    rationale: All three votes (generator, checker-a, checker-b) agree. The line descends from the
      southern form of the A. stuartgranti complex, and A. stuartgranti is a member of the curated
      group aulonocara. Seriously Fish warns for the Maleri form, A. stuartgranti and A. baenschi
      that most Aulonocara hybridise, Practical Fishkeeping reports that stuartgranti forms
      interbreed with other Aulonocara, and Tropical Fish Hobbyist and Elieson note that some red
      peacocks in the trade are hybrids; a breeder reported that his German Red stock crossed with
      Blue Neon peacocks. Females of the line look like those of other peacocks, so mixed keeping
      risks hybrid offspring and the loss of the line. The group's member list holds valid species
      names; the line belongs to it through its parent form A. stuartgranti.

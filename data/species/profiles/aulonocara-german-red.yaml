    tolerance:
      value:
        min: 21
        max: 29
      confidence: medium
      rationale: "All three votes (generator, checker-a, checker-b) proposed 21 to 29 C. Aquarium ranges
        for the parent form and the red lines lie between 22 and 29 C: Seriously Fish gives 25 to 29
        C for the Maleri form and 23 to 29 C for A. stuartgranti, FishBase 22 to 26 C, and the
        retailer sheets for German Red and Ruby Red about 23 to 29 C. The tolerance has to contain
        the natural lake range, so the lower bound is the 21 C of cool-season lake water, which no
        aquarium source goes below; the archive reports long-term keeping at about 26 to 27 C.
        Confidence is medium because the sources agree only roughly."

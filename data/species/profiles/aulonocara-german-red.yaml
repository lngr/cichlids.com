  note: "German Red is a captive colour line, not a described species, so the Catalog of Fishes has no
    name for it. It was bred in Germany by selecting the reddest offspring of the southern Maleri /
    Chidunga form of the Aulonocara stuartgranti complex, which Seriously Fish keeps as Aulonocara
    sp. 'stuartgranti maleri' and lists German Red among its selectively bred strains; Elieson
    traces the line to the darker Chipoka form, the population of Chidunga Rocks near Chipoka from
    which Aquarium Glaser reports the sister line Rubescens. Whether this southern form is a species
    of its own or a population of A. stuartgranti Meyer and Riehl 1985 (valid in the Catalog of
    Fishes, type locality Mpanga Rocks near Chilumba) is unresolved, so the species epithet stays
    empty. An older dealer article named A. baenschi from Chipoka as the founder, which reflects the
    earlier naming of these southern peacocks; A. baenschi itself was described from Nkhomo reef
    near Benga. Single breeders report accidental crosses with other peacocks in their stocks, but
    the line itself is a selection within one form, hence the status domestic-form. All feature
    values rest on the parent form: its habitat in Lake Malawi gives the natural water values, and
    its biology and husbandry data stand in for the line."

partners:
  suitable:
    - species: Copadichromis borleyi
      reason: Calm open-water hap with a different body shape and colour, so the male peacock rarely
        treats it as a rival.
      condition: tank of at least 150 cm
    - species: Placidochromis electra
      reason: Peaceful sand-dwelling hap of similar size that shares the food and water needs.
    - species: Otopharynx lithobates
      reason: Peaceful hap of similar size that keeps to the rocks and differs in colour.
    - species: Labidochromis caeruleus
      reason: One of the few quiet mbuna; its yellow colour avoids rivalry and it does not crowd the
        peacocks at feeding.
    - species: Cyrtocara moorii
      reason: Calm, blue sand-zone hap that does not compete for the rock territories of the peacock male.
      condition: tank of at least 150 cm because of its size
  unsuitable:
    - species: Aulonocara stuartgranti
      reason: Same species complex as the parent form; females are indistinguishable and the fish cross,
        so the line is lost.
    - species: Aulonocara jacobfreibergi
      reason: Member of the same hybrid group with similar colours; it crosses with the line and provokes
        rivalry between males.
    - species: Aulonocara baenschi
      reason: Close relative that hybridises readily with the line.
    - species: Aulonocara hybrid
      reason: Hybrid peacocks such as OB or Dragon Blood cross with the line, and strong hybrid males can
        suppress a German Red male.
    - species: Maylandia zebra
      reason: Boisterous aufwuchs-grazing mbuna that harasses peacocks, eats faster and needs a plant-rich
        diet.
    - species: Nimbrochromis venustus
      reason: Large predatory hap that eats fish up to about a third of its length; young and female
        German Reds fit into its mouth.
    - species: Tropheus moorii
      reason: Algae grazer from Lake Tanganyika with a strict low-protein diet that conflicts with the
        invertebrate food of the peacock, and with different natural water.
profile:
  overview:
    text: "The German Red Peacock is not a wild species but an aquarium line. A breeder in Germany
      produced it by selecting the most intensely coloured offspring of a yellow to orange peacock
      from the south-west of Lake Malawi, the Maleri / Chidunga form of the Aulonocara stuartgranti
      complex, over many generations. The result is a male with a glowing orange-red body and a
      metallic blue face. Several similar red lines circulate in the trade under names such as
      Rubescens, Ruby Red or simply Red Peacock, and they are often mixed up. Single breeders report
      accidental crosses with other peacocks in their stocks. In keeping, the fish behaves like its
      wild parent: a moderately territorial, sand-sifting hap that suits a calm Malawi community."
    sources:
      - kind: database
        title: "Seriously Fish: Aulonocara sp. 'stuartgranti maleri' (Sunshine Peacock)"
        url: https://www.seriouslyfish.com/species/aulonocara-sp-stuartgranti-maleri/
        accessed: 2026-10-13
      - kind: literature
        title: Elieson, M. The Red Peacocks from Germany. Cichlid-Forum.com article library.
        url: https://www.cichlid-forum.com/posts/3153340
        accessed: 2026-10-13
      - kind: website
        title: Schaefer, F. (2021). Aulonocara 'Rubescens'. Aquarium Glaser fish archive (wholesaler).
        url: https://www.aquariumglaser.de/en/25-perchlike-fishes/aulonocara-rubescens-2/
        accessed: 2026-10-12

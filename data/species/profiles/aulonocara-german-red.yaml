  aggressionConspecific:
    value: 2
    confidence: medium
    rationale: Males hold a spawning site and chase rival males and the females they court; with one
      male to four or more females in a large tank, injuries stay rare. Seriously Fish calls the
      Maleri form less peaceful than many congeners, the retailer sheets range from mildly
      aggressive (Ron's Cichlids) to aggressive (Imperial Tropicals), and Practical Fishkeeping
      describes a related stuartgranti form as not particularly aggressive. The archive reports
      dominant males that harass tankmates, but no source describes serious injuries with the
      recommended ratio.

        title: cichlids.com forum thread 14593
        url: https://www.cichlids.com/disc/read.php?2,14593
        accessed: 2026-10-12
  compatibility:
    text: "Good companions are calm Malawi haps of similar size with other colours and body shapes, for
      example Copadichromis borleyi, Placidochromis electra, Otopharynx lithobates or Cyrtocara
      moorii in a larger tank, and quiet mbuna such as Labidochromis caeruleus. Keep it apart from
      all other Aulonocara and from hybrid peacocks: they cross easily and the females cannot be
      told apart. Most mbuna are too rough and too fast at feeding time, and large predatory haps
      such as Nimbrochromis venustus eat smaller peacocks. The German Red itself takes fry and fish
      of about 2 cm at most. Similar red or orange fish provoke the male to constant displays and
      chases."
    sources:
      - kind: database
        title: "Seriously Fish: Aulonocara sp. 'stuartgranti maleri' (Sunshine Peacock)"
        url: https://www.seriouslyfish.com/species/aulonocara-sp-stuartgranti-maleri/
        accessed: 2026-10-13
      - kind: literature
        title: "Practical Fishkeeping: Aulonocara stuartgranti 'Ngara Mdoka' (M. Clarke, 2005)"
        url: https://www.practicalfishkeeping.co.uk/features/aulonocara-stuartgranti-ngara-mdoka/
        accessed: 2026-10-12
      - kind: literature
        title: "Tropical Fish Hobbyist Magazine: Pretty Peacock Cichlids from Lake Malawi"
        url: https://www.tfhmagazine.com/articles/freshwater/pretty-peacock-cichlids-from-lake-malawi
        accessed: 2026-10-12
  problems:
    text: "The most common mistake is mixing several peacock types: the offspring are hybrids, and the
      pure line is lost. Many fish sold as German Red differ in colour and may carry foreign genes,
      so buy from breeders who keep the line separate. Peacocks suffer quickly in immature or
      neglected tanks; ammonia, nitrite and pH swings cause losses, especially in newly bought
      juveniles. Overfeeding and fatty food burden the gut and the water, and like other Malawi
      cichlids peacocks can develop bloat under such conditions, which shows as a swollen belly,
      loss of appetite and white, stringy faeces. Gravel instead of sand hampers natural feeding.
      Males kept with too few females, or with dominant similar-coloured fish, stay pale and
      stressed."
    sources:
      - kind: database
        title: "Seriously Fish: Aulonocara sp. 'stuartgranti maleri' (Sunshine Peacock)"

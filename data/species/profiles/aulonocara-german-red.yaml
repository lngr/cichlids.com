    confidence: medium
    rationale: The line exists only in captivity; its name refers to the German breeder who developed
      it. Its parent form, Aulonocara sp. 'stuartgranti maleri', is endemic to the south-west of
      Lake Malawi around the Maleri Islands, Chidunga Rocks, Mumbo Island and Namalenje Island
      (Seriously Fish). Elieson places the founding stock in the Chipoka population and Aquarium
      Glaser selects the sister line Rubescens from Chidunga Rocks near Chipoka, so these two
      localities are given. No source documents the pedigree in detail, hence medium confidence.

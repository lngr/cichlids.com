  habitat:
    text: "The line itself lives only in aquariums. Its ancestors come from a small area in the
      south-west of Lake Malawi, around the Maleri Islands, Chidunga Rocks, Mumbo Island and
      Namalenje Island. There they live in the transition zone where rocky shores give way to sand
      with scattered stones. Males defend spots between the rocks, while females and young fish
      search the sand in loose groups. The lake water is warm, soft and moderately alkaline: 21 to
      29 C, pH 7.7 to 8.6, a total hardness of 3 to 5 dGH and a carbonate hardness of 5 to 8 dKH.
      Bicarbonate keeps the pH stable, which matters more for the fish than a high total hardness."
    sources:
      - kind: database
        title: "Seriously Fish: Aulonocara sp. 'stuartgranti maleri' (Sunshine Peacock)"
        url: https://www.seriouslyfish.com/species/aulonocara-sp-stuartgranti-maleri/
        accessed: 2026-10-13

  husbandry:
    text: Plan a tank with a base of at least 120 by 45 cm, around 240 L, for one male and four females.
      Fine sand is essential because the fish take mouthfuls of substrate and sift it for food;
      coarse gravel can hurt the gills. Build a few rock piles with caves and flat stones, but leave
      open sand between them. Peacocks react badly to poor or changing water, so mature the tank
      fully before stocking, filter generously and change 30 to 50 percent of the water every week.
      Keep 24 to 27 C, pH 7.5 to 8.6 and a stable carbonate hardness between the lake value of about
      5 to 8 dKH and about 12 dKH; the fish cope with soft lake-like water as well as with
      moderately hard tap water. Hardy plants such as Anubias or Vallisneria are left alone.
    sources:
      - kind: database
        title: "Seriously Fish: Aulonocara sp. 'stuartgranti maleri' (Sunshine Peacock)"
        url: https://www.seriouslyfish.com/species/aulonocara-sp-stuartgranti-maleri/
        accessed: 2026-10-13
      - kind: literature
        title: "Tropical Fish Hobbyist Magazine: Pretty Peacock Cichlids from Lake Malawi"
        url: https://www.tfhmagazine.com/articles/freshwater/pretty-peacock-cichlids-from-lake-malawi
        accessed: 2026-10-12
      - kind: website
        title: "LiveAquaria (retailer): Red Peacock Cichlid (Aulonocara sp.), care sheet"
        url: https://www.liveaquaria.com/products/red-peacock-cichlid
        accessed: 2026-10-13
      - kind: literature
        title: "Branchu, P., Bergonzini, L., Ambrosi, J.-P., Cardinal, D., Delalande, M., Pons-Branchu, E.
          et al. (2010). Hydrochemistry (major and trace elements) of Lake Malawi (Nyasa), Tanzanian
          Northern Basin: local versus global considerations. Hydrology and Earth System Sciences
          Discussions 7, 4371-4409."
        url: https://hess.copernicus.org/preprints/7/4371/2010/hessd-7-4371-2010.pdf
        accessed: 2026-10-12
  socialBehavior:
    text: The usual setup is a harem of one male with at least four females. The male claims a spot near
      a rock, displays to every female passing by and chases rival males; with too few females a
      single one can be worn down. More than one male works only in a long tank with enough rock
      structures to split territories. Towards other species the male is mostly calm but reacts
      sharply to fish with a similar look, above all other red, orange or blue peacocks and haps.
      Very dominant tankmates, for example a strong orange blotched hybrid peacock, can in turn
      suppress or even kill a German Red male.
    sources:
      - kind: database
        title: "Seriously Fish: Aulonocara sp. 'stuartgranti maleri' (Sunshine Peacock)"
        url: https://www.seriouslyfish.com/species/aulonocara-sp-stuartgranti-maleri/
        accessed: 2026-10-13
      - kind: literature
        title: "Practical Fishkeeping: Aulonocara hueseri (M. Clarke, 2006)"
        url: https://www.practicalfishkeeping.co.uk/features/aulonocara-hueseri/
        accessed: 2026-10-12
      - kind: archive
        title: cichlids.com forum thread 59125
        url: https://www.cichlids.com/disc/read.php?2,59125
        accessed: 2026-10-12
  diet:
    text: In nature peacocks hover just above the sand and sense tiny movements of buried insect larvae
      and crustaceans through enlarged canals of the lateral line on the head; then they dig out the
      prey and spit out the sand. In the tank they accept quality sinking pellets and flakes,
      ideally with a share of spirulina or other plant matter, plus frozen or live Artemia, Mysis
      and insect larvae. Feed small amounts two or three times a day instead of one large meal. As
      an invertebrate eater the line needs animal food and is not as sensitive to protein as the
      algae-grazing mbuna; some hobby authors still advise a moderate protein share, and fatty or
      mammalian meat does not suit any Malawi cichlid.
    sources:
      - kind: literature
        title: "Schwalbe, M. A. B., Bassett, D. K. and Webb, J. F. (2012). Feeding in the dark:
          lateral-line-mediated prey detection in the peacock cichlid Aulonocara stuartgranti.
          Journal of Experimental Biology 215(12), 2060-2071 (abstract)."
        url: https://doi.org/10.1242/jeb.065920
        accessed: 2026-10-12
      - kind: literature
        title: Schwalbe, M. A. B., Sevey, B. J. and Webb, J. F. (2016). Detection of artificial water flows
          by the lateral line system of a benthic feeding cichlid fish. Journal of Experimental
          Biology 219(7), 1050-1059.
        url: https://doi.org/10.1242/jeb.136150
        accessed: 2026-10-13

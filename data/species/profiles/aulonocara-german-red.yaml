  temperatureC:
    value:
      min: 21
      max: 29
    confidence: high
    rationale: "A domestic form takes the habitat values of its parent, and the parent form lives in
      Lake Malawi, so the value is the measured lake range: about 21 C in inshore water of the cool,
      windy season (Eccles 1974), 23.5 to 24 C in the winter epilimnion and about 28 C in summer
      surface water (Vollmer et al. 2005), with later campaigns reaching 29 C. The lake value is
      decided by the water body, not by agent votes."

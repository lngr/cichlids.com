  disagreements:
    - field: taxonomy.validName
      proposals:
        - by: generator
          value: Aulonocara 'German Red'
        - by: checker-a
          value: Aulonocara sp. 'German Red'
        - by: checker-b
          value: Aulonocara sp. 'German Red'
      decision: Aulonocara 'German Red'
      rationale: The abbreviation sp. marks an undescribed species, but German Red is a captive line of a
        known form, not a species of its own. The name without sp. avoids that claim; the status
        domestic-form and the taxonomy note carry the rest.
    - field: taxonomy.legacyNames
      proposals:
        - by: generator
          value:
            - Aulonocara spec. "German Red"
        - by: checker-a
          value:
            - Aulonocara spec. 'German Red'
        - by: checker-b
          value:
            - Aulonocara spec. 'German Red'
      decision:
        - Aulonocara spec. "German Red"
      rationale: The legacy catalog spells entry 815 with double quotation marks; the legacy name keeps
        that spelling.
    - field: taxonomy.parents
      proposals:
        - by: generator
          value: none
        - by: checker-a
          value: none
        - by: checker-b
          value:
            - aulonocara-baenschi
      decision: none
      rationale: Parents are listed for hybrids; German Red is a selection within one form. Checker-b's A.
        baenschi rests on a 1997 dealer article that used the older naming of the southern peacocks;
        Seriously Fish lists German Red as a strain of Aulonocara sp. 'stuartgranti maleri', and
        Elieson traces it to the Chipoka form of the A. stuartgranti complex. The parent form is
        named in the taxonomy note.
    - field: features.origin
      proposals:
        - by: generator
          value:
            continent: captive-bred
            region: Lake Malawi
            waterbody: Lake Malawi
            localities:
              - Chidunga Rocks (parent population)
              - Maleri Islands (parent population)
        - by: checker-a
          value:
            continent: captive-bred
            region: Lake Malawi
            waterbody: Lake Malawi
            localities:
              - Chidunga Rocks near Chipoka (reported origin of the founding wild stock)
        - by: checker-b
          value:
            continent: captive-bred
            region: Aquarium trade (ancestors from Lake Malawi)
            waterbody: Lake Malawi
      decision:
        continent: captive-bred
        region: Lake Malawi
        waterbody: Lake Malawi
        localities:
          - Chidunga Rocks near Chipoka (parent population)
          - Maleri Islands (parent population)
      rationale: All agree on a captive line of Lake Malawi origin. The region names the lake of the
        parent form, as in the other domestic and hybrid profiles. The localities follow Seriously
        Fish (Maleri Islands, Chidunga Rocks) and Elieson and Aquarium Glaser (Chipoka, Chidunga
        Rocks); checker-b's region text is replaced because the continent value captive-bred already
        states the aquarium origin.
    - field: features.maxSizeCm
      proposals:
        - by: generator
          value:
            male: 14
            female: 10
        - by: checker-a
          value:
            male: 15
            female: 11
        - by: checker-b
          value:
            male: 12
            female: 9
      decision:
        male: 14
        female: 10
      rationale: Seriously Fish gives 12 cm standard length for the Maleri form (about 14 cm total length)
        and 13 cm for A. stuartgranti; checker-b's 12 and 9 cm are standard lengths of A. baenschi,
        and checker-a's 15 cm leans on retailer figures that include record sizes. 14 cm is the
        typical well-kept male; females are about 10 cm total length.
    - field: features.coloration.value.pattern
      proposals:
        - by: generator
          value: mixed
        - by: checker-a
          value: plain
        - by: checker-b
          value: mixed
      decision: mixed
      rationale: The male combines an orange-red body with a blue face, blue striations and blue fin
        edges, and shows faint bars with mood (Armke, archive). A uniform body without markings,
        which plain describes, fits only the display colour seen from a distance.
    - field: features.minTank

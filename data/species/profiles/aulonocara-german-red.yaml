        title: "Tropical Fish Hobbyist Magazine: Pretty Peacock Cichlids from Lake Malawi"
        url: https://www.tfhmagazine.com/articles/freshwater/pretty-peacock-cichlids-from-lake-malawi
        accessed: 2026-10-12
  breeding:
    text: German Reds breed readily, often right in the community tank. The male cleans a flat stone or
      a hollow in the sand and courts females with spread fins and full colour. The female lays a
      few eggs, picks them up at once and collects sperm while she nibbles at the egg spots on the
      male's anal fin. She then carries the brood for about three to four weeks and eats little in
      that time. Moving a holding female to a quiet tank raises the number of surviving fry, but
      long separation can cost her rank in the group. The fry take Artemia nauplii and crushed
      flakes from the start. Never let the line breed with other Aulonocara.
    sources:
      - kind: database
        title: "Seriously Fish: Aulonocara sp. 'stuartgranti maleri' (Sunshine Peacock)"
        url: https://www.seriouslyfish.com/species/aulonocara-sp-stuartgranti-maleri/
        accessed: 2026-10-13
      - kind: literature
        title: "Tropical Fish Hobbyist Magazine: Pretty Peacock Cichlids from Lake Malawi"
        url: https://www.tfhmagazine.com/articles/freshwater/pretty-peacock-cichlids-from-lake-malawi
        accessed: 2026-10-12
  sexing:
    text: Adult fish are easy to sex. Males grow larger, carry the orange-red body colour with a blue
      face and develop longer, pointed dorsal and anal fins with yellowish egg spots on the anal
      fin. Females stay smaller and grey-brown with faint dark bars, sometimes with a slight pink or
      orange tint. Juveniles look alike; the first orange in the lower fins of males appears at
      around four months or 5 to 7 cm. Because females of different peacocks look nearly identical,
      buy females only from a source that keeps the line pure.
    sources:
      - kind: database
        title: "Seriously Fish: Aulonocara sp. 'stuartgranti maleri' (Sunshine Peacock)"
        url: https://www.seriouslyfish.com/species/aulonocara-sp-stuartgranti-maleri/
        accessed: 2026-10-13

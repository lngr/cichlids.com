  sizeAndGrowth:
    text: "Well-kept males reach about 14 cm total length in the aquarium, females stay near 10 cm.
      Reports of much larger fish are rare and usually rough estimates. Young fish are sold at 3 to
      5 cm and look grey-brown at that size. Males start to show orange in the lower fins and a few
      orange speckles on the body at around 5 to 8 cm; the full red takes many months more. Colour
      depends strongly on rank: a subordinate male may stay dull and almost female-like until he
      gets his own site, and the dominant male of a tank shows the most intense red."
    sources:

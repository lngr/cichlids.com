  legacyNames:
    - "Apistogramma steindacheri"
  note: "The legacy spelling omits the n in steindachneri. The Catalog of Fishes recognizes the 1908 Demerara description and the synonyms ornatipinnis and wickleri. Its Apistogramma list includes the original Heterogramma combination; a separate Heterogramma list returned no records. CRC confirms the valid name and synonyms, but its public original-description reference points to a different 1909 La Plata paper. Follow the catalog for date and locality. Historical uses of ortmanni and rupununi are misidentifications, not additional synonyms. The Cuyuni A139 form remains of uncertain identity."

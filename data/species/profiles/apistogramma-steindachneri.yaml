  compatibility:
    text: "Adult pencilfish and other quiet upper-water companions are more suitable than competing cave dwellers. Shared collection records support candidate companions but do not guarantee aquarium success. Avoid large predators and another territorial Apistogramma in the minimum setup. The species is not restricted to a single-species tank. No established hybrid group was identified, which does not prove that crossing is impossible."

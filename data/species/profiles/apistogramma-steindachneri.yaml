partners:
  suitable:
    - species: "Nannostomus beckfordi"
      reason: "Quiet upper-water companion recorded with the species in Guyana."
      condition: "Adults in a covered, adequately sized aquarium; no guarantee of fry survival."
    - species: "Nannostomus marginatus"
      reason: "Small dither fish recorded at Madwani Creek."
      condition: "Adults with cover and careful observation during brood care."
    - species: "Carnegiella strigata"
      reason: "Surface-oriented characid reported at the Suriname habitat."
      condition: "Secure lid, adult fish and shared soft-water conditions."
  unsuitable:
    - species: "Astronotus ocellatus"
      reason: "Its size and predatory capacity put the dwarf cichlids at risk."
    - species: "Apistogramma cacatuoides"
      reason: "Competes for bottom territories and caves; another male apisto is unsuitable in the minimum harem tank."
profile:
  overview:
    text: "Steindachner's dwarf cichlid is a substantial Apistogramma from the Guiana Shield. The legacy catalog spelling misses one letter. Plan around one territorial male and two females, each with shelter. It can share a suitable quiet community, although fry and very small fish may become food."
    sources:
      - kind: "catalog-of-fishes"
        title: "Eschmeyer's Catalog of Fishes: Apistogramma species list"

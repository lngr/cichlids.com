    tolerance:
      value:
        min: 20
        max: 30
      confidence: "low"
      rationale: "The tally median retains 20 to 30 C with low confidence. Generator proposed 22 to 30; checker-a, tiebreaker-1 and tiebreaker-2 proposed 20 to 30; checker-b and checker-c proposed 20 to 28. No candidate obtained four agreeing votes. The medians of all minima and maxima give 20 and 30, including the 24 to 26 natural range. Seriously Fish and FishBase recommend 20 to 25, TFH reports reproduction at 22 to 30, DRTA and Fischlexikon recommend 24 to 28, AquaInfo 24 to 26, Guidarium 22 to 28 and Cichlid Atlas 26 to 30. The selected interval is narrower than the association's 22 to 31 C listing; the uncorroborated 31 C upper endpoint is retained as evidence. Breeding advice and operating temperatures do not establish multi-year performance at either extreme, so 24 to 26 C is a better routine target than treating both limits as equivalent."

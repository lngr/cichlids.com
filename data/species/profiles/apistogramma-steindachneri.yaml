  sizeAndGrowth:
    text: "Allow for adult aquarium males around 10 cm and females around 6 cm including the tail. Standard-length figures exclude the tail and explain part of the published disagreement. Juveniles cannot be stocked as though they remain small indefinitely. The selected lifespan estimate is two to three years, based on one species husbandry account rather than measured survival data."

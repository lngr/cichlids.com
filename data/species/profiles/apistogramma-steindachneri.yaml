    rationale: "The Catalog of Fishes accepts Venezuela, Guyana and Suriname; FishBase and Seriously Fish identify the Guiana Shield drainages. Checker-a limits its main region wording to Guyana and Suriname because the Cuyuni form is unresolved. Retain the catalog range with that qualification rather than treating every Venezuelan trade fish as confirmed. AquaInfo also lists Brazil, which the cited catalog account does not confirm. No named lake determines this profile."

  husbandry:
    text: "For a male and two females, provide at least 100 L with a 100 by 30 cm base. Break up views across the bottom with wood and several separate refuges. Fine sand and leaf cover suit foraging. Keep filtration mature, circulation gentle and water changes regular. A routine 24 to 26 C with soft, mildly acidic to neutral water avoids relying on tolerance endpoints."

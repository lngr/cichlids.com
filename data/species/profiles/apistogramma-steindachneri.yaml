  problems:
    text: "Poor water quality and sustained territorial pressure can both cause trouble. Check water conditions and access to food when fish hide continuously or lose condition. Quarantine new arrivals, especially wild imports. The broad recorded tolerances are not interchangeable routine targets, and near-zero natural KH requires attention to stability rather than abrupt attempts to force extreme acidity."

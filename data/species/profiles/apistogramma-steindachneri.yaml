  ghDgh:
    value:
      min: 0
      max: 6
    confidence: "low"
    rationale: "The qualified-majority tally is retained at 0 to 6 dGH with low confidence. Generator, checker-b, checker-c and tiebreaker-2 proposed 0 to 6; checker-a proposed 0.5 to 3 and tiebreaker-1 0 to 1. Stalsberg measured 1 dGH at Rockstone Road and 6 dGH at Madwani and Kurukuru with this species present; a comparable nearby forest stream measured zero. These direct field tests outweigh the secondary below-1-dGH habitat claims, despite the collector report having low source trust and incomplete methods. Zero denotes the reported test resolution rather than chemically absent calcium and magnesium. The retained conductivity-derived estimates of 0.5 to 3, 0.5 to 2 and 0.3 to 4 dGH are interpretations by checker-a, not GH analyses; conductivity alone cannot determine GH. FishBase lists a wider 3 to 10 dH summary tied to aquarium literature and it does not replace the native measurements."

  predation:
    value: 1
    confidence: "low"
    rationale: "The qualified-majority tally keeps level 1 with low confidence. Generator, checker-b, checker-c and both tie-breakers proposed 1; checker-a proposed 0 because the principal diet account concerns invertebrates and community reports show no adult-fish losses. Guidarium explicitly warns of fry consumption and Fishy Friends mentions fish around 2 cm, but neither supplies a feeding study. The rubric cutoff is therefore an uncertain compatibility category rather than an experimentally measured limit. Reports of coexistence with 35 mm livebearers and genus-level small-tetra experience do not test unguarded fry. The Mol and Poecilia papers provide no readable species-specific prey-size trial. Occasional fry predation remains compatible with successful adult dither-fish keeping and does not imply regular piscivory."

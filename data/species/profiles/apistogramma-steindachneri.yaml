  diet:
    text: "Offer varied small animal foods, including crustaceans and insect larvae, with accepted sinking granules. Place some food near cover so quieter individuals receive a share. Fast or forceful companions can leave them underfed. Prepared-food acceptance does not establish a naturally omnivorous diet. Fry and very small neighbours are a potential food source."

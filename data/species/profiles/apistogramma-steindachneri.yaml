  temperatureC:
    value:
      min: 24
      max: 26
    confidence: "medium"
    rationale: "The qualified-majority tally is retained at 24 to 26 C with medium confidence. Generator and tiebreaker-1 proposed 24 to 29; checker-a proposed 23 to 26; checker-b, checker-c and tiebreaker-2 proposed 24 to 26. Species-positive Guyana sites measured 24.5 to 25.8 C and the separate Suriname creek reading was 25.6 C. The selected typical shaded-creek interval is narrower than the regional forest-tributary range of 24.4 to 28.6 C in Mol et al. (2007), the coastal-swamp envelope of 24.2 to 28.8 C in Mol (1995), and the secondary 24 to 31 C collection summary in Cichlid Atlas. These wider records remain evidence but lack a matched species-positive series. The Nassau survey gives regional 22.2 to 24.8 C, including cooler upland sites; its lowland Anjumara station was 24.8 C. FishBase lists 20 to 25 C under an aquarium-atlas reference. Neither those care figures nor the limited collecting snapshots establish seasonal extremes."

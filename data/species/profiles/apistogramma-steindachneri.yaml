  maxSizeCm:
    value:
      male: 10
      female: 6
    confidence: "medium"
    rationale: "The proposed adult maxima were 10/6 cm from generator, 9/5.5 from checker-a, 9/6 from checker-b and 10/7 from checker-c, giving medians of 9.5 cm male and 6 cm female. Use 10 and 6 cm as practical aquarium total-length maxima. The male figure rounds the median to the directly published 10 cm estimate in the association and TFH accounts; the female median matches DRTA and Zoopet. The association gives 10/7, DRTA 8 to 9/5 to 6 and TFH about 10/5. Seriously Fish gives 8/5 cm standard length, whereas FishBase mixes 6.5 cm male standard length with 7 cm female total length. These measurements are retained without applying an unsupported fixed conversion. Larger individual fish can occur."

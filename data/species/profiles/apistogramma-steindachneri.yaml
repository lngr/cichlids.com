  sexing:
    text: "Mature males are larger and develop longer fin extensions, including the outer tail tips. Females have rounder tails and conspicuous dark pelvic markings, becoming strongly yellow during brood care. Use several adult traits together rather than size alone in juveniles. Collection information is useful because similar Guianan forms have been confused in trade."

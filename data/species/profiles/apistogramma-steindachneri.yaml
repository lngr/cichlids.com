    tolerance:
      value:
        min: 4
        max: 7.5
      confidence: "medium"
      rationale: "The qualified-majority tally retains pH 4.0 to 7.5 with medium confidence. All runs except checker-a proposed this interval; checker-a proposed 4.5 to 7.5. Seriously Fish explicitly gives 4.0 to 7.5 and the association gives the slightly wider 4.0 to 7.6. TFH reports neutral-water health and reproduction below 8, represented in one inherited evidence entry as 6.0 to 7.9; that constructed interval is not a measured lower limit or a full tolerance trial. The decided range stays below those wider upper claims. Narrower recommendations from FishBase, Zoopet, AquaInfo, DRTA, Guidarium, Fischlexikon and Fishy Friends are retained. The tolerance includes the median natural range and neutral-water breeder experience, but does not imply equal reproductive success or stability at every pH."

  socialBehavior:
    text: "Adult males occupy an area containing several smaller female nesting areas. Rival males can face persistent pursuit, and a brooding female can chase her mate away. Each female needs a separate retreat. Watch for a fish losing access to food or resting places; continued harassment may require separation. Additional males need substantially more space."

  habitat:
    text: "Native records centre on Guyana and Suriname, with Venezuela accepted by the taxonomic catalog and uncertainty around the similar Cuyuni form. Shaded creeks offer sand, branches and accumulated leaves. The selected natural ranges are 24 to 26 C, pH 5.0 to 6.7, GH 0 to 6 dGH and KH 0 to 1 dKH. Wider regional measurements remain documented in the evidence and are not all confirmed captures."

  ph:
    value:
      min: 5
      max: 6.7
    confidence: "low"
    rationale: "The tally median is retained at pH 5.0 to 6.7 with low confidence. Generator proposed 5.0 to 6.9; checker-a 5.5 to 7.0; checker-b, checker-c and tiebreaker-2 each 5.0 to 6.4; tiebreaker-1 4.2 to 7.0. There was no qualified majority, so the medians of all minima and maxima, rounded to one decimal, determine the range. Stalsberg recorded 5.0 to 6.4 at species-positive sites. The decided range is narrower than the 5.5 to 6.9 regional forest-tributary interval in Mol et al. (2007), the 3.75 to 7.65 French Guiana stream interval in Cilleros, and the 3.9 to 7.3 secondary habitat summaries in Cichlid Atlas and Fischlexikon. The latter also gives an inconsistent Portuguesa locality. Mol (1995) measured 4.20 to 5.75 in Lelydorp swamp, while the Nassau survey gives regional 6.5 to 7.5, including a lowland reading of 7. These are regional comparators rather than matched captures and do not make the selected interval a complete geographic envelope. FishBase gives 6.2 to 6.8 without a site series. DwarfCichlid access was blocked and the Surinam monograph was unavailable through the open-access route; neither supplies read evidence here."

  breeding:
    text: "Females place eggs inside protected cavities and provide most egg and fry care. The male generally patrols the wider area and may court other females. Eggs usually hatch within a few days; free swimming follows later, depending on temperature. Offer appropriately small foods when the young begin foraging and provide separate growing space as territorial behaviour develops."

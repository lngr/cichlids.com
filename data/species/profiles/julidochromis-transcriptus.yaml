  compatibility:
    text: "A structured Tanganyika community can work if companions use separate areas and the tank is
      substantially larger than the pair minimum. Shell dwellers and open-water Cyprichromis are possible
      choices with appropriate space, while assertive cave competitors can threaten the pair. Other
      traditional julies share presumed hybrid risks. Altolamprologus calvus also shares a separate crossing
      group based on a single unverified aquarium account in which both species had breeding partners. The
      account is recorded as documented under the group rubric, but it is not genetic confirmation."

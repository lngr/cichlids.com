  husbandry:
    text: "An established pair needs at least 80 litres with a footprint of 60 by 30 cm, stable filtration and
      secure caves. Leave separate retreats and interrupt direct lines of sight; other adults and community
      companions need more room. The recorded aquarium allowances are 23 to 29 C, pH 8.0 to 9.4, 9 to 25 dGH
      and 15 to 20 dKH, with the pH and KH boundaries especially uncertain. Stable conditions within these
      allowances matter more than chasing their extremes. Keep replacement water compatible with the tank and
      guard against jumping during pursuit."

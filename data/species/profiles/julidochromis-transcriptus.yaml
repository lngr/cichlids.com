        archived: "tropicalfreshwaterfish.com/species/julidochromis_transcriptus.html/2026-10-14T125450Z"
        accessed: "2026-10-13"
  sexing:
    text: "Colour and pattern provide little dependable separation of the sexes. Northern population records and a
      behavioral study favor males larger than their partners, but several hobby accounts report the reverse.
      Size alone is therefore unreliable for choosing a compatible male and female. Experienced examination of
      reproductive anatomy or observed spawning roles can be more informative. There is no reason to infer sex
      change from size differences or parental duties in an ordinary aquarium."

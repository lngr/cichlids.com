  sizeAndGrowth:
    text: "Use about 7 cm for a typical maximum male and 5 cm for a female from the northern species concept. The
      sex split is uncertain: some aquarium accounts report larger females, especially in Gombi stock.
      FishBase gives 7 cm total length without a reliable female maximum, while Seriously Fish gives 6.5 cm
      standard length excluding the tail. Allow a commitment of roughly five to eight years, with low
      confidence because documented longevity data are scarce."

  socialBehavior:
    text: "A compatible pair can share a cave territory, but unfamiliar adults and even an established mate may be
      chased when relationships change. Watch for a fish trapped at the surface or unable to feed, and provide
      separation when retreat space fails. A juvenile group is a route to pair formation rather than the
      recommended permanent stocking unit. The public CRC page describes polyandry, so a pair recommendation
      should not be mistaken for an inflexible natural mating system."

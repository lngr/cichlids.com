      value:
        min: 9
        max: 25
      confidence: "medium"
      rationale: "The qualified-majority tally selects 9 to 25 dGH with four of six agreeing votes and medium
        confidence. Generator and checker-b propose 8 to 20; checker-a and tiebreaker-1 propose 8 to 25;
        checker-c and tiebreaker-2 propose 10 to 25. Under the two-dGH agreement rule the four proposals
        ending at 25 agree; their median minima of 8, 8, 10 and 10 give 9. Maidenhead supports an aquarium
        range of 15 to 25 dH, widened downward for the natural 10 to 13 dGH range. TropicalFreshwaterFish
        gives 8 to 20 dH, FishBase gives 8 to 14 dH, Aquario gives 10 to 25 dH, and Zierfische-Direkt gives
        9.5 to 20 dGH. The wider 8 to 25 proposal and source allowances down to 8 remain recorded even though
        the tallied lower endpoint is 9. These are care recommendations and an environment record, not a
        controlled test of the full lifetime interval."

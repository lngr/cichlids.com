names:
  trade:
    en:
      - "Masked julie"
      - "Black-and-white julie"
variants:
  - name: "Pemba"
    kind: "locality"
    note: "Bemba is an alternative spelling. Kissi is a trade label for darker fish from this northern population."
  - name: "Uvira"
    kind: "locality"
    note: "Tawil interprets some striped northern fish as an ecotype of transcriptus; their identification remains
      uncertain."
  - name: "Gombi"
    kind: "locality"
    note: "Also spelled Gombe or Kombe in trade accounts. Southern fish under this label may belong to another
      taxon and are not treated as verified populations of the nominal species."
  - name: "Kapampa"
    kind: "locality"
    note: "A disputed trade identification, not a confirmed locality of nominal transcriptus."
  - name: "Katoto"
    kind: "locality"
    note: "Southern fish with this trade label are taxonomically disputed and excluded from the confirmed native
      range."
features:
  origin:
    value:
      continent: "Africa"
      region: "Lake Tanganyika, northwestern Congolese shore"
      waterbody: "lake-tanganyika"
      localities:
        - "Luhanga"
        - "Makabola (Makobola)"
        - "Pemba (Bemba)"
    confidence: "high"
    rationale: "The Catalog, FishBase and the northern Tanganyika specialist account support the northwestern
      Congolese shore from Luhanga to Makabola. The generator lists Luhanga, Makabola, Pemba and Bemba;
      checker-a adds Uvira, while checker-b and checker-c describe the Luhanga to Makobola shore. These are
      largely geographic or spelling differences. Pemba and Bemba denote the same northern locality. Uvira is
      retained with the ecotype qualification in variants, while southern Gombi, Katoto and Kapampa names do
      not extend the confirmed range."

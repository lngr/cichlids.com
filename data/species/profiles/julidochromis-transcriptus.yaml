    tolerance:
      value:
        min: 15
        max: 20
      confidence: "low"
      rationale: "The qualified-majority tally selects 15 to 20 dKH with four of six agreeing votes and low
        confidence. Generator, checker-b, checker-c and tiebreaker-1 propose 15 to 20; checker-a proposes the
        wider 10 to 20; tiebreaker-2 proposes the wider 8 to 20. The selected interval repeats the natural
        lake chemistry as a provisional aquarium allowance. Zierfische-Direkt states 8 to 18 dKH for this
        species, while the JBL brochure gives the wider 8 to 20 dKH interval for Tanganyika cichlids including
        marlieri, without naming transcriptus. These lower KH claims are preserved but do not change the
        settled tally. Maidenhead buffering advice supplies no KH endpoints, and its GH numbers cannot be
        converted into KH. No reliable species-specific long-term experiment establishes the chosen floor; the
        decision does not demonstrate harm below 15 dKH."

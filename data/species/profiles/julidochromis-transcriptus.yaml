  diet:
    text: "Small animal prey dominates the natural diet, including crustaceans and other rock-associated
      invertebrates. Offer appropriately sized prepared foods with varied small frozen or live animal foods.
      Some vegetable content is accepted, and mixed food accounts explain why the species is also called
      omnivorous. Check that food reaches shy fish beside the rocks. The profile does not flag protein-related
      bloat sensitivity, but that is a husbandry interpretation rather than evidence that digestive illness
      cannot occur. Fry consumption is plausible and rated as an uncertain opportunistic risk."

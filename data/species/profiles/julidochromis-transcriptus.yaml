  breeding:
    text: "Eggs are placed inside narrow caves or rock crevices, and both parents contribute to protecting the
      nest. Small young may remain near the pair through subsequent broods, provided cover and space remain
      adequate. Provide food fine enough for newly free-swimming fry and protect them from filter intakes.
      Older juveniles are not guaranteed permanent acceptance. Gauthier observed successive broods in Gombi
      stock, but suspected losses to larger juveniles in a crowded earlier setup; that stock has an
      identification caveat."
    sources:
      - kind: "literature"
        title: "Gauthier, D. Julidochromis transcriptus Gombi. Aquarium society breeding account"
        url: "https://gbasonline.org/wp-content/uploads/2017/08/Julidochromis_transcriptus_article.pdf"

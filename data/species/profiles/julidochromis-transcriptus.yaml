      confidence: "low"
      rationale: "The conservative tally chooses pH 8.0 to 9.4 with low confidence because neither camp reaches four
        agreeing votes. Generator and checker-b propose 7.5 to 9.4; checker-c proposes 7.5 to 9.5; checker-a,
        tiebreaker-1 and tiebreaker-2 propose 8.0 to 9.4. The intersection of all proposals is 8.0 to 9.4 and
        contains the natural 8.4 to 9.4 interval. Maidenhead recommends 8.0 to 9.0; TropicalFreshwaterFish
        gives the wider lower allowance of 7.5 to 9.0, while Aquario and Zierfische-Direkt give the wider 7.5
        to 9.5 interval. Those claims remain in evidence. The Nordic association gives 8.8 to 9.3 and Gauthier
        bred Gombi stock at 8.2. Schumer et al. maintained study fish at pH 8.0, supporting a point at the
        chosen floor without proving all lifetime endpoints. The upper endpoint is retained for lake
        containment, not as a captive target to pursue."

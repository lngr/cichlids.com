      propose 7 and 5. The component medians are 7 and 5.5 cm. Retain 7 cm male and adjust the female to 5 cm,
      matching the explicit northern population maxima on Tanganyika.si and the male-biased dimorphism
      measured by Schumer et al. FishBase gives 7 cm TL for male or unsexed fish; Seriously Fish gives 6.5 cm
      SL, which excludes the tail. The research mean male-to-female length ratio of 1.3 does not establish
      absolute maxima; an input estimate of 5.4 cm for females is an extrapolation. Female-larger claims in
      Maidenhead, TropicalFreshwaterFish and Gombi breeding accounts are retained, but are less specific to
      the northern concept and may concern different stock. The sex split remains medium confidence."

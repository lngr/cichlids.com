    - field: "features.aggressionConspecific"
      proposals:
        - by: "generator"
          value: 3
        - by: "checker-a"
          value: 3
        - by: "checker-b"
          value: 2
        - by: "checker-c"
          value: 3
      decision: 3
      rationale: "Generator, checker-a and checker-c propose level 3; checker-b proposes 2. Select 3 with medium
        confidence. Tawil describes intense conflict and risks when a pair bond fails, Maidenhead restricts
        normal housing to compatible pairs, and Gauthier reports persistent pursuit of surplus fish. Schumer
        et al. also measured pronounced male aggression. Contest experiments and the northern specialist
        account support the lower proposal but do not establish safety for surplus adults or incompatible
        partners. These observations do not justify level 4 for adults kept as the recommended compatible pair
        with sufficient shelter."

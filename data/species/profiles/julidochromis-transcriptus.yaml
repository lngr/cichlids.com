        - by: "checker-b"
          value: 1
        - by: "checker-c"
          value: 2
      decision: 2
      rationale: "Generator, checker-a and checker-c propose level 2; checker-b proposes 1. Select 2 with medium
        confidence because Maidenhead community guidance and cave-defense accounts support expelling intruders
        from a local territory. Tawil describes very high interspecific aggression, retained as level-3
        evidence, but does not demonstrate systematic attacks beyond the territory by nominal northern
        transcriptus under suitable housing. The calmer northern descriptions support the level-1 alternative.
        Community companions need separate zones and more space than the pair minimum."

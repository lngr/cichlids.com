    confidence: "high"
    rationale: "Retain the tallied natural lake range of 10 to 13 dGH with waterbody verification and high
      confidence. Plisnier surface calcium and magnesium convert to approximately 11.0 to 11.6 dGH, Cohen
      seasonal samples to about 12.2 dGH, and the source-book ion values to about 11.35 dGH. These studies
      support the lake synthesis. FishBase states the wider 8 to 14 dH interval, retained as dissenting
      environment evidence rather than replacing the directly measured lake chemistry. GH measures calcium and
      magnesium and is distinct from carbonate buffering."

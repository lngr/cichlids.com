      structure: "pair"
    confidence: "high"
    rationale: "All four complete profiles select a bonded pair as the aquarium social unit. FishBase explicitly
      recommends pairs and Maidenhead recommends compatible pairs or a single fish. CRC publicly labels the
      mating system polyandrous, and genus-level accounts discuss flexible parental arrangements; that does
      not make a group of unrelated adults the default recommendation. The DOI cited in some inputs for the
      body-size study resolves only to a short terminology correction, not the experiment, and cannot
      independently support the mating interpretation. Confidence is high for pair keeping."

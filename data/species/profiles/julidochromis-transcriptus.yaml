    tolerance:
      value:
        min: 23
        max: 29
      confidence: "medium"
      rationale: "The unanimous tally chooses 23 to 29 C with four of four agreeing votes within the one-degree
        agreement rule and medium confidence. Generator, checker-b and checker-c propose 23 to 29 C; checker-a
        proposes the wider 22 to 29 C. The median lower bound is 23, so the 22 C extension is not adopted.
        FishBase and TropicalFreshwaterFish give 22 to 25 C, Maidenhead gives 23 to 25 C, Aquario gives 23 to
        27 C, Aquarist Atlas gives 24 to 27 C, and Akwarium gives 24 to 28 C. Gauthier bred Gombi stock at
        about 26.7 C. The selected upper endpoint contains the natural lake maximum of 29 C; it is not
        established by a species-specific long-term endpoint experiment. The retailer also recommends 24 to 29
        C."

  temperatureC:
    value:
      min: 23
      max: 29
    confidence: "high"
    rationale: "Retain the tallied natural lake range of 23 to 29 C with waterbody verification and high
      confidence. Verburg et al. measured 23.85 to 29.01 C at the one-metre Mpulungu buoy; the decided integer
      range represents seasonal lake conditions rather than a single locality experiment. FishBase gives the
      different, narrower species environment interval of 22 to 25 C, and Aquarist Atlas recommends 24 to 27 C
      for aquaria. Neither replaces the measured lake synthesis."

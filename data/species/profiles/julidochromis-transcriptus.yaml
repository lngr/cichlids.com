  problems:
    text: "Persistent hiding, missed meals, frayed fins and confinement to a tank corner can indicate social
      trouble rather than a need to add more fish. Stable rockwork, several refuges and matched maintenance
      water reduce avoidable disturbance. Protect tiny fry from filter suction and larger companions. Do not
      treat every Gombi or other southern trade label as confirmed northern transcriptus. The most uncertain
      profile boundaries concern opportunistic fry predation and aquarium alkalinity; they should be read with
      their evidence and confidence."
    sources:
      - kind: "literature"
        title: "Gauthier, D. Julidochromis transcriptus Gombi. Aquarium society breeding account"
        url: "https://gbasonline.org/wp-content/uploads/2017/08/Julidochromis_transcriptus_article.pdf"

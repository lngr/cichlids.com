      rationale: "conservative decision from tally.yaml. The conservative tally retains
        altolamprologus-calvus-julidochromis-transcriptus, julidochromis and
        julidochromis-marlieri-transcriptus with low confidence. Generator, checker-a and checker-b propose
        the two existing julie groups; checker-c, tiebreaker-1 and tiebreaker-2 also propose the calvus pair.
        Each proposed group has at least two votes, so the tally takes their union; neither camp reaches a
        qualified majority. The existing julie groups remain presumed from general crossing warnings and
        disputed intermediate southern forms. Anderson reports failed marlieri-transcriptus laboratory
        pairings, which do not exclude every possible cross. The calvus pair rests on one keeper account in
        thread 1443 describing accidental offspring while established pairs of both species were present;
        later threads repeat the account. Conspecific partners were available, satisfying the rubric for
        documented basis, but parentage and identity were not independently verified. No wider intergeneric
        crossing group is inferred."

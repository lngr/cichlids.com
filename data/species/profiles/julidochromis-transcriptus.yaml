partners:
  suitable:
    - species: "Neolamprologus multifasciatus"
      reason: "A separate shell bed can reduce overlap with the rocky pair territory."
      condition: "Use a larger community tank with a broad shell area and visual separation; newly emerged fry may
        still be eaten."
    - species: "Cyprichromis leptosoma"
      reason: "Open-water shoaling can limit competition for cave refuges."
      condition: "Provide a community tank sized for the shoal with ample swimming space above separate rock
        territories."
  unsuitable:
    - species: "Julidochromis marlieri"
      reason: "Shared presumed hybrid groups and overlapping cave territories create crossing and competition risks."
    - species: "Julidochromis ornatus"
      reason: "The shared presumed julie group records a crossing risk, and similar rock shelters can be contested."
    - species: "Altolamprologus calvus"
      reason: "Shares the calvus-transcriptus group from an unverified aquarium crossing account; parentage was not
        genetically tested."
    - species: "Neolamprologus leleupi"
      reason: "Competition for rocky shelter may leave the smaller pair without safe retreats."
      condition: "Particularly unsuitable near the pair minimum or with a single shared cave pile."
profile:
  overview:
    text: "A masked julie spends much of its time beside stone surfaces, where its dark grid of markings breaks up
      a pale body. The nominal species comes from northwestern Lake Tanganyika. Keep one compatible pair as
      the usual aquarium unit and provide several sheltered routes through the rocks. Its small adult size
      does not prevent persistent attacks on unwanted companions. Ask about locality and stock identity, since
      some southern fish sold as transcriptus may represent other taxa."
    sources:
      - kind: "database"
        title: "Seriously Fish: Julidochromis transcriptus"
        url: "https://www.seriouslyfish.com/species/julidochromis-transcriptus/"
        archived: "seriouslyfish.com/species/julidochromis-transcriptus/2026-10-14T125442Z"
        accessed: "2026-10-13"
      - kind: "database"
        title: "FishBase: Julidochromis transcriptus summary"
        url: "https://www.fishbase.se/summary/Julidochromis-transcriptus.html"
        archived: "fishbase.se/summary/julidochromis-transcriptus.html/2026-10-14T125442Z"
        accessed: "2026-10-13"
  habitat:
    text: "Reliable records place the nominal species along the northwestern Congolese shore between Luhanga and
      Makabola, with Pemba among the northern aquarium localities. It uses rocky coastal habitat with sediment
      and narrow refuges. Lake monitoring supports natural values of 23 to 29 C, pH 8.4 to 9.4, 10 to 13 dGH
      and 15 to 20 dKH. These describe lake conditions across places and seasons; they are not measurements
      from every occupied cave."

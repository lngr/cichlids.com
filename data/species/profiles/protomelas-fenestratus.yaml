      lengthCm: 130
      depthCm: 45
    confidence: "medium"
    rationale: "The proposals were generator 400 L and 150 by 50 cm, checker-a 205 L and 120 by 45 cm,
      checker-b 300 L and 120 by 45 cm, and checker-c 300 L and 130 by 45 cm. Their component medians are
      300 L, 125 cm length and 45 cm depth. I retain the median volume and depth and use Malawi.si's
      explicit 130 cm recommendation for one male with several females, rather than an unsupported 125 cm
      midpoint. Seriously Fish gives about 205 L and a 120 by 45 cm base; NCS recommends 300 to 400 L and
      at least 120 cm. Malawi-Guru recommends 400 L and 150 cm, Fishipedia and Interaquaristik 400 L, and
      Aqua-Fish the wider 450 to 600 L and 150 cm for a harem or community. These larger recommendations
      remain evidence but do not displace the species-specific minimum for the chosen harem. Extra
      tankmates or multiple males require additional space. The 45 cm depth is supported by Seriously
      Fish, not directly stated by Malawi.si."

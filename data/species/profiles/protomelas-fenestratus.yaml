  problems:
    text: "Space, identification and feeding discipline are the main practical uncertainties. A breeding male
      can repeatedly pursue a female without adequate refuge, and disturbance can interrupt
      mouthbrooding. Similar trade names can mix distinct species in a breeding group. Reports of
      digestive problems support moderate feeding, while an undiagnosed fry-loss anecdote cannot
      establish a disease unique to fenestratus. The KH tolerance is inferred and has low confidence, so
      it should not be read as a measured physiological boundary."

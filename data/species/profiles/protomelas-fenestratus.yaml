  khDkh:
    value:
      min: 5
      max: 8
    confidence: "high"
    rationale: "The settled natural value is 5 to 8 dKH, without a verification object. The FAO compilation
      gives alkalinity equivalent to about 5.6 to 7.3 dKH; Branchu's profile gives about 6.5 to 6.9 dKH.
      Rounding this lake synthesis outward gives the mandatory range. Sodium contributes to bicarbonate
      balance, so alkalinity expressed as dKH can exceed calcium and magnesium hardness."
    sources:

        checker-b proposed 21 to 30 C; checker-c proposed 24 to 28 C. Seriously Fish and Aqua-Fish
        recommend 24 to 28 C, NCS and Fishipedia 23 to 28 C, and Ron's Cichlids about 23 to 29 C. The
        natural lake endpoints require widening the narrower care guidance. Interaquaristik's wider 24 to
        30 C range is retained but its 30 C endpoint is less well supported than the higher-trust
        guidance. This is a practical synthesis, not evidence of physiological failure outside the range
        or tested continuous exposure to its endpoints. The archived fry-loss report at about 23.3 C
        establishes neither a temperature cause nor a safe limit."

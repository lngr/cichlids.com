  husbandry:
    text: "For one adult male with three females, use at least 300 litres with a footprint 130 cm long and 45
      cm deep. This follows the explicit harem recommendation from Malawi.si with the supported depth
      from Seriously Fish; larger communities need more room. Leave sand available between stable rock
      structures and provide places where females can escape attention. Maintain filtration, oxygenation
      and regular water changes. Common care guidance centres on 24 to 28 C; the broader recorded
      tolerance of 21 to 29 C contains seasonal lake conditions and does not prescribe temperature
      swings. Keep buffering and pH stable, and distinguish carbonate alkalinity from total hardness."
    sources:

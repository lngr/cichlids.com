  temperatureC:
    value:
      min: 21
      max: 29
    confidence: "high"
    rationale: "The settled lake decision is 21 to 29 C with waterbody verification. Eccles reports seasonal
      nearshore cooling to 21 C and upper water near 27 C; Vollmer describes summer surface water near 28
      C and cooler winters. These lake studies and the broader seasonal synthesis govern the natural
      range. FishBase gives 22 to 26 C, which is narrower and derives from an aquarium reference rather
      than a species-specific field limit. The Ngochera repository abstract was readable but does not
      itself state numeric temperatures."

  socialBehavior:
    text: "One male with three females is the standard aquarium unit here. Males can repeatedly chase females
      or rivals during breeding, but routine serious injuries in a suitable harem tank are not
      established by the reviewed accounts. Other species may be driven away from the nest. Multiple
      males call for substantially more space than the minimum stated for one harem. Pale subordinate
      males can resemble females, so an apparent shortage of males or a supposed change of sex needs
      careful reassessment."

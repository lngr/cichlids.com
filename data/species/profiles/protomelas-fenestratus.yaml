    rationale: "The tally selects invertivore with bloatSensitive false by qualified majority, 5 of 6.
      Generator, checker-b, checker-c and both tiebreakers proposed invertivore; checker-a proposed
      omnivore because the fish accepts varied aquarium foods. Hulsey et al. classify Thumbi West
      specimens as insectivores, and Malawi.si, Malawi-Guru and NCS describe invertebrate prey.
      Occasional plant plankton does not change the predominant diet. Fishipedia's herbivore label and
      Interaquaristik's emphasis on diatoms are retained as contrary lower-trust claims. Accepting
      different prepared food formats does not establish a natural omnivore diet. The false bloat flag is
      inferred from this animal diet and Seriously Fish's live and frozen food recommendation, not proven
      disease resistance: NCS warns about frequent rich feeding and Aqua-Fish mentions bloating after
      some foods, supporting moderation without establishing the low-protein compatibility restriction.
      CRC's public page confirms breeding but gives no usable diet detail. FishBase's diet table contains
      no records. Ribbink's full text was not available through fetch-oa, and the krampus paper supplies
      taxonomic context rather than fenestratus feeding data."

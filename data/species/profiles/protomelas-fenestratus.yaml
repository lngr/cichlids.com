  compatibility:
    text: "A suitably spacious community can include peaceful Malawi haps and peacocks of comparable size.
      Aulonocara and Copadichromis are named in the specialist guidance, with some Placidochromis also
      suggested by Malawi-Guru. Very forceful mbuna can overwhelm this comparatively gentle fish.
      Protomelas taeniolatus and the undescribed Steveni Taiwan form share its presumed crossing group,
      based on specialist warnings rather than verified free-choice hybrid broods. Predation level 0
      reflects the lack of established fish feeding, but does not guarantee fry survival."

  sizeAndGrowth:
    text: "The planning values are approximately 15 cm for males and 12 cm for females. Published figures
      vary: FishBase gives 14 cm total length without a sex-specific female measurement, Seriously Fish
      gives 14 cm standard length, and NCS reports males reaching 18 cm. Retail and general websites give
      still larger adults. Total and standard lengths are different measurements, so these figures cannot
      be treated as equal. The selected typical size remains provisional and does not cap the growth of
      individual fish."

  breeding:
    text: "The female incubates the brood in her mouth after spawning at a shallow sand nest or rock site
      defended by the male. Care accounts give approximately two to three weeks before fry release. A
      harem spreads courtship pressure, and sheltered areas let a brooding female withdraw. Disturbance
      can cause premature brood loss. Released fry take suitably small foods. An old forum report
      describes fry mortality after brine-shrimp feeding, but provides no diagnosis and cannot identify
      either food or temperature as its cause."

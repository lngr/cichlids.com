  maxSizeCm:
    value:
      male: 15
      female: 12
    confidence: "medium"
    rationale: "Male proposals are 14 cm from generator and checker-a, 18 from checker-b and 15 from
      checker-c, giving a starting median of 14.5 cm. Female proposals are 11, 12, 12 and 12 cm, with
      median 12. I round the male decision to the directly supported 15 cm and retain 12 cm for females,
      matching the sex-specific Malawi.si account. FishBase and CLOFFA give 14 cm total length without a
      measured female maximum; Seriously Fish gives 14 cm standard length, which excludes the tail and
      cannot be equated with 14 cm total length. NCS gives 18 cm males and about 12 cm females; Ron's
      Cichlids gives about 20 to 23 cm unsexed adults and Aqua-Fish 20 to 25 cm aquarium fish. Those
      wider claims remain evidence, but do not establish the typical maximum of securely identified fish
      across localities. The chosen size is a provisional planning estimate, not a growth cap."

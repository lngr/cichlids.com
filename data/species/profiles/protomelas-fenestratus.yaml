  habitat:
    text: "Sedimented rock and neighbouring sand provide both feeding surfaces and spawning sites. Records
      extend beyond the northern end and southwest arm emphasized by FishBase, with specialist accounts
      describing a lake-wide distribution. Malawi-Guru places observed habitats at about 5 to 20 m depth.
      The natural chemistry follows the measured lake synthesis: 21 to 29 C, pH 7.7 to 8.6, GH 3 to 5 dGH
      and alkalinity equivalent to 5 to 8 dKH. The lake is relatively soft despite its alkaline pH."
    sources:

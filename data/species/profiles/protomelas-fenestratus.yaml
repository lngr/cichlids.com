  sexing:
    text: "Fully developed males are larger, more colourful and have extended median and pelvic fins. Females
      and subordinate males can remain pale with conspicuous dark markings. Mature behaviour and fin
      development help when colour is ambiguous. Male colour varies among locality accounts; blue and
      yellow tones over black horizontal and vertical markings are represented in the feature summary. A
      Taiwan Reef label alone does not securely identify this species."

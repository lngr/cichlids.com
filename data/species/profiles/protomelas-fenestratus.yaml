  diet:
    text: "Most evidence identifies an invertebrate feeder, especially insect larvae and small crustaceans
      exposed from sediment. Hulsey and colleagues classify specimens as insectivores; Malawi-Guru also
      reports seasonal animal and plant plankton. Provide varied prepared food suited to animal-feeding
      Malawi haps and appropriate invertebrate foods. NCS cautions against frequent rich feeding and
      Aqua-Fish mentions bloating after some foods. The compatibility flag is false because a special
      low-protein requirement is not established, rather than because the fish is immune to digestive
      illness. Avoid overfeeding. The herbivore and diatom-focused claims in other care sheets disagree
      with the stronger evidence for its predominant natural diet."

partners:
  suitable:
    - species: "Aulonocara"
      reason: "Specialist guidance names this genus among peaceful Malawi companions."
      condition: "Choose similarly sized and suitably calm adults; provide additional space beyond the harem
        minimum."
    - species: "Copadichromis"
      reason: "Specialist guidance names peaceful members as possible companions."
      condition: "Use a larger community aquarium with open swimming room and separated breeding sites."
    - species: "Placidochromis"
      reason: "Malawi-Guru suggests peaceful transition-zone members of this genus."
      condition: "Select compatible adult size and temperament and increase the footprint for the combined stock."
  unsuitable:
    - species: "Protomelas taeniolatus"
      reason: "Shares a presumed crossing group and a similar appearance."
    - species: "Protomelas sp. 'Steveni Taiwan'"
      reason: "Shares the presumed crossing group and is frequently confused with fenestratus in trade."
    - species: "Aggressive Lake Malawi mbuna"
      reason: "Forceful tankmates can dominate this relatively gentle hap and interfere with feeding and
        breeding."
profile:
  overview:
    text: "A male Protomelas fenestratus advertises a small breeding site while females and young fish search
      the surrounding sediment. Water jets expose the invertebrates on which this Lake Malawi
      haplochromine mainly feeds. The trade name Steveni Thick Bars is associated with it, but Taiwan
      Reef usually denotes a separate undescribed fish. Identification matters because closely similar
      Protomelas share a presumed crossing risk."

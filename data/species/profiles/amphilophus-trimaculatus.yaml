  sizeAndGrowth:
    text: "Plan around a typical well-grown aquarium male of 35 cm and female of 25 cm. Some males exceed\
      \ that figure. FishBase male records use standard length, which excludes the tail, and cannot be\
      \ substituted directly for aquarium total length. As juveniles grow, waste output and the force\
      \ with which they move decorations increase. The provisional 10 to 15 year lifespan comes from care\
      \ advice rather than a verified longevity series. Arrange adult accommodation and separation space\
      \ before obtaining young fish."
    sources:
    - kind: database

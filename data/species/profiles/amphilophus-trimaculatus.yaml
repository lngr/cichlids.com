  note: "The Catalog of Fishes accepts Amphilophus trimaculatus; Amphilophus, the legacy Cichlasoma genus\
    \ and Mayaheros were checked. Trimaculatus is not a valid Mayaheros species in that catalog, and Mayaheros\
    \ trispilus is a different species. Heros trimaculatus is the original combination; other listed historical\
    \ names follow the catalog, with Amphilophus trimaculatum retained as an older gender-ending spelling\
    \ used in hobby sources. The lectotype locality is Puerto Chiapas. San Geronimo, cited by Aquarist\
    \ Atlas as a type locality, belongs to the synonym Cichlasoma mojarra. The generator's Seriously Fish\
    \ request failed, but checker and adjudicator requests produced archived readable content, retained\
    \ here."

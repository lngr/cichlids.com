    rationale: "The current Catalog of Fishes and FishBase establish the Pacific drainage range from Mexico\
      \ to El Salvador. The full profiles differ mainly in wording and locality selection; retain their\
      \ native Pacific localities together. Beerlink extends the range to Goascoran on the Honduras border,\
      \ whereas Atlantic Lacanja and Coatzacoalcos records have unresolved natural origin. These conflicting\
      \ reports remain cited without expanding the accepted native range. There is no named reference-table\
      \ water body for this fish."

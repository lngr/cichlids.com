partners:
  suitable:
  - species: Herichthys carpintis
    reason: "The green Texas cichlid is a robust dealer-suggested candidate, though severe aggression\
      \ remains possible."
    condition: "A single trimac only, without a breeding pair, in a substantially larger partitionable\
      \ aquarium than the 900 L pair minimum; comparable adult sizes, separate retreats and immediate\
      \ separation available."
  - species: Rocio octofasciata
    reason: Imperial lists the Jack Dempsey as a possible companion; a smaller or shy individual may be
      bullied.
    condition: "A single trimac only, without a breeding pair, in a substantially larger partitionable\
      \ aquarium than the 900 L pair minimum; comparable adult sizes, separate retreats and immediate\
      \ separation available."
  - species: Nandopsis tetracanthus
    reason: The Cuban cichlid is a dealer-suggested robust candidate rather than a reliably safe companion.
    condition: "A single trimac only, without a breeding pair, in a substantially larger partitionable\
      \ aquarium than the 900 L pair minimum; comparable adult sizes, separate retreats and immediate\
      \ separation available."
  unsuitable:
  - species: Paracheirodon innesi
    reason: Its small adult size puts it well inside the trimac prey-size range.
  - species: Pterophyllum scalare
    reason: Its slow movement and long fins offer little protection from a powerful territorial fish.
  - species: Amphilophus citrinellus
    reason: Shared curated hybrid group and severe territorial competition make a breeding community unsuitable.
  - species: Amphilophus labiatus
    reason: Shared hybridization group and potentially lethal aggression.
  - species: Flowerhorn
    reason: "Shared hybrid group, uncertain parentage and severe aggression complicate any pairing."
profile:
  overview:
    text: "Amphilophus trimaculatus is the Pacific-slope trimac, a powerful Central American cichlid long\
      \ sold as Cichlasoma trimaculatum. Mature fish usually show dark flank blotches over green or yellow\
      \ tones with red around the head or fins. This profile plans for an established compatible pair\
      \ in a large aquarium that can be partitioned. A dangerous individual may need solitary housing.\
      \ Flowerhorns can resemble the species, so appearance alone is insufficient to establish pure ancestry."
    sources:

    value:
      min: 6.5
      max: 8.4
    confidence: low
    rationale: "Keep the low-confidence median tally range of 6.5 to 8.4. The six proposals form different\
      \ mildly acidic and alkaline envelopes, so their median endpoints are a provisional baseline rather\
      \ than a measured range-wide distribution. Coyuca station means of 6.6025 to 7.0108 and the Conkel\
      \ secondary report of 6.4 to 7.0 support the softer-water end; Guatemalan annual means of 7.79 to\
      \ 8.34, lower Tehuantepec means of 8.0 to 8.3 and INEGI warm-river field readings of 6.6 to 8.4\
      \ support the alkaline end. The decision is narrower than ordinary El Salvador occupied-river readings\
      \ of 8.6 to 8.8 and Tres Palos lagoon values of 8.82 to 8.88. The full regional hydrochemistry span\
      \ is 6.52 to 9.32, including a spring, and INEGI spans 5.7 to 8.6 across river elevations. All remain\
      \ evidence. Impacted Pasaquina pH 10.2 to 12.1 and thermal El Sauce pH 9.3 to 9.4 are exceptional\
      \ observations, not aquarium targets. Pollution-associated Tecpan acidity and uncertain Atlantic\
      \ Lacanja occurrence do not establish typical endpoints. Proposals were generator 6.6 to 8.34; checker-a\
      \ 6.6 to 8.8; checker-b 6.4 to 7.1; checker-c 6.4 to 7.1; tiebreaker-1 6.5 to 8.8; tiebreaker-2\
      \ 6.4 to 8.4."

  compatibility:
    text: "Small fish are prey and similar-sized tankmates may still suffer serious territorial injuries.\
      \ The 900 litre minimum is for the established trimac pair, not for a cichlid community. Retail\
      \ accounts mention green Texas, Jack Dempsey and Cuban cichlids as possible robust companions for\
      \ a single trimac, but those options require a substantially larger setup and ready separation.\
      \ They are not recommended additions to the pair setup here. Delicate or long-finned fish are unsuitable.\
      \ Midas cichlids, red devils and Flowerhorn share the existing curated hybrid group and also pose\
      \ severe aggression risks. Hybrid ancestry reports do not justify assuming every related species\
      \ crosses."

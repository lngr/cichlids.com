        agree: 2
        total: 6
    tolerance:
      value:
        min: 6
        max: 8.7
      confidence: low
      rationale: "Keep the low-confidence qualified-majority tally tolerance of 6.0 to 8.7, based on four\
        \ of six agreeing proposals. Farm and Imperial advice supports 6 to 8, Zoopet and Fishipedia extend\
        \ recommendations to 8.5, while AquaInfo gives 7 to 7.5 and Seriously Fish gives a point target\
        \ of 7.0. Natural Lempa and Paz occurrence at 8.6 to 8.8 supplies indirect upper-end support only.\
        \ The decided upper endpoint is narrower than that 8.6 to 8.8 source interval and the two 8.8\
        \ proposals; it is a rounded vote decision rather than a demonstrated chronic threshold. No study\
        \ establishes equal long-term aquarium health throughout the whole interval. Proposals were generator\
        \ 6 to 8.4; checker-a 6.0 to 8.8; checker-b 6.4 to 8; checker-c 6.4 to 8.5; tiebreaker-1 6 to\
        \ 8.8; tiebreaker-2 6 to 8.5."

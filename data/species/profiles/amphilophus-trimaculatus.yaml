  khDkh:
    value:
      min: 4
      max: 6
    confidence: low
    rationale: "Keep the tally value of 4 to 6 dKH with low confidence and no natural-water verification\
      \ object. Its four votes agree within the two-degree tolerance, rather than giving identical bounds.\
      \ Conkel habitat KH of 4 to 6 is known only through Beerlink. The selected range is narrower than\
      \ the Guatemalan ion-based proxy of 2.1 to 7.54 dKH and Papagayo alkalinity of 3.2 to 6.0 dKH. The\
      \ literal Guatemalan alkalinity column would imply 2.57 to 8.99 dKH but appears to duplicate bicarbonate\
      \ mass; both interpretations remain evidence. Coyuca alkalinity of 22.1 to 42.6 dKH-equivalents\
      \ belongs to salt-influenced lagoon water and is excluded. Additional INEGI evidence retained with\
      \ the KH tolerance gives regional warm-river alkalinity of about 1.3 to 6.8 dKH. The narrow baseline\
      \ is provisional, not proof that the fish requires this buffering interval throughout its range.\
      \ Proposals were generator 2 to 8; checker-a 3 to 6; checker-b 4 to 6; checker-c 4 to 6."
    sources:

    tolerance:
      value:
        min: 3
        max: 10
      confidence: low
      rationale: "The proposals in vote order are 2 to 8, 3 to 12, 4 to 6, 4 to 6, 1 to 15 and 1 to 15\
        \ dKH. No qualified majority exists. The middle minima are 2 and 3, averaging 2.5 and\
        \ rounding to 3; the middle maxima are 8 and 12, averaging 10. The tolerance is 3 to\
        \ 10 dKH with low confidence, containing the natural 4 to 6 dKH without widening.\
        \ Beerlink reports 4 to 6 as habitat chemistry rather than a long-term aquarium limit.\
        \ Regional INEGI alkalinity spans about 1.3 to 6.8 dKH; historical Coatan alkalinity\
        \ is about 3.36 dKH and Cahuacan/Suchiate about 0.56 to 1.4 dKH. The Fish Farmer's\
        \ Daughter lists captive stock at KH 15 without units or exposure duration,\
        \ provisionally interpreted as dKH. Together these observations make moderate\
        \ buffering beyond the narrow habitat report plausible for aquarium keeping, but do\
        \ not verify chronic endpoints. The median is a provisional husbandry estimate, not\
        \ evidence of harm outside its bounds."

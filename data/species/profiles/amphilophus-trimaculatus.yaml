  ghDgh:
    value:
      min: 3
      max: 8
    confidence: low
    rationale: "Keep the low-confidence median tally range of 3 to 8 dGH. The median balances regional\
      \ soft-water proxies against the narrow Conkel habitat claim and the harder Papagayo proposal; it\
      \ does not establish an exclusive species requirement. The decision is narrower than the source\
      \ envelopes of 1.8 to 7.24 dGH in the Guatemalan annual-mean table, 1.1 to 6.1 dGH in warm INEGI\
      \ river samples and 1.12 to 3.64 dGH in the historical Coatan/Cahuacan/Suchiate compilation. Lower\
      \ Tehuantepec seasonal means of 8.12 to 8.44 dGH and the Achiguate habitat report of 10 dGH also\
      \ exceed its upper endpoint. The Papagayo study spans 6.2 to 25.8 dGH without simultaneous trimac\
      \ records. These observations remain evidence and limit confidence in the median. Conkel values\
      \ of 4 to 5 dGH are secondary and lack accessible station methods. Coyuca values of 26.8 to 76.5\
      \ dGH describe salt-influenced lagoon chemistry and are excluded from the freshwater baseline. GH\
      \ was converted from total hardness or paired calcium and magnesium, never from conductivity or\
      \ salinity. Proposals were generator 1.8 to 7.3; checker-a 6 to 23; checker-b 4 to 5; checker-c\
      \ 4 to 5; tiebreaker-1 1 to 10; tiebreaker-2 1 to 9."
    sources:
    - kind: literature
      title: "INE (2009). Anuario Estadistico Ambiental de Guatemala 2009, Tables 1.6 and 1.7: INSIVUMEH\

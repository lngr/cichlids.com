  sexing:
    text: "Mature males tend to be larger and may develop a forehead swelling and longer fin extensions.\
      \ Females usually remain smaller and can darken strongly when breeding. Age, condition and locality\
      \ affect these traits, making juvenile sexing by appearance uncertain. Color alone also cannot establish\
      \ species purity. Known lineage and mature observations are more useful than one isolated visual\
      \ trait."

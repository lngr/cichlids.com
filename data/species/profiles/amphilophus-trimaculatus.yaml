  breeding:
    text: "A compatible pair lays adhesive eggs on a cleaned exposed surface and protects the brood with\
      \ both parents. The female often stays close to the eggs while the male defends the surrounding\
      \ area. Large females may produce more than a thousand eggs. Partner aggression is the main practical\
      \ difficulty: Beerlink describes introductions behind a water-permeable partition and breeding with\
      \ the barrier left in place. Newly free-swimming fry can take suitably small foods such as freshly\
      \ hatched Artemia. Brood defense makes additional tankmates especially risky. Plan accommodation\
      \ for offspring and keep a separation option ready even after earlier successful spawning."

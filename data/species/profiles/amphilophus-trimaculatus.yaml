    decision: 4
    rationale: "Generator, checker-b and checker-c propose level 4; checker-a proposes 3. Select 4 because\
      \ Beerlink describes older males requiring isolation or exceptionally large companions and FishProfiles\
      \ reports weaker tankmates being killed. Seriously Fish permits robust communities with enough space\
      \ and Imperial gives conditional companions; their less restrictive interpretations remain evidence.\
      \ Archive accounts add practical warnings but cannot quantify injury rates. This level means potentially\
      \ lethal encounters, not that every individual attacks every similar-sized fish."

    rationale: "All four votes agree on piscivore with bloatSensitive false, retained with medium confidence\
      \ and the tally's exact food list. The native adult Tres Palos gut study has about 60 percent fish\
      \ and thus meets the adult rubric. CRC lists insect, mollusc and fish feeding. Beerlink, FishProfiles,\
      \ Practical Fishkeeping and retailer pages instead describe an omnivore, while the Cauvery abstract\
      \ supports an invertebrate-dominated introduced population. The 2025 review reports invertebrates\
      \ at 55 to 68 percent, plants at 22 to 30 percent and small fish below 10 percent in other accounts.\
      \ Retain all interpretations. Animal-rich prepared foods suit the adult category without requiring\
      \ live fish or excluding plant ingredients. The false bloat flag means no verified specialist grazing-cichlid\
      \ sensitivity was found, not immunity from digestive illness. Food suggestions differ across runs\
      \ and are recorded as a value difference."

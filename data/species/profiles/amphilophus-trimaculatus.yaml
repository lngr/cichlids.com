    decision:
      volumeL: 900
      lengthCm: 240
      depthCm: 60
    rationale: "Start from component medians of the four proposals: 675 L, 195 cm length and 60 cm depth.\
      \ Generator proposes 400/150/60 for one fish; checker-a 450/150/50; checker-b 1200/300/70; checker-c\
      \ 900/240/60. The final social unit is an established adult pair, so combining single-fish and pair\
      \ proposals mechanically would understate the pair requirement. Replace the mixed-unit median with\
      \ the Nordic cichlid association's explicit 900 L and 240 cm recommendation. This medium-trust association\
      \ outweighs Zoopet's 720 L and 200 cm and general smaller care pages; Fishipedia independently asks\
      \ for 1000 L for at least two fish. AquaInfo recommends 300 cm and regards 200 cm as a young-fish\
      \ arrangement. Seriously Fish gives 176 L with a 122 by 38 cm footprint, while FishProfiles gives\
      \ about 284 L for one male; neither establishes a suitable adult pair tank. Depth 60 cm remains\
      \ an explicit layout inference for turning and cover, not a published minimum. A secure divider\
      \ and retreats are required regardless of volume."

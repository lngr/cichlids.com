  social:
    value:
      structure: pair
    confidence: high
    rationale: "Generator proposes solitary routine adult keeping; checker-a, checker-b and checker-c\
      \ propose a pair. Select an established compatible pair as the recommended social unit because CRC\
      \ identifies monogamous mating and the native study confirms biparental care. Beerlink and retail\
      \ experience support solitary housing for intolerant individuals. Pair is conditional on a large\
      \ partitionable aquarium and immediate separation capability, not advice to put an arbitrary male\
      \ and female together. The minimum tank is sized for this pair."

  problems:
    text: "Frequent failures include undersized adult accommodation, incompatible pairing and assuming\
      \ that equally large tankmates can withstand an aggressive fish. Digging may destabilize decorations\
      \ or damage equipment. Excess food raises the load on filtration and maintenance. Parasites have\
      \ been documented in wild Tres Palos fish, which supports quarantine and careful sourcing without\
      \ implying that all captive stock is infected. Appetite loss, injuries or breathing changes call\
      \ for prompt checks of water quality and social stress."

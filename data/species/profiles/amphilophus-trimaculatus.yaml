  habitat:
    text: "The accepted native range follows Pacific lowlands of southern Mexico, Guatemala and El Salvador.\
      \ Slow river margins, mud and sand bottoms, submerged roots and vegetation provide cover. Coastal\
      \ lagoons are also occupied; Tres Palos is reported at 2 to 4 practical salinity units. Habitat\
      \ chemistry varies considerably across the range. The selected natural baseline is 24 to 31 C, pH\
      \ 6.5 to 8.4, GH 3 to 8 dGH and KH 4 to 6 dKH, with uncertain hardness endpoints. Regional and occupied-site\
      \ measurements outside those intervals remain evidence, so they are not exclusive physiological\
      \ limits. Salt-influenced Coyuca water reached about 26.8 to 76.5 dGH and 22.1 to 42.6 dKH-equivalents\
      \ of alkalinity. An El Salvador survey found the fish in thermal El Sauce at 37.4 to 37.6 C and\
      \ pH 9.3 to 9.4, and in impacted Pasaquina at 35.4 to 35.9 C and pH 10.2 to 12.1. Those exceptional\
      \ observations do not set aquarium conditions. Atlantic-drainage occurrence has unresolved natural\
      \ origin."
    sources:
    - kind: catalog-of-fishes
      title: "Eschmeyer's Catalog of Fishes: Amphilophus species"

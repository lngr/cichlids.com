    verification:
      method: qualified-majority
      votes:
        agree: 5
        total: 6
    tolerance:
      value:
        min: 21
        max: 31
      confidence: medium
      rationale: "Keep the medium-confidence tally tolerance of 21 to 31 C. Four proposals agree within\
        \ the temperature threshold; the settled tally widens the husbandry envelope to contain the natural\
        \ maximum of 31 C. Nordic and Zoopet advice gives 21 to 30 C, Seriously Fish and AquaInfo give\
        \ 23 to 30 C, FishProfiles gives 22 to 28 C and Imperial gives 21.1 to 27.8 C. The 31 C endpoint\
        \ follows the selected habitat range rather than a years-long aquarium trial. Stable conditions\
        \ inside the interval are better supported than prolonged maintenance at either boundary. Proposals\
        \ were generator 21 to 30; checker-a 21 to 31; checker-b 22 to 30; checker-c 21 to 30."

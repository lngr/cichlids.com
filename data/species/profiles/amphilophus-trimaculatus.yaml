  socialBehavior:
    text: "A bonded pair shares brood care but may still turn on each other. Adult males can inflict serious\
      \ injuries on partners or rivals, and other large fish may be attacked as well. The pair recommendation\
      \ assumes experience, protected retreats and immediate physical separation capability. An arbitrary\
      \ male-female combination is not an established pair. Observe whether both fish can feed and move\
      \ freely; persistent cornering or damage requires intervention. Some older males need individual\
      \ accommodation. Archive accounts support severe aggression but also show individual variation and\
      \ do not predict every encounter."

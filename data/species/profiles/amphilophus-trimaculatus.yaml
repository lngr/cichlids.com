  diet:
    text: "The adult planning category is piscivore because fish dominated adult stomach contents in a\
      \ native Tres Palos sample. Juveniles took more invertebrates, and other populations or reviews\
      \ describe an invertebrate-rich mixed diet. This explains the omnivore label in several care accounts.\
      \ Suitable prepared carnivore-cichlid pellets can form the staple, varied with frozen shrimp, aquatic\
      \ insect larvae or earthworms; vegetable-containing prepared foods can also contribute. Live feeder\
      \ fish are unnecessary. Measure portions because enthusiastic feeding can lead to excess waste and\
      \ overfeeding. The absence of a specialist bloat flag does not exclude digestive disease."
    sources:

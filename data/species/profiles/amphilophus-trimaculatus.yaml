  temperatureC:
    value:
      min: 24
      max: 31
    confidence: medium
    rationale: "Keep the qualified-majority tally range of 24 to 31 C, supported by five of six votes\
      \ within the one-degree agreement threshold. Tres Palos reports 24.2 to 26.7 C during the fish sampling\
      \ year, although its methods refer to meteorological data; a separate lagoon survey reports 28.8\
      \ to 31.1 C. Lower Tehuantepec seasonal means are 26.7 to 30.5 C, and the Conkel habitat compilation\
      \ reproduced by Beerlink gives 26 to 30 C. This selected interval is narrower than the El Salvador\
      \ occupied-river subset of 23 to 32 C and the regional Papagayo range of 25.3 to 33.3 C. FishBase\
      \ gives 21 to 30 C from an aquarium reference rather than a native collection series. Cold upland\
      \ stations, whole-lagoon seasonal extremes and the thermal El Sauce records of 37.4 to 37.6 C do\
      \ not define routine keeping conditions. These wider observations remain in evidence; the selected\
      \ interval is a planning baseline, not the complete physiological or geographic envelope. Proposals\
      \ were generator 21 to 30; checker-a 24 to 31; checker-b 24 to 30; checker-c 24 to 30; tiebreaker-1\
      \ 23 to 32; tiebreaker-2 24 to 31."

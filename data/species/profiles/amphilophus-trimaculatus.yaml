    verification:
      method: median
      votes:
        agree: 3
        total: 6
    tolerance:
      value:
        min: 3
        max: 20
      confidence: low
      rationale: "The proposals in vote order are 1.8 to 20, 5 to 25, 4 to 20, 4 to 20, 1 to 25 and 1\
        \ to 20 dGH. No qualified majority exists. The middle minima are 1.8 and 4, averaging\
        \ 2.9 and rounding to 3; the median maximum is 20. The tolerance is 3 to 20 dGH with\
        \ low confidence and contains the natural 3 to 8 dGH without widening. Seriously Fish\
        \ recommends around 15 dGH, AquaInfo 12 to 16 and FishProfiles 10 to 20, supporting\
        \ the aquarium plausibility of the upper part. AKVARISTA gives 9 to 25 and Aqua-Fish 8\
        \ to 24 dGH. Measured native river intervals of 1.12 to 3.64 and approximately 1.1 to\
        \ 6.1 dGH support softer water, although their lower portions lie below the decision.\
        \ The soft endpoint is an inference from habitat evidence, and multiyear aquarium\
        \ endpoint trials are absent. The range expresses a practical keeping estimate rather\
        \ than established physiological limits."

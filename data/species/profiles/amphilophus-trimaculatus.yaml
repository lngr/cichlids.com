  hybridGroups:
    value:
    - amphilophus-trimaculatus-midas
    confidence: medium
    rationale: "All four votes select only amphilophus-trimaculatus-midas, retained from the unanimous\
      \ tally with medium confidence. The existing curated group already contains Amphilophus trimaculatus\
      \ with A. citrinellus, A. labiatus and Flowerhorn. Magalhaes and colleagues identify traded Flowerhorn\
      \ as trimaculatus crossed with citrinellus. Sari and colleagues find trimaculatus mitochondrial\
      \ ancestry in six Flowerhorn morphotypes. These reports support involvement in hybrid lines, but\
      \ maternal barcoding and lists of ancestors do not independently verify every pairwise crossing\
      \ or free partner choice. Retain the existing group unchanged as instructed and do not infer additional\
      \ crosses transitively with Vieja or other Flowerhorn ancestors."

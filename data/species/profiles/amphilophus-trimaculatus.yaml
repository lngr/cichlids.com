  husbandry:
    text: "For an established adult pair, provide about 900 litres with a footprint of 240 by 60\
      \ cm and a secure divider available. The volume and length follow association guidance;\
      \ depth is a practical estimate for turning and cover. Provide open swimming space and\
      \ sheltered areas behind securely supported rocks or wood. Digging must not undermine\
      \ heavy structures or expose fragile equipment. Use effective biological filtration,\
      \ surface movement and regular partial water changes. The settled maintenance envelopes\
      \ are 21 to 31 C, pH 6.0 to 8.7, GH 3 to 20 dGH and KH 3 to 10 dKH. Their endpoints are\
      \ not equally well established; the KH interval is an uncertain husbandry estimate\
      \ rather than a demonstrated physiological limit. Keep conditions stable rather than\
      \ targeting boundaries."

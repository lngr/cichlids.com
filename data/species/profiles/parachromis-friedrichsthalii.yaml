partners:
  suitable:
  - species: "Vieja melanurus"
    reason: "An NVC aquarium account includes this large cichlid under the old synspila name alongside loisellei.\
      \ This is one mixed-tank observation, not a reliable prediction of pair compatibility."
    condition: "Much larger than the 720 L pair minimum; the reported aquarium measured 250 x 80 x 70 cm. Robust\
      \ adults need distinct retreats, separate feeding and immediate separation capacity."
  unsuitable:
  - species: "Paracheirodon innesi"
    reason: "Small adults are below the approximately 10 cm prey-size threshold used by the planner for a 30 cm\
      \ level-2 predator."
  - species: "Parachromis dovii"
    reason: "Much greater size and aggression combine with the curated presumed crossing risk; it is not a suitable\
      \ companion for breeding stock."
  - species: "Symphysodon aequifasciatus"
    reason: "Slow feeding and a calmer social style make a territorial large guapote an unsuitable companion even\
      \ where temperature overlaps."
profile:
  overview:
    text: "Parachromis friedrichsthalii is the valid name of the southern Central American fish formerly sold as\
      \ P. loisellei. Older references often use friedrichsthalii for a northern species now called P. multifasciatus.\
      \ Check that identification before applying care advice. Adults have a yellow or olive background with dark\
      \ lateral markings and finer male patterning. This is a substantial territorial cichlid for keepers who can\
      \ provide adult space and manage pair conflicts."
    sources:
    - kind: "catalog-of-fishes"
      title: "Eschmeyer's Catalog of Fishes: Parachromis species, online update 21 September 2026"
      url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Parachromis"
      archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-251c79f3/2026-10-14T101709Z
      accessed: "2026-10-13"

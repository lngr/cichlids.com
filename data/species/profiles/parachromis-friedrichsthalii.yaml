  sizeAndGrowth:
    text: "Plan for males up to about 30 cm and females up to about 25 cm in well-kept aquaria. Other species accounts\
      \ give 25 and 20 cm, so these planning maxima carry medium confidence. A scientific standard length excludes\
      \ the tail and cannot be substituted directly for aquarium total length. Growth increases the space needed\
      \ for turning and the size of vulnerable companions. Published longevity estimates span 8 to 15 years, rather\
      \ than defining a guaranteed lifespan."

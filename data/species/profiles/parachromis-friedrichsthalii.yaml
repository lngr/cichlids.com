  problems:
    text: "Pair conflict, prey-sized companions and inadequate adult space are the main practical risks. Digging\
      \ can undermine loose decorations and heavy feeding can strain filtration. Observe appetite, breathing, body\
      \ condition and signs of exclusion during routine care. Poor water quality and social stress can occur together;\
      \ a false bloat flag does not remove the need to investigate persistent swelling or loss of appetite. Choose\
      \ stable maintenance conditions rather than repeatedly altering chemistry to force breeding."
    sources:

  socialBehavior:
    text: "A compatible adult pair is the recommended unit. Male pursuit and conflicts with surplus adults require\
      \ close observation and refuges; simply buying one fish of each sex does not establish compatibility. Adult\
      \ aggression is rated 3 toward both conspecifics and other species. A spawning pair may inflict much more\
      \ severe injuries on companions, and formerly stable relationships can change. Separate a persistently excluded\
      \ or injured fish promptly."
    sources:
    - kind: "database"
      title: "FishProfiles.com: Parachromis loisellei"

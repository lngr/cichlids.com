  legacyNames:
  - "Parachromis loisellei"
  - "Parachromis friedrichsthalii"
  - "Cichlasoma friedrichsthalii"
  note: "The Catalog of Fishes confirms Parachromis friedrichsthalii (Heckel, 1840) and treats Cichlasoma loisellei\
    \ as its junior synonym after Morgenstern (2018). The accessible revision abstract supports the same change.\
    \ Former northern aquarium friedrichsthalii is P. multifasciatus; FishBase under friedrichsthalii, TropicalFreshwaterFish\
    \ and AquaInfo still retain northern or mixed ecological content and do not establish this species diet or water\
    \ needs. The FishBase loisellei account matches the southern species. Both Parachromis and the historical Cichlasoma\
    \ genus lists were queried. Bussing and Morgenstern downloads exposed abstracts or repository descriptions only.\
    \ The Wong CRC article could not be reopened within the timeout and is retained solely as earlier-checker verification\
    \ context, without new endpoint support.
    The legacy catalog also held the species under Parachromis friedrichsthalii and Cichlasoma friedrichsthalii, and both entries map to this profile."

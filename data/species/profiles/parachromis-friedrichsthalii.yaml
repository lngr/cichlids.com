  breeding:
    text: "Pairs lay eggs on a cleaned solid surface and defend eggs and young. Stones provide spawning surfaces,\
      \ while the surrounding soft substrate allows brood pits. Shelter use does not make the fish an obligatory\
      \ cave spawner. Pair formation and brood defense can disrupt a mixed aquarium, so prepare separate accommodation\
      \ before breeding. Plan suitable food and space for juveniles and retain locality and parentage records."

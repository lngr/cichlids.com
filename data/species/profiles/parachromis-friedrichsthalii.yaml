  sexing:
    text: "Adult males generally grow larger and develop more intricate body and fin markings. Females often appear\
      \ more uniformly yellow with clearer dark lateral markings. Age, lighting and mood affect these traits, and\
      \ juveniles are harder to assess. Combine size and pattern observations rather than relying on a single photograph\
      \ or assuming two differently colored fish will form a compatible pair."
    sources:

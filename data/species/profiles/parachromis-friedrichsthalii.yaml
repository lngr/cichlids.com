      accessed: "2026-10-13"
  compatibility:
    text: "Small fish are potential prey at predation level 2. Larger robust companions are possible only in substantially\
      \ bigger accommodation with distinct retreats and the ability to separate fish. A reported mixed aquarium\
      \ included Vieja melanurus, but one successful arrangement is not a guarantee. The 720 L minimum applies to\
      \ the adult pair. Parachromis dovii also shares a presumed crossing group with this fish; the report is an\
      \ unverified labelled hobby cross, not an established free-choice mating study. A normal feeding-speed category\
      \ remains provisional because competitive feeding rate was not measured."

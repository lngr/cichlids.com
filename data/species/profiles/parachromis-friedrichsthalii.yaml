  habitat:
    text: "The core range follows Caribbean drainages from eastern Honduras to western Panama, with a reported Pacific\
      \ Nicaraguan occurrence. Small vegetated waters, soft bottoms and sheltered lowland river margins feature\
      \ prominently in species accounts. The Lake Nicaragua type-material drainage does not establish occupancy\
      \ of the open lake. Listed natural chemistry is a low-confidence regional synthesis: most water studies did\
      \ not record this fish at each sampling station. Wider river and lake measurements remain visible in evidence\
      \ and should not be mistaken for a proven aquarium tolerance."
    sources:
    - kind: "catalog-of-fishes"
      title: "Eschmeyer's Catalog of Fishes: Parachromis species, online update 21 September 2026"
      url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Parachromis"

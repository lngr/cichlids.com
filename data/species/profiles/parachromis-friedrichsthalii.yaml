      rationale: "No qualified majority settles the 6 proposals. generator proposes 24 to 30; checker-a\
        \ proposes 22 to 30; checker-b proposes 24 to 32; checker-c proposes 24 to 30; tiebreaker-1\
        \ proposes 24 to 32; tiebreaker-2 proposes 24 to 30 (C). The rounded median of all minima and\
        \ all maxima is 24 to 30 C. This contains natural 24 to 28 without widening. Confidence is\
        \ low. FishProfiles and Rybicky directly recommend 24 to 30. The wider Nordic and Zoopet\
        \ recommendations of 25 to 32 are not adopted above 30; Einrichtungsbeispiele and FishFish are\
        \ narrower at 24 to 28. The 22 C proposal relies on a mixed-identity account. FishBase 24 to\
        \ 37 describes environmental observations, not years of captive health. Wong supplies\
        \ verification-only evidence at 27.8 C; the unavailable full account does not independently\
        \ establish endpoints. The median is a plausible provisional envelope around the cited care\
        \ recommendations and natural range, with weaker long-term evidence at some edges."

features:
  origin:
    value:
      continent: "Central America"
      region: "Caribbean-slope lowlands from eastern Honduras to western Panama, including the Rio San Juan and\
        \ Lake Nicaragua tributary drainages; reported Pacific occurrence in the Rio Tamarindo, Nicaragua"
      waterbody: null
      localities:
      - "Rio Negro, Honduras"
      - "Rio San Juan and Lake Nicaragua tributary drainages, Nicaragua and Costa Rica"
      - "Sarapiqui drainage, Costa Rica"
      - "Rio San Miguel in the Matina drainage, Costa Rica"
      - "Cricamola and Laguna de Chiriqui coastal drainages, western Panama"
      - "Rio Tamarindo, Nicaragua"
    confidence: "high"
    rationale: "All four profiles describe the southern Caribbean-slope species, with differing locality lists.\
      \ Generator emphasizes eastern Honduras to Panama, checker-a adds the Lake Nicaragua and San Juan drainage,\
      \ checker-b adds the Cricamola and Tamarindo records, and checker-c explicitly includes the Pacific Nicaraguan\
      \ occurrence. Merge these regional records using the Catalog of Fishes, the Bussing and Morgenstern abstracts,\
      \ FishBase under loisellei, and the Angulo Sarapiqui occurrence survey. Lake Nicaragua is a drainage and type-material\
      \ reference, not proof of occupancy in open lake water; Beerlink specifically reports tributary habitat and\
      \ avoidance of the open lake. Northern Mexico, Belize and Guatemala records under the former friedrichsthalii\
      \ name concern multifasciatus."

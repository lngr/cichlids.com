  husbandry:
    text: "Provide at least 720 litres with a 200 cm length and a 60 cm depth for a compatible adult pair. The depth\
      \ is a practical footprint inference; minimum published volumes vary widely. Arrange anchored wood and stable\
      \ stones over a soft substrate so that each fish can retreat out of sight. Robust plants may be used but can\
      \ be uprooted. Established filtration, regular water changes and a ready divider are essential. A routine\
      \ temperature near 25 to 28 C and stable pH near 7 to 8 sit within the stronger captive recommendations. Very\
      \ low GH or KH endpoints are provisional containment of habitat proxies, not demonstrated long-term targets."
    sources:
    - kind: "database"

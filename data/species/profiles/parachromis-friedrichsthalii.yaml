      rationale: "Qualified-majority tally decision of 0 to 15 with low confidence. Generator proposed 1 to 15,\
        \ checker-a 1 to 12, checker-b and tiebreaker-1 0.1 to 17, checker-c 1 to 14, and tiebreaker-2 0.05 to 15.\
        \ Five votes agree within two dKH; their median minimum rounds to 0 and median maximum is 15. Werner reports\
        \ keeping and reproduction at 11 to 15 dKH in the accessible indexed passage. A wider source claim of about\
        \ 16.8 dKH, supporting the 17 proposals, comes from an unverified retrospective former-loisellei forum account\
        \ and is not adopted as the upper endpoint. The retailer range of 4 to 8 has low weight. Baronas and Pringle\
        \ provide alkalinity context, not chronic captive trials; FishProfiles and Einrichtungsbeispiele publish\
        \ no KH limits. Wong is earlier-checker verification only because access timed out. No two independently\
        \ read literature or database husbandry sources establish the full chronic interval, especially its near-zero\
        \ lower end. The decided envelope remains provisional; GH and pH cannot substitute for KH."

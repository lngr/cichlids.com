      accessed: "2026-10-13"
  diet:
    text: "The decided natural feeding category is invertivore: insect prey receives the strongest species-specific\
      \ support, although small fish are also eaten. Offer complete carnivorous-cichlid pellets with varied insect\
      \ larvae, worms, mysis or shrimp and occasional fish-based frozen food. Check that both adults feed and remove\
      \ leftovers. The sources differ about the importance of fish in the wild. The false bloat-sensitivity flag\
      \ is an inference from animal-based feeding advice and does not imply freedom from digestive illness."
    sources:
    - kind: "database"

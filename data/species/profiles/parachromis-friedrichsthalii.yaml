    confidence: "low"
    rationale: "Retain the tally value of 0 to 13 dKH and low confidence; this plain natural-water fact intentionally\
      \ has no verification object. Generator and checker-c proposed 1 to 14, checker-a 1 to 4, checker-b and tiebreaker-1\
      \ 0.1 to 13.2, and tiebreaker-2 0.05 to 13.2. Five votes form the qualified-majority cluster; their median\
      \ bounds round to 0 and 13. Baronas published rounded surface-water alkalinity equivalent to 0.056 to 13.104\
      \ dKH; its deposited spreadsheet resolves the wider range of 0.0448 to 13.104 dKH, so the rounded upper limit\
      \ is slightly narrower than the observation and is not a physiological boundary. Pringle gives 1.53 to 2.94\
      \ and Swain lake water 3.36 to 3.64. Oviedo-Vargas DIC minus dissolved CO2 permits only an approximate bicarbonate\
      \ estimate of 5.9 to 6.2. KH is an alkalinity equivalent; neither conductivity nor GH establishes it. Geographic\
      \ transfer to the fish remains provisional."

    confidence: "low"
    rationale: "The tally retains 24 to 28 C with unanimous agreement within its one-degree comparison rule. Generator\
      \ and checker-c proposed 24 to 28, checker-a 24 to 29, and checker-b 24.9 to 27.2 C. Baronas measured 24.4\
      \ to 27.2 C in selected regional surface waters; the stricter low-elevation selection is 24.9 to 27.2. Wider\
      \ source ranges are Gutierrez-Fonseca 21.4 to 27.2, Clark et al. 22.3 to 28.5, the Juan Lopez study 25.8 to\
      \ 30.3, and FishBase under loisellei 24 to 37 C. These are retained as evidence rather than collapsed into\
      \ a claim of universal occupied-site limits. Lake Nicaragua surface water at 25 to 28 C is drainage context\
      \ only, especially because Beerlink reports this fish in tributaries rather than the open lake. No concurrent\
      \ fish census establishes occupancy at every chemistry station; confidence remains low."

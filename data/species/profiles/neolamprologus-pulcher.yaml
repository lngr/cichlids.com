        - by: "checker-c"
          value: true
        - by: "tiebreaker-1"
          value: true
        - by: "tiebreaker-2"
          value: true
      decision: true
      rationale: "The tally selects true by qualified majority, five of six votes, with medium confidence. Generator
        proposed false because some large mixed tanks are possible; checker-a, checker-b, checker-c,
        tiebreaker-1 and tiebreaker-2 proposed true for normal long-term family husbandry. Seriously Fish,
        Tanganyika.si and Rambo recommend a dedicated aquarium, and Maidenhead describes eventual displacement
        of companions as broods accumulate. DRTA, Fischlexikon, a Maidenhead mixed-tank example, WetWebMedia
        FAQs and archive reports permit communities under particular conditions; all dissenting evidence is
        retained. The flag expresses the usual species-only recommendation and does not claim that every large
        mixed aquarium fails. It applies to the established family at the selected minimum tank. Seriously
        Fish's use of brichardi images and common names is a taxonomic ambiguity, so the separate pulcher
        specialist sources provide an important cross-check."

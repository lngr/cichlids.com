      rationale: "The qualified-majority 15 to 20 dKH decision treats lake chemistry and matching care
        recommendations as tolerance boundaries without evidence of harm outside them. The
        adjudicated tolerance is 8 to 25 dKH, derived from JBL Tanganyika guidance of 8 to 20 for
        species including N. longior and the explicit Midas Cichlid species recommendation of 9 to
        25. DRTA and Fischlexikon support routine care at 15 to 20 without establishing harmful
        thresholds. Seriously Fish recommends pH 8 to 9 and GH 9 to 25 dGH, consistent with the
        profile pH tolerance of 7.8 to 9.4 and GH tolerance of 9 to 25 dGH. GH is not a KH
        conversion. Natural 15 to 20 dKH is contained. Low confidence reflects congener
        extrapolation and weak evidence for lifetime exposure at either endpoint."

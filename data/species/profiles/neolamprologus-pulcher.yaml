  legacyNames:
    - "Neolamprologus pulcher"
  note: "The Catalog of Fishes accepts Neolamprologus pulcher (Trewavas & Poll, 1952) and N. brichardi (Poll,
    1974) separately. It records an earlier synonym treatment of brichardi under pulcher; Duftner et al.
    (2007) also proposed combining them from mitochondrial results. Those treatments do not replace the
    current catalog status. Crassus, olivaceous and daffodil are catalogued synonyms of pulcher. The public
    CRC heading prints 1972 but its original-description citation and the Catalog both give 1952; the catalog
    year is used. Both the Neolamprologus and historical Lamprologus lists were checked. The CRC public page
    was readable, superseding the generator access failure."

  habitat:
    text: "Rock cavities, sand around the stones and nearby feeding water form one connected habitat. Researchers
      studied Kasakalawe colonies at about 9 to 11.5 m depth, including rocks partly embedded in sand. Adults
      take small drifting prey above their defended refuges and retreat when danger approaches. Other pulcher
      populations use rocky shores around the lake. The natural water values here describe the measured
      Tanganyika envelope: 23 to 29 C, pH 8.4 to 9.4, 10 to 13 dGH and 15 to 20 dKH. The lake has substantial
      buffering, and GH and KH measure different properties."
    sources:
      - *a2
      - *a14
      - *a15
      - *a12
      - *a16
      - *a17
      - *a18
      - *a60
  sizeAndGrowth:
    text: "Allow approximately 9 cm total length for an adult male and 7.5 cm for a female. These planning sizes
      combine aquarium estimates that vary with population and the inclusion of extended tail tips. The female
      figure remains an inference because most accounts give no measured female maximum. Standard length
      excludes the tail and should not be substituted directly. Plan for about five to eight years of care,
      with longer survival possible. A published experiment used fish that had already spent eight years in
      common holding after juvenile rearing."
    sources:

  husbandry:
    text: "The recommended aquarium holds one established family of at least eight fish, built around a compatible
      breeding pair and accepted helpers. The selected minimum is 108 litres with a 120 by 30 cm base. Provide
      stable rockwork with multiple cavities, a sandy substrate, broken sight lines and refuges that
      subordinates can reach. Additional broods soon increase the space requirement, so remove surplus young
      before crowding causes exclusion. Mature filtration, good oxygenation and consistent water changes help
      maintain stable conditions. Routine care around 24 to 27 C and pH 8 to 9 has stronger support than
      continuous maintenance at the tolerance extremes. Measure GH and KH separately."
    sources:

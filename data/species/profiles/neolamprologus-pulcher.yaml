  diet:
    text: "Animal plankton and other small invertebrates provide its principal natural food. Offer appropriately
      sized complete prepared foods with varied frozen or live invertebrates such as Daphnia and Artemia. A
      small plant supplement can fit a varied captive menu without changing its invertivore classification.
      Long-lived laboratory fish received flakes and regular frozen zooplankton. Make sure subordinate fish
      reach their share and remove uneaten food. BloatSensitive is false because no special low-protein
      grazing requirement is supported, rather than because digestive illness is impossible. Small fry may be
      eaten opportunistically, particularly when the family becomes crowded."
    sources:
      - *a2
      - *a22
      - *a35
      - *a99
      - *a88
  breeding:
    text: "A compatible pair deposits eggs on a protected surface within a rock cavity. Brood care can include
      both breeders and accepted older young, while the female commonly spends more time near the eggs. Brood
      sizes and the division of care vary. Newly swimming fry can take appropriately small foods including
      freshly hatched Artemia. Leaving a limited number of youngsters with the pair can develop the helper
      family that makes this species interesting. Repeated spawning also fills available shelter, so have a
      destination for surplus young and review space and individual welfare after each brood."
    sources:
      - *a11
      - *a2
      - *a35
      - *a20
      - *a42
      - *a100
      - *a53
      - *a87
  sexing:
    text: "Mature males tend to be slightly larger with longer dorsal and tail extensions, but age and condition
      can obscure those differences. Yellow intensity alone does not reliably distinguish the sexes. The older
      claim that males are smaller conflicts with the specialist accounts and is not followed. A pair observed
      to coexist and breed offers firmer evidence than two fish selected solely by appearance. Moving an
      established pair can still change its behaviour, so monitor both animals after transfer."
    sources:
      - *a35
      - *a42
      - *a60
      - *a20
      - *a21
      - *a99
  compatibility:
    text: "The decided speciesOnly flag is true: an established family should normally have its own aquarium.
      Seriously Fish and some other husbandry sources describe exceptional large Tanganyika communities with
      Cyprichromis, shell dwellers or separately sheltered rock species. Those possibilities do not make them
      recommended partners for the minimum family tank, and a growing colony may eventually displace them. The
      profile therefore lists no generally suitable heterospecific partners. Keep the presumed crossing
      cautions for N. brichardi and the other curated princess-cichlid members. Large piscivores also threaten
      pulcher, and fry survival can be reduced by otherwise robust neighbours."

    rationale: "The settled lake decision is 23 to 29 C, with waterbody verification and high confidence. Verburg
      et al. measured hourly buoy temperatures of 23.85 to 29.01 C at 1 m near Mpulungu; Plisnier station
      results provide additional seasonal coverage. The decided interval is the required rounded lake envelope
      rather than a care-sheet target. FishBase gives a narrower 24 to 26 C summary, retained in evidence."

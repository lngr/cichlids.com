    confidence: "high"
    rationale: "The settled natural interval is 10 to 13 dGH, with waterbody verification and high confidence.
      Lake studies measure calcium and magnesium separately. Talling and Talling, as compiled by FAO, give 9.8
      mg/L calcium and 43.3 mg/L magnesium, equivalent to about 11.35 dGH using Ca/7.14 plus Mg/4.34. The
      annual station measurements and northern-basin chemistry support the rounded lake envelope. FishBase
      gives an incomplete lower limit of 18 dH; it remains as dissenting evidence. GH is distinct from
      carbonate alkalinity."

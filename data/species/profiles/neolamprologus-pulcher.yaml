  hybridGroups:
    value:
      - "neolamprologus-brichardi-complex"
      - "neolamprologus-brichardi-pulcher"
    confidence: "high"
    rationale: "All four runs name neolamprologus-brichardi-complex and neolamprologus-brichardi-pulcher; the
      tally decides unanimous verification with high confidence. Both curated groups already include N.
      pulcher and both have presumed basis. Seriously Fish warns about crossing among complex members. Duftner
      et al. found mixed mitochondrial clades and discussed historical mixing as one possible explanation of
      intermediate Chaitika markings, while recommending a taxonomic merger. Tanganyika.si also reports
      historical hybridization, without a named freely chosen aquarium cross. These claims and close affinity
      support caution but do not demonstrate documented crossings under the rubric. The current Catalog
      accepts brichardi separately. High confidence concerns retaining the correct group memberships, not
      certainty that every pair has been observed crossing."

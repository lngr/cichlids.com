      proposed false because some large mixed tanks are possible; checker-a, checker-b, checker-c,
      tiebreaker-1 and tiebreaker-2 proposed true for normal long-term family husbandry. Seriously Fish,
      Tanganyika.si and Rambo recommend a dedicated aquarium, and Maidenhead describes eventual displacement

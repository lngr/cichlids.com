        aggression-dilution threshold. Seriously Fish's six young are a temporary selection group reduced to a
        pair, which differs from the adult family selected here. Develop the family from a compatible pair and
        retained offspring; eight unfamiliar adults or several competing pairs are not the recommended group."
    - field: "features.speciesOnly"
      proposals:

        and Maidenhead favour 8.0 to 9.0. Aqua-Fish gives 7.1 to 8.4, Tropical Freshwater Fish 7.2 to 8.5, and
        FishBase 7.3 to 8.5 as environmental data. The lower extensions of those source intervals are not
        adopted. The upper 9.4 includes the natural lake observations rather than a controlled lifelong

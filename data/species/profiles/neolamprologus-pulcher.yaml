        - by: "checker-c"
          value: 3
      decision: 3
      rationale: "Generator proposed level 2, whereas all three checkers proposed 3. Specialist accounts describe a
        growing family collectively extending its defended area and excluding other fish, with companions
        needing robustness and more space. This goes beyond immediate cave defence and supports 3. Reports
        mapped to levels 0, 1 and 2 remain in evidence; some describe an initial mixed setup without a lasting
        outcome. Comparable adults are not routinely reported killed in a suitable setup, so level 4 is not
        adopted. The ordinary recommendation remains species-only."

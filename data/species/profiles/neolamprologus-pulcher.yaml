profile:
  overview:
    text: "A small Tanganyika cichlid can occupy a large place in aquarium life when several generations share a
      home. Neolamprologus pulcher breeds in sheltered cavities and accepted older offspring can help protect
      later broods. Its pale body, yellow accents and extended fin tips explain the familiar daffodil name.
      This profile retains N. brichardi as a separate valid species according to the Catalog of Fishes. Some
      research and hobby accounts combine them, so both the collection locality and head markings matter when
      interpreting labels."
    sources:
      - *a1
      - *a60
      - *a35
      - *a84
      - *a2

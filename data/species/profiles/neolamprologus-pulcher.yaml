          value: 3
        - by: "checker-b"
          value: 3
        - by: "checker-c"
          value: 3
      decision: 3
      rationale: "Generator proposed level 2 for a settled pair, while checker-a, checker-b and checker-c proposed 3
        for an established family. The final social unit includes helpers, and persistent rank disputes,
        outsider rejection and injuries under crowding justify 3. Jordan reports deaths after introductions
        and difficulty housing two groups even in a 180 cm tank. Severe injury and mortality evidence mapped
        to 4 concerns rejected newcomers or crowded pair formation; it does not establish routine lethal
        behaviour within the recommended compatible family. Broad peaceful descriptions from DRTA and
        Aqua-Fish remain as dissenting evidence."

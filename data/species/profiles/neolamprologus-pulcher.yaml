      decision:
        structure: "group"
        minGroup: 8
      rationale: "Generator proposed pair, checker-a group with six fish, and checker-b and checker-c group with
        eight. The final unit is a small established breeding family with accepted helpers, using the explicit
        DRTA recommendation of eight to ten fish to set a practical minimum of eight. CRC and field studies

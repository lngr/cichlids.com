    tolerance:
      value:
        min: 23
        max: 29
      confidence: "medium"
      rationale: "The tally is unanimous at 23 to 29 C with medium confidence. All four runs proposed that interval.
        Seriously Fish recommends 23 to 27 C; DRTA and Maidenhead give 24 to 26 C, Aqua-Fish 23 to 26 C, and
        the olivaceous account 23 to 25 C. The older hobby page gives 26 to 29 C for breeding, while
        eight-year experimental fish lived at 27 plus or minus 1 C. The upper endpoint also contains the
        mandated natural envelope. Continuous years at 29 C are less well established than routine care around
        24 to 27 C; the endpoints are supported planning boundaries, not tested physiological failure limits."

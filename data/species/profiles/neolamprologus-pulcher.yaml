      rationale: "Generator, checker-b and checker-c proposed 108 L with a 120 by 30 cm base; checker-a proposed 200
        L at 120 by 40 cm. The per-dimension medians are 108 L, 120 cm and 30 cm, adopted because Seriously
        Fish explicitly gives this setup for cooperative family breeding and Maidenhead independently
        recommends about four feet of length. It is for one established eight-fish family with varied shelter
        and controlled recruitment, not unrelated adults, two families or a mixed community. Sources span
        Tropical Freshwater Fish 75 to 98 L at 75 cm, Aqua-Fish 100 L, DRTA 80 cm for eight to ten fish,
        Jordan 90 cm for one family, Tanganyika.si 200 L and 300 L or more for larger colonies, and
        Fischwissen 375 L at 150 by 50 cm. These alternatives remain in evidence. Extra retained offspring
        require more room; the cited minimum does not promise capacity for indefinite colony growth."
    - field: "features.lifespanYears"
      proposals:
        - by: "generator"
          value:
            min: 6
            max: 8
        - by: "checker-a"
          value:
            min: 5
            max: 10
        - by: "checker-b"
          value:
            min: 5
            max: 6
        - by: "checker-c"
          value:
            min: 5
            max: 6
      decision:
        min: 5
        max: 8
      rationale: "Generator proposed 6 to 8 years, checker-a 5 to 10, and checker-b and checker-c 5 to 6. The median
        endpoints are 5 and 7 years. The lower endpoint of five follows the aquarium estimate in Aqua-Fish;
        the upper endpoint is increased to eight because Antunes et al. directly studied fish maintained for
        eight years after juvenile rearing. The same paper cites unpublished field observations of six to
        eight years, which are weaker than its own captive survival record. Wikipedia's wider 8 to 10 claim is
        retained but its ten-year endpoint is not corroborated here. Fischwissen's three years or more is a
        lower bound, not a maximum. The decided range is a planning estimate rather than mean lifespan or a
        proven upper survival limit."

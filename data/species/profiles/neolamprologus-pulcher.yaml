  socialBehavior:
    text: "Cooperative breeding coexists with competition over shelter, food and rank. A familiar helper may be
      accepted while a new adult is driven away or seriously injured. The family defends an area that can
      expand as broods accumulate, and both aggression ratings are level 3. Establish a family from a
      compatible pair rather than placing eight unrelated adults together. A temporary juvenile selection
      group may help a pair form, but surplus rivals then need separate accommodation. Watch for fish trapped
      near the surface or excluded from every refuge, and provide a practical separation option. A species
      aquarium is the normal long-term recommendation."

      rationale: "Generator proposed 8 cm male and 6 cm female, checker-a 10 and 8, checker-b 8 and 7, and checker-c
        10 and 8. Their per-sex medians are 9 and 7.5 cm, adopted as approximate well-grown aquarium total
        lengths. Tanganyika.si gives typical adults of 9 to 10 cm and Maidenhead gives 9 cm for the
        synonymized olivaceous form; DRTA gives males 8 cm and smaller females. FishBase and Seriously Fish
        give 7.2 cm male or unsexed TL, while Aqua-Fish and Tropical Freshwater Fish reach 10 cm and Midas
        gives 10 to 12.5 cm. The female estimate is inferred from smaller females and is not a measured
        sex-specific maximum. Mean wild standard lengths, including 7.1 cm males and 6.3 cm females, exclude

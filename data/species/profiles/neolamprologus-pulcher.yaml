    confidence: "high"
    rationale: "All runs identify a Lake Tanganyika endemic. Generator names Kasanga and Kasakalawe, checker-a
      adds southern shoreline localities including Karema and Kambwimba, checker-b names Kasanga, Kasakalawe
      Point and Mbita Island, and checker-c names Kasanga, Mutondwe Island and Kantalamba. The final list
      combines representative localities supported by the catalog, field papers and specialist accounts. The
      southern basin is the main focus of the familiar pulcher phenotype; synonymized forms also broaden its
      distribution. The list is not an exhaustive range map. Lake-wide claims may combine pulcher and
      brichardi under an alternative taxonomy."

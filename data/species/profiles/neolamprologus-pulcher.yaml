      additional valid species."
  - name: "Kambwimba"
    kind: "locality"
    note: "Locality label encountered in the aquarium forum archive; retain only with reliable stock provenance."
  - name: "Chaitika"
    kind: "locality"
    note: "The 2007 field study discusses intermediate gill-cover markings; do not infer a documented aquarium
      hybrid from that alone."
  - name: "Albino"
    kind: "color-morph"
    note: "Occasionally marketed; a 2025 UFMS thesis abstract reports albino offspring in captive pulcher. Check
      strain identity because brichardi and pulcher labels are often conflated."

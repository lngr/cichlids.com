  minTank:
    value:
      volumeL: 108
      lengthCm: 120
      depthCm: 30
    confidence: "medium"
    rationale: "Generator, checker-b and checker-c proposed 108 L with a 120 by 30 cm base; checker-a proposed 200
      L at 120 by 40 cm. The per-dimension medians are 108 L, 120 cm and 30 cm, adopted because Seriously Fish
      explicitly gives this setup for cooperative family breeding and Maidenhead independently recommends
      about four feet of length. It is for one established eight-fish family with varied shelter and
      controlled recruitment, not unrelated adults, two families or a mixed community. Sources span Tropical
      Freshwater Fish 75 to 98 L at 75 cm, Aqua-Fish 100 L, DRTA 80 cm for eight to ten fish, Jordan 90 cm for
      one family, Tanganyika.si 200 L and 300 L or more for larger colonies, and Fischwissen 375 L at 150 by
      50 cm. These alternatives remain in evidence. Extra retained offspring require more room; the cited
      minimum does not promise capacity for indefinite colony growth."

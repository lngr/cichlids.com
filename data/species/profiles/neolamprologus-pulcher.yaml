  khDkh:
    value:
      min: 15
      max: 20
    confidence: "high"
    rationale: "The settled natural interval is 15 to 20 dKH with high confidence and no verification object. The
      lake synthesis combines the FAO/FINNIDA titrations with Cohen et al. and Talling and Talling. The FAO
      compilation reports 6.71 meq/L bicarbonate plus carbonate alkalinity, equivalent to about 18.79 dKH
      using meq/L multiplied by 2.8. This represents buffering rather than calcium and magnesium hardness; the
      two degree scales need not have the same value."

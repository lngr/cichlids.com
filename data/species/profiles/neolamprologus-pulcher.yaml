  problems:
    text: "The central husbandry risk is allowing rapid recruitment to exceed the family aquarium's space. Severe
      damage can occur to a rejected youngster even when the dominant pair appears settled. Persistent hiding,
      missed meals or damaged fins call for checking individual access to refuge as well as water quality.
      Separating an excluded fish before serious injury is easier than trying to reverse repeated attacks.
      Unstable replacement water, waste accumulation and newly introduced disease add further risks.
      Quarantine arrivals and seek qualified help when problems persist; outward signs alone do not identify a
      specific infection."

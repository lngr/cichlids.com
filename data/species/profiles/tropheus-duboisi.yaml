    rationale: >-
      Lake Tanganyika endemic, so the natural range is the measured lake water, and all four runs
      proposed it. Over a year the FAO/FINNIDA programme measured pH 8.8 to 9.2 at the surface and
      8.47 to 9.40 at 40 m, which gives 8.4 to 9.4. FishBase gives 8.5 to 9.0 for the species, inside
      this range. An older source book figure of pH 7.3 to 7.8 contradicts the high alkalinity and
      all modern measurements of the lake.

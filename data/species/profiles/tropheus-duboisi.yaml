      - source: *fishbase
        value: {min: 8.5, max: 9.0}
        note: Species environment line taken from an aquarium atlas.
    tolerance:
      value: {min: 7.9, max: 9.5}
      confidence: medium
      verification:
        method: unanimous
        votes: {agree: 4, total: 4}
      rationale: >-
        The runs proposed lower bounds of 8.0 (generator and checker-c), 7.8 (checker-a) and 7.5
        (checker-b) and all four an upper bound of 9.5; the proposals agree within 0.3 of the
        checker-a range, and the decided range is the median of the lower bounds, 7.9, with the
        shared upper bound of 9.5. The species care sheets agree on 8.0 to 9.5 (Seriously Fish) or
        8.0 to 9.0 (Fishkeeper); Tanganyika.si only requires a pH above 7.5 and names 8.0 to 9.5 as the
        aquarium range for Tanganyika cichlids. The sources span pH 7.5 to 9.5 in all: Tanganyika.si,
        FishProfiles, Tropical Fish Keeping and Aquarium Guide accept 7.5, which lies below the
        decided lower bound. Stable pH matters more than an exact value.

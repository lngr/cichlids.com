  temperatureC:
    value: {min: 23, max: 29}
    confidence: high
    verification:
      method: waterbody
      waterbody: lake-tanganyika
    rationale: >-
      The species is endemic to Lake Tanganyika, so the natural range is the measured lake water, and
      all four runs proposed it. Hourly buoy readings at Mpulungu ran from about 23.9 to 29.0 C, and
      the south of the lake cools during the upwelling season from June to September, which gives 23
      to 29 C. FishBase gives 24 to 26 C for the species; that figure comes from an aquarium atlas
      and lies inside the lake range.

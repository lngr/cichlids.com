      rationale: >-
        All four runs proposed 23 to 29 C. Care sheets put the long-term range at about 23 or 24 to 27
        or 28 C (Seriously Fish and FishProfiles 23 to 27, Fishkeeper 24 to 28, Fishipedia 23 to 28,

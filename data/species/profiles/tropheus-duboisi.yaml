  khDkh:
    value: {min: 15, max: 20}
    confidence: high
    rationale: >-
      Lake Tanganyika endemic, so the natural range is the measured lake water, and all four runs
      proposed it. The lake is strongly buffered: alkalinity of 6.5 to 6.9 meq/L in several studies
      equals about 18 to 19 dKH, and the FAO/FINNIDA titrations of bicarbonate plus carbonate reach
      down to about 15.4 dKH, so 15 to 20 dKH. The carbonate hardness therefore exceeds the total
      hardness.
    sources:
      - *cohen
      - *langenberg
      - *plisnier1
      - *vandenbossche
      - *branchu
    evidence:
      - source: *cohen
        value: {min: 18.2, max: 18.5}
        note: Alkalinity 6.5 to 6.6 meq/L, converted.
      - source: *langenberg
        value: {min: 18.8, max: 19.3}
        note: Alkalinity 6.7 to 6.9 meq/L after Edmond et al., converted.
      - source: *plisnier1
        value: {min: 15.4, max: 20}
        note: Bicarbonate plus carbonate titrations of the FAO/FINNIDA programme.
      - source: *vandenbossche
        value: {min: 18.8, max: 18.8}
        note: Alkalinity 6.71 meq/L after Talling and Talling, converted.
      - source: *branchu
        value: {min: 18.4, max: 18.4}
        note: Bicarbonate plus carbonate surface means, converted.
    tolerance:
      value: {min: 10, max: 20}
      confidence: low
      verification:
        method: unanimous
        votes: {agree: 4, total: 4}
      rationale: >-
        The runs proposed 11 to 22 dKH (generator) and 10 to 20 dKH (checker-a, checker-b and
        checker-c); the proposals agree within 2 dKH, and the decided range is the median of the
        bounds, 10 to 20 dKH. Few sources give a number: two US care sheets state 10 to 20 dKH for

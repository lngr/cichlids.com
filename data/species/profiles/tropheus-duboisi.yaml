variants:
  - name: Maswa
    kind: locality
    note: Central Tanzanian coast (Maswa, Cape Kabogo, Segunga, Halembe); the widest flank bar, mostly yellow above and white below; the most common form in the trade, wild stocks reduced by heavy collecting.
  - name: Kigoma
    kind: locality
    note: Kigoma area, Cape Bangwe and Gombe; a pure white, often incomplete bar.
  - name: Bemba
    kind: locality
    note: The only Congolese population and the type locality; a narrow white to pale yellow bar, often broken.
  - name: Karilani
    kind: locality
    note: Karilani Island, Bulu Point, Katumbi Point and nearby sites south of Kigoma; a narrow white bar that may shrink to one or two spots.
  - name: Muguruka
    kind: locality
    note: Burundi; reported as entirely dark without a light bar.

      Endemic to Lake Tanganyika with a patchy range in the northern half of the lake: a single site
      on the Congolese northwest coast (Bemba), one in Burundi (Muguruka) and several stretches of the
      Tanzanian east coast from Gombe south towards the Mahale Mountains. The Catalog of Fishes,
      FishBase, a phylogeographic study and the Tanganyika.si species pages agree; the locality list
      merges the sites named by these sources.

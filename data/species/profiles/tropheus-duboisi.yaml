partners:
  suitable:
    - species: Eretmodus cyanostictus
      reason: A goby cichlid of the rocky surf zone that also grazes algae, stays near the bottom and copes with the same lean diet.
      condition: Tank of at least 150 cm with several separate rock piles.
    - species: Tanganicodus irsacae
      reason: A small goby cichlid that hugs the bottom among the rocks, keeps out of the colony's way and does well on the same light rations with small crustaceans as a supplement.
      condition: Plenty of rock cover near the bottom.
    - species: Spathodus erethrodon
      reason: Another goby cichlid of the shallow rocky zone that picks at the rock surfaces and shares the water and food needs of the Tropheus.
    - species: Julidochromis regani
      reason: A cave-dwelling lamprologine that holds a small rock territory and is robust enough for an active Tropheus group.
      condition: Large tank with deep rock crevices; feed the Julidochromis without rich foods that the Tropheus could take.
  unsuitable:
    - species: Tropheus moorii
      reason: Shares the presumed Tropheus hybrid group, and the colonies of two Tropheus fight over the same feeding areas.
    - species: "Tropheus duboisi (another locality)"
      reason: Different localities such as Maswa and Kigoma interbreed freely and lose their identity.
    - species: Cyphotilapia frontosa
      reason: Needs a protein-rich diet that causes bloat in Tropheus and grows large enough to swallow young fish.
    - species: Maylandia zebra
      reason: An aggressive Lake Malawi mbuna that competes for the same rock and algae niche, and the two lakes differ in water chemistry.
profile:
  overview:
    text: >-
      Tropheus duboisi is a stocky algae grazer from the rocky shores of Lake Tanganyika and the
      oldest lineage of its genus. Juveniles are among the most striking fish of the lake: jet black
      with rows of white to light blue dots. Adults lose the dots and turn into dark fish with a blue
      head and one vertical white or yellow bar, whose width depends on the locality. The species is
      considered the mildest member of the genus and the usual entry point for keepers who want
      Tropheus, yet it is still a demanding fish: it needs a colony of about fifteen, a long tank, very
      clean hard water and a lean plant-based diet. Heavy collecting has thinned some wild
      populations, and the IUCN Red List assesses the species as Endangered, so captive-bred fish are
      the better choice.
    sources:
      - *fishbase
      - *sf
      - *tsi
      - *sturmbauer
  habitat:
    text: >-
      The species is endemic to Lake Tanganyika and occurs in scattered populations in the northern
      half of the lake: at Bemba in the Congo, at Muguruka in Burundi and along several stretches of
      the Tanzanian coast between Gombe and the Mahale region. It lives over rocky slopes, often deeper
      and over more silted rock than other Tropheus, mostly at 6 to 10 m and down to about 30 m. Where
      it meets other Tropheus or the large Petrochromis grazers in shallow water, they push it into
      the deeper zone. The lake water is warm, about 23 to 29 C, and strongly alkaline, with pH around
      8.4 to 9.4 and a carbonate hardness higher than its total hardness, and it is clear and rich in
      oxygen in the upper layers.
    sources:
      - *cof
      - *fishbase
      - *tsi
      - *kohda92
      - *plisnier1
      - *verburg
  sizeAndGrowth:
    text: >-
      Well-kept males usually reach about 13 cm and females about 12 cm. Imported wild fish are
      sometimes a little bigger, and single aquarium fish may exceed 14 cm. Young fish in the trade,
      often 3 to 5 cm long, still show the dotted pattern. The dots fade gradually as the fish mature
      and the light flank bar develops in their place; females often keep traces of the dots longer
      than males. Sexual maturity is usually reached at around one year, although some fish start
      later. With good care the species can live for about a decade.
    sources:
      - *fishbase
      - *sf
      - *tsi
      - *fk
      - *fishipedia
      - *fprof
  husbandry:
    text: >-
      Plan a tank of at least 150 cm length and about 400 L for a group. Sand serves as substrate, and
      several separate rock piles with caves break the lines of sight so that subordinate fish can
      escape the dominant male. Bright light lets algae grow on the stones, which the fish graze all
      day. Tropheus react badly to ammonia, nitrite and rising nitrate, so filtration must be strong
      and mature, and large weekly water changes are routine. Keep the water hard and alkaline, around
      pH 8 to 9.5, and the temperature steady at 24 to 27 C; warmer water holds less oxygen, so strong
      surface movement helps. Buy the whole group at once as young fish and never add newcomers to an
      established colony, because they will be attacked.
    sources:
      - *sf
      - *fk
      - *tsi
      - *tsiwater
      - *konings
  socialBehavior:
    text: >-
      In the lake both sexes hold feeding territories for months; a male range overlaps those of
      several females and is about three times their size. In the tank, one male usually takes over
      most of the space and chases other males and unready females constantly. To spread this
      pressure the species is kept as a colony of about fifteen or more, with clearly more females
      than males. In small groups weaker fish are bullied until they die, and a female removed for
      brooding may lose her rank and be attacked on her return. T. duboisi is considered less
      aggressive than other Tropheus. Towards other species it is more tolerant, although the
      dominant male drives other fish out of the area he claims.
    sources:
      - *yanagisawa93
      - *sf
      - *fk
      - *tsi
  diet:
    text: >-
      In the wild it plucks filamentous algae and the small organisms living in them from the rocks.
      Like other algae grazers it has a long gut suited to this low-protein food. In the aquarium a
      good spirulina flake or pellet is the safest staple, together with algae grown on the decor and
      occasionally blanched vegetables or nori. Coarse crustaceans such as Cyclops, Daphnia or Mysis
      are acceptable as a small supplement. Soft, rich foods like red mosquito larvae, brine shrimp in
      quantity or meat are dangerous. Feed once a day, or in several small portions, and give only as
      much as the group finishes within about two minutes. Overfeeding is the most common cause of
      losses.
    sources:
      - *konings
      - *tsi
      - *sf
      - *fk
      - *fishbase
  breeding:
    text: >-
      The species is a maternal mouthbrooder that breeds readily in a well-run colony. The dominant
      male courts a ripe female over a calm patch of his territory; she lays her large eggs one by one
      and takes them into her mouth, where they are fertilised. Clutches are small, usually about five
      to sixteen eggs. The female carries the brood for roughly three to four weeks and keeps grazing
      during this time. She then releases the fry and guards them for a few days. Moving a brooding
      female is risky because she may lose her place in the group; if it is necessary, catch her in
      darkness. The fry take fine dry food and newly hatched brine shrimp from the start.
    sources:
      - *sf
      - *tsi
      - *fk
      - *yanagisawa93
      - *fishbase
  sexing:
    text: >-
      Males and females wear the same colours, so sexing by eye is difficult. Males usually grow a
      little larger and differ slightly in body shape and growth rate. Females often retain the
      juvenile dots somewhat longer while young. The reliable method is to compare the genital
      papillae: pointed in males, rounder and broader in females. Checking them requires netting the
      fish and some practice. Because the sexes are so hard to tell apart early, most keepers buy a
      larger group of young fish and remove surplus males as they become obvious.
    sources:
      - *sf
      - *fk
      - *tsi
      - *konings
  compatibility:
    text: >-
      The safest setup is a tank for this species alone. In a large tank a few peaceful Tanganyika
      fish that also live on a lean diet are possible, such as the goby cichlids Eretmodus,
      Tanganicodus and Spathodus or a pair of Julidochromis. Any companion must thrive without the
      protein-rich food that would make the Tropheus ill. Avoid other Tropheus, which compete for the
      same space and belong to the same presumed hybrid group, and never mix two localities of T.
      duboisi, because they interbreed freely. Large carnivorous cichlids such as Cyphotilapia
      frontosa need rich food and may eat young fish, and Lake Malawi mbuna are too aggressive and
      need different water.
    sources:
      - *sf
      - *tsi
      - *fk
      - *konings
      - *arch8016
  problems:
    text: >-
      Bloat is the main risk. It typically starts with a fish refusing food and developing a swollen
      belly, and it can kill within days or affect several fish of a group. Protein-rich or soft
      foods, overfeeding and poor water quality are the usual triggers, and several keepers lost whole
      groups after feeding brine shrimp or meaty foods. Prevention means a lean staple diet, small
      rations and regular large water changes. The second common problem is aggression: groups that
      are too small, too few hiding places or newcomers added to an existing colony lead to injuries
      and deaths. A fish that hides constantly or looks sick should be checked early and a vet or an
      experienced keeper consulted.
    sources:
      - *tsi
      - *sf
      - *fk
      - *arch14229
      - *arch17767

  ghDgh:
    value: {min: 10, max: 13}
    confidence: high
    verification:
      method: waterbody
      waterbody: lake-tanganyika
    rationale: >-
      Lake Tanganyika endemic, so the natural range is the measured lake water, and all four runs
      proposed it. The lake is magnesium-rich water of moderate total hardness: calcium and magnesium
      measured by the FAO/FINNIDA programme at three stations give 11.1 to 11.5 dGH, the north basin
      data of Cohen et al. 12.2 dGH, the older data of Talling and Talling about 11.3 dGH and an
      independent ion study 10.6 dGH, so 10 to 13 dGH. FishBase gives 10 to 12 for the species.
    sources:
      - *plisnier1
      - *plisnier2
      - &cohen
        kind: literature
        title: "Cohen, A. S., Talbot, M. R., Awramik, S. M., Dettman, D. L. and Abell, P. (1997). Lake level and paleoenvironmental history of Lake Tanganyika, Africa, as inferred from late Holocene and modern stromatolites. GSA Bulletin 109(4), 444-460 (Table 1, north basin surface water chemistry)."
        url: https://awramik.faculty.geol.ucsb.edu/pubs/COHE9740.pdf
        archived: awramik.faculty.geol.ucsb.edu/pubs/cohe9740.pdf/2026-10-14T094107Z
        accessed: 2026-10-12
      - *vandenbossche
      - &branchu
        kind: literature
        title: "Branchu, P. and Bergonzini, L. (2004). Chloride concentrations in Lake Tanganyika: an indicator of the hydrological budget? Hydrology and Earth System Sciences 8, 256-265."
        url: https://doi.org/10.5194/hess-8-256-2004
        archived: doi.org/10.5194_hess-8-256-2004/2026-10-13T103646Z
        accessed: 2026-10-13
      - *fishbase
    evidence:
      - source: *plisnier1
        value: {min: 11.1, max: 11.5}
        note: Surface means at Bujumbura, Kigoma and Mpulungu, converted from calcium and magnesium.
      - source: *cohen

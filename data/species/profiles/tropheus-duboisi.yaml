  note: >-
    The Catalog of Fishes lists Tropheus duboisi Marlier 1959 as valid, with the type locality Memba
    (Bemba) on the Congolese shore of Lake Tanganyika, and records no junior synonym. The legacy
    catalog used the valid name. Genetic studies place the species as the earliest branch of the
    genus, the sister lineage of all other Tropheus.

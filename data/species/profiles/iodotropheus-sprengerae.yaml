  sizeAndGrowth:
    text: "Plan for typical aquarium adults around 10 cm for males and 9 cm for females. Reports range
      from smaller females to substantially larger males, and scientific standard length excludes
      the tail fin. Those measurements should not be treated as interchangeable. Juveniles can
      reproduce before reaching their adult size. Published lifespan estimates disagree; roughly 4
      to 10 years is a broad planning span with low confidence, rather than a guaranteed duration or
      a proven maximum."

    tolerance:
      value:
        min: 21
        max: 29
      confidence: low
      rationale: "All four main runs proposed 21 to 29 C and the tally records unanimous agreement with
        low confidence. Seriously Fish gives 25 to 29 C, AquaInfo 22 to 26 C, the Nordic register 23
        to 28 C, and Borstein about 24.4 to 26.7 C. The 21 C floor is retained to contain the
        prescribed natural range, not because any source demonstrates multiyear aquarium health at
        that endpoint. Egg incubation at 29 C in the larval-study abstract is not an adult lifetime
        tolerance experiment. Stable conditions near the middle of the care recommendations are
        better supported than continuous endpoint maintenance."

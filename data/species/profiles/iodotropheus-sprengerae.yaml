partners:
  suitable:
    - species: Labidochromis caeruleus
      reason: A frequently recommended calmer Malawi companion with compatible alkaline water and a diet
        that can include a substantial plant component.
      condition: Use a larger aquarium than the single-harem minimum and provide separate shelters for
        each group.
    - species: Chindongo saulosi
      reason: Named by my-fish under its older Pseudotropheus name as a possible calmer mbuna companion;
        adult groups still require separate cover and observation.
      condition: Use at least a 300 litre community with a 120 cm or longer base and multiple rock
        formations; watch the more assertive saulosi male.
    - species: Cynotilapia afra
      reason: Cynotilapia are suggested by the species directory and C. afra in community experience;
        population and individual male temperament affect suitability.
      condition: Use at least a 300 litre community with adequate floor area and cover; select a
        manageable population and monitor male aggression and feeding.
  unsuitable:
    - species: Melanochromis auratus
      reason: Its stronger territorial aggression can overwhelm this relatively mild mbuna.
    - species: Maylandia lombardoi
      reason: Dominant adults can persistently bully rusties and prevent access to shelter or food.
    - species: Nimbochromis livingstonii
      reason: A substantially larger fish-eating Malawi cichlid presents a predation risk and has
        different space and feeding requirements.
profile:
  overview:
    text: "The rusty cichlid combines warm brown-orange colour with a blue to lavender sheen in mature
      males. It is a relatively mild Malawi mbuna, although suitable companions and escape cover
      still matter. The valid name is Iodotropheus sprengerae, including fish formerly separated as
      I. declivitas. Locality labels describe stocks within that species and remain useful when
      preserving identifiable breeding lines."

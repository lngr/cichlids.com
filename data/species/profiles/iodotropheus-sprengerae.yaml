  habitat:
    text: "This fish comes from southeastern Lake Malawi around Chinyamwezi, Chinyankwazi and Boadzulu
      islands, with Makokola Reef also included under the current synonymy. Rock faces and rubble
      provide feeding surfaces and shelter; adjoining sandy spaces form part of its transition
      habitat. Natural lake water is alkaline but soft in calcium-magnesium hardness: GH is 3 to 5
      dGH and KH 5 to 8 dKH. Aquarium recommendations for harder water describe captive maintenance
      rather than the natural habitat."

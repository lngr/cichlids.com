  socialBehavior:
    text: "A single male with at least three females is the selected adult unit; four or more females
      are a supported alternative with enough room. These fish do not form a lasting pair. Brief
      displays and chases can accompany courtship, but persistent injury or exclusion from food is
      not the expected baseline. Accounts differ on territoriality: limited defence of a breeding
      site fits better than assuming a large permanent territory. Several males can coexist in
      larger groups, but that does not make them appropriate additions to the minimum setup."

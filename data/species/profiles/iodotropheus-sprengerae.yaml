    rationale: "The tally fixes natural carbonate hardness at 5 to 8 dKH. Historical alkalinity converts
      to about 5.6 to 7.3 dKH and Branchu measurements to about 6.5 to 6.9 dKH. These support the
      rounded lake envelope. Aquarium KH approximates alkalinity here; sodium contributes to
      bicarbonate charge balance, so KH can exceed GH. Natural KH is a plain fact and carries no
      verification object."

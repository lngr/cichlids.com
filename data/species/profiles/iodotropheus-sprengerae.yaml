        approximately 91 by 46 cm standard breeder footprint is inferred from the tank format, not
        explicitly measured in that report. Malawi-Guru and Einrichtungsbeispiele recommend the
        larger 300 L and 120 cm option for groups. This cautious editorial minimum is not a
        physiological threshold; additional males or companion groups require more space."

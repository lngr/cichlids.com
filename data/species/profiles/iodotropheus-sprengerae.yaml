  diet:
    text: "Use plant-rich flakes or small pellets as the staple, with grazing surfaces and suitable
      greens providing variety. Modest portions of small aquatic invertebrates can supplement this.
      Mixed feeding supports the omnivore classification even though several accounts emphasize
      algal grazing. The bloat-sensitive flag records husbandry warnings about rich animal-heavy
      feeding; it does not imply that every animal food is unsuitable. Excessive Artemia feeding has
      also been associated with digestive trouble in fry. Offer restrained portions and check that
      quieter individuals receive food."

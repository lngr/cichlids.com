        max: 12
      rationale: "The tally selects 5 to 12 dKH by qualified majority, 5 of 6 votes. Generator, checker-b,
        checker-c, tiebreaker-1 and tiebreaker-2 proposed 5 to 12; checker-a proposed 5 to 15 from
        indirect pH and general buffering advice. The natural 5 to 8 dKH baseline anchors the floor.
        Yilmaz explicitly separates KH from GH, gives a minimum near 5 to 6 and prefers 10 to 12;
        Malawi.si gives 6 to 12. Wider source recommendations are OATA 10 to 15,
        Einrichtungsbeispiele 6 to 20, and DRTA 15 to 18 dKH. Those broader endpoints are not
        independently established by lifetime trials, so the narrower working ceiling is retained.
        Twelve dKH is a provisional recommendation rather than a demonstrated biological limit;
        confidence remains low. The commercial PFA page reported blocked by earlier runs was not
        used."

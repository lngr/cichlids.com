  husbandry:
    text: "For one adult male with three females, provide at least 200 litres and a base of 120 by 40
      cm. More fish need more floor area and refuge space. Secure rocks on a stable foundation, add
      sand and leave multiple passages so a chased fish can escape. Mature filtration, regular water
      changes and good surface agitation help keep conditions stable. A routine temperature around
      24 to 26 C has better husbandry support than constant maintenance at the outer 21 to 29 C
      envelope. Keep water alkaline and adequately buffered without assuming that high GH is
      essential. The recorded tolerance limits are working ranges, not targets for repeated
      fluctuations."

        foods:
          - Spirulina-based flakes or small pellets
          - Algae and biofilm
          - Blanched greens
          - Small portions of Daphnia or Cyclops
          - Occasional Artemia
      rationale: "The tally selects omnivore with bloatSensitive true by qualified majority, 5 of 6 votes.
        Generator, checker-b, checker-c and both tie-breakers proposed omnivore; checker-a proposed
        aufwuchs. All proposed bloat sensitivity, while their food lists differed and the tally
        retained the generator list. Mixed plant and invertebrate feeding in NVC, Seriously Fish and
        Malawi-Guru is a better match to omnivore than a specialized low-protein grazer category.
        Borstein and the micro-CT study emphasize herbivory or algal feeding, and CRC verifies
        grazing without originating the decision. my-fish and Yilmaz explicitly warn of bloat with
        excessive rich animal food; Borstein reports digestive trouble in fry given excessive
        Artemia. These are husbandry warnings, not measured adult incidence. Plant-rich staples and
        modest animal supplements remain consistent with the decided class; Yilmaz's heavier
        animal-food emphasis is not adopted."

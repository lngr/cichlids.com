        female: 9
      rationale: "Generator, checker-b and checker-c propose typical aquarium maxima of 10 cm male and 9
        cm female; checker-a proposes 10 and 8. Borstein reports about 10.2 cm males and females up
        to 8.9 cm, supporting the rounded 10 and 9 cm values. NVC gives 11 and 8 cm, FishProfiles
        lists 10 cm for both sexes while describing larger males, and AquaInfo gives the wider 12
        and 9 cm estimate with occasional 13.5 cm claims. The selected typical sizes do not treat
        the largest report as a growth target. FishBase records 10.8 cm standard length for male or
        unsexed fish, not a sex-specific aquarium total-length maximum."
    - field: features.aggressionConspecific

  temperatureC:
    value:
      min: 21
      max: 29
    confidence: high
    rationale: The tally fixes the lake-wide natural envelope at 21 to 29 C. Eccles reports 21 C inshore
      in the southeast arm and about 27 C in the upper layer in May; Branchu and Vollmer provide
      additional campaign and seasonal context. Individual sampled ranges are narrower and must not
      replace the prescribed annual envelope. Only the repository abstract of Ngochera was readable
      through the allowed access route; it confirms seasonal lake sampling but supplies no numerical
      endpoints. The 29 C endpoint is therefore retained from the tally rather than claimed as an
      independently reread dissertation measurement.
    sources:
      - kind: literature
        title: "Eccles (1974). An outline of the physical limnology of Lake Malawi (Lake Nyasa), abstract
          only"
        url: "https://doi.org/10.4319/lo.1974.19.5.0730"
        accessed: 2026-10-13

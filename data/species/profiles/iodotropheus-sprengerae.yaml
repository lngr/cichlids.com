    value:
      min: 7.7
      max: 8.6
    confidence: high
    rationale: "The tally fixes the natural surface-water range at pH 7.7 to 8.6, matching the FAO
      compilation of Jackson and colleagues. Branchu discusses pH 7.5 to 8.5 across the water
      column, including deeper water. That wider depth coverage is not a reason to lower the surface
      habitat boundary. These are lake measurements rather than care-sheet aquarium targets."

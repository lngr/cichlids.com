        - by: generator
          value: 1
        - by: checker-a
          value: 1
        - by: checker-b
          value: 2
        - by: checker-c
          value: 1
      decision: 1
      rationale: "Generator, checker-a and checker-c propose level 1; checker-b proposes level 2 as a
        cautious interpretation of hierarchy and male rivalry. Borstein observed little aggression
        even while spawning, FishProfiles describes generally mild fish, and NVC reports tolerance
        toward conspecifics. With one male and three females in the selected tank, displays and
        brief chases fit level 1 better than routine hierarchy chasing. Rival-male conflict or
        losses in cramped multi-male housing do not describe the stipulated adult unit. Reports
        differ, so confidence stays medium."

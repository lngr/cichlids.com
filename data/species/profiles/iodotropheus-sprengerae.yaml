  ghDgh:
    value:
      min: 3
      max: 5
    confidence: high
    rationale: The tally fixes natural GH at 3 to 5 dGH. Historical calcium and magnesium measurements
      give about 3.2 to 4.9 dGH; the paired upper-layer Branchu samples give about 4.2 to 4.6 dGH.
      The rounded lake envelope contains both. Malawi is naturally soft in calcium-magnesium
      hardness despite its alkaline pH; harder aquarium recommendations belong in tolerance.

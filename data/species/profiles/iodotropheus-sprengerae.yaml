  note: "The Catalog recognizes Iodotropheus sprengerae in its original combination and records the
    neotype PSU 2721 established through Opinion 1871. Iodotropheus declivitas is a junior synonym,
    and Iodochromis sprengeri is a historical misspelling in synonymy. The 1995 proposed neotype and
    distribution split must be interpreted through this current treatment. The legacy and valid
    genera are identical, so one genus query covers both."

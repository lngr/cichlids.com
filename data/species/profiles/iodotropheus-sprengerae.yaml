      decision:
        min: 3
        max: 20
      rationale: "The tally selects 3 to 20 dGH by qualified majority, 5 of 6 votes. Generator, checker-a,
        checker-c, tiebreaker-1 and tiebreaker-2 proposed 3 to 20; checker-b proposed 3 to 25. The
        less permissive 20 dGH ceiling is independently supported by FishProfiles and my-fish, both
        giving 10 to 20. Seriously Fish explicitly allows the wider 10 to 25 dGH source range, but
        its upper endpoint lacks comparable corroboration. DRTA and Malawi.si give 3 to 15,
        Einrichtungsbeispiele 5 to 15, and Yilmaz prefers 7 to 12. The natural 3 to 5 dGH range
        anchors the floor. This is a cautious husbandry synthesis, not proof that 21 to 25 dGH is
        harmful."

      decision:
        size: small
        breedingOnly: true
      rationale: "Generator, checker-b and checker-c propose small defence restricted chiefly to breeding;
        checker-a proposes a small persistent territory from general mbuna territoriality. Borstein
        observed defence only at spawning, and Fischlexikon expressly places territoriality in that
        period. The Nordic register and Malawi-Guru describe no lasting defended territory;
        Seriously Fish describes loose male territories around spawning sites. A small breeding site
        captures the limited aquarium defence without importing the long-term territory claims of
        general mbuna literature. The rubric's approximately 30 cm scale is a category
        interpretation, not a measured diameter. CRC verifies brief breeding defence rather than
        supplying the original value."

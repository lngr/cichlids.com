      rationale: "Generator, checker-b and checker-c include Chinyamwezi and Chinyankwazi islands together
        with Boadzulu Island and Makokola Reef; checker-a restricts the locality list to the
        northern pair. The current Catalog synonymy places the former Boadzulu taxon declivitas
        within sprengerae. FishBase confirms the three islands and AquaInfo explicitly adds Makokola
        Reef. The older Stauffer split and the separation still used by Malawi-Guru cannot narrow
        the current species distribution. All sites are in southeastern Lake Malawi."

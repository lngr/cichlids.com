      rationale: "The tally selects level 0 by qualified majority, 5 of 6 votes. Generator, checker-a,
        checker-c, tiebreaker-1 and tiebreaker-2 proposed 0; checker-b proposed 1. The detailed
        FishBase food record concerns Bagrus meridionalis eggs, despite its broad eggs/larvae
        heading. Egg eating does not establish hunting free-swimming fish up to 2 cm. Seriously Fish
        describes brood consumption under stress and fry-protection precautions, not a measured
        prey-size threshold. The scientific micro-CT account confirms algal feeding, and the
        specialist accounts describe invertebrates and grazing. These are indirect ecological
        support, not experiments excluding all fry consumption. Level 0 permits incidental fry loss;
        low confidence is retained."

  breeding:
    text: "The female incubates eggs and developing young in her mouth after spawning. A swollen throat
      and reduced feeding can identify a holding female. Provide quiet cover and avoid unnecessary
      disturbance. A separate breeding arrangement can protect released young and make parentage
      easier to trace, although adults do not require species-only housing. Finely sized prepared
      foods and appropriately small aquatic foods suit free-swimming fry. A larval experiment used
      about 29 C; that short developmental study does not establish a required everyday temperature
      or a lifetime adult tolerance."

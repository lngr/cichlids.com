  problems:
    text: "Watch for loss of appetite, persistent hiding, weight loss or swelling. Competition can
      prevent a mild fish from feeding even when overt fighting looks limited. Excess food and
      animal-heavy diets can contribute to digestive problems, while poor water quality adds stress.
      Check husbandry promptly when a fish deteriorates and obtain appropriate advice if signs
      persist. Inspect and quarantine incoming stock; the archive includes a report of visible skin
      problems in newly bought juveniles. Stable rockwork and adult-sized escape passages also
      prevent avoidable injuries."

  compatibility:
    text: "Calm Malawi cichlids with compatible feeding and space needs can share a larger tank.
      Labidochromis caeruleus is a frequently named companion; Chindongo saulosi and appropriately
      selected Cynotilapia groups are conditional alternatives requiring more space and observation.
      Avoid dominant aggressive mbuna and large fish-eating cichlids. Predation level 0 for the
      rusty permits incidental fry loss and does not promise safe communal fry rearing. No hybrid
      group is supported by the decided evidence, but that empty list does not establish
      reproductive isolation. A reported display toward a Labidochromis female did not confirm
      hybrid offspring."

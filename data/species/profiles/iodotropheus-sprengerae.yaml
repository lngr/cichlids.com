  sexing:
    text: "Adult males usually become larger and show stronger iridescence, longer fins and more
      prominent anal-fin egg spots. Females may also have egg spots, so none of those clues is
      decisive alone. Juveniles are especially difficult to sex. Confirming the adult sex
      composition is more useful than repeatedly altering food or water when apparent spawning fails
      to produce fertile offspring."

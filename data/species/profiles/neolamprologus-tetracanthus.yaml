    verification:
      method: waterbody
      waterbody: lake-tanganyika
    tolerance:
      value:
        min: 23
        max: 29
      confidence: medium
      rationale: "The settled qualified-majority decision is 23 to 29 C with five agreeing votes of six under the\
        \ one-degree agreement rule. The generator proposed 21 to 31 C; checker-a and checker-c proposed 22 to 29\
        \ C; checker-b, tiebreaker-1 and tiebreaker-2 proposed 23 to 29 C. Aqualog actually recommends 22 to 25\
        \ C, so the final minimum is narrower than that lower recommendation, while the generator's wider 21 to\
        \ 31 C was an extrapolation. Klinesteker gives 23.9 to 27.8 C, the Nordic register 24 to 27.5 C and Fishipedia\
        \ 23 to 28 C. The upper bound is widened to include the natural lake range, not a preferred constant setting.\
        \ Tanganyika.si treats about 30 C as brief exposure only. Equality with the natural range follows the tally\
        \ and habitat-inclusion rule, not demonstrated failure outside it; use stable mid-range temperatures for\
        \ routine keeping."

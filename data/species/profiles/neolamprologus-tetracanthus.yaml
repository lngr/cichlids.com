      value:
        min: 23
        max: 29
      note: "Lake-wide natural surface temperature range. Retained regional lake synthesis, attributed to its underlying\
        \ study rather than an internal table."
    - source: *id008
      value:
        min: 23
        max: 29
      note: lake-wide measured values
    - source: *id010
      value:
        min: 23
        max: 29
      note: Lake range adopted by the regional lake synthesis.
    - source: *id006

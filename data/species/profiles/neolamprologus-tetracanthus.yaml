  temperatureC:
    value:
      min: 23
      max: 29
    confidence: high
    rationale: "All four full-profile runs propose 23 to 29 C. The natural range follows the regional lake measurements:\
      \ Verburg and colleagues report hourly buoy readings of 23.85 to 29.01 C, with seasonal and depth variation.\
      \ FishBase gives a narrower species band of 23 to 25 C; it does not replace the lake-wide natural range."
    sources:
    - *id008
    - *id009
    - *id010
    - *id011

  - field: features.aggressionHeterospecific
    proposals:
    - by: generator
      value: 3
    - by: checker-a
      value: 2
    - by: checker-b
      value: 3
    - by: checker-c
      value: 2
    decision: 3
    rationale: "Generator and checker-b propose level 3; checker-a and checker-c propose level 2. Matsumoto and\
      \ Kohda document exclusion of food competitors within or near a feeding range, which alone supports territorial\
      \ chasing rather than widespread attacks. However, Klinesteker directly observed similarly sized Paratilapia\
      \ with damaged fins and a pair pushing them to the far end of the aquarium during breeding, while Tanganyika.si\
      \ reports strong brood aggression. These aquarium observations support level 3 and robust tankmates with escape\
      \ space. The gentler Nordic and general hobby assessments remain in evidence; the record does not establish\
      \ routine killing of comparable adults in a suitable setup."

partners:
  suitable:
  - species: Large adult Tanganyika cichlids
    reason: Comparable size and robustness can allow coexistence outside the pair's defended bottom area.
    condition: Only in a spacious community aquarium with independent territories beyond the space used by the pair;
      breeding fish may still require separation.
  unsuitable:
  - species: Neolamprologus multifasciatus
    reason: Small adults and bottom-bound shell territories expose them to predation and displacement.
  - species: Lamprologus ocellatus
    reason: Its small size and fixed shell territory offer little protection from a much larger foraging cichlid.
  - species: Xenotilapia flavipinnis
    reason: Delicate sand-associated fish are vulnerable to the defended feeding space and breeding aggression.
profile:
  overview:
    text: "Neolamprologus tetracanthus is a substantial Lake Tanganyika cichlid with rows of pale reflective spots.\
      \ It hunts animal prey around sand and rocks, including snails, shrimp, insect larvae and small fish. A compatible\
      \ adult pair is the stocking unit used here. Territorial behavior and brood defense make space and separation\
      \ options central to its care, despite the intermediate experience rating. It is a different fish from the\
      \ Cuban Nandopsis tetracanthus."
    sources:
    - *id001
    - *id006
    - *id018
    - *id005
  habitat:
    text: "The species occurs widely around Lake Tanganyika, commonly over sand or mud near rocky cover. FishBase\
      \ reports a usual depth of 6 to 12 m, while the specialist account includes deeper records approaching 60\
      \ m. Reproduce the transition with open sand and secure rock structures. Natural regional conditions are 23\
      \ to 29 C, pH 8.4 to 9.4, GH 10 to 13 dGH and alkalinity equivalent to 15 to 20 dKH. Alkalinity and general\
      \ hardness describe different properties."
    sources:
    - *id006
    - *id005
    - *id008
    - *id009
    - *id010
    - *id011
    - *id012
    - *id013
  sizeAndGrowth:
    text: "Use about 20 cm for the typical male maximum and 16 cm for females when planning adult space. Female\
      \ size is an estimate from reported dimorphism rather than a sexed FishBase maximum. Some populations remain\
      \ smaller, and Tanganyika.si reports aquarium individuals reaching 25 cm; these fish may need more space than\
      \ the usual pair. Young fish can grow quickly, so initial juvenile compatibility gives little assurance about\
      \ the mature aquarium. The provisional lifespan expectation is 7 to 10 years."
    sources:
    - *id006
    - *id005
    - *id029
    - *id027
    - *id026
  husbandry:
    text: "Provide a compatible pair with at least 500 litres and a footprint about 200 cm long by 60 cm front to\
      \ back. The depth is a planning estimate. Place substantial rocks on a stable base before adding sand, and\
      \ leave several separated refuges and feeding patches. Keep water well filtered and oxygenated, with regular\
      \ partial changes. Routine temperatures in the mid twenties suit the overlapping care recommendations. The\
      \ broader tolerance endpoints describe uncertain keeping limits and should not be treated as targets."
    sources:
    - *id005
    - *id007
    - *id028
    - *id029
  socialBehavior:
    text: "A pair is a supported aquarium option, but wild mating systems vary. Sefc describes northern populations\
      \ with both parents guarding broods and southern males associated with several females. The profile does not\
      \ impose a universal harem ratio. Nonbreeding females also defend feeding areas about one metre across. Adults\
      \ can reject an extra conspecific or begin fighting after an apparently stable period; provide visual barriers\
      \ and a practical way to separate them before injuries accumulate."
    sources:
    - *id039
    - *id037
    - *id029
    - *id005
  diet:
    text: "Invertebrates are a major part of the recorded prey, although fish small enough to swallow are also at\
      \ risk. Snails may be extracted from their shells rather than crushed. Offer suitable carnivore pellets or\
      \ granules and varied invertebrate foods such as mysis, chopped krill and insect larvae. Prepared food acceptance\
      \ is reported by aquarium keepers. The feeding-speed category remains an estimate. No special protein-related\
      \ bloat tendency was established, but ordinary overfeeding and spoiled food still create health and water-quality\
      \ problems."
    sources:
    - *id006
    - *id018
    - *id037
    - *id007
    - *id028
  breeding:
    text: "The primary classification is open substrate spawning, with eggs on a prepared surface near excavated\
      \ rockwork. Nest sites vary: aquarium sources describe enclosed caves, and Klinesteker observed a clutch inside\
      \ a pot. Offer sheltered surfaces without assuming that every pair uses an exposed nest. Both parents may\
      \ defend a brood, while some wild populations rely mainly on the female. Fry accept suitably small foods,\
      \ including newly hatched brine shrimp. Breeding can sharply increase aggression toward the partner and surrounding\
      \ fish."
    sources:
    - *id018
    - *id005
    - *id039
    - *id029
    - *id007
  sexing:
    text: "Mature males usually become larger, while body color alone is an unreliable guide to sex. The Nordic\
      \ register recommends comparing the genital openings; a breeder remained uncertain about the sexes even after\
      \ successful spawning. Archive thread 15546 also mentions male growth and a forehead development, but this\
      \ is a hobby observation rather than a diagnostic test. A compatible pair requires more than selecting a larger\
      \ and a smaller juvenile."
    sources:
    - *id028
    - *id007
    - *id029
    - *id019
  compatibility:
    text: "Community keeping is possible under suitable conditions, so the species is not restricted to conspecific-only\
      \ housing. Consider only robust adult Tanganyika fish of comparable size in an aquarium that leaves independent\
      \ territories and escape routes. Small shell dwellers, juvenile cichlids and delicate sand species are poor\
      \ choices. Tanganyika.si gives an especially cautious warning for fish under about 10 cm, broader than a simple\
      \ mouth-size rule. A breeding pair can injure or displace previously tolerated fish, making separate housing\
      \ necessary."
    sources:
    - *id005
    - *id007
    - *id029
  problems:
    text: "The most immediate risks are persistent aggression, small fish being eaten and excavated sand undermining\
      \ rockwork. A layout should let a chased fish leave the other adult's view without becoming trapped. Keep\
      \ a separation option available when pairing or breeding. Stable water quality and oxygenation matter more\
      \ than repeatedly adjusting chemistry toward an endpoint. Persistent loss of appetite, damaged fins or abnormal\
      \ breathing need investigation; the available sources do not establish a distinctive species-specific disease\
      \ syndrome."
    sources:
    - *id005
    - *id007
    - *id029

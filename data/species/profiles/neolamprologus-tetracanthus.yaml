    rationale: "The proposal medians are 500 L, 200 cm length and 60 cm depth. Generator, checker-b and checker-c\
      \ propose that footprint; checker-a proposes 300 L and 150 by 50 cm. Tanganyika.si explicitly states at least\
      \ 500 L and about 200 cm for a community, while Fishkeeper gives at least six feet and the Nordic register\

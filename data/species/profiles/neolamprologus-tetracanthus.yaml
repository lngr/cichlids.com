  ph:
    value:
      min: 8.4
      max: 9.4
    confidence: high
    rationale: "All four full-profile runs propose pH 8.4 to 9.4. Plisnier and colleagues measured 8.47 to 9.40\
      \ at 40 m during an annual cycle, supporting the regional lake range. FishBase instead lists pH 7.5 to 8.0;\
      \ this contrary species entry remains in the evidence but is outweighed for natural lake chemistry by the\
      \ limnological measurements."

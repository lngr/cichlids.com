      \ checker-b proposed 8 to 25. The final range is narrower than the explicit 8 to 25 dGH recommendation on\
      \ the Bulgarian aquarium page and the 8 to 20 band on Tropical Freshwater Fish at the lower edge. Atlarium\
      \ gives 10 to 25, Aquarist Atlas 10 to 25 and Fishkeeper 15 to 25. The 9 dGH endpoint is a synthesis between\
      \ proposals, not a directly tested threshold; the range contains the natural 10 to 13 dGH."

  predation:
    value: 0
    confidence: medium
    verification:
      method: qualified-majority
      votes: {agree: 4, total: 6}
    rationale: >-
      Checker-a, checker-b and both tie-breakers voted for level 0, the generator and checker-c for
      level 1. No source reports the species taking fish. In the lake it grazes the biocover of
      rocks and sand (FishBase), the genus is diagnosed by a small mouth with bicuspid front teeth
      of a grazer (Li et al. 2016, abstract), and the Cichlid Room Companion counts it among the
      algae gardeners. Seriously Fish and The Tropical Tank describe a plant eater for peaceful
      Malawi communities. The level-1 votes rested on AquaInfo, which notes that a female eats her
      own fry a few hours after releasing them, on the advice to separate holding females, on a
      dealer warning about shrimp and on one forum report of lost dither fish of unknown size.
      Fry taken by chance in a crowded rock tank fit level 0 of the rubric, so the decided level
      is 0; tankmates' fry are still at risk.
    sources:
      - *fb
      - &li2016
        kind: literature
        title: >-
          Li, S., Konings, A. F. and Stauffer, J. R. (2016). A revision of the Pseudotropheus
          elongatus species group (Teleostei: Cichlidae) with description of a new genus and seven
          new species. Zootaxa 4168(2), 353-381 (abstract).
        url: https://doi.org/10.11646/zootaxa.4168.2.9
        accessed: 2026-10-13
      - *sf
      - *tt
      - *crc
      - *aqi
      - *fk
      - *gar
      - &arc15406
        kind: archive

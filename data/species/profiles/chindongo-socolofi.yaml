        method: unanimous
        votes: {agree: 4, total: 4}
      rationale: >-
        Three votes proposed 7.5 to 8.8 and one 7.5 to 8.6, which lies within the agreement
        threshold. Care sheets start at 7.5 to 7.8 and end at 8.5 to 8.8, with one reaching 9.0;

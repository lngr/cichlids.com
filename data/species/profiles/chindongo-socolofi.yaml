    value: 2
    confidence: medium
    rationale: >-
      Males hold a site and drive off rival males and females that are not ready to spawn. The
      species-specific care sources rate it as mild for a mbuna: Seriously Fish calls it not
      especially aggressive for the group, AquaInfo mildly aggressive with male territories of
      only about 20 cm, Tropical Freshwater Fish one of the most peaceful of its former genus and
      Fishkeeper relatively peaceful, while all of them warn that a male kept with a single female
      harasses her and ask for several females per male. With the recommended harem and enough rock
      this is a clear hierarchy with regular chasing and rare injuries. Guidarium rates the

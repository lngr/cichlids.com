  khDkh:
    value: {min: 5, max: 8}
    confidence: high
    rationale: >-
      A Lake Malawi endemic takes the measured lake values. An alkalinity of 2.0 to 2.6 meq/L gives
      5 to 8 dKH; sodium balances part of the bicarbonate, so the carbonate hardness exceeds the
      total hardness.
    sources: *lakeSources
    evidence:
      - source: *branchu
        value: {min: 6.5, max: 6.9}
        note: computed from alkalinity, north basin profiles
      - source: *fao
        value: {min: 5.6, max: 7.3}
        note: computed from alkalinity after Jackson et al. (1963)
    tolerance:
      value: {min: 5, max: 12}
      confidence: low
      verification:
        method: conservative
        votes: {agree: 3, total: 6}
      rationale: >-
        The votes did not settle: the generator, checker-a and tiebreaker-1 proposed 5 to 20 dKH,
        checker-b and checker-c 5 to 12 dKH and tiebreaker-2 5 to 15 dKH. The conservative rule
        takes the intersection of all votes, 5 to 12 dKH, because a narrower tolerance warns
        earlier. The sources reach wider: the Garnelio dealer sheet allows 4 to 20 dKH, Aquarium
        Ratgeber prints 3 to 12 under carbonate hardness with an unclear unit, Einrichtungsbeispiele
        recommends 7 to 12 dKH, and The Tropical Tank calls 10 to 12 dKH ideal and 5 to 6 the
        least, without a maximum. Fishkeeper, Guidarium and Seriously Fish give no carbonate
        hardness at all. The lower edge is the natural lake minimum. Few and weak sources, hence
        the low confidence; a stable buffer that holds the pH above 7.5 matters more than the
        exact figure.
      sources:
        - *tt
        - *branchu
        - *fao
        - *gar
        - *eb
        - &ar
          kind: website
          title: "Aquarium Ratgeber: Eisblauer Maulbrüter"
          url: https://www.aquarium-ratgeber.com/fische/fischarten/malawi-buntbarsche/eisblauer-maulbrueter/
          accessed: 2026-10-13
      evidence:
        - source: *tt
          value: {min: 5, max: 12}
          note: at least 5 to 6, ideal 10 to 12, no stated maximum
        - source: *branchu
          value: {min: 6.5, max: 6.9}
          note: natural lake water
        - source: *fao
          value: {min: 5.6, max: 7.3}
          note: natural lake water
        - source: *gar
          value: {min: 4, max: 20}
          note: aquarium recommendation
        - source: *eb
          value: {min: 7, max: 12}
          note: aquarium recommendation
        - source: *ar
          value: {min: 3, max: 12}
          note: listed as carbonate hardness with an inconsistent unit; read tentatively as dKH

  maxSizeCm:
    value: {male: 12, female: 10}
    confidence: medium
    rationale: >-
      Total length of well-kept aquarium adults. Care sheets give 10 to 12 cm, most of them 11.5 to
      12 cm for males (Seriously Fish about 11.5 cm standard length, AquaInfo and Fishkeeper 12 cm),
      and the sex-specific figures put females near 10 cm. Wild fish stay much smaller (FishBase
      6.7 cm standard length), and breeding adults in a Turkish study averaged 8.1 cm total length.
      A single sheet quoting 15 cm stands alone.

  ghDgh:
    value: {min: 3, max: 5}
    confidence: high
    verification: {method: waterbody, waterbody: lake-malawi}
    rationale: >-
      A Lake Malawi endemic takes the measured lake values. Calcium and magnesium are low in the
      lake, so its water is soft at 3 to 5 dGH even though it is well buffered.
    sources: *lakeSources
    evidence:
      - source: *branchu
        value: {min: 4.2, max: 4.6}
        note: computed from calcium and magnesium of the upper 50 m, north basin
      - source: *fao
        value: {min: 3.2, max: 4.9}
        note: computed from the titrations of the 1960s
    tolerance:
      value: {min: 3, max: 25}
      confidence: medium
      verification:
        method: qualified-majority
        votes: {agree: 4, total: 6}
      rationale: >-
        The generator, checker-a and both tie-breakers proposed 3 to 25 dGH, checker-b and
        checker-c 3 to 20 dGH. Seriously Fish (10 to 25), Tropical Freshwater Fish (12 to 25) and
        Fishkeeper (up to 25) share an upper limit of 25 dGH, while Garnelio (5 to 20), FishProfiles
        (12 to 20), Einrichtungsbeispiele (5 to 15), Fishipedia (8 to 15) and NBFGR (12 to 15) give
        narrower comfort bands. The lower edge is the natural lake value of 3 dGH, which the
        tolerance has to contain; the high minima of the care sheets reflect the hobby habit of
        treating Malawi water as hard rather than a need of the fish. The care sheets partly copy
        each other, so the confidence stays medium.
      sources:
        - *sf
        - *tff
        - *fp
        - *tt
        - *nbfgr

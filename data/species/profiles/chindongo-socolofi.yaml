partners:
  suitable:
    - species: Labidochromis caeruleus
      reason: Calm mbuna of similar size whose yellow colour does not read as a rival; it also takes a plant-rich diet.
    - species: Aulonocara jacobfreibergi
      reason: Peaceful peacock that uses the sand and open water rather than the rock sites; same water.
      condition: Only one Aulonocara species per tank; tank of at least 150 cm.
    - species: Copadichromis borleyi
      reason: Open-water haplochromine that ignores the rock sites and is neither prey nor predator for it.
      condition: Tank of at least 150 cm because the Copadichromis grows to about 15 cm.
    - species: Iodotropheus sprengerae
      reason: Small, mild mbuna with brownish violet colour and the same lean diet.
    - species: Synodontis njassae
      reason: Catfish of Lake Malawi itself that shares the water, feeds at night and stays out of the cichlids' disputes.
  unsuitable:
    - species: Maylandia callainos
      reason: Plain blue, more forceful mbuna that looks like a rival; constant fights over the shared colour.
    - species: Melanochromis auratus
      reason: Highly aggressive mbuna that harasses the milder Chindongo socolofi.
    - species: Chindongo saulosi
      reason: Close relative whose males are also blue with dark markings; rivalry, and no source has tested whether the two cross.
    - species: Nimbochromis livingstonii
      reason: Piscivorous haplochromine that eats juveniles and small adults.
    - species: Symphysodon aequifasciatus
      reason: Needs soft, acidic water and calm surroundings; incompatible with mbuna in every respect.
    - species: Tropheus moorii
      reason: Tanganyika grazer that must be kept only with its own species and reacts badly to mbuna aggression.

profile:
  overview:
    text: >-
      The pindani, sold as powder blue cichlid and long known as Pseudotropheus socolofi, is a
      small mbuna from the Mozambican coast of Lake Malawi and has belonged to the genus Chindongo
      since 2016. Males and females wear the same soft blue with dark fin edges, so a group looks
      even and calm. It ranks among the gentler rock cichlids and is a classic of the Malawi hobby;
      nearly every fish on sale is tank-bred, and an albino line called snow white is common. Given
      a tank of rock and sand, a mainly plant-based diet and more females than males, it is hardy,
      breeds readily and suits a first Malawi tank, as long as its tankmates are not much rougher.
    sources:
      - *cof
      - *sf
      - *aqi
      - *li2016
  habitat:
    text: >-
      The wild range is a short stretch of the eastern shore of Lake Malawi, from Cobue to Tumbi
      Point in Mozambique, facing Likoma Island. Fish on the Malawian side at Thumbi West Island and
      Otter Point were probably released there. The species keeps to shallow water of about 4 to
      10 m in the zone where rocks thin out into sand and grazes the film of algae and tiny
      organisms on both surfaces; many fish share small patches of rock. The lake water is warm,
      clear and soft at only 3 to 5 dGH, yet well buffered with 5 to 8 dKH and a pH of 7.7 to 8.6.
      Temperatures range from about 21 C in the cool season to 29 C at the surface in summer.
    sources:
      - *fb
      - *sf
      - *aqi
      - *branchu
      - *fao
      - *eccles
  sizeAndGrowth:
    text: >-
      Wild fish stay small at about 7 cm. Tank-raised fish grow larger: males usually reach 11 to
      12 cm, females stop at around 10 cm. Breeding adults in an aquaculture study averaged about
      8 cm, so fish of that size are mature. Young fish are slender and fill out with age. Growth
      is steady on a lean diet; fast growth on rich food is no sign of good health here, because
      surplus fat and protein strain the liver and gut. Well kept, the fish live 5 to 10 years.
    sources:
      - *fb
      - *sf
      - *aqi
      - *karadal
      - *nbfgr
      - *gar
  husbandry:
    text: >-
      A tank of 120 cm and about 240 litres houses one male and three females together with a few
      calm tankmates. Stack stable rock piles with plenty of caves and gaps that rise well into the
      water column and leave open sand between them, as in the natural transition zone. Set the
      rocks on the bottom glass so that digging cannot topple them. Strong filtration and generous
      weekly water changes keep nitrate low. Aim for 24 to 28 C, pH 7.5 to 8.8, moderately hard
      water and a carbonate hardness of about 5 to 12 dKH, which keeps the pH steady; very soft,
      acidic tap water needs a buffer. Plants are optional, and tough species are mostly left
      alone.
    sources:
      - *sf
      - *aqi
      - *tff
      - *tt
      - *fk
      - *gar
  socialBehavior:
    text: >-
      Each dominant male claims a cave or a small patch of rock, often no more than about 20 cm
      across, and chases other males and unready females from it. For a mbuna the aggression is
      moderate: with several females per male and enough hiding places the chasing seldom causes
      injuries, whereas a lone female with a male gets no peace. A harem of one male and three or
      more females spreads his attention. Several males can share a large tank only if each has
      its own rock pile; crowded males in small tanks may fight to the death. Other species are
      driven from the male's spot but not hunted through the tank, and the pindani itself is
      easily bullied by large or very aggressive mbuna.
    sources:
      - *sf
      - *aqi
      - *tff
      - *pazar
      - *genner
  diet:
    text: >-
      In the lake the pindani grazes the growth on rocks and sand. In the tank a good spirulina or
      algae flake or pellet makes the staple, with blanched spinach, peas or nori as extras. Small
      frozen foods such as brine shrimp or mysis are an occasional treat, never the main food, and
      beef heart or other red meat should never be fed. Feeding trials found fatty changes in the
      liver of this species on rich trout pellets, which backs a lean, plant-based diet. Several
      small meals a day suit its grazing habit better than one large one.
    sources:
      - *fb
      - *sf
      - *royes2004
      - *fk
  breeding:
    text: >-
      Breeding takes no special effort in a harem tank. The male cleans a flat stone or a spot on
      the sand, shows his brightest colours and leads ripe females there with quivering displays.
      The female releases a few eggs at a time and turns at once to gather them, then nibbles at
      the egg spots on the male's anal fin and so takes in the sperm that fertilises the eggs in
      her mouth. A brood holds about 20 to 60 eggs. She carries it for about three weeks, eating
      little or nothing, and then lets out free-swimming young that take crushed flakes and brine
      shrimp nauplii. Within hours of release she treats her own young as food, and other fish do
      the same, so move a holding female after about two weeks if the brood should be raised;
      moving her earlier risks a lost clutch. Breeders keep the water at about 25 to 27 C and pH
      8.2 to 8.5. Albino females produce clearly fewer eggs than blue ones.
    sources:
      - *sf
      - *aqi
      - *fk
      - *karadal
  sexing:
    text: >-
      Sexing is tricky, because both sexes share the same blue. Adult males grow a little larger,
      carry bigger and brighter egg spots on the anal fin and have somewhat longer pelvic fins.
      Females and subordinate fish often show faint dark bars that dominant males lack. Behaviour
      helps most: males guard a spot and chase, females move about in loose groups. Venting is
      reliable but best left to experienced keepers. For a harem, raise six or more young fish
      together and take out surplus males later.
    sources:
      - *sf
      - *aqi
      - *fk
      - *dewiki
  compatibility:
    text: >-
      The pindani fits a Malawi tank with other calm fish of similar size. Good companions are the
      yellow Labidochromis caeruleus, Iodotropheus sprengerae, peacocks of the genus Aulonocara
      and open-water Copadichromis in tanks of 150 cm or more. Robust, aggressive mbuna such as
      Melanochromis auratus or large Maylandia outcompete it. Plain blue mbuna such as Maylandia
      callainos and the related Chindongo saulosi are best left out, because similar colours
      provoke constant rivalry. Predatory haplochromines such as Nimbochromis eat young fish, and
      soft-water fish such as discus or other lake cichlids such as Tropheus need different water
      or care.
    sources:
      - *sf
      - *aqi
      - *tff
      - *fk
  problems:
    text: >-
      The commonest mistake is a protein-rich diet: bloodworms, beef heart or fatty pellets as
      staple food can trigger Malawi bloat, a swollen belly with loss of appetite that often ends
      in death, and they strain the liver. Feed a lean, plant-based diet instead. A male with a
      single female, too few hiding places or rough tankmates cause stress, torn fins and harassed
      females that spit their broods. Soft, acidic water and a pH that drops between water changes
      weaken the fish. Farm-bred imports can carry gill flukes, so quarantine new fish. Albino fish
      breed less well than the blue form and should not share a tank with pushy species.
    sources:
      - *sf
      - *fk
      - *royes2004
      - *karadal
      - &tripathi
        kind: literature
        title: >-
          Tripathi, A., Matey, C., Pariselle, A. and Vanhove, M. P. M. (2025). Monogeneans on exotic
          Indian freshwater fish. 8. Co-translocation of Cichlidogyrus tilapiae (Monogenea,
          Dactylogyridae) with pindani Chindongo socolofi (Cichliformes, Cichlidae). Parasite 32, 47.
        url: https://doi.org/10.1051/parasite/2025046
        accessed: 2026-10-13


          title: "Einrichtungsbeispiele: Pseudotropheus socolofi im Aquarium halten"
          url: https://www.einrichtungsbeispiele.de/zierfische/malawisee/pseudotropheus-socolofi-slnk.html
          accessed: 2026-10-13

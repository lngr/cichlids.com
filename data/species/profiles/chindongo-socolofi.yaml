schemaVersion: 1
id: chindongo-socolofi
legacyIds: [489]
status: described

taxonomy:
  validName: Chindongo socolofi
  genus: Chindongo
  species: socolofi
  author: (Johnson, 1974)
  source: &cof
    kind: catalog-of-fishes
    title: "Eschmeyer's Catalog of Fishes, species of the genus Chindongo"
    url: https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Chindongo
    accessed: 2026-10-13
  synonyms:
    - name: Pseudotropheus socolofi
      note: Original combination (Johnson 1974); transferred to Chindongo by Li, Konings and Stauffer (2016), which the Catalog of Fishes follows.
  legacyNames:
    - Pseudotropheus socolofi
  note: >-
    The Catalog of Fishes lists the species as valid in Chindongo and cites Li et al. (2016) for
    the transfer; the species list of Pseudotropheus no longer holds socolofi, because the catalog
    files every species under its current genus. FishBase and the public summary of the Cichlid
    Room Companion use the same name. The type locality lies off Likoma Island, while the natural
    range is the facing Mozambican shore. The trade name Pseudotropheus 'pindani' was never an
    available scientific name.

names:
  trade:
    en: [Pindani, Powder Blue Cichlid, "Eduard's Mbuna", Socolofi]
    de: [Eisblauer Maulbrüter, Pindani]

variants:
  - name: Albino (Snow White)
    kind: color-morph
    note: Aquarium-bred albino form with a white body and red eyes; it produces clearly fewer eggs and young than the blue form.
  - name: Populations without the dark dorsal band
    kind: locality
    note: In some wild populations the dark band near the edge of the dorsal fin is missing.

features:
  origin:
    value:
      continent: Africa
      region: Lake Malawi
      waterbody: lake-malawi
      localities:
        - Mozambican coast between Cobue and Tumbi Point, with Mara Rocks and Mbweca Rocks
        - off Likoma Island (type locality)
        - Thumbi West Island and Otter Point (probably introduced)
    confidence: high
    rationale: >-
      Endemic to Lake Malawi. FishBase, Seriously Fish and AquaInfo place the natural range on a
      short stretch of the Mozambican east coast from Cobue to Tumbi Point, opposite Likoma Island,
      off which the Catalog of Fishes puts the type locality. FishBase regards the fish at Thumbi
      West Island and Otter Point on the Malawian side as introduced. Almost all fish in the trade
      are bred in captivity.
    sources:
      - *cof

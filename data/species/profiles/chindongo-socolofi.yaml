      has a pH of 7.7 to 8.6; the somewhat lower values of the whole water column belong to deep
      water that the species does not use.
    sources: *lakeSources
    evidence:
      - source: *fao
        value: {min: 7.7, max: 8.6}
        note: lake surface water after Jackson et al. (1963)
      - source: *branchu

  husbandry:
    text: "For the recommended six adults, provide about 400 litres with at least 150 cm length and 50 cm front-to-back\
      \ room. Use fine soft sand and arrange secured wood and smooth stones to create sheltered areas and broken\
      \ sightlines while leaving feeding space. Plants are optional. Maintain effective filtration, surface movement\
      \ and regular partial water changes. Around 26 to 28 C is a practical routine target within the 24 to 30 C\
      \ working tolerance. The keeping allowances are pH 7 to 9, GH 5 to 23 dGH and an inferred KH 3 to 15 dKH.\
      \ Stable conditions near the well-supported middle of these broad intervals are preferable to using their\
      \ endpoints as targets; measure GH and KH separately."
    sources:

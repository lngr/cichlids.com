    verification:
      method: unanimous
      votes:
        agree: 4
        total: 4
    tolerance:
      value:
        min: 24
        max: 30
      confidence: low
      rationale: "Retain the tally unanimous 24 to 30 C tolerance and its low confidence. Generator and checker-b\
        \ propose 24 to 30, checker-a 22 to 31 and checker-c 23 to 30. Fishkeeper directly recommends 24 to 30,\
        \ NCS 24 to 28 and AquaInfo 25 to 30, while McAndrews reports breeding around 28.3 to 28.9 C. The wider\
        \ 19 to 27 C Polish care range and Schreiber genus advice of 23 to 25 C for maintenance and 25 to 28 C for\
        \ spawning remain evidence; neither establishes failure outside a chosen range. The tally interval includes\
        \ the natural 24 to 30 C range and is retained as a conservative working husbandry allowance, not a physiological\
        \ failure threshold. The inferred 22 to 31 proposal is not a measured long-term tolerance."

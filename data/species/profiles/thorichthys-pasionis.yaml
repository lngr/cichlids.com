  ghDgh:
    value:
      min: 8
      max: 20
    confidence: medium
    rationale: "Retain the qualified-majority natural range of 8 to 20 dGH at medium confidence. Generator, checker-b\
      \ and both tie-breakers propose 8 to 20, checker-c 8 to 18 and checker-a 5 to 13. CRC gives a lower habitat\
      \ boundary of 8 without an upper bound. Six middle-Usumacinta site means of 250 to 352 mg/L as CaCO3 convert\
      \ to 14.0 to 19.7 dGH by division by 17.848, supporting the rounded upper endpoint. Peten Itza calcium and\
      \ magnesium imply about 12.3 to 17.9 dGH. These are regional water-type measurements rather than a complete\
      \ species-capture series. The wider catchment source range of 11.2 to 34 dGH lacks demonstrated species occurrence\
      \ at the hardest sites, so its upper extreme is not a preferred habitat boundary. FishBase states only a lower\
      \ value of 5 dH; retained evidence assigning 25 as its maximum is an unsupported reviewer inference. Neither\
      \ conductivity nor dissolved inorganic carbon provides GH without calcium and magnesium composition, so checker-a\
      \ derived values remain dissenting inferences."

  habitat:
    text: "Slow river margins, lagoons and floodplain waters offer shallow soft sediment where loose groups search\
      \ for food. The principal range includes the Grijalva and Usumacinta systems and the Rio de la Pasion at Sayaxche.\
      \ The Lacanja wetland study records the species at a site averaging 29.6 C and pH 7.66. Working natural ranges\
      \ are 24 to 30 C, pH 7.3 to 8.8, 8 to 20 dGH and approximately 6 to 11 dKH. These summarize several waters;\
      \ the pH and carbonate-hardness endpoints are uncertain. Peten Itza measurements provide lake context, while\
      \ broader basin surveys also include seasonal extremes and sites without confirmed captures."

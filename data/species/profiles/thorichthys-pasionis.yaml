        archived: dcg-encyclopedia.de/wp-content/uploads/2016/05/2016-06-s-128-132.pdf/2026-10-15T110358Z
  diet:
    text: "Offer small sinking prepared foods and varied aquatic invertebrates such as insect larvae, Daphnia, Artemia\
      \ and small crustaceans. Distribute food across several places so quieter fish can feed. The compatibility\
      \ classification is invertivore because the most specific feeding observations emphasize animal prey from\
      \ sediment. Broader omnivore labels occur in care sheets. Live fish are unnecessary and fry or tiny tankmates\
      \ can nevertheless be eaten. Avoid mammalian meat and oversized meals; absence of an established high-protein\
      \ bloat flag does not remove other digestive or water-quality risks."

  maxSizeCm:
    value:
      male: 17
      female: 12
    confidence: medium
    rationale: "The proposal medians are 17 cm for males and 12.5 cm for females: generator and checker-a give 17/13,\
      \ while checker-b and checker-c give 17/12. Keep 17 cm for typical large aquarium males because Beerlink reports\
      \ that size directly. Choose 12 cm for females because Akwarium explicitly separates the sexes at 15/12, whereas\
      \ the 13 cm female proposal interprets an unsexed 13 to 17 cm table. Fishipedia gives dominant males up to\
      \ 18 cm and Schreiber reports males around 20 cm; these larger aquarium observations remain evidence of variation\
      \ rather than the typical planning maximum. FishBase gives 17 cm standard length and CRC about 15 cm total\
      \ length from a different reference, so those incompatible length conventions do not decide typical aquarium\
      \ size."

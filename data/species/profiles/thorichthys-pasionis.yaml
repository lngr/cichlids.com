  ph:
    value:
      min: 7.3
      max: 8.8
    confidence: low
    rationale: "Retain the low-confidence median decision of pH 7.3 to 8.8. All six proposals are generator 7.3\
      \ to 8.5, checker-a 7.3 to 8.3, checker-b 7.3 to 9.0, checker-c 7.3 to 9.0, tiebreaker-1 7.4 to 8.5 and tiebreaker-2\
      \ 7.4 to 9.0. No qualified majority settles the upper endpoint, so the tally takes the endpoint medians and\
      \ rounds the upper median 8.75 to 8.8. The result is plausible for ordinary alkaline waters and contains CRC\
      \ habitat observations of 7.5 to 8.5 and the La Pasion field minimum of 7.3. It is narrower than FishBase\
      \ 8 to 9 and lower-Usumacinta measurements of 7.5 to 8.93, which remain evidence rather than disappearing\
      \ at the decided limit. El Subin gives a point reading of 7.4 and Peten Itza surface water 8.2 to 8.5. The\
      \ middle-basin paper gives 7.4 to 7.9 in Table 1 but 7.1 to 7.9 in prose; these are one internally inconsistent\
      \ dataset. Aquarium values retained by the tie-breakers do not establish natural water limits."

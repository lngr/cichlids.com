  sizeAndGrowth:
    text: "Allow for typical large males of about 17 cm and females of about 12 cm. Sex-specific female size has\
      \ weaker support than the male figure. Individual aquarium reports include larger males, and scientific maxima\
      \ expressed as standard length cannot be compared directly with total-length aquarium estimates. Provide adult\
      \ space for a juvenile group. A provisional lifespan estimate is seven to eight years, based on a single eight-year\
      \ care-sheet figure rather than a measured longevity series."

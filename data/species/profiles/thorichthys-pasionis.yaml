    tolerance:
      value:
        min: 5
        max: 23
      confidence: low
      rationale: "Retain the low-confidence median tolerance of 5 to 23 dGH. The six proposals are generator 5 to\
        \ 25, checker-a 4 to 20, checker-b 5 to 30, checker-c 5 to 30, tiebreaker-1 5 to 20 and tiebreaker-2 5 to\
        \ 20. No qualified majority settles the endpoints. The minimum median is 5 and the maximum median is 22.5,\
        \ rounded to 23 by the tally. The interval contains natural 8 to 20 dGH and lies between narrower AquaInfo\
        \ advice of 5 to 15 and Schreiber breeder advice of 5 to 20, and the wider Akwarium recommendation of 18\
        \ to 30. That full 18 to 30 source range is retained even though its upper endpoint exceeds the decision.\
        \ Twenty-three is a compromise of recommendations, not a directly measured health limit. FishBase supplies\
        \ no numerical upper GH bound, Beerlink qualitative moderate-to-hard prose supplies no 8 to 20 endpoints,\
        \ and McAndrews very-hard-water spawning supplies no 15 to 30 endpoints; those reviewer estimates stay explicitly\
        \ qualified in evidence."

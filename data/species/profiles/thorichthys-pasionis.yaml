partners:
  suitable:
    - species: Xiphophorus hellerii
      reason: Adult swordtails provide active upper-water company and are large enough to avoid the tiny-fish prey
        category.
      condition: Use adult swordtails in a group tank meeting both species requirements; fry remain at risk and
        swordtails need their own sex ratio and space.
    - species: Poecilia mexicana
      reason: Adult larger mollies fit the specialist recommendation for sizeable peaceful livebearers in warm mineralised
        water.
      condition: Choose full-sized adults and satisfy their own social and feeding needs; juveniles can be eaten.
    - species: Poecilia velifera
      reason: Full-sized adults offer a peaceful livebearer option with compatible alkaline-water requirements.
      condition: "Use a larger aquarium that also meets this molly species requirements; this pairing is inferred\
        \ from the livebearer recommendation, not a named trial."
  unsuitable:
    - species: Paracheirodon innesi
      reason: "The usual cooler, softer-water requirements of neon tetras conflict with this warm alkaline setup;\
        \ fry and particularly small individuals also face predation risk."
    - species: Parachromis managuensis
      reason: A much larger predatory and aggressive cichlid can injure or consume pasionis.
    - species: Thorichthys meeki
      reason: Aquarium hybridisation with pasionis is reported; unsuitable when maintaining separate breeding stocks.
    - species: Amatitlania nigrofasciata
      reason: Breeding convicts can subject this milder species to sustained territorial pressure in an ordinary
        group aquarium.
profile:
  overview:
    text: "Thorichthys pasionis is a yellow-bodied firemouth relative from Atlantic drainages in Mexico and Guatemala.\
      \ Dark gill membranes, blue highlights and changing flank markings distinguish its appearance. A group in\
      \ a spacious aquarium offers opportunities to observe feeding, displays and parental care. Its relatively\
      \ mild temperament suits peaceful companions, although spawning pairs defend their offspring. The original\
      \ scientific combination is Cichlasoma pasionis."
    sources:
      - kind: catalog-of-fishes
        title: "Eschmeyer's Catalog of Fishes: species of Thorichthys"
        url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Thorichthys"
        archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-118e07ca/2026-10-14T094242Z

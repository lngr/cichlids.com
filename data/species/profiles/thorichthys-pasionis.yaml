  hybridGroups:
    value:
      - thorichthys
      - thorichthys-meeki-pasionis
    confidence: medium
    rationale: "Retain the qualified-majority groups thorichthys and thorichthys-meeki-pasionis at medium confidence.\
      \ Generator, checker-b and both tie-breakers propose both groups, checker-a proposes none and checker-c proposes\
      \ only the named pair. Beerlink and Parha and Reclos supply general aquarium warnings for congeners, sufficient\
      \ for a presumed genus group rather than documented crossing of every pair. CRC curator Juan Miguel Artigas\
      \ Azas reports occasional meeki-pasionis hybrids in his mixed 800 L aquarium; access to same-species partners\
      \ of both sexes is not explicit, so the pair also has basis presumed. Beerlink uncertainty about natural mixing\
      \ does not refute this captive report. Schreiber describes congener crosses as uncommon with both sexes represented,\
      \ which qualifies their likelihood without identifying a free-choice brood. Colour-based speculation about\
      \ pasionis-affinis and an unnamed possible archive hybrid establish no extra named pair. Both decided groups\
      \ include pasionis; other listed Thorichthys pairs do not extend to it by transitivity."

  temperatureC:
    value:
      min: 24
      max: 30
    confidence: medium
    rationale: "Retain the unanimous 24 to 30 C tally decision at medium confidence. CRC gives this species-specific\
      \ habitat interval, the occupied Lacanja wetland averages 29.6 C, and La Pasion reaches 29.8 C. FishBase gives\
      \ 26 to 30 C. Wider regional source envelopes are 20.8 to 29.8 C in the basin survey and 22.96 to 33.88 C\
      \ in the lower Usumacinta, with 28.3 to 30.2 C site means at Tenosique. They mix seasons and sites without\
      \ simultaneous species captures; cool upstream and short hot surface readings do not define a routine species\
      \ ideal. Peten Itza shallow-water observations of 27.2 to 30 C provide additional context. These wider or\
      \ single readings remain evidence."

  khDkh:
    value:
      min: 6
      max: 11
    confidence: low
    rationale: "Retain the tallied natural estimate of 6 to 11 dKH at low confidence, without a verification object.\
      \ The proposals are generator 7 to 12, checker-a 4 to 11, checker-b 6 to 10 and checker-c 5 to 11; the tally\
      \ groups them as agreeing and rounds their endpoint medians. Middle-Usumacinta alkalinity of 128 to 135 mg/L\
      \ as CaCO3 corresponds to 7.2 to 7.6 dKH; Peten Itza bicarbonate of 1.9 to 2.2 meq/L corresponds to 5.3 to\
      \ 6.2 dKH. Basin dissolved inorganic carbon yields a wider approximate 3.6 to 11.3 dKH bicarbonate-equivalent\
      \ envelope, but is not titrated KH and includes other waters. Community catchment monitoring spans 8.2 to\
      \ 17.6 dKH without confirmed fish occurrence at the upper endpoint. The chosen working interval is narrower\
      \ than those regional envelopes and remains uncertain rather than claiming those endpoints are physiological\
      \ boundaries. GH, alkalinity and inorganic carbon are distinct measurements."

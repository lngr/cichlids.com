  problems:
    text: "Social pressure and declining water quality can undermine otherwise suitable husbandry. Check that every\
      \ fish eats and has access to shelter, and remove accumulating waste from the sand. Warm water needs dependable\
      \ oxygen exchange. Make water changes without abrupt chemistry shifts. Swelling, appetite loss and skin damage\
      \ have several possible causes; anecdotal reports do not establish a single feeding disease. Quarantine new\
      \ arrivals and investigate persistent signs of illness rather than changing the diet or water chemistry solely\
      \ to improve colour."

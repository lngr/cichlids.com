  socialBehavior:
    text: "House a group with space for subordinate fish to retreat and feed. Six adults is a practical inferred\
      \ starting minimum, while the specialist sources recommend groups without testing an exact count. Monogamous\
      \ pairs form for breeding within that setting. Displays and chasing are expected, especially near eggs and\
      \ fry. Even a bonded partner can be excluded during brood care, so watch for persistent hiding, blocked access\
      \ to food or damage and adjust the layout or stocking when needed."

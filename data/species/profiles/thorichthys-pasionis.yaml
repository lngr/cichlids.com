  compatibility:
    text: "Adult swordtails and other suitably large peaceful livebearers fit the specialist companion advice, provided\
      \ their own temperature, space and social needs are met. Very small fish and livebearer fry are vulnerable\
      \ to opportunistic predation. Avoid large aggressive cichlids that can dominate this comparatively mild species.\
      \ The genus-wide crossing caution is presumed from general husbandry warnings. A specific meeki-pasionis aquarium\
      \ cross is reported by Juan Miguel Artigas Azas, but the account does not establish the availability of same-species\
      \ partners, so that pair also remains presumed under the evidence rubric."

features:
  origin:
    value:
      continent: Central America
      region: "Atlantic drainages of Mexico and Guatemala, principally the Grijalva and Usumacinta systems"
      waterbody: null
      localities:
        - Rio de la Pasion at Sayaxche
        - Rio San Pedro
        - Lower Grijalva
        - Lacanja floodplain wetland
        - Candelaria and Chompan river basins
        - Laguna Noh
        - Laguna Perdida
        - Laguna Catazaja
        - Lake Peten Itza
        - Rio El Subin
    confidence: high
    rationale: "The Catalog of Fishes anchors the range in the Grijalva and Usumacinta systems of Mexico and Guatemala\
      \ and identifies Sayaxche on the Rio de la Pasion as the type locality. CRC adds the San Pedro, Candelaria\
      \ and Chompan drainages, the Lacantun fish survey confirms a Lacanja wetland population, and Beerlink reports\
      \ Lake Peten Itza. Named lagoon stocks and the El Subin biotope account supplement the locality list. The\
      \ proposals differ in the localities they enumerate, not in the principal range. The species occupies several\
      \ waters, so a single lake does not determine its natural range."

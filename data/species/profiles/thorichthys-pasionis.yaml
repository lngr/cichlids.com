  sexing:
    text: "Males generally become larger and can develop longer dorsal and anal fin extensions. Mature females may\
      \ have a fuller abdomen, especially before laying. These differences are difficult to apply to young fish\
      \ and vary with condition. Compare several mature individuals and use reproductive behaviour alongside body\
      \ shape rather than treating one colour mark as a reliable sex test."

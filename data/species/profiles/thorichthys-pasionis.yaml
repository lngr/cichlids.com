    confidence: medium
    rationale: "Retain the qualified-majority invertivore decision with bloatSensitive false and medium confidence.\
      \ Generator, checker-b, checker-c and both tie-breakers select invertivore; checker-a selects omnivore. CRC\
      \ describes animal prey picked from sediment and incidental plant ingestion, and Beerlink identifies insects\
      \ and larvae as principal foods. These specific observations outweigh generic omnivore labels in several care\
      \ sheets while all dissenting entries remain. Accepting plant-containing prepared feeds does not establish\
      \ substantial natural plant feeding. CRC warns against mammalian meat; Schreiber uses aquatic animal foods\
      \ successfully and attributes many problems to social stress. A forum concern about swelling is retained but\
      \ does not establish the rubric high-protein bloat sensitivity. False is therefore provisional rather than\
      \ a claim of immunity to digestive disease. FishBase diet observations are empty; the Pease paper full text\
      \ is unavailable through the permitted open-access tool and supplies no dietary evidence here."

        archived: aquainfo.nl/en/article/thorichthys-pasionis/2026-10-14T103440Z
        accessed: '2026-10-15'
  breeding:
    text: "Both parents participate in care of attached eggs and young. Provide clean firm surfaces and sheltered\
      \ alternatives, including smooth stones or pots, without assuming that the species requires a cave. Brood\
      \ defence can displace neighbours or the other parent. Offer finely sized first foods when fry begin feeding\
      \ and move to larger foods as they can take them; one spawning account reports that newly free-swimming fry\
      \ cannot immediately consume Artemia nauplii. Successful breeding is reported near pH 7 to 7.4, but these\
      \ observations do not prove that softening water triggers spawning."

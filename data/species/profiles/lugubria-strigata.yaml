  temperatureC:
    value:
      min: 26
      max: 31
    confidence: medium
    rationale: "The settled tally gives 26 to 31 C by qualified majority, with four agreeing votes out of six.
      Generator proposed 25 to 27 C; checker-a 26 to 30 C; checker-b 26.3 to 30.6 C; checker-c 24 to 31 C;
      tiebreaker-1 25 to 30.6 C; tiebreaker-2 26.3 to 30.6 C. The matching bounds are summarized and rounded
      to whole degrees by the tally. The lower-Jari field study measured 26.3 to 30.6 C, and a separate
      species collection links that drainage to strigata without pairing individual fish with those
      measurements. The earlier Jari campaign spans the wider 25 to 29.98 C interval; Tapajos upland streams
      measured 24.4 to 27 C, and a Xingu reservoir series spans 29.2 to 32.7 C. These wider regional
      observations remain evidence but are not an exhaustive species thermal niche. The French Guiana 25 C
      climate figure is not a water measurement; FishBase and care-sheet 23 to 27 C figures are husbandry
      information. The rounded 31 C boundary is plausible regional exposure, with medium confidence rather
      than a claim of measured long-term aquarium safety."

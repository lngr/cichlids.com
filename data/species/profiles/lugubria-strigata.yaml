    confidence: medium
    rationale: "The current Catalog places this species in the Amazon basin in Brazil, Colombia and Guyana;
      FishBase narrows its wording to southern tributaries, while Seriously Fish emphasizes the lower basin
      outside the main channel. The Capim and Cupari alternatives concern the uncertain origin of the
      historical type material, not two independently confirmed type localities. The 2024 parasite study
      reports specimens from Jarilandia in the lower Jari. Generator proposed the broader Amazon and northern
      South America wording; checker-a emphasized lower tributaries with Guyana and Jari; checker-b included
      Capim, Cupari and Jari; checker-c retained only the type-area alternatives. Follow the Catalog country
      scope and add the reported Jari collection, without inferring an Orinoco or Guianas-wide coastal
      distribution."

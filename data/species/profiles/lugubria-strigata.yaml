profile:
  overview:
    text: "Lugubria strigata is a large Amazonian fish predator still widely labelled Crenicichla strigata. The
      name on a shop tank can conceal an identity problem: some Orinoco imports bearing that label belong to a
      different undescribed pike. Locality information and adult identification therefore matter before
      aquarium records can be compared. The former lugubris group explains its taxonomic placement, but
      establishes neither synonymy with L. lugubris nor a documented crossing risk."
    sources:
      - *a1
      - *a75
      - *a64
      - *a76
      - *a68
      - *a2
      - *a58
  habitat:
    text: "The Catalog records the species in the Amazon basin of Brazil, Colombia and Guyana. Historical type
      material may originate from either Capim or Cupari, and a modern study reports fish from the lower Jari.
      The assigned natural references are 26 to 31 C, pH 6.0 to 7.3 and very low GH and KH of 0 to 1. They
      combine regional proxies and tally rounding rather than simultaneous measurements beside identified
      fish. Shaded streams and larger channels differ, so these numbers do not describe every population. Very
      acidic Capim stream readings and warmer Xingu reservoir readings remain contextual evidence without
      confirmed occurrence at those stations."
    sources:

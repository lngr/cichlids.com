  note: "The current Catalog accepts Lugubria strigata (Gunther, 1862); both Lugubria and legacy Crenicichla
    lists were queried. The 2023 integrative revision establishes Lugubria for the former broad Crenicichla
    lugubris group, excluding C. vittata and C. jegui from the older group definitions. This is not a synonym
    of L. lugubris and the relationship group is not a hybrid group. The original type locality remains
    uncertain between Capim and Cupari. Crenicichla obtusirostris is currently assigned to the synonymy of
    Lugubria johanna and is not included here. Practical Fishkeeping identifies a different undescribed
    Orinoco or Venezuela fish repeatedly sold as strigata, and CRC separately lists Lugubria sp. strigata
    orinoco. Its trade data must not be merged as a locality variant of the described Amazonian species. Only
    the public Warzel abstract was read, without subscriber content."

  ph:
    value:
      min: 6
      max: 7.3
    confidence: low
    rationale: "The tally settles pH 6.0 to 7.3 by the median method, with low confidence and three agreeing votes
      out of six. Generator proposed 6.0 to 7.0; checker-a 5.5 to 7.0; checker-b 6.0 to 7.5; checker-c 6.0 to
      7.0; tiebreaker-1 and tiebreaker-2 each 6.0 to 7.5. The six lower bounds have median 6.0, and the
      upper-bound median of 7.25 becomes 7.3. This lies within the typical lower-Jari field interval of 6.0 to
      7.5, which is wider than the decision; the Jari study also reports a single 5.5 reading. It is a usable
      mildly acidic to near-neutral regional proxy, not a new measured species limit. Other retained regional
      source ranges are 5.3 to 7.2 for shield clearwaters, 3.75 to 7.65 for French Guiana streams and 3.9 to
      4.7 for a Capim forest stream without verified strigata. Historical Tapajos summaries also disagree,
      with one FAO chapter giving 4.5 to 5.3 and another compilation 6.5 to 6.65. These observations are not
      discarded or treated as interchangeable collection sites. Aquarium recommendations cannot determine the
      natural endpoints."

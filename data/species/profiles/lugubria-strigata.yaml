  husbandry:
    text: "The minimum for an established adult pair is 720 litres with a 200 by 60 cm footprint. Both fish need
      accessible retreats behind stable wood or rockwork and a clear route between them. Sand accommodates
      digging. Keep a divider or another suitable aquarium available for an incompatible pair. Match
      filtration and regular water changes to the waste from large animal-food meals. The decided tolerance is
      23 to 31 C, pH 5.5 to 7.5, GH 0 to 20 and KH 0 to 5. Its temperature and KH endpoints are particularly
      uncertain; they are not targets, and seasonal heat exposure does not demonstrate that constant 31 C is
      healthy for years."

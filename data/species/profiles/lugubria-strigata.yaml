  socialBehavior:
    text: "Monogamous breeding supports pair maintenance, but an opposite-sex purchase does not guarantee
      acceptance. Territorial conflict can persist outside spawning, and a male may severely harass a female.
      Level 3 conspecific aggression reflects strong conflict while retaining reports of possible lethal
      breeding attacks as warnings. Observe whether each fish can feed and move freely rather than judging
      compatibility from a quiet hiding fish. A lone specimen is preferable to an incompatible pair. Another
      large pike is a poor territorial companion."
    sources:
      - *a26
      - *a64
      - *a68
      - *a7
      - *a80
      - *a81
      - *a82
      - *a83
      - *a84
  diet:
    text: "Piscivory places the species at predation level 3. A varied captive diet can use accepted predator
      pellets, fish pieces, prawn, mussel and aquatic insect larvae. Observe acceptance and portion size
      instead of assuming every imported fish recognizes prepared food immediately. Care advice that includes
      vegetable ingredients does not change the wild feeding guild to omnivore. The false bloatSensitive flag
      addresses the rubric-specific protein-related syndrome; it does not promise immunity from intestinal
      disease. Generous feeding does not protect small tankmates from being swallowed."
    sources:
      - *a64
      - *a25
      - *a27
  breeding:
    text: "Cavity spawning is better supported than a dependable aquarium breeding method. FishBase describes
      female attention to eggs inside a shelter, male territorial defence and later participation by both
      parents. Seriously Fish lacks hobby spawning reports. A separate public abstract claims reproduction
      under the old name but supplies no accessible methods and misstates the geographic origin, so identity
      and success remain uncertain. Provide secure shelters and monitor the female closely, without promising
      an egg count, hatch time or particular chemical trigger."
    sources:
      - *a5
      - *a25
      - *a68
  sexing:
    text: "Several aquarium accounts associate a mature female with a pink to reddish abdomen and a fuller belly
      near spawning. These signs depend on maturity and reproductive condition, and small striped juveniles
      remain difficult to identify or sex. The assigned size difference is an estimate rather than a sexing
      rule; one retailer even claims the reverse without records. Confirm species identity before relying on
      colour clues, since the Orinoco trade fish can resemble the described species when young."
    sources:
      - *a25
      - *a26
      - *a76
      - *a60
      - *a5
      - *a23
      - *a3
      - *a28
      - *a27
      - *a29
      - *a57
      - *a30
      - *a31
      - *a6
      - *a33
      - *a34
  compatibility:
    text: "The unanimous speciesOnly decision is false, because the higher-trust care account permits
      large-cichlid companions. This still requires robust adults, substantial additional space and a way to
      separate fish. An adult oscar or large severum is a conditional candidate inferred from that broad
      advice, without a verified pairing record. Small tetras and dwarf cichlids are unsuitable. Armour alone
      does not protect a catfish that fits the mouth. No supported hybrid-group membership was found; this
      does not make other large pikes compatible or demonstrate reproductive isolation."
    sources:
      - *a25
      - *a27
      - *a64
      - *a71
      - *a60
  problems:
    text: "The clearest practical risks are buying the wrong species, housing adults in too little space and
      overlooking persistent partner harassment. Check access to food and cover as well as injuries. Head
      erosion has been reported in aquarium guidance and warrants review of husbandry and qualified diagnosis
      rather than assumptions about a single cause. A field parasite study supports careful quarantine and
      observation of wild arrivals, without establishing that every aquarium fish has the same infections. Low
      buffering makes stable maintenance especially important."
    sources:

  husbandry:
    text: "Provide at least six adults with approximately 756 litres and a footprint of 210 by 60 cm. Give them
      open areas of fine sand with sheltered resting spaces around securely placed wood. Maintain mature
      biological filtration and regular substantial water changes with closely matched replacement water. The
      maintenance envelopes are 24 to 30 C, pH 5.0 to 7.5, GH 0 to 12 and KH 0 to 7; the endpoints are
      uncertain and should not become targets. Warm, soft, mildly acidic and stable conditions are a
      reasonable starting point."

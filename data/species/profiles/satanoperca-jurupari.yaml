  habitat:
    text: "Records cover the Amazon system and nearby northeastern coastal drainages. Connected lakes and quieter
      river areas provide soft sediment and submerged cover. The profile uses 27 to 30 C and pH 5.3 to 7.5 as
      partial natural habitat estimates; wider regional measurements exist and do not establish individual
      fish exposure. GH and KH of 0 to 5 are rounded chemistry proxies with low confidence, not complete
      collecting-site limits."

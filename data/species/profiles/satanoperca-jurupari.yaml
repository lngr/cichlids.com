        archived: seriouslyfish.com/species/satanoperca-jurupari/2026-10-14T103138Z
        accessed: "2026-10-13"
  diet:
    text: "Offer fine sinking complete foods containing both animal and plant ingredients, supplemented with small
      aquatic invertebrates. Spread modest meals across several locations so quieter fish can feed. Their
      omnivorous diet does not call for a fish-based staple. Opportunistic consumption of fry warrants
      predation level 1, with no evidence for routine predation on all mouth-sized companions. The false bloat
      flag indicates an unestablished specific protein conflict rather than immunity from digestive disease."

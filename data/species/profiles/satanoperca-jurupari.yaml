        accessed: "2026-10-13"
  compatibility:
    text: "Calm companions that share the water conditions and leave food accessible can suit an adequately
      enlarged aquarium. Adult angelfish and appropriately sized peaceful tetras are conditional examples.
      Avoid aggressive bottom territories, very fast competitors and tiny fry. Two pairwise crossing cautions
      concern mapiritensis and rhynchitis; both are presumed from relationship or possible introgression
      evidence. Their inclusion does not establish crossing with every member of the genus."

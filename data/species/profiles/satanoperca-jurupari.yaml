    kind: "locality"
    note: "Reported in the Seriously Fish account; identification and boundaries need checking, and this is not a
      captive colour strain."
  - name: "Amapa coastal population"
    kind: "locality"
    note: "Provisional regional form, not a distinct colour morph. Some specimens resemble rhynchitis; no separate
      compatibility claims are made."

        accessed: "2026-10-13"
  sexing:
    text: "Body size alone is a weak guide to sex. Mature females can be fuller when carrying eggs, but age and
      feeding history also affect shape and size. External differences are subtle and there is no dependable
      colour rule for assigning juveniles. Repeated spawning observations provide more useful evidence than a
      presumed sex label on a single fish."
    sources:

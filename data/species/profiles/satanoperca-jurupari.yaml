  socialBehavior:
    text: "The normal maintenance unit is a group rather than an isolated pair. Six is a planning minimum within
      published recommendations that range from five to eight fish. Watch feeding access and persistent
      exclusion of a subordinate, even when wounds are absent. Breeding adults defend a local site and may
      chase approaching fish. Visual barriers and broad retreat routes help keep that temporary defence from
      trapping the rest of the group."
    sources:
      - kind: "database"
        title: "Aqua-Fish: Earth eater, Satanoperca jurupari"
        url: "https://en.aqua-fish.net/fish/earth-eater"
        archived: en.aqua-fish.net/fish/earth-eater/2026-10-14T103139Z
        accessed: "2026-10-13"

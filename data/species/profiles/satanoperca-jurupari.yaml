  sizeAndGrowth:
    text: "Allow for a well-grown male around 25 cm total length and a female around 23 cm. The female figure is
      approximate because aquarium size series separated by sex are unavailable. Record standard lengths
      exclude the tail and are not interchangeable with these planning sizes. Juvenile dimensions should never
      determine the permanent space available to the adult group."

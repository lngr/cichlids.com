  problems:
    text: "Check the substrate and feeding access when a fish loses condition or remains hidden. Coarse gravel
      interferes with normal sand processing, and accumulated waste or abrupt changes can cause further
      stress. Studies of wild populations report diverse parasites, making quarantine and observation useful
      for new arrivals. The archive includes stressed mixed-stock situations but supplies weak identification
      and duration evidence. Persistent lesions, swelling or breathing changes need investigation rather than
      an automatic diagnosis from appearance."

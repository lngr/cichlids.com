    rationale: "The tally uses a median because no qualified majority settled the native temperature envelope. The
      six minima have a median of 26.5 C, rounded to 27, and the maxima have a median of 30 C. The result is a
      partial habitat estimate rather than complete species limits. Bittencourt records 27.8 to 28.5 C in the
      channel containing the sampled fish; its wider 26 to 33 C floodplain measurements did not accompany
      jurupari captures. Correa records jurupari in Taraira Lake and pooled habitat temperatures of 24.4 to
      37.1 C, with a narrower 24.4 to 32 C span across low and rising water. These wider ranges and Drake's
      regional 27.8 to 31.1 C observations are retained as evidence without claiming fish exposure at every
      endpoint. Hidalgo Sanchez station means and Queiroz regional measurements supply context. FishBase 24 to
      26 C refers to an aquarium atlas, not a collecting series. Low confidence reflects incomplete coverage
      and uncertain coastal identification. Proposals: generator proposed {\"min\": 27.8, \"max\": 29.5};
      checker-a proposed {\"min\": 26, \"max\": 30}; checker-b proposed {\"min\": 24.4, \"max\": 30.1};
      checker-c proposed {\"min\": 27, \"max\": 30}; tiebreaker-1 proposed {\"min\": 27.8, \"max\": 28.5};
      tiebreaker-2 proposed {\"min\": 24.4, \"max\": 32}."

  ph:
    value:
      min: 5.3
      max: 7.5
    confidence: "medium"
    rationale: "The qualified majority selects pH 5.3 to 7.5. Correa directly measured 5.3 to 5.7 in Taraira Lake,
      where the species was recorded, and Bittencourt measured 6.4 to 6.9 in the species-positive Fortaleza
      channel. Tavares-Dias and Oliveira give a basin-wide 5.5 to 7.5 interval attributed to an earlier
      environmental assessment, while Hidalgo Sanchez gives native-drainage station means reaching 7.5. These
      are partial regional observations. Wider source ranges include Drake's 6.1 to 8.3 at Obidos, Silva's
      4.62 to 7.86 and Aprile and Darwich's 4.5 to 6.6 in Catalao; species occurrence was not matched to their
      endpoints. They do not establish broader limits for correctly identified jurupari. Bittencourt's
      floodplain pH 6.2 to 7.5 is not substituted for its sampled channel. The upper endpoint is habitat-scale
      evidence rather than a measurement beside an individual fish. Proposals: generator proposed {\"min\":
      5.3, \"max\": 7.5}; checker-a proposed {\"min\": 5.3, \"max\": 7.5}; checker-b proposed {\"min\": 4.5,
      \"max\": 7.2}; checker-c proposed {\"min\": 5, \"max\": 7.3}; tiebreaker-1 proposed {\"min\": 5.5,
      \"max\": 7.5}; tiebreaker-2 proposed {\"min\": 5.3, \"max\": 7.5}."

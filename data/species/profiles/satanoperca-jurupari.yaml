  hybridGroups:
    value:
      - "satanoperca-jurupari-mapiritensis"
      - "satanoperca-jurupari-rhynchitis"
    confidence: "low"
    rationale: "Four of six votes support both pairwise ids by qualified majority. The presumed
      jurupari-mapiritensis group follows the rubric's very-close-relationship provision: Willis and
      colleagues found no clear genetic separation in their 2012 study. Only the abstract was accessible;
      fetch-oa refused its full text as non-open-access. The presumed jurupari-rhynchitis group follows
      Kullander's possible coastal introgression and the competing explanations summarized by Seriously Fish.
      The permitted fetch returned Kullander's abstract rather than the full revision. Neither study
      establishes verified free-choice aquarium offspring. The Catalog retains all three names as valid, and
      incomplete lineage sorting or disputed species boundaries remain alternatives. These are two separate
      presumed groups, with no inferred mapiritensis-rhynchitis cross and no all-to-all group containing
      leucosticta or undescribed trade fish. Proposals: generator proposed
      [\"satanoperca-jurupari-mapiritensis\", \"satanoperca-jurupari-rhynchitis\"]; checker-a proposed [];
      checker-b proposed [\"satanoperca-jurupari-rhynchitis\", \"satanoperca-jurupari-mapiritensis\"];
      checker-c proposed [\"satanoperca-jurupari-rhynchitis\"]; tiebreaker-1 proposed
      [\"satanoperca-jurupari-mapiritensis\", \"satanoperca-jurupari-rhynchitis\"]; tiebreaker-2 proposed
      [\"satanoperca-jurupari-mapiritensis\", \"satanoperca-jurupari-rhynchitis\"]."

    confidence: "low"
    rationale: "The tally fixes a rounded regional estimate of 0 to 5 dKH. Endpoint medians of the four broadly
      agreeing proposals round to these bounds; natural KH has no verification object. Rios-Villamizar's Tefe,
      Jutai and Jurua bicarbonate concentrations of 6.86, 8.78 and 106.14 mg/L yield approximately 0.31 to
      4.87 dKH after division by 21.8. Souto's alkalinity table independently spans about 0.20 to 4.85 dKH
      after dividing mg/L CaCO3 by 17.848, and Queiroz reports concentrations extending below detection.
      Catalao and Barro Branco are additional regional proxies. Drake's ion-charge residual is only
      contextual, not measured carbonate hardness. Organic contributors to alkalinity and missing
      fish-locality linkage limit interpretation; zero is rounded weak buffering rather than proven chemical
      zero. Proposals: generator proposed {\"min\": 0.3, \"max\": 4.9}; checker-a proposed {\"min\": 0.5,
      \"max\": 3}; checker-b proposed {\"min\": 0, \"max\": 5}; checker-c proposed {\"min\": 0, \"max\": 5}."

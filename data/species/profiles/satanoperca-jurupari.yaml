    rationale: "All four votes agree within the permitted 2 dGH comparison threshold. Their endpoint medians round
      to 0 and 5 dGH, as fixed by the tally; agreement does not make the underlying habitat transfer certain.
      Rios-Villamizar measured Ca and Mg in the Jutai, Tefe and Jurua; Ca mg/L / 7.14 plus Mg mg/L / 4.34
      gives approximately 0.11 to 5.58 dGH. That source range is wider at its upper end than the rounded
      decision. Drake independently supports about 0.87 to 1.70 dGH in the mainstem, and the Catalao, Queiroz
      and Souto studies support mineral-poor regional water. These are regional proxies without simultaneous
      species sampling. The rounded zero means extremely dilute water, not a demonstrated absence of every
      hardness ion. Conductivity and aquarium hardness recommendations are not used as natural GH
      measurements. Proposals: generator proposed {\"min\": 0.1, \"max\": 5.6}; checker-a proposed {\"min\":
      0.5, \"max\": 5}; checker-b proposed {\"min\": 0, \"max\": 3.5}; checker-c proposed {\"min\": 0,
      \"max\": 6}."

  note: "The Catalog confirms Satanoperca jurupari (Heckel, 1840), originally Geophagus jurupari, as valid.
    Leucosticta, mapiritensis and rhynchitis remain distinct valid species despite historical synonymy or
    difficult identification. This profile covers the described Amazonian jurupari rather than all fish sold
    under that name. The taxonomic jurupari species group consists of mouthbrooding relatives and is not
    itself evidence of all-to-all crossing. Willis's abstract identifies distinct nominal populations in the
    Tapajos, Xingu and Araguaia plus Parana. Coastal Amapa and French Guiana samples also need identification
    review; some are related to rhynchitis. Shop labels cannot resolve those lineages."

    - species: "Pterophyllum scalare"
      reason: "Adult angelfish share warm soft-water conditions and usually occupy a different feeding level."
      condition: "Peaceful adults with retreats; allow additional volume and watch spawning aggression."
    - species: "Hyphessobrycon erythrostigma"
      reason: "A suitably sized peaceful tetra can act as a midwater companion without relying on the sand floor."
      condition: "Established adult school; exclude very small fry and maintain feeding access for the eartheaters."
    - species: "Mesonauta festivus"
      reason: "A generally restrained cichlid suited to warm, soft-water communities."
      condition: "Additional space and visual cover; separate if breeding territoriality disturbs the eartheater group."
  unsuitable:
    - species: "Rocio octofasciata"
      reason: "Strong territorial aggression and competition can overwhelm a quiet sand-feeding group."
    - species: "Tropheus moorii"
      reason: "Its alkaline-water maintenance, social aggression and specialised grazing diet do not fit this
        community."
    - species: "Potamotrygon motoro"
      reason: "Shares the floor but can prey on sleeping eartheaters; the cited care account reports losses with
        rays."
    - species: "Satanoperca mapiritensis"
      reason: "Shares a presumed pairwise crossing group supported by genetic closeness; risk remains unconfirmed."
    - species: "Satanoperca rhynchitis"
      reason: "Shares a presumed pairwise crossing group supported by possible coastal introgression; parentage is
        unresolved."
profile:
  overview:
    text: "A group of demon eartheaters can make an absorbing centrepiece for a spacious South American aquarium.
      The fish spend much of their time processing fine sediment for food, with subdued metallic colours that
      change with light and mood. Confirm identification before relying on a sales label: jurupari frequently
      denotes leucosticta or an unresolved Satanoperca form in the trade."
    sources:
      - kind: "catalog-of-fishes"
        title: "Eschmeyer's Catalog of Fishes: Satanoperca, updated 21 September 2026"
        url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Sa\
          tanoperca"
        archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-2aa646eb/2026-10-14T103136Z
        accessed: "2026-10-13"

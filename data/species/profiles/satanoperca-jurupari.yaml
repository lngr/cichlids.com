    confidence: "high"
    rationale: "The Catalog and FishBase support an Amazonian species including northeastern coastal records.
      Named collecting studies add Taraira Lake and Igarape Fortaleza. Coastal identity remains uncertain
      after the description of rhynchitis, while Essequibo and Nickerie leucosticta and Orinoco mapiritensis
      are not treated as jurupari. The regional wordings and locality subsets proposed by generator,
      checker-a, checker-b and checker-c describe overlapping records rather than four distinct ranges; the
      final wording combines those records and keeps the coastal qualification."

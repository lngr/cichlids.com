        accessed: "2026-10-13"
  breeding:
    text: "The selected breeding category is maternal mouthbrooding. The clearest species-specific care accounts
      describe the female collecting eggs and protecting the developing young orally. Other accounts report
      delayed collection or some male participation, and uncertain trade identities complicate those
      differences. Do not assume a fixed incubation timetable for every population. Released fry remain
      vulnerable to other fish, including adults of their own species."

  habitat:
    text: "The species uses the boundary between rocky ground and sand, with space to move above it.
      FishBase emphasizes depths of 2 to 10 m; the specialist accounts describe 3 to 15 m and
      occasional records near 30 m. Vegetated patches are also reported, but dense planting is
      optional. Natural lake water spans 21 to 29 C, pH 7.7 to 8.6, GH 3 to 5 dGH and KH 5 to 8 dKH.
      The alkaline pH does not make this a naturally high-GH lake: alkalinity and calcium-magnesium
      hardness are separate properties."
    sources:

      rationale: "The conservative tally decides 5 to 10 dKH at low confidence with 3 agreeing votes out
        of 6. Generator, checker-b and checker-c proposed 5 to 10; checker-a, tiebreaker-1 and
        tiebreaker-2 proposed 5 to 15. Neither camp reaches four votes, so the tally takes their
        intersection. Abysse gives KH 10 as a target rather than a proven upper limit, and aquarium
        records report KH 7 and 5 to 6. The wider Neotropic species recommendation is 5 to 15; its
        original archived HTML contains that value although automatic text extraction omitted it.
        OATA gives 10 to 15 for Malawi cichlids generally, Malawi-Guru allows the wider 6 to 20 with
        a preferred 8 to 10, Malawi Cichlids UK gives 6 to 12, and Best4Pets gives the much wider 8
        to 25 alongside inconsistent adult tank advice. JBL gives 5 to 10 for an example mbuna
        aquarium. All these claims remain evidence. The narrower tally decision is a provisional
        precaution, not a demonstrated injury threshold above 10; no species-specific multiyear KH
        experiment was found."

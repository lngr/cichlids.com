partners:
  suitable:
    - species: Dimidiochromis compressiceps
      reason: A comparably sized adult Malawi predator can share water and feeding requirements.
      condition: Adults too large to swallow; a mixed aquarium must exceed the space needed for the
        Aristochromis harem alone.
    - species: Fossorochromis rostratus
      reason: Large adults are candidates for a spacious Malawi community with open swimming and sand.
      condition: "Fully grown fish, ample additional floor area and a feeding plan that meets both species
        needs."
    - species: Champsochromis caeruleus
      reason: A large Malawi predator is a potential companion when both fish have enough open water.
      condition: Adult size matching and a substantially larger aquarium than the minimum for one harem.
  unsuitable:
    - species: Labidochromis caeruleus
      reason: Its smaller adult size and especially its juveniles expose it to predation; rocks do not
        ensure protection.
    - species: Aulonocara baenschi
      reason: Small peacocks can be swallowed or excluded from feeding by a full-grown predator.
    - species: Chindongo demasoni
      reason: A small mbuna is vulnerable prey and its algae-oriented diet conflicts with predator feeding.
profile:
  overview:
    text: "Aristochromis christyi is the Malawi Hawk, a large fish hunter endemic to Lake Malawi. Its
      sideways hunting posture is more than a name or an aquarium anecdote. Field observers describe
      a tilted approach, attention focused through one eye and a sudden lateral strike. Prey can be
      substantial relative to its own length. A fish cruising quietly around an aquarium can
      therefore remain a serious threat to smaller companions."
    sources:

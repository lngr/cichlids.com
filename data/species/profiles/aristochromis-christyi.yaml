  husbandry:
    text: "For one male and three females, the adopted minimum is 700 litres with a 200 by 60 cm
      footprint. Keep broad turning and swimming lanes alongside separated rock refuges. Large
      companions need additional room for their own adult space and social requirements. Published
      advice also includes larger 900 to 1000 litre setups and 250 cm lengths. Efficient biological
      filtration and regular removal of accumulated waste matter for these large predators. Routine
      maintenance near 24 to 26 C is better supported than holding fish constantly at the 21 or 29 C
      tolerance endpoints. The KH tolerance of 5 to 10 dKH is provisional and does not establish
      that water above 10 causes harm."

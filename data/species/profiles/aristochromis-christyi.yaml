  socialBehavior:
    text: "The selected aquarium arrangement is a harem, with one male and three females. Wild adults
      are often apart, and reproduction does not establish a permanent pair. A male preparing a
      spawning site may repeatedly pursue a female that is not receptive. Several females and
      separated refuges help distribute that attention, but do not guarantee safety. The profile
      uses a small temporary breeding territory with low confidence because its actual dimensions
      are unmeasured. Territorial pursuit and appetite for small fish should be assessed
      separately."
    sources:
      - *a49
      - *a2
      - *a13
      - *a52

      - *a58
      - *a15
      - *a24
      - *a65
      - *a16
      - *a44
      - *a25
      - *a78
      - *a1
      - *a3
      - *a68
      - *a66
      - *a69
      - *a5
  problems:
    text: "Adult space, prey-sized tankmates and persistent pursuit within the harem are the principal
      planning concerns. Watch for fish that remain hidden, lose access to food or cannot leave the
      spawning area. Large meals and uneaten animal food also increase the load on filtration.
      Quarantine new arrivals and monitor water quality when appetite or breathing changes. Feeding
      speed, defended area, lifespan and tolerance endpoints remain less certain than fish predation
      and maternal mouthbrooding."
    sources:
      - *a59
      - *a13
      - *a46

      decision: *a84
      rationale: "Generator and checker-b proposed blue and black with stripes; checker-a proposed plain
        blue; checker-c proposed blue, silver and black with stripes. Seriously Fish describes blue
        adult males whose dark body marking disappears at peak spawning condition. The stripe
        therefore represents ordinary adult appearance outside full breeding display. Silver is a
        background colour more prominent in females and young fish; blue and black retain the
        principal male contrast. The plain-blue evidence and the Nordic account of red details
        remain retained rather than treated as contradictory species identities."
    - field: features.minTank
      proposals:
        - by: generator
          value:
            volumeL: 1000
            lengthCm: 250
            depthCm: 60
        - by: checker-a
          value:
            volumeL: 650
            lengthCm: 180
            depthCm: 60
        - by: checker-b
          value:
            volumeL: 700
            lengthCm: 200
            depthCm: 60
        - by: checker-c
          value:
            volumeL: 1000
            lengthCm: 250
            depthCm: 60
      decision: *a85
      rationale: "Generator and checker-c proposed 1000 L, 250 cm length and 60 cm depth; checker-a
        proposed 650 L, 180 cm and 60 cm; checker-b proposed 700 L, 200 cm and 60 cm. The starting
        component medians are 875 L, 225 cm and 60 cm. The source check favours the Nordic register
        at 700 L and 200 cm together with the higher-trust Seriously Fish minimum of 648 L and 180
        by 60 cm, rather than treating the unsourced interpolated 875 L and 225 cm as measured
        minima. The chosen unit is one male and three females, with rock refuges and usable swimming
        space. Malawi-Guru and Malawi.si recommend 1000 L and 250 cm for one male with two females;
        Fishipedia gives 1000 L, Abysse 900 L, Aquarium Wiki 757 L and Aquario about 1000 to 1500 L
        for breeding several adults. Neotropic gives 600 L and 200 cm but also uncorroborated much
        larger adult sizes. These stricter or lower recommendations remain evidence; mixed
        communities require extra room. The 60 cm depth comes from Seriously Fish and is a combined
        recommendation rather than a complete set of Nordic dimensions."

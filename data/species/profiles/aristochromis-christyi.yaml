      decision: demanding
      rationale: "Generator, checker-b and checker-c proposed demanding; checker-a proposed moderate.
        Seriously Fish rates overall difficulty moderate, while the Nordic register rates the
        species for advanced keepers. Adult space, prey-size screening, waste management and male

  temperatureC:
    value:
      min: 21
      max: 29
    confidence: high
    rationale: "The settled waterbody decision is 21 to 29 C at high confidence. This is the lake-wide
      seasonal envelope, not a preferred constant aquarium temperature. FAO summarizes an older 23
      to 25 C surface survey; Vollmer describes summer surface water near 28 C and winter water
      below 24 C. Eccles and the later campaigns underlying the lake synthesis account for its wider
      endpoints. The inaccessible Eccles publisher page is retained as offline and supplies no
      independently read numerical evidence here."

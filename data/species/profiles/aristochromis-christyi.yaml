  sizeAndGrowth:
    text: "Plan for typical adult maxima around 30 cm in males and 26 cm in females. The female figure
      comes from a specialist account that separates the sexes, rather than from an estimate based
      only on males. Sources mix total and standard length, so their 30 cm entries are not
      interchangeable measurements. Growth rates lack good documentation here. An 8 to 12 year
      lifespan is a tentative planning expectation, with published claims extending from 5 to 15
      years and no clear age-verification data."
    sources:

    - field: features.maxSizeCm
      proposals:
        - by: generator
          value:
            male: 30
            female: 25
        - by: checker-a
          value:
            male: 30
            female: 25
        - by: checker-b
          value:
            male: 30
            female: 25
        - by: checker-c
          value:
            male: 30
            female: 26
      decision: *a80
      rationale: "Generator, checker-a and checker-b proposed male 30 cm and female 25 cm; checker-c
        proposed male 30 and female 26. The initial component medians are 30 and 25. Malawi.si
        explicitly states typical adults of 30 cm for males and 26 cm for females, so its
        sex-specific report replaces the inferred female median. FishBase gives 30 cm total length
        for male or unsexed fish, while Seriously Fish labels 30 cm as standard length; those
        conventions are not converted into a larger aquarium maximum. Abysse gives an unsexed 20 to
        25 cm range. Neotropic claims 40 cm males and 35 cm females in its archived HTML, but this
        low-trust retail claim is not corroborated by the curated or specialist adult-size sources.
        The chosen values are planning maxima rather than specimen records."
    - field: features.diet
      proposals:
        - by: generator
          value:
            type: piscivore
            bloatSensitive: false
            foods:
              - Complete pellets for carnivorous cichlids
              - Thawed fish portions
              - Aquatic crustaceans
              - Mollusc flesh
        - by: checker-a
          value:
            type: piscivore
            bloatSensitive: false
            foods:
              - fish
              - prawns
              - mussel
              - cockle
              - lancefish
              - pellets
        - by: checker-b
          value:
            type: piscivore
            bloatSensitive: false
            foods:
              - fish flesh
              - aquatic crustaceans
              - mollusc flesh
              - suitable carnivore pellets
        - by: checker-c
          value:
            type: piscivore
            bloatSensitive: false
            foods:
              - Fish flesh
              - Prawns
              - Mussels
              - Cockles
              - Carnivore pellets as a supplement
      decision: *a81
      rationale: "All four complete runs agree on piscivore and bloatSensitive false; the unanimous tally
        retains its exact food list and high confidence. CRC, the field paper and Seriously Fish
        support fish-based feeding. The generator names complete carnivore pellets, thawed fish
        portions, aquatic crustaceans and mollusc flesh; checker-a specifies fish, prawns, mussel,
        cockle, lancefish and pellets; checker-b gives fish flesh, crustaceans, mollusc flesh and
        carnivore pellets; checker-c names fish flesh, prawns, mussels, cockles and pellets as a
        supplement. These lists describe overlapping foods. Seriously Fish advises using varied
        aquatic animal foods rather than pellets alone. False means no supported low-protein grazer
        conflict in the rubric; it is inferred from trophic biology and does not assert immunity to
        digestive disease."
    - field: features.aggressionHeterospecific
      proposals:
        - by: generator
          value: 2
        - by: checker-a
          value: 2
        - by: checker-b
          value: 2
        - by: checker-c
          value: 1
      decision: 2
      rationale: "Generator, checker-a and checker-b proposed level 2; checker-c proposed level 1, so the
        numeric median is 2. Malawi-Guru describes temporary spawning-site defence, which best fits
        local territorial chasing. Malawi.si describes sufficiently large companions as generally
        peaceful, and Seriously Fish permits similar-sized species. Their calm-hunter descriptions
        lower certainty but do not exclude breeding defence. There is no evidence for routine
        attacks on comparable adults beyond the territory; predation on small companions is scored
        separately."

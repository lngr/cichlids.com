        - by: checker-b
          value:
            size: small
            breedingOnly: true
        - by: checker-c
          value:
            size: large
            breedingOnly: true
      decision: *a82
      rationale: "Generator and checker-b proposed small breeding-only territory; checker-a proposed large
        territory outside breeding; checker-c proposed large breeding-only territory. Malawi-Guru
        and Malawi.si explicitly describe temporary spawning territories, weighted above the general
        Fishipedia and Wikipedia territorial labels. The defended spawning location is coded small
        as a provisional inference; no source measures a radius. Large aquarium requirements and
        adult body size do not establish a defended area of at least a third of a 150 cm tank. All
        conflicting territory evidence is retained."

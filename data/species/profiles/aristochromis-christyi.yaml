      - *a61
  diet:
    text: "Fish provide the central natural food source. Aquarium feeding can combine varied aquatic
      animal foods, such as thawed fish portions, crustaceans and mollusc flesh, with appropriate
      complete carnivore pellets. The cited specialist account advises against making pellets the
      sole basis. Prepared and dead foods can be accepted without maintaining live feeder fish.
      Check that each adult gets food and remove uneaten pieces. The false bloatSensitive flag
      describes the absence of a low-protein grazer conflict; it does not mean digestive disease is
      impossible."
    sources:
      - *a51
      - *a49
      - *a32
      - *a13
      - *a46
  breeding:
    text: "The female carries the developing brood in her mouth. A male courts at a prepared spawning
      area, and a receptive female collects eggs during the spawning sequence. Seriously Fish
      describes oral incubation lasting about three to four weeks, followed by a period of
      protection after release. Disturbance can disrupt brooding, and other predators may consume
      free-swimming young. A breeding setup should therefore provide quiet refuges for the female
      and separate space for young once they feed independently."
    sources:
      - *a49
      - *a32
      - *a13
      - *a46
  sexing:
    text: "Adult males develop stronger blue coloration, especially during reproduction, and grow
      slightly larger than females. The dark lengthwise or diagonal marking can remain visible
      outside full spawning colour and fade during display. Females and juveniles have a paler
      appearance with dark markings. Young fish and subordinate males can be difficult to identify
      reliably from colour alone, so the intended one-male harem needs reassessment as the fish
      mature."
    sources:
      - *a13
      - *a59
      - *a23
      - *a46
      - *a21
      - *a14
      - *a60
      - *a15
      - *a28
      - *a24
      - *a16
      - *a44
      - *a26
      - *a25
  compatibility:
    text: "Suitable candidates include appropriately sized adult Dimidiochromis compressiceps,
      Fossorochromis rostratus and Champsochromis caeruleus in a sufficiently enlarged aquarium.
      Every companion must be too large to swallow and have enough room to escape territorial
      pursuit. Small mbuna, young peacocks and juveniles of otherwise large species can become prey;
      rockwork does not remove that risk. The species is not restricted to species-only housing. No
      supported hybrid group currently applies, but the empty list does not demonstrate reproductive
      isolation from other Malawi cichlids."
    sources:
      - *a21
      - *a52
      - *a67
      - *a45
      - *a62
      - *a63
      - *a64
      - *a13
      - *a59

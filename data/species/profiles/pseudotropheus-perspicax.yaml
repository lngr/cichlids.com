  diet:
    text: "Use vegetable-based mbuna pellets or spirulina flakes as the staple and retain rock biofilm for grazing.\
      \ The wild diet is dominated by algae, with a small incidental invertebrate component. That supports aufwuchs\
      \ rather than fish feeding; occasional accidental fry intake remains possible. Vigorous appetite calls for modest\
      \ portions distributed so subordinate fish can eat. The bloat flag is a precaution from herbivorous-mbuna husbandry,\
      \ not a quantified disease rate for perspicax. Rich feeding, stress and poor water quality can all contribute\
      \ to digestive problems."

  problems:
    text: "Uncertain trade identity can lead to the wrong habitat or aggression assumptions. Repeated pursuit, inadequate\
      \ escape cover, poor oxygenation and excessive feeding are practical failure points. Inspect excluded or injured\
      \ fish and correct the underlying arrangement. Swelling or appetite loss has several possible causes and is\
      \ not a diagnosis of bloat by itself. Review water quality, diet and stress, and obtain qualified help when\
      \ a fish deteriorates. Quarantine arrivals and retain reliable collection records. Sudden changes in pH, GH\
      \ or KH are not a substitute for stable maintenance."

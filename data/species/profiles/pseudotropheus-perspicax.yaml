  breeding:
    text: Females collect eggs after spawning and incubate the brood orally. Males defend a spawning site but do not
      share incubation or form a lasting pair bond. Rock cover lets a carrying female withdraw from courtship. Brooding
      duration and brood size vary; no securely species-specific numerical schedule is established here. Preserve
      locality records and keep breeding lines identifiable. The absence of an assigned hybrid group does not prove
      reproductive isolation. Plan adequate space for any offspring before deliberately breeding the group.

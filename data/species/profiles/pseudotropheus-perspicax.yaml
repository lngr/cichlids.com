      \ wild adults of 8 and 6.5 cm, while FishBase's 8.1 cm TL concerns male or unsexed material and supplies no\
      \ female maximum. NCS notes larger captive growth. Fischlexikon's matching 10 and 8 cm figures receive less\
      \ weight because of its trade-form confusion. Medium confidence reflects one directly applicable sex-specific\
      \ care record, not multiple captive measurement studies."

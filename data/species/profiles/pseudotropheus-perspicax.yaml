  legacyNames:
  - Pseudotropheus perspicax
  note: "The Catalog of Fishes retains Pseudotropheus perspicax as valid, and the 2012 Melanochromis revision supports\
    \ that placement. Both Pseudotropheus and the original genus Melanochromis were queried on 2026-10-13; the latter\
    \ list is at https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Melanochromis.\
    \ FishBase's tentative link to P. fuscoides is not adopted because the Catalog instead places fuscoides under\
    \ P. fuscus. Entry 485 is assigned by its binomial to the described species from Deep Bay. Checker A's treatment\
    \ of Ndumbi and Orange Cap as populations is rejected: the CRC public classification and specialist trade-form\
    \ records distinguish those undescribed fishes. Seriously Fish treats Pseudotropheus sp. 'acei' separately; it\
    \ is not a synonym of perspicax. Trade labels and the legacy binomial do not independently authenticate photographs."

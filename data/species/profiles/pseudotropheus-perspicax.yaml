  ghDgh:
    value:
      min: 3
      max: 5
    confidence: high
    rationale: "All four main runs proposed natural GH 3 to 5 dGH, the waterbody decision with high confidence. Branchu's\
      \ upper-layer calcium and magnesium yield about 4.2 to 4.6 dGH; the older measurements compiled by FAO yield\
      \ approximately 3.2 to 4.9 dGH. The rounded lake envelope describes soft water. Aquarium recommendations up\
      \ to 20 dGH belong to tolerance rather than natural chemistry."

  - field: taxonomy.note
    proposals:
    - by: generator
      value: "The valid genus and spelling are unchanged from legacy entry 485. The Catalog of Fishes explicitly accepts\
        \ Pseudotropheus perspicax; no transfer to Chindongo is supported. The original Melanochromis genus list was\
        \ also queried. FishBase's older suggestion of conspecificity with P. fuscoides is not adopted: the Catalog\
        \ treats fuscoides as a synonym of P. fuscus, separate from perspicax. This profile concerns the described\
        \ species anchored to Deep Bay, not every fish sold under perspicax. malawi.si distinguishes Pseudotropheus\
        \ sp. 'red top ndumbi' and 'perspicax tanzania', and Chindongo sp. 'perspicax yellow breast'. AquaInfo combines\
        \ Ndumbi and Orange Cap with perspicax, while Fischlexikon mixes eastern localities with a sister-form distinction.\
        \ Their form-specific claims are not transferred without qualification. Pseudotropheus sp. 'acei' is a separate\
        \ undescribed wood-associated, schooling mbuna, not a synonym or a colour form of perspicax. The legacy name\
        \ alone cannot authenticate individual legacy photographs."
    - by: checker-a
      value: "The valid species is known from Deep Bay in the north of Lake Malawi. The fish sold as perspicax is\
        \ mostly the Ndumbi Reef form (trade names Perspicax Orange Cap, Red Top Ndumbi), which hobby sources treat\
        \ as a geographic variant or undescribed form of the complex. The profile uses the valid species as the catalog\
        \ entry."
    - by: checker-b
      value: "The Catalog of Fishes recognizes Pseudotropheus perspicax as valid, with the unique holotype from Deep\
        \ Bay. FishBase suggests possible conspecificity with P. fuscoides, but the current Catalog retains perspicax\
        \ and places fuscoides under P. fuscus, so neither name is merged here. Pseudotropheus sp. acei is a distinct\
        \ undescribed trade taxon, not a synonym; Oliver documents its association with submerged wood. The public\
        \ CRC list separately recognizes perspicax, acei, perspicax orange cap, perspicax hara, perspicax likoma and\
        \ perspicax tanzania. AquaInfo and several older hobby pages mix Orange Cap and Red Top Ndumbi into perspicax,\
        \ so their intense aggression and red-cap descriptions were excluded. Assignment of legacy entry 485 follows\
        \ its supplied binomial; the identity of individual legacy photographs was not independently established.\
        \ FishBase ecology and diet tables yielded no usable species-specific measurements. The forum archive search\
        \ for perspicax returned a mixed-stock mention in thread 48154 and sales threads 54974 and 55583, with no\
        \ reliable ecological or water-tolerance evidence."
    - by: checker-c
      value: "The Catalog of Fishes retains Pseudotropheus perspicax as valid and identifies Deep Bay as the type\
        \ locality. Its Pseudotropheus and Melanochromis lists were consulted, and the 2012 review independently records\
        \ the transfer. FishBase raises possible conspecificity with P. fuscoides, but this is not an accepted synonym\
        \ in the catalog. The unqualified legacy binomial is retained because no independent evidence identifies entry\
        \ 485 as another taxon. Seriously Fish treats acei as a separate undescribed, wood-associated fish. AquaInfo\
        \ conflates perspicax with Orange Cap and Ndumbi forms, whereas Einrichtungsbeispiele explicitly treats Orange\
        \ Cap as undescribed; CRC independently separates these forms and acei. Neither Orange Cap nor acei is listed\
        \ here as a synonym. Stock bearing only a trade label still requires identification. Name checks also used\
        \ https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Melanochromis\
        \ (no perspicax entry), https://www.seriouslyfish.com/species/pseudotropheus-sp-acei/ and https://www.einrichtungsbeispiele.de/zierfische/malawisee/pseudotropheus-perspicax-slnk.html,\
        \ accessed 2026-10-13."
    decision: "The Catalog of Fishes retains Pseudotropheus perspicax as valid, and the 2012 Melanochromis revision\
      \ supports that placement. Both Pseudotropheus and the original genus Melanochromis were queried on 2026-10-13;\
      \ the latter list is at https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Melanochromis.\
      \ FishBase's tentative link to P. fuscoides is not adopted because the Catalog instead places fuscoides under\
      \ P. fuscus. Entry 485 is assigned by its binomial to the described species from Deep Bay. Checker A's treatment\
      \ of Ndumbi and Orange Cap as populations is rejected: the CRC public classification and specialist trade-form\
      \ records distinguish those undescribed fishes. Seriously Fish treats Pseudotropheus sp. 'acei' separately;\
      \ it is not a synonym of perspicax. Trade labels and the legacy binomial do not independently authenticate photographs."
    rationale: "The binomial, genus, author and original combination agree. Checker A broadens the species to Ndumbi\
      \ and Orange Cap; generator and checkers B and C distinguish trade forms. The current Catalog identity, CRC\
      \ public classification and independently read Orange Cap species records support keeping the described species\
      \ separate from those forms and from acei."

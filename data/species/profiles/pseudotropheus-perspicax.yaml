  compatibility:
    text: "A carefully selected mbuna community is possible in more space than the minimum harem aquarium. Labidochromis\
      \ caeruleus and Iodotropheus sprengerae are conditional candidates, with shared feeding and access to refuges\
      \ checked in practice. No controlled perspicax pairing trial establishes those combinations. Stronger bullies\
      \ such as Melanochromis auratus and similar blue rivals such as Chindongo socolofi are poor routine choices.\
      \ Quiet peacocks introduce territory and diet conflicts. Predation level 0 permits incidental fry loss. No applicable\
      \ hybrid group was established, so the empty list is a research limit rather than proof that all mixtures breed\
      \ true."

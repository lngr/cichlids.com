  socialBehavior:
    text: "The recommended aquarium unit is one male with three females. This manages a polygamous territorial species\
      \ rather than a bonded pair. Males can retain cave territories outside spawning and pursue rivals or females\
      \ repeatedly. Female escape cover is essential, and extra males require substantially more space. Watch whether\
      \ each fish can feed and leave its refuge. Persistent confinement or injuries indicate that space, layout or\
      \ the social arrangement needs adjustment. Territorial chasing of other mbuna is expected, especially toward\
      \ similar-looking males."
    sources:
    - kind: database
      title: "Nordiska Ciklidsallskapet: Pseudotropheus perspicax species register"

  sexing:
    text: "Males usually become larger and show a stronger blue display, with yellow extent varying by population.\
      \ Females are duller and may show clearer vertical bars. The adult male is summarized as blue and yellow with\
      \ a plain pattern, rather than using female barring or the red-orange head of Orange Cap as its defining character.\
      \ Colour can mislead in juveniles and subordinate adults. Fin development and mature behavior add clues; a carrying\
      \ female confirms sex. Collection provenance remains important when assessing trade fish."

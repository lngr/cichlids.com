      \ listed populations. Generator proposed the northern Malawi shore with Mara Rocks and waterbody label Lake\
      \ Malawi; checker A included Deep Bay, Ndumbi Reef and Pombo Reef; checkers B and C listed Deep Bay, Mdoka,\
      \ Mbowe and Chirwa with lake-malawi. The decided locality union excludes eastern Ndumbi and Pombo, which belong\
      \ to separately listed trade forms. The normalized waterbody id is lake-malawi."

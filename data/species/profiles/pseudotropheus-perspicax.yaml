      archived: fishbase.se/summary/pseudotropheus-perspicax.html/2026-10-14T102700Z
      accessed: '2026-10-13'
  husbandry:
    text: "For one male and three females, provide at least 250 litres with a footprint of 120 cm by 40 cm. Build\
      \ secure rock refuges with multiple exits and visual breaks, alongside smooth sand for excavation. Provide effective\
      \ filtration, oxygenation and regular water changes matched to the aquarium. A routine temperature near 24 to\
      \ 26 C is supported more directly than constant use of the outer endpoints. The estimated tolerances are 21\
      \ to 29 C, pH 7.5 to 8.6, GH 3 to 20 dGH and KH 5 to 15 dKH. These envelopes include natural conditions and\
      \ do not establish years of safety at every extreme. Test GH and KH separately and preserve stable conditions."
    sources:

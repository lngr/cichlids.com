    tolerance:
      value:
        min: 3
        max: 20
      confidence: low
      rationale: "Generator and tiebreaker-2 proposed 3 to 15 dGH; checker A, checker B, checker C and tiebreaker-1\
        \ proposed 3 to 20 dGH. The tally decides 3 to 20 by a qualified majority of 4 of 6, with low confidence.\
        \ FedeAqua gives 10 to 20 dGH under the valid binomial and Fischlexikon gives 5 to 20 dGH, although its Ndumbi\
        \ and Orange Cap account weakens species identification. Malawi.si recommends 3 to 15 and OATA 12 to 18 for\
        \ Malawi fish generally. The upper endpoint is supported by care records rather than measured chronic tolerance\
        \ trials; the lower endpoint retains natural GH 3 to 5. The narrower minority recommendation is reasonable\
        \ caution but cannot replace the fixed tally decision. Orange Cap's separate 5 to 15 dGH sheet is comparison\
        \ only."

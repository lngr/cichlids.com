    tolerance:
      value:
        min: 21
        max: 29
      confidence: low
      rationale: "Generator and checkers A, B and C all proposed 21 to 29 C, giving unanimous 4-of-4 verification\
        \ and low confidence. NCS, Malawi.si and FedeAqua recommend 23 to 28 C for the described species; OATA gives\
        \ 23 to 27 C for Malawi fish generally. The outer endpoints were expanded to contain the natural range, not\
        \ demonstrated by years of captive endpoint trials. Checker A also used the Orange Cap record at 25.5 to 27.8\
        \ C, which concerns a different trade form. Routine maintenance near 24 to 26 C is better supported than continuous\
        \ use of the extremes."

  temperatureC:
    value:
      min: 21
      max: 29
    confidence: high
    rationale: "The lake-wide natural range is fixed at 21 to 29 C by the waterbody decision, with high confidence.\
      \ All four main runs proposed that same range. Eccles's readable abstract reports 21 C inshore cooling and about\
      \ 27 C in May; Vollmer reports summer surface water near 28 C and winter cooling below 24 C. FAO's older 23\
      \ to 25 C surface interval and Branchu's single 25.4 C surface observation describe particular observations,\
      \ not the entire seasonal envelope. No individual cited observation is represented as measuring the complete\
      \ 21 to 29 C range."
    sources:
    - kind: literature
      title: "Eccles, D. H. (1974). An outline of the physical limnology of Lake Malawi (Lake Nyasa). Limnology and\
        \ Oceanography 19(5), 730-742 (abstract)."
      url: "https://doi.org/10.4319/lo.1974.19.5.0730"
      accessed: '2026-10-13'
    - kind: literature
      title: "Vollmer, M. K., Bootsma, H. A., Hecky, R. E., Patterson, G., Halfman, J. D., Edmond, J. M., Eccles,\
        \ D. H. and Weiss, R. F. (2005). Deep-water warming trend in Lake Malawi, East Africa. Limnology and Oceanography\
        \ 50(2), 727-732."
      url: "https://doi.org/10.4319/lo.2005.50.2.0727"
      archived: doi.org/10.4319_lo.2005.50.2.0727/2026-10-13T071601Z
      accessed: '2026-10-13'

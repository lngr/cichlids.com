  sizeAndGrowth:
    text: "Allow about 10 cm for an adult aquarium male and 8 cm for a female. FedeAqua's sex-specific care intervals\
      \ support these upper endpoints. Typical wild adults reported by Malawi.si are smaller, about 8 and 6.5 cm;\
      \ FishBase's 8.1 cm is male or unsexed total length. Captive growth can exceed field sizes, but excessive bulk\
      \ is not a feeding goal. The selected 4 to 8 year lifespan is a single species-care estimate. A reliable growth\
      \ timetable and a longitudinal longevity study were not established."
    sources:
    - kind: database
      title: "FedeAqua: Pseudotropheus perspicax care sheet"

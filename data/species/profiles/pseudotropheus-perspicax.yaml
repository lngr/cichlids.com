partners:
  suitable:
  - species: Labidochromis caeruleus
    reason: Practical Fishkeeping identifies both as relatively mild mbuna candidates. Their differing adult colours
      reduce visual rivalry.
    condition: Only a larger sheltered community with an algae-rich shared staple and monitored feeding; its invertebrate-feeding
      needs must not lead to a meat-rich perspicax staple.
  - species: Iodotropheus sprengerae
    reason: A possible contrasting-colour mbuna candidate with broadly compatible habitat and feeding.
    condition: "An inferred candidate, not a verified perspicax pairing trial. Provide more space than the harem minimum\
      \ and monitor the quieter fish for exclusion."
  unsuitable:
  - species: Melanochromis auratus
    reason: Its stronger aggression makes domination of the smaller perspicax group plausible even with overlapping
      water conditions.
  - species: Chindongo socolofi
    reason: Similar blue adult males can provoke territorial rivalry. This is a behavioral caution rather than a documented
      perspicax cross.
  - species: Aulonocara stuartgranti
    reason: "A quieter sand-feeding peacock faces mbuna territory and feeding pressure, while an animal-rich staple\
      \ conflicts with this aufwuchs grazer."
  - species: Pseudotropheus sp. 'perspicax orange cap'
    reason: A separately recognized trade taxon with look-alike males and unresolved crossing risk; it is not a locality
      variant of the described species.
profile:
  overview:
    text: "Pseudotropheus perspicax is a small territorial mbuna from Lake Malawi. Its accepted name remains in Pseudotropheus,\
      \ with Melanochromis perspicax as the original combination. This profile assigns legacy entry 485 to the described\
      \ species from Deep Bay. Orange Cap, Red Top Ndumbi and Yellow Breast labels can identify separately recognized\
      \ undescribed fishes. Pseudotropheus sp. 'acei' is also separate, with a wood-associated schooling ecology.\
      \ Check collection provenance rather than identifying every blue fish sold as perspicax by that label alone."
    sources:
    - kind: catalog-of-fishes
      title: "Eschmeyer's Catalog of Fishes: Pseudotropheus species list and perspicax entry"
      url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Pseudotropheus"
      archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-54fb6171/2026-10-14T101559Z
      accessed: '2026-10-13'
    - kind: literature
      title: Konings and Stauffer (2012). Review of the Lake Malawi genus Melanochromis with a description of a new
        species
      url: "https://doi.org/10.11646/zootaxa.3258.1.1"
      archived: doi.org/10.11646_zootaxa.3258.1.1/2026-10-13T071156Z
      accessed: '2026-10-13'

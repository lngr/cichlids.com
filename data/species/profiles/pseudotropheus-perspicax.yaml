      url: "https://www.seriouslyfish.com/species/pseudotropheus-sp-acei/"
      archived: seriouslyfish.com/species/pseudotropheus-sp-acei/2026-10-14T102711Z
      accessed: '2026-10-13'
  habitat:
    text: "The name is anchored to Deep Bay in the northern lake. Specialist accounts assign populations at Chirwa\
      \ Island, Mbowe Island, Mdoka and Mara Rocks to this species. It uses rocks and the sandy spaces between them;\
      \ sediment-free Orange Cap reefs are a different habitat account. Published depth descriptions differ, so no\
      \ single narrow band is imposed here. The natural lake envelope is 21 to 29 C, pH 7.7 to 8.6, GH 3 to 5 dGH\
      \ and KH 5 to 8 dKH. Lake water is relatively soft in calcium and magnesium but alkaline and buffered."
    sources:
    - kind: catalog-of-fishes

          value: [chironomid larvae, small benthic invertebrates, bloodworm, brine shrimp, mysis, krill, pellets]
        - by: checker-b
          value: [chironomid larvae, small crustaceans, bloodworm, brine shrimp, chopped prawn]
      decision: [small crustaceans and insect larvae sifted from sand, "frozen Mysis, brine shrimp, krill and mosquito larvae", sinking cichlid pellets and granules, flake food including a share of vegetable flake]
      rationale: The diet is decided by the vote count (unanimous, 3 of 3 on type invertivore and bloatSensitive false), which keeps the food list of the first agreeing vote. The lists describe the same animal-based diet.
    - field: features.maxSizeCm
      proposals:
        - by: generator
          value: {male: 20, female: 17}
        - by: checker-a
          value: {male: 22, female: 18}
        - by: checker-b
          value: {male: 25, female: 20}
      decision: {male: 22, female: 18}
      rationale: >-
        Most sources give about 20 cm total length, partly for wild fish and without separating the
        sexes; Seriously Fish (250 mm standard length) and Guidarium give 25 cm for males, which
        marks exceptional aquarium fish rather than the typical adult. Well-kept aquarium males
        somewhat exceed the wild size, so 22 cm for males and 18 cm for the smaller females lies
        between the two groups of sources and matches the median proposal.
    - field: features.minTank
      proposals:
        - by: generator
          value: {volumeL: 480, lengthCm: 160, depthCm: 60}
        - by: checker-a
          value: {volumeL: 450, lengthCm: 150, depthCm: 50}
        - by: checker-b
          value: {volumeL: 410, lengthCm: 150, depthCm: 55}
      decision: {volumeL: 450, lengthCm: 150, depthCm: 50}
      rationale: >-
        Seriously Fish, Guidarium and the archive keepers agree on 150 cm as the minimum length, and
        Guidarium names about 475 litres for adults. A 150 by 50 cm base with about 450 litres
        follows these sources for one male and three females; 160 cm has no source of its own.
    - field: features.lifespanYears
      proposals:
        - by: generator
          value: {min: 8, max: 12}
        - by: checker-a
          value: {min: 8, max: 12}
        - by: checker-b
          value: {min: 8, max: 10}
      decision: {min: 8, max: 10}
      rationale: >-
        Both sources that state a lifespan, Riverpark Aquatics and Fish Laboratory, give 8 to 10
        years; the extension to 12 years rests on general knowledge only. The value follows the
        sources and keeps confidence low.

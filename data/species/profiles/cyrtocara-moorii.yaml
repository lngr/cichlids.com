        to 8.6, Fishkeeper 7.5 to 8.5, LiveAquaria and Riverpark Aquatics 7.8 to 8.6, and a 2024
        study kept spawning broodstock at 7.6 to 8.3. FishBase (aquarium atlas data) and
        FishProfiles allow down to 7.2 and TropicalFreshwaterFish down to 7.0; these lower values
        read like generic aquarium ranges and are not backed by keeping reports for this species.

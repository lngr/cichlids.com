partners:
  suitable:
    - species: Fossorochromis rostratus
      reason: Its natural partner over the sand; a large, calm haplochromine whose digging the dolphin follows to feed.
      condition: Tank of at least 200 cm, as Fossorochromis grows large.
    - species: Aulonocara stuartgranti
      reason: Peaceful sand-dwelling peacock that tolerates the same water and does not bully.
    - species: Copadichromis borleyi
      reason: Calm open-water haplochromine of similar temperament; too large to become prey.
    - species: Labidochromis caeruleus
      reason: One of the few mild mbuna; adults are too large to be eaten and rarely harass larger fish.
    - species: Synodontis njassae
      reason: Lake Malawi catfish that uses the bottom and caves without competing for open space.
  unsuitable:
    - species: Maylandia zebra
      reason: Boisterous, territorial mbuna that harass the calm dolphin and rush the food; it also needs an aufwuchs-based diet.
    - species: Tropheus moorii
      reason: Aufwuchs grazer that is prone to bloat on the meaty food the dolphin needs, and is kept as a species tank.
    - species: Parachromis dovii
      reason: Large piscivorous Central American cichlid that is far too aggressive and needs different water.
    - species: Paracheirodon innesi
      reason: Small soft-water fish from acidic South American waters that needs a completely different water chemistry and is intimidated by the large dolphin.

profile:
  overview:
    text: >-
      The blue dolphin is one of the classic large cichlids of Lake Malawi and the only species of
      its genus. Adults are an even blue and carry a fatty hump on the forehead which, together
      with the pointed snout, earned the dolphin name. It is a calm, sociable fish that suits a
      large community of peaceful Malawi cichlids rather than a crowded mbuna tank. In the wild it
      lives over sand and feeds on small animals that other cichlids dig up. Keepers value it for
      its calm character and its tameness, but it needs a long tank with plenty of open sand, and
      it takes several years to reach full size and colour. The species is listed as Vulnerable on
      the IUCN Red List, so captive-bred stock is the better choice.
    sources: [*cof, *fishbase, *sf, *fk]
  habitat:
    text: >-
      The species occurs throughout Lake Malawi and lives over sandy bottoms in fairly shallow
      water, roughly between 3 and 15 metres, often near beds of Vallisneria. It swims in loose
      groups above the sand and often trails behind large digging cichlids such as Fossorochromis
      rostratus, picking up the small animals they disturb. The lake water is warm, soft and
      moderately alkaline: 21 to 29 C, pH 7.7 to 8.6, about 3 to 5 dGH and 5 to 8 dKH. Its
      chemistry varies little through the year, while temperature changes with season and depth.
      The species is not common anywhere, which matches its slow reproduction.
    sources: [*fishbase, *oliver, *sf, *fk, *branchu, *fao, *eccles]
  sizeAndGrowth:
    text: >-
      Well-kept males reach about 22 cm total length; females usually stay a few centimetres
      smaller at around 18 cm. Wild fish are recorded at about 20 cm, and some aquarium sources
      mention males of 25 cm, but such fish are exceptions. Growth is steady at first and slows
      down a lot once the fish are about 12 to 13 cm long, which is roughly the size at which they
      mature. The forehead hump appears in both sexes and grows with age, so it is no reliable sign
      of sex. Expect several years until a male shows his full size and the deep blue of an adult.
      Young fish are silvery grey with dark blotches that fade as they grow.
    sources: [*fishbase, *sf, *guidarium, *fk, *dewiki]
  husbandry:
    text: >-
      Plan a tank of at least 150 cm length, 50 cm front-to-back depth and about 450 litres for
      one male and three females; a longer tank is better. A sand bottom is essential, since the
      fish sift and occasionally bury themselves when startled. Keep the middle of the tank open
      and place stable rock piles at the ends or the back; a fully rocked tank makes these nervous
      swimmers crash into stone. Strong filtration and generous weekly water changes keep nitrate
      low. Aim for 24 to 27 C and a pH around 8, buffered with coral sand or aragonite. The fish do
      well in the soft water of the lake as long as carbonate hardness keeps the pH stable, so very
      hard water is not needed. Sturdy plants may be uprooted but are rarely eaten.
    sources: [*sf, *fk, *tfw, *guidarium, *branchu]
  socialBehavior:
    text: >-
      Blue dolphins are group fish and should not be kept alone or as a single pair. One male with
      three or more females spreads the attention of the male and keeps the group relaxed. Two
      adult males in one tank often end up in serious fights once females are present, so a
      second male only works in a very large tank. Outside spawning there is little quarrelling;
      a ripe male claims a small spot on a flat stone or a pit in the sand and displays there.
      Towards other species the dolphin is peaceful and is more often the victim than the
      aggressor. Many become very tame and take food from the hand.
    sources: [*sf, *fk, *kocher, *arch15754, *arch15033]
  diet:
    text: >-
      In nature the dolphin feeds on small invertebrates, above all midge larvae, that it gathers
      from stirred-up sand. In the aquarium it accepts almost any food, but the base should be a
      good sinking cichlid pellet plus frozen foods such as Mysis, krill, brine shrimp and mosquito
      larvae. A share of flake with vegetable content adds variety. Mammal meat such as beef heart,
      which older books recommend, is hard to digest and fouls the water, so it is better avoided.
      Feed small portions once or twice a day; the dolphin is a normal eater and gets its share
      among calm tankmates, but it loses out against hasty mbuna.
    sources: [*stauffer, *sf, *tfw, *fk, *fishbase]
  breeding:
    text: >-
      The species is a maternal mouthbrooder and not easy to breed. Raise a group of eight to ten
      young fish and let pairs form, as sexing juveniles is nearly impossible. Maturity comes at
      about 12 to 13 cm, often only after one to two years. The male cleans a flat stone or digs a
      shallow pit and courts females there; each female lays roughly 20 to 90 eggs, which she
      takes into her mouth after fertilisation. She broods for about three weeks without eating and
      then releases large fry that take brine shrimp nauplii at once. Brooding females are easily
      scared and may spit the brood early, so moving them needs care. The fry grow slowly.
    sources: [*fishbase, *sf, *fk, *tfw, *dewiki, *arch15754]
  sexing:
    text: >-
      Sexing is difficult. Both sexes develop the forehead hump and have nearly the same blue
      colour. Adult males tend to be larger, a little brighter and turn a deep, intense blue while
      courting, but these differences show only after several years and vary between fish. The
      only reliable method is venting: comparing the genital papillae of grown fish, which needs
      practice. For this reason buying a group of juveniles and letting them grow up together is
      the usual way to get both sexes, with surplus males rehomed later.
    sources: [*sf, *fk, *fp, *dewiki]
  compatibility:
    text: >-
      Good companions are other calm, large haplochromines from Lake Malawi, such as Fossorochromis
      rostratus, Copadichromis and peaceful peacocks of the genus Aulonocara, together with Lake
      Malawi Synodontis catfish. Mild mbuna like Labidochromis caeruleus work in a large tank.
      Boisterous mbuna such as Maylandia or Pseudotropheus are a poor match: they harass the
      dolphin, steal its food and need a plant-based diet. Large Lake Tanganyika frontosa are
      sometimes combined with it in very large tanks. Fry and very small fish may be eaten, and
      soft-water community fish need different water.
    sources: [*sf, *fk, *tfw, *oliver, *arch17761]
  problems:
    text: >-
      The commonest mistake is a tank that is too small or too full of rocks: the fish stay shy,
      injure themselves in panic and do not reach full size. Mixing them with hasty, aggressive
      mbuna leads to stress, torn fins and underfed dolphins. Keeping several adult males without
      enough space causes fights. Brooding females lose the brood when chased or moved carelessly,
      and a female kept apart too long may lose her rank in the group. Overfeeding and poor water
      quality can cause digestive trouble, although the species is not considered especially prone
      to bloat, and like other large cichlids it is linked with head and lateral line erosion in
      tanks with high nitrate. Watch for refusal of food, clamped fins or a swollen belly and ask a
      fish veterinarian when they appear.
    sources:
      - *sf
      - *fk
      - *arch15754
      - kind: model-knowledge
        title: General knowledge of health problems of large Lake Malawi haplochromines in aquaria


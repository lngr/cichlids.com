  predation:
    value: 1
    confidence: medium
    rationale: >-
      In the lake the species feeds on small invertebrates, mainly chironomid larvae of about 4 mm,
      which it picks from the sediment clouds that digging cichlids raise (Stauffer et al. 1996;
      Kocher and McKaye 1983); fish do not appear in its natural diet, and FishBase estimates a
      trophic level of 3.4, typical of an invertebrate feeder. In the aquarium Seriously Fish calls
      it a micro-predator whose size intimidates small fish, and LiveAquaria warns about small
      tankmates. Recommended companions such as Labidochromis caeruleus and Aulonocara are safe as
      adults. Like most Malawi haplochromines of its size it takes fry and very small fish that come
      near its mouth, which is level 1.
    sources:
      - &stauffer
        kind: literature
        title: Stauffer, J. R., Lovullo, T. J. and Han, H. Y. (1996). Commensalistic feeding relationships of three Lake Malawi fish species. Transactions of the American Fisheries Society 125(2), 224-229 (abstract).
        url: https://doi.org/10.1577/1548-8659(1996)125%3C0224:CFROTL%3E2.3.CO;2
        accessed: 2026-10-12
      - &kocher
        kind: literature
        title: Kocher, T. D. and McKaye, K. R. (1983). Defense of heterospecific cichlids by Cyrtocara moorii in Lake Malawi, Africa. Copeia 1983(2), 544-547 (abstract only, read on malawicichlids.com/_popup_abs_km83.htm).
        url: https://doi.org/10.2307/1444407
        archived: doi.org/10.2307/1444407/2026-10-14T095748Z
        accessed: 2026-10-12
      - *fishbase
      - *sf
      - *tfw
      - *fk
      - *liveaquaria

  source: &cof
    kind: catalog-of-fishes
    title: Eschmeyer's Catalog of Fishes, species list of the genus Cyrtocara (Cyrtocara moorii Boulenger 1902, current status valid)
    url: https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Cyrtocara
    archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-18c811a1/2026-10-14T095732Z
    accessed: 2026-10-12
  synonyms:
    - name: Haplochromis moorii
      note: Combination used while the Lake Malawi haplochromines were placed in Haplochromis; listed by FishBase and German Wikipedia, no separate nominal species in the Catalog of Fishes.
    - name: Haplochromis moori
      note: Misspelling of the Haplochromis combination, listed by FishBase.
    - name: Cyrtocara moorei
      note: Misspelling listed by FishBase.
    - name: Cyrtocara moori
      note: Misspelling listed by FishBase and common in the trade.
  legacyNames:
    - Cyrtocara moorii
  note: >-
    The Catalog of Fishes (online version of 21 Sep 2026) lists Cyrtocara moorii Boulenger 1902 as
    valid and as the only species of the genus; the holotype BMNH 1906.9.7.26 comes from Lake
    Malawi. Boulenger described it in Cyrtocara, so the author stands without parentheses. The
    catalog holds no other nominal species for moorii; the synonyms listed here are the
    combinations and misspellings of the FishBase synonym list. The Cichlid Room Companion treats
    the name as valid as well.


  ghDgh:
    value: {min: 3, max: 5}
    confidence: high
    rationale: >-
      Lake Malawi endemic; the calcium and magnesium of the lake correspond to 3.2 to 4.9 dGH in the
      1960s titrations (Jackson et al. 1963, Talling and Talling 1965) and 4.2 to 4.6 dGH in the
      upper 50 m of the north basin (Branchu et al. 2010). Care sheets that call the lake water
      hard confuse hardness with alkalinity.
    sources: *lakesources
    evidence:
      - source: *fao
        value: {min: 3.2, max: 4.9}
        note: calculated from lake calcium and magnesium
      - source: *branchu
        value: {min: 4.2, max: 4.6}
        note: north basin, upper 50 m
    verification:
      method: waterbody
      waterbody: lake-malawi
    tolerance:
      value: {min: 3, max: 18}
      confidence: low
      rationale: >-
        Husbandry sources name only hard water: FishBase (aquarium atlas data), TropicalFreshwaterFish
        and FishProfiles 10 to 18 dGH, Seriously Fish and Guidarium 10 to 25 without saying whether
        total or carbonate hardness is meant. The upper bound follows the more common 18. No care
        sheet covers the soft lake water of 3 to 5 dGH, so the lower bound rests on the lake
        measurements, where the species lives naturally; soft water is no problem as long as the
        carbonate hardness keeps the pH stable. Long-term reports for either end are missing, so
        the evidence is thin.
      sources:
        - *sf
        - *fishbase
        - *tfw
        - *fp
        - *fk
        - *guidarium
        - *branchu
        - *fao
      evidence:

    value:
      continent: Africa
      region: Lake Malawi
      waterbody: Lake Malawi
    confidence: high
    rationale: >-
      The Catalog of Fishes and FishBase give Lake Malawi as the only range, and FishBase calls the
      species endemic and widespread in the lake. Oliver describes it from shallow sandy shores
      around the whole lake, often near Vallisneria beds, though nowhere common; photographed
      fish come from Chembe at Cape Maclear among other sites. The Cichlid Room Companion
      confirms a lake species of sandy habitats.

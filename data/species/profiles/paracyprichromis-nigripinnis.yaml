      confidence: low
      rationale: "Generator, checker-a, checker-b and checker-c all propose 23 to 29
        C, producing unanimous agreement of 4/4 and low confidence. Most care
        recommendations are narrower: Seriously Fish and Jakobsen give 24 to 27
        C, Akvaforum and Aqua-Fish give 23 to 25 C, and the Nordic register
        gives 24 to 27.5 C. The upper limit is widened to 29 C to contain the
        natural envelope, rather than established by years of aquarium
        observations. About 24 to 26 C has stronger support for routine
        keeping."

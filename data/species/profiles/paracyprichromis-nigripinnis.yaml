  husbandry:
    text: "Start with a tank of at least 300 litres, about 125 cm long and 50 cm
      front to back, with at least 45 cm height. Build stable vertical rock
      faces and several shaded overhangs, leaving open water beside and above
      them. A subdued light level helps fish use the whole layout. Maintain
      effective biological filtration and regular water changes matched to the
      aquarium's chemistry. A routine temperature around 24 to 26 C is supported
      more consistently than the wider tolerance envelope. Measure GH and KH
      separately. Avoid abrupt adjustments made merely to reach a displayed
      number, and check that newly introduced fish can retreat and feed without
      being crowded away."
    sources:
      - kind: literature
        title: "AcquaPortal (2009): Riproduzione di Paracyprichromis nigripinnis,

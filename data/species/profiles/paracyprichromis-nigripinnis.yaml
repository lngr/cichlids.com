partners:
  suitable:
    - species: Neolamprologus brevis
      reason: Uses a separate shell area and was present in a published mixed-species
        blue neon breeding aquarium.
      condition: Provide a separated shell bed and enough additional space for the
        shell-dweller social unit; fry survival is not guaranteed.
    - species: Neolamprologus caudopunctatus
      reason: A published breeding account reports coexistence when its shelter use
        remained separate from the blue neon rock face.
      condition: Separate spawning sites and monitor territorial changes; increase the
        tank size for both adult groups.
    - species: Julidochromis transcriptus
      reason: A small rock-associated neighbour fits the recommended Julidochromis
        option when it does not monopolize the overhangs.
      condition: Keep an established compatible pair with its own rock section in a
        larger tank; remove persistent aggressors.
    - species: Xenotilapia flavipinnis
      reason: A conditional example of the quiet sand-dwelling cichlids recommended by
        the Nordic register and Jakobsen.
      condition: Provide the partner species own social unit and ample separate sand
        space; the 300 L blue neon minimum alone is not approval for combined
        stocking.
  unsuitable:
    - species: Melanochromis auratus
      reason: A forceful mbuna is liable to intimidate this retiring shoal and
        outcompete it for food.
    - species: Cyprichromis leptosoma
      reason: "Specialist accounts report suppression by more active Cyprichromis and
        Seriously Fish discourages this genus. Other care sources allow some
        Cyprichromis, so this is a cautious routine-stocking judgement rather
        than universal failure."
    - species: Cyphotilapia frontosa
      reason: "Large adults can swallow slender blue neons, so matching lake origin
        does not make this pairing safe."
    - species: Paracyprichromis brieni
      reason: The decided pairwise group gives a low-confidence presumed hybrid
        caution from close relationship. No verified cross of these named
        species or access to conspecific mates was established.
profile:
  overview:
    text: "A group of blue neon cichlids brings subtle movement and colour to a
      quiet Tanganyikan aquarium. Paracyprichromis nigripinnis spends much of
      its time beside rock faces and sheltered cavities, where males display
      blue lines across a bronze or reddish body. The setting matters as much as
      the fish: exposed lighting and lively neighbours can make a healthy group
      appear washed out and withdrawn. Keep ten or more together, with females
      outnumbering males. This species rewards careful observation and a planned
      layout. Paracyprichromis brieni is a separate valid species, with smaller
      eyes and a more slender outline, so check identification before buying a
      breeding group."
    sources:
      - kind: catalog-of-fishes
        title: "Eschmeyer's Catalog of Fishes: species of Paracyprichromis, version
          updated 21 September 2026"
        url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishc\

      localities:
        - Msambu
        - Chituta Bay
        - Kitumba
        - Kambwimba
    confidence: high
    rationale: "All four runs agree on Lake Tanganyika endemism. Generator lists
      Msambu, Chituta Bay, Kitumba and Kambwimba; checker-a lists Msambu and
      Chituta Bay; checker-b gives no named localities; checker-c adds Kigoma to
      Msambu and Chituta Bay. Retain the generator localities as a
      non-exhaustive list: Msambu is the catalog type locality, while the Nordic
      register and AquaInfo corroborate the other populations. Kigoma is not
      established by the cited AquaInfo locality list. A northern-only
      interpretation is outweighed by documented southern Chituta fish. CRC
      independently confirms the name, lake-rock setting and mouthbrooding, but
      public feeding details are unavailable."

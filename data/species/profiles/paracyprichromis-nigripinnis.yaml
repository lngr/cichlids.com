  maxSizeCm:
    value:
      male: 11
      female: 9
    confidence: medium
    rationale: "Generator, checker-a and checker-b propose males 11 cm and females 9
      cm; checker-c proposes 12 and 8 cm from AquaInfo. Retain 11 and 9 cm as
      practical typical aquarium maxima, supported by the unsexed 10 to 11 cm
      care records and Jakobsen female range of 7 to 9 cm. Jakobsen gives males
      9 to 12 cm, and AcquaPortal mentions exceptional unsexed fish of 13 to 14
      cm while describing most below 10 cm. These wider source sizes are not the
      routine planning value. Seriously Fish reports 11 cm standard length and
      FishBase 11 cm total length; these conventions must not be averaged. The
      precise female maximum remains uncertain, so confidence is medium."
    sources:

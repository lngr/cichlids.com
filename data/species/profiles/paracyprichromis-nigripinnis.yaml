      Females often hover outside cave openings; males use the protected rock
      surfaces. FishBase records plankton feeding over rocky substrate, and the
      Nordic register gives a rock-associated depth range of 10 to 40 m. Sand is
      useful as aquarium substrate but is not the defining habitat zone."

  compatibility:
    text: "Quiet shell-dwellers or restrained rock and sand cichlids can be
      conditional neighbours in a tank large enough for every social unit.
      Published experience supports Neolamprologus brevis and N. caudopunctatus;
      Julidochromis transcriptus and Xenotilapia flavipinnis are examples
      inferred from broader specialist recommendations. Adults of this species
      generally ignore suitable neighbours, while forceful competitors can
      suppress feeding and display. The sources disagree about Cyprichromis, so
      it is not a routine recommended pairing. Large Cyphotilapia add a
      predation risk. Paracyprichromis brieni is a separate species with a
      low-confidence presumed crossing caution. The named cross has not been
      verified, and suspected tembwe ancestry does not identify its parents.
      Different nigripinnis locality and colour lines can mix within the
      species."
    sources:
      - kind: literature
        title: "AcquaPortal (2009): Riproduzione di Paracyprichromis nigripinnis,

  diet:
    text: "Offer small foods that remain available in the water column long enough
      for every fish to take them. Animal plankton is the natural food, so
      Cyclops, Artemia and Daphnia are useful aquarium choices alongside a
      suitably small complete prepared food. Rotate foods and keep portions
      modest. The species is treated as an invertivore, without evidence for a
      special requirement to avoid protein as an algae-grazing cichlid would.
      Its practical weakness is competition: active neighbours may leave little
      food for a shy individual even when the tank appears well fed. Check each
      fish's belly and feeding response, and remove uneaten food rather than
      compensating with oversized meals."

    kind: locality
    note: Zambian population documented by the Nordic species register and Seriously
      Fish. Keep its breeding stock separate from other locality lines.
  - name: Kitumba
    kind: locality
    note: Congolese locality recorded by the Nordic species register; no distinct
      compatibility values established.
  - name: Kambwimba
    kind: locality
    note: Tanzanian locality recorded by the Nordic species register; differences
      among populations may be subtle.
  - name: Albino
    kind: color-morph
    note: "Captive colour form documented by the Nordic register and Seriously Fish,
      not a separate species or a hybrid designation."

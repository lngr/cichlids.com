      decision: 1
      rationale: "Generator proposes level 2; checker-a, checker-b and checker-c
        propose level 1. Choose level 1 for the recommended ten-adult group in
        sufficient space. The Nordic register describes male rivalry and
        separate sites, but Jakobsen and AcquaPortal describe relatively
        peaceful multiple-male colonies with limited breeding aggression. The
        evidence supports displays and short chases more clearly than a stable
        hierarchy with regular chasing. The archive report involves only two
        alleged males and does not identify the cause of fin damage, so it does
        not establish level 2 in the recommended social unit."

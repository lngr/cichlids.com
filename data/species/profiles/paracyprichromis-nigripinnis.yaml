  socialBehavior:
    text: "Keep at least ten adults with females outnumbering males and several
      separate male shelter sites. The colony is a loose group, although each
      mature male uses a local rock territory for courtship. Expect displays and
      brief chases in a suitable layout. Persistent pursuit or damaged fins
      calls for checking space, sex balance and shelter. A pair of males alone
      is less representative of the recommended arrangement. Male site
      occupation is treated as continuing because a restricted breeding season
      or abandonment between broods has not been established."

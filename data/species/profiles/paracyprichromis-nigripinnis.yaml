  sizeAndGrowth:
    text: "Plan around 11 cm for larger typical males and 9 cm for females.
      Sex-specific aquarium records vary, including 12 cm males and 8 cm females
      in AquaInfo. Standard length excludes the tail, while total length
      includes it, so published maxima are not interchangeable. Larger
      exceptional fish are not used as the normal planning size. Growth is not
      tied to a reliable age schedule. A five-to-eight-year aquarium lifespan is
      a care estimate supported chiefly by Aqua-Fish, without an age-validated
      survival study."
    sources:

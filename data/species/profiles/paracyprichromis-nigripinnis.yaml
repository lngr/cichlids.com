  hybridGroups:
    value:
      - paracyprichromis-nigripinnis-brieni
    confidence: low
    rationale: "Generator, checker-c, tiebreaker-1 and tiebreaker-2 propose
      paracyprichromis-nigripinnis-brieni; checker-a and checker-b propose an
      empty list. The tally fixes this pairwise group by qualified majority,
      4/6, with low confidence. Catalog taxonomy, Takahashi morphological
      monophyly and the Brandstatter phylogeny abstract support close
      relationship under the rubric presumed basis. No verified cross between
      the named species was found. Behrens and colleagues suspect hybrid
      ancestry in Paracyprichromis sp. tembwe without identifying its parents;
      it cannot document this pair. Seriously Fish discusses crossing among
      nigripinnis colour forms, not a brieni cross. The 2005 paper was available
      only as an abstract; no paywall was bypassed."

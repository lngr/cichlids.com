  temperatureC:
    value:
      min: 23
      max: 29
    confidence: high
    rationale: "The waterbody decision fixes the natural Lake Tanganyika envelope at
      23 to 29 C with high confidence. Verburg and colleagues report southern
      buoy extremes of 23.85 to 29.01 C, while Plisnier and colleagues describe
      seasonal southern upwelling and surface means of 24.4 to 27.2 C. The
      envelope represents lake variation rather than a preferred aquarium
      setting; report-specific extremes are inherited from the generator
      evidence."

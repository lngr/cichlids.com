      harem with three females per male; checker-b and checker-c propose a group
      of at least eight. Choose the group structure because FishBase describes
      schools and several care sources recommend loose mixed-sex colonies. The
      harem proposal describes mating access rather than the complete social
      unit. Ten follows the Nordic minimum and gives a cautious planning floor
      above the eight-fish Seriously Fish recommendation and six-fish Jakobsen
      and Aqua-Fish floors. More females than males and distinct male sites are
      important; three females per male is useful guidance rather than a fixed
      species-wide ratio.

  ph:
    value:
      min: 8.4
      max: 9.4
    confidence: high
    rationale: "The waterbody decision fixes the natural range at pH 8.4 to 9.4 with
      high confidence. The Plisnier lake programme supports alkaline surface
      water and an annual northern 40 m range of 8.47 to 9.40. These lake
      measurements are retained from the input evidence and supported by the
      published annual-cycle study. The older FAO compilation reports a
      conflicting pH 7.3 to 7.8, excluded by the lake decision because it
      conflicts with the modern measurements and high alkalinity."
    sources:
      - kind: literature
        title: "Plisnier, P.-D., Langenberg, V., Mwape, L., Chitamwembwa, D., Tshibangu,
          K. and Coenen, E. (1996). Limnological sampling during an annual cycle
          at three stations on Lake Tanganyika (1993-1994). FAO/FINNIDA Research
          for the Management of the Fisheries on Lake Tanganyika,

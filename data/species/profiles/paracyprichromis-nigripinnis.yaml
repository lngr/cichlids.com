  problems:
    text: "Persistent hiding, lost colour and poor body condition often begin with
      the layout or tankmates. Check shelter, light level and access to
      appropriately sized food before assuming that a colour change identifies a
      disease. Maintain clean, stable water and observe newly acquired fish
      separately before adding them to the group. Injuries from pursuit can
      become sites of secondary infection; spreading skin changes, difficult
      breathing or continuing refusal of food warrant specialist assessment.
      These signs do not establish a particular diagnosis or medication. High pH
      makes accumulated ammonia especially concerning, so investigate filtration
      and waste promptly. The 29 C tolerance endpoint is uncertain in long-term
      aquarium keeping. Do not use it as a normal heater setting."
    sources:
      - kind: database
        title: "Seriously Fish: Paracyprichromis nigripinnis"

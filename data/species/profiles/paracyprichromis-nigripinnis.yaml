    tolerance:
      value:
        min: 13
        max: 20
      confidence: low
      rationale: "Generator, tiebreaker-1 and tiebreaker-2 propose 13 to 20 dKH;
        checker-b and checker-c propose 15 to 20 dKH; checker-a proposes 10 to
        20 dKH. Five proposals agree within the two-degree tally threshold, and
        their median lower bound is 13. The qualified-majority decision is
        therefore 13 to 20 dKH, 5/6, with low confidence. Fischlexikon and DRTA
        recommend 15 to 20 dKH. AcquaPortal reports adult spawning and fry
        growth at KH 13 over months, not years. The wider AquariumDomain range
        is 15 to 25 dKH, while generated Aqua-Pedia data give 10 to 20 dKH;
        neither extra endpoint is sufficiently supported to adopt. The single
        archive reading of KH 12 is also weak. Natural lake KH is fully
        contained, and GH or conductivity is not substituted for KH."

  habitat:
    text: "Endemic to Lake Tanganyika, this cichlid feeds on drifting animal
      plankton beside rocky slopes and sheltered cavities. The Nordic register
      places it at roughly 10 to 40 m depth, with males close to cave surfaces
      and females often near the openings. The lake studies underpin a natural
      envelope of 23 to 29 C, pH 8.4 to 9.4, 10 to 13 dGH and 15 to 20 dKH.
      These are lake-wide conditions across places and seasons. GH and KH
      describe different properties and need separate measurements."
    sources:
      - kind: literature
        title: "Plisnier, P.-D., Langenberg, V., Mwape, L., Chitamwembwa, D., Tshibangu,
          K. and Coenen, E. (1996). Limnological sampling during an annual cycle
          at three stations on Lake Tanganyika (1993-1994). FAO/FINNIDA Research
          for the Management of the Fisheries on Lake Tanganyika,
          GCP/RAF/271/FIN-TD/46."

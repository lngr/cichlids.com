  sexing:
    text: "Adult males usually show the clearest blue body markings and longer tail
      extensions. Females are generally smaller and less intensely patterned,
      although light, stress and maturity can alter how conspicuous these
      differences are. Compare several settled adults under the same conditions
      rather than judging a newly transported fish by colour alone. Juveniles
      and albino stock are harder to assess. Identification also matters: P.
      nigripinnis has larger eyes and a fuller outline than P. brieni, but an
      uncertain shop label should not be treated as a confirmed breeding
      identity. Ask for locality and breeding history when buying fish intended
      to maintain a named population."
    sources:

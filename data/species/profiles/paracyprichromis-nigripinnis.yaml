  khDkh:
    value:
      min: 15
      max: 20
    confidence: high
    rationale: "The natural carbonate-hardness range remains 15 to 20 dKH at high
      confidence. Programme alkalinity titrations, northern-basin measurements
      reported by Cohen and colleagues, and the 6.7 to 6.9 meq/L alkalinity
      cited in Langenberg support this strongly buffered lake envelope. The last
      interval converts to 18.8 to 19.3 dKH. The report measurements are
      retained from input evidence. Natural KH carries no verification object."

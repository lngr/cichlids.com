  ghDgh:
    value:
      min: 10
      max: 13
    confidence: high
    rationale: "The waterbody decision fixes natural total hardness at 10 to 13 dGH
      with high confidence. The Plisnier programme calcium and magnesium means
      yield 11.1 to 11.5 dGH, and Cohen and colleagues yield about 12.2 dGH in
      the northern basin. These converted measurements are inherited from
      lake-study evidence. Total hardness measures calcium and magnesium and is
      distinct from carbonate alkalinity; the larger KH range must not replace
      GH."

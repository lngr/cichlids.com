  breeding:
    text: "Females incubate a small clutch in the mouth after spawning near a male's
      rock surface. Eggs are released individually and gathered by the female;
      the spawning posture follows the orientation of the chosen wall or
      shelter. Broods commonly develop for roughly three to four weeks before
      the young emerge. Provide calm retreats and avoid unnecessary disturbance
      of a carrying female. Reports differ about feeding during incubation: one
      observed females taking tiny live Artemia even while ignoring larger
      foods, so complete fasting is not universal. Released young accept newly
      hatched Artemia and other fine foods. A community may lose fry to
      neighbours, so a separate nursery improves survival when raising young is
      the priority."
    sources:
      - kind: literature
        title: "AcquaPortal (2009): Riproduzione di Paracyprichromis nigripinnis,

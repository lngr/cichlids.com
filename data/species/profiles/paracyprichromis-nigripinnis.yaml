  legacyNames:
    - Paracyprichromis nigripinnis
  note: "The Catalog of Fishes recognizes Paracyprichromis nigripinnis and P.
    brieni as separate valid species. The original name is Paratilapia
    nigripinnis; Cyprichromis and Limnochromis are historical combinations, not
    different species. Seriously Fish distinguishes nigripinnis by its larger
    eyes and deeper body. CRC public data confirm taxonomy, lake-rock habitat
    and mouthbrooding but provide no detailed feeding evidence. The presumed
    hybrid group expresses relationship-based uncertainty, not synonymy or a
    verified cross."

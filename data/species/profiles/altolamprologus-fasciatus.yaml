  habitat:
    text: 'The species occurs around Lake Tanganyika, including rocky shores and neighbouring sandy areas.
      Specialist accounts place it mainly at depths of about 2 to 15 m. It also travels across shallow
      stretches between rocky patches. Cavities provide cover and spawning sites; empty gastropod shells
      can serve as breeding shelters. An aquarium needs rock crevices, a sandy floor and suitable secluded
      cavities rather than an unobstructed pelagic layout.'
    sources:
      - kind: database
        title: 'Lake Tanganyika cichlids, Altolamprologus fasciatus'
        url: 'https://www.tanganyika.si/Tanganjika/Neolamprologus/Neolamprologus%20fasciatus/slides/Neolamprologus%20fasciatus.html'
        archived: tanganyika.si/tanganjika/neolamprologus/neolamprologus_fasciatus/slides/neolamprologus_fasciatus.html/2026-10-15T110747Z
        accessed: '2026-10-15'

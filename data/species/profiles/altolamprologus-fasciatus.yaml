  breeding:
    text: 'Spawning takes place inside a sheltered cavity, either a rock crevice or a suitable empty shell.
      The smaller female can enter an opening that excludes the male. Fertilization occurs as the male
      releases sperm near the entrance, and the female remains with the eggs and larvae. Accounts describe
      a short period of male patrol nearby and fry swimming freely after roughly ten days. Shell use is
      facultative, so the profile classifies the broader behaviour as cave spawning. Reports differ on
      aquarium breeding success and do not support a guarantee that a newly formed pair breeds readily.'
    sources:

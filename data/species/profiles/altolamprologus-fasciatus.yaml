  husbandry:
    text: 'A pair needs about 200 litres, at least 100 cm of tank length and a practical depth of 40 cm.
      Larger communities need more room. Secure the rockwork and provide several narrow retreats that
      break lines of sight. Keep the water well oxygenated and consistently alkaline, with regular maintenance
      and replacement water matched to the aquarium. The decided long-term allowances are 23 to 29 C,
      pH 7.5 to 9.4, GH 8 to 25 dGH and KH 10 to 21 dKH. These allowances are not experimentally established
      failure thresholds, and the KH interval is especially uncertain. Species care accounts commonly
      target the middle twenties Celsius rather than the warmest lake extreme.'

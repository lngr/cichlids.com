  compatibility:
    text: 'Choose calm adult Tanganyika cichlids that cannot fit into the predator''s mouth and can use
      separate shelters or swimming areas. A. calvus and A. compressiceps share its natural habitat, but
      coexistence in the lake does not guarantee compatibility in a small aquarium. Very active or aggressive
      companions can interfere with feeding. Small shell dwellers, fry and ornamental shrimp are vulnerable.
      The profile also flags a presumed crossing risk with Neolamprologus brevis and a documented historical
      wild introgression link with N. callipterus; neither establishes an aquarium crossing rate.'

    tolerance:
      value:
        min: 10
        max: 21
      confidence: low
      rationale: 'The tally decides 10 to 21 dKH by qualified majority, four of six compatible range votes,
        with low confidence. The generator and checker-b propose 10 to 25, checker-a 8 to 22, checker-c
        12 to 20, tiebreaker-1 10 to 20 and tiebreaker-2 10 to 22 dKH. The result uses the rounded endpoint
        medians of the agreeing proposals and contains natural 15 to 20 dKH. Abysse gives a species-specific
        target of 10 dKH, JBL a Tanganyika mineral target near 17.6, Tanganyika.si a wider acceptable
        aquarium range of 11 to 22, AquaInfo 10 to 15, aquarium.tools 12 to 18 and Sera a general Malawi/Tanganyika
        target of 8 to 10 dKH. None establishes measured long-term species limits. The wider Tanganyika.si
        upper endpoint of 22 and the proposed upper endpoint of 25 are retained in evidence or proposals
        but do not override the decided 21. Seriously Fish states GH of 8 to 25 and supplies no KH range;
        GH is not converted into KH. The JBL product-page snapshots contain notification text without
        useful KH data. This is an inferred husbandry allowance rather than a claim that every value outside
        it causes harm.'

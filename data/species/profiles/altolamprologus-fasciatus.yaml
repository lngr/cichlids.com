  socialBehavior:
    text: 'A pair is the recommended minimum aquarium unit, but the association can be loose. Field studies
      also describe a territorial male associated with several females, so a pair should not be understood
      as an exclusive lifelong bond. Males can chase conspecifics persistently. Local shelter defence
      becomes stronger near spawning, and some territorial behaviour also occurs outside active brood
      care. Provide escape routes for a subordinate fish and avoid adding another male to a pair-sized
      aquarium.'
    sources:
      - kind: database
        title: 'Lake Tanganyika cichlids, Altolamprologus fasciatus'

    tolerance:
      value:
        min: 23
        max: 29
      confidence: low
      rationale: 'The tally decides 23 to 29 C by unanimous range agreement, with low confidence. The
        generator proposes 22 to 30 C, checker-a 22 to 29 C, and checker-b and checker-c 23 to 29 C. Seriously
        Fish recommends 23 to 27 C, Guidarium and the Nordic register 24 to 27 C, and Fishipedia 24 to
        28 C. The decided range includes those species-specific recommendations and the natural lake range.
        The wider general Tanganyika advice of 22 to 25 C in AquaInfo is retained as group-level evidence;
        it does not demonstrate species-specific health at 22 C. The unsupported outer margins of the
        wider proposals are excluded. Equality with the natural range reflects these recommendations and
        mandatory containment, not a demonstrated failure immediately beyond either endpoint.'

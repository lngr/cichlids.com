          value:
            size: small
            breedingOnly: true
      decision:
        size: small
        breedingOnly: false
      rationale: The generator and checker-c propose a small territory only during breeding; checker-a
        and checker-b propose a small territory without that restriction. Field papers describe territorial
        males associated with female spawning sites and Seriously Fish calls the species territorial without
        limiting it to active spawning. Tanganyika.si places the strongest territorial behaviour around
        breeding. Retain a local territory with breedingOnly false because stronger breeding defence does
        not demonstrate the complete absence of territoriality at other times. Its exact area is an inference;
        no source measures a fraction of the aquarium.

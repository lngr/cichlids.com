  problems:
    text: 'Watch for declining body condition when food is offered only in the open or is taken first
      by more vigorous fish. A reluctant feeder may need familiar frozen or live foods near cover. Conspecific
      chasing becomes more dangerous when retreats are blocked or rivals cannot leave each other''s sight.
      Small fish can disappear through predation even when the species appears calm around larger adults.
      Stable water quality, suitable stocking and observation of each fish are central to avoiding these
      problems.'

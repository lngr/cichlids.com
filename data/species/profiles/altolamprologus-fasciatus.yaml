  diet:
    text: 'Offer a varied animal diet with suitable frozen or live crustaceans and other small aquatic
      prey. Some accounts report acceptance of pellets or shrimp mixtures, while others describe poor
      acceptance of dried food; check actual intake. A small FishBase field sample is dominated by shrimp,
      whereas other summaries emphasize fish hunting. The profile therefore classifies the species as
      an invertivore with regular predation on small fish. This distinction does not make small tankmates
      or ornamental shrimp safe.'

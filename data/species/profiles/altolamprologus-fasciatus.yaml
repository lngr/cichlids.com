  sexing:
    text: 'Mature males are generally larger than females. That size difference is useful when comparing
      adults of similar age, but it cannot reliably identify the sex of unrelated juveniles. Sources disagree
      on the magnitude of adult size dimorphism and give no dependable simple colour marker for every
      fish. Use breeder information or observed spawning behaviour to confirm sex rather than assigning
      it from size alone.'

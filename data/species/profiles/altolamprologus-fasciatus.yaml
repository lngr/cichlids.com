      rationale: 'Retain the exact conservative tally decision and low confidence, with its recorded three
        of six agreeing votes. The generator and checker-a propose only altolamprologus-fasciatus-neolamprologus-brevis.
        Checker-b and both tie-breakers add altolamprologus-fasciatus-neolamprologus-callipterus; checker-c
        adds the same pair under altolamprologus-fasciatus-lamprologus-callipterus. Neolamprologus callipterus
        is the valid name, so the latter spelling is an alias of the decided pair and is not a third group.
        The conservative union retains both repeatedly proposed risks without changing the tally verification.
        Koblmuller et al. identify two wild hybrids with fasciatus paternal ancestry but unresolved brevis/calliurus
        mothers; the listed brevis pair remains presumed. Nevado et al. infer ancient natural introgression
        from callipterus into fasciatus, which qualifies the added named pair as documented under the
        rubric. Tiebreaker-1 proposes a presumed basis because no contemporary cross is shown, whereas
        checker-c and tiebreaker-2 propose documented; the rubric includes wild genetic evidence and does
        not require a recent spawning observation. The 2010 discussion reverses the reported direction
        of mitochondrial replacement; the dedicated 2009 analysis determines that direction. No source
        measures aquarium crossing frequency for this pair, and neither generic Altolamprologus warnings
        nor shared genus placement extend the separate calvus/compressiceps group to fasciatus.'

  sizeAndGrowth:
    text: 'Use about 15 cm total length for an adult male and 9 cm for a female when planning space and
      tankmates. These are typical upper aquarium expectations supported by specialist care accounts.
      Reported length conventions differ: FishBase gives total length, whereas Seriously Fish labels its
      maximum as standard length. A reliable growth curve is unavailable. The estimated lifespan of 8
      to 11 years is uncertain; published hobby claims range from five to fifteen years without traceable
      age records.'

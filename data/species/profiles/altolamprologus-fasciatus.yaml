partners:
  suitable:
    - species: Altolamprologus compressiceps
      reason: Comparable adults share the rocky habitat in the lake.
      condition: Use a larger community aquarium with separate sheltered areas; check individual territorial
        behaviour.
    - species: Altolamprologus calvus
      reason: Occurs alongside fasciatus in natural rocky habitat.
      condition: Use a larger aquarium with distinct retreats and adults too large to swallow.
    - species: Cyprichromis leptosoma
      reason: Full-grown fish can use swimming space above the rock territories.
      condition: Use a larger long aquarium and mature individuals; this is a husbandry inference and
        juveniles are vulnerable.
  unsuitable:
    - species: Neolamprologus brevis
      reason: The profile flags a presumed crossing link with unresolved brevis/calliurus parentage; small
        individuals and fry also face predation.
    - species: Neolamprologus callipterus
      reason: Genetic studies infer historical wild introgression with fasciatus; the pair is flagged
        as a documented hybrid group without a known aquarium crossing rate.
    - species: Neolamprologus multifasciatus
      reason: Small adults and fry can be prey and occupy shells within the predator's feeding habitat.
    - species: Xenotilapia flavipinnis
      reason: Timid sand-dwelling fish may lose access to food or be displaced; this is a cautious stocking
        inference rather than a documented failed pairing.
profile:
  overview:
    text: 'Altolamprologus fasciatus is a barred predator from Lake Tanganyika. A slender compressed body
      lets it search rocky cover for prey. Shrimp and other invertebrates form an important part of its
      food, and juvenile cichlids are also at risk. Many aquarium references use the earlier name Neolamprologus
      fasciatus. It can live in a carefully planned Tanganyika community with companions that are too
      large to swallow.'
    sources:
      - kind: catalog-of-fishes
        title: 'Eschmeyer''s Catalog of Fishes, species of the genus Altolamprologus'
        url: 'https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Altolamprologus'
        archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-5396359b/2026-10-14T094042Z

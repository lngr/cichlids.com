  compatibility:
    text: "Quiet adult tetras, pencilfish and hatchetfish are practical companion groups when their water requirements\
      \ and space needs match. Adult black neon tetras, Beckford pencilfish and marbled hatchetfish illustrate\
      \ these choices; they are examples rather than independently tested pairings for every stock. Tiny fish\
      \ and fry can be eaten opportunistically, so chilli rasboras are a poor choice. Large or forceful cichlids\
      \ can intimidate or consume the acara. Peaceful bottom dwellers may still receive local chases near a\
      \ brood, and some catfish take eggs after dark. The decided curviceps/dorsigera hybrid group is presumed:\
      \ hobby sources warn about mixing them or suggest possible crosses in farm stock, but no verified brood\
      \ with known mate-choice circumstances was established."
    sources:
    - kind: literature

    confidence: low
    rationale: "Retain the tally range of 0 to 1 dKH and low confidence, without a natural verification object.\
      \ Generator, checker-a and checker-b proposed 0 to 1; checker-c proposed 0 to 0.5. These fall within\
      \ the tally agreement threshold and the rounded representative range remains 0 to 1. Regional alkalinity\
      \ reported as 2.07 and 8.80 mg/L HCO3 corresponds to about 0.095 and 0.404 dKH after division by 21.8.\
      \ These are lower Tapajos stream and river means, not fish-site titrations. The FAO table heading permits\
      \ different interpretations of its 3.1 to 5.2 mg/L value, giving an estimated 0.14 to 0.33 dKH envelope.\
      \ The conference study reports an alkalinity method but its numeric table is unavailable in the readable\
      \ text. Neither low conductivity nor acidic pH alone determines KH. The evidence supports a provisional\
      \ region-based estimate."

  predation:
    value: 1
    confidence: medium
    rationale: All four proposals are level 1 and the tally is unanimous with medium confidence. Practical
      Fishkeeping warns of tiny-fish losses and treats companions around 2 cm or larger as generally safe;
      TFH and Maidenhead also require companions too large to swallow. This matches occasional fry or tiny-fish
      predation. The retained level-0 interpretations of insectivory and seven invertebrate-dominated gut samples
      do not prove that fish are never eaten. No evidence supports habitual piscivory.

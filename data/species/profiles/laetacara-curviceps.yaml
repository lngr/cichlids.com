  ph:
    value:
      min: 4.3
      max: 6.8
    confidence: low
    rationale: "Adjudicated pH 4.3 to 6.8 replaces the qualified-majority point range of 5.2 to 5.2 because one\
      \ Santarem reading cannot describe variable clearwater habitats. The species-linked 5.2 observation is\
      \ combined with pH 4.3 to 5.2 over ten months in a slow-flowing clearwater stream tributary of Lago\
      \ Verde and the Arapiuns clearwater measurements of 5.05 to 6.79. The upper bound rounds 6.79 to one\
      \ decimal. These regional waters lie near the lower Amazon habitat area and match its low-mineral\
      \ clearwater type; neither comparison establishes curviceps presence at each station. Confidence is\
      \ low because the interval combines a species-linked point with regional measurements. The tolerance\
      \ extends to pH 4.3 to contain this natural interval."

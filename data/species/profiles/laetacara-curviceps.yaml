      - Arapiuns
      - Trombetas
      - lower Tocantins
      - Utinga lake near Belem
    confidence: high
    rationale: "The Catalog and specimen-based revisions establish the lower Brazilian Amazon. The 2009 redescription\
      \ documents Parananema and Maximo lakes near Parintins and Paunis near Obidos; later work documents Utinga\
      \ near Belem. The ICMBio assessment also names the Arapiuns, Trombetas and lower Tocantins. All four\
      \ proposals describe the same regional origin but differ in locality coverage; the final list combines\
      \ verified locality records and the conservation assessment. Reports from Amapa are not adopted without\
      \ resolving possible confusion with Laetacara flamannellus. The AquaInfo response is only a map caption\
      \ and contributes no species locality. No curated lake-water range applies."

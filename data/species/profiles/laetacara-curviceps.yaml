  ghDgh:
    value:
      min: 0
      max: 1
    confidence: low
    rationale: "Retain the unanimous tally range of 0 to 1 dGH, with low confidence because no GH assay was\
      \ paired with a confirmed fish collection. All four proposals are 0 to 1. Regional lower Tapajos stream\
      \ means of Ca below 0.02 mg/L and Mg 0.06 mg/L imply about 0.014 to 0.017 dGH; river means of Ca 0.52\
      \ and Mg 0.26 mg/L imply 0.133 dGH, using Ca/7.14 + Mg/4.34. The FAO compilation independently gives\
      \ 0.31 to 0.82 dGH for Tapajos clearwater. This supports a rounded regional estimate rather than a measured\
      \ species-wide range. The 10 uS/cm Santarem conductivity supports dilute water qualitatively and cannot\
      \ determine GH by itself. A retained 0 to 2 dGH interpretation of a broader clearwater conductivity range\
      \ is only an inference. FishBase 5 to 12 dH traces to aquarium advice and is not adopted as natural hardness."

  diet:
    text: "Natural feeding is best classified as invertivory. The 2018 revision found mostly aquatic insects\
      \ and larvae in seven examined specimens, and CRC independently places the fish in an insect-based feeding\
      \ guild. It nevertheless accepts mixed prepared foods in the aquarium. Offer suitably small pellets or\
      \ flakes together with varied animal foods such as insect larvae, daphnia and brine shrimp; some plant-containing\
      \ food can supplement the diet. Broad omnivore labels in care literature describe this flexible food\
      \ acceptance without outweighing the direct wild-diet evidence. The species has no established special\
      \ high-protein bloat restriction, but that does not make poor feeding or water quality harmless."

    rationale: "Generator proposed blue, green, grey and black; checker-a blue and grey; checker-b and checker-c\
      \ blue, green and grey. All proposed a mixed pattern. Retain blue, green and grey as adult ground colours\
      \ because the live-fish redescription identifies turquoise or blue coloration, green iridescence and\
      \ grey dorsal regions. Dark lateral bands and spots explain the mixed pattern and do not make black a\
      \ dominant ground colour. Pattern intensity changes with condition and reproductive state. Reported geographical\
      \ colour variation does not establish a consistently named variant."

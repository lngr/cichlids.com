  socialBehavior:
    text: "Keep a compatible male and female together with enough cover to avoid constant visual contact. Minor\
      \ displays and short chases fit the usual behaviour of an established pair. During brood care the adults\
      \ defend a small area around the egg site and young, and may chase fish that approach too closely. This\
      \ corresponds to heterospecific aggression level 2 while remaining compatible with quiet companions under\
      \ suitable conditions. Extra adults or rival pairs need additional territory. A rejected partner that\
      \ cannot rest or feed needs intervention rather than being left to endure persistent chasing."
    sources:

      rationale: "Retain 0 to 6 dKH and low confidence from the unanimous tally under its two-unit agreement\
        \ threshold. Generator and checker-b proposed 0 to 6, checker-a 0 to 8 and checker-c 0 to 5. These\
        \ count as four agreeing votes; the median upper bound is 6 and the lower bound is 0. Aqua-Pedia gives\
        \ 1 to 6 dKH but discloses generated care data, so its direct advice has low trust. The wider 0 to\
        \ 8 inference from checker-a and narrower 0 to 5 inference from checker-c remain evidence. Seriously\
        \ Fish and Practical Fishkeeping give pH/GH advice but no KH limits; their inferred KH entries do not\
        \ become measured tolerances. Inclusion of near-zero native alkalinity and routine soft to moderately\
        \ mineralized aquarium practice motivates the range. GH does not determine KH, and 6 is a provisional\
        \ keeping ceiling rather than a demonstrated physiological threshold."

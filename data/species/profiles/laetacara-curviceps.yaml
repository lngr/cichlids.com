  lifespanYears:
    value:
      min: 3.5
      max: 5.5
    confidence: low
    rationale: "Generator and checker-b proposed 3 to 5 years, checker-a 4 to 6 and checker-c 4 to 7. The medians\
      \ of the minima and maxima are 3.5 and 5.5 years. Retain that tentative interval with low confidence.\
      \ Aquarium Guide, Acuario Adictos and Aquadiction give about five years; Cichlidamerique gives conflicting\
      \ 4 to 6 and 5 to 7 estimates. A keeper reports curviceps reproducing for three years without giving\
      \ age at death; the better-dated 4.5-year observation in that thread concerns dorsigera. The retained\
      \ 4 to 6 estimate attributed to Practical Fishkeeping is an agent inference because that source states\
      \ no lifespan. The final median summarizes proposals and overlapping care estimates, not a measured survival\
      \ distribution or an upper biological limit."

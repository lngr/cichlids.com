      rationale: "Retain 20 to 28 C from the qualified-majority tally, four of six votes, with medium confidence.\
        \ Generator and checker-a proposed 22 to 28 C; checker-b, checker-c, tiebreaker-1 and tiebreaker-2\
        \ proposed 20 to 28 C. Seriously Fish directly supports the wider range, while Practical Fishkeeping\
        \ starts at 22 C and FishBase and Maidenhead give 22 to 26 C. The low endpoint is therefore less independently\
        \ corroborated. The interval contains the recorded 26 C habitat point. Cichlidamerique gives a wider\
        \ 24 to 29 C interval and a separate 30 C keeping claim without long-term endpoint evidence; these\
        \ do not justify extending the maximum. Its other maintenance targets and the 28 C breeding report\
        \ on The Krib are retained. The regional 26 to 33 C floodplain range also does not establish long-term\
        \ health for identified curviceps."

  sizeAndGrowth:
    text: "For aquarium planning, expect well-grown males to reach about 7 cm and females about 6 cm total\
      \ length. These estimates reconcile smaller standard-length measurements with the additional tail length\
      \ and the sex differences described by keeping sources. Some care pages give 8 to 10 cm or more, so individual\
      \ growth and measurement convention matter. Young fish may show little colour and become more conspicuous\
      \ as they mature. A lifespan estimate of 3.5 to 5.5 years has low confidence because the available reports\
      \ do not provide a reliable survival series. Neither its upper endpoint nor the largest published length\
      \ should be treated as an absolute limit."

  temperatureC:
    value:
      min: 26
      max: 28
    confidence: medium
    rationale: "Adjudicated 26 to 28 C replaces the qualified-majority point range of 26 to 26 C because the\
      \ Santarem observation represents one site reading. The 2009 redescription supplies that\
      \ species-linked anchor. Faria et al. report 26.4 to 27.6 C over ten months in a slow-flowing\
      \ clearwater stream tributary of Lago Verde near Santarem, matching the regional habitat type. The\
      \ upper endpoint rounds 27.6 C to 28 C. This combines the collecting observation with regional\
      \ seasonal measurements rather than treating a point as an ideal. The comparison concerns\
      \ Hyphessobrycon cantoi habitat and does not assert curviceps captures at the chemistry station. The\
      \ 20 to 28 C tolerance contains this interval."

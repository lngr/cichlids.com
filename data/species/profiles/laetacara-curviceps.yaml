  breeding:
    text: "Both adults participate in substrate spawning and brood care. Eggs can be attached to a leaf or\
      \ stone, and the use of a surface inside shelter does not make cave spawning obligatory. Broods may contain\
      \ up to about 300 eggs. Development changes with temperature, so observed progression matters more than\
      \ a fixed calendar. Once young swim and feed independently, offer food of an appropriate small size,\
      \ such as newly hatched brine shrimp, and protect them from filter intakes. Community companions can\
      \ consume eggs or fry, so a pair may rear fewer young in a mixed tank. The mouthbrooding label in one\
      \ care page conflicts with the species-specific evidence and is not adopted."
    sources:
    - kind: literature

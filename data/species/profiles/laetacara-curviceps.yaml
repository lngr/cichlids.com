      \ a sand base and woody shelter for aquarium use. Wood and sand are supported as furnishing needs rather\
      \ than quantified at every wild collection site. CRC mentions rocky settings in a broad teaser, but its\
      \ explicit habitat categories emphasize vegetated lakes, creeks and flooded margins; this does not establish\

partners:
  suitable:
  - species: Hyphessobrycon herbertaxelrodi
    reason: An adult shoal is large enough to avoid the tiny-fish risk and uses water above the nest.
    condition: Use a larger community tank with overlapping water requirements and a full shoal.
  - species: Nannostomus beckfordi
    reason: Adult pencilfish offer quiet activity above a planted breeding territory.
    condition: Provide surface cover and keep the pencilfish in a suitable group.
  - species: Carnegiella strigata
    reason: Surface-oriented hatchetfish leave the substrate to the acara pair.
    condition: Use a tightly covered community tank with room for a group.
  unsuitable:
  - species: Astronotus ocellatus
    reason: The much larger cichlid can swallow or severely intimidate a dwarf acara.
  - species: Melanochromis auratus
    reason: Its aggression and alkaline-water keeping requirements conflict with this gentle Amazonian pair.
  - species: Boraras brigittae
    reason: Very small adults fall within the opportunistic prey category; juvenile fish are especially vulnerable.
  - species: Laetacara dorsigera
    reason: "The decided pairwise group indicates a presumed crossing risk, based on hobby warnings without\
      \ verified hybrid offspring."
profile:
  overview:
    text: "Laetacara curviceps is a small Brazilian acara suitable for a quiet planted aquarium. Its blue or\
      \ turquoise ground colour and variable dark marks become easier to appreciate once it settles. Older\
      \ aquarium literature and the legacy catalog use Aequidens curviceps. The accepted name is Laetacara\
      \ curviceps (Ahl, 1924). Captive stock generally tolerates a wider range of aquarium conditions than\
      \ the very dilute acidic water reported from one collecting habitat. A compatible adult pair is the recommended\
      \ social unit, and its shared care of eggs and young is a central part of its behaviour."
    sources:

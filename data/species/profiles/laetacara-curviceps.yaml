    rationale: "Generator, checker-b and checker-c proposed level 2; checker-a proposed level 1. Practical\
      \ Fishkeeping describes actual chases when bottom dwellers approach a brood, so territorial expulsion\
      \ supports level 2 rather than display alone. Ordinary community behaviour remains mild. Acuario Adictos\
      \ reports severe, sometimes lethal breeding aggression, and Maidenhead warns that companions may need\
      \ separation, but the independent specialist keeping accounts do not support persistent attacks beyond\
      \ the nest area in a suitable tank. The stronger claim remains evidence without setting the normal rubric\
      \ level."

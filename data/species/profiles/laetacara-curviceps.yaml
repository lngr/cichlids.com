  habitat:
    text: "Confirmed records come from the lower Amazon region of Brazil, including lakes near Parintins and\
      \ Obidos and later material near Belem. Field observations near Santarem describe quiet creeks and\
      \ small standing waters with leaf-covered beds and aquatic vegetation. One reported site measured 26\
      \ C, pH 5.2 and conductivity 10 uS/cm. The natural intervals of 26 to 28 C and pH 4.3 to 6.8 combine\
      \ this observation with seasonal measurements from a clearwater stream near Santarem and regional\
      \ Arapiuns pH data. The regional stations do not provide matched curviceps captures. Natural GH and KH\
      \ of 0 to 1 are provisional regional estimates, supported by nearby ion and alkalinity measurements.\
      \ Regional rivers and floodplains span much wider conditions, but those measurements were not\
      \ consistently paired with identified curviceps captures. Older Amapa records also require care\
      \ because the similar L. flamannellus was once treated as curviceps."
    sources:
    - kind: literature
      title: "Ottoni, Mattos and Schindler (2009). Re-description of Laetacara curviceps (Teleostei: Cichlidae:\
        \ Cichlinae)."
      url: "https://doi.org/10.3897/vz.59.e30964"

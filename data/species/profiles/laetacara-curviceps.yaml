  diet:
    value:
      type: invertivore
      bloatSensitive: false
      foods:
      - insect larvae
      - bloodworm
      - daphnia
      - brine shrimp
      - micro pellets
      - flakes with some plant content
    confidence: medium
    rationale: "Retain the qualified-majority invertivore decision, five of six votes, and the tally food list.\
      \ Generator proposed omnivore; checker-a, checker-b, checker-c, tiebreaker-1 and tiebreaker-2 proposed\
      \ invertivore. The 2018 revision found aquatic insects and chironomid larvae dominating the guts of seven\
      \ specimens, with fewer small crustaceans and unidentified eggs. CRC independently categorizes feeding\
      \ as insect-based. This direct natural-diet evidence outweighs the hypothetical mixed foraging described\
      \ by Seriously Fish and the broad aquarium omnivore labels of TFH, Practical Fishkeeping and several\
      \ care pages. Prepared food containing plant material remains compatible with an invertebrate-dominated\
      \ diet. All proposals set bloatSensitive false; this reflects the lack of an established species-specific\
      \ protein-related restriction, rather than experimental proof that digestive disease is impossible."

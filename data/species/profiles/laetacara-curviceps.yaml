  breeding:
    value: open-substrate-spawner
    confidence: high
    rationale: "All four proposals select open-substrate spawning. The redescription, CRC and the principal\
      \ keeping sources establish paired substrate spawning with shared parental care. Egg sites include leaves\
      \ and stones as well as surfaces inside shelters. Occasional shelter use does not establish obligate\
      \ cave spawning. The Aquadiction cave label and Acuario Adictos mouthbrooding label remain evidence,\
      \ but the latter conflicts with its own substrate-egg narrative and both conflict with stronger species-specific\
      \ sources."
    sources:
    - kind: literature
      title: "Ottoni, Mattos and Schindler (2009). Re-description of Laetacara curviceps (Teleostei: Cichlidae:\

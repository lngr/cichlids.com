    rationale: "The Catalog recognizes Laetacara curviceps (Ahl, 1924), originally Acara curviceps. Both Laetacara\
      \ and the legacy Aequidens genus lists were checked. The 2009 redescription identifies February 1924\
      \ as the publication date; 1923 was the receipt year and persists in FishBase and some hobby pages. CRC\
      \ independently uses 1924. Aequidens curviceps is the legacy combination, while TFH and Maidenhead also\
      \ report Parvacara curviceps as a historical combination. The final synonym list retains all three combinations;\
      \ checker-a listed only Acara, checker-b listed Acara and Aequidens, and generator and checker-c listed\
      \ all three. These are changes of combination rather than evidence of three separate species."

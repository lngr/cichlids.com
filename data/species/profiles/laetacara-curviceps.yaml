  problems:
    text: "Investigate changes in breathing, appetite or social behaviour alongside water quality and the condition\
      \ of both pair members. An immature filter, excess food or relentless partner pursuit can undermine otherwise\
      \ suitable husbandry. Very dilute water has little buffering, so stability requires particular attention\
      \ when KH is near zero. The provisional KH ceiling is not a diagnostic boundary and conductivity cannot\
      \ substitute for separate hardness and alkalinity measurements. Reports of losses soon after purchase\
      \ do not establish a specific disease or a water tolerance without diagnostic evidence. Sources also\
      \ differ about lifespan and maximum size; these uncertainties remain visible rather than being presented\
      \ as measured limits."

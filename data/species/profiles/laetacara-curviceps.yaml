  minTank:
    value:
      volumeL: 54
      lengthCm: 60
      depthCm: 30
    confidence: medium
    rationale: "The proposals are generator 54 L/60 cm/30 cm, checker-a 60 L/60 cm/30 cm, checker-b 54 L/60\
      \ cm/30 cm and checker-c 54 L/60 cm/30 cm for volume/length/depth. Their medians are 54 L, 60 cm and\
      \ 30 cm. Practical Fishkeeping explicitly gives a 60 by 30 by 30 cm tank for one compatible adult pair,\
      \ which calculates to 54 L gross. FishBase independently supports 60 cm length without specifying a volume\
      \ or depth. This supports the median without an extra volume buffer. Other pages recommend about 75 L,\
      \ 80 L or 100 L, but are less specific about the same pair unit. The minimum does not include additional\
      \ shoals or competing cichlid pairs."
    sources:
    - kind: literature
      title: "Practical Fishkeeping: The Smiling Cichlid: A Laetacara curviceps Care Guide"

  hybridGroups:
    value:
    - laetacara-curviceps-dorsigera
    confidence: low
    rationale: "Retain the conservative tally decision laetacara-curviceps-dorsigera with three of six votes\
      \ and low confidence. Generator, checker-a and checker-b proposed an empty list because they found no\
      \ substantiated crossing report. Checker-c, tiebreaker-1 and tiebreaker-2 proposed this pair. The conservative\
      \ rule retains a group named by at least two votes when no qualified majority exists. Cichlidamerique\
      \ suggests that Asian farm stocks may include this cross; Apistogramma.com discussions warn about mixing\
      \ these named congeners. Neither source demonstrates verified hybrid offspring or free choice of same-species\
      \ partners. The 2009 redescription supports morphological resemblance, explicitly leaves intrageneric\
      \ relationships unresolved and reports no cross. The group therefore has basis presumed. The empty-list\
      \ evidence and the earlier internal-table absence are preserved, but that table is not biological evidence\
      \ of reproductive isolation. No genus-wide group or additional named pair is established."

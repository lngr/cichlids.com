  maxSizeCm:
    value:
      male: 7
      female: 6
    confidence: medium
    rationale: "The proposals are generator 8/6 cm, checker-a 6.5/5.5 cm, checker-b 7/5 cm and checker-c 7/6\
      \ cm for male/female. Their medians are 7 and 5.75 cm. Retain 7 cm for males and round the female planning\
      \ estimate to 6 cm. TFH gives 7 to 9 cm overall with larger males, Aquarium Guide gives 8/6 cm, and Acuario\
      \ Adictos gives 9/6 cm. The redescription and Seriously Fish describe about 5 cm standard length, which\
      \ excludes the caudal fin; the redescription gives caudal-fin lengths near 30 percent of standard length.\
      \ Those figures are not equivalent to a 5 cm total-length ceiling. FishBase retains 4.6 cm standard length\
      \ for male/unsexed fish, a 6.6 cm female record and an older 10 cm total-length maximum. Aquatic Community\
      \ gives 10 cm males and about 8 to 8.5 cm females. These larger reports are retained but do not set a\
      \ typical sex-specific aquarium maximum. The final values are practical estimates rather than a measured\
      \ growth distribution."
    sources:
    - kind: website
      title: "Aquarium Guide: Laetacara curviceps, Tüpfelbuntbarsch"
      url: "https://www.aquarium-guide.de/laetacara_curviceps.htm"

  husbandry:
    text: "One compatible pair can use a tank with a 60 by 30 cm base and approximately 54 L gross volume.\
      \ Adding companions requires enough extra space for their own group needs and for the pair to defend\
      \ young. Arrange plants and woody shelter so that both fish can withdraw from view, and provide soft\
      \ sand and suitable egg surfaces. Use an established filter with gentle circulation and maintain water\
      \ quality through regular partial changes. The decided keeping tolerances are 20 to 28 C, pH 4.3 to\
      \ 7.5 and GH 0 to 15 dGH. KH 0 to 6 dKH is a provisional estimate supported much less strongly. Choose\
      \ stable conditions appropriate to the stock rather than trying to reproduce every endpoint\
      \ simultaneously; wild imports may need softer and more acidic water than established aquarium\
      \ strains."

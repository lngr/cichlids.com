  sexing:
    text: "Sexing juveniles reliably can be difficult. Mature males generally become somewhat larger and may\
      \ develop longer dorsal and anal fin extensions. Consider size and fin shape together rather than relying\
      \ on colour alone. The dark dorsal mark can be stronger in females but is variable and is not a definitive\
      \ sex test. Identification is a separate concern because related Laetacara can resemble curviceps, especially\
      \ when young. Conspicuous red coloration on the chest and belly during breeding warrants checking the\
      \ identity against L. dorsigera. Retain collection or stock information where it is available."
    sources:
    - kind: literature

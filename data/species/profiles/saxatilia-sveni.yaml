  sexing:
    text: "In mature fish, males tend to be larger and have longer fin rays, particularly in the anal fin. Females\
      \ can develop a pink belly and small dark dorsal-fin spots with pale edging. Use several traits together and\
      \ allow for changes with age and breeding condition. Size alone does not reliably sex juveniles. Collection\
      \ information is useful because several similar pikes have circulated under mistaken aquarium names."

  breeding:
    text: "The pair uses a sheltered cavity for egg deposition, with care shared between the parents. Offer a secure\
      \ cave or wood cavity and additional retreats outside the spawning area. Expect territorial defense to increase\
      \ and assess whether companions can remain safely. The breeder account specifically describes durable sveni\
      \ pairs, while generic care summaries differ on breeding difficulty. Reported clutch sizes and development\
      \ schedules for the wider group are not verified sveni measurements, so they are not promises for an individual\
      \ pair."

  ghDgh:
    value:
      min: 0
      max: 3
    confidence: low
    rationale: "Retain the tally interval of 0 to 3 dGH and its unanimous 4 of 4 verification under the allowed\
      \ 2 dGH agreement threshold. The proposals were generator 0 to 1.1, checker-a 0.5 to 3, and checker-b and\
      \ checker-c 0 to 3 dGH. Low confidence is necessary because the numerical envelope is a regional reconstruction.\
      \ Direct hardness reports give about 0.02 to 0.53 dGH in the FAO compilation, 0.22 to 1.03 dGH from Manacacias\
      \ upstream means and 1.0 to 2.0 dGH in the lower Cusiana. SCOPE upper, middle and lower Orinoco mean Ca plus\
      \ Mg concentrations imply 0.17 to 0.66 dGH. Its western-plains total cation maximum yields only an upper bound\
      \ of about 2.31 dGH because that total also includes sodium and potassium; rounding outward supports 3 dGH.\
      \ Checker-a conductivity-based estimates are retained as proposals but conductivity cannot establish GH numerically.\
      \ Zero represents rounding of very dilute natural water, not pure-water husbandry. Caura chemistry is regional\
      \ context, not a verified species locality, and the Angostura treatment study does not set a habitat limit.\
      \ The anomalous JBL 21 to 28 dGH cells are retained with the tolerance evidence and do not establish typical\
      \ sveni waters."

  note: "The Catalog of Fishes accepts Saxatilia sveni (Ploeg, 1991), following the revised generic classification.\
    \ Both the Saxatilia and Crenicichla catalog queries were checked; the current entry is in Saxatilia. Crenicichla\
    \ sveni is the original combination and remains common in older databases and aquarium accounts. TankBud incorrectly\
    \ assigns the species to the lugubris group and gives the wrong first name for its describer; the catalog takes\
    \ priority. This species is distinct from Geophagus sveni. Earlier attempts to read Seriously Fish, Aqua Imports,\
    \ Tropicals and IUCN failed or encountered access restrictions; their snippets supply no additional evidence.\
    \ Aqua Teck husbandry facts were recovered from the archived public HTML because its extracted text omits the\
    \ care table."

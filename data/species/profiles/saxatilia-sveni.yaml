  temperatureC:
    value:
      min: 24
      max: 29
    confidence: medium
    rationale: "Retain the tally decision of 24 to 29 C, qualified-majority with 5 of 6 agreeing votes. The proposals\
      \ were generator 24 to 29, checker-a 24 to 30, checker-b 24 to 27, checker-c 24 to 28, tiebreaker-1 24 to\
      \ 30 and tiebreaker-2 24 to 29 C. Regional field evidence includes Ocoa station 1 at 24 to 26.3 C, Manacacias\
      \ upstream means of 28.4 to 28.9 C, Cusiana readings of 27.7 to 29.1 C and JBL Orinoco riverbank readings\
      \ of 27 to 29 C. FishBase gives 24 to 27 C but cites an aquarium atlas for temperature, so it is not an independent\
      \ field series. The decided interval is narrower than the Mitimiti regional span of 25.92 to 30.42 C after\
      \ excluding its isolated 36.06 C reading; that broader measurement remains evidence rather than an ideal endpoint.\
      \ Ocoa main-channel readings of 22.6 to 32.9 C include disturbed reaches, Maraca wetland temperature averages\
      \ 30.5 C and the JBL 33 C observation was in an artificial cattle trough. None establishes a typical occupied-site\
      \ envelope for sveni. Medium confidence reflects regional extrapolation and rounding; 29 C is not a demonstrated\
      \ biological failure threshold."

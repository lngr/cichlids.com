  socialBehavior:
    text: "A compatible pair can remain bonded for years, but placing an unfamiliar male and female together does\
      \ not ensure compatibility. Females need refuges away from the male, and persistent hiding or failure to feed\
      \ can precede visible injury. Unpaired adults are at particular risk once another pair forms. Juvenile group\
      \ rearing is a way to obtain a pair rather than a reason to retain all adults together. A divider or spare\
      \ tank should be available before introductions. One fish can also be kept alone. Even a settled pair may\
      \ become less tolerant during reproduction."

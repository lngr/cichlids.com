    tolerance:
      value:
        min: 24
        max: 29
      confidence: medium
      rationale: "Retain the tally 24 to 29 C, unanimous 4 of 4 under its 1 C agreement threshold, with medium confidence.\
        \ Generator, checker-b and checker-c propose 24 to 29 C; checker-a proposes the wider 23 to 30 C. NCS recommends\
        \ 26 to 29 C, TankBud 24 to 28 C, Atlas about 25 to 28 C and the genus care page 24 to 27 C. The laboratory\
        \ study kept identified sveni at 26 to 29 C without establishing multiyear limits. The decided envelope\
        \ is narrower than checker-a general experience and the separate forum observation of 23.9 to 30 C (75 to\
        \ 86 F); neither is a controlled chronic-tolerance trial. It contains the natural decision and happens to\
        \ share its endpoints because of explicit keeping recommendations, not because harm outside the habitat\
        \ range has been demonstrated."

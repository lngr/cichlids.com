  ph:
    value:
      min: 4.8
      max: 7.5
    confidence: low
    rationale: "Retain the tally median of pH 4.8 to 7.5 with low confidence. All six proposals start at 4.8: generator\
      \ ends at 7.0, checker-a at 7.2, checker-b and checker-c at 7.7, tiebreaker-1 at 7.0 and tiebreaker-2 at 7.7.\
      \ The central upper bounds, 7.2 and 7.7, average 7.45 and round to 7.5. FishBase gives 4.8 to 7.0; FAO regional\
      \ measurements give 4.8 to 6.8 and lower Cusiana measurements 6.36 to 7.24. The decided upper bound is narrower\
      \ than SCOPE western-plains measurements of 6.3 to 7.7, Mora lower-Orinoco measurements of 5.53 to 7.57, and\
      \ the Atlas secondary La Macarena range of 5.4 to 8.0. These broader regional ranges remain evidence, without\
      \ implying confirmed sveni occurrence at their endpoints. Mitimiti readings of 4.71 to 6.54 and the isolated\
      \ JBL river reading of 4.5 similarly do not establish a new species minimum. Ocoa pH up to 10.8 comes from\
      \ a drainage containing polluted reaches and is not assigned as ideal habitat. This is an approximate planning\
      \ interval between regional proposals, not a claim that pH outside it causes harm. Aquarium recommendations\
      \ do not set its bounds."

  predation:
    value: 3
    confidence: high
    rationale: "All four full-profile runs propose level 3, as the tally decides unanimously. The primary diet study\
      \ examined 41 sveni and found fish represented 59.1 percent of food volume, with epibenthic invertebrates\
      \ contributing 40.2 percent. CRC independently identifies piscivory and the Nordic register describes fish\
      \ eating. This meets level 3 even though fish are not its only food. Experimental guppy captures corroborate\
      \ capability; FishBase modelled trophic level and an uncertain archive identification are weaker supplementary\
      \ evidence. The empty FishBase diet table supplies no contradictory dietary measurements."

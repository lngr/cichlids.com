    confidence: high
    rationale: "The Catalog of Fishes establishes an Orinoco-basin distribution in Colombia and Venezuela and a\
      \ Meta-drainage type locality at Puerto Gaitan. FishBase and the Nordic register corroborate the Llanos distribution;\
      \ the register also identifies a Cusiana record. The proposals describe the same basin, with different locality\
      \ detail, so the confirmed Meta and Cusiana information is combined. Chemical surveys elsewhere in the basin\
      \ are regional comparisons and do not establish a capture locality for this species."

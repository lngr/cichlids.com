  sizeAndGrowth:
    text: "Allow for a male around 25 cm total length. Published species summaries repeatedly support that size,\
      \ although an importer gives an upper range of 25 to 30 cm. Females are smaller; the 21 cm figure used here\
      \ is an estimate from the profile proposals because a measured female maximum was not found. Young imports\
      \ and small fish in field collections do not establish adult aquarium size. As the pike grows, reassess both\
      \ its retreats and the size of its companions. The provisional 8 to 12 year lifespan also lacks a verified\
      \ species-specific age series."

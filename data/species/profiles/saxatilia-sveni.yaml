    tolerance:
      value:
        min: 0
        max: 14
      confidence: low
      rationale: "Retain the tally median of 0 to 14 dGH with low confidence because no qualified majority settled\
        \ the six proposals: generator 0 to 12, checker-a 0.5 to 12, checker-b 0 to 15, checker-c 0 to 15, tiebreaker-1\
        \ 0 to 15 and tiebreaker-2 0 to 12 dGH. The median lower bound is 0 and the median upper bound is 13.5,\
        \ rounded to 14. This is narrower than the three 0 to 15 dGH inferences but wider than the genus Fishkeeper\
        \ recommendation of at most 12 dH. Aqua Teck and Atlas give qualitative soft-to-moderately-hard advice;\
        \ Kutty reports successful breeding in treated tap water and broad group adaptability without numerical\
        \ GH measurements. Neither 12, 14 nor 15 is a demonstrated species failure threshold. The median is retained\
        \ as the required provisional planning envelope, not as independent experimental confirmation of 14 dGH.\
        \ Zero means rounded very soft water. JBL riverbank values of 0.25 to 2 dGH and a lagoon reading of zero\
        \ are habitat context only. Its anomalous first two Orinoco cells of 21 and 28 dGH are wider still, have\
        \ no identified sveni capture and are not tolerance evidence; their values remain visible for scrutiny."

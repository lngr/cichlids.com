  minTank:
    value:
      volumeL: 540
      lengthCm: 160
      depthCm: 60
    confidence: medium
    rationale: "The proposals are generator 540 L, 160 cm length and 60 cm depth; checker-a 300 L, 120 cm and 50\
      \ cm; checker-b and checker-c each 540 L, 160 cm and 60 cm. Their component medians are 540 L, 160 cm and\
      \ 60 cm and are retained for a compatible adult pair. The Nordic register directly recommends 540 L and 160\
      \ cm; 60 cm depth is an inferred footprint for retreats and escape routes, not a published measurement. Aqua\
      \ Teck gives 500 L. TankBud gives 450 L for one adult, Atlas accepts about 120 cm for a pair with more space\
      \ preferred, and an individual forum account suggests roughly 208 L without demonstrating safe long-term pair\
      \ keeping. Kutty reports breeding in smaller tanks but also appreciable casualties. Those smaller accounts\
      \ do not outweigh the species-specific association recommendation for the selected social unit. Community\
      \ companions need additional space."

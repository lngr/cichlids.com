  compatibility:
    text: "This species can share a sufficiently large aquarium with carefully selected robust adults. It is scored\
      \ as a territorial level-2 fish toward other species under suitable pair keeping; that rating does not remove\
      \ predation or spawning risks. Deep-bodied characins and substantial armoured catfish are plausible candidates,\
      \ but the named examples here are conditional inferences. Small tetras and small bottom cichlids are unsafe\
      \ choices. Watch food access and retreat use, and separate fish when a spawning pair overwhelms its companions.\
      \ The legacy archive attack report has uncertain identification and cannot establish the behavior of every\
      \ sveni."

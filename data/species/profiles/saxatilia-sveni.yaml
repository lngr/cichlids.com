  aggressionHeterospecific:
    value: 2
    confidence: medium
    rationale: "Generator and checker-b propose level 2; checker-a and checker-c propose level 3. Retain level 2\
      \ for a compatible adult pair in the recommended tank. Kutty reports dominance over other cichlid genera without\
      \ usual injuries outside spawning, whereas TankBud gives a general aggression label and the genus care page\
      \ stresses robust companions. The direct keeping account is more specific than a general warning and supports\
      \ territorial displacement rather than routine attacks beyond the territory. Breeding can make the combination\
      \ unsafe and require separation. Thread 59017 reports an attacked oscar but explicitly leaves the pike identity\
      \ unresolved; its level-3 interpretation remains evidence of a possible risk rather than a secure species\
      \ observation."

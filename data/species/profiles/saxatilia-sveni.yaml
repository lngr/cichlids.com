  husbandry:
    text: "Provide at least 540 litres and a 160 cm tank length for an established pair, with about 60 cm front-to-back\
      \ space. The depth is a practical layout estimate. Arrange wood and stable rock shelters so each fish can\
      \ leave the other line of sight, while preserving open floor and swimming space. Maintain filtration, surface\
      \ movement and regular water changes appropriate to two large carnivores. Around 26 to 27 C and near-neutral\
      \ water offer a practical starting point within the stated tolerances. The broad pH and hardness envelopes\
      \ include inference and are not targets for deliberate extremes. Very soft water needs attention to buffering\
      \ and stable maintenance. More tankmates require space beyond this pair minimum."
    sources:

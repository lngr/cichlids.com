partners:
  suitable:
  - species: Metynnis argenteus
    reason: A substantial adult has a deeper body than small prey fish and is a plausible companion. This is an
      inferred candidate rather than a verified sveni pairing.
    condition: "Adults in their own social group, additional tank space and observation during feeding and spawning."
  - species: Heros efasciatus
    reason: A robust adult may tolerate territorial displacement outside breeding. Pair aggression can still make
      separation necessary.
    condition: "An aquarium larger than the pair minimum, separate territories and a ready means of separation."
  - species: Hoplosternum littorale
    reason: "A large armoured adult is a plausible alternative to small bottom fish, although shelter competition\
      \ remains possible. This pairing is inferred."
    condition: Adults with separate protected retreats and extra floor space.
  unsuitable:
  - species: Paracheirodon axelrodi
    reason: Small adults remain potential prey for a 25 cm piscivore.
  - species: Mikrogeophagus ramirezi
    reason: Small size and use of the lower tank create risks of predation and territorial displacement.
  - species: Tropheus moorii
    reason: Its plant-centred feeding and conspecific group management are unsuitable for this predator setup.
profile:
  overview:
    text: "A small fish sold as Crenicichla sveni will grow into a substantial Orinoco predator. Its accepted name\
      \ is Saxatilia sveni, and it comes from Colombia and Venezuela. The recommended adult arrangement is a compatible\
      \ pair with generous shelter and a plan for separating the fish if their relationship fails. Fish eating,\
      \ rather than indiscriminate fighting, is the first compatibility issue: small companions remain food even\
      \ when the pike appears settled. This is a different species from the eartheater Geophagus sveni."
    sources:

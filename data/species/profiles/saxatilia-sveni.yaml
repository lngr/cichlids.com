  habitat:
    text: "The Meta drainage includes the type locality at Puerto Gaitan, and the species is also reported from\
      \ the Cusiana and the wider Orinoco Llanos. Cover around the lower part of the water column provides hunting\
      \ and refuge space. Regional surveys show very dilute acidic tributaries as well as waters nearer neutral\
      \ pH. The profile natural ranges summarize those regional water types; their endpoints are not a complete\
      \ measurement series beside identified sveni. The evidence includes a single 36.06 C low-water Mitimiti reading,\
      \ a Maraca wetland mean of 30.5 C and a 33 C artificial cattle trough. These are regional or artificial contexts\
      \ rather than established typical sveni habitat. Ocoa survey pH reaches 10.8 in a drainage containing polluted\
      \ reaches. JBL also prints two anomalous Orinoco GH readings of 21 and 28 dGH alongside much softer riverbank\
      \ values. None of these exceptional or unresolved observations is assigned as the fish ideal water or aquarium\
      \ tolerance."

  diet:
    text: "Fish form a major part of the natural diet, with invertebrates also contributing substantially. In the\
      \ published sample of 41 individuals, fish made up 59.1 percent of food volume. Use a suitable complete carnivore\
      \ pellet with varied foods such as earthworms, thawed shrimp and appropriate frozen fish-based preparations.\
      \ Newly imported adults may need time to accept pellets; check actual intake rather than assuming a large\
      \ mouth means enthusiastic feeding. Live feeder fish are unnecessary and can introduce disease. Adjust portions\
      \ to body condition and remove leftovers before they burden water quality."

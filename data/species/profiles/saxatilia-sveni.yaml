      max: 2
    confidence: medium
    rationale: "Retain the tally decision of 0 to 2 dKH at medium confidence; natural KH carries no verification\
      \ object. The proposals were generator 0 to 1, checker-a 0 to 1.5, and checker-b and checker-c 0 to 2 dKH.\
      \ SCOPE western-plains alkalinity of 23 to 667 microequivalents per litre converts to about 0.064 to 1.87\
      \ dKH and upper Colombian tributary alkalinity to about 0.10 to 0.59 dKH. Outward rounding gives the decided\
      \ envelope. Cusiana alkalinity supports about 0.6 to 1.2 dKH; Manacacias upstream means imply about 0.20 to\
      \ 0.84 dKH if expressed as CaCO3 equivalents. This is alkalinity expressed in aquarium degrees; organic acid\
      \ anions may contribute in stained water. Low pH or conductivity alone cannot quantify KH, so checker-a estimates\
      \ using those properties are not direct measurements. No complete series paired with identified sveni captures\
      \ was found."

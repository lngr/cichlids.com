        \ confidence. Generator proposes 4.8 to 7.5, checker-a 4.8 to 7.8, checker-b 4.8 to 7.7 and checker-c 4.8\
        \ to 8.0. NCS recommends 5.5 to 7.0, TankBud 5.5 to 7.2, Aqua Teck 5.5 to 7.5 and Atlas about 6.0 to 7.5.\
        \ The lower endpoint includes the natural decision rather than asserting an aquarium trial at pH 4.8. The\
        \ upper endpoint translates qualitative reports of saxatiline keeping in alkaline tap water. It is narrower\
        \ than checker-c inferred 4.8 to 8.0 envelope and the Atlas secondary La Macarena 5.4 to 8.0 field range;\
        \ neither establishes a measured sveni tolerance. Regional Mitimiti chemistry is not proof of sveni occurrence\
        \ or long-term captive health at every measured pH."

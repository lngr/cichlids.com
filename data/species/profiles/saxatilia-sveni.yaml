  problems:
    text: "Problems commonly begin with insufficient adult space, incompatible pairing or companions that become\
      \ swallowable as the pike grows. Loss of appetite, prolonged retreat and repeated chasing deserve attention\
      \ before injuries develop. Imported fish benefit from quarantine and careful observation of condition and\
      \ feeding. A varied predator diet still requires portion control and clean water. Monitor pH stability when\
      \ buffering is low. The absence of a specialist bloat flag does not imply resistance to digestive disease\
      \ or poor husbandry."

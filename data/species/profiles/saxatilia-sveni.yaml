  aggressionConspecific:
    value: 3
    confidence: medium
    rationale: "All four runs propose level 3. The Nordic register specifically requires retreats that let females\
      \ escape males, and Glaser reports quarrelsome juveniles. Kutty describes dangerous pair formation but also\
      \ reports sveni pairs remaining compatible for years. Level 3 therefore fits the recommended established pair\
      \ with adequate space and cover. Severe outcomes during incompatible pairing do not establish habitual partner\
      \ killing in a suitable adult arrangement."

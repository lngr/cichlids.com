  legacyNames:
    - "Tramitichromis intermedius"
  note: "The Catalog of Fishes retains Tramitichromis intermedius and separately accepts T. brevis; the Tramitichromis\
    \ and Lethrinops genus lists were checked. The epithet reflects anatomical comparisons with brevis and with\
    \ Lethrinops argenteus and L. lethrinus, as explained by ETYFish, rather than synonymy or hybrid ancestry. Oliver\
    \ discusses competing Trematocranus and Hemitilapia hypotheses, which do not supersede the accepted catalog\
    \ name. The CRC public classification verifies that name. No distinct established locality variant was substantiated."

  temperatureC:
    value:
      min: 21
      max: 29
    confidence: "high"
    rationale: "The lake-wide decision is 21 to 29 C and has high confidence under the waterbody rule. FAO compiles\
      \ historical surface values of 23 to 25 C, Branchu records 22.8 to 25.4 C through a northern profile, and\
      \ Vollmer describes summer surface water around 28 C with cooler winter water. These individual observations\
      \ are narrower than the required seasonal envelope and do not measure aquarium endpoints or every shallow\
      \ bay. Eccles (1974) was refused by fetch-oa as not open access, so its full text was not used."
    sources:
      - kind: "literature"
        title: "Vanden Bossche and Bernacsek (1990). Source book for the inland fishery resources of Africa, Vol.\
          \ 1, Lake Malawi/Nyasa physical and chemical data."
        url: "https://www.fao.org/4/t0473e/T0473E05.htm"
        accessed: "2026-10-13"

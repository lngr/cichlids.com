        \ to 12; checker-c proposed 5 to 15. Under the two-dKH agreement threshold the tally decides 5 to 12 by\
        \ a five-of-six qualified majority with low confidence. Malawi.si and the Malawi Cichlids aquarium table\
        \ give 6 to 12, while JBL gives 5 to 10. The wider OATA care range is 10 to 15 dKH; its 15 endpoint is excluded\
        \ rather than extending untested species-specific tolerance. Natural lake studies support inclusion of 5\
        \ to 8, not captive health at 12. No species-specific numerical KH study was found, so the upper endpoint\
        \ is an extrapolation from general Malawi husbandry."

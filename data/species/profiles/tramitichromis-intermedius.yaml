partners:
  suitable:
    - species: "Aulonocara hueseri"
      reason: "An inferred example from the peaceful Aulonocara category in care accounts; no direct long-term pairing\
        \ record was read."
      condition: "A larger quiet community with separate breeding areas and access to food; monitor interactions."
    - species: "Copadichromis chrysonotus"
      reason: "An inferred example from the recommended quiet Copadichromis category."
      condition: "Additional swimming and sand space beyond the single-harem minimum; the named pairing is not directly\
        \ validated."
  unsuitable:
    - species: "Aulonocara baenschi"
      reason: "Laboratory crosses with intermedius produced fertile descendants. The presumed pairwise hybrid group\
        \ creates a breeding caution despite similar husbandry."
    - species: "Maylandia zebra"
      reason: "A forceful mbuna feeding and social setting is unsuitable for a quiet sand forager; laboratory F1\
        \ hybrids also establish a presumed crossing caution."
    - species: "Melanochromis auratus"
      reason: "An assertive mbuna can displace this quiet fish from usable sand and food."
    - species: "Nimbochromis venustus"
      reason: "A large predatory hap presents an unsuitable size and dominance balance for this quiet species."
profile:
  overview:
    text: "Tramitichromis intermedius combines a relatively quiet temperament with active sediment foraging. Adult\
      \ males can develop blue-green iridescence and red accents. It is a valid Lake Malawi species under the current\
      \ Catalog of Fishes name, originally described as Lethrinops intermedia. T. brevis remains a separate species;\
      \ the intermediate anatomy behind the name does not establish hybrid ancestry."
    sources:
      - kind: "catalog-of-fishes"
        title: "Eschmeyer's Catalog of Fishes: Tramitichromis, online version updated 21 September 2026"
        url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Tramitichromis"
        accessed: "2026-10-13"
      - kind: "database"
        title: "FishBase species summary: Tramitichromis intermedius"
        url: "https://www.fishbase.se/summary/Tramitichromis-intermedius.html"
        accessed: "2026-10-13"
      - kind: "database"
        title: "FishProfiles: Tramitichromis intermedius"
        url: "https://fishprofiles.com/profiles/freshwater/Cichlids/Tramitichromis_intermedius"
        accessed: "2026-10-13"
      - kind: "database"
        title: "M. K. Oliver: Tramitichromis intermedius, with field observations attributed to Konings (1995)"
        url: "https://malawicichlids.com/mw08108a.htm"
        accessed: "2026-10-13"
  habitat:
    text: "The fish searches sediment-covered sand and mud in shallow sheltered bays. Southern Lake Malawi is well\
      \ established in distribution databases, while an identified field photograph at Senga Bay and a broader account\
      \ suggest that the full extent needs further resolution. The natural lake envelope is 21 to 29 C, pH 7.7 to\
      \ 8.6, GH 3 to 5 dGH and KH 5 to 8 dKH. Calcium-magnesium hardness and buffering alkalinity are different\
      \ properties; the lake is alkaline without being high in GH."
    sources:
      - kind: "database"
        title: "FishBase species summary: Tramitichromis intermedius"
        url: "https://www.fishbase.se/summary/Tramitichromis-intermedius.html"
        accessed: "2026-10-13"
      - kind: "database"
        title: "M. K. Oliver: Tramitichromis intermedius, with field observations attributed to Konings (1995)"
        url: "https://malawicichlids.com/mw08108a.htm"
        accessed: "2026-10-13"
      - kind: "literature"
        title: "Vanden Bossche and Bernacsek (1990). Source book for the inland fishery resources of Africa, Vol.\
          \ 1, Lake Malawi/Nyasa physical and chemical data."
        url: "https://www.fao.org/4/t0473e/T0473E05.htm"
        accessed: "2026-10-13"
      - kind: "literature"
        title: "Branchu et al. (2010). Hydrochemistry of Lake Malawi, Tanzanian Northern Basin: local versus global\
          \ considerations. HESS Discussions 7, 4371-4409."
        url: "https://doi.org/10.5194/hessd-7-4371-2010"
        accessed: "2026-10-13"
      - kind: "literature"
        title: "Vollmer et al. (2005). Deep-water warming trend in Lake Malawi, East Africa"
        url: "https://doi.org/10.4319/lo.2005.50.2.0727"
        accessed: "2026-10-13"
  sizeAndGrowth:
    text: "Plan for approximately 17 cm males and 15 cm females. Published lengths vary by source and measurement\
      \ convention, and female size is less securely established. Growth should be assessed through condition and\
      \ appropriate space rather than a fixed timetable. The seven-to-ten-year lifespan interval is a weak retail\
      \ estimate without verified ages."
    sources:
      - kind: "database"
        title: "AquaInfo: Tramitichromis intermedius, by John de Lange"
        url: "https://aquainfo.nl/en/article/tramitichromis-intermedius"
        accessed: "2026-10-13"
      - kind: "database"
        title: "FishBase species summary: Tramitichromis intermedius"
        url: "https://www.fishbase.se/summary/Tramitichromis-intermedius.html"
        accessed: "2026-10-13"
      - kind: "database"
        title: "FishProfiles: Tramitichromis intermedius"
        url: "https://fishprofiles.com/profiles/freshwater/Cichlids/Tramitichromis_intermedius"
        accessed: "2026-10-13"
      - kind: "website"
        title: "Nicks Aquarium Oceanarium Terrarium. Kamberi Intermedius Cichlid care table"
        url: "https://nicksaquariumoceanariumterrarium.com.au/products/kamberi-intermedius-cichliid-tramitichromis-intermedius"
        accessed: "2026-10-13"
  husbandry:
    text: "For one male and three females, the profile uses a provisional 400 L aquarium with a base at least 150\
      \ cm long and 50 cm deep. Published recommendations range from a much smaller starting tank to 600 L, so this\
      \ design has low confidence and should be enlarged for a community or additional males. Leave substantial\
      \ fine sand accessible and place secure refuge rocks toward the margins. Maintain clean, oxygenated water\
      \ with effective filtration and regular partial changes. A steady 24 to 26 C is better supported for routine\
      \ care than continuous use of the seasonal extremes."
    sources:
      - kind: "database"
        title: "AquaInfo: Tramitichromis intermedius, by John de Lange"
        url: "https://aquainfo.nl/en/article/tramitichromis-intermedius"
        accessed: "2026-10-13"
      - kind: "database"
        title: "Seriously Fish: Tramitichromis intermedius"
        url: "https://www.seriouslyfish.com/species/tramitichromis-intermedius"
        accessed: "2026-10-13"
      - kind: "database"
        title: "Einrichtungsbeispiele. Tramitichromis intermedius husbandry recommendations"
        url: "https://www.einrichtungsbeispiele.de/zierfische/malawisee/tramitichromis-intermedius-slnk.html"
        accessed: "2026-10-13"
      - kind: "database"
        title: "OATA care sheet: How to look after African Malawi Cichlids"
        url: "https://ornamentalfish.org/what-we-do/advice-information/care-sheets/caresheets-tropical-freshwater-fish/how-to-look-after-african-malawi-cichlids"
        accessed: "2026-10-13"
      - kind: "model-knowledge"
        title: "Adjudicator interpretation of aquarium space and feeding competition; no direct measurement"
        accessed: "2026-10-13"
  socialBehavior:
    text: "A mature male can pursue females and exclude rivals around a breeding area. Three females distribute\
      \ that attention but remain a practical interpretation of several rather than a tested ratio. Refuge routes\
      \ and usable floor area matter alongside the number of fish. A second mature male needs substantially more\
      \ room. Away from spawning activity, calm mixed-species behaviour is repeatedly described."
    sources:
      - kind: "database"
        title: "Seriously Fish: Tramitichromis intermedius"
        url: "https://www.seriouslyfish.com/species/tramitichromis-intermedius"
        accessed: "2026-10-13"
      - kind: "database"
        title: "AquaInfo: Tramitichromis intermedius, by John de Lange"
        url: "https://aquainfo.nl/en/article/tramitichromis-intermedius"
        accessed: "2026-10-13"
      - kind: "database"
        title: "FishProfiles: Tramitichromis intermedius"
        url: "https://fishprofiles.com/profiles/freshwater/Cichlids/Tramitichromis_intermedius"
        accessed: "2026-10-13"
      - kind: "database"
        title: "Aquainfo.dk. Tramitichromis intermedius care table and keeper observations"
        url: "https://aquainfo.dk/en/tramitichromis-intermedius"
        accessed: "2026-10-13"
  diet:
    text: "Offer small aquatic invertebrates and appropriately sized sinking complete food in restrained portions.\
      \ Insect larvae, crustaceans and worms fit the reported natural prey. Check that every fish reaches food when\
      \ sharing with quicker companions. The fish is classed as an invertivore, with no demonstrated special high-protein\
      \ bloat susceptibility. Its predation grade is 0 because fish hunting was not established; incidental fry\
      \ uptake and stress-related brood loss remain possible."
    sources:
      - kind: "database"
        title: "FishBase species summary: Tramitichromis intermedius"
        url: "https://www.fishbase.se/summary/Tramitichromis-intermedius.html"
        accessed: "2026-10-13"
      - kind: "database"
        title: "FishProfiles: Tramitichromis intermedius"
        url: "https://fishprofiles.com/profiles/freshwater/Cichlids/Tramitichromis_intermedius"
        accessed: "2026-10-13"
      - kind: "database"
        title: "AquaInfo: Tramitichromis intermedius, by John de Lange"
        url: "https://aquainfo.nl/en/article/tramitichromis-intermedius"
        accessed: "2026-10-13"
      - kind: "database"
        title: "Seriously Fish: Tramitichromis intermedius"
        url: "https://www.seriouslyfish.com/species/tramitichromis-intermedius"
        accessed: "2026-10-13"
  breeding:
    text: "The male prepares a sand display structure and courts females. After laying, the female collects and\
      \ incubates the developing brood, with hobby accounts describing release after about three to four weeks.\
      \ Brooding females need relief from persistent attention and disturbance. Fry survival in an adult community\
      \ is unreliable, even though ordinary fish hunting by this species has not been demonstrated. A separately\
      \ established nursery offers more control when young are to be raised."
    sources:
      - kind: "literature"
        title: "Ripley and Lobel (2005). Reproductive behavior of the Lake Malawi cichlid fish, Tramitichromis intermedius.\
          \ Environmental Biology of Fishes 73, 171-180. Abstract only."
        url: "https://doi.org/10.1007/s10641-004-5567-5"
        accessed: "2026-10-13"
      - kind: "database"
        title: "Seriously Fish: Tramitichromis intermedius"
        url: "https://www.seriouslyfish.com/species/tramitichromis-intermedius"
        accessed: "2026-10-13"
      - kind: "database"
        title: "FishProfiles: Tramitichromis intermedius"
        url: "https://fishprofiles.com/profiles/freshwater/Cichlids/Tramitichromis_intermedius"
        accessed: "2026-10-13"
      - kind: "database"
        title: "AquaInfo: Tramitichromis intermedius, by John de Lange"
        url: "https://aquainfo.nl/en/article/tramitichromis-intermedius"
        accessed: "2026-10-13"
  sexing:
    text: "Colour is most useful in mature dominant males, which usually show stronger green-blue iridescence and\
      \ red markings than females. Females and juveniles are more subdued, and a subordinate male can also appear\
      \ dull. The flank spots can occur in both sexes and fade in a displaying male. Size and colour support adult\
      \ identification but do not reliably determine an exact harem from young stock."
    sources:
      - kind: "database"
        title: "FishProfiles: Tramitichromis intermedius"
        url: "https://fishprofiles.com/profiles/freshwater/Cichlids/Tramitichromis_intermedius"
        accessed: "2026-10-13"
      - kind: "database"
        title: "AquaInfo: Tramitichromis intermedius, by John de Lange"
        url: "https://aquainfo.nl/en/article/tramitichromis-intermedius"
        accessed: "2026-10-13"
      - kind: "database"
        title: "Akvaforum fish database: Tramitichromis intermedius"
        url: "https://akvaforum.no/lex/fish.cfm/2422/Tramitichromis-intermedius"
        accessed: "2026-10-13"
  compatibility:
    text: "Choose quiet Malawi companions that leave feeding and breeding space available; a species-only aquarium\
      \ is optional. Generic recommendations for Aulonocara have a specific exception here: laboratory crosses with\
      \ A. baenschi produced fertile descendants. A second laboratory pairing with Maylandia zebra yielded adult\
      \ F1 fish, and boisterous mbuna also create social and feeding problems. Both named hybrid groups are presumed\
      \ because free parental partner choice was not established. Their risk must not be extended to every peacock,\
      \ all Lethrinops, or T. brevis without additional evidence."
    sources:
      - kind: "database"
        title: "Seriously Fish: Tramitichromis intermedius"
        url: "https://www.seriouslyfish.com/species/tramitichromis-intermedius"
        accessed: "2026-10-13"
      - kind: "database"
        title: "AquaInfo: Tramitichromis intermedius, by John de Lange"
        url: "https://aquainfo.nl/en/article/tramitichromis-intermedius"
        accessed: "2026-10-13"
      - kind: "literature"
        title: "Carleton et al. (2010). Genetic basis of differential opsin gene expression in cichlid fishes"
        url: "https://doi.org/10.1111/j.1420-9101.2010.01954.x"
        accessed: "2026-10-13"
      - kind: "literature"
        title: "OQuin et al. (2012). Evolution of cichlid vision via trans-regulatory divergence"
        url: "https://doi.org/10.1186/1471-2148-12-251"
        accessed: "2026-10-13"
      - kind: "literature"
        title: "Patil et al. (2020). Genome-enabled inference of functional genetic variants in the face, brain\
          \ and behavior. Preprint, supplementary Table 5"
        url: "https://doi.org/10.1101/2020.10.12.336453"
        accessed: "2026-10-13"
      - kind: "literature"
        title: "Patil et al. (2021). Genome-enabled discovery of evolutionary divergence in brains and behavior"
        url: "https://doi.org/10.1038/s41598-021-92385-8"
        accessed: "2026-10-13"
  problems:
    text: "Poor access to food, persistent hiding or loss of condition can indicate social suppression. Crowded\
      \ spawning space can concentrate chasing, while unsuitable sharp substrate interferes with normal foraging.\
      \ Keep water conditions stable and check filtration and oxygenation when behaviour changes. The GH tolerance\
      \ of 3 to 25 dGH and KH tolerance of 5 to 12 dKH are provisional husbandry envelopes, not demonstrated lifelong\
      \ endpoint limits. Investigate persistent illness with qualified help rather than treating the bloat flag\
      \ as a diagnosis."
    sources:
      - kind: "database"
        title: "Seriously Fish: Tramitichromis intermedius"
        url: "https://www.seriouslyfish.com/species/tramitichromis-intermedius"
        accessed: "2026-10-13"
      - kind: "database"
        title: "AquaInfo: Tramitichromis intermedius, by John de Lange"
        url: "https://aquainfo.nl/en/article/tramitichromis-intermedius"
        accessed: "2026-10-13"
      - kind: "database"
        title: "OATA care sheet: How to look after African Malawi Cichlids"
        url: "https://ornamentalfish.org/what-we-do/advice-information/care-sheets/caresheets-tropical-freshwater-fish/how-to-look-after-african-malawi-cichlids"
        accessed: "2026-10-13"

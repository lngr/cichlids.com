  ghDgh:
    value:
      min: 3
      max: 5
    confidence: "high"
    rationale: "The lake decision is 3 to 5 dGH. FAO calcium and magnesium values yield about 3.2 to 4.9 dGH and\
      \ the paired northern upper-water samples in Branchu yield about 4.2 to 4.6 dGH. Alkaline pH and bicarbonate\
      \ buffering do not make the lake high in calcium-magnesium hardness."
    sources:
      - kind: "literature"
        title: "Vanden Bossche and Bernacsek (1990). Source book for the inland fishery resources of Africa, Vol.\
          \ 1, Lake Malawi/Nyasa physical and chemical data."
        url: "https://www.fao.org/4/t0473e/T0473E05.htm"
        accessed: "2026-10-13"
      - kind: "literature"
        title: "Branchu et al. (2010). Hydrochemistry of Lake Malawi, Tanzanian Northern Basin: local versus global\
          \ considerations. HESS Discussions 7, 4371-4409."
        url: "https://doi.org/10.5194/hessd-7-4371-2010"
        accessed: "2026-10-13"
    evidence:
      - source:
          kind: "literature"
          title: "Vanden Bossche and Bernacsek (1990). Source book for the inland fishery resources of Africa, Vol.\
            \ 1, Lake Malawi/Nyasa physical and chemical data."
          url: "https://www.fao.org/4/t0473e/T0473E05.htm"
          accessed: "2026-10-13"
        value:
          min: 3.2
          max: 4.9
        note: "Calculated from compiled calcium and magnesium using dGH = Ca/7.14 + Mg/4.34, with ions in mg/L."
      - source:
          kind: "literature"
          title: "Branchu et al. (2010). Hydrochemistry of Lake Malawi, Tanzanian Northern Basin: local versus global\
            \ considerations. HESS Discussions 7, 4371-4409."
          url: "https://doi.org/10.5194/hessd-7-4371-2010"
          accessed: "2026-10-13"
        value:
          min: 4.2
          max: 4.6
        note: "Calculated from paired calcium and magnesium observations in the upper 50 m."
    tolerance:
      value:
        min: 3
        max: 25
      confidence: "low"
      rationale: "Generator proposed 3 to 15 dGH; checker-a, checker-b, checker-c, tiebreaker-1 and tiebreaker-2\
        \ proposed 3 to 25. The tally decides 3 to 25 by a five-of-six qualified majority with low confidence. Seriously\
        \ Fish and Aquainfo.dk give 10 to 25, FishProfiles 9 to 15, AquaInfo 12 to 16, Einrichtungsbeispiele 5 to\
        \ 15 and Malawi.si 3 to 15. Akvaforum gives the wider 10 to 30 dGH recommendation, whose 30 endpoint is\
        \ not adopted by the tally. The natural minimum of 3 is included rather than treating harder aquarium targets\
        \ as a physiological minimum. Source independence and multiyear endpoint trials are unverified."

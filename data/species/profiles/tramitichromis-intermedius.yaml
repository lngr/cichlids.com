      \ and O'Quin produced F1 and mature F2 descendants of intermedius males crossed with baenschi females; Schulte\
      \ and Sandkam used related research pedigrees rather than independent mate-choice replications. Patil preprint\
      \ supplementary Table 5 identifies adult F1 zebra male x intermedius female offspring, while the published\
      \ study describes the associated behaviour experiment. Neither establishes access to parental conspecific\
      \ mates, so both groups have presumed basis; zebra F1 fertility is not established. GEO returned a browser\
      \ check and was not read or cited. A tentative unnamed Lethrinops warning and anatomical similarity to T.\
      \ brevis establish no additional pair or all-to-all group."

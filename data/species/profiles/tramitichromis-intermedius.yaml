      rationale: "Generator, checker-b and checker-c proposed 7.5 to 8.8; checker-a proposed 7.6 to 8.8. Their differences\
        \ meet the tally agreement threshold and the decided interval is 7.5 to 8.8, unanimous with medium confidence.\
        \ AquaInfo and Aquainfo.dk give 7.5 to 8.5, Seriously Fish 7.6 to 8.8. FishProfiles gives 8 to 9, a wider\
        \ upper endpoint than the decision; 9 is not retained without stronger long-term support. These are husbandry\
        \ recommendations rather than measured physiological limits."

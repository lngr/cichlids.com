        - "Monkey Bay"
        - "Fort Johnson"
        - "Southwest Arm"
        - "Senga Bay"
    confidence: "high"
    rationale: "All runs agree on Lake Malawi endemism. Generator and checker-c emphasise the southern arms; checker-a\
      \ gives the type region and checker-b also includes Senga Bay. FishBase and CLOFFA restrict their distribution\
      \ account to the southern arms, whereas Oliver reports a broader distribution and an identified underwater\
      \ photograph at Senga Bay. The value therefore uses Lake Malawi without declaring southern confinement; the\
      \ extent of lake-wide occurrence remains unresolved. Type places and the photographed locality are distinguished\
      \ from an exhaustive collecting list."

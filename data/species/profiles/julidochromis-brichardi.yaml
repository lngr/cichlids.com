  compatibility:
    text: "Selected Tanganyikan companions can share a sufficiently spacious aquarium with a pair when their\
      \ territories and escape routes are separate. Open-water Cyprichromis offer less direct competition for\
      \ caves. Shell dwellers require a distinct shell area, and other rock dwellers need substantially more\
      \ room and independent retreats. These are conditional possibilities rather than guaranteed combinations.\
      \ Avoid overlap with another cave-spawning pair in the same small rock pile. No hybrid group is assigned\
      \ because no specific cross was established in the reviewed material; the genus transfer alone is not\
      \ evidence of crossing."
    sources:

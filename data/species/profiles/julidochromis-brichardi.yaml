  habitat:
    text: "Rock and rubble provide the feeding surfaces and cavities used by this species around Lake Tanganyika.\
      \ The type locality is near Rutunga and Magara in Burundi at 8 to 9 m. Field observations also include\
      \ mixed shore habitat with sand and gravel. NCS describes sediment-rich upper rocks, whereas CRC classifies\
      \ the habitat as sediment-free rocky; these broad labels differ, so a particular sediment condition is\
      \ not treated as universal. The natural ranges used here are 23 to 29 C, pH 8.4 to 9.4, GH 10 to 13 dGH\
      \ and KH 15 to 20 dKH. These regional measurements describe lake water rather than aquarium failure limits.\
      \ Ndobhoi and bifrenatus have disputed species boundaries and are not included as settled variants."

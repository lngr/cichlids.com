    tolerance:
      value:
        min: 22
        max: 30
      confidence: low
      rationale: "The tally decides 22 to 30 C with unanimous agreement within the 1 C comparison threshold,\
        \ four of four votes, and low confidence. Generator, checker-b and checker-c propose 22 to 30 C; checker-a\
        \ proposes 22 to 29 C. Species care sources give 24 to 27 C or 24 to 27.5 C, and the breeding account\
        \ reports 78 to 82 F, about 25.6 to 27.8 C. The wider decided envelope contains the full 23 to 29 C\
        \ natural range and modest margins inferred from Tanganyika keeping practice. Its endpoints are not\
        \ measured long-term failure limits; routine keeping near 24 to 27 C is better supported."

      \ brine shrimp, flakes, pellets and frozen food; checker-b lists crustaceans, insects and rock-associated\
      \ invertebrates; checker-c lists small crustaceans, insects and rock-associated invertebrates. The full\
      \ decided food value follows the tally. NCS also reports small snails. Occasional plant material or prepared\
      \ food does not establish an aufwuchs specialization. Fischlex calls the species omnivorous, but offers\
      \ no traceable diet measurement. No source demonstrates the protein-associated bloat syndrome intended\

  social:
    value:
      structure: pair
    confidence: medium
    rationale: "All four runs recommend a pair as the practical aquarium unit. Tanganyika.si and direct breeding\
      \ observations support keeping one compatible male and female, with surplus adults displaced. CRC classifies\
      \ the mating system as polyandrous, and NCS reports that natural pairs need not remain together after\
      \ brood care; neither establishes a permanent monogamous bond. Aqua-fish instead suggests one male with\
      \ several females, but its ratio is not quantified and the inherited ratio-three evidence is an agent\
      \ interpretation. The direct account of extra-female conflict supports a pair rather than adopting that\
      \ harem proposal."

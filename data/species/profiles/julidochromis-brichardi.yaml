    rationale: "The settled tally method is unanimous. The four runs agree on invertivore and bloatSensitive\
      \ false; the tally keeps high confidence, supported by high-trust FishBase and CRC evidence. Their food\
      \ lists differ: generator names small crustaceans, insect larvae and other small invertebrates; checker-a\
      \ lists aquarium foods including mysis, krill, brine shrimp, flakes, pellets and frozen food; checker-b\
      \ lists crustaceans, insects and rock-associated invertebrates; checker-c lists small crustaceans, insects\
      \ and rock-associated invertebrates. The full decided food value follows the tally. NCS also reports\
      \ small snails. Occasional plant material or prepared food does not establish an aufwuchs specialization.\
      \ Fischlex calls the species omnivorous, but offers no traceable diet measurement. No source demonstrates\
      \ the protein-associated bloat syndrome intended by this flag."

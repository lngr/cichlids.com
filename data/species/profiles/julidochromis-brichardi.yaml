    tolerance:
      value:
        min: 9
        max: 20
      confidence: low
      rationale: "The settled tally gives 9 to 20 dKH by qualified-majority, four agreeing votes of six, with\
        \ low confidence. Generator proposes 12 to 22; checker-a proposes 10 to 20; checker-b and checker-c\
        \ each propose 12 to 25; tiebreaker-1 and tiebreaker-2 each propose 8 to 20. Agreement uses a 2 dKH\
        \ threshold: generator, checker-a and both tiebreakers fall within 2 dKH of the checker-a 10 to 20\
        \ proposal, and those agreeing minima and maxima have medians of 9 and 20. Thus 9 is a synthesis, not\
        \ a directly measured lower failure point. PFK recommends 8 to 18 dKH for Tanganyikans, Sera 8 to 10,\
        \ LICG 8 to 20, and Abysse gives KH 10 for this species. These sources make the broader lower-end proposal\
        \ of 8 plausible but do not establish species-specific long-term limits. The 20 upper bound contains\
        \ the natural 15 to 20 dKH range; no read source supports the proposed wider upper limits of 22 or\
        \ 25. Fischlex claims 7 to 16 dKH in explicitly AI-generated content without a traceable measurement;\
        \ that wider lower-end claim is retained but has little evidential weight. FishBase hardness is not\
        \ KH, and derived GH-based entries are retained as inferences only."

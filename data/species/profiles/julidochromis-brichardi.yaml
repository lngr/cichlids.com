  sizeAndGrowth:
    text: "Approximate usual adult maxima are 12.5 cm for males and 10.5 cm for females. These figures are\
      \ the medians of the independent proposals, not measurements precise to half a centimetre. FishBase gives\
      \ 12 cm total length for males or unsexed fish, a field paper reports about 14 cm, and specialist aquarium\
      \ accounts reach 16 cm. Reports that males grow larger support the direction of the difference, but no\
      \ dependable female-specific maximum was found. A lifespan of 5 to 8 years is a provisional care-sheet\
      \ expectation; a dealer also claims 15 years without an individual age record."
    sources:

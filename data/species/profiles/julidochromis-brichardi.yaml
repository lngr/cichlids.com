  ghDgh:
    value:
      min: 10
      max: 13
    confidence: high
    rationale: "The settled natural range is 10 to 13 dGH, with high confidence and waterbody verification.\
      \ Plisnier (1996, TD/56) reports station surface means of calcium 10.9 to 11.6 mg/L and magnesium 41.2\
      \ to 43.2 mg/L, equivalent to about 11.1 to 11.5 dGH. Regional chemistry compiled in the lake studies\
      \ supports a rounded 10 to 13 dGH envelope. FishBase reports a wider 9 to 19 dH range; it is retained\
      \ but does not replace measured habitat chemistry. General hardness measures calcium and magnesium, not\
      \ alkalinity. Cohen et al. (1997) remains an inherited chemistry citation; the current fetch-oa check\
      \ did not authorize its full text as open access, so no new measurements are attributed to that unread\
      \ text in this adjudication."

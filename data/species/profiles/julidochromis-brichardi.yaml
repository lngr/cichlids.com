  husbandry:
    text: "Provide at least 150 litres for one compatible pair, with an estimated footprint of 90 by 40 cm.\
      \ Build secure rockwork with several cavities and routes out of sight of a dominant fish. The footprint\
      \ is a practical layout estimate, and a community requires additional room. Routine aquarium recommendations\
      \ cluster around 24 to 27 C with alkaline, buffered water. The broader compatibility tolerances are 22\
      \ to 30 C, pH 8.0 to 9.4, GH 9 to 19 dGH and KH 9 to 20 dKH. Several bounds are inferred rather than\
      \ measured long-term limits, especially KH. Keep water quality and chemistry steady, and maintain filtration\
      \ and oxygenation appropriate to the stock."

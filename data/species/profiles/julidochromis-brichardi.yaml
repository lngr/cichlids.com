      \ reports prolonged harassment of a female and severe damage to an extra male when two pairs occupied\
      \ one aquarium. It supports persistent chasing and the need to separate incompatible adults. The rubric\
      \ is assessed for one compatible pair in a suitable tank: the evidence does not establish unavoidable\
      \ killing or permanent injury in that recommended unit. Level 3 is retained, with the severe incidents\
      \ and level-4 interpretations preserved in evidence. A juvenile stocking plan in the legacy archive is\
      \ not an observed aggression outcome."

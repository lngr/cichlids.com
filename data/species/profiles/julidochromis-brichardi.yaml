  diet:
    text: "Most food is obtained by searching rock surfaces and crevices for small invertebrates. Crustaceans,\
      \ insect larvae and small snails are among the reported foods. Offer appropriately sized prepared food\
      \ supplemented with varied small frozen invertebrates. Incidental algae or sponge material does not make\
      \ this a specialist algae grazer. No species-specific evidence establishes the high-protein bloat sensitivity\
      \ represented by the planner flag. Predation level 0 describes the absence of routine fish hunting; it\
      \ does not guarantee that every fry will survive with adults."

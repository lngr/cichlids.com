  socialBehavior:
    text: "A pair can cooperate over a clutch and still become incompatible between broods. A published aquarium\
      \ account describes a dominant male injuring another male and repeatedly harassing his mate, with several\
      \ separations required. Juveniles may initially grow together, but extra adults need another home once\
      \ rivalry develops. Pair keeping is the recommended management unit, not a claim of lifelong monogamy:\
      \ CRC describes polyandrous mating and NCS reports that natural pair associations may end after brood\
      \ care. Cave occupation and conflict can continue outside spawning periods."
    sources:

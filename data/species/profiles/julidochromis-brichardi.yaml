  sexing:
    text: "Both sexes share the pale adult body and dark head markings. Males are often reported larger and\
      \ may develop a more pronounced forehead, but these tendencies do not reliably sex individual juveniles.\
      \ Care accounts disagree over the usefulness of external sexing. Two fish selected by apparent size alone\
      \ may be the same sex or an incompatible pair. Any attempt to let a pair form from juveniles needs space\
      \ for the fish that are excluded."

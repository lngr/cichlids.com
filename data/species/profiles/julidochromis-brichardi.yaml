  khDkh:
    value:
      min: 15
      max: 20
    confidence: high
    rationale: The settled natural range is 15 to 20 dKH with high confidence. The FAO sampling programme and
      the limnological synthesis by Langenberg distinguish alkalinity from calcium and magnesium hardness.
      Alkalinity near 6.5 to 6.9 meq/L converts to about 18.2 to 19.3 dKH; the wider annual titration observations
      give the rounded 15 to 20 dKH envelope. Local inflow readings of 4 to 5 meq/L are not representative
      of the rocky lake habitat. This natural feature intentionally carries no verification object.
    sources:
    - kind: literature
      title: Plisnier et al. (1996). Limnological sampling during an annual cycle at three stations on Lake

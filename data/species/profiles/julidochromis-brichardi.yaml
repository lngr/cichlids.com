partners:
  suitable:
  - species: Cyprichromis leptosoma
    reason: Open-water swimming reduces direct competition for the defended cave.
    condition: A substantially larger community tank with unobstructed open water and space to escape the pair.
  - species: Neolamprologus similis
    reason: A separate shell area can keep its territory away from the cave pair.
    condition: A larger community layout with distinct shell and rock zones; monitor displacement.
  - species: Altolamprologus calvus
    reason: A conditional option in a spacious Tanganyika community with independent shelters.
    condition: Separate rock structures and ample space beyond the single-pair minimum; eggs and fry may be
      eaten.
  unsuitable:
  - species: Julidochromis ornatus
    reason: "In the same small rock pile, two cave-spawning pairs compete for cover and territory."
  - species: Neolamprologus leleupi
    reason: Overlapping cave territories can cause sustained conflict in a tank near the pair minimum.
  - species: Tropheus moorii
    reason: Its usual plant-focused feeding regimen complicates providing an invertebrate-rich diet for this
      species; coexistence reports do not resolve that feeding mismatch.
profile:
  overview:
    text: "The dark facial markings of Julidochromis brichardi stand out against its pale body. This Lake Tanganyika\
      \ endemic is still widely listed under Chalinochromis brichardi, its original combination. It searches\
      \ rocky surfaces for small animal prey and breeds in sheltered cavities. One compatible adult pair is\
      \ the recommended aquarium unit. Feeding is usually straightforward, but adult rivalries and changing\
      \ pair relationships require close observation and enough separate retreats."
    sources:
    - kind: catalog-of-fishes
      title: "Eschmeyer's Catalog of Fishes, Julidochromis brichardi entry"
      url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Julidochromis&species=brichardi"

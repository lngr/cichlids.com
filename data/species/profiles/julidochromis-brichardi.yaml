  breeding:
    text: "Eggs are attached inside a sheltered rock cavity or similar enclosed surface. Aquarium pairs have\
      \ also spawned in clay pots. Both parents take part in protection, with the female usually closer to\
      \ the clutch and the male defending the surroundings. Guarding a brood can intensify territorial disputes.\
      \ Older offspring can lose parental tolerance and need separate growing space. Sources give different\
      \ brood counts and timings, so neither a fixed clutch size nor a universal timetable is assumed here."
    sources:

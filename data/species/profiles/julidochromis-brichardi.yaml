    rationale: "The component medians are 12.5 cm male and 10.5 cm female: generator proposes 13/12, checker-a\
      \ 12/11, checker-b 13/10 and checker-c 12/10. FishBase reports 12 cm total length for males or unsexed\
      \ fish, Aqua-fish gives usual aquarium lengths of 10 to 12 cm, and NCS and Tanganyika.si give an upper\
      \ aquarium size of 16 cm. Kullander et al. observed wild fish up to about 14 cm total length; preserved\
      \ standard lengths are a different measure. Abysse lists 13 to 15 cm without sex resolution. The medians\
      \ describe approximate usual adult maxima rather than the largest reports, and the 16 cm upper observation\
      \ remains visible. Males are reported larger, but the female estimate is not a measured sex-specific\
      \ maximum; the half-centimetre figures express the proposal medians rather than measurement precision."

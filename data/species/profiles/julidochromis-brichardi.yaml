    rationale: "Generator, checker-a and checker-c propose 2; checker-b proposes 3. Reports support defending\
      \ a rocky nesting area and chasing intruders, while a direct breeding report records coexistence with\
      \ Aulonocranus dewindti in a larger tank. Low-trust care pages and encyclopedia summaries describe stronger\
      \ aggression but do not establish attacks beyond the territory as normal in an adequate aquarium. Level\
      \ 2 best represents territorial exclusion for the recommended pair; spawning and overlapping caves can\
      \ make individual combinations unsafe. All stronger and milder source interpretations are retained."

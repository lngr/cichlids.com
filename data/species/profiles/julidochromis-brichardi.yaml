  ph:
    value:
      min: 8.4
      max: 9.4
    confidence: high
    rationale: "The settled natural range is pH 8.4 to 9.4, with high confidence and waterbody verification.\
      \ Plisnier et al. (1996) measured 8.47 to 9.40 at 40 m over a yearly cycle, while surface observations\
      \ cluster around 8.8 to 9.2. FishBase gives the differently bounded 8.0 to 9.0 interval. The older FAO\
      \ source-book report of 7.3 to 7.8 is retained as conflicting evidence but is inconsistent with modern\
      \ sampling and is not used for this lake-wide natural range."
    sources:
    - kind: literature
      title: Plisnier et al. (1996). Limnological sampling during an annual cycle at three stations on Lake
        Tanganyika (1993-1994). FAO/FINNIDA TD/46
      url: "https://fao.org/fishery/static/LTR/FTP/TD46.PDF"

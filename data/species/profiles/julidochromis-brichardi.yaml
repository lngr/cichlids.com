  problems:
    text: "Repeated chasing, damaged fins and a fish confined to a corner indicate that the social arrangement\
      \ needs intervention. Do not assume that a previous spawning proves a pair will remain compatible. The\
      \ same cave used successfully by a pair can become a trap for a subordinate adult without another exit.\
      \ Sudden water changes in chemistry and neglected water quality add stress. Reports of compatibility\
      \ with plant-feeding Tropheus do not remove the practical feeding conflict between their usual diet and\
      \ this invertebrate feeder. No particular disease syndrome is established by the reviewed species accounts."

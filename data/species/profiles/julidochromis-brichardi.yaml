  note: "The Catalog of Fishes accepts Julidochromis brichardi following Konings (2023). The old Chalinochromis\
    \ genus query returns no species, and both the Julidochromis genus list and the exact brichardi entry confirm\
    \ the current combination. Both genus queries and the species record were accessed on 2026-10-15 and are\
    \ retained among the overview sources. CRC uses Julidochromis, while FishBase retains Chalinochromis. Ndobhoi\
    \ and bifrenatus are disputed trade forms with different taxonomic treatments, so neither is presented\
    \ as an established color variant of this profile."

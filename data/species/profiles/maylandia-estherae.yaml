  ghDgh:
    value:
      min: 3
      max: 5
    confidence: high
    rationale: Lake endemic; the value is the Lake Malawi total hardness of the waterbody table (entry lake-malawi), computed from measured calcium and magnesium. Lake Malawi is soft water; the 10 to 25 dGH of care sheets confuse hardness with alkalinity and are no habitat value.
    sources: *a19
    evidence:
      - source: *a21
        value:
          min: 4.2
          max: 4.6
        note: north basin, upper 50 m, from Ca and Mg
      - source: *a20
        value:
          min: 3.2
          max: 4.9
        note: 1960s titrations, from Ca and Mg
    verification:
      method: waterbody
      waterbody: lake-malawi
    tolerance:
      value:
        min: 3
        max: 25
      confidence: medium
      rationale: "The lake water is soft, 3 to 5 dGH, while care sheets recommend about 10 to 25 dGH; Seriously Fish, Garnelio and FishKeeper name 25 dGH as the upper limit. The high values reflect that hobby sources confuse hardness with alkalinity: the fish need a stable high pH and carbonate buffer, not much calcium and magnesium. The tolerance therefore spans the lake values up to the highest recommended aquarium hardness. A breeder gives 5 dGH as the lower limit and an archive tank with the species ran at 5 dGH, which supports the soft end. A single Garnelio page with up to 30 dGH is left out."

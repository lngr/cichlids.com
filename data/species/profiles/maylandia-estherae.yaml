    - name: Pseudotropheus estherae Konings, 1995
      note: Original combination; type locality Minos Reef, Miluluka, Mozambique.
    - name: Metriaclima estherae (Konings, 1995)
      note: Combination used by Stauffer et al. (1997), Konings and Stauffer (2006) and much of the aquarium literature; the Catalog of Fishes treats Metriaclima as Maylandia.
  legacyNames:
    - Metriaclima estherae
    - Pseudotropheus estherae
  note: The Catalog of Fishes lists the current status as valid as Maylandia estherae (Konings 1995) and files the genus names Metriaclima and Pseudotropheus (for this species) under Maylandia. The legacy catalog held the species twice, under Metriaclima and Pseudotropheus; both entries map to this profile. The Cichlid Room Companion uses Metriaclima estherae, Seriously Fish files it under Pseudotropheus, which reflects older placements.

    rationale: "A conservative decision: the votes split three to three between level 0 and level 1, and the vote count takes the higher level. The sources split along the same line. Field data put the species at level 0: the original description and Konings and Stauffer (2006) describe the zebra-complex feeding mode of combing loose material from the algae on the rocks, FishBase gives algae as food and a trophic level of 2.0, the Cichlid Room Companion classes it as an algae comber, and studies of the close relative M. zebra (stomach contents mainly diatoms, stable isotopes showing much plankton, a trophic overview listing aufwuchs, zooplankton and invertebrates) contain no fish. Aquarium reports point to level 1: Seriously Fish warns of fry predation when a holding female is moved, Gensou notes that mbuna tankmates eat released juveniles, and the cichlids.com archive reports that released fry survive only where rockwork keeps the adults away and that a female ate her own brood. No source reports hunting of fish larger than fry, so levels 2 and 3 are excluded, and fish above about 2 cm are not at risk."

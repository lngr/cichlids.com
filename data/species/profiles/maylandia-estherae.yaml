partners:
  suitable:
    - species: Melanochromis cyaneorhabdos
      reason: Similar-sized mbuna with a black and blue striped pattern, so males do not treat it as a rival, and a compatible plant-rich diet.
      condition: Tank of at least 150 cm with a harem of each species.
    - species: Pseudotropheus sp. 'Acei'
      reason: Robust but fairly calm mbuna of similar size that lives higher in the water, with a vegetarian diet and a different look.
      condition: Group of at least five Acei in a tank of 150 cm or more.
    - species: Labeotropheus trewavasae
      reason: Robust aufwuchs grazer of similar size with a different body shape; it holds its own against Maylandia males.
      condition: Avoid if OB females of both species are kept, since they look alike; 150 cm tank.
    - species: Synodontis multipunctatus
      reason: Tough bottom-dwelling catfish from Lake Tanganyika that tolerates the same alkaline, well-buffered tank water and is ignored by mbuna.
      condition: Group of several; it may eat mbuna eggs and slip its own eggs into holding females.
  unsuitable:
    - species: Maylandia zebra
      reason: Same hybrid group; the species cross readily and the barred males provoke rival fights.
    - species: Maylandia callainos
      reason: Same hybrid group and nearly identical shape and colour; hybrids are common in the trade.
    - species: Maylandia lombardoi
      reason: Same hybrid group and a more aggressive species of the same size.
    - species: Aulonocara stuartgranti
      reason: Peaceful peacock cichlid that is harassed by mbuna and needs a protein-rich diet that causes bloat in the red zebra.
    - species: Copadichromis borleyi
      reason: Peaceful open-water utaka that suffers from the constant aggression of mbuna.
    - species: Symphysodon aequifasciatus
      reason: Soft acidic water, very different temperament and slow feeding; it would be stressed and starved.
profile:
  overview:
    text: The red zebra is a small rock-dwelling cichlid, a mbuna, from the Mozambican shore of Lake Malawi. It was exported for decades as a colour form of the zebra cichlid before Ad Konings described it as a species in 1995 and named it after Esther Grant, wife of the exporter Stuart Grant. Its valid name is Maylandia estherae; aquarium books also call it Metriaclima or Pseudotropheus estherae. Wild males are plain light blue, while most females are bright orange, and captive breeding has produced fully orange males that now dominate the trade. The species is hardy, colourful and active, and suits a crowded mbuna tank with plenty of rock, a mainly vegetable diet and one male per group of females. It crosses easily with related Maylandia, so it should not share a tank with them.
    sources:
      - *a1
      - *a2
      - *a25
      - *a4
      - *a3
  habitat:
    text: "The species lives only along a short stretch of the eastern coast of Lake Malawi, mostly in Mozambique. Known populations sit on Chilucha Reef off Metangula, on several reefs about 7 km offshore near Meluluca, including the type locality Minos Reef, and further south towards the border with Malawi. These reefs are piles of rock free of sediment, and the fish are most numerous shallower than 10 m, although rocks at Chilucha Reef reach far deeper. The lake water is soft but alkaline: total hardness of about 3 to 5 dGH, carbonate hardness of 5 to 8 dKH, pH 7.7 to 8.6 and temperatures between 21 and 29 C over the year. In the aquarium the species stays healthy over a wider span of about 3 to 25 dGH, 5 to 15 dKH and pH 7.5 to 8.8, as long as the water stays stable, alkaline and clean."
    sources:
      - *a2
      - *a25
      - *a4
      - *a20
      - *a21
      - *a5
      - *a10
      - *a13
  sizeAndGrowth:
    text: "Wild red zebras are small: the largest male of the type series measured just under 10 cm total length and the female holotype about 8 cm. In the aquarium they grow larger, and a well-fed male typically reaches about 12 cm while females stay at about 10 cm. Occasional males reach 13 to 14 cm. Growth is quick, and young fish show their sex by colour early: in the wild-type form blue juveniles become males and orange ones females, and in mixed broods differences become visible at around 5 cm. Overfeeding speeds up growth but shortens life, so a lean diet is better than a rich one."
    sources:
      - *a2
      - *a25
      - *a4
      - *a17
      - *a8
      - *a27
  husbandry:
    text: A harem of one male and three or more females needs a tank of at least 120 cm length and about 200 litres; a mixed mbuna community needs 150 cm or more. Build stable stacks of rock from the floor upwards with many caves and crevices, place them on the glass before adding sand so that digging cannot topple them, and leave a few open sandy patches for spawning pits. Red zebras rearrange gravel and small decorations constantly, so choose smooth rock and skip delicate plants. Algae on the rocks are welcome grazing. Strong filtration and a weekly water change of a third keep nitrate low, which matters for herbivorous mbuna. Most keepers hold the temperature between 24 and 28 C and the pH between 7.5 and 8.5.
    sources:
      - *a4
      - *a11
      - *a17
      - *a16
  socialBehavior:
    text: Males are territorial all year and defend a rock site against other males; in the wild their area is about a metre across. In the aquarium the dominant male drives rivals away and courts females persistently, so a lone female can be worn down and killed. Spread his attention over at least three females and keep only one male unless the tank is very large. Many keepers stock mbuna tanks densely so that no fish can claim a large area. Among mbuna it counts as comparatively mild, yet males chase other fish well beyond their cave, especially fish of similar colour or shape, so tankmates must be robust mbuna of similar size.
    sources:
      - *a2
      - *a4
      - *a11
      - *a36
  diet:
    text: In the lake the red zebra combs loose material from the algae carpet on the rocks, holding its body at a right angle to the surface. This algae-rich food is low in protein and high in fibre, and the gut is adapted to it. In the aquarium give a spirulina flake or a pellet made for herbivorous mbuna as the staple and add blanched spinach, nori or peas. Small crustaceans such as Cyclops or Mysis are a treat once a week at most. Red meat, beef heart, worms and high-protein cichlid food cause obesity and bloat. Feed small portions once or twice a day and add a fasting day each week.
    sources:
      - *a2
      - *a28
      - *a25
      - *a4
      - *a11
      - *a26
  breeding:
    text: Breeding is easy in a harem. The male intensifies his colour, cleans a flat rock or digs a shallow pit and leads ripe females there. The pair circles head to tail; the female lays a few eggs at a time and takes them into her mouth at once, and the eggs are fertilised when she nips at the egg spots on the anal fin of the male. She then carries the brood for about three to four weeks and does not eat. Stressed females may spit or swallow the eggs. The released fry are large enough for brine shrimp nauplii and crushed flakes, but in a community tank the adults eat them unless dense rockwork gives them cover. Many breeders move the holding female to a separate tank, but long absences can cost her rank in the group.
    sources:
      - *a4
      - *a11
      - *a17
      - *a33
  sexing:
    text: "In the natural colour form, males are light blue and females brown-beige or orange, so sex is easy to tell. In captive lines with orange males both sexes look alike, and other signs are needed: males grow larger, have longer pointed dorsal and anal fins and show more and larger egg spots on the anal fin. Wild males from Minos Reef also carry yellow spots in the soft part of the dorsal fin. Orange-blotched fish are mostly females. A female kept without a male may take on male colours and court other females without being able to fertilise eggs, which can mislead the keeper."
    sources:
      - *a2
      - *a3
      - *a4
      - *a11
      - *a16
  compatibility:
    text: The red zebra belongs in a Lake Malawi mbuna tank with species of similar size, robustness and diet that look different. Good partners are striped or yellow mbuna such as Melanochromis cyaneorhabdos, Pseudotropheus sp. 'Acei' or Labeotropheus, and robust catfish such as Synodontis multipunctatus. Do not combine it with other Maylandia such as M. zebra, M. callainos, M. lombardoi or M. aurora, because they cross readily, and do not mix its own colour forms if you want to keep pure lines. Peaceful Malawi cichlids such as peacocks and utaka suffer from its constant activity and need a richer diet. Fry and fish under about 2 cm are eaten. Fish from soft, acidic water are unsuitable as well.
    sources:
      - *a4
      - *a11
      - *a39
      - *a22
  problems:
    text: "The most common fatal mistake is a protein-rich diet: meaty foods and generous feeding lead to obesity and Malawi bloat, which shows as a swollen belly, loss of appetite and white stringy faeces. Poor water quality with high nitrate adds to the risk. A second frequent problem is stocking: too few females, two males in a small tank or look-alike species lead to injuries and deaths. Mixing with related Maylandia produces hybrids that should not be passed on. Fish sold as deep red at small sizes may be colour-fed or treated with hormones and fade later, so buying from a known breeder is safer. Watch for fin damage from fights and isolate injured fish early."
    sources:
      - *a4
      - *a11
      - *a17

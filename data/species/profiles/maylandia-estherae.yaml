variants:
  - name: Wild type (B male, brown-beige female)
    kind: color-morph
    note: Light blue unbarred males and brown-beige females; the normal colour of wild fish.
  - name: O morph (orange)
    kind: color-morph
    note: Plain orange-red fish; about 80 percent of the wild females at Minos Reef and Chilucha Reef. O males are rare in the wild and look creamy pink; aquarium lines with orange males (Red/Red) are bred in captivity.
  - name: OB morph (orange blotch, Marmalade Cat)
    kind: color-morph
    note: Orange or pink fish with dark blotches; mostly females, pied males are traded as Marmalade Cat.
  - name: Minos Reef
    kind: locality
    note: Type locality off Meluluca, Mozambique; males carry yellow spots in the soft dorsal fin.
  - name: Chilucha Reef
    kind: locality
    note: Deep reef off Metangula, Mozambique; northernmost known population.
features:
  origin:
    value: &a41
      continent: Africa
      region: Lake Malawi
      waterbody: lake-malawi
      localities:
        - Chilucha Reef (Metangula, Mozambique)
        - Minos Reef (Meluluca, Mozambique), type locality
        - Offshore reefs near Meluluca (Mozambique)
        - North of Masinje (Malawi)
        - Gome
    confidence: high
    rationale: Endemic to the eastern coast of Lake Malawi, mainly in Mozambican waters. The original description names Minos Reef off Meluluca as the type locality, Chilucha Reef near Metangula as the northernmost and the area north of Masinje at the Malawi border as the southernmost population; Seriously Fish gives the range as Metangula and Minos Reef to Gome. FishBase lists Mozambique, the Catalog of Fishes Lake Malawi.

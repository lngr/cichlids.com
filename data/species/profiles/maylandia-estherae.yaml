    - field: features.predation.value
      proposals:
        - value: 1
          by: generator
        - value: 0
          by: checker-a
        - value: 0
          by: checker-b
        - value: 1
          by: tiebreaker-1
        - value: 1
          by: tiebreaker-2
        - value: 0
          by: tiebreaker-3
      decision: 1
      rationale: "Decided by the vote count: 3 of 6 votes, method conservative (highest level), confidence low. Field data support level 0, aquarium reports of fry being eaten support level 1. Seriously Fish, read again, does warn of fry predation, so its evidence entry is 1."
    - field: features.diet.value.foods
      proposals:
        - value:
            - spirulina flakes
            - vegetable-based mbuna pellets
            - blanched spinach
            - nori
            - small crustaceans in moderation
          by: generator
        - value:
            - algae
            - spirulina-based flakes and pellets
            - blanched vegetables
            - small crustaceans in moderation
          by: checker-a
        - value:
            - algae and biofilm
            - spirulina flakes
            - blanched greens
          by: checker-b
      decision: *a40
      rationale: The vote count decided diet unanimously; the food list of the decided value is kept. All lists name the same kinds of food.
    - field: features.origin.value
      proposals:
        - value:
            waterbody: lake-malawi
            localities:
              - Chilucha Reef (Metangula, Mozambique)
              - Minos Reef (Meluluca, Mozambique)
              - Offshore reefs near Meluluca (Mozambique)
              - North of Masinje (Malawi)
          by: generator
        - value:
            waterbody: Lake Malawi
            localities:
              - Minos Reef (type locality, near Meluluca, Mozambique)
              - Chilucha Reef (Metangula, Mozambique)
              - Metangula to Gome along the eastern (Mozambique) coast
          by: checker-a
        - value:
            waterbody: lake-malawi
            localities:
              - Minos Reef
              - Chilucha Reef
              - Narungu
              - Gome Rock
          by: checker-b
      decision: *a41
      rationale: The waterbody names denote the same table entry; the id is used. Localities are merged where a source states them (original description, Seriously Fish for Gome). Narungu has no cited source and is left out.
    - field: features.maxSizeCm.value
      proposals:
        - value:
            male: 12
            female: 9
          by: generator
        - value:
            male: 13
            female: 10
          by: checker-a
        - value:
            male: 12
            female: 10
          by: checker-b
      decision:
        male: 12
        female: 10
      rationale: 13.5 to 14 cm males are exceptional, so 12 cm is the typical male maximum. Four hobby sources agree on 10 cm for females; the 9 cm proposal has no source.
    - field: features.aggressionHeterospecific.value
      proposals:
        - value: 3
          by: generator
        - value: 3
          by: checker-a
        - value: 2
          by: checker-b
      decision: 3
      rationale: Seriously Fish rules out peaceful Malawi cichlids and asks for similarly sized, robust mbuna, which is level 3 of the rubric. The milder ratings of FishKeeper, AquariumSource and GCCA describe it relative to other mbuna.
    - field: features.coloration.value.pattern
      proposals:
        - value: plain
          by: generator
        - value: plain
          by: checker-a
        - value: bars
          by: checker-b
      decision: plain
      rationale: The original description, FishBase and the Malawi Cichlid Homepage describe wild males as light blue without the dark bars of M. zebra; the barred proposal has no source.
    - field: features.beginnerSuitability.value
      proposals:
        - value: moderate
          by: generator
        - value: moderate
          by: checker-a
        - value: easy
          by: checker-b
      decision: moderate
      rationale: The fish are hardy, but the tank size, the harem, the bloat risk and the many hybridisation pitfalls in stocking make moderate the safer rating; Seriously Fish rates it moderate.

  temperatureC:
    value: {min: 21, max: 29}
    confidence: high
    verification: {method: waterbody, waterbody: lake-malawi}
    rationale: >-
      Natural value of Lake Malawi, decided by the water body. Eccles (1974) reports about 27 C
      in the upper 60 m by May and 21 C inshore in the south-east arm during the cool, windy
      season; Vollmer et al. (2005) give winter values of the mixed layer from about 23.5 C and
      summer surface water near 28 C, and later campaigns reach 29 C. The species lives at about
      6 to 30 m, inside the layer these measurements describe. Care sheet figures such as the
      24 to 26 C of FishBase are aquarium recommendations and belong to the tolerance.
    sources:
      - &eccles
        kind: literature
        title: "Eccles, D. H. (1974). An outline of the physical limnology of Lake Malawi (Lake Nyasa). Limnology and Oceanography 19(5), 730-742 (abstract)."
        url: https://doi.org/10.4319/lo.1974.19.5.0730
        accessed: 2026-10-13
      - &vollmer2005
        kind: literature
        title: "Vollmer, M. K., Bootsma, H. A., Hecky, R. E., Patterson, G., Halfman, J. D., Edmond, J. M., Eccles, D. H. and Weiss, R. F. (2005). Deep-water warming trend in Lake Malawi, East Africa. Limnology and Oceanography 50(2), 727-732."
        url: https://www.dora.lib4ri.ch/empa/dload/empa:1253/PDF/view
        archived: dora.lib4ri.ch/empa/dload/empa_1253/pdf/view/2026-10-14T094508Z
        accessed: 2026-10-13
      - &vollmer1999
        kind: literature
        title: "Vollmer, M. K., Weiss, R. F. and Bootsma, H. A. (1999). Lake Malawi/Nyasa deep water renewal. In: Bootsma, H. A. and Hecky, R. E. (eds.), Water Quality Report, SADC/GEF Lake Malawi/Nyasa Biodiversity Conservation Project, chapter 4."
        url: https://sites.uwm.edu/hbootsma/files/2020/11/Ch4-Lake-Internal-Mixing.pdf
        archived: sites.uwm.edu/hbootsma/files/2020/11/ch4-lake-internal-mixing.pdf/2026-10-14T094509Z
        accessed: 2026-10-13
      - &ngochera
        kind: literature
        title: "Ngochera (2018). Carbon Dynamics in Tropical Lake Malawi. PhD dissertation, University of Wisconsin-Milwaukee."
        url: https://minds.wisconsin.edu/handle/1793/91765
        archived: minds.wisconsin.edu/handle/1793/91765/2026-10-14T094513Z
        accessed: 2026-10-13
      - &fao
        kind: literature
        title: "Vanden Bossche, J.-P. and Bernacsek, G. M. (1990). Source book for the inland fishery resources of Africa, Vol. 1, CIFA Technical Paper 18/1, FAO. Lake Malawi/Nyasa: physical and chemical data after Jackson et al. (1963) and Talling and Talling (1965)."
        url: https://www.fao.org/4/t0473e/T0473E05.htm
        archived: fao.org/4/t0473e/t0473e05.htm/2026-10-14T094507Z
        accessed: 2026-10-13
      - &branchu
        kind: literature
        title: "Branchu, P., Bergonzini, L., Ambrosi, J.-P., Cardinal, D., Delalande, M., Pons-Branchu, E. et al. (2010). Hydrochemistry (major and trace elements) of Lake Malawi (Nyasa), Tanzanian Northern Basin: local versus global considerations. Hydrology and Earth System Sciences Discussions 7, 4371-4409."
        url: https://hess.copernicus.org/preprints/7/4371/2010/hessd-7-4371-2010.pdf
        archived: hess.copernicus.org/preprints/7/4371/2010/hessd-7-4371-2010.pdf/2026-10-14T094507Z
        accessed: 2026-10-13
    evidence:
      - source: *eccles
        value: {min: 21, max: 27}
        note: inshore cool-season minimum and upper 60 m in May
      - source: *vollmer2005
        value: {min: 23.5, max: 28}
        note: winter mixed layer and summer surface water
      - source: *fao
        value: {min: 23, max: 25}
        note: lake surface water, single 1960s survey
      - source: *branchu
        value: {min: 24.5, max: 26.2}
        note: campaign means of the upper layer, north basin
    tolerance:
      value: {min: 21, max: 29}
      confidence: medium
      verification:
        method: unanimous
        votes: {agree: 4, total: 4}
      rationale: >-
        All four runs proposed 21 to 29 C. Care sheets agree on a band of about 23 to 28 C for
        long-term keeping (Seriously Fish 24 to 28, The Tropical Tank 23 to 28, Aqua-Fish and
        Tropical Freshwater Fish 23 to 27, FishBase and Fishkeeper 24 to 26, LiveAquaria about 24
        to 28), and a rearing trial kept the species at 26 to 28 C. No source reports harm within
        the lake range, which the tolerance has to contain, so it equals the natural range. The
        ends at 21 and 29 C rest on the lake measurements and are seasonal extremes rather than
        targets for a tank.
      sources:

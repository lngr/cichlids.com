  ph:
    value: {min: 7.7, max: 8.6}
    confidence: high
    verification: {method: waterbody, waterbody: lake-malawi}
    rationale: >-
      Natural value of Lake Malawi, decided by the water body: surface pH 7.7 to 8.6 after
      Jackson et al. (1963) in the FAO source book. Branchu et al. (2010) measured 7.5 to 8.5 over
      the whole column; the lower values belong to deep water that this rock dweller does not use.
    sources:
      - *fao
      - *branchu
      - *eccles
      - *vollmer2005
      - *vollmer1999
      - *ngochera
    evidence:
      - source: *fao
        value: {min: 7.7, max: 8.6}
        note: lake surface water
      - source: *branchu
        value: {min: 7.5, max: 8.5}
        note: whole water column, lowest values in deep water
    tolerance:
      value: {min: 7.5, max: 8.8}
      confidence: medium
      verification:
        method: unanimous
        votes: {agree: 4, total: 4}
      rationale: >-
        The runs proposed 7.5 to 8.8 (generator, checker-a), 7.2 to 8.8 (checker-b) and 7.6 to 8.8
        (checker-c); all lie within the agreement threshold and the vote settles on 7.5 to 8.8,
        which contains the lake range. Species care sheets put the lower end between 7.5 and 7.8
        and the upper end between 8.5 and 8.9 (Seriously Fish and my-fish 7.6 to 8.8, The Tropical
        Tank 7.6 to 8.6, Aqua-Fish 7.5 to 8.9, Fishkeeper 7.5 to 8.5, LiveAquaria 7.8 to 8.6);
        FishBase gives only a lower limit of 8.0 and the OATA group sheet for Malawi cichlids 8.0
        to 8.6. Tropical Freshwater Fish allows up to 9.0, a single value without support. The
        7.2 of checker-b rests on general mbuna experience, not on a species figure.
      sources:

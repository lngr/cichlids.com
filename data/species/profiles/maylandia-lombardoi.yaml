  khDkh:
    value: {min: 5, max: 8}
    confidence: high
    verification: {method: waterbody, waterbody: lake-malawi}
    rationale: >-
      Natural value of Lake Malawi, decided by the water body: alkalinity of 2.33 to 2.46 meq/L
      in the Branchu et al. (2010) profiles and 2.00 to 2.59 meq/L in the 1960s data of the FAO
      source book correspond to about 5.6 to 7.3 dKH. Sodium balances part of the bicarbonate, so
      carbonate hardness exceeds total hardness in the lake.
    sources:
      - *branchu
      - *fao
      - *eccles
      - *vollmer2005
      - *vollmer1999
      - *ngochera
    evidence:
      - source: *branchu
        value: {min: 6.5, max: 6.9}
        note: alkalinity of 2.33 to 2.46 meq/L
      - source: *fao
        value: {min: 5.6, max: 7.3}
        note: alkalinity of 2.00 to 2.59 meq/L
    tolerance:
      value: {min: 5, max: 15}
      confidence: low
      verification:
        method: qualified-majority
        votes: {agree: 4, total: 5}
      rationale: >-
        Four of five votes support 5 to 15 dKH (generator, checker-a and tiebreaker-1 exactly,
        checker-b with 4 to 15 within the threshold); checker-c proposed 5 to 12 dKH after a shop
        sheet. Few sources state carbonate hardness: The Tropical Tank asks for at least 6 and
        ideally 10 to 12 dKH, the OATA group sheet for Malawi cichlids 10 to 15 dKH, and the
        retailers LiveAquaria and J&K Aquatics 10 to 15 dKH; GarnelenTv names 6 to 12 dKH. The
        lower end is the natural alkalinity of the lake, which the tolerance has to contain. Only
        one species database gives a figure and the upper bound rests on group-level and retailer
        advice, hence the low confidence.
      sources:
        - *tt
        - *oata
        - *branchu
        - *fao
        - &pfk
          kind: literature
          title: "Practical Fishkeeping: The mbuna keeper's survival guide"
          url: https://www.practicalfishkeeping.co.uk/features/the-mbuna-keepers-survival-guide/
          archived: practicalfishkeeping.co.uk/features/the-mbuna-keepers-survival-guide/2026-10-14T095109Z
          accessed: 2026-10-13
        - *la
        - *jk

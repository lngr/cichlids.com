  ghDgh:
    value: {min: 3, max: 5}
    confidence: high
    verification: {method: waterbody, waterbody: lake-malawi}
    rationale: >-
      Natural value of Lake Malawi, decided by the water body. Calcium and magnesium of the upper
      50 m in the north basin (Branchu et al. 2010) give 4.2 to 4.6 dGH, the 1960s titrations in
      the FAO source book 3.2 to 4.9 dGH. The lake is soft water with moderate alkalinity; the
      10 to 25 dGH of care sheets confuse alkalinity with hardness and belong to the tolerance.
    sources:
      - *branchu
      - *fao
      - *eccles
      - *vollmer2005
      - *vollmer1999
      - *ngochera
    evidence:
      - source: *branchu
        value: {min: 4.2, max: 4.6}
        note: calculated from calcium and magnesium of the upper 50 m, north basin
      - source: *fao
        value: {min: 3.2, max: 4.9}
        note: calculated from the 1960s calcium and magnesium titrations
    tolerance:
      value: {min: 3, max: 25}
      confidence: medium
      verification:
        method: qualified-majority
        votes: {agree: 4, total: 5}
      rationale: >-
        Four of five votes (generator, checker-a, checker-c, tiebreaker-1) proposed 3 to 25 dGH;
        checker-b proposed 3 to 20 dGH after FishBase. The lower end is the natural lake hardness,
        which the tolerance has to contain; care sheets name minimums around 10 dGH only because
        they treat the alkaline lake as hard water. The upper end follows Seriously Fish (10 to 25
        dGH), Aqua-Fish and Tropical Freshwater Fish (12 to 25); FishBase and FishProfiles stop at
        20, Animal-World at 15 and the OATA group sheet at 18, while two shop sheets go up to 30.
        A rearing trial with up to 8 mM added calcium found lowered cortisol, which shows
        short-term tolerance of very hard water but nothing about years. Stable pH and carbonate
        hardness matter more than total hardness.
      sources:
        - *sf
        - *af
        - *tff
        - *fishbase
        - &fp
          kind: database
          title: "FishProfiles: Pseudotropheus lombardoi"
          url: https://fishprofiles.com/profiles/freshwater/Cichlids/Pseudotropheus_lombardoi/
          archived: fishprofiles.com/profiles/freshwater/cichlids/pseudotropheus_lombardoi/2026-10-14T101444Z
          accessed: 2026-10-13
        - &aw
          kind: database
          title: "Animal-World: Kenyi Cichlid (archived copy)"
          url: https://web.archive.org/web/20191225140609/https://animal-world.com/encyclo/fresh/cichlid/KenyiCichlid.php
          archived: web.archive.org/web/20191225140609/https_/animal-world.com/encyclo/fresh/cichlid/kenyicichlid.php/2026-10-14T101445Z
          accessed: 2026-10-13
        - *tt
        - *oata
        - *kfas
        - *branchu
        - *fao
        - *fishkeeper
        - *jk
        - &garnelio
          kind: website
          title: "Garnelio care sheet, Pseudotropheus lombardoi (shop)"
          url: https://www.garnelio.de/en/2x-purple-perch-pseudotropheus-lombardoi-dnz-pair
          archived: garnelio.de/en/2x-purple-perch-pseudotropheus-lombardoi-dnz-pair/2026-10-14T101447Z
          accessed: 2026-10-13
      evidence:
        - source: *sf
          value: {min: 10, max: 25}
          note: aquarium recommendation
        - source: *af
          value: {min: 12, max: 25}
          note: given in German degrees, equal to dGH
        - source: *tff
          value: {min: 12, max: 25}
          note: aquarium recommendation
        - source: *fishbase
          value: {min: 10, max: 20}
          note: dH after Baensch and Riehl
        - source: *fp
          value: {min: 10, max: 20}
          note: aquarium recommendation
        - source: *aw
          value: {min: 10, max: 15}
          note: aquarium recommendation
        - source: *tt
          value: {min: 7}
          note: lower limit only
        - source: *oata
          value: {min: 12, max: 18}
          note: general guide for all Malawi cichlids
        - source: *kfas
          value: {max: 45}
          note: added calcium up to 8 mM, roughly 45 dGH from calcium alone; short-term trial (abstract)
        - source: *branchu

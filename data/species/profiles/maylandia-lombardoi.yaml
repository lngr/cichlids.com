schemaVersion: 1
id: maylandia-lombardoi
legacyIds: [480, 813]
status: described
taxonomy:
  validName: Maylandia lombardoi
  genus: Maylandia
  species: lombardoi
  author: (Burgess, 1977)
  source:
    kind: catalog-of-fishes
    title: "Eschmeyer's Catalog of Fishes, species of the genus Maylandia"
    url: https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Maylandia
    archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-47330f77/2026-10-14T095140Z
    accessed: 2026-10-13
  synonyms:
    - name: Pseudotropheus lombardoi Burgess, 1977
      note: Original combination; type locality Lake Malawi, probably Mbenji Island.
    - name: Metriaclima lombardoi (Burgess, 1977)
      note: Combination used by Stauffer et al. (1997), Konings and Stauffer (2006), Konings (2016) and the Cichlid Room Companion.
    - name: Pseudotropheus liliancinius Staeck, 1977
      note: Nomen nudum from the Mbenji Islands, placed in the synonymy of this species by the Catalog of Fishes; also seen as a trade name.
  legacyNames:
    - Pseudotropheus lombardoi
    - Maylandia lombardoi
  note: >-
    The Catalog of Fishes (queried 2026-10-13 under Maylandia, Metriaclima and Pseudotropheus)
    lists the species as valid in Maylandia; the other two genera hold no separate valid
    lombardoi. The genus name is disputed: Konings, Geerts and Stauffer (2026, Taxonomy 6(1),
    doi 10.3390/taxonomy6010003) argue that Maylandia is a nomen nudum, and part of the
    literature, the Cichlid Room Companion and much of the hobby use Metriaclima. The species
    epithet and the species concept are not in question; the profile follows the Catalog of
    Fishes. The legacy catalog held the species twice, as Pseudotropheus lombardoi and as
    Maylandia lombardoi; both entries map to this profile.
names:
  trade:
    en:
      - Kenyi cichlid
      - Kennyi
      - Lombardoi mbuna
    de:
      - Kenyi
variants:
  - name: Mbenji Islands
    kind: locality
    note: Natural population around the Mbenji island group; the origin of the original trade stock.
  - name: Nkhomo Reef
    kind: locality
    note: Second natural population on a reef off the central western shore.
  - name: Namalenje Island
    kind: locality
    note: Population most likely introduced by people.

features:
  origin:
    value:
      continent: Africa
      region: Lake Malawi
      waterbody: Lake Malawi
      localities:
        - Mbenji Islands
        - Nkhomo Reef
        - Namalenje Island (introduced)
    confidence: high
    rationale: >-
      Endemic to Lake Malawi with a very small natural range at the Mbenji Islands and Nkhomo
      Reef in the central part of the lake. FishBase, Seriously Fish, Malawi-Guru and the Malawi
      pages of M. K. Oliver (after Konings) agree; the Catalog of Fishes gives Lake Malawi as the
      distribution and probably Mbenji Island as the type locality. A population at Namalenje
      Island goes back to an introduction by people and is listed with that label.

      rationale: >-
        The 15 cm figures of several care sheets (one of them given as standard length) read as
        upper extremes, while Fishkeeper, The Tropical Tank, FishProfiles and Wikipedia give 12 to
        13 cm and wild fish measure about 11 cm total length; the feature asks for the typical
        size of well-kept adults. Females are about two thirds of the male length according to
        the Cichlid-Forum article and at the 10 cm lower end of The Tropical Tank; the equal or
        near-equal female sizes of FishProfiles and my-fish do not separate the sexes.

        note: not for beginners because of its temper

partners:
  suitable:
    - species: Melanochromis auratus
      reason: An equally robust mbuna of similar size whose horizontal stripes differ clearly from the yellow males and barred females of the kenyi.
      condition: Tank of at least 150 cm, one male of each species, many caves.
    - species: Labeotropheus trewavasae
      reason: A robust algae-scraping mbuna with the same diet and water needs, different body shape and colour, able to hold its own.
      condition: Tank of at least 150 cm with plenty of rock.
    - species: Tropheops tropheops
      reason: A robust rock-dwelling mbuna with a similar plant-based diet and enough temper to cope; colours differ from both sexes of the kenyi.
      condition: Large tank with many rock piles to break lines of sight.
    - species: Synodontis multipunctatus
      reason: An armoured, fast catfish that uses the bottom and caves at dusk and is ignored by the cichlids; it needs the same alkaline water.
      condition: Kept in a group of several fish.
  unsuitable:
    - species: Maylandia zebra
      reason: Same hybrid group; blue barred females and subdominant males look alike, which leads to fights and crosses.
    - species: Cynotilapia afra
      reason: Blue barred males resemble kenyi females and are attacked as rivals.
    - species: Chindongo saulosi
      reason: Blue barred males and yellow females copy the colours of both kenyi sexes and draw constant attacks; it is also smaller and weaker.
    - species: Labidochromis caeruleus
      reason: Smaller and more peaceful, and its bright yellow resembles a dominant kenyi male, which invites harassment.
    - species: Aulonocara stuartgranti
      reason: Peaceful peacock that cannot cope with the aggression of the kenyi and needs a protein-rich diet.
    - species: Copadichromis borleyi
      reason: Calm open-water utaka that is harassed by the kenyi; Seriously Fish rules out utaka as tankmates.
    - species: Pterophyllum scalare
      reason: Peaceful soft-water cichlid with different water needs and no defence against mbuna.

profile:
  overview:
    text: >-
      Maylandia lombardoi, sold as the kenyi, is a rock-dwelling mbuna from a few spots in Lake
      Malawi. It has been in the hobby since the 1970s and is bred in large numbers. Its colours
      are unusual for a mbuna: grown males turn yellow, while females and young fish stay pale blue
      with dark bars. Behind the pretty juveniles in the shop is one of the most quarrelsome mbuna
      of all. Kept in a large, densely stocked rock tank with one male and four females, or in a
      big mixed group, it is hardy, easy to feed and breeds readily. In small tanks, in pairs or
      with calm cichlids it causes injuries and losses. Many books and shops use the names
      Pseudotropheus lombardoi or Metriaclima lombardoi for the same fish.
    sources:
      - *cof
      - *sf
      - *glaser
      - *fishkeeper
  habitat:
    text: >-
      The species is endemic to Lake Malawi and lives naturally only around the Mbenji Islands and
      on Nkhomo Reef; a population at Namalenje Island was most likely introduced. It prefers the
      transition zone where rock rubble meets sand and fine sediment covers the stones, mostly a
      few metres to about 30 m deep, and picks plankton from the water just above the rocks. Lake
      Malawi water is soft but alkaline: about 3 to 5 dGH, 5 to 8 dKH and pH 7.7 to 8.6 at the
      surface, with temperatures between about 21 and 29 degrees over the year. Aquarium care
      sheets usually ask for harder water, which the fish also tolerate well, but a stable pH
      above 7.5 and good buffering matter more than total hardness.
    sources:
      - *fishbase
      - *sf
      - *oliver
      - *branchu
      - *fao
      - *eccles
  sizeAndGrowth:
    text: >-
      Juveniles grow quickly and males begin to turn yellow at about 5 cm. Well-kept males reach
      about 12 to 13 cm in total length, females stay near 10 cm. Wild fish measured for science
      are smaller, around 11 cm in total length, which is typical for mbuna: they grow larger in
      the aquarium than in the lake, where food is scarce. Several care sheets mention 15 cm
      fish, but these are the upper extreme. With good care the kenyi lives about eight to ten
      years.
    sources:
      - *fishkeeper
      - *tt
      - *fishbase
      - *af
      - *sf
  husbandry:
    text: >-
      Plan for a tank of at least 120 cm length, 45 cm front-to-back depth and about 250 litres
      for one male and four females; a mixed mbuna community or more than one male needs 150 cm or
      more. Build stable piles of rock from the floor to near the surface with many caves and gaps
      that break the line of sight, and leave some open sand where males can dig. Set rocks on the
      bottom glass before adding sand, because the fish dig under them. Strong filtration and
      large weekly water changes are needed, since mbuna tanks are kept densely stocked to spread
      aggression. Keep the temperature around 24 to 27 degrees, the pH between 7.5 and 8.5 and the
      carbonate hardness at about 6 dKH or more; crushed coral or aragonite in the filter helps
      with buffering.
    sources:
      - *sf
      - *tt
      - *mg
      - *fishkeeper
      - *la
      - *a18071
  socialBehavior:
    text: >-
      Males are fiercely territorial and treat other males, unready females and similar-looking
      fish as rivals. A single female with a male will be chased constantly and may be killed, so
      one male needs at least three and better four females, and two males need a much larger
      tank. Subdominant males often keep the blue female colour to avoid attacks; once they turn
      yellow the dominant male may hunt them down. A large, crowded group of ten or more fish in a
      150 cm tank spreads aggression best. Towards other species the kenyi is pushy as well and
      chases fish far beyond its spawning site.
    sources:
      - *sf
      - *mg
      - *aw
      - *fishkeeper
      - *glaser
      - *a19164
  diet:
    text: >-
      In the lake the kenyi combs loose algae and the small animals living in them from the rocks
      and also feeds on plankton. In the tank it needs a mainly plant-based diet: spirulina flakes
      or pellets for herbivorous cichlids, algae and blanched vegetables such as spinach or
      courgette. Small crustaceans such as Mysis are fine as an occasional addition. Avoid beef
      heart, other red meat and protein-rich foods as a staple, since they upset the gut and
      favour bloat. Feed small portions several times a day rather than one large meal; the fish
      rush food and overeat easily.
    sources:
      - *genner
      - *fishbase
      - *sf
      - *af
      - *fishkeeper
  breeding:
    text: >-
      The kenyi breeds readily in the aquarium. The male cleans a flat stone or digs a pit in the
      sand and displays in full colour to lure females. The female lays her eggs in small batches
      and takes them into her mouth at once; she collects the sperm while nipping at the egg spots
      on the male's anal fin. She broods for about three weeks without eating and then releases
      fully formed young; broods hold from about 15 to 50 fry. Move the female carefully to a
      separate tank if you want to raise many fry, since stressed females may spit or eat the
      brood. The young accept newly hatched brine shrimp and fine flake food immediately.
    sources:
      - *sf
      - *fishbase
      - *couldridge
      - *fishkeeper
      - *cfa
  sexing:
    text: >-
      Adult sexes are easy to tell apart once the fish are mature. Dominant males are yellow to
      orange-yellow with faint brownish bars and carry a large yellow egg spot on the anal fin.
      Females keep the juvenile colours of light blue with dark blue to almost black vertical bars
      and lack egg spots. Two exceptions confuse beginners: subdominant males may stay blue like
      females, but still show the egg spot, and brooding or dominant females can turn partly yellow.
      Males also grow larger. Before about 5 cm all juveniles look blue.
    sources:
      - *sf
      - *tt
      - *glaser
      - *fishkeeper
  compatibility:
    text: >-
      Only robust mbuna of similar size suit the kenyi, and they should look different from both
      sexes. Good choices are strongly built species such as Melanochromis auratus, Labeotropheus
      trewavasae or Tropheops, together with a group of Synodontis multipunctatus as bottom
      dwellers. Avoid other Maylandia, which look alike and may cross, and Cynotilapia afra, which
      looks alike as well, and species such as Chindongo saulosi or Labidochromis caeruleus whose
      colours copy those of the kenyi. Peaceful Malawi cichlids such as peacocks and utaka, and all
      soft-water fish, do not belong in its tank. Stock densely and add all fish at the same time
      where possible.
    sources:
      - *sf
      - *tt
      - *mg
      - *fishkeeper
      - *a15669
  problems:
    text: >-
      The most common mistake is buying a pair or a few juveniles for a small tank: once the male
      colours up he chases the others until they are injured or die. Sudden losses of females or
      subdominant males usually trace back to too little space, too few females or too few hiding
      places. Protein-rich food and overfeeding lead to bloat, a digestive disorder of mbuna that
      can be fatal; a swollen belly, loss of appetite and white, stringy faeces are warning signs.
      Unstable or acidic water and nitrate build-up in densely stocked tanks weaken the fish. Many
      tank-bred kenyi in the trade are of mediocre colour compared with wild fish; keeping no other
      Maylandia in the same tank keeps the line pure.
    sources:
      - *sf
      - *fishkeeper
      - *glaser
      - *a19164


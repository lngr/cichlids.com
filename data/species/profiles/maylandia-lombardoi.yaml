      rationale: >-
        All runs agree on the natural range; checker-b and checker-c mention the Namalenje
        population in their rationale but leave it out of the list. It is kept with the label
        introduced, as FishBase and Seriously Fish list it, so that the list is complete without
        presenting it as native.

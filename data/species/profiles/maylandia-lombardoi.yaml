    confidence: medium
    rationale: >-
      The colours reverse the usual mbuna scheme: dominant males turn yellow to orange-yellow with
      faint brownish bars that may fade during courtship, while females, juveniles and
      subdominant males are pale blue with dark blue vertical bars (Seriously Fish, USGS,
      FishProfiles, Malawi-Guru, Fishkeeper, Aquarium Glaser). Brooding or dominant females may
      take on yellow tones. Yellow is the dominant colour of the adult male; orange is a shade of
      the same colour and the bars are brownish rather than black, so neither is a second base
      colour. The bars are faint but present, so the pattern is bars rather than plain.
      Tankmates that are blue barred like the females or bright yellow like the males are both
      likely targets.

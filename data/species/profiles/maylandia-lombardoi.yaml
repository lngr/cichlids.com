          title: "The Tropical Tank: Metriaclima lombardoi (Kenyi cichlid), archived copy of 2026-03-13"
          url: https://web.archive.org/web/20260313052510/http://thetropicaltank.co.uk/Fishindx/m_lombardoi.htm
          archived: web.archive.org/web/20260313052510/http_/thetropicaltank.co.uk/fishindx/m_lombardoi.htm/2026-10-14T101436Z
          accessed: 2026-10-13

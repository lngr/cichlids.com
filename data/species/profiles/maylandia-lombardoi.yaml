      - source: *genner
        value: maternal-mouthbrooder
        note: all mbuna
      - source: *crc
        value: maternal-mouthbrooder
        note: verification only

  beginnerSuitability:
    value: moderate
    confidence: medium
    rationale: >-
      Water, food and breeding are simple, but the aggression requires a large, crowded rock tank,
      a harem and careful choice of tankmates. Seriously Fish rates the difficulty as moderate and
      advises against it for novices, the Cichlid Room Companion and Animal-World name
      intermediate aquarists, and LiveAquaria calls care easy. Checker-c proposed demanding,
      following J&K Aquatics and the warning of the Cichlid-Forum article that the fish is often
      sold to beginners who are then overwhelmed. Since water and diet are undemanding and only
      the social management needs experience, moderate fits the weight of the sources.
    sources:

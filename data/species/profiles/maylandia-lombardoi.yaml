          note: aquarium recommendation
        - source: *tff
          value: {min: 23, max: 27}
          note: aquarium recommendation
        - source: *fishbase
          value: {min: 24, max: 26}
          note: aquarium value after Baensch and Riehl
        - source: *kfas
          value: {min: 26, max: 28}
          note: rearing temperature of the trial
        - source: *fishkeeper

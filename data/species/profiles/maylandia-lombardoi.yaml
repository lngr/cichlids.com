        - {by: checker-c, value: 4}
      decision: 4
      rationale: >-
        Malawi-Guru names three to four females per male, other sources at least three or
        several. For a species at aggression level 4 the upper end spreads the male's pressure
        better, so four is recommended; three is the absolute floor named in the prose.

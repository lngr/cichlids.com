  breeding:
    value: maternal-mouthbrooder
    confidence: high
    rationale: >-
      Females brood the eggs in the mouth for about three weeks after spawning on a flat stone or
      in a sand pit; fertilisation follows the egg-spot mechanism, and Couldridge (2002) studied
      female preference for male egg spots in this very species. FishBase, Seriously Fish, USGS
      and Genner and Turner (2005) for all mbuna agree; the Cichlid Room Companion summary
      confirms it.
    sources:
      - *fishbase
      - *sf
      - *usgs
      - *genner
      - &couldridge
        kind: literature
        title: "Couldridge, V. C. K. (2002). Experimental manipulation of male eggspots demonstrates female preference for one large spot in Pseudotropheus lombardoi. Journal of Fish Biology 60(3) (abstract)."
        url: https://doi.org/10.1111/j.1095-8649.2002.tb01696.x
        accessed: 2026-10-13
      - *crc
    evidence:
      - source: *fishbase
        value: maternal-mouthbrooder
      - source: *sf
        value: maternal-mouthbrooder
        note: about three weeks of brooding
      - source: *usgs

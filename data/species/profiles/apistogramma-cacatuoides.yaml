  socialBehavior:
    text: "A male guards a collective area containing several smaller female territories. Each female selects a
      shelter and may exclude even the male while tending eggs or young. This supports a large territory
      classification for the adult harem, although an individual female patch is much smaller. Three females
      is the chosen ratio; two females and carefully selected pairs are also used successfully. One male is
      appropriate at the stated minimum. Extra males require substantially more space, and poorly matched fish
      can be injured even though the species is small. A fish pinned near the surface or repeatedly denied
      food needs prompt changes to the layout or separation. Sight barriers and refuges matter more than
      adding adults to absorb harassment."

  compatibility:
    text: "Peaceful adult fishes that spend most of their time above the cave floor are the most suitable
      companions. Pencilfish and modest midwater tetra shoals are established options, provided their own
      group needs and water preferences overlap. A community requires more space than the harem-only minimum,
      and fry survival is uncertain. Another territorial dwarf cichlid or persistent bottom dweller increases
      encounters around shelters. Large predatory cichlids, aggressive mbuna and small dwarf shrimp are poor
      partners. No supported interspecific hybrid group was identified for cacatuoides in this adjudication.
      That result does not prove every cross impossible. Different locality stocks and captive colour lines
      remain capable of mixing within the species, which matters when retaining an identifiable strain."

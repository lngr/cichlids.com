  synonyms:
    - name: "Apistogramma marmoratus"
      note: "Dunker, 1960 usage listed as a synonym by the Catalog of Fishes; it was not intended as a formal
        new-species description."
  legacyNames:
    - "Apistogramma cacatuoides"
  note: "The Catalog of Fishes retains Apistogramma cacatuoides Hoedeman, 1951 as valid and lists Apistogramma
    marmoratus as a synonym, although that 1960 usage was not intended to describe a new species. The
    originally reported Paramaribo locality was erroneous and corrected to the upper Amazon basin.
    Apistogramma borellii is a separate valid species historically confused with this fish. Selected colour
    lines remain within this described species."

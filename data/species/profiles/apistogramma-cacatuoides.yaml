  minTank:
    value:
      volumeL: 101
      lengthCm: 80
      depthCm: 35
    confidence: "medium"
    rationale: "The component medians of generator 120 L / 100 x 40 cm, checker-a 80 L / 80 x 35 cm, checker-b 90
      L / 80 x 35 cm and checker-c 112 L / 80 x 35 cm are 101 L / 80 x 35 cm. These medians are retained for
      one male and three females. Dietzenbach explicitly recommends at least 80 cm and more than 100 L for a
      harem, supporting the nominal 101 L threshold; Green Aqua gives 90 L for two or three females. At an 80
      x 35 cm base, about 36 cm nominal height corresponds to 101 gross litres. This is a planning minimum
      rather than a standard tank model, and cover reduces usable space. PlayFish recommends a larger 100 x 40
      cm base for the same social unit, while Seriously Fish allows 60 x 30 cm and about 54 L only for a pair.
      The larger recommendation remains as dissenting evidence, but is not treated as a universal minimum over
      the other supported harem guidance. Crowding or shared bottom territories require enlargement."

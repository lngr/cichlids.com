    tolerance:
      value:
        min: 5
        max: 8
      confidence: "medium"
      rationale: "All six proposals are 5.0 to 8.0, retained with six-of-six qualified-majority verification and
        medium confidence. Seriously Fish reports 5.0 to 6.0 as breeding conditions for some wild stocks;
        AKVARISTA recommends 6.5 to 8.0, Maidenhead 5.5 to 7.0 and Dietzenbach 6.0 to 7.5. Captive spawning
        observations and laboratory breeding include neutral to mildly alkaline water. The combined tolerance
        includes the decided natural range but is not a common breeding optimum for every population. Advice
        about pH 8 describes a marginal value rather than a controlled lifelong limit. Low pH and high KH
        endpoints should not be combined indiscriminately."

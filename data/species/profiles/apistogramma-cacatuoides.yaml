        checker-b, checker-c, tiebreaker-1 and tiebreaker-2 proposed that point interval; checker-a proposed
        25 to 29 C from regional extrapolation and measurements at Corydoras sites. The latter paper reports
        the wider 24.5 to 27 C range for another species, not confirmed cacatuoides habitat. PlayFish
        reproduces a 27 C field observation attributed to Linke and Staeck; a specialist discussion gives

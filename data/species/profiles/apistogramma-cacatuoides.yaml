  ghDgh:
    value:
      min: 2
      max: 17
    confidence: "low"
    rationale: "The tally qualified majority adopts 2 to 17 dGH with low confidence, rounding the agreeing
      lower-endpoint median of 1.5 dGH to an integer. Generator proposed 0 to 17, checker-a 0.5 to 12, and
      checker-b, checker-c, tiebreaker-1 and tiebreaker-2 1.5 to 17 dGH; five votes agree within the rubric
      tolerance. AKVARISTA relays the wider 1.5 to 17 dGH field span attributed to Staeck, so the decided 2
      dGH minimum is a rounding result rather than proof that 1.5 dGH is unsuitable. Linke and Staeck
      secondary reports include 12 dGH. Hellweg describes natural hardness below measurement, supporting
      qualitative very soft conditions rather than a measured zero endpoint. FishBase lists the wider 5 to 19
      dH interval from an aquarium atlas, not a verified collecting series. Conductivity cannot establish GH
      without calcium and magnesium data; checker-a estimates and the conditionally converted Requena value
      remain visible but do not support the decision. The original numerical field table was not read, and the
      span is provisional."

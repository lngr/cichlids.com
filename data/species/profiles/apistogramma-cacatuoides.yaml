  social:
    value:
      structure: "harem"
      ratio: 3
    confidence: "high"
    rationale: "The decided social unit is one male with three females. Generator, checker-a and checker-c propose
      harem with ratio 3; checker-b proposes ratio 2. CRC explicitly identifies polygyny, AKVARISTA recommends
      three to four females, and PlayFish illustrates one male with three females. Green Aqua permits two or
      three females, so the smaller trio is a supported alternative rather than evidence against harem
      breeding. Isolated compatible pairs can reproduce without an exclusive lifelong pair bond. Three females
      is the proposal median and the supported lower end of the three-to-four-female recommendation; separate
      refuges are essential."

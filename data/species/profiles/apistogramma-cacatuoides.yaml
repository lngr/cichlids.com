partners:
  suitable:
    - species: "Nannostomus beckfordi"
      reason: "Quiet adult pencilfish use higher layers and offer reassuring activity away from caves."
      condition: "Keep a proper group; share moderate chemistry and temperature, and provide space beyond the 101 L
        harem minimum."
    - species: "Nannostomus eques"
      reason: "Upper-level pencilfish usually leave the occupied floor and brood caves alone."
      condition: "Provide its own group and verify overlap in soft to moderately soft water."
    - species: "Hyphessobrycon herbertaxelrodi"
      reason: "An adult shoal occupies the middle layers and avoids direct competition for spawning shelters."
      condition: "A stocked community needs more room than the harem-only minimum; fry survival is not assured."
  unsuitable:
    - species: "Apistogramma agassizii"
      reason: "Another territorial dwarf cichlid competes for the same lower-level cover and breeding areas."
      condition: "Unsuitable for the recommended minimum; no documented hybrid claim is implied."
    - species: "Astronotus ocellatus"
      reason: "The large predatory adult can consume or injure a dwarf cichlid."
    - species: "Maylandia lombardoi"
      reason: "Intense mbuna aggression and different feeding and habitat requirements make this a poor community
        combination."
    - species: "Neocaridina davidi"
      reason: "Small dwarf shrimp and their young are normal-sized invertebrate prey."
profile:
  overview:
    text: "The cockatoo dwarf cichlid is a small upper Amazon fish whose breeding life revolves around shelters on
      the aquarium floor. A male may court several females, each tending her own brood. Raised front
      dorsal-fin membranes give adult males their familiar silhouette. Wild fish vary in appearance, while
      many red, orange and pale fish in shops belong to selected captive colour lines. These lines are forms
      of Apistogramma cacatuoides, not separate species. The recommended unit is one male with three females
      in a divided aquarium. Captive stock is approachable for someone who already maintains stable water and
      can manage territorial conflict."

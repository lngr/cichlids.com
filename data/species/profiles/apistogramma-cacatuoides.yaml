      region: "Upper Amazon basin in Peru, Colombia and western Brazil"
      waterbody: null
      localities:
        - "Ucayali drainage"
        - "Pachitea drainage"
        - "Upper Amazonas near Leticia and Tabatinga"
        - "Solimoes drainage"
        - "Rio Algodon"
        - "Rio Itaya"
        - "Rio Nanay"
        - "Rio Huallaga"
    confidence: "high"
    rationale: "Catalog of Fishes and FishBase establish the upper Amazon distribution in Peru, Colombia and
      western Brazil, including the Ucayali and Amazonas to Solimoes corridor. Generator, checker-b and
      checker-c agree on this core; checker-a names additional Peruvian drainages. The 2010 species-specific
      experiment identifies Algodon, Itaya, Nanay and Huallaga stocks, so these localities are included.
      Comparative cacatuoides specimens in the 2012 description support occurrence near Iquitos, but water
      measurements for allpahuayo and paulmuelleri do not transfer to this species. The historical Suriname
      locality was erroneous."

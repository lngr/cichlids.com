  maxSizeCm:
    value:
      male: 8
      female: 5
    confidence: "high"
    rationale: "The sex-specific proposal medians are 8 cm for males and 5 cm for females: generator, checker-b
      and checker-c proposed 8 and 5, while checker-a proposed 7.5 and 5. Staeck and the Nordic species
      register independently support typical aquarium adults around 8 and 5 cm. AKVARISTA distinguishes usual
      8 cm males from occasional 10 cm fish; retailer and hobby accounts sometimes give 9 cm males. Those
      larger reports remain but are not used as typical maxima. Seriously Fish gives 7.5 and 5 cm standard
      length, and FishBase gives 5 cm SL for male or unsexed material; neither is automatically equivalent to
      total aquarium length or a separate female maximum. The decided values describe ordinary aquarium total
      lengths."

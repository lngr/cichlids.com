  lifespanYears:
    value:
      min: 2.5
      max: 4.5
    confidence: "low"
    rationale: "Generator proposes 2 to 4 years, checker-a 3 to 5, checker-b 2 to 5, and checker-c 3 to 4. The
      endpoint medians are 2.5 and 4.5 years, retained as an approximate aquarium estimate with low confidence
      rather than measured survival endpoints. AKVARISTA reports a usual 2 to 3 years with older fish
      possible, Dietzenbach 3 to 4 years and Green Aqua around 5 years. Thus the decided range is narrower
      than the combined source envelope of about 2 to 5 years and lies within reported estimates. Checker-a
      general model knowledge does not strengthen longevity evidence. The reported four-year wild maximum is
      retained separately from aquarium life expectancy, and no longitudinal study was read."

  breeding:
    text: "A female usually attaches eggs inside a cavity and performs the close care of eggs and young. The male
      often guards a wider area, but the female may drive him away strongly enough to require separation.
      Provide several sheltered choices rather than forcing both fish around one exposed cave. Captive lines
      can reproduce in moderately mineralized, near-neutral water, whereas some wild populations need softer
      and more acidic conditions. Match the breeding approach to the stock rather than treating every
      population alike. Once fry swim freely, suitably tiny foods such as newly hatched Artemia support
      growth, accompanied by careful maintenance. Community companions or a parent may consume young. Brief
      mouth transport of fry does not make this species a mouthbrooder."

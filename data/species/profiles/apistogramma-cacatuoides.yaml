  problems:
    text: "Persistent hiding, exclusion from food and repeated chasing can reveal a failed territorial arrangement
      before injuries become severe. Other practical difficulties include misidentified juvenile sexes,
      excessive current, dirty water and food that newly acquired fish refuse. Spawning alone does not
      establish that adults are thriving: a legacy account reports repeated losses in a small community
      despite reproduction, without a confirmed cause. Review stocking, refuge access and maintenance when
      fish deteriorate. Quarantine arrivals and investigate lasting changes in appetite, breathing or body
      condition. Neither a single forum symptom report nor a broad care range can diagnose disease. Avoid
      abrupt chemical changes intended to force one universal ideal value onto fish from different
      populations."

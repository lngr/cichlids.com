  khDkh:
    value:
      min: 4
      max: 16
    confidence: "low"
    rationale: "The settled tally adopts 4 to 16 dKH with low confidence. Generator proposed 0 to 16, checker-a
      0.5 to 14, and checker-b, checker-c, tiebreaker-1 and tiebreaker-2 4 to 16 dKH; the four matching votes
      determine the range. A specialist discussion attributes 4 to 16 dKH to collecting literature, and
      separate secondary accounts reproduce a 14 dKH locality reading. Some accounts repeat the same older
      measurement, with conflicting locality descriptions, and the primary methods and seasonal coverage were
      not read. Hellweg reports near-zero alkalinity qualitatively and the undated Requena entry gives KH
      zero; these lower observations remain as dissenting evidence but do not establish a confirmed numerical
      collecting series. Dilute habitats could lie below 4 dKH. Conductivity, pH and GH are not substituted
      for KH; checker-a conductivity estimates are explicitly unsupported. Natural KH has no verification
      object."

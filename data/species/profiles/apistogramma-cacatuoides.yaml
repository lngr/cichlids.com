        foods:
          - "Artemia"
          - "Daphnia"
          - "small insect larvae"
          - "small sinking pellets"
          - "frozen crustaceans"
      rationale: "All four full-profile votes agree on invertivore and bloatSensitive false; the tally retains
        unanimous verification and high confidence. Seriously Fish describes natural prey dominated by bottom
        invertebrates, and the Nordic account independently identifies aquatic insects and larvae. Magazine
        husbandry and legacy snail observations reinforce animal feeding. Prepared-food acceptance, including
        the inherited omnivore interpretation of Maidenhead, does not establish a plant-and-animal natural
        diet. The false flag concerns the rubric protein-related bloat incompatibility, not immunity to
        infection or overfeeding. FishBase has no populated diet-composition rows here and its trophic
        estimate uses related fishes. Foods remain exactly those selected by the tally despite different
        illustrative lists in the four proposals."

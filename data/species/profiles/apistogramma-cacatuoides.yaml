  temperatureC:
    value:
      min: 27
      max: 27
    confidence: "low"
    rationale: "The tally retains 27 to 27 C by qualified majority, with five of six votes agreeing. Generator,
      checker-b, checker-c, tiebreaker-1 and tiebreaker-2 proposed that point interval; checker-a proposed 25
      to 29 C from regional extrapolation and measurements at Corydoras sites. The latter paper reports the
      wider 24.5 to 27 C range for another species, not confirmed cacatuoides habitat. PlayFish reproduces a
      27 C field observation attributed to Linke and Staeck; a specialist discussion gives identical chemistry
      with a conflicting locality label, so these are not independent field measurements. Aquariumwereld and
      Fischlexikon also report about 27 C without seasonal sampling. FishBase gives 24 to 25 C from aquarium
      atlas reference 1672. The decided entry records sparse observed temperature, not a constant natural
      requirement or full seasonal range. The exceptional modified fish-farm observation of 34.1 C is
      excluded. Confidence remains low."

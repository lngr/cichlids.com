    tolerance:
      value:
        min: 22
        max: 29
      confidence: "medium"
      rationale: "All six agents propose 22 to 29 C; the tally retains that range, qualified-majority verification
        with six of six agreeing votes, and medium confidence. Seriously Fish supplies the broad maintenance
        interval; Maidenhead gives 24 to 27 C, Staeck 23 to 26 C, and breeding reports and the 2014 experiment
        establish successful keeping around 24 to 26 C within it. AquariumDomain instead gives 17.8 to 25.6 C,
        and mailing-list reports include 32 to 33 C for only three or four months. These colder and hotter
        observations remain but do not establish years of health at those extremes. The decided tolerance is
        narrower than that full reported temperature span and contains the 27 C natural observation. Routine
        conditions should generally sit inside the endpoints, matched to the stock."

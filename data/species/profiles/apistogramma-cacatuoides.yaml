    tolerance:
      value:
        min: 0
        max: 20
      confidence: "medium"
      rationale: "Generator, checker-b and checker-c propose 0 to 20 dGH; checker-a, tiebreaker-1 and tiebreaker-2
        propose 0 to 19. All six agree within the 2 dGH vote threshold. The tally retains the rounded
        agreeing-endpoint median of 0 to 20, qualified-majority verification and medium confidence. Seriously
        Fish gives 0 to 15, FishBase 5 to 19 from an aquarium atlas, AKVARISTA routine care 5 to 20,
        Maidenhead an upper 10 and Dietzenbach 2 to 12 dGH. The wider AKVARISTA recommendation supplies the 20
        endpoint; the 19 endpoint advocated by both tie-breakers has stronger database provenance but does not
        replace the fixed tally result. The tolerance contains natural 2 to 17 dGH. Zero denotes a rounded
        very-soft-water recommendation, not chemically mineral-free water. The upper end is less securely
        supported than the middle, and reproductive success is population dependent. Inherited KH-to-GH and
        conductivity-to-GH estimates remain flagged as unsupported."

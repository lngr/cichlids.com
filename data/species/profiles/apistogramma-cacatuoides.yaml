  husbandry:
    text: "For one male and three females, the planning minimum is 101 nominal litres with an 80 by 35 cm floor.
      This combines the proposal medians with published guidance for a harem above 100 litres and at least 80
      cm long; another association article recommends a roomier 100 by 40 cm base. Divide the floor with wood
      and vegetation so females have secluded cave areas and routes out of view. Add more shelters than
      females, fine sand for foraging and shaded resting places. Use mature filtration without forcing strong
      current through the occupied floor. Make regular partial water changes and monitor feeding and
      maintenance. Around 24 to 26 C lies within several routine husbandry recommendations. The broad
      tolerance entries describe conditional limits across stocks, especially the uncertain high KH endpoint,
      rather than ideal targets or interchangeable combinations."
    sources:
      - kind: "literature"
        title: "Ricca, M. (2003). Apistogramma cacatuoides. PlayFish 3, 6-9, CIR hobby association article"

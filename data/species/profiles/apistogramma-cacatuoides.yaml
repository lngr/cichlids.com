    tolerance:
      value:
        min: 0
        max: 16
      confidence: "low"
      rationale: "Generator, checker-b, checker-c, tiebreaker-1 and tiebreaker-2 propose 0 to 16 dKH; checker-a
        proposes 0 to 17. All six agree within the 2 dKH threshold, and the tally retains 0 to 16 with
        qualified-majority verification and low confidence. It is narrower than checker-a's forum-derived 0 to
        17 proposal; that upper reading remains as evidence, but its duration and units are uncertain.
        Dietzenbach explicitly recommends 0 to 8, Garnelio 3 to 8 and AquariumDomain 2 to 15 dKH. Two
        specialist aquarium accounts separately report spawning at KH 5; low-KH guidance also exists. The 16
        upper endpoint is inherited from the decided natural range to satisfy containment, not demonstrated in
        a years-long aquarium trial. Zero is similarly a rounded care-sheet endpoint. GH and conductivity
        cannot provide KH limits, and the full interval remains provisional."

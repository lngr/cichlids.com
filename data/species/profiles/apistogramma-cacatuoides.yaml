  sizeAndGrowth:
    text: "Typical well-kept aquarium adults reach about 8 cm for males and 5 cm for females when the tail is
      included. Some accounts describe larger males, but exceptional specimens do not determine this stocking
      estimate. Database sizes expressed as standard length exclude the caudal fin and must be compared
      carefully with aquarium total lengths. Juvenile shop fish need space for the territories they will
      establish as adults. Males develop longer fins and a heavier head as they mature. The profile uses an
      approximate lifespan of 2.5 to 4.5 years, derived from differing aquarium estimates spanning roughly two
      to five years. This is an uncertain ordinary-life estimate rather than a measured guarantee."

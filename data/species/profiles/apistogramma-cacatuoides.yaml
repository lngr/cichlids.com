  sexing:
    text: "Adult males usually outgrow females and develop stronger dorsal-fin extensions and elongated unpaired
      fins. Adult females tend to have shorter fins and dark pelvic-fin markings, with conspicuous yellow and
      black colouring during brood care. Selected colour lines can obscure simple colour-based rules. A young
      or subordinate male may initially resemble a female, so use body proportions and fin development
      together and reassess as the fish grow. A shop-sold pair can still be incorrectly sexed or incompatible.
      An unnoticed second male changes the social arrangement and can create severe pressure in a tank planned
      for one."

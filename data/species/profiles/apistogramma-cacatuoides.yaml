  habitat:
    text: "Native populations occur in the upper Amazon basin of Peru, Colombia and western Brazil, from the
      Ucayali and Pachitea systems toward Tabatinga. Fish use shallow, sheltered margins with fallen leaves,
      branches and sometimes flooded land vegetation. Occupied waters differ in mineral content and acidity. A
      Colombian collector reported pH 5.5, while secondary collecting literature extends to pH 8.0 and 17 dGH.
      The tallied pH entry of 5.8 to 8.0 is a median compromise that does not encompass that 5.5 observation.
      The 27 C natural temperature entry is a sparse field point, not a complete seasonal range. A repeated 27
      C, pH 7.6, GH 12 and KH 14 record has inconsistent locality labels. An exceptional modified fish-farm
      account near Paujil reported 34.1 C and pH 8.2; these values are excluded from natural and aquarium
      ranges. Regional water measurements for other species do not establish this fish's chemistry."

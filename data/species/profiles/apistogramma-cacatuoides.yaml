  diet:
    text: "Small invertebrates form the main natural food category. Offer suitably sized crustaceans and insect
      larvae, with accepted small pellets providing a practical part of aquarium feeding. Spread food so
      sheltered females also get a share, and remove uneaten excess. Fine substrate lets the fish search and
      sift rather than compete only at the surface. Small snails and dwarf shrimp may be eaten. Accounts of
      males taking their own young or other fry support opportunistic fish predation, while larger adult
      dither fishes are usually suitable. The level-1 category uses the rubric's approximate 2 cm threshold; a
      measured prey-size limit is unavailable. The protein-related bloat flag is false, which does not rule
      out digestive illness or poor food hygiene."

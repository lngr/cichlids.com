  ph:
    value:
      min: 5.8
      max: 8
    confidence: "low"
    rationale: "No qualified majority settled the natural pH range. Generator and checker-c proposed 5.5 to 8.0,
      checker-a 5.4 to 7.6, and checker-b, tiebreaker-1 and tiebreaker-2 6.0 to 8.0. The tally uses the median
      of all lower and upper endpoints, rounded to one decimal, yielding 5.8 to 8.0 with low confidence and
      three of six votes in the leading agreement cluster. This is a procedural compromise, not a measured pH
      5.8 lower limit. It is narrower than the combined species-specific source envelope of 5.5 to 8.0: the
      Colombian firsthand collecting report gives 5.5, while AKVARISTA relays Staeck values of 6.6 to 8.0 and
      Vierke records of 6.0 and 7.1. Hohl independently measured 6.6 to 7.5 west of Pucallpa. The Corydoras
      paper gives a regional 5.4 to 6.3 span without confirmed cacatuoides at those stations. FishBase lists
      6.0 to 8.0 from aquarium literature. All differing evidence remains. The pH 8.2 fish-farm observation is
      exceptional and excluded; the retained median is plausible but does not cover every recorded
      population."

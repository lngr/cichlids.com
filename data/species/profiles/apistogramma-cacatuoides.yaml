      rationale: "The tally qualified majority retains level 1 with medium confidence: generator, checker-b,
        checker-c, tiebreaker-1 and tiebreaker-2 proposed 1, and checker-a proposed 0. Direct aquarium
        accounts describe males intentionally consuming their own free-swimming young and guppy fry, including
        a witnessed event after reintroduction to a brood. These outweigh interpreting an invertebrate diet or
        generally uneaten adult tankmates as absence of opportunistic fish predation. Maidenhead gives that
        reassuring adult-community statement, and its level-0 interpretations remain in evidence. Legacy snail
        accounts concern invertebrates and cannot decide fish predation. The rubric supplies the approximate 2
        cm category threshold; no source measures a species-specific maximum prey length. Regular piscivory is
        unsupported."

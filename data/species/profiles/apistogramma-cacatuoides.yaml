    rationale: "All four proposals are moderate. Captive strains are commonly recommended as an introduction to
      Apistogramma, and some sources grade them easy relative to other dwarf cichlids. The species-wide
      profile still requires stable maintenance, correct sex recognition, divided territories and
      population-appropriate water conditions. Seriously Fish independently gives moderate. Legacy losses in a
      small community lack a confirmed diagnosis, so they do not supply a numerical water limit or justify

        - by: "checker-b"
          value: 1
        - by: "checker-c"
          value: 1
        - by: "tiebreaker-1"
          value: 1
        - by: "tiebreaker-2"
          value: 1
      decision: 1
      rationale: "The generator, checker-b, checker-c, tiebreaker-1 and tiebreaker-2 propose level 1; checker-a
        proposes 0. The tally selects level 1 by qualified majority, five of six, with low confidence.
        FishBase, Malawi.si and the Nordic register establish benthic invertebrate feeding, without direct
        measurements of fish-prey size or frequency. AquaInfo limits the initial period when a mother leaves
        released fry uneaten, indirectly supporting later fry risk. Studio Scaped explicitly cautions about
        very small prey fish but has questionable colour and habitat-hardness statements and is treated as a
        low-weight website. Aquario calls the combined maylandi and Kande fish nonpredatory but confuses Kande
        sexual coloration. Level 1 is the decided precaution for fry and tiny fish; the rubric threshold near
        2 cm is not an observed species-specific measurement. Levels 2 and 3 lack support."

    rationale: "The tally fixes natural alkalinity equivalents at 5 to 8 dKH. Branchu gives about 6.5 to 6.9 dKH
      after conversion; the older lake measurements compiled by Vanden Bossche and Bernacsek give about 5.6 to
      7.3 dKH. These support the rounded lake envelope. Sodium contributes to bicarbonate buffering, so KH
      exceeding GH is chemically consistent. Natural KH is a plain fact and carries no verification object."

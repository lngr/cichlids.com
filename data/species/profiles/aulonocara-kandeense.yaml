  sizeAndGrowth:
    text: "Plan for typical adult aquarium maxima of about 14 cm for males and 10 cm for females. Some sources
      report larger fish, including males near 16 cm, so these are planning estimates rather than absolute
      limits. FishBase uses standard length, which excludes the tail and cannot be treated as aquarium total
      length. Measured portions help avoid excessive growth and poor condition."
    sources:
      - kind: "database"
        title: "Nordiska Ciklidsallskapet: Aulonocara kandeense species register"
        accessed: "2026-10-13"
        url: "https://www.ciklid.org/artregister/art.php?ID=623"

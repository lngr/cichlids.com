  legacyNames:
    - "Aulonocara kandeensis"
  note: "The current Catalog of Fishes accepts A. kandeense separately from A. maylandi and gives 1987. AquaInfo
    and the CRC public page give 1988; the current taxonomic authority takes precedence. FishBase still
    carries a remark about the superseded October 2012 synonymy, and Seriously Fish combines the Kande
    population with maylandi. Neither changes the accepted species identity. The original description was not
    retrieved as open-access full text. CRC was used only to verify the accepted name and maternal
    mouthbrooding; its protected feeding detail was unavailable."

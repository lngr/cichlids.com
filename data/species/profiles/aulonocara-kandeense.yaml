        title: "Fishkeeper, Maidenhead Aquatics: Electric Blue Hap, Sciaenochromis fryeri"
        url: "https://www.fishkeeper.co.uk/fish/freshwater/cichlids/electric-blue-hap"
        accessed: "2026-10-13"
  problems:
    text: "Poor water quality, unstable chemistry and assertive companions are common husbandry pressures. Coarse
      or sharp substrate can interfere with feeding and damage the tissues used during sand sifting. Check
      water quality, oxygenation, food intake and social access when fish become withdrawn. Swelling or
      appetite loss alone cannot establish a diagnosis. The available sources provide husbandry estimates
      rather than controlled long-term trials of lifespan or tolerance limits."
    sources:
      - kind: "database"

    value:
      min: 21
      max: 29
    confidence: "high"
    rationale: "The tally fixes the Lake Malawi habitat envelope at 21 to 29 C with high confidence. Eccles
      supplies the cool inshore endpoint; Branchu and Vollmer independently describe warm surface water and
      seasonal variation. The 29 C bound is retained from the lake-wide synthesis, rather than inferred from
      their narrower observations. None of these observations is a year-round Kande Island series. Eccles was
      available only as an abstract; the non-DOI renewal report and dissertation in the lake bibliography were
      not independently retrieved and are not cited as measurement evidence."

partners:
  suitable:
    - species: "Placidochromis electra"
      reason: "A gentle Malawi cichlid whose species account permits Aulonocara companions; both benefit from calm
        neighbours."
      condition: "Use a larger tank than the single-species minimum, retain open sand and provide separate retreats."
    - species: "Copadichromis chrysonotus"
      reason: "Its species account permits most Aulonocara, with a caution about similarly coloured rivals."
      condition: "Increase tank capacity for both social units and avoid individuals that treat the blue orchid male
        as a colour rival."
    - species: "Lethrinops lethrinus"
      reason: "A gentle sand-foraging Malawi cichlid that AquaInfo permits with calm Aulonocara; its larger adult
        size requires substantially more room."
      condition: "Around 200 cm aquarium length with broad sand areas, room for its group and separate refuge space."
  unsuitable:
    - species: "Aulonocara maylandi"
      reason: "Shares the presumed aulonocara crossing group; the similar appearance and uncertain female
        identification make a breeding community inappropriate."
    - species: "Aulonocara stuartgranti"
      reason: "Shares the presumed aulonocara crossing group and can introduce reproductive competition into a quiet
        breeding harem."
    - species: "Sciaenochromis fryeri"
      reason: "Shares the presumed sciaenochromis-fryeri-aulonocara group. Sources report spawning or reproductive
        interference with unnamed peacock females, without verified Kande parentage."
    - species: "Melanochromis auratus"
      reason: "A forceful mbuna choice inconsistent with the species-specific advice to avoid aggressive and busy
        mbuna."
profile:
  overview:
    text: "The blue orchid peacock is a natural Lake Malawi species restricted to Kande Island. Its accepted name
      is Aulonocara kandeense; kandeensis and the former subspecies label remain common in the aquarium trade.
      A dominant male has a dark body and pale head blaze, contrasting with the yellow blaze of the separate
      A. maylandi. Reliable identification matters especially when buying uncoloured females."
    sources:
      - kind: "catalog-of-fishes"
        title: "Eschmeyer's Catalog of Fishes: species of Aulonocara"
        url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Au\
          lonocara"
        accessed: "2026-10-13"
      - kind: "database"
        title: "FishBase: Aulonocara kandeense species summary"
        url: "https://www.fishbase.se/summary/Aulonocara-kandeense.html"
        accessed: "2026-10-13"
      - kind: "database"
        title: "AquaInfo: Aulonocara kandeense, Blue Orchid Peacock"
        url: "https://aquainfo.nl/en/article/aulonocara-kandeense-blue-orchid-peacock/"
        accessed: "2026-10-13"
      - kind: "database"
        title: "Nordiska Ciklidsallskapet: Aulonocara kandeense species register"
        accessed: "2026-10-13"
        url: "https://www.ciklid.org/artregister/art.php?ID=623"
  habitat:
    text: "Rock shelter beside open sand is the essential habitat combination. Males defend rock-associated
      breeding sites while females forage over the nearby substrate. Depth reports span about 3 to 25 m and do
      not resolve a precise preferred band. The lake-wide natural envelope is 21 to 29 C, pH 7.7 to 8.6, GH 3
      to 5 dGH and KH 5 to 8 dKH. These are lake values, not a continuous Kande Island measurement series."
    sources:
      - kind: "database"
        title: "Malawi.si: Aulonocara kandeense, Kande Island"
        accessed: "2026-10-13"
        url: "https://www.malawi.si/malawibylocations/Kande%20Island/slides/Aulonocara%20kandeense%20%27Kande%20Islan\
          d%27.html"

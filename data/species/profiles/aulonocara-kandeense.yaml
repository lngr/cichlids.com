      rationale: "All four full-profile runs agree on invertivore and bloatSensitive false, which the tally verifies
        unanimously with medium confidence. Their food lists differ: the generator supplies snails, insect
        larvae, crustaceans, pellets, Artemia and mysis; checker-a adds Tubifex and spirulina flakes;
        checker-b adds Cyclops and sinking food; checker-c proposes snails, larvae, crustaceans and
        animal-based pellets. The exact generator list selected by the tally is retained. FishBase, Malawi.si,
        the Nordic register and AquaInfo support benthic invertebrates, including snail feeding. False means
        that a special high-protein dietary conflict is unestablished, not immunity to intestinal illness.
        Dietzenbach offers a generic bloat and bloodworm warning, without a Kande-specific protein-sensitivity
        study. Schwalbe was readable as a related-species abstract only and supports sensory prey detection,
        not a measured Kande diet composition. Aqualog labels the older subspecies omnivore, but its care
        table is less specific about natural prey than the independent specialist accounts."

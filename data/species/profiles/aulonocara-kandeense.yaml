        accessed: "2026-10-13"
        url: "https://www.ciklid.org/artregister/art.php?ID=623"
      - kind: "database"
        title: "Malawi.si: Aulonocara kandeense, Kande Island"
        accessed: "2026-10-13"
        url: "https://www.malawi.si/malawibylocations/Kande%20Island/slides/Aulonocara%20kandeense%20%27Kande%20Islan\
          d%27.html"
  compatibility:
    text: "Calm Malawi cichlids can share a larger aquarium when every social unit has space and feeding access.
      Placidochromis electra and Copadichromis chrysonotus are conditional possibilities; the latter can react
      to similar colours. A Lethrinops lethrinus group needs considerably more room, around a two-metre tank.
      Avoid forceful mbuna, other peacocks in breeding groups, and Sciaenochromis fryeri. Both crossing groups
      are presumed: the sources describe general peacock mixing risk or fryeri interactions with unnamed
      peacock females, rather than verified Kande parentage."
    sources:

        accessed: "2026-10-13"
        url: "https://www.malawi.si/malawibylocations/Kande%20Island/slides/Aulonocara%20kandeense%20%27Kande%20Islan\
          d%27.html"
      - kind: "database"
        title: "AquaInfo: Aulonocara kandeense, Blue Orchid Peacock"
        url: "https://aquainfo.nl/en/article/aulonocara-kandeense-blue-orchid-peacock/"
        accessed: "2026-10-13"
      - kind: "database"
        title: "FishBase: Aulonocara kandeense species summary"
        url: "https://www.fishbase.se/summary/Aulonocara-kandeense.html"
        accessed: "2026-10-13"
  husbandry:
    text: "For one male and four females, allow at least 400 litres with a base around 150 by 50 cm. Provide fine
      sand, secure rock shelters and several retreats separated by broken sight lines. Use mature biological
      filtration, good gas exchange and regular partial water changes. About 24 to 26 C is a supported routine
      target. The broader tolerance envelopes are uncertain at their endpoints; measure GH and KH separately
      and favour stable replacement water."
    sources:
      - kind: "database"
        title: "Einrichtungsbeispiele: Aulonocara kandeense husbandry record"
        accessed: "2026-10-13"
        url: "https://www.einrichtungsbeispiele.de/zierfische/malawisee/aulonocara-kandeense-slnk.html"
      - kind: "database"
        title: "Malawi.si: Aulonocara kandeense, Kande Island"
        accessed: "2026-10-13"
        url: "https://www.malawi.si/malawibylocations/Kande%20Island/slides/Aulonocara%20kandeense%20%27Kande%20Islan\
          d%27.html"
      - kind: "database"
        title: "AquaInfo: Aulonocara kandeense, Blue Orchid Peacock"
        url: "https://aquainfo.nl/en/article/aulonocara-kandeense-blue-orchid-peacock/"
        accessed: "2026-10-13"
      - kind: "database"
        title: "Seriously Fish: Aulonocara maylandi, including the Kande Island population under its former
          subspecific name"
        url: "https://www.seriouslyfish.com/species/aulonocara-maylandi-maylandi/"
        accessed: "2026-10-13"
  socialBehavior:
    text: "A male can repeatedly court females and drive fish away from his spawning patch. Four females help
      distribute that attention, provided each has usable cover and access to food. The minimum harem tank is
      planned around one male. Accounts disagree about multiple-male colonies, so they need a separate space
      and refuge assessment. Persistent hiding or missed meals can reveal social suppression before injuries
      appear."
    sources:
      - kind: "database"
        title: "AquaInfo: Aulonocara kandeense, Blue Orchid Peacock"
        url: "https://aquainfo.nl/en/article/aulonocara-kandeense-blue-orchid-peacock/"
        accessed: "2026-10-13"
      - kind: "database"
        title: "Seriously Fish: Aulonocara maylandi, including the Kande Island population under its former
          subspecific name"
        url: "https://www.seriouslyfish.com/species/aulonocara-maylandi-maylandi/"
        accessed: "2026-10-13"
      - kind: "database"
        title: "Malawi.si: Aulonocara kandeense, Kande Island"
        accessed: "2026-10-13"
        url: "https://www.malawi.si/malawibylocations/Kande%20Island/slides/Aulonocara%20kandeense%20%27Kande%20Islan\
          d%27.html"
  diet:
    text: "This species primarily takes benthic invertebrates, including small crustaceans, larvae and snails.
      Offer suitable complete cichlid food with modest aquatic invertebrate supplements such as Artemia or
      mysis. Preserve accessible fine sand for foraging and avoid large portions that leave waste. A special
      protein-sensitive dietary conflict is not established, although digestive illness can still occur.
      Occasional fry or tiny-fish predation remains a precaution with low confidence; a species-specific
      prey-size threshold has not been measured."
    sources:
      - kind: "database"
        title: "FishBase: Aulonocara kandeense species summary"
        url: "https://www.fishbase.se/summary/Aulonocara-kandeense.html"
        accessed: "2026-10-13"
      - kind: "database"
        title: "AquaInfo: Aulonocara kandeense, Blue Orchid Peacock"
        url: "https://aquainfo.nl/en/article/aulonocara-kandeense-blue-orchid-peacock/"
        accessed: "2026-10-13"
      - kind: "database"
        title: "Nordiska Ciklidsallskapet: Aulonocara kandeense species register"
        accessed: "2026-10-13"
        url: "https://www.ciklid.org/artregister/art.php?ID=623"
      - kind: "database"
        title: "Tropical Fish Site: Blue Orchid, Aulonocara kandeense"
        url: "https://www.tropicalfishsite.com/blue-orchid-aulonocara-kandeense/"
        accessed: "2026-10-13"
  breeding:
    text: "The female carries the developing brood in her mouth after spawning at a defended substrate site.
      Brooding accounts usually describe roughly three to four weeks, with differences between sources. A
      carrying female may eat little and needs cover from repeated male attention. Released fry are vulnerable
      in a community tank. Raising a known line requires securely identified parents and accommodation that
      protects the fry without prolonged social disruption of the mother."
    sources:
      - kind: "database"
        title: "AquaInfo: Aulonocara kandeense, Blue Orchid Peacock"
        url: "https://aquainfo.nl/en/article/aulonocara-kandeense-blue-orchid-peacock/"
        accessed: "2026-10-13"
      - kind: "database"
        title: "Seriously Fish: Aulonocara maylandi, including the Kande Island population under its former
          subspecific name"
        url: "https://www.seriouslyfish.com/species/aulonocara-maylandi-maylandi/"
        accessed: "2026-10-13"
      - kind: "database"
        title: "Malawi.si: Aulonocara kandeense, Kande Island"
        accessed: "2026-10-13"
        url: "https://www.malawi.si/malawibylocations/Kande%20Island/slides/Aulonocara%20kandeense%20%27Kande%20Islan\
          d%27.html"
  sexing:
    text: "Settled adult males develop a deep blue to almost black body with a light head blaze and dorsal
      marking. Females remain mostly silvery and usually smaller; young or suppressed males can also appear
      subdued. Colour and size together help assess sex, but a pale female from a mixed peacock tank cannot be
      identified reliably by appearance alone."
    sources:
      - kind: "database"
        title: "AquaInfo: Aulonocara kandeense, Blue Orchid Peacock"
        url: "https://aquainfo.nl/en/article/aulonocara-kandeense-blue-orchid-peacock/"
        accessed: "2026-10-13"

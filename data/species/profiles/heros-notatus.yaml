  khDkh:
    value:
      min: 0
      max: 1
    confidence: low
    rationale: "The settled natural range is 0 to 1 dKH with low confidence; as required, this natural KH fact has\
      \ no verification object. The generator and checker-c proposed 0 to 1, checker-a and checker-b 0 to 0.2. The\
      \ seasonal compilation gives total alkalinity equivalent to about 0.43 to 0.69 dKH; the Educandos study gives\
      \ a regional 0 to 0.151 dKH equivalent and untreated Sao Gabriel samples imply 0.017 to 0.021 dKH on an assumed\
      \ CaCO3 basis. Total alkalinity in humic water can include organic contributions and is not a direct carbonate\
      \ measurement. The generator's zero field-kit reading and checker inferences are retained. Low pH and conductivity\
      \ alone cannot determine KH, and GH is not convertible to KH. The practical rounded band represents negligible\
      \ buffering with substantial site and methodological uncertainty."

  husbandry:
    text: "Use at least 400 litres with about 140 cm length and 50 cm front-to-back space for a compatible adult\
      \ pair; this footprint is a reasoned compromise among differing published minima. Additional fish require\
      \ more room. Arrange secure wood and sheltered retreats around clear swimming routes, with sand for digging\
      \ and nursery pits. Plants may supply cover but can be eaten or uprooted. Maintain filtration, surface gas\
      \ exchange and regular matched water changes. Around 26 to 28 C and pH 6 to 7 is a reasonable starting point\
      \ for acclimated stock, adjusted to its history. The wider recorded tolerances of 22 to 31 C, pH 3.9 to 7.2,\
      \ GH 0 to 10 dGH and KH 0 to 5 dKH include habitat-based extensions and uncertain endpoints; they are not\
      \ instructions to aim at either extreme."
    sources:

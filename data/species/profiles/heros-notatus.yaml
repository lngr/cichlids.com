  legacyNames:
    - Heros notatus
  note: "Heros notatus is valid and Centrarchus notatus is its original combination. The Catalog gives an unknown\
    \ type locality and rejects a restriction to the Essequibo; its distribution entry lists the Essequibo drainage.\
    \ FishBase and Seriously Fish instead place the species in the Rio Negro, and the Nordic association includes\
    \ both regions. This profile concerns the requested Rio Negro catalog fish and retains the unresolved geographic\
    \ attribution. Heros severus and H. efasciatus are separate valid species, not synonyms. CRC public content\
    \ confirms taxonomy and original combination but supplies no accessible numerical water, feeding or breeding\
    \ data. One checker could not archive that page, but the public page was subsequently read successfully through\
    \ crc.mjs. Exact-name searches of the cichlids.com forum archive found no posts; the reported epithet-only matches\
    \ concern unrelated catfish. FishBase has no species diet-composition entries, and reported failures of its\
    \ ecology and prey endpoints supply no evidence."

    rationale: "FishBase and Seriously Fish identify the Rio Negro basin, whereas the Catalog lists the Essequibo\
      \ drainage. The Nordic association includes both and lists Rio Jauaperi and Igarape Taruma Acu collecting\
      \ localities. Retain these localities as reported, not genetically verified population limits. The generator\
      \ and checker-a emphasize the Negro and mention Essequibo, while checker-b and checker-c name both drainages.\
      \ Retailer records of Tocantins and the association's additional drainages remain source claims rather than\
      \ established extensions of this profile. No waterbody-table entry applies. The Sao Paulo shoreline blackwater\
      \ paper is retained as a consulted source but its coastal chemistry is geographically inapplicable."

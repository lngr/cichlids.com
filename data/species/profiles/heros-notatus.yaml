  socialBehavior:
    text: "Retain a compatible pair as the adult unit. Young fish can select partners from a group when space and\
      \ arrangements for surplus adults are available. Merely putting an adult male and female together does not\
      \ establish compatibility. Routine displays and chasing can intensify during brood care, when the pair may\
      \ exclude neighbours from a substantial area. The large breeding-territory classification is an inference\
      \ rather than a measured radius. Loss of feeding access, persistent hiding or repeated pursuit calls for separation\
      \ and reassessment. Larger groups are reported elsewhere, but need more space than the pair minimum."

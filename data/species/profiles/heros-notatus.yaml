      decision: slow
      rationale: "The generator, checker-b and checker-c propose slow; checker-a proposes normal from ready food\
        \ acceptance and begging. The Nordic association directly describes comparatively deliberate Heros feeding\
        \ in its notatus account, so slow has stronger behavioural support than inferring speed from appetite. The\
        \ account partly draws on genus experience, which limits confidence to medium. Ensure the fish actually\
        \ obtain food beside faster companions."

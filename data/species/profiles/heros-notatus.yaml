  sizeAndGrowth:
    text: "Allow provisionally for males around 25 cm and females around 20 cm. These are aquarium planning estimates,\
      \ with the female maximum particularly uncertain. Published accounts range from a 15 cm standard-length record\
      \ to 30 cm claims and do not consistently separate sexes or length conventions. Neither rapid growth nor a\
      \ fixed final size can be predicted from those figures. The deep adult body needs turning room as well as\
      \ tank volume. An 8 to 12 year lifespan is only a group-based expectation; no reliable notatus longevity series\
      \ was found."

    tolerance:
      value:
        min: 22
        max: 31
      confidence: low
      rationale: "The settled tally gives 22 to 31 C with unanimous verification and low confidence. The generator\
        \ proposed 22 to 30.3, checker-a and checker-b 22 to 31 and checker-c 22 to 30; all agree within the voting\
        \ threshold. Seriously Fish recommends 22 to 29 C, the Nordic association 22 to 30, Fishkeeper 23 to 29,\
        \ Aqua-Fish 23 to 27 and German care pages 24 to 30. The upper endpoint is widened to contain the decided\
        \ natural range, not validated by a lifetime aquarium trial at 31 C. Prefer a stable stock-appropriate temperature\
        \ within the better-supported middle of the range and ensure oxygen exchange. The upper natural-source peaks\
        \ of 34.3, 34.7 and about 35.4 C are not maintenance recommendations."
      sources:
        - kind: database
          title: Seriously Fish. Heros notatus
          url: "https://www.seriouslyfish.com/species/heros-notatus/"

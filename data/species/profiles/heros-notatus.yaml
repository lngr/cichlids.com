        archived: seriouslyfish.com/species/heros-notatus/2026-10-14T100607Z
  habitat:
    text: "Sheltered river margins with submerged roots and fallen timber provide cover. This profile uses the settled\
      \ typical Rio Negro planning ranges of 28 to 31 C, pH 4.0 to 5.9, GH 0 to 1 dGH and KH 0 to 1 dKH. They are\
      \ regional proxies rather than measurements beside voucher-identified fish. Wider observations remain relevant\
      \ context: Anavilhanas temperatures reached 34.7 C, Lago do Prato 34.3 C, and post-drought logger readings\
      \ about 35.4 C. Ramsar reports pH as low as 3.2, an untreated-water study 2.87, and Jauapery seasonal means\
      \ reach 6.30. Those endpoints are not established as this fish's ordinary occupied habitat. The low mineral\
      \ and buffering values are practical rounded descriptions, not chemically ion-free water. Guyana reports are\
      \ retained without assuming identical chemistry across all populations."
    sources:

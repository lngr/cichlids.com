    tolerance:
      value:
        min: 3.9
        max: 7.2
      confidence: low
      rationale: "The settled qualified-majority decision is 3.9 to 7.2 with low confidence, based on 4 of 6 agreeing\
        \ votes. The generator and checker-c proposed 4.5 to 7.2, checker-a 4.0 to 7.0, checker-b and tiebreaker-1\
        \ 3.8 to 7.2, and tiebreaker-2 4.0 to 7.2. The agreeing minima give 3.9 after median calculation; this is\
        \ not an experimentally measured injury threshold. Seriously Fish recommends 6.0 to 7.0 and the Nordic association\
        \ 5.6 to 7.2. The acidic extension is inferred to contain habitat and has not been demonstrated as multiyear\
        \ aquarium maintenance at pH 3.9. The Guyana report documents keeping and reproduction at 6.8 to 6.9, not\
        \ endpoints. AquaInfo's wider upper recommendation of 7.5 is retained but its taxonomic conflation weakens\
        \ attribution; the DCG report's broader 6.5 to 7.6 pools Heros taxa. Neither establishes the requested population's\
        \ upper limit. Natural dissolved organic matter changes the biological effect of low pH, so acidified tap\
        \ water and native blackwater are not interchangeable. Studies of zebrafish or other cichlids cannot establish\
        \ chronic notatus tolerance."

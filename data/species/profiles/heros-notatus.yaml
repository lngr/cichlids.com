  sexing:
    text: "Mature males usually have a larger, deeper body, longer fin extensions and more conspicuous opercular\
      \ markings. Females may have fewer or weaker head spots, but maturity, condition and individual variation\
      \ make these imperfect indicators. Juveniles are difficult to sex from appearance. Observe several traits\
      \ and an established pair rather than treating a colourful specimen or shop label as proof of sex. The numerical\
      \ male and female size estimates are not a reliable sexing test."

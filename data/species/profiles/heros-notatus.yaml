  ph:
    value:
      min: 4
      max: 5.9
    confidence: low
    rationale: "The settled decision is the median range 4.0 to 5.9, with low confidence and 3 of 6 votes in the\
      \ largest agreeing cluster. The generator proposed 4.5 to 6.3, checker-a 4.0 to 5.5, checker-b 3.8 to 5.6,\
      \ checker-c 4.5 to 6.3, tiebreaker-1 3.8 to 6.1 and tiebreaker-2 4.0 to 5.5. The median minimum is 4.0 and\
      \ the median maximum 5.85, rounded to 5.9. This is a provisional typical-water envelope, not a measured species-wide\
      \ boundary. Kuchler's wider basin range is 3.89 to 6.07; Silva reports Negro means of 4.62 to 5.29 and Jauapery\
      \ means of 6.16 to 6.30. Ramsar additionally reports 3.2 to 4.7, 3.8 to 4.9 and lake values of 3.8 to 5.3.\
      \ The physiological paper's regional background of 3.0 to 5.5 and untreated-water series of 2.87 to 5.0 also\
      \ extend below the decision. All remain evidence, but occupancy by correctly identified fish at those endpoints\
      \ is unverified. The median balances differing geographic coverage rather than disproving the wider measurements.\
      \ The Maquari recreation's pH 6.1 is aquarium chemistry and is excluded from natural habitat inference. JBL\
      \ notification-only responses do not substantiate numerical tables."

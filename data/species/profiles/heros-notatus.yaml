        \ and magnesium give approximately 0.042 to 0.048 dGH in the seasonal compilation and about 0.119 dGH in\
        \ freshly collected Negro water. Untreated Sao Gabriel samples imply 0.075 to 0.148 dGH if their hardness\
        \ units are CaCO3 equivalents; that reporting basis is not explicit. Zero denotes near-zero hardness at\
        \ ordinary aquarium-test resolution, not absence of calcium. The rounded planning range allows regional\
        \ variation. Retained checker estimates derived from conductivity cannot quantify GH and do not independently\
        \ establish the upper limit. These studies describe regional waters, not a species-linked hardness series."

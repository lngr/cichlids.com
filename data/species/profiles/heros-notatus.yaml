  compatibility:
    text: "Suitable companions are robust fish too large to swallow that share the chosen warm, soft-water conditions.\
      \ Larger characins, appropriately sized catfish and calm South American cichlids are candidates in an aquarium\
      \ exceeding the pair minimum. The named partner entries are planning examples rather than verified cohabitation\
      \ trials. Very small fish and fry are prey risks, and breeding changes the available space. Different Heros\
      \ species share a presumed crossing caution, with no confirmed freely chosen notatus cross established here.\
      \ Confusing trade identities makes that caution relevant even when actual parentage is unknown. Confirm that\
      \ slower-feeding severums still obtain food and can retreat from other fish."

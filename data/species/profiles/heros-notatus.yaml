  temperatureC:
    value:
      min: 28
      max: 31
    confidence: medium
    rationale: "The settled tally is 28 to 31 C, unanimous within the voting range thresholds, with medium confidence.\
      \ The generator proposed 26.3 to 30.3 C, checker-a and checker-b 28 to 31 C, and checker-c 27 to 30 C. Ramsar\
      \ reports 28 to 31 C for the Negro and the Tambaqui paper cites the same typical seasonal interval; these\
      \ are regional habitat proxies, not measurements beside identified H. notatus. The wider Anavilhanas source\
      \ range of 28.4 to 34.7 C, Lago do Prato range of 29.7 to 34.3 C and drought logger ranges of 30.20 to 35.35\
      \ C or rounded 30.3 to 35.4 C remain in evidence. Their shallow-water daily peaks or exceptional drought heat\
      \ do not define ordinary continuous aquarium conditions. The generator's cooler JBL readings remain a limited-season\
      \ regional claim, not a species minimum. Statistical mean-plus-spread entries are not observed annual endpoints."

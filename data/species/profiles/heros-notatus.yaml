    rationale: "All four main runs proposed level 2, and the tally retains unanimous verification with medium confidence.\
      \ Seriously Fish warns about consumption of much smaller tankmates, the Nordic association describes pursuit\
      \ of small fish and AquariumDomain relates risk to swallowing size. This supports recurrent opportunistic\
      \ fish eating, not a diet dominated by fish. The planner's size threshold is a screening rule, not a guarantee\
      \ that a particular companion cannot be swallowed."
    sources:

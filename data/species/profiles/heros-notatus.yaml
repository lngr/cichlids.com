  diet:
    text: "Provide a mixed menu with a balanced cichlid pellet, vegetable ingredients and modest portions of aquatic\
      \ invertebrates. Dark leafy vegetables or plant-rich prepared foods can supplement the staple. Plant eating\
      \ is common enough that ornamental vegetation may not survive. The species also consumes sufficiently small\
      \ fish, so a calm appearance does not make tiny tankmates safe. Feeding is relatively deliberate compared\
      \ with faster companions; check that each severum receives food. No special protein-triggered bloat syndrome\
      \ has been established, but a meat-heavy menu and excess food are unnecessary."
    sources:

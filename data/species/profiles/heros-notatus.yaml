      rationale: "For a compatible adult pair, component-wise medians are 400 L, 140 cm length and 50 cm depth.\
        \ The generator proposes 400/130/60, checker-a 300/150/50, checker-b 400/150/50 and checker-c 400/130/50.\
        \ The Nordic association states 400 L and 130 cm, Aqua-Fish states 400 L and at least 150 cm for a pair,\
        \ AquariumDomain gives about 284 L for a pair, Seriously Fish gives a 120 by 38 cm base with an approximate\
        \ 173 L calculated volume, and Interaquaristik gives 500 L. The selected volume is directly supported, while\
        \ 140 cm mediates the published 130 and 150 cm lengths. The 50 cm front-to-back dimension is a practical\
        \ inference for turning and screened retreats, not a measured requirement. It exceeds Seriously Fish's explicit\
        \ 38 cm dimension to accommodate two deep-bodied adults and wood cover. Community stocking needs more space.\
        \ Inferred dimensions in retained evidence are not source measurements."

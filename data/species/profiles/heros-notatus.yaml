  breeding:
    text: "A pair deposits eggs on a cleaned exposed surface and both parents defend the developing brood. Inclined\
      \ wood or stone can serve as a spawning surface, while sand provides a place to move larvae. A keeping report\
      \ of Guyana stock documents substrate spawning and subsequent free-swimming fry; the Nordic association also\
      \ describes joint parental care. Defence can extend beyond the egg site, and companions may need to be separated.\
      \ Offer appropriately small foods after the fry begin independent feeding. Published timings are inconsistent\
      \ or partly extrapolated from other severums, so watch development rather than relying on a fixed timetable.\
      \ Mouthbrooding accounts about H. liberifer do not describe this species."

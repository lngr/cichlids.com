  problems:
    text: "Crowded adults, incompatible pairs and fast companions that monopolize food can undermine otherwise reasonable\
      \ care. Very low buffering also increases the need to match replacement water and follow pH trends rather\
      \ than making abrupt adjustments. The lowest pH and highest temperature boundaries are particularly uncertain\
      \ as long-term aquarium conditions. Natural organic-rich blackwater is not reproduced simply by acidifying\
      \ tap water. Quarantine arrivals and investigate declining appetite, unusual breathing, injuries or loss of\
      \ condition by checking water quality and social pressure. The cichlids.com archive search found no usable\
      \ exact-name husbandry thread, so it supplies no confirming community observations."

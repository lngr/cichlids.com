partners:
  suitable:
    - species: Larger deep-bodied characins
      reason: Robust adults may coexist when too large to swallow and suited to the selected water conditions.
      condition: "More space than the pair minimum, screened retreats and feeding access; reassess during brood\
        \ care."
    - species: Appropriately sized South American catfish
      reason: Some robust adults are plausible companions with separate shelters; suitability depends on exact species
        and adult size.
      condition: "Confirm water requirements, swallowing risk and feeding access; this is not a tested species-specific\
        \ pairing."
    - species: Calm South American cichlids of comparable adult size
      reason: "Species accounts allow robust cichlid communities, but individual pairs can defend large breeding\
        \ areas."
      condition: A substantially larger aquarium with distinct refuges and a separation option; avoid other Heros
        species when preserving stock identity.
  unsuitable:
    - species: Paracheirodon innesi
      reason: Small adult size creates a predation risk.
    - species: Heros efasciatus
      reason: Shared presumed heros hybrid group and difficult trade identification make pure breeding stock unreliable.
    - species: Heros severus
      reason: Another distinct Heros species with the same presumed crossing caution and potential breeding rivalry.
    - species: Chindongo demasoni
      reason: Its alkaline-water husbandry and persistent territorial behavior are a poor match for this soft-water
        severum.
profile:
  overview:
    text: "Heros notatus is the spotted severum associated in aquarium sources with the Rio Negro. Its accepted\
      \ identity is distinct from H. severus and H. efasciatus, although trade labels often blur these names. The\
      \ Catalog lists the Essequibo instead, so collection history matters and the geographic disagreement remains\
      \ unresolved. A compatible adult pair needs substantial space and can share a larger aquarium with carefully\
      \ chosen robust fish. Dark spotting, reduced bars and mature male head markings provide useful clues, but\
      \ colour alone cannot verify a dealer's identification."
    sources:
      - kind: catalog-of-fishes
        title: "Eschmeyer's Catalog of Fishes. Species of Heros, updated 21 September 2026"
        url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Heros"
        accessed: '2026-10-13'
        archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-957a51e1/2026-10-14T100404Z

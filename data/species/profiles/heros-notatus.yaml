        \ votes. The generator proposed 0 to 4, checker-a 0 to 10, and checker-b, checker-c, tiebreaker-1 and tiebreaker-2\
        \ 0 to 5. Atlarium lists 1 to 5 dKH and the My Tropical Fish Guyana account reports continued keeping and\
        \ breeding at KH 5, GH 11 and pH 6.8 to 6.9; transfer to the Rio Negro stock remains uncertain. AquariumDomain's\
        \ wider explicit KH recommendation of 4 to 10 remains conflicting evidence, with no duration or supporting\
        \ trial. Its unspecified hardness ceiling of 10 in the prose does not resolve that KH claim. Near-zero buffering\
        \ is included from the natural water; the full interval is a provisional maintenance inference and not a\
        \ demonstrated physiological limit. Neither pH nor GH can be converted into KH. Retained checker entries\
        \ attributed to Seriously Fish are inferences because that source states GH and pH but no KH tolerance."

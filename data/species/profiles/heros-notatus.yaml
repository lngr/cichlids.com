    tolerance:
      value:
        min: 0
        max: 10
      confidence: medium
      rationale: "The settled tally gives 0 to 10 dGH with unanimous agreement within the voting threshold and medium\
        \ confidence. The generator, checker-b and checker-c proposed 0 to 10; checker-a proposed 0 to 12. Seriously\
        \ Fish explicitly supports up to 10 dGH and AquariumDomain's prose agrees. The wider Fishkeeper 0 to 12\
        \ and Aquarium Guide 5 to 12 recommendations remain evidence, as does Aqua-Fish's narrower 1 to 8. A Guyana\
        \ keeping report documents 11 dGH during growth and breeding, but does not establish an upper limit for\
        \ the Rio Negro population. The decision retains the tally's typical maintenance ceiling rather than declaring\
        \ harm above 10. Near-zero natural hardness is included, with no controlled species-specific lifetime trial\
        \ at either endpoint."

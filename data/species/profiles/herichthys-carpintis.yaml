  diet:
    text: "Base feeding on a complete cichlid ration with plant ingredients. Add vegetable foods and
      vary small portions of suitable aquatic invertebrates, such as brine shrimp and insect larvae.
      Wild-feeding accounts emphasize detritus and vegetation alongside opportunistic animal food,
      so a fish-only ration does not fit this species. Predation level 2 means that small companions
      must be treated as potential food even though fish are not its main wild diet. Feed measured
      portions and check that both partners obtain food. No established special bloat predisposition
      is encoded, but that does not make excessive feeding or an unbalanced ration harmless."

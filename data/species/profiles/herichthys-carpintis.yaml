        archived: ciklid.org/artregister/art.php/q-54c374ba/2026-10-14T100104Z
        accessed: "2026-10-13"
  habitat:
    text: "Native populations occupy the Panuco-Tamesi lowlands and adjacent Mexican Gulf drainages,
      including lagoons near Tampico and river habitats with varied flow. Vegetated margins and
      structured bottom areas provide feeding and shelter. Upper Rio Verde and Media Luna
      populations include introductions and are excluded when reconstructing native conditions. The
      profile retains provisional natural values of 23 to 29 C, pH 7.5 to 8.4, 8 to 16 dGH and 9 to
      10 dKH equivalents. These are rounded adjudicated references derived from conflicting
      datasets; some published measurements fall outside them. Monitoring means, single collecting
      readings and seasonal surveys describe different aspects of the habitat and do not establish
      its complete limits."
    sources:
      - kind: "literature"
        title: "Perez-Miranda et al. (2018): Phylogeny and species diversity of the genus Herichthys"
        url: "https://doi.org/10.1111/jzs.12197"
        archived: doi.org/10.1111_jzs.12197/2026-10-13T120137Z
        accessed: "2026-10-13"
      - kind: "literature"
        title: "Oldfield et al. (2021). Live color patterns diagnose species: A tale of two Herichthys.
          Miscellaneous Publications, Museum of Zoology, University of Michigan 209."
        url: "https://doi.org/10.7302/916"
        archived: doi.org/10.7302_916/2026-10-13T120357Z
        accessed: "2026-10-13"
      - kind: "literature"
        title: "Gonzalez-Davila et al. (2019). Caracterizacion fisicoquimica del agua de la laguna La Vega
          Escondida, Tampico, Tamaulipas-Mexico. Tecnologia y Ciencias del Agua 10(1), 1-29."
        url: "https://doi.org/10.24850/j-tyca-2019-01-01"
        archived: doi.org/10.24850_j-tyca-2019-01-01/2026-10-13T120126Z
        accessed: "2026-10-13"

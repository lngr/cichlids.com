  sizeAndGrowth:
    text: "Use about 25 cm for an adult aquarium male and 20 cm for a female when planning space.
      These figures have husbandry support but are not replicated sex-specific growth limits. Some
      stocks remain smaller and sources also publish substantially larger maxima. Standard length
      excludes the tail and cannot be compared directly with a total-length planning figure. A
      juvenile aquarium can become unsuitable before the fish reaches full size because rivals and
      partners need room to retreat. Plan the adult installation before obtaining young fish."

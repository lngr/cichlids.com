    rationale: "The generator and checker-a include rock, sand, plants and wood; checker-b omits
      plants, and checker-c adds openWater instead. The Nordic register and Zoopet support a sand
      bottom with stones and roots, while the Huichihuayan collector describes occupied vegetation
      and Beerlink reports vegetated margins. Plants therefore represent natural cover that may be
      replaced by other shelter in the aquarium; they are not a promise that rooted plants survive
      digging. Ordinary swimming space between retreats does not by itself establish an open-water
      specialist zone, so openWater is omitted. CRC river and muddy-lake descriptions are
      verification only."

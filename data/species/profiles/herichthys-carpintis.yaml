      checker-c proposed 8.7 to 9.9. The lagoon study measures alkalinity of 156 to 176 mg/L as
      CaCO3, equivalent to 8.74 to 9.86 dKH after division by 17.848. These are alkalinity
      equivalents rather than a determination that every buffering ion is carbonate. The wider
      generator interval includes a Huichihuayan dip-strip observation of about 6.72 dKH. Wider
      regional alkalinity spans 16.25 to 21.35 dKH in the mining survey; the main-channel Panuco
      study has a lower-basin bicarbonate mean equivalent to about 19.6 dKH, not local extrema.
      Those regional waters lack a matched occurrence census. The narrow rounded decision represents
      one lagoon subset and excludes other observations; it is not a species-wide tolerance or the
      full range of wild carbonate hardness. Only one independently read publication supplies a
      well-matched local alkalinity interval. No verification object is attached to this natural KH
      fact."

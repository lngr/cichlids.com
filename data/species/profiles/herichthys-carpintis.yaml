        to 8.5 and checker-a, checker-b and checker-c proposed 7 to 8.5. The decided median is 7 to
        8.5 with unanimous verification and medium confidence. Beerlink lists 7 to 8.5; Decoulon
        lists 7.5 to 8.5, Aqua-Fish 7 to 8, AKVARISTA 6.8 to 7.8, and Zapater bred fish near 7.8.
        The lower bound does not incorporate all of AKVARISTA's softer recommendation. Seriously
        Fish gives a point recommendation of 7 and LiveAquaria's narrower retail range is 6.9 to
        7.1, neither of which proves intolerance outside those figures. Zierfische-Direkt also gives
        7 to 8.5 but is a retailer website. These are acclimated-stock husbandry recommendations
        rather than experimentally established lifetime limits."

    confidence: "low"
    rationale: "The tally retains the rounded median of six proposals, 7.5 to 8.4, with 3 of 6 votes
      in its leading agreement cluster. generator proposed 7.6 to 8.5; checker-a proposed 7.79 to
      7.79; checker-b proposed 7 to 8; checker-c proposed 7.4 to 8.3; tiebreaker-1 proposed 6.92 to
      8.8; tiebreaker-2 proposed 7.6 to 8.5. La Vega Escondida reports a mean of 7.79 and SD 0.09,
      not measured extrema. Chairel annual mean pH spans 7.6 to 8.5, El Alamo annual means 6.7 to
      8.3, and a Huichihuayan collection measured 7.6. The wider field envelope assembled from
      Valles and Axtla/Moctezuma is 6.92 to 8.8; the regional mining survey gives 7.9 to 8.5, and
      FishBase lists 7 to 8 without station provenance. The decided interval is narrower than
      several of these sources and neither rules out their endpoints nor turns the survey mean and
      SD into a natural minimum and maximum. River pollution, incomplete species-site matching and
      inconsistent survey coverage keep confidence low."

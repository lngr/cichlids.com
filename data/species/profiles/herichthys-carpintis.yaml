  breeding:
    text: "A bonded pair prepares a solid surface for adhesive eggs and guards the brood together.
      Larvae may later be moved into excavated depressions. The adults develop pronounced brood
      colors and can defend far more space than the immediate egg site. Development times differ
      among reports and temperatures, so observe the brood rather than relying on a fixed schedule.
      Provide small appropriate fry food once the young begin feeding independently. A spawning
      aquarium still needs escape routes and a separation option. Keep records of species identity
      and locality because carpintis has several separate hybrid concerns."

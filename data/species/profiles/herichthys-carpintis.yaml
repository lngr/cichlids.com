  note: "The Catalog of Fishes validates Herichthys carpintis (Jordan & Snyder, 1899) and keeps H.
    cyanoguttatus distinct. Its Gallinas and upper Tamasopo distribution line conflicts with the
    Tampico type locality and modern lowland distribution accounts; origin is based on those
    accounts rather than that isolated line. Parapetenia cyanostigma and Heros pavonaceus belong to
    H. cyanoguttatus synonymy and are excluded here. The original combination and later generic
    combinations are recorded separately from junior synonyms. The public CRC summary confirms the
    identity; subscriber content supplies no facts. The legacy catalog held this species twice, as
    Herichthys carpintis and under the historical spelling Cichlasoma carpinte; both entries map to
    this profile."

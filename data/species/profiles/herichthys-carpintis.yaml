  problems:
    text: "Persistent hiding or missed meals can reveal failed pairing before injuries become obvious.
      The common practical problems are inadequate adult space, blocked escape routes and unstable
      decoration after digging. Maintain the structure securely and remove excess food so that waste
      does not accumulate. Observe new arrivals in quarantine and check water quality when
      breathing, activity or appetite changes. Swelling or damaged skin alone does not identify a
      particular disease; persistent signs need qualified assessment. Uncertain trade
      identifications and mixed locality stock can also undermine breeding records."

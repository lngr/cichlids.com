  sexing:
    text: "Adult males usually become larger and more strongly built, with extended fin tips and
      sometimes a forehead swelling. Females may show a dark dorsal marking, but its visibility
      varies. Both sexes can change sharply during brood care. The larger-female statement on
      Seriously Fish conflicts with independent specialist and breeder accounts and is not adopted.
      Color intensity, a head hump and a seller's claim of a pair cannot reliably establish both sex
      and compatibility."

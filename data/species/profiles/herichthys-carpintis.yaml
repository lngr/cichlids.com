  compatibility:
    text: "A separate pair aquarium is often easiest to manage, although exclusive conspecific
      stocking is not obligatory. Comparable robust adults such as Rocio octofasciata or Andinoacara
      rivulatus are conditional candidates for substantially larger installations. About 800 L with
      at least 200 cm of length is a provisional starting point for considering a community, with
      each species' adult needs assessed separately and a means of separation available. A suitably
      large armored catfish may also be possible; this is not a verified trial of every species
      combination. Small tetras and dwarf cichlids are poor candidates because of ingestion or
      intimidation. Six separate hybrid pairs concern cyanoguttatus, labridens, pantostictus,
      tamasopoensis, tepehua and pame. Evidence ranges from reported wild hybrids to ancient gene
      exchange and tentative marker signals; it does not establish that all members of Herichthys
      cross with one another."

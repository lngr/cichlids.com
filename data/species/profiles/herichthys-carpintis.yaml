      herichthys-carpintis-tepehua, herichthys-carpintis-pame. The generator's three groups omit
      tepehua, tamasopoensis and pame; checker-b's five omit pame. Each final group contains
      carpintis and only its named counterpart, since crossing is not transitive. Lorenz and
      OConnell report a wild cyanoguttatus hybrid zone after Miller (2005), which meets the
      documented basis despite secondary and untested parentage evidence; aquarium reports alone
      would be presumed. Labridens is documented from specialist reports of wild hybrids after
      introduction at Media Luna. Pantostictus is documented on the 2025 genetic evidence for
      ancient wild introgression, with no demonstration of current aquarium crossing frequency.
      Tepehua, tamasopoensis and pame remain presumed because the 2018 revision reports suggestive
      nuclear or mitochondrial discordance and asks for denser sampling; pame depends especially on
      poorly resolving COI. The archive's ambiguous Texas and Flowerhorn labels establish no
      additional named pair. Shared URLs or reproduced Beerlink text are not independent
      confirmation.

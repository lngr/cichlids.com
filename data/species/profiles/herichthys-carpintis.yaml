    rationale: "The generator and checker-c propose 500 L with a 180 by 60 cm footprint; checker-a and
      checker-b propose 500 L with a 150 by 60 cm footprint. The final choice retains 500 L for one
      compatible adult pair and selects the longer footprint to improve separated retreats. The
      Nordic register gives 500 L and 150 cm, FishFish gives 500 L, and Decoulon gives 180 cm
      without volume. The 60 cm front-to-back dimension is a planning inference for 25 cm adults
      rather than a tested minimum. Zoopet is more conservative at 700 L and 200 cm. Seriously Fish
      gives about 213 L and a 120 by 37.5 cm base, and smaller pair recommendations or Borstein's
      283.9 L two-pair report do not establish universal safe adult housing. Mixed communities and
      managed groups need substantially more space; about 800 L and at least 200 cm are provisional
      starting dimensions, not a validated stocking formula."

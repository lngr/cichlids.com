  beginnerSuitability:
    value: "demanding"
    confidence: "medium"
    rationale: "The generator proposes demanding; checker-a, checker-b and checker-c propose moderate
      because water care and spawning are comparatively straightforward. The adjudicated conspecific
      aggression is level 4 and the adult pair setup requires substantial space, experience in
      recognizing failed pairing and readiness to separate adults. AKVARISTA explicitly excludes
      beginners. These management demands justify demanding for the complete keeping task despite
      easier routine water care. The Nordic register and public CRC summary classify the species as
      accessible, and Seriously Fish is encouraging about entry into large-cichlid keeping; those
      assessments are acknowledged rather than converted into proof that a novice can safely manage
      any adult pair."

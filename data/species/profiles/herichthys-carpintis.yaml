  husbandry:
    text: "For one compatible adult pair, provide at least 500 litres with a footprint around 180 by 60
      cm. This is a planning synthesis; Zoopet recommends a larger 700 L and 200 cm aquarium.
      Arrange secure stones and wood to break lines of sight and give both adults several routes
      away from each other. Fine sand allows digging, while plants may be uprooted or eaten. Filter
      for the adult waste load and maintain clean, well-oxygenated water through regular changes.
      Around 24 to 26 C is well supported for routine care. The broader encoded tolerances are 20 to
      30 C, pH 7 to 8.5, GH 8 to 25 dGH and KH 6 to 15 dKH, with weak support at some endpoints. A
      usable divider or separate aquarium should be ready before adults are combined."
    sources:
      - kind: "literature"

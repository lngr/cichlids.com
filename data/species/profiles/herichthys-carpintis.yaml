    tolerance:
      value:
        min: 20
        max: 30
      confidence: "low"
      rationale: "The proposals in vote order are 20 to 30, 22 to 28, 20 to 30, 22 to 30, 20 to 33, 20 to 30
        (C). Without a qualified majority, the medians of all proposed minima and maxima are 20 and
        30, rounded to 20 to 30 C. The median 20 to 30 C contains the natural 23 to 29 range without
        widening. Wider sources include Decoulon and Fishipedia at 20 to 33 C, AKVARISTA at 22 to 33
        C, Zapater's seasonal keeping observations at approximately 20 to 30 C, FishFish at 12 to 30
        C and Beerlink's table at 18 to 28 C. None establishes continuous healthy maintenance for
        years at both endpoints. Seriously Fish and the Nordic register support 24 to 26 C as a
        routine core, while Zoopet recommends 22 to 28 C. Seasonal exposure and an aquarium
        recommendation are different kinds of support, and locality effects remain unresolved. The
        median 20 to 30 C follows the reported seasonal keeping span and fits broader aquarium
        recommendations, with the middle temperatures better supported for routine maintenance.
        Confidence is low because endpoint support is incomplete."
      sources:
        - kind: "literature"

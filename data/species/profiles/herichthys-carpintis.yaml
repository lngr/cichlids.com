  socialBehavior:
    text: "The recommended unit is a pair whose members have accepted each other. A random male and
      female may not form a safe pair, and spawning does not prevent later attacks between them.
      Conspecific aggression is graded 4 because serious partner or rival injury can require
      physical separation. One breeder reported a surplus adult killed in a crowded aquarium; that
      outcome does not predict the behavior of every adequately housed pair. Watch whether each fish
      can feed and leave shelter normally. Managed groups are an alternative in much longer aquaria
      with experienced supervision and removal of incompatible fish. Other species face strong
      territorial pressure, particularly during brood care."
    sources:
      - kind: "literature"

    confidence: "high"
    rationale: "The generator includes black with grey, green and blue, while all three checkers use
      the grey-green ground and blue markings for the usual adult male. Oldfield and the 2025
      comparative study support conspicuous iridescent blue-green spots. Extensive black and pale
      areas are strongest during brood care, so black is not added to the normal adult base palette.
      Lists differing only in color order are equivalent. Spot size and breeding coloration can
      assist comparison with cyanoguttatus but do not authenticate every fish of uncertain trade
      origin."

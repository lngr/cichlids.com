partners:
  suitable:
    - species: "Rocio octofasciata"
      reason: "A robust adult of comparable size is named in species-specific husbandry advice;
        territory and breeding aggression still require monitoring."
      condition: "Conditional combination of comparable adults in at least 200 cm and about 800 L, with
        barriers and a separation option; avoid simultaneous breeding pairs."
    - species: "Andinoacara rivulatus"
      reason: "Named under its older genus in Czech husbandry advice as a comparably robust companion;
        individual aggression remains decisive."
      condition: "Conditional combination of comparable adults in at least 200 cm and about 800 L;
        satisfy both species requirements and separate if either is persistently intimidated."
    - species: "Pterygoplichthys gibbiceps"
      reason: "An adult large armored catfish is an extrapolation from advice allowing adequately sized
        loricariids, not a documented species-pair trial."
      condition: "At least 200 cm and about 800 L, appropriate catfish shelter and feeding; meet its own
        adult requirements and keep it away from a spawning nest."
  unsuitable:
    - species: "Paracheirodon innesi"
      reason: "Small adult size leaves it vulnerable to ingestion by a large carpintis."
    - species: "Mikrogeophagus ramirezi"
      reason: "Small and insufficiently robust for territorial pressure; its husbandry requirements also
        complicate this combination."
    - species: "Herichthys cyanoguttatus"
      reason: "Similar appearance, aquarium crossing reports and a reported wild hybrid zone create a
        documented hybrid concern; parentage in the historical field report was not genetically
        tested."
    - species: "Herichthys labridens"
      reason: "Natural hybrid reports after carpintis reached Media Luna create a crossing concern for
        conservation-oriented breeding."
    - species: "Herichthys pantostictus"
      reason: "Wild genetic data support ancient introgression between these species; the documented
        historical signal does not quantify current aquarium crossing risk."
    - species: "Herichthys tamasopoensis"
      reason: "A separate presumed hybrid pair is retained from mitochondrial discordance and the close
        relationship; present-day crossing frequency is unresolved."
    - species: "Herichthys tepehua"
      reason: "A separate presumed hybrid pair rests on suggestive nuclear gene sharing; contemporary
        free-choice crossing is unconfirmed."
    - species: "Herichthys pame"
      reason: "A presumed hybrid pair is retained from a tentative COI signal; stronger genetic and
        reproductive confirmation is lacking."
profile:
  overview:
    text: "A pearlscale cichlid aquarium starts with territory and adult space. Herichthys carpintis
      develops prominent blue-green markings and a very different dark breeding appearance.
      Pearlscale and green Texas are familiar trade names, but H. cyanoguttatus is a separate
      species. Carpintis comes from northeastern Mexico and occurs in several distinct locality
      stocks. Adults can become difficult to pair safely, even when feeding and routine water
      maintenance are straightforward. Confirm the identity and collection background of breeding
      fish rather than relying on a common name or a forehead hump."
    sources:
      - kind: "catalog-of-fishes"
        title: "Eschmeyer's Catalog of Fishes: species of Herichthys"
        url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=spec\
          ies&genus=Herichthys"
        archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-f95e96f7/2026-10-14T100050Z
        accessed: "2026-10-13"
      - kind: "literature"
        title: "Oldfield et al. (2021). Live color patterns diagnose species: A tale of two Herichthys.
          Miscellaneous Publications, Museum of Zoology, University of Michigan 209."
        url: "https://doi.org/10.7302/916"
        archived: doi.org/10.7302_916/2026-10-13T120357Z
        accessed: "2026-10-13"
      - kind: "database"
        title: "Seriously Fish: Herichthys carpintis"
        url: "https://www.seriouslyfish.com/species/herichthys-carpintis/"
        archived: seriouslyfish.com/species/herichthys-carpintis/2026-10-14T100111Z

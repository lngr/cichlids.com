    confidence: "low"
    rationale: "The tally uses the median of the six proposed minima and maxima, rounded to whole
      degrees: 23 to 29 C, with 2 of 6 votes in the leading agreement cluster. generator proposed
      21.7 to 27.2; checker-a proposed 24 to 25.5; checker-b proposed 24 to 29.5; checker-c proposed
      24 to 28.5; tiebreaker-1 proposed 20.3 to 32.8; tiebreaker-2 proposed 21.7 to 29.5. These
      proposals mix lagoon measurements, river measurements, monitoring means and collecting
      observations. La Vega Escondida measured 24 to 25.5 C; Chairel annual means span 23.7 to 29.5
      C and El Alamo means 25.7 to 28.5 C. Axtla measured 29.5 C and the Axtla/Moctezuma subset
      spans 28.9 to 31.5 C. The wider Valles seasonal range is 20.3 to 32.8 C, while the regional
      mining survey spans 15.9 to 23.3 C without confirming this fish at all stations. FishBase
      lists 23 to 33 C from Conkel (1993), without recoverable field provenance. Huichihuayan fish
      were collected at 21.67 C. Thus the decided median omits observed colder and hotter water and
      is not a physiological limit or a complete natural envelope. Fish occurrence and pollution
      differ among the sampled sites. The Carpintero aeration and El Conejo studies retained in the
      source record do not establish matched species endpoints. Low confidence reflects these
      limits."

  feedingSpeed:
    value: "normal"
    confidence: "low"
    rationale: "The generator proposes hasty as a precaution for an assertive opportunist; all three
      checkers propose normal. Borstein describes ready food acceptance but gives no comparative
      speed test, and Zapater reports shy adult feeding and competition from a much larger tilapia.
      These observations do not establish sustained food monopolization. Normal is the
      better-supported provisional assignment, with low confidence because feeding speed has not
      been standardized or measured."

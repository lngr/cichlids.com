  aggressionConspecific:
    value: 4
    confidence: "medium"
    rationale: "The generator and checker-b propose level 4; checker-a and checker-c propose level 3
      for a compatible pair in adequate space. Zapater reports a surplus conspecific killed after
      pairing in a 200 L aquarium, while Seriously Fish warns that males can attack females and
      require a divider. Level 4 captures the need for experienced pairing and a reliable separation
      option under the rubric; the crowded fatality is not evidence that every adequately housed
      pair kills its partner. Aqua-Fish describes peaceful conspecific behavior, which is outweighed
      by the detailed pair and rival accounts. No injury frequency has been measured in the
      recommended adult setup."

    confidence: "high"
    rationale: "The four full profiles agree on northeastern Mexican Atlantic lowlands but differ in
      wording and locality selection. The Catalog type locality, FishBase, the Nordic register, the
      modern revision and Oldfield support the Panuco-Tamesi system and adjacent coastal drainages.
      The Soto la Marina limit is complicated by contact with cyanoguttatus and the historical
      teporatus name. Chairel and del Chairel refer to the same lagoon. The final locality list
      combines verified native localities rather than extending it with introduced upper Rio Verde
      or Media Luna populations. No single curated lake-water override applies to this
      distribution."

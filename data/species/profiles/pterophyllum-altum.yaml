  sexing:
    text: "Young fish cannot be reliably sorted into males and females by their bars, overall size or
      fin shape. Some adult males develop a fuller forehead, but this is an unreliable guide for
      buying a guaranteed pair. The genital papilla becomes more informative close to spawning, with
      the female showing a broader egg-laying tube. Even a convincing pair bond does not by itself
      prove that a fertile male and female are present. Raise a group and observe actual spawning
      behavior rather than forcing two selected fish to share a territory."

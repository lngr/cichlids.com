  ghDgh:
    value:
      min: 0
      max: 1
    confidence: "low"
    rationale: "The tally selects 0 to 1 dGH with low confidence. Generator proposes 0 to 0.2 and the
      three checkers 0 to 1; these agree within the voting threshold. Fornback and Andersen report
      field non-detection, and Staeck measures less than 1 dGH at an occupied Atabapo site. CDA 2024
      reports less than 3 mg/L CaCO3, equivalent to less than 0.168 dGH. The one-degree upper bound
      is a rounded planning allowance around very dilute water, not a measured seasonal maximum.
      FishBase and Fishipedia give the wider range 1 to 5 dH; the direct collecting and analytical
      observations take precedence. CDA 2021 gives 37 mg/L, equivalent to 2.07 dGH, alongside
      conductivity of only 7 uS/cm; that internally discordant reading is retained without extending
      the ideal. Regional conductivity supports dilute water qualitatively but cannot be converted
      directly into GH."

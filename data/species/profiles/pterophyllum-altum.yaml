    rationale: "Five of six votes select level 2; checker-a selects level 1 after weighing a successful
      tetra community. Seriously Fish, TFH and Maidenhead describe consumption of mouth-sized small
      community fish, which exceeds incidental feeding on fry or fish around 2 cm. Saucier reports
      both years of coexistence and tetra losses in different aquariums. Fornback directly observes
      fry predation but does not define a maximum prey size. These observations support level 2
      without establishing fish as the principal food required for level 3. Lower-level evidence
      remains visible as an alternative interpretation."

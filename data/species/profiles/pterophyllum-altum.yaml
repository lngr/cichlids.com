      rationale: "The unanimous tally selects 26 to 32 C: generator, checker-b and checker-c propose 26 to
        32, and checker-a 25 to 32, within the one-degree agreement rule. NCS gives 26 to 30 C and
        Seriously Fish 28 to 32 C; Fornback keeps adults at 29 to 30 C. Saucier and Fishipedia give
        the wider lower-end recommendation 25 to 31 C, while Maidenhead and ForAquarium give 27 to
        31 C. The 26-degree boundary has less sustained-maintenance support than 28 to 30 C, which
        is a practical target. Native and regional cooler readings remain evidence of occurrence
        rather than proof of healthy chronic maintenance at those temperatures. The range contains
        the decided natural values, and its endpoints are not interchangeable routine targets."

  minTank:
    value:
      volumeL: 450
      lengthCm: 150
      depthCm: 50
    confidence: "medium"
    rationale: "The four proposals are generator 600 L, 150 by 60 cm; checker-a 430 L, 120 by 60 cm;
      checker-b and checker-c 450 L, 150 by 50 cm. Component medians are 450 L, 150 cm length and 55
      cm front-to-back depth. Adopt the published 450 L and 150 by 50 cm group baseline from
      Aquariophilie rather than inventing a 55 cm minimum between its footprint and the 60 cm
      alternatives. Fishipedia recommends 600 L; Saucier reports 120 by 60 by 60 cm and Fornback
      uses 700 L with discus, neither establishing a universal larger minimum. NCS separately
      requires 65 to 70 cm clear swimming height, exceeding Aquariophilie's 60 cm tank height.
      Meeting that height and substrate clearance usually means a taller aquarium and more actual
      water than the nominal 450 L baseline. The retained Seriously Fish numeric evidence is a
      submitted planning estimate: its page gives no numerical tank minimum."

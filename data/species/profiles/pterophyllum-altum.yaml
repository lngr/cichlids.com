    rationale: "The qualified majority selects invertivore with bloatSensitive false. Generator,
      checker-a, checker-b and tiebreaker-2 favor this classification; checker-c and tiebreaker-1
      favor omnivore. Adult feeding accounts emphasize invertebrates, and Maidenhead recommends
      crustaceans and insect larvae. NCS explicitly includes soft plant tissue and Aquariophilie
      reports duckweed feeding; these dissenting observations are retained. Fornback also uses a
      mixed supplement containing plants, which establishes acceptance rather than wild proportions.
      The larval trial supports zooplankton feeding only, and FishBase has no diet-composition
      records; its modeled trophic level is not a stomach-content study. Invertivore is therefore a
      medium-confidence husbandry interpretation. The false bloat flag indicates no documented
      specialized protein restriction, not immunity to digestive disease."

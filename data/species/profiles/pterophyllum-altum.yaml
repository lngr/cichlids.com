  husbandry:
    text: "For six adults, the planning baseline is 450 litres with a footprint at least 150 cm long and
      50 cm front to back. Provide 65 to 70 cm of clear swimming height; the aquarium must be taller
      once substrate and surface clearance are included, so meeting all requirements usually exceeds
      the nominal volume baseline. Wood and shaded retreats should leave room to turn and withdraw.
      Efficient filtration, gentle water movement and frequent maintenance protect water quality. A
      routine temperature near 28 to 30 C is better supported than constant use of either tolerance
      endpoint. Very soft water remains appropriate. The pH tolerance of 4 to 7.3 has low confidence
      at its upper end and does not replace an acidic target matched to the stock. Acclimate fish to
      changes gradually."

  temperatureC:
    value:
      min: 27
      max: 32
    confidence: "medium"
    rationale: "The unanimous tally selects 27 to 32 C from generator 27 to 32, checker-a 26 to 31,
      checker-b 26 to 32 and checker-c 27 to 32, which agree within the one-degree rule. Fornback
      measures 30 to 32 C at occupied collecting waters and FishBase gives 27 to 31 C. Regional
      reports are wider: Mora Polanco et al. give 25.6 to 32 C and Andersen gives 26.1 to 35 C,
      without altum occupancy established at every reading. Bleher records 30.1 to 32.1 C
      regionally. Staeck also reports one occupied Atabapo site at 24.4 C; this cooler point is
      retained but does not establish a sustained cool-water ideal. CDA 2024 lists 21.4 to 21.6 C in
      laboratory results without confirming occupied-altum field temperature, and BAP mixes
      reconstruction and habitat information at 26 C. The decided typical range is narrower than
      these combined observations and is not a complete thermal distribution or a
      constant-temperature recommendation."

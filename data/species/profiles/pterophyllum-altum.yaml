partners:
  suitable:
    - species: "Symphysodon aequifasciatus"
      reason: "Discus are supported companions with similar warm-water needs and deliberate feeding."
      condition: "Healthy acclimated stock in an aquarium larger than the altum-only minimum; feed both
        groups separately and protect spawns."
    - species: "Mesonauta festivus"
      reason: "A flag cichlid is a reported companion of suitable size; compatibility depends on
        individual territorial behavior."
      condition: "Large aquarium with separate sheltered territories and overlapping soft-water conditions."
    - species: "Hoplisoma sterbai"
      reason: "This warm-water catfish, listed as Corydoras sterbai in the husbandry review, occupies the
        bottom and is a conditional companion."
      condition: "Fully grown fish with separate feeding access; choose shared temperatures near 28 C
        rather than the upper altum limit."
  unsuitable:
    - species: "Paracheirodon innesi"
      reason: "Small slender adults can be swallowed and their usual maintenance temperature is cooler."
    - species: "Pterophyllum scalare"
      reason: "Reported hybridization and competing territorial behavior make it unsuitable when
        preserving species identity."
    - species: "Pterophyllum leopoldi"
      reason: "The curated presumed Pterophyllum hybrid group flags a crossing risk; direct altum x
        leopoldi evidence is absent."
    - species: "Paracheirodon axelrodi"
      reason: "Natural co-occurrence does not ensure aquarium safety; a keeping report describes cardinal
        tetras being eaten."
profile:
  overview:
    text: "The altum angelfish is a large, tall-bodied South American cichlid whose long fins need much
      more vertical room than its body length suggests. A pale silver to brown body carries dark
      upright bars, and the forehead rises sharply above the snout. It is best suited to an
      experienced keeper who can provide very clean water and calm surroundings. Choose fish with
      reliable identification and provenance. A fish sold as a Peruvian altum is generally a form of
      Pterophyllum scalare, rather than this species."
    sources:
      - kind: "catalog-of-fishes"
        title: "Eschmeyer's Catalog of Fishes: Pterophyllum species"
        url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=specie\
          s&genus=Pterophyllum"

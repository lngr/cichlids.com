  socialBehavior:
    text: "Keep a group of at least six and watch how access to shelter and food is shared. Displays and
      chasing establish rank, while a bonded pair can defend a substantial area during reproduction.
      Provide visual breaks and enough room for subordinate fish to withdraw without becoming
      trapped. Persistent hiding, missed meals or damaged fins indicate that the arrangement needs
      attention. A spawning pair may need separate accommodation even in a well-designed group tank.
      Avoid sudden movements around the glass because a frightened group can rush into wood or
      aquarium walls."

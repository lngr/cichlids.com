      cm in Seriously Fish. The female endpoint is an equal-size planning assumption because
      sex-specific adult maxima are unavailable. Maidenhead gives the smaller value 12 cm without
      clarifying its length convention. Vertical fin spans of 30 to 40 cm or more are a different
      measurement and determine aquarium height."

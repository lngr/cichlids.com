  breeding:
    text: "A compatible pair cleans an exposed surface such as a root, broad leaf or artificial spawning
      support before laying adhesive eggs. Both parents can guard the clutch and developing young.
      Successful parent rearing is documented, although obtaining reliable spawns requires patience
      and excellent water quality. Soft, acidic spawning water is better supported than the broader
      chemistry tolerated during ordinary maintenance. Fry need appropriately sized food when they
      begin feeding freely. A larval study finds better growth and survival with Artemia nauplii and
      suitable zooplankton than with its cyst treatment; a separate rearing setup also needs careful
      waste removal."

  ph:
    value:
      min: 4
      max: 6.2
    confidence: "medium"
    rationale: "The qualified majority selects pH 4 to 6.2. Generator proposes 4 to 5.5, checker-a 4 to
      6, and checker-b, checker-c and both tiebreakers 4 to 6.2. Fornback measures 4.8 and Staeck
      4.4 at occupied sites; Bleher measures 3.99 to 4.05 in lower Atabapo habitat associated with
      altum, and regional Inirida observations and CDA monitoring broaden the acidic part. FishBase
      supplies the upper environmental endpoint of 6.2, although collecting metadata behind it are
      absent. Mora Polanco et al. give 3.96 to 5.35 regionally, while Negro studies describe pH 4 to
      5 and upper Negro samples at 4.66 to 4.70. Rounding the lower boundary to 4 preserves the
      blackwater envelope. BAP pH 6 has uncertain field attribution. Aquarium recommendations remain
      cited but do not determine the natural range."

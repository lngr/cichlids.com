  sizeAndGrowth:
    text: "Adult total length is about 18 cm; sex-specific maxima are unavailable, so the same planning
      value applies to both sexes. The much greater vertical span of the fins, often over 30 cm,
      governs aquarium height. Young fish need adequate space and repeated access to suitable food
      as they grow. Longevity figures are weakly documented: species pages give around ten years and
      one general care guide allows up to fifteen. The profile uses an approximate 8 to 15 year
      planning interval with low confidence, rather than a measured survival distribution."

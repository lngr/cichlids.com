    tolerance:
      value:
        min: 0
        max: 4
      confidence: "low"
      rationale: "The unanimous tally selects 0 to 4 dKH with low confidence: generator and checker-a
        propose 0 to 4, checker-b and checker-c 0 to 3, which agree within the two-degree rule. NT
        Labs explicitly recommends 0 to 4, and Saucier reports Forkel captive grow-out at 4 dKH.
        These observations support buffering beyond native near-zero KH, although they are not
        chronic adult tolerance experiments. The 0 to 3 entries from Seriously Fish and Fornback are
        submitted inferences from related husbandry conditions; those sources do not state KH
        tolerance endpoints. The interval is conditional on acclimation, compatible pH and hygiene.
        Its endpoints do not imply that pH 4 and 4 dKH can be maintained together as a stable
        combination."

  habitat:
    text: "This species occupies blackwater margins of the upper Orinoco system, including Atabapo and
      Inirida; FishBase and CRC also report upper Negro populations. Submerged timber, flooded banks
      and rocky dry-season margins provide shelter beside open passages. Water is strongly acidic
      and poor in dissolved minerals. Fornback records pH 4.8 and 30 to 32 C at collecting waters,
      while Staeck records pH 4.4, temperature 24.4 C and both GH and KH below 1 degree at one
      Atabapo site. These observations show variation beyond the tallied typical warm-water range. A
      reported zero hardness means below test resolution. Plant cover includes flooded terrestrial
      vegetation and need not be a bed of aquatic plants."
    sources:
      - kind: "catalog-of-fishes"
        title: "Eschmeyer's Catalog of Fishes: Pterophyllum species"
        url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=specie\
          s&genus=Pterophyllum"
        accessed: "2026-10-15"
        archived: "researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-091d09fa/20\
          26-10-14T102733Z"

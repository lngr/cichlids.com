        - "Upper Orinoco tributaries to Puerto Ayacucho"
        - "Upper Rio Negro"
    confidence: "high"
    rationale: "The type locality and Fornback collecting account establish Atabapo and Inirida,
      including Cano San Joaquin. FishBase and CRC also report the upper Negro; the Catalog
      distribution line names only the Orinoco basin. These accounts outweigh unsupported Peru and
      Putumayo map labels. AquaInfo supplies only map fragments. Forum trade and purchase threads do
      not verify localities, and thread 37853 incorrectly equates altum with scalare. Locality names
      describe provenance rather than subspecies."

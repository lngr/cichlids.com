  note: "The Catalog of Fishes accepts Pterophyllum altum Pellegrin, 1903 in its original genus and
    lists the Orinoco basin. Upper Negro distribution comes from FishBase and the public CRC
    account, not from the Catalog distribution line. Peruvian altum and some Rio Negro altum trade
    labels denote Pterophyllum scalare and do not establish synonyms of this species."

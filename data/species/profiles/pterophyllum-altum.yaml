    tolerance:
      value:
        min: 4
        max: 7.3
      confidence: "low"
      rationale: "The median decision is pH 4 to 7.3 with low confidence. Generator and checker-a propose
        4 to 7.5, checker-b and checker-c 4 to 7, tiebreaker-1 4 to 7, and tiebreaker-2 4 to 7.5.
        The median upper endpoint is 7.25, rounded to one decimal as 7.3; the lower endpoint remains
        4 and contains the natural range. Fornback documents maintained adults near 7. NCS and
        Aquariophilie also permit 7. Seriously Fish and Maidenhead recommend 4.8 to 6.2, and TFH 4.2
        to 6.2. Saucier gives the wider upper recommendation 6.5 to 7.5 and describes captive
        grow-out at 7.5; Tuccinardi independently reports 6.5 to 7.5 for commercial holding, which
        does not establish lifelong adult tolerance. The selected 7.3 is a numerical compromise
        between the two equally sized proposal camps, not a measured physiological threshold.
        Evidence for healthy adults over years near that boundary is limited. Use an acidic
        maintenance target appropriate to the stock and avoid abrupt chemistry changes; tolerance is
        distinct from spawning conditions."

  problems:
    text: "Common failures start with stressed imports, an immature aquarium, unsuitable food or
      insufficient swimming height. Panic injuries can follow abrupt movements or intrusive
      maintenance. Inspect new fish carefully and quarantine them before introduction. Watch for
      sustained food refusal, faster breathing, deteriorating fins or unusual skin changes, and seek
      qualified assessment rather than guessing a treatment from appearance alone. Dirty water and
      accumulated waste increase the burden on sensitive fish. Very low carbonate buffering also
      requires careful monitoring, while adding acids to unsuitable tap water can create unstable
      chemistry. A broad tolerance range is not a reason to move quickly between its endpoints."

    tolerance:
      value:
        min: 0
        max: 5
      confidence: "high"
      rationale: "Five of six votes select 0 to 5 dGH; checker-a proposes the wider 0 to 10 interval,
        while generator, checker-b, checker-c and both tiebreakers propose 0 to 5. Seriously Fish
        explicitly recommends 0 to 5 and Maidenhead independently limits hardness to 5 degrees.
        FishBase gives the narrower environmental interval 1 to 5; field non-detection and Staeck
        below 1 support inclusion of very dilute water. The retained Saucier and Fornback evidence
        entries at 0 to 10 are submitted estimates based on conductivity around 280 to 300 uS/cm and
        KH 4, not GH measurements. Neither conductivity nor KH establishes calcium and magnesium
        hardness, so those reports do not justify the 10 dGH ceiling. Higher pH tolerance also does
        not establish hard-water tolerance."

  compatibility:
    text: "A specialist community is possible with peaceful fish large enough to avoid being swallowed,
      provided their water requirements overlap. Discus and suitable adult bottom dwellers are
      conditional options in an aquarium larger than the altum group minimum. Spawning pairs require
      enough separation from companions and may need separate housing. Small tetras remain
      vulnerable even when another keeper reports peaceful coexistence. Other angelfish share the
      presumed pterophyllum hybrid caution: an altum by scalare cross is reported, but free mate
      choice is unestablished and an altum by leopoldi cross is not documented."

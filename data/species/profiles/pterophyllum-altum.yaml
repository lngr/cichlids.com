      checker-c 10 to 15. Their endpoint medians are 8 and 13.5. The final 8 to 15 interval keeps
      the approximate lower planning endpoint and uses the actual published upper allowance of 15
      from ForAquarium instead of presenting 13.5 as a measured age limit. Fishipedia and the
      Montreal teaching page give 10 years. Fifteen is a possible upper lifespan rather than a
      typical expectation; eight is inferred and no adult survival series supports precise bounds.
      Confidence remains low."

        does not establish lifelong adult tolerance. The selected 7.3 is a numerical compromise
        between the two equally sized proposal camps, not a measured physiological threshold.
        Evidence for healthy adults over years near that boundary is limited. Use an acidic
        maintenance target appropriate to the stock and avoid abrupt chemistry changes; tolerance is
        distinct from spawning conditions."

  khDkh:
    value:
      min: 0
      max: 1
    confidence: "low"
    rationale: "The tally selects 0 to 1 dKH with low confidence from generator 0 to 0.2, checker-a 0 to
      0.5 and checker-b and checker-c 0 to 1. Fornback and Andersen report non-detection, while
      Staeck gives less than 1 dKH at an occupied Atabapo site. CDA 2024 alkalinity below 2 mg/L
      CaCO3 is below 0.112 dKH equivalent; the older limit below 20 mg/L is below 1.12 dKH
      equivalent, not a measured maximum. The chosen interval allows unresolved variation and test
      resolution rather than claiming mineral-free water or an observed one-degree maximum. Total
      alkalinity in humic acidic water is not a direct carbonate-speciation measurement. The
      submitted 0 to 0.5 inference from regional acidity and conductivity is retained as an
      inference, not an independent KH assay."

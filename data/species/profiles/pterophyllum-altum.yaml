  - name: "Inirida"
    kind: "locality"
    note: "Documented native drainage; retain collection provenance rather than assuming a fixed colour
      strain."
  - name: "Orinoco"
    kind: "locality"
    note: "Broad trade locality label that overlaps tributary labels. A Rio Negro altum label alone is
      insufficient to identify the species."
features:

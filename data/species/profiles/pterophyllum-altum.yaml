  hybridGroups:
    value:
      - "pterophyllum"
    confidence: "medium"
    rationale: "All four votes select the existing pterophyllum group, whose basis is presumed and whose
      members already include this species. Clarke reports that Simon Forkel produces an altum by
      scalare cross using true Atabapo altum and a Rio Negro scalare line. Free choice of
      conspecific partners and fertility are not established. Monks discusses possible mixed
      ancestry of domestic angelfish without documenting every pairing. No direct altum by leopoldi
      cross is established, so group membership is a caution and does not assert demonstrated
      crosses between all three members."

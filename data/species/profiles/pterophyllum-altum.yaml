  diet:
    text: "Use a varied menu centered on insect larvae and small crustaceans, with suitable frozen foods
      and complete prepared food as accepted. Imported fish may need live food to begin feeding,
      whereas established captive stock can feed eagerly. Watch each fish eat and protect access
      from faster companions. The profile classifies the species as invertivorous, while NCS and
      Aquariophilie also report plant feeding; quantitative adult wild-diet proportions are
      unavailable. Small fish remain potential prey. Successful animal-rich husbandry does not imply
      immunity to digestive problems."

      decision:
        min: 10
        max: 20
      rationale: "The tally decides 10 to 20 dKH by qualified majority, four of six votes, with low confidence.\
        \ Generator proposed 15 to 20; checker-b proposed 14 to 20; checker-a, checker-c, tiebreaker-1 and tiebreaker-2\
        \ proposed 10 to 20. LiveAquaria explicitly gives 10 to 20, Aqua-Pedia gives 10 to 18, and Garnelio 15\
        \ to 20. WikiFish gives the wider upper interval of 14 to 24 dKH; its uncorroborated 24 endpoint is not\
        \ adopted. Aqua-Pedia identifies its data as generated and manually reviewed, and retailers and care databases\
        \ provide no multiyear exposure study. Neither general hardness nor pH alone establishes KH tolerance;\
        \ the natural maximum of 20 is retained."

  sizeAndGrowth:
    text: "Use about 15 cm for a well-kept adult male and 12 cm for a female when planning space. Female maxima\
      \ differ among sources, so a smaller female is no reason to reduce the pair aquarium. No numerical growth\
      \ curve is established here. Plan for the adult setup before buying young fish. Five to eight years is the\
      \ adopted lifespan estimate; longer care-sheet claims also exist and lack cohort confirmation."

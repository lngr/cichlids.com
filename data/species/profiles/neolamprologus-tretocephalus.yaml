    value:
      min: 8.4
      max: 9.4
    confidence: high
    rationale: "The waterbody decision fixes 8.4 to 9.4 at high confidence. The annual sampling programme reported\
      \ by Plisnier et al. and reproduced in Langenberg measured 8.47 to 9.40 at 40 m in the northern basin, with\
      \ surface values commonly near 9. FishBase gives 7.6 to 8.0 in its environment summary; that narrower and\
      \ lower interval is not substituted for measured lake chemistry."

  husbandry:
    text: >-
      For one compatible adult pair, use at least 400 litres with a 150 cm length and 40 cm
      front-to-back depth. This is a cautious planning minimum assembled from differing care
      recommendations. Divide sightlines with secure rockwork and several retreats, while
      retaining sandy feeding space. Keep filtration and oxygenation effective and replace water
      regularly without abrupt changes in chemistry. Routine care around 24 to 26 C is better
      supported than continuous maintenance at the full temperature endpoints. The decided
      tolerances are 23 to 29 C, pH 7.7 to 9.4, GH 8 to 25 dGH and KH 10 to 20 dKH. KH tolerance
      is provisional, and the upper temperature and pH limits include the natural envelope
      rather than chronic aquarium trial results.
    sources:

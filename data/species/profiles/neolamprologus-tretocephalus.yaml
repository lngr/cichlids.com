    tolerance:
      value:
        min: 23
        max: 29
      confidence: medium
      rationale: "All four proposals are 23 to 29 C, retained by the tally as unanimous with medium confidence.\
        \ Seriously Fish and FishProfiles recommend 23 to 27 C; Aquarismo Paulista gives 24 to 28 C and Fishkeeper\
        \ 24 to 26 C. Aqua-Fish reaches lower, at 22 to 25 C, and LiveAquaria gives 22.22 to 27.78 C after conversion\
        \ from Fahrenheit. The selected lower endpoint therefore excludes these wider low-temperature recommendations.\
        \ Inclusion of 29 C follows the mandatory natural envelope, not demonstrated multiyear aquarium health\
        \ at that endpoint."

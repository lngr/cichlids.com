    confidence: high
    rationale: "Catalog of Fishes establishes Lake Tanganyika endemism. FishBase and Fishkeeper restrict the distribution\
      \ to the northern half and FishBase excludes Zambian waters. All four agents agree on that biological origin;\
      \ checker-a uses the whole lake as region with the northern half in localities. The northern-half region\
      \ is retained. AquaInfo claims the entire lake and MARE 2000 the southern shores, both rejected against\
      \ the more specific distribution evidence."

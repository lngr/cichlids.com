  temperatureC:
    value:
      min: 23
      max: 29
    confidence: high
    rationale: "The tally fixes the lake habitat envelope at 23 to 29 C with waterbody verification and high confidence.\
      \ The Verburg et al. buoy series underlying that decision spans 23.85 to 29.01 C. Plisnier et al. and Langenberg\
      \ report seasonal surface means of 24.4 and 27.2 C at Mpulungu; these are averages, not extrema, and describe\
      \ the same sampling programme. The lake envelope includes seasonal and geographic variation rather than\
      \ a constant aquarium target."

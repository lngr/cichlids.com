  breeding:
    text: "Spawning takes place on a protected surface within a rock cavity. Both parents guard the brood, often\
      \ with the female attending the nest while the male confronts intruders. A concealed clutch may first become\
      \ apparent through increased defence or visible fry. Accounts give broods reaching several hundred eggs,\
      \ but hatch and free-swimming times vary with conditions. Once the young swim freely, suitably small foods\
      \ including Artemia nauplii can be offered. Published wild observations describe prolonged guarding; aquarium\
      \ pair tolerance can still deteriorate during or after brood care."

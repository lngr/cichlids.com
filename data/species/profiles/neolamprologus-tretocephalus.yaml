  sexing:
    text: "Adults are difficult to sex reliably from colour alone. Males tend to be larger and heavier around\
      \ the head, while both sexes show the barred pattern. Unequal growth makes size a weak clue in juveniles.\
      \ Fin-shape claims vary across care accounts and should not establish a supposed pair by themselves. Observed\
      \ spawning roles can clarify sex, but they do not guarantee future partner acceptance."

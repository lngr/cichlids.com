      rationale: "The tally labels agreement unanimous within its range threshold and takes the rounded median\
        \ endpoints. Generator proposed 7.8 to 9.4; checker-a and checker-c proposed 7.5 to 9.4; checker-b proposed\
        \ 8.0 to 9.4. The lower median is 7.65, rounded to 7.7, with 9.4 retained to contain the natural range.\
        \ Seriously Fish gives 7.5 to 9.0 and FishProfiles 7.5 to 8.5, both extending below the decided minimum;\
        \ Garnelio starts at 7.8 and Fishkeeper at 8.0. Medium confidence reflects these differing care recommendations\
        \ and the lack of chronic endpoint experiments."
    - field: features.khDkh.tolerance

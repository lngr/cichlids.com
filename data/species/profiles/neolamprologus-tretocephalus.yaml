  habitat:
    text: "FishBase places the species in the northern half of Lake Tanganyika and records shallow captures from\
      \ approximately 1 to 10 m. It searches sand among scattered stones for invertebrates and uses rock cavities\
      \ for shelter and reproduction. Provide both accessible sand and secure rock cover. The adopted natural\
      \ lake envelope is 23 to 29 C, pH 8.4 to 9.4, GH 10 to 13 dGH and KH 15 to 20 dKH. These describe variable\
      \ habitat water. GH and carbonate alkalinity measure different properties and should be tested separately."
    sources:

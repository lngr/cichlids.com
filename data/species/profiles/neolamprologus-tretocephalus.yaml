  socialBehavior:
    text: "The recommended reproductive unit is one naturally compatible pair. Starting with juveniles may allow\
      \ pair formation, after which extra conspecifics need removal. Selecting an adult male and female does not\
      \ establish compatibility. Watch access to food and shelters as well as visible injuries, because persistent\
      \ hiding can reveal rejection before severe damage appears. A divider or separate aquarium must be available\
      \ when pursuit continues. Territorial behaviour occurs outside breeding; the spawning pair defends a much\
      \ larger area."
    sources:

partners:
  suitable:
    - species: Cyprichromis leptosoma
      reason: "An adult shoal uses the water above the defended floor, reducing direct cave competition. This\
        \ is a conditional example from the recommended genus, not a promise of fry survival."
      condition: "At least 600 L and 180 cm length with open upper swimming space, an appropriate Cyprichromis\
        \ group and immediate separation if the pair attacks."
    - species: Altolamprologus compressiceps
      reason: A mature individual of suitable size can use narrow rock gaps and shares an invertebrate-based diet.
        Small juveniles and exposed fry are at risk.
      condition: "A spacious tank beyond the 400 L pair minimum, preferably at least 600 L and 180 cm, with separate\
        \ rock territories and close observation."
    - species: Julidochromis marlieri
      reason: One of the larger Julidochromis can use a separate rock area and is more robust than tiny cave dwellers.
        Breeding territories must remain distinct.
      condition: At least 600 L and 180 cm length with widely separated rock formations; move either pair if defenses
        merge or injuries occur.
  unsuitable:
    - species: Neolamprologus sexfasciatus
      reason: Similar appearance and overlapping defended rock areas create rivalry. The decided pairwise hybrid
        group adds a presumed crossing caution based on close relationship; no verified cross of these two species
        was found.
    - species: Neolamprologus multifasciatus
      reason: Tiny shell dwellers and their fry cannot safely share the defended bottom area of a five-bar breeding
        pair. Adult harassment remains a risk even where adults are too large for level 1 predation.
    - species: Tropheus moorii
      reason: A colony of active rock grazers has a different feeding balance and occupies territory needed by
        the pair. Matching lake chemistry alone does not resolve those conflicts.
profile:
  overview:
    text: "An adult pair needs an aquarium planned around territorial conflict. Five-bar cichlids can reject or\
      \ kill a partner even after successful breeding, so room and a way to separate fish matter throughout their\
      \ lives. The species is a Lake Tanganyika lamprologine with five dark flank bars on a pale body and blue\
      \ accents. Count the flank bars rather than the facial mark when distinguishing it from the separate six-bar\
      \ species Neolamprologus sexfasciatus."
    sources:

  khDkh:
    value:
      min: 15
      max: 20
    confidence: high
    rationale: "The tally fixes natural carbonate hardness at 15 to 20 dKH and high confidence; this plain natural\
      \ fact carries no verification object. Plisnier programme alkalinity supplies the lower part of the compiled\
      \ lake envelope. Langenberg cites 6.7 to 6.9 meq/L, equivalent to 18.76 to 19.32 dKH, and Branchu and Bergonzini\

  problems:
    text: "Rejected partners and retained surplus adults pose the clearest documented risks. Persistent confinement,\
      \ missed meals and damaged fins warrant intervention in the social arrangement. Water pollution and abrupt\
      \ changes compound stress, so assess filtration and maintenance when health declines. Feeding pace is unmeasured\
      \ and provisionally normal; check each fish rather than assuming it receives a share. Treat swelling or\
      \ poor condition as a problem requiring diagnosis instead of assuming a species-specific protein intolerance."
    sources:

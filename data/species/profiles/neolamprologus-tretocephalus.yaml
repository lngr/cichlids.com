        accessed: '2026-10-13'
  diet:
    text: "Supply a complete cichlid food and vary it with aquatic invertebrates such as mysis, Artemia and insect\
      \ larvae. Snails fit its natural feeding apparatus. Wild diet records support an invertebrate-focused classification,\
      \ although a recent gut-DNA study also detects substantial plant and algal material in its mixed-diet cluster.\
      \ Tiny fish and fry can be eaten opportunistically; routine feeding with live fish is unnecessary. Both\
      \ adults should be able to feed without sustained harassment. The false bloat-sensitivity flag means no\
      \ established special protein restriction, rather than protection from digestive disease."

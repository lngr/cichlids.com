      decision:
        type: invertivore
        bloatSensitive: false
        foods:
          - Quality cichlid pellets
          - Mysis shrimp
          - Artemia
          - Insect larvae
          - Small snails
      rationale: "All four votes agree on invertivore and bloatSensitive false; the tally retains medium confidence\
        \ and the generator food list exactly. Their differently worded food proposals all concern complete cichlid\
        \ foods plus aquatic invertebrates. FishBase field records are dominated by insects, molluscs and crustaceans.\
        \ Huyghe et al. instead place this species in a mixed invertebrate/plant-algae cluster, so the earlier\
        \ invertivore classification simplifies a variable natural diet. LiveAquaria and archive accounts use\
        \ omnivore for mixed aquarium food acceptance. Neither observation establishes a special protein-linked\
        \ bloat conflict; false records the absence of that demonstrated dietary restriction, not disease immunity.\
        \ CRC confirms insect and mollusc feeding only."

        \ checker-c, tiebreaker-1 and tiebreaker-2 proposed this single pairwise group. No proposal reaches four\
        \ votes, so the rule retains groups proposed at least twice. Sturmbauer et al. recover the two species\
        \ as genetically close sisters with mitochondrial and nuclear markers; my-fish also describes them as\
        \ sisters. Aquarist Atlas supplies a general congener crossing caution, and CRC verifies their classification\
        \ association only. No verified hybrid or free-choice cross of this named pair was found. Close relationship\
        \ qualifies only for presumed basis under the rubric; the group does not extend to the rest of Neolamprologus.\

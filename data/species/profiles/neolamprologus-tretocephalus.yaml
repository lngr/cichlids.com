  compatibility:
    text: "Mixed keeping is conditional on ample space and robust adults. Cyprichromis leptosoma, Altolamprologus\
      \ compressiceps and Julidochromis marlieri illustrate genera permitted by the care literature, with separate\
      \ swimming or shelter areas. The additional community sizes listed here are planning margins rather than\
      \ tested compatibility thresholds. Breeding escalation can still require removal of companions. Tiny shell\
      \ dwellers overlap the defended floor and cannot rely on fry survival. Similar Neolamprologus sexfasciatus\
      \ adds rivalry and a presumed crossing caution: molecular evidence establishes close relationship, with\
      \ no verified cross of this pair reported. Tropheus colonies have different feeding and social needs, despite\
      \ sharing lake chemistry; low-weight archive accounts of mixed keeping do not establish general safety."

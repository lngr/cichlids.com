  diet:
    text: "Feed this fish as a small invertebrate hunter. Artemia, Daphnia, Cyclops and suitably sized\
      \ insect larvae provide variety, with small sinking pellets useful for trained aquarium fish. Let\
      \ some food reach sheltered bottom areas where a subordinate fish can eat safely. A fish that approaches\
      \ feeding time may still lose most of the meal to faster tankmates. Offer portions that are consumed\
      \ promptly and remove leftovers. Prepared foods containing vegetable ingredients are acceptable,\
      \ but this is not an algae grazer requiring a low-protein diet. Fry and very small fish should not\
      \ be considered safe companions."

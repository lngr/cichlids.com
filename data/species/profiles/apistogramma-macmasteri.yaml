    tolerance:
      value: &id040
        min: 5
        max: 7.2
      confidence: medium
      rationale: "Keep the tally qualified-majority tolerance of 5.0 to 7.2 with medium confidence, containing\
        \ the natural 5.0 to 6.5 range. NCS explicitly gives 5.0 to 7.2; Seriously Fish gives the narrower\
        \ 5.5 to 7.0. A breeding-project account records pH 7.2 and Bremen describes maintenance at 6\
        \ to 7 and breeding at 5.5 to 6.0. Wider proposals include checker-b 4.7 to 7.2 and tiebreaker-1\
        \ 4.7 to 7.0; their acidic endpoints came from pooled regional habitat readings rather than a\
        \ lifetime trial. Aquariumpro gives 5.0 to 7.5, and a forum claim allows domestic strains to pH\
        \ 8.5 without firsthand verification. Those wider upper limits are retained but do not outweigh\
        \ the specialist range for general species planning. Egg development need not be equally successful\
        \ throughout the keeping interval."

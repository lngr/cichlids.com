  habitat:
    text: "This Colombian Orinoco fish occurs in the upper Meta and upper Guaviare systems, including\
      \ Cano Tigre in the Ariari drainage. Clearwater stream margins with fine substrate, leaf litter\
      \ and bank cover are documented; other accounts describe darker, shaded water. Mesa and Lasso report\
      \ Yucao pH 5.7 and conductivity 3.7 uS/cm, with the nearby Iraca at pH 5.0 as a regional comparison.\
      \ Typical planning values are 24 to 30 C, pH 5.0 to 6.5, GH 0 to 4 dGH and KH 0 to 1 dKH. Hardness\
      \ values remain uncertain. The Mitimiti regional survey lists the species but does not link every\
      \ measurement to its captures: its full station span was 25.92 to 36.06 C and pH 4.71 to 6.54. The\
      \ isolated 36.06 C reading is outside the aquarium ideal and tolerance. Regional polluted Ocoa reaches\
      \ and the Ariari main channel also do not define the preferred microhabitat."
    sources:
    - kind: literature
      title: "Mesa and Lasso (2011). Revision del genero Apistogramma en la cuenca del rio Orinoco. Humboldt\
        \ Institute, pp. 107-109"

  predation:
    value: 1
    confidence: low
    rationale: "The tally qualified majority selects level 1, with low confidence. Checker-a proposes\
      \ 0 because the principal diet is small invertebrates and small dithers can coexist; the other five\
      \ runs propose 1. Aquasalvaje includes fish fry among prey, and breeding accounts describe consumption\
      \ of earlier broods or independent fry. A Garnele-Online observation also records juveniles taking\
      \ fry from a later brood. These support opportunistic fry predation without establishing regular\
      \ piscivory. Contrary observations of surviving guppy fry and community tetras remain evidence of\
      \ context-dependent coexistence. The rubric threshold of about 2 cm is not a measured species-specific\
      \ prey limit."
    sources:
    - kind: database
      title: "Seriously Fish: Apistogramma macmasteri"

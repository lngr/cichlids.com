partners:
  suitable:
  - species: Nannostomus marginatus
    reason: Peaceful upper-level pencilfish leaves more of the floor to the cichlids.
    condition: "Use adult fish, a proper shoal and overlapping soft-water conditions; fry survival is\
      \ not assured."
  - species: Nannostomus eques
    reason: Surface-oriented pencilfish offers little competition for caves.
    condition: "Provide its own shoal, surface cover and a secure lid in a larger community aquarium."
  - species: Hyphessobrycon sweglesi
    reason: A calm midwater tetra suits soft acidic water and avoids defending bottom territories.
    condition: Keep a shoal at about 24 to 26 C; expect losses of cichlid fry.
  unsuitable:
  - species: Apistogramma viejita
    reason: Similar territory requirements plus the presumed pair-specific crossing risk; trade identification
      is unreliable.
  - species: Amatitlania nigrofasciata
    reason: A much more forceful territorial breeder can injure or displace these dwarf cichlids.
  - species: Cyphotilapia frontosa
    reason: Large fish predator with alkaline-water requirements incompatible with this soft-water dwarf.
profile:
  overview:
    text: "Apistogramma macmasteri brings most of its activity to the lower part of an aquarium. A male\
      \ searches among leaves and roots, displays to females and patrols a patch of floor. Females become\
      \ particularly striking when they guard young. This Colombian dwarf cichlid belongs to the Orinoco\
      \ drainage, including records from the Meta and upper Guaviare systems. Most fish offered today\
      \ are captive selections with stronger red markings than wild specimens. Soft water and a thoughtfully\
      \ divided aquarium matter more than dramatic colour. Plan for territorial changes as soon as breeding\
      \ begins."
    sources:

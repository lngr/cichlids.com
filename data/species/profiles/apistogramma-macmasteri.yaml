  territory:
    value: &id047
      size: small
      breedingOnly: false
    confidence: medium
    rationale: "Checker-b and checker-c propose small territories throughout adult life; checker-a proposes\
      \ small only during breeding; generator proposes large throughout life. Keep a cave-centered small\
      \ territory with breedingOnly false because shelter and rival exclusion continue outside spawning.\
      \ The breeder describes a brood area of about 40 by 40 cm, within the rubric small-area scale. A\
      \ harem male can patrol across female areas and females may divide a 100 to 120 cm tank, but those\
      \ tank divisions do not establish a consistent individual territory of at least about 50 cm length.\
      \ The larger social footprint is accounted for in minTank rather than automatically assigning large\
      \ to each adult."

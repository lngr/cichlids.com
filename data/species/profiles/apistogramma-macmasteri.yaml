  khDkh:
    value: &id043
      min: 0
      max: 1
    confidence: low
    rationale: "Keep the tally natural range of 0 to 1 dKH with low confidence and no verification object.\
      \ The Ocoa collecting account reports below 1 dKH, represented by a bounded interval rather than\
      \ exact zero. The other proposals of 0 to 2 and 0 to 1.5 dKH are estimates or regional comparisons.\
      \ Regional alkalinity of approximately 0.96 to 1.28 dKH, assuming mg/L CaCO3, is wider than the\
      \ decision but is not a seasonal series at occupied macmasteri sites. Evidence retaining pH 5.4\
      \ to 6.7 is pH context only and must not be read as a KH measurement. Neither pH nor conductivity\
      \ can be converted directly to carbonate hardness. Direct habitat titration remains desirable."

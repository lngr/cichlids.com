  sexing:
    text: "Adult males usually have more body mass, stronger colour and longer fin extensions. Females\
      \ remain smaller, and a guarding female often becomes yellow with contrasting dark markings. These\
      \ differences are much less dependable in juveniles or suppressed males. A small dull fish is therefore\
      \ not automatically female. Watch its growth and fin development over time rather than relying on\
      \ one photograph or one moment of colour. Ornamental selections complicate comparisons further.\
      \ Fish sold as Apistogramma viejita are often macmasteri, so a shop label alone cannot establish\
      \ either identity or the purity of a breeding line."

    rationale: "The medians of the four aquarium total-length proposals are 7.5 cm male and 5 cm female:\
      \ generator 8 and 5.5, checker-a 6.5 and 4.5, checker-b 7 and 5, checker-c 8 and 5. FishBase distinguishes\
      \ male 5.5 cm standard length from 7 cm total length; Seriously Fish also uses standard lengths.\
      \ NCS reports about 7 cm males and 4 to 5 cm females, Garnele-Online up to 8 cm males and 5 to 6\
      \ cm females, and Bremen 8 to 9 cm males with females to 6 cm. The median remains within the read\
      \ aquarium reports and avoids adopting their largest specimens as typical. The evidence retains\

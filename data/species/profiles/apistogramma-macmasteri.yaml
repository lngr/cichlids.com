      confidence: medium
      rationale: "Keep the tally 22 to 30 C tolerance, unanimous under the one-degree agreement rule,\
        \ with medium confidence. Proposals are generator 22 to 30, checker-a 23 to 29, checker-b 22 to\
        \ 30 and checker-c 22 to 29 C. It contains the decided natural interval. NCS recommends 22 to\
        \ 29 C, Seriously Fish 24 to 28 C, and Aquasalvaje 23 to 30 C; Aquariumpro gives about 22.2 to\
        \ 30 C. The Bremen observations cover 24 to 27 C. Routine keeping around 25 to 27 C has better\
        \ support than permanent use of the upper endpoint. The wider 25.92 to 36.06 C regional field\
        \ span does not establish long-term heat tolerance, and temporary survival just above 30 C in\
        \ the breeder account does not do so either."

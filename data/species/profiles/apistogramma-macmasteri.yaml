  compatibility:
    text: "Calm adult pencilfish and suitable small tetras can share the upper water while the cichlids\
      \ use sheltered bottom areas. The listed partners apply general care recommendations rather than\
      \ guaranteed individual pairings, and the whole community needs more space than the trio minimum.\
      \ A female defends a cave-centered area, with stronger chasing during brood care; bottom catfish\
      \ may repeatedly enter it and become targets. Fry and very small fish remain potential prey. Avoid\
      \ forceful territorial breeders, large predators and cichlids requiring hard alkaline water. The\
      \ presumed macmasteri-viejita pair group reflects suspected captive ancestry, with neither verified\
      \ pedigrees nor free mate choice established. A shop label or enhanced red colour alone does not\
      \ prove a hybrid."

      \ checker-c propose 120 L with a 100 by 40 cm floor, checker-a 60 L with 60 by 30 cm, and checker-b\
      \ 100 L with 80 by 40 cm. For the decided one-male, two-female unit, the Garnele-Online breeder\
      \ explicitly recommends a 100 by 40 cm floor; Bremen independently reserves multiple females for\

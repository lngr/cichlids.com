      \ source-supported trio footprint instead of interpolating a 90 cm requirement. Using the breeder\
      \ minimum water height of 30 cm gives approximately 120 L before displacement. Smaller sources are\
      \ retained: Seriously Fish 45 by 30 cm and about 41 L for a pair, FishBase 60 cm length, NCS 80\
      \ cm and 100 L, and Terraria 80 by 40 by 30 cm for a harem. Extra community fish require additional\
      \ capacity."

  ph:
    value: &id039
      min: 5
      max: 6.5
    confidence: medium
    rationale: "Keep the tally qualified-majority range of 5.0 to 6.5, confidence medium. The Humboldt\
      \ revision reports Yucao pH 5.7 and uses nearby Iraca at 5.0 as a clearwater analogue for the Guaviare\
      \ tributaries. Collecting reports give Ocoa 5.5 and Villavicencio 6.0; FishBase supplies 6.0 to\
      \ 6.5. These support a regional range rather than a single locality point. The wider Mitimiti series\
      \ of 4.71 to 6.54 and checker-a regional means of 5.4 to 6.7 are retained but are not measurements\
      \ at individually verified occupied microhabitats. AquaExperience gives an even wider 4.5 to 6.5\
      \ without located field readings. The revision distinguishes the Ariari main-channel pH 6.5 to 7.0\
      \ from the southeastern tributary habitat, so those main-channel values do not extend the ideal.\
      \ The CRC public Amazon association conflicts with the more precise Orinoco records and supplies\
      \ no chemistry."
    sources:
    - kind: literature

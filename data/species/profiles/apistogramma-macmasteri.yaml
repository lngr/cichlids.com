  temperatureC:
    value: &id037
      min: 24
      max: 30
    confidence: low
    rationale: "The tally median is 24 to 30 C, with low confidence because the six proposals do not form\
      \ a qualified majority. Generator and tiebreaker-2 propose 23 to 30 C; checker-a and checker-c propose\
      \ 24 to 28 C; checker-b and tiebreaker-1 propose 26 to 30 C. The medians of the six lower and upper\
      \ bounds are 24 and 30 C. This spans cooler piedmont comparisons and warmer Meta lowland observations\
      \ without inventing an intermediate point optimum. FishBase and Fishipedia give the wider 23 to\
      \ 30 C envelope. The Mitimiti station series is wider still, 25.92 to 36.06 C, or 25.92 to 30.42\
      \ C without its isolated hottest reading. Those pooled stream measurements are not paired with individual\
      \ macmasteri captures. Regional annual means of 24.8 to 27.8 C, Ocoa observations around 24 to 27.3\
      \ C and collecting points of 25 and 27 C make the decided range plausible. Cooler Ocoa Nacimiento\
      \ readings of 22.24 to 23.55 C remain regional context. The isolated 36.06 C observation is described\
      \ in the habitat account and does not set an aquarium target. Aquarium recommendations in the evidence\
      \ are explicitly separate from natural measurements."

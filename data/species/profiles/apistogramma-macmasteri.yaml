  breeding:
    text: "A female chooses a sheltered cavity and attaches eggs inside it, often overhead. She tends\
      \ the eggs and larvae and later escorts the young around the bottom. FishBase reports clutches of\
      \ roughly 60 to 120 eggs, but actual output varies. Soft clean water and varied conditioning foods\
      \ are more useful than trying to force spawning with sudden changes. Once fry swim freely, offer\
      \ very small live foods such as newly hatched Artemia. Protect filter intakes. Community fish can\
      \ eat straying fry, and adults may need separating if guarding turns into relentless chasing. Arrange\
      \ growing space before the first brood appears."
    sources:

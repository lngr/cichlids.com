  problems:
    text: "The most common setbacks begin with unsuitable social space or unstable water. A fish hiding\
      \ permanently near the surface, missing meals or showing damaged fins may be losing access to the\
      \ bottom territories. Check behaviour and water quality promptly rather than assuming it is simply\
      \ shy. Hard tap water does not become soft merely because leaves turn it brown. In very weakly buffered\
      \ water, monitor pH and prepare replacement water consistently. Quarantine new arrivals and maintain\
      \ hygiene, since imports may carry parasites and wounds can develop secondary infections. Appetite\
      \ loss, swelling or abnormal breathing need investigation; these signs do not identify a specific\
      \ disease or treatment."

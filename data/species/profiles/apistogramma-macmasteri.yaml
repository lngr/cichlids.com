  sizeAndGrowth:
    text: "Plan around adult total lengths of 7.5 cm for males and 5 cm for females. Some aquarium accounts\
      \ report larger fish, but the planning values balance those reports with the smaller association\
      \ and database figures. Standard length excludes the tail, so it cannot be compared directly with\
      \ aquarium total length. Young fish need enough cover and feeding space to grow without persistent\
      \ suppression. About three to five years is a useful expectation rather than a measured longevity\
      \ distribution."

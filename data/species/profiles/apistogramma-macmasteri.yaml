  hybridGroups:
    value: &id049
    - apistogramma-macmasteri-viejita
    confidence: low
    rationale: "Keep the tally qualified-majority decision apistogramma-macmasteri-viejita with low confidence\
      \ and basis presumed. Generator, checker-b, checker-c and tiebreaker-2 propose that pair alone;\
      \ checker-a proposes no group; tiebreaker-1 proposes that pair plus apistogramma-hongsloi-macmasteri.\
      \ Lucanus suspects historical crossing of macmasteri and viejita in captive red strains, and several\
      \ secondary or specialist discussions repeat possible mixed ancestry. No verified pedigree or free\
      \ choice of conspecific partners was established, so these are not documented crosses under the\
      \ rubric. Ordinary misidentification of pure macmasteri as viejita is separate from hybrid evidence.\
      \ The historical mailing-list account concerning hongsloi is retained but its additional pair does\
      \ not enter the tally decision. No transitive or whole-genus group is inferred. Aquasalvaje also\
      \ alleges sterility without supporting breeding data; that claim is not adopted."

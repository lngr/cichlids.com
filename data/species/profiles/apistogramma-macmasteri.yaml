  diet:
    value: &id046
      type: invertivore
      bloatSensitive: false
      foods:
      - Artemia
      - Daphnia
      - Cyclops
      - small insect larvae
      - small sinking carnivore pellets
    confidence: high
    rationale: "All four complete profiles agree on invertivore and bloatSensitive false; keep the tally\
      \ unanimous decision and high confidence. Seriously Fish identifies bottom-associated invertebrates\
      \ as the main prey, and the association account independently describes aquatic insects. The proposed\
      \ food lists differ in examples, not feeding guild. The selected list covers small crustaceans,\
      \ larvae and sinking animal-based prepared foods. General accounts using an omnivore label or describing\
      \ acceptance of mixed prepared foods do not establish substantial natural plant feeding. No read\
      \ source identifies the specialized high-protein bloat syndrome; the false flag does not imply immunity\
      \ to digestive disease. FishBase trophic level is modelled from relatives, and its diet-composition\
      \ table has no data rows."

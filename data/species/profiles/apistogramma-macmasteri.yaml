    tolerance:
      value: &id042
        min: 0
        max: 5
      confidence: medium
      rationale: "Keep the tally qualified-majority tolerance of 0 to 5 dGH with medium confidence. Five\
        \ runs propose 0 to 5 and checker-a proposes 0 to 8 dGH. Seriously Fish directly supports 0 to\
        \ 5; Dwarfcichlids.com gives approximately the same range in ppm, and Aquasalvaje gives 1 to 5.\
        \ Wider source ranges remain visible: Fishkeeper 0 to 8, Terraria 2 to 8, Aquariumpro 2 to 10,\
        \ DRTA 1 to 8 and AquaExperience 1 to 8 in its table or 2 to 8 in prose. A specialist-forum keeper\
        \ accepts 8 to 10, another reply suggests up to 15 dGH for domestic strains without personal verification,\
        \ and one breeding project records 7 dGH. These reports show possible adaptability but do not\
        \ establish sustained health for all wild and domestic populations. The high-trust species recommendation\
        \ therefore sets the general ceiling. A separate forum value of 10 dKH concerns carbonate hardness\
        \ and is not GH evidence."

variants:
- name: Red / A121
  kind: color-morph
  note: Captive ornamental selection; a red label alone does not document hybrid ancestry.
- name: Gold
  kind: color-morph
  note: Captive gold form illustrated by Seriously Fish. Not a wild locality.
- name: Red mask / Super red
  kind: color-morph
  note: Trade names for enhanced red selections; parentage and consistency vary between breeders.
features:
  origin:
    value: &id036
      continent: South America
      region: "Colombian Orinoco piedmont, upper Meta and upper Guaviare drainages"
      waterbody: null
      localities:
      - Rio Guaytiquia
      - Rio Metica
      - Villavicencio
      - Restrepo
      - Rio Ocoa headwaters
      - Rio Yucao
      - "Cano Tigre, Rio Ariari drainage"
    confidence: high
    rationale: The upper Meta core range is agreed by the catalog and species databases. Checker-a restricts
      the distribution to that core; the other complete profiles include upper Guaviare. Mesa and Lasso
      examined an upper Guaviare specimen and specifically extend the range to Cano Tigre in the Ariari
      drainage; Lucanus independently reports this southern range. The specimen-based revision outweighs
      the narrower database summary. The CRC public Amazon association is too broad and conflicts with
      the precise Orinoco records. Secondary collecting accounts add Ocoa and Villavicencio. The accessible
      AquaInfo fragment gives map context only; blocked IUCN and other inaccessible pages supply no direct
      evidence.

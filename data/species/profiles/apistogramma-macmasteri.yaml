  socialBehavior:
    text: "A male can breed with more than one female, but this does not make a crowded harem peaceful.\
      \ Each female needs a defensible area and somewhere to withdraw. Males usually reject other males,\
      \ while females may fight over nest sites. After spawning, a previously compatible female may pursue\
      \ the male or other adults. Watch whether every fish can feed and rest without being displaced.\
      \ A compatible pair is an alternative when separately housed females cannot be accommodated. Keep\
      \ spare housing available before breeding starts, since adding another cave may not resolve established\
      \ aggression."

  ghDgh:
    value: &id041
      min: 0
      max: 4
    confidence: low
    rationale: "Keep the tally range of 0 to 4 dGH and low confidence. Agreement under the rubric allows\
      \ approximate bounds and does not turn the estimates into a field survey. FishBase gives 2 to 4\
      \ dH; the Ocoa collecting report attributed to Linke and Staeck gives below 1 dGH. Regional Ocoa\
      \ and Negro hardness measurements, conditionally interpreted as CaCO3 equivalents, give about 1.3\
      \ to 3.5 dGH and offer regional context rather than species-specific seasonal measurements. Zero\
      \ marks the very dilute end, not chemically pure water. Checker-a inferred 1 to 3 dGH from conductivity,\
      \ but conductivity alone cannot determine GH, so that conversion is not adopted. Its original conductivity\
      \ evidence of 48 to 110 uS/cm remains explicitly labelled with its actual unit. Yucao conductivity\
      \ of 3.7 uS/cm also supports only qualitative dilution. ANLA adds regional context without usable\
      \ species-site hardness data."
    sources:
    - kind: literature
      title: "Mesa and Lasso (2011). Revision del genero Apistogramma en la cuenca del rio Orinoco. Humboldt\
        \ Institute, pp. 107-109"

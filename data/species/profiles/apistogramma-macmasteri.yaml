  husbandry:
    text: "For one male with two females, provide a 100 by 40 cm floor and about 120 litres, with each\
      \ female able to reach her own cave behind a visual barrier. Fine sand, roots, leaf cover and shaded\
      \ planting support foraging and withdrawal. Keep filtration effective with gentle flow and use a\
      \ secure lid. Routine temperatures around 25 to 27 C are better supported than permanent use of\
      \ either edge of the wider 22 to 30 C tolerance. The planning tolerances are pH 5.0 to 7.2, GH 0\
      \ to 5 dGH and KH 0 to 4 dKH; the KH interval is especially provisional. Stable soft water is preferable\
      \ to repeatedly adjusting toward an endpoint. Prepare replacement water consistently and monitor\
      \ waste and pH."

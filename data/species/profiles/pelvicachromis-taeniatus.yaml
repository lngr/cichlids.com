    rationale: "The Catalog of Fishes, current FishBase distribution and the revision identify Benin and\
      \ Nigeria as the range of valid Pelvicachromis taeniatus. Locality descriptions in the four proposals\
      \ refer to the same coastal region and Ethiope-Jamieson type locality. The old Nigeria-and-Cameroon\
      \ range in Seriously Fish pools present-day species. Moliwe, Lobe, Kienke and Dehane belong to P.\
      \ kribensis; Wouri belongs to P. drachenfelsi. Reports from those populations remain cited as historical\
      \ or related-species evidence and do not define this profile's natural chemistry."

        \ at 5 dGH. Native surface-water measurements near 1.43 to 1.96 dGH show why 5 dGH is not an absolute\
        \ lower boundary. The chosen band is narrower than the zero-to-12 proposals, Tropischevissengids'\
        \ 6 to 13 and AquaInfo's 8 to 17. Near-zero field titrations and a below-1 congener proxy are\
        \ retained but analytically or taxonomically less secure. FishProfiles recommends 5 to 10, Aquarium\
        \ Ratgeber 5 to 8 and Fishipedia summarizes 1 to 5. The Dehane soft-water breeding account concerns\
        \ P. kribensis. This is a provisional maintenance envelope, not a controlled hardness-limit experiment."

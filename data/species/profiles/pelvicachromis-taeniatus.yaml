    rationale: "The sex-specific medians are 9 cm male and 6 cm female: generator, checker-b and checker-c\
      \ proposed 9/6, while checker-a proposed 8/5.5. Larsen explicitly gives 9/6 cm total length for\
      \ Nigerian red, and Kinyon gives approximately 8.9/6.35 cm for Nigeria Green. These independently\
      \ support typical aquarium maxima. Josh's Frogs gives smaller Nigerian Red fish at about 7.6/5.1\
      \ and Tropischevissengids gives 8/6.5; FishProfiles' 8/8 does not capture the established dimorphism.\
      \ FishBase's 7.1 cm and Seriously Fish's 8 cm are standard lengths, so they do not set a competing\
      \ total-length maximum. Moliwe laboratory sizes are retained as related-species context."

  breeding:
    value: cave-spawner
    confidence: high
    rationale: "All four proposals agree on cave spawning. CRC, FishBase and Nigerian aquarium accounts\
      \ describe eggs inside sheltered cavities and parental care by a pair. The female usually remains\
      \ near the clutch and the male excludes intruders, with temporary or lasting changes in care when\
      \ partners disagree. No mouthbrooding category is supported."

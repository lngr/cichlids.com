  ghDgh:
    value:
      min: 1
      max: 2
    confidence: low
    rationale: "Retain the unanimous tally band of 1 to 2 dGH and its low confidence. Agreement uses the\
      \ rubric tolerance of 2 dGH, so it does not mean identical endpoints: generator proposed 1.4 to\
      \ 2, checker-a 1 to 3, checker-b 0 to 2 and checker-c 0 to 2. Surface-water hardness of 25.5 to\
      \ 35 mg/L as CaCO3 in Omo-Irabor and Olobaniyi converts to 1.43 to 1.96 dGH at 17.848 mg/L per degree.\
      \ The 25.5 to 45 mg/L interpretation retained from checker-a includes groundwater; it is not a separate\
      \ surface-water measurement. The selected band is narrower than that proposal and the unlocated\
      \ FishBase range of 5 to 12 dGH or Fishipedia's 1 to 5. Agbaire and Obi report 0.06 to 0.23 dGH\
      \ after conversion, while the 2024 study reports 13.44 to 29.13 dGH despite conductivity of only\
      \ 9.81 to 111.5 uS/cm. These incompatible regional analyses, and macrophyte-paper hardness inconsistent\
      \ with its calcium and magnesium, are retained without setting the ideal. Near-zero regional forest-water\
      \ observations concern a congener. The decision is a provisional typical band, not proof that all\
      \ natural populations avoid softer water."
    sources:
    - kind: literature
      title: "Omo-Irabor and Olobaniyi (2007). Investigation of the Hydrological Quality of Ethiope River\
        \ Watershed, Southern Nigeria. JASEM 11(2)."
      url: "https://doi.org/10.4314/jasem.v11i2.54978"

  socialBehavior:
    text: "An accepted pair is the adult social unit. A male and female purchased separately may remain\
      \ incompatible, and even established parents can disagree during brood care. Repeated hiding, missed\
      \ meals and confinement to one corner can reveal pressure before obvious injury appears. Provide\
      \ retreats and a way to separate a rejected partner. Breeding adults chase intruders from the cave\
      \ and later from the moving brood. Juvenile group rearing can produce compatible partners, but several\
      \ adult pairs need much more floor space than the pair minimum."

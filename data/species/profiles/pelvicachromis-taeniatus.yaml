    rationale: "All four proposals agree on sand, plants and wood; differing list order has no biological\
      \ meaning. Fine substrate permits feeding and nest excavation, while roots, woody cavities and vegetation\
      \ supply shelter. The Ethiope macrophyte study shows that dense submerged vegetation is not universal,\
      \ so plants denote useful cover rather than an obligatory dense underwater plant bed. Artificial\
      \ stone caves do not make this fish a rock specialist."

  - name: Pelmatochromis klugei
    note: Junior synonym in the Catalog of Fishes.
  - name: Pelmatochromis kribensis calliptera
    note: The Catalog still lists this nominal taxon as a synonym of taeniatus; its Cameroon type locality
      makes this historical assignment unsuitable for extending the current range.
  legacyNames:
  - Pelvicachromis taeniatus
  note: "Valid name confirmed in the Catalog of Fishes. Its current distribution is Benin and Nigeria.\
    \ Pelvicachromis kribensis is a valid species, not a current synonym. Older broad usage includes Moliwe,\
    \ Lobe, Kienke, Dehane and Nyete populations now assigned to P. kribensis; Wouri is P. drachenfelsi.\
    \ The retrieved DOI copy of the 2014 revision contains the abstract only. Do not transfer Cameroon\
    \ field measurements or laboratory studies to Nigerian taeniatus without checking population identity."

  predation:
    value: 1
    confidence: low
    rationale: "Retain the conservative tally decision of level 1 and low confidence after a 3-to-3 split.\
      \ Generator, checker-b and checker-c proposed 1; checker-a, tiebreaker-1 and tiebreaker-2 proposed\
      \ 0. No qualified majority exists, so the rubric selects the higher proposed level. The level-1\
      \ case rests on a Nigerian Red warning about very small companions and explicit inference from small\
      \ omnivorous feeding, rather than a measured 2 cm prey limit. Seriously Fish recommends small schooling\
      \ companions, Aquario explicitly describes a nonpredator toward small fish, and AquaInfo and FishProfiles\
      \ provide indirect support for level 0. CRC's public summary does not establish piscivory or its\
      \ absence, and FishBase's diet table is empty. The Krib reports brood consumption under the former\
      \ broad name, including populations now placed elsewhere; brood cannibalism alone does not establish\
      \ deliberate hunting of small tankmates. The cichlids.com Moliwe post asks about possible fry loss\
      \ without documenting an event. Level 1 is therefore a cautious operational classification for fry\
      \ and tiny-fish risk, not a finding of regular piscivory."

  sexing:
    text: "Adult males are usually longer and slimmer, with more extended dorsal and anal fins. Females\
      \ are shorter and deeper-bodied, with a strongly coloured abdomen during courtship. Both sexes can\
      \ be vivid, so brightness alone is unreliable. In valid taeniatus males, dark dots occur in the\
      \ upper tail while a dark lower edge borders a pale inner band. Females carry dark horizontal tail\
      \ markings. Nigerian forms vary in head and fin colour, and older Cameroon trade names need identification\
      \ separately from this profile."

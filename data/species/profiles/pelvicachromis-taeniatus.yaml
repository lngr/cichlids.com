    tolerance:
      value:
        min: 5
        max: 7.5
      confidence: medium
      rationale: "Retain the qualified-majority tolerance of pH 5 to 7.5 at medium confidence. Generator\
        \ and checker-a proposed 5 to 8; checker-b, checker-c, tiebreaker-1 and tiebreaker-2 proposed\
        \ 5 to 7.5. Seriously Fish directly supports 5 to 7.5. Kinyon bred Nigeria Green at 5.5 and Larsen\
        \ bred Nigerian red at measured tank pH 7.5; Larsen's source tap water was pH 8, which does not\
        \ demonstrate maintenance at 8. The decision is narrower at the upper end than Josh's Frogs' captive-stock\
        \ allowance to 8, FishProfiles' 6 to 8, Tropischevissengids' 6 to 7.8 and FishBase's environmental\
        \ 6 to 8. Those conflicting claims remain evidence, but the specific high-trust care range receives\
        \ more weight. AquaInfo's 6 to 7 and Aquario's 5 to 7 are narrower recommendations. The selected\
        \ tolerance contains natural pH 5.1 to 7.4 and does not imply equal spawning success or offspring\
        \ sex ratios throughout."

      \ low confidence. Generator proposed 26 to 29, checker-a 24 to 27, checker-b 26 to 30, checker-c\
      \ 25 to 28, tiebreaker-1 26 to 30 and tiebreaker-2 24 to 28 C. Agbaire and Obi measured 26.9 to\
      \ 29.5 C in the Ethiope; the chosen whole-degree band captures those repeated regional conditions.\
      \ Cooler Ethiope observations of 24 to 27 C and station means around 26.17 to 27.05 C remain relevant.\
      \ The selected band is narrower than the 20 to 34 C envelope in Ito and Leonard, the 26.1 to 31.3\
      \ C table envelope in Omoigberale and colleagues, and the 25 to 38 C water-column envelope at dredged\
      \ Igun. Those excursions lack matched fish captures and do not define a continuous aquarium target.\
      \ FishBase lists 22 to 25 C without exposing collection-site measurements. Nigerian regional measurements\
      \ carry more weight for habitat than general care brackets, but none establishes a species-wide\
      \ optimum. The macrophyte paper has conflicting month labels and the preprint abstract gives 31.2\
      \ C instead of the table maximum of 31.3 C."

  sizeAndGrowth:
    text: "Allow for a male reaching about 9 cm and a female about 6 cm in total length. Some Nigerian\
      \ Red stocks remain smaller. Standard length excludes the tail, so published standard lengths cannot\
      \ be used as directly competing aquarium maxima. As juveniles mature and pairs form, their need\
      \ for separate shelter increases. Growth should come from varied small meals and clean water. A\
      \ lifespan of roughly five to eight years is a provisional aquarium expectation from care accounts\
      \ rather than a measured survival curve."

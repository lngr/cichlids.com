    rationale: "Use the component medians of the four proposals for one compatible adult pair. Generator\
      \ proposed 100 L/80 cm/35 cm, checker-a 71 L/60 cm/37.5 cm, checker-b 90 L/80 cm/35 cm and checker-c\
      \ 100 L/80 cm/35 cm; the medians are 95 L, 80 cm length and 35 cm depth. FishBase directly supports\
      \ 80 cm length and Fishipedia recommends 100 L. Seriously Fish permits the smaller 71 L with a 60\
      \ by 37.5 cm base, and Larsen describes successful breeding in 180 L while contemplating a smaller\
      \ dedicated breeding tank. The selected 95 L sits between published pair and community recommendations,\
      \ rather than using the largest reported aquarium as a minimum. The 35 cm depth is a practical layout\
      \ inference. Communities and multiple pairs need more space."

  breeding:
    text: "Offer a compatible pair several enclosed nesting sites. Courtship often centres on the female's\
      \ abdominal colour and displays near a shelter. Eggs are attached inside a cavity, followed by guarding\
      \ and care of the young. Hatching and the start of free swimming vary with conditions and between\
      \ reports, so watch development rather than relying on an exact calendar. Newly hatched Artemia\
      \ and similarly small foods suit free-swimming fry. Protect filter intakes and monitor both parents,\
      \ because a partner may be expelled after spawning. Plan separate space for growing young. Success\
      \ with historical Moliwe stock is evidence about P. kribensis under current taxonomy."

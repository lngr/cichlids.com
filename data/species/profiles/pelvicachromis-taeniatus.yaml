  khDkh:
    value:
      min: 1
      max: 4
    confidence: low
    rationale: "Retain the tallied 1 to 4 dKH with low confidence and no natural-water verification object.\
      \ Generator proposed 1.8 to 3.3, checker-a 1 to 4, checker-b 0 to 3.3 and checker-c 0 to 4; the\
      \ endpoint agreement rule permits these differences. Omo-Irabor and Olobaniyi give surface-water\
      \ bicarbonate of 40 to 65 mg/L in the table and up to 70 mg/L in the prose. Dividing by about 21.8\
      \ gives roughly 1.83 to 3.21 dKH of carbonate alkalinity, rather than a direct aquarium KH reading.\
      \ Checker-a's 31.5 to 80 mg/L also includes groundwater. The decision is narrower than the preprint's\
      \ converted 0.14 to 6.16 dKH river envelope and the 2024 paper's 10.42 to 26.51 dKH, the latter\
      \ inconsistent with its conductivity. Agbaire and Obi's converted 0.07 to 0.10 dKH and below-1 dKH\
      \ congener observations remain opposing evidence. Macrophyte-table alkalinity lacks a confirmed\
      \ CaCO3 reporting basis. GH cannot be substituted for KH; sodium-bearing water can have alkalinity\
      \ exceeding calcium-magnesium hardness."
    sources:
    - kind: literature
      title: "Omo-Irabor and Olobaniyi (2007). Investigation of the Hydrological Quality of Ethiope River\
        \ Watershed, Southern Nigeria. JASEM 11(2)."
      url: "https://doi.org/10.4314/jasem.v11i2.54978"

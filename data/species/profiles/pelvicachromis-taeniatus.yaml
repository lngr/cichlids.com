  husbandry:
    text: "For one accepted adult pair, use at least about 95 litres with an 80 by 35 cm footprint. Arrange\
      \ fine substrate, wood and several enclosed retreats so either fish can leave the other's view.\
      \ Plants and subdued light can improve security while open patches allow feeding. Routine keeping\
      \ near 24 to 26 C has direct husbandry support. The wider provisional tolerance is 22 to 30 C, pH\
      \ 5 to 7.5, GH 1 to 12 dGH and KH 0 to 6 dKH; continuous maintenance at the warm endpoint is poorly\
      \ documented. Choose stable conditions within that envelope rather than moving between its extremes.\
      \ Maintain filtration, surface movement and regular partial water changes. Low-buffer systems need\
      \ particular attention to pH stability."

  compatibility:
    text: "Calm schooling fish that use the middle of the aquarium are the most useful companions when\
      \ their water needs overlap. Adult harlequin rasboras, cherry barbs or black neon tetras are possibilities\
      \ in a larger community layout that meets each group's requirements. The conservative predation\
      \ grade flags possible fry and tiny-fish loss; the rubric's 2 cm threshold is not a measured prey\
      \ limit for this species. Bottom dwellers can compete for shelters or disturb nests. Large predators\
      \ and forceful territorial fish can overwhelm the pair. P. pulcher also shares a presumed pairwise\
      \ crossing risk. A forum question about mixing the two species does not demonstrate either safe\
      \ coexistence or a documented hybrid brood."
    sources:

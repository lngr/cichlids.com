  diet:
    text: "Provide small foods from both animal and plant sources. A suitable prepared food containing\
      \ plant ingredients can be combined with modest portions of Artemia, Daphnia and small insect larvae.\
      \ Ensure that the pair receives food near the substrate, and remove trapped leftovers. Young fish\
      \ also browse growth and particles on surfaces. The accounts disagree about the relative importance\
      \ of vegetable material, and no reliable Nigerian wild diet series was found. Omnivory is the best\
      \ supported category; a particular protein-related bloat predisposition has not been established."

  lifespanYears:
    value:
      min: 5
      max: 8
    confidence: low
    rationale: "The median endpoints give 5 to 8 years. Generator, checker-b and checker-c proposed 5\
      \ to 8, whereas checker-a proposed 3 to 5. Fishipedia and Tropischevissengids list eight years,\
      \ while Aquario lists five. These care-sheet figures support a provisional aquarium expectation,\
      \ not a measured survival distribution. The minimum remains an inference, and the retained laboratory\
      \ age of approximately 2.3 years in Moliwe stock is neither a maximum lifespan nor a direct Nigerian-species\
      \ longevity study."

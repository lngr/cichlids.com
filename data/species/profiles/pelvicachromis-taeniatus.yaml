  habitat:
    text: "The current species occupies coastal freshwater drainages of Benin and Nigeria, including the\
      \ Niger Delta and the Ethiope-Jamieson system. Roots, fine sediment and sheltered margins provide\
      \ feeding surfaces and cover. Regional studies support a provisional natural band of 26 to 30 C,\
      \ pH 5.1 to 7.4, GH 1 to 2 dGH and carbonate alkalinity around 1 to 4 dKH. These are estimates from\
      \ river surveys, not measurements beside identified fish at every site. The literature also reports\
      \ cooler water and wider seasonal excursions. Severely dredged Igun reaches produced water-column\
      \ measurements of 25 to 38 C and pH 3.2 to 4.2 without confirmed taeniatus occupancy. A 2024 Ethiope\
      \ study reported pH 4.5 to 5.47, GH equivalent to 13.44 to 29.13 dGH and bicarbonate equivalent\
      \ to 10.42 to 26.51 dKH; its hardness and dissolved-ion figures are difficult to reconcile with\
      \ its low conductivity. These disturbed or inconsistent observations do not define ordinary aquarium\
      \ conditions."
    sources:

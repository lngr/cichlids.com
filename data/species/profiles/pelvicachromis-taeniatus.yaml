partners:
  suitable:
  - species: Trigonostigma heteromorpha
    reason: Calm shoaling midwater fish with overlapping soft-water conditions.
    condition: "Use adults in a suitable group, a larger community tank and clear distance from the cave."
  - species: Pethia titteya
    reason: A relatively restrained small barb that can share mild acidic to neutral conditions.
    condition: Provide a proper group and vegetation in a tank larger than the pair minimum.
  - species: Hyphessobrycon herbertaxelrodi
    reason: Adult black neon tetras use midwater and are too large for the inferred incidental fry-predation
      category.
    condition: Keep a shoal with escape space and suitable shared water parameters.
  unsuitable:
  - species: Pelvicachromis pulcher
    reason: Similar bottom territories and the curated presumed pairwise hybridization risk.
  - species: Astronotus ocellatus
    reason: Adult size and predation make a small dwarf cichlid unsafe.
  - species: Chindongo demasoni
    reason: Forceful territorial behaviour and alkaline habitat requirements are a poor match for a quiet
      riverine pair.
profile:
  overview:
    text: "Pelvicachromis taeniatus suits an aquarium built around a compatible pair and its changing\
      \ family life. Adults forage near shelter and defend their young rather than roaming as fish hunters.\
      \ The valid species comes from Benin and Nigeria. Older labels can be misleading: Moliwe, Lobe,\
      \ Kienke and Dehane now belong to P. kribensis, while Wouri is P. drachenfelsi. Nigeria Red and\
      \ Nigeria Green remain useful trade labels, but a colour name does not guarantee a documented collecting\
      \ locality."

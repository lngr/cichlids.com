  problems:
    text: "When an animal stops feeding or hides persistently, inspect access to shelter and the behaviour\
      \ of its partner as well as water quality. Damage may result from incompatible pairing even in an\
      \ otherwise suitable aquarium. Heat, oxygen shortage, accumulated waste and abrupt changes in poorly\
      \ buffered water add stress. Brief hot river readings do not establish a safe permanent aquarium\
      \ temperature. Check filtration and environmental conditions promptly when breathing, appetite or\
      \ behaviour changes. Keep provenance records when acquiring or passing on fish, because historical\
      \ locality labels can conceal a different species."

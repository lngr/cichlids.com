      \ Generator and checker-b emphasize green and bright fin colours, checker-c includes the brown body\
      \ ground, and checker-a proposes yellow/red/brown with stripes. These descriptions largely reflect\
      \ different Nigerian forms, but the longitudinal body band together with caudal dots and coloured\
      \ fin edges makes mixed more complete than stripes alone. Larsen, Kinyon, FishBase and Lamboj independently\
      \ describe these components. Colours vary with form, sex and reproductive condition; they are not\
      \ a checklist that every male displays equally."

      \ watershed study's surface-water table gives 5.28 to 5.86, with 5.44 as the narrative minimum;\
      \ its broader abstract includes groundwater and cannot define a river-only band. The decision is\
      \ narrower than Omoigberale and colleagues' reference-station range of 5.10 to 7.58 and complete\
      \ range of 4.55 to 7.58, the macrophyte table's 4.25 to 7.93, the Agbede regional range of 5.9 to\
      \ 8.2 and FishBase's unlocated 6 to 8. These remain evidence without becoming the typical habitat\
      \ ideal. Dredged Igun water at 3.2 to 4.2 and the anthropogenically influenced 2024 series at 4.5\
      \ to 5.47 are described separately. Confidence is medium because the field series describe regional\
      \ water rather than identified fish territories."

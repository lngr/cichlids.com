  minTank:
    value:
      volumeL: 400
      lengthCm: 150
      depthCm: 60
    confidence: medium
    rationale: "Generator proposed 400 L, 150 cm length and 60 cm depth; checker-a 250 L, 120 cm and 45 cm;
      checker-b and checker-c 400 L, 150 cm and 50 cm. Retain 400 L and 150 cm from the Lwanda-specific
      AquaInfo and Malawi-Guru recommendations. Choose the generator's more cautious 60 cm front-to-back
      allowance to accommodate cave cover and exposed sand; Seriously Fish gives 60 cm for related A.
      jacobfreibergi, but no Lwanda-specific depth threshold was found. The 50 cm alternative is also a layout
      inference. Reject the smaller transfer from A. stuartgranti against Lwanda-specific guidance and the
      reported female harassment. NVC's 160 L and 100 cm and Tropical Fish Site's 200 L are substantially
      smaller source recommendations; they do not establish a safe minimum for this adult harem. This value
      applies to one male and three females, not an entire community."

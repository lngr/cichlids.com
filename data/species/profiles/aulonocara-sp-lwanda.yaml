        accessed: 2026-10-13
  breeding:
    text: "Females carry developing eggs and young in the mouth after spawning with a displaying male. Field and
      aquarium observations describe spawning in or beside rock shelters without a constructed pit. A
      Lwanda-specific account places release at roughly three weeks. Quiet cover matters for holding females,
      and a separate established nursery can improve fry survival. Maintain identified parents and locality
      records, since mixed peacock breeding introduces presumed crossing risks."
    sources:

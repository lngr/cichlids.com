  problems:
    text: "Repeated pursuit of females is the best documented husbandry problem. Inadequate retreats and
      aggressive companions can turn it into missed meals and injury. Avoid raising GH simply because the
      water should remain alkaline: GH and KH measure different aspects of the water. Control portions,
      maintain water quality and quarantine incoming fish. An archive thread describes disease losses in a
      mixed tank containing Lwanda, but it cannot establish a diagnosis or a species-specific sensitivity.
      Anonymous mixed peacock females also make accidental crossing and lineage confusion harder to detect."
    sources:

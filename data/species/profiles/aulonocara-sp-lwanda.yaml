  husbandry:
    text: "For one male with three females, provide around 400 litres and at least 150 cm length. A 60 cm
      front-to-back allowance gives room for cave cover and exposed feeding areas, but its exact threshold is
      inferred from related cave-peacock guidance. Secure the rockwork and provide several sheltered routes
      that females can use without passing the male. Routine temperatures around 24 to 26 C have stronger
      keeping evidence than the tolerance endpoints. The profile tolerances are 21 to 29 C, pH 7.5 to 8.7, GH
      3 to 18 dGH and KH 5 to 15 dKH; these are approximate envelopes, particularly for hardness. Maintain
      stable water through established filtration, regular testing and matched partial changes."
    sources:
      - kind: database
        title: "de Lange, J. Aulonocara sp. lwanda. AquaInfo"
        url: "https://www.aquainfo.nl/artikel/aulonocara-sp-lwanda/"

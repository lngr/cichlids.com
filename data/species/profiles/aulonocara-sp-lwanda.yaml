        accessed: 2026-10-13
  habitat:
    text: "Build the aquarium around two needs: sheltered rock areas and exposed fine sand for feeding. In the
      lake, males occupy caves in shallow intermediate habitat, while females search sandy or sediment-covered
      surfaces nearby. Lake Malawi is alkaline and buffered with relatively low calcium and magnesium
      hardness. The natural envelopes are 21 to 29 C, pH 7.7 to 8.6, GH 3 to 5 dGH and KH 5 to 8 dKH. These
      lake-wide values do not describe a measured annual series at either collection site."
    sources:

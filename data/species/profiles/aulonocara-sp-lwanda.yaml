  predation:
    value: 1
    confidence: low
    rationale: "All four full-profile votes assign level 1, retained with unanimous verification and low
      confidence. Borstein, AquaInfo and specialist field-based accounts describe small benthic invertebrates
      rather than regular fish hunting. The related A. stuartgranti study supports invertebrate prey detection
      only. Level 1 allows opportunistic fry or very small fish consumption as a precautionary rubric
      inference; neither direct Lwanda fry predation nor a measured 2 cm threshold is established. Higher
      predation levels have no supporting observation."

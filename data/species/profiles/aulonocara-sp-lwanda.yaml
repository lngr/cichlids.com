  sizeAndGrowth:
    text: "Allow about 15 cm for an adult aquarium male and 9 cm for a female. Some specialist databases give
      females up to 11 cm, so the smaller estimate is not a universal ceiling. Feed for steady condition
      rather than rapid weight gain. The suggested lifespan of 8 to 10 years has low confidence and comes from
      a retailer estimate rather than a tracked population."

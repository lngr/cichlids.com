      confidence: low
      rationale: "All four proposals, generator, checker-a, checker-b and checker-c, are 21 to 29 C; retain the
        tally unanimous decision at low confidence. This envelope is widened to contain natural lake
        conditions. AquaInfo recommends 22 to 26 C, Tropical Fish Site 23 to 28 C with 26 to 29 C for
        breeding, and Borstein used about 24.4 to 25.6 C. Related peacock guidance reaches 29 C. No multi-year
        Lwanda trial establishes the 21 C lower endpoint or either physiological limit. Routine care around 24
        to 26 C has stronger practical support."

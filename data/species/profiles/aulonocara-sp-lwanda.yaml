  note: "The Catalog of Fishes genus list, updated 21 September 2026 and read on 13 October 2026, contains 22
    nominal records and 19 valid species. No Lwanda or lawanda name or synonym assignment appears. Borstein,
    Konings and Verheesen continue to distinguish this undescribed cave-associated form; CRC independently
    verifies undescribed status. A relationship to A. jacobfreibergi is not formal synonymy. FishBase reports
    no public Aulonocara lwanda entry; its jacobfreibergi and stuartgranti summaries were read only as
    congener context. The 2025 Turner synthesis, DOI 10.32942/X2S663, was requested through fetch-oa, which
    supplied only a landing page and abstract, so no assignment is attributed to its unread species treatment.
    No recent formal reassignment was verified. Lwanda is an informal label; the spelling lawanda is trade
    usage, not a described synonym."

  hybridGroups:
    value:
      - aulonocara
      - sciaenochromis-fryeri-aulonocara
    confidence: medium
    rationale: "Retain both aulonocara and sciaenochromis-fryeri-aulonocara at medium confidence by the tally
      qualified majority of four out of six. Generator, checker-a, tiebreaker-1 and tiebreaker-2 proposed
      both; checker-b and checker-c proposed only aulonocara. Borstein, AquaInfo and Malawi-Guru give
      Lwanda-specific warnings about other peacocks. Seriously Fish reports S. fryeri spawning with Aulonocara
      females, and Maidenhead Aquatics separately describes breeding-directed attention to them. Their
      genus-level scope supports including this undescribed form in the existing fryeri group, despite the
      more restrictive proposals. No verified fryeri x Lwanda offspring or free choice among same-species
      partners was established. Both groups therefore remain presumed; the extension does not establish
      crosses involving other genera."

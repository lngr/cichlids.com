        accessed: 2026-10-13
  diet:
    text: "Lwanda mainly takes small benthic invertebrates in nature. Offer a complete fine sinking food with
      modest additions of Artemia, Cyclops or insect larvae. Plant ingredients in balanced prepared food are
      compatible with this invertivore classification. Spread small portions so females can feed safely. The
      bloatSensitive flag is false because a special high-protein incompatibility has not been established;
      overfeeding and digestive illness remain possible."
    sources:

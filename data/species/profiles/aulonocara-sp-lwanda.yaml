partners:
  suitable:
    - species: Otopharynx lithobates
      reason: Named for related cave peacocks as a differently patterned Malawi companion.
      condition: Indirect recommendation; use a larger community tank with separate retreats and space for both
        adult units.
    - species: Placidochromis electra
      reason: A sand-associated representative of a calm companion genus recommended in the Lwanda account.
      condition: Species choice is inferred from a genus recommendation; provide exposed sand and extra room for
        both units.
    - species: Copadichromis borleyi
      reason: A robust representative of a companion genus suggested for related peacocks.
      condition: Indirect pairing; account separately for its larger adult size and swimming-space needs.
  unsuitable:
    - species: Aulonocara jacobfreibergi
      reason: Similar females and male displays accompany a presumed genus-wide crossing risk and potential rivalry.
    - species: Sciaenochromis fryeri
      reason: "Genus-level sources report mating with peacock females and displacement of males; the decided shared
        group is presumed, not a confirmed Lwanda cross."
    - species: Aggressive Lake Malawi mbuna
      reason: Persistent territorial pressure conflicts with the Lwanda-specific recommendation for calm companions.
    - species: Fry and fish up to about 2 cm
      reason: The decided level 1 allows opportunistic consumption; its exact prey-size threshold is a rubric
        precaution rather than a measured Lwanda limit.
profile:
  overview:
    text: "Lwanda is an undescribed natural peacock form from Lake Malawi, recorded at Hai Reef and Chiwindi. Its
      provisional name remains Aulonocara sp. 'Lwanda'; association with the A. jacobfreibergi cave-dweller
      group does not make it a formal synonym. Mature males combine blue with yellow or orange areas and fin
      edges. Clear lineage records matter because plain females can resemble other peacocks. Sustained male
      pressure on females makes this a moderately demanding social setup."
    sources:
      - kind: catalog-of-fishes
        title: "Eschmeyer's Catalog of Fishes: Aulonocara species list, updated 21 September 2026"
        url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Au\
          lonocara"
        accessed: 2026-10-13
      - kind: literature
        title: "Konings, A. Cichlids with a sixth sense. Practical Fishkeeping"
        url: "https://www.practicalfishkeeping.co.uk/features/cichlids-with-a-sixth-sense/"
        accessed: 2026-10-13
      - kind: literature
        title: "Borstein, R. (2013). Aulonocara sp. lwanda. Greater Chicago Cichlid Association husbandry and breeding
          report."
        url: "https://www.gcca.net/art-pics/cichlid-profiles-list/malawi-cichlids/328-aulonocara-lawanda.html"
        accessed: 2026-10-13

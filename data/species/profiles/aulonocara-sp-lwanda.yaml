  compatibility:
    text: "Calm, robust Malawi companions can share a larger aquarium with Lwanda. Otopharynx lithobates and
      selected Placidochromis or Copadichromis are conditional options from specialist recommendations, with
      space for every social unit beyond the minimum harem tank. Other Aulonocara and Sciaenochromis fryeri
      share presumed hybrid groups with Lwanda; no named free-choice Lwanda cross was verified. Boisterous
      mbuna can increase harassment. Keep fry and very small fish separate because opportunistic predation is
      provisionally allowed at level 1."

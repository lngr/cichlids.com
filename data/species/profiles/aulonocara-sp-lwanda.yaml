  socialBehavior:
    text: "Use one male with three females as the supported adult unit. Additional males need considerably more
      space and are outside the minimum recommendation. Males defend local cave areas even outside the
      spawning period and may repeatedly pursue females. A female that hides continuously or misses meals
      needs prompt attention to cover, companions and male pressure. Have a separate refuge available if
      harassment persists."
    sources:

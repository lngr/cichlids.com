  temperatureC:
    value:
      min: 21
      max: 29
    confidence: high
    rationale: "Retain the tally lake-wide natural envelope of 21 to 29 C with waterbody verification. Eccles
      reports 21 C inshore cooling and about 27 C in the upper layer in May; Vollmer describes summer surface
      water near 28 C and cooler winter water. The FAO compilation gives only 23 to 25 C and Branchu sampled
      one season. The full 21 to 29 C compilation is broader than these individual surveys and is not a
      site-specific Lwanda measurement. Ngochera confirms an annual limnological campaign in its readable
      abstract, but the numerical temperature series and the 1999 mixing chapter could not be independently
      read through the DOI-based full-text tool; no numerical evidence is attributed to those unread
      sections."
    sources:
      - kind: literature
        title: "Eccles, D. H. (1974). An outline of the physical limnology of Lake Malawi (Lake Nyasa). Limnology and
          Oceanography 19(5), 730-742 (abstract)."

  sexing:
    text: "Adult males grow larger and show stronger blue and warm colours. Females are smaller and mostly subdued
      brown or grey. Dark bars, collar colour and fin-edge intensity vary with population and condition. The
      Red Top label does not guarantee a uniform red pattern. Young or subordinate males may be difficult to
      distinguish from females, so obtain identified fish from a traceable line."

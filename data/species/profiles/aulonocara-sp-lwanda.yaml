  disagreements:
    - field: features.origin
      proposals:
        - by: generator
          value:
            continent: Africa
            region: Lake Malawi
            waterbody: lake-malawi
            localities:
              - "Hai Reef, Tanzania"
              - "Chiwindi, Mozambique"
        - by: checker-a
          value:
            continent: Africa
            region: Lake Malawi
            waterbody: lake-malawi
            localities:
              - Hai Reef (Tanzania)
              - Chiwindi (Mozambique)
        - by: checker-b
          value:
            continent: Africa
            region: Southeastern Lake Malawi
            waterbody: lake-malawi
            localities:
              - "Hai Reef, Tanzania"
              - "Chiwindi, Mozambique"
        - by: checker-c
          value:
            continent: Africa
            region: "Lake Malawi, Hai Reef in Tanzania and Chiwindi in Mozambique"
            waterbody: lake-malawi
            localities:
              - Hai (Chimate) Reef
              - Chiwindi
      decision:
        continent: Africa
        region: Lake Malawi
        waterbody: lake-malawi
        localities:
          - "Hai Reef, Tanzania"
          - "Chiwindi, Mozambique"
      rationale: "Konings, Borstein and Verheesen associate Lwanda with Hai Reef in Tanzania and Chiwindi in
        Mozambique. Malawi.si also uses Hai (Chimate) Reef. Generator and checker-a use Lake Malawi with
        different locality punctuation, checker-b specifies southeastern Lake Malawi, and checker-c places the
        locality details in both region and localities. Normalize these equivalent descriptions to the lake
        plus two named sites; none establishes a third Lwanda collecting site."
    - field: features.ph.tolerance
      proposals:
        - by: generator
          value:
            min: 7.5
            max: 8.6
        - by: checker-a
          value:
            min: 7.5
            max: 9
        - by: checker-b
          value:
            min: 7.5
            max: 8.6
        - by: checker-c
          value:
            min: 7.5
            max: 8.8
      decision:
        min: 7.5
        max: 8.7
      rationale: "Retain the tally unanimous decision of pH 7.5 to 8.7 at medium confidence. Generator and checker-b
        proposed 7.5 to 8.6, checker-a 7.5 to 9.0, and checker-c 7.5 to 8.8. Tally groups these sufficiently
        close proposals and takes their median endpoints; 8.7 is an aggregation result, not a measured Lwanda
        boundary. AquaInfo recommends 7.5 to 8.5 and Tropical Fish Site 7.6 to 8.6. The adopted envelope is
        narrower than the 7.5 to 9.0 ranges for related species on Seriously Fish and the 7.0 to 8.5 retailer
        range for A. jacobfreibergi at its lower end. These broader recommendations and Hurstville's 7.8 to
        8.8 are retained as indirect evidence rather than proof of Lwanda physiological limits."
    - field: features.ghDgh.tolerance
      proposals:
        - by: generator
          value:
            min: 3
            max: 18
        - by: checker-a
          value:
            min: 3
            max: 25
        - by: checker-b
          value:
            min: 3
            max: 18
        - by: checker-c
          value:
            min: 3
            max: 25
        - by: tiebreaker-1
          value:
            min: 3
            max: 18
        - by: tiebreaker-2
          value:
            min: 3
            max: 18
      decision:
        min: 3
        max: 18
      rationale: "Retain 3 to 18 dGH at low confidence by the tally qualified majority of four out of six.
        Generator, checker-b, tiebreaker-1 and tiebreaker-2 proposed 3 to 18; checker-a and checker-c proposed
        3 to 25. The 3 dGH lower limit includes the natural lake envelope. Species-specific AquaInfo gives 12
        to 16 dGH and Tropical Fish Site 10 to 18 dH for breeding; OATA independently gives 12 to 18 dGH for
        Malawi fish. The decision is narrower than Seriously Fish's 10 to 25 dGH for related peacocks and the
        untraced 25 dGH ceiling for Lwanda in Aquarist Atlas. Those higher endpoints remain possible but are
        less directly supported for this form. No controlled long-term endpoint study was found."
    - field: features.khDkh.tolerance
      proposals:
        - by: generator
          value:
            min: 5
            max: 12
        - by: checker-a
          value:
            min: 5
            max: 15
        - by: checker-b
          value:
            min: 5
            max: 15
        - by: checker-c
          value:
            min: 5
            max: 15
        - by: tiebreaker-1
          value:
            min: 5
            max: 15
        - by: tiebreaker-2
          value:
            min: 5
            max: 15
      decision:
        min: 5
        max: 15
      rationale: "Retain 5 to 15 dKH at low confidence by the tally qualified majority of five out of six. Generator
        proposed 5 to 12; checker-a, checker-b, checker-c, tiebreaker-1 and tiebreaker-2 proposed 5 to 15.
        OATA gives 10 to 15 dKH, the Fish Shed breeder page 8 to 15, and the related A. jacobfreibergi
        retailer sheet at Neotropic 5 to 15. Malawi.si's 6 to 12 and Dietzenbach's 6 to 10 are narrower care
        targets, not demonstrated upper health limits. The lower endpoint includes natural KH of 5 to 8.
        Hurstville's 4 to 7 extends below the selected lower limit, but concerns assorted peacocks rather than
        a Lwanda study. General peacock advice around 5 to 6 and JBL's 5 to 12 buffering target do not
        establish complete tolerance limits. Applying these explicit KH recommendations to Lwanda remains
        indirect; GH and pH values alone cannot establish KH endpoints."
    - field: features.maxSizeCm
      proposals:
        - by: generator
          value:
            male: 15
            female: 9
        - by: checker-a
          value:
            male: 14
            female: 9
        - by: checker-b
          value:
            male: 15
            female: 10
        - by: checker-c
          value:
            male: 14
            female: 9
      decision:
        male: 15
        female: 9
      rationale: "Generator proposed 15 cm males and 9 cm females, checker-a and checker-c 14 and 9, and checker-b
        15 and 10. Select 15 and 9 as typical aquarium maxima: AquaInfo and Verheesen support males reaching
        15 cm, while Borstein directly reports females around 8.9 cm and males exceeding 12.7 cm. The wider
        female estimates reach 11 cm in Malawi.si and Einrichtungsbeispiele, and Verheesen says captive
        females can exceed a 9 cm wild figure. Those reports are retained, but the direct aquarium observation
        carries more weight than an interpolated 10 cm estimate. The unsexed 10 cm Tropical Fish Site figure
        is an average, not a male maximum."
    - field: features.diet
      proposals:
        - by: generator
          value:
            type: invertivore
            bloatSensitive: false
            foods:
              - Small crustaceans
              - Aquatic insect larvae
              - Fine sinking cichlid pellets
              - Artemia
              - Cyclops
        - by: checker-a
          value:
            type: invertivore
            bloatSensitive: false
            foods:
              - fine sinking pellets
              - frozen bloodworm
              - brine shrimp
              - spirulina-based food
        - by: checker-b
          value:
            type: invertivore
            bloatSensitive: false
            foods:
              - insect larvae
              - small crustaceans
              - small molluscs
              - fine prepared carnivore food
        - by: checker-c
          value:
            type: invertivore
            bloatSensitive: false
            foods:
              - small crustaceans
              - insect larvae
              - sinking cichlid pellets
              - Artemia
      decision:
        type: invertivore
        bloatSensitive: false
        foods:
          - Small crustaceans
          - Aquatic insect larvae
          - Fine sinking cichlid pellets
          - Artemia
          - Cyclops
      rationale: "All four votes agree on invertivore and bloatSensitive false; retain the complete tally value,
        unanimous verification and medium confidence. Lwanda-specific accounts describe insect larvae,
        crustaceans and other small benthic invertebrates. CRC verifies the independently established niche,
        while the FishBase and research entries concern A. stuartgranti only. Mixed prepared foods and retail
        omnivore labels do not establish a plant-based wild feeding niche. The false sensitivity flag means
        that a specific high-protein incompatibility has not been demonstrated, not that digestive illness is
        impossible. Generator's food list is the tally decision; checker-a proposed pellets, bloodworm, brine
        shrimp and plant-containing food, checker-b insect larvae, crustaceans, molluscs and fine prepared
        food, and checker-c crustaceans, larvae, pellets and Artemia. These are complementary examples, not a
        disagreement on the voted diet classification."
    - field: features.territory
      proposals:
        - by: generator
          value:
            size: small
            breedingOnly: true
        - by: checker-a
          value:
            size: small
            breedingOnly: false
        - by: checker-b
          value:
            size: small
            breedingOnly: false
        - by: checker-c
          value:
            size: small
            breedingOnly: true
      decision:
        size: small
        breedingOnly: false
      rationale: "All proposals use small; generator and checker-c set breedingOnly true, while checker-a and
        checker-b set false. Choose false because Malawi-Guru explicitly reports small cave territories
        defended outside the breeding period. Konings describes separate male territories within larger caves,
        consistent with a localized footprint. AquaInfo describes a temporary spawning area, which is a
        narrower reproductive observation and does not establish that cave defence stops afterwards. No study
        measures the rubric's approximate 30 cm boundary, so the size class remains an interpretation."
    - field: features.social
      proposals:
        - by: generator
          value:
            structure: harem
            ratio: 3
        - by: checker-a
          value:
            structure: harem
            ratio: 4
        - by: checker-b
          value:
            structure: harem
            ratio: 3
        - by: checker-c
          value:
            structure: harem
            ratio: 4
      decision:
        structure: harem
        ratio: 3
      rationale: "Generator and checker-b proposed one male with three females; checker-a and checker-c proposed
        four females. Select three from the Lwanda-specific AquaInfo and Malawi-Guru recommendations of two to
        three females and Borstein's successful one-male, three-female group after a pair failed. The
        four-female alternatives mainly transfer guidance of four to six from related peacocks. Extra females
        may be useful with extra space but are not necessary to define this supported minimum unit. The
        archive reports the same ratio in an undersized tank without breeding and is supporting experience
        only. Harem describes aquarium management, not permanent mating bonds in nature."
    - field: features.hybridGroups
      proposals:
        - by: generator
          value:
            - aulonocara
            - sciaenochromis-fryeri-aulonocara
        - by: checker-a
          value:
            - aulonocara
            - sciaenochromis-fryeri-aulonocara
        - by: checker-b
          value:
            - aulonocara
        - by: checker-c
          value:
            - aulonocara
        - by: tiebreaker-1
          value:
            - aulonocara
            - sciaenochromis-fryeri-aulonocara
        - by: tiebreaker-2
          value:
            - aulonocara
            - sciaenochromis-fryeri-aulonocara
      decision:
        - aulonocara
        - sciaenochromis-fryeri-aulonocara
      rationale: "Retain both aulonocara and sciaenochromis-fryeri-aulonocara at medium confidence by the tally
        qualified majority of four out of six. Generator, checker-a, tiebreaker-1 and tiebreaker-2 proposed
        both; checker-b and checker-c proposed only aulonocara. Borstein, AquaInfo and Malawi-Guru give
        Lwanda-specific warnings about other peacocks. Seriously Fish reports S. fryeri spawning with
        Aulonocara females, and Maidenhead Aquatics separately describes breeding-directed attention to them.
        Their genus-level scope supports including this undescribed form in the existing fryeri group, despite
        the more restrictive proposals. No verified fryeri x Lwanda offspring or free choice among
        same-species partners was established. Both groups therefore remain presumed; the extension does not
        establish crosses involving other genera."
    - field: features.coloration
      proposals:
        - by: generator
          value:
            baseColors:
              - blue
              - yellow
              - orange
            pattern: mixed
        - by: checker-a
          value:
            baseColors:
              - blue
              - yellow
              - orange
              - red
            pattern: mixed
        - by: checker-b
          value:
            baseColors:
              - blue
              - yellow
              - orange
            pattern: bars
        - by: checker-c
          value:
            baseColors:
              - blue
              - yellow
              - orange
            pattern: mixed
      decision:
        baseColors:
          - blue
          - yellow
          - orange
        pattern: mixed
      rationale: "Generator and checker-c proposed blue, yellow and orange with mixed pattern; checker-a added red,
        while checker-b used the same three colours with bars. Borstein describes blue with a yellow collar
        and yellow-orange fin borders; Verheesen adds dark vertical bands. Mixed best represents both the
        distinct warm-coloured areas and variable bars. Red-orange emphasis in Malawi.si and red retail names
        do not establish red as a consistent dominant colour in all adult males. Keep that variation in the
        evidence."
    - field: features.minTank
      proposals:
        - by: generator
          value:
            volumeL: 400
            lengthCm: 150
            depthCm: 60
        - by: checker-a
          value:
            volumeL: 250
            lengthCm: 120
            depthCm: 45
        - by: checker-b
          value:
            volumeL: 400
            lengthCm: 150
            depthCm: 50
        - by: checker-c
          value:
            volumeL: 400
            lengthCm: 150
            depthCm: 50
      decision:
        volumeL: 400
        lengthCm: 150
        depthCm: 60
      rationale: "Generator proposed 400 L, 150 cm length and 60 cm depth; checker-a 250 L, 120 cm and 45 cm;
        checker-b and checker-c 400 L, 150 cm and 50 cm. Retain 400 L and 150 cm from the Lwanda-specific
        AquaInfo and Malawi-Guru recommendations. Choose the generator's more cautious 60 cm front-to-back
        allowance to accommodate cave cover and exposed sand; Seriously Fish gives 60 cm for related A.
        jacobfreibergi, but no Lwanda-specific depth threshold was found. The 50 cm alternative is also a
        layout inference. Reject the smaller transfer from A. stuartgranti against Lwanda-specific guidance
        and the reported female harassment. NVC's 160 L and 100 cm and Tropical Fish Site's 200 L are
        substantially smaller source recommendations; they do not establish a safe minimum for this adult
        harem. This value applies to one male and three females, not an entire community."
    - field: features.lifespanYears
      proposals:
        - by: generator
          value:
            min: 8
            max: 10
        - by: checker-a
          value:
            min: 7
            max: 10
        - by: checker-b
          value:
            min: 8
            max: 10
        - by: checker-c
          value:
            min: 8
            max: 10
      decision:
        min: 8
        max: 10
      rationale: "Generator, checker-b and checker-c proposed 8 to 10 years; checker-a proposed 7 to 10. Retain 8 to
        10 because Interaquaristik states that species-specific estimate, while the 7-year lower endpoint
        rests on general knowledge. No tracked Lwanda cohort supports either exact boundary. Related-species
        retailer estimates are indirect and do not raise confidence."

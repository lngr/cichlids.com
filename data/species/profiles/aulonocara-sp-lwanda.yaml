  khDkh:
    value:
      min: 5
      max: 8
    confidence: high
    rationale: "Retain the tally natural range of 5 to 8 dKH without a verification object. FAO historical
      alkalinity corresponds to about 5.6 to 7.3 dKH and Branchu measurements to about 6.5 to 6.9 dKH. Sodium
      can balance bicarbonate, so KH exceeding GH is consistent with these measurements. The rounded envelope
      describes the lake rather than a captive target."

  suitable:
    - species: Cyprichromis leptosoma
      reason: Uses open water and leaves the rocky bottom and shells to the temporalis pair.
      condition: A larger community aquarium with open swimming space and no overlap with the pair shelters; not
        the minimum pair tank.
    - species: Altolamprologus calvus
      reason: A rock-associated Tanganyika cichlid that can occupy a distinct rocky section.
      condition: A larger aquarium with separate rock territories and escape routes; evaluate brood defense and
        the needs of both species.
    - species: Julidochromis transcriptus
      reason: Can use a separate rock area in a larger lake-style community.
      condition: A larger aquarium with independent rock retreats and enough floor space for both territories.
  unsuitable:
    - species: Neolamprologus multifasciatus
      reason: "Both compete for shells and defend nearby substrate, which can cause persistent conflict in a small\
        \ tank."
    - species: Lamprologus ocellatus
      reason: Another strongly territorial shell dweller would contest the same bottom area and shell sites.
    - species: Tropheus moorii
      reason: "A small pair aquarium does not provide the space or social setup needed by an active Tropheus group;\
        \ its specialist feeding needs also complicate a mixed-food community. This is a setup-dependent recommendation,\
        \ not a universal species-only rule for temporalis."
profile:
  overview:
    text: "Telmatochromis temporalis combines a standard rock-dwelling form with a much smaller shell-dwelling form.\
      \ Both are included in this species profile, as are legacy records entered as T. burgeoni. Its interest lies\
      \ in shelter use, territorial behavior and parental care. A pair needs an aquarium arranged so either fish\
      \ can retreat; small body size does not make the dwarf form harmless."
    sources:
      - *id001
      - *id006
      - *id018
      - *id027
  habitat:
    text: "This cichlid is native to Lake Tanganyika. Rocks provide feeding surfaces and cavities for the normal\
      \ form, while dwarf populations occupy beds of empty snail shells. FishBase records rocky substrates and depths\
      \ down to about 20 m, with shallower intermediate depths commonly used. Some specialist treatments distinguish\
      \ cf. temporalis populations outside the southern type area. The natural water ranges are 23 to 29 C, pH 8.4\
      \ to 9.4, GH 10 to 13 dGH and KH 15 to 20 dKH, based on lake studies rather than aquarium care sheets."
    sources:
      - *id002
      - *id022
      - kind: literature
        title: "Studying the evolution of social behaviour in one of Darwin's Dreamponds: a case for the Lamprologine\
          \ shell-dwelling cichlids"
        url: "https://doi.org/10.1007/s10750-020-04473-x"
        accessed: 2026-10-13
        archived: doi.org/10.1007_s10750-020-04473-x/2026-10-13T092353Z
      - *id004
      - *id027
      - *id007
      - *id011
      - *id008
      - *id012
      - *id010
      - *id013
  sizeAndGrowth:
    text: "The standard form is represented by typical adult maxima of about 10 cm for males and 8 cm for females.\
      \ The female estimate is less secure than the unsexed 10.2 cm FishBase record. Other husbandry reports give\
      \ 10 to 12 cm for the normal form. Dwarf male sizes vary among accounts: the magazine gives 4.4 cm, while\
      \ other reports place the shell form around 5 to 6 cm. Check the form offered before choosing an aquarium.\
      \ Longevity of about 8 to 10 years is reported by one general care guide and remains poorly verified."
    sources:
      - *id002
      - *id006
      - *id021
      - *id018
      - *id033
  husbandry:
    text: "The planning minimum is 100 L with an estimated 80 by 35 cm base for one standard-form pair. This footprint\
      \ is an approximate husbandry choice, not a tested threshold; one species sheet recommends 160 L. A published\
      \ dwarf-pair setup is about 61 by 30.5 by 30.5 cm and does not establish the normal-form minimum. Provide\
      \ firm rock shelters, sight breaks and a sand area; dwarf fish also need several usable empty shells. Keep\
      \ the water stable and clean. The accepted tolerance estimates are 23 to 29 C, pH 8 to 9.4, GH 10 to 20 dGH\
      \ and KH 8 to 20 dKH. These broad ranges do not require routine swings between their endpoints. A mixed community\
      \ needs more space."
    sources:
      - *id006
      - *id002
      - *id021
      - *id009
  socialBehavior:
    text: "Use a compatible pair as the adult starting unit. Pair bonds can be temporary, and some dwarf-form males\
      \ associate with several females. Feeding areas are defended outside spawning, so territorial behavior is\
      \ not confined to brood care. Rival adults can be persistently chased when escape routes are poor. Brood defense\
      \ intensifies the conflict, making separate shelters and unobstructed retreat paths essential."
    sources:
      - *id002
      - *id006
      - *id023
      - *id020
  diet:
    text: "The decided diet is omnivorous with an important algal and biofilm component. Field work supports animal\
      \ intake as well as browsing, and husbandry accounts recommend algae-containing prepared food with small live\
      \ or frozen foods. Fry and very small fish may be eaten opportunistically. No read study demonstrates an unusual\
      \ bloat susceptibility; the false bloat flag expresses that limited evidence rather than immunity to digestive\
      \ illness."
    sources:
      - *id002
      - *id004
      - *id022
      - *id006
  breeding:
    text: "The general breeding category is cave-spawner. Eggs are placed in protected cavities, with the dwarf\
      \ form using empty snail shells. Females tend the enclosed brood while males defend the surrounding area.\
      \ Scientific observations show that small sneaker males can participate in reproduction, so the aquarium pair\
      \ recommendation should not be confused with a universal wild mating system. Parents strongly defend young."
    sources:
      - *id002
      - *id006
      - *id004
      - *id020
  sexing:
    text: "Adult males are generally larger and can show a more prominent forehead, while females are smaller and\
      \ slimmer. The approximate 20 percent sex difference is a guide for standard-form adults. Size comparisons\
      \ become unreliable when fish are young, of different ages or from different ecomorphs. Breeding behavior\
      \ supplies more useful confirmation than a size difference alone."
    sources:
      - *id002
      - *id006
      - *id021
      - *id009
  compatibility:
    text: "A larger Tanganyika community can work when bottom territories remain distinct. Altolamprologus and Julidochromis\
      \ are possible rock-dwelling companions; open-water Cyprichromis offer less overlap with the pair home area.\
      \ Those examples are conditional, not guarantees. Crowded shell-dweller combinations contest the same retreats,\
      \ and tiny fry face opportunistic predation. No named interspecific hybrid group is currently supported for\
      \ this species, which does not prove crossing is impossible."
    sources:
      - *id006
      - *id002
      - *id024
      - *id017
  problems:
    text: "The principal practical risk is territorial pressure on a fish that cannot withdraw, particularly a conspecific\
      \ rival or a neighboring shell dweller. A dwarf pair setup should not be applied automatically to normal-form\
      \ adults. Food waste and unstable alkaline water also need attention. The beginner classification assumes\
      \ a prepared aquarium and a compatible pair. The sources do not establish a specific disease syndrome or precise\
      \ lifelong tolerance endpoints."
    sources:
      - *id006
      - *id002
      - *id004

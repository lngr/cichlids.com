  khDkh:
    value:
      min: 15
      max: 20
    confidence: high
    rationale: "The decided natural range is 15 to 20 dKH and intentionally carries no verification object. FAO\
      \ measurements of bicarbonate and carbonate include values near 15.4 dKH; Cohen and colleagues report alkalinity\
      \ of 6.5 to 6.6 meq/L, and Langenberg cites Edmond and colleagues at 6.7 to 6.9 meq/L, about 18.2 to 19.3\
      \ dKH across those studies. Carbonate alkalinity exceeds calcium and magnesium hardness because other cations\
      \ contribute. The range is a rounded lake synthesis rather than a GH conversion."
    sources:
      - *id010
      - *id007
      - *id008
      - *id006
      - *id011
      - *id012
      - *id013
    evidence:
      - source: *id007
        value:
          min: 15
          max: 20
        note: Table range based on alkalinity and carbonate measurements.
      - source: *id010
        value:
          min: 15
          max: 20
        note: Rounded synthesis of the cited lake measurements; retained range from the input. This is habitat evidence
          and does not measure aquarium tolerance.
      - source: *id010
        value:
          min: 18.2
          max: 19.3
        note: alkalinity of 6.5 to 6.9 meq/L
      - source: *id007
        value:
          min: 15
          max: 20
        note: Natural alkalinity range converted to dKH in the project waterbody table.
      - source: *id010
        value:
          min: 18.8
          max: 19.3
        note: "Alkalinity of 6.7 to 6.9 meq/L reported from Edmond et al., converted with dKH = meq/L x 2.8."
    tolerance:
      value: &id035
        min: 8
        max: 20
      confidence: low
      rationale: "The qualified-majority 15 to 20 dKH decision treats habitat bounds as tolerance limits without\
        \ evidence of harm outside them. The adjudicated 8 to 20 dKH range combines the genus care recommendation\
        \ of 8 to 18 dKH from Il Mio Acquario with the natural lake range. Practical Fishkeeping recommends KH\
        \ above 15 without an upper endpoint; that advice identifies suitable water, not a demonstrated lower\
        \ survival limit. The species pH tolerance of 8 to 9.4 and GH tolerance of 10 to 20 dGH support stable,\
        \ alkaline husbandry but do not convert numerically to KH. Seriously Fish recommends pH 8 to 9.5 and\
        \ 8 to 25 dGH for T. vittatus without specifying KH. The endpoints are low-confidence husbandry estimates,\
        \ not measured physiological limits; maintain the accepted pH and GH ranges independently."
      sources:
        - *id014
        - *id006
        - *id007

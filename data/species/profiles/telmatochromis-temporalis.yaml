  synonyms:
    - name: Telmatochromis burgeoni
      note: "Poll, 1942. Current Catalog synonym; commonly misapplied in the trade to the southern dwarf shell form."
    - name: Telmatochromis lestradei
      note: "Poll, 1942. Current Catalog synonym."
  legacyNames:
    - Telmatochromis burgeoni
    - Telmatochromis temporalis
  note: "The current Catalog of Fishes accepts Telmatochromis temporalis and places T. burgeoni and T. lestradei\
    \ in its synonymy. The name was originally described in Telmatochromis, so the authority has no parentheses.\
    \ CRC still separates burgeoni in its older public listing; that treatment does not override the current Catalog.\
    \ Hanssens and Snoeks (2001) retained the nominal burgeoni, with the later 2003 treatment resolving the current\
    \ synonymy. Aquarium usage of burgeoni for southern dwarf shell fish does not identify the northern type population.\
    \ Julidochromis macrolepis is currently valid as Telmatochromis macrolepis and is excluded from this synonym\
    \ list."

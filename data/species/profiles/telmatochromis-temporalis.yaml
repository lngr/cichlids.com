      max: 13
    confidence: high
    rationale: "The decided natural range is 10 to 13 dGH with waterbody verification. Plisnier and colleagues measured\
      \ surface calcium means of 10.9 to 11.6 mg/L and magnesium means of 41.2 to 43.2 mg/L, equivalent to about\
      \ 11.1 to 11.6 dGH. Cohen and colleagues give north-basin values equivalent to about 12.2 dGH. The rounded\
      \ synthesis also covers historical lake chemistry. FishBase gives a wider 10 to 20 dH interval, retained as\
      \ evidence but not substituted for measured calcium and magnesium hardness."

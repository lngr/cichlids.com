partners:
  suitable:
  - species: Aulonocara stuartgranti
    reason: A possible adult Malawi companion with compatible husbandry and a manageable temperament.
    condition: Use a community aquarium larger than the stated minimum; verify feeding access and male interactions.
  - species: Placidochromis electra
    reason: A possible calm sand-associated Malawi companion with a broadly similar feeding regime.
    condition: Provide additional floor area and separate refuges; the minimum tank is for the ericotaenia
      social unit.
  - species: Copadichromis azureus
    reason: A possible Malawi companion that can use swimming space above the sandy floor.
    condition: Allow extra volume for its own social needs and monitor display behaviour.
  unsuitable:
  - species: Tropheus moorii
    reason: Its specialist grazing diet and social management make a poor fit for an invertebrate-feeding hap
      community.
  - species: Neolamprologus multifasciatus
    reason: A small Tanganyika shell community has different habitat and social requirements; its fry would
      also be exposed to opportunistic predation. Adult fish are not treated as established prey at predation
      level 1.
  - species: Melanochromis auratus
    reason: An assertive territorial mbuna can interfere with the calmer sand-associated fish and its access
      to food.
profile:
  overview:
    text: "Mylochromis ericotaenia is a Lake Malawi cichlid that searches sandy bottoms for animal prey. Dark\
      \ vertical markings and a fragmented diagonal band distinguish its appearance, while mature males develop\
      \ blue coloration. Plan for an adult male around 21 cm and females around 17 cm. It is generally manageable\
      \ with suitable Malawi companions, but breeding males need space and females need places to withdraw.\
      \ Some husbandry numbers remain provisional because the accounts differ substantially."
    sources:
    - *id002
    - *id035
    - *id021
    - *id006
  habitat:
    text: "Lake Malawi is its native range. FishBase emphasizes the northern and southern ends, while specialist\
      \ locality records include Nkhata Bay, Chiwindi and other shore sites; museum specimens also establish\
      \ Deep Bay. Sand is the consistently documented habitat. The adopted natural ranges are 21 to 29 C, pH\
      \ 7.7 to 8.6, GH 3 to 5 dGH and KH 5 to 8 dKH. The lake is alkaline without high calcium and magnesium\
      \ hardness, because bicarbonate buffering and total hardness describe different properties. Provide open\
      \ sand and some peripheral shelter without replacing the feeding area with dense rockwork."
    sources:
    - *id002
    - *id006
    - *id046
    - *id011
    - *id029
    - *id015
  sizeAndGrowth:
    text: "For adult planning use 21 cm for males and 17 cm for females, following the sex-separated AquaInfo\
      \ account and FishBase's approximately 20.6 cm unsexed maximum. Shop sale sizes are smaller and do not\
      \ predict adult space needs. Ron's gives a broader adult estimate reaching about 23 cm, while other retail\
      \ estimates are lower. No growth study or reliable longevity series was found. A provisional 8 to 12\
      \ year lifespan is used, with the upper end inferred from comparable fishes rather than a measured age\
      \ record."
    sources:
    - *id002
    - *id021
    - *id018
    - *id030
    - *id051
    - *id049
    - *id047
    - *id050
  husbandry:
    text: "For one male with three females, use at least 450 L with a footprint of about 150 by 60 cm. This\
      \ is a low-confidence minimum; published recommendations extend to 700 or 800 L and 200 cm, which offer\
      \ more room for a community or rival males. Keep a substantial fine-sand feeding area and provide refuges\
      \ at the edges. Maintain filtration, oxygenation and regular water changes. Routine temperature advice\
      \ centres on the middle twenties Celsius. The assigned aquarium tolerances are 21 to 30 C, pH 7.5 to\
      \ 8.8, GH 3 to 18 dGH and KH 5 to 13 dKH; their endpoints are uncertain and should not become routine\
      \ targets. Stable alkaline water matters more than forcing high GH simply because a care page calls Malawi\
      \ water hard."
    sources:
    - *id016
    - *id021
    - *id042
    - *id018
    - *id024
    - *id023
  socialBehavior:
    text: "The planning unit is one male with three females. Two females are recommended by AquaInfo, while\
      \ other sources allow more; three is a practical compromise rather than a fixed natural group. Expect\
      \ a hierarchy and some chasing, especially during courtship. Aquarium accounts disagree about multiple\
      \ males, so a larger group needs more space and careful observation. A small breeding territory is inferred\
      \ rather than measured. With appropriate tankmates the usual behaviour is relatively mild, but females\
      \ must be able to leave a courting male's immediate area."
    sources:
    - *id021
    - *id018
    - *id042
    - *id023
    - *id035
  diet:
    text: "The main feeding niche is invertebrates from the bottom, including insect larvae and molluscs. Offer\
      \ a balanced sinking formulation with suitable aquatic invertebrates, and check that other fishes do\
      \ not take every portion first. AquaInfo and another husbandry account also mention young or small fish,\
      \ so protect fry and very small companions. This does not make the species a fish specialist. No special\
      \ bloat sensitivity has been established; that absence of evidence does not justify overfeeding or imply\
      \ resistance to digestive illness."
    sources:
    - *id035
    - *id002
    - *id021
    - *id023
    - *id018
  breeding:
    text: "Females incubate eggs and developing young in the mouth. The CRC public account identifies a polygynandrous\
      \ mating system, so a lasting pair bond should not be assumed. Courtship can intensify male territorial\
      \ behaviour even in an otherwise calm aquarium. Provide separation by sight and places where a brooding\
      \ female can rest. Detailed species-specific clutch counts, incubation times and spawning-site dimensions\
      \ were not established by the sources reviewed, so numerical claims extrapolated from other Malawi cichlids\
      \ are omitted."
    sources:
    - *id035
    - *id021
    - *id018
    - *id024
  sexing:
    text: "AquaInfo describes males with stronger blue head coloration and a blue sheen across the body; females\
      \ retain a similar dark-marked pattern without the same blue emphasis. Adult males are usually larger.\
      \ Malawi.si records broad bars and a broken oblique marking outside breeding, so pattern alone does not\
      \ establish sex. Juvenile size and temporary colour changes are unreliable guides to the final sex ratio.\
      \ Obtain sexed adults from someone familiar with the stock when a particular group composition is needed."
    sources:
    - *id021
    - *id006
    - *id018
  compatibility:
    text: "A mixed aquarium is possible with calm to moderately assertive Malawi non-mbuna of suitable adult\
      \ size. Prioritize feeding access and adequate floor space over a long species list. Adult Aulonocara,\
      \ Placidochromis or Copadichromis can be considered in a larger community, but these examples are conditional\
      \ suggestions rather than verified pairwise combinations. Very aggressive mbuna can disrupt feeding and\
      \ shelter use. The predation score concerns fry and very small fish around 2 cm; it does not establish\
      \ that all mouth-sized adult fish are regularly eaten. No supported hybrid group was found, which leaves\
      \ crossing risk uncertain."
    sources:
    - *id021
    - *id018
    - *id016
    - *id042
    - *id035
  problems:
    text: "Limited floor area and concentrated courtship can leave females unable to escape or eat. Observe\
      \ feeding and adjust the stock if chasing becomes sustained. Avoid replacing the sand bed with coarse\
      \ material or excessive rock. Keep pH and buffering stable, and distinguish KH from GH when assessing\
      \ the water supply. Hardness recommendations and tank minima differ widely across the literature, so\
      \ monitor the actual group rather than treating a single boundary as proven. The common risks are poor\
      \ conditions, food competition and social pressure; no unique disease susceptibility was demonstrated."
    sources:
    - *id021
    - *id018
    - *id042
    - *id024
    - *id029

    rationale: "All four profiles agree on Lake Malawi. Generator and checker-b emphasize its northern and\
      \ southern ends; checker-a adds Deep Bay and Chiwindi; checker-c lists Nkhata Bay, Chiwindi, Malopa,\
      \ Manda and Hai Reef. FishBase and the Nordic register restrict their summaries to the lake ends, whereas\
      \ Malawi.si reports broader shoreline occurrence. Turner (2024) documents museum specimens from Deep\
      \ Bay and CRC identifies Chiwindi material. Named locality accounts justify the combined locality list,\
      \ but continuous occurrence around the entire shoreline remains uncertain."

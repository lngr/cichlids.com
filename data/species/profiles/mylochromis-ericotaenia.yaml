      rationale: "The tally retains 21 to 30 C with unanimous agreement under its 1 C endpoint allowance. Generator\
        \ proposed 20 to 30 C; checker-a and checker-c proposed 21 to 30 C; checker-b proposed 21 to 29 C.\
        \ The decision includes the full natural 21 to 29 C envelope and a tentative 1 C upper margin. Routine\
        \ advice is narrower: AquaInfo gives 22 to 26 C in its parameter card and 23 to 25 C in its prose,\
        \ TankBud 24 to 27 C, and Ron's Cichlids approximately 23 to 29 C after Fahrenheit conversion. The\
        \ Atlas temperature records inherited from the inputs are retained, but its readable aquarium section\
        \ gives about 24 to 27 C. No source establishes multi-year health at 30 C, so the tally confidence\
        \ remains low and these endpoints are provisional husbandry limits rather than demonstrated failure\
        \ thresholds."

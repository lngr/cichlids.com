  khDkh:
    value:
      min: 5
      max: 8
    confidence: high
    rationale: "The natural 5 to 8 dKH envelope follows measured Lake Malawi alkalinity. Jackson et al. data\
      \ compiled by FAO give 2.00 to 2.59 meq/L, about 5.6 to 7.3 dKH; Branchu et al. upper-water measurements\
      \ around 2.33 to 2.46 meq/L correspond to about 6.5 to 6.9 dKH. Sodium contributes to bicarbonate buffering,\
      \ so carbonate hardness can exceed calcium and magnesium hardness. This natural feature carries no verification\
      \ object."

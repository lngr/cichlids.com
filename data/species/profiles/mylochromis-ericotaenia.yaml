  temperatureC:
    value:
      min: 21
      max: 29
    confidence: high
    rationale: "Lake Malawi seasonal and regional measurements give the required natural envelope of 21 to\
      \ 29 C. The FAO compilation reports 23 to 25 C at its sampled surface sites; Vollmer et al. describe\
      \ summer surface water around 28 C and winter water below 24 C, with stronger cooling in the southeast\
      \ arm. The 21 C endpoint is attributed to Eccles in the inherited lake synthesis, but the original paper\
      \ is not open access and its DOI page returned HTTP 403. That access limitation is retained; the prescribed\
      \ lake envelope is not replaced by aquarium target temperatures."

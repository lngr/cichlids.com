  diet:
    text: "In the wild the species eats a wide range of animal food. Stable isotope and gut studies of
      southern populations point to mussels, freshwater jellyfish, crustaceans and zooplankton as
      the main prey, with fish forming a smaller share than in the northern C. frontosa; stomachs
      also hold snails, insect larvae and shrimps. In the aquarium offer a varied, protein-rich
      diet: good sinking cichlid pellets, frozen krill, mysis and chopped mussel or prawn, plus some
      food with plant content. Avoid mammal or poultry meat, whose fat the fish digest badly, and do
      not use live feeder fish, which bring disease and add little. Feed adults once or twice a day
      in amounts they finish within a few minutes, and make sure faster tankmates do not take their
      share."
    sources:
      - kind: literature
        title: "Jackson, G., Jackson, C. and Shechonge, A. (2026). Trophic niche differentiation and mercury

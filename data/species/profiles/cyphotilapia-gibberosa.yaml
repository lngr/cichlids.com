  sizeAndGrowth:
    text: "Well-kept males reach about 35 cm total length; females stay clearly smaller at around 25 cm.
      Growth is slow: young fish need several years to reach adult size, and sexual maturity usually
      comes after three to four years. Males keep growing and their nuchal hump becomes larger with
      age and condition. Juveniles bought at a few centimetres need room to grow from the start,
      because a cramped tank and poor water lead to stunted, short-lived fish. With good care the
      species can live for 15 to 25 years, so buying a group is a long commitment."

  socialBehavior:
    text: "C. gibberosa is a sociable fish that should live in a group of at least five, better more.
      The group forms a clear order of rank: one dominant male, sometimes two, several females and a
      few subordinate males. Males do not hold large territories; the leading male claims a
      favourite cave and guards it loosely, mostly by display. In a large tank serious injuries are
      rare, but in small tanks weaker males and females are chased constantly. Towards other species
      of similar size the fish are calm, and their slow, deliberate feeding puts them at a
      disadvantage next to hasty eaters. Their size and appetite make all small fish potential
      prey."

    confidence: high
    rationale: Proposals were rock, sand and open water (generator, checker-a, checker-c) and rock and
      sand (checker-b). The species lives over sediment-covered rocky slopes with boulders and
      patches of soft bottom, mostly at 15 to 70 m, and gathers in large schools above the rocks; it
      digs for prey in the sediment and also takes zooplankton from the water column. Open water is
      therefore part of its habitat, and the tank needs caves, a sandy floor and wide swimming
      space.

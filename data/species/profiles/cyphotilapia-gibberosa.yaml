    confidence: high
    rationale: Endemic to the southern half of Lake Tanganyika, on the shores of the DR Congo, Tanzania
      and Zambia; the holotype was taken at Kasenga in Zambia at 34 m. The Catalog of Fishes,
      FishBase and the original description agree on this southern range, and all four agents chose
      the same water body. Seriously Fish places the western limit at Kilewa Bay and the eastern one
      near the Mahale Mountains, while the genome study of Jackson et al. (2024) finds C. gibberosa
      from Cape Mpimbwe southwards and a hybrid zone with C. frontosa in the middle of the east
      coast; the Mahale area is therefore left out of the localities. The locality list merges the
      trade and sampling sites named by the generator and the checkers.

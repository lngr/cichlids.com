  hybridGroups:
    value:
      - cyphotilapia
    confidence: high
    rationale: All four agents voted for the existing group cyphotilapia, of which this species is a
      member. C. gibberosa and C. frontosa meet in a natural hybrid zone in the middle of the east
      coast of the lake, where genome-wide data show gene flow in both directions, mostly from C.
      gibberosa into C. frontosa (Jackson et al. 2024). Tanganyika.si describes central populations
      with characters of both species that may be of hybrid origin. The two species look alike and
      are confused in the trade, so Seriously Fish advises labelling every locality to keep lines
      pure. No cross with any other species is reported.
    sources:

  coloration:
    value:
      baseColors:
        - blue
        - black
        - white
      pattern: bars
    confidence: high
    rationale: Proposals were blue, black and white (generator, checker-a, checker-c) and blue and white
      (checker-b), all with bars. Adults carry five broad dark body bars plus one through the eye on
      a pale to deep blue body; the bars are black to dark blue, so black belongs to the dominant
      colours. The Congolese forms are the most intensely blue, Tanzanian and Zambian forms paler,
      and large males can lose some contrast in the bars.

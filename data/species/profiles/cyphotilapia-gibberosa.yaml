        checker-a 9 to 25, checker-b and checker-c 10 to 20 and tiebreaker-1 8 to 25. The tally
        therefore decided conservatively and took the intersection of all votes, 10 to 20 dGH, which
        contains the natural range of 10 to 13 dGH; the narrower range makes the app warn earlier.
        The sources span a wider range of 8 to 25 dGH: Seriously Fish gives 10 to 25 dGH for this
        species and for C. frontosa, Fishkeeper 15 to 25, Guidarium 12 to 25, Tropicalfreshwaterfish
        8 to 22 and Tanganyika.si 8 to 20 dGH for Tanganyika cichlids in general. A few sheets stop
        lower, such as FishBase with 8 to 12, Flowgrow with 7 to 14 and FishFish with 6 to 15 dGH;
        they describe a comfortable middle rather than a limit. Total hardness matters less than a
        high, stable pH and carbonate hardness for this species."

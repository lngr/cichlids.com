  problems:
    text: "The most common mistake is a tank that is too small: frontosas grow slowly but steadily and
      become stressed, aggressive or stunted when cramped. The species is sensitive to rising
      nitrate and unstable water, so new tanks and neglected water changes lead to illness. Bright
      light and a lack of shelter make the fish shy and nervous. Small tankmates disappear, and
      fast, aggressive companions keep frontosas from feeding. Fatty food such as beef heart can
      cause fat deposits and organ damage, and overfeeding a rich diet harms digestion. Wild-caught
      fish come from great depth and are sensitive to transport stress. Mixing localities or the two
      Cyphotilapia species produces hybrids that should not be passed on."

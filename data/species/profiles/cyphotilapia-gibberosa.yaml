  note: The Catalog of Fishes (online version of 21 Sep. 2026) lists Cyphotilapia gibberosa Takahashi
    & Nakaya 2003 as valid, citing Jackson et al. (2024), and records that Konings (2015, 2019)
    treated it as a synonym of C. frontosa. The species was described from Kasenga, Zambia, and is
    separated from C. frontosa mainly by three instead of two scale rows between the upper and lower
    lateral lines and by a deeper body. Takahashi, Ngatunga and Snoeks (2007) placed the northern
    six-band morph in C. frontosa, so a six-band pattern alone does not identify C. gibberosa.
    Southern trade forms such as 'Blue Zaire' Moba, Kapampa, Kansombo and Mpimbwe belong here,
    although many dealers sell them as C. frontosa.

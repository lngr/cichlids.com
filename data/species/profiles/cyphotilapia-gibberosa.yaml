    value: 2
    confidence: high
    rationale: "All four agents voted for level 2. Adults swallow any fish that fits into the mouth:
      Seriously Fish warns that much smaller fishes are eaten, Tanganyika.si reports captive fish
      taking tankmates of almost half their own length and names Cyprichromis and Julidochromis as
      prey, and Aquarium Guide also lists Cyprichromis as prey. In the wild fish are one of several
      prey groups; the isotope study of Jackson et al. (2026) and the gut metagenomics of Huyghe et
      al. (2025) show that invertebrates dominate and that fish make up a smaller share than in
      northern C. frontosa, so the species is no specialised piscivore and level 3 is not justified.
      The Cichlid Room Companion summary lists it as piscivorous, which confirms at least level 2."

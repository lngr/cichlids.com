      confidence: medium
      rationale: Proposals were 22 to 29 C (generator, checker-a) and 23 to 29 C (checker-b, checker-c);
        they agree within 1 C, so the vote is unanimous and the decided range is the median of the
        bounds. Care sheets for C. gibberosa and the sister species C. frontosa recommend 23 to 27 C
        (Seriously Fish, Guidarium), 22 to 28 C (Fishipedia), 23 to 28 C (FishFish), 25 to 27 C
        (Tropicalfreshwaterfish), 24 to 26 C (FishBase) and 21 to 26 C (Flowgrow); Tanganyika.si
        advises about 25 to 26 C and warns against long spells near 30 C. Taken together the sources
        span 21 to 28 C. The decided range is narrower at the lower end and reaches 29 C at the
        upper end only because it must contain the natural lake range; 24 to 27 C is the comfortable
        middle for long-term keeping.

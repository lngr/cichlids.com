  feedingSpeed:
    value: slow
    confidence: low
    rationale: Proposals were normal (generator, checker-b) and slow (checker-a, checker-c). No species
      database rates the feeding pace directly. The fish feed deliberately rather than in a rush;
      Tropicalfreshwaterfish notes that Tropheus stress the calmer frontosa, keepers report frontosa
      losing food to fast mbuna and growing thin in such company, and a retailer sheet for the Moba
      form calls them slow feeders. Fishipedia states that a meal is eaten within a few minutes,
      which fits a normal pace. Losing food to faster tankmates is the rubric meaning of slow, and
      slow is also the value that lets the app warn about hasty companions, so slow is chosen with
      low confidence.

  diet:
    value:
      type: invertivore
      bloatSensitive: false
      foods:
        - mussels and snails
        - shrimp and other crustaceans
        - insect larvae
        - zooplankton and jellyfish
        - small fish
        - sinking carnivore pellets
        - frozen krill, mysis and chopped mussel
    confidence: medium
    rationale: "All four agents voted for an invertivore without bloat sensitivity. The species-specific
      field data decide the type: stable isotopes of four C. gibberosa sites show mussels,
      freshwater jellyfish, crustaceans and zooplankton as the main food, with mussels at more than
      half of the modelled diet at one site (Jackson et al. 2026), and gut metagenomics place the
      species in an arthropod-rich invertivore group with only some fish (Huyghe et al. 2025).
      Seriously Fish describes a broad predator of small fish, larger invertebrates and molluscs.
      Tanganyika.si, FishFish and the Cichlid Room Companion call adults mainly piscivorous and
      FishBase lists snails, mussels and fish for C. frontosa; these broad statements explain why
      piscivore remains a possible reading, but they do not outweigh the measured diet. No source
      reports bloat in this carnivorous species."

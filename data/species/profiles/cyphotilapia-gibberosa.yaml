      lake is strongly buffered bicarbonate water whose carbonate hardness exceeds its total
      hardness: alkalinity of about 6.5 to 6.9 meq/L in the lake studies equals about 18 to 19 dKH,
      and the station means of the FAO monitoring programme reach down to about 15 dKH."

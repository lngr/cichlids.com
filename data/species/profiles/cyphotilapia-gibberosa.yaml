partners:
  suitable:
    - species: Gnathochromis permaxillaris
      reason: A calm deep-water sand dweller of similar water needs that grows too large to be eaten; kept
        together with C. gibberosa in a biotope tank.
      condition: Only fully grown G. permaxillaris of about 15 cm; tank of 240 cm or more.
    - species: Lepidiolamprologus elongatus
      reason: A robust Tanganyikan predator that holds its own and is too large and spiny to be swallowed.
      condition: Enough rockwork for separate caves; at least 240 cm tank length.
    - species: Neolamprologus sexfasciatus
      reason: A large, sturdy rock-dwelling lamprologine that shares the hard alkaline water and is too
        big for the frontosa mouth when adult.
      condition: Add only adults; plenty of caves.
    - species: Synodontis multipunctatus
      reason: A lake-endemic catfish that uses the lower zones at night and grows too large to be eaten.
      condition: Introduce at adult size.
    - species: Altolamprologus calvus
      reason: A slow, armoured rock dweller that does not compete for open water.
      condition: Only large adults; small females may still be at risk.
  unsuitable:
    - species: Cyphotilapia frontosa
      reason: Closely related and crosses in a natural hybrid zone; mixing spoils both lines.
    - species: Cyprichromis leptosoma
      reason: Slender schooling fish of 10 cm or less are natural prey of Cyphotilapia.
    - species: Julidochromis regani
      reason: Small rock dwellers fit into the mouth of adults and are eaten.
    - species: Neolamprologus multifasciatus
      reason: Tiny shell dwellers are eaten, and the large fish overturn their shells.
    - species: Tropheus moorii
      reason: Fast, quarrelsome herbivores take the food of the slow-feeding frontosa and need a
        plant-based diet, while the protein-rich frontosa food puts them at risk of bloat.
    - species: Lake Malawi mbuna
      reason: Hasty, aggressive feeders from different water chemistry; small ones are eaten and larger
        ones harass the slow giants.
profile:
  overview:
    text: Cyphotilapia gibberosa is the southern of the two frontosa species of Lake Tanganyika. It is a
      large, deep-bodied cichlid with a hump on the forehead, broad dark bars and a blue sheen that
      is strongest in the famous 'Blue Zaire' forms from the Congolese coast. Until it was described
      in 2003 all frontosas counted as one species, and many dealers sell the southern fish as C.
      frontosa. Some authors treat the two as one species, but the Catalog of Fishes lists C.
      gibberosa as valid and genetic work supports the split. In the aquarium it is a calm,
      slow-moving giant that lives in groups and eats any fish small enough to swallow. It needs a
      very large tank, stable hard alkaline water and a lot of patience, since fish grow slowly,
      mature after several years and can live for two decades or more.
    sources:

  compatibility:
    text: Choose tankmates that are too large to be swallowed and calm enough not to bully the slow
      giants. Good options are large Tanganyika cichlids such as Gnathochromis permaxillaris,
      Lepidiolamprologus elongatus or Neolamprologus sexfasciatus, and robust catfish such as
      Synodontis multipunctatus, all added as adults. Small fish like Cyprichromis, Julidochromis or
      shell dwellers are eaten. Fast, aggressive species such as Tropheus or mbuna stress the
      frontosa and compete at feeding. Never combine C. gibberosa with C. frontosa or keep different
      localities together, because the two species interbreed. A species tank with a single locality
      is the safest choice.

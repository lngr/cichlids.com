  sexing:
    text: Young fish cannot be sexed reliably. Adult males grow larger, develop longer fin tips and a
      much bigger hump on the forehead than females; the hump also grows with the male's condition
      and keeps enlarging with age, while it stops growing at medium size in females. Females carry
      a smaller, rounder hump and stay noticeably smaller. Differences become clear only after
      several years, so buying a group of juveniles and letting them grow up together is the usual
      way to obtain both sexes.

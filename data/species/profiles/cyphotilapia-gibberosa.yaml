  habitat:
    text: "The species lives only in the southern half of Lake Tanganyika, along the coasts of the
      Democratic Republic of the Congo, Tanzania and Zambia. Typical places are rocky slopes covered
      with sediment, with large boulders and patches of sand between them, mostly at 15 to 70 m but
      recorded from 6 to 120 m. Older and larger fish tend to stay deeper. The fish often gather in
      large schools above the rocks and forage over soft bottom as well. The water is warm, very
      hard in carbonate and strongly alkaline: about 23 to 29 C, pH 8.4 to 9.4, 10 to 13 dGH and 15
      to 20 dKH. In the middle of the east coast its range meets that of C. frontosa, and the two
      species mix there."

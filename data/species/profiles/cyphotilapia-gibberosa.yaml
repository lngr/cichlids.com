  minTank:
    value:
      volumeL: 1000
      lengthCm: 240
      depthCm: 60
    confidence: medium
    rationale: Proposals were 1000 L, 240 by 60 cm (generator), 864 L, 240 by 60 cm (checker-a,
      checker-b) and 1000 L, 250 by 60 cm (checker-c). For a group of five or more adults Seriously
      Fish gives 240 by 60 by 60 cm, about 864 L, as the minimum and recommends more; Tanganyika.si
      asks for at least 1000 L and AquaInfo for about 1000 L at 250 cm length, while Fishipedia and
      FishFish give 800 L and the Nordic register about 720 L. The length and depth follow the
      majority and Seriously Fish; the volume follows the larger 1000 L of two species sources,
      because fish of 35 cm need the extra height and water volume, and a 240 by 60 cm tank reaches
      it at about 70 cm height.

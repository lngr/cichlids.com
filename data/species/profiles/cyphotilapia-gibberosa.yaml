  ph:
    value:
      min: 8.4
      max: 9.4
    confidence: high
    rationale: Decided by the measured values of Lake Tanganyika; all four agents proposed the same
      range. Surface water is close to pH 9 and deeper water slightly lower. Over a year of sampling
      at 40 m the pH ranged from 8.47 to 9.40 across the three monitoring stations, and from 8.66 to
      9.12 at Mpulungu in the south, where this species lives.

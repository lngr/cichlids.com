  husbandry:
    text: Plan a tank of at least 240 cm length and 60 cm front to back with about 1000 litres for a
      group of adults; more is better. Use a sandy bottom, stable piles of smooth rocks with large
      caves for every adult, and leave a wide open area for swimming. Dim or diffused light suits
      these deep-water fish and keeps them in the open. The species reacts badly to poor or changing
      water, so the tank must be well matured before the fish arrive, filtered with large canisters
      or a sump and kept stable with large weekly water changes. Keep the temperature around 24 to
      27 C, the pH between 8.0 and 9.5, the total hardness between 10 and 20 dGH and the carbonate
      hardness between 12 and 20 dKH. Strong currents are not needed.
    sources:

  temperatureC:
    value:
      min: 23
      max: 29
    confidence: high
    rationale: Decided by the measured values of Lake Tanganyika, to which the species is endemic; all
      four agents proposed the same range. The hourly buoy record at Mpulungu, inside the range of
      C. gibberosa, spans about 23.9 to 29.0 C at 1 m. The south of the lake is the cooler and more
      variable part because of seasonal upwelling from June to September, and the fish usually stay
      at 15 to 70 m, where the water is slightly cooler and steadier than at the surface.

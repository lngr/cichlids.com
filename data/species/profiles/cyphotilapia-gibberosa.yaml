  breeding:
    text: The species is a maternal mouthbrooder. The male prepares a quiet spot, often in or near a
      cave, and releases sperm there; the female then lays a few large eggs and picks them up at
      once, in a sequence that differs from most other mouthbrooders. Clutches are small, usually 10
      to 50 eggs depending on her size. She carries eggs and fry for about five to seven weeks and
      takes in food while brooding, which also feeds the young in her mouth, so the released fry are
      large and independent. Breeding works best in a calm group with several females per male,
      little current and subdued light. Some breeders remove eggs for artificial incubation, but
      this is not a task for beginners.
    sources:
      - kind: database
        title: "Seriously Fish, Cyphotilapia gibberosa"

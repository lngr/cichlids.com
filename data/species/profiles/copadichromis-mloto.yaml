      fish, matching the selected one male and four females and providing a concrete reason to
      exceed the 400 L volume median. The Nordic register gives 300 L and 150 cm; Clarke gives
      at least 120 cm without volume or depth. Seriously Fish gives about 304 L and a 150 by 45
      cm base for the distinct congener C. virginalis. No cited C. mloto account supplies a
      front-to-back minimum. Use the 52.5 cm depth median as a provisional estimate alongside
      the source-backed 500 L volume and 150 cm length; additional sand and retreat space alone
      does not establish a 60 cm threshold. Mixed trade identities and uncertain dimensions
      limit confidence.

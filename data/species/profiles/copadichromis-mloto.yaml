  breeding:
    text: "A female incubates the brood in her mouth after spawning. Correctly identified males have been associated\
      \ with sand bowers, so keep an open spawning patch. Older species-labelled advice suggests about three weeks\
      \ of incubation, with limited modern confirmation of timing. A carrying female needs refuge from persistent\
      \ courtship. Released fry can be vulnerable in a community. Record the identity and origin of both parents\
      \ before distributing offspring; the copadichromis group represents a presumed crossing caution."

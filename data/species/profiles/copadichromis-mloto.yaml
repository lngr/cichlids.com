    note: "Former generic combination recorded by FishBase nomenclature and the Nordic register."
  - name: "Copadichromis sp. 'virginalis kajose'"
    note: "Informal identification applied to material largely reassigned to C. mloto by Turner and colleagues.\
      \ Some northern fish carrying this label belong to other relatives; C. virginalis itself remains a valid separate\
      \ species."
  legacyNames:
  - "Copadichromis mloto"
  note: "The Catalog of Fishes accepts Copadichromis mloto (Iles, 1960); the current and original genus lists were\
    \ queried. Legacy entry 268 retains its literal valid name because no specimen or locality evidence justifies\
    \ a different identification. Turner et al. (2023, online 2022; https://doi.org/10.1007/s10750-022-05025-1)\
    \ identify much of the former Kajose material as this species while retaining C. virginalis. Mloto is also an\
    \ ambiguous trade label. The Nordic register (https://www.ciklid.org/artregister/art.php?ID=1340) and Imperial\
    \ Tropicals (https://imperialtropicals.com/products/mloto-likoma-copadichromis-trewavasae) place Mloto Likoma\
    \ under C. trewavasae; it is not entered as a variant here. Undu, Liuli, reef and firecrest labels are not securely\
    \ identified locality forms of C. mloto. The public CRC entry verifies the name and maternal mouthbrooding but\
    \ predates the revision and provides no accessible feeding or habitat detail. The later population paper, DOI\
    \ 10.1007/s10750-024-05743-8, was refused as not open access by fetch-oa and supplies no evidence here."

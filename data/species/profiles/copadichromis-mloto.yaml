  sexing:
    text: "Colour becomes useful when adults enter breeding condition. The revised field series has dark grey or\
      \ black males with restricted yellow on the upper head or dorsal region; females and inactive fish are much\
      \ paler. This principal body pattern is plain rather than persistently spotted. An older blue-headed aquarium\
      \ description is retained as conflicting evidence. A broad bright upper blaze or an ivory-headed trade label\
      \ needs separate identification, and neither juvenile colour nor the provisional size estimate reliably establishes\
      \ sex."
    sources:
    - kind: "literature"
      title: "Turner et al. (2023; online 2022). Taxonomic investigation of the zooplanktivorous Lake Malawi cichlids\
        \ Copadichromis mloto and C. virginalis"

  habitat:
    text: "A broad open-water area above sand provides the central habitat in this aquarium. Confirmed records include\
      \ soft lake bottoms, both southern arms of Malawi and connected Lake Malombe; the revision reports trawl depths\
      \ from 18 to 114 m. Keep the sand accessible and place any refuge rocks securely without filling the swimming\
      \ area. The natural water envelope here applies to Lake Malawi populations. Its low calcium and magnesium\
      \ hardness is compatible with alkaline, buffered water, so GH and KH should be measured separately."
    sources:
    - kind: "literature"

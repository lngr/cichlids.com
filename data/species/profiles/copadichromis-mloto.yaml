  husbandry:
    text: >-
      For the recommended one male and four females, allow at least 500 L with approximately 150
      cm length and 52.5 cm front-to-back space. The width is a provisional estimate based on
      the median of the proposals rather than a published physiological requirement. Use an
      established filter, surface movement and regular conditioned-water changes. A temperature
      target of 24 to 26 C is better supported by species care guidance than continuous use of
      the full 21 to 29 C tolerance. Adopted aquarium tolerances are pH 7.5 to 8.6, GH 3 to 15
      dGH and KH 5 to 10 dKH. Keep conditions stable; the endpoints are practical planning
      bounds with uneven long-term evidence.

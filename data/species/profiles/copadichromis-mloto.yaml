  problems:
    text: "Trade-name confusion can make otherwise careful husbandry inappropriate for the fish actually purchased.\
      \ Review identity, water stability, food distribution and refuge access when a group fails to thrive. Monitor\
      \ ammonia and nitrite as well as pH, GH and KH. Appetite loss, abdominal swelling or rapid breathing can have\
      \ several causes and should prompt assessment of conditions and fish health. An archive account describes\
      \ illness in an mloto-labelled community, but supplies neither confirmed species identity nor evidence of\
      \ a special susceptibility."
    sources:
    - kind: "literature"

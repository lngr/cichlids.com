      \ cautious typical aquarium estimate. FishBase gives 13.5 cm TL for male or unsexed fish, and the Nordic register\
      \ gives 14 cm without a sex split. Clarke gives about 12 cm without separating sexes and mentions additional\
      \ aquarium growth. The wider Einrichtungsbeispiele estimate is 16/12 cm, while B-Aqua gives 15 cm SL and FishFish\
      \ gives 15/15 cm under uncertain trade identities. Standard length is not interchangeable with total length.\
      \ Female 12 cm remains provisional; neither a reliable captive sex series nor a modern identity check establishes\
      \ it."

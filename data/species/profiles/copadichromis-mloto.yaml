  khDkh:
    value:
      min: 5
      max: 8
    confidence: "high"
    rationale: "The natural Lake Malawi value is exactly 5 to 8 dKH, with high confidence and no verification object.\
      \ Branchu alkalinity of about 2.334 to 2.461 meq/L converts to 6.5 to 6.9 dKH, while the Jackson data in the\
      \ FAO reference table convert to 5.6 to 7.3 dKH. The rounded lake envelope contains both. This is alkalinity\
      \ expressed as aquarium KH, not a calcium and magnesium hardness measurement; sodium helps explain why KH\
      \ can exceed GH."

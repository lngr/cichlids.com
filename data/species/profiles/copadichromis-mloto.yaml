    tolerance:
      value:
        min: 21
        max: 29
      confidence: "low"
      rationale: "All four full-profile runs propose 21 to 29 C, and the tally confirms unanimous agreement with\
        \ low confidence. Species-labelled guidance is narrower: the Nordic register gives 23 to 28 C, Einrichtungsbeispiele\
        \ 24 to 26 C, B-Aqua 24 to 27 C and Clarke recommends 26 C. Related C. virginalis and C. chrysonotus sheets\
        \ give 25 to 29 C; C. azureus gives 26 to 28 C. Malawi.si aquarium setup gives 23 to 28 C, while its separate\
        \ water table targets 25 to 26 C. The natural envelope supplies the required 21 C lower boundary. Long-term\
        \ aquarium health at both endpoints remains untested; 24 to 26 C has stronger direct care support."

  diet:
    text: "Small balanced prepared foods and aquatic crustaceans suit its plankton-feeding ecology. Cyclops, Daphnia,\
      \ Artemia and modest mysis portions are practical options; distribute food so smaller females receive a share.\
      \ Taking plant-containing pellets does not make it an algae-grazing mbuna. The profile assigns invertivore\
      \ with bloatSensitive false, but the disease flag is an inference and does not rule out digestive illness\
      \ or harm from excess feeding. Predation is level 0: purposeful small-fish hunting is unsupported, while incidental\
      \ fry loss remains possible."
    sources:

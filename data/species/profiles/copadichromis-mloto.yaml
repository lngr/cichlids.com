  compatibility:
    text: "Choose calm companions that leave swimming space and allow the group to feed. Published genus-level candidates\
      \ include placid Aulonocara and Lethrinops, plus Cyrtocara where its larger adult space needs are met. Strongly\
      \ aggressive mbuna and large fish hunters can create behaviour or predation conflicts. Mixing breeding Copadichromis\
      \ brings a presumed hybrid caution, not a verified cross between mloto and every congener. The fish can live\
      \ with other species, and its predation level 0 does not guarantee survival of every community fry."
    sources:

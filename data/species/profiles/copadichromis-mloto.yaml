profile:
  overview:
    text: "The identity of aquarium stock matters particularly with this utaka. Legacy entry 268 is retained as\
      \ the valid species Copadichromis mloto, an animal-plankton feeder of the Lake Malawi basin. A recent revision\
      \ links much of the former Kajose material to this species while leaving C. virginalis separate. Mloto alone\
      \ is an unreliable shop label: the Nordic register and Imperial Tropicals identify Mloto Likoma as C. trewavasae.\
      \ Other locality labels may represent undescribed relatives and are not entered as variants here. Historical\
      \ forum threads likewise use several mloto labels without confirming this catalog entry."
    sources:
    - kind: "catalog-of-fishes"
      title: "Eschmeyer's Catalog of Fishes: Copadichromis species"
      url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Copadichromis"

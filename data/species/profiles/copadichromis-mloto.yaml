  socialBehavior:
    text: "The aquarium recommendation is a female-biased breeding unit rather than a claim that wild feeding shoals\
      \ form permanent harems. Four females with one male spreads courtship attention while keeping at least five\
      \ companions together. Some regular chasing and a hierarchy are expected, but injury frequency is not established\
      \ for confirmed mloto. A displaying male may defend a local sand site. Extra males need substantially more\
      \ space and females. A fish repeatedly kept away from food or refuge needs a change in the social arrangement."
    sources:

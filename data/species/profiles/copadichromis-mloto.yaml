  temperatureC:
    value:
      min: 21
      max: 29
    confidence: "high"
    rationale: "The waterbody decision fixes 21 to 29 C for Lake Malawi. Eccles reports 21 C inshore cooling and\
      \ about 27 C in the upper layer in May; Vollmer describes seasonal surface warming to about 28 C. Branchu\
      \ measured only 22.8 to 25.4 C during one northern campaign. These sampling intervals do not replace the adopted\
      \ seasonal lake envelope. The 29 C endpoint is inherited from the limnological synthesis cited by the tally,\
      \ not from an aquarium care sheet. The 1999 chapter and Ngochera thesis have no usable DOI for fetch-oa and\
      \ their full texts were not independently retrieved; their inherited references remain background only."

  sizeAndGrowth:
    text: "The provisional adult aquarium estimates are 14 cm for males and 12 cm for females. Published sizes mix\
      \ unsexed fish, standard and total length, and uncertain trade stock, so the apparent precision should not\
      \ be mistaken for a measured sex difference. Provide adult space from the start and check that smaller fish\
      \ maintain growth and condition. About five to six years is the adopted lifespan estimate; two species-labelled\
      \ sheets suggest six years, but securely identified survival records are missing."

      rationale: "Tally method qualified-majority. The qualified-majority tally decides 20 to 30 C with low confidence.\
        \ Generator, checker-b, tiebreaker-1 and tiebreaker-2 proposed 20 to 30; checker-a proposed 18 to 28 and\
        \ checker-c 20 to 26. Seriously Fish recommends 20 to 26, the Nordic association 20 to 28 and Dietzenbach\

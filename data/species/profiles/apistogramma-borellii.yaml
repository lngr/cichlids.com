      decision:
        continent: South America
        region: "Paraguay and middle to lower Parana basins, with confirmed Uruguay basin records"
        waterbody: null
        localities:
          - "Carandazinho, Mato Grosso, Brazil"
          - "Rio Cuiaba drainage and Pantanal, Brazil"
          - "Corrientes floodplain lagoons, Argentina"
          - "Uruguaiana and Banhado Sao Donato, Rio Grande do Sul, Brazil"
          - "Artigas, Uruguay"
          - "Rio Negro floodplain, Brazil"
      rationale: "The Catalog places the species in the La Plata drainage. FishBase emphasizes Paraguay and lower\
        \ Parana waters, while the vouchered Lanes, Maltchik and de Lucena record confirms the Uruguay basin, including\
        \ Uruguaiana and Banhado Sao Donato; it also cites an Artigas record. The southern Pantanal lagoon study\
        \ supplies Rio Negro floodplain context. The differing locality lists are complementary rather than competing\
        \ distributions. AquaInfo provided map text only and contributes no additional habitat measurements."
    - field: features.temperatureC
      proposals:
        - by: generator
          value:
            min: 21
            max: 30
        - by: checker-a
          value:
            min: 22
            max: 30
        - by: checker-b
          value:
            min: 21
            max: 30
        - by: checker-c
          value:
            min: 23
            max: 26
        - by: tiebreaker-1
          value:
            min: 21
            max: 30
        - by: tiebreaker-2
          value:
            min: 21
            max: 30
      decision:
        min: 21
        max: 30
      rationale: "Tally method qualified-majority. The qualified majority retains Staeck's seasonal Rio Cuiaba collecting-site\
        \ interval of 21 to 30 C. Corrientes observations of 23 to 26 C cover only two April sites, while Paul reports\
        \ about 22 C in regional collecting waters. The wider 26 to 33.7 C seasonal means reported by the Chacorore-Sinha\
        \ Mariana study describe sampled macrophyte habitats and do not demonstrate a typical species-wide upper\
        \ ideal. The forum account of occasional 10 to 30 C captures lacks a traceable site series. Both wider reports\
        \ remain evidence, with their extremes described in the habitat section. FishBase's 24 to 25 C and Fishipedia's\
        \ 20 to 27 C lack equivalent field provenance. The decided interval represents geographic and seasonal exposure,\
        \ rather than constant aquarium settings."
    - field: features.ph

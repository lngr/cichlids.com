            min: 5
            max: 8
        - by: tiebreaker-1
          value:
            min: 5
            max: 8
        - by: tiebreaker-2
          value:
            min: 5
            max: 8
      decision:
        min: 5
        max: 8
      rationale: "Tally method qualified-majority. The qualified majority selects the 5 to 8 envelope that Seriously\
        \ Fish explicitly attributes to wild collection habitats. Staeck's 5.5 to 7.6, Corrientes readings of 5.9\
        \ to 6.2 and Luling's on-site 7.0 to 7.1 are narrower geographical samples. Paul's regional 5.8 to 6.8 observations\
        \ also fit. Checker-a's macrophyte study evidence spans 4.68 to 7.37, extending below the decided minimum;\
        \ it describes assemblage sampling stations rather than a matched species-by-reading series. Paul's pH 8.5\
        \ station did not list borellii in its catch and therefore does not extend the species interval. Oliveira's\
        \ regional mean pH values of 5.4 to 7.8 are context rather than individual capture measurements. All these\
        \ records are retained; the limits in the compiled species account have incompletely documented localities,\
        \ so confidence remains medium."
    - field: features.ghDgh
      proposals:
        - by: generator
          value:
            min: 1
            max: 1
        - by: checker-a
          value:
            min: 0.5
            max: 5
        - by: checker-b
          value:
            min: 0
            max: 1
        - by: checker-c
          value:
            min: 1.3
            max: 1.4
        - by: tiebreaker-1
          value:
            min: 1
            max: 1.4
        - by: tiebreaker-2
          value:
            min: 0.5
            max: 6
      decision:
        min: 0.5
        max: 6
      rationale: "The 1 to 1 dGH qualified-majority point range gives a collecting-site reading the weight of a\
        \ species-wide ideal. The adjudicated 0.5 to 6 dGH range combines Staeck's approximately 1 dGH and\
        \ Luling's on-site 1.3 to 1.4 dGH with regional river chemistry in the native Pantanal floodplain\
        \ system. Oliveira et al. report discharge-weighted calcium and magnesium means for 2000 to 2007:\
        \ Sepotuba has 2.67 mg/L Ca and 0.72 mg/L Mg, and Miranda has 28.61 mg/L Ca and 7.97 mg/L Mg. GH =\
        \ (2.497 * Ca + 4.118 * Mg) / 17.848 gives approximately 0.54 and 5.84 dGH, represented by rounded\
        \ planning bounds. These are regional means, not observed species-specific extrema or conductivity\
        \ conversions. The very dilute Correntes mean of about 0.18 dGH has no established species capture\
        \ linkage and does not define the typical range. Confidence is low because river chemistry provides\
        \ regional context for occupied shallow margins without paired fish records at every station. The\
        \ tolerance extends to 0.5 dGH to contain this natural range."

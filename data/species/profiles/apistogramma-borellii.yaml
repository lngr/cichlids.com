  note: "The Catalog accepts Apistogramma borellii (Regan, 1906) and confirms the original Heterogramma combination\
    \ and listed synonyms. The legacy spelling Apistogramma borelli is retained as a misspelling, not a separate\
    \ species. The Heterogramma genus-list query returned no records; the Apistogramma list supplies the relevant\
    \ historical entries. The accessible public Cichlid Room Companion page agrees on the valid name and cave spawning\
    \ but provides no water chemistry."

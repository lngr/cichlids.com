  husbandry:
    text: "A compatible pair needs at least a 60 by 30 cm base and approximately 54 L gross volume in the recommended\
      \ setup. Place several retreats so each adult can leave the other's view; combine fine sand with wood and\
      \ planted shelter. A community or harem needs additional floor space. Around 20 to 26 C is better supported\
      \ for routine keeping than constant high temperatures. The encoded 20 to 30 C tolerance includes seasonal\
      \ habitat exposure but has no evidence for years at a constant 30 C. Match water to the stock's origin and\
      \ make changes gradually. The broad care envelope is pH 5 to 8 and GH 0.5 to 15 dGH; the lower GH bound includes regional habitat inference. KH 0 to 8 is provisional,\
      \ not a proven physiological interval. Use gentle circulation and regular water changes appropriate to actual\
      \ stocking and water quality."
    sources:
      - kind: database
        title: "Seriously Fish: Apistogramma borellii"
        url: "https://www.seriouslyfish.com/species/apistogramma-borellii/"

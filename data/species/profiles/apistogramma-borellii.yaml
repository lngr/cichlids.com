        \ a year; other accounts describe room-temperature or short breeding regimes rather than multi-year tolerance\
        \ trials. The upper bound is widened to contain the natural 21 to 30 C interval as required by the pipeline.\
        \ It is not evidence of healthy years at a constant 30 C. Routine sustained keeping is better supported\
        \ around 20 to 26 C, with seasonal variation and stock origin considered."

      rationale: "Generator, checker-b and checker-c proposed 0 to 8; checker-a proposed 0 to 10. The tally accepts\
        \ their agreement within 2 dKH and retains 0 to 8 with low confidence. Dietzenbach advises below 8 dKH,\
        \ represented by a rounded outer boundary, while forum keeping and breeding examples include less than 1\
        \ and approximately 4 dKH. The lower bound is inferred from soft-water practice. Acquariodolce's wider 2\

partners:
  suitable:
    - species: Nannostomus marginatus
      reason: "Small, relatively quiet upper-level dither; an application of the source recommendation for Nannostomus."
      condition: Choose compatible water and temperature around 24 C; provide space for its own group in a community
        tank larger than the pair minimum.
    - species: Paracheirodon innesi
      reason: Small schooling companion consistent with the legacy report of neons with dwarf-cichlid pairs.
      condition: Use adult fish around 22 to 24 C; provide adequate school space and expect reduced cichlid fry
        survival.
    - species: Hyphessobrycon amandae
      reason: "A small, peaceful midwater candidate that does not require a bottom cave; compatibility is inferred\
        \ from behavior rather than a direct pairing trial."
      condition: "A larger planted community around 24 C, with a proper school and targeted feeding for the cichlids."
  unsuitable:
    - species: Astronotus ocellatus
      reason: Its adult size and predatory capacity put a small dwarf cichlid at risk.
    - species: Amatitlania nigrofasciata
      reason: A much more forceful territorial breeder can monopolize the bottom and injure or exclude this small
        fish.
    - species: Apistogramma cacatuoides
      reason: Competing dwarf-cichlid territories and breeding aggression make this a poor addition to the recommended
        small pair aquarium.
profile:
  overview:
    text: "A quiet aquarium lets this small South American cichlid show its color changes and parental behavior.\
      \ Males may have blue bodies and yellow anterior areas, with red facial accents in some forms. A compatible\
      \ pair is a practical starting unit for captive-raised fish. The valid name is Apistogramma borellii; the\
      \ legacy catalog omitted its second final i. Trade labels and color forms need their own provenance, especially\
      \ where older Opal labels have uncertain identity."
    sources:
      - kind: catalog-of-fishes

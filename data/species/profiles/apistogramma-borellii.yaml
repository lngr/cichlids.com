    tolerance:
      value:
        min: 20
        max: 30
      confidence: low
      rationale: "The qualified-majority tally decides 20 to 30 C with low confidence. Generator, checker-b, tiebreaker-1\
        \ and tiebreaker-2 proposed 20 to 30; checker-a proposed 18 to 28 and checker-c 20 to 26. Seriously Fish\
        \ recommends 20 to 26, the Nordic association 20 to 28 and Dietzenbach 20 to 25, with cooler winter periods\
        \ discussed separately. A forum colony experienced 19 to 28 for about a year; other accounts describe room-temperature\
        \ or short breeding regimes rather than multi-year tolerance trials. The upper bound is widened to contain\
        \ the natural 21 to 30 C interval as required by the pipeline. It is not evidence of healthy years at a\
        \ constant 30 C. Routine sustained keeping is better supported around 20 to 26 C, with seasonal variation\
        \ and stock origin considered."
      sources:

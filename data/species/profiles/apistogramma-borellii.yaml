        max: 1
      rationale: "Natural KH is a plain fact; the tally agreement is unanimous within its 2 dKH threshold. The tally\
        \ decides 0 to 1 dKH with low confidence and no natural-water verification object. Generator proposed 1\
        \ to 1, checker-a 0 to 2, checker-b 0 to 1 and checker-c 0.8 to 1. Staeck reports approximately 1 dKH; Luling\
        \ reports 1 dKH on site and 0.8 dKH in the transported sample. The lower bound of zero reflects soft-water\
        \ inference and integer rounding, not a measured zero. Checker-a's wider 0 to 2 estimate from the macrophyte\
        \ study is inferred from conductivity and pH; these cannot uniquely determine KH. This limited regional\
        \ estimate is not a full distributional chemistry survey."

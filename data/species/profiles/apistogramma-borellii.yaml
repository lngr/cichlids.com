      \ Parana waters, while the vouchered Lanes, Maltchik and de Lucena record confirms the Uruguay basin, including\
      \ Uruguaiana and Banhado Sao Donato; it also cites an Artigas record. The southern Pantanal lagoon study supplies\
      \ Rio Negro floodplain context. The differing locality lists are complementary rather than competing distributions.\
      \ AquaInfo provided map text only and contributes no additional habitat measurements."

  temperatureC:
    value:
      min: 21
      max: 30
    confidence: medium
    rationale: "The qualified majority retains Staeck's seasonal Rio Cuiaba collecting-site interval of 21 to 30\
      \ C. Corrientes observations of 23 to 26 C cover only two April sites, while Paul reports about 22 C in regional\
      \ collecting waters. The wider 26 to 33.7 C seasonal means reported by the Chacorore-Sinha Mariana study describe\
      \ sampled macrophyte habitats and do not demonstrate a typical species-wide upper ideal. The forum account\
      \ of occasional 10 to 30 C captures lacks a traceable site series. Both wider reports remain evidence, with\
      \ their extremes described in the habitat section. FishBase's 24 to 25 C and Fishipedia's 20 to 27 C lack\
      \ equivalent field provenance. The decided interval represents geographic and seasonal exposure, rather than\
      \ constant aquarium settings."

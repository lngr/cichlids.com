  socialBehavior:
    text: "Adults use small areas near the bottom, and brood defence can intensify chasing sharply. Both partners\
      \ need usable refuges even when a pair initially appears compatible. A guarding female may exclude the male,\
      \ while courtship pressure can trouble an unreceptive female. Persistent cornering or missed feeding calls\
      \ for separation. The public Cichlid Room Companion account identifies polygyny, so pair keeping should not\
      \ be confused with obligatory monogamy. Harems need separate female territories; the Nordic association recommends\
      \ an 80 cm tank for a trio."

  sizeAndGrowth:
    text: "Plan for males around 7 cm and females around 4 to 5 cm; the encoded female value of 4.5 cm interpolates\
      \ the aquarium accounts. Publications using standard length exclude the tail and cannot be compared directly\
      \ with total aquarium length. Reports of larger males remain useful context without defining the usual adult\
      \ maximum. Juvenile color and fin development can be misleading when choosing a pair. An approximate lifespan\
      \ expectation of 2.5 to 4.5 years is weakly documented and reflects conflicting care-sheet estimates, rather\
      \ than a measured survival limit."

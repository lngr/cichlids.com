  problems:
    text: "A fish that stays hidden, loses condition or repeatedly misses meals may be displaced even when the tank\
      \ seems peaceful. Check access to retreats and food, alongside water quality and the actual temperature. Permanent\
      \ warmth, sudden chemistry changes and accumulated organic waste can undermine otherwise suitable care. Respond\
      \ to damaged fins or unusual breathing by assessing conditions and seeking experienced diagnosis. The natural\
      \ hardness estimate and provisional KH tolerance should not be treated as precise health boundaries. Legacy\
      \ forum experience includes both successful maintenance and losses and supplies no controlled tolerance experiment."

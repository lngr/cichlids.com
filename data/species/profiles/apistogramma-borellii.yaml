  compatibility:
    text: "Select calm companions that use other parts of the aquarium and tolerate the chosen seasonal regime.\
      \ Small pencilfish are supported as dithers; adult small tetras are also practical candidates in a larger\
      \ community. Give schooling companions their own space and check that the dwarf cichlids obtain food. Competing\
      \ bottom territories can make another Apistogramma a poor addition to a small pair tank. Large or forceful\
      \ cichlids can injure, intimidate or consume these fish. Fry are vulnerable in a community even with maternal\
      \ defence. No named interspecific crossing group was established; that evidence gap does not prove that every\
      \ mixed pairing is safe."

  breeding:
    text: "Eggs are fixed within a sheltered cavity and the female tends eggs and young. FishBase reports approximately\
      \ 50 to 70 eggs, while other accounts give different brood sizes. The male may remain in the wider area but\
      \ become unwelcome close to the brood. A separation option helps when guarding behavior changes. Newly feeding\
      \ fry require appropriately small food. Reports of reproduction in moderately hard and mildly alkaline water\
      \ show that extreme acidity is not automatically necessary, although stock origin and fry survival matter.\
      \ Brood cannibalism is reported or suspected in some specialist discussions, so surviving young should never\
      \ be assumed from the adults' mild community reputation."

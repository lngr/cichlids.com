  sexing:
    text: "Adult males usually exceed females in size and have more extended fins. Male blue and yellow areas vary\
      \ between natural forms and selected lines, and some fish carry red facial markings. Females become strongly\
      \ yellow with dark contrast during brood care. Juvenile or stressed fish may not show these differences clearly,\
      \ so compare size and fin development after they settle. Blue and yellow forms can occur together in nature.\
      \ Modern selected Opal stocks and older locality labels are not automatically identical."

  diet:
    text: "Small animal prey form the main food base: the species accounts identify worms, crustaceans and insects.\
      \ Offer suitably sized Daphnia, Artemia or small larvae, together with a sinking prepared food the fish accept.\
      \ Its deliberate feeding can leave it short of food beside fast competitors, so watch individuals eat and\
      \ deliver some food near their sheltered areas. Keep portions modest enough to avoid trapped waste. The conservative\
      \ predation score allows for fry consumption; it does not describe a fish-based diet or demonstrate a 2 cm\
      \ prey-size limit. The false bloat flag does not imply immunity to digestive problems."

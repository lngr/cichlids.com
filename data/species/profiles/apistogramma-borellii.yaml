  ph:
    value:
      min: 5
      max: 8
    confidence: medium
    rationale: "The qualified majority selects the 5 to 8 envelope that Seriously Fish explicitly attributes to\
      \ wild collection habitats. Staeck's 5.5 to 7.6, Corrientes readings of 5.9 to 6.2 and Luling's on-site 7.0\
      \ to 7.1 are narrower geographical samples. Paul's regional 5.8 to 6.8 observations also fit. Checker-a's\
      \ macrophyte study evidence spans 4.68 to 7.37, extending below the decided minimum; it describes assemblage\
      \ sampling stations rather than a matched species-by-reading series. Paul's pH 8.5 station did not list borellii\
      \ in its catch and therefore does not extend the species interval. Oliveira's regional mean pH values of 5.4\
      \ to 7.8 are context rather than individual capture measurements. All these records are retained; the limits\
      \ in the compiled species account have incompletely documented localities, so confidence remains medium."

  habitat:
    text: "The species occurs in the Paraguay and Parana drainage systems, with voucher-backed records extending\
      \ into Uruguay-basin wetlands. Vegetated shallow margins provide shelter and feeding space. Staeck reports\
      \ seasonal Rio Cuiaba collecting-site water at 21 to 30 C, pH 5.5 to 7.6 and approximately 1 dGH and 1 dKH.\
      \ Seriously Fish compiles wild pH values of 5 to 8. Luling recorded pH 7.0 to 7.1, GH 1.3 to 1.4 and KH 1\
      \ at Laguna en Itati; later sample analysis gave pH 6.8, KH 0.8 and a conflicting GH of 4. Regional Pantanal\
      \ calcium and magnesium means from Oliveira et al. support approximately 0.54 to 5.84 dGH between Sepotuba\
      \ and Miranda. The natural GH range is 0.5 to 6 dGH as a rounded regional estimate for river-floodplain waters,\
      \ with low confidence because chemistry stations lack simultaneous species records. The Chacorore-Sinha Mariana macrophyte\
      \ study reports a wider station envelope of 26 to 33.7 C and pH 4.68 to 7.37; these are assemblage habitat\
      \ measurements, not proof that all fish experienced each extreme. A specialist forum also mentions occasional\
      \ collections near 10 C without a traceable station series. Such hot shallow-water observations and cold extremes\
      \ do not set routine aquarium targets."
    sources:
      - kind: literature
        title: "Lanes, Maltchik and de Lucena (2010). Apistogramma borellii: first record for Rio Grande do Sul,\
          \ southern Brazil."
        url: "https://doi.org/10.15560/6.2.222"

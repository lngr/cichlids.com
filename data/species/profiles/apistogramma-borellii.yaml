      rationale: "Tally method conservative. The conservative tally selects level 1 after an even split: generator,\
        \ checker-c and tiebreaker-1 proposed 1; checker-a, checker-b and tiebreaker-2 proposed 0. FishBase and\
        \ Seriously Fish describe invertebrate feeding, supporting the lower interpretation. Acquariodolce and specialist\
        \ breeding discussions report or discuss adult consumption of fry, while colony accounts show surviving\
        \ broods. The higher level represents a cautious possibility of opportunistic fry consumption, not routine\
        \ piscivory. Guidarium's fry-predator label has no documented prey-size observation, and a suspected loss\
        \ is weaker than a confirmed feeding event. No source establishes hunting of unrelated fish throughout the\
        \ rubric's full 2 cm category, so the conservative decision retains low confidence."

  diet:
    text: "Offer a balanced prepared cichlid food with varied aquatic invertebrates such as Artemia, other small\
      \ crustaceans and insect larvae. Vegetable-containing prepared food can contribute to the mixed diet described\
      \ in care accounts. Both adults should receive appropriate portions without excess food accumulating. The\
      \ decided diet is omnivorous, with no documented special protein-related bloat sensitivity. That flag does\
      \ not exclude ordinary digestive problems. The level 2 predation decision means small fish that fit the adult\
      \ mouth are at risk even when prepared foods are accepted readily."

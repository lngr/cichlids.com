  problems:
    text: "Social stress is a major practical problem: repeated hiding, missed meals or a fish trapped at the surface\
      \ can precede obvious injury. Secure covers and available separation reduce the consequences of sudden pursuit.\
      \ Very weakly buffered water also needs consistent maintenance and careful monitoring rather than repeated\
      \ chemical corrections. Quarantine arrivals and investigate persistent rubbing, unusual breathing or loss\
      \ of condition. A Peruvian parasite study is retained as evidence from fish identified under this name, but\
      \ that population identity cannot be assumed to match the Negro and Orinoco fish. Reported tolerance endpoints\
      \ are provisional and should not be treated as universally safe targets."

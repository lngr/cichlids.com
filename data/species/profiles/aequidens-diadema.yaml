  husbandry:
    text: "For one established adult pair, use at least 400 litres with a footprint around 160 cm long and 50 cm\
      \ deep. Build several refuges with clear escape routes and interrupt sightlines using stable wood and stones\
      \ over sand. Plants can be included but are not essential habitat equipment. Use a secure cover because pursuit\
      \ can cause a fish to jump. Maintain effective filtration and regular water changes, and check that both adults\
      \ can feed. The recorded aquarium tolerance envelopes are 23 to 30 C, pH 4.2 to 7.5, 0 to 13 dGH and 0 to\
      \ 6 dKH; their outer limits are incompletely tested. Stable soft water at a mildly acidic to neutral pH is\
      \ a practical starting point, rather than deliberate adjustment to a regional extreme."

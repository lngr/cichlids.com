  maxSizeCm:
    value:
      male: 19
      female: 15
    confidence: "low"
    rationale: "Proposals were generator male 18 and female 15 cm, checker-a 15 and 12, checker-b 20 and 15, and\
      \ checker-c 20 and 16. The sex-specific medians are 19 cm and 15 cm, and both are retained as provisional\
      \ typical aquarium maxima. The Nordic association gives an unsexed 20 cm size and explicitly distinguishes\
      \ larger Negro and Orinoco fish from smaller Peruvian trade fish. Atlarium lists 18 cm and Steenfott about\
      \ 13 to 18; Aqualog lists 15 to 20. FishBase 11.8 cm is male or unsexed standard length, excluding the caudal\
      \ fin, and is not a sex-specific aquarium total length. Practical Fishkeeping about 10 cm, Aqua-Fish 10 to\
      \ 12, Aquarismo Paulista 12 and MARE 4 to 8 may concern different sizes or identifications. Gettler reports\
      \ unusually large provisional female and male adults around 23 and 25 cm, and forum estimates extend to about\
      \ 25 cm; these remain evidence rather than being treated as typical maxima. Female 15 cm is an inference,\
      \ since none of the stronger accounts supplies a verified sex-specific adult series."

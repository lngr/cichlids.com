  compatibility:
    text: "Suitable companions must share aquarium conditions and be large and robust enough to resist displacement\
      \ without becoming threatening themselves. The Nordic association and Aquarismo Paulista allow such community\
      \ combinations. Large deep-bodied characins, some comparable South American cichlids and suitably sized loricariids\
      \ are conditional groups, not guaranteed pairings. Add space beyond the pair minimum and monitor access to\
      \ cover and food. Tiny fish, timid species and strongly aggressive large cichlids are poor candidates. An\
      \ archive warning specifically discourages angelfish combinations. No supported hybrid group was found, which\
      \ does not prove reproductive isolation from other acaras."

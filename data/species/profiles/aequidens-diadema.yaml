  beginnerSuitability:
    value: "moderate"
    confidence: "medium"
    rationale: "Generator, checker-a and checker-b propose moderate; checker-c proposes easy. CRC rates the fish\
      \ for beginners and the Nordic association calls it easy, supporting manageable basic aquarium care in a suitable\
      \ setup. Moderate is selected because pairing territorial adults requires recognition of dangerous chasing\
      \ and access to separation, as shown directly in Gettler and Aquarismo Paulista accounts. The grade does not\
      \ require aquarists to reproduce extreme regional blackwater pH readings. The difficulty difference is a practical\
      \ assessment of the complete adult-pair task rather than a feeding or physiological experiment."

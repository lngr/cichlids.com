  sizeAndGrowth:
    text: "The provisional typical aquarium maximum is about 19 cm for a male and 15 cm for a female. The male estimate\
      \ sits near the Nordic association 20 cm figure; the female figure is inferred because reliable sex-specific\
      \ measurements are sparse. FishBase lists 11.8 cm standard length, which excludes the tail fin. A breeder\
      \ reported much larger adults of about 23 and 25 cm, while several trade accounts describe smaller fish. Buy\
      \ space for adult territorial behavior and recognize that individual growth or uncertain stock identity may\
      \ require more room."
    sources:

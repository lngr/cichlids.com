    confidence: "high"
    rationale: "The valid-name catalog accepts Amazon and Orinoco records, including Peru and uncertain Ecuador.\
      \ FishBase restricts its distribution summary to the upper Negro and Colombian and Venezuelan Orinoco tributaries\
      \ and specifically questions the older Peruvian material. CRC supports Brazil, Colombia and Venezuela. The\
      \ four proposals describe this same core region but list different localities; the final list combines the\
      \ supported Negro, Autana, Meta and Cusiana records. Peruvian trade accounts remain cited without defining\
      \ the core range. Vaupes survey vouchers support a Negro-basin occurrence but do not match every chemistry\
      \ station to this fish. AquaInfo species-sheet retrievals exposed ecosystem-map context only, so they provide\
      \ no readable husbandry measurements."

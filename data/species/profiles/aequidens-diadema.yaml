partners:
  suitable:
  - species: "Large deep-bodied characins"
    reason: "Adult companions above the estimated mouth-size risk can share compatible soft-water conditions."
    condition: "Use a spacious community tank beyond the pair minimum. Body depth and actual size matter; separate\
      \ fish displaced by brood defence."
  - species: "Moderate South American cichlids of comparable adult size"
    reason: "Nordic and Aquarismo Paulista accounts allow robust companions of similar size, provided each can occupy\
      \ a separate area."
    condition: "Provide more space than the pair minimum and separate incompatible fish during reproduction."
  - species: "Adult loricariid catfish of suitable size"
    reason: "Larger armored catfish are conditional candidates in the cited husbandry advice."
    condition: "Provide separate refuges and access to food. Avoid juveniles small enough to be swallowed and monitor\
      \ breeding-territory conflicts."
  unsuitable:
  - species: "Paracheirodon simulans"
    reason: "Its small adult size places it within the ingestion risk of an adult acara at predation level 2."
  - species: "Very timid fish and small dwarf cichlids"
    reason: "They may be swallowed, displaced or prevented from feeding by a territorial adult pair."
  - species: "Very aggressive large Central American cichlids"
    reason: "The husbandry accounts caution against powerful aggressive companions that can injure or suppress this\
      \ acara."
  - species: "Hard alkaline-water cichlids"
    reason: "Their strongly buffered aquarium requirements and territorial behaviour can conflict with a soft-water\
      \ acara setup."
profile:
  overview:
    text: "Aequidens diadema is an acara from the Negro and Orinoco drainages with iridescent head markings and\
      \ changeable dark body patterns. One compatible adult pair can be the focus of a spacious aquarium. Its accepted\
      \ scientific name is unchanged from the legacy catalog. Older reports sometimes concern smaller Peruvian fish\
      \ whose identification is disputed, so locality and breeding history help interpret a purchase. This profile\
      \ uses the larger Negro and Orinoco fish as its main reference and keeps uncertain size and chemistry reports\
      \ visible."
    sources:
    - kind: "catalog-of-fishes"
      title: "Eschmeyer's Catalog of Fishes: Aequidens"

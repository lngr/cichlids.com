  minTank:
    value:
      volumeL: 400
      lengthCm: 160
      depthCm: 50
    confidence: "medium"
    rationale: "Proposals were generator 300 L, 150 cm long and 50 cm deep; checker-a 200 L, 100 cm and 45 cm; checker-b\
      \ 400 L, 160 cm and 50 cm; checker-c 400 L, 160 cm and 50 cm. The coordinate-wise medians are 350 L, 155 cm\
      \ and 50 cm. The final 400 L and 160 cm follow the explicit Nordic recommendation for the larger Negro and\
      \ Orinoco fish, rather than inventing a threshold between recommendations; 50 cm depth is a layout inference\
      \ for an adult pair with sight barriers. The volume and length remain within published source values. Smaller\
      \ advice is retained: Practical Fishkeeping 90 cm for Peruvian imports, Aquarismo Paulista 96 L at 80 by 30\
      \ cm, Cichlid Atlas about 114 L for a pair, Atlarium 180 L for a minimum unit of one, Steenfott about 284\
      \ L and Gettler about 285 L. Aqualog gives 100 to 200 cm. Trade identity and adult social context limit comparisons,\
      \ and Gettler experienced serious pairing hazards despite using about 285 L. The decided tank is for one compatible\
      \ adult pair; extra territorial fish require additional space."

  temperatureC:
    value:
      min: 24
      max: 28
    confidence: "medium"
    rationale: "The tally selects 24 to 28 C by qualified majority, with five of six proposals agreeing within the\
      \ temperature threshold. Proposals were generator 26 to 28, checker-a 24 to 28, checker-b 24 to 28, checker-c\
      \ 24 to 27, tiebreaker-1 26 to 30 and tiebreaker-2 25 to 28 C. The selected bounds are the rounded medians\
      \ of the agreeing proposals. Autana measurements of 24 to 27 C and upper Orinoco, Casiquiare and Negro measurements\
      \ of 26 to 28 C support this typical regional envelope. The wider 26 to 30 C proposal uses a Vaupes survey\
      \ with site means of 28.15 to 29.65 C and verified diadema vouchers, but the paper does not associate this\
      \ species with each temperature station. These warmer native observations remain evidence rather than being\
      \ labelled an exceptional habitat. JBL lower and middle Negro readings of 28.9 to 30.3 C have a geographic\
      \ limitation. La Arenosa has a reported mean of 25 C with the species present, while El Ninal measured 26.3\
      \ C and Atures 27.3 C regionally. FishBase 23 to 28 C derives from aquarium literature. The decided range\
      \ is a typical habitat estimate rather than an annual species-wide thermal limit."

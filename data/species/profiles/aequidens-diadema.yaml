    tolerance:
      value:
        min: 4.2
        max: 7.5
      confidence: "low"
      rationale: "The tally selects pH 4.2 to 7.5 by qualified majority. Proposals were generator 3.2 to 7.5, checker-a\
        \ 4.4 to 7.5, checker-b 4.1 to 7.5, checker-c 4.1 to 7.5, tiebreaker-1 4.2 to 7.5 and tiebreaker-2 3.5 to\
        \ 7.5. The four agreeing lower endpoints yield the rounded median 4.2. Nordic advice is 4.9 to 7.5, Zoopet\
        \ 6.5 to 7.5, Atlarium 6.0 to 7.5, Aqua-Fish 6.6 to 7.5, Aqualog 5.0 to 7.0, Steenfott 5.5 to 7.2 and Cichlid\
        \ Atlas 5.5 to 6.8. Aquarismo Paulista gives 6 to 7, and a forum pair was kept at 5.5 to 6.5. Gettler documents\
        \ multiyear keeping and reproduction at pH 7, supporting neutral aquarium water over the stronger caution\
        \ in Cichlid Atlas. The wider 3.2 and 3.5 lower proposals extend from regional field extremes rather than\
        \ proven aquarium health. The selected lower endpoint is itself an inference to contain the decided natural\
        \ range, not a multiyear tolerance trial. Natural dissolved organic matter and fish identity can affect\
        \ the interpretation of very acidic-water observations. Low confidence reflects these limitations; the range\
        \ is not a target for chemical adjustment."

  aggressionConspecific:
    value: 3
    confidence: "medium"
    rationale: "Proposals were generator 4, checker-a 3, checker-b 3 and checker-c 2. Level 3 is selected for persistent\
      \ pair or rival chasing when compatibility, cover or space is unsuitable. The Nordic association describes\
      \ comparatively calm territorial fish in spacious tanks, supporting the lower assessment; Aquarismo Paulista\
      \ specifically reports increased male-female conflict in small aquaria. Gettler documents bullying deaths\
      \ in small selection groups and a fatal escape during adult reintroduction after a long separation, supporting\
      \ a real severe-aggression risk. Those events do not establish routine lethal aggression in an already compatible\
      \ pair occupying the recommended tank, which is the rubric social unit. They justify separation readiness\
      \ and prevent adopting a uniformly peaceful label, while level 4 would overextend the circumstances of that\
      \ account."

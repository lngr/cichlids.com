  breeding:
    text: "Eggs are laid on a surface before the parents take hatched larvae into their mouths. Both parents can\
      \ take turns with this later care, so the profile classifies the reproductive strategy as biparental mouthbrooding.\
      \ Providing an egg-laying surface addresses only the first stage. Successful spawning has been reported in\
      \ soft water at pH 7. The breeder account used artificial egg rearing, so it does not independently demonstrate\
      \ the normal parental sequence. Brood defence can make community keeping impractical, and the parents may\
      \ themselves require separation if their relationship deteriorates."

  ph:
    value:
      min: 4.2
      max: 6.4
    confidence: "medium"
    rationale: "The tally selects pH 4.2 to 6.4 by qualified majority, with four of six votes agreeing within 0.3\
      \ pH units. Proposals were generator 3.2 to 6.8, checker-a 4.4 to 6.3, checker-b 4.1 to 6.3, checker-c 4.1\
      \ to 6.6, tiebreaker-1 4.2 to 6.4 and tiebreaker-2 3.5 to 6.4. The rounded medians of the agreeing bounds\
      \ give the decision. FAO compiles upper Negro pH 4.2 to 4.3, Negro below the Casiquiare junction 4.7 to 5.4\
      \ and Casiquiare 4.6 to 6.4. Wider field evidence remains visible: Autana 4.1 to 5.4, nearby Cataniapo 5.4\
      \ to 6.6, upper Orinoco 4.8 to 6.8, and Laraque regional stations 3.20 to 5.87. Laraque gives San Carlos 3.20\
      \ in its table but 3.9 in its narrative; San Gabriel 3.48 is a separate unambiguous low reading. These regional\
      \ extremes do not establish typical species occupancy at each endpoint and are not aquarium targets. Other\
      \ sources give Negro tributaries 3.96 to 6.3 and general Negro blackwater 3 to 5.5. La Arenosa reports 5.51\
      \ to 6.01 with the species present. Prosperitate fish were only tentatively identified, while El Ninal and\
      \ Atures are regional proxies. FishBase supplies a lower datum of 7 with an unknown upper endpoint from aquarium\
      \ literature, and Cichlid Atlas gives a secondary habitat estimate of 4.9 to 7.0; neither replaces field chemistry.\
      \ No exceptional mineral-rich habitat requires a plausibility replacement."

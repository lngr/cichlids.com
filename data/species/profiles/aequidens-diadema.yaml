      \ after interpreting mouth care as transport alone. The final category is delayed biparental mouthbrooding:\
      \ eggs are deposited on a surface and both parents subsequently carry the larvae. CRC explicitly identifies\
      \ biparental delayed mouthbrooding, Nordic descriptions report alternating mouth care, and FishBase gives\
      \ the same post-hatching sequence. These specific descriptions outweigh accounts mentioning only the initial\
      \ egg-laying phase. Gettler removed the eggs for artificial rearing, so that report demonstrates successful\
      \ spawning but does not independently establish normal parental mouthbrooding."

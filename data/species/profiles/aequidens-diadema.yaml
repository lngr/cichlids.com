  habitat:
    text: "The best-supported core range covers the upper Rio Negro drainage and Colombian and Venezuelan Orinoco\
      \ tributaries, including Autana and Meta-system records. The fish uses river habitats with sandy or leaf-covered\
      \ bottoms, submerged roots and branches, and scattered stones. The decided typical water estimates are 24\
      \ to 28 C, pH 4.2 to 6.4, 0 to 1 dGH and 0 to 1 dKH. Most chemistry evidence is regional rather than measured\
      \ beside an identified specimen across seasons. Native-region studies also report pH 3.48 at San Gabriel and\
      \ a disputed San Carlos value of 3.20 in a table versus 3.9 in the narrative. Vaupes survey-site temperature\
      \ means reach 29.65 C without matching this fish to each measurement. These observations describe geographic\
      \ variation outside the selected typical range and are not routine aquarium targets."
    sources:
    - kind: "literature"
      title: "Laraque et al. (2019): Water and Sediment Budget of Casiquiare Channel Linking Orinoco and Amazon\
        \ Catchments; Table 1"
      url: "https://doi.org/10.3390/w11102068"

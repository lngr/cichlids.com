  khDkh:
    value:
      min: 0
      max: 1
    confidence: "low"
    rationale: "The tally selects 0 to 1 dKH with low confidence. Generator, checker-a and checker-c proposed 0\
      \ to 1, while checker-b proposed 0 to 2 dKH; these count as unanimous under the two-degree range comparison.\
      \ El Ninal temporary hardness was below 1 dH. Regional Negro alkalinity of 7.7 to 12.4 mg/L as CaCO3 corresponds\
      \ to about 0.43 to 0.69 dKH equivalents, although organic acid buffering need not represent carbonate alone.\
      \ JBL reports the wider Atabapo-area value of 2 dKH and an operational zero elsewhere in Negro blackwater.\
      \ The 2 dKH measurements are retained outside the decided range and their correspondence with extremely low-ion\
      \ water is uncertain. Earlier conductivity-derived estimates remain visible but do not directly measure KH.\
      \ A species-matched alkalinity series is missing. This natural fact deliberately has no verification object."

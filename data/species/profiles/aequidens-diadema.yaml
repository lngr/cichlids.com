  socialBehavior:
    text: "Adults form pairs and defend a substantial territory, with stronger defence around a brood. A compatible\
      \ pair may coexist calmly for long periods, but pairing and reintroduction can cause persistent chasing. A\
      \ breeder lost fish through bullying and a jumping injury during such attempts. Watch whether both fish can\
      \ rest, feed and leave cover; cornering or continued pursuit calls for separation. A juvenile selection group\
      \ is temporary, and spare adults need alternative housing once a pair forms. Plan a divider or another aquarium\
      \ before attempting introductions."

  ghDgh:
    value:
      min: 0
      max: 1
    confidence: "low"
    rationale: "All four proposals were 0 to 1 dGH, and the tally retains that range with low confidence. FAO field\
      \ hardness corresponds to about 0.055 to 0.067 dGH in the Negro, 0.034 to 0.265 in the Casiquiare and 0.022\
      \ to 0.528 in the upper Orinoco. The regional review calcium and magnesium values yield about 0.042 to 0.048\
      \ dGH. El Ninal total hardness was below 1 dGH; JBL recorded operational zero at two Atabapo-area sites. The\
      \ interval rounds outward to cover measurement resolution and unsampled native sites. Zero means extremely\
      \ little measurable hardness rather than literally no calcium or magnesium. Conductivity-based evidence entries\
      \ are retained as earlier estimates, but conductivity cannot independently determine GH. FishBase supplies\
      \ an incomplete 15 dH datum without a second endpoint or field provenance, which does not define natural hardness.\
      \ These are regional proxies rather than a complete collection-site series."

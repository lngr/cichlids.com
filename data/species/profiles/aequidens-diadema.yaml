    tolerance:
      value:
        min: 23
        max: 30
      confidence: "medium"
      rationale: "The unanimous tally gives 23 to 30 C after endpoint medians are rounded to integers. Generator\
        \ and checker-a proposed 23 to 29 C; checker-b and checker-c proposed 22 to 30 C. Agreement here uses the\
        \ one-degree comparison threshold rather than identical endpoints. The Nordic association recommends the\
        \ wider 22 to 30 C interval, while Aqua-Fish gives 22 to 28, Practical Fishkeeping and FishBase 23 to 28,\
        \ Aqualog 24 to 29, Atlarium 24 to 28, Steenfott about 24.4 to 28.9 and MARE 20 to 26 C. The tally therefore\
        \ leaves out the Nordic lower endpoint and the isolated cooler MARE advice. Gettler maintained and bred\
        \ adults around 26.7 to 27.8 C. The selected envelope contains the decided natural range, but sustained\
        \ health at each endpoint has not been tested."

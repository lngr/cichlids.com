  note: "The Catalog of Fishes retains Aequidens diadema (Heckel, 1840), originally Acara diadema. Its distribution\
    \ includes Amazon and Orinoco records, with uncertain Ecuador. FishBase questions older Peruvian material, and\
    \ the Nordic association distinguishes smaller Peruvian trade fish from Negro and Orinoco fish. These identification\
    \ differences remain unresolved for some husbandry reports. The separate Acara genus query returns no records;\
    \ the original combination is recorded in the Aequidens catalog entry."

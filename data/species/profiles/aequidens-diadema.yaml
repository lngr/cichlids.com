      rationale: "The unanimous tally retains 0 to 6 dKH after rounding the median upper proposal and accepting\
        \ differences within 2 dKH. Proposals were generator 0 to 6, checker-a 0 to 8, checker-b 0 to 4 and checker-c\
        \ 0 to 5 dKH. Atlarium explicitly lists 1 to 6 dKH; the natural low-buffering interval extends its lower\
        \ endpoint to zero. The wider 0 to 8 proposal and the narrower 0 to 4 and 0 to 5 proposals were inferences\
        \ from pH, GH and general acara keeping rather than direct measurements of long-term KH tolerance. The decided\
        \ upper limit therefore rests on one low-trust care sheet plus inference. No source establishes years of\
        \ healthy keeping at every endpoint, so confidence stays low."

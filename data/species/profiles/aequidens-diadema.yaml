  sexing:
    text: "Males tend to be larger and develop longer fin extensions; an older male may also show a more pronounced\
      \ forehead. These features are clues rather than a dependable rule for every juvenile or subordinate fish.\
      \ Female maximum size is especially uncertain. Identification difficulties between traded acaras add another\
      \ complication, so documented locality and a breeder account of a known pair are useful. Raising juveniles\
      \ to allow partner selection still requires enough space and accommodation for surplus fish."

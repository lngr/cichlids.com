  husbandry:
    text: "Provide a compatible group of at least six adults with a practical minimum of 600 litres, 180 cm length\
      \ and 60 cm front-to-back space. Those dimensions are an adjudicated planning allowance; published recommendations\
      \ vary, and additional large fish need more room. Arrange submerged wood and sheltered areas around an unobstructed\
      \ swimming space, with a fine substrate. Decorative plants may be eaten. Mature filtration and regular partial\
      \ water changes are central to sustained health. Routine temperatures near 28 to 30 C, soft water and a stable\
      \ mildly acidic to near-neutral pH are better supported than the outer tolerance endpoints. The selected tolerances\
      \ are 26 to 32 C, pH 4.4 to 7.5, GH 0 to 5 dGH and KH 0 to 5 dKH, with low confidence in each complete interval.\
      \ Different endpoint combinations need not be chemically achievable together."
    sources:

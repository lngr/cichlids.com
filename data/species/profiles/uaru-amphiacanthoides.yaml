    rationale: "The tally fixes 26 to 31 C by qualified-majority agreement of five of six votes. JBL measured 26.3\
      \ to 30.3 C in the Negro-Solimoes region; Lapointe and colleagues used 31 C as a regional average maximum.\
      \ The decided integer range summarizes habitat proxies, not continuous tracking of Uaru. Wider regional records\
      \ are retained as context: Catalao seasonal means extend to 31.7 C, its diel study reaches 32 C, and Mamiraua\
      \ surface measurements span 26.5 to 34.7 C with the highest value during the exceptional 2010 drought. None\
      \ demonstrates sustained Uaru occupation at those extremes. FishBase temperature recommendations derive from\
      \ husbandry and do not establish natural limits."

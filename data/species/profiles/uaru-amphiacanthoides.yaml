  habitat:
    text: "The range includes the Amazon-Solimoes mainstem between the Japura and Tapajos and the middle and lower\
      \ Rio Negro; a modern survey also records it in the Uatuma basin. Submerged wood, shaded margins and neighboring\
      \ swimming space provide a useful habitat model. Regional field studies support warm water with little calcium\
      \ and magnesium, especially in the Negro. The adopted natural ranges are 26 to 31 C, pH 4.4 to 7.1, GH 0 to\
      \ 2 dGH and KH 0 to 2 dKH. Regional samples also extend beyond these bounds, as disclosed in the feature rationales.\
      \ Identified Uaru were not sampled beside every chemistry measurement, so these are habitat summaries with\
      \ incomplete locality coverage."

  compatibility:
    text: "Peaceful adult angelfish, severums and suitable eartheaters can work when their individual water needs\
      \ overlap and the aquarium accommodates every social unit. Avoid fish that persistently intimidate Uaru. Tiny\
      \ fish and fry remain vulnerable to occasional ingestion, despite some sources reporting safe tetra companions.\
      \ Feeding competition also matters: the Staeck and Becker account warns that Uaru can deprive slower discus\
      \ of food. U. fernandezyepezi is a separate species with more specialized blackwater care. No supported Uaru\
      \ hybrid group was assigned; that research result does not prove that crossing is impossible."

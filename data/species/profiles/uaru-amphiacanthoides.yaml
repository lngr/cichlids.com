  problems:
    text: "An inadequate adult tank, isolation, repeated exclusion at feeding, plant-poor nutrition and declining\
      \ water quality can all undermine this species. Monitor whether each fish eats and maintains body condition,\
      \ particularly after a pair begins breeding. Warm water calls for dependable oxygenation and filtration, while\
      \ leftover vegetables add to the waste load. New fish benefit from quarantine. Persistent appetite loss, abnormal\
      \ breathing, swelling or tissue damage warrants a water-quality review and qualified fish-health assessment;\
      \ symptoms alone do not identify one cause."
    sources:

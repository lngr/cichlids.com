  diet:
    text: "Use a nutritionally complete food with a substantial plant component and offer suitable vegetables for\
      \ browsing. Aquatic invertebrates can provide variety. Wild food records include plants and animal foods,\
      \ including freshwater sponges, supporting plant-heavy omnivory. The fixed food list describes both natural\
      \ foods and aquarium foods; it is not an instruction to obtain wild sponges. Established adults may feed eagerly\
      \ and compete strongly with slower fish. The bloat-sensitive conflict flag is false because the specific tendency\
      \ remains unestablished; it does not establish immunity or justify an animal-food-only menu. Remove uneaten\
      \ fresh foods before they spoil."

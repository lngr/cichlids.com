  note: "The Catalog of Fishes recognizes Uaru amphiacanthoides Heckel, 1840 as valid and the three listed historical\
    \ names as synonyms. Uaru fernandezyepezi Stawikowski, 1989 is separately valid in the Orinoco basin, including\
    \ the Rio Atabapo; it is not a variant or synonym of this Amazonian species. The older Stigliano husbandry article\
    \ uses imperialis as a species name, but that taxonomy is superseded by the Catalog."

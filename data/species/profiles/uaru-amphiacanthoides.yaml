  sexing:
    text: "Both sexes have broadly similar appearance, and color or fin shape is an uncertain basis for choosing\
      \ a pair. Average size differences overlap too much to identify individual fish reliably. Near spawning, the\
      \ female egg-laying tube is broader than the male papilla, and observing egg deposition is more useful than\
      \ judging a photograph. Growing a social group together allows compatible pairs to form."

  breeding:
    text: "A pair deposits adhesive eggs on a firm surface such as stone or wood and both adults care for the brood.\
      \ A shaded site may be chosen, but an enclosed cave is not obligatory. Larvae may be moved to nearby substrate\
      \ pits. Free-swimming young can graze the parents' skin mucus and subsequently accept fine fry foods. Mucus\
      \ feeding is distinct from mouthbrooding. Provide room for brood defense and observe whether the other adults\
      \ can withdraw. Wild fish may need softer and more acidic spawning conditions than established captive stock."
    sources:

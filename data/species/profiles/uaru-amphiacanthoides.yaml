  ghDgh:
    value:
      min: 0
      max: 2
    confidence: low
    rationale: The tally fixes 0 to 2 dGH with unanimous range agreement and low confidence. Actual calcium and
      magnesium support very soft native water; conversion uses dGH = Ca in mg/L divided by 7.14 plus Mg in mg/L
      divided by 4.34. Zero represents hardness below common aquarium-test resolution. The decided ceiling is narrower
      than the Solimoes paired-sample conversions of about 1.45 to 2.30 dGH in Queiroz and colleagues and the later
      collected-water mean of about 2.48 dGH in the Tambaqui study. These wider regional results are disclosed without
      changing the tally. Conductivity is not converted into hardness. FishBase 5 to 12 dH is husbandry context
      rather than a field-hardness series.

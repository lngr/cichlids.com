partners:
  suitable:
  - species: Pterophyllum scalare
    reason: Husbandry sources name angelfish as peaceful companions sharing warm soft-water conditions.
    condition: Use adults with compatible behavior and extra room beyond the Uaru group minimum.
  - species: Heros efasciatus
    reason: Severums are among the calm South American cichlids suggested as companions.
    condition: Match individual water requirements and provide separate retreats for breeding pairs in a larger
      tank.
  - species: Satanoperca jurupari
    reason: The suggested eartheater genus can complement a calm Uaru group when water conditions overlap.
    condition: Provide its own social unit and sand-foraging area in a substantially larger aquarium.
  unsuitable:
  - species: Aggressive large cichlids
    reason: Persistent intimidation prevents the Uaru group from resting and feeding normally.
  - species: Fish at or below 2 cm adult length
    reason: Level 1 predation assigns an opportunistic risk to fry and tiny fish; 2 cm is the rubric threshold.
  - species: Symphysodon spp.
    reason: "Staeck and Becker warn that enthusiastic Uaru feeding can deprive slower discus of food, so shared\
      \ water requirements alone do not establish a suitable pairing."
profile:
  overview:
    text: "Uaru amphiacanthoides is a social Amazonian cichlid whose adult flank wedge contrasts with the mottled\
      \ pattern of young fish. A compatible adult group can share a spacious aquarium with peaceful companions.\
      \ Its size, appetite for vegetation and water-quality needs make it demanding to maintain. The panda uaru,\
      \ U. fernandezyepezi, is a separately recognized Orinoco species. The two names should remain distinct when\
      \ identifying fish or recording breeding stock."
    sources:
    - accessed: '2026-10-13'

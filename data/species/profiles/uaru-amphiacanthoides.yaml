  sizeAndGrowth:
    text: "Typical planning maxima are about 25 cm for males and 24 cm for females, with considerable uncertainty\
      \ in the small sex difference. Some accounts list an unsexed 30 cm ceiling and the archive contains a roughly\
      \ 28 cm aquarium specimen. Scientific standard length excludes the tail and should be distinguished from aquarium\
      \ total-length reports. The chosen values favor usual well-kept adults rather than the largest reported fish.\
      \ Young fish change their markings as they grow. A lifespan around eight to twelve years is a provisional\
      \ estimate with no supporting survival series."

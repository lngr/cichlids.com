      \ checker-a selected grey, silver and black with mixed. Stigliano describes a green-brown adult background,\
      \ and the other accounts support grey tones and dark discrete flank and tail-base marks. Retain green as an\
      \ olive adult tone and use spots for the characteristic wedge-shaped blotch. Juvenile mottling and minor eye\
      \ colors do not define the adult male value."
  - field: features.feedingSpeed
    proposals:
    - by: generator
      value: normal
    - by: checker-a
      value: slow
    - by: checker-b
      value: hasty
    - by: checker-c
      value: hasty
    decision: hasty
    rationale: "The generator proposed normal, checker-a slow and checker-b and checker-c hasty. Staeck and Becker\
      \ explicitly describe eager plant-food consumption in U. amphiacanthoides and warn that Uaru can deprive slower\
      \ discus of food. This species-specific appetite is stronger evidence than analogies with the calm swimming\
      \ of discus. Hasty is a qualitative mapping, not a measured feeding-rate score; newly arrived or selective\
      \ individuals may feed less eagerly."

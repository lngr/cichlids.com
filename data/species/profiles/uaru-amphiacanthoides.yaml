        \ the Bulgarian register 28 to 32. The wider Aquaplante retailer range is 24 to 32 C and GCCA gives approximately\
        \ 23.9 to 29.4 C; neither justifies lowering the decided minimum. Aquarium Glaser supports 26 to 32, but\
        \ those upper-end accounts do not document years of health at 32 C. Routine maintenance around 28 to 30\
        \ C is better supported than either outer edge."

  socialBehavior:
    text: "Adults usually stay calm in a compatible group and may settle disputes with displays or short chases.\
      \ A pair defending eggs or fry can drive other fish away from its immediate breeding area. The expected territory\
      \ is local and breeding-related, but its size has not been measured. Source advice differs on retaining surplus\
      \ adults after a pair forms, so observe the actual group for exclusion and damage. Repeated hiding or failure\
      \ to feed calls for a change in space, shelter or social arrangement."

  ph:
    value:
      min: 4.4
      max: 7.1
    confidence: medium
    rationale: "The tally fixes pH 4.4 to 7.1 and classifies the four votes as unanimous under its range-agreement\
      \ procedure. Regional field studies and the FishBase occurrence at pH 6.8 support acidic Negro and less acidic\
      \ Solimoes habitats. This aggregate is narrower than Leenheer and Santos measurements of 4.2 to 7.2, Kuchler\
      \ and colleagues regional span of 3.89 to 6.99, and the Catalao span of 5.86 to 7.47. Those wider source ranges\
      \ remain evidence rather than being silently replaced. The lower Kuchler extreme was in the Tea tributary;\
      \ identified Uaru were not recorded at every chemistry station. The decided range is a regional summary, not\
      \ a proven species-wide boundary."
    sources:
    - kind: literature
      title: "Araujo, Ghelfi and Val (2017). Triportheus albus Cope, 1872 in the Blackwater, Clearwater, and Whitewater\
        \ of the Amazon: A Case of Phenotypic Plasticity? Table 1."
      url: "https://doi.org/10.3389/fgene.2017.00114"
      accessed: '2026-10-13'
    - kind: literature

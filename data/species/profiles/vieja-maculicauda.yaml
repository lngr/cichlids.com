  diet:
    text: "Use a plant-rich formulated food as the staple, with soft vegetables and modest invertebrate supplements.\
      \ Wild feeding includes vegetation and detritus; USGS also summarizes small molluscs, so plant-biased omnivore\
      \ is the selected category. Predation on small companions does not make fish flesh an appropriate staple.\
      \ Offer measured portions and check that both members of the pair can feed. The profile does not establish\
      \ a special bloat susceptibility, although one weak hobby record gives a contrary warning. That uncertainty\
      \ does not make overfeeding or an excessively protein-heavy ration harmless."

  compatibility:
    text: "A mixed aquarium requires substantially more space than the adult-pair minimum and companions able to\
      \ withstand serious aggression. Beerlink names Parachromis motaguensis, Amphilophus citrinellus and Cincelichthys\
      \ bocourti as conditional candidates; none guarantees a safe community. Small fish risk being swallowed, and\
      \ gentle species can suffer persistent intimidation or injury. Three presumed crossing groups apply: the wider\
      \ Vieja group, the maculicauda and melanurus pair, and the maculicauda and Rocio octofasciata pair. Their\
      \ evidence consists of a congener warning, close-relationship research and unverified captive reports. Neither\
      \ the named reports nor the genus warning demonstrates free-choice crossing of every listed pairing."
    sources:
    - kind: "literature"
      title: "Beerlink, R. Vieja maculicauda. Nederlandse Cichliden Vereniging article published by AquaInfo"

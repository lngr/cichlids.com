  problems:
    text: "The most consequential mistakes are buying juveniles without adult space and assuming that a bonded pair\
      \ cannot harm one another. Crowding, open sightlines and an inadequate retreat can turn chasing into serious\
      \ wounds. Delayed filtration maintenance and excessive feeding add another burden in a tank with large fish.\
      \ Use quarantine for new arrivals and monitor appetite, respiration, body condition and water quality. Persistent\
      \ swelling, unusual feces or skin damage can have several causes; these signs do not identify a disease on\
      \ their own. Seek qualified fish-health advice when problems persist. Avoid sudden attempts to correct pH\
      \ or hardness by adding large doses of chemicals."

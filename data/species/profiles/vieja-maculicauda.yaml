profile:
  overview:
    text: "The blackbelt cichlid is a substantial Central American fish with a dark band across the middle of its\
      \ body and a second dark marking near the tail. Mature animals often develop red on the throat and tail against\
      \ a greenish or grey background. Its accepted name remains Vieja maculicauda. Plan around the adults before\
      \ buying juveniles: strength, territorial behavior and the need for a very large aquarium matter more than\
      \ the ease of feeding. A settled pair can be rewarding to observe, but every setup needs somewhere to move\
      \ an injured or persistently chased fish."
    sources:
    - kind: "catalog-of-fishes"
      title: "Eschmeyer's Catalog of Fishes: species of Vieja, checked 13 October 2026"
      url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Vieja"
      accessed: "2026-10-13"
    - kind: "literature"
      title: "Beerlink, R. Vieja maculicauda. Nederlandse Cichliden Vereniging article published by AquaInfo"
      url: "https://aquainfo.nl/en/article/vieja-maculicauda/"
      accessed: "2026-10-13"
    - kind: "database"
      title: "Seriously Fish: Vieja maculicauda"
      url: "https://www.seriouslyfish.com/species/vieja-maculicauda/"
      accessed: "2026-10-13"
  habitat:
    text: "Freshwater aquarium care is suitable for this fish despite its use of estuaries. Its native range follows\
      \ Caribbean lowlands from southern Belize and Guatemala to Panama, with fish using slow river reaches, lakes\
      \ and sheltered vegetated banks. Fine sediment and submerged timber provide feeding surfaces and refuge. The\
      \ listed natural chemistry is a low-confidence summary of selected measurements, not a complete map of occupied\
      \ conditions. Izabal hardness and alkalinity measurements exceed the tally ranges, and both cooler and warmer\
      \ field temperatures are recorded. Salt is not required merely because some populations live in brackish water."
    sources:
    - kind: "catalog-of-fishes"
      title: "Eschmeyer's Catalog of Fishes: species of Vieja, checked 13 October 2026"
      url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Vieja"
      accessed: "2026-10-13"
    - kind: "literature"
      title: "Choc-M. et al. (2020). Contracaecum multipapillatum in inland water fish from Guanacaste and Izabal.\
        \ Table 4"
      url: "https://doi.org/10.24188/recia.v12.n2.2020.767"
      accessed: "2026-10-13"
    - kind: "literature"
      title: "FAO. The inland waters of Latin America, Central America. Lake Nicaragua field chemistry after FAO/UN\
        \ (1961)"
      url: "https://www.fao.org/4/ad770b/AD770B13.htm"
      accessed: "2026-10-13"
    - kind: "literature"
      title: "Gilbert, C. R. and Kelso, D. P. (1971). Fishes of the Tortuguero area, Caribbean Costa Rica. Bulletin\
        \ of the Florida State Museum 16(1), 1-54."
      url: "https://doi.org/10.58782/flmnh.jttx7804"
      accessed: "2026-10-13"
    - kind: "literature"
      title: "McMahan et al. (2017). Pleistocene to holocene expansion of the black-belt cichlid in Central America"
      url: "https://doi.org/10.1371/journal.pone.0178439"
      accessed: "2026-10-13"
    - kind: "literature"
      title: "Pailles et al. (2020). New fossil genus and new extant species of diatoms from Pleistocene sediments\
        \ in the Neotropics. Table 2, Lake Izabal water chemistry"
      url: "https://doi.org/10.5852/ejt.2020.726.1169"
      accessed: "2026-10-13"

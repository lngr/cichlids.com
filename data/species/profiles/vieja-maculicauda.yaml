        \ confidence and containing the decided natural 25 to 30 C range. Beerlink directly gives 22 to 30 C, B-Aqua\
        \ gives 24 to 30 C, Seriously Fish gives 22 to 27 C and Aqua-Fish 23 to 27 C. Proposals were generator 22\
        \ to 30; checker-a 22 to 30; checker-b 22 to 30; checker-c 21 to 28; tiebreaker-1 22 to 30; tiebreaker-2\
        \ 22 to 31. The decision is narrower than tiebreaker-2's 22 to 31 C extension from Choc-M. field readings\
        \ of 30.2 to 31 C, and narrower than the Nordic register's 16 to 30 C care panel. Neither the 31 C field\
        \ proxy nor the Nordic 16 C endpoint establishes years of species-specific aquarium health. This is a published\
        \ husbandry envelope, not a controlled lifetime trial."

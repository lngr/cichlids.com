      accessed: "2026-10-13"
    - kind: "database"
      title: "Nordiska Ciklidsallskapet: Vieja maculicauda species register"
      url: "https://ciklid.org/artregister/art.php?ID=559"
      accessed: "2026-10-13"
  husbandry:
    text: "For an established adult pair, provide at least 1000 litres with a 250 by 60 cm footprint; the front-to-back\
      \ dimension is a practical estimate. Fit stable wood or rock cover that breaks sightlines and offers separate\
      \ retreats, leaving room for the fish to turn. Fine substrate allows digging, so secure heavy objects. Start\
      \ around 25 to 27 C with stable near-neutral to mildly alkaline water and moderate mineral content. The decided\
      \ tolerances are 22 to 30 C, pH 6 to 8.9, GH 3 to 20 dGH and KH 2 to 8 dKH. Their outer edges have limited\
      \ long-term support, particularly KH and the upper pH extension. Provide effective filtration and surface\
      \ movement, maintain water quality and keep a reliable separation option available."
    sources:
    - kind: "literature"
      title: "Beerlink, R. Vieja maculicauda. Nederlandse Cichliden Vereniging article published by AquaInfo"
      url: "https://aquainfo.nl/en/article/vieja-maculicauda/"
      accessed: "2026-10-13"
    - kind: "database"
      title: "Nordiska Ciklidsallskapet: Vieja maculicauda species register"
      url: "https://ciklid.org/artregister/art.php?ID=559"
      accessed: "2026-10-13"
    - kind: "database"
      title: "Seriously Fish: Vieja maculicauda"
      url: "https://www.seriouslyfish.com/species/vieja-maculicauda/"
      accessed: "2026-10-13"
  socialBehavior:
    text: "An established pair is the recommended adult unit, but pairing does not guarantee lasting safety. A male\
      \ may injure his partner when breeding expectations differ, and spare adults can become persistent targets.\
      \ Raising juveniles together may help reveal a compatible pair; remove unpaired fish before aggression becomes\
      \ established. The source literature also describes breeding colonies and groups in much longer tanks, so\
      \ wild social behavior is broader than the pair recommendation. Watch access to food and hiding places as\
      \ well as visible fights. A fish confined to a corner or continuously excluded from the open tank needs intervention."
    sources:

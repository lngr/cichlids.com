    rationale: "The Catalog and McMahan's 2017 species study place the native range on the Atlantic slope from southern\
      \ Belize and Guatemala to Panama. Generator, checker-b and checker-c use that regional interpretation; checker-a\
      \ includes the Usumacinta wording from FishBase and Seriously Fish. McMahan explicitly excludes the Usumacinta\
      \ River itself, so it is not listed as a native locality. The combined named localities retain corroborated\
      \ examples rather than suggesting the species occupies every drainage. Tortuguero field observations add estuarine\
      \ occurrence. No single waterbody defines this broad range."

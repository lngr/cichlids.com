  sizeAndGrowth:
    text: "Allow for an adult male around 30 cm and a somewhat smaller female, with 25 cm used as the female planning\
      \ estimate. The sex-specific female number is less secure than the general size range. Exceptional aquarium\
      \ males have been reported at about 40 cm, so a fish that exceeds the usual size should trigger a review of\
      \ available space. Juveniles can grow rapidly when well fed, and adult housing should be available from the\
      \ start. FishBase gives standard length, which leaves out the tail and should not be compared directly with\
      \ aquarium total-length estimates."
    sources:
    - kind: "literature"
      title: "Beerlink, R. Vieja maculicauda. Nederlandse Cichliden Vereniging article published by AquaInfo"
      url: "https://aquainfo.nl/en/article/vieja-maculicauda/"
      accessed: "2026-10-13"

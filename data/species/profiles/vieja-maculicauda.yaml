  temperatureC:
    value:
      min: 25
      max: 30
    confidence: "low"
    rationale: "The tally selects 25 to 30 C by qualified majority, with four of six votes agreeing within its temperature\
      \ threshold. Swain measured Lake Nicaragua surface water at 25 to 28 C; Perez measured 26.4 C at Izabal and\
      \ 27.6 C at Rio Dulce, and Brinson describes warm seasonal Izabal water. The selected interval is narrower\
      \ than the combined source observations: the independent PANGAEA NIC sample is 21.2 C, Swain bottom water\
      \ reaches 24 C, and Choc-M. reports 30.2 to 31 C in native-range fishing waters. These readings are retained\
      \ as evidence, but none establishes a species-wide occupied temperature envelope. The tally uses the rounded\
      \ median endpoints of its agreeing votes rather than the full measurement union. Proposals were generator\
      \ 26 to 30; checker-a 25 to 30; checker-b 25 to 28; checker-c 21.2 to 28; tiebreaker-1 24 to 30; tiebreaker-2\
      \ 25 to 31."

  ph:
    value:
      min: 7
      max: 8.9
    confidence: "low"
    rationale: "The tally uses median verification because the votes do not reach a qualified majority, retaining\
      \ 7 to 8.9 with low confidence. All proposals were generator 7 to 8.3; checker-a 6.5 to 8; checker-b 7.6 to\
      \ 8.9; checker-c 8.2 to 9; tiebreaker-1 7 to 8.9; tiebreaker-2 7 to 8.9. The FAO Lake Nicaragua record supplies\
      \ pH 7.0 and Swain supplies surface pH 8.2 to 8.9; Perez records 7.6 at Rio Dulce and 8.3 at Izabal. The decision\
      \ is narrower than the measured source coverage: PANGAEA NIC is 8.94, the Choc-M. Izabal and Rio Dulce survey\
      \ spans 7.9 to 10.5, and Brinson describes seasonal Izabal values below 7 without a recoverable exact minimum.\
      \ The isolated 10.5 value has no demonstrated resident maculicauda population. Checker-a inferred 6.5 from\
      \ qualitative material; neither that inferred endpoint nor a diatom optimum is a measured species-habitat\
      \ boundary. The decided median is a representative freshwater summary, not the complete native pH range or\
      \ an aquarium target."

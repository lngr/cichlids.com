  breeding:
    text: "A compatible pair cleans a hard surface before laying eggs and guards the spawning area vigorously. After\
      \ hatching, the adults may carry the young to shallow pits in the substrate. Published counts vary considerably,\
      \ so prepare for a substantial brood rather than relying on one clutch-size number. Eggs commonly hatch after\
      \ roughly two to three days and free swimming follows several days later, depending on temperature. Small\
      \ live foods such as newly hatched Artemia are practical once the fry begin feeding. Breeding can make an\
      \ otherwise workable community unsafe; a separate breeding setup or reliable divider is valuable."
    sources:

  sexing:
    text: "Adult males usually grow larger and can develop a more prominent forehead. They often show stronger red\
      \ coloration, while females tend to remain smaller and can look darker or more strongly marked. These clues\
      \ are useful together but are not reliable guarantees in juveniles. Locality differences and reproductive\
      \ color changes can overwhelm a simple color rule. Observe mature behavior over time and obtain experienced\
      \ help with identification when selecting a breeding pair. A hump or bright color alone should not be used\
      \ to declare two young fish a compatible male and female."

partners:
  suitable:
  - species: Neochromis sp. 'madonna'
    reason: Steeves reports a mixed colony with similarly sized fish that appeared to reduce shyness.
    condition: One reported aquarium combination; provide more space than a single-species minimum and
      monitor territorial pressure. This is not evidence that mixed breeding preserves pure lines.
  - species: Small Synodontis sold as dwarf petricola
    reason: Steeves reports keeping this aquarium catfish stock with chromogynos.
    condition: The historic trade identification is uncertain and the account is not a general guarantee
      for all Synodontis. Released fry remain vulnerable.
  unsuitable:
  - species: Very aggressive Lake Malawi mbuna
    reason: The breeder specifically advises against these companions; a shy chromogynos group may be
      displaced or persistently harassed.
  - species: Tiny or delicate community fish
    reason: "The breeder advises against these companions because of size and territorial mismatch. Predation\
      \ remains level 0, so routine adult-fish hunting is not asserted."
profile:
  overview:
    text: "This Lake Victoria insect feeder combines a modest adult size with unusually variable colour.\
      \ Aquarium stock often carries the Zue Island label, where males as well as females can be mottled.\
      \ The valid name is Haplochromis chromogynos; Paralabidochromis chromogynos remains widespread in\
      \ hobby literature. A deliberate social group and a reliable locality history matter more than treating\
      \ it as a generic colourful African cichlid."
    sources:
    - *id001
    - *id002
    - *id006
    - *id003
    - *id014
  habitat:
    text: "The fish occupies firm shallow lake margins, especially the boundary between rocky slopes,\
      \ pebbles and sand. Zue Island records place it at about 4 m depth. Provide both sheltered rock\
      \ faces and accessible substrate for foraging, with swimming room above them. The combined natural-water\
      \ envelope is 22 to 30 C, pH 6.8 to 9.4, GH 1 to 3 dGH and KH 2 to 6 dKH. This describes spatial\
      \ and seasonal lake variation; it is not a schedule for fluctuating aquarium chemistry."
    sources:
    - *id002
    - *id005
    - *id033
    - *id003
    - *id013
    - *id011
    - *id022
  sizeAndGrowth:
    text: "Plan around roughly 11 cm for either sex. FishBase measures its male-or-unsexed maximum as\
      \ standard length, whereas aquarium figures often leave the length convention unstated. A keeper\
      \ reports little difference between adult sexes, so a separate smaller female maximum is not justified.\
      \ Some care pages extend the size to about 12.7 or 13 cm; allow spare space and assess the fish\
      \ themselves rather than treating any figure as an exact growth ceiling."
    sources:
    - *id002
    - *id007
    - *id003
    - *id010
  husbandry:
    text: "Use about 230 litres with a 120 by 45 cm footprint for one male and three females. Secure rockwork\
      \ before filling, provide several retreats and interrupt long sightlines over sand or fine gravel.\
      \ A mature filter, oxygenation and consistent maintenance support stable conditions. Species care\
      \ targets are usually around 23 to 29 C and mildly to moderately alkaline pH. The wider decided\
      \ tolerances are provisional planning envelopes, especially their endpoints; they do not establish\
      \ that sustained 31 C or pH 9.4 is an ideal target. Captive reports include GH up to 20 dGH even\
      \ though the lake is very soft, so the phrase hard African-lake water does not describe its natural\
      \ habitat."
    sources:
    - *id006
    - *id007
    - kind: database
      title: "Seriously Fish species page, Haplochromis chromogynos"
      url: "https://www.seriouslyfish.com/species/haplochromis-chromogynos/"
      accessed: '2026-10-13'
      offline: true
    - *id003
    - *id014
    - *id005
    - *id013
  socialBehavior:
    text: A single male with three females is the practical starting group. This arrangement distributes
      courtship attention without adding a rival male; it is not a claim that the species forms permanent
      family units. Expect a hierarchy and localized defence around rock sites. Reports of territory holding
      before observed spawning mean that territorial behavior need not stop between broods. Particularly
      shy fish need cover and an opportunity to feed without repeated displacement.
    sources:
    - *id034
    - *id006
    - *id003
    - *id014
    - *id031
  diet:
    text: "Wild gut records point primarily to aquatic insect larvae, particularly caddisflies, with some\
      \ midges and mayflies. Feed an appropriately sized prepared cichlid food alongside varied invertebrate\
      \ items, and check that less assertive fish obtain a share. Pellets and flakes are practical captive\
      \ foods rather than evidence that the wild diet is plant-dominated. No particular bloat sensitivity\
      \ is documented. Predation level 0 reflects the absence of reported regular fish eating; occasional\
      \ loss of fry remains possible."
    sources:
    - *id002
    - *id006
    - *id003
    - *id014
    - *id007
  breeding:
    text: "The female carries developing offspring in her mouth. In one keeper's colony incubation lasted\
      \ about 18 days and initial broods were around a dozen fry, but those observations do not establish\
      \ fixed timing or clutch size for every aquarium. Give carrying females places to withdraw and leave\
      \ released fry access to fine cover. Newly feeding young can take suitable tiny invertebrate foods\
      \ and then finely crushed prepared food. Maintain locality labels and known parentage when preserving\
      \ a breeding line."
    sources:
    - *id002
    - *id034
    - *id024
    - *id003
    - *id014
  sexing:
    text: "Pattern alone is an unreliable guide to sex. The commonly maintained Zue Island stock can have\
      \ black-and-white markings in both sexes, with adult males developing additional blue and red, particularly\
      \ on the fins. Other accounts describe more uniformly blue-grey males from different material. Young,\
      \ subordinate and stressed fish may be difficult to distinguish. Use mature appearance together\
      \ with observed courtship and mouthbrooding rather than assigning every mottled fish to the female\
      \ sex."
    sources:
    - *id006
    - *id007
    - *id003
    - *id014
  compatibility:
    text: "Community keeping is possible with carefully selected robust companions, and a specialist keeper\
      \ reports it with another Victorian cichlid and small Synodontis. That experience is a starting\
      \ point rather than a guarantee for every mix. Avoid strongly aggressive mbuna and very small or\
      \ delicate fish; mixed communities need more space than the minimum for one chromogynos harem. The\
      \ empty hybrid-group list means no specific crossing group was established in this review. It provides\
      \ no assurance against hybridization, so a dedicated line remains the clearest option when parentage\
      \ matters."
    sources:
    - *id006
    - *id035
    - *id024
    - *id003
    - *id014
    - *id034
  problems:
    text: "Persistent exclusion from food or shelter is a reason to reassess the group and its layout.\
      \ Spare retreats and a restrained male count help prevent a shy fish from becoming trapped by territorial\
      \ pressure. The long-term GH, KH and extreme temperature or pH limits are poorly documented; avoid\
      \ interpreting a broad planning tolerance as a reason to force water toward an endpoint. Misidentified\
      \ mottled stock is another practical problem: the keeper account describes acquiring a different\
      \ piebald fish under the chromogynos name. Verify the origin of breeding stock and investigate unexplained\
      \ illness without assuming that all Victorian cichlids have the same needs."
    sources:
    - *id002
    - *id006
    - *id007
    - *id003
    - *id014

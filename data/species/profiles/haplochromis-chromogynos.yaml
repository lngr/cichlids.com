  ph:
    value:
      min: 6.8
      max: 9.4
    confidence: high
    rationale: "The settled tally fixes the combined Lake Victoria natural envelope at pH 6.8 to 9.4 with\
      \ high confidence and waterbody verification. Burgis compiles Nyanza Gulf values of 6.8 to 9.2,\
      \ while the historical Kenyan measurements summarized by Ochumba reach 9.4. FAO gives open-lake\
      \ values around 8.0 to 8.5 and gulf values up to 9.0; Orina independently reports beach means around\
      \ 7.08 to 9.3. No single FAO or Deirmendjian measurement series establishes every endpoint of the\
      \ compiled range. Husbandry recommendations do not replace this natural-water feature."

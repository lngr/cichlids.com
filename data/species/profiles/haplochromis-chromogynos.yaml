  ghDgh:
    value:
      min: 1
      max: 3
    confidence: high
    rationale: "The settled tally fixes natural GH at 1 to 3 dGH with high confidence. FAO compiles open-lake\
      \ calcium of 5.0 to 7.0 mg/L and magnesium of 2.3 to 3.5 mg/L, about 1.2 to 1.8 dGH using Ca/7.14\
      \ plus Mg/4.34. Burgis reports Nyanza Gulf calcium of 8.2 to 11.4 and magnesium of 2.1 to 3.2 mg/L,\
      \ reaching about 2.4 dGH. The rounded lake envelope is therefore very soft. Aquarium recommendations\
      \ of 10 to 20 dGH describe captive keeping and do not establish natural hardness."
    sources:
    - *id005
    - *id013
    - *id007
    - *id008

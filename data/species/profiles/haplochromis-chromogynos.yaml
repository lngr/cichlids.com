      waterbody: lake-victoria
    tolerance:
      value:
        min: 1
        max: 20
      confidence: low
      rationale: "The tally decides 1 to 20 dGH by qualified majority, five of six agreeing votes under\
        \ the range-agreement rule, with low confidence. Generator, checker-c, tiebreaker-1 and tiebreaker-2\
        \ proposed 1 to 20 dGH; checker-a proposed 1 to 18 dGH; checker-b proposed 1 to 10 dGH. The natural\
        \ 1 to 3 dGH establishes the low end. Aquarium Wiki gives 10 to 20 degrees hardness, interpreted\
        \ as GH in the later runs although the displayed scale is only degrees. The Einrichtungsbeispiele\
        \ care sheet gives 5 to 15 dGH; aquarium 38016 reports 15 to 20 dGH between its 2017 establishment\
        \ and 2019 update. That account contains a possible chilotes text substitution, and duration at\
        \ each endpoint is unknown, so it is supporting experience rather than proof of chronic safety.\
        \ Aquarium 41071 reports 7 to 9 dGH soon after stocking. Imperial Tropicals and Ron's recommend\
        \ hard water without numeric limits, and OATA gives 12 to 18 dGH for African lake cichlids generally.\
        \ The narrower 10 and 18 dGH proposals do not establish harm above their maxima. The full envelope\
        \ is an uncertain husbandry synthesis, not a tested threshold."
      sources:
      - *id007
      - *id014

partners:
  suitable:
    - species: Hypsophrys nicaraguensis
      reason: Listed by AquaInfo as a possible companion with its own territory.
      condition: At least 180 cm frontage with additional volume and separate retreat areas; monitor breeding.
    - species: Amatitlania septemfasciata
      reason: Listed under Archocentrus septemfasciatus by AquaInfo as a possible companion.
      condition: Large mixed aquarium with distinct territories and a separation option.
    - species: Astyanax aeneus
      reason: "A robust regional Astyanax is a plausible midwater companion; AquaInfo recommends Astyanax generally,
        and this species choice is an inference."
      condition: A properly sized shoal of adults in a large aquarium; exclude small juveniles and monitor brood
        defence.
  unsuitable:
    - species: Paracheirodon innesi
      reason: Small and easily intimidated; its juveniles are exposed to opportunistic predation.
    - species: Parachromis dovii
      reason: A much larger predatory and forceful cichlid can overwhelm or injure the pair.
    - species: Symphysodon aequifasciatus
      reason: Its calm social and feeding requirements and warmer routine husbandry conflict with a territorial
        digging river cichlid.
profile:
  overview:
    text: "Cribroheros alfari suits a keeper who enjoys watching fish work the aquarium floor. Adults repeatedly
      take in loose substrate and separate edible particles from it. Their appearance varies with locality and
      mood, with dark markings over warmer and greenish colours. Plan around a compatible adult pair and
      substantial floor space. This is a territorial river cichlid whose quiet foraging can change to firm
      brood defence. The trade names Amphilophus alfari and Cichlasoma alfari refer to the same species."
    sources:
      - kind: catalog-of-fishes
        title: "Eschmeyer's Catalog of Fishes: Cribroheros species list"
        url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Cr\
          ibroheros"

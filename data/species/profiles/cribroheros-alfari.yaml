  habitat:
    text: "Native populations occupy rivers across the Caribbean side of Central America, with additional Costa
      Rican Pacific drainages. Western Panama records appear in specialist accounts, although one Guarumo
      collecting report leaves the identification uncertain. Adults forage over sand and mud among stones and
      submerged wood. Breeding fish also use quiet, shaded side pools. The working natural ranges are 22 to 28
      C, pH 6.5 to 7.8, GH 2 to 10 dGH and KH 1 to 4 dKH. They summarize typical conditions rather than every
      occupied site: Rio San Jose breeding water is reported at approximately 0.95 dGH, and Rio Platano
      tributaries with alfari measure 4 to 5 dKH. Regional La Selva chemistry spans about 0.045 to 13.1 dKH
      and acidic headwaters reach pH near 5.4, but species occupancy in those extreme stations is unproven.
      Such heterogeneous regional chemistry does not define an aquarium target for all populations."
    sources:
      - kind: database
        title: "FishBase: Cribroheros alfari species summary"
        url: "https://www.fishbase.se/summary/Cribroheros-alfari.html"
        accessed: 2026-10-15

  husbandry:
    text: "For one compatible adult pair, plan at least 425 litres of usable water and a floor measuring 150 by 55
      cm. The frontage follows species advice; depth and volume are a low-confidence median-based planning
      allowance. Larger 500 to 540 litre aquaria with 160 cm frontage also appear in care sources. Provide
      fine sand for sifting, secure heavy stones independently of it, and arrange wood and cover with several
      escape routes. Effective filtration, surface movement and regular water changes support a clean,
      oxygenated environment. Around 24 to 26 C is a practical starting point. The working tolerances are 20
      to 30 C, pH 6.0 to 8.3, GH 2 to 18 dGH and KH 1 to 10 dKH; their outer endpoints are uncertain keeping
      estimates rather than routine targets. Match the source population and acclimate gradually."

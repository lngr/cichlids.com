  ph:
    value:
      min: 6.5
      max: 7.8
    confidence: low
    rationale: "No qualified majority exists. The tally takes the median lower and upper bounds of all six
      proposals and rounds to one decimal, giving pH 6.5 to 7.8 with low confidence. This is a representative
      synthesis of occupied-water observations and regional river measurements rather than the union of every
      station. The TNC assessment reports pH 6.5 to 7.18 in occupied lagoons, Grad measures 7.2 with alfari in
      the Rio Platano basin, and Guarumo accounts report 7.5 to 7.6. The decided interval is narrower than the
      Ramsar regional surface-water range of 6.4 to 8.25, the Sarapiqui site means of 7.2 to 8.5 and
      Cichlidamerique habitat summaries extending to 8.02. It also leaves the regional buffered La Selva
      annual means of 6.0 to 6.41 outside the typical interval. Those measurements remain evidence; species
      occupancy is not established at each regional station. FishBase gives the narrower 6.5 to 7.0
      environmental summary. Aquarium recommendations do not determine the natural range. generator proposes
      {\"min\":6.4,\"max\":8.3}; checker-a proposes {\"min\":6.5,\"max\":8}; checker-b proposes
      {\"min\":6,\"max\":7.6}; checker-c proposes {\"min\":6.5,\"max\":7.5}; tiebreaker-1 proposes
      {\"min\":6.5,\"max\":7.6}; tiebreaker-2 proposes {\"min\":6.5,\"max\":8}."

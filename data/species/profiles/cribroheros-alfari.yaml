  socialBehavior:
    text: "A compatible pair is the recommended adult unit. Two fish of opposite sex may reject each other, and a
      second male adds a serious rival. Watch access to food and shelter as well as conspicuous fighting; a
      fish confined behind equipment needs intervention. Courtship and parental defence can enlarge the area
      the pair controls. Arrange several retreat routes and keep a divider or separate aquarium available.
      More floor space helps fish avoid one another, but it does not guarantee that an incompatible pair
      becomes safe."
    sources:
      - kind: website
        title: "Rene Beerlink: Cribroheros alfari, AquaInfo"

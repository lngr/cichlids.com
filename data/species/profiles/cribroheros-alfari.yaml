  minTank:
    value:
      volumeL: 425
      lengthCm: 150
      depthCm: 55
    confidence: low
    rationale: "The component medians of the four proposals are 425 L, 150 cm length and 55 cm depth. Generator
      proposes 500 L/160/60 cm, checker-a 400 L/125/50 cm, checker-b 400 L/150/50 cm and checker-c 450
      L/150/60 cm. The selected 150 cm frontage is explicitly recommended by Beerlink and Fischlexikon for one
      compatible adult pair. The 55 cm depth and 425 L volume are dimensional planning inferences between the
      proposals, not published species-specific thresholds. A 150 by 55 cm footprint with roughly 52 cm water
      depth provides about 429 L before displacement, so usable volume must also be checked. Guidarium gives
      the smaller 250 L/120 cm recommendation and Techno-Science 400 L with 125 to 150 cm frontage; Zoopet
      recommends the larger 500 L/160 cm and the Nordic register 540 L/160 cm. Fishipedia also recommends 500
      L. The median avoids adopting the largest source requirement for every pair, while providing more floor
      area than the smallest recommendations. Mixed-species keeping follows Beerlink's separate minimum of 180
      cm and needs additional volume."

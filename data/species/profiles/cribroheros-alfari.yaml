    tolerance:
      value:
        min: 6
        max: 8.3
      confidence: low
      rationale: "No qualified majority exists. The median of the six proposed lower bounds is 6.0 and the median
        upper bound is 8.25, rounded to 8.3, yielding pH 6.0 to 8.3 with low confidence. This inferred
        husbandry envelope contains the natural pH 6.5 to 7.8 range. AquaInfo recommends 6.5 to 7.5, Zoopet 7
        to 8, Fishipedia and Cichlid Atlas 7 to 7.8, and Guidarium and Techno-Science 6.5 to 8.0.
        Cichlidamerique supplies narrower partly inconsistent recommendations. Regional Sarapiqui values reach
        8.5. The median is narrower than the 6.0 to 8.5 proposals of generator, checker-a and tiebreaker-2;
        the outer margin is an inference rather than a measured chronic failure boundary. The sources support
        the central keeping band more strongly than either selected extreme. The median avoids letting one
        narrow care recommendation determine the entire tolerance. generator proposes {\"min\":6,\"max\":8.5};
        checker-a proposes {\"min\":6,\"max\":8.5}; checker-b proposes {\"min\":6,\"max\":8}; checker-c
        proposes {\"min\":6.5,\"max\":7.8}; tiebreaker-1 proposes {\"min\":6.5,\"max\":8}; tiebreaker-2
        proposes {\"min\":6,\"max\":8.5}."

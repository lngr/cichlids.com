  temperatureC:
    value:
      min: 22
      max: 28
    confidence: medium
    rationale: "The qualified majority selects 22 to 28 C with five of six votes agreeing under the rubric. Grad
      records juveniles and breeding adults in Rio Platano tributaries at 22 to 23 C, and Stalsberg records
      27.8 C at Guarumo with tentative species identification. The TNC assessment gives 21.9 to 27.9 C at
      occupied Laguna Cote and 26.2 to 28 C in occupied Caribbean lowland lagoons. Regional La Selva and
      Sarapiqui measurements support the river gradient but do not demonstrate alfari at every station. This
      typical interval is narrower than the FishBase and NVC envelope of 20 to 34 C, the Barra del Colorado
      site readings of 23 to 31.4 C and the Sarapiqui site-mean interval of 19.8 to 23.7 C. None establishes
      that every population experiences all those endpoints. Guarumo biotope metadata contains an impossible
      date, so it adds limited corroboration rather than an independent precise seasonal series. generator
      proposes {\"min\":22,\"max\":28}; checker-a proposes {\"min\":22,\"max\":28}; checker-b proposes
      {\"min\":23,\"max\":28}; checker-c proposes {\"min\":20,\"max\":28}; tiebreaker-1 proposes
      {\"min\":22,\"max\":28}; tiebreaker-2 proposes {\"min\":22,\"max\":28}."

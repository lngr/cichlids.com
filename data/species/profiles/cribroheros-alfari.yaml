  ghDgh:
    value:
      min: 2
      max: 10
    confidence: medium
    rationale: "The tally selects 2 to 10 dGH with all four natural-range votes agreeing within the two-degree
      comparison allowance; unanimity refers to that allowance rather than identical endpoints. FishBase gives
      2 to 10 dH, while Stalsberg directly measures 3 dGH at Guarumo and the Guarumo biotope report gives
      approximately 5 dGH after conversion from 89 mg/L as CaCO3. Regional Ramsar surface waters span about
      0.60 to 8.49 dGH, Cowx reports approximately 1.4 to 3.92 dGH, and Chachagua central values are about 1.1
      to 1.2 dGH. The Rio San Jose breeding account reports 17 mg/L GH, approximately 0.95 dGH if CaCO3
      equivalents are intended. These softer observations remain evidence and show that the rounded working
      interval is not an exhaustive occurrence limit. Conductivity-based estimates are retained as estimates
      and do not replace measured hardness. Fishipedia gives a wider 5 to 20 dGH habitat target without
      traceable stations, and Techno-Science gives 2 to 12; neither outweighs direct field chemistry.
      generator proposes {\"min\":0.5,\"max\":9}; checker-a proposes {\"min\":2,\"max\":8}; checker-b proposes
      {\"min\":2,\"max\":10}; checker-c proposes {\"min\":1,\"max\":10}."

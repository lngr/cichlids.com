  problems:
    text: "Several common failures follow from treating a young pair as a small community fish. Restricted floor
      space can trap a subordinate fish, and unsecured rockwork becomes dangerous when the sand underneath is
      moved. Dirty substrate, heavy feeding and poor oxygenation undermine health even when pH is within a
      published range. Rapid chemistry changes are another avoidable stressor, especially in weakly buffered
      water. Watch for persistent hiding, damaged fins, abnormal breathing or appetite loss and investigate
      environment and social pressure promptly. Quarantine additions and seek qualified assessment for
      persistent illness; these signs do not identify a particular disease."

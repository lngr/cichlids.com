  diet:
    text: "Offer a varied omnivore diet in portions that reach the lower water layers. A good sinking prepared
      food can form the basis, supplemented with suitable aquatic invertebrate foods and some plant
      ingredients. In nature the fish sorts insects and seeds from loose substrate, so access to sand supports
      an important feeding behaviour. Avoid treating it as a dedicated fish predator or feeding large rich
      meals to increase size. Distribute food in more than one place if neighbours dominate feeding, and
      remove uneaten material before it burdens the filtration."
    sources:

  breeding:
    text: "Spawning takes place on an exposed substrate in a defended area, which can include a sheltered
      depression or a cleaned surface. Both parents participate in protecting the brood. A compatible pair and
      enough room to withdraw are more useful than forcing repeated breeding attempts through abrupt water
      changes. FishBase reports clutches of roughly 300 to 400 eggs. Zoopet gives about three days to hatching
      and about ten days to free swimming, although development depends on temperature and the starting point
      of the count. Arrange food and accommodation for surviving young before encouraging a brood."

  diet:
    value:
      type: omnivore
      bloatSensitive: false
      foods:
        - Sinking omnivore pellets
        - Aquatic insect larvae
        - Artemia
        - Mysis
        - Plant-based prepared food
    confidence: medium
    rationale: "The qualified majority selects omnivore with bloatSensitive false by five votes to one. Checker-a
      proposes invertivore with bloatSensitive false; generator, checker-b, checker-c, tiebreaker-1 and
      tiebreaker-2 propose omnivore with bloatSensitive false. FishBase reports both aquatic insects and
      seeds, and Beerlink explicitly describes benthic omnivory and mixed animal and vegetable feeding. His
      NVC and AquaInfo versions are one authored account rather than independent observations. Fischlexikon
      emphasizes invertebrates, which explains the alternative classification, but no readable
      diet-composition table establishes their dominance across populations. Mixed feeding supports omnivore
      under the rubric. The false bloat flag is an inference from ordinary mixed-food husbandry and the
      absence of an established special protein restriction, not a disease experiment. The CRC public page
      supports identity but supplies no feeding summary; the revision and regional ecological abstracts do not
      establish diet percentages. Cichlidamerique mollusc-specialization claims lack a traceable stomach
      dataset."

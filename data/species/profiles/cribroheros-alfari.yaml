features:
  origin:
    value:
      continent: Central America
      region: "Atlantic slope from the Patuca basin in Honduras through Nicaragua and Costa Rica to reported western
        Panama localities, with additional Pacific-slope basins in Costa Rica"
      waterbody: null
      localities:
        - Rio Patuca
        - Rio San Juan drainage
        - Rio Sarapiqui
        - Rio San Jose
        - Turrialba
        - Rio Sixaola
        - Rio Guarumo
    confidence: medium
    rationale: "The Catalog and FishBase establish the core Atlantic range from Honduras to Costa Rica. The Costa
      Rican checklist explicitly adds Pacific-slope Nicoya, Tempisque, Bebedero and Tarcoles basins. CRC lists
      Panama as native, and Beerlink extends the range to Rio Guarumo; Stalsberg marks the Guarumo
      identification as tentative. The decision retains that western extension with qualification rather than
      treating its limit as equally certain as the core range. Localities from the inputs are merged, and no
      single lake supplies the species-wide water values. Regional ecological papers read only as abstracts
      supply context rather than additional numerical occurrence limits."

  compatibility:
    text: "Keep a compatible pair with neighbours large enough to avoid opportunistic predation and able to
      retreat from territorial defence. Beerlink suggests Hypsophrys nicaraguensis, Amatitlania septemfasciata
      and Astyanax in mixed aquaria at least 180 cm long with additional volume and separate territories.
      These combinations need observation during brood care. Adult Astyanax aeneus is a regional example,
      while the original husbandry recommendation names the genus rather than guaranteeing that species
      combination. Very small fishes and fry are vulnerable, and much larger forceful predators can injure
      alfari. Preserve locality identity when selecting breeding stock. No supported named interspecific cross
      defines a curated group for alfari; the empty group list expresses an evidence gap."

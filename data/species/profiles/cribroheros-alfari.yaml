  sizeAndGrowth:
    text: "Typical upper aquarium sizes are about 22 cm for males and 18 cm for females. Reports of 20 cm without
      a sex distinction fit the same general adult scale. The 17.2 cm FishBase figure uses standard length and
      omits the tail, so it is not directly interchangeable with aquarium total lengths. Population and
      individual differences affect appearance and growth. Space the aquarium for adults and maintain a lean
      condition rather than feeding for exceptional size. Published longevity estimates suggest roughly eight
      to ten years, with limited long-term records."

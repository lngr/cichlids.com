        with low confidence. No read species account supplies a measured chronic KH tolerance. This envelope
        is inferred from the pH and GH keeping recommendations and ordinary buffered Central American cichlid
        husbandry. It contains the decided natural range and extends well above it without treating the
        habitat endpoints as physiological failure limits. It is narrower than checker-a's 1 to 12 dKH
        proposal and starts above generator's 0.5 to 10 proposal; neither difference has a species-specific
        chronic experiment behind it. GH and KH can vary independently. generator proposes

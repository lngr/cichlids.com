  khDkh:
    value:
      min: 1
      max: 4
    confidence: low
    rationale: "The tally selects 1 to 4 dKH from four proposals agreeing within the two-degree allowance. This
      natural feature carries no verification object. Sarapiqui alkalinity means convert to about 1.1 to 2.4
      dKH, undisturbed Chachagua and upstream San Lorenzo central values to about 1.2 to 1.4 dKH, and
      Stalsberg measures 3 dKH at Guarumo. The rounded regional interval is not an exhaustive limit for
      occupied water. Grad additionally reports 4 to 5 dKH in Rio Platano tributaries with juvenile and
      breeding alfari; the decided range is narrower than that directly observed upper endpoint. The Rio
      Guabito analogue also gives 5 dKH, whereas Rio Indio gives 0.65 dKH. The full heterogeneous La Selva
      stream subset spans 0.045 to 13.1 dKH; it is much wider than the decision and lacks matched species
      occupancy. Groundwater-influenced streams do not define the typical target. GH and conductivity are not
      substitutes for alkalinity. generator proposes {\"min\":0.5,\"max\":3}; checker-a proposes
      {\"min\":1,\"max\":4}; checker-b proposes {\"min\":3,\"max\":5}; checker-c proposes
      {\"min\":1,\"max\":3}. The McColl (1970) citation remains contextual provenance only: the DOI page
      returns HTTP 403 and the permitted full-text tool reports that it is not open access, so its unreadable
      content does not determine any endpoint."

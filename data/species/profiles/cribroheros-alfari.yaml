      rationale: "The qualified majority selects 20 to 30 C, with five of six votes agreeing within one degree.
        AquaInfo and NVC recommend 23 to 27 C, Zoopet 23 to 26 C, Techno-Science 23 to 28 C, and Fishipedia
        and Cichlid Atlas extend recommendations to 30 C. The cooler endpoint is inferred from the reported

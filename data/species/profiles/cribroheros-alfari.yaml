  sexing:
    text: "Adult size helps with sexing because males tend to grow larger and develop a more angular head profile.
      Females often show a dark patch in the dorsal fin, but its strength and size vary. Compare several
      traits together, including body size, dorsal markings and pair behaviour. A small fish without a clear
      patch cannot be assigned a sex reliably from that absence alone. Juvenile colour and social rank also
      make simple visual comparisons uncertain. When obtaining a breeding pair, observed compatibility is more
      informative than two tentative sex labels."
    sources:

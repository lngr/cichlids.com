    tolerance:
      value:
        min: 20
        max: 30
      confidence: low
      rationale: "The qualified majority selects 20 to 30 C, with five of six votes agreeing within one degree.
        AquaInfo and NVC recommend 23 to 27 C, Zoopet 23 to 26 C, Techno-Science 23 to 28 C, and Fishipedia
        and Cichlid Atlas extend recommendations to 30 C. The cooler endpoint is inferred from the reported
        environmental breadth and regional cool-water populations. This tolerance contains the decided natural
        range. It is narrower than the 20 to 34 C envelope in FishBase, NVC, the Nordic register and
        Cichlidamerique because those listings do not establish healthy multi-year exposure at 34 C. The exact
        chronic endpoints lack a longitudinal keeping study, so confidence remains low. generator proposes
        {\"min\":21,\"max\":30}; checker-a proposes {\"min\":20,\"max\":30}; checker-b proposes
        {\"min\":23,\"max\":30}; checker-c proposes {\"min\":20,\"max\":30}; tiebreaker-1 proposes
        {\"min\":20,\"max\":30}; tiebreaker-2 proposes {\"min\":20,\"max\":30}."

  maxSizeCm:
    value:
      male: 22
      female: 18
    confidence: medium
    rationale: "The per-sex medians are 22 cm for males and 18 cm for females. Generator, checker-b and checker-c
      propose 22/18 cm, while checker-a proposes 20/16 cm. Beerlink explicitly gives adult aquarium maxima of
      about 22 and 18 cm, and Fischlexikon repeats those sex-specific sizes. AquaInfo and NVC are versions of
      the same author and do not supply two independent measurements. Nordic and Zoopet general sizes of 20 cm
      are compatible with this planning scale. FishBase gives 17.2 cm standard length for male or unsexed
      fish; it omits the tail and does not establish a female maximum. Some input evidence maps unsexed or
      usual-size figures onto sexes; those mappings remain qualified evidence rather than direct measurements.
      Cichlidamerique mentions exceptional 25 cm males, which do not determine the typical maximum."

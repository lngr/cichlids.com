    tolerance:
      value:
        min: 2
        max: 18
      confidence: low
      rationale: "No qualified majority exists. The median lower bound is 1.5 dGH and rounds to 2; the median upper
        bound is 18 dGH, giving 2 to 18 dGH with low confidence. This contains the decided natural 2 to 10 dGH
        range. AquaInfo recommends 2 to 10, Fischlexikon 5 to 14, and Cichlidamerique includes 4 to 16
        alongside narrower advice. Fishipedia and Guidarium give the wider 5 to 20 dGH range; the selected 18
        dGH upper endpoint is a vote median, not a directly measured chronic limit. The decision is narrower
        than the 0.5 to 20 proposals of generator and tiebreaker-1 and the 2 to 20 proposal of checker-a. The
        Rio San Jose breeding observation of approximately 0.95 dGH and other softer regional readings remain
        evidence outside this rounded working interval. They do not imply that water below 2 dGH is harmful.
        Long-term health at the exact lower and upper endpoints lacks controlled evidence, and acclimation and
        population origin matter. generator proposes {\"min\":0.5,\"max\":20}; checker-a proposes
        {\"min\":2,\"max\":20}; checker-b proposes {\"min\":2,\"max\":15}; checker-c proposes
        {\"min\":1,\"max\":16}; tiebreaker-1 proposes {\"min\":0.5,\"max\":20}; tiebreaker-2 proposes
        {\"min\":2,\"max\":16}."

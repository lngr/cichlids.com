    rationale: "The generator proposes a pair, checker-a one male with three females, and checker-b and checker-c\
      \ one male with two females. The field study describes both monogamy and facultative polygyny, usually one\
      \ to four breeding females per male; its direct observations outweigh a pair-only interpretation, while the\
      \ paper itself notes uncertain historical identification of the southern population. The public 2003 abstract\
      \ confirms pairs and polygynous groups but cannot verify the five-female count encoded in one input. Tanganyika.si\
      \ also reports both mating arrangements. A small harem with two females per male is a practical choice within\
      \ the observed flexibility and the median of the harem ratio proposals, not a fixed wild sex ratio or a claim\
      \ that a compatible pair fails. The tank minimum provides separate female shell sites; cooperative juvenile\
      \ helpers in the field do not justify keeping several unrelated adult males."

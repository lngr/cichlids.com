  sizeAndGrowth:
    text: "Plan around adult maxima of about 7 cm for a male and 4 cm for a female. Larger measurements under the\
      \ same name include southern field fish, pooled captive specimens and separate trade forms; they do not provide\
      \ equivalent sex-specific maxima for the Katibili taxon. There is no dependable species-verified growth curve\
      \ or longevity series. The planning estimate of five to eight years has low confidence, and care sheets also\
      \ suggest six or about ten years."

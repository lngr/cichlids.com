    rationale: "The proposal medians are 7 cm for males and 4 cm for females: the generator, checker-b and checker-c\
      \ give 7/4, while checker-a gives 8/5. FishBase supplies sex-specific total lengths of 7 and 4 cm and is the\
      \ strongest direct fit to the Katibili taxon. Tanganyika.si independently gives about 7 cm for males; Aquarium\
      \ Glaser gives 7/5 for disputed Zambia fish. The field study gives about 8 cm without sex-specific maxima,\
      \ and the pigment study pools four captive adults at 7 to 10 cm without assigning the length endpoints by\
      \ sex. The input encodings of these papers as 8/5 and 10/7 are retained with qualification and do not establish\
      \ sex-specific aquarium maxima. The forum figure of 11 cm concerns the separate Kipili form; the Bulgarian\
      \ 6/4 is standard length, not total length. Those larger or differently measured records do not displace the\
      \ median for this species."

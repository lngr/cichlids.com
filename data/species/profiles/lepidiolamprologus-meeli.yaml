  khDkh:
    value:
      min: 15
      max: 20
    confidence: high
    rationale: "All four full profiles propose 15 to 20 dKH. The decided natural range is retained without a verification\
      \ object. Plisnier reports bicarbonate alkalinity of 5.6 to 6.2 meq/L plus station-dependent carbonate, Cohen\
      \ reports alkalinity of 6.5 to 6.6 meq/L, and Langenberg cites 6.7 to 6.9 meq/L. Multiplication by 2.8 converts\
      \ alkalinity to aquarium dKH; the combined lake chemistry supports the rounded 15 to 20 dKH envelope. This\
      \ buffering measure is separate from calcium and magnesium hardness."
    sources:
    - kind: literature
      title: "Plisnier et al. (1996), Limnological sampling during an annual cycle at three stations on Lake Tanganyika"

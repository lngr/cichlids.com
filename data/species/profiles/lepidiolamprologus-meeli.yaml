    tolerance:
      value:
        min: 7.8
        max: 9.4
      confidence: low
      rationale: "The tally decides pH 7.8 to 9.4 by the six-vote median, with verification votes 3 of 6 and low\
        \ confidence because no proposal has a qualified majority. The generator and checker-b propose 8.0 to 9.4;\
        \ checker-a, checker-c and tiebreaker-1 propose 7.5 to 9.4; tiebreaker-2 proposes 8.0 to 9.5. The median\
        \ lower bound is 7.75, rounded to 7.8, and the median upper bound is 9.4. The decision is narrower than\
        \ Tanganyika.si aquarium guidance of 8.0 to 9.5 at the upper end and the Bulgarian sheet and JBL brochure\
        \ range of 7.5 to 9.0 at the lower end. Aquablog gives two inconsistent ranges, 7.5 to 8.5 in prose and\
        \ 7 to 9 in its summary; neither is an independent tolerance experiment. Practical Fishkeeping gives 7.8\
        \ to 9, AKVARKO 8 to 8.5, Fishipedia 7.8 to 8.8, Interaquaristik 7.8 to 9 and Aquarist Atlas 8 to 8.5 for\
        \ aquarium care, with a separate 8.2 to 9 habitat statement. Seriously Fish gives 7.5 to 9 for related L.\
        \ boulengeri, and Seachem targets 9 to 9.4 for its buffer. These targets support a plausible planning envelope\
        \ containing the natural range, not demonstrated physiological failure thresholds. Identification uncertainty\
        \ and indirect lake-community evidence keep confidence low. The JBL test-product endpoints contain no usable\
        \ care limits; attempted meeli pages at Seriously Fish and AquaInfo are reported unavailable by tiebreaker-1."

  breeding:
    text: "The female deposits eggs inside an empty gastropod shell and tends the clutch and young there. The male\
      \ fertilizes from outside and defends the surrounding area. Provide several usable shells at separate sites\
      \ so females can settle without losing access to shelter. Young take suitably small live or prepared foods\
      \ near the nest. Reported clutch sizes and development times vary between sources and may concern different\
      \ forms, so exact schedules are not assumed."

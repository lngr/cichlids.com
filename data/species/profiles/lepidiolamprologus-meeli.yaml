features:
  origin:
    value:
      continent: Africa
      region: Lake Tanganyika
      waterbody: lake-tanganyika
      localities:
      - "Katibili Bay, Democratic Republic of the Congo"
    confidence: high
    rationale: "All four full profiles place the species in Lake Tanganyika. The generator and checker-b restrict\
      \ the locality to Katibili Bay; checker-c adds northern Lake Tanganyika; checker-a adds Mutondwe Island in\
      \ Zambia from a direct field study. The Catalog gives the northern lake and the type locality at Katibili,\
      \ and FishBase restricts its account to that bay. The Mutondwe study explicitly discusses alternative identifications,\
      \ while Aquarium Glaser questions the identity of Zambia fish. Mutondwe is therefore retained in the evidence\
      \ as a population studied under this name, rather than asserted as a confirmed extension of the Katibili taxon.\
      \ The CRC public photograph labelled from Kalemie is additional Congolese context, not a resolved distribution\
      \ boundary."

  habitat:
    text: "Katibili Bay on the Congolese shore is the type locality and the clearest locality anchor. Species accounts\
      \ describe sandy bottom with scattered shells at about 5 to 20 m. A southern field study near Mutondwe Island\
      \ reports shell nests at 9 to 11 m, but the identity and geographic scope of fish called meeli are debated.\
      \ Lake measurements supply natural ranges of 23 to 29 C, pH 8.4 to 9.4, GH 10 to 13 dGH and alkalinity 15\
      \ to 20 dKH. Alkalinity exceeds GH because the two describe different parts of the dissolved chemistry."

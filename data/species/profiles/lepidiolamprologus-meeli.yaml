partners:
  suitable:
  - species: Cyprichromis leptosoma
    reason: Open-water schooling can separate its main activity from the bottom shell sites.
    condition: "Only in a larger, sufficiently long community aquarium that meets the school requirements and leaves\
      \ the shell territory clear; the 130 L harem minimum is insufficient."
  - species: Julidochromis transcriptus
    reason: A distinct rock territory can reduce direct competition for shell shelters.
    condition: Only in a larger aquarium with separated rock and shell territories and room for both adult social
      units.
  unsuitable:
  - species: Neolamprologus multifasciatus
    reason: Another shell colony competes for the same shelter and bottom territory in a restricted aquarium.
  - species: Neolamprologus brevis
    reason: Shared demand for shell sites creates territorial pressure in the same sand patch.
  - species: Lepidiolamprologus boulengeri
    reason: "Shell-territory overlap, identification similarity and the shared presumed genus hybrid group make\
      \ this an unsuitable breeding mixture."
  - species: Lepidiolamprologus elongatus
    reason: A much larger fish predator threatens the small adults and also shares the presumed genus hybrid group.
profile:
  overview:
    text: "Lepidiolamprologus meeli is a small shell-breeding cichlid from Lake Tanganyika. The legacy name Neolamprologus\
      \ meeli is an earlier combination. Males reach about 7 cm total length and females about 4 cm. Sand and empty\
      \ snail shells shape its daily activity, feeding and reproduction. Its modest size does not prevent persistent\
      \ territorial chasing. Fish sold as meeli may belong to related southern or Kipili forms, so locality and\
      \ identification matter when interpreting aquarium reports."
    sources:
    - kind: database

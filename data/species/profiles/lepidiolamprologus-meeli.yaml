  diet:
    text: "Offer small animal-based foods such as brine shrimp, cyclops, daphnia or mysis alongside suitable fine\
      \ pellets or flakes. Insects and crustaceans are prominent prey in the field account, and hobby sources also\
      \ mention snails and occasional fish fry. Predation level 1 reflects opportunistic risk to fry and very small\
      \ fish rather than a fish-dominated diet. Bloat sensitivity is not established, but uneaten food and excessive\
      \ feeding can compromise water quality."

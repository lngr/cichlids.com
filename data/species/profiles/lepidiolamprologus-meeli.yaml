      \ occasional fry or juvenile prey. The field study emphasizes insects and shrimp, and the level-0 evidence\
      \ mappings from checker-a describe that emphasis rather than demonstrating an inability to take fish. Level\
      \ 1 therefore represents opportunistic fry and very small fish consumption, not routine predation on all fish\
      \ that fit in the mouth. FishBase trophic estimates are modelled from relatives and are not direct diet observations.\
      \ Southern and traded meeli identifications remain uncertain."

      \ lists brine shrimp, cyclops, daphnia, mysis, bloodworms and prepared foods; checker-b lists insects, shrimp\
      \ and fry; checker-c lists invertebrates and fry. The tally food list is retained exactly. The field account\
      \ supports benthic insects and shrimp, while the Bulgarian sheet mentions small fish and snails and hobby\
      \ accounts support frozen and prepared alternatives. CRC also labels the feeding piscivorous, but does not\
      \ establish that fish form the main diet. That combination supports an invertebrate-dominated predator with\
      \ occasional fish prey. No read source identifies special protein-related bloat sensitivity; false does not\
      \ imply immunity to digestive illness."
  - field: features.social

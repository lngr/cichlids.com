    tolerance:
      value:
        min: 11
        max: 22
      confidence: low
      rationale: "The tally decides 11 to 22 dKH by qualified majority, 4 of 6 agreeing within the 2 dKH threshold,\
        \ with low confidence. The generator and checker-c propose 12 to 25; checker-a 10 to 22; checker-b 12 to\
        \ 22; tiebreaker-1 8 to 20; and tiebreaker-2 11 to 22 dKH. The agreeing cluster contains checker-a, checker-b\
        \ and both tiebreakers, whose median bounds round to 11 and 22. Tanganyika.si explicitly gives the same\
        \ 11 to 22 aquarium alkalinity range, while Practical Fishkeeping gives 8 to 18, the JBL feeding brochure\
        \ 8 to 20 and OATA 10 to 15 for broader groups. Thus the decision is narrower at its lower end than these\
        \ 8 to 20 and 10 to 15 husbandry ranges and narrower at its upper end than the two 12 to 25 proposals, whose\
        \ extension to 25 lacks direct species evidence. JBL AquaDur supplies a target around 18 dKH rather than\
        \ a full tolerance interval. No read source establishes chronic KH endpoints for securely identified meeli;\
        \ this remains a group-husbandry inference containing the natural 15 to 20 dKH, not a conversion from GH\
        \ or pH and not proof of harm immediately outside the bounds."

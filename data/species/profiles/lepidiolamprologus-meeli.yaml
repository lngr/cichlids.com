      \ 9.0 at the lower end. Aquablog gives two inconsistent ranges, 7.5 to 8.5 in prose and 7 to 9 in its summary;\
      \ neither is an independent tolerance experiment. Practical Fishkeeping gives 7.8 to 9, AKVARKO 8 to 8.5,\
      \ Fishipedia 7.8 to 8.8, Interaquaristik 7.8 to 9 and Aquarist Atlas 8 to 8.5 for aquarium care, with a separate\

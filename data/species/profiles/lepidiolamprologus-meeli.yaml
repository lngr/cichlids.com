    rationale: "All four full profiles propose 10 to 13 dGH. The decided lake range is retained with waterbody verification.\
      \ Plisnier reports surface calcium means of 10.9 to 11.6 mg/L and magnesium means of 41.2 to 43.2 mg/L; converting\
      \ Ca/7.14 plus Mg/4.34 gives about 11.1 to 11.5 dGH. Cohen and the Langenberg synthesis extend the chemistry\
      \ context, supporting the rounded 10 to 13 dGH envelope. Aquarium GH advice does not replace these habitat\
      \ measurements."

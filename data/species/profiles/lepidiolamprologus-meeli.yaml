  socialBehavior:
    text: "One male with two females is a practical adult social unit, with separate shell sites for the females.\
      \ Compatible pairs also occur, and field males may associate with several females. Research on a southern\
      \ population describes juveniles that remain near breeders and help defend and maintain nests; that observation\
      \ does not justify mixing unrelated adult males in a small tank. Monitor persistent chasing and blocked shelter\
      \ access, especially during spawning, and provide an alternative enclosure if a fish cannot establish a refuge."

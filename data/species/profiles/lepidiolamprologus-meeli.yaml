  problems:
    text: "Missing shells, clustered nest sites and competing adult males can leave a subordinate fish continually\
      \ exposed. Watch feeding access as well as visible wounds. Alkaline water makes accumulated ammonia especially\
      \ hazardous, so stable filtration, testing and regular maintenance are essential. Persistent heat increases\
      \ oxygen demand while reducing oxygen availability. Identification errors are another practical problem: the\
      \ separate Kipili forms and some Zambia fish can differ in size and behaviour from the Katibili taxon. Forum\
      \ reports illustrate this confusion and provide context rather than measured water limits."

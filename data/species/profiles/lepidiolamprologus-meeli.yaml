  compatibility:
    text: "A dedicated shell setup is straightforward, but the species is not categorically restricted to its own\
      \ kind. In a larger aquarium, open-water Tanganyika fish or a clearly separated small rock-dweller may avoid\
      \ direct competition. Their social and space requirements must also be met; the 130 L minimum covers only\
      \ the meeli harem. Other shell-dwellers compete for the same sites, very small fish and fry may be eaten,\
      \ and large predators threaten the adults. The shared Lepidiolamprologus hybrid group carries a presumed crossing\
      \ caution based on general warnings, not confirmed crosses between every member."

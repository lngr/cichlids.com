  sexing:
    text: "Mature males are larger than females, while general body markings overlap between the sexes. Juvenile\
      \ size and colour alone are unreliable for forming an adult group. Some brooding females darken or develop\
      \ darker pelvic fins, but these changes depend on reproductive condition and the identity of the fish. Use\
      \ adult size, behaviour and reliable provenance together rather than assigning sex from a single colour mark."

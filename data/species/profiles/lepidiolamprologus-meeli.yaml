    tolerance:
      value:
        min: 23
        max: 29
      confidence: low
      rationale: "The tally decides 23 to 29 C with unanimous verification, 4 of 4 agreeing within the 1 C threshold,\
        \ and low confidence. The generator proposes 22 to 30 C, checker-a 22 to 29 C, and checker-b and checker-c\
        \ 23 to 29 C; the median bounds of those agreeing proposals give 23 to 29 C after integer rounding. Species-labelled\
        \ care recommendations include Fishipedia 23 to 28 C, AKVARKO 25 to 27 C and the Bulgarian encyclopedia\
        \ 24 to 28 C. WetWebMedia gives 23 to 27 C for shell-dwellers, while Wet Spot gives 24 to 28 C for the separate\
        \ Kipili form. The decided envelope includes the full natural range and is plausible for aquarium planning,\
        \ but the endpoints are not measured chronic health limits. The broader generator proposal of 22 to 30 C\
        \ lacks direct long-term species evidence, and the Tanganyika.si water account cautions against prolonged\
        \ heat near 30 C. Equality with the natural envelope here reflects aggregation of care targets and the natural-range\
        \ containment rule, not evidence of harm immediately outside it."

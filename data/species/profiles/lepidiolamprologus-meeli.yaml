      value:
        min: 8
        max: 19
      confidence: low
      rationale: "The tally decides 8 to 19 dGH by qualified majority, 4 of 6 agreeing within the 2 dGH threshold,\
        \ with low confidence. The generator proposes 8 to 18, checker-a 8 to 20, checker-b 10 to 18, checker-c\
        \ and tiebreaker-1 8 to 25, and tiebreaker-2 8 to 20 dGH. The four-vote cluster excludes the two 8 to 25\
        \ proposals; its median bounds are 8 and 19. The decision is narrower than the Bulgarian aquarium range\
        \ of 8 to 25 dGH, the related L. boulengeri range of 8 to 25 in Seriously Fish, and the 10 to 20 recommendations\
        \ from AKVARKO and Practical Fishkeeping. Tanganyika.si gives 8 to 20 for lake aquaria; Seachem gives a\
        \ narrower 8 to 14 mineral target; Aquablog gives 10 to 15. The Aquarist Atlas genus range of 7 to 30 is\
        \ broader but not species-specific aquarium evidence. Fishipedia lists 15 to 25 as habitat GH without a\
        \ traceable field measurement, and that does not displace measured lake chemistry or establish long-term\
        \ limits. WetWebMedia supplies a lower bound near 12 without an upper limit; the input encoding of 12 to\
        \ 13 is not a reported closed interval. The selected range contains natural 10 to 13 dGH and separates GH\
        \ from alkalinity. Its upper boundary reflects vote aggregation rather than evidence of injury above 19."

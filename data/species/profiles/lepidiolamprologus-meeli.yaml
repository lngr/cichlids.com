  husbandry:
    text: "For one male and two females, allow at least 130 L with an 85 by 40 cm base, fine sand and several well-spaced\
      \ shell sites. The dimensions are a low-confidence synthesis of conflicting care recommendations. Give each\
      \ female shelter beyond the male's immediate line of sight and enough extra shells for choice. Keep a secure\
      \ cover, maintain effective biological filtration and surface movement, and replace water regularly with water\
      \ of similar chemistry. The planning tolerances are 23 to 29 C, pH 7.8 to 9.4, GH 8 to 19 dGH and alkalinity\
      \ 11 to 22 dKH. These are approximate keeping envelopes rather than proven failure limits; stable conditions\
      \ within them matter more than rapid numerical adjustments."

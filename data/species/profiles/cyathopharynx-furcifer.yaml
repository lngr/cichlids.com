    tolerance:
      value:
        min: 23
        max: 30
      confidence: medium
      rationale: "The tally decides 23 to 30 C with unanimous verification under the allowed 1 C agreement threshold\
        \ and medium confidence. The generator and checker-a proposed 23 to 29 C, checker-b proposed 22 to 30 C,\
        \ and checker-c proposed 23 to 30 C. The wider 22 to 30 C proposal was an inference, not a measured failure\
        \ boundary; its lower endpoint is not retained. Seriously Fish recommends 24 to 27 C, Fishkeeper and FishBase\
        \ 24 to 26 C, and FishFish 23 to 27 C. The decided outer interval contains the natural 23 to 29 C envelope;\
        \ published care ranges describe the better-supported central conditions, and 30 C is an inferred outer\
        \ allowance rather than a preferred continuous setting."

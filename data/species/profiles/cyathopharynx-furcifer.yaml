        accessed: '2026-10-15'
        archived: fishkeeper.co.uk/fish/freshwater/cichlids/furcifer-featherfin-cichlid/2026-10-15T054608Z
  sexing:
    text: "Adult males generally grow larger, develop brighter display colour and carry longer pelvic fins than\
      \ females. Females and juveniles are more subdued and harder to identify reliably. The original C. furcifer\
      \ description agrees with a southern yellow-anal-fin lineage that has blue upper body colour, a pale underside\
      \ and yellow markings. The contrasting black-fin lineage examined in 2012 was reproductively differentiated\
      \ and should not simply be labelled another colour variant of this species. Colour also changes with light\
      \ angle and social status."
    sources:
      - kind: literature
        title: "Takahashi and Hori (2012). Genetic and Morphological Evidence Implies Existence of Two Sympatric\
          \ Species in Cyathopharynx furcifer (Teleostei: Cichlidae) from Lake Tanganyika"
        url: "https://doi.org/10.1155/2012/980879"

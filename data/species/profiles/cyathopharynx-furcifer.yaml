  breeding:
    text: "Females brood the young in their mouths. Courtship centres on a male-built sand crater that may approach\
      \ 60 cm across, sometimes constructed with sand carried onto a flat rock. The female collects eggs during\
      \ spawning, and the male pelvic fin tips help direct the close fertilization sequence. Care accounts describe\
      \ broods numbering a few dozen and incubation of about three to four weeks. Disturbance can interrupt spawning\
      \ or brooding, so provide quiet retreat space and observe the female without unnecessary handling. Newly released\
      \ fry can accept small foods, including crushed vegetable-based flakes."
    sources:
      - kind: database
        title: "Cyathopharynx furcifer, Seriously Fish species page"
        url: "https://www.seriouslyfish.com/species/cyathopharynx-furcifer"

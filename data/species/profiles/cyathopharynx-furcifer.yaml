  diet:
    value:
      type: aufwuchs
      bloatSensitive: true
    confidence: low
    rationale: "The tally makes a conservative decision of aufwuchs with bloatSensitive true, low confidence and\
      \ 2 of 6 agreeing votes. The generator and checker-a proposed omnivore with the flag true; checker-b proposed\
      \ invertivore with the flag true; checker-c proposed omnivore with the flag false; tiebreaker-1 and tiebreaker-2\
      \ proposed aufwuchs with the flag true. Under the fixed rule the most restrictive proposed type and any positive\
      \ sensitivity flag are retained. This is also biologically plausible: Table 1 of Satoh and colleagues (2021)\
      \ classifies C. furcifer, separately from their focal Neolamprologus furcifer, as an algal and detrital herbivore;\
      \ it summarizes earlier feeding work rather than measuring this species diet experimentally. Tanganyika.si\
      \ and the Nordic association emphasize diatoms or microscopic algae, CRC describes detritivory, and Seriously\
      \ Fish and Fishkeeper recommend a plant-based staple. FishBase ecology instead classifies it as mainly animal-feeding,\
      \ but marks its trophic estimate tentative and based on one food item. Aquarium-Ratgeber also emphasizes small\
      \ animal foods; DRTA, Atlarium, Fischlex and community advice allow mixed feeding. Those contrary interpretations\
      \ remain in evidence. The bloat flag translates repeated cautions about rich protein foods and overfeeding\
      \ into a planner constraint, not a proven disease mechanism or quantified incidence. Inherited evidence includes\
      \ each run interpretation of source descriptions, including false flags that indicate missing sensitivity\
      \ evidence rather than demonstrated safety. Older broad species concepts add uncertainty; the conservative\
      \ decision therefore stays low confidence."

  habitat:
    text: "The natural setting is the transition between rock and sand in Lake Tanganyika, with groups moving and\
      \ feeding above the substrate and males occupying sandy nesting patches. Modern specialist accounts distinguish\
      \ southern C. furcifer from other Cyathopharynx farther north, whereas older sources apply the name around\
      \ the lake. The decided natural water envelope is 23 to 29 C, pH 8.4 to 9.4, GH 10 to 13 dGH and KH 15 to\
      \ 20 dKH. These values describe seasonal and regional lake conditions rather than an aquarium set point. Provide\
      \ fine sand, open swimming space and stable rock cover that interrupts views without filling the floor."
    sources:

    archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-fedc1201/2026-10-15T054558Z
  synonyms:
    - name: Paratilapia furcifer
      note: Original combination in the 1898 description.
  legacyNames:
    - Cyathopharynx furcifer
  note: "The current Catalog of Fishes recognizes C. furcifer and C. foae separately and places Tilapia grandoculis\
    \ under C. foae. The older CRC synonym list and some aquarium pages retain grandoculis or foae within a broader\
    \ furcifer concept; that treatment is not followed here. Takahashi and Hori (2012) found distinct southern lineages\
    \ with yellow or black anal fins, but could not settle their assignment to all name-bearing types. Their black-fin\
    \ lineage is therefore not presented here as an established colour variant of C. furcifer. The original combination\
    \ was Paratilapia furcifer; the original genus list was also checked."
names:
  trade:
    en:
      - Featherfin cichlid
      - Featherfin mouthbrooder
      - Furcifer featherfin cichlid
variants:
  - name: Kinyamkolo (Mpulungu)
    kind: locality
    note: Type locality in southern Lake Tanganyika.
  - name: Yellow-anal-fin lineage
    kind: color-morph
    note: The 2012 study associated this southern lineage with the original description of C. furcifer; the contrasting
      black-fin lineage was considered a different species.
features:

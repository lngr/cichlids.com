partners:
  suitable:
    - species: Altolamprologus calvus
      reason: Care guidance names this genus among possible companions that use rock cover. It requires separate
        feeding appropriate to its own diet.
      condition: A sufficiently large layout with separate shelters and nesting space; keep the featherfins confident
        and feeding.
    - species: Larger Cyprichromis species
      reason: Care guidance names larger members as possible companions in the water above the bottom.
      condition: Choose a calm group and monitor competition and fin damage; the minimum for a featherfin harem
        does not automatically provide space for an added school.
  unsuitable:
    - species: Cyathopharynx foae
      reason: Shares the presumed hybrid-risk group and may also compete for similar breeding space; the crossing
        warning is not a confirmed named-pair case.
    - species: Lake Malawi mbuna
      reason: Their assertive territorial and feeding behaviour can suppress the featherfin group in an aquarium.
    - species: Petrochromis species
      reason: Strongly territorial companions can displace featherfins from food and sand areas despite broadly
        compatible plant-based feeding.
    - species: Tropheus moorii
      reason: Assertive feeding and territorial pressure can disturb featherfins; this is a behavioural concern
        even though both are assigned plant-based diets.
profile:
  overview:
    text: "Male featherfins turn an open sandy floor into a display arena, with long pelvic fins and shifting iridescence\
      \ drawing attention to a defended crater. A female-biased group needs a large aquarium and an experienced\
      \ keeper who can maintain water quality and notice social suppression. The accepted name here is Cyathopharynx\
      \ furcifer. Older accounts sometimes combine it with fish now called C. foae or other unresolved forms, so\
      \ a locality label alone does not guarantee current identification."
    sources:
      - kind: database

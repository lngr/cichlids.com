  validName: Cyathopharynx furcifer
  genus: Cyathopharynx
  species: furcifer
  author: "(Boulenger, 1898)"
  source:
    kind: catalog-of-fishes
    title: "Eschmeyer's Catalog of Fishes, Cyathopharynx species list"
    url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Cyathopharynx"

  sizeAndGrowth:
    text: "Plan for adult males around 21 cm and females around 15 cm. Published figures mix standard length and\
      \ total length, and female maxima are less well documented than male size. Juveniles therefore give a poor\
      \ impression of the space an adult group will need. The working lifespan estimate is six to ten years, with\
      \ low confidence because it comes from care-page estimates rather than tracked cohorts. Do not use rapid growth\
      \ or temporary bright colour as evidence that a rich feeding regime is harmless."

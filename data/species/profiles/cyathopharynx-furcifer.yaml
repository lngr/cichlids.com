          \ Species in Cyathopharynx furcifer (Teleostei: Cichlidae) from Lake Tanganyika"
        url: "https://doi.org/10.1155/2012/980879"
        archived: doi.org/10.1155_2012_980879/2026-10-15T054900Z
        accessed: '2026-10-15'
      - kind: website
        title: "Fishkeeper: Furcifer Featherfin Cichlid"

    confidence: high
    rationale: "The settled natural range is 15 to 20 dKH, with high confidence and no verification object. Plisnier\
      \ reports bicarbonate of 5.6 to 6.2 meq/L and carbonate contributions of 0.06 to 1.02 meq/L across lake stations.\
      \ Together with alkalinity around 6.5 to 6.9 meq/L in the other cited lake studies, these support the rounded\
      \ 15 to 20 dKH envelope using dKH = alkalinity in meq/L multiplied by 2.8. Local inflow-influenced low readings\
      \ do not define typical lake water. GH and KH describe different chemical properties and are not substituted\
      \ for one another."

  socialBehavior:
    text: "The recommended aquarium unit is one male with at least three females. This distributes courtship attention\
      \ without requiring competing males in the minimum aquarium. A courting male may pursue females repeatedly\
      \ and defend a large patch around his crater, so hiding without feeding or repeated cornering needs attention\
      \ even before injuries appear. Natural breeding colonies contain neighbouring male sites, but that observation\
      \ does not make a small aquarium suitable for several males. Outside these breeding interactions the species\
      \ also lives and feeds in groups."
    sources:
      - kind: literature
        title: "Takahashi and Hori (2012). Genetic and Morphological Evidence Implies Existence of Two Sympatric\
          \ Species in Cyathopharynx furcifer (Teleostei: Cichlidae) from Lake Tanganyika"

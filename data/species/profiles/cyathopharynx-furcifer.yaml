      lengthCm: 180
      depthCm: 60
    confidence: medium
    rationale: "The generator and checker-b proposed 500 L, 180 by 60 cm; checker-a proposed 365 L, 180 by 45 cm;\
      \ checker-c proposed 600 L, 180 by 60 cm. Component medians are 500 L, 180 cm length and 60 cm depth. Tanganyika.si\
      \ explicitly supports 500 L, Seriously Fish gives about 365 L with a 180 by 45 cm base, and Fishkeeper requires\
      \ about six feet of length. The extra floor width accommodates a male crater approaching 60 cm across and\
      \ escape routes for the chosen one-male, three-female unit; it is a husbandry design allowance rather than\
      \ a dimension quoted by Tanganyika.si. FishFish gives 600 L for five fish, the Nordic association lists 700\
      \ L and 200 cm, and App-aquatic gives the much smaller 230 L without a matching adult-group footprint. The\
      \ larger recommendations concern differently sized groups or precautionary setups; they do not require raising\
      \ this four-fish minimum. Tanganyika.si calls for 1000 L or more with multiple territorial males."

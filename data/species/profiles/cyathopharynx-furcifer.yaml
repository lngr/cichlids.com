    rationale: "The generator and checker-b proposed a harem with three females per male; checker-a proposed four\
      \ females per male; checker-c proposed a group of at least five. FishBase establishes group living in nature\
      \ but not an aquarium minimum. Seriously Fish and Fishkeeper specifically recommend several females per male\
      \ to distribute courtship pressure. One male with three females is the practical unit used for this profile\
      \ and tank minimum; the exact number three is an interpretation of several, not a published tested ratio.\

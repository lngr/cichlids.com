    tolerance:
      value:
        min: 10
        max: 23
      confidence: low
      rationale: "The tally decides 10 to 23 dKH by the median method with low confidence and 3 of 6 agreeing votes.\
        \ The generator and checker-b proposed 15 to 25 dKH, checker-a and both tiebreaker-1 and tiebreaker-2 proposed\
        \ 10 to 20 dKH, and checker-c proposed 10 to 25 dKH. The minima have a median of 10; the maxima have a median\
        \ of 22.5, rounded to 23. The wider upper proposals of 25 dKH are not all retained, and the decision is\
        \ not the intersection of the proposals. No reliable species-specific long-term KH endpoints were found.\
        \ Atlarium recommends 5 to 10 dKH, Fischlex 8 to 15 dKH, and individual aquariums report 11 and 14 dKH;\
        \ these are retained but do not establish health limits, and some stock labels have uncertain modern identity.\
        \ JBL gives an approximately 18 dKH Tanganyika target, while Seachem explains buffering independently of\
        \ GH. The 8 to 25 dGH advice from Seriously Fish is related husbandry context only and cannot be converted\
        \ into a KH tolerance. The decided interval is a weak working estimate that contains natural 15 to 20 dKH;\
        \ it does not establish harm below 10 or above 23. AquaInfo and the attempted JBL blog supplied no relevant\
        \ species or chemistry information, and the inaccessible shop and support-forum pages mentioned by the tiebreakers\
        \ supplied no usable evidence."

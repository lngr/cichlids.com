    value:
      continent: Africa
      region: Lake Tanganyika
      waterbody: lake-tanganyika
    confidence: high
    rationale: "All runs agree on Lake Tanganyika. Older database accounts use a broad, lake-wide species concept;\
      \ the Tanganyika specialist restricts C. furcifer to southern shores and distinguishes other Cyathopharynx\
      \ farther north. The lake is secure, but locality labels from the older broad concept are not accepted as\
      \ a precise current distribution map."

  ph:
    value:
      min: 8.4
      max: 9.4
    confidence: high
    rationale: "The settled natural range is 8.4 to 9.4, with waterbody verification and high confidence. Plisnier\
      \ and colleagues report annual values of 8.47 to 9.40 at 40 m in the northern basin and 8.66 to 9.12 near\
      \ Mpulungu. These are represented by a rounded lake envelope. The older FAO source book gives a wider downward\
      \ departure, pH 7.3 to 7.8; it conflicts with modern measurements and the lake alkalinity and is retained\
      \ as dissenting evidence rather than adopted. Aquarium recommendations of 8.0 to 9.0 describe husbandry instead."
    sources:
      - kind: literature
        title: "Plisnier, P.-D. et al. (1996). Limnological sampling during an annual cycle at three stations on\
          \ Lake Tanganyika (1993-1994). FAO/FINNIDA GCP/RAF/271/FIN-TD/46"
        url: "https://fao.org/fishery/static/LTR/FTP/TD46.PDF"
        accessed: '2026-10-15'
        archived: fao.org/fishery/static/ltr/ftp/td46.pdf/2026-10-14T094054Z
      - kind: literature

  hybridGroups:
    value:
      - cyathopharynx-foae-furcifer
    confidence: medium
    rationale: "All four runs propose cyathopharynx-foae-furcifer and the tally is unanimous with medium confidence.\
      \ Seriously Fish gives a general warning about mixing the two described Cyathopharynx species and their forms.\
      \ The current Catalog recognizes C. foae separately. Takahashi and Hori found restricted gene flow between\
      \ southern morphs; two discordant genetic assignments could reflect incomplete lineage sorting, insufficient\
      \ data or hybridization, and the morphs were not securely assigned to both current names. Neither that study\
      \ nor the aquarium warning establishes a confirmed free-choice cross of the named pair. The group is therefore\
      \ presumed. Taxonomic membership alone and the study possible hybrid explanation are preserved as context,\
      \ not direct crossing records."

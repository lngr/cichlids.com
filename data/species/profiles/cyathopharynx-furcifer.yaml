  diet:
    text: "Use a plant-based staple, including suitable spirulina foods and vegetable material, offered in measured\
      \ portions. The conservative planner category is aufwuchs and the protein-sensitivity flag is set. Algal and\
      \ detrital feeding appears in the scientific literature and specialist accounts, although FishBase also reports\
      \ an animal-oriented plankton classification. That disagreement does not support a meat-heavy aquarium diet.\
      \ Fishkeeper allows small animal foods only occasionally, while Seriously Fish advises avoiding rich meaty\
      \ feeds. The sensitivity flag reflects this husbandry advice and overfeeding concerns; it does not identify\
      \ a disease in an individual fish."

  lifespanYears:
    value:
      min: 6
      max: 10
    confidence: low
    rationale: "The generator proposed 5 to 8 years, checker-a and checker-b 8 to 12, and checker-c 6 to 10. Their\
      \ endpoint medians are 7 and 11 years. Published care-page estimates are weaker: FishFish gives six years\
      \ and Atlarium gives ten, while AI-labelled Fischlex gives up to eight. The median upper endpoint of 11 exceeds\
      \ these read figures, so 6 to 10 is retained as a low-confidence husbandry estimate rather than adopting unsupported\
      \ extra longevity. The inherited ten-year evidence attributed to Aquarist Atlas was not confirmed on re-reading\
      \ that page; its preserved entry is not relied on. Salvagiani discusses roughly four years in the context\
      \ of excessive rich feeding, which is not a normal maximum for well-kept fish. Longitudinal species-specific\
      \ records remain absent."

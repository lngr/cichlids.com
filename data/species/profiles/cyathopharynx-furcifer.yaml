        accessed: '2026-10-15'
        archived: fishkeeper.co.uk/fish/freshwater/cichlids/furcifer-featherfin-cichlid/2026-10-15T054608Z
  problems:
    text: "Repeated chasing, missed meals and loss of display colour can signal social pressure or unsuitable conditions.\
      \ Check oxygenation, filtration, water stability and each fish access to food when a group declines. Rich\
      \ feeding and overfeeding are recurring concerns in specialist accounts; a swollen fish or an unexplained\
      \ death cannot be diagnosed from that warning alone. Old archive illness reports give practical context but\
      \ contain neither reliable diagnoses nor controlled evidence for a particular water limit. A female carrying\
      \ a brood may feed little or not at all, which needs to be distinguished from a persistently suppressed fish.\
      \ The archive search also returned a commercial stock listing and a discussion of dominance-related colour\
      \ changes; neither establishes numerical care limits."
    sources:

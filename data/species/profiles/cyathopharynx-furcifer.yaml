        accessed: '2026-10-15'
        archived: cichlidae.com/article.php/q-4cae6cdd/2026-10-15T054811Z
  compatibility:
    text: "A species aquarium is practical, but peaceful Tanganyika companions are possible in larger setups. Care\
      \ accounts name Altolamprologus and larger Cyprichromis as candidates; actual feeding access and territorial\
      \ overlap matter more than a list of names. Animal-feeding companions require separate suitable food without\
      \ turning the featherfin ration into a protein-rich diet. Strongly assertive mbuna or Petrochromis are poor\
      \ matches, and Tropheus can also impose too much competition despite sharing a plant-based feeding constraint.\
      \ C. foae shares a presumed hybrid-risk group with C. furcifer, based on a specialist care warning rather\
      \ than a confirmed free-choice cross."
    sources:
      - kind: database
        title: "Cyathopharynx furcifer, Seriously Fish species page"

    - field: taxonomy.note
      proposals:
        - by: generator
          value: "The legacy genus Paratilapia was also queried in the Catalog of Fishes on 2026-10-15 (https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Paratilapia;\
            \ archived as researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-ab9b4cff/2026-10-14T102230Z).\
            \ The Catalog's current Cyathopharynx list confirms furcifer as valid and treats foae separately as\
            \ valid. A 2012 genetic study found distinct southern colour lineages but did not resolve their names\
            \ against the type specimens."
        - by: checker-a
          value: "Valid in the Catalog of Fishes. The synonyms Ectodus foae and Tilapia grandoculis are treated\
            \ differently: Cyathopharynx foae is currently valid there (Konings 2015, 2019) and grandoculis is its\
            \ synonym; older revisions (Marechal and Poll 1991) put both under furcifer. The 2012 genetic study\
            \ found two sympatric colour morphs at the southern end of the lake."
        - by: checker-b
          value: "The current Catalog of Fishes lists C. furcifer as valid and also lists C. foae as a separate\
            \ valid species, following later specialist treatments. This differs from the 2012 study and older hobby\
            \ database treatments that regarded foae and grandoculis as synonyms or unresolved colour morphs."
        - by: checker-c
          value: The 2012 genetic and morphological study found two distinct sympatric male colour morphs and called
            for type re-examination. The current Catalog lists C. furcifer as valid and C. foae separately as valid;
            the species boundary of southern populations remains unsettled.
      decision: "The current Catalog of Fishes recognizes C. furcifer and C. foae separately and places Tilapia\
        \ grandoculis under C. foae. The older CRC synonym list and some aquarium pages retain grandoculis or foae\
        \ within a broader furcifer concept; that treatment is not followed here. Takahashi and Hori (2012) found\
        \ distinct southern lineages with yellow or black anal fins, but could not settle their assignment to all\
        \ name-bearing types. Their black-fin lineage is therefore not presented here as an established colour variant\
        \ of C. furcifer. The original combination was Paratilapia furcifer; the original genus list was also checked."
      rationale: The accepted name and original combination agree across all complete profiles. Current Catalog
        status governs the historical synonym conflict; older public CRC and aquarium treatments remain cited. The
        black-fin form is not silently retained as a C. furcifer variant.

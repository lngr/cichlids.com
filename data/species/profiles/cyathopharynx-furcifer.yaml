  ghDgh:
    value:
      min: 10
      max: 13
    confidence: high
    rationale: "The settled natural range is 10 to 13 dGH, with waterbody verification and high confidence. The\
      \ FAO programme measured calcium around 10.9 to 11.6 mg/L and magnesium around 41.2 to 43.2 mg/L at the surface.\
      \ Converting their station pairs gives about 11.1 to 11.5 dGH. The north-basin chemistry of Cohen and colleagues\
      \ gives about 12.2 dGH, and the older Talling data give about 11.35 dGH. Their combined rounded envelope is\
      \ retained; aquarium hardness advice up to 25 dGH is not a natural measurement."

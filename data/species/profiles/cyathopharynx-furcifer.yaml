  husbandry:
    text: "For one male and three females, the minimum is 500 L with a 180 by 60 cm floor. Arrange broad stretches\
      \ of fine sand alongside secure rock structures that let females move out of the male line of sight. Keep\
      \ the biological filter mature, water well oxygenated and maintenance regular. Multiple territorial males\
      \ need substantially more room; the specialist recommendation rises to 1000 L or more. The outer tolerance\
      \ decisions are 23 to 30 C, pH 8.0 to 9.5, GH 8 to 25 dGH and KH 10 to 23 dKH. They are not preferred targets\
      \ at every endpoint: published temperature recommendations mostly lie near 24 to 27 C, and the KH boundaries\
      \ are particularly uncertain."
    sources:
      - kind: database
        title: "Cyathopharynx furcifer, Seriously Fish species page"

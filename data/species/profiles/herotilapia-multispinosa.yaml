  temperatureC:
    value:
      min: 25
      max: 32
    confidence: medium
    rationale: "The tally selects 25 to 32 C by qualified-majority agreement of five of six votes and integer rounding\
      \ of the agreeing endpoints. Generator proposed 24.7 to 30, checker-a 24 to 32, checker-b 24.7 to 33, checker-c\
      \ and tiebreaker-1 24.7 to 32.4, and tiebreaker-2 24.7 to 31 C. Swain measured great-lake surface water at 24.7\
      \ to 28 C and Lacayo Morales and Picado Pavon measured Tipitapa at 28.5 to 32.4 C. The decided interval is therefore\
      \ narrower than the directly measured combined 24.7 to 32.4 C envelope; its rounded endpoints are not physiological\
      \ boundaries. Seriously Fish reports 33 C without a station record and FishBase gives the wider 21 to 36 C environment\
      \ band without accessible primary sampling details. The wetland study spans 23.2 to 34 C, but species occupancy\
      \ at its extreme stations is unconfirmed. Cole (1976) was available only as a repository abstract and has no DOI\
      \ usable by fetch-oa, so its numerical proposal was not independently verified. Coverage of native Honduras and\
      \ Costa Rica populations remains incomplete."

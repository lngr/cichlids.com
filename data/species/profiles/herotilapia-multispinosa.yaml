partners:
  suitable:
    - species: Xiphophorus hellerii
      reason: Adult swordtails represent the robust livebearers recommended in care accounts; fry remain vulnerable.
      condition: Use a larger community tank with overlapping routine water parameters and room outside the brood territory.
    - species: Poecilia sphenops
      reason: Robust adult mollies are a possible peaceful livebearer companion; very small juveniles and fry may be
        eaten.
      condition: Use adequately mineralized freshwater within shared care ranges and a tank larger than the pair minimum.
    - species: Ancistrus cirrhosus
      reason: An adult bristlenose represents the small suckermouth catfish allowed by care accounts; eggs may be disturbed
        or eaten.
      condition: Provide its own wood and shelter in a larger aquarium; this is a group-based husbandry inference rather
        than a tested species pairing.
  unsuitable:
    - species: Parachromis dovii
      reason: A much larger aggressive piscivore can overpower or consume rainbow cichlids.
    - species: Amphilophus citrinellus
      reason: A large territorial adult can dominate and injure a milder rainbow pair.
    - species: Fish fry and adult fish around 2 cm or smaller
      reason: "Level 1 predation allows opportunistic capture of tiny fish, and brood defense adds stress."
profile:
  overview:
    text: "Rainbow cichlids are relatively manageable Central American cichlids with conspicuous colour changes and active\
      \ parental care. Herotilapia multispinosa is native to Honduras, Nicaragua and Costa Rica. Older labels may use\
      \ Archocentrus multispinosus, but the Catalog of Fishes retains Herotilapia. Plan the aquarium around a compatible\
      \ adult pair. Peaceful community keeping is possible when tankmates have enough room outside the breeding territory."
    sources:
      - kind: catalog-of-fishes
        title: "Eschmeyer's Catalog of Fishes: species of Herotilapia, updated 21 September 2026"
        url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Herotilapia"
        accessed: '2026-10-13'
      - kind: database
        title: "Seriously Fish, Herotilapia multispinosa"
        url: "https://www.seriouslyfish.com/species/herotilapia-multispinosa/"
        accessed: '2026-10-13'
      - kind: database
        title: FishProfiles species account for Herotilapia multispinosa
        url: "https://fishprofiles.com/profiles/freshwater/Cichlids/Herotilapia_multispinosa/"
        accessed: '2026-10-13'
  habitat:
    text: "Native populations occupy great-lake margins, river edges, floodplains and seasonal marshes. Soft bottoms,\
      \ vegetation and submerged structures are recurring habitat features. Lake Nicaragua and Lake Managua have different\
      \ mineral chemistry: comparatively modest calcium-magnesium hardness can coexist with much stronger sodium-associated\
      \ alkalinity in Managua. The voted natural ranges are 25 to 32 C, pH 7.0 to 9.3, GH 3 to 7 and KH 3 to 24. These\
      \ rounded summaries are narrower than some measurements shown in the evidence and are not a complete map of conditions\
      \ across the distribution."
    sources:
      - kind: literature
        title: "Swain, F. M. (1966). Bottom sediments of Lake Nicaragua and Lake Managua, western Nicaragua. Journal\
          \ of Sedimentary Research 36."
        url: "https://doi.org/10.1306/74d71500-2b21-11d7-8648000102c1865d"
        accessed: '2026-10-13'
      - kind: literature
        title: Lacayo Morales and Picado Pavon (2022). Calidad y uso potencial de las aguas del rio Tipitapa
        url: "https://doi.org/10.5377/rtu.v11i31.14292"
        accessed: '2026-10-13'
      - kind: database
        title: "FishBase, Herotilapia multispinosa summary"
        url: "https://www.fishbase.se/summary/Herotilapia-multispinosa.html"
        accessed: '2026-10-13'
      - kind: database
        title: "Nordiska Ciklidsallskapet: Herotilapia multispinosa species register"
        url: "https://ciklid.org/artregister/art.php?ID=294"
        accessed: '2026-10-13'
      - kind: database
        title: "FAO: Inland Waters of Latin America, Central America lake inventory and FAO/UN (1961) water analyses"
        url: "https://www.fao.org/4/ad770b/AD770B13.htm"
        accessed: '2026-10-13'
  sizeAndGrowth:
    text: "Use about 12 cm as the adult aquarium planning ceiling for either sex. Males are often larger on average,\
      \ but the numerical female maximum varies among accounts. Exceptional database lengths near 17 cm describe species\
      \ records rather than typical captive adults. A five to eight year lifespan is a tentative care estimate; it is\
      \ neither a guaranteed survival period nor an established maximum."
    sources:
      - kind: database
        title: FishProfiles species account for Herotilapia multispinosa
        url: "https://fishprofiles.com/profiles/freshwater/Cichlids/Herotilapia_multispinosa/"
        accessed: '2026-10-13'
      - kind: database
        title: "Aqua-Fish: Rainbow cichlid care guide"
        url: "https://en.aqua-fish.net/fish/rainbow-cichlid"
        accessed: '2026-10-13'
      - kind: database
        title: "FishBase, Herotilapia multispinosa summary"
        url: "https://www.fishbase.se/summary/Herotilapia-multispinosa.html"
        accessed: '2026-10-13'
      - kind: database
        title: B-Aqua. Herotilapia multispinosa.
        url: "https://www.b-aqua.com/pages/Fiche.aspx?Id=525"
        accessed: '2026-10-13'
      - kind: website
        title: "Aquarismo Paulista: Ciclideo Arco Iris, Herotilapia multispinosa species record"
        url: "https://www.aquarismopaulista.com/herotilapia-multispinosa/"
        accessed: '2026-10-13'
  husbandry:
    text: "Provide one settled pair with at least 160 L nominal volume and a footprint of 100 by 40 cm. Fine sand, plants,\
      \ secure wood and smooth stones allow shelter and spawning choices. Use efficient filtration with sheltered areas\
      \ away from strong flow, and maintain water quality through regular partial changes. Around 24 to 27 C and stable\
      \ pH 7 to 8 have better routine husbandry support than the extreme habitat values. The outer tolerances of 22 to\
      \ 33 C, pH 6.5 to 9.3, GH 3 to 20 and KH 3 to 24 include native conditions, but the high temperature, pH and KH\
      \ endpoints lack years-long captive evidence. Community stocking and multiple adult pairs require more floor area."
    sources:
      - kind: literature
        title: "Swain, F. M. (1966). Bottom sediments of Lake Nicaragua and Lake Managua, western Nicaragua. Journal\
          \ of Sedimentary Research 36."
        url: "https://doi.org/10.1306/74d71500-2b21-11d7-8648000102c1865d"
        accessed: '2026-10-13'
      - kind: database
        title: "John de Lange, Herotilapia multispinosa, AquaInfo species account"
        url: "https://aquainfo.nl/en/article/herotilapia-multispinosa-rainbow-cichlid/"
        accessed: '2026-10-13'
      - kind: database
        title: "Seriously Fish, Herotilapia multispinosa"
        url: "https://www.seriouslyfish.com/species/herotilapia-multispinosa/"
        accessed: '2026-10-13'
      - kind: database
        title: FishProfiles species account for Herotilapia multispinosa
        url: "https://fishprofiles.com/profiles/freshwater/Cichlids/Herotilapia_multispinosa/"
        accessed: '2026-10-13'
      - kind: database
        title: "FAO: Inland Waters of Latin America, Central America lake inventory and FAO/UN (1961) water analyses"
        url: "https://www.fao.org/4/ad770b/AD770B13.htm"
        accessed: '2026-10-13'
      - kind: website
        title: "Fishkeeper, Maidenhead Aquatics. Rainbow Cichlid, Archocentrus multispinosus."
        url: "https://www.fishkeeper.co.uk/fish/freshwater/cichlids/rainbow-cichlid"
        accessed: '2026-10-13'
  socialBehavior:
    text: "Adult pairs are the recommended social unit. Rival adults and other fish can be chased repeatedly around the\
      \ brood, and the defended area may expand substantially once fry begin moving. Outside active breeding the species\
      \ usually interacts more mildly. Both aggression scores are level 2, which describes territorial chasing in suitable\
      \ accommodation rather than habitual serious injury. Keep sight lines broken and watch for an adult that cannot\
      \ feed or leave its refuge. Group reports do not justify crowding several pairs into the minimum tank."
    sources:
      - kind: database
        title: FishProfiles species account for Herotilapia multispinosa
        url: "https://fishprofiles.com/profiles/freshwater/Cichlids/Herotilapia_multispinosa/"
        accessed: '2026-10-13'
      - kind: database
        title: "Nordiska Ciklidsallskapet: Herotilapia multispinosa species register"
        url: "https://ciklid.org/artregister/art.php?ID=294"
        accessed: '2026-10-13'
      - kind: database
        title: "FishBase, Herotilapia multispinosa summary"
        url: "https://www.fishbase.se/summary/Herotilapia-multispinosa.html"
        accessed: '2026-10-13'
      - kind: database
        title: "Seriously Fish, Herotilapia multispinosa"
        url: "https://www.seriouslyfish.com/species/herotilapia-multispinosa/"
        accessed: '2026-10-13'
  diet:
    text: "Feed a varied omnivorous ration with a substantial plant component. Balanced pellets or flakes, spirulina\
      \ foods and edible algae can be complemented by small portions of Artemia or insect larvae. The species predominantly\
      \ consumes algae and detritus in nature but can take animal foods and tiny fish. A live-worm experiment found impaired\
      \ growth and tissue changes, so a worm-dominated ration is poorly supported. No specific recurrent bloat syndrome\
      \ is established; the false bloat flag does not imply that rich food is harmless in unlimited amounts."
    sources:
      - kind: literature
        title: Effects of live food feeding on growth performance and some histological parameters of Herotilapia multispinosa
          and Amatitlania nigrofasciata. Aquatic Sciences and Engineering
        url: "https://doi.org/10.26650/ase201818018"
        accessed: '2026-10-13'
      - kind: literature
        title: Assessment of egg quality and quantity of Herotilapia multispinosa fed with two different protein/fat
          ratio feeds. Acta Scientific Nutritional Health
        url: "https://doi.org/10.31080/asnh.2018.02.0110"
        accessed: '2026-10-13'
      - kind: literature
        title: Latent feeding behaviors support trophic versatility in cichlids. Journal of Experimental Biology
        url: "https://doi.org/10.1242/jeb.251609"
        accessed: '2026-10-13'
      - kind: database
        title: "Seriously Fish, Herotilapia multispinosa"
        url: "https://www.seriouslyfish.com/species/herotilapia-multispinosa/"
        accessed: '2026-10-13'
      - kind: database
        title: "Nordiska Ciklidsallskapet: Herotilapia multispinosa species register"
        url: "https://ciklid.org/artregister/art.php?ID=294"
        accessed: '2026-10-13'
  breeding:
    text: "Pairs lay adhesive eggs on a cleaned exposed surface and protect the developing brood. Both adults participate,\
      \ with the female often attending eggs and the male guarding the surrounding area. After hatching, larvae may be\
      \ moved to pits or attached to vegetation or wood; this is still open substrate spawning. Hatching commonly takes\
      \ about two to three days, with free swimming several days later depending on temperature. Small live or suitably\
      \ powdered foods are used once fry begin feeding. Breeding in a separate aquarium can improve brood survival."
    sources:
      - kind: literature
        title: Borstein (2000). Herotilapia multispinosa husbandry and breeding report. Greater Chicago Cichlid Association.
        url: "https://www.gcca.net/art-pics/cichlid-profiles-list/central-american-cichlids/131-herotilapia-multispinosa.html"
        accessed: '2026-10-13'
      - kind: database
        title: "Seriously Fish, Herotilapia multispinosa"
        url: "https://www.seriouslyfish.com/species/herotilapia-multispinosa/"
        accessed: '2026-10-13'
      - kind: database
        title: "Nordiska Ciklidsallskapet: Herotilapia multispinosa species register"
        url: "https://ciklid.org/artregister/art.php?ID=294"
        accessed: '2026-10-13'
      - kind: database
        title: "John de Lange, Herotilapia multispinosa, AquaInfo species account"
        url: "https://aquainfo.nl/en/article/herotilapia-multispinosa-rainbow-cichlid/"
        accessed: '2026-10-13'
  sexing:
    text: "Sexing young fish or a single adult can be difficult. Mature males often have more extended dorsal and anal\
      \ fin tips and may be larger, while females can be fuller through the abdomen. Size alone is unreliable because\
      \ adult estimates overlap. Observe several mature fish and actual pairing rather than relying on one colour mark\
      \ or an assumed 10 cm female limit."
    sources:
      - kind: literature
        title: Borstein (2000). Herotilapia multispinosa husbandry and breeding report. Greater Chicago Cichlid Association.
        url: "https://www.gcca.net/art-pics/cichlid-profiles-list/central-american-cichlids/131-herotilapia-multispinosa.html"
        accessed: '2026-10-13'
      - kind: database
        title: "Nordiska Ciklidsallskapet: Herotilapia multispinosa species register"
        url: "https://ciklid.org/artregister/art.php?ID=294"
        accessed: '2026-10-13'
      - kind: database
        title: "Seriously Fish, Herotilapia multispinosa"
        url: "https://www.seriouslyfish.com/species/herotilapia-multispinosa/"
        accessed: '2026-10-13'
      - kind: database
        title: FishProfiles species account for Herotilapia multispinosa
        url: "https://fishprofiles.com/profiles/freshwater/Cichlids/Herotilapia_multispinosa/"
        accessed: '2026-10-13'
  compatibility:
    text: "Choose peaceful companions too large to fall into the tiny-fish prey category. Robust adult livebearers, suitable\
      \ medium-sized tetras and selected catfish are possibilities in an aquarium larger than the pair minimum, with\
      \ overlapping routine water requirements and separate refuges. Fry and very small fish may be eaten. Large aggressive\
      \ Central American cichlids can overwhelm the rainbow pair, and even peaceful companions may be displaced during\
      \ brood care. No evidenced curated hybrid group is assigned; this reflects incomplete crossing evidence rather\
      \ than proof that hybridization cannot occur."
    sources:
      - kind: literature
        title: Borstein (2000). Herotilapia multispinosa husbandry and breeding report. Greater Chicago Cichlid Association.
        url: "https://www.gcca.net/art-pics/cichlid-profiles-list/central-american-cichlids/131-herotilapia-multispinosa.html"
        accessed: '2026-10-13'
      - kind: literature
        title: "McMahan et al. (2015), Taxonomy and systematics of the herichthyins (Cichlidae: Tribe Heroini), with\
          \ the description of eight new Middle American genera. Zootaxa 3999"
        url: "https://doi.org/10.11646/zootaxa.3999.2.3"
        accessed: '2026-10-13'
      - kind: database
        title: "Seriously Fish, Herotilapia multispinosa"
        url: "https://www.seriouslyfish.com/species/herotilapia-multispinosa/"
        accessed: '2026-10-13'
      - kind: database
        title: FishProfiles species account for Herotilapia multispinosa
        url: "https://fishprofiles.com/profiles/freshwater/Cichlids/Herotilapia_multispinosa/"
        accessed: '2026-10-13'
      - kind: database
        title: "John de Lange, Herotilapia multispinosa, AquaInfo species account"
        url: "https://aquainfo.nl/en/article/herotilapia-multispinosa-rainbow-cichlid/"
        accessed: '2026-10-13'
      - kind: website
        title: "Fishkeeper, Maidenhead Aquatics. Rainbow Cichlid, Archocentrus multispinosus."
        url: "https://www.fishkeeper.co.uk/fish/freshwater/cichlids/rainbow-cichlid"
        accessed: '2026-10-13'
  problems:
    text: "The main practical problems are overlapping brood territories, tankmates that are too small or too aggressive,\
      \ and uneven access to food. Separate fish if persistent chasing leaves an individual cornered or injured. Avoid\
      \ relying on the species' tolerance of temporary poor conditions as a maintenance method. A strongly worm-based\
      \ ration can affect growth and digestive tissues. Maximum natural heat or alkalinity should not be treated as a\
      \ daily aquarium target, because the highest outer tolerance values have limited chronic-health evidence."
    sources:
      - kind: literature
        title: Effects of live food feeding on growth performance and some histological parameters of Herotilapia multispinosa
          and Amatitlania nigrofasciata. Aquatic Sciences and Engineering
        url: "https://doi.org/10.26650/ase201818018"
        accessed: '2026-10-13'
      - kind: literature
        title: "Swain, F. M. (1966). Bottom sediments of Lake Nicaragua and Lake Managua, western Nicaragua. Journal\
          \ of Sedimentary Research 36."
        url: "https://doi.org/10.1306/74d71500-2b21-11d7-8648000102c1865d"
        accessed: '2026-10-13'
      - kind: database
        title: FishProfiles species account for Herotilapia multispinosa
        url: "https://fishprofiles.com/profiles/freshwater/Cichlids/Herotilapia_multispinosa/"
        accessed: '2026-10-13'

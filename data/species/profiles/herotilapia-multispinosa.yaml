    confidence: high
    rationale: "The four proposals describe the same native Honduras-Nicaragua-Costa Rica range with different locality\
      \ detail. The final region combines their Atlantic and Pacific coverage, and the locality list adds the Costa Rican\
      \ checklist's San Carlos and Nicoya records to the river and great-lake localities proposed by the runs. The Catalog\
      \ identifies Managua as the type locality and the Cocibolca fish inventory independently records the species in\
      \ Lake Nicaragua. The Hungarian hot-spring population is introduced. A null waterbody avoids assigning one lake's\
      \ chemistry to this widespread species."

  ph:
    value:
      min: 7
      max: 9.3
    confidence: medium
    rationale: "The tally decides pH 7.0 to 9.3 by qualified-majority agreement of five of six votes. Generator, checker-b,\
      \ checker-c and tiebreaker-1 proposed 7.0 to 9.3, checker-a 8.0 to 9.3, and tiebreaker-2 7.0 to 9.6. FAO/UN habitat\
      \ data support pH 7.0 in Lake Nicaragua; Swain measured 8.2 to 8.9 there and 8.9 to 9.3 in Managua. ILEC surface\
      \ means near 9.2 independently support alkaline Managua water. These records take precedence over aquarium recommendations.\
      \ The decided range is narrower than the 7.0 to 9.6 range attributed to Cole by tiebreaker-2, including an INFONAC\
      \ shallow-water observation; only the repository abstract could be read under the DOI-only full-text procedure,\
      \ so that wider numerical claim is retained as an unverified proposal rather than a measurement evidence entry.\
      \ The habitat envelope is incompletely sampled across the native river and marsh range."
    sources:

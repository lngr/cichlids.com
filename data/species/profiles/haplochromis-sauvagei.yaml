  sizeAndGrowth:
    text: "Use approximately 12 cm for an adult male and 10 cm for a female when planning stock. Modern aquarium
      accounts differ: one keeper reports about 11 and 8 cm by sex, while general profiles give 12 to 14 cm
      without reliable sex separation. The chosen maxima are approximate. FishBase and an older breeding
      article report standard lengths, which exclude the tail, but their historical sauvagei identification
      needs care. No species-specific growth timetable or documented lifespan distribution was established;
      the only explicit longevity estimate found is about four years and has low confidence."
    sources:

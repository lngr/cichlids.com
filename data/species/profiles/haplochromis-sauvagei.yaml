  husbandry:
    text: "The minimum planning unit is one male with three females in about 150 L, at least 100 cm long and about
      40 cm deep. Divide the bottom with secure rockwork and several retreats, leaving swimming room between
      the structures. The 40 cm depth is an inferred footprint. More males or substantial tankmates need
      additional room. Use efficient biological filtration, aeration and regular partial water changes.
      Husbandry recommendations commonly favor the mid-20s C and pH around 7 to 8.5. Decided tolerances are 22
      to 30 C, pH 6.8 to 9.5, 1 to 30 dGH and 2 to 14 dKH; the broad chemistry intervals are uncertain
      planning allowances, not preferred targets or measured failure thresholds."
    sources:

  diet:
    text: "The decided feeding category is invertivore. Species-specific accounts emphasize insect larvae and
      other small animals among attached growth, with algae also taken. Offer suitably sized pellets or flakes
      and varied invertebrate foods, with some vegetable material. The retained feature list includes
      gastropods and copepods, but the older detailed snail-feeding records under sauvagei have uncertain
      identity after the taxonomic correction. Those records do not justify making snails the essential
      staple. No specific bloat sensitivity was established. Predation level 0 permits incidental fry capture
      and does not guarantee safety for released fry."

        crossing group has been established."
profile:
  overview:
    text: "Rock kribensis is the aquarium name for a colorful Lake Victoria haplochromine. The Catalog accepts
      Haplochromis sauvagei, and a later genetic study explicitly connects rock kribensis with that nominal
      species. Some aquarium registers and CRC still retain an undescribed label. This profile follows the
      accepted species name while preserving the requested trade-form identifier. It should not be confused
      with West African Pelvicachromis kribensis."
    sources:
      - *a1
      - *a77
      - *a4
      - *a7
      - *a3
      - *a11
      - *a78
      - *a67
      - *a9
      - *a2
  habitat:
    text: "Identified rock kribensis populations occupy the Lake Victoria rocky littoral. The association reports
      fish at about 1 to 6 m around shores and islands, including Makobe Island, Mwanza Gulf and Entebbe.
      Sandy areas between stable stones provide usable ground and shelter. One nearshore study recorded 24.9
      to 32.3 C across sheltered bays; the high local observation is outside the typical regional planning
      envelope and is not a keeping target. Natural lake chemistry is dilute: 1 to 3 dGH and 2 to 6 dKH, with
      a regional temperature envelope of 22 to 30 C and pH 6.8 to 9.4. These bounds combine different sites
      and seasons; they do not describe a daily cycle to reproduce in one tank. Older reports of sand-dwelling
      snail specialists under sauvagei may refer to H. fischeri."
    sources:
      - *a13
      - *a14
      - *a53
      - *a2
      - *a26

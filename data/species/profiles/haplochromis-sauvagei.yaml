  socialBehavior:
    text: "A suitable harem develops a hierarchy, with males defending rock sites and intensifying courtship
      during spawning. Several females reduce concentrated pursuit of one fish. Local chasing fits aggression
      level 2 toward both conspecifics and other species, although crowded tanks or skewed ratios can produce
      more serious conflict. Provide distinct retreats and watch individuals that remain hidden, lose
      condition or develop damaged fins. A small territory is a husbandry interpretation; the available field
      account does not restrict territorial behavior to breeding."

  sexing:
    text: "Adult males tend to grow larger and display stronger color than females. Red and yellow are common, but
      the association also records white-backed or blue-black males and red forms; a current breeder
      additionally reports orange and green males. Markings change with dominance and disturbance, sometimes
      showing horizontal lines and sometimes a checker-like pattern. Females are often yellow or subdued in
      color. Egg spots and adult behavior can help with sexing, but color in juveniles or stressed fish can
      mislead."
    sources:
      - *a53
      - *a14
      - *a25

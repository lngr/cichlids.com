      - *a34
  problems:
    text: "The main documented husbandry concerns are concentrated courtship pressure, inadequate refuge and
      unstable water quality. Secure stones against digging and check that pursued females can escape view.
      Loss of appetite, rapid breathing, persistent hiding or damaged fins warrant attention to the stock and
      water conditions. General African-lake hard-water advice should not be mistaken for Lake Victoria
      measurements. Published GH and KH recommendations differ greatly, and the decided upper bounds remain
      uncertain. Identification matters when using older sauvagei records: ecological and breeding
      observations made before the corrected name may concern another fish. No species-specific disease
      syndrome was confirmed."

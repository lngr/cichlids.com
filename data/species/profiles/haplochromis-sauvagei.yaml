    tolerance:
      value:
        min: 22
        max: 30
      confidence: "medium"
      rationale: "All four proposals are 22 to 30 C, so the unanimous tally is retained at medium confidence.
        FishProfiles explicitly gives this interval; the association recommends 22 to 28 C and Maidenhead 24
        to 26 C. It contains the natural lake envelope and is supported independently of simply copying that
        envelope. Multihobby reports keeping acclimated fish at 21 to 22 C and Garnelio's summary gives 20 to
        25 C, a wider lower extension than this decision; those observations are retained, but do not change
        the settled tally or establish multiyear performance at those endpoints. Mbonde and colleagues record
        natural bay temperatures up to 32.3 C, above the decided maximum, without demonstrating long-term
        keeping at that endpoint."

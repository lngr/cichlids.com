  temperatureC:
    value:
      min: 22
      max: 30
    confidence: "high"
    rationale: "The settled waterbody decision is 22 to 30 C at high confidence. FAO compiles 23 to 28 C surface
      readings, Burgis and colleagues report gulf temperatures up to 29 C, and Orina and colleagues report
      site means from 23.4 to 29.5 C. These support the rounded regional envelope. The retained temperature
      advice from care pages is aquarium guidance. Ancillary lake sources are retained for traceability; the
      Makaka page could not be fetched and contributes no new measurement. Mbonde and colleagues report a
      wider upper extension, 24.9 to 32.3 C in nearshore bays. The required regional envelope remains 22 to 30
      C because those locally heated bay observations do not establish usual conditions for this rock-dwelling
      fish."

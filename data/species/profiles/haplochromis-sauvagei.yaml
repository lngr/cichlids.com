  breeding:
    text: "Females mouthbrood the eggs and developing young, while the male defends and displays from a spawning
      site. Accounts report roughly 17 days to four weeks of carrying, depending on conditions and the stage
      counted. Reported broods vary from around 20 to 30 to more than 40 young. Give brooding females quiet
      refuge and avoid unnecessary handling. Newly independent fry can take very small invertebrate foods and
      finely sized prepared feed. The recommended harem describes aquarium management rather than a permanent
      pair bond."
    sources:

      - *a33
      - *a34
      - *a31
  compatibility:
    text: "Species-only housing is optional: carefully selected calm, robust companions can share a sufficiently
      large tank when water tolerances and diets overlap. Current breeder advice includes selected Malawi
      peacocks and Synodontis, rather than every member of those groups. Avoid fish that crowd the same sites
      or persistently attack quieter fish. Tiny or delicate companions can suffer during breeding disputes
      even though purposeful fish predation is not established. No supported named hybrid group was located.
      General warnings about mixing Victorian breeding lines remain relevant, but they do not establish a
      documented cross with any particular species."
    sources:

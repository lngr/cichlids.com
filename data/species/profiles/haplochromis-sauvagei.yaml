  legacyNames: &a90
    - "Paralabidochromis spec. \"rock kribensis\""
    - "Paralabidochromis sauvagei 'rock kribensis'"
  note: "The Catalog accepts Haplochromis sauvagei and records rediscovery of its original holotype; its
    Paralabidochromis list contains only P. victoriae. Takeda et al. (2013) explicitly identify their rock
    kribensis as H. sauvagei and distinguish it from sauvagei sensu Greenwood, now H. fischeri. NCBI
    independently records the same name correction. This supports described status despite checker A, both
    tie-breakers, the trade-form registry and CRC retaining an undescribed form. The separate CRC trade-form
    page and the association's inconsistent naming remain cited. The identification follows the read 2013
    study, which cites the Seegers (2008) revision, alongside the Catalog and NCBI notes. The requested
    profile ID is retained as the legacy trade-form identifier."

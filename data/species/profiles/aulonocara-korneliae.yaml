        \ 27.8 C, and Seriously Fish gives 23 to 29 C for A. stuartgranti. The wider 20 to 30 C proposals extend\
        \ below the decision, but their 20 C minimum is an inferred margin without a species-specific long-term\
        \ observation. The adopted outer endpoints are provisional allowances, not demonstrated injury thresholds\
        \ or recommended routine settings."

    confidence: high
    rationale: "All four complete profiles propose 21 to 29 C, and the settled tally retains this regional Lake\
      \ Malawi range with waterbody verification and high confidence. It combines seasonal lake observations, rather\
      \ than claiming that every endpoint was measured at Chizumulu. Vollmer et al. describe summer surface water\
      \ around 28 C and winter water below 24 C; their discussion attributes additional cooling in the southeastern\
      \ arm to Eccles. The 23 to 25 C historical interval compiled by FAO and the 25.4 C northern-basin point in\
      \ Branchu are narrower observations within that regional synthesis. Inherited evidence that assigns the entire\
      \ 21 to 29 C synthesis to one study is retained as a synthesis, not a single-study measurement."

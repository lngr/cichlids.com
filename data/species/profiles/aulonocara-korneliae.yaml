    condition: "Confirm the catfish species, adult size and shelter needs before stocking."
  unsuitable:
  - species: Other Aulonocara species and aquarium lines
    reason: The presumed aulonocara group records crossing warnings; similar males may also provoke rivalry.
  - species: Sciaenochromis fryeri
    reason: The presumed cross-genus group reflects reports of fryeri males spawning with peacock females and pursuing
      their males.
  - species: Aggressive Lake Malawi mbuna
    reason: Boisterous or territorial mbuna may injure this relatively peaceful peacock or prevent it feeding.
profile:
  overview:
    text: "Around Chizumulu Island in Lake Malawi, this peacock searches sandy feeding patches beside rocks. Breeding\
      \ males show blue with an orange-gold shoulder, while females are smaller and less conspicuous. A practical\
      \ aquarium group consists of one male and three females. It is a relatively peaceful Malawi cichlid, but territory\
      \ defense and uncertain crosses make the choice of companions important."
    sources:
    - *id003
    - *id026
    - *id009
    - *id001
    - *id002
    - *id016
  habitat:
    text: "The known range is centered on Chizumulu Island, with the type locality on its eastern coast and Same\
      \ Bay documented by CRC. Rocky cover adjoins the sand used for feeding; locality accounts describe shallow\
      \ intermediate habitat, often around 3 to 10 m. The regional natural-water envelope is 21 to 29 C, pH 7.7\
      \ to 8.6, 3 to 5 dGH and 5 to 8 dKH. Lake studies show that low calcium and magnesium hardness can coexist\
      \ with appreciable bicarbonate alkalinity. These regional values combine observations across the lake and\
      \ seasons; they are not all measurements made beside this island."
    sources:
    - *id001
    - *id003
    - *id028
    - *id026
    - *id007
    - *id012
    - *id011
    - *id002
    - *id022
    - *id005
  sizeAndGrowth:
    text: "Use about 12 cm for an adult male and 10 cm for a female when planning space. Published aquarium sizes\
      \ vary, and some accounts give larger fish. FishBase records 7.8 cm standard length, a measurement that leaves\
      \ out the tail and does not provide a female maximum. Juveniles need room to grow and enough feeding access\
      \ without excessive portions. The estimated lifespan of 6 to 9 years is a planning allowance around sparse\
      \ care-sheet figures, not a measured limit."
    sources:
    - *id026
    - *id003
    - *id013
    - *id009
    - *id014
    - *id002
  husbandry:
    text: "Plan roughly 375 litres with at least 120 cm length and about 50 cm depth for one male with three females.\
      \ Keep much of the floor available as fine sand, with stable rockwork forming retreats and interrupting sightlines.\
      \ Provide established biological filtration, good gas exchange and regular partial water changes. A routine\
      \ temperature near 24 to 26 C and stable alkaline pH sit within the published care advice. The broader compatibility\
      \ tolerances are 21 to 30 C, pH 7.5 to 8.7, 3 to 19 dGH and 5 to 15 dKH; their outer endpoints are provisional.\
      \ Measure GH and KH separately rather than raising calcium hardness merely because Malawi water is alkaline."
    sources:
    - *id009
    - *id026
    - *id013
    - *id021
    - *id007
    - *id016
    - *id005
  socialBehavior:
    text: "A male courts females from a small site, often near sheltered rockwork. Females may feed together away\
      \ from his display area, and the adults do not maintain a lasting pair bond. The recommended three females\
      \ per male spread courtship pressure; give each female routes out of view. Conspecific chasing can establish\
      \ a hierarchy, while defense toward other species is usually concentrated near the male. Additional males\
      \ require substantially more room and careful observation."
    sources:
    - *id009
    - *id026
    - *id013
    - *id028
    - *id033
  diet:
    text: "Small substrate-associated invertebrates are the natural prey. Supply appropriately sized prepared cichlid\
      \ food and varied invertebrate foods, such as frozen small crustaceans, in measured portions. Food should\
      \ reach every member of the group. Related-species experiments support a role for the lateral line in locating\
      \ prey; they do not test every food choice of korneliae. Predation level 0 allows accidental fry capture,\
      \ and the absence of a special bloat-sensitivity flag does not remove the risks of overfeeding or poor water\
      \ quality."
    sources:
    - *id003
    - *id009
    - *id010
    - *id029
    - *id002
    - *id013
  breeding:
    text: "The female carries the eggs and developing young in her mouth after spawning near the male's site. The\
      \ Nordic account reports release after about 20 to 22 days, while aquarium observations in the archive confirm\
      \ females holding broods. Reduce disturbance around a brooding female and protect released young from tankmates.\
      \ Newly released fry can take suitably small foods. Keeping one peacock species in a breeding setup helps\
      \ preserve identifiable offspring."
    sources:
    - *id028
    - *id009
    - *id041
    - *id015
    - *id013
  sexing:
    text: "A mature displaying male is larger and predominantly blue, with warm shoulder coloration and anal-fin\
      \ egg spots. Females remain subdued in brown or grey tones. Young fish and subordinate males can be difficult\
      \ to identify from color alone, and egg spots by themselves do not establish sex. Collection locality and\
      \ the appearance of mature fish are more useful than a trade label when confirming identity."
    sources:
    - *id026
    - *id009
    - *id010
    - *id020
    - *id013
    - *id016
  compatibility:
    text: "Peaceful Malawi non-mbuna and suitably sized lake catfish are possible companions when their space and\
      \ water needs also fit. The minimum tank here covers the recommended korneliae group, so adding other adults\
      \ needs additional capacity. Forceful mbuna can suppress or injure it; the archive includes a report of fin\
      \ damage in a mixed mbuna tank. Other Aulonocara and Sciaenochromis fryeri carry presumed crossing risks.\
      \ Those group warnings do not establish a confirmed cross involving this particular species, but broad community-tank\
      \ recommendations do not resolve the uncertainty."
    sources:
    - *id009
    - *id026
    - *id015
    - *id034
    - *id038
    - *id042
    - *id013
  problems:
    text: "Loss of feeding access, repeated pursuit, damaged fins and declining water quality are useful reasons\
      \ to review the setup. Provide cover that permits escape without blocking the sandy feeding area. The Nordic\
      \ account notes vulnerability of the large eyes to handling injuries, so handle fish carefully. Avoid excess\
      \ food and sudden changes to water chemistry. Unexpected offspring from mixed peacock stocks may have uncertain\
      \ ancestry even when they resemble a familiar species."
    sources:
    - *id009
    - *id013
    - *id015
    - *id033
    - *id016

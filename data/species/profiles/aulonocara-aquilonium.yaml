      rationale: "Retain the tally qualified-majority decision of pH 7.5 to 8.6 with medium confidence. Generator,
        checker-c, tiebreaker-1 and tiebreaker-2 proposed 7.5 to 8.6; checker-a and checker-b proposed 7.5 to
        9.0. Nordic and Fischlexikon species advice gives 7.5 to 8.5, Atlas gives 7.8 to 8.5, and the natural
        maximum requires inclusion of 8.6. The chosen range is narrower than the 7.5 to 9.0 range in Seriously
        Fish for A. stuartgranti and A. baenschi, retained as indirect evidence. Species-specific guidance
        supports the lower ceiling more directly than transferring a congener endpoint; these are husbandry
        recommendations rather than experimentally established failure limits. The English AquaInfo page was
        unreadable, its Dutch response incomplete, and AquaPortail blocked access, so those retained sources
        supply no water evidence."

      up to 2 cm, so the rubric permits incidental fry-taking at level 0 without requiring level 1. This does
      not establish that every fry is safe. FishBase provides habitat context but no measured diet; the
      Schwalbe study was readable only as a repository abstract and tests invertebrate detection in A.
      stuartgranti, not fish predation in aquilonium. CRC's public entry gives no feeding statement. The
      aquilonium forum search found no species-specific experience."

  habitat:
    text: "Records concentrate around Mdoka and Ngara on the northwestern shore; Malawi-Guru additionally reports
      Charo. FishBase gives depths of 12 to 25 m. The lake-wide natural envelope is 21 to 29 C, pH 7.7 to 8.6,
      GH 3 to 5 dGH and KH 5 to 8 dKH. These regional values are not a series of measurements at every
      collecting site. Alkalinity can exceed total hardness because the measurements describe different
      dissolved components."

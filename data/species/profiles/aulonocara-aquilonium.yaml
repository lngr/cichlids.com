    rationale: "Retain both aulonocara and sciaenochromis-fryeri-aulonocara by qualified majority, five of six
      votes, with medium confidence. Generator proposed aulonocara alone; checker-a, checker-b, checker-c,
      tiebreaker-1 and tiebreaker-2 proposed both. Seriously Fish and Practical Fishkeeping support
      genus-level peacock crossing warnings; species-specific specialist pages and forum thread 1229 provide
      further husbandry context. Seriously Fish reports S. fryeri spawning with Aulonocara females, and
      Maidenhead Aquatics warns of the same pairing. Neither identifies an aquilonium parent or establishes
      free choice of same-species mates. Both curated groups therefore retain presumed basis; their existing
      memberships already include this species. Threads 447, 3490 and 3633 add no verified aquilonium cross,
      and the repeated Atlas account is not independent evidence."

      value:
        min: 21
        max: 29
      confidence: low
      rationale: "The tally decides 21 to 29 C, unanimous under the one-degree agreement rule, with low confidence.
        Generator, checker-a and checker-c proposed 21 to 29 C; checker-b proposed 21 to 30 C. Nordic species
        advice gives 23 to 28 C, Einrichtungsbeispiele gives 24 to 26 C, and related Seriously Fish sheets
        give 23 to 29 C or 25 to 29 C. The practical envelope contains the mandatory natural interval. It
        happens to equal that interval but is not evidence of harm outside it: no cited aquilonium study tests
        chronic thermal boundaries, and the added 30 C proposal has no direct long-term support."

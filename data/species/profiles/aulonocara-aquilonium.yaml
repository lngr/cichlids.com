  husbandry:
    text: "Allow at least 300 L with a 130 by 45 cm floor for one male and four females, and add room for
      companions. Preserve a broad fine-sand bed, with stable rocks and sheltered areas around its edges.
      Maintain effective filtration and steady water quality. The low-confidence keeping envelopes include 21
      to 29 C, GH 3 to 20 dGH and KH 5 to 12 dKH; the pH envelope is 7.5 to 8.6. These endpoints are uncertain
      keeping allowances rather than routine targets or experimentally tested failure limits."

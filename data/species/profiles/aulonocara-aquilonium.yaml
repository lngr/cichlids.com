  problems:
    text: "Insufficient feeding access, male pressure and deteriorating water quality are the principal husbandry
      concerns in the read accounts. Inspect appetite and condition, and investigate persistent withdrawal.
      Trade confusion with A. auditor can also compromise identification. General forum discussions provide
      background experience rather than species-specific proof, and some retained care pages were inaccessible
      or incomplete."

      decision:
        continent: Africa
        region: Northern Lake Malawi
        waterbody: lake-malawi
        localities:
          - Mdoka
          - Ngara
          - Charo
      rationale: "All inputs agree on Lake Malawi. The generator and checker-b name Mdoka, Ngara and Charo;
        checker-a retains only Mdoka and checker-c retains Mdoka and Ngara. The Catalog establishes Mdoka,
        Malawi.si also reports Ngara, and Malawi-Guru supplies the additional Charo record. Retain that
        reported locality with its weaker support explained in variants. These are northwestern Malawian shore
        localities; the northeastern wording in checker-a and the comparative Practical Fishkeeping article is
        not followed."
    - field: features.maxSizeCm
      proposals:
        - by: generator
          value:
            male: 10
            female: 9
        - by: checker-a
          value:
            male: 10
            female: 8
        - by: checker-b
          value:
            male: 10
            female: 9
        - by: checker-c
          value:
            male: 10
            female: 8
      decision:
        male: 10
        female: 9
      rationale: "Male proposals are all 10 cm. Female proposals are 9 cm from generator and checker-b and 8 cm from
        checker-a and checker-c, giving a median of 8.5 cm; use the published Nordic adult figure of 9 cm
        rather than implying precision to half a centimetre. Fischlexikon and Einrichtungsbeispiele give 10 cm
        males and 8 cm females. Malawi.si reports about 11 cm total length without a separate female figure.
        FishBase's 8.5 cm is standard length for male/unsexed fish and cannot be treated as an observed 8.5 cm
        female total length. The decision describes typical aquarium adults and remains below the largest
        published total length."
    - field: features.predation
      proposals:
        - by: generator
          value: 1
        - by: checker-a
          value: 0
        - by: checker-b
          value: 0
        - by: checker-c
          value: 0
        - by: tiebreaker-1
          value: 0
        - by: tiebreaker-2
          value: 0
      decision: 0
      rationale: "Retain level 0 by qualified majority, five of six votes, with medium confidence. Generator
        proposed level 1; checker-a, checker-b, checker-c, tiebreaker-1 and tiebreaker-2 proposed level 0. The
        species accounts describe sediment invertebrate feeding without reporting opportunistic capture of
        fish up to 2 cm, so the rubric permits incidental fry-taking at level 0 without requiring level 1.
        This does not establish that every fry is safe. FishBase provides habitat context but no measured
        diet; the Schwalbe study was readable only as a repository abstract and tests invertebrate detection
        in A. stuartgranti, not fish predation in aquilonium. CRC's public entry gives no feeding statement.
        The aquilonium forum search found no species-specific experience. Verification method:
        qualified-majority."

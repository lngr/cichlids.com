  breeding:
    text: "The male courts near a small depression in sand. The female collects the eggs and carries the brood in
      her mouth; the male does not care for it. Give brooding females reliable shelter and avoid unnecessary
      disturbance. Incubation details vary among the available comparative accounts, so a fixed schedule is
      not established here. Newly released young need appropriately small foods and protection from larger
      fish."

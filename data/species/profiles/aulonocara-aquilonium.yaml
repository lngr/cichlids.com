  sizeAndGrowth:
    text: "Use about 10 cm for adult males and 9 cm for females when planning stock. Published aquarium accounts
      place females at 8 to 9 cm, while one specialist account gives about 11 cm total length without
      separating the sexes. FishBase records 8.5 cm standard length, which excludes the tail. Growth and age
      at maturity are poorly documented; the estimated 6 to 9 year lifespan has low confidence."

  diet:
    text: "Base feeding on appropriately sized prepared food and varied small invertebrate foods. The natural
      niche is invertivory, with prey taken from sediment. Include balanced ingredients rather than relying on
      a single rich food. Predation level 0 reflects the absence of reported fish hunting and permits
      incidental fry capture. The unset special bloat-sensitivity flag does not guarantee freedom from
      digestive problems."

  socialBehavior:
    text: "Females and nonterritorial males school in the lake, but breeding males defend small sand patches. A
      single male with four females offers a practical aquarium unit; it does not reproduce the full wild
      mating system. Rival males or persistent courtship can still cause stress, especially if shelter and
      floor space are inadequate. Hiding continuously or losing feeding access calls for reassessing the
      social arrangement."

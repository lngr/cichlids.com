  sexing:
    text: "Adult males are somewhat larger and develop stronger coloration, especially on the head and fins.
      Females remain predominantly silver-grey. Dark vertical bars can be faint in a coloured male. Size alone
      is insufficient for reliable sexing, and females of different peacocks may look alike, making stock
      identity and locality history useful checks."

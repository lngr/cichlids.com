      rationale: "The four full profiles unanimously identify an invertivore with bloatSensitive false; retain the
        tally value, food list and medium confidence. Small sediment invertebrates dominate the species
        accounts, while the comparative sources discuss prepared food, Artemia and some plant material in
        captivity. Practical Fishkeeping's retained omnivore entry concerns foods accepted by A. stuartgranti
        from Mdoka, not a measured wild diet of aquilonium. The false bloat flag denotes no established
        special dietary sensitivity under this rubric, not immunity to digestive disease. Verification method:
        unanimous."

  aggressionConspecific:
    value: 2
    confidence: medium
    rationale: "Generator proposed 3; checker-a, checker-b and checker-c proposed 2, which is also the median.
      FishBase reports defence of a small sand patch against males of the same species, and Malawi.si
      describes schooling nonterritorial fish but cautions against multiple males. Those observations support
      hierarchy and localized chasing in a suitable one-male unit; they do not establish routine injurious
      pursuit at level 3. Female harassment remains possible with inadequate room or an unsuitable ratio."

partners:
  suitable:
    - species: Calm Copadichromis species
      reason: Potential companions based on specialist peacock husbandry; compatible temperament and adult size must
        be checked individually.
      condition: "An aquarium larger than the minimum harem tank, with open sand and adequate feeding access."
    - species: Calm Placidochromis species
      reason: Specialist accounts suggest peaceful Malawi haps as possible companions; this is genus-level guidance
        rather than a tested aquilonium pairing.
      condition: A spacious community with adults of compatible size and temperament.
  unsuitable:
    - species: Other Aulonocara species
      reason: Both social resemblance and the presumed genus hybrid group make mixed breeding stock unsuitable.
    - species: Sciaenochromis fryeri
      reason: The second presumed hybrid group reflects reports of males spawning with peacock females and harassing
        their males.
    - species: Aggressive Lake Malawi mbuna
      reason: Persistent pursuit and intense food competition can suppress this relatively quiet sand feeder.
    - species: Large piscivorous Malawi cichlids
      reason: Adult aquilonium can remain small enough to be swallowed by much larger predators.
profile:
  overview:
    text: "This small peacock comes from northern Lake Malawi. Open sand is central to its feeding, while
      scattered rocks provide nearby cover and spawning landmarks. The valid name is Aulonocara aquilonium;
      historical exports labelled A. auditor do not make those names synonyms. A spacious aquarium with calm
      companions can suit it, but similar peacocks introduce crossing concerns."
    sources:

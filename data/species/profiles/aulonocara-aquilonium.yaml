  temperatureC:
    value:
      min: 21
      max: 29
    confidence: high
    rationale: "Retain the settled lake-wide natural envelope of 21 to 29 C with waterbody verification and high
      confidence. Seasonal lake studies show substantial variation: FAO compiles 23 to 25 C, Vollmer et al.
      describe winter surface water below 24 C and summer water near 28 C, and the wider compiled envelope
      also includes Eccles and later lake campaigns. These are regional and seasonal lake values, not a
      measured 21 to 29 C interval at the aquilonium collecting site. Eccles full text was not openly
      available and its DOI returned 403; its bibliographic citation is retained without claiming an
      independent full-text check."

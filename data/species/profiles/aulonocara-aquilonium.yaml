  compatibility:
    text: "Consider calm Malawi haps only when their adult size and temperament fit the aquarium. Avoid fish that
      monopolize food or repeatedly chase the peacock, and keep much larger piscivores separate. Other
      Aulonocara and Sciaenochromis fryeri share presumed hybrid groups with this species. Those cautions
      follow genus-level aquarium warnings and reported spawning with peacock females; a verified aquilonium
      cross with free partner choice was not established."

  problems:
    text: "Restricted floor space, coarse substrate and crowded decoration obstruct normal foraging. Persistent
      chasing, bullying by companions and competition for food require attention even in a generally peaceful
      species. Excess food and poor oxygenation burden water quality. The available accounts provide no
      species-specific chronic tolerance trials or distinctive disease pattern, so stable conditions and
      observation are more useful than treating the widest published ranges as ideal targets."
    sources:

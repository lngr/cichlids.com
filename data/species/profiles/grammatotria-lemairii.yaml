  ph:
    value:
      min: 8.4
      max: 9.4
    confidence: "high"
    rationale: "The settled waterbody decision is pH 8.4 to 9.4 with high confidence. Plisnier and colleagues
      measure 8.47 to 9.40 at 40 m, with additional upper-water observations in the lake studies. FishBase
      gives 7.4 to 8.4 and the older FAO source book gives 7.3 to 7.8; these conflicting values stay in the
      evidence but do not replace the lake range supported by measured alkaline chemistry. All four
      natural-range proposals agree."

        25 proposals at the upper end and the 8 to 20 proposal at the lower end. Tanganyika.si recommends 11
        to 22 dKH for Tanganyika aquaria and OATA 10 to 15 for African lake cichlids; neither supplies a
        species-specific tolerance experiment or a demonstrated 24 dKH limit. The median is a provisional

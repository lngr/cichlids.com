        accessed: "2026-10-15"
        archived: "cichlidae.com/species.php/q-a4c3f8a4/2026-10-15T102427Z"
  habitat:
    text: "The species occurs widely in Lake Tanganyika over sand and mud, from shallow water to at least 75 m.
      Its pointed snout probes sediment for buried food. Regional lake measurements support a natural envelope
      of 23 to 29 C, pH 8.4 to 9.4, 10 to 13 dGH and 15 to 20 dKH. Magnesium-rich water and substantial
      alkalinity explain why GH and KH differ. These habitat values describe the lake rather than the exact
      limits of aquarium survival."
    sources:
      - kind: "database"
        title: "FishBase: Grammatotria lemairii summary"
        url: "https://www.fishbase.se/summary/Grammatotria-lemairii.html"
        accessed: "2026-10-15"
        archived: "fishbase.se/summary/grammatotria-lemairii.html/2026-10-15T102411Z"

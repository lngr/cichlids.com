  breeding:
    text: "Females carry the eggs and developing larvae in the mouth. The male courts on a temporary area of sand
      without building a scrape nest. Specialist accounts describe oral incubation lasting about four weeks
      and broods of roughly fifty, with variation between females and conditions. Quiet surroundings help an
      incubating female avoid disturbance, and young fish need protection from adult fish that may eat them."
    sources:

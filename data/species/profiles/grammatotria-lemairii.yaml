  compatibility:
    text: "Peaceful adult Tanganyika fish that leave ample sand and swimming space can be considered as
      companions. Adult Cyprichromis are a conditional option in a suitably enlarged community aquarium, but a
      shared lake origin alone does not prove compatibility. Fry and fish around 2 cm face opportunistic
      predation; this evidence does not justify labeling larger adult shell dwellers as prey solely on size.
      Avoid aggressive fish that repeatedly disturb feeding and courtship. No named hybrid partner is
      established for Grammatotria lemairii."

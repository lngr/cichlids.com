  husbandry:
    text: "For a small adult group, use at least 400 L with an estimated footprint of 150 by 55 cm. Preserve a
      broad bed of fine sand and an uninterrupted swimming lane. The published 681 L and 1000 L alternatives
      allow more room for extra fish and mixed communities. Maintain efficient filtration, oxygenation and
      stable alkaline water. A routine temperature around 25 to 27 C stays away from the uncertain tolerance
      endpoints. The provisional tolerance envelopes are 22 to 30 C, pH 7.5 to 9.4, 7 to 30 dGH and 11 to 24
      dKH; their outer bounds are not established long-term trial results."
    sources:

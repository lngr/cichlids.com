partners:
  suitable:
    - species: "Cyprichromis leptosoma"
      reason: "Adults use swimming space above the substrate and may complement a calm sand-sifting species. This is
        an inferred conditional match rather than a verified breeding or cohabitation trial."
      condition: "Provide additional community space beyond the small-group minimum, an adequate Cyprichromis school
        and adult fish safely above the tiny-prey category."
  unsuitable:
    - species: "Fish fry and juveniles up to about 2 cm"
      reason: "Occasional consumption of small fish makes this size class vulnerable even though invertebrates
        dominate the diet."
    - species: "Aggressive territorial Tanganyika cichlids"
      reason: "Repeated harassment and feeding-area exclusion conflict with the species-specific advice for calm
        companions."
    - species: "Tropheus moorii"
      reason: "An algae-focused feeding regime and forceful feeding competition are difficult to reconcile with an
        invertebrate-focused sand sifter."
profile:
  overview:
    text: "Grammatotria lemairii combines the scale of a large Tanganyika cichlid with the feeding habits of a
      sand sifter. Adults move in loose aggregations over soft lake sediment and separate briefly for
      spawning. Males reach roughly 27 cm and females about 22 cm. Fine sand, open swimming space and calm
      companions matter more than elaborate rockwork. Females incubate their offspring in the mouth."
    sources:
      - kind: "database"
        title: "FishBase: Grammatotria lemairii summary"
        url: "https://www.fishbase.se/summary/Grammatotria-lemairii.html"
        accessed: "2026-10-15"
        archived: "fishbase.se/summary/grammatotria-lemairii.html/2026-10-15T102411Z"
      - kind: "database"

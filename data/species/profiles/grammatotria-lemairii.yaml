    confidence: "high"
    rationale: "The settled waterbody decision is 23 to 29 C with high confidence. The lake studies establish
      seasonal upper-water variation: Verburg and colleagues report 23.85 to 29.01 C at the Mpulungu buoy,
      supporting the rounded lake envelope. FishBase gives the narrower species interval of 23 to 27 C. All
      four natural-range proposals agree; aquarium target temperatures do not replace lake measurements."

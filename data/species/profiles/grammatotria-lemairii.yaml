  diet:
    text: "Molluscs, small crustaceans and insect larvae form the main feeding theme. Diatoms and algae occur
      among material sorted from sediment, and small fish are reported as additional prey. In the aquarium,
      provide varied invertebrate-based prepared and frozen foods that reach the foraging area. This is not an
      algae-grazing dietary specialist. No read source identifies a special tendency to bloat, although that
      absence of reports does not establish immunity to digestive illness."

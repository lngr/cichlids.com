  khDkh:
    value:
      min: 15
      max: 20
    confidence: "high"
    rationale: "The settled natural range is 15 to 20 dKH with high confidence, derived from Lake Tanganyika
      alkalinity measurements. The Plisnier reports include bicarbonate and carbonate titrations; Cohen and
      colleagues report 6.5 to 6.6 meq/L, and Langenberg summarizes 6.7 to 6.9 meq/L. Multiplication by 2.8
      converts alkalinity in meq/L to dKH. GH is not converted to KH. All four natural-range proposals agree;
      this natural fact has no verification object."

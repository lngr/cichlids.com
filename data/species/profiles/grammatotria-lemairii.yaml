  sexing:
    text: "Body size becomes a useful clue in mature fish because males generally grow larger. A breeding male can
      show a faint blue tint and additional dark spots, especially in northern populations. Females remain
      predominantly silver and a ripe female can develop a fuller abdomen. These subtle differences do not
      reliably sex juveniles or every adult outside breeding condition."
    sources:

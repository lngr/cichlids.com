    text: "Plan for adult males of about 27 cm and females around 22 cm. FishBase records 26 cm total length
      without separating females; the approximate sex split comes from the Tanganyika specialist account.
      Growth needs adequate food, water quality and room. The proposed lifespan of 8 to 12 years is an
      estimate without a species-specific longevity record."

  socialBehavior:
    text: "A small group reflects the adult feeding aggregations seen in the lake. Four fish is an estimated
      planning minimum, with enough room for individuals to withdraw from courtship. A displaying male can
      defend a temporary area and chase rivals or a receptive female. Pair keeping is also described by the
      specialist source, but this fish does not require a permanent territorial pair or harem. Watch the
      actual distribution of chasing rather than relying on a fixed sex ratio."

partners:
  suitable:
    - species: Cyprichromis leptosoma
      reason: Open-water swimming separates its space use from the rock refuge of the julie pair.
      condition: A spacious Tanganyika community with room for the required Cyprichromis group and an
        independently sheltered julie pair.
    - species: Neolamprologus multifasciatus
      reason: A separate shell bed can avoid competition for the same rock cavity.
      condition: "A larger aquarium with distinct shell and rock territories, sight barriers and enough
        floor space for both social units."
  unsuitable:
    - species: Julidochromis transcriptus
      reason: Shared membership of the presumed julidochromis crossing group combines with similar cave
        use and territorial competition.
    - species: Tropheus moorii
      reason: An active grazing group competes for rock space and has different feeding needs from this
        invertebrate-feeding pair.
    - species: Maylandia zebra
      reason: "A forceful Malawi rock community can overwhelm a small cave pair, with additional dietary
        and territorial mismatches."
profile:
  overview:
    text: "A pair of Brown Julies lives close to a chosen rock refuge and can turn that small area into
      the centre of an aquarium. Julidochromis dickfeldi comes from southwestern Lake Tanganyika and
      has dark lengthwise stripes, a pointed snout and conspicuous blue fin edging. It can share a
      spacious Tanganyika community with fish using other areas, but incompatible adults can injure
      or kill one another. A confirmed pair and several separate escape routes are central to its
      care."

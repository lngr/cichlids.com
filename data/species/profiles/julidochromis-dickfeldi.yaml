  sexing:
    text: "Both sexes share the main stripe pattern, so colour alone is a poor guide. CRC, the Nordic
      register and Tawil report that males tend to be larger; Seriously Fish and some other care
      pages instead say females are larger. The feature values of 10 cm male and 8 cm female follow
      the stronger species-specific size evidence, but age, individual variation and source
      disagreement make relative length an unreliable sex test. Allowing juveniles to select
      partners avoids assuming that any larger and smaller adult will become a safe pair."

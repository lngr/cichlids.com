    - field: features.origin
      proposals:
        - by: generator
          value:
            continent: Africa
            region: "Lake Tanganyika, southwestern shore"
            waterbody: lake-tanganyika
            localities:
              - Kapampa
              - Ndole Bay
              - Sumbu National Park region
        - by: checker-a
          value:
            continent: Africa
            region: Lake Tanganyika
            waterbody: lake-tanganyika
            localities:
              - Cape Kachese
              - Chimba
              - Katete
              - "Kapampa to Ndole (south-western shore, Zambia)"
        - by: checker-b
          value:
            continent: Africa
            region: Lake Tanganyika
            waterbody: lake-tanganyika
            localities:
              - southwestern Lake Tanganyika
              - Zambia
        - by: checker-c
          value:
            continent: Africa
            region: Lake Tanganyika
            waterbody: lake-tanganyika
            localities:
              - southwestern shore of Lake Tanganyika
              - Zambia
      decision:
        continent: Africa
        region: Lake Tanganyika
        waterbody: lake-tanganyika
        localities:
          - southwestern shore
          - Kapampa
          - Ndole Bay
          - Sumbu National Park region
          - Cape Kachese
          - Chimba
          - Katete
      rationale: "All four profiles place the species in southwestern Lake Tanganyika. Generator names
        Kapampa, Ndole Bay and the Sumbu region; checker-a also names Cape Kachese, Chimba and
        Katete; checker-b and checker-c use broader southwestern-shore and Zambia labels. The
        Catalog fixes the type area in Zambia, while CRC and the Nordic register describe a range
        from Kapampa in DR Congo to Ndole in Zambia. Tawil describes Kachese to Moliro and
        Tanganyika.si gives Kachese to the Lunangwa River. These locality descriptions overlap
        without establishing identical endpoints; retain the regional origin and confirmed named
        localities rather than claim a precise range boundary. Congo trade forms resembling
        dickfeldi need separate identification."
    - field: features.temperatureC.tolerance
      proposals:
        - by: generator
          value:
            min: 23
            max: 29
        - by: checker-a
          value:
            min: 22
            max: 29
        - by: checker-b
          value:
            min: 22
            max: 29
        - by: checker-c
          value:
            min: 23
            max: 29
      decision:
        min: 23
        max: 29
      rationale: "Tally method unanimous. The tally decides 23 to 29 C with unanimous agreement within its
        one-degree threshold. Generator and checker-c propose 23 to 29 C; checker-a and checker-b
        propose 22 to 29 C. The minima have median 22.5 C, rounded to 23 C by the tally. Seriously
        Fish and TropicalFreshwaterFish recommend 23 to 27 C, whereas Fishkeeper gives 23 to 25 C
        and FishBase lists an environmental 22 to 25 C. The 29 C upper bound includes the natural
        lake interval, rather than a demonstrated long-term aquarium boundary. This decision retains
        the 22 C source and proposals without claiming that 22 C causes harm."
    - field: features.ph.tolerance
      proposals:
        - by: generator
          value:
            min: 8
            max: 9.4
        - by: checker-a
          value:
            min: 7.5
            max: 9.4
        - by: checker-b
          value:
            min: 8
            max: 9.4
        - by: checker-c
          value:
            min: 8
            max: 9.4
        - by: tiebreaker-1
          value:
            min: 7.4
            max: 9.4
        - by: tiebreaker-2
          value:
            min: 8
            max: 9.4
      decision:
        min: 8
        max: 9.4
      rationale: "Tally method qualified-majority. The qualified-majority tally decides pH 8.0 to 9.4.
        Generator, checker-b, checker-c and tiebreaker-2 propose 8.0 to 9.4; checker-a proposes 7.5
        to 9.4 and tiebreaker-1 proposes 7.4 to 9.4. Seriously Fish recommends 8.0 to 9.2 and
        Fishkeeper 8.0 to 9.0; the maximum is widened to contain the natural lake range. The wider
        keeping experience is explicitly retained: Mike Monje reports successful captive-stock
        keeping and breeding at 7.4 to 7.6, supporting a combined source envelope of 7.4 to 9.5 when
        CRC habitat values are included. Monje also reports losses of wild fish under unmatched
        water conditions, so this single direct account cannot establish a universal acclimation
        target. CRC quotes habitat pH 7.8 to 9.5 but prefers at least 8.5 for aquaria;
        TropicalFreshwaterFish gives 7.5 to 9.0 and Fischlexikon 7.8 to 9.0. The tally limits the
        operational range without discarding those contrary observations or proving failure below
        8.0."
    - field: features.ghDgh.tolerance
      proposals:
        - by: generator
          value:
            min: 10
            max: 25
        - by: checker-a
          value:
            min: 8
            max: 20
        - by: checker-b
          value:
            min: 10
            max: 25
        - by: checker-c
          value:
            min: 10
            max: 25
        - by: tiebreaker-1
          value:
            min: 8
            max: 25
        - by: tiebreaker-2
          value:
            min: 10
            max: 25
      decision:
        min: 10
        max: 25
      rationale: "Tally method qualified-majority. The qualified-majority tally decides 10 to 25 dGH.
        Generator, checker-b, checker-c and tiebreaker-2 propose 10 to 25; checker-a proposes 8 to
        20 and tiebreaker-1 proposes 8 to 25. Five proposals agree within the two-degree threshold.
        Seriously Fish directly recommends 10 to 25 dGH and Fishkeeper 15 to 25 dH. The wider source
        envelope is 8 to 25 dGH: Monje reports breeding at approximately 8 dH and the NBAT aquarium
        containing the species measures GH 8. These direct lower-water observations remain evidence
        even though the settled minimum is 10. Fischlexikon recommends 9 to 20 and Practical
        Fishkeeping gives group guidance of 10 to 20. FishBase 8 to 14 is environmental evidence;
        Marquis reports about 22.4 dGH but later questions the Katete stock identity. Neither
        decided endpoint is a controlled physiological threshold."
    - field: features.khDkh.tolerance
      proposals:
        - by: generator
          value:
            min: 15
            max: 25
        - by: checker-a
          value:
            min: 8
            max: 20
        - by: checker-b
          value:
            min: 15
            max: 25
        - by: checker-c
          value:
            min: 15
            max: 25
        - by: tiebreaker-1
          value:
            min: 10
            max: 23
        - by: tiebreaker-2
          value:
            min: 8
            max: 20
      decision:
        min: 13
        max: 24
      rationale: "Tally method median. No qualified majority settles KH, so the tally retains a
        low-confidence median of 13 to 24 dKH. Generator, checker-b and checker-c each propose 15 to
        25; checker-a and tiebreaker-2 each propose 8 to 20; tiebreaker-1 proposes 10 to 23. Ordered
        minima have median 12.5, rounded to 13; ordered maxima have median 24. This interval
        contains natural KH 15 to 20 and is plausible as buffered aquarium water, but the numbers
        are inferred planning bounds rather than demonstrated biological limits. The wider proposal
        envelope is 8 to 25 dKH. Actual keeping guidance and observations span 8 to about 22.4:
        Practical Fishkeeping gives group KH 8 to 18, NBAT measures KH 10 with the species present,
        Fischlexikon recommends 15 to 20, and Marquis reports roughly 400 ppm KH, about 22.4 dKH on
        a CaCO3 basis, for subsequently reidentified, uncertain Katete stock. These lower and higher
        statements are retained. The early 25 dKH proposals inferred an extension from pH and GH
        advice; GH 25 does not itself establish KH 25. Seachem discusses carbonate buffering
        separately from GH without supplying a numerical KH limit. A securely identified long-term
        species study is missing."
    - field: features.maxSizeCm
      proposals:
        - by: generator
          value:
            male: 10
            female: 8
        - by: checker-a
          value:
            male: 10
            female: 8
        - by: checker-b
          value:
            male: 7.5
            female: 8
        - by: checker-c
          value:
            male: 10
            female: 8
      decision:
        male: 10
        female: 8
      rationale: "Start from the component medians of all proposals: generator 10/8 cm, checker-a 10/8,
        checker-b 7.5/8 and checker-c 10/8, giving male 10 and female 8 cm. AquaInfo directly
        supports 10/8; CRC and Tanganyika.si give 10/7, and the Nordic register places males about 2
        cm above females. FishBase reports 11 cm total length for male or unsexed fish, whereas
        Seriously Fish lists 8 cm standard length and says females tend to be larger. FishProfiles
        gives 7.5 cm for both sexes; Tawil places dickfeldi near the upper end of a 6 to 9 cm
        total-length group range and directly observed larger males. Length conventions and sex
        claims differ, so retain the median typical aquarium maxima with medium confidence and treat
        relative size as a clue, not a reliable sex test."

      rationale: "The qualified-majority tally decides 10 to 25 dGH. Generator, checker-b, checker-c and
        tiebreaker-2 propose 10 to 25; checker-a proposes 8 to 20 and tiebreaker-1 proposes 8 to 25.
        Five proposals agree within the two-degree threshold. Seriously Fish directly recommends 10
        to 25 dGH and Fishkeeper 15 to 25 dH. The wider source envelope is 8 to 25 dGH: Monje
        reports breeding at approximately 8 dH and the NBAT aquarium containing the species measures
        GH 8. These direct lower-water observations remain evidence even though the settled minimum
        is 10. Fischlexikon recommends 9 to 20 and Practical Fishkeeping gives group guidance of 10
        to 20. FishBase 8 to 14 is environmental evidence; Marquis reports about 22.4 dGH but later
        questions the Katete stock identity. Neither decided endpoint is a controlled physiological
        threshold."

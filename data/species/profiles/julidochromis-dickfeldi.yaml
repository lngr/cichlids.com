  khDkh:
    value:
      min: 15
      max: 20
    confidence: high
    rationale: "The settled natural interval is 15 to 20 dKH and carries no verification object. The
      Plisnier programme reports bicarbonate and carbonate alkalinity separately, and Langenberg
      cites lake alkalinity of 6.7 to 6.9 meq/L, equivalent to about 18.8 to 19.3 dKH. Together
      these studies support a rounded regional range broader than the central alkalinity
      measurements. Aquarium GH advice cannot substitute for KH measurements."

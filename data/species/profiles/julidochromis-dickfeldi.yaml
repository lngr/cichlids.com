  minTank:
    value:
      volumeL: 68
      lengthCm: 75
      depthCm: 30
    confidence: medium
    rationale: "Start from all four proposals: generator and checker-a each give 80 L, 80 x 30 cm;
      checker-b and checker-c each give 68 L, 75 x 30 cm. Their component medians are 74 L, 77.5 cm
      length and 30 cm depth. Adopt the directly documented high-trust Seriously Fish minimum of
      about 68 L with a 75 x 30 cm base for one established adult pair, rather than an invented
      midpoint footprint. Tawil and Tanganyika.si support 80 L dedicated pair tanks; CRC describes
      40 to 80 L breeding tanks and the Nordic register gives 60 L. AquaInfo recommends 80 x 40 x 40
      cm, or 128 L, and TropicalFreshwaterFish 80 cm or 114 L. Fishkeeper recommends at least 4 ft,
      about 122 cm, and Seriously Fish separately suggests 36 in, about 91 cm, for its breeding
      setup. These larger layouts are retained as differing recommendations and provide more refuge
      space; the decided minimum is for a confirmed pair only, not juvenile pair selection, several
      pairs or a community."

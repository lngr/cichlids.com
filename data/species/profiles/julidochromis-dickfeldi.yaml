  temperatureC:
    value:
      min: 23
      max: 29
    confidence: high
    rationale: "The settled waterbody decision is 23 to 29 C for Lake Tanganyika. Verburg et al.
      measured hourly surface temperatures of 23.85 to 29.01 C at Mpulungu; the decided interval
      expresses this regional record in whole degrees, including rounding of the slightly higher
      maximum. The two Plisnier annual studies document seasonal cooling in the southern lake.
      FishBase lists the narrower, cooler species environment interval of 22 to 25 C, and CRC lists
      habitat values of 23 to 27 C. These narrower summaries remain evidence without replacing the
      regional lake decision."

      rationale: "Tally method unanimous. Retain the unanimous tally invertivore classification,
        bloatSensitive false and its food list. FishBase, CRC and the Nordic register emphasize
        crustaceans, small snails and other invertebrates. Fishkeeper and Tanganyika.si label the
        diet omnivorous but also describe animal prey as its main natural food; the rubric
        classifies the dominant feeding niche, so vegetable supplements do not require omnivore
        here. No species-specific evidence establishes unusual sensitivity to high-protein food;
        false is an unconfirmed absence of a special flag, not protection against disease."
    - field: features.aggressionConspecific
      proposals:

  diet:
    text: "Small crustaceans and other invertebrates taken from rocks dominate the natural diet, with
      snails, insect larvae and some drifting prey also reported. In aquaria, offer appropriately
      sized sinking prepared food alongside varied frozen or live aquatic invertebrates. Vegetable
      material can supplement this animal-based diet. Some care pages call the species omnivorous,
      but its dominant natural feeding niche fits the invertivore category. No special
      bloat-sensitivity flag is established. Predation level 0 allows incidental fry consumption;
      one lower-trust page includes cichlid larvae in the diet, so unrelated fry are not assured
      protection."

      surface calcium and magnesium station means that convert to about 11.1 to 11.5 dGH with
      Ca/7.14 + Mg/4.34. This supports the rounded regional interval, rather than hard aquarium
      recommendations up to 25 dGH. FishBase gives a wider species environment range of 8 to 14 dH;
      it remains cited and does not replace the required lake values. Total hardness measures
      calcium and magnesium, not carbonate buffering."

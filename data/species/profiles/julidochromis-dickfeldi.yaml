    tolerance:
      value:
        min: 13
        max: 24
      confidence: low
      rationale: "No qualified majority settles KH, so the tally retains a low-confidence median of 13 to
        24 dKH. Generator, checker-b and checker-c each propose 15 to 25; checker-a and tiebreaker-2
        each propose 8 to 20; tiebreaker-1 proposes 10 to 23. Ordered minima have median 12.5,
        rounded to 13; ordered maxima have median 24. This interval contains natural KH 15 to 20 and
        is plausible as buffered aquarium water, but the numbers are inferred planning bounds rather
        than demonstrated biological limits. The wider proposal envelope is 8 to 25 dKH. Actual
        keeping guidance and observations span 8 to about 22.4: Practical Fishkeeping gives group KH
        8 to 18, NBAT measures KH 10 with the species present, Fischlexikon recommends 15 to 20, and
        Marquis reports roughly 400 ppm KH, about 22.4 dKH on a CaCO3 basis, for subsequently
        reidentified, uncertain Katete stock. These lower and higher statements are retained. The
        early 25 dKH proposals inferred an extension from pH and GH advice; GH 25 does not itself
        establish KH 25. Seachem discusses carbonate buffering separately from GH without supplying
        a numerical KH limit. A securely identified long-term species study is missing."

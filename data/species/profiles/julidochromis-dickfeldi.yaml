  sizeAndGrowth:
    text: "Use approximately 10 cm for the typical maximum male and 8 cm for the female when planning
      adult space. CRC gives 10 and 7 cm, and AquaInfo gives 10 and 8 cm; other references use
      different length measures or reverse the size relationship between sexes. FishBase records an
      11 cm male or unsexed total-length maximum, while Seriously Fish gives 8 cm standard length.
      These figures should not be treated as directly interchangeable. Juveniles need time to form a
      compatible pair, and external appearance does not reliably identify their sex. A lifespan of 5
      to 8 years is an unconfirmed estimate."

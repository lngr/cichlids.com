  problems:
    text: "A failed adult pairing is the clearest serious risk: one fish can be trapped outside shelters
      and attacked until it dies. Provide alternative retreats, observe the pair and separate a
      threatened fish promptly. Poor water quality and weak oxygenation also cause stress,
      especially around dense rockwork. Specialist accounts associate major disturbances with broken
      pair bonds, while archive experience includes pairs that survived moves; disruption is a risk,
      not an inevitable outcome. Successful captive breeding at pH 7.4 to 7.6 and GH around 8 has
      been reported, but that limited experience does not define a universal range or a target for
      newly imported wild fish. The report of very high GH and KH for Katete trade fish carries an
      identification caveat. Treat unexplained illness through observation and water checks rather
      than assuming a special disease syndrome."

          value: 3
        - by: checker-c
          value: 3
      decision: 4
      rationale: "Generator, checker-b and checker-c propose 3, while checker-a proposes 4. Seriously Fish
        explicitly reports death of an incompatible female, TropicalFreshwaterFish reports lethal
        outcomes for the weaker fish in inadequate space, and Tawil describes severe risk when the
        pair bond fails. These concrete outcomes meet rubric level 4 more closely than persistent
        chasing alone. A bonded pair in adequate space can coexist; the score reflects the potential
        for lethal rivalry or partner attack when pairing or separation fails."

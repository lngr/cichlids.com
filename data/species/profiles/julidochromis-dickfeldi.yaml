  habitat:
    text: "The accepted species occupies rocky shores and rubble in southwestern Lake Tanganyika.
      Records and specialist locality lists span the Kapampa and Ndole area, with the type locality
      in the Sumbu National Park region of Zambia; accounts differ on the exact northern boundary.
      CRC and the Nordic register describe depths around 5 to 20 m, while FishBase records
      occurrence down to 35 m. The regional natural water interval used here is 23 to 29 C, pH 8.4
      to 9.4, GH 10 to 13 dGH and KH 15 to 20 dKH. Hardness and carbonate buffering are separate
      properties. Rock cracks provide shelter and feeding surfaces, with sandy transition areas
      nearby. Congo or Katete trade forms resembling this species need careful identification."

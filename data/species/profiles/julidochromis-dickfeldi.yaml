  husbandry:
    text: "The minimum described here is about 68 litres with a 75 by 30 cm base for one established
      adult pair. Give the fish a stable rock arrangement containing several narrow retreats and
      escape routes, with sand around the rocks and effective filtration and oxygenation. A juvenile
      selection group or mixed community needs more room than this pair minimum. Larger pair
      recommendations range from 80 litres to substantially longer aquaria. Species care advice
      commonly uses 23 to 27 C and alkaline water. The decided tolerance is 23 to 29 C, pH 8.0 to
      9.4, GH 10 to 25 dGH and KH 13 to 24 dKH. These are planning intervals, not experimentally
      established failure thresholds; the KH interval has especially weak support. Keep chemistry
      steady and maintain regular water changes. Habitat inclusion supplies the warm and alkaline
      upper endpoints without proving an aquarium optimum there."

  socialBehavior:
    text: "Keep adults as a compatible pair rather than relying on the sex of two newly introduced fish.
      A group of juveniles may allow partners to select each other, but excluded fish need prompt
      removal to separate accommodation. Same-species rivals and an incompatible partner can face
      lethal attacks, even though a settled pair usually remains near its own cave. Older offspring
      may be tolerated temporarily as part of a family, with aggression increasing as space becomes
      limited. Occasional observations of several partners do not make a harem the standard
      recommendation. Disturbing established refuges or changing conditions sharply can destabilize
      a pair, so watch for exclusion, damaged fins and sustained pursuit."
    sources:

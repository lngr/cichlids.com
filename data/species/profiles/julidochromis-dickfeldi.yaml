      - Dickfeld Julie
    de:
      - Dickfelds Julie
variants:
  - name: Cape Chipimbi
    kind: locality
    note: A named locality form from the Sumbu National Park region; other Congo-side forms are often
      identified as cf. dickfeldi and are not included here.
features:
  origin:
    value:
      continent: Africa
      region: Lake Tanganyika
      waterbody: lake-tanganyika
      localities:
        - southwestern shore
        - Kapampa
        - Ndole Bay
        - Sumbu National Park region
        - Cape Kachese
        - Chimba
        - Katete
    confidence: high
    rationale: "All four profiles place the species in southwestern Lake Tanganyika. Generator names
      Kapampa, Ndole Bay and the Sumbu region; checker-a also names Cape Kachese, Chimba and Katete;
      checker-b and checker-c use broader southwestern-shore and Zambia labels. The Catalog fixes
      the type area in Zambia, while CRC and the Nordic register describe a range from Kapampa in DR
      Congo to Ndole in Zambia. Tawil describes Kachese to Moliro and Tanganyika.si gives Kachese to
      the Lunangwa River. These locality descriptions overlap without establishing identical
      endpoints; retain the regional origin and confirmed named localities rather than claim a
      precise range boundary. Congo trade forms resembling dickfeldi need separate identification."

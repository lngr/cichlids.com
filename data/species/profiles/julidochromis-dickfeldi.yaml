  compatibility:
    text: "Other small or medium Tanganyika fish may coexist when their shelters and swimming areas
      remain separate. Cyprichromis uses open water and small shell dwellers can occupy a
      sand-and-shell area away from the julie refuge; their own social and space requirements
      require an aquarium larger than the pair minimum. A cave-centred territory can still produce
      persistent chasing of intruders. Avoid mixing members of the traditional julidochromis hybrid
      group: the caution rests on broad crossing warnings rather than a demonstrated dickfeldi
      cross. Busy algae-feeding rock communities such as Tropheus or forceful Malawi mbuna impose
      additional dietary and territorial challenges. Sharing a lake or similar pH alone does not
      establish compatibility."

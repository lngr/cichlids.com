  breeding:
    text: "Eggs are laid inside a rock cavity, usually on a protected wall or ceiling. The female tends
      the clutch while the male guards the surrounding area, and the parents can protect offspring
      beyond the first free-swimming stage. Spawning may be noticed only when young appear outside
      the refuge. Newly hatched brine shrimp and other suitable small foods can feed the fry once
      feeding begins. Several age classes may coexist for a time, but older juveniles can eventually
      be expelled and need their own accommodation. A compatible pair and clean, well-oxygenated
      water are more useful than attempts to force two adults to breed."

  legacyNames:
    - Julidochromis dickfeldi
  note: "The Catalog of Fishes retains Julidochromis dickfeldi Staeck, 1975 with no listed synonym.
    Molecular work by Sturmbauer et al. (2010) and specialist discussions question relationships
    within the traditional julies; these hypotheses do not replace the accepted combination. The CRC
    public species page confirms the accepted species name. Trade fish called Katete or Congo
    dickfeldi can represent an uncertain taxon and are not treated as confirmed variants here."

  hybridGroups:
    value:
      - julidochromis
    confidence: low
    rationale: "Retain the unanimous tally group julidochromis with low confidence. The listed group
      already contains dickfeldi and has basis presumed. Seriously Fish explicitly warns about
      crossing among julie species on its marlieri page, and Tawil discusses uncertain natural
      mixing and relatedness within traditional julies; neither demonstrates a free-choice cross
      involving dickfeldi. The dickfeldi Seriously Fish page does not itself state a hybridization
      warning, so inherited entries attributing that warning to it are qualified. Fishkeeper,
      FishProfiles and Fischlexikon also discourage mixing congeners. This is a general risk group,
      not proof that each pair has produced hybrids."

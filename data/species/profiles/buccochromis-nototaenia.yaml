profile:
  overview:
    text: "A stripeback hap needs an adult housing plan before it is purchased. Buccochromis nototaenia\
      \ is a Lake Malawi fish hunter that uses speed and open space to catch young cichlids. Males may\
      \ reach about 35 cm in aquarium-oriented accounts, considerably larger than the shorter database\
      \ length records. A breeding unit of one male and three females is planned here around 1000 litres\
      \ and a 250 cm swimming length. It can live with suitable large Malawi companions, but smaller fish\
      \ remain prey. Its demands come mainly from adult size, space, filtration and stocking choices."
    sources:
    - *id003
    - *id015
    - *id018
  habitat:
    text: "The best-supported distribution is Lake Malawi, with Mdoka among the recorded localities. Hunting\
      \ takes place above sandy bottoms near shore; FishBase places the fish around 10 m, while specialist\
      \ accounts describe approximately 3 to 20 m and frequent use of the sand-rock transition. Vallisneria\
      \ beds and scattered-rock shelter are also reported, particularly in accounts of brood care. Preserve\
      \ an open sand floor and clear swimming lanes in captivity. The natural lake synthesis is 21 to\
      \ 29 C, pH 7.7 to 8.6, 3 to 5 dGH and 5 to 8 dKH. These seasonal lake ranges differ from the narrower\
      \ conditions normally selected for an aquarium."
    sources:
    - *id003
    - *id018
    - *id020
    - *id010
    - *id007
    - *id008
    - *id009
    - *id006
  sizeAndGrowth:
    text: "Published figures do not converge on one adult size. FishBase records 23 cm total length and\
      \ Seriously Fish gives 22.5 cm standard length, whereas Malawi.si describes males to 35 cm and females\
      \ to 30 cm. FishFish agrees on the larger male but gives 20 cm for females. The planning values\
      \ here are 35 cm for a male and an estimated 27.5 cm for a female, the latter a midpoint of the\
      \ run proposals within the wider source spread. It is not a precise biological limit. Young fish\
      \ need a permanent adult aquarium planned in advance; their current size should not determine the\
      \ eventual swimming space."
    sources:
    - *id003
    - *id015
    - *id018
    - *id016
  husbandry:
    text: "For one male with three females, provide at least 1000 litres with 250 cm of length and a broad\
      \ footprint. The selected 80 cm front-to-back depth is a practical estimate for turning and passing\
      \ rather than a published minimum. Keep rocks and any Vallisneria planting toward the margins so\
      \ they do not block fast movement. Strong biological filtration, oxygenation and regular waste removal\
      \ are central to keeping several large predators. Routine temperatures around 24 to 27 C have clearer\
      \ husbandry support than the edges of the broader 21 to 30 C tolerance. The other decided tolerances\
      \ are pH 7.5 to 8.8, GH 3 to 25 dGH and an inferred KH 5 to 15 dKH. The GH span combines soft habitat\
      \ water with much harder aquarium advice; it is not a reason to raise hardness toward the upper\
      \ boundary."
    sources:
    - *id015
    - *id018
    - *id020
    - *id016
    - *id010
    - *id007
    - *id006
  socialBehavior:
    text: "A single male with several females is the selected adult arrangement; three females is the\
      \ minimum ratio used here. The wild mating system does not imply a lasting pair bond. Fish may move\
      \ in loose associations outside reproduction, while males defend temporary spawning sites during\
      \ breeding. In a roomy one-male harem the sources support hierarchy and chasing more clearly than\
      \ routine injury, although reports involving multiple males indicate greater risk. Check that subordinate\
      \ fish can feed and leave the display site. Shelter should interrupt sight lines without taking\
      \ away the main swimming lane."
    sources:
    - *id019
    - *id018
    - *id020
    - *id015
    - *id016
  diet:
    text: "Fish are the principal natural prey, so this species belongs in the piscivore category. Captive\
      \ fish can accept prepared cichlid food, with prawns, mussels and suitable fish-based foods providing\
      \ variety. Use measured portions and observe body condition because its eager feeding response makes\
      \ excess feeding easy. A companion that fits into its mouth cannot be made safe by offering more\
      \ food. The false bloat-sensitivity flag means that no particular sensitivity to a protein-rich\
      \ diet was established for this species; it does not remove the need for suitable portions, balanced\
      \ food and clean water."
    sources:
    - *id019
    - *id003
    - *id015
    - *id018
    - *id020
  breeding:
    text: "The female incubates eggs and young in her mouth. Accounts describe males defending a temporary\
      \ sand-based spawning site, followed by females using more sheltered habitat during brood care.\
      \ A one-male harem provides the recommended captive social arrangement, but does not guarantee spawning.\
      \ Seriously Fish and the Nordic register contain older statements that aquarium reproduction was\
      \ unreported; a collaborative FishFish account subsequently describes a brood of 99 young. That\
      \ single keeper report supports the possibility of captive breeding but is not a reliable estimate\
      \ of a normal brood size or breeding success rate."
    sources:
    - *id019
    - *id018
    - *id020
    - *id015
    - *id017
    - *id016
    - *id025
  sexing:
    text: "Mature males are generally larger and more colorful than females. Descriptions of adult male\
      \ display include a blue-green sheen, while the slanting dark flank band is an identification feature\
      \ that can be clearer in subdued fish. Warm fin colors reported for females or subadults should\
      \ not be treated as reliable male sex markers. Young fish may lack the display coloration needed\
      \ for confident visual sexing, so an apparent juvenile ratio should not be assumed to remain the\
      \ adult ratio. Keep enough flexibility in the stocking plan to manage unexpected mature males."
    sources:
    - *id015
    - *id003
    - *id005
    - *id018
    - *id016
    - *id020
  compatibility:
    text: "Suitable companions must combine similar water needs with enough adult size and robustness\
      \ to remain outside the prey category. Specialist accounts suggest large Malawi predators such as\
      \ Nimbochromis, Champsochromis and Tyrannochromis. Each mixed group needs space beyond the minimum\
      \ adult unit where its members require it. This species is usually much less aggressive toward fish\
      \ too large to swallow than its predatory diet might suggest, but breeding defense and feeding competition\
      \ still matter. Small Malawi species, juveniles and many mbuna make poor companions. The empty hybrid-group\
      \ list means that no applicable crossing group was established, not that mixed breeding stocks are\
      \ guaranteed safe from hybridization."
    sources:
    - *id015
    - *id018
    - *id020
    - *id019
  problems:
    text: "Limited swimming space, underestimated adult size and prey-sized tankmates are the most consequential\
      \ stocking problems. A mixed-male group can also develop social pressure that is absent in juveniles.\
      \ Food access and escape routes deserve attention even when the fish appear calm between breeding\
      \ bouts. An eager appetite can conceal overfeeding, and several large fish place a substantial load\
      \ on filtration. The available sources do not establish a unique disease pattern for this species.\
      \ Changes in breathing, appetite or condition need investigation of water quality and social conditions\
      \ as well as appropriate fish-health assessment; the long-term edges of the inferred water tolerances\
      \ remain poorly tested."
    sources:
    - *id015
    - *id016
    - *id018
    - *id020

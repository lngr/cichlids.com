  temperatureC:
    value:
      min: 21
      max: 29
    confidence: high
    rationale: "Lake Malawi seasonal habitat synthesis of 21 to 29 C, retained exactly from the settled\
      \ lake decision. Eccles reports inshore cooling to 21 C and an upper layer at 27 C in May; Vollmer\
      \ describes summer surfaces around 28 C, while the broader synthesis also includes later seasonal\
      \ campaigns. Branchu's 1993 depth profile and FAO's 23 to 25 C surface summary are narrower snapshots,\
      \ not the full seasonal interval. The 29 C upper boundary is retained from the multi-study lake\
      \ synthesis rather than claimed as a measurement in each cited paper."
    verification:
      method: waterbody
      waterbody: lake-malawi

  problems:
    text: "Crowded adult groups and forced pairings can produce severe injury even when water chemistry is suitable.\
      \ A missing small tankmate may have been eaten rather than driven from a territory. Watch especially for persistent\
      \ pursuit after spawning, blocked retreats and a fish unable to feed. A secure lid, reliable filtration and\
      \ oxygenation address other recurring husbandry risks. Avoid abrupt adjustments to pH or hardness merely to\
      \ match a distant endpoint. Published care sheets disagree on hardness, tank size and nest placement; the\
      \ numerical tolerance limits here remain provisional, especially KH, and should not be interpreted as demonstrated\
      \ failure thresholds."

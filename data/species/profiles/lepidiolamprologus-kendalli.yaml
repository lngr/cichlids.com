partners:
  suitable:
  - species: Adult Altolamprologus species
    reason: Specialist husbandry guidance allows robust Tanganyika carnivores that cannot be swallowed.
    condition: Adult fish with sufficient body depth in a community aquarium larger than the minimum pair setup;
      separate retreats and active observation are necessary.
  - species: Adult Chalinochromis species
    reason: Tanganyika.si names these among possible carnivorous companions when large enough to escape predation.
    condition: Use dissimilar adults too large to swallow with extra floor space and refuges; genus membership alone
      does not ensure compatibility.
  unsuitable:
  - species: Neolamprologus multifasciatus
    reason: Small adults and fry may be hunted around the rock and sand boundary.
  - species: Juvenile Julidochromis and Cyprichromis
    reason: Small or slender individuals can be swallowed even when the predator shows little territorial aggression.
  - species: Other Lepidiolamprologus species
    reason: The presumed genus crossing caution and severe aggression toward similar fish make mixed breeding stocks
      unsuitable.
profile:
  overview:
    text: "Lepidiolamprologus kendalli is a fish-eating cichlid of southern Lake Tanganyika. The familiar aquarium\
      \ name nkambae is a junior synonym, so the two names do not identify separate species in this profile. Adults\
      \ usually hunt alone near rocks, while reproduction involves a pair. A compatible pair can be kept in a spacious\
      \ aquarium, but surplus adults may injure or kill one another. Its main constraints are prey-sized tankmates,\
      \ difficult pairing and the need for stable alkaline water."
    sources:
    - kind: catalog-of-fishes
      title: "Eschmeyer's Catalog of Fishes, Lepidiolamprologus kendalli"

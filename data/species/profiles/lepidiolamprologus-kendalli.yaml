  habitat:
    text: "Records extend from Nkamba Bay in Zambia toward Kala in Tanzania, with the type locality near Mutondwe\
      \ Island and preserved material from Muzi. Fish occur among rocks and beside rocky transition areas, from\
      \ shallow water to beyond 40 m. They do not normally range across extensive open sand. The lake habitat envelope\
      \ is 23 to 29 C, pH 8.4 to 9.4, GH 10 to 13 dGH and aquarium KH 15 to 20 dKH. These lake-wide values describe\
      \ several locations and seasons rather than one simultaneous aquarium target. Stable rock passages with adjoining\
      \ sand reflect this habitat."

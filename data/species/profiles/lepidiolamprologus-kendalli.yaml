  khDkh:
    value:
      min: 15
      max: 20
    confidence: high
    rationale: "The FAO/FINNIDA second annual cycle gives station bicarbonate means of 5.6 to 6.2 meq/L and carbonate\
      \ means of 0.06 to 1.02 meq/L; the historical FAO compilation gives total alkalinity 6.71 meq/L. With aquarium\
      \ dKH equal to alkalinity in meq/L multiplied by 2.8, the fixed lake envelope is 15 to 20 dKH. Magnesium and\
      \ sodium chemistry explain why alkalinity exceeds total hardness; GH is not converted into KH. This natural\
      \ fact carries no verification object."

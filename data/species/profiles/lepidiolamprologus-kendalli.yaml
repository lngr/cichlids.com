  socialBehavior:
    text: "Keep an established pair or one adult when no compatible partner is available. Pair formation can be\
      \ hazardous, and retaining several mature fish can lead to lethal attacks. Buying two adults of opposite sex\
      \ does not ensure a stable pair. During brood care the female may drive the male away from the immediate nest\
      \ while he guards farther out. That division requires escape routes and space, with separation available if\
      \ a fish is cornered. A large breeding territory is a provisional interpretation of these accounts; the defended\
      \ distance has not been measured."

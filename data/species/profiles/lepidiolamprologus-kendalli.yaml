  breeding:
    text: "The selected category is open substrate spawning. CRC gives that classification and Tanganyika.si describes\
      \ exposed nests in the natural habitat, with both parents defending the brood. Other aquarium references describe\
      \ spawning inside caves or crevices, so sheltered captive nests should also be expected. The nesting surface\
      \ does not remove the need for a broad surrounding defence area. Reports describe several hundred eggs and\
      \ division of parental duties, but clutch size and development times vary across sources. The main practical\
      \ challenge is maintaining a compatible pair with space for each parent to retreat after spawning."

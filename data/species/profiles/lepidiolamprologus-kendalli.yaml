  validName: Lepidiolamprologus kendalli
  genus: Lepidiolamprologus
  species: kendalli
  author: "(Poll & Stewart, 1977)"
  source:
    kind: catalog-of-fishes
    title: "Eschmeyer's Catalog of Fishes, species of Lepidiolamprologus"
    url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Lepidiolamprologus"

  sexing:
    text: "Mature males generally exceed females in size. Tanganyika.si estimates females about one quarter smaller\
      \ in its large-adult account, but this is not a precise rule for every aquarium stock. Colour and fin markings\
      \ provide no dependable sex distinction in the read specialist account. The association register identifies\
      \ examination of the genital opening as the more reliable method. Juveniles and differently aged fish are\
      \ difficult to compare by size, and a temporary display or darkened colour does not establish sex or pair\
      \ compatibility."

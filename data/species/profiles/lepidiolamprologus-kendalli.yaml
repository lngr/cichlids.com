      \ with surface values around 8.8 to 9.2. The fixed lake envelope is 8.4 to 9.4. FishBase gives 7.4 to 8.4,\
      \ and the older FAO source book gives 7.3 to 7.8; these lower compilations conflict with the more recent measurements\
      \ and strong buffering, so they remain dissenting evidence rather than the natural value."

  maxSizeCm:
    value:
      male: 19
      female: 15.5
    confidence: medium
    rationale: "The component medians are 19 cm male and 15.5 cm female. FishBase reports a male or unsexed maximum\
      \ of 16 cm total length, Practical Fishkeeping gives an unsexed 14 cm and Fishipedia gives dominant males\
      \ to 18 cm. Tanganyika.si reports 22 cm males and females about 25 percent smaller, and the association register\
      \ also lists 22 cm. The medians fit the span of published adult reports without treating 22 cm as the expected\
      \ aquarium maximum. The female endpoint is approximate; wild standard-length specimens are not sex-specific\
      \ aquarium total-length measurements, and older evidence conversions are retained as estimates. Proposals:\
      \ generator = {\"male\": 16, \"female\": 12}; checker-a = {\"male\": 18, \"female\": 15}; checker-b = {\"\
      male\": 20, \"female\": 16}; checker-c = {\"male\": 22, \"female\": 16.5}."

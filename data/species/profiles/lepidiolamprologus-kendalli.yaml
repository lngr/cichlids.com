    confidence: high
    rationale: "All runs identify southern Lake Tanganyika. FishBase bounds the range from Nkamba Bay to Kala, the\
      \ Catalog locates the type near Mutondwe Island and Kullander and colleagues provide Tanzanian specimens from\
      \ Muzi. Locality wording is consolidated without treating historical nkambae as a second species. Other inherited\
      \ references remain cited for research context; the requested AquaInfo and JBL pages yielded only a map and\
      \ notification text and supply no species or water evidence. Proposals: generator = {\"continent\": \"Africa\"\
      , \"region\": \"Lake Tanganyika\", \"waterbody\": \"lake-tanganyika\", \"localities\": [\"Nkamba Bay\", \"\
      Mutondwe Island\", \"Kala\"]}; checker-a = {\"continent\": \"Africa\", \"region\": \"Lake Tanganyika\", \"\
      waterbody\": \"lake-tanganyika\", \"localities\": [\"Nkamba Bay, Zambia\", \"Mutondwe Island, Zambia\", \"\
      Kala, Tanzania\", \"Muzi, Tanzania\"]}; checker-b = {\"continent\": \"Africa\", \"region\": \"Lake Tanganyika\"\
      , \"waterbody\": \"lake-tanganyika\", \"localities\": [\"southern Lake Tanganyika\", \"Nkamba Bay to Kala\"\
      ]}; checker-c = {\"continent\": \"Africa\", \"region\": \"Lake Tanganyika\", \"waterbody\": \"lake-tanganyika\"\
      , \"localities\": [\"Southern Lake Tanganyika, from Nkamba Bay to Kala\"]}."

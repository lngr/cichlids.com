  diet:
    text: "Small fishes are the principal natural food, so this species receives predation level 3 and a piscivorous\
      \ diet. Captive fish can take frozen crustaceans and suitable prepared carnivore foods as alternatives to\
      \ whole fish. Krill and mysis are specifically mentioned in aquarium advice. Offer portions appropriate to\
      \ body size and remove uneaten food so that protein-rich feeding does not undermine water quality. Live feeder\
      \ fish are not necessary where balanced substitutes are accepted. The reviewed evidence does not identify\
      \ special nutritional bloat sensitivity, although poor feeding and water quality can still cause illness."

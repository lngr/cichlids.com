      \ page; Aquarist Atlas repeats a broad warning and narrows its genus-page wording to the elongatus complex.\
      \ These are general cautions, not verified crosses between every member, and the two Atlas pages share one\
      \ editorial source. The 2007 and 2010 papers discuss historical introgression under the nkambae name without\
      \ identifying a usable contemporary parental pair. The group is therefore presumed. Its members follow the\
      \ ten valid names in the Catalog of Fishes; variostigma and lemairii remain Neolamprologus despite CRC placement\
      \ and the first tiebreaker membership suggestion. Forum searches reveal no kendalli crossing report; the warning\
      \ in thread 41333 concerns Altolamprologus. Proposals: generator = []; checker-a = [\"lepidiolamprologus\"\
      ]; checker-b = []; checker-c = []; tiebreaker-1 = [\"lepidiolamprologus\"]; tiebreaker-2 = [\"lepidiolamprologus\"\
      ]. Verification follows the settled tally: {\"method\": \"conservative\", \"votes\": {\"agree\": 3, \"total\"\
      : 6}}."

  temperatureC:
    value:
      min: 23
      max: 29
    confidence: high
    rationale: The southern-lake buoy report by Verburg and colleagues records hourly surface temperatures of 23.85
      to 29.01 C. The fixed lake envelope is 23 to 29 C and remains the waterbody decision. FishBase gives the narrower
      species interval 23 to 27 C; the association register gives an aquarium target of 24 to 27.5 C. Neither replaces
      measured lake chemistry.

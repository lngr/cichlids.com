  synonyms:
  - name: Lamprologus kendalli
    note: Original combination of the accepted species.
  - name: Lamprologus nkambae
    note: Original combination of the junior synonym described by Staeck in 1978.
  - name: Lepidiolamprologus nkambae
    note: Later combination of the junior synonym and the legacy catalog name.
  legacyNames:
  - Lepidiolamprologus nkambae
  note: The Catalog of Fishes accepts Lepidiolamprologus kendalli and places nkambae in its synonymy. The original
    Lamprologus genus query and FishBase nomenclature were also checked. Kullander and colleagues tentatively proposed
    the nkambae synonymy in 2012; Tawil and Konings supported it in their public 2013 abstract while proposing subspecies
    rank for kamambae. The current Catalog nevertheless retains Lepidiolamprologus kamambae as a separate valid
    species. The older magazine and hobby accounts using two separate kendalli and nkambae names do not determine
    current nomenclature.
names:
  trade:
    en:
    - Kendall's cichlid
    - Kendall's lamprologus
    - Nkambae cichlid
variants:
- name: Nkamba Bay
  kind: locality
  note: The historical Black Nkambae trade label refers to this population of kendalli; it does not denote a second
    valid species.

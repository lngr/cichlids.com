  husbandry:
    text: "Allow at least 500 L with a 200 cm length and 60 cm front-to-back depth for a compatible adult pair.\
      \ The depth is a practical planning estimate; published specialist advice specifies the volume and length,\
      \ and the association register recommends the larger 720 L. A mixed community needs more room. Secure rockwork\
      \ should provide separate retreats and interrupt sight lines without filling the swimming space. Cover the\
      \ aquarium completely because these fish can jump. Maintain effective filtration, surface gas exchange and\
      \ regular water changes. Practical Fishkeeping suggests 24 to 26 C for routine care. The wider recorded tolerances\
      \ are 23 to 29 C, pH 7.5 to 9.4, GH 7 to 25 and KH 11 to 24; all remain low confidence and are not target\
      \ extremes to pursue."

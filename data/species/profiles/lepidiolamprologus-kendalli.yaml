  compatibility:
    text: "Mixed-species keeping is possible with additional space and robust adults too large to be swallowed.\
      \ The specialist account names Altolamprologus and Chalinochromis as examples, but individual size and body\
      \ shape matter more than the genus label. Predation on small fish must be considered separately from territorial\
      \ attacks: suitably sized dissimilar neighbours may be tolerated outside brood defence. Small shell dwellers\
      \ and juvenile rock or open-water cichlids remain vulnerable. The presumed Lepidiolamprologus hybrid group\
      \ adds a caution when congeners share a tank. It reflects general mixing warnings rather than verified crossings\
      \ between every listed pair."

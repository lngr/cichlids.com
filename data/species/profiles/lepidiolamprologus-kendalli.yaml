  sizeAndGrowth:
    text: "The planning sizes are about 19 cm for males and 15.5 cm for females. These are approximate aquarium\
      \ adult maxima assembled from differing reports, not a measured growth curve. FishBase lists 16 cm total length\
      \ without a separate female figure, the older nkambae aquarium article gives 14 cm and specialist accounts\
      \ reach 22 cm for males. Females generally remain smaller, but their exact adult endpoint is less secure.\
      \ Growth changes which companions can be swallowed. Lifespan is provisionally estimated at 8 to 10 years,\
      \ with the upper value supported only by general species sheets."
    sources:
    - kind: database
      title: "FishBase species summary: Lepidiolamprologus kendalli"

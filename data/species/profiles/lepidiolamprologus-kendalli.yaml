      \ food lists are complementary. No reviewed source establishes a special sensitivity to the protein-rich foods\
      \ this predator normally consumes; the false flag does not imply immunity to digestive disease. Proposals:\
      \ generator = {\"type\": \"piscivore\", \"bloatSensitive\": false, \"foods\": [\"small fish\", \"crustaceans\"\
      , \"krill\", \"mysis\", \"meaty prepared foods\"]}; checker-a = {\"type\": \"piscivore\", \"bloatSensitive\"\
      : false, \"foods\": [\"fish\", \"krill\", \"mysis\"]}; checker-b = {\"type\": \"piscivore\", \"bloatSensitive\"\
      : false, \"foods\": [\"fish\", \"crustaceans\", \"frozen and prepared meaty foods\"]}; checker-c = {\"type\"\
      : \"piscivore\", \"bloatSensitive\": false, \"foods\": [\"fish\", \"crustaceans\"]}. Verification follows\
      \ the settled tally: {\"method\": \"unanimous\", \"votes\": {\"agree\": 4, \"total\": 4}}."
  - field: features.aggressionHeterospecific
    proposals:
    - by: generator
      value: 2
    - by: checker-a
      value: 3
    - by: checker-b
      value: 3
    - by: checker-c
      value: 3
    decision: 2
    rationale: "Level 2 best matches territory and brood defence against appropriately sized dissimilar neighbours.\
      \ Tanganyika.si permits robust companions and describes increased aggression around fry; DRTA and Fischlexikon\
      \ describe relative tolerance outside breeding, while Fishipedia and several agent interpretations imply level\
      \ 3. Eating small fish supports predation level 3 but does not establish attacks beyond a territory on comparable\
      \ adults. Such attacks were not demonstrated by the read accounts, so the three level-3 proposals are not\
      \ adopted. Proposals: generator = 2; checker-a = 3; checker-b = 3; checker-c = 3."
  - field: features.territory

        breedingOnly: true
    - by: checker-c
      value:
        size: small
        breedingOnly: true
    decision:
      size: large
      breedingOnly: true
    rationale: "A large breeding territory is inferred from the male guarding outside the female nest area in Tanganyika.si\
      \ and the wide pair perimeter described by TankBud. The area is not measured. FishBase describes roaming adults\
      \ rather than an enduring defended patch, and Aquarist Atlas separates nonbreeding resting sites from brood\
      \ defence. Fishipedia and DRTA imply ongoing territoriality, so breedingOnly remains uncertain. The small-site\
      \ proposals understate the outer parental perimeter, but the large flag is a low-confidence interpretation\
      \ rather than a measured 50 cm radius. Proposals: generator = {\"size\": \"small\", \"breedingOnly\": true};\
      \ checker-a = {\"size\": \"large\", \"breedingOnly\": false}; checker-b = {\"size\": \"large\", \"breedingOnly\"\
      : true}; checker-c = {\"size\": \"small\", \"breedingOnly\": true}."

    rationale: "Component medians give 500 L, 200 cm length and 60 cm depth for one compatible adult pair. Tanganyika.si\
      \ directly recommends 500 L and 200 cm for kendalli; this is not solely an extrapolation from kamambae. The\
      \ association register gives the larger 720 L at 200 cm and Practical Fishkeeping gives the smaller 150 cm\
      \ length without volume or depth. DRTA gives 80 to 100 cm and Fishipedia 1000 L with an implausible 2000 cm\
      \ frontage; neither displaces the consistent species-specific specialist length. The 60 cm depth is an explicitly\
      \ inferred practical footprint, not a dimension stated by these sources. A mixed community needs additional\
      \ space. Proposals: generator = {\"volumeL\": 500, \"lengthCm\": 200, \"depthCm\": 60}; checker-a = {\"volumeL\"\
      : 375, \"lengthCm\": 150, \"depthCm\": 50}; checker-b = {\"volumeL\": 720, \"lengthCm\": 200, \"depthCm\"\
      : 60}; checker-c = {\"volumeL\": 500, \"lengthCm\": 200, \"depthCm\": 60}."

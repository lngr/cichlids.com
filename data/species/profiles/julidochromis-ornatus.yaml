  diet:
    text: 'Provide small animal foods alongside some plant material and a suitable prepared ration. The accounts collectively describe algae, microscopic organisms and small invertebrates taken around rock surfaces; their relative importance varies among descriptions. Live or frozen small crustaceans can form part of the menu, with vegetable ingredients supplying the mixed component. Offer modest portions and check that both fish feed. There is no established species-specific protein-triggered bloat tendency in the read evidence, although digestive illness and poor water quality remain possible.'

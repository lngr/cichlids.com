  problems:
    text: 'Pair disruption and competition for a single refuge are central husbandry risks. A rejected adult or an older youngster can be driven away from food and cover, so prepare a safe way to separate fish if needed. Avoid abrupt changes in layout or replacement-water conditions and inspect the pair after maintenance. Do not confuse general hardness with carbonate buffering when adjusting water. Appetite loss, rapid breathing and injuries require attention; the sources do not establish a unique disease syndrome for this species.'

    tolerance:
      value:
        min: 23
        max: 29
      confidence: medium
      rationale: 'The tally selects 23 to 29 C with unanimous verification, four agreeing votes and medium confidence. Generator, checker-b and checker-c proposed 23 to 29 C; checker-a proposed 22 to 29 C, within the one-degree agreement threshold. The median lower endpoint is 23 C. The decided interval is narrower than checker-a''s 22 to 29 C proposal and the 22 C minima reported by TropicalFreshwaterFish and FishBase. Seriously Fish recommends 23 to 27 C, and the association register gives 24 to 27.5 C. The maximum is widened to contain the natural 29 C endpoint. Kua et al. maintained a warm treatment around 28.1 C for eight months, but warming increased aggression and the study discusses reduced reproductive output; this supports exposure at the warm end rather than an optimal temperature or proof of lifelong health there.'

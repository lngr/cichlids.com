partners:
  suitable:
    - species: Neolamprologus multifasciatus
      reason: 'It occupies shells on the sand while the julie uses crevices in the rockwork, reducing direct competition.'
      condition: 'Use a larger aquarium than the minimum pair setup, with separate rock and shell territories and broken sight lines.'
    - species: Cyprichromis leptosoma
      reason: 'It uses open water above the rocks, a different zone from the cave-defending julie.'
      condition: 'Use an aquarium sized for the Cyprichromis group, with ample open swimming space and separate bottom territories.'
  unsuitable:
    - species: Julidochromis transcriptus
      reason: 'It shares the broad Julidochromis crossing group, and similar habitat and body markings add territorial pressure.'
    - species: Julidochromis marlieri
      reason: It shares both the broad crossing group and a specific presumed crossing group with J. ornatus.
    - species: Cyphotilapia frontosa
      reason: 'It grows far larger and may consume a small julie, while also requiring a much larger aquarium.'
profile:
  overview:
    text: 'A golden julie brings a compact patch of Lake Tanganyika rock habitat into the aquarium. Yellow or pale fish with dark lengthwise markings move close to stones and often disappear into crevices. A compatible pair can reproduce repeatedly, but small size does not mean that surplus adults can share its refuge safely. Plan the aquarium around a secure pair territory and stable water conditions.'
    sources:
      - kind: database
        title: 'Seriously Fish: Julidochromis ornatus (Golden Julie)'
        url: 'https://www.seriouslyfish.com/species/julidochromis-ornatus/'
        accessed: 2026-10-13
        archived: seriouslyfish.com/species/julidochromis-ornatus/2026-10-14T201319Z
      - kind: database
        title: 'FishBase species summary: Julidochromis ornatus'
        url: 'https://www.fishbase.se/summary/Julidochromis-ornatus.html'
        accessed: 2026-10-13
        archived: fishbase.se/summary/julidochromis-ornatus.html/2026-10-14T201302Z
  habitat:
    text: 'The accepted species is endemic to Lake Tanganyika, with its type locality at Mbity Rocks, possibly near Kasakalawe and Mpulungu. Southern fish have been studied directly among flat rocks partly embedded in sand. Older accounts also include northern yellow fish under this name; Tawil and locality specialists question whether some of those populations belong with J. transcriptus. Locality labels therefore deserve attention. The natural lake envelope used here is 23 to 29 C, pH 8.4 to 9.4, 10 to 13 dGH and 15 to 20 dKH, based on the limnological studies. These ranges represent variation in the lake, rather than a single aquarium target.'
    sources:

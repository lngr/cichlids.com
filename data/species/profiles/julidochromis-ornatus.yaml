  husbandry:
    text: 'For one established pair, the minimum used here is 70 L with a base at least 75 cm long and 30 cm deep. Secure the rocks against collapse and provide narrow crevices with escape routes over a sandy bottom. Extra territories or community fish need a larger aquarium. Use mature filtration and good oxygenation, match replacement water carefully and keep maintenance consistent. The aquarium tolerance envelopes are 23 to 29 C, pH 7.5 to 9.4, 10 to 25 dGH and 10 to 20 dKH; their endpoints are not equally well documented, especially KH. Seriously Fish recommends the narrower 23 to 27 C for routine care. A warming experiment found more aggression near the warm end, so the broad temperature envelope should not be read as an instruction to keep the tank at its maximum.'

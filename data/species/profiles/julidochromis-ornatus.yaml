  compatibility:
    text: 'Suitable Tanganyika neighbors can share a sufficiently spacious aquarium when their territories occupy different zones. Shell-dwellers need a separated sand area, while Cyprichromis need adequate open swimming space in a larger tank. The minimum pair aquarium should not be assumed to hold that community. Other traditional julies carry presumed crossing risk and can compete for the same shelters. A separate marlieri-ornatus report also supports a presumed pairwise risk, with uncertain parentage and mate choice. Large predators can consume a small julie. Archive community accounts add practical context but do not establish that every listed combination succeeds.'

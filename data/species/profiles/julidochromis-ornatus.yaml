    rationale: 'The settled lake decision is 23 to 29 C with high confidence and waterbody verification. Verburg et al. measured surface temperatures of 23.85 to 29.01 C at Mpulungu; the lake envelope accounts for seasonal variation. FishBase lists a narrower 22 to 24 C species environment interval, while aquarium recommendations are retained as husbandry evidence and do not replace the lake measurements.'

  note: 'The Catalog of Fishes accepts Julidochromis ornatus. Its type locality is Mbity Rocks, possibly Kasakalawe near Mpulungu. FishBase and older hobby accounts also apply the name to northern yellow julies; Tawil (2013) questions that identification and associates those fish with J. transcriptus. This profile follows the accepted species name and flags the geographic identification uncertainty.'

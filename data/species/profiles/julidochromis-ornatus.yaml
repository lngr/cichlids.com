      rationale: 'Generator and checker-b proposed 5 to 8 years; checker-a proposed 6 to 10; checker-c proposed 5 to 7. Component medians are 5 and 8. Aqua-Fish and The Aquarium Wiki report 5 to 7 years, while Fischlexikon gives a maximum near 8, so the median endpoint has species-specific hobby support. The wider checker-a proposal of 6 to 10 comes from model knowledge. Kua et al. followed fish to 26 months, which is a survival observation rather than a maximum lifespan. No high-trust longevity study was found, so the final range remains low confidence.'

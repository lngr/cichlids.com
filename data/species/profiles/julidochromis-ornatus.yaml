  breeding:
    text: 'Eggs are placed on a protected surface in a cave or beneath a stone. Spawning can be concealed, with fry becoming visible only after they begin to leave the shelter. Both parents defend the brood, and older young or subordinate helpers may participate around the breeding site. Provide very small foods when fry begin feeding. As young grow, territorial exclusion can make continued family housing unsafe, so watch their access to refuge and food.'

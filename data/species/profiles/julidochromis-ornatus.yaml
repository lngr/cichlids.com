            min: 10
            max: 25
        - by: checker-a
          value:
            min: 9
            max: 25
        - by: checker-b
          value:
            min: 9
            max: 25
        - by: checker-c
          value:
            min: 10
            max: 25
      decision:
        min: 10
        max: 25
      rationale: 'The tally selects 10 to 25 dGH with unanimous verification, four agreeing votes and medium confidence. Generator and checker-c proposed 10 to 25; checker-a and checker-b proposed 9 to 25. These proposals agree within the two-degree threshold, and the median lower bound of 9.5 rounds to 10. The decision is narrower than their 9 to 25 proposal; FishBase also reports a 9 to 19 dH environment interval and Fischlexikon recommends 9 to 20 dH. Seriously Fish explicitly recommends 10 to 25 dGH, while TropicalFreshwaterFish recommends 10 to 22. Aqua-Fish gives the wider aquarium recommendation of 12 to 30 dGH, retained in evidence but given less weight than Seriously Fish. The natural range is contained without further widening.'
    - field: features.khDkh.tolerance.value
      proposals:
        - by: generator
          value:
            min: 15
            max: 20
        - by: checker-a
          value:
            min: 10
            max: 20
        - by: checker-b
          value:
            min: 10
            max: 20
        - by: checker-c
          value:
            min: 15
            max: 20
        - by: tiebreaker-1
          value:
            min: 10
            max: 20
        - by: tiebreaker-2
          value:
            min: 10
            max: 20
      decision:
        min: 10
        max: 20
      rationale: 'The tally selects 10 to 20 dKH by qualified majority, four of six votes, with low confidence. Generator and checker-c proposed 15 to 20; checker-a, checker-b, tiebreaker-1 and tiebreaker-2 proposed 10 to 20. The older Bangerter compilation of LiveAquaria advice explicitly recommends 10 to 20 for the albino captive form, and Aqua-notes lists 10 to 18 KH. Fischlexikon instead recommends 15 to 20. OATA gives 10 to 15 for African lake cichlids generally. JBL gives the wider 8 to 20 dKH range for a Tanganyika feeding group illustrated with J. marlieri, and Sera gives 8 to 10 for Tanganyika and Malawi collectively; these general recommendations do not establish long-term ornatus health at 8 dKH, so the selected range is narrower at its lower end than JBL''s 8 to 20. Natural lake measurements require inclusion of 15 to 20 but cannot establish a captive minimum. The retained checker-a inference from Seriously Fish''s 10 to 25 dGH is excluded because GH is not KH. Seachem explains that distinction without giving a numeric tolerance. No high-trust species-specific lifetime study supports the 10 dKH endpoint. The lowercase TropicalFreshwaterFish URL is offline; its earlier archived copy is retained and the capitalized URL remains readable.'
    - field: features.maxSizeCm.value
      proposals:
        - by: generator
          value:
            male: 9
            female: 8
        - by: checker-a
          value:
            male: 8
            female: 8
        - by: checker-b
          value:
            male: 8
            female: 9
        - by: checker-c
          value:
            male: 8.5
            female: 9
      decision:
        male: 8.5
        female: 8.5
      rationale: 'Generator proposed male 9 and female 8 cm; checker-a 8 and 8; checker-b 8 and 9; checker-c 8.5 and 9. Component medians are 8.25 and 8.5 cm. The final aquarium estimate is 8.5 cm for each sex because FishBase gives 8.5 cm total length without a dependable sex split, while Seriously Fish gives 8 cm standard length and says females are larger. Tawil and the southern locality account instead observe larger males; Tawil gives the wider 6 to 9 cm total-length range across related forms. The 7.5 cm maximum in Kua et al. is the largest fish in one laboratory stock at 26 months, not a universal adult ceiling. Equal sex estimates avoid making the conflicting size descriptions into a reliable sexing rule.'
    - field: features.diet.value
      proposals:
        - by: generator
          value:

  socialBehavior:
    text: 'Use a pair that has accepted one another. Raising juveniles together can allow a pair to form, but watch for displaced fish and provide another home before relentless chasing causes injuries. Unfamiliar adults may reject each other, and an established bond can fail after disturbance. Wild breeding groups sometimes include subordinate helpers that defend or maintain the shelter. That natural social flexibility does not make a group of unrelated adults a safe default in the minimum aquarium.'

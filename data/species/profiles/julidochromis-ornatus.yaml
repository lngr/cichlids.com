      rationale: 'All four full profiles agree on Lake Tanganyika. Generator names the northern lake and Mpulungu; checker-a names Mbity Rocks, Kasakalawe and disputed Uvira fish; checker-b emphasizes the southern type locality; checker-c names the north and Mbita Island. The accepted name and lake origin follow the Catalog of Fishes. Heg and Bachar directly studied southern fish, while Tawil and the locality specialist question assignment of northern yellow julies to this species. The locality list preserves that distinction rather than treating every trade locality as taxonomically secure.'
    - field: features.temperatureC.tolerance.value
      proposals:
        - by: generator
          value:
            min: 23
            max: 29
        - by: checker-a
          value:
            min: 22
            max: 29
        - by: checker-b
          value:
            min: 23
            max: 29
        - by: checker-c
          value:
            min: 23
            max: 29
      decision:
        min: 23
        max: 29
      rationale: 'The tally selects 23 to 29 C with unanimous verification, four agreeing votes and medium confidence. Generator, checker-b and checker-c proposed 23 to 29 C; checker-a proposed 22 to 29 C, within the one-degree agreement threshold. The median lower endpoint is 23 C. The decided interval is narrower than checker-a''s 22 to 29 C proposal and the 22 C minima reported by TropicalFreshwaterFish and FishBase. Seriously Fish recommends 23 to 27 C, and the association register gives 24 to 27.5 C. The maximum is widened to contain the natural 29 C endpoint. Kua et al. maintained a warm treatment around 28.1 C for eight months, but warming increased aggression and the study discusses reduced reproductive output; this supports exposure at the warm end rather than an optimal temperature or proof of lifelong health there.'
    - field: features.ph.tolerance.value
      proposals:
        - by: generator
          value:
            min: 7.5
            max: 9.4
        - by: checker-a
          value:
            min: 7.2
            max: 9.4
        - by: checker-b
          value:
            min: 7.5
            max: 9.4
        - by: checker-c
          value:
            min: 7.5
            max: 9.4
      decision:
        min: 7.5
        max: 9.4
      rationale: 'The tally selects pH 7.5 to 9.4 with unanimous verification, four agreeing votes and medium confidence. Generator, checker-b and checker-c proposed 7.5 to 9.4; checker-a proposed 7.2 to 9.4, within the 0.3 pH agreement threshold. The median lower endpoint is 7.5. Kua et al. report captive conditions of 7.2 to 8.5, so the decision excludes their lower 7.2 value and is narrower than checker-a''s wider 7.2 to 9.4 proposal. Seriously Fish recommends 7.5 to 9.0 and TropicalFreshwaterFish 7.5 to 9.2; the maximum remains 9.4 to contain the natural lake range. The laboratory interval documents maintenance conditions, not a controlled lifetime tolerance boundary.'
    - field: features.ghDgh.tolerance.value

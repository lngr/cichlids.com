variants:
  - name: Julidochromis ornatus 'Kambwimba'
    kind: locality
    note: Southeastern Lake Tanganyika population; the northern Ornatus-like population is treated separately by some specialists.
  - name: Julidochromis ornatus 'Mpulungu'
    kind: locality
    note: Southern locality form reported around Mpulungu.
  - name: Albino
    kind: color-morph
    note: Aquarium-bred form reported by Seriously Fish.

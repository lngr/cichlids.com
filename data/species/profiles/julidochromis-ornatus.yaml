  sexing:
    text: 'Body color usually gives little help in identifying sex. Mature genital papillae can differ in shape, but viewing them reliably is difficult. Published accounts disagree on which sex is larger, and that difference can change with locality and growth history. A size comparison between two shop fish therefore does not reliably establish a male-female pair.'

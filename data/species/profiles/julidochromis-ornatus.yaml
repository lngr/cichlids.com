  sizeAndGrowth:
    text: 'Plan for adult fish around 8.5 cm in either sex. Reports span roughly 8 to 9 cm, and an 8 cm standard-length record excludes the tail whereas total length includes it. Some southern observations find males larger; other aquarium accounts describe larger females. Growth history and locality complicate that comparison, so size alone is a weak sexing cue. The five to eight year lifespan estimate has only limited hobby support.'

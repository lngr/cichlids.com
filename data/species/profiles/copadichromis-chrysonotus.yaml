  compatibility:
    text: "Select peaceful Malawi companions that leave access to food and swimming space. Aulonocara and Cyrtocara\
      \ moorii are published examples, with enough additional space for the companion adults. Aggressive mbuna are\
      \ a poor behavioural match. Other Copadichromis share the presumed hybrid group and may also create identification\
      \ and male-rivalry problems. That caution rests on a genus-wide crossing warning, not a verified freely chosen\
      \ cross of every named pair. The fish does not require an exclusively conspecific aquarium."

  temperatureC:
    value:
      min: 21
      max: 29
    confidence: high
    rationale: "The fixed natural envelope is 21 to 29 C. Eccles reports cool-season inshore water reaching 21 C\
      \ and an upper-water temperature around 27 C; Vollmer describes seasonal surface warming to about 28 C, with\
      \ other campaigns underlying the lake synthesis reaching 29 C. FAO reports a narrower sampled interval of\
      \ 23 to 25 C, and Branchu a 22.8 to 25.4 C depth profile, neither of which describes every season. The inherited\
      \ whole-lake evidence entries are synthesis annotations, not measurements of that full envelope by each cited\
      \ study. FishBase ecology and aquarium care figures are retained separately and do not replace the lake studies.\
      \ Eccles was readable only as a literature-search abstract; its DOI page was blocked and fetch-oa declined\
      \ a non-open-access full text."

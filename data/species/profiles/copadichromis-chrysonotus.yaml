  ghDgh:
    value:
      min: 3
      max: 5
    confidence: high
    rationale: "Use the lake synthesis of 3 to 5 dGH. Calcium and magnesium in Branchu Table 2 produce about 4.2\
      \ to 4.6 dGH in the upper 50 m; historical datasets compiled by FAO extend to approximately 3.2 to 4.9 dGH.\
      \ The adopted integer range rounds these observations outward. FishBase gives 10 to 15 dH and Seriously Fish\
      \ 10 to 25 dGH, but measured calcium and magnesium determine natural GH. Alkaline water does not by itself\
      \ imply high calcium-magnesium hardness."

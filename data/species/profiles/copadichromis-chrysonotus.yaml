  sexing:
    text: "A coloured adult male is the most useful visual reference: males are generally larger and longer-finned,\
      \ with blue colouring, a lighter upper surface and white or yellow areas. Females and juveniles are typically\
      \ silver or brassy and may carry three lateral blotches. Those markings do not describe the male pattern used\
      \ by the compatibility features. Dull fish of several Copadichromis species are difficult to separate, and\
      \ the historical trade name alone cannot distinguish C. chrysonotus from C. azureus."

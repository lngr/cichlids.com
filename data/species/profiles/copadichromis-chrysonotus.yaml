  breeding:
    text: "The female takes responsibility for incubation after eggs are released and collected in the water column.\
      \ A substrate nest is unnecessary. Male breeding areas are mobile and occur near the surface in sheltered\
      \ locations. The species-specific reproductive study supports this description through its readable abstract;\
      \ its full text was unavailable under the open-access rules. Aquarium guidance places brood release roughly\
      \ three to four weeks after spawning. Disturbance and renewed aggression toward a brooding female can interrupt\
      \ the process, so a stable social setting matters."

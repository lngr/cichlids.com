  problems:
    text: "Misidentified purchases can undermine both a breeding project and the compatibility assessment. Confirm\
      \ stock identity before relying on locality or trade labels such as White Blaze or Jacksoni. Crowding and\
      \ forceful companions can disrupt feeding and courtship; moving a brooding female may add stress or lead to\
      \ social difficulties on her return. Wider hardness recommendations and isolated aquarium readings remain\
      \ evidence rather than experimental health limits. Reported lifespan and feeding-speed values are provisional,\
      \ and a species-specific protein-related bloat syndrome was not established."

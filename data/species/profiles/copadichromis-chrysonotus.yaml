        \ recommends 5 to 10 dKH for Malawi aquariums; Sera gives the same buffering range for community\
        \ aquariums. Seriously Fish recommends pH 7.5 to 8.5 and GH 10 to 25 dGH for this species without a KH\
        \ limit. The selected KH range contains the natural 5 to 8 dKH range and supports the alkaline husbandry\
        \ guidance underlying the pH 7.5 to 8.6 and GH 3 to 25 dGH tolerances; GH is not converted to KH.\

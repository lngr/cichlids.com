  maxSizeCm:
    value:
      male: 16
      female: 12
    confidence: medium
    rationale: "The proposals are 16/13.5 cm from generator, 16/13 from checker-a, 16/12 from checker-b and 16/13\
      \ from checker-c, giving starting medians of 16 cm male and 13 cm female. Retain 16 cm for males; FishBase\
      \ gives 16.3 cm total length and Seriously Fish 16 cm standard length, which are different measurements and\
      \ must not be averaged as equivalents. Change the female median to 12 cm because the Nordic association directly\
      \ states 12 cm and the federation independently gives an upper bound of 12 cm. The lower-trust Einrichtungsbeispiele\
      \ figure of 13 cm remains evidence of a slightly larger female. Malawi Mayhem gives a wider unsexed 15.2 to\
      \ 20.3 cm range but also uses the unreliable Jacksoni label, so it does not set sex-specific typical maxima.\
      \ Inherited entries filling an unspecified female size with a male or association value are not independent\
      \ measurements of females."

  habitat:
    text: "Rocky shores and sheltered inshore waters provide the setting, but the fish spends much of its time swimming\
      \ above the substrate. Sand is also recorded in the public habitat summary. The lake envelope used here is\
      \ 21 to 29 C, pH 7.7 to 8.6, GH 3 to 5 dGH and alkalinity equivalent to 5 to 8 dKH. These are seasonal habitat\
      \ values rather than constant aquarium targets. Lake Malombe is also a documented occurrence. The calcium\
      \ and magnesium measurements show that high pH and substantial buffering do not make the native water highly\
      \ mineral-hard."

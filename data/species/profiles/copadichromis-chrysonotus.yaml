status: described
taxonomy:
  validName: Copadichromis chrysonotus
  genus: Copadichromis
  species: chrysonotus
  author: "(Boulenger, 1908)"
  source:
    kind: catalog-of-fishes
    title: "Eschmeyer's Catalog of Fishes, species of the genus Copadichromis"
    url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Copadichromis"
    accessed: 2026-10-13
    archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-24880c11/2026-10-14T095213Z
  synonyms:
  - name: Paratilapia chrysonota
    note: Original name established by Boulenger in 1908 and linked by the Catalog of Fishes to the current combination.
  - name: Haplochromis chrysonotus
    note: Historical combination; the same wording was also misapplied in the aquarium trade to C. azureus.
  - name: Cyrtocara chrysonota
    note: Former combination and the name of legacy entry 286.
  - name: Cyrtocara chrysonotus
    note: Historical spelling recorded by the Nordic association; it is not a separately accepted species.
  legacyNames:
  - Copadichromis chrysonotus
  - Cyrtocara chrysonota
  note: "The current name follows the Catalog of Fishes. Its Cyrtocara listing contains only C. moorii, so neither\
    \ former Cyrtocara spelling is accepted there as a separate species. The trade label Jacksoni is unreliable\
    \ because Copadichromis jacksoni is a distinct valid species. Fish sold as Haplochromis chrysonotus are frequently\
    \ C. azureus; historical names do not establish the identity of aquarium stock."
names:
  trade:
    en:
    - Chrysonotus cichlid
    - Lake Malawi utaka
variants:
- name: Mumbo (White Blaze)
  kind: locality
  note: An archive advertisement uses this locality label. It does not establish a distinct colour form or verify
    the identity of the advertised stock.
features:
  origin:
    value:
      continent: Africa
      region: Lake Malawi and Lake Malombe
      waterbody: lake-malawi
      localities:
      - Karonga to Monkey Bay
      - Lake Malombe
    confidence: high
    rationale: "The Catalog of Fishes confirms Lake Malawi, and FishBase adds Lake Malombe and records Karonga to\
      \ Monkey Bay. The public CRC summary places the native lake region in Malawi, Mozambique and Tanzania. Lake\
      \ Malombe is a recorded occurrence rather than a claimed morph. Forum identifications, trade advertisements\
      \ and the erroneous Congo distribution claim are retained as historical context, not distribution measurements."

partners:
  suitable:
  - species: Aulonocara stuartgranti
    reason: The cited care sources recommend calm Aulonocara companions with compatible Malawi conditions.
    condition: "An enlarged community footprint is needed for both social units, and similar male coloration can\
      \ increase rivalry."
  - species: Cyrtocara moorii
    reason: Seriously Fish names this peaceful Malawi hap as a possible companion.
    condition: Provide space beyond the four-fish C. chrysonotus minimum for the companion adults.
  - species: Placidochromis electra
    reason: A provisional example of the calm Malawi-hap category; direct long-term evidence for this exact pairing
      was not found.
    condition: Additional swimming room and reliable food access for both groups are necessary.
  unsuitable:
  - species: Copadichromis azureus
    reason: It shares the presumed hybrid group and is frequently confused with this species in trade stock.
  - species: Melanochromis auratus
    reason: Aggressive mbuna do not suit this comparatively quiet open-water fish.
  - species: Neolamprologus similis
    reason: A shell-based Tanganyika setup does not meet the social and swimming-space requirements of this Malawi
      utaka; no routine predation on adult shell dwellers is claimed.
profile:
  overview:
    text: "Reliable identification matters before planning a group of this utaka. Aquarium labels have often been\
      \ applied to C. azureus instead of C. chrysonotus. The true species uses the near-shore water column of Lakes\
      \ Malawi and Malombe to take drifting plankton. Its courtship takes place above the bottom, and the female\
      \ incubates the resulting brood. A calm Malawi community can accommodate it when the adults have sufficient\
      \ swimming room."
    sources:

  husbandry:
    text: "The defined minimum is approximately 304 L with a 150 by 45 cm footprint for one male and three females.\
      \ Arrange a broad unobstructed swimming area with a sand floor and modest shelter near the edges. Several\
      \ males require a substantially larger arrangement. Maintain effective biological filtration and oxygenation,\
      \ and make changes gradually. The decided tolerances are 21 to 29 C, pH 7.5 to 8.6, GH 3 to 25 dGH and KH\
      \ 5 to 10 dKH. KH guidance derives from Malawi aquarium buffering advice, with low confidence because\
      \ species-specific long-term KH limits are absent. Maintain a stable alkaline pH; GH does not determine KH.\
      \ The evidence also includes narrower temperature recommendations."

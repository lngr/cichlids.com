  socialBehavior:
    text: "An adult aquarium group with three females for each male distributes courtship attention. The fish forms\
      \ shoals in nature, while reproductive males exclude competing males from a moving volume of water. Regular\
      \ male competition supports conspecific aggression level 2. Responses to other species are usually limited\
      \ to displays or reactions to similar-looking fish, represented by level 1. The territory is classified as\
      \ small and breeding-only for the recommended aquarium setup; reports of much larger wild breeding areas remain\
      \ relevant when planning multiple males."

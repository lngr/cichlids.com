        \ votes and medium confidence. Generator, checker-b, checker-c, tiebreaker-1 and tiebreaker-2 propose 3\
        \ to 25; checker-a proposes 3 to 15. Seriously Fish explicitly recommends 10 to 25 dGH, while FishBase gives\
        \ 10 to 15 dH, Einrichtungsbeispiele 5 to 15 dGH, the federation 8 to 15 dGH and Aquariumpro 8 to 20 dGH.\
        \ Their narrower guidance does not establish that 15 or 20 dGH is a physiological ceiling. Extend downward\
        \ to contain the measured lake range of 3 to 5 dGH. Aquarium reports at 12 and 17 dGH are retained as observations\
        \ without verified identity or long-term outcome. The 25 endpoint is a care-sheet recommendation, not a\
        \ tested survival boundary."

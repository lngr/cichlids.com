  diet:
    text: "Animal plankton is the main natural food, placing the species in the invertivore category. Match that\
      \ feeding mode with small crustacean foods and appropriately sized prepared feeds delivered where the group\
      \ can reach them. Some plant material can occur in a varied ration without changing the primary diet category.\
      \ The evidence does not establish a special sensitivity to protein-related bloat. Predation level 0 permits\
      \ accidental fry capture but does not describe regular hunting of small adult fish. Feeding speed is provisionally\
      \ normal because comparative observations were unavailable."

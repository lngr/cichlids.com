  sizeAndGrowth:
    text: "Plan for males around 16 cm and females around 12 cm, with some uncertainty about the upper size of females.\
      \ The Nordic association and French federation provide separate sex figures; a different hobby page gives\
      \ females 13 cm. FishBase reports 16.3 cm total length for male or unsexed fish, whereas Seriously Fish gives\
      \ 16 cm standard length, excluding the tail. Those measurements cannot be treated as identical. The lifespan\
      \ estimate of five to eight years has low confidence, and no dependable aquarium growth curve was verified."

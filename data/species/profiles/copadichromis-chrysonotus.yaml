      \ to 7.3 dKH, while Branchu profiles give about 6.5 to 6.9 dKH. The integer envelope rounds outward across\
      \ the measurements. These are alkalinity equivalents rather than an independent calcium measurement; carbonate\
      \ buffering may exceed general hardness in this sodium-containing lake water."

  sizeAndGrowth:
    text: "Most direct trade-form accounts give an overall adult length around 10 to 12 cm, with other listings
      extending from 8 cm to about 12.7 cm. Sex-specific adult measurements are missing. The planning sizes of
      12 cm for males and 10.5 cm for females come from the medians of the submitted estimates, not a measured
      growth series. Males may be more conspicuous without being reliably sexed by length alone. The lifespan
      estimate of five to eight years is also provisional; a four-to-ten-year figure under a conflated
      nyererei identity is indirect evidence."

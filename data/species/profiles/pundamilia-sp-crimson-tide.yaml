        established by it."
  legacyNames:
    - "Pundamilia spec. \"crimson tide\""
  note: "The Catalog lists five described Pundamilia species but no Crimson Tide entry; a Haplochromis genus
    lookup also supplies no described identity for this name. CRC explicitly lists a separate undescribed
    Pundamilia form. Keep it apart from Pundamilia nyererei. FishBase has no summary for the informal name
    (HTTP 404); its separately read nyererei summary is comparative only. Hobby sources disagree about
    northern-lake versus possible captive provenance, with no verified collecting locality or ancestry. These
    uncertainties do not justify assigning hybrid or domestic-form status."

  habitat:
    text: "The reported habitat is the rocky northern littoral of Lake Victoria, with Kenya named and Uganda
      considered possible. These broad reports do not establish a particular reef. Typical compiled lake
      values are 22 to 30 C, pH 6.8 to 9.4, GH 1 to 3 dGH and KH 2 to 6 dKH. Individual studies cover
      different places and periods: sheltered Tanzanian bays also produced 24.9 to 32.3 C in Mbonde's study,
      and Makaka's monitoring includes pH 6.3 to 10.52 in pelagic waters and 6.47 to 10.16 near shore. Those
      wider observations include exceptional endpoints outside this profile's typical natural ranges and are
      not aquarium targets. Use stable rock shelter over sand or fine gravel; plants and roots described in
      aquarium guidance are optional decor rather than proof of wild habitat dependence."
    sources:
      - kind: "website"

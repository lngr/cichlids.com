  diet:
    text: "Offer both plant material and small aquatic invertebrate foods. The exact-form association account
      includes algae and plankton, while other sources emphasize zooplankton or insects; the combined evidence
      supports an omnivorous diet. Algae-based prepared food and modest portions of small crustacean food can
      supply variety. The Nordic association advises a protein content below 35 percent, so rich animal food
      should not dominate the menu. A particular tendency toward protein-induced bloat has not been
      demonstrated, and the false bloat flag does not mean that every diet is safe. Occasional consumption of
      fry is plausible, but the predation rating is inferred rather than measured."

  problems:
    text: "Persistent pursuit, fin damage and unstable group composition are the principal reported husbandry
      risks. Rock cover reduces exposure but cannot guarantee that a particular group remains compatible.
      Retail identity is another problem: accounts of nyererei are sometimes presented as Crimson Tide, and a
      supposed Ruti Island cross is not secure parentage evidence. Avoid drawing conclusions about
      reproductive isolation from an empty historical hybrid registry. The water tolerances and lifespan
      remain weakly established; keep chemistry stable and watch fish condition rather than repeatedly moving
      water toward reported extremes. No distinct disease syndrome or immunity to bloat has been demonstrated
      for this trade form."

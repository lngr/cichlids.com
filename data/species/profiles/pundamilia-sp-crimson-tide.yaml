  temperatureC:
    value:
      min: 22
      max: 30
    confidence: "high"
    rationale: "Lake Victoria field studies support the unchanged tally range of 22 to 30 C, with waterbody
      verification and high confidence. FAO reports 23 to 28 C; Orina reports Kenyan-beach means of 23.4 to
      29.5 C, and Makaka reports littoral observations down to 22.3 C. Their rounded lake synthesis describes
      spatial and seasonal variation. Mbonde also reports a wider nearshore interval of 24.9 to 32.3 C; that
      exceptional sheltered-bay maximum is retained in evidence and habitat prose, rather than changing the
      prescribed typical lake range. No temperature study establishes this trade form's collection site."

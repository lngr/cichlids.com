    rationale: "The male proposals are generator 12, checker-a 10, checker-b 12 and checker-c 12 cm; the median is
      12. Female proposals are 11, 8, 10 and 11 cm, giving a median of 10.5. Nordic lists one overall maximum
      of 12 cm, Zoopet 11 cm, Haplochromis.fr 10 cm and Victorian Cichlids 8 cm. Wet Spot gives the wider
      overall adult interval of about 10.2 to 12.7 cm. None establishes sex-specific aquarium maxima, so the
      median split is a planning estimate. The smaller breeding-report fish were under six months old, and
      standard lengths for nyererei cannot be substituted for this form's total length."

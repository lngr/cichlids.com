  compatibility:
    text: "A mixed aquarium is possible with robust fish of comparable size, compatible food needs and sufficient
      territorial separation. Reports allowing other Lake Victoria cichlids do not establish universal safety
      with named species, and extra stock needs room beyond the minimum for the Crimson Tide group. Keep
      Pundamilia nyererei separate because the decided pairwise crossing group is presumed: general warnings
      and uncertain keeper reports support a caution, not a verified cross under free partner choice. Other
      visually similar Pundamilia also require caution, without inferring additional hybrid groups. Small
      peaceful fish can be intimidated, and fry may be eaten opportunistically. Shared soft natural water
      alone does not make a South American dwarf-cichlid community socially suitable."
    sources:

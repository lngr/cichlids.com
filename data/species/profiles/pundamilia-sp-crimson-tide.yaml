  ghDgh:
    value:
      min: 1
      max: 3
    confidence: "high"
    rationale: "Keep the tallied natural Lake Victoria range of 1 to 3 dGH, high confidence and waterbody
      verification. FAO main-lake calcium of 5.0 to 7.0 mg/L and magnesium of 2.3 to 3.5 mg/L give about 1.2
      to 1.8 dGH using Ca/7.14 + Mg/4.34. Burgis reports gulf calcium of 8.2 to 11.4 and magnesium of 2.1 to
      3.2 mg/L, giving about 1.6 to 2.3 dGH. The outward-rounded synthesis covers these dilute waters;
      hard-water aquarium recommendations address captive tolerance."
    sources:

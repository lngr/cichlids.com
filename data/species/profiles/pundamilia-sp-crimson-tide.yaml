  socialBehavior:
    text: "Use a group rather than assume a permanent pair. The Nordic register recommends roughly ten fish with a
      balanced sex composition and at least three males, warning that exactly two males can concentrate
      rivalry. Zoopet's five-to-six-fish suggestion concerns juveniles raised together and is not a verified
      adult minimum. Conspecific pursuit can become persistent, especially with inadequate cover or an
      unstable composition. Territorial males may also chase other species from a rock-associated site, and
      the evidence does not establish that this defense disappears outside breeding. Respond to repeated
      injuries or a fish that cannot feed or leave cover by separating the threatened individual."
    sources:

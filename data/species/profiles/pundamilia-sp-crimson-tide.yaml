partners:
  suitable:
    - species: "Other robust Lake Victoria cichlids of different appearance"
      reason: "Exact-form guidance permits a community with sufficiently robust fish; no read account establishes
        universal success with a specific named partner."
      condition: "A larger tank than the adult-group minimum, separate rock territories, compatible diets and
        observation of individual behavior."
  unsuitable:
    - species: "Pundamilia nyererei"
      reason: "The decided presumed pairwise group flags a plausible unwanted cross; similar trade labels also
        undermine identity records."
    - species: "Other visually similar Pundamilia"
      reason: "General aquarium warnings concern aggression and crossing with lookalikes, even where no specific
        additional group is established."
    - species: "Mikrogeophagus ramirezi"
      reason: "A small peaceful dwarf cichlid is vulnerable to pursuit; the legacy mixed-tank report describes
        aggression and is not evidence for a safe pairing."
    - species: "Corydoras aeneus"
      reason: "Small peaceful catfish do not provide the robust social match advised for this territorial
        haplochromine; the legacy community report offers no verified safety."
profile:
  overview:
    text: "Pundamilia sp. 'crimson tide' is an undescribed aquarium haplochromine associated with Lake Victoria.
      Curated listings treat it separately from Pundamilia nyererei, even though sellers sometimes apply that
      described species name to Crimson Tide. Northern-lake origin is reported, but no verified collecting
      site or ancestry is available, and an older hobby account questions whether aquarium stock has a wild
      origin. Adult males vary in appearance; a red snout is the most consistently described mark. The social
      and identification uncertainties make this a demanding choice for keepers who can manage territorial
      fish and maintain separate breeding identities."

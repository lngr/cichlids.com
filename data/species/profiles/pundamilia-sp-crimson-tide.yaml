  disagreements:
    - field: "features.origin"
      proposals:
        - by: "generator"
          value:
            continent: "Africa"
            region: "Lake Victoria, northern basin"
            waterbody: "Lake Victoria"
            localities:
              - "Kenyan part of Lake Victoria; possibly Uganda"
        - by: "checker-a"
          value:
            continent: "Africa"
            region: "Lake Victoria"
            waterbody: "lake-victoria"
            localities: []
        - by: "checker-b"
          value:
            continent: "Africa"
            region: "Lake Victoria"
            waterbody: "lake-victoria"
            localities:
              - "Northern Lake Victoria, likely Kenyan waters; Uganda is also possible"
        - by: "checker-c"
          value:
            continent: "Africa"
            region: "Lake Victoria, northern shore"
            waterbody: "Lake Victoria"
            localities: []
      decision:
        continent: "Africa"
        region: "Lake Victoria, northern basin reported"
        waterbody: "lake-victoria"
        localities: []
      rationale: "Generator and checker-b infer broad Kenyan or possible Ugandan localities; checker-a and checker-c
        leave collection sites empty. Nordic and Zoopet registers associate the form with northern Lake
        Victoria, while the older Victorian Cichlids page disputes its provenance and raises an unconfirmed
        captive-origin possibility. Keep the lake association but no collecting locality: none is documented.
        The CRC recognizes a separate undescribed form, without proving wild ancestry."
    - field: "features.ghDgh.tolerance"
      proposals:
        - by: "generator"
          value:
            min: 1
            max: 8
        - by: "checker-a"
          value:
            min: 1
            max: 15
        - by: "checker-b"
          value:
            min: 1
            max: 3
        - by: "checker-c"
          value:
            min: 1
            max: 3
        - by: "tiebreaker-1"
          value:
            min: 1
            max: 15
        - by: "tiebreaker-2"
          value:
            min: 1
            max: 18
      decision:
        min: 1
        max: 15
      rationale: "The 1 to 12 dGH median tally gives habitat-based proposals undue weight despite husbandry
        guidance for harder water. The 1 to 15 dGH tolerance contains the natural 1 to 3 dGH and the
        4 to 15 dGH recommendation for the congener P. nyererei in Seriously Fish. Fishkeeper describes
        successful keeping of Lake Victoria cichlids in both neutral and hard, alkaline water. OATA's
        12 to 18 dGH guidance covers African lake cichlids broadly and carries less weight than the
        congener account. The conflated retail account gives 6 to 10 dH without establishing a harmful
        threshold. No consulted source reports harm above the natural range or at 12 dGH. Confidence is
        low because the range combines lake measurements with congener husbandry advice, without a
        long-term hardness study of this form."
    - field: "features.khDkh.tolerance"
      proposals:
        - by: "generator"
          value:
            min: 2
            max: 8
        - by: "checker-a"
          value:
            min: 2
            max: 10
        - by: "checker-b"
          value:
            min: 2
            max: 6
        - by: "checker-c"
          value:
            min: 2
            max: 6
      decision:
        min: 2
        max: 15
      rationale: "The 2 to 7 dKH unanimous tally ties the tolerance closely to lake chemistry without evidence
        of harm above that interval. The 2 to 15 dKH tolerance combines the natural 2 to 6 dKH with
        OATA's 10 to 15 dKH husbandry guidance for African lake cichlids. The Nordic register recommends
        pH 7.5 to 8 for this form; Seriously Fish gives pH 7.0 to 8.5 and GH 4 to 15 dGH for P. nyererei,
        and Fishkeeper describes successful Lake Victoria cichlid keeping in neutral and hard, alkaline
        water. These accounts support a broader buffering allowance within the profile's pH 6.8 to 9.4
        and GH 1 to 15 dGH tolerances. GH and pH do not calculate KH. No consulted source states a KH
        tolerance for this form or reports harm above the natural KH range. Confidence is low because
        the upper bound is a group-level husbandry inference, not a measured physiological limit."
    - field: "features.maxSizeCm"
      proposals:
        - by: "generator"
          value:
            male: 12
            female: 11
        - by: "checker-a"
          value:
            male: 10
            female: 8
        - by: "checker-b"
          value:
            male: 12
            female: 10
        - by: "checker-c"
          value:
            male: 12
            female: 11
      decision:
        male: 12
        female: 10.5
      rationale: "The male proposals are generator 12, checker-a 10, checker-b 12 and checker-c 12 cm; the median is
        12. Female proposals are 11, 8, 10 and 11 cm, giving a median of 10.5. Nordic lists one overall
        maximum of 12 cm, Zoopet 11 cm, Haplochromis.fr 10 cm and Victorian Cichlids 8 cm. Wet Spot gives the
        wider overall adult interval of about 10.2 to 12.7 cm. None establishes sex-specific aquarium maxima,
        so the median split is a planning estimate. The smaller breeding-report fish were under six months
        old, and standard lengths for nyererei cannot be substituted for this form's total length."
    - field: "features.predation"
      proposals:
        - by: "generator"
          value: 1
        - by: "checker-a"
          value: 1
        - by: "checker-b"
          value: 1
        - by: "checker-c"
          value: 0
        - by: "tiebreaker-1"
          value: 1
        - by: "tiebreaker-2"
          value: 1
      decision: 1
      rationale: "Retain level 1 with qualified-majority verification, 5 of 6 votes and low confidence. Generator,
        checker-a, checker-b and both tie-breakers propose 1; checker-c proposes 0. Species-specific feeding
        accounts concern algae and plankton, but absence of fish-prey records does not establish that fry are
        never eaten. Occasional fry consumption is a cautious inference for this small omnivorous
        haplochromine. The 2 cm prey threshold belongs to the rubric and was not measured for Crimson Tide.
        Related-species and conflated retail accounts contribute indirect support only; no regular piscivory
        is demonstrated."
    - field: "features.diet"
      proposals:
        - by: "generator"
          value:
            type: "omnivore"
            bloatSensitive: false
            foods:
              - "algae"
              - "plankton"
              - "zooplankton"
              - "small crustaceans"
        - by: "checker-a"
          value:
            type: "invertivore"
            bloatSensitive: false
            foods:
              - "zooplankton"
              - "insect larvae"
              - "frozen Artemia and Daphnia"
              - "mosquito larvae"
              - "mysis"
              - "quality pellets and flakes with some plant matter"
        - by: "checker-b"
          value:
            type: "omnivore"
            bloatSensitive: false
            foods:
              - "algae"
              - "plankton"
              - "zooplankton"
              - "aquatic insect larvae"
        - by: "checker-c"
          value:
            type: "omnivore"
            bloatSensitive: false
            foods:
              - "algae"
              - "zooplankton"
              - "insect larvae"
        - by: "tiebreaker-1"
          value:
            type: "omnivore"
            bloatSensitive: false
        - by: "tiebreaker-2"
          value:
            type: "omnivore"
            bloatSensitive: false
      decision:
        type: "omnivore"
        bloatSensitive: false
        foods:
          - "algae"
          - "plankton"
          - "zooplankton"
          - "small crustaceans"
      rationale: "Retain the tally's omnivore value, false bloatSensitive flag and food list, with
        qualified-majority verification, 5 of 6 votes and medium confidence. Generator, checker-b, checker-c
        and both tie-breakers propose omnivore with false; checker-a proposes invertivore with false. The
        Nordic association describes both algae and plankton for this exact form and Wet Spot independently
        lists plant material and small invertebrates; these outweigh the lower-trust Zoopet zooplankton
        emphasis and the transfer of congener diets. The Nordic advice to keep food protein below 35 percent
        does not itself demonstrate protein-induced bloat. False records an unestablished species-specific
        tendency, not immunity, and there are no measured bloat-incidence data."
    - field: "features.aggressionConspecific"
      proposals:
        - by: "generator"
          value: 3
        - by: "checker-a"
          value: 3
        - by: "checker-b"
          value: 3
        - by: "checker-c"
          value: 2
      decision: 3
      rationale: "Generator, checker-a and checker-b propose 3; checker-c proposes 2. Zoopet explicitly describes
        territorial aggression, the Nordic register warns against a two-male arrangement, and the species
        profile calls conspecific temperament aggressive. Persistent pursuit and injury risk with inadequate
        space or social balance fit level 3 better than ordinary hierarchy alone. Routine lethal fighting is
        not established for this form; the more severe nyererei evidence is comparative."
    - field: "features.aggressionHeterospecific"
      proposals:
        - by: "generator"
          value: 2
        - by: "checker-a"
          value: 2
        - by: "checker-b"
          value: 2
        - by: "checker-c"
          value: 1
      decision: 2
      rationale: "Generator, checker-a and checker-b propose 2; checker-c proposes 1. Zoopet reports territorial
        aggression while permitting suitable Lake Victoria tankmates, and a legacy keeper describes aggression
        toward smaller community fish. Territorial chasing fits level 2; the evidence does not establish
        routine attacks on similar-sized fish beyond the territory. Retain the conflated retail account and
        mixed-tank anecdotes, which point in opposite directions."
    - field: "features.territory"
      proposals:
        - by: "generator"
          value:
            size: "small"
            breedingOnly: true
        - by: "checker-a"
          value:
            size: "small"
            breedingOnly: false
        - by: "checker-b"
          value:
            size: "small"
            breedingOnly: true
        - by: "checker-c"
          value:
            size: "small"
            breedingOnly: false
      decision:
        size: "small"
        breedingOnly: false
      rationale: "All runs propose a small territory. Generator and checker-b mark breedingOnly true; checker-a and
        checker-c mark it false. Nordic describes spawning beside a rock and Zoopet reports territorial
        aquarium behavior without limiting it to egg care. False avoids asserting that defense occurs only
        while breeding. Neither the defended radius nor its persistence has been measured for Crimson Tide,
        and experiments on described congeners are indirect."
    - field: "features.habitatZones"
      proposals:
        - by: "generator"

  breeding:
    text: "Females incubate the brood in their mouths after spawning near a rock. The exact-form registers report
      brooding for about 17 to 19 days or around three weeks, with clutch estimates roughly spanning 15 to 35
      eggs or young. These figures come from aquarium accounts and vary with conditions. A brooding female
      needs protection from persistent pursuit. Once released, young need small foods and shelter from adults;
      incidental predation is possible. Keep breeder identity records clear because the Crimson Tide name does
      not identify a verified locality and crosses with lookalike fish are plausible."
    sources:

  sexing:
    text: "Mature males are usually brighter than females, with the red snout described across variable male color
      patterns. Females are reported as subdued or grey in older aquarium accounts. Young and stressed fish
      can be difficult to identify, so one photograph, one color or size alone does not reliably establish sex
      or species. There is no supported fixed barred pattern for all adult males. Treat labels such as Red
      Snout Nyererei as trade names and confirm breeding identity through consistent parentage records rather
      than assigning the fish to Pundamilia nyererei by appearance."

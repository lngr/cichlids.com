  husbandry:
    text: "For the recommended group of about ten adults, provide at least 250 litres with a base about 125 cm
      long and 45 cm deep. The association gives volume and length; depth is a practical estimate for
      distributing rock shelter. Place rocks securely before adding substrate because spawning fish dig. Break
      sight lines and provide escape routes so subordinate fish can move between shelters. Maintain
      filtration, oxygenation and stable water conditions. Exact-form care guidance supports routine settings
      around 24 to 26 C and pH 7.5 to 8. The adopted tolerances are 22 to 30 C, pH 6.8 to 9.4, GH 1 to 15 dGH
      and KH 2 to 15 dKH, all with low confidence; lake observations and group-level extrapolations do not
      demonstrate years of aquarium health at every endpoint."
    sources:

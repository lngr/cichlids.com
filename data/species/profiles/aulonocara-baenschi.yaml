partners:
  suitable:
    - species: Placidochromis electra
      reason: Calm sand-dwelling Malawi hap of similar size with a different, blue colour and no peacock ancestry.
      condition: Tank of at least 150 cm length.
    - species: Otopharynx lithobates
      reason: Peaceful hap of similar size from the same lake with a distinct colour pattern.
    - species: Copadichromis borleyi
      reason: Open-water hap that uses another zone of the tank and differs in colour.
      condition: Tank of at least 150 cm length.
    - species: Labidochromis caeruleus
      reason: One of the few peaceful mbuna; it does not crowd the peacock at feeding time.
      condition: Enough rockwork; watch the male peacock for aggression against the yellow colour.
    - species: Cyrtocara moorii
      reason: Calm, slow sand-dwelling hap that keeps to the open sand and does not compete for caves.
      condition: Tank of at least 150 cm length and 400 L.
    - species: Synodontis njassae
      reason: Lake Malawi catfish active at night that occupies the bottom without competing for territories.
  unsuitable:
    - species: Aulonocara stuartgranti
      reason: Same hybrid group; the drab females are hard to tell apart and the species cross readily.
    - species: Aulonocara jacobfreibergi
      reason: Same hybrid group; crosses with A. baenschi and its males compete for the same sand-rock territories.
    - species: Maylandia zebra
      reason: Hasty, boisterous mbuna that outcompetes the peacock at feeding and harasses it constantly.
    - species: Melanochromis auratus
      reason: Very aggressive mbuna that injures calmer haps in all but very large tanks.
    - species: Sciaenochromis fryeri
      reason: Males share the blue head colour and provoke rival fights; its males court peacock females and crosses are reported in the hobby.
    - species: Tropheus moorii
      reason: Kept only with its own species, needs a plant-based diet and Lake Tanganyika water.

profile:
  overview:
    text: >-
      Aulonocara baenschi is a peacock cichlid from Lake Malawi, known to hobbyists as the yellow
      peacock or new yellow regal. Adult males are among the brightest fish of the lake, with a
      lemon yellow body and a blue face that they show all year. Females are much plainer. The
      species is calm for a Malawi cichlid and fits well into a tank with other peaceful haps of
      different colour. In the wild it is critically endangered: the IUCN lists it as such because
      collecting for the aquarium trade has sharply reduced the small population at Nkhomo Reef.
      Fish in the trade are mostly captive bred, and keepers can help by buying pure, correctly
      labelled stock and by keeping it apart from other peacocks, so that the line does not become
      mixed.
    sources:
      - *cof
      - *fb
      - *sf
      - *lee2020
      - *fip
      - *la
      - *wiki
  habitat:
    text: >-
      The species is endemic to Lake Malawi. It is known for certain from Nkhomo Reef near Benga on
      the central western shore, and further western-shore sites such as Usisya, the Maleri Islands
      and Chipoka are listed in databases. It lives where rocky shores give way to sand with
      scattered stones, mostly in 4 to 6 m of water and occasionally down to about 16 m. Males
      claim a hollow under or beside a rock, while females and young fish move about in small groups
      over the sand. The lake water is soft, with a total hardness of about 3 to 5 dGH, but well
      buffered at 5 to 8 dKH, with a pH of 7.7 to 8.6 and temperatures between about 21 and 29 C
      over the year.
    sources:
      - *cof
      - *fb
      - *sf
      - *wiki
      - *branchu
      - *fao
      - *eccles
  sizeAndGrowth:
    text: >-
      Males usually reach about 13 cm total length in the aquarium; females stay smaller at around
      10 cm. Young fish grow steadily on a varied diet offered in several small portions a day.
      Males become distinguishable from females at about four months and then develop their yellow
      colour step by step; full colour comes only with adult size. With good water care the species
      can live for around eight to ten years, although reliable data on its life span are scarce.
    sources:
      - *fb
      - *sf
      - *fip
      - *la
      - *wiki
  husbandry:
    text: >-
      For one male and four females a tank of at least 120 cm length, 45 cm front-to-back depth and
      about 240 L is needed; more length allows a larger group. Use fine sand, because the fish sift
      it for food and coarse gravel can harm the gills. Build several rock piles with caves, leaving
      open sand between them. Plants that tolerate alkaline water, such as Vallisneria or Anubias,
      are left alone. Water around 24 to 27 C with a pH near 8 and a moderate carbonate hardness
      suits the species well; it copes with harder tap water, but stable values matter more than
      exact figures. Peacocks react badly to rising nitrate and sudden changes, so the tank should
      be mature before they move in, strongly filtered and given large weekly water changes.
    sources:
      - *sf
      - *fip
      - *la
      - *tfh
  socialBehavior:
    text: >-
      A dominant male holds a small territory around a cave or a stone and displays to every female
      that passes. Rival males spar, so in tanks of normal size only one adult male should be kept,
      together with four or more females that share his attention. Towards differently coloured,
      calm species the yellow peacock is fairly tolerant. It does, however, chase fish that resemble
      it, especially yellow or blue males, and drives other fish away from its spot, most of all
      when spawning. Subdominant or stressed fish show dark bars and lose colour.
    sources:
      - *sf
      - *la
      - *fip
      - *wiki
  diet:
    text: >-
      In the lake the yellow peacock feeds on small invertebrates such as insect larvae, worms and
      small crustaceans living in the sand. It hovers just above the bottom, picks up the tiny
      movements of its prey with enlarged sensory canals on the head and then strikes, or it takes
      mouthfuls of sand and filters out the food. In the aquarium it takes good sinking pellets and
      flakes, frozen mosquito larvae, Artemia and similar food. Part of the prepared food should
      contain plant matter such as spirulina. Several small meals a day suit its foraging style
      better than one large one.
    sources:
      - *fb
      - *sf
      - *fip
      - *webb2014
      - *schwalbe16
      - *tfh
  breeding:
    text: >-
      The species is a maternal mouthbrooder and often spawns in a community tank. The male chooses
      a flat stone or a patch of sand near his cave and courts with spread fins. The female lays a
      few eggs at a time, takes them into her mouth and collects the sperm while nibbling at the
      egg spots on the male's anal fin. She carries the brood for three to four weeks and normally
      eats nothing during this time. Broods hold a few dozen young at most; a hobby profile names
      20 to 40. To raise more fry, the female can be moved to a separate tank late in the brooding
      period, but stress may make her spit or swallow the eggs. Fry take Artemia nauplii and crushed
      flakes at once.
    sources:
      - *sf
      - *la
      - *tfh
      - *crc
      - *fp
  sexing:
    text: >-
      Adult males are easy to recognise: they are larger, bright yellow with a blue face, and carry
      egg spots on the anal fin. Females are cream to grey with brown vertical bars and sometimes a
      light yellow tinge. Young fish all look female-like, so sexing is reliable only from about
      four months. Females of different peacock species look very much alike, which is the main
      reason why pure stock gets mixed in shops and tanks.
    sources:
      - *lee2020
      - *sf
      - *la
  compatibility:
    text: >-
      Good tankmates are calm haps from Lake Malawi that differ in colour and do not belong to the
      genus Aulonocara, for example Placidochromis electra, Otopharynx lithobates or Copadichromis
      species, and a peaceful mbuna such as Labidochromis caeruleus. Other peacocks should be
      avoided because the females cannot be told apart and the species cross. Rough mbuna such as
      Maylandia or Melanochromis are too fast at feeding time and stress the peacock. Males with a
      similar yellow or blue colour provoke fights. Fry and very small fish may be eaten, but fish
      of more than a few centimetres are safe.
    sources:
      - *sf
      - *fip
      - *tpp
      - *fp
      - *a13953
      - *a14801
  problems:
    text: >-
      Most problems come from water quality and tank mates. Peacocks are sensitive to high nitrate
      and to abrupt changes in pH or temperature; a young tank or neglected water changes lead to
      faded colour, frayed fins and disease. Housed with aggressive mbuna, they hide, lose condition
      and do not get enough food. Overfeeding with rich food strains the digestion and the water, so
      several small meals of prepared food with some plant content are the better staple. Coarse
      gravel can injure the gills while the fish sift the bottom. Another common mistake is mixing
      several peacock species, which ruins pure lines through hybrids. Stressed brooding females may
      eat or spit out their eggs.
    sources:
      - *sf
      - *fip
      - *la
      - *tfh


  predation:
    value: 1
    confidence: low
    rationale: >-
      All sources agree that the species hunts small invertebrates: in the lake it feeds in and on
      the sand between scattered rocks, hovering above the bottom and striking at prey it detects
      with the enlarged sensory pores of its head (FishBase, Seriously Fish, Fishipedia, the lateral
      line studies on the genus). No source lists fish as regular food, which excludes levels 2 and
      3. The choice between 0 and 1 depends on whether adults take fry and very small fish when the
      chance arises. The species-specific databases are silent on this. Genus-level sources point
      to level 1: the Senckenberg ecology study of Aulonocara (Grant et al. 1987, read as a
      summary) names insect larvae, molluscs, ostracods and perhaps small fishes as food, Tropical
      Fish Hobbyist reports that peacocks take other food when the opportunity arises and advises
      moving brooding females so the fry are not lost in the community tank, and a general care
      page warns that adults eat their young. A movement-triggered bottom hunter of 13 cm fits the
      rubric anchor of level 1, Labidochromis caeruleus, likewise an invertebrate feeder that takes
      fry by chance. Four of five votes chose level 1; because no species-specific source states
      fry predation, the confidence is low.
    sources:
      - *fb
      - *sf
      - *fip
      - &schwalbe16
        kind: literature
        title: Schwalbe, M. A. B., Sevey, B. J. and Webb, J. F. (2016). Detection of artificial water flows by the lateral line system of a benthic feeding cichlid fish. Journal of Experimental Biology 219, 1050-1059.
        url: https://doi.org/10.1242/jeb.136150
        accessed: 2026-10-12
      - &schwalbe12
        kind: literature
        title: "Schwalbe, M. A. B., Bassett, D. K. and Webb, J. F. (2012). Feeding in the dark: lateral-line-mediated prey detection in the peacock cichlid Aulonocara stuartgranti. Journal of Experimental Biology 215, 2060-2071 (abstract)."
        url: https://doi.org/10.1242/jeb.065920
        accessed: 2026-10-12
      - &grant
        kind: literature
        title: Grant, S. M., Dieckhoff, H. W., Mayland, H. J. and Meyer, M. K. (1987). Ecology of Aulonocara Regan, 1922 in Lake Malawi. Courier Forschungsinstitut Senckenberg 94, 131-139 (summary on malawicichlids.com).
        url: https://malawicichlids.com/_popup_abs_gdmm87.htm
        accessed: 2026-10-12
      - *tfh
      - &fkw
        kind: website
        title: Fishkeeping World, Peacock Cichlid care guide
        url: https://www.fishkeepingworld.com/peacock-cichlid/
        accessed: 2026-10-12
    evidence:
      - source: *fb
        value: 0
        note: bottom-dwelling invertebrates; fish and fry not mentioned
      - source: *sf
        value: 0
        note: sifts sand and hunts tiny prey; fry not addressed beyond advice to raise broods apart
      - source: *fip
        value: 0
        note: worms and small crustaceans located in the sand; fish not mentioned
      - source: *schwalbe16
        value: 0
        note: genus level; benthic invertebrate prey
      - source: *schwalbe12
        value: 0
        note: congener; detects and eats small moving invertebrates on sand
      - source: *grant
        value: 1
        note: genus level; insect larvae, molluscs, ostracods and perhaps small fishes
      - source: *tfh
        value: 1
        note: genus level; opportunistic feeding, fry at risk in a community tank
      - source: *fkw
        value: 1
        note: genus level; adults eat their own fry if left with them
    verification:
      method: qualified-majority
      votes: {agree: 4, total: 5}

  diet:
    value:
      type: invertivore
      bloatSensitive: false
      foods:
        - fine sinking pellets and flakes
        - frozen or live mosquito larvae, bloodworm and Artemia
        - some food with plant content such as spirulina
    confidence: medium
    rationale: >-
      FishBase, Seriously Fish and Fishipedia describe a diet of bottom-dwelling invertebrates such
      as insect larvae, worms and small crustaceans, which the fish locates with the widened
      lateral line canals of the head (Webb et al. 2014 show these canals in A. baenschi; Schwalbe
      et al. 2016 link them to invertebrate prey detection in the genus). LiveAquaria and
      FishProfiles call it an omnivore because it accepts mixed aquarium food, which describes the
      tank rather than its natural diet. No source reports a tendency to bloat; Tropical Fish
      Hobbyist and Seriously Fish advise some plant matter in prepared food for peacocks in general,
      but this is a feeding recommendation, not a reported sensitivity, so the flag is off.

  temperatureC:
    value: {min: 21, max: 29}
    confidence: high
    rationale: >-
      Lake Malawi endemic, so the natural range is the measured range of the lake: inshore water
      cools to about 21 C in the windy season (Eccles 1974), the winter surface layer holds 23.5 to
      24 C and summer surface water about 28 C (Vollmer et al. 2005), and a 2013 campaign measured
      24 to 29 C (Ngochera 2018). The species lives in 2 to 16 m of water, inside the mixed upper
      layer these values describe.
    sources: &lakesources
      - &branchu
        kind: literature
        title: "Branchu, P., Bergonzini, L., Ambrosi, J.-P., Cardinal, D., Delalande, M., Pons-Branchu, E. et al. (2010). Hydrochemistry (major and trace elements) of Lake Malawi (Nyasa), Tanzanian Northern Basin: local versus global considerations. Hydrology and Earth System Sciences Discussions 7, 4371-4409."
        url: https://hess.copernicus.org/preprints/7/4371/2010/hessd-7-4371-2010.pdf
        accessed: 2026-10-12
      - &fao
        kind: literature
        title: "Vanden Bossche, J.-P. and Bernacsek, G. M. (1990). Source book for the inland fishery resources of Africa, Vol. 1, CIFA Technical Paper 18/1, FAO. Lake Malawi/Nyasa: physical and chemical data after Jackson et al. (1963) and Talling and Talling (1965)."
        url: https://www.fao.org/4/t0473e/T0473E05.htm
        accessed: 2026-10-12
      - &eccles
        kind: literature
        title: Eccles, D. H. (1974). An outline of the physical limnology of Lake Malawi (Lake Nyasa). Limnology and Oceanography 19(5), 730-742 (abstract).
        url: https://doi.org/10.4319/lo.1974.19.5.0730
        accessed: 2026-10-12
      - &vollmer
        kind: literature
        title: Vollmer, M. K., Bootsma, H. A., Hecky, R. E., Patterson, G., Halfman, J. D., Edmond, J. M., Eccles, D. H. and Weiss, R. F. (2005). Deep-water warming trend in Lake Malawi, East Africa. Limnology and Oceanography 50(2), 727-732.
        url: https://www.dora.lib4ri.ch/empa/dload/empa:1253/PDF/view
        accessed: 2026-10-12

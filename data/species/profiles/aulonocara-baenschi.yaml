  ph:
    value: {min: 7.7, max: 8.6}
    confidence: high
    rationale: >-
      Lake Malawi endemic; the surface water of the lake has a pH of 7.7 to 8.6 (Jackson et al.
      1963 in the FAO source book). Branchu et al. measured 7.5 to 8.5 over the whole water column,
      the lower values belonging to deep water far below the shallow habitat of the species.
    sources: *lakesources
    evidence:
      - source: *fao
        value: {min: 7.7, max: 8.6}
        note: lake surface water
      - source: *branchu
        value: {min: 7.5, max: 8.5}
        note: whole water column, lower values in deep water
    verification:
      method: waterbody
      waterbody: lake-malawi
    tolerance:
      value: {min: 7.2, max: 9.0}
      confidence: medium
      rationale: >-
        Care sheets for this species agree on alkaline water but differ in the limits. The lowest
        lower limit is 7.2 in the describers' Aquarien Atlas via FishBase and in the Fishipedia
        recommendation; FishProfiles and Seriously Fish start at 7.5, LiveAquaria, That Pet Place
        and a UK breeder at 7.8. The upper limits lie between 8.0 and 8.6, except Seriously Fish
        with 9.0. The tolerance spans the outer limits of the database sources and contains the
        lake range of 7.7 to 8.6. Each end rests on few sources, the upper end beyond 8.6 on
        Seriously Fish alone, hence medium confidence.
      sources:
        - *fb
        - *sf
        - *fip
        - *la
        - *tpp
        - *fp
        - *barn
      evidence:
        - source: *fb
          value: {min: 7.2, max: 8.2}
          note: aquarium values after Baensch and Riehl
        - source: *sf
          value: {min: 7.5, max: 9.0}
          note: aquarium recommendation
        - source: *fip
          value: {min: 7.2, max: 8.0}
          note: aquarium recommendation; the habitat block of the page gives 7.5 to 8.2
        - source: *la
          value: {min: 7.8, max: 8.6}
          note: aquarium recommendation for captive-bred fish
        - source: *tpp
          value: {min: 7.8, max: 8.6}
        - source: *fp
          value: {min: 7.5, max: 8.5}
        - source: *barn
          value: {min: 7.8, max: 8.6}
          note: breeder recommendation

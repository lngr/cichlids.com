taxonomy:
  validName: Aulonocara baenschi
  genus: Aulonocara
  species: baenschi
  author: Meyer & Riehl, 1985
  source: &cof
    kind: catalog-of-fishes
    title: Eschmeyer's Catalog of Fishes, species list of the genus Aulonocara (Aulonocara baenschi Meyer & Riehl 1985, current status valid)
    url: https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Aulonocara
    accessed: 2026-10-12
  synonyms: []
  legacyNames:
    - Aulonocara baenschi
  note: >-
    The Catalog of Fishes lists Aulonocara baenschi Meyer & Riehl 1985 as valid, described in the
    second volume of the Aquarien Atlas with Nkhomo, 8 km west of Benga, as type locality
    (holotype SMF 20041). No other nominal species is its synonym, and the legacy name equals the
    valid name. FishBase and the Cichlid Room Companion use the same name. The trade name sunshine
    peacock is also applied to the Maleri population of Aulonocara stuartgranti, so fish sold under
    that name need checking.


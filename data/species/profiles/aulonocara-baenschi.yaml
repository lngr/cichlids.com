  aggressionConspecific:
    value: 2
    confidence: medium
    rationale: >-
      Males court females hard and spar with rival males (Seriously Fish, Fishipedia), so the
      sources advise a single male with three to six females in tanks of normal size (Seriously
      Fish, LiveAquaria). With that ratio and enough room the chasing stays within a hierarchy and
      injuries are rare, which is level 2.
    sources:
      - *sf
      - *la
      - *fip

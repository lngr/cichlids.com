        first agreeing vote. The natural invertebrate prey named by checker-a is described in the
        diet text.
    - field: features.aggressionHeterospecific
      proposals:
        - {by: generator, value: 2}
        - {by: checker-a, value: 1}
        - {by: checker-b, value: 1}
      decision: 2
      rationale: >-
        Level 1 covers display only. Seriously Fish reports attacks on similarly coloured fish,
        LiveAquaria aggression against fish that invade the territory and Fishipedia intolerance of
        territorial neighbours and vigorous defence when spawning; chasing other species from the
        territory is level 2. The checkers read the general description as relatively peaceful,
        which holds for differently coloured, calm tankmates and is stated in the rationale.
    - field: features.coloration.value.pattern
      proposals:
        - {by: generator, value: bars}
        - {by: checker-a, value: plain}
        - {by: checker-b, value: mixed}
      decision: plain
      rationale: >-
        The sources describe the adult male as yellow with a blue face and no markings; the dark
        bars of the generator appear mainly in stressed or subdominant fish (Fishipedia) and on
        females. Two colours on an unmarked body are no mixed pattern.
    - field: features.minTank
      proposals:
        - {by: generator, value: {volumeL: 240, lengthCm: 120, depthCm: 45}}
        - {by: checker-a, value: {volumeL: 240, lengthCm: 120, depthCm: 45}}
        - {by: checker-b, value: {volumeL: 250, lengthCm: 120, depthCm: 45}}
      decision: {volumeL: 240, lengthCm: 120, depthCm: 45}
      rationale: >-
        All proposals rest on the 120 by 45 cm base of Seriously Fish, about 243 L; 240 L is the
        rounded volume of that base, while 250 L is the Fishipedia figure.
    - field: features.lifespanYears
      proposals:
        - {by: generator, value: {min: 8, max: 10}}
        - {by: checker-a, value: {min: 8, max: 10}}
        - {by: checker-b, value: {min: 5, max: 8}}
      decision: {min: 8, max: 10}
      rationale: >-
        Fishipedia gives 8 years and a care note on Wikipedia 10 years; the range of checker-b rests
        only on general knowledge.

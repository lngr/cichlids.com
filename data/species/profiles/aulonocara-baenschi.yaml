  ghDgh:
    value: {min: 3, max: 5}
    confidence: high
    rationale: >-
      Lake Malawi endemic; the lake is soft water. Calcium and magnesium in the upper 50 m of the
      north basin give 4.2 to 4.6 dGH (Branchu et al. 2010), and the titrations of the 1960s
      compiled by the FAO give 3.2 to 4.9 dGH. Care sheets that call the lake hard confuse total
      hardness with alkalinity.
    sources: *lakesources
    evidence:
      - source: *branchu
        value: {min: 4.2, max: 4.6}
        note: north basin, upper 50 m
      - source: *fao
        value: {min: 3.2, max: 4.9}
        note: titrations of the 1960s
    verification:
      method: waterbody
      waterbody: lake-malawi
    tolerance:
      value: {min: 3, max: 25}
      confidence: low
      rationale: >-
        Aquarium sources accept far harder water than the lake: Seriously Fish and a UK breeder give
        10 to 25 dGH, while the Aquarien Atlas via FishBase, Fishipedia and FishProfiles give 10 to
        30, probably all after the same atlas entry. The lower limit of 10 in these sheets reflects
        the belief that Malawi water is hard and is no evidence that softer water harms the fish;
        the wild population lives permanently at 3 to 5 dGH, so the tolerance starts at the lake
        value. The votes split between an upper limit of 25 and one of 30 dGH, and neither reached
        the four of five agreeing votes a qualified majority needs. The vote count therefore took
        the conservative value, the intersection of all votes, which ends at 25 dGH: a narrower
        tolerance makes the compatibility check warn earlier, which errs on the safe side for the
        fish. No source tests the species in soft aquarium water with a high carbonate hardness,
        so the range needs confirmation.
      sources:
        - *sf
        - *fb
        - *fip
        - *fp
        - *barn
        - *branchu
        - *fao
      evidence:
        - source: *sf
          value: {min: 10, max: 25}
          note: aquarium recommendation
        - source: *fb
          value: {min: 10, max: 30}
          note: given as dH, read as total hardness
        - source: *fip
          value: {min: 10, max: 30}
        - source: *fp
          value: {min: 10, max: 30}
          note: given as dH
        - source: *barn
          value: {min: 10, max: 25}
          note: breeder recommendation
        - source: *branchu
          value: {min: 4.2, max: 4.6}
          note: lake water, lower end of the tolerance
        - source: *fao
          value: {min: 3.2, max: 4.9}
          note: hardness the wild fish live in
      verification:
        method: conservative
        votes: {agree: 3, total: 5}

  khDkh:
    value: {min: 5, max: 8}
    confidence: high
    rationale: >-
      Lake Malawi endemic; the alkalinity of 2.33 to 2.46 meq/L in the Branchu profiles and 2.00 to
      2.59 meq/L in Jackson et al. (1963) gives 5 to 8 dKH. Carbonate hardness exceeds total
      hardness because sodium balances part of the bicarbonate.
    sources: *lakesources
    evidence:
      - source: *branchu
        value: {min: 6.5, max: 6.9}
        note: alkalinity 2.33 to 2.46 meq/L
      - source: *fao
        value: {min: 5.6, max: 7.3}
        note: alkalinity 2.00 to 2.59 meq/L
    verification:
      method: waterbody
      waterbody: lake-malawi
    tolerance:
      value: {min: 5, max: 15}
      confidence: low
      rationale: >-
        Only LiveAquaria names a carbonate hardness for this species, 10 to 15 dKH for captive-bred
        fish. FishBase, Seriously Fish and the other care sheets give pH and total hardness only;
        their pH ranges up to 8.6 or 9.0 imply well buffered water but no exact figure. Tropical Fish
        Hobbyist notes that peacocks adapt to a wide range of aquarium water while water close to
        the lake brings out the best colours. The tolerance runs from the lake value of 5 dKH up to
        the highest husbandry recommendation. With a single direct figure the range needs
        confirmation.
      sources:
        - *la
        - *sf
        - *fb
        - &tfh
          kind: literature
          title: Scott, B. M. Pretty Peacock Cichlids from Lake Malawi. Tropical Fish Hobbyist Magazine.
          url: https://www.tfhmagazine.com/articles/freshwater/pretty-peacock-cichlids-from-lake-malawi
          accessed: 2026-10-12
        - *branchu
        - *fao
      evidence:
        - source: *la
          value: {min: 10, max: 15}
          note: aquarium recommendation for captive-bred fish
        - source: *sf
          value: {min: 5, max: 15}
          note: no dKH stated; inferred from pH 7.5 to 9.0 and 10 to 25 dGH
        - source: *branchu
          value: {min: 6.5, max: 6.9}
          note: lake water, lower end of the tolerance
        - source: *fao
          value: {min: 5.6, max: 7.3}
          note: carbonate hardness the wild fish live in
      verification:
        method: qualified-majority
        votes: {agree: 4, total: 5}


      females; Seriously Fish recommends one male with four to six females in all but the largest
      tanks, and FishProfiles reports that serious injuries are rare in such a group. Single hobby
      pages describe a hounded second male in small tanks, while Armke found the Rubescens line
      calmer than the average peacock; both stay within level 2 for the recommended set-up.

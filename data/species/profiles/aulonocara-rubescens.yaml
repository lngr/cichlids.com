    confidence: high
    rationale: "Lake Malawi is soft water in which bicarbonate dominates and calcium and magnesium are
      low. The calcium and magnesium of the upper 50 m measured by Branchu et al. (2010) give 4.2 to
      4.6 dGH; the 1960s titrations in the FAO source book (Jackson et al. 1963: Ca 15.1 to 20.2
      mg/L, Mg 6 to 9 mg/L; Talling and Talling 1965) give about 3.5 to 4.9 dGH. The line takes
      these values from its parent form. The hard water of many care sheets belongs to the
      tolerance, not to the natural value. All three runs proposed this range."

  husbandry:
    text: A tank of at least 120 cm length, 45 cm depth and about 240 litres suits one male with four
      females. Fine, rounded sand is essential, because the fish sift it for food and coarse gravel
      can hurt the gills and the sensory pores on the head. Build a few rock piles with caves and
      leave open sand between them. Peacocks react badly to rising nitrate and unstable values, so a
      mature, strongly filtered tank and weekly water changes of 30 to 50 percent are important. Aim
      for 24 to 27 C, pH 7.5 to 8.6 and medium hardness; tap water rarely needs much adjustment.
      Plants are left alone, so robust species such as Vallisneria or Anubias may be used.
    sources:
      - kind: database

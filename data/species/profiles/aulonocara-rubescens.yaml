  sexing:
    text: Adult males are orange-red with blue on the face and fin edges and carry yellowish egg spots
      on the anal fin. Their dorsal and anal fins end in points. Females are grey-brown with darker
      bars, have rounded fins and usually lack bright egg spots. Before about 5 cm the sexes are
      hard to tell apart. Subdominant males can look like females for a long time, so buy a group of
      juveniles and sort them later, or buy adults with clear colour.
    sources:
      - kind: database
        title: "Seriously Fish: Aulonocara sp. 'stuartgranti maleri' (Sunshine Peacock)"

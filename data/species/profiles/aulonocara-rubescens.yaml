  diet:
    text: In nature peacocks hover above the sand, sense small moving animals with the enlarged pores of
      their head and take them with a mouthful of substrate. In the aquarium they eat fine sinking
      pellets and granules as staple food, supplemented with frozen Mysis, Artemia, Cyclops or
      bloodworm. Part of the dry food should contain plant matter such as spirulina. Two or three
      small meals a day suit their foraging habit better than one large one. Avoid tubifex and red
      meat, and do not overfeed, because both strain the gut and the water quality.
    sources:

  breeding:
    text: The line breeds readily, often in the community tank. The male courts over a flat stone or a
      hollow in the sand; the female lays a few eggs, picks them up and collects sperm while
      nibbling at the egg spots on his anal fin. She carries the brood for about three to four weeks
      and eats little during that time. A stressed female may swallow or spit out the eggs, so if
      you move her, do it carefully and early, or leave her in place when she is not harassed. The
      fry eat Artemia nauplii and fine powdered food from the start. To keep the line pure, only
      breed it with fish of the same line.
    sources:

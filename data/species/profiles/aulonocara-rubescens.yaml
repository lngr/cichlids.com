        accessed: 2026-10-13
  compatibility:
    text: Good companions are calm Malawi haplochromines and gentle mbuna of similar size whose colours
      differ from the orange male, for example Otopharynx lithobates, Labidochromis caeruleus or
      Copadichromis species. Keep it away from all other Aulonocara, including the German Red line
      and Eureka forms, because the females cross and the males fight as rivals. Boisterous mbuna
      such as Maylandia or Pseudotropheus outcompete the peacock at feeding time and stress it, and
      large predatory haplochromines such as Nimbochromis eat young and females. Very small fish and
      fry of other species may be eaten.
    sources:

  socialBehavior:
    text: A male defends a small spot near a stone or cave and displays to females with spread fins.
      Rival males are chased; two males in a small tank lead to constant fighting, and the weaker
      one loses its colour. One male with four or more females spreads the courtship pressure.
      Females live peacefully together. Towards other species the male is mostly tolerant, but fish
      of similar colour, above all other orange or red peacocks and similar haplochromines, are
      treated as rivals and chased off.
    sources:

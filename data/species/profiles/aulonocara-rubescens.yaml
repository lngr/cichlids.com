  hybridGroup:
    value: aulonocara
    confidence: high
    rationale: Decided unanimously as aulonocara (three of three votes). The line is a selection of the
      Maleri / Chipoka form of the A. stuartgranti complex; Seriously Fish warns for this form and
      for A. stuartgranti that most Aulonocara can hybridise, Practical Fishkeeping reports that
      stuartgranti forms interbreed with other peacocks, and the drab, barred females of all
      peacocks look alike. Red peacocks of mixed descent are common in the trade (Fishkeeper, Hybrid
      Peacock), so keeping the line apart from every other Aulonocara also preserves it.

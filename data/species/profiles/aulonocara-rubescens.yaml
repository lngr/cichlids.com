  habitat:
    text: The line itself lives only in aquariums. Its founders come from the south-western part of Lake
      Malawi, where the sunshine peacock inhabits the transition between rocky shore and open sand
      around Chidunga Rocks and the Maleri Islands. Males hold small spots between scattered stones,
      while females and young forage in loose groups over the sand. Lake Malawi water is warm (about
      21 to 29 C), slightly alkaline (pH 7.7 to 8.6), soft in total hardness (3 to 5 dGH) and well
      buffered (5 to 8 dKH). In the aquarium the fish do well in medium-hard, alkaline tap water
      within the tolerance ranges of this profile, as long as the values stay stable and the water
      is clean.
    sources:
      - kind: database
        title: "Seriously Fish: Aulonocara sp. 'stuartgranti maleri' (Sunshine Peacock)"
        url: https://www.seriouslyfish.com/species/aulonocara-sp-stuartgranti-maleri/

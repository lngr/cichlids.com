  sizeAndGrowth:
    text: "Well-kept males reach about 13 cm total length, females remain noticeably smaller at roughly
      10 cm. Young fish are silvery grey and show no red at all; males begin to colour at around 5
      to 7 cm and gain full colour only some time after sexual maturity. The intensity of the
      orange-red depends on rank: a dominant male in a harem colours best, while subordinate males
      stay pale. The fish can live for six to ten years."

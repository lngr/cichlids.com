    value:
      type: invertivore
      bloatSensitive: false
      foods:
        - benthic invertebrates
        - small crustaceans
        - insect larvae
        - fine sinking pellets
        - frozen Mysis and Artemia
    confidence: high
    rationale: Decided unanimously as invertivore without bloat sensitivity (three of three votes). The
      parent species sifts mouthfuls of sand and detects buried and moving invertebrates with its
      widened lateral line canals, also in darkness (Schwalbe et al. 2012, 2015, 2016); FishBase and
      Seriously Fish describe the same benthic invertebrate diet. Retailer sheets call the line a
      carnivore or an omnivore because it accepts prepared food, and Animal-World warns against
      tubifex, but peacocks are no aufwuchs grazers and no source reports a special bloat risk, so a
      protein-rich tankmate diet is no conflict. In the aquarium the line takes fine sinking pellets
      with some plant matter plus small frozen foods.

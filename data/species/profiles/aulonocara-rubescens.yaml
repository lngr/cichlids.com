partners:
  suitable:
    - species: Otopharynx lithobates
      reason: Calm haplochromine of similar size whose blue-and-white males do not resemble the orange
        peacock.
    - species: Labidochromis caeruleus
      reason: One of the few peaceful mbuna; its yellow pattern differs and it does not harass slower
        feeders.
    - species: Copadichromis borleyi
      reason: Open-water utaka that uses a different tank zone and shares the water and diet needs.
    - species: Placidochromis electra
      reason: Peaceful sand-zone haplochromine of similar size with a blue, barred pattern.
      condition: Tank of at least 150 cm so both males can hold separate spots.
  unsuitable:
    - species: Aulonocara stuartgranti
      reason: Parent species complex; females are indistinguishable and the fish cross readily.
    - species: Aulonocara jacobfreibergi
      reason: Member of the same hybrid group; red Eureka forms also look alike and provoke rival fights.
    - species: Aulonocara baenschi
      reason: Member of the same hybrid group and a candidate founder of the line; crosses easily.
    - species: Aulonocara 'German Red'
      reason: Red selection line from the same parent form; the fish cross, which destroys both lines, and
        the males fight as rivals.
    - species: Aulonocara hybrid
      reason: Hybrid peacocks such as OB or Dragon Blood cross with the line and make its descent
        untraceable.
    - species: Maylandia zebra
      reason: Hasty, boisterous mbuna that steals food and stresses peacock males and females.
    - species: Nimbochromis venustus
      reason: Large ambush predator that swallows juvenile and female peacocks.
profile:
  overview:
    text: "Aulonocara 'Rubescens', sold as Ruby Red or Rubin Red Peacock, is not a wild species but an
      aquarium line. Breeders selected the most orange offspring of the southern Maleri / Chipoka
      form of the Aulonocara stuartgranti complex in Lake Malawi until the males turned a deep
      orange-red. The name rubescens looks scientific but was never published for a species, and the
      Lake Kivu cichlid Haplochromis rubescens has nothing to do with it. The fish behaves like its
      wild ancestors: a fairly calm sand-zone cichlid that searches the bottom for small prey. It is
      kept as one male with several females in a spacious Malawi tank. Because it crosses easily
      with other peacocks, many fish in the trade are of uncertain descent, and keepers who want to
      preserve the line keep it away from other Aulonocara."
    sources:
      - kind: catalog-of-fishes
        title: Eschmeyer's Catalog of Fishes, species list of the genus Aulonocara (online version updated
          21 Sep. 2026; no name rubescens)
        url: https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Aulonocara
        accessed: 2026-10-13

  problems:
    text: The most common mistake is mixing the line with other peacocks, which produces hybrids that
      can no longer be identified. A second is a tank full of hasty mbuna, where the peacocks go
      hungry and stay pale. Coarse gravel causes injuries to mouth and gills. Overfeeding and dirty
      water lead to digestive trouble, and peacocks react quickly to rising nitrate and swings in
      water values. Line-bred stock may be inbred, which shows as weak growth or deformities; buy
      from breeders who refresh their lines. Ich is common after transport and stress, so new fish
      should go through quarantine.
    sources:

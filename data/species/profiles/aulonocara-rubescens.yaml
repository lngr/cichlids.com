    tolerance:
      value:
        min: 21
        max: 29
      confidence: medium
      rationale: "All three runs agree on 21 to 29 C, so the tolerance is unanimous. Care sheets for the
        line and its parent form recommend between 22 and 29 C: Seriously Fish 23 to 29 C for A.
        stuartgranti and 25 to 29 C for the Maleri form, FishBase and FishProfiles 22 to 26 C, and
        retailer and hobby pages for the line 23 to 28 C. The tolerance has to contain the natural
        range, so its lower end is the cool-season lake minimum of 21 C, which suits a short cool
        phase rather than a permanent setting; the upper end of 29 C is the value of Seriously Fish
        and of the lake."

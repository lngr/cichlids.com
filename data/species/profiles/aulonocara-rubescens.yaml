  aggressionHeterospecific:
    value: 2
    confidence: medium
    rationale: Seriously Fish calls the Maleri parent form less peaceful than some of its congeners and
      notes that males react aggressively to fish of a similar colour pattern; they chase such fish
      from their spot but do not pursue tankmates through the tank and cause no injuries in a
      suitable tank, which is level 2. Other sources call A. stuartgranti relatively peaceful for a
      Malawi cichlid (Fishkeeper, Practical Fishkeeping), which fits level 1 towards fish of a
      different look. Level 2 is kept because the check has to cover the similar-coloured tankmates
      as well.

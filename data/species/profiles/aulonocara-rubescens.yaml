    confidence: medium
    rationale: The line does not occur in the wild. Its parent form, Aulonocara sp. 'stuartgranti
      maleri', is endemic to the south-west of Lake Malawi around the Maleri Islands, Chidunga
      Rocks, Mumbo Island and Namalenje Island (Seriously Fish). Schaefer (Aquarium Glaser) and
      Elieson trace the line to the Chidunga Rocks / Chipoka population, Armke to Maleri Island fish
      then traded as A. baenschi, so both localities are given. The lake is kept as region and water
      body because the line takes the habitat values of its parent form. No source documents the
      pedigree in detail, hence medium confidence.

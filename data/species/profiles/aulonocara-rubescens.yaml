  synonyms:
    - name: Aulonocara rubescens
      note: Trade name written like a binomen; the Catalog of Fishes lists no such name in Aulonocara, and
        it was never described.
    - name: Aulonocara sp. 'Rubescens'
      note: Common hobby spelling of the same line.
    - name: Aulonocara stuartgranti 'Rubescens'
      note: Trade spelling that places the line under its parent species complex.
  legacyNames:
    - Aulonocara rubescens
  note: "Rubescens is a trade name for a red captive line, not an available species name: the Catalog
    of Fishes lists no rubescens among the Aulonocara names, and its only species of that epithet,
    Haplochromis rubescens Snoeks 1994 from Lake Kivu, is unrelated. The line was selected for
    orange-red colour from the southern Maleri / Chipoka form of the Aulonocara stuartgranti
    complex, which Seriously Fish keeps as Aulonocara sp. 'stuartgranti maleri' and lists Rubescens
    among its selectively bred strains. Whether this form is a species of its own or a population of
    A. stuartgranti Meyer and Riehl 1985 (valid, type locality Mpanga Rocks near Chilumba) is
    unresolved, so the species epithet stays empty. Hobby sources disagree on the exact origin of
    the line and on its relation to the other red lines: Schaefer (Aquarium Glaser) derives it from
    the Chidunga Rocks population near Chipoka and the name Ruby Red from an importer named Rubin;
    Elieson credits a Dutch breeder with the Ruby Red, which he takes to be the same fish as
    Rubescens and close to the German Red bred from the same Chipoka form; Armke (1997) keeps
    Rubescens and German Red apart as distinct lines from Maleri Island and Chipoka fish then traded
    as A. baenschi, and calls Ruby Red an anglicised form of the German name. A. baenschi itself was
    described from Nkhomo reef near Benga. The sources describe a selection within one form rather
    than a cross, hence the status domestic-form, although red peacocks of mixed descent are sold
    under the same names. All feature values rest on the parent form: its habitat in Lake Malawi
    gives the natural water values, and its biology and husbandry data stand in for the line."

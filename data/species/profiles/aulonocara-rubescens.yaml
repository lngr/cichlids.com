  predation:
    value: 1
    confidence: medium
    rationale: "Decided as level 1 by qualified majority (four of five votes): generator 1, checker-a 1,
      checker-b 0, tiebreaker-1 1, tiebreaker-2 1. The parent form hovers over the sand and strikes
      at small moving animals, which it locates with the enlarged lateral line canals of the head
      (Schwalbe et al. 2012, 2015, 2016); FishBase and Seriously Fish describe a diet of benthic
      invertebrates and no source reports fish as regular prey, so levels 2 and 3 are excluded.
      Checker-b read this literally as level 0. The majority reads the hunting style of a 12 to 13
      cm snap feeder as level 1: Seriously Fish describes the Maleri form as an active hunter of
      small moving prey, Scott (TFH) notes that peacocks take other prey when it is available, and
      several retailer and hobby pages for the line name fry as food. Fry and fish up to about 2 cm
      are at risk; larger tankmates are not."

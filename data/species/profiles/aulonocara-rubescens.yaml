  temperatureC:
    value:
      min: 21
      max: 29
    confidence: high
    rationale: "The line lives only in aquariums, so it takes the habitat values of its parent form, the
      southern Maleri / Chipoka peacock of the Aulonocara stuartgranti complex, which is endemic to
      Lake Malawi. The value is the measured lake range: Eccles (1974) reports 21 C inshore in the
      cool, windy season and 27 C in the upper 60 m, Vollmer et al. (2005) 23.5 C in the winter
      epilimnion and about 28 C at the surface in summer, Jackson et al. (1963, in the FAO source
      book) 23 to 25 C at the surface, and later campaigns reach 29 C. All three runs proposed this
      range."

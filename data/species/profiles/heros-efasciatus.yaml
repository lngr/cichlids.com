  ghDgh:
    value:
      min: 0
      max: 3
    confidence: "medium"
    rationale: "The qualified majority retains 0 to 3 dGH. Calcium and magnesium measurements are converted by dGH\
      \ = Ca(mg/L)/7.14 + Mg(mg/L)/4.34. Queiroz paired measurements give about 0.06 to 2.30 dGH, Catalao seasonal\
      \ means about 0.31 to 1.14, and USGS titration about 0.67 to 1.51. Zero is an outward-rounded very soft boundary,\
      \ not an exact zero reading. Wider evidence is retained explicitly: the Acre bounding conversion reaches 3.6\
      \ dGH, the 2012 Solimoes-Amazonas survey gives about 0.13 to 3.35 including tributary means, and Rios-Villamizar\
      \ river means used by the generator span about 0.13 to 5.58 dGH, producing its 0 to 6 proposal. These geographically\
      \ different regional proxies do not define a universal capture-site range. The decision represents the better-supported\
      \ typical lowland soft-water conditions and is narrower than those wider measurements. Conductivity-derived\
      \ estimates are retained as earlier interpretations but are not valid quantitative GH measurements. FishBase\
      \ supplies only a 20 dH endpoint with the other unknown and an aquarium-atlas reference, which cannot override\
      \ measured habitat ions. Proposals: generator = {\"min\":0,\"max\":6}; checker-a = {\"min\":0.4,\"max\":3.6};\
      \ checker-b = {\"min\":0,\"max\":3}; checker-c = {\"min\":0,\"max\":2}; tiebreaker-1 = {\"min\":0,\"max\"\
      :3}; tiebreaker-2 = {\"min\":0.1,\"max\":3.5}."

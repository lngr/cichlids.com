  - "Heros efasciatus"
  - "Heros severus"
  - "Cichlasoma severum"
  - "Heros appendiculatum"
  note: "The Catalog of Fishes accepts Heros efasciatus and H. severus as separate valid species. This profile follows\
    \ the supplied identification of the photographed trade fish in legacy entries 749 and 709 as H. efasciatus;\
    \ it does not identify genuine upper Rio Negro H. severus as this species. Heros severus and Cichlasoma severum\
    \ are misapplied historical trade labels here, not taxonomic synonyms of H. efasciatus. The separate Heros and\
    \ legacy Cichlasoma catalog queries were read; the Cichlasoma query did not contain a matching severum entry.\
    \ Gold and red aquarium lines are captive forms, with uncertain pedigrees in some stocks. The public CRC entry\
    \ confirms the valid name and principal synonyms but does not expose feeding, habitat or breeding summary text.\
    \ The legacy entry Heros appendiculatum names the synonym H. appendiculatus and maps to this profile as well."

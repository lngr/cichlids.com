  diet:
    text: "Provide a varied omnivorous diet with a strong vegetable component. A balanced cichlid pellet, spirulina\
      \ foods, blanched greens and shelled peas can be supplemented with small portions of aquatic invertebrates.\
      \ Wild feeding records include considerable fruit and other plant food. Adult severums nevertheless present\
      \ mouth-sized predation risk to small companions; their plant preference does not protect those fish. Feed\
      \ amounts that are consumed promptly and remove leftovers. No special protein-triggered bloat susceptibility\
      \ was established, but the false bloat flag is not proof against digestive illness. A short gold-form feed\
      \ experiment cannot define lifetime nutrient safety."

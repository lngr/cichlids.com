    tolerance:
      value:
        min: 5
        max: 7.6
      confidence: "medium"
      rationale: "The qualified majority retains pH 5 to 7.6. NCS provides an acidic maintenance interval of 5 to\
        \ 7 and Seriously Fish 5.5 to 7; Rak reports multiple years at 6.4 to 6.6 and the pooled DCG keeping experience\
        \ reaches 7.6. The wider retail interval of 7 to 8 and checker-a proposal of 5 to 8 do not establish sustained\
        \ health at pH 8. The hatchery actually reports 7.5 to 7.8, rather than an observed pH 8 endpoint. A hobby\
        \ account reports success at 7.5 without stating duration, and the forum expression of pH in the sevens\
        \ is not a measured 7 to 7.99 interval. These wider and incomplete claims are preserved. The selected tolerance\
        \ contains the natural range and describes maintenance, not assured fertilization or egg development; the\
        \ ends are less secure for wild imports. Proposals: generator = {\"min\":5,\"max\":7.6}; checker-a = {\"\
        min\":5.0,\"max\":8.0}; checker-b = {\"min\":5.5,\"max\":7.5}; checker-c = {\"min\":5,\"max\":7.5}; tiebreaker-1\
        \ = {\"min\":5,\"max\":7.6}; tiebreaker-2 = {\"min\":5,\"max\":7.5}."

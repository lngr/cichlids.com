    tolerance:
      value:
        min: 0
        max: 10
      confidence: "low"
      rationale: "Conservative tally decision: the intersection of all six proposed intervals is 0 to 10 dGH, with\
        \ low confidence and no replacement. Generator, checker-b and tiebreaker-1 propose 0 to 20; checker-a and\
        \ tiebreaker-2 propose 0 to 10; checker-c proposes 0 to 12. No candidate has the four agreeing votes required\
        \ for a qualified majority. Seriously Fish and Fishkeeping give 1 to 8 dGH, Akvaforum explicitly gives 0\
        \ to 10, and Aquendium gives the wider 2 to 12. Wider practical evidence is retained: Rak kept captive red-spotted\
        \ fish for several years at 8 to 14 dGH, Mi Pecera reports 13 degrees without a duration, WetWebMedia gives\
        \ 5 to 20, and the pooled DCG Heros experience reaches 20 dGH without assigning that maximum separately\
        \ to efasciatus. The retailer interval of 5 to 20 lacks an explicit unit, and FishBase has only one known\
        \ 20 dH endpoint. Therefore 10 dGH is a conservative planner limit, not a demonstrated health-failure threshold;\
        \ some established captive lines clearly tolerate more. Near-zero includes the natural lower boundary without\
        \ prescribing unmineralized water. A short gold-form experiment at about 4.5 to 6.7 dGH supports only central\
        \ conditions, and successful maintenance does not guarantee egg development."

  maxSizeCm:
    value:
      male: 25
      female: 20
    confidence: "medium"
    rationale: "The four male proposals are 24, 25, 25 and 25 cm and the female proposals 18, 20, 20 and 20 cm,\
      \ giving medians of 25 and 20 cm. Aquarium accounts commonly place adults at 20 to 25 cm and males larger;\
      \ Fishkeeper and NCS list an unsexed 25 cm. The female ceiling is a practical interpretation rather than a\
      \ measured female aquarium series. DCG historical appendiculatus-like siblings reached 24 cm male and 18 cm\
      \ female after five years, preserved as direct captive evidence. Wild Amana maxima of 17.4 and 16.4 cm are\
      \ standard lengths, not aquarium total-length ceilings. Seriously Fish also displays a conflicting 30 cm SL\
      \ headline; retain its aquarium 20 to 25 cm guidance for typical adults rather than adopting that record-like\
      \ headline."

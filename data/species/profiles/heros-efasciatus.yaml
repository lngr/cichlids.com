    rationale: "All runs identify an Amazonian species; their locality lists and the wording Amazon River basin\
      \ differ. Catalog of Fishes distribution spans Brazil, Ecuador, Colombia, Bolivia and Peru. FishBase supports\
      \ Ucayali and Solimoes-Amazon provenance, the Amana study documents identified fish at lake margins, and species\
      \ husbandry accounts include lower Tapajos and Xingu stock. This concise locality list is illustrative rather\
      \ than exhaustive; it excludes introduced populations and does not merge the separate upper Rio Negro H. severus.\
      \ No curated lake waterbody applies."

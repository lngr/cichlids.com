  problems:
    text: "Insufficient adult space, poorly matched pairs, excessive feeding and damaged planting are common practical\
      \ problems. Ongoing hiding, missed meals or injuries call for a review of water quality and social conditions.\
      \ Hobby sources associate poor conditions and incomplete feeding with head lesions, but a lesion or enlarged\
      \ abdomen alone does not identify the cause. New fish can also carry parasites. Use a separate observation\
      \ aquarium for arrivals and obtain qualified advice for persistent illness. Sustained overheating, unstable\
      \ pH in weakly buffered water and denied access to food deserve attention before assuming every colour or\
      \ appetite change has the same explanation."
    sources:
    - kind: "literature"
      title: "DCG Arbeitskreis Grosscichliden: Augenfleckbuntbarsche Teil 1"

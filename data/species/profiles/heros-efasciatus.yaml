    rationale: "Tally method qualified-majority. The qualified majority retains pH 5 to 7.5. Main-channel Solimoes-Amazonas\
      \ measurements of 5.08 to 7.16, Horbe and Santos measurements of 5.26 to 7.34, Devol regional observations\
      \ of 5.19 to 7.39 and Catalao observations of 5.86 to 7.47 support an acidic to near-neutral regional envelope.\
      \ The Fortaleza capture channel was 6.4 to 6.9. Most evidence is regional rather than measurements paired\
      \ with identified fish. The wider reported ranges remain visible: Silva gives 6.5 to 7.6 for the mainstem\
      \ water type, Acre measurements span 5.7 to 7.9, Mamiraua studies reach 8.52 and 8.8, and Catalao spatial\
      \ mean gradients extend down to 4.5. The selected typical interval excludes isolated alkaline conditions and\
      \ does not assume occupancy at every highly acidic station. FishBase supplies only one pH endpoint, 7, with\
      \ the other unknown; evidence entries encoding this as 7 to 7 must not be read as a measured single-point\
      \ habitat. No upper Rio Negro template for the separate H. severus is imposed. Proposals: generator = {\"\
      min\":5,\"max\":7.6}; checker-a = {\"min\":5.0,\"max\":7.5}; checker-b = {\"min\":5.8,\"max\":7.5}; checker-c\
      \ = {\"min\":5,\"max\":7.5}; tiebreaker-1 = {\"min\":5.3,\"max\":7.5}; tiebreaker-2 = {\"min\":5,\"max\":7.5}."

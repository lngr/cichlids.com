partners:
  suitable:
  - species: "Metynnis argenteus"
    reason: "Adult silver dollars are too deep-bodied to be easy prey and can share a calm warm-water community."
    condition: "A shoal in a substantially larger aquarium than the pair-only minimum, with open swimming room and\
      \ plant loss accepted."
  - species: "Hypselecara temporalis"
    reason: "A calm larger South American cichlid can coexist if each adult pair has space and cover."
    condition: "A large aquarium with separate territories and a plan to separate fish during spawning."
  - species: "Peaceful Amazonian eartheaters"
    reason: "Some larger peaceful eartheaters can share warm soft-water conditions and use a different feeding area;\
      \ each species needs individual assessment."
    condition: "Keep its required group in a larger sandy aquarium; distribute food so bottom feeders receive their\
      \ share."
  unsuitable:
  - species: "Paracheirodon innesi"
    reason: "Small slender tetras fall within the mouth-sized prey risk of adult severums."
  - species: "Amphilophus labiatus"
    reason: "A red devil can dominate and injure the calmer severum; archive experience supports this temperament\
      \ mismatch."
  - species: "Heros severus"
    reason: "Similar adult rivals share the presumed heros hybrid group and are easily confused in mixed breeding\
      \ stock."
  - species: "Lake Malawi mbuna"
    reason: "Boisterous mbuna communities can deprive a calmer severum of space and food, and their different water\
      \ and specialized feeding requirements complicate a shared aquarium."
profile:
  overview:
    text: "Heros efasciatus is the Amazonian severum most often represented by green, gold and red fish in the aquarium\
      \ trade. Its high body and substantial adult size need a permanent home planned around adults. Historical\
      \ labels such as Heros severus and Cichlasoma severum were often applied to these trade fish; the valid blackwater\
      \ H. severus is a separate species. Gold and red or red-spotted severums are captive colour selections, and\
      \ some commercial pedigrees are uncertain. Collection locality remains useful for wild stock. Red-shouldered\
      \ Rotkeil fish of uncertain species placement should not be equated with a selected red-spotted line."
    sources:
    - kind: "catalog-of-fishes"
      title: "Eschmeyer's Catalog of Fishes: species of Heros"
      url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Heros"

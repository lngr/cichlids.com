  sexing:
    text: "Adult males commonly grow larger and show stronger cheek or gill-cover markings, sometimes with longer\
      \ fin extensions. These are clues rather than universal tests, particularly in gold and red selected lines.\
      \ Juveniles are difficult to sex reliably from appearance. Courtship and the breeding papilla may help an\
      \ experienced observer, but two fish guarding eggs do not by themselves establish a fertile male-female pair.\
      \ Behaviour over time is more useful than an unverified shop sex label."

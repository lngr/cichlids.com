  habitat:
    text: "The native range spans the Amazon basin. Sheltered river edges, flooded margins and lake cover offer\
      \ submerged branches and roots, with vegetation becoming available as water rises. Identified efasciatus were\
      \ sampled around woody structures in Amana and Urini, and a Fortaleza channel collection occurred at 27.8\
      \ to 28.5 C and pH 6.4 to 6.9. The adopted natural ranges of 26 to 32 C, pH 5 to 7.5, GH 0 to 3 dGH and KH\
      \ 0 to 3 dKH are typical regional proxies rather than limits measured beside fish throughout the range. Wider\
      \ regional chemistry remains relevant: a Jurua mean converts to about 5.58 dGH and 4.87 dKH, Acre chemistry\
      \ reaches about 3.6 dGH, and a later Solimoes-Amazonas survey reaches about 3.35 dGH. These are not all included\
      \ in the decided typical band. Mamiraua drought observations reached 34.14 C, another series 34.7 C, and some\
      \ isolated waters reached pH 8.52 or 8.8. Those unusual conditions do not provide permanent aquarium targets.\
      \ Highly acidic stations were not all shown to contain this species."

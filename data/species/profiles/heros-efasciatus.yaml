  socialBehavior:
    text: "An established pair is the adult unit used for the minimum tank. Juvenile groups can produce natural\
      \ partner choices, but surplus adults need suitable homes or substantially more room. Displays and chasing\
      \ establish rank, so cover and unobstructed escape routes matter. A breeding pair may defend a substantial\
      \ section of the aquarium around eggs and moving young. Strong territory defence is encoded as breeding-only,\
      \ while lesser dominance and feeding disputes can continue at other times. One captive account divided a 650\
      \ L aquarium among three pairs, showing that individual settings can differ. A fish repeatedly cornered, injured\
      \ or excluded from food may require separation."

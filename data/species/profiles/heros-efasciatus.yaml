    rationale: "Tally method conservative. Conservative tally decision: the intersection of all six proposed intervals\
      \ is 0 to 10 dGH, with low confidence and no replacement. Generator, checker-b and tiebreaker-1 propose 0\
      \ to 20; checker-a and tiebreaker-2 propose 0 to 10; checker-c proposes 0 to 12. No candidate has the four\
      \ agreeing votes required for a qualified majority. Seriously Fish and Fishkeeping give 1 to 8 dGH, Akvaforum\
      \ explicitly gives 0 to 10, and Aquendium gives the wider 2 to 12. Wider practical evidence is retained: Rak\

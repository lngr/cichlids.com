      \ one known 20 dH endpoint. Therefore 10 dGH is a conservative planner limit, not a demonstrated health-failure\
      \ threshold; some established captive lines clearly tolerate more. Near-zero includes the natural lower boundary\
      \ without prescribing unmineralized water. A short gold-form experiment at about 4.5 to 6.7 dGH supports only\
      \ central conditions, and successful maintenance does not guarantee egg development."

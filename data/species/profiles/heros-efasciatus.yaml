    rationale: "Tally method unanimous. The tally retains 0 to 3 dKH with medium confidence. Its unanimous method\
      \ groups the four proposals within the 2 dKH agreement threshold, rather than meaning that all endpoints were\
      \ identical. Bicarbonate divided by 21.8 gives dKH-equivalent alkalinity: Queiroz regional measurements approach\
      \ 0 to 1.7 and Catalao seasonal means about 0.56 to 2.68. Devol micro-Gran titration gives undetectable tributary\
      \ alkalinity through about 2.73 dKH in the mainstem. Wider values are retained: Rios-Villamizar river means\
      \ convert to 0.31 to 4.87 dKH and motivated the generator proposal of 0 to 5; checker-a uses a 0.5 to 3.5\
      \ envelope including a DIC-based estimate of 1.4 to 3.4. DIC alone does not measure alkalinity without carbon-speciation\
      \ assumptions. The decided interval represents typical measured lowland buffering rather than all regional\
      \ extremes. GH and conductivity do not set KH. Natural KH is a plain fact and carries no verification object.\
      \ Proposals: generator = {\"min\":0,\"max\":5}; checker-a = {\"min\":0.5,\"max\":3.5}; checker-b = {\"min\"\
      :0,\"max\":3}; checker-c = {\"min\":0,\"max\":3}."

        \ includes Rak multi-year captive conditions of 3 to 8 and the Aquatic Arts gold-line recommendation of\
        \ 1 to 8. NCS recommends below 5, while Gensou and ilMioAcquario give 2 to 8. WetWebMedia gives the wider\
        \ 3 to 10 range, retained without making it the decided upper limit. Natural dilute tributaries support\
        \ the near-zero lower extension, but no lifelong trial establishes the entire interval. Earlier evidence\
        \ using Seriously Fish GH 1 to 8 or Aquariadise GH below 10 to infer KH is preserved as an unsupported cross-parameter\
        \ inference, not accepted as a carbonate-hardness measurement. The natural 0 to 3 dKH range is contained;\
        \ weak buffering requires attention to stable pH. Proposals: generator = {\"min\":0,\"max\":8}; checker-a\

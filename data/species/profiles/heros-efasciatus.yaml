  compatibility:
    text: "Large peaceful companions may coexist when each species has adequate space, cover and appropriate water.\
      \ Adult silver dollars, chocolate cichlids and suitable Amazonian eartheaters are possibilities in aquaria\
      \ larger than the pair-only minimum, with the partners own group or pair needs met. Small tetras and other\
      \ swallowable fish face predation; very forceful cichlids can intimidate or injure a severum. Brood defence\
      \ can disrupt a previously calm community. Other Heros share the existing presumed crossing group: suspected\
      \ captive mixing and difficult identification support caution, but named free-choice crosses are not verified.\
      \ Gold and red lines are captive forms within this profile. Archive claims that severums contributed to blood-parrot\
      \ ancestry do not establish an additional crossing group."

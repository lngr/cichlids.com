  sizeAndGrowth:
    text: "Plan for an aquarium male around 25 cm and a female around 20 cm at the typical adult upper end. Female\
      \ size is less securely documented than the unsexed aquarium maximum. Historic captive siblings reached 24\
      \ and 18 cm, whereas scientific wild maxima are standard lengths that exclude the tail. A juvenile becomes\
      \ a bulky fish needing room to turn and retreat. Steady feeding and good body condition matter more than rapid\
      \ growth. A lifespan around 10 to 14 years is a provisional planning estimate, with shorter and longer reports\
      \ and no validated species-wide survival series."

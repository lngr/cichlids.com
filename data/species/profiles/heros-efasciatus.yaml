  breeding:
    text: "Both parents prepare an exposed firm surface, attach eggs and guard the brood. Stones or wood provide\
      \ suitable sites, and the pair may later move or herd the young between protected areas. Other fish need room\
      \ to leave the defended area. Small live foods and suitably fine prepared foods are used for free-swimming\
      \ fry. Failed early broods can reflect several factors, including pair fertility, disturbance, parental experience\
      \ and water conditions. The classification is open-substrate-spawner. Seriously Fish also describes fry mouthbrooding,\
      \ but direct keeping accounts and the later separation of H. liberifer support exposed-substrate breeding\
      \ for efasciatus; oral relocation should not be confused with sustained mouth incubation."

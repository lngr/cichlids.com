    rationale: "Tally method qualified-majority. The qualified majority retains 26 to 32 C as a typical regional\
      \ habitat envelope. Devol reports a 26 to 30 C river baseline, Cocha Yarima supplies a less certain 26 to\
      \ 28 C habitat account, and Catalao seasonal surface means reach 31.7 C. Identified H. efasciatus at Igarape\
      \ Fortaleza was collected in a channel measured at 27.8 to 28.5 C. These do not establish a complete thermal\
      \ series beside identified severums. The wider Mamiraua observations of 26.5 to 34.14 C, the separate study\
      \ reaching 34.7 C, Queiroz measurements of 28.2 to 34.5 C and the Fortaleza floodplain interval of 26 to 33\
      \ C remain evidence, with unusually warm or shallow-water maxima excluded from the typical interval. No efasciatus\
      \ was collected in that Fortaleza floodplain sample. FishBase gives 24 to 32 C from an aquarium atlas rather\
      \ than a demonstrated native field series. The tally range is plausible and is retained without replacement.\
      \ Proposals: generator = {\"min\":26.5,\"max\":32}; checker-a = {\"min\":26,\"max\":32}; checker-b = {\"min\"\
      :28,\"max\":32}; checker-c = {\"min\":26,\"max\":30}; tiebreaker-1 = {\"min\":26,\"max\":32}; tiebreaker-2\
      \ = {\"min\":26.5,\"max\":32}."

variants:
- name: "Green severum"
  kind: "color-morph"
  note: "Wild-type trade coloration; green or brown body with dark bars and head markings, rather than a defined\
    \ locality."
- name: "Gold severum"
  kind: "color-morph"
  note: "Captive yellow to golden selection, not a natural population or a separate valid species; exact ancestry\
    \ may be undocumented."
- name: "Red spotted severum / Red pearl"
  kind: "color-morph"
  note: "Captive line selected for red markings, often on a pale or gold background; pedigree is not reliably traceable."
- name: "Tapajos / Santarem"
  kind: "locality"
  note: "Locality-labelled wild-type H. efasciatus from the lower Tapajos region; keep collection locality with\
    \ the stock."
- name: "Ucayali"
  kind: "locality"
  note: "Peruvian locality stock represented in taxonomic and specialist records. Rotkeil red-shouldered fish are\
    \ often labelled H. cf. efasciatus or Heros sp.; their uncertain identity is not merged here with captive red-spotted\
    \ strains."

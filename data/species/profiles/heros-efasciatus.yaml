  husbandry:
    text: "Provide at least 300 L with a 120 by 50 cm base for one compatible adult pair. Additional severums or\
      \ a community need more space according to their own social units. Use fine substrate, stable wood and stones,\
      \ and sight barriers that allow either fish to retreat; leave swimming routes open. Soft plants may be grazed,\
      \ and shade can help fish settle. Mature filtration, partial water changes and oxygen exchange are important.\
      \ Around 26 to 28 C is a practical routine temperature within the wider 22 to 32 C maintenance tolerance.\
      \ The other decided tolerances are pH 5 to 7.6, GH 0 to 10 dGH and KH 0 to 8 dKH. These are outer maintenance\
      \ bands rather than breeding guarantees. The GH ceiling is a conservative planner decision: captive success\
      \ at 8 to 14 dGH and pooled Heros reports up to 20 dGH remain evidence. Wild imports deserve attention to\
      \ their source water. Very low GH and KH describe dilute water, not a recipe for unmineralized water, and\
      \ low buffering makes stability especially important."
    sources:
    - kind: "literature"
      title: "Rak, R. (2015). Heros efasciatus a rostlinna nadrz. Akvarium, online article"
      url: "https://e-akvarium.cz/heros-efasciatus-a-rostlinna-nadrz/"

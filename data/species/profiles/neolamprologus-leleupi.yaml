  husbandry:
    text: "For one selected adult pair, provide at least 200 litres with a 120 by 40 cm floor. Arrange secure rockwork\
      \ with several separate shelters, interrupted sightlines and routes that let the smaller fish escape pursuit.\
      \ Sand allows excavation beneath the rocks. Mature filtration, oxygenation and replacement water close to the\
      \ existing chemistry are essential. A stable 24 to 26 C and alkaline pH around 8 to 9 have stronger aquarium\
      \ support than the outer tolerance endpoints. Measure GH and KH separately."
    sources:
      - kind: literature
        title: "Koolwaaij, H. Het Tanganjika-aquarium van M. Hopman. Nederlandse Bond Aqua Terra."
        url: "https://nbat.nl/het-tanganjika-aquarium-van-m-hopman/"
        archived: nbat.nl/het-tanganjika-aquarium-van-m-hopman/2026-10-14T101840Z

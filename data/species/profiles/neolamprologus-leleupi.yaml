    kind: color-morph
    note: Common bright aquarium form; maintain trustworthy origin labels.
  - name: Orange
    kind: color-morph
    note: A familiar aquarium colour form documented by the GCCA breeder account.
  - name: Dark melas form
    kind: color-morph
    note: "Brown to near-black pigment can mask the underlying yellow. Melas is a synonym, not a valid subspecies\
      \ in the catalog."
  - name: Silver-beige
    kind: color-morph
    note: A less commonly traded natural colour morph reported by Fishkeeper.
features:
  origin:
    value:
      continent: Africa
      region: "Lake Tanganyika, western Congolese shoreline"
      waterbody: lake-tanganyika
      localities:
        - Luhanga
        - Pemba
        - Uvira
    confidence: high
    rationale: "Generator names the western rocky shore and Luhanga; checker-a lists Luhanga and Pemba; checker-b\
      \ lists Luhanga, Uvira and Moba; checker-c names the western shore and Luhanga. The Catalog determines the western-shore\
      \ distribution and identifies Luhanga as the original type locality and Pemba as the melas type locality. Tanganyika.si\
      \ extends records northward to Uvira and uses Moba as a range boundary, so Moba is not retained as a confirmed\
      \ locality. FishBase and Seriously Fish restrict the fish to the southern lake, contradicting the northern type\
      \ locality; eastern records can reflect inclusion of longior."

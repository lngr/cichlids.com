  disagreements:
    - field: taxonomy.synonyms
      proposals:
        - by: generator
          value:
            - Lamprologus leleupi
            - Lamprologus leleupi melas
            - Neolamprologus leleupi melas
        - by: checker-a
          value:
            - Lamprologus leleupi
            - Lamprologus leleupi melas
        - by: checker-b
          value:
            - Lamprologus leleupi
            - Lamprologus leleupi melas
        - by: checker-c
          value:
            - Lamprologus leleupi
            - Lamprologus leleupi melas
            - Neolamprologus leleupi melas
      decision:
        - Lamprologus leleupi
        - Lamprologus leleupi melas
        - Neolamprologus leleupi melas
      rationale: "Generator and checker-c include the later combination Neolamprologus leleupi melas; checker-a and\
        \ checker-b list only the original combination and Lamprologus leleupi melas. Retain the later combination\
        \ as a historical synonym spelling, without assigning a separate taxon. The Catalog treats melas as a synonym\
        \ of leleupi."
    - field: features.origin
      proposals:
        - by: generator
          value:
            continent: Africa
            region: Lake Tanganyika
            waterbody: lake-tanganyika
            localities:
              - Western rocky shore
              - "Luhanga, Democratic Republic of Congo"
        - by: checker-a
          value:
            continent: Africa
            region: Lake Tanganyika
            waterbody: lake-tanganyika
            localities:
              - Luhanga
              - Pemba
        - by: checker-b
          value:
            continent: Africa
            region: "Lake Tanganyika, western Congolese shoreline"
            waterbody: lake-tanganyika
            localities:
              - Luhanga
              - Uvira
              - Moba
        - by: checker-c
          value:
            continent: Africa
            region: Lake Tanganyika
            waterbody: lake-tanganyika
            localities:
              - Western shore
              - Luhanga
      decision:
        continent: Africa
        region: "Lake Tanganyika, western Congolese shoreline"
        waterbody: lake-tanganyika
        localities:
          - Luhanga
          - Pemba
          - Uvira
      rationale: "Generator names the western rocky shore and Luhanga; checker-a lists Luhanga and Pemba; checker-b\
        \ lists Luhanga, Uvira and Moba; checker-c names the western shore and Luhanga. The Catalog determines the\
        \ western-shore distribution and identifies Luhanga as the original type locality and Pemba as the melas type\
        \ locality. Tanganyika.si extends records northward to Uvira and uses Moba as a range boundary, so Moba is\
        \ not retained as a confirmed locality. FishBase and Seriously Fish restrict the fish to the southern lake,\
        \ contradicting the northern type locality; eastern records can reflect inclusion of longior."
    - field: features.maxSizeCm
      proposals:
        - by: generator
          value:
            male: 10
            female: 8
        - by: checker-a
          value:
            male: 10
            female: 8
        - by: checker-b
          value:
            male: 10
            female: 8
        - by: checker-c
          value:
            male: 11
            female: 8
      decision:
        male: 10
        female: 8
      rationale: "Generator, checker-a and checker-b propose males 10 cm and females 8 cm; checker-c proposes 11 and\
        \ 8. Borstein gives aquarium males about 10.16 cm and females 5.08 to 7.62 cm; the rounded upper female figure\
        \ is 8 cm. FishBase reports an unsexed 10 cm total length, the Nordic register an unsexed 11 cm and AquaInfo\
        \ a 12 cm male. Retain 10 and 8 as typical sex-specific aquarium maxima, while naming the larger 11 to 12\
        \ cm reports. The standard-length figure in Seriously Fish excludes the tail and is not directly treated as\
        \ a total-length maximum."
    - field: features.diet
      proposals:
        - by: generator
          value:
            type: invertivore
            bloatSensitive: false
            foods:
              - Small crustaceans
              - Insect larvae
              - Artemia
              - Mysis
              - Suitable small pellets
        - by: checker-a
          value:
            type: invertivore
            bloatSensitive: false
            foods:
              - live foods
              - frozen foods
              - spirulina flake
        - by: checker-b
          value:
            type: invertivore
            bloatSensitive: false
            foods:
              - Mysis shrimp
              - Artemia
              - Daphnia
              - Cyclops
              - aquatic insect larvae
              - small carnivore pellets
        - by: checker-c
          value:
            type: invertivore
            bloatSensitive: false
            foods:
              - Small crustaceans
              - Insect larvae
              - Mysis
              - Artemia
              - Suitable prepared foods
      decision:
        type: invertivore
        bloatSensitive: false
        foods:
          - Small crustaceans
          - Insect larvae
          - Artemia
          - Mysis
          - Suitable small pellets
      rationale: "All four votes agree on invertivore and bloatSensitive false, retained exactly with unanimous tally\
        \ verification and medium confidence. Their food lists differ: generator names crustaceans, insect larvae,\
        \ Artemia, Mysis and small pellets; checker-a names live and frozen foods plus spirulina flakes; checker-b\
        \ adds Daphnia, Cyclops and carnivore pellets; checker-c names similar animal foods and prepared feeds. The\
        \ tally retains the generator list. FishBase stomach tables show 73.8 or 82.5 percent shrimp, independently\
        \ consistent with Borstein and Practical Fishkeeping. Omnivore labels in aquarium pages describe accepted\
        \ feeds rather than the main wild diet. The false bloat flag is an inference from normal animal-food husbandry,\
        \ not evidence of immunity to digestive disease."
    - field: features.territory
      proposals:
        - by: generator
          value:
            size: small
            breedingOnly: false
        - by: checker-a
          value:
            size: small
            breedingOnly: false
        - by: checker-b
          value:
            size: small
            breedingOnly: false
        - by: checker-c
          value:
            size: large
            breedingOnly: false
      decision:
        size: small
        breedingOnly: false
      rationale: "Generator, checker-a and checker-b propose small with breedingOnly false; checker-c proposes large\
        \ with breedingOnly false. AquaInfo describes a territory in rock crevices, while the Nordic register describes\
        \ broad wild territories and Fishkeeper a large foraging range. Retain the cave-centred small category for\
        \ the recommended aquarium pair because foraging extent does not establish the rubric threshold of a defended\
        \ area at least 50 cm long. No measured aquarium boundary resolves the competing interpretations, so confidence\
        \ is low. Male intolerance between broods supports year-round territoriality."
    - field: features.habitatZones
      proposals:
        - by: generator
          value:
            - rock
        - by: checker-a
          value:
            - rock
            - sand
        - by: checker-b
          value:
            - rock
        - by: checker-c
          value:
            - rock
      decision:
        - rock
      rationale: "Generator, checker-b and checker-c propose rock; checker-a adds sand from aquarium substrate advice.\
        \ Wild feeding and shelter accounts consistently identify rock recesses, so rock is the required habitat zone.\
        \ Sand underneath the rocks provides digging substrate without establishing a separate sand niche. Sefc reports\
        \ facultative shell nesting, which does not require shell beds. CRC verifies rock habitat but uses a sediment-free\
        \ description, whereas the Nordic and locality accounts report sedimented rock; that difference does not change\
        \ the common rock requirement."
    - field: features.hybridGroups
      proposals:
        - by: generator
          value:
            - neolamprologus-leleupi-longior
        - by: checker-a
          value:
            - neolamprologus-leleupi-longior
        - by: checker-b
          value:
            - neolamprologus-leleupi-longior
            - neolamprologus-brichardi-leleupi
        - by: checker-c
          value:
            - neolamprologus-leleupi-longior
        - by: tiebreaker-1
          value:
            - neolamprologus-leleupi-longior
            - neolamprologus-brichardi-leleupi
        - by: tiebreaker-2
          value:
            - neolamprologus-leleupi-longior
            - neolamprologus-brichardi-leleupi
      decision:
        - neolamprologus-brichardi-leleupi
        - neolamprologus-leleupi-longior
      rationale: "Generator, checker-a and checker-c propose only neolamprologus-leleupi-longior; checker-b and tiebreaker-1\
        \ and tiebreaker-2 propose that pair plus neolamprologus-brichardi-leleupi. Neither list reaches a qualified\
        \ majority. The tally conservatively retains the union of groups named by at least two votes, with three of\
        \ six votes supporting the resulting list and low confidence. Both groups have presumed basis. The Catalog\
        \ and molecular study establish the longior relationship; Tanganyika.si suspects mixed captive ancestry but\
        \ records no verified free-choice spawning and misattributes the original description to Poll in 1986 instead\
        \ of Staeck in 1980. For brichardi, archive threads 15153 and 15247 report named offspring and Cleveland-area\
        \ shop stock, without parentage testing or demonstrated conspecific partner availability. Another keeper reports\
        \ 15 years of coexistence without crosses. Taxonomic and phylogenetic sources provide context only for that\
        \ archive claim, which lacks independent literature or database confirmation. N. gracilis belongs to the princess\
        \ lineage; neither pair is expanded by transitivity."
    - field: features.coloration
      proposals:
        - by: generator
          value:
            baseColors:
              - yellow
              - orange
            pattern: plain
        - by: checker-a
          value:
            baseColors:
              - yellow
              - orange
            pattern: plain
        - by: checker-b
          value:
            baseColors:
              - yellow
              - orange
            pattern: plain
        - by: checker-c
          value:
            baseColors:
              - yellow
              - orange
              - brown
              - black
              - silver
            pattern: plain
      decision:
        baseColors:
          - yellow
          - orange
          - brown
          - black
          - silver
        pattern: plain
      rationale: "Generator, checker-a and checker-b propose yellow and orange with plain pattern; checker-c adds\
        \ brown, black and silver while retaining plain. Seriously Fish, Borstein and Fishkeeper describe both bright\
        \ and darker or pale natural morphs. Retain the broader adult colour set so the feature represents valid natural\
        \ forms as well as common yellow-orange trade stock. Dark pigment may mask the yellow background; melas is\
        \ a synonym rather than a separate species. Colour does not reliably separate the sexes."
    - field: features.minTank
      proposals:
        - by: generator
          value:
            volumeL: 160
            lengthCm: 100
            depthCm: 40
        - by: checker-a
          value:
            volumeL: 110
            lengthCm: 80
            depthCm: 35
        - by: checker-b
          value:
            volumeL: 200
            lengthCm: 120
            depthCm: 40
        - by: checker-c
          value:
            volumeL: 150
            lengthCm: 100
            depthCm: 40
      decision:
        volumeL: 200
        lengthCm: 120
        depthCm: 40
      rationale: "Generator proposes 160 L at 100 by 40 cm; checker-a 110 L at 80 by 35 cm; checker-b 200 L at 120\
        \ by 40 cm; checker-c 150 L at 100 by 40 cm. Select checker-b for one compatible pair because the locality\
        \ database explicitly recommends 200 L, AquaInfo recommends 120 cm and severe partner aggression warrants\
        \ distinct retreats. The 40 cm depth is a planning allowance for caves and bypass routes, not a measured biological\
        \ threshold. Smaller published setups include Seriously Fish at 70 L and 75 by 30 cm, Borstein at about 76\
        \ L, the Nordic register at 120 L and 100 cm, and a retailer at 150 L. Those breeding or care minima give\
        \ less escape margin. Community partners require at least about 300 L and 120 cm, with further space for multiple\
        \ territories or an open-water group."
    - field: features.lifespanYears
      proposals:
        - by: generator
          value:
            min: 8
            max: 10
        - by: checker-a
          value:
            min: 8
            max: 10
        - by: checker-b
          value:
            min: 8
            max: 10
        - by: checker-c
          value:
            min: 6
            max: 10
      decision:
        min: 6
        max: 10
      rationale: "Generator, checker-a and checker-b propose 8 to 10 years; checker-c proposes 6 to 10. Dietzenbach\
        \ gives 8 to 10, Zierfische-Direkt 6 to 10 and Aqua-Fish a maximum of 8, while Aquarismo Paulista gives more\
        \ than five years without an upper limit. Retain the broader 6 to 10 aquarium estimate instead of treating\
        \ 8 as a demonstrated minimum. The endpoints rely mainly on retailer guidance, without age-validated cohorts\
        \ or field survival data, so confidence is low."
    - field: features.beginnerSuitability
      proposals:
        - by: generator
          value: demanding
        - by: checker-a
          value: moderate
        - by: checker-b
          value: moderate
        - by: checker-c
          value: moderate
      decision: moderate
      rationale: "Generator proposes demanding; checker-a, checker-b and checker-c propose moderate. Seriously Fish\
        \ and the Nordic register independently support intermediate keeping, verified by CRC. Dietzenbach uses an\
        \ advanced label and LiveAquaria an easy label. Select moderate for an informed keeper with stable water,\
        \ multiple retreats and separation capacity; potentially lethal partner aggression prevents interpreting it\
        \ as uncomplicated beginner stocking."
    - field: features.khDkh.tolerance
      proposals:
        - by: generator
          value:
            min: 8
            max: 20
        - by: checker-a
          value:
            min: 15
            max: 20
        - by: checker-b
          value:
            min: 8
            max: 20
        - by: checker-c
          value:
            min: 8
            max: 20
        - by: tiebreaker-1
          value:
            min: 8
            max: 20
        - by: tiebreaker-2
          value:
            min: 8
            max: 20
      decision:
        min: 8
        max: 20
      rationale: "Generator, checker-b, checker-c and both tiebreakers propose 8 to 20 dKH; checker-a proposes 15\
        \ to 20 because it found no explicit carbonate-hardness care range. The tally fixes 8 to 20 with qualified-majority\
        \ verification, five of six votes and medium confidence. Koolwaaij reports six leleupi and offspring in an\
        \ established aquarium at measured KH 8, with recurring reproduction. Practical Fishkeeping recommends 8 to\
        \ 18 for Tanganyikans, LiveAquaria 10 to 20 for this species, and Dietzenbach and Zierfische-Direkt 15 to\
        \ 20. Successful keeping at 8 outweighs treating the narrower preferred care range as a physiological minimum.\
        \ The result contains the full natural KH envelope; GH figures are not converted into KH."

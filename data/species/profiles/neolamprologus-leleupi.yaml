partners:
  suitable:
    - species: Cyprichromis leptosoma
      reason: Open-water adults usually avoid the cave territory and share animal-food requirements.
      condition: "At least about 300 L and 120 cm, with separate territories and additional space for the full adult\
        \ social unit. Protect fry and retain separation capacity."
    - species: Altolamprologus calvus
      reason: A sufficiently grown rock specialist can occupy separate crevices and shares an invertebrate-based diet.
      condition: "At least about 300 L and 120 cm, with separate territories and additional space for the full adult\
        \ social unit. Protect fry and retain separation capacity."
    - species: Julidochromis transcriptus
      reason: A robust established adult pair can use a different rock formation when visual barriers divide the territories.
      condition: "At least about 300 L and 120 cm, with separate territories and additional space for the full adult\
        \ social unit. Protect fry and retain separation capacity."
  unsuitable:
    - species: Neolamprologus multifasciatus
      reason: Small shell dwellers remain exposed to bottom-level attacks and their fry may be taken.
    - species: Melanochromis auratus
      reason: Boisterous mbuna aggression and feeding competition make this a poor match for a cave-centred Tanganyikan.
    - species: Neolamprologus longior
      reason: A close and very similar relative with a presumed crossing concern and uncertain identity in mixed trade
        stock; unsuitable for maintaining distinct breeding lines.
    - species: Paracheirodon innesi
      reason: Small body size and incompatible soft-water husbandry make a lemon-cichlid rock aquarium unsuitable.
    - species: Neolamprologus brichardi
      reason: A separate presumed pairwise crossing caution rests on unverified named aquarium offspring; overlapping
        cave territories also complicate breeding-line management.
profile:
  overview:
    text: "The lemon cichlid combines a small adult body with a serious need for personal space. Neolamprologus leleupi\
      \ is a Lake Tanganyika invertebrate feeder and cave breeder, commonly yellow or orange but also found in darker\
      \ and pale forms. The similar N. longior remains a separate valid species despite older subspecies labels. N.\
      \ gracilis is a princess cichlid, not a lemon-cichlid form."
    sources:
      - kind: catalog-of-fishes
        title: "Eschmeyer's Catalog of Fishes: species of Neolamprologus"
        url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Neolamprologus"
        archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-15c05e25/2026-10-14T101710Z
        accessed: '2026-10-13'
      - kind: literature
        title: Sturmbauer et al. (2010). Evolutionary history of the Lake Tanganyika cichlid tribe Lamprologini derived
          from mitochondrial and nuclear DNA data.
        url: "https://doi.org/10.1016/j.ympev.2010.06.018"
        archived: doi.org/10.1016_j.ympev.2010.06.018/2026-10-13T092305Z
        accessed: '2026-10-13'
      - kind: literature
        title: "Borstein, R. (2002). Neolamprologus leleupi. Greater Chicago Cichlid Association."
        url: "https://www.gcca.net/art-pics/cichlid-profiles-list/tanganyikan-cichlids/109-neolamprologus-leleupi-sp-qorangeq.html"
        accessed: '2026-10-13'
  habitat:
    text: "Sheltered routes through rockwork are central to this fish's habitat. It finds small animal prey in recesses\
      \ and breeds inside protected cavities. The accepted distribution follows the western Congolese shoreline, with\
      \ Luhanga as the original type locality. Lake measurements support natural ranges of 23 to 29 C, pH 8.4 to 9.4,\
      \ GH 10 to 13 dGH and KH 15 to 20 dKH. These lake-wide envelopes include seasonal and spatial differences and\
      \ do not describe fluctuations to reproduce in a tank."
    sources:
      - kind: catalog-of-fishes
        title: "Eschmeyer's Catalog of Fishes: species of Neolamprologus"
        url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Neolamprologus"
        archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-15c05e25/2026-10-14T101710Z
        accessed: '2026-10-13'
      - kind: literature
        title: "Langenberg, V. T. (2008). On the limnology of Lake Tanganyika."
        url: "https://doi.org/10.18174/121977"
        archived: doi.org/10.18174_121977/2026-10-13T092439Z
        accessed: '2026-10-13'
      - kind: literature
        title: "Branchu, P. and Bergonzini, L. (2004). Chloride concentrations in Lake Tanganyika: an indicator of\
          \ the hydrological budget?"
        url: "https://doi.org/10.5194/hess-8-256-2004"
        archived: doi.org/10.5194_hess-8-256-2004/2026-10-13T103646Z
        accessed: '2026-10-13'
  sizeAndGrowth:
    text: "Allow for a typical adult male around 10 cm and a female approaching 8 cm. Some profiles report males of\
      \ 11 to 12 cm; measurement conventions and larger individuals account for part of the variation. Young fish\
      \ can take more than a year to reveal useful size differences or form a workable pair. Published aquarium lifespan\
      \ estimates span roughly 6 to 10 years, but the evidence is weak and does not guarantee that age."

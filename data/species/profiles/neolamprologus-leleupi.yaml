  socialBehavior:
    text: "A safe partnership must be assessed repeatedly, especially when brood care ends. A male and female bought\
      \ separately may never become compatible, and a spawning pair can later require separation. Juveniles can be\
      \ raised together to find a suitable pair, but extra adults should not remain in an ordinary pair aquarium.\
      \ Persistent pursuit, hiding or loss of feeding access calls for a divider or a separate mature aquarium. Keeping\
      \ a single adult is another option."
    sources:
      - kind: database
        title: "Seriously Fish: Neolamprologus leleupi"
        url: "https://www.seriouslyfish.com/species/neolamprologus-leleupi/"
        archived: seriouslyfish.com/species/neolamprologus-leleupi/2026-10-14T101831Z

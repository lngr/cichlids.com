  legacyNames:
    - Neolamprologus leleupi
  note: "The Catalog of Fishes accepts Neolamprologus leleupi (Poll, 1956), N. longior (Staeck, 1980) and N. gracilis\
    \ (Brichard, 1989) as separate valid species. Both Neolamprologus and the original genus Lamprologus were queried.\
    \ Longior was originally described as a leleupi subspecies; Konings and CRC retain that alternative treatment,\
    \ but it is neither a synonym nor a variant here. Sturmbauer et al. place leleupi and longior in mitochondrial\
    \ clade VI and gracilis among princess-cichlid lineages. Melas is a synonym of leleupi; N. leloupi is another\
    \ valid species with a similar spelling."

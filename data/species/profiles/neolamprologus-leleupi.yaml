        \ retains unanimous verification and low confidence. Seriously Fish gives 23 to 27 C, Fishkeeper and FishBase\
        \ 24 to 26 C, the Nordic register 24 to 27.5 C and Aquarismo Paulista 24 to 28 C. LiveAquaria gives the wider\
        \ lower boundary of 22.2 C in its 22.2 to 27.8 C range, which is not adopted. Borstein reports successful\

  sexing:
    text: "Adult males usually become larger and heavier than females, but overlapping sizes and uneven growth make\
      \ juvenile comparisons unreliable. Both sexes can share the same bright colour. Experienced vent examination\
      \ or reproductive behaviour can help confirm sex. Correct sex identification still does not demonstrate that\
      \ two adults will tolerate one another."

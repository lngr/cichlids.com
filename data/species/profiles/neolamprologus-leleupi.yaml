  breeding:
    value: cave-spawner
    confidence: high
    rationale: All four runs propose cave-spawner. Seriously Fish and Borstein describe cavity-attached eggs and parental
      guarding; Sefc independently records biparental guarding and optional shell nests. Facultative shell use does
      not establish an obligatory shell-spawner category. CRC verifies cavity substrate spawning. Older offspring
      can coexist for a time but do not establish the permanent cooperative adult social system of the princess cichlids.

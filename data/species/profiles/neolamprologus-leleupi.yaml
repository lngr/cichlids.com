        url: "https://www.fishbase.se/summary/Neolamprologus-leleupi.html"
        archived: fishbase.se/summary/neolamprologus-leleupi.html/2026-10-14T101831Z
        accessed: '2026-10-13'
      - kind: database
        title: "AquaInfo: Neolamprologus leleupi"
        url: "https://aquainfo.nl/en/article/neolamprologus-leleupi/"
        accessed: '2026-10-13'
      - kind: website
        title: "Fishkeeper: Lemon Cichlid, Neolamprologus leleupi"
        url: "https://www.fishkeeper.co.uk/fish/freshwater/cichlids/lemon-cichlid"
        archived: fishkeeper.co.uk/fish/freshwater/cichlids/lemon-cichlid/2026-10-14T101836Z
        accessed: '2026-10-13'
  breeding:
    text: "Cavity surfaces provide the egg site, with the female staying close to the clutch and the male defending\
      \ its approaches. Both parents can guard swimming young. Pale eggs need not be infertile. Broods of several\
      \ dozen to about a hundred are often reported, with larger clutches possible. Newly hatched Artemia and fine\
      \ prepared food support the fry. Older offspring may coexist temporarily, but adults can later attack them,\
      \ and removing a brood can also destabilize the pair."
    sources:
      - kind: literature
        title: "Borstein, R. (2002). Neolamprologus leleupi. Greater Chicago Cichlid Association."
        url: "https://www.gcca.net/art-pics/cichlid-profiles-list/tanganyikan-cichlids/109-neolamprologus-leleupi-sp-qorangeq.html"
        accessed: '2026-10-13'

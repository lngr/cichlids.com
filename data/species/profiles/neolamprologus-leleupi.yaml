        archived: fishkeeper.co.uk/fish/freshwater/cichlids/lemon-cichlid/2026-10-14T101836Z
        accessed: '2026-10-13'
      - kind: website
        title: "Aquarium Dietzenbach: Neolamprologus leleupi care and breeder account"
        url: "https://www.aquarium-dietzenbach.de/descriptions_neolamprologus_leleupi"
        archived: aquarium-dietzenbach.de/descriptions_neolamprologus_leleupi/2026-10-14T101841Z
        accessed: '2026-10-13'
  diet:
    text: "Small crustaceans and other invertebrates dominate the natural menu; fish eggs and occasional very small\
      \ fish are secondary items. Suitable aquarium foods include Artemia, Mysis, insect larvae and appropriate small\
      \ prepared feeds. Offer varied portions that both adults can obtain, with pieces small enough for the female.\
      \ Acceptance of vegetable-containing foods does not make this an algae grazer. The protein-related bloat flag\
      \ is false, although digestive disease remains possible."
    sources:
      - kind: literature
        title: "Borstein, R. (2002). Neolamprologus leleupi. Greater Chicago Cichlid Association."
        url: "https://www.gcca.net/art-pics/cichlid-profiles-list/tanganyikan-cichlids/109-neolamprologus-leleupi-sp-qorangeq.html"
        accessed: '2026-10-13'

  temperatureC:
    value:
      min: 23
      max: 29
    confidence: high
    rationale: The tally fixes the natural lake envelope at 23 to 29 C with waterbody verification and high confidence.
      Verburg et al. report buoy extrema of 23.85 to 29.01 C; Langenberg reports seasonal surface means of 24.4 to
      27.2 C at Mpulungu. The lake synthesis rounds these measurements to a regional envelope rather than a constant
      aquarium setting. Original FAO reports remain inherited lake references and were not independently reread here.
    sources:

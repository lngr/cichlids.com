  problems:
    text: "Partner injury and exclusion from food can become urgent even in a previously spawning pair. Check both\
      \ fish regularly and separate incompatible adults before damage progresses. Accumulated waste in rockwork and\
      \ abrupt water changes also undermine care. Investigate persistent appetite loss or lesions rather than diagnosing\
      \ illness from colour alone, since dark morphs and substrate-related colour changes are normal possibilities.\
      \ Maintain water quality during fry rearing and quarantine new arrivals."
    sources:
      - kind: literature
        title: "Borstein, R. (2002). Neolamprologus leleupi. Greater Chicago Cichlid Association."
        url: "https://www.gcca.net/art-pics/cichlid-profiles-list/tanganyikan-cichlids/109-neolamprologus-leleupi-sp-qorangeq.html"

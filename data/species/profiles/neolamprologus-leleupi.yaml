  compatibility:
    text: "An appropriate Tanganyikan community can include adult Cyprichromis or carefully separated rock dwellers,\
      \ provided it exceeds the pair minimum. Plan at least about 300 litres and 120 cm, increasing space for an open-water\
      \ group and multiple cave territories. Small shell dwellers and vulnerable fry remain poor companions. Boisterous\
      \ mbuna add aggression and feeding competition. The separate leleupi-longior and brichardi-leleupi hybrid cautions\
      \ are presumed: close relationship supports the former and unverified aquarium reports the latter. Neither establishes\
      \ a leleupi-gracilis cross."

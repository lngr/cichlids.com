    confidence: high
    rationale: The tally fixes 8.4 to 9.4 with waterbody verification and high confidence. The annual-cycle study
      reproduced by Langenberg reports 8.47 to 9.40 at 40 m in the northern basin. The rounded lake envelope follows
      these measurements rather than the lower aquarium pH figures in FishBase. The inconsistent 7.3 to 7.8 in the
      older FAO source book is excluded by the lake synthesis.

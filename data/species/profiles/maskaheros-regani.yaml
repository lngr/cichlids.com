  sexing:
    text: "Mature males usually exceed females in size and have a heavier head profile. A forehead hump,\
      \ stronger color and extended fin tips can support an adult assessment, while young fish are difficult\
      \ to sex visually. Size and color also respond to age, condition and social position, so no single\
      \ trait guarantees a correct identification. A male and female chosen by appearance may still fail\
      \ to form a safe pair. An established bond and repeated behavior observations give more useful information\
      \ for breeding than a seller's size-based guess."

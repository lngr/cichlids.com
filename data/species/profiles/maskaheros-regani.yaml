  habitat:
    text: "Clear tributaries of the Coatzacoalcos provide pools, current, stones, sand and submerged cover.\
      \ Miller's material includes Almoloya, Malatengo and Jaltepec. The decided natural values are representative\
      \ working ranges of 24 to 29 C, pH 7.0 to 8.1, GH 3 to 13 dGH and KH 1 to 11 dKH, all with low confidence.\
      \ They are not complete annual limits. Artigas Azas found regani in an ordinary Rio Grande habitat\
      \ at about 28 C, with pH 7.8 to 8.0, GH 15 to 16 and KH 13 to 15 on two visits. INEGI's wider basin\
      \ observations include 20.1 to 33 C, pH 6.3 to 9.1, calculated GH about 0.75 to 18.1 and calculated\
      \ alkalinity about 1.09 to 18.15 dKH, usually without concurrent fish records. These harder and\
      \ broader observations remain in the evidence. Chemistry from polluted lower reaches or an unrelated\
      \ Almoloya spring in Jalisco does not establish typical regani exposure."

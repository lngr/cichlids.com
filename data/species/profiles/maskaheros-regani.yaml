    tolerance:
      value:
        min: 3
        max: 20
      confidence: low
      rationale: "Retain the conservative tolerance 3 to 20 dGH with low confidence. generator proposed\
        \ 5 to 20; checker-a proposed 5 to 20; checker-b proposed 4 to 20; checker-c proposed 1.5 to 20;\
        \ tiebreaker-1 proposed 1 to 20; tiebreaker-2 proposed 1.5 to 20. Only three of six votes agree\
        \ with the leading candidate, so the tally intersects all six proposals at 5 to 20 and then lowers\
        \ the bound to 3 to contain its decided natural 3 to 13 range. The wider proposed intervals of\
        \ 4 to 20, 1.5 to 20 and 1 to 20 stay represented. Seriously Fish supports an upper limit of 20,\
        \ corroborated by the recorded aquarium at 20 dGH; its displayed 0 to 20 range does not establish\
        \ health in mineral-free water. AquaInfo recommends the narrower 5 to 8. The lower endpoint is\
        \ inferred from the settled habitat synthesis, not a documented captive limit, and field observations\
        \ of 0.75 to 18.1 remain evidence rather than proving chronic maintenance at the full spread."

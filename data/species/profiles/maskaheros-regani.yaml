  temperatureC:
    value:
      min: 24
      max: 29
    confidence: low
    rationale: "The settled median is 24 to 29 C, with low confidence. generator proposed 25 to 30; checker-a\
      \ proposed 24 to 26; checker-b proposed 24 to 27; checker-c proposed 23 to 29; tiebreaker-1 proposed\
      \ 23 to 29; tiebreaker-2 proposed 23 to 30. No candidate obtains a qualifying majority. The median\
      \ of all lower endpoints rounds from 23.5 to 24 and the upper median is 29. This is a representative\
      \ working interval, not a measured annual species envelope. INEGI reports a wider basin span of\
      \ 20.1 to 33 C; selected southern river observations extend from 22.9 to 30 C. Artigas Azas recorded\
      \ about 28 C with regani present, whereas the secondary French account gives 25 to 30 C and FishBase\
      \ gives 24 to 26 C without a field series. Wider and colder readings remain in evidence because\
      \ station occupancy and seasonal exposure are unresolved. Aquarium care targets do not establish\
      \ the natural interval."

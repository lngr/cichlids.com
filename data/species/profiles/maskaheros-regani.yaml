  ph:
    value:
      min: 7
      max: 8.1
    confidence: low
    rationale: "The settled qualified-majority decision is pH 7.0 to 8.1, with four of six votes agreeing\
      \ within the rubric threshold and low confidence. generator proposed 6.9 to 8; checker-a proposed\
      \ 7 to 7.8; checker-b proposed 7 to 7.5; checker-c proposed 7.4 to 8.2; tiebreaker-1 proposed 7\
      \ to 8.2; tiebreaker-2 proposed 7 to 8.2. The agreeing lower endpoints have median 7.0 and upper\
      \ endpoints median 8.1. Direct river measurements are more informative than the unsupported estimate\
      \ or poorly formatted French account. Artigas Azas measured 7.8 to 8.0 where regani occurred. INEGI\
      \ contains a wider full field span of 6.3 to 9.1 and southern or related river readings of 6.99\
      \ to 8.4; these are retained without asserting occupancy at every endpoint. Both interpretations\
      \ of the French passage, 6.9 to 7.0 and 6.9 to 7.25, stay visible as ambiguous secondary evidence.\
      \ The selected range is not a basin-wide exclusion of water outside it."

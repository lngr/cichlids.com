  problems:
    text: "Pair conflict, inadequate adult floor space and poor water maintenance are predictable difficulties.\
      \ Persistent cornering, missed meals or physical damage mean the social arrangement needs intervention.\
      \ Secure heavy decorations before adding fish because excavation can undermine loosely placed objects.\
      \ Uncertain water ranges should not be treated as exact physiological limits, and a routine setting\
      \ should have practical husbandry support. A general warning about digestive problems cannot diagnose\
      \ a swollen fish or establish protein-induced bloat in this species. Seek appropriate diagnostic\
      \ help for persistent illness. Moderate suitability assumes experience with a large aquarium and\
      \ partner management rather than effortless care."

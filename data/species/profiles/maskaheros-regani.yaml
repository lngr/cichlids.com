  khDkh:
    value:
      min: 1
      max: 11
    confidence: low
    rationale: "The settled tally range is 1 to 11 dKH, with low confidence and no natural-water verification\
      \ object. Its underlying decision method is median. generator proposed 1.5 to 7.3; checker-a proposed\
      \ 3 to 8; checker-b proposed 3 to 3; checker-c proposed 1.4 to 13; tiebreaker-1 proposed 1 to 13;\
      \ tiebreaker-2 proposed 1.4 to 15. The lower median of 1.45 rounds to 1 and the upper median of\
      \ 10.5 rounds to 11. INEGI bicarbonate and carbonate yield a wider basin interval of about 1.09\
      \ to 18.15 dKH; selected southern river samples give 1.43 to 12.83. Artigas Azas reported KH 13\
      \ and 15 with regani present. Those ordinary harder river observations remain in evidence and show\
      \ that the decided interval is a representative synthesis rather than a complete species-wide range.\
      \ The lower-basin Rio Chiquito proxy and Sarabia reading are geographically indirect. KH is alkalinity\
      \ expressed in aquarium degrees and is not inferred from GH, pH or conductivity."

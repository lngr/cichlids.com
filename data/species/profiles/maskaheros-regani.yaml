  sizeAndGrowth:
    text: "Use about 30 cm for a well-grown male and 25 cm for a female when planning the adult aquarium.\
      \ Published size figures vary, and the sex-specific estimates have only moderate support. FishBase's\
      \ 23 cm and Seriously Fish's 30 cm are standard lengths, which exclude the tail; neither is a direct\
      \ total-length conversion. Large adults need room to turn, shelter and feeding access as well as\
      \ swimming length. An ordinary lifespan of about eight to nine years is a tentative estimate from\
      \ a secondary account, with no dependable individual age series. Exceptional age claims remain visible\
      \ in the evidence."

    confidence: high
    rationale: "The Catalog of Fishes and Miller establish endemism in the Coatzacoalcos basin on the\
      \ Atlantic slope of southern Mexico. The Almoloya, Malatengo (also spelled Malotengo) and Jaltepec\
      \ tributaries identify the original material. Different regional wording among the four runs describes\
      \ this same basin. The French compilation also includes the Grijalva, which is rejected against\
      \ the catalog and later basin inventory. Central America follows the project rubric for Middle American\
      \ cichlids. Full-name searches of the cichlids.com archive found no species-specific husbandry posts."

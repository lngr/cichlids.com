  note: "Maskaheros regani (Miller, 1974) is the valid name in the Catalog of Fishes. The current and\
    \ legacy genus lists were checked; regani is assigned to Maskaheros rather than the current Vieja\
    \ list. The 2015 revision places it with M. argenteus. Former generic combinations are listed as nomenclatural\
    \ synonyms, while Vieja regani preserves the legacy catalog name."

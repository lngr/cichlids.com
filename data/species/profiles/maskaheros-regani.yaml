  diet:
    text: "Make complete vegetable-rich foods the staple, with a substantial plant and fibre component.\
      \ Suitable soft greens and spirulina-based foods can add variety. Small amounts of aquatic invertebrates,\
      \ such as mysis, shrimp or mussel, are supplements rather than the main menu. The decided aufwuchs\
      \ category reflects the natural emphasis on plant-derived detritus and biofilm, despite care sources\
      \ that use an omnivore label. Predation level 1 allows opportunistic consumption of fry or very\
      \ small fish; the rubric's approximately 2 cm cutoff is not a measured species limit. The false\
      \ bloatSensitive flag means no convincing species-specific adult syndrome was established. It does\
      \ not establish immunity, and unpublished larval overfeeding observations cannot define adult susceptibility."

  aggressionConspecific:
    value: 3
    confidence: medium
    rationale: "All four full-profile runs assign level 3. Pairing difficulty, repeated female harassment\
      \ and exclusion of additional adults in Seriously Fish and the Nordic association support persistent\
      \ conspecific chasing. AquaInfo describes a milder temperament but does not disprove partner conflict.\
      \ Routine permanent injury at level 4 is not established in the recommended spacious, sheltered\
      \ pair arrangement. Confidence is medium."

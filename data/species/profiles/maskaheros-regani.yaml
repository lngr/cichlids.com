  husbandry:
    text: "Allow one established adult pair at least 500 L with a base around 200 by 50 cm. The Nordic\
      \ association recommends a larger 700 L aquarium, and companions need room beyond the pair minimum.\
      \ Use sand and secure stones or wood to create separate refuges and break sightlines. A divider\
      \ or separate aquarium should be ready if a pair becomes incompatible. Good filtration, water movement\
      \ and regular partial changes support the substantial adult biomass. The settled tolerances are\
      \ 23 to 29 C, pH 6.8 to 8.1, GH 3 to 20 and KH 1 to 11; their endpoint evidence is incomplete, especially\
      \ KH. Routine maintenance around 24 to 27 C has stronger species-specific support. Stability and\
      \ appropriate acclimation matter more than using uncertain endpoints as routine targets."

  compatibility:
    text: "Mixed housing is possible, but the speciesOnly false decision does not guarantee any particular\
      \ pairing. Adult characins or sufficiently large livebearers are conditional options in a larger,\
      \ sheltered aquarium; fry and tiny fish remain vulnerable. Native associates such as Paraneetroplus\
      \ bulleri require substantially more room and separate territories, and sharing a drainage is not\
      \ proof of aquarium compatibility. The presumed maskaheros group creates a crossing caution with\
      \ M. argenteus from relationship evidence, without a verified free-choice cross. Avoid judging safety\
      \ from body size alone: timid fish can lose feeding access, and highly aggressive predators can\
      \ injure regani. Reassess companions when either pair starts breeding."

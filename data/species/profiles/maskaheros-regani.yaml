  breeding:
    text: "Regani deposits eggs on a prepared firm surface and both parents contribute to defense and\
      \ care. Its principal category is open-substrate spawning, even when a pair uses a sheltered surface.\
      \ Let partners form naturally and monitor their relationship throughout courtship. A retreat for\
      \ the smaller fish and a separation option are part of the breeding setup. Husbandry accounts place\
      \ hatching around two to three days after spawning, with free swimming roughly a week after spawning\
      \ depending on conditions. Once fry feed independently, offer appropriately small foods. Additional\
      \ broods can change parental behavior, so growing young may need their own accommodation."

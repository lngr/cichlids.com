partners:
  suitable:
  - species: Astyanax mexicanus
    reason: A possible active adult characin companion from general community advice; a verified regani
      pairing trial was not found.
    condition: "Adult fish only, a shoal, ample cover and a community tank larger than the pair minimum;\
      \ inferred suitability, monitor closely."
  - species: Poecilia mexicana
    reason: A livebearer recorded in the original habitat account and consistent with general companion
      advice; fry remain vulnerable and adults need cover.
    condition: "Choose large adults, stable near-neutral to mildly alkaline water and separate upper-water\
      \ cover; inferred suitability, not a guarantee."
  - species: Paraneetroplus bulleri
    reason: Named native associate and suggested cichlid companion in the compilation; its plant-leaning
      diet avoids a strongly carnivorous feeding conflict.
    condition: A substantially larger community aquarium with distinct territories and a separation option;
      no species-specific minimum for this combination is established.
  unsuitable:
  - species: Maskaheros argenteus
    reason: Shares the presumed maskaheros crossing group and similar appearance; relationship evidence
      supports a caution without a verified hybrid event.
  - species: Paracheirodon innesi
    reason: "Small and delicate relative to an adult regani pair; territorial pressure is the main concern,\
      \ while fry and fish around 2 cm or smaller also have the decided opportunistic predation risk."
  - species: Parachromis dovii
    reason: A much larger aggressive piscivore creates a serious injury and predation risk; its meat-heavy
      feeding requirements also conflict with regani husbandry.
  - species: Symphysodon aequifasciatus
    reason: Slow feeding and timid behavior are a poor fit with a territorial adult regani pair; preferred
      routine temperature and habitat management also differ.
profile:
  overview:
    text: "An adult Maskaheros regani needs the space and management of a large river cichlid. The species\
      \ is restricted to Mexico's Coatzacoalcos drainage and remains familiar in the trade as Vieja regani.\
      \ Mature males can develop blue-green coloration, red speckling and dark facial and body markings.\
      \ Plan for one compatible pair rather than a permanent adult group. Its plant and biofilm feeding\
      \ supports a vegetable-led diet, with animal foods in smaller amounts. The crossing caution with\
      \ M. argenteus is presumed from their close relationship; a verified hybrid has not been established."
    sources:
    - kind: catalog-of-fishes

  ghDgh:
    value:
      min: 3
      max: 13
    confidence: low
    rationale: "The settled median is 3 to 13 dGH, with low confidence. generator proposed 14 to 16; checker-a\
      \ proposed 5 to 12; checker-b proposed 4 to 4; checker-c proposed 1.5 to 13; tiebreaker-1 proposed\
      \ 1 to 13; tiebreaker-2 proposed 1.5 to 16. Only two of six votes support the leading candidate,\
      \ so all lower and upper endpoints contribute to the median; the lower median is 2.75 rounded to\
      \ 3 and the upper median is 13. INEGI calcium and magnesium give a wider regional span of about\
      \ 0.75 to 18.1 dGH, with selected southern sites at 1.54 to 12.85. Artigas Azas measured 15 to 16\
      \ dGH in an ordinary river habitat containing regani, and the secondary Almoloya account gives 14.\
      \ These harder occupied-site values remain evidence of real habitat variation, not exceptional gypsum\
      \ water. Consequently 3 to 13 is a provisional representative synthesis that does not cover every\
      \ reported habitat. Neither conductivity nor care-sheet hardness is substituted for a natural measurement."

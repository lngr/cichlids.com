  socialBehavior:
    text: "Two adults can form a reproductive pair, but a bond does not remove partner aggression. Conspecific\
      \ level 3 reflects sustained chasing and the need to intervene when a female or rival cannot escape.\
      \ Several juveniles may help a keeper obtain a pair, after which surplus adults need other accommodation.\
      \ Toward other species the decided level is 2, representing territory defense in a suitable aquarium.\
      \ Breeding can increase pressure, and individual behavior varies. The large territory category and\
      \ its occurrence outside spawning are low-confidence inferences; a specialist account describes\
      \ a smaller breeding territory. Watch access to food and shelter instead of assuming that a mild\
      \ reputation guarantees safety."

  khDkh:
    value:
      min: 15
      max: 20
    confidence: high
    rationale: "Keep the tallied natural interval of 15 to 20 dKH without a verification object. Published
      lake alkalinity around 6.5 to 6.9 meq/L converts to about 18.2 to 19.3 dKH, with FAO titrations
      extending lower. This is a regional alkalinity envelope, independent of GH; husbandry estimates
      extending to 25 dKH do not redefine the measured natural interval."

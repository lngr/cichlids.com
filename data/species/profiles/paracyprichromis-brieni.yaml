profile:
  overview:
    text: "A group of Brien's cichlids brings activity to the water just beside Tanganyikan rockwork. These
      slender plankton feeders stay close to cover, and mature males display from sheltered positions
      rather than roaming a large territory. Their quiet temperament makes careful community design
      essential. They belong in an established aquarium with a group of their own kind and enough room to
      escape persistent attention. The species is valid as Paracyprichromis brieni (Poll, 1981); Ubwari
      Peninsula is its type locality. Some populations sold under related trade labels may have a
      different identity, so geographic forms should remain distinguishable."
    sources:
      - *a3
      - *a17
      - *a2
      - *a1
      - *a4
      - *a5
      - *a40
  habitat:
    text: "Rock faces connect this fish's shelter, feeding and reproductive space. Nonterritorial individuals
      take drifting prey near the rocks, while males use vertical faces, ledges, overhangs or cave areas.
      Accounts differ in how strongly they emphasize caves and depth; the specialist locality account
      records occurrences from a few metres down to about 30 to 40 m. Reproduce the sheltered structure
      without filling the swimming space. The regional natural water envelope is 23 to 29 C, pH 8.4 to
      9.4, GH 10 to 13 dGH and KH 15 to 20 dKH, based on published lake measurements. These describe a
      regional habitat rather than one fixed aquarium reading."
    sources:
      - *a17
      - *a2
      - *a7
      - *a13
      - *a6
      - *a3
      - *a14
      - *a15
      - *a16
  sizeAndGrowth:
    text: "Use approximately 10 cm for an adult male and 9 cm for an adult female when planning space. The
      sex-specific estimates are uncertain: FishFish lists 9 and 7 cm, while the specialist account gives
      an unsexed typical adult length around 10 cm. FishBase records an 11 cm total-length maximum, and
      Seriously Fish uses 11 cm standard length. Standard length leaves out the tail and must not be
      compared directly with total length. No reliable growth curve or species-specific longevity record
      was found. The 5 to 8 year lifespan estimate remains provisional."
    sources:
      - *a2
      - *a3
      - *a17
      - *a4
      - *a12
      - *a11
      - *a9
      - *a25
      - *a37
      - *a36
      - *a41
      - *a38
  husbandry:
    text: "Provide at least 250 L with a 120 cm length and 45 cm horizontal depth for the recommended group.
      Tall stones should offer several shaded faces and retreats while leaving clear water above and
      between them. Subdued lighting helps the fish settle and display. Keep filtration effective and
      water changes regular without abrupt chemistry or temperature shifts. The tallied aquarium
      tolerance intervals are 23 to 29 C, pH 7.5 to 9.5, GH 8 to 25 dGH and KH 9 to 20 dKH. These broad
      intervals are planning bounds rather than suggested targets at their extremes; KH in particular is
      inferred with low confidence. Observe feeding and social behavior as well as water readings."
    sources:
      - *a3
      - *a17
      - *a4
      - *a12
      - *a9
      - *a27
      - *a6
      - *a7
      - *a2
      - *a14
      - *a13
      - *a15
      - *a16
  socialBehavior:
    text: "Keep at least eight together, with ten or more a useful option when the aquarium has room. Several
      females per male and multiple sheltered male sites help disperse attention. The group remains
      loose, and males may repeatedly displace one another near spawning positions. This is the basis of
      conspecific aggression level 2. Available accounts do not establish routine aggression toward other
      species, which is rated 0. The small-territory flag is linked to reproduction, although the sources
      do not prove that males entirely abandon site defense at other times."
    sources:
      - *a3
      - *a17
      - *a32
      - *a2
      - *a4
      - *a9
      - *a12
      - *a30
      - *a27
      - *a10
      - *a11
      - *a18
      - *a28
      - *a29
      - *a26
  diet:
    text: "The natural diet centres on zooplankton and small crustaceans. Offer suitably small foods that the
      fish can intercept before they settle, including cyclops, daphnia and brine shrimp alongside
      accepted fine prepared foods. Watch the quieter individuals during meals because active companions
      can monopolize drifting food. The slow feeding classification is an inference from this behavior
      rather than a measured feeding rate. Predation level 0 reflects the plankton-based diet and absence
      of evidence for regular fish consumption; it does not guarantee that every newly released fry will
      be ignored. No species-specific protein-related bloat tendency was established."
    sources:
      - *a2
      - *a3
      - *a17
      - *a4
      - *a9
      - *a12
      - *a27
      - *a10
      - *a5
      - *a26
  breeding:
    text: "Females incubate the brood in their mouths, while males maintain the spawning sites. Spawning
      occurs beside a rock face with the fish oriented head-down. The female releases eggs individually
      and collects them rapidly as the male releases sperm nearby; specialist observations place
      fertilization outside the mouth. Reported clutches commonly contain about 8 to 15 eggs, with
      broader aquarium accounts giving 5 to 25. Incubation lasts roughly three to four weeks. Disturbance
      can interrupt incubation, and a brooding female may stop feeding. Newly released fry can take newly
      hatched brine shrimp and no longer receive extended guarding."
    sources:
      - *a3
      - *a17
      - *a5
      - *a4
      - *a9
      - *a2
      - *a28
  sexing:
    text: "Mature males generally show stronger colour and longer tail-fin extensions, but these distinctions
      become less useful in unsettled fish and juveniles. A distended mouth during incubation identifies
      a brooding female. Body and fin colours vary geographically; the provisional description combines
      brownish body tones, blue reflections, yellowish fins and vertical bars. The usual species-level
      distinction from P. nigripinnis is a slimmer body and proportionally smaller eyes. Kitumba or
      Velifer material has identification complications, so a trade label alone cannot establish sex,
      synonymy or locality identity."
    sources:
      - *a3
      - *a17
      - *a37
      - *a36
      - *a11
      - *a42
      - *a10
      - *a27
  compatibility:
    text: "A dedicated aquarium is a sound option, although suitably calm companions can work. Peaceful
      Xenotilapia use lower sandy areas, while small Julidochromis or carefully selected Altolamprologus
      may occupy separate rock spaces in a sufficiently large setup. Genus-level advice is not proof that
      every member is suitable, and fry need protection from potential predators. Boisterous grazers,
      aggressive cave defenders and competing midwater shoalers can suppress feeding and display. One
      archive account reports brieni living with Tropheus, but this does not establish a generally
      dependable pairing. The shared hybrid group with P. nigripinnis remains presumed: relationship
      studies and a hobby warning support caution, but no verified named cross with known partner choice
      was established."
    sources:
      - *a3
      - *a17
      - *a32
      - *a29
      - *a4
      - *a9
      - *a27
      - *a10
      - *a5
      - *a33
      - *a34
      - *a35
      - *a1
      - *a31
      - *a2
      - *a43
      - *a44
      - *a45
      - *a46
      - *a47
      - *a26
      - *a39
      - *a48
      - *a30
      - *a25
  problems:
    text: "Persistent hiding, fading colour and missed meals should prompt a review of group size, lighting,
      shelter and pressure from tankmates. A fish unable to use the midwater feeding area can decline
      even when food is supplied regularly. Preserve stable, oxygenated conditions and avoid excessive
      heat. An archive account describes fin deterioration and appetite loss after a tank containing
      unspecified Paracyprichromis reached roughly 32 C, but it cannot identify a cause or prove a
      precise temperature limit for brieni. No characteristic disease was established by the sources.
      This fish requires deliberate setup and observation, which is why beginner suitability is rated
      demanding."
    sources:
      - *a3
      - *a17
      - *a2
      - *a30
      - *a37
      - *a29
      - *a39
      - *a9
      - *a12
      - *a27

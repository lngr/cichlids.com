    tolerance:
      value:
        min: 9
        max: 20
      confidence: low
      rationale: "Retain the tallied qualified-majority decision of 9 to 20 dKH with four agreeing votes out of
        six and low confidence. Proposals are 10 to 25 from the generator, 10 to 20 from checker-a, 10 to
        20 from checker-b, 12 to 25 from checker-c, 8 to 20 from tiebreaker-1 and 7 to 20 from
        tiebreaker-2. The agreeing lower bounds of 10, 10, 8 and 7 yield 9 after median aggregation and
        rounding; this is not a measured species threshold. Practical Fishkeeping gives 8 to 18 for
        Tanganyikan cichlids, JBL gives 7 to 20 for Malawi and Tanganyika, and New Life gives 10 to 20.
        The wider Guppys.life recommendation of 12 to 25 and the generator and checker-c ceilings of 25
        remain dissenting evidence; no species-specific long-term outcome establishes that ceiling. A
        Kitumba or Velifer blog gives 4 to 10 but has unresolved taxonomic applicability. A tank account
        reports 15 to 16 after recent introduction, and an archive report gives 12 during heat-related
        illness; neither establishes long-term limits. Seriously Fish and FishBase report GH or pH rather
        than KH, so their numbers cannot be transferred directly. The interval remains an inference from
        group husbandry and buffering practice and contains natural KH of 15 to 20. OATA and
        BreederDirect requests failed; AquaInfo, Tropical Fish Co and the JBL product extractions provide
        no usable numerical KH evidence."
      sources:

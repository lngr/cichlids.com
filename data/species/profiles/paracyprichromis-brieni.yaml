      rationale: "The generator and checker-b propose moderate based on summary difficulty ratings; checker-a
        and checker-c propose demanding based on the detailed husbandry advice. Seriously Fish explicitly
        discourages beginner keeping because the fish needs a sufficiently large group, shaded rock

    value: open-substrate-spawner
    confidence: high
    rationale: All three files agree. Both partners clean a vertical surface, the female lays rows of
      100 to 400 adhesive eggs on it and the pair guards and fans them for about three days; the fry
      then graze a mucus secretion from the parents' skin (Mattos et al. 2016; Livengood et al.
      2009; Crampton 2008; Ribeiro et al. 2025). The Cichlid Room Companion confirms open substrate
      spawning.

  compatibility:
    text: Discus fit only with peaceful fish that tolerate 28 to 30 C and soft water and that do not
      compete hard for food. Small schooling tetras such as cardinal or rummy-nose tetras,
      warm-water Corydoras and calm dwarf cichlids such as rams work well. Large or boisterous
      cichlids, fin nippers and greedy feeders stress discus and leave them hungry. Lake Malawi and
      Tanganyika cichlids need hard, alkaline water and are unsuitable. Other discus species and
      strains belong to the same hybrid group and cross freely, which matters for anyone who wants
      to keep a wild form pure.
    sources:

    tolerance:
      value:
        min: 4.8
        max: 7.5
      confidence: medium
      rationale: Generator, checker-a and checker-b agree unanimously on about 4.8 to 7.5. Seriously Fish
        lists 5.0 to 7.0, Aqueon 6.0 to 7.0 and FishBase 5.0 to 8.0; Ribeiro et al. (2025) cite a
        physiological tolerance of 4.5 to 7.0. Livengood et al. (2009) need pH 5.0 to 6.5 for
        spawning and larvae but grow discus to maturity in neutral buffered water, and trials kept
        adults at 6.8 plus or minus 0.6 and at 7.2 (Mattos et al. 2016; Santos et al. 2022).
        Captive-bred strains adapt to about 7.5 when the value stays stable. The upper end applies
        to aquarium strains; wild-caught fish and breeding pairs belong in the acidic part of the
        range.

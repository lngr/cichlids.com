    - name: Symphysodon discus var. aequifasciata
      note: Original combination of Pellegrin (1904); the ending is corrected to aequifasciatus because
        Symphysodon is masculine.
    - name: Symphysodon aequifasciata
      note: Spelling used until about 2003.
    - name: Symphysodon aequifasciata axelrodi
      note: Schultz (1960), the brown discus; a synonym of S. aequifasciatus in the Catalog of Fishes,
        placed under S. haraldi by Bleher et al. (2007).
  legacyNames:
    - Symphysodon aequifasciatus
  note: "The Catalog of Fishes recognises three valid discus species: S. discus (lower Rio Negro and
    neighbouring black-water rivers), S. tarzoo (western Amazon upstream of the Purus Arch, the
    green discus) and S. aequifasciatus. S. discus and S. tarzoo are separate valid species, not
    synonyms of this one. Symphysodon haraldi, which Bleher et al. (2007) used for the blue and
    brown discus, is listed as a synonym of S. tarzoo following Amado et al. (2011), whose placement
    rests on the disputed type locality; hobby literature that follows Bleher et al. still uses the
    name for fish sold as S. aequifasciatus. This profile follows the Catalog: S. aequifasciatus
    covers the floodplain discus of the central and lower Amazon downstream of the Purus Arch, that
    is the blue phenotype (Purus, Coari, Manacapuru), the brown phenotype (lower Amazon from about
    Manaus to Santarém) and the Xingu and Tocantins group. Amado et al. (2011) restrict the name to
    the brown phenotype and treat the blue and Xingu fish as undescribed units, so a later split
    would narrow this entry. Aquarium strains such as turquoise, pigeon blood and cobalt descend
    from crosses of several wild forms, including the green S. tarzoo, and are not pure S.
    aequifasciatus; the hobby trades them under this name, and the legacy catalog entry includes
    them. Husbandry values apply to wild fish and these strains unless the text says otherwise."

    value: 2
    confidence: medium
    rationale: All three files agree on level 2. Groups of adults form a clear ranking within days;
      dominant fish chase subordinates, which hide behind equipment, and pairs defend their spawning
      site against the rest of the group (Mattos et al. 2016; Ribeiro et al. 2025). Aqueon advises
      removing fish that cannot compete. Injuries stay rare with room and cover, and wild fish live
      peacefully in large aggregations outside breeding (Crampton 2008).

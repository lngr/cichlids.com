    confidence: high
    rationale: The species lives in floodplain lakes, flooded forest and the quiet lower reaches of
      clear- and black-water tributaries of the central and lower Amazon in Brazil, downstream of
      the Purus Arch, not in the main channels. The Catalog of Fishes gives the eastern Amazon
      basin, and Ready et al. (2006) found the barrier to the western S. tarzoo at the Purus Arch.
      The localities are the collecting sites of the brown, blue and Xingu discus in the habitat
      table of Amado et al. (2011) after Bleher et al. (2007), plus the type locality Santarém and
      the lagoons sampled by Vieira et al. (2022). Lago Amanã and the Tefé area lie west of the
      Purus Arch and belong to S. tarzoo. It is not a lake endemic, so no waterbody applies.

    rationale: "Carbonate hardness is not voted. Generator and checker-a propose 0 to 2 dKH, checker-b 0
      to 1 dKH; the proposals agree within 2 dKH, and 0 to 2 dKH covers the measured waters. No
      study measured alkalinity at discus collecting sites, so the value is derived from waters of
      the range: bicarbonate is below detection in a lower Purus floodplain lake and reaches 26 mg/L
      (1.2 dKH with dKH = mg/L HCO3 / 61 x 2.8) in the black-water creeks between Manacapuru and
      Alvarães (Queiroz et al. 2009); Lake Catalão at the meeting of Negro and Solimões holds 0.7 to
      2.4 dKH with the peak at low water (Brito et al. 2014), and its cation sum caps bicarbonate at
      about 2 dKH (Aprile and Darwich 2013). Clear and black water with conductivity below 30 uS/cm
      carry almost no carbonate (Borghezan et al. 2021). The derivation explains the low
      confidence."

        discus at 28 to 30 C (Livengood et al. 2009); breeding and grow-out trials ran at 27 to 29 C
        (Mattos et al. 2016; Santos et al. 2022). Wild fish live for months at lagoon means near 32
        C. Keepers in the archive report trouble below about 27 C, and no husbandry source accepts
        less than 26 C for long-term keeping.

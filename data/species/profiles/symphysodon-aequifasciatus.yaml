  diet:
    value:
      type: omnivore
      bloatSensitive: false
      foods:
        - periphyton and algae
        - detritus
        - fruits, seeds and plant matter
        - aquatic invertebrates
        - terrestrial arthropods
        - frozen bloodworms and brine shrimp
        - discus granules and gel food
    confidence: medium
    rationale: Generator, checker-a and checker-b agree unanimously on omnivore without bloat
      sensitivity. Stomach contents of wild discus are dominated by algal periphyton, fine detritus
      and plant matter with a smaller share of invertebrates, and the long intestine fits a mainly
      plant and detritus diet (Crampton 2008, on western fish now placed in S. tarzoo); Bleher
      reported 44 percent plant matter and 38 percent invertebrates and arthropods at high water for
      the blue and brown forms (cited there). Jesus et al. (2022), Livengood et al. (2009), Ribeiro
      et al. (2025) and the Cichlid Room Companion describe a mixed diet. FishBase and Seriously
      Fish list invertebrates only, which would point to invertivore. Farms feed diets with 44 to 50
      percent protein without bloat problems, so the flag is false.

  sizeAndGrowth:
    text: Adult males usually reach 15 to 16 cm total length and females a little less, about 13 to 14
      cm. Body height nearly equals length, so a discus looks much larger than its length suggests
      and needs tall water. Wild fish reach maturity within about a year in nature. In the aquarium,
      young discus grow quickly with several small meals a day and frequent water changes; stunted
      growth from poor water or too few feedings usually stays permanent. Show strains from
      intensive farms can grow larger than wild fish.

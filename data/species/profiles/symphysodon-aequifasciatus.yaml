  socialBehavior:
    text: Discus are social fish that feel secure only in a group. Within a few days a newly formed
      group sorts itself into a ranking, and dominant fish chase subordinates, especially at feeding
      time. A group of five or more spreads this pressure, and enough cover lets weaker fish
      withdraw. When two fish pair up they leave the group, clean a spawning site and defend it
      against the others, mostly by display and short charges. Towards other species discus are calm
      and rather timid. Fearful fish hide, darken and stop eating, so a quiet room and calm
      tankmates are important.
    sources:
      - kind: literature
        title: Mattos, D. C., Screnci-Ribeiro, R., Cardoso, L. D. and Vidal Junior, M. V. (2016).
          Description of the reproductive behavior of Symphysodon aequifasciatus (Cichlidae) in

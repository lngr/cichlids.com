partners:
  suitable:
    - species: Paracheirodon axelrodi
      reason: Cardinal tetras come from the same soft, acidic Amazon waters, accept 28 to 30 C and are too
        small and quick to bother the discus.
    - species: Hemigrammus bleheri
      reason: Rummy-nose tetras tolerate the high temperature, school in the open and stay out of the way
        of the discus.
    - species: Corydoras sterbai
      reason: One of the few Corydoras that thrives at discus temperatures; it eats leftovers from the
        bottom without competing in mid-water.
      condition: Sand or smooth bottom areas.
    - species: Mikrogeophagus ramirezi
      reason: A calm dwarf cichlid that likes the same warm, soft water and claims only a small bottom
        area.
      condition: Captive-bred stock and enough floor space for its pair territory.
  unsuitable:
    - species: Maylandia zebra
      reason: Mbuna need hard, alkaline water, feed hastily and harass slow, peaceful fish.
    - species: Astronotus ocellatus
      reason: Oscars grow much larger, take all the food and stress or injure discus.
    - species: Symphysodon tarzoo
      reason: Same hybrid group; the forms cross in the tank and mixed offspring lose their origin.
    - species: Symphysodon discus
      reason: Same hybrid group; Heckel and blue or brown discus cross in the tank, and the offspring
        cannot be assigned to either species.
    - species: Gyrinocheilus aymonieri
      reason: Adult algae eaters latch onto the flanks of discus and feed on their mucus coat.
    - species: Puntigrus tetrazona
      reason: Tiger barbs are fast fin nippers that disturb shy discus and take their food.
profile:
  overview:
    text: Symphysodon aequifasciatus is the blue and brown discus of the central and lower Amazon, one
      of three discus species recognised today. The high, round, laterally flattened body and the
      habit of feeding young on skin mucus make it one of the best-known cichlids in the hobby. Most
      fish sold under this name are aquarium strains bred in Asia and Europe from crosses of several
      wild forms, while wild-caught fish arrive from Brazilian collectors. Discus are peaceful group
      fish that need warm, very clean, soft water and calm surroundings. They reward stable
      conditions with long lives and regular spawning, but they forgive neglect poorly, which places
      them among the demanding cichlids.
    sources:
      - kind: catalog-of-fishes
        title: Eschmeyer's Catalog of Fishes, species of the genus Symphysodon (online version of 21 Sep.
          2026)
        url: https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Symphysodon
        accessed: 2026-10-12
      - kind: literature
        title: "Amado, M. V., Farias, I. P. and Hrbek, T. (2011). A molecular perspective on systematics,
          taxonomy and classification of Amazonian discus fishes of the genus Symphysodon.
          International Journal of Evolutionary Biology 2011, 360654 (with supplement 1: pH and
          conductivity of Symphysodon habitats after Bleher et al. 2007)."
        url: https://doi.org/10.4061/2011/360654
        accessed: 2026-10-12
      - kind: literature
        title: "Livengood, E. J., Ohs, C. L. and Chapman, F. A. (2009). Candidate species for Florida
          aquaculture: Discus Symphysodon spp., a profitable but challenging species for Florida
          aquaculture. University of Florida IFAS Extension, EDIS FA166."
        url: https://doi.org/10.32473/edis-fa166-2009
        accessed: 2026-10-12
      - kind: literature
        title: "Crampton, W. G. R. (2008). Ecology and life history of an Amazon floodplain cichlid: the
          discus fish Symphysodon (Perciformes: Cichlidae). Neotropical Ichthyology 6(4), 599-612."
        url: https://doi.org/10.1590/S1679-62252008000400008
        accessed: 2026-10-12
  habitat:
    text: Wild discus live in floodplain lakes, flooded forest and quiet side arms of the Amazon between
      the Purus Arch and the Tocantins, not in the main river channel. The water is warm, about 28
      to 30 C, acidic and extremely poor in minerals, with conductivity mostly below 80 microsiemens
      and pH between about 5.2 and 6.9. During the dry season the fish crowd into the submerged
      crowns of fallen trees along lake shores, sometimes hundreds together. When the river rises by
      many metres they disperse into the flooded forest to feed and breed. Clear, black and mixed
      waters are all used, which explains why measured values vary between localities.
    sources:
      - kind: literature
        title: "Crampton, W. G. R. (2008). Ecology and life history of an Amazon floodplain cichlid: the
          discus fish Symphysodon (Perciformes: Cichlidae). Neotropical Ichthyology 6(4), 599-612."

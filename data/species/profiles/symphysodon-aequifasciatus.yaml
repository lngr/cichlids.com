  ghDgh:
    value:
      min: 0
      max: 2
    confidence: medium
    rationale: Generator, checker-a and checker-b agree unanimously on 0 to 2 dGH. No study measured
      calcium and magnesium at discus collecting sites, but the sites have 6 to 80 uS/cm (Amado et
      al. 2011), which leaves room for very little hardness. Converted with dGH = Ca/7.14 + Mg/4.34,
      a lower Purus floodplain lake holds 0.1 to 0.3 dGH and the black-water creeks between
      Manacapuru and Alvarães up to 1.6 dGH (Queiroz et al. 2009), Lake Catalão 0.4 dGH at rising
      water (Brito et al. 2014) and up to 1.7 dGH in the Solimões-fed season (Aprile and Darwich
      2013); clear and black water stay below 0.6 dGH and white water reaches about 1.5 dGH
      (Borghezan et al. 2021). Only the turbid Solimões main channel, which discus avoid, exceeds 2
      dGH.

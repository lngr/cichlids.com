  hybridGroup:
    value: symphysodon
    confidence: high
    rationale: Generator, checker-a and checker-b agree unanimously on the curated group symphysodon,
      which lists S. aequifasciatus, S. discus and S. tarzoo. The three valid species are close
      relatives (Catalog of Fishes; Ready et al. 2006), the wild forms share haplotypes and show
      admixture (Amado et al. 2011), and natural hybrids between discus species were reported by
      Bleher et al. (2007, summarised by Practical Fishkeeping). Aquarium strains are bred from
      crosses of green, blue and brown wild discus, and farms treat the genus as one breeding stock
      (Livengood et al. 2009).

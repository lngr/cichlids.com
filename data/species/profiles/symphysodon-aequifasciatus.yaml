  sexing:
    text: Discus show no reliable external differences between the sexes. Males often grow larger, with
      a steeper forehead and thicker lips, but these traits overlap widely. Shortly before spawning
      both partners show their breeding tubes, but the only certain proof is a spawning in which one
      fish lays eggs and the other fertilises them. Even apparent pairs can mislead, as two females
      sometimes pair up and lay unfertilised eggs. Buying a group of young fish and letting pairs
      form naturally is more reliable than trying to sex juveniles.
    sources:

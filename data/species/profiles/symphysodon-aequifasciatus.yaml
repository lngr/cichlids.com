  breeding:
    text: Pairs form by free choice within a group, so buy six to eight young fish and let them pair. A
      pair cleans a vertical surface such as a cone, slate, leaf or wood, and the female lays rows
      of 100 to 400 sticky eggs, which the male fertilises. Both parents fan and guard the clutch;
      the larvae hatch after about three days. Once free-swimming, the fry graze a nutritious mucus
      that both parents secrete on their skin, and they feed on it for the first weeks before taking
      newly hatched brine shrimp. Spawning works best in soft, acidic water at about 28 to 30 C.
      Young pairs often eat their first clutches before they succeed.
    sources:
      - kind: literature
        title: Mattos, D. C., Screnci-Ribeiro, R., Cardoso, L. D. and Vidal Junior, M. V. (2016).

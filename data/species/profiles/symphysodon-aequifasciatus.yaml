  problems:
    text: Most problems start with water quality. Too few water changes, high nitrate or unstable
      temperatures lead to dark coloration, hiding, refusal of food and slimy skin. Intestinal
      flagellates are common and show as white, stringy faeces and weight loss. Hole-in-the-head
      lesions appear in stressed fish; their cause is unclear, and a feeding trial found no link to
      a calcium-poor diet. Wild-caught fish often carry gill and skin parasites and need quarantine
      before joining a group. Mixing discus from different sources can spread diseases to which one
      group has no resistance. Keeping discus too cool, below about 26 C, weakens them. Any
      persistent sign of illness should be discussed with a fish veterinarian or an experienced
      keeper.
    sources:
      - kind: literature
        title: "Livengood, E. J., Ohs, C. L. and Chapman, F. A. (2009). Candidate species for Florida

  temperatureC:
    value:
      min: 28
      max: 30
    confidence: low
    rationale: "The five votes did not settle on one range: generator 26 to 32 C, checker-a 28 to 32 C,
      checker-b 26 to 30 C, tiebreaker-1 28 to 32 C and tiebreaker-2 26 to 30 C. The vote count
      therefore takes the conservative value, the intersection of all proposals, 28 to 30 C. It lies
      inside every field series that was read: clear-water lagoons of the Tapajós and Trombetas, one
      of them a discus site, averaged 29.6 to 31.8 C (Vieira et al. 2022), Lago Grande de Curuai, a
      brown discus locality, averaged 28.8 C at high and 30.6 C at low water (Casali et al. 2011),
      and the lower Xingu ranged from 28.3 to 32.5 C (Nascimento et al. 2021). The lower bounds of
      26 C in FishBase, Seriously Fish and the review of Ribeiro et al. (2025) go back to aquarium
      handbooks. Brief cold spells (friagem) cool floodplain lakes to about 24.5 C (Brito et al.
      2014), and shallow pools and afternoon surface water exceed 32 C (Queiroz et al. 2009;
      Livengood et al. 2009); neither represents sustained conditions. No study logged temperature
      at discus collecting sites over a year, hence the low confidence."

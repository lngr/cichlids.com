  ph:
    value:
      min: 5.2
      max: 6.9
    confidence: low
    rationale: "The votes were generator 4.8 to 6.9, checker-a 5.2 to 7.0, checker-b 5.2 to 7.7,
      tiebreaker-1 5.0 to 7.0 and tiebreaker-2 4.5 to 7.0. Three of the five agree within 0.3, one
      short of the qualified majority, so the vote count takes the conservative value, the
      intersection of all proposals: pH 5.2 to 6.9. The field readings at discus collecting sites by
      Bleher et al. (2007), tabulated by Amado et al. (2011), span 5.2 to 6.9 for the brown, blue
      and Xingu discus apart from a single Tapajós reading of 4.8, and nine Tapajós and Trombetas
      lagoons averaged 5.2 to 6.9 (Vieira et al. 2022); a lower Purus floodplain lake read 5.3 to
      6.4 (Queiroz et al. 2009). Values above 7 come from open lake water with algal photosynthesis
      (Casali et al. 2011), from the Xingu main channel in the wet season (Nascimento et al. 2021),
      from a hobby article (Practical Fishkeeping) and from the aquarium range of FishBase, not from
      discus sites. Values below 5 belong to black water that hosts S. discus. The conservative
      method sets the confidence low."
    sources:
      - kind: literature
        title: "Amado, M. V., Farias, I. P. and Hrbek, T. (2011). A molecular perspective on systematics,
          taxonomy and classification of Amazonian discus fishes of the genus Symphysodon.

  husbandry:
    text: "Plan for about 300 litres and 120 cm length for a group of five or six adults, with at least
      45 to 50 cm water depth. Keep the temperature at 28 to 30 C; the fish stay healthy between 26
      and 32 C. Aquarium strains manage neutral water up to about pH 7.5 and hardness up to about 10
      dGH, while wild-caught fish and breeding pairs need soft, acidic water. Water quality matters
      more than exact numbers: change a large part of the water at least weekly and keep nitrate
      low. Strong filtration with gentle flow suits them. Tall roots and plants give cover for these
      shy fish, and many keepers use bare or sandy floors that are easy to clean. Avoid sudden
      changes in temperature or pH."
    sources:
      - kind: database
        title: "Seriously Fish: Symphysodon aequifasciatus (Discus)"

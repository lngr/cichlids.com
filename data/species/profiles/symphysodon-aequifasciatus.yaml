variants:
  - name: Brown discus
    kind: locality
    note: Wild phenotype of the lower Amazon and its clear-water tributaries, for example Alenquer, Lago
      Grande, Santarém and Rio Trombetas; brown body with blue lines mostly on head, back and fins.
  - name: Blue discus
    kind: locality
    note: Wild phenotype of the central Amazon between the Purus Arch and Manaus, for example Rio Purus,
      Coari and Manacapuru; more extensive blue lines than the brown form.
  - name: Xingu discus
    kind: locality
    note: Populations of the Xingu and Tocantins drainages that form a genetic group of their own.
  - name: Royal Blue
    kind: color-morph
    note: Trade grade of wild fish whose blue lines cover the whole body; the most valued wild grade.
  - name: Turquoise
    kind: color-morph
    note: Aquarium strain with dense blue-green lines; bred from mixed wild stock.
  - name: Pigeon Blood
    kind: color-morph
    note: Aquarium strain with a pale orange body and reduced dark pigment; bred from mixed wild stock.

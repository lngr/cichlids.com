  diet:
    text: "In the wild discus graze algae and biofilm, eat fine detritus, fallen fruits and seeds, and
      pick up small insects, larvae and crustaceans. In the aquarium a varied menu works best:
      quality discus granules or gel food as a base, frozen bloodworms, brine shrimp and mysis, and
      some plant-based food. Young fish need several small meals a day, adults two or three. Because
      discus eat slowly and deliberately, fast tankmates can leave them hungry. Remove uneaten food
      promptly, since leftovers spoil the water quickly at these temperatures. Traditional beef
      heart mixes are rich and can pollute the tank if overfed."
    sources:

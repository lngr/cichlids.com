  maxSizeCm:
    value:
      male: 10
      female: 9
    confidence: low
    rationale: "The componentwise proposal medians are 10 cm male and 9 cm female: generator proposed\
      \ 12/10, checker-a 13/10, and checkers b and c 8/8. Retain these as provisional adult aquarium total-length\
      \ estimates. FishBase reports 8 cm standard length for male or unsexed material, which excludes\
      \ the caudal fin and does not establish a female maximum. Aquarist Atlas summarizes about 8-10 cm\
      \ standard length. The median allows for the fin and a modest inferred sex difference, but no measured\
      \ conversion or authenticated captive series confirms either value. Larger dealer figures of 12-17.8\
      \ cm may concern other peacocks and do not identify this taxon."

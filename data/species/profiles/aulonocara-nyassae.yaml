  diet:
    text: "Its documented feeding niche is small invertebrates associated with the substrate. Crustaceans\
      \ and insect larvae support the invertivore classification. A varied captive diet can combine suitably\
      \ sized prepared foods with small frozen or live invertebrates; mixed ingredients do not change\
      \ the natural feeding category. Predation level 0 allows accidental fry capture but does not predict\
      \ routine hunting of small fish. No source establishes the particular dietary bloat sensitivity\
      \ represented by the flag. Normal feeding speed is a provisional estimate, and feeding access still\
      \ needs observation in a community."
    sources:

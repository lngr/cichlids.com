  note: "Catalog of Fishes confirms Aulonocara nyassae Regan 1922 as valid. BMNH 1921.9.6.220 is the lectotype\
    \ designated by Eschmeyer in 1998; two original syntypes were reassigned to Aulonocara guentheri,\
    \ which remains a different species. Commercial blue peacocks, Maleri forms and Aulonocara sp. Nyassae\
    \ Mumbo are not synonyms or variants of this taxon. FishBase retains an older type-only statement,\
    \ while CRC documents a specialist-identified living male at Masasa Reef."

  ghDgh:
    value:
      min: 3
      max: 5
    confidence: high
    rationale: The settled natural range is 3-5 dGH. FAO calcium and magnesium data yield about 3.2-4.9
      dGH; Branchu upper-water measurements yield about 4.2-4.6. The adopted rounded envelope is consistent
      with these measurements. Harder care-sheet recommendations describe aquarium practice and do not
      turn the lake into hard water.

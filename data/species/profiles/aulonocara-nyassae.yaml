  problems:
    text: "Mistaken identity is the main limitation of species-labelled aquarium advice. Other practical\
      \ risks include sustained pressure on a female, competition for food and loss of open sand through\
      \ excessive rockwork. Stable alkaline buffering and clean oxygenated water are central husbandry\
      \ needs. The decided tolerances describe a provisional compatibility envelope, with especially weak\
      \ direct evidence for hardness extremes. No species-specific disease pattern was established. The\
      \ bloatSensitive false decision records an absence of demonstrated special dietary sensitivity and\
      \ does not mean that illness cannot occur."

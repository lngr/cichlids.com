  khDkh:
    value:
      min: 5
      max: 8
    confidence: high
    rationale: "The settled natural range is 5-8 dKH. Alkalinity reported by FAO converts to about 5.6-7.3\
      \ dKH and Branchu profiles to about 6.5-6.9. The rounded envelope expresses bicarbonate buffering,\
      \ which can exceed calcium-magnesium hardness because other cations also balance bicarbonate. Natural\
      \ KH carries no verification object."

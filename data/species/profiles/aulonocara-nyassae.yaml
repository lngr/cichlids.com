    rationale: "The settled lake decision is 21-29 C, covering seasonal variation rather than a single\
      \ aquarium target. FAO summarizes 23-25 C for one field dataset; Vollmer et al. describe summer\
      \ surface water near 28 C and winter water below 24 C, with enhanced seasonal cooling in the southeastern\
      \ arm. The inherited synthesis also incorporates Eccles and later campaigns. The Eccles DOI is blocked\
      \ and its full text is not open access, so its inherited endpoint support could not be rechecked;\
      \ retain the prescribed lake range and distinguish campaign observations in evidence."

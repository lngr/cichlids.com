      title: General cichlid husbandry knowledge
  husbandry:
    text: "Use the provisional minimum of 220 litres with a 120 by 45 cm base for one male and four females.\
      \ Fine sand supports substrate feeding, and separated rock shelters interrupt sight lines and provide\
      \ retreats. Use an established filter and regular water changes to maintain stable chemistry. The\
      \ tallied aquarium envelopes are 21-29 C, pH 7.5-9.0, GH 3-25 dGH and KH 5-15 dKH. The pH and hardness\
      \ extensions rely on congeners and uncertain commercial stock; they are not measured physiological\
      \ thresholds for true nyassae. Keep conditions stable within an appropriate Malawi setup rather\
      \ than treating the whole envelope as a preferred target."

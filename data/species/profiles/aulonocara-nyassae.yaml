      archived: aquaristatlas.com/species/aulonocara-nyassae/2026-10-14T193311Z
  breeding:
    text: "Maternal mouthbrooding is supported by CRC and agrees with the biology of the genus. The female\
      \ retains eggs and developing young before releasing free-swimming fry. Specific spawning-site preparation,\
      \ clutch size and incubation duration have not been verified here for authenticated captive nyassae.\
      \ Temporary male territoriality over a small area is inferred from the available field and congeneric\
      \ accounts. Commercial breeding reports under this label cannot confirm the valid species without\
      \ reliable identification."
    sources:

partners:
  suitable:
  - species: Copadichromis azureus
    reason: A Malawi midwater feeder may leave more sand-foraging space; this is a congeneric husbandry
      inference.
    condition: Use a community aquarium at least 150 cm long and verify each fish has feeding access.
  - species: Placidochromis electra
    reason: A comparatively mild Malawi hap shares the alkaline water context; direct nyassae cohabitation
      is unverified.
    condition: Use a tank at least 150 cm long with open sand and separated retreats.
  - species: Labidochromis caeruleus
    reason: "Some peacock guidance allows this comparatively mild mbuna, although it can compete for food."
    condition: Use a spacious community aquarium with visual barriers and monitor aggression and feeding.
  unsuitable:
  - species: Aulonocara stuartgranti
    reason: Shares the presumed aulonocara crossing group and may also resemble a male rival.
  - species: Sciaenochromis fryeri
    reason: Shares a presumed crossing group based on reports with unnamed peacock females; larger individuals
      also pose a predation concern.
  - species: Maylandia lombardoi
    reason: Its forceful territorial behavior makes feeding and retreat difficult for a relatively mild
      sand-foraging peacock.
profile:
  overview:
    text: Aulonocara nyassae is a small sand-associated peacock endemic to Lake Malawi. Its valid scientific
      name is frequently confused with commercial blue peacocks and named forms of other Aulonocara. Those
      trade fish cannot establish the appearance or adult dimensions of this species. CRC documents a
      field-identified male from Masasa Reef but reports no established aquarium maintenance. The profile
      therefore combines better-supported natural-history facts with explicitly provisional aquarium estimates.

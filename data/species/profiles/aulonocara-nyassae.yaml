  socialBehavior:
    text: "The curated natural-history account describes a mating system with multiple partners. For an\
      \ aquarium the inferred arrangement is one male with four females, based primarily on congener husbandry.\
      \ Expect hierarchy and repeated chasing, especially during courtship, and provide retreats for subordinate\
      \ fish. Conspecific aggression is provisionally level 2 in that suitable social unit. No authenticated\
      \ aquarium series demonstrates routine injuries under those conditions. Crowding or an isolated\
      \ female can increase pressure beyond the behavior represented by the rating."
    sources:
    - kind: database
      title: "Cichlid Room Companion: Aulonocara nyassae"

      accessed: '2026-10-13'
      archived: aquaristatlas.com/species/aulonocara-nyassae/2026-10-14T193311Z
  compatibility:
    text: "The tally does not require conspecific-only housing. Calm Malawi tankmates can be considered\
      \ if their size, feeding access and space needs fit a larger community aquarium. Local display toward\
      \ other species is provisionally level 1; similar-looking peacock males can provoke greater competition.\
      \ The aulonocara and sciaenochromis-fryeri-aulonocara groups carry presumed crossing cautions based\
      \ on genus-level warnings and reports involving unnamed peacock females. The experimental baenschi\
      \ and Tramitichromis pairing does not extend to nyassae. Aggressive mbuna and large fish predators\
      \ remain poor candidates."
    sources:

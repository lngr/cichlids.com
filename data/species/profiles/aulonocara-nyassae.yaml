  habitat:
    text: "The strongest agreement concerns Lake Malawi and a sand-based feeding habitat with nearby rocks.\
      \ Southeastern records include Mazinzi Bay and the Boadzulu Island area; CRC independently documents\
      \ Masasa Reef. FishBase still describes a type-only record history, so the locality accounts differ\
      \ in age and detail. Provide open fine sand and scattered stable rock that leaves escape routes.\
      \ The prescribed natural lake envelope is 21-29 C, pH 7.7-8.6, GH 3-5 dGH and KH 5-8 dKH. Limnological\
      \ studies distinguish the relatively soft calcium-magnesium chemistry from its alkaline bicarbonate\
      \ buffering."
    sources:

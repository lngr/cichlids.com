      accessed: '2026-10-13'
      archived: aquaristatlas.com/species/aulonocara-nyassae/2026-10-14T193311Z
  sexing:
    text: "A displaying adult male is associated with blue coloration and vertical barring. Females and\
      \ males outside displaying condition are described as paler and less conspicuous. Sex differences\
      \ in aquarium size remain inferred, and a plain juvenile cannot reliably be assigned a sex from\
      \ color alone. Blue coloration also appears in many other peacocks, so appearance by itself cannot\
      \ confirm nyassae identity. Locality and credible identification records matter more than a broad\
      \ trade label."
    sources:

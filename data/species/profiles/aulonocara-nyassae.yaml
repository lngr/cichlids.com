  sizeAndGrowth:
    text: "The working adult estimates are 10 cm for males and 9 cm for females. These are proposal medians\
      \ and remain uncertain total-length estimates. FishBase reports 8 cm standard length for male or\
      \ unsexed material; that measurement omits the tail and does not establish female size. A hobby\
      \ account summarizes a larger standard-length estimate, while dealer sizes may describe other peacocks.\
      \ Neither an exact length conversion nor a verified captive growth series is available. The provisional\
      \ 5-8 year lifespan comes from a care-sheet estimate rather than tracked individuals."
    sources:

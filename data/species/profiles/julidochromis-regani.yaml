      \ the inaccessible AquaSage 8 to 20 claim remains unverified. Kipili-labelled evidence may concern marksmithi,\
      \ and the AquaInfo and Aquarium Lutter snapshots contain no species-specific KH information. The median reflects\
      \ conflicting recommendations, not a measured physiological interval."

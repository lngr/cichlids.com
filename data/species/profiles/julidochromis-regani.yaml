partners:
  suitable:
  - species: "Altolamprologus calvus"
    reason: "Distinct appearance and feeding behavior can allow coexistence when cave sites are separated."
    condition: "Use a tank with enough room for both species social units and clearly separate rocky territories;\
      \ the pair-only minimum is not a community allowance."
  - species: "Cyprichromis leptosoma"
    reason: "Its open-water activity reduces direct overlap with the rock and sand territory."
    condition: "Meet the shoal space requirement and keep open swimming water above the caves."
  - species: "Neolamprologus leleupi"
    reason: "A similarly sized Tanganyika species can coexist where each social unit has its own defended area."
    condition: "Provide a larger community footprint with separate rock piles and watch territorial interactions."
  unsuitable:
  - species: "Julidochromis marlieri"
    reason: "Shares both a presumed traditional-julie crossing group and the documented pair group based on reported\
      \ putative wild hybrids; cave territories also overlap."
  - species: "Maylandia zebra"
    reason: "An active territorial mbuna creates behavioral and feeding-competition concerns for a cave-centered\
      \ Tanganyika pair; this is not a claim that their aquarium tolerance ranges never overlap."
  - species: "Paracheirodon innesi"
    reason: "Typical soft-water husbandry is mismatched to the julie alkaline aquarium setting, and very small individuals\
      \ or fry may be swallowed opportunistically."
profile:
  overview:
    text: "Regan's julie spends much of its day close to a crevice, where its dark bands break up the outline of\
      \ a long yellow or beige body. A compatible pair can produce several overlapping broods and makes an engaging\
      \ aquarium subject. The planning figures here are approximately 11.5 cm for males and 14.5 cm for females,\
      \ with one bonded pair as the usual adult unit. Unfamiliar adults can fight severely, so two fish of opposite\
      \ sexes are not automatically a suitable pair. Common trade names include convict julie and striped julie.\
      \ Historical fish sold as regani Kipili now belong to the separately described J. marksmithi."
    sources:
    - *id003
    - *id002
    - kind: "literature"
      title: "Orozco Castillo, Catálogo de Peces Continentales, Universidad Latina de Costa Rica"
      url: "https://www.incopesca.go.cr/acuicultura/catalogos/catalogo_peces_continentales.pdf"
      accessed: "2026-10-13"
      archived: "incopesca.go.cr/acuicultura/catalogos/catalogo_peces_continentales.pdf/2026-10-14T194000Z"
    - *id007
    - *id012
    - *id001
    - *id014
  habitat:
    text: "This Lake Tanganyika endemic uses the interface between rock shelter and sandy shallows. Natural-history\
      \ and trade records cover the lake's four riparian countries, although specialists disagree about the identity\
      \ of some southern regani-like populations. Nyanza-Lac in Burundi is the type locality. The tank should provide\
      \ securely supported cave rockwork and adjacent sand, with visual breaks between territories. Natural lake\
      \ values are 23 to 29 C, pH 8.4 to 9.4, GH 10 to 13 dGH and KH 15 to 20 dKH. These lake measurements describe\
      \ the natural setting; broader aquarium tolerances are listed separately."
    sources:
    - *id002
    - *id008
    - *id001
    - *id005
    - *id030
    - *id010
    - *id020
    - *id009
    - *id019
  sizeAndGrowth:
    text: "Use approximate adult maxima of 11.5 cm male and 14.5 cm female for aquarium planning, while allowing\
      \ for locality and individual variation. Those figures are the medians of the independent profile proposals,\
      \ checked against the 13 cm unsexed FishBase and Fishkeeper figures and the roughly 15 cm aquarium ceiling\
      \ described by Seriously Fish. Females usually become larger. Experimental standard-length measurements cannot\
      \ be treated as total lengths without a verified conversion, and the old 30 cm record does not describe a\
      \ typical aquarium adult. Lifespan is provisionally estimated at 5 to 9 years, with no strong measured upper\
      \ bound."
    sources:
    - *id002
    - *id003
    - *id007
    - *id014
    - *id030
    - *id016
    - *id027
    - *id033
    - *id028
  husbandry:
    text: "The selected minimum for one bonded pair is 108 L with a 120 by 30 cm footprint. Rock caves and clear\
      \ territory boundaries matter, and the pair-only minimum is not a ready-made allowance for additional territorial\
      \ fish. Maintain clean, oxygenated alkaline water with consistent filtration and regular partial changes.\
      \ Aquarium tolerances are 23 to 29 C, pH 7.5 to 9.4, GH 10 to 25 dGH and KH 13 to 23 dKH; use stable conditions\
      \ within these envelopes rather than treating endpoints as targets. KH is the least certain range and is a\
      \ median of conflicting recommendations. Matching replacement water carefully reduces sudden chemical or temperature\
      \ changes."
    sources:
    - *id003
    - *id008
    - *id014
    - *id011
    - *id027
    - *id028
    - *id020
  socialBehavior:
    text: "A naturally formed adult pair is the recommended aquarium unit. A juvenile group may provide an opportunity\
      \ for partners to choose one another, but surplus fish need another home once the pair begins excluding them.\
      \ Persistent harassment can be serious, including between two adults introduced as prospective mates. The\
      \ usual aggression rating assumes a compatible pair in a properly arranged tank; it does not make arbitrary\
      \ adult introductions safe. CRC describes polyandrous mating, and research also records helpers and flexible\
      \ mating systems. These observations explain family-group behavior without supporting unrestricted groups\
      \ of unrelated adults in ordinary aquaria."
    sources:
    - *id003
    - *id004
    - *id016
    - *id017
    - *id037
    - *id018
    - *id038
  diet:
    text: "Offer small animal foods such as crustaceans and insect larvae, alongside suitable prepared foods and\
      \ some vegetable material. Natural feeding records chiefly describe invertebrates taken from the surface community\
      \ on rocks or nearby sand. Several accounts also report algae ingestion, and a visual-system paper gives a\
      \ conflicting plant-feeding classification, so the dietary category remains moderately certain. The practical\
      \ recommendation is a varied diet with a substantial animal component. There is no established special requirement\
      \ for a plant-only, low-protein diet. The false bloat-sensitivity flag does not imply protection from digestive\
      \ disease or poor husbandry."
    sources:
    - *id008
    - *id003
    - *id034
    - *id023
    - *id017
    - *id014
    - *id037
    - *id039
    - *id030
  breeding:
    text: "Eggs are deposited inside a cave or narrow rock gap, often on a sheltered wall or ceiling. Female care\
      \ and defense of the surrounding site can make spawning difficult to notice until young fish emerge. Both\
      \ adults can contribute to protection, and older offspring may remain while another brood appears. Accounts\
      \ differ substantially over clutch size and the extent of direct fry care, so an exact clutch count is not\
      \ a dependable species constant. As juveniles grow, the parents can exclude them and the available shelter\
      \ becomes limiting. Pair formation should be managed through compatibility rather than forcing unfamiliar\
      \ adults together."
    sources:
    - *id003
    - *id008
    - *id007
    - *id014
    - *id016
    - *id017
    - *id037
  sexing:
    text: "Mature females are generally larger, but size is only a clue and neither coloration nor a quick glance\
      \ reliably sexes juveniles. Seriously Fish and several husbandry accounts describe differences in the genital\
      \ papilla, which require close examination by an experienced keeper. Some lower-trust accounts reverse details\
      \ or even the size difference, so identification should not depend on a single illustration or statement.\
      \ Establishing sex also does not establish a pair bond. Allowing suitable juveniles to select partners can\
      \ help, provided there is space and a plan for the fish that are excluded."
    sources:
    - *id003
    - *id008
    - *id014
    - *id016
    - *id018
    - *id007
  compatibility:
    text: "A pair can share a sufficiently spacious Tanganyika community with fish that use different areas or have\
      \ distinct, well-separated cave territories. Cyprichromis can reduce habitat overlap by using open water,\
      \ while Altolamprologus and some Neolamprologus combinations depend strongly on layout and the other species'\
      \ needs. The selected predation level reflects an occasional risk to unrelated fry and very small fish, not\
      \ routine fish hunting. Other Julidochromis species and locality stocks carry crossing concerns. The broader\
      \ traditional-julie group is presumed, while the regani and marlieri pair group rests on a published report\
      \ of putative wild intermediates whose parentage was not genetically verified."
    sources:
    - *id003
    - *id052
    - *id046
    - *id017
    - *id014
    - *id032
    - *id037
  problems:
    text: "Social incompatibility is a major cause of losses: an adult may be repeatedly chased, denied shelter\
      \ or injured before a pair forms. Watch newly combined fish closely and provide an immediate separation option\
      \ when attacks persist. Growing offspring may also outstay the parents' tolerance. Poor water quality and\
      \ abrupt changes add stress; preserve consistent temperature, mineral content and maintenance. Feeding competition\
      \ has not been measured for this species, so check that both adults receive food. The moderate beginner rating\
      \ reflects these social and maintenance demands, while KH endpoints, lifespan and competitive feeding speed\
      \ remain weakly established."
    sources:
    - *id003
    - *id008
    - *id046
    - *id014
    - *id016

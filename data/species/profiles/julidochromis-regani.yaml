      rationale: "The tally retains 23 to 29 C by unanimous agreement within the 1 C threshold: generator, checker-b\
        \ and checker-c propose 23 to 29, and checker-a proposes 22 to 29. The agreeing lower endpoints have median\
        \ 23. Seriously Fish recommends 23 to 27; AquariumDomain and Aquarismo Paulista give 24 to 28, DRTA and\
        \ TropicalFreshwaterFish give 22 to 25, and the Nordic association gives 24 to 27.5. The wider 22 to 29\
        \ proposal and cooler source advice remain in evidence. The decided range includes the complete natural\
        \ lake envelope, while sustained aquarium use of the 29 C endpoint has less direct support; the endpoints\
        \ are limits rather than targets."

    rationale: "The generator proposes 4 and all three checkers propose 3. Level 3 is retained for the recommended\
      \ bonded pair in a suitable tank, rather than treating forced adult pairing as the normal social unit. Seriously\
      \ Fish reports potentially fatal harassment of an incompatible adult, and the Nordic association reports loss\
      \ of surplus conspecifics; those risks require careful pairing and removal of rivals. Ito's thesis documents\
      \ persistent female contests among unfamiliar same-sex fish. These observations support severe conflict under\
      \ the wrong ratio or pairing without showing that a compatible pair routinely needs separation, as level 4\
      \ would imply."

    rationale: "The natural value remains the settled lake decision of 23 to 29 C, verified by waterbody. Verburg\
      \ and colleagues measured hourly 1 m water temperatures of 23.85 to 29.01 C at Mpulungu, with southern seasonal\
      \ cooling and warmer surface periods explaining the rounded lake envelope. FishBase retains a narrower 22\
      \ to 25 C species entry; that older species summary does not replace the prescribed lake synthesis."

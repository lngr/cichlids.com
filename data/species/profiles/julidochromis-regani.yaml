    rationale: "There is no qualified majority, so the tally retains a low-confidence median of 13 to 23 dKH, with\
      \ top agreement 2 of 6. All proposals are generator 15 to 25, checker-a 10 to 20, checker-b 15 to 20, checker-c\
      \ 15 to 20, tiebreaker-1 10 to 25 and tiebreaker-2 10 to 25. The six lower endpoints have median 12.5 and\
      \ the upper endpoints median 22.5; the tally rounds each to an integer, giving 13 and 23. The decided interval\

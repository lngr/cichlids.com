    confidence: "high"
    rationale: "The natural value remains the settled lake decision of 8.4 to 9.4, verified by waterbody. Plisnier\
      \ and colleagues report 8.47 to 9.40 at 40 m over an annual cycle, and Cohen and colleagues report surface\
      \ values spanning 8.8 to 9.2. FishBase gives 8.5 to 9.2. The historical FAO compilation lists 7.3 to 7.8,\
      \ which conflicts with these modern observations and the lake alkalinity; its claim is retained as dissenting\
      \ evidence, without replacing the measured modern range."

      20 to 25 cm, and 30 cm figures from a wholesaler, Fishipedia and AquariumDomain are
      exceptional. Well-kept males typically reach about 25 cm. No source gives a size per sex;
      females are set at 22 cm after the usual size difference in the genus, as proposed by

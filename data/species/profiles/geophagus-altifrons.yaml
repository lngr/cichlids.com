  habitatZones:
    value: [sand, wood]
    confidence: high
    rationale: >-
      The species lives on gently sloping banks of rivers, islands and floodplain lakes over sand,
      fine gravel and mud, often near sunken roots and branches, and it was caught in river-margin
      and floodplain habitats of black and clear water. Fine sand is essential for feeding and wood
      gives cover and spawning surfaces. Checker-b added rock; scattered rocks occur at some sites

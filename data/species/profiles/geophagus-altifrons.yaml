  aggressionConspecific:
    value: 2
    confidence: medium
    rationale: >-
      Outside breeding the fish live in loose groups with a visible ranking, and in too small a
      group the dominant fish keep harassing the weakest. Breeding pairs defend the spawning site and
      later a growing area around the fry, and some males drive the female off after spawning.
      Injuries are not reported for groups of adequate size in a large tank, which is level 2.
      Checker-b proposed level 1 and a keeping account describes the group as generally peaceful,
      but the documented hierarchy with regular chasing fits level 2 better.

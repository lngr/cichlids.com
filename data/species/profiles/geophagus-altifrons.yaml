partners:
  suitable:
    - species: Pterophyllum scalare
      reason: Peaceful mid-water cichlid of similar soft, warm Amazon water that does not compete for the sand.
      condition: Adult angelfish only; broods of either species are at risk.
    - species: Mesonauta festivus
      reason: Calm South American cichlid of similar water that stays near the surface and among wood.
    - species: Moenkhausia oligolepis
      reason: Robust Amazonian tetra of about 10 cm, far too large to be eaten, that occupies the upper water.
    - species: Uaru amphiacanthoides
      reason: Large, peaceful cichlid with the same water needs that uses other zones of the tank.
      condition: Tank of at least 200 cm length.
  unsuitable:
    - species: Geophagus neambi
      reason: Look-alike member of the G. surinamensis group; similar species treat each other as rivals, and the trade confuses them.
    - species: Amphilophus citrinellus
      reason: Aggressive, territorial bottom-dweller that harasses the peaceful eartheaters and needs harder water.
    - species: Lake Malawi mbuna
      reason: Need hard, alkaline water and are far too aggressive.
    - species: Neocaridina davidi
      reason: Dwarf shrimp are eaten while the fish sift the substrate.
    - species: Potamotrygon motoro
      reason: Often kept together with success, but some keepers lost eartheaters to stingrays at night.
      condition: Only in very large tanks with experienced care.
profile:
  overview:
    text: >-
      Geophagus altifrons is a large eartheater from the clear and black water tributaries of the
      middle and lower Amazon in Brazil. Adults are deep-bodied with a high forehead, a silver to
      golden body and blue shimmering lines on the head and fins. Unlike most relatives they show no
      vertical bars and only a tiny or no dark spot on the flank. The species is peaceful and
      social, lives in groups and spends the day chewing through sand for food. Many fish sold under
      this name or as G. surinamensis belong to other species of the same group, so stock of known
      origin is worth seeking out. Given a very large tank, fine sand and clean, soft, warm water,
      it makes a calm centrepiece for a South American community.
    sources:
      - *sf
      - *cof
      - *salve
  habitat:
    text: >-
      The species occurs in the Amazon near Manaus and in large tributaries such as the Negro,
      Tapajós, Xingu, Trombetas and Jari, usually below the first rapids and in floodplain lakes. It
      favours clear and black water over turbid white water and lives on gently sloping shores of
      sand, fine gravel or mud, often near sunken branches and roots. The water carries very few
      minerals, with conductivity mostly below 40 µS/cm, a pH of about 4.8 to 7 and temperatures of
      roughly 27 to 32 °C. Calcium and carbonate are nearly absent, so hardness stays below 1 dGH and
      1 dKH. Water levels swing strongly between flood and dry season, and in the middle Xingu the
      species was caught in every season.
    sources:
      - *sf
      - *rocha
      - *rios14
      - *ichthyo
      - *rodrigues
      - *bogota
      - &waterfalls
        kind: literature
        title: "Effect of waterfalls and the flood pulse on the structure of fish assemblages of the middle Xingu River in the eastern Amazon basin. Brazilian Journal of Biology (2015)"
        url: https://doi.org/10.1590/1519-6984.00214bm
        archived: doi.org/10.1590_1519-6984.00214bm/2026-10-13T113651Z
        accessed: 2026-10-13
  sizeAndGrowth:
    text: >-
      Scientific sources give up to 22.5 cm standard length, about 27 cm total length; FishBase
      lists 26.5 cm. Well-kept aquarium males usually reach about 25 cm and females stay a little
      smaller, around 22 cm. Wild fish from the Rio Jari averaged about 17 cm, and in the middle
      Xingu fish matured at about 10 cm. Young fish grow quickly when fed small portions several
      times a day, so a group bought at 5 to 8 cm needs its final tank within the first year. Poor
      growth usually points to too little space or poor water.
    sources:
      - *fishbase
      - *salve
      - *sf
      - *sedentary
      - *brito
  husbandry:
    text: >-
      A group needs a tank with a base of at least 180 by 60 cm, about 650 litres. The key item is a
      wide area of soft, fine sand, since the fish feed by taking mouthfuls of substrate; coarse
      gravel hinders feeding and can injure the gills. Driftwood, roots and a few smooth flat stones
      complete the layout, and subdued light suits the fish. Rooted plants get dug up, so epiphytes
      on wood work better. Filtration should be strong with a gentle current, and mechanical stages
      need to catch stirred-up sand. Changing half the water or more each week keeps nitrate low.
      Aim for 26 to 30 °C, soft water and pH 5.5 to 7; captive-bred fish also live well in neutral,
      medium-hard water up to about 8 dGH.
    sources:
      - *sf
      - *fishkeeper
      - *glaser
      - *aquainfo
  socialBehavior:
    text: >-
      Geophagus altifrons is a group fish. Juveniles stay close together and adults form loose
      shoals with a clear ranking. Keep at least five, better six to eight; with fewer fish the
      dominant ones keep chasing the weakest and the group often stays shy. Pairs form on their own
      within the group. A breeding pair defends its spawning place and later the fry, and some males
      chase the female away after spawning. Towards other fish the species is calm and rarely does
      more than display, except close to its brood. Peaceful fish in the upper water help a nervous
      group settle.
    sources:
      - *sf
      - *fishkeeper
      - *aquainfo
  diet:
    text: >-
      In the wild the species is an omnivore that sifts the bottom for insect larvae, small
      crustaceans and other invertebrates and also takes algae, plant parts, fruits, seeds and
      detritus; the mix changes with the season and between localities. Fish are recorded only as
      an occasional item, but fry and very small fish in the tank can be eaten. Even adults handle
      large chunks poorly, so the aquarium diet should consist of fine sinking granules and pellets,
      small frozen foods such as bloodworm, mosquito larvae, Artemia and Mysis, and some plant-based
      food such as gel food with vegetables. Coarse or hard-shelled frozen food can cause digestive
      trouble. Several small meals a day suit the constant foraging better than one large feed.
    sources:
      - *brito
      - *sf
      - *fishkeeper
      - *costa
      - *glaser
  breeding:
    text: >-
      The species lays its eggs on a hard surface and then broods them in the mouth. Fish mature at
      about a year, and good food plus large water changes are usually enough to trigger spawning.
      The pair cleans a flat stone, wood or a spot on the bottom, the female lays rows of eggs and
      the male fertilises them over several hours, up to about 200 eggs in all. Usually the female
      takes up the eggs, sometimes both parents do. At 25 to 28 °C the fry swim free after 8 to 11
      days. Both parents then guard them, often handing the brood over, and take them back into the
      mouth when danger threatens and later only at night. The fry accept Artemia nauplii and fine
      powdered food straight away. In a community tank other fish eat fry that leave the parents.
    sources:
      - *sf
      - *fishkeeper
      - *fishbase
      - *aquainfo
  sexing:
    text: >-
      The sexes look alike. Neither care sheets nor breeders describe a dependable outer difference
      in colour, fins or body shape, and size within a group says little about sex. The only clear
      sign is the female's egg tube, visible shortly before and during spawning. Sexing fish in a
      sales tank is therefore guesswork, and putting together single fish as a pair often fails. A
      group of six or more young fish that grows up together and pairs off on its own is the
      reliable route, though this can take a year or longer.
    sources:
      - *sf
      - *fishkeeper
  compatibility:
    text: >-
      Good tankmates are peaceful fish that like the same soft, warm water and are too large to be
      swallowed: angelfish, festivum, uaru, robust tetras of 6 cm or more, larger peaceful catfish
      and calm characins in the upper water. Fry, dwarf shrimp and very small fish may be eaten.
      Aggressive or territorial bottom-dwellers such as large Central American cichlids do not fit,
      and neither do fish that need hard, alkaline water such as Lake Malawi cichlids. Look-alike
      relatives of the G. surinamensis group, such as G. neambi, G. sveni or G. proximus, tend to
      treat each other as rivals, and the trade often confuses them. Freshwater stingrays often work,
      but some keepers report eartheaters vanishing at night in such tanks.
    sources:
      - *sf
      - *fishkeeper
      - *aquainfo
  problems:
    text: >-
      The most frequent mistake is a tank that is too small or too new. These fish react badly to
      rising nitrate and to sudden shifts in water chemistry and should never go into an aquarium
      that has not matured. Neglect shows as head and lateral line erosion, frayed fins and poor
      growth. Gravel or sharp substrate prevents normal feeding and can harm the gills, and large or
      hard-shelled food can upset digestion. A group of only two or three fish leads to constant
      chasing and stress. Wild imports often carry gill flukes and gut worms, so quarantine is wise.
      Rooted plants and loose decor get dug up, and sand drawn into filters wears out impellers.
    sources:
      - *sf
      - *glaser
      - *brito

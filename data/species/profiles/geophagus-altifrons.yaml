  diet:
    value:
      type: omnivore
      bloatSensitive: false
      foods:
        - fine sinking granules and pellets
        - frozen bloodworm, mosquito larvae, Artemia and Mysis
        - plant-based flakes or Spirulina foods
        - gel food with vegetables
    confidence: medium
    verification:
      method: unanimous
      votes: {agree: 4, total: 4}
    rationale: >-
      Decided unanimously (4 of 4 votes) as omnivore without bloat sensitivity. Wild fish sift
      mouthfuls of sand and eat small aquatic and terrestrial invertebrates, crustaceans, algae,
      detritus, plant parts, fruits and seeds, with the mix changing between flood and dry season.
      Seriously Fish found invertebrates, seeds and detritus in wild stomachs, related species of
      the same group combine benthic invertebrates with much detritus, and the Balbina study even
      found plant-dominated diets, so the menu depends on the locality. FishBase estimates a trophic
      level of 2.2. No source reports bloat; a wholesaler warns that coarse, hard-shelled frozen food
      can upset digestion, which is a matter of food size rather than protein.

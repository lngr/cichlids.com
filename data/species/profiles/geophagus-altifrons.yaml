  temperatureC:
    value: {min: 27, max: 32}
    confidence: medium
    verification:
      method: qualified-majority
      votes: {agree: 4, total: 6}
    rationale: >-
      Decided by qualified majority (4 of 6 votes). The agreeing votes proposed 27 to 31 C
      (generator), 26 to 32 C (checker-a), 27 to 32 C (tiebreaker-1) and 26 to 32 C (tiebreaker-2);
      the median of their bounds gives 27 to 32 C. Checker-b proposed 25 to 30 C and checker-c a
      measured warm-season envelope of 28.3 to 31.2 C. No study gives temperatures taken at the
      capture sites of the species, so the range rests on the rivers it lives in. Two hydrological
      cycles of monitoring in the Xingu main channel gave a mean of about 29.6 C with nearly all
      readings between 27 and 32 C. Clearwater lagoons of the Tapajós and Trombetas held 29.6 to
      31.8 C at high water, the middle Xingu near Belo Monte 29.2 to 32.7 C, and an annual mean on
      the middle Xingu was 28.6 C. The sources span a wider range than the decision: single Xingu
      readings reach from 26 to 33 C, a floodplain lake near the Rio Negro mouth cooled to 24.5 C
      during a short cold spell, and one Xingu paper quotes 25 to 27 C from a climate classification
      rather than water measurements. These extremes are left out as atypical. Care-sheet figures
      are used for the tolerance only.

  synonyms: []
  legacyNames:
    - Geophagus altifrons
  note: >-
    The Catalog of Fishes lists Geophagus altifrons Heckel 1840 (type locality Manaus, Brazil) as
    valid and names no junior synonym. Gosse (1976) had placed it in the synonymy of
    G. surinamensis; Kullander (2003) and later authors treat it as a species of its own. The trade
    often sells G. neambi, G. sveni or other fish of the G. surinamensis group under this name, and
    Tocantins fish once offered as G. sp. aff. altifrons are G. neambi, so a fish labelled
    G. altifrons is not always this species. Older records outside the middle and lower Amazon
    tributaries need the same care. The Cichlid Room Companion uses the same valid name and author.
names:
  trade:
    en:
      - Altifrons eartheater
      - High-front eartheater
variants:
  - name: "Tapajós"
    kind: locality
    note: Wild imports from the Rio Tapajós drainage, traded as G. altifrons 'Tapajós', often with strong head and fin colour.
  - name: "Xingu"
    kind: locality
    note: Population of the middle and lower Rio Xingu, where the species is common along sandy river margins.
features:
  origin:
    value:
      continent: South America
      region: Amazon basin (middle and lower Amazon and its clear- and blackwater tributaries)
      waterbody: null
      localities:
        - Rio Negro near Manaus (type locality), Anavilhanas and Jaú
        - Rio Uatumã and Rio Abacate
        - Rio Trombetas
        - Rio Tapajós and Rio Arapiuns
        - Rio Curuá-Una
        - Rio Xingu
        - Rio Paru and Rio Jari
        - Rio Madeira
        - Rio Purus
        - lower Rio Tocantins
    confidence: high
    rationale: >-
      All four runs agree on the Amazon basin. The Catalog of Fishes gives the Amazon basin of
      Brazil and Ecuador and notes an introduced population in Singapore. The Brazilian national
      assessment (SALVE) names the Negro, Amazonas, Trombetas, Tapajós, Xingu, Oiapoque and lower
      Tocantins drainages and treats records from the middle and upper Tocantins as unconfirmed.
      Seriously Fish adds the Paru, Madeira and Purus and assigns the Tocantins trade fish to
      G. neambi. Field studies confirm the species in the Rio Jari, in the Arapiuns and Tapajós near
      Santarém and in the Balbina area of the Uatumã. As a river species it has no entry in the
      waterbody table.

  ghDgh:
    value: {min: 0, max: 1}
    confidence: medium
    verification:
      method: unanimous
      votes: {agree: 4, total: 4}
    rationale: >-
      Decided unanimously (4 of 4 votes within the agreement threshold): 0 to 1 dGH (generator and
      checker-a), 0.3 to 2 dGH (checker-b, estimated from conductivity) and 0.1 to 0.5 dGH (checker-c,
      calculated from measured ions). The waters of the range hold almost no calcium and magnesium.
      Ion means convert to about 0.13 dGH in the lower Tapajós, 0.15 dGH in the Rio Negro, 0.02 dGH in
      colourless forest streams and 0.4 to 0.5 dGH at Xingu main-channel stations, with single Xingu
      maxima near 1.4 dGH. Conductivity below about 40 µS/cm in the Tapajós and Xingu points the same
      way. Whitewater floodplain lakes, which the species also enters, can be slightly harder.
    sources:
      - *rios14
      - *rocha
      - *hydro
      - *rodrigues
      - &rios20
        kind: literature
        title: "Ríos-Villamizar, Adeney, Piedade and Junk (2020): Physicochemical features of Amazonian water typologies for water resources management. IOP Conference Series: Earth and Environmental Science 427, 012003."
        url: https://doi.org/10.1088/1755-1315/427/1/012003
        archived: doi.org/10.1088_1755-1315_427_1_012003/2026-10-13T004655Z
        accessed: 2026-10-13
      - *valwood

    url: https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Geophagus
    archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-99b1ebbc/2026-10-14T095906Z

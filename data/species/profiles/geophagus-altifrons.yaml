  aggressionHeterospecific:
    value: 1
    confidence: medium
    rationale: >-
      Care sheets describe the species as remarkably peaceful towards other fish outside breeding
      and suited to communities of peaceful species. Breeding pairs defend the spawning site and the
      fry, mostly by display and short chases near the brood. Checker-c proposed level 2 because
      intruders are driven off during brood care; the other three runs chose level 1, since the
      defence stays local and is limited to breeding.

  disagreements:
    - field: features.predation
      proposals:
        - {by: generator, value: 1}
        - {by: checker-a, value: 1}
        - {by: checker-b, value: 0}
        - {by: checker-c, value: 0}
        - {by: tiebreaker-1, value: 1}
        - {by: tiebreaker-2, value: 0}
      decision: 1
      rationale: >-
        Tally method conservative at 3 of 6 votes, confidence low. Stomach studies (Seriously Fish,
        the Balbina study) and the FishBase trophic level show invertebrates and plant matter and
        support level 0; the Jari River diet summary records fish as an occasional food item and
        related species had fish in their guts, which supports level 1. Without a qualified
        majority the higher level applies.
    - field: features.temperatureC
      proposals:
        - {by: generator, value: {min: 27, max: 31}}
        - {by: checker-a, value: {min: 26, max: 32}}
        - {by: checker-b, value: {min: 25, max: 30}}
        - {by: checker-c, value: {min: 28.3, max: 31.2}}
        - {by: tiebreaker-1, value: {min: 27, max: 32}}
        - {by: tiebreaker-2, value: {min: 26, max: 32}}
      decision: {min: 27, max: 32}
      rationale: >-
        Tally method qualified-majority at 4 of 6 votes (generator, checker-a, tiebreaker-1 and
        tiebreaker-2); the median of their bounds gives 27 to 32 C. Checker-b leaned on a
        climate-based figure of 25 to 27 C and checker-c on a warm-season envelope measured after
        the Belo Monte impoundment.
    - field: features.temperatureC.tolerance
      proposals:
        - {by: generator, value: {min: 24, max: 31}}
        - {by: checker-a, value: {min: 24, max: 32}}
        - {by: checker-b, value: {min: 24, max: 30}}
        - {by: checker-c, value: {min: 25, max: 32}}
      decision: {min: 24, max: 32}
      rationale: >-
        Tally method unanimous at 4 of 4 votes; all proposals lie within the agreement threshold of
        the top candidate, and the decided range contains the natural maximum of 32 C.
    - field: features.ph
      proposals:
        - {by: generator, value: {min: 5.0, max: 7.0}}
        - {by: checker-a, value: {min: 4.6, max: 8.0}}
        - {by: checker-b, value: {min: 4.8, max: 7.0}}
        - {by: checker-c, value: {min: 4.8, max: 7.0}}
        - {by: tiebreaker-1, value: {min: 4.6, max: 7.5}}
        - {by: tiebreaker-2, value: {min: 4.8, max: 7.0}}
      decision: {min: 4.8, max: 7.0}
      rationale: >-
        Tally method qualified-majority at 4 of 6 votes (generator, checker-b, checker-c and
        tiebreaker-2). Checker-a and tiebreaker-1 included the Rio Negro minimum of 4.6 and the
        higher Xingu main-channel values; these are named in the rationale as the wider source
        range.
    - field: features.ph.tolerance
      proposals:
        - {by: generator, value: {min: 5.0, max: 7.5}}
        - {by: checker-a, value: {min: 4.5, max: 8.0}}
        - {by: checker-b, value: {min: 5.0, max: 7.5}}
        - {by: checker-c, value: {min: 4.8, max: 7.0}}
        - {by: tiebreaker-1, value: {min: 4.5, max: 7.5}}
        - {by: tiebreaker-2, value: {min: 4.8, max: 7.5}}
      decision: {min: 4.8, max: 7.5}
      rationale: >-
        Tally method qualified-majority at 4 of 6 votes (generator, checker-b, tiebreaker-1 and
        tiebreaker-2); the median 4.9 to 7.5 is widened to 4.8 to contain the natural range.
        Checker-a extended to 8.0 on a wholesaler report, checker-c stopped at 7.0.
    - field: features.maxSizeCm
      proposals:
        - {by: generator, value: {male: 25, female: 21}}
        - {by: checker-a, value: {male: 25, female: 22}}
        - {by: checker-b, value: {male: 26, female: 22}}
        - {by: checker-c, value: {male: 25, female: 25}}
      decision: {male: 25, female: 22}
      rationale: >-
        Three runs agree on 25 cm for males within 1 cm. No source separates the sexes; 22 cm for
        females follows two runs and the usual size difference in the genus, while checker-c gave
        both sexes the same planning ceiling.
    - field: features.aggressionConspecific
      proposals:
        - {by: generator, value: 2}
        - {by: checker-a, value: 2}
        - {by: checker-b, value: 1}
        - {by: checker-c, value: 2}
      decision: 2
      rationale: The documented hierarchy with regular chasing of weaker fish fits level 2; checker-b read the group as only displaying.
    - field: features.aggressionHeterospecific
      proposals:
        - {by: generator, value: 1}
        - {by: checker-a, value: 1}
        - {by: checker-b, value: 1}
        - {by: checker-c, value: 2}
      decision: 1
      rationale: Defence of other species is limited to the brood site and mostly display; checker-c counted brood defence as chasing out of a territory.
    - field: features.territory
      proposals:
        - {by: generator, value: {size: small, breedingOnly: true}}
        - {by: checker-a, value: {size: small, breedingOnly: true}}
        - {by: checker-b, value: {size: small, breedingOnly: true}}
        - {by: checker-c, value: {size: large, breedingOnly: true}}
      decision: {size: small, breedingOnly: true}
      rationale: No source describes a brood territory approaching a third of a large tank; checker-c chose large as a cautious estimate without a measurement.
    - field: features.habitatZones
      proposals:
        - {by: generator, value: [sand, wood]}
        - {by: checker-a, value: [sand, wood]}
        - {by: checker-b, value: [sand, wood, rock]}
        - {by: checker-c, value: [sand, wood]}
      decision: [sand, wood]
      rationale: Rocks occur only scattered at some sites and are optional spawning places, not a needed zone.
    - field: features.coloration
      proposals:
        - {by: generator, value: {baseColors: [silver, yellow, blue], pattern: plain}}
        - {by: checker-a, value: {baseColors: [silver, yellow, blue], pattern: spots}}
        - {by: checker-b, value: {baseColors: [silver, grey, yellow], pattern: plain}}
        - {by: checker-c, value: {baseColors: [silver, yellow, blue, orange], pattern: mixed}}
      decision: {baseColors: [silver, yellow, blue], pattern: plain}
      rationale: >-
        Silver, yellow and blue are shared by three runs. The body lacks bars and a strong
        lateral spot and reads as plain at a distance; the scale spangles that led checker-a to
        spots and the warm fin tones that led checker-c to mixed are fine details. Confidence low.
    - field: features.feedingSpeed
      proposals:
        - {by: generator, value: normal}
        - {by: checker-a, value: normal}
        - {by: checker-b, value: slow}
        - {by: checker-c, value: normal}
      decision: normal
      rationale: Settled fish rise readily to food and take their share; checker-b inferred slow from the sifting mode alone.
    - field: features.lifespanYears
      proposals:
        - {by: generator, value: {min: 8, max: 12}}
        - {by: checker-a, value: {min: 8, max: 12}}
        - {by: checker-b, value: {min: 8, max: 12}}
        - {by: checker-c, value: {min: 8, max: 10}}
      decision: {min: 8, max: 12}
      rationale: The only figures are about ten years, one of them allowing longer; three runs chose 8 to 12 years around that figure.
    - field: features.beginnerSuitability
      proposals:
        - {by: generator, value: moderate}
        - {by: checker-a, value: moderate}
        - {by: checker-b, value: demanding}
        - {by: checker-c, value: moderate}
      decision: moderate
      rationale: Seriously Fish rates it moderate and two sources call it easy in a large enough tank; the demands on tank size and water quality keep it at moderate rather than easy.

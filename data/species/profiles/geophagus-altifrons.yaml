    rationale: >-
      Decided by qualified majority (4 of 6 votes). The agreeing votes proposed 5.0 to 7.0
      (generator) and 4.8 to 7.0 (checker-b, checker-c and tiebreaker-2); the median gives 4.8 to
      7.0. Checker-a proposed 4.6 to 8.0 and tiebreaker-1 4.6 to 7.5. The species lives in black
      water (Rio Negro), clear water (Tapajós, Trombetas, Xingu) and floodplain lakes. Channel
      measurements of the Tapajós and Xingu give about 6.0 to 7.0, Tapajós and Trombetas lagoons 5.2
      to 6.9, the lower Tapajós a mean of 6.56, and Seriously Fish reports 4.8 to 6.6 from the natural
      waters of the species. The sources reach beyond the decision on both sides: the Rio Negro at
      Manaus measured 4.6 to 5.3, Xingu main-channel averages reach 7.3 to 7.9 depending on the
      water level, and single Xingu readings range from 4.8 to 8.6. The decided range covers the
      usual values of the habitats and leaves out these extremes.

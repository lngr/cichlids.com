  breeding:
    value: biparental-mouthbrooder
    confidence: high
    rationale: >-
      All runs agree. The pair spawns on a cleaned flat stone, wood or the bottom and the eggs are
      taken into the mouth soon after (ovophilic mouthbrooding in FishBase). Usually the female holds
      eggs and larvae while the male guards; after the fry swim free both parents carry them, often
      swapping the brood. A keeping account observed only the female holding, which does not rule out
      the biparental mode described by Seriously Fish.

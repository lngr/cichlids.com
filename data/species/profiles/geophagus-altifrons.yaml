    confidence: medium
    rationale: >-
      Peaceful and willing to take prepared food, but it needs a very large, mature tank with fine
      sand, strong filtration and large weekly water changes, and it reacts to poor water with head
      and lateral line erosion. Seriously Fish rates it moderate; a wholesaler and AquariumDomain
      call it easy once the tank is large enough. Checker-b proposed demanding because of the
      sensitivity to water quality; the other runs chose moderate.

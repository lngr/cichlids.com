    rationale: >-
      Decided conservatively at 3 of 6 votes: the generator, checker-a and tiebreaker-1 proposed
      level 1, checker-b, checker-c and tiebreaker-2 level 0, and without a qualified majority the
      higher level applies. For level 0 speak the stomach studies: Seriously Fish reports wild stomach
      contents of small invertebrates, seeds and detritus and says the species leaves fish longer
      than a few millimetres alone, a study at the Balbina reservoir classes it as a herbivore from
      its own stomach analyses, and FishBase estimates a trophic level of 2.2, typical of a plant and
      invertebrate feeder. For level 1 speaks that fish are recorded as an occasional food item: the
      Jari River parasite study summarises the published diet data and lists fish among insects,
      crustaceans, algae, detritus, fruits and seeds, fish made up 12 and 4 percent of gut volume in
      the closely related G. abalios and G. dicrozoster, and the Fishkeeper data bank and a care
      guide warn against small tankmates and shrimp. No source describes regular fish eating, so

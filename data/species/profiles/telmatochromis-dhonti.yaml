  habitat:
    text: "The species lives on sediment-rich rocky shores and in the zones where rock gives way to
      sand, mostly from the shallows down to about 15 m, and it tolerates turbid water. It is the
      only Telmatochromis of the lake that also enters river deltas, and it is recorded far down the
      Lukuga, the outflow of the lake; the Catalog of Fishes adds the Niemba River. Records come
      from the Democratic Republic of the Congo, Zambia, Burundi and Tanzania. Lake Tanganyika water
      is hard and strongly buffered, with pH 8.4 to 9.4, 10 to 13 dGH, 15 to 20 dKH and 23 to 29
      degrees Celsius. Local forms differ in size, and northern fish grow noticeably larger than
      southern ones."
    sources:
      - kind: catalog-of-fishes
        title: "Eschmeyer's Catalog of Fishes: species of the genus Telmatochromis"
        url: 'https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Telmatochromis'
        accessed: 2026-10-17
        archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-f469e491/2026-10-14T171406Z

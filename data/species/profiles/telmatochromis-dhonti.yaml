  habitatZones:
    value:
      - rock
      - sand
      - shell
    confidence: medium
    rationale: "The generator and checker-c propose rock, sand and shell; checker-a and checker-b leave
      shell out because shells serve mainly the small variants. The species lives on sediment-rich
      rocky shores and in the transition zone between rock and sand at about 5 to 15 m, often in
      turbid water (tanganyika.si, Cichlid Room Companion, FishBase). Sefc (2011) lists it among the
      cave breeders that also use empty snail shells, and tanganyika.si names shells beside caves
      and burrows as nest sites, so shells are part of the wild habitat. Shell is kept because the
      fish occupies shells in a tank and competes with shell dwellers for them; rock with caves
      remains the essential zone and shells are optional nests."

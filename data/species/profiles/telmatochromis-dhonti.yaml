  husbandry:
    text: "A Tanganyika set-up with stacked rock that forms many caves and crevices over a sand floor
      suits the species, and a few empty snail shells or small flower pots add nest sites. Care
      sheets give 120 L for a pair and a tank length of at least 90 cm; a male with three females
      needs about 200 L and 110 cm, with a cave for every female. The water should be hard and
      alkaline: care sheets give 24 to 27 degrees Celsius, pH 8.0 to 9.5 and 10 to 20 dGH, and the
      fish stays healthy at 22 to 29 degrees, pH 8.0 to 9.5, 9 to 20 dGH and about 10 to 24 dKH.
      Regular partial water changes keep the buffering stable, and a tight lid is sensible, as with
      other active Tanganyika rock dwellers."

  problems:
    text: "Most losses come from aggression and not from disease. A male kept with too few caves, with
      another male or with a lone female and no cover can injure tankmates, so provide many hiding
      places and be ready to rehome fish that are being targeted. Hard alkaline water is essential;
      soft or acid water stresses the fish and invites illness. A diet that lacks variety or that is
      too rich can upset the gut, so vary the food and avoid overfeeding. Clear water, regular water
      changes and a quarantine for new fish limit the usual cichlid ailments such as skin parasites.
      A fish that is swollen or listless for days needs the advice of an experienced keeper or a
      vet."

  coloration:
    value:
      baseColors:
        - brown
        - orange
      pattern: plain
    confidence: low
    rationale: "The generator and checker-c propose brown only; checker-a and checker-b add orange. Wild
      adults are uniformly dark brown, and some males show orange to red horizontal marks on the
      head (tanganyika.si). The orange trade form, the fish most keepers get, is orange in the
      aquarium; tanganyika.si reports that Konings regards it as T. dhonti and sees the orange only
      in captivity. Because the planner compares fish as they look in the tank, both colours are
      listed. The body carries no bars or stripes, in line with the plain-coloured T. temporalis
      complex of Indermaur and colleagues, so the pattern is plain. Colour varies with origin, which
      keeps the confidence low."

    - name: Lamprologus dhonti
      note: "Original combination of Boulenger (1919), type locality Albertville (Kalemie), Democratic
        Republic of the Congo."
    - name: Julidochromis macrolepis
      note: "Synonym of T. dhonti after Hanssens and Snoeks (2001) and Indermaur and colleagues (2024);
        the Catalog of Fishes follows Konings (2015, 2019) and lists it as the valid northern
        species Telmatochromis macrolepis."
    - name: Telmatochromis caninus
      note: Synonym of T. dhonti after Maréchal and Poll (1991) and Hanssens and Snoeks (2003); the
        Catalog of Fishes places it under T. macrolepis.
  legacyNames:
    - Telmatochromis dhonti
  note: "The Catalog of Fishes lists Telmatochromis dhonti (Boulenger 1919) as valid, with Lake
    Tanganyika and the Niemba River as its range; its list for Lamprologus, the genus of the
    original description, holds no separate entry. The status of the large northern fish is
    disputed. Hanssens and Snoeks (2001, 2003), Indermaur and colleagues (2024) and the Cichlid Room
    Companion treat Julidochromis macrolepis Borodin 1931 and Telmatochromis caninus Poll 1942 as
    synonyms of T. dhonti, while the Catalog follows Konings (2015, 2019) and keeps T. macrolepis as
    a valid northern species with T. caninus under it. The profile uses the valid name of the
    Catalog in the wide sense, so hobby stock sold as T. dhonti may include fish that the Catalog
    assigns to T. macrolepis."
names:
  trade:
    en:
      - Telmatochromis dhonti
      - Dhonti orange
variants:
  - name: Orange
    kind: color-morph
    note: "Trade form from the central Tanzanian coast. Konings regards it as T. dhonti, and the orange
      colour is seen in aquaria only, since wild adults are dark brown."
  - name: Mwila Island
    kind: locality
    note: Population of the Tanzanian coast; wild fish are uniformly dark brown.
  - name: Namansi
    kind: locality
    note: Population of the Tanzanian coast; northern forms such as this one are larger than the
      southern ones.
  - name: Kalemie
    kind: locality
    note: "Type locality in the Democratic Republic of the Congo; fish of the south stay small, mostly
      under 7.5 cm."
features:
  origin:
    value:
      continent: Africa
      region: Lake Tanganyika
      waterbody: lake-tanganyika
      localities:
        - "Kalemie (Albertville), type locality, Democratic Republic of the Congo"
        - "Namansi, Tanzania"
        - "Mwila Island, Tanzania"
        - "Kisimba-Kilia rapids, Lukuga River"
        - Niemba River
    confidence: high
    rationale: "All four runs agree on Lake Tanganyika. The Catalog of Fishes gives the lake and the
      Niemba River as the range and Kalemie (Albertville) as the type locality. FishBase treats the
      species as a lake endemic with additional records from the Kisimba-Kilia rapids of the Lukuga,
      the outflow of the lake, and Indermaur and colleagues note that it is the only Telmatochromis
      of the lake that also enters river deltas and the Lukuga. The location database tanganyika.si
      places it south of Baraka, in Zambian waters and south of the Malagarasi mouth. The river
      records are marginal, so the lake values of the water body apply. The cichlids.com archive
      holds only a dealer stock list that names the species."

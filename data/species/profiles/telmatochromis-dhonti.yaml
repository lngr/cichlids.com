  sizeAndGrowth:
    text: "Adult size depends on the origin. Southern populations such as the one at Kalemie stay at
      about 6.5 to 7 cm, while northern fish exceed 10 cm and the largest measured wild fish was
      11.3 cm. The orange form exported from the central Tanzanian coast reaches about 12 cm in
      males and about 8 cm in females in the aquarium. Females are roughly a third smaller than
      males and weigh about half as much. Tank length and the number of caves should be planned for
      a 12 cm male rather than for the small juveniles of the trade."
    sources:

  breeding:
    value: cave-spawner
    confidence: high
    rationale: "All four runs choose cave-spawner. FishBase calls the species a cave brooder, and the
      Cichlid Room Companion lists substrate and cave breeding. tanganyika.si and the DRTA sheet
      describe spawning in caves, in burrows under stones and, mainly in small variants, in empty
      snail shells, and Sefc (2011) counts it among the cave breeders with facultative shell use.
      The female tends eggs and fry in her own nest while the male guards the wider territory.
      Clutches of about 50 to 100 eggs are reported from the field, 200 to 300 for the orange form
      and up to 500 in literature summaries."

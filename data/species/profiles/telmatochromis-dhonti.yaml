  sexing:
    text: "Males are clearly larger than females, and the difference grows with age, since females are
      about 30 to 40 percent smaller. Males also carry a more strongly arched forehead and longer
      pelvic fins, and some develop orange to red horizontal markings on the head. Young fish are
      hard to sort, so it helps to buy a small group of juveniles and let the sexes show themselves
      over the first year, then keep the combination that works and rehome surplus males."

  territory:
    value:
      size: large
      breedingOnly: false
    confidence: low
    rationale: "All four runs choose a large territory held all year. Each female guards a small nest
      cave, but the male patrols and defends a wider area that encloses the nests of his females
      (tanganyika.si, FishBase), and the DRTA sheet calls the species strictly territorial. In a
      keeper report one male took about three quarters of the floor of a 90 cm tank within minutes
      and later the whole footprint of a 120 cm tank. No measured wild territory is published, and a
      single pair may claim little more than one cave area, so the confidence is low."

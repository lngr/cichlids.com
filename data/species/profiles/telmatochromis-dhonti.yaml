  socialBehavior:
    text: "Males are very aggressive, above all towards other males, and they chase any fish that
      approaches the caves they guard. In nature one male holds a territory that contains the nests
      of several females. Each female defends her own nest, and the male steps in mainly when a
      serious threat appears. In a tank this means that a lone pair or one male with about three
      females works only if the rockwork breaks the line of sight and every female has a cave of her
      own. Two males in the same tank are likely to fight until one is hurt."

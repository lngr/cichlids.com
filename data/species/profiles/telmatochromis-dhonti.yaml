  temperatureC:
    value:
      min: 23
      max: 29
    confidence: high
    rationale: "The species is a Lake Tanganyika endemic, so the natural range is the lake range of 23
      to 29 degrees Celsius. Hourly buoy readings at Mpulungu in the south span 23.85 to 29.01
      degrees over a year (Verburg and colleagues 1997), and the seasonal surface means of the
      FAO/FINNIDA stations lie at 24.4 to 27.2 degrees (Plisnier and colleagues 1996); upwelling
      cools the south from June to September. The 24 to 26 degrees of FishBase is an aquarium figure
      inside the lake range."
    sources:
      - kind: literature
        title: "Plisnier, P.-D., Langenberg, V., Mwape, L., Chitamwembwa, D., Tshibangu, K. and Coenen, E.
          (1996). Limnological sampling during an annual cycle at three stations on Lake Tanganyika

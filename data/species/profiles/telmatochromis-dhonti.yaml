  ghDgh:
    value:
      min: 10
      max: 13
    confidence: high
    rationale: "The species is a Lake Tanganyika endemic, so the natural range is the lake range of 10
      to 13 dGH. Converted from calcium and magnesium, the surface means of the FAO/FINNIDA stations
      give 11.1 to 11.5 dGH in the first annual cycle (Plisnier and colleagues 1996) and about 11 to
      12 in the second (Plisnier 1996), north basin water gives 12.2 dGH (Cohen and colleagues 1997)
      and the ion values of Talling and Talling in the FAO source book about 11.4 dGH. Magnesium far
      exceeds calcium in this water. The 10 to 15 dGH of FishBase is an aquarium figure."

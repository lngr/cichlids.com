  diet:
    text: "In nature the fish takes mainly small invertebrates, and stomach analyses show a lot of midge
      larvae. In the aquarium offer live and frozen foods of fitting size, such as cyclops, mysis,
      krill and chopped small crustaceans, and use a quality dry food as a supplement. The fish
      accepts frozen and dry foods without trouble. Bloat is not reported for the species, but a
      monotonous diet of fatty foods is a poor basis for any cichlid, so vary the menu. Feed small
      portions twice a day so that tankmates that share the food do not go short, and remove
      leftovers."

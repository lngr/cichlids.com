    tolerance:
      value:
        min: 22
        max: 29
      confidence: low
      rationale: "All four votes agree within one degree (22 to 30, twice 22 to 29, and 23 to 29), and the
        tally decides 22 to 29 degrees Celsius unanimously with low confidence. The care sheets for
        the species give 24 to 26 (FishBase, DRTA sheet, which adds 26 to 28 for breeding) and 24 to
        27 (einrichtungsbeispiele.de), the congeners are kept at 23 to 27 (Seriously Fish, T.
        vittatus) and about 25 to 26 (Practical Fishkeeping, T. temporalis), and a general
        Tanganyika guide gives 24 to 27. Every source range lies inside the decided band, which
        contains the lake range of 23 to 29 and adds one degree below it. No source states a
        long-term limit for the species itself, which keeps the confidence low."

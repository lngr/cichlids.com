partners:
  suitable:
    - species: Cyprichromis leptosoma
      reason: "Lives in open water above the rocks and ignores cave territories, so it meets the dhonti
        males rarely."
      condition: Tank of at least 150 cm with a wide open swimming area beside the rockwork.
    - species: Paracyprichromis nigripinnis
      reason: A peaceful open-water planktivore that uses a different zone and tolerates a busy rock
        dweller.
      condition: Large tank of 300 L or more with plenty of free water.
    - species: Altolamprologus compressiceps
      reason: "A robust, larger rock dweller that holds its own against the males and keeps to narrow
        crevices and the sides of the rockwork."
      condition: Tank of 300 L or more with separate rock piles and many caves.
  unsuitable:
    - species: Neolamprologus multifasciatus
      reason: "A tiny shell dweller that cannot withstand a male defending nests, and the dhonti also use
        shells."
    - species: Telmatochromis temporalis
      reason: "A close relative with the same cave and shell needs, so territorial fights over nests are
        certain."
    - species: Julidochromis ornatus
      reason: "Competes for the same rock caves and lives in a pair-bonded territory of its own, and an
        aquarium cross of a Julidochromis with a relative of T. dhonti is on record."
    - species: Eretmodus cyanostictus
      reason: "A shy, small goby cichlid of the surf zone that is chased without any chance of escape."
    - species: Tropheus moorii
      reason: "A plant-based grazer that is sensitive to the protein-rich live foods the dhonti need and
        itself aggressive, so both fish fight for the rock."
profile:
  overview:
    text: "Telmatochromis dhonti is a lamprologine cichlid of Lake Tanganyika that Boulenger described
      in 1919 from Kalemie. Males of the larger forms reach about 12 cm, while females stay clearly
      smaller. Wild fish are plain dark brown without stripes; the orange form of the trade shows
      its colour in aquaria. The species spawns in caves, and a male keeps a small harem with each
      female in her own nest. Its appeal lies in its lively behaviour around rockwork, but it is
      very territorial and rough with other fish, so it belongs in a Tanganyika tank with plenty of
      stone rather than in a mixed community."
    sources:
      - kind: catalog-of-fishes
        title: "Eschmeyer's Catalog of Fishes: species of the genus Telmatochromis"
        url: 'https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Telmatochromis'
        accessed: 2026-10-17

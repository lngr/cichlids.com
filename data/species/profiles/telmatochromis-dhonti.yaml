      rationale: "The six votes do not reach a qualified majority: the generator, checker-a and
        tiebreaker-2 propose 10 to 25 dKH, checker-b 8 to 22, checker-c 10 to 20 and tiebreaker-1 10
        to 22. The tally therefore takes the median of all minima and of all maxima, 10 to 24 dKH,
        with low confidence. No source states a carbonate hardness for T. dhonti; the votes derive
        the range from the GH and pH advice for the species (10 to 15 or 10 to 20 dGH at pH 8.0 to
        9.5) and from group advice. The group sources reach wider than the decided range at the
        lower end: Practical Fishkeeping gives 8 to 18 dKH for Tanganyikan cichlids, and a general
        model-knowledge entry gives 10 to 25. Other group figures are 10 to 15 (Aquatic Community,
        AquaInfo, which describes a lamprologine tank doing well at 12), 12 to 15 (a retailer
        article) and 15 to 20 for the congener T. vittatus (Fischlexikon). The median range contains
        the lake range of 15 to 20 and is plausible in aquarium practice, since Tanganyika
        lamprologines are commonly kept at 10 to 20 dKH."

    confidence: high
    rationale: "The species is a Lake Tanganyika endemic, so the natural range is the lake range of 15
      to 20 dKH. The alkalinity of 6.5 to 6.6 meq/L in north basin water (Cohen and colleagues 1997)
      gives 18.2 to 18.5 dKH, 6.7 to 6.9 meq/L cited by Langenberg (2008) gives 18.8 to 19.3, and
      the 6.71 meq/L of Talling and Talling in the FAO source book gives 18.8; the bicarbonate and
      carbonate titrations of the second FAO/FINNIDA annual cycle give about 16 to 20 dKH (Plisnier
      1996), and the lowest titrations of the programme reach about 15."

  aggressionHeterospecific:
    value: 3
    confidence: medium
    rationale: "All four runs give level 3. tanganyika.si reports strong territorial behaviour towards
      other species at nest sites, rates the fish as poorly suited to a community tank and asks for
      at least 300 L and larger tankmates if it shares a tank; the DRTA sheet notes aggression
      towards males of other species. Keeper reports describe a small male claiming most of the tank
      floor within minutes and attacking much larger fish, and the Cichlid Atlas calls the species
      unsuitable for most community tanks. Attacks reach beyond the cave, so tankmates need
      comparable size and robustness."
    sources:

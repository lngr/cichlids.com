  compatibility:
    text: "The species is poorly suited to a community tank. Where it shares a tank, the tank should
      hold 300 L or more and the other fish should be larger and sturdy, ideally open-water species
      such as Cyprichromis or robust rock dwellers of similar size. Small shy fish, shell dwellers
      and other cave users such as Julidochromis and other Telmatochromis compete for nests and
      suffer from the males. Plant-eating grazers such as Tropheus need a different diet and fight
      for the same rock. No source reports crosses of this species, but crosses are suspected among
      other Telmatochromis, so several species of the genus in one tank are a poor idea."

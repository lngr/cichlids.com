  aggressionConspecific:
    value: 3
    confidence: medium
    rationale: "All four runs give level 3. tanganyika.si describes the species as extremely aggressive
      within its own kind, above all between males, the DRTA sheet calls the males very aggressive
      to rivals, and the Cichlid Atlas summarises keeper reports of hard male fights. A keeper had
      to remove several fish after the dominant male claimed the whole tank. Males hold harems in
      which each female guards her own nest, and stable harems are reported with enough rock and
      caves, so no source supports level 4."

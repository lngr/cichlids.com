  breeding:
    text: "The species spawns in caves, in shallow burrows under stones or in empty snail shells. A
      breeding group of one male with several females gives the best results, and a somewhat warmer
      temperature of 26 to 28 degrees Celsius is said to encourage spawning. The female lays the
      eggs in her nest and guards eggs and fry on her own, while the male watches the wider
      territory. Reported clutches run from 50 to 100 eggs for some populations to 200 to 300 for
      the orange form and up to 500 in other accounts, and the larvae hatch within four to seven
      days. The parents lose interest once the young begin to forage, so rehome the fry or provide
      plenty of cover."
    sources:

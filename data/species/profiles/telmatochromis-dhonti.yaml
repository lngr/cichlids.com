  predation:
    value: 1
    confidence: low
    rationale: "All four votes give level 1, and the tally decides it unanimously with low confidence.
      The tanganyika.si profiles and the Cichlid Room Companion class the species as a predator of
      animal prey, but the stomach contents described there are mostly invertebrates, chiefly midge
      larvae, and the FishBase food list records only benthic invertebrates. Indermaur and
      colleagues report that lake Telmatochromis sometimes take the eggs of other cichlids. No
      source names fish as prey, so the fish counts as a taker of fry and very small fish when the
      chance arises; FishBase reports no fish eating at all, which would mean level 0."

      medium confidence. Stomach analyses summarised by tanganyika.si show mainly invertebrates with
      midge larvae dominant, the FishBase food list names zoobenthos and other benthic
      invertebrates, the Cichlid Room Companion classes the feeding as predatory and the Cichlid
      Atlas describes an opportunistic feeder on benthic invertebrates. The DRTA sheet asks for live
      food of fitting size and notes that frozen and dry food is accepted. FishBase calls the
      species an omnivore that feeds on microorganisms and einrichtungsbeispiele.de says it takes
      all common foods, and Indermaur and colleagues report filamentous algae for lake
      Telmatochromis in general; these general lines do not outweigh the stomach data. No source
      reports bloat."

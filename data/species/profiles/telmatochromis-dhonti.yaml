      the male value at 12 cm: tanganyika.si gives about 12 cm for males and about 8 cm for females
      of the orange trade form, which is the fish most keepers get, and FishBase, the DRTA sheet,
      einrichtungsbeispiele.de and Wikipedia all give 12 cm. Wild size varies strongly with origin:
      southern fish such as those near Kalemie reach about 6.5 to 7.2 cm, northern fish exceed 10 cm
      and the largest measured wild fish was 11.3 cm. Females stay 30 to 40 percent smaller.
      Southern stock remains well below these values."

    confidence: high
    rationale: "The species is a Lake Tanganyika endemic, so the natural range is the lake range of pH
      8.4 to 9.4. Surface water at the FAO/FINNIDA stations reads 8.85 to 9.14 by station and
      season, and the water column at 40 m varies from 8.47 to 9.40 over a year (Plisnier and
      colleagues 1996). The pH of 7.3 to 7.8 listed in the FAO source book after Talling and Talling
      contradicts the alkalinity of the lake and the modern measurements and stays out of the range.
      FishBase gives 8.5 to 9.0 for the species, which lies inside."

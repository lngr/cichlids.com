      \ and low-protein vegetable matter. Field work and CRC support algal feeding; Seriously Fish and Fishkeeper\
      \ support a plant-based high-fibre staple and caution over rich foods. Gut detection of cyanobacteria\
      \ does not make them a required aquarium food. Occasional small invertebrate foods do not change the\
      \ diet class. Inherited false bloat flags attached to ecological papers indicate that those sources did\
      \ not assess bloat, not a finding of resistance. Forum reports disagree on the role of food, stress and\
      \ infection, so bloat is not assigned a single proven cause. Verification method: unanimous."

  habitat:
    text: "Rock provides both the feeding surface and the structure around which these fish organise their\
      \ lives. Records include fixed shoreline rock, interlocking rubble and sandstone, with regional differences\
      \ in depth and sediment exposure. The southern population study describes brichardi using deeper, more\
      \ sediment-covered rock where it overlaps with moorii; the public CRC account emphasises clean rocky\
      \ habitat. Natural lake values used here are 23 to 29 C, pH 8.4 to 9.4, GH 10 to 13 dGH and KH 15 to\
      \ 20 dKH, supported by lake limnology rather than aquarium care ranges."
    sources:
    - *id002

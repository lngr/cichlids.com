      confidence: medium
      rationale: "All four proposals, generator, checker-a, checker-b and checker-c, are 23 to 29 C, retained\
        \ by unanimous tally with medium confidence. Seriously Fish recommends 23 to 27 C, Fishkeeper 23 to\
        \ 26 C, Tropical Freshwater Fish 25 to 28 C, and Anikstein reports breeding at 25 to 26 C. The upper\
        \ edge is extended to contain the natural lake range, supported by Verburg et al.; it is not a preferred\
        \ constant aquarium temperature or a demonstrated chronic limit. Tanganyika.si recommends 24 to 27\
        \ C and warns against exceeding 29 C. No wider well-supported species range was found."

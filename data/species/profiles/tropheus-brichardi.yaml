    rationale: "All runs agree on Lake Tanganyika. The Catalog fixes the type locality at Nyanza-Lac in Burundi.\
      \ Fishkeeper names Kipili, Ulwile and Nyanza forms and the Canary Cheek variation; regional records and\
      \ forum sale listings link Canary Cheek to Kabimba. The southern population study includes Kipili and\
      \ the Namansi contact region. Checker-b lists all four riparian countries, whereas CRC lists Burundi,\
      \ the Democratic Republic of the Congo and Tanzania; lake-wide country geography alone does not verify\
      \ occurrence in Zambia, so countries are not used as collection localities. Southern trade names need\
      \ locality and taxonomic context."

  ph:
    value:
      min: 8.4
      max: 9.4
    confidence: high
    rationale: "The natural lake envelope is 8.4 to 9.4. Plisnier et al. measured 8.47 to 9.40 at 40 m over\
      \ an annual cycle, with surface water generally near 9; Cohen et al. report surface values of 8.8 to\
      \ 9.2. FishBase lists a wider environmental interval of 7 to 9, and the older FAO source book reproduces\
      \ 7.3 to 7.8. Those broad or historical entries do not outweigh the modern lake measurements for this\
      \ natural-water field. Aquarium recommendations are retained as context only."

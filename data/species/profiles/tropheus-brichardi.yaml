  sizeAndGrowth:
    text: "The working aquarium maxima are approximately 11.5 cm for males and 10 cm for females. Treat the\
      \ difference as an estimate: the available sources rarely separate sexes and mix standard length, which\
      \ excludes the tail, with total length. FishBase lists 10 cm total length, while Seriously Fish lists\
      \ 11.5 cm standard length. Locality and maturity also affect appearance. Young fish can be more strongly\
      \ barred than adult males, so colour changes during growth are expected. The provisional lifespan range\
      \ of five to ten years is less secure than the habitat and feeding information."
    sources:
    - *id002

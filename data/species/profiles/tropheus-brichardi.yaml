  temperatureC:
    value:
      min: 23
      max: 29
    confidence: high
    rationale: "Verburg et al. measured hourly temperatures of 23.85 to 29.01 C at 1 m near Mpulungu. Together\
      \ with the regional and seasonal FAO limnology, these observations support the prescribed natural lake\
      \ envelope of 23 to 29 C. The narrower FishBase environment listing of 24 to 26 C and aquarium recommendations\
      \ of 23 to 27 C describe different coverage, not the complete lake range."

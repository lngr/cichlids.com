profile:
  overview:
    text: "Plan for a colony rather than a pair when keeping Tropheus brichardi. A settled group offers constant\
      \ grazing and social displays, but a poorly balanced one can suffer serious losses. The species comes\
      \ from Lake Tanganyika and is associated with rocky shores. Its accepted name covers several geographically\
      \ distinct appearances, and trade labels can conceal unsettled taxonomic boundaries. A plant-based feeding\
      \ routine and stable, clean water matter as much as tank length. This is a demanding fish whose modest\
      \ body size understates the space and attention needed for a successful adult group."
    sources:
    - *id001
    - *id003
    - *id012
    - *id002

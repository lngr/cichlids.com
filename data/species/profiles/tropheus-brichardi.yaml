    - *id011
  breeding:
    text: "The female carries the developing brood in her mouth. Aquarium sources report small clutches of\
      \ large eggs and holding periods of several weeks, sometimes with continued feeding. Anikstein obtained\
      \ repeated broods from a Kipili group, including one of sixteen young, while other accounts describe\
      \ smaller clutches. Stable conditions and refuge from male attention matter more than a fixed production\
      \ schedule. Moving a holding female can create additional social problems when she returns to the colony.\
      \ Artificial incubation and stripping are specialist techniques and are not required to describe the\
      \ normal reproductive mode."
    sources:
    - *id012
    - *id002
    - *id007
    - *id003
    - *id004
    - *id013
  sexing:
    text: "Juvenile markings are a poor basis for assembling a breeding group. Adult males in some populations\
      \ darken and lose much of their barring, but locality variation prevents a universal colour rule. The\
      \ size estimates in this profile are not a reliable sexing key either. Expert examination of the genital\
      \ area is more informative than a seller's colour-based guess, while observed mouthbrooding identifies\
      \ a female. Follow several fish over time and retain the uncertainty of immature specimens. An incorrect\
      \ sex ratio can become a practical welfare problem through repeated courtship and aggression."
    sources:
    - *id012
    - *id003
    - *id002
    - *id004
    - *id014
    - *id013
    - *id011
    - *id033
    - *id007
  compatibility:
    text: "The recommended display is one species and one locality form. Some published accounts describe successful\
      \ combinations with similarly fed Tanganyikan rock dwellers, but those exceptions do not remove group-management\
      \ or crossing risks. The broad Tropheus caution is presumed; named pair groups add evidence involving\
      \ moorii, the northern black form and Mpimbwe. In the last case the evidence concerns inferred ancestry\
      \ or gene flow rather than an observed aquarium cross. Close relatives and different locality forms should\
      \ therefore not be presented as routine companions. Relatively mild behaviour toward unrelated species\
      \ does not by itself establish compatibility."
    sources:
    - *id003
    - *id012
    - *id039
    - *id005
    - *id040
    - *id026
    - *id004
    - *id001
    - *id038
    - *id011
    - *id013
    - *id014
    - *id033
  problems:
    text: "Two problems deserve continuing observation: digestive illness and social exclusion. A fish that\
      \ misses meals may be ill, intimidated or both, so body condition and behaviour should be assessed alongside\
      \ water tests and feeding history. High-protein or excessive rations, deteriorating water and abrupt\
      \ changes can undermine an otherwise adequate setup. Keep the feeding routine consistent and provide\
      \ oxygenated water with effective waste removal. Avoid judging success only by the dominant males or\
      \ by the absence of visible wounds. A subordinate that remains hidden or loses condition is evidence\
      \ that the colony needs attention."
    sources:

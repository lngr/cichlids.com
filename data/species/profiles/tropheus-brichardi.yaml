    - *id015
    - *id017
  socialBehavior:
    text: "Fatal aggression is a recognised failure mode of undersized Tropheus groups. A larger colony spreads\
      \ encounters, but every subordinate still needs access to food and a way out of a chase. Dominant males\
      \ defend substantial feeding space outside spawning, and females also use feeding areas. The recommended\
      \ minimum is fifteen of one locality form, with females outnumbering males. Introducing isolated newcomers\
      \ to an established colony can provoke severe attacks. Persistent hiding, reduced feeding or declining\
      \ condition should prompt reassessment of the social arrangement even when the group meets the numerical\
      \ minimum."
    sources:
    - *id012
    - *id003
    - *id004
    - *id026
    - *id013
    - *id014
    - *id011
    - *id006
    - *id028
    - *id030
    - *id007
  diet:
    text: "Offer an algae-based, high-fibre staple and preserve usable grazing surfaces. Spirulina foods and\
      \ suitable vegetable material fit the feeding strategy documented in the lake. Small organisms are consumed\
      \ with the surface film, and some husbandry accounts use occasional invertebrate foods, but this does\
      \ not justify a rich animal-food staple. Portions should reach subordinate fish without leaving waste.\
      \ Bloat sensitivity is well recognised in care accounts, although the syndrome cannot be assigned a single\
      \ cause from the available evidence. Food quality, stress and water conditions all require attention\
      \ when appetite or body shape changes."

      \ reports fatal fighting in small groups, and Fishkeeper describes losses of females and subordinate\
      \ males unless a large group spreads aggression. This matches rubric level 4, which explicitly includes\
      \ fish that kill unless kept in a large group or tank. Anikstein observed less hostility in a Kipili\
      \ group and Tropical Freshwater Fish gives a milder assessment, but neither excludes the documented risk\
      \ under unsuitable social conditions."

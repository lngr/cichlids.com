    - *id028
  husbandry:
    text: "Allow about 320 litres and a nominal 150 by 45 cm base for the recommended colony of at least fifteen\
      \ adults. These dimensions follow a published group minimum; the much smaller single-fish figures in\
      \ the same care sheet do not describe a colony. Use secure rock groups, retreat routes and open passages,\
      \ supported by mature filtration and strong oxygenation. Maintain regular water changes and test the\
      \ replacement water as well as the tank. Most care recommendations centre on temperatures below the natural\
      \ 29 C upper edge, which should not be treated as a routine heating target."
    sources:
    - *id003
    - *id012
    - *id008
    - *id004

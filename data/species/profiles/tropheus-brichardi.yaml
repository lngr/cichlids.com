    tolerance:
      value:
        min: 8
        max: 9.5
      confidence: medium
      rationale: "The qualified-majority tally selects pH 8 to 9.5 with five agreeing votes out of six and\
        \ medium confidence. Generator, checker-b, checker-c, tiebreaker-1 and tiebreaker-2 propose 8 to 9.5;\
        \ checker-a proposes 7.5 to 9.5. Seriously Fish directly supports the selected species-specific husbandry\
        \ interval. Wider or lower advice remains recorded: Tanganyika.si gives 7.5 to 9.5 for the related\
        \ Mtoto form, Tropical Freshwater Fish 7.3 to 9.2, and FishBase an environmental 7 to 9. These do not\
        \ establish healthy long-term aquarium keeping at their lower endpoints. Anikstein reports successful\
        \ breeding at 8 to 8.5, Fishkeeper and Monitarium recommend 8 to 9, Fishipedia 7.8 to 8.8, and OATA\
        \ 8 to 8.6 for a broader lake-cichlid group. Narrow recommendations do not demonstrate harm above their\
        \ maxima. Seachem targets 9 to 9.4 for Tanganyikan aquaria. The selected interval contains the natural\
        \ pH range and is husbandry guidance rather than a measured physiological boundary."
      sources:

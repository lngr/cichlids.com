    confidence: high
    rationale: Endemic to Lake Tanganyika according to the Catalog of Fishes and FishBase. It lives along almost the entire shoreline on sand or mud with scattered empty Neothauma shells; tanganyika.si reports it missing only from the Congolese west coast between Kalemie and Moliro, where Lamprologus speciosus and L. stappersi fill the same niche. Rumonge in Burundi is the type locality of the synonym L. lestradei; the other localities are collecting sites of wild forms listed by tanganyika.si, among them Isanga Bay in Zambia, the origin of a laboratory colony studied by Parker et al.

  temperatureC:
    value:
      min: 23
      max: 29
    confidence: high
    rationale: "Lake Tanganyika endemic, so the natural temperature is the measured range of the lake. Hourly buoy readings at Mpulungu in the south span about 24 to 29 C, and the southern basin is cooler and more variable from June to September because of upwelling. The FAO/FINNIDA sampling at three stations and the north basin data fall inside this range: 23 to 29 C."

  sexing:
    text: "Size is the most reliable guide: adult males are clearly larger than females, often by half again. Several sources describe a gold or orange edge on the dorsal fin of males and a pale edge in females, but sources and keepers disagree on which sex shows which colour, so the fin edge alone can mislead. Behaviour helps as well: females sit in the shell entrance and court the male, and a female ready to spawn turns darker with a violet sheen and a fuller belly. Buying a group of young fish and letting pairs form avoids sexing mistakes."

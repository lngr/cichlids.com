  aggressionConspecific:
    value: 3
    confidence: medium
    rationale: "Males defend shell territories against rival males, and females fight each other hard: in experiments a smaller female could not settle near a larger one even with plenty of shells, and breeding females in the field keep a median distance of about 91 cm. The male has to intervene to hold his harem together. Seriously Fish warns that infighting can get out of hand unless shells are plentiful and females outnumber males, and tanganyika.si calls aggression within the species pronounced. Injuries are therefore common with too few shells, too little floor space or the wrong ratio, which is level 3."
    sources:

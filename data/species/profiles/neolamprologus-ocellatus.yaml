  compatibility:
    text: The species suits a Tanganyika community if each group has its own zone. Good partners live in the rocks or in open water, such as small Julidochromis and Cyprichromis, and keepers also combine it with Neolamprologus multifasciatus on a separate shell bed. Avoid larger predatory lamprologines and big cichlids that can swallow it; archive reports describe a leleupi eating one and a breeding buffalo head pair evicting shell dwellers from their shells. Do not combine it with similar harem shell brooders such as L. speciosus, which compete for the same shells, and keep locality forms and the Gold morph apart. Malawi cichlids need different water and are far too rough.

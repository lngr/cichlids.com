        title: "Brandtmann, G., Scandura, M. and Trillmich, F. (1999). Female-female conflict in the harem of a snail cichlid (Lamprologus ocellatus): behavioural interactions and fitness consequences. Behaviour 136(9), 1123-1144 (abstract)."

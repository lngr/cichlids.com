  predation:
    value: 1
    confidence: low
    rationale: "The votes split between level 1 (generator, checker-a, tiebreaker-1) and level 0 (checker-b, tiebreaker-2). With 3 of 5 votes the top value falls short of the qualified majority of 4, so the vote count takes the most cautious value, the highest proposed level, and the confidence is low. The sources explain the split. In the lake the species is a micro-invertebrate feeder: FishBase and the IUCN assessment, both going back to the same original account, list only zoobenthos and zooplankton, tanganyika.si names chironomid larvae, small crustaceans and zooplankton, and the Cichlid Room Companion summary confirms crustacean, insect and plankton feeding without fish. Levels 2 and 3 are therefore excluded. Fry, however, are eaten: Seriously Fish advises moving free-swimming young to a rearing tank because other members of a colony eat them, and Brandtmann et al. found interbrood cannibalism among juveniles once their sizes differ by about 5 mm. This active fry eating fits level 1 at least as well as level 0, whose example is a herbivore. No source gives a size limit for fish prey; the 2 cm bound comes from the rubric. In practice the level matters only for fry and very small tankmates."

  diet:
    text: "In nature the fish picks small animals from the sand and the water column: insect larvae, tiny crustaceans and zooplankton. In the aquarium it takes almost any small food. A mix of frozen Cyclops, Daphnia, brine shrimp and mosquito larvae with fine granules or crushed flakes keeps it in good condition. Live food helps to bring females into breeding condition. Food should be small enough to fit the mouth and should sink to the bottom, because the fish rarely leaves its shell area to feed in open water. Feed small portions once or twice a day and avoid leftovers rotting in the sand."

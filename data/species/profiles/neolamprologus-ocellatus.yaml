      rationale: The studies of Brandtmann et al. and the review by Sefc describe intense aggression between harem females that the male has to contain, Seriously Fish warns that infighting can get out of hand without enough shells and a female surplus, and tanganyika.si calls aggression within the species pronounced. Injuries under poor conditions are level 3; checker-b read the same abstract but weighted the absence of reported injuries.
    - field: features.aggressionHeterospecific
      proposals:
        - by: generator
          value: 2
        - by: checker-a
          value: 2
        - by: checker-b
          value: 1
      decision: 2
      rationale: "The fish does more than display: it chases intruders, challenges much larger cichlids (tanganyika.si), fights heterospecific intruders in the field (Ota) and bites hands. It stays at its territory, which is level 2 rather than 3. Level 1 rests on the Wikipedia remark that it is not aggressive apart from shell defence."

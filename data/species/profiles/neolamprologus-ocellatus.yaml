  problems:
    text: Most failures come from setup mistakes. Coarse gravel prevents digging and leaves the fish stressed. Too few shells, or shells placed close together, lead to constant fights and injured or killed fish. Soft or acidic water and sudden changes in temperature or chemistry during water changes weaken the fish and make them prone to infections; ammonia and nitrite are poorly tolerated. Large or boisterous tankmates keep them hiding and may eat them. Overfeeding fouls the sand and the shells, so remove uneaten food and siphon the open areas regularly. Signs of trouble such as clamped fins, loss of appetite or a fish that no longer leaves its shell call for checking the water and the social situation first.

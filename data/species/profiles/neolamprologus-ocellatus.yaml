    confidence: high
    rationale: FishBase lists benthic micro-invertebrates and zooplankton as food items and calls the species a microfeeder on invertebrates; tanganyika.si names chironomid larvae, small crustaceans and drifting zooplankton as the wild diet, and a review of the shell-dwelling lamprologines reports small benthic invertebrates and zooplankton as the staple of the group. The Cichlid Room Companion summary confirms a crustacean, insect and plankton feeder. In the aquarium Seriously Fish recommends mainly live and frozen foods, and a research colony is fed live Artemia. The English Wikipedia calls the species omnivorous, which describes the acceptance of prepared foods in the aquarium rather than the natural diet; its advice against high-protein feeding is a general rule for African cichlids, and no source reports bloat as a problem of this species. The species does not need the plant-based diet of aufwuchs grazers. All three votes agree.

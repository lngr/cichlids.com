      confidence: medium
      rationale: "The care sources agree on a lower limit of 23 C: Seriously Fish and both Wikipedia articles give 23 to 27 C, FishBase and Fishkeeper 23 to 25 C, and a care guide 24 to 27 C with a warning against more than 28 C. A research colony has bred for years at a constant 27 C. Because the tolerance has to contain the natural range, its upper end is the lake maximum of 29 C; no source documents long-term keeping above 27 C, so the warm end is less certain than the cool end. All three votes agree."

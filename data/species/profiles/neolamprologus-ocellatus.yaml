  breeding:
    text: "Breeding happens readily in a well set-up tank. A ready female displays at the entrance of her shell, then enters and attaches her eggs to the inner wall. The male releases sperm at the opening or swims inside if he fits. Clutches are small, typically 10 to 20 eggs. Only the female cares for the brood: she fans the eggs, which hatch after about three days, and keeps the larvae inside until they appear at the entrance roughly a week to ten days after spawning. The young then forage around the shell and take newly hatched brine shrimp or microworms. After some weeks the mother drives them off. Juveniles turn territorial early and larger ones eat smaller siblings, so a separate rearing tank raises more fry."
    sources:
      - kind: literature
        title: Parker, A. V., Stemmer, M., Grätsch, S., Dorigo, A., Rodriguez Ramirez, O., Adel, A., Jordan, A. and Baier, H. (2023). Brood care in shell-dwelling cichlids is timed by independent maternal and larval clocks. bioRxiv preprint, published 2025 in Current Biology 35, 672-680.

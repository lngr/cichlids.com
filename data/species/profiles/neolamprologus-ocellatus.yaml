partners:
  suitable:
    - species: Cyprichromis leptosoma
      reason: Swims in open water above the shell bed and never competes for shells.
      condition: Tank of at least 100 cm so that a Cyprichromis group fits.
    - species: Julidochromis transcriptus
      reason: Small rock dweller that stays in the rockwork away from the shells.
      condition: Rock pile at the opposite end from the shell bed.
    - species: Neolamprologus multifasciatus
      reason: Equally small shell dweller of similar strength; keepers report both breeding side by side.
      condition: Separate shell beds and a tank of at least 80 cm.
    - species: Neolamprologus caudopunctatus
      reason: Small, comparatively peaceful lamprologine that breeds in rock caves rather than shells.
      condition: Tank of at least 100 cm with clearly separate rock and sand zones.
  unsuitable:
    - species: Neolamprologus leleupi
      reason: Larger rock-dwelling lamprologine; a keeper saw it swallow an ocellatus.
    - species: Steatocranus casuarius
      reason: Breeding pairs drive shell dwellers from their shells and claim the whole floor; it also comes from soft river water.
    - species: Lamprologus speciosus
      reason: Look-alike harem shell brooder that competes for the same shells and the same open sand.
    - species: Cyphotilapia frontosa
      reason: Large predator that eats any fish of ocellatus size.
    - species: Maylandia zebra
      reason: Hasty, much larger Malawi mbuna that would overrun the shell bed and needs different water.
    - species: Neolamprologus ocellatus (other locality or colour form)
      reason: Wild forms and the Gold morph should be kept apart to keep the lines pure.
profile:
  overview:
    text: "The ocellated shell-dweller is one of the smallest cichlids in the hobby and one of the most entertaining. It comes from Lake Tanganyika, where it spends its life in and around empty snail shells lying on sandy ground. The species name refers to the dark eye-like spot on the gill cover. Taxonomists place it in Neolamprologus, while most shops and books sell it as Lamprologus ocellatus. Despite a length of only about six centimetres it has a big personality: it digs, buries its shell, chases off fish many times its size and will even bite a hand that comes too close. Besides several wild locality forms, a yellow Gold morph is widely available. A small tank with fine sand, hard alkaline water and a handful of shells is all it needs to show its full behaviour, which makes it a good choice for keepers with limited space."
    sources:
      - kind: catalog-of-fishes
        title: "Eschmeyer's Catalog of Fishes, species list of Neolamprologus: entry ocellatus, Julidochromis Steindachner 1909"
        url: https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Neolamprologus
        accessed: 2026-10-12
      - kind: database
        title: "Seriously Fish: Lamprologus ocellatus, Ocellated Shell-dweller"
        url: https://www.seriouslyfish.com/species/lamprologus-ocellatus/
        accessed: 2026-10-12
      - kind: database
        title: "tanganyika.si: Lamprologus ocellatus 'Ikola'"
        url: https://tanganyika.si/TanganjikaByLocations/Ikola/slides/Lamprologus%20ocellatus%20%27Ikola%27.html
        accessed: 2026-10-12
  habitat:
    text: The species lives almost all around Lake Tanganyika, except for a stretch of the Congolese west coast where two close relatives fill its niche. It is found on flat sand or mud bottoms with scattered empty shells of the snail Neothauma, typically only one to a few shells per square metre. These open plains offer no other cover, so every fish depends on its shell for protection. Where the bottom is soft, it can also bury itself completely in the sand when danger threatens. The lake water is warm, hard and strongly alkaline, with a pH between about 8.4 and 9.4 and stable conditions all year.
    sources:
      - kind: database
        title: "tanganyika.si: Lamprologus ocellatus 'Ikola'"
        url: https://tanganyika.si/TanganjikaByLocations/Ikola/slides/Lamprologus%20ocellatus%20%27Ikola%27.html
        accessed: 2026-10-12
      - kind: literature
        title: "Koblmüller, S., Duftner, N., Sefc, K. M., Aibara, M., Stipacek, M., Blanc, M., Egger, B. and Sturmbauer, C. (2007). Reticulate phylogeny of gastropod-shell-breeding cichlids from Lake Tanganyika: the result of repeated introgressive hybridization. BMC Evolutionary Biology 7, 7."
        url: https://doi.org/10.1186/1471-2148-7-7
        accessed: 2026-10-12
      - kind: literature
        title: Plisnier, P.-D., Langenberg, V., Mwape, L., Chitamwembwa, D., Tshibangu, K. and Coenen, E. (1996). Limnological sampling during an annual cycle at three stations on Lake Tanganyika (1993-1994). FAO/FINNIDA Research for the Management of the Fisheries on Lake Tanganyika, GCP/RAF/271/FIN-TD/46.
        url: https://fao.org/fishery/static/LTR/FTP/TD46.PDF
        accessed: 2026-10-12
  sizeAndGrowth:
    text: Males reach about six centimetres total length, though many stay closer to five. Females are much smaller and rarely exceed four centimetres, which lets them slip deep into a shell that the male often cannot enter. Growth is steady on a varied diet of small foods. Because adults remain so small, the species fits tanks that would be far too small for most other cichlids, but it is also small enough to be eaten by larger tankmates.
    sources:
      - kind: database
        title: "FishBase species summary: Lamprologus ocellatus (Steindachner, 1909)"
        url: https://www.fishbase.se/summary/Lamprologus-ocellatus.html
        accessed: 2026-10-12
      - kind: database
        title: "Seriously Fish: Lamprologus ocellatus, Ocellated Shell-dweller"

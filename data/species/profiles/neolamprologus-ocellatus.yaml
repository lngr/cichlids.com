  socialBehavior:
    text: In the lake a male controls several shells and lets two to five females settle on his territory, each guarding her own shell. Females are hostile to one another and keep their distance, often close to a metre in the wild; larger females settle first and push smaller ones away. Males bury spare shells so that new arrivals cannot move in. In the aquarium these rivalries continue, so provide plenty of shells spaced apart and keep more females than males; two males in a small tank will fight until one gives up or is injured. Toward other species the fish defends its shell boldly and chases intruders off its patch of sand, but it rarely follows them far.
    sources:
      - kind: literature
        title: "Brandtmann, G., Scandura, M. and Trillmich, F. (1999). Female-female conflict in the harem of a snail cichlid (Lamprologus ocellatus): behavioural interactions and fitness consequences. Behaviour 136(9), 1123-1144 (abstract)."

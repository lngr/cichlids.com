  aggressionHeterospecific:
    value: 2
    confidence: medium
    rationale: It defends its shell and the sand around it against any fish, confronts much larger cichlids and even bites the keeper's hand. Field experiments show territorial males fighting intruders of other species, though less intensely than rivals of their own species. The aggression stays at the edge of the territory; Seriously Fish and tanganyika.si recommend tankmates that use other zones of the tank. The English Wikipedia calls it not aggressive apart from shell defence, which understates the active chasing the other sources describe.

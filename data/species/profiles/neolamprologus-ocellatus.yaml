        title: Sefc, K. M. (2011). Mating and parental care in Lake Tanganyika's cichlids. International Journal of Evolutionary Biology 2011, 470875.
        url: https://doi.org/10.4061/2011/470875
        accessed: 2026-10-12
  husbandry:
    text: A trio of one male and two females needs a tank of about 60 litres with at least 60 cm of floor length; a single pair manages with a little less. Use fine sand at least five centimetres deep, as the fish dig constantly, and offer more empty shells than there are fish. Cleaned edible snail shells work well. Keep the water hard and alkaline, ideally pH 8.0 to 8.5 and around 24 to 27 C. Regular partial water changes are important, but new water should match the tank in temperature and chemistry because the species reacts badly to sudden swings. Rocks are optional and are best kept away from the shell bed so that tankmates have their own zone. A cover is not critical, as the fish stay near the bottom.
    sources:

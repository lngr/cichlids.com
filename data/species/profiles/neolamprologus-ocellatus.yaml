      rationale: Wild fish are light brown and males carry yellow fin edges, and the common Gold morph is yellow, so brown and yellow describe the species better than grey. The body has no bars, stripes or spot pattern apart from the gill cover spot, so the pattern is plain; checker-b chose mixed only because the sources it read did not describe the pattern.

      note: Original combination of Steindachner (1909).
    - name: Lamprologus ocellatus
      note: Combination used by Maréchal and Poll (1991), FishBase, Seriously Fish and most hobby literature; Konings (2015, 2019) writes 'Lamprologus' ocellatus.
    - name: Lamprologus lestradei
      note: Poll, 1943, described from Rumonge, Burundi; junior synonym.
  legacyNames:
    - Neolamprologus ocellatus
  note: The Catalog of Fishes lists the species as valid in Neolamprologus, and the Cichlid Room Companion uses the same name with Lamprologus lestradei as synonym. FishBase, Seriously Fish, tanganyika.si and most hobby sources file it under Lamprologus. Lamprologus ocellatus Poll, 1952 is an unrelated, preoccupied name for the species known as Neolamprologus kungweensis and must not be confused with this one. The Lamprologus genus list of the Catalog of Fishes holds no current ocellatus entry.

      rationale: "Generator, checker-b and checker-c proposed pH 7.8 to 9.4; checker-a proposed 7.5 to 9.4. These proposals agree within the pipeline threshold of 0.3, giving unanimous 4 of 4 verification and the median lower bound 7.8, with medium confidence. Aqua-Fish and Practical Fishkeeping give 7.8 to 9.0; the upper bound includes the required natural maximum. The decision is narrower at the low end than FishBase and Akvaforum at 7.4 to 8.4 and FishProfiles at 7.6 to 8.6. Those recommendations are retained without assuming that the lowest suggested pH is a demonstrated long-term limit."
    - field: "features.ghDgh.tolerance"

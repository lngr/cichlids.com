  diet:
    text: "The most defensible staple diet is small animal prey. CRC identifies crustaceans and insects, and aquarium accounts use small frozen or live invertebrates alongside appropriately sized prepared food. A varied menu can include small crustaceans, insect larvae and zooplankton. The profile conservatively treats fry and very small fish as potential prey, while no verified evidence establishes regular fish hunting by valid L. hecqui. No special high-protein bloat sensitivity is documented; this does not remove the need to avoid overfeeding and deteriorating water quality."

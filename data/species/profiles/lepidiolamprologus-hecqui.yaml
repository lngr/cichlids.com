    rationale: "The decided natural envelope remains 10 to 13 dGH with waterbody verification and high confidence. Surface calcium and magnesium in the FAO annual-cycle work yield about 11.1 to 11.5 dGH, the north-basin seasonal means in Cohen et al. about 12.2 dGH, and the older FAO ion compilation about 11.3 dGH. The lake envelope accommodates measured variation and rounding. Aquarium recommendations reaching 20 to 30 dGH describe a different quantity, the husbandry tolerance."

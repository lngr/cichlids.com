  habitat:
    text: "The type locality is near Albertville, now Kalemie, on the Congolese shore of Lake Tanganyika; the specialist locality account identifies Kasenge Bay. A broad lake distribution appears in FishBase, but the taxonomic review does not regard later collections as confirmed hecqui. Sand and shell association are plausible from CRC, FishBase and related species, rather than detailed field observations of a verified living population. The adopted natural lake envelope is 23 to 29 C, pH 8.4 to 9.4, GH 10 to 13 dGH and alkalinity 15 to 20 dKH. These regional measurements do not establish a precise collecting-site microhabitat."

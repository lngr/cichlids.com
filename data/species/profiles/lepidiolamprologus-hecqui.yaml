  problems:
    text: "The principal uncertainties are mistaken identity and the resulting transfer of care observations between different fish. Confirm provenance before interpreting an aquarium observation as evidence about valid L. hecqui. In trade-labelled stock, limited floor space, rival males and insufficient retreats can lead to persistent chasing or injury. Food caught among shells and inadequate oxygenation can undermine otherwise suitable chemistry. GH and KH are separate measures; a general hardness recommendation cannot be converted into an alkalinity limit. Longevity is only a care estimate of 5 to 7 years, and the low-confidence hardness endpoints have not been established by long-term trials."

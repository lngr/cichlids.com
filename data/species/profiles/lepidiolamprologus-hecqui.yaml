  sizeAndGrowth:
    text: "The practical aquarium maxima used here are 8 cm for males and 4.5 cm for females. The female value is the median of the four proposals, between FishBase's 4 cm and the larger estimates in aquarium care accounts. Neither sex-specific maximum is established by a series of verified wild specimens: the unique holotype measures 5.7 cm. Reports of larger trade-labelled fish remain uncertain, and no reliable species-specific growth curve or maturity schedule was found."

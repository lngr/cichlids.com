partners:
  suitable:
    - species: "Cyprichromis leptosoma"
      reason: "Midwater habitat reduces direct competition for shells; compatibility is inferred from genus-level aquarium guidance."
      condition: "Use a larger tank meeting the shoal's own requirements and separate its swimming area from the shell patch."
    - species: "Paracyprichromis nigripinnis"
      reason: "A possible different-zone companion retained as a low-confidence planning suggestion, without a verified hecqui pairing trial."
      condition: "Provide suitable vertical structure and enough room for the group to avoid the defended shell area."
    - species: "Julidochromis transcriptus"
      reason: "A possible rock-zone companion with a clearly separated territory; breeders may attack one another near the boundary."
      condition: "Use a larger footprint with an open gap between rocks and shells, and monitor breeding aggression."
  unsuitable:
    - species: "Neolamprologus multifasciatus"
      reason: "Direct shell competition and the conservative fry-predation decision make shared shell beds unsuitable."
    - species: "Neolamprologus leleupi"
      reason: "Treat overlapping bottom territories as unsuitable in the minimum harem aquarium; this is not a claim that every larger community combination fails."
    - species: "Altolamprologus calvus"
      reason: "Treat as unsuitable in the minimum harem aquarium because overlapping bottom activity and brood predation add risk; larger separated communities are reported only conditionally."
profile:
  overview:
    text: "Lepidiolamprologus hecqui is a valid Lake Tanganyika cichlid historically listed as Neolamprologus hecqui. Its identity matters more than its familiar aquarium name suggests: the confirmed material is a single museum holotype, while later fish bearing the name have been assigned to other taxa. CRC reports no aquarium maintenance of the valid species. This profile therefore separates established taxonomy and lake chemistry from provisional husbandry guidance for trade-labelled fish. Such aquarium stock is usually described as an assertive shell-associated invertivore, with males around 8 cm and smaller females."
    sources:
      - kind: "database"
        title: "FishBase species summary: Lepidiolamprologus hecqui"

  aggressionHeterospecific:
    value: 2
    confidence: "low"
    rationale: "Generator and checker-c proposed level 2; checker-a and checker-b proposed level 3. The rubric distinguishes attacks beyond a territory from defense of a nest. Practical Fishkeeping and Quality Marine describe strong attacks around shells or fry, while also allowing companions in separated areas. Those accounts do not establish persistent pursuit throughout an adequately sized tank. Level 2 therefore best fits the described context, with low confidence and a clear warning that an intruder near a brood may still be injured."

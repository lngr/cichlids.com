    confidence: "medium"
    rationale: "The Catalog of Fishes and FishBase agree on Lake Tanganyika. Generator proposed broad littoral shell beds; checker-a proposed Kasenge Bay on the northwest shore, checker-b Kasenge Bay as type locality, and checker-c Kasenge Bay with the lake name as waterbody alias. The canonical lake id and Kasenge Bay, near Albertville, now Kalemie, are retained. Ronco et al. describe the holotype as the only confirmed specimen and later hecqui collections as reassigned to other species, so FishBase's wider distribution and confident aquarium-habitat descriptions are not treated as confirmed locality records."

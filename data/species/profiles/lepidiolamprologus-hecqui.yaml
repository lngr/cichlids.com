  maxSizeCm:
    value:
      male: 8
      female: 4.5
    confidence: "low"
    rationale: "All four runs proposed 8 cm for males; generator and checker-a proposed 5 cm for females while checker-b and checker-c proposed 4 cm. The coordinate-wise median is therefore 8 cm and 4.5 cm, retained as the practical adult aquarium maximum. FishBase gives 8 cm male or unsexed and 4 cm female, Aqua-Fish gives males 6 to 8 and females 4.5 to 6 cm, and Quality Marine describes females around 5 cm. FishProfiles gives 8 cm for both sexes, while a keeper reports a male around 8.9 cm; these wider claims remain source evidence rather than typical maxima. The confirmed holotype is only 5.7 cm and cannot establish adult maxima. Confidence is low because the aquarium measurements may concern lookalikes."

  husbandry:
    text: "For the recommended unit of one male and three females, use at least 100 litres with an 80 by 35 cm footprint. This is a planning estimate supported by aquarium recommendations, not an experimentally established minimum. Spread suitable empty shells across several areas of fine sand so subordinate fish can retreat; the minimum applies to the harem alone. Maintain clean, well-oxygenated alkaline water and make changes gradually. The adopted tolerance envelopes are 23 to 29 C, pH 7.8 to 9.4, GH 7 to 28 dGH and KH 13 to 20 dKH. The hardness envelopes have low confidence, and common care targets lie nearer 24 to 27 C, pH 7.8 to 9 and GH 10 to 20 dGH. Their broad endpoints are not a reason to move fish away from conditions in which they are already thriving."

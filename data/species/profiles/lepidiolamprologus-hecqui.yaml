  socialBehavior:
    text: "Aquarium recommendations differ between a pair and a male with several females. This profile uses one male with three females as its planning unit, with low confidence because it has not been verified for living true hecqui. Avoid crowding rival males, and distribute shells so each female can withdraw from persistent attention. Reports of bullying support conspecific aggression level 3. Territorial defense centers on a small shell patch and becomes stronger around a brood; separating an excluded fish may become necessary if it cannot feed or shelter safely."

      rationale: "Generator, checker-b and checker-c proposed 15 to 20 dKH; checker-a 10 to 22; tiebreaker-1 11 to 22; tiebreaker-2 10 to 20. With no four-vote agreement the tally selects the median minimum 12.5 rounded to 13 and median maximum 20, retaining median verification, 3 of 6 agreeing votes and low confidence. The decision includes natural 15 to 20 dKH. It is narrower than the Tanganyika.si general aquarium range of 11 to 22 and Monitarium's species-labelled 10 to 20; Practical Fishkeeping gives 8 to 18 for Tanganyika aquaria generally and Aquarium.tools 12 to 18. A breeding aquarium reports KH 10, which remains evidence outside the decision rather than grounds to change the settled median. Aqua-Fish gives no numeric KH limit, and neither FishBase GH nor Practical Fishkeeping's unspecified hardness figure can establish KH. The retained interval is a provisional planning envelope, not an experimentally demonstrated limit."
    - field: "features.maxSizeCm"

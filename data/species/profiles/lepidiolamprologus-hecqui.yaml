  khDkh:
    value:
      min: 15
      max: 20
    confidence: "high"
    rationale: "The decided natural envelope remains 15 to 20 dKH with high confidence and no verification object. KH here means aquarium-test alkalinity rather than only calcium and magnesium carbonate hardness. FAO reports bicarbonate and carbonate titrations that underpin the rounded lake envelope; its separate ion ranges are not treated as paired station extrema. Cohen et al. give north-basin alkalinity equivalent to 18.2 to 18.5 dKH, and the older FAO compilation about 18.8 dKH. The high alkalinity can exceed GH because other cations also balance bicarbonate."

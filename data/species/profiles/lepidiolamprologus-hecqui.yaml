      rationale: "Generator, checker-b and tiebreaker-2 proposed level 0; checker-a, checker-c and tiebreaker-1 proposed level 1. Neither camp reaches four votes, so the tally conservatively selects the higher level 1 with 3 of 6 agreeing votes and low confidence. CRC describes invertebrate foods without directly excluding fish prey. TankBud claims fry consumption in aquarium stock, but documents neither specimens nor observations. The source reporting small cichlids in stomach contents concerns Lepidiolamprologus sp. meeli southeast, a different taxon often traded as hecqui, and is retained only as proxy evidence. The result cautions about fry and fish around 2 cm rather than asserting regular adult-fish hunting by verified L. hecqui."

  sexing:
    text: "Aquarium males are generally reported as larger and heavier through the head, with females remaining smaller. These are trade-stock clues, not validated diagnostic characters for true hecqui. Juvenile size, fin shape or bold behavior alone cannot establish sex, and no confirmed color difference is known from the museum-based species. Observe mature fish over time and treat a purchased pair designation as provisional."

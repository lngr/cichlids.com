  aggressionConspecific:
    value: 3
    confidence: "low"
    rationale: "All four initial runs propose level 3. Practical Fishkeeping describes dominant males bullying subordinate males, and Quality Marine reports similar aquarium experience. This supports substantial injury risk when rivals cannot retreat, rather than peaceful group living. Aqua-Fish also contains a peaceful headline classification, which conflicts with its own territorial care narrative and the more detailed accounts. The selected harem and separate shell patches address that risk, but the uncertain identity of aquarium stock keeps confidence low."

  breeding:
    text: "The planning category is shell-spawner. Hobby accounts describe females placing eggs inside a shell and males defending the surrounding area, but these reports concern fish identified by the aquarium name. CRC's broader protected-substrate category is consistent with that possibility and does not verify the full sequence. Pair and harem arrangements are both reported. Published hobby hatch schedules disagree, so no exact incubation or free-swimming timetable is adopted. Any observed spawn should be documented together with the identity and origin of the adults."

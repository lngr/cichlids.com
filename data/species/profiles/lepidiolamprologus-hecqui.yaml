      rationale: "Generator proposed 10 to 20 dGH; checker-a 7 to 20; checker-b 7 to 30; checker-c 10 to 25; tiebreaker-1 and tiebreaker-2 each 7 to 30. No proposal reaches four agreeing votes, so the tally uses the median of minima, 7, and maxima, 27.5 rounded to 28, with median verification, 3 of 6 agreeing votes and low confidence. The decision includes the natural 10 to 13 dGH. It is narrower than the 7 to 30 source range in FishBase, FishProfiles and Akvaforum, but broader than Aqua-Fish and Monitarium at 10 to 20, Practical Fishkeeping at 15 to 25, and the Tanganyika.si general recommendation of 8 to 20. A breeding aquarium reports GH 14. These care targets and one-point observations do not establish multi-year physiological endpoints, and possible shared source material limits independence."

  compatibility:
    text: "The tally does not require a species-only aquarium. Midwater Tanganyika companions or rock dwellers may be workable where their own space requirements are met and shell and rock territories are well separated. These are conditional suggestions from aquarium accounts, not verified species-specific trials. Other shell dwellers compete for the same shelter, and their fry may be taken. Breeding adults can injure fish approaching the shell patch even though the chosen heterospecific aggression level describes territorial exclusion. No hybrid group is supported by the available records; the empty list does not guarantee reproductive isolation."

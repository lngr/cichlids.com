  diet:
    value:
      type: aufwuchs
      bloatSensitive: true
      foods:
        - spirulina-based flakes and pellets
        - blanched vegetables
        - algae and biocover
        - zooplankton and small crustaceans such as Mysis, Daphnia and Artemia as a supplement
    confidence: low
    verification:
      method: conservative
      votes: {agree: 3, total: 5}
    rationale: >-
      The votes did not settle: the generator proposed aufwuchs with bloat sensitivity, checker-a
      and both tie-breakers omnivore with bloat sensitivity and checker-b omnivore without it. The
      conservative rule takes the strictest type, aufwuchs, and sets bloat sensitivity because
      four votes report it; the confidence is low. Most votes and several sources describe a
      mixed natural diet: the Cichlid-Forum profile names algae-rich biocover as the main food,
      Seriously Fish describes fish rising into open water for zooplankton and asks for live and
      frozen food next to vegetable matter, and FishBase gives the closest relative P.
      taeniolatus aufwuchs plus small invertebrates and zooplankton. The aufwuchs classification
      is the cautious reading for tank planning: it calls for a plant-based, low-protein staple,
      which suits this fish, with animal food as a supplement. Bloat sensitivity rests on
      Seriously Fish, which calls meaty foods harmful to P. taeniolatus in the long run, and on
      hobby pages for this fish that warn of bloat on rich protein.

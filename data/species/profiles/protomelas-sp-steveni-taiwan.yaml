  ghDgh:
    value: {min: 3, max: 5}
    confidence: high
    verification:
      method: waterbody
      waterbody: lake-malawi
    rationale: >-
      Lake Malawi endemic; the natural total hardness is the lake range, calculated from measured
      calcium and magnesium: 4.2 to 4.6 dGH in the upper 50 m of the north basin (Branchu and
      co-workers) and 3.2 to 4.9 dGH in the 1960s titrations compiled by FAO. The lake is soft;
      care sheets that call it hard confuse hardness with alkalinity.
    sources: *lakeSources
    evidence:
      - source: *branchu
        value: {min: 4.2, max: 4.6}
        note: upper 50 m of the north basin, from calcium and magnesium
      - source: *vdb
        value: {min: 3.2, max: 4.9}
        note: 1960s titrations, from calcium and magnesium
    tolerance:
      value: {min: 3, max: 20}
      confidence: low
      verification:
        method: qualified-majority
        votes: {agree: 4, total: 5}
      rationale: >-
        Four of five votes (checker-a, checker-b and both tie-breakers) set 3 to 20 dGH; the
        generator proposed 3 to 25 dGH. The lower bound is the soft lake water the fish lives in.
        For the upper bound, Seriously Fish gives 10 to 25 dGH, but uses the same generic figure
        for P. taeniolatus and P. fenestratus; FishBase lists 9 to 19 for P. fenestratus, OATA 12
        to 18 for Malawi cichlids in general and hobby sites 10 to 18 or 10 to 20. The decided
        upper bound follows the bulk of these values and is narrower than the 25 dGH of Seriously
        Fish. The Cichlid-Forum profile only asks for hard water without a figure. No source
        tested the limits, hence low confidence.
      sources:
        - *sf
        - &sfTaen
          kind: database
          title: "Seriously Fish: Protomelas taeniolatus"
          url: https://www.seriouslyfish.com/species/protomelas-taeniolatus/
          accessed: 2026-10-13
        - *fbFen
        - *oata
        - *branchu
        - *guidarium
        - *fishprofiles
        - &gensou
          kind: website
          title: "Gensou: Protomelas Steveni Taiwan Reef care guide"
          url: https://gensou.sg/?p=32658
          accessed: 2026-10-13
        - *fishipedia
      evidence:
        - source: *sf
          value: {min: 10, max: 25}
          note: aquarium recommendation for this species
        - source: *sfTaen
          value: {min: 10, max: 25}
          note: relative; the same range is given for P. fenestratus
        - source: *fbFen
          value: {min: 9, max: 19}
          note: related species, given as dH
        - source: *oata
          value: {min: 12, max: 18}
          note: general care sheet for Malawi cichlids
        - source: *branchu
          value: {min: 4.2, max: 4.6}
          note: lake water the species lives in
        - source: *guidarium

      decision: ["Protomelas spec. \"steveni Taiwan\""]
      rationale: The legacy catalog spells the name with double quotes; the spelling is kept exactly.
    - field: features.origin.value.localities
      proposals:
        - by: generator
          value: ["Taiwan (Taiwanee) Reef, Mozambique, north of Chizumulu Island", "Higga Reef, Tanzania", "Ngkuyo Island, Mbamba Bay, Tanzania"]
        - by: checker-a
          value: ["Taiwan (Taiwanee) Reef, Mozambican waters about 15 km north of Chizumulu Island", "Higga Reef, Tanzania", "Mbamba Bay Island (Ngkuyo Island), Tanzania"]
        - by: checker-b
          value: ["Taiwan Reef (Taiwanee Reef), central Lake Malawi, Mozambique side", "Higga Reef, Tanzania (population thought to be the same)", "Mbamba Bay Island (Ngkuyo), Tanzania (population thought to be the same)"]
      decision: ["Taiwan (Taiwanee) Reef, Mozambican waters north of Chizumulu Island", "Higga Reef, Tanzania", "Ngkuyo Island (Mbamba Bay Island), Tanzania"]
      rationale: >-
        The three proposals name the same sites. The distance to Chizumulu differs between
        Konings (about 7 km) and Oliver (about 15 km), so the locality names leave it out and the

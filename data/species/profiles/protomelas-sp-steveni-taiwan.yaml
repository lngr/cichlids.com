        - by: checker-b
          value: {male: 18, female: 15}
      decision: {male: 17, female: 14}
      rationale: >-
        Seriously Fish gives 14 cm standard length, about 17 cm total length, and Guidarium
        separates 17 cm males from 14 cm females; the 18 cm of the Cichlid-Forum profile and the
        nearly 20 cm of Konings describe the largest fish. The female size of checker-b is an
        estimate without a source figure.

legacyIds: [825]
status: undescribed

taxonomy:
  validName: "Protomelas sp. 'Steveni Taiwan'"
  genus: Protomelas
  species: null
  author: null
  source: &cof
    kind: catalog-of-fishes
    title: "Eschmeyer's Catalog of Fishes, species of the genus Protomelas (22 nominal species)"
    url: https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Protomelas
    accessed: 2026-10-13
  synonyms:
    - name: "Protomelas sp. 'Taiwan Reef'"
      note: Trade name after the reef where the fish was found, which the local fishermen call Taiwanee.
    - name: "Protomelas fenestratus 'Taiwan Reef'"
      note: >-
        Trade label that sells the fish as a form of P. fenestratus; Konings and Seriously Fish
        regard it as a distinct, undescribed species.
    - name: Protomelas steveni
      note: >-
        Trade label without nomenclatural standing. The Catalog of Fishes lists no nominal species
        steveni in Protomelas; the only available name with this epithet is Aulonocara steveni
        Meyer, Riehl and Zetzsche 1987, an unrelated peacock and a synonym of Aulonocara
        stuartgranti.
  legacyNames:
    - "Protomelas spec. \"steveni Taiwan\""
  note: >-
    The Catalog of Fishes (genus Protomelas, accessed 2026-10-13) lists 22 nominal species, 17 of
    them valid, and none named steveni or matching this fish, so it remains undescribed. Konings
    discovered it at Taiwanee Reef and placed it in the "Steveni" group, the hobby name for
    P. taeniolatus and its close relatives. Its anatomy is closest to P. taeniolatus, but it has a
    much larger eye and a different ground colour, while the broad vertical bars recall
    P. fenestratus; unlike that species it was not seen blowing water into the biocover to
    expose prey. Seriously Fish, the Malawi Cichlid Homepage and the Cichlid Room Companion treat
    it as undescribed as well. Aulonocara steveni, a synonym of Aulonocara stuartgranti in the
    Catalog of Fishes, is a different fish. FishBase has no entry for this form.


        note: takes zooplankton in open water and live foods in the tank; no fish mentioned
      - source: *cf
        value: 0
        note: herbivore feeding on biocover, peaceful towards other species
      - source: *fbTaen
        value: 0
        note: relative feeds on aufwuchs, small invertebrates and zooplankton
      - source: *fbFen

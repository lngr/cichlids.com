    - field: features.aggressionConspecific
      proposals:
        - by: generator
          value: 3
        - by: checker-a
          value: 2
        - by: checker-b
          value: 2
      decision: 2
      rationale: >-
        Seriously Fish describes very territorial males and forceful courting, but all sources
        set the condition that solves it, one male with several females and enough space; the
        Cichlid-Forum profile rates the fish mildly aggressive towards its own kind and no source
        reports frequent injuries under these conditions. Level 2 describes exactly this case;
        the rationale names the risk of injuries with the wrong ratio.
    - field: features.territory
      proposals:
        - by: generator
          value: {size: large, breedingOnly: true}
        - by: checker-a
          value: {size: large, breedingOnly: true}
        - by: checker-b
          value: {size: large, breedingOnly: false}
      decision: {size: large, breedingOnly: true}
      rationale: >-
        Seriously Fish states that the fish becomes territorial when breeding, and the reef
        territories of the field accounts are display sites of breeding males; the size is
        undisputed.
    - field: features.habitatZones
      proposals:
        - by: generator
          value: [rock, openWater]
        - by: checker-a
          value: [rock, openWater]
        - by: checker-b
          value: [rock, sand]
      decision: [rock, openWater]
      rationale: >-
        The reef is sediment-free (Cichlid-Forum profile, Konings), and Seriously Fish describes
        the fish rising into the water column for zooplankton. Sand is a recommended aquarium
        substrate and a possible spawning site in the tank, not a zone the fish uses in the wild.
    - field: features.coloration
      proposals:
        - by: generator
          value: {baseColors: [blue, yellow, red], pattern: mixed}
        - by: checker-a
          value: {baseColors: [blue, red, yellow], pattern: bars}
        - by: checker-b
          value: {baseColors: [grey, red], pattern: bars}
      decision: {baseColors: [blue, yellow, red], pattern: bars}
      rationale: >-
        The adult male is blue, yellow to golden and red; grey was a guess of checker-b, who could
        not read a description of the male body colour. Konings and Oliver describe broad
        vertical bars as the basic pattern of the species, partly masked in fully coloured males,
        so bars is chosen over mixed.
    - field: features.minTank
      proposals:
        - by: generator
          value: {volumeL: 300, lengthCm: 150, depthCm: 50}
        - by: checker-a
          value: {volumeL: 240, lengthCm: 120, depthCm: 45}
        - by: checker-b
          value: {volumeL: 205, lengthCm: 120, depthCm: 45}
      decision: {volumeL: 240, lengthCm: 120, depthCm: 45}
      rationale: >-
        Konings and Seriously Fish both give 120 cm as the minimum length for a male with
        several females, Seriously Fish with a depth of 45 cm; the volume of about 240 litres
        leaves room above the 205 litres of Seriously Fish towards the 280 to 380 litres that
        Guidarium and Oliver prefer. A 150 cm tank is recommended in the husbandry text but not
        required by the sources.
    - field: features.lifespanYears
      proposals:
        - by: generator
          value: {min: 6, max: 10}
        - by: checker-a
          value: {min: 8, max: 12}
        - by: checker-b
          value: {min: 5, max: 10}
      decision: {min: 6, max: 10}
      rationale: >-
        Only low-weight sources exist (a retailer with 5 to 8 years, a care page with 8 years);
        6 to 10 years lies between these figures and the general experience with Malawi haps of
        this size, and stays low in confidence.

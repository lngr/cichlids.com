  khDkh:
    value: {min: 5, max: 8}
    confidence: high
    rationale: >-
      Lake Malawi endemic; the natural carbonate hardness is the lake range, calculated from the
      measured alkalinity: 6.5 to 6.9 dKH in the profiles of Branchu and co-workers and 5.6 to 7.3
      dKH in the 1960s data compiled by FAO. Bicarbonate is partly balanced by sodium, so the
      carbonate hardness exceeds the total hardness.
    sources: *lakeSources
    evidence:
      - source: *branchu
        value: {min: 6.5, max: 6.9}
        note: north basin profiles, from alkalinity
      - source: *vdb
        value: {min: 5.6, max: 7.3}
        note: 1960s titrations, from alkalinity
    tolerance:
      value: {min: 5, max: 12}
      confidence: low
      verification:
        method: qualified-majority
        votes: {agree: 4, total: 5}
      rationale: >-
        Four of five votes agree on an upper bound of 10 to 12 dKH (checker-a proposed 5 to 10,
        checker-b and both tie-breakers 5 to 12), which gives 5 to 12 dKH; the generator proposed
        5 to 15. No species database states a carbonate hardness for this fish or its relatives.
        OATA advises 10 to 15 dKH for Malawi cichlids in general, wider than the decided range; a
        care guide for this fish asks for 8 to 12 dKH and one for P. taeniolatus for 6 to 10. The
        lower bound is the lake value. Stable buffering matters more than the exact figure,
        because the pH depends on it.
      sources:
        - *oata
        - *branchu
        - *vdb
        - *gensou
        - &gensouTaen
          kind: website
          title: "Gensou: Protomelas taeniolatus care guide"
          url: https://gensou.sg/protomelas-taeniolatus-care-guide/
          accessed: 2026-10-13
        - kind: model-knowledge
          title: General aquarium practice for buffering Lake Malawi tanks
      evidence:
        - source: *oata
          value: {min: 10, max: 15}
          note: general care sheet for Malawi cichlids
        - source: *branchu
          value: {min: 6.5, max: 6.9}
          note: lake water the species lives in
        - source: *vdb
          value: {min: 5.6, max: 7.3}
          note: lake water, 1960s titrations
        - source: *gensou
          value: {min: 8, max: 12}
          note: aquarium recommendation for this species
        - source: *gensouTaen
          value: {min: 6, max: 10}
          note: close relative; aquarium recommendation
        - source:
            kind: model-knowledge
            title: General aquarium practice for buffering Lake Malawi tanks
          value: {min: 8, max: 12}
          note: common buffering target for Malawi tanks, no species-specific source


variants:
  - name: Taiwan (Taiwanee) Reef
    kind: locality
    note: Population at the reef that gave the trade name, an isolated offshore reef north of Chizumulu Island in Mozambican waters.
  - name: Chimoto Red
    kind: locality
    note: Nearly identical population from Higga Reef, Tanzania, thought to be the same species.
  - name: Chimoto Yellow
    kind: locality
    note: Nearly identical population from Ngkuyo Island at Mbamba Bay, Tanzania, thought to be the same species.
  - name: Albino
    kind: color-morph
    note: Captive line; albino fry have appeared in aquarium spawns.

features:
  origin:
    value:
      continent: Africa
      region: Lake Malawi
      waterbody: Lake Malawi
      localities:
        - Taiwan (Taiwanee) Reef, Mozambican waters north of Chizumulu Island
        - Higga Reef, Tanzania
        - Ngkuyo Island (Mbamba Bay Island), Tanzania
    confidence: high
    rationale: >-
      Endemic to Lake Malawi. Konings found the fish on Taiwanee Reef, an isolated rocky reef
      north of Chizumulu Island that is cut off from the island by water deeper than 100 m; he
      gives the distance to Chizumulu as about 7 km, while Oliver places the reef about 15 km
      north of the island and some 30 km west of the Mozambican shore. Almost identical fish from
      Higga Reef and Ngkuyo Island near Mbamba Bay on the Tanzanian coast are thought to be the
      same species. The public page of the Cichlid Room Companion confirms the reef in
      Mozambique.

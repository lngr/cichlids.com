partners:
  suitable:
    - species: Copadichromis borleyi
      reason: Peaceful open-water hap of similar size with a different shape and colour; no crossing risk.
    - species: Otopharynx lithobates
      reason: Calm rock-associated hap of similar size, kept with it in long-term community tanks.
    - species: Aulonocara stuartgranti
      reason: Peaceful peacock that care sheets recommend as a tankmate; keeps to the lower zones.
      condition: Only one male of each species with its own females, in a tank of at least 150 cm.
    - species: Labidochromis caeruleus
      reason: Mild mbuna that does not harass larger haps; often kept with it according to keeper reports.
      condition: Feed a low-protein, plant-based diet that suits both.
    - species: Cyrtocara moorii
      reason: Peaceful, slow-moving sand-dwelling hap that stays out of the rock territories.
      condition: Tank of at least 180 cm, since C. moorii grows larger.
  unsuitable:
    - species: Protomelas taeniolatus
      reason: Close relative of the same Steveni group with similar females; the two may hybridise.
    - species: Protomelas fenestratus
      reason: Close relative with similar barred females; the trade even sells the Taiwan Reef fish as its form, and they may hybridise.
    - species: Melanochromis auratus
      reason: Very aggressive mbuna that harasses a gentle hap and its females.
    - species: Tropheus moorii
      reason: Lake Tanganyika species that is kept in species-only groups and needs different water and diet.
    - species: Astronotus ocellatus
      reason: South American soft-water predator that grows far larger and can swallow juveniles and females.

profile:
  overview:
    text: >-
      Protomelas sp. 'Steveni Taiwan', sold as Taiwan Reef, is one of the most colourful
      haplochromines of Lake Malawi and still has no scientific name. Ad Konings discovered it on
      an isolated offshore reef that the local fishermen call Taiwanee, and the trade name grew
      out of a misheard version of that name. It belongs to the "Steveni" group around Protomelas
      taeniolatus, and shops sometimes label it as a form of P. fenestratus. Adult males combine a
      metallic blue head, a golden body and a red anal fin, while females stay silvery with dark
      bars. In the aquarium it is a calm, robust hap for spacious Malawi communities with gentle
      companions, kept as one male with several females. Its main demands are room, a plant-based
      diet and keeping it apart from its close relatives, with which it may cross.
    sources:
      - *pfk
      - *sf
      - *oliver
  habitat:
    text: >-
      The species is known from three isolated rocky sites in the eastern half of Lake Malawi.
      Taiwanee Reef rises from deep water north of Chizumulu Island in Mozambican waters, cut off
      from the island by water more than 100 m deep and swept by strong currents when the
      south-east wind blows. Almost identical fish live at Higga Reef and Ngkuyo Island near
      Mbamba Bay on the Tanzanian coast. Territorial males sit on top of large rocks, mostly
      deeper than 15 to 20 m, while females roam in loose groups in shallower water, and the fish
      leave the rock to pick zooplankton from open water. The water is very clear, warm (about 21
      to 29 °C over the year), soft at 3 to 5 dGH, yet alkaline at pH 7.7 to 8.6 with 5 to 8 dKH.
      Taiwanee Reef has few other rock dwellers; the small yellow mbuna Pseudotropheus saulosi
      lives there too.
    sources:
      - *pfk
      - *oliver
      - *sf
      - *branchu
      - *vdb
      - *eccles
  sizeAndGrowth:
    text: >-
      Well-kept males usually reach about 17 cm total length, and exceptional males approach
      20 cm. Females stay smaller at roughly 14 cm. Juveniles are grey-silver with dark bars and
      conspicuously large eyes, which Konings links to life in deeper water. Young males gain the
      blue head, the golden flanks and the red anal fin gradually, and full colour appears once a
      male becomes dominant; subordinate males may stay drab while a stronger rival is present.
      Retail figures of 12 to 15 cm describe fish that have not finished growing.
    sources:
      - *sf
      - *pfk
      - *cf
      - *guidarium
  husbandry:
    text: >-
      A group of one male and three or more females needs a tank of at least 120 cm length, 45 cm
      depth and about 240 litres; 150 cm and 300 litres or more give the male room for a proper
      territory and make life easier for the females. Build stacks of rock with caves where
      brooding females can hide, add several flat stones on which a male can display, and leave
      open water above and a sand floor in front. Keep the temperature at about 24 to 27 °C and
      the pH between 7.8 and 8.5. Stable alkalinity matters more than high general hardness: the
      lake itself is soft, and the fish copes with a wide hardness range. The species reacts badly
      to dirty water, so strong filtration and large weekly water changes are essential.
    sources:
      - *sf
      - *pfk
      - *oliver
      - *oata
      - *guidarium
      - *imperial
  socialBehavior:
    text: >-
      Males are territorial and court females with intense colour and displays. A male ready to
      spawn chases females hard, so several females are needed to spread his attention, and rocks
      must give them places to escape. Two males in one tank only work in very large aquaria,
      since wild males defend rock tops of well over a metre. Towards other species the fish is
      gentle: it pushes others away from its spawning site but does not hunt them through the
      tank. It copes with moderate pressure from mild mbuna, yet constant harassment by rough
      species keeps it shy and pale. Females and young males live peacefully in loose groups.
    sources:
      - *sf
      - *pfk
      - *oliver
      - *cf
      - *arch15767
  diet:
    text: >-
      In the lake the fish feeds mainly on loose algae and the small life of the biocover on rock
      surfaces and also takes zooplankton in open water. In the aquarium a good flake or pellet
      with spirulina or other plant ingredients should form the staple. Add blanched vegetables
      now and then and give small crustaceans such as Mysis, Daphnia or brine shrimp as a
      supplement a few times a week. Avoid mammalian meat, rich protein pellets and frequent
      bloodworm, since haps of this group are prone to bloat on such food. Feed small portions
      once or twice a day, because related species eat greedily and put on weight easily.
    sources:
      - *cf
      - *sf
      - *fbTaen
      - *sfTaen
      - *imperial
  breeding:
    text: >-
      Breeding follows the usual pattern of Malawi mouthbrooders. A ripe male chooses a flat
      stone or digs a shallow pit in the sand, colours up strongly and leads females there. The
      female lays her eggs in small batches and picks them up into her mouth, where they are
      fertilised. She carries the brood for about three weeks without eating and then releases
      small fry. Brooding females should rest in a quiet spot or a separate tank, but moving them
      can make them spit or swallow the brood. Adult fish chase and eat free fry in a community
      tank. Freshly hatched brine shrimp and microworms are suitable first foods. Albino fry have
      appeared in captive spawns and are the origin of the albino line.
    sources:
      - *sf
      - *pfk
      - *arch14612
  sexing:
    text: >-
      Adult males are easy to tell apart. They are larger and show a metallic blue head and back,
      a yellow to golden flank and a bright red anal fin, and their dorsal, anal and pelvic fins
      are longer and more pointed. Females are smaller, silvery grey to brownish and marked with
      broad dark vertical bars, a pattern they share with juveniles. Young males look like
      females for a long time and gain colour gradually, and a subordinate male can stay in
      female-like dress. Juveniles cannot be sexed reliably, so buying a group of six to eight
      young fish and later removing surplus males is the common way to build a harem.
    sources:
      - *sf
      - *oliver
      - *imperial
  compatibility:
    text: >-
      The best companions are peaceful Malawi haps and calm peacocks of similar size, such as
      Copadichromis borleyi, Otopharynx lithobates, Aulonocara stuartgranti and, in larger tanks,
      Cyrtocara moorii. Mild mbuna like Labidochromis caeruleus also work. Keep only one male per
      Aulonocara or Copadichromis species so that territories do not overlap. Avoid very
      aggressive mbuna such as Melanochromis auratus, which wear down this gentle fish. Never
      combine it with other members of the Steveni group, especially Protomelas taeniolatus and
      P. fenestratus: the females look nearly identical and the species may cross. Large
      predatory haps can eat its juveniles, and fish from other lakes or continents need
      different water and diets. Fry and fish below about 2 cm are at risk from it.
    sources:
      - *sf
      - *sfFen
      - *pfk
      - *cf
  problems:
    text: >-
      The most common mistake is a diet that is too rich: protein-heavy pellets and frequent
      bloodworm can lead to Malawi bloat, a swollen belly with loss of appetite. A plant-based
      staple reduces the risk. Poor water quality shows quickly in this fish, often first as faded
      colour and reduced appetite, so regular large water changes are important. Newly bought
      juveniles sometimes spit food out for a few days while they settle. Too few females, too
      small a tank or two males in a medium tank lead to battered females and stressed males.
      Mixing it with P. taeniolatus or P. fenestratus produces hybrids that spoil both lines, so
      buy from breeders who keep the species separate and know the origin of their stock.
    sources:
      - *sf
      - *sfTaen
      - *imperial
      - &arch456
        kind: archive
        title: cichlids.com forum thread 456
        url: https://www.cichlids.com/disc/read.php?1,456
        accessed: 2026-10-13


  predation:
    value: 1
    confidence: low
    verification:
      method: conservative
      votes: {agree: 3, total: 5}
    rationale: >-
      The votes did not settle: the generator, checker-a and tiebreaker-1 proposed level 1,
      checker-b and tiebreaker-2 level 0, so the conservative rule takes the higher level 1 with
      low confidence. No source records fish in the diet of this species or its relatives: it
      feeds on the biocover of the rocks and on zooplankton in open water (Cichlid-Forum profile,
      Seriously Fish), and FishBase describes P. taeniolatus as an aufwuchs feeder that also
      takes small invertebrates and zooplankton; Dierickx and Snoeks describe the genus as
      short-jawed, with only the paedophage P. krampus specialised on eggs and larvae. Levels 2
      and 3 are therefore excluded. The case for level 1 is that an adult of about 17 cm that
      takes small animal prey will snap up free-swimming fry within reach; a hobby site lists the
      species as a fry predator and a keeper in the cichlids.com archive saw adults lunge at
      freshly released fry, both of low weight.
    sources:
      - *sf
      - *cf
      - *fbTaen
      - *fbFen
      - *sfTaen
      - &ejt
        kind: literature
        title: "Dierickx, K. and Snoeks, J. (2020). Protomelas krampus, a new paedophagous cichlid from Lake Malawi. European Journal of Taxonomy 672 (genus description)."
        url: https://doi.org/10.5852/ejt.2020.672
        accessed: 2026-10-13
      - *pfk
      - *guidarium
      - &arch14612
        kind: archive

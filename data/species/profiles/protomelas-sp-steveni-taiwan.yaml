  temperatureC:
    value: {min: 21, max: 29}
    confidence: high
    verification:
      method: waterbody
      waterbody: lake-malawi
    rationale: >-
      The species is endemic to Lake Malawi, so the natural range is the measured range of the
      lake. Eccles found 21 °C inshore in the cool, windy season and about 27 °C in the upper 60 m
      by May; Vollmer and co-workers report about 23.5 °C in the winter mixed layer and 28 °C at
      the surface in summer, and later surveys found up to 29 °C at the surface. Territorial males
      live mostly below 15 to 20 m, where the water lies in the middle of this range.
    sources: &lakeSources
      - &branchu
        kind: literature
        title: >-
          Branchu, P., Bergonzini, L., Ambrosi, J.-P., Cardinal, D., Delalande, M.,
          Pons-Branchu, E. et al. (2010). Hydrochemistry (major and trace elements)
          of Lake Malawi (Nyasa), Tanzanian Northern Basin: local versus global
          considerations. Hydrology and Earth System Sciences Discussions 7,
          4371-4409.
        url: https://hess.copernicus.org/preprints/7/4371/2010/hessd-7-4371-2010.pdf
        accessed: 2026-10-12
      - &vdb
        kind: literature
        title: >-
          Vanden Bossche, J.-P. and Bernacsek, G. M. (1990). Source book for the
          inland fishery resources of Africa, Vol. 1, CIFA Technical Paper 18/1,
          FAO. Lake Malawi/Nyasa: physical and chemical data after Jackson et al.
          (1963) and Talling and Talling (1965).
        url: https://www.fao.org/4/t0473e/T0473E05.htm
        accessed: 2026-10-12
      - &eccles
        kind: literature
        title: >-
          Eccles, D. H. (1974). An outline of the physical limnology of Lake
          Malawi (Lake Nyasa). Limnology and Oceanography 19(5), 730-742
          (abstract).
        url: https://doi.org/10.4319/lo.1974.19.5.0730
        accessed: 2026-10-12
      - &vollmer2005
        kind: literature
        title: >-
          Vollmer, M. K., Bootsma, H. A., Hecky, R. E., Patterson, G., Halfman,
          J. D., Edmond, J. M., Eccles, D. H. and Weiss, R. F. (2005). Deep-water
          warming trend in Lake Malawi, East Africa. Limnology and Oceanography
          50(2), 727-732.
        url: https://www.dora.lib4ri.ch/empa/dload/empa:1253/PDF/view
        accessed: 2026-10-12
      - kind: literature
        title: >-
          Vollmer, M. K., Weiss, R. F. and Bootsma, H. A. (1999). Lake
          Malawi/Nyasa deep water renewal. In: Bootsma, H. A. and Hecky, R. E.
          (eds.), Water Quality Report, SADC/GEF Lake Malawi/Nyasa Biodiversity
          Conservation Project, chapter 4.
        url: https://sites.uwm.edu/hbootsma/files/2020/11/Ch4-Lake-Internal-Mixing.pdf
        accessed: 2026-10-12
      - kind: literature
        title: >-
          Ngochera (2018). Carbon Dynamics in Tropical Lake Malawi. PhD
          dissertation, University of Wisconsin-Milwaukee.
        url: https://minds.wisconsin.edu/handle/1793/91765
        accessed: 2026-10-12
    evidence:
      - source: *eccles
        value: {min: 21, max: 27}
        note: cool-season inshore minimum and upper 60 m in May
      - source: *vollmer2005
        value: {min: 23.5, max: 28}
        note: winter mixed layer to summer surface water
    tolerance:
      value: {min: 21, max: 29}
      confidence: medium
      verification:
        method: unanimous
        votes: {agree: 3, total: 3}
      rationale: >-
        All three votes set the tolerance to 21 to 29 °C. Care sheets for this fish recommend a
        narrower, steady band of about 24 to 28 °C (Seriously Fish, the Cichlid-Forum profile and
        hobby sites), and the general Malawi care sheet of OATA gives 23 to 27 °C. The tolerance
        must contain the lake range, and the fish lives through 21 to 29 °C over the seasons in
        the wild, so the tolerance equals the natural range; no source supports keeping it
        permanently outside it. Keepers should aim for the middle, about 24 to 27 °C.

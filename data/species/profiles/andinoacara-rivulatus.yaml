  temperatureC:
    value: {min: 20, max: 28}
    confidence: low
    rationale: >-
      The five votes did not settle on one range: generator 22 to 30 C, checker-a 20 to 28 C,
      checker-b 20 to 25 C, tiebreaker-1 20 to 28 C and tiebreaker-2 22 to 30 C. No proposal found
      four agreeing votes, so the vote count uses the median method for natural water ranges. The
      minima 22, 20, 20, 20 and 22 have the median 20 C, the maxima 30, 28, 25, 28 and 30 have the
      median 28 C, which gives 20 to 28 C. The decided range is narrower than the measured habitat,
      which spans about 19 to 34 C. Capture sites of wild fish had 19.7 to 24.7 C in the Babahoyo
      River (Gonzalez et al. 2021) and single readings of 19.2 C in the fast Quevedo River and
      26.1 C in the Mocache River (Gonzalez-Martinez et al. 2021). The lowland rivers of the Guayas
      basin below 250 m averaged 26.0 C with a range of 22.6 to 34 C at the end of the dry season,
      the extremes depending on the time of day (Damanik-Ambarita et al. 2016), and the Carrizal
      River in Manabí had 25.9 to 27.9 C. The warmest midday readings above 28 C are short-term
      peaks that the tolerance of 20 to 28 C does not exceed either. The 22.5 to 28.2 C of Musilová et al. (2009) belong to the sister species
      A. stalsbergi in Peru, and the 22 to 30 C of the Santiago-Cayapas study come from a basin
      north of the range whose rare A. rivulatus record may refer to another Andinoacara. The 20 to
      24 C in FishBase come from an aquarium atlas and are no habitat value. No temperature series
      from a documented locality over a full year was found, hence the low confidence.

    rationale: >-
      All three runs agree. Adults are metallic green to turquoise with wavy blue lines on the
      cheeks and a broad orange to golden margin on dorsal and caudal fin. Dark scale centres form
      rows of fine horizontal lines on the flanks, combined with a dark midlateral blotch and mood
      dependent bars, so the pattern is mixed. A. stalsbergi differs by a white margin and a
      reticulate scale pattern (Musilová et al. 2009).

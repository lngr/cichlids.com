    value: [rock, sand, wood]
    confidence: medium
    rationale: >-
      The runs agree on rock and sand and differ on wood and plants. Wild fish live in streams,
      main channels and pools of coastal rivers and in floodplain wetlands, in slow, shallow water
      near the banks over sand, gravel or mud, and spawn on large stones near the shore. Méndez-
      Martínez et al. (2021) describe them feeding near rocks with vegetation. In the tank the
      species needs sand for digging, flat stones as spawning sites and wood or rock as visual
      barriers (Seriously Fish). Rooted plants are uprooted, so plants are no zone the species

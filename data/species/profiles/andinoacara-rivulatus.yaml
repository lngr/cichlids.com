  ph:
    value: {min: 6.6, max: 8.2}
    confidence: medium
    rationale: >-
      The three votes agree within 0.3 pH (generator 6.6 to 8.5, checker-a 6.6 to 8.2, checker-b
      6.5 to 8.0); the vote count takes the median bounds, 6.6 to 8.2. The habitat is neutral to
      slightly alkaline. Capture rivers of wild fish measured pH 7.0 to 7.3 in the Babahoyo River
      and 7.11 to 8.23 in the Mocache, Pintado and Quevedo rivers. Guayas basin rivers below 250 m
      ranged from 6.6 to 8.9 with a mean of 7.7; the readings above 8.2 come from algae-rich,
      nearly stagnant lowland sites. The Carrizal River in Manabí averaged 7.8 to 7.9, and 28 Andean
      Pacific rivers from northern Ecuador to southern Peru range from 6.6 to 7.8 (Moquet et al.
      2018). Fishipedia's 6 to 7 for the habitat cites no measurement, and the 6.5 to 8.0 of
      FishBase is an aquarium value. The confidence stays medium because no series from a
      documented locality exists.
    sources:
      - *limno
      - *water2016
      - *aveiga
      - &moquet
        kind: literature
        title: >-
          Moquet, J.-S., Guyot, J.-L., Morera, S., Crave, A. et al. (2018). Temporal variability and
          annual budget of inorganic dissolved matter in Andean Pacific rivers located along a
          climate gradient from northern Ecuador to southern Peru. Comptes Rendus Géoscience
          350(1-2), 76-87.
        url: https://doi.org/10.1016/j.crte.2017.11.002
        archived: doi.org/10.1016_j.crte.2017.11.002/2026-10-12T203034Z
        accessed: 2026-10-12
      - *brycon
      - *gonzalez
      - *fb

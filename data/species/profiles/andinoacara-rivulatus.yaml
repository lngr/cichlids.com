  ghDgh:
    value: {min: 2, max: 12}
    confidence: low
    rationale: >-
      The five votes did not settle on one range: generator 2 to 12 dGH, checker-a 2 to 9 dGH,
      checker-b 4 to 25 dGH, tiebreaker-1 1 to 14 dGH and tiebreaker-2 1 to 10 dGH. No proposal found
      four agreeing votes, so the vote count uses the median method for natural water ranges. The
      minima 2, 2, 4, 1 and 1 have the median 2 dGH, the maxima 12, 9, 25, 14 and 10 have the
      median 12 dGH, which gives 2 to 12 dGH. No hardness titration from a documented collecting
      site exists. The only measured total hardness comes from the Carrizal River system in
      Manabí, 1.3 to 13.6 dGH at single stations with monthly means near 6.7 dGH (Aveiga Ortiz et
      al. 2019), a wider span than the decided range; foothill rivers and streams at La Maná in the
      upper Guayas basin had 6.3 to 9.2 dGH. Conductivities in the Guayas lowlands (mean 263 uS/cm)
      and at the Babahoyo capture site (about 145 uS/cm) point to soft to moderately hard water of
      roughly 2 to 8 dGH, an estimate and no measurement. The decided range covers these values;
      the tolerance of 2 to 25 dGH covers softer and harder water. The very soft Santiago-Cayapas rivers lie north of
      the range, the 15 to over 40 dGH of Peruvian waters belong to A. stalsbergi, and the 25 dGH
      of FishBase is an aquarium figure.
    sources:
      - *aveiga
      - &lamana
        kind: literature
        title: >-
          Reascos, M., Ortega, B., Luna, R. and Salazar, A. (2025). Calidad del agua utilizada para
          sistemas de riego en la zona alta de La Maná, Ecuador. Revista de investigación
          Agropecuaria Science and Biotechnology 5(4), 11-24.
        url: https://doi.org/10.25127/riagrop.20254.1128
        archived: doi.org/10.25127_riagrop.20254.1128/2026-10-12T203006Z
        accessed: 2026-10-12
      - *limno
      - *brycon
      - *gonzalez
      - *moquet
      - *cayapas
      - *fishipedia
      - *fb
    evidence:

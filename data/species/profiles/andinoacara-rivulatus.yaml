    value: 3
    confidence: medium
    rationale: >-
      All three runs agree on level 3. Seriously Fish and the Maidenhead Aquatics data bank report
      that a male put together with an unfamiliar or unready female often injures or kills her,
      and both recommend raising a group of juveniles or using a divider. Fishipedia notes that
      males do not tolerate each other. A pair that forms on its own lives together and shares
      brood care, but the male may turn on the female when fry are removed early. Injuries follow
      mainly from wrong introductions and too little space, which is level 3; keepers in the
      archive report a wide individual range from calm to very aggressive fish.

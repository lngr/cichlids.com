status: described

taxonomy:
  validName: Andinoacara rivulatus
  genus: Andinoacara
  species: rivulatus
  author: (Günther, 1860)
  source: &cof
    kind: catalog-of-fishes
    title: Eschmeyer's Catalog of Fishes, species list of the genus Andinoacara (entries rivulata, Chromis; stalsbergi; blombergi)
    url: https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Andinoacara
    archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-edb10200/2026-10-14T094407Z
    accessed: 2026-10-12
  synonyms:
    - name: Chromis rivulata
      note: Original combination, Günther 1860, Andes of western Ecuador.
    - name: Aequidens rivulatus
      note: Combination in use until the species was placed in Andinoacara (Musilová et al. 2009); common in the trade and in aquaculture papers.
    - name: Acara aequinoctialis
      note: Regan 1905, western Ecuador; objective junior synonym according to the Catalog of Fishes.
    - name: Aequidens azurifer
      note: Fowler 1911, affluent of the Río Chimbo near Bucay, Guayas Province, Ecuador; junior synonym.
  legacyNames:
    - Aequidens rivulatus
  note: >-
    The Catalog of Fishes lists Andinoacara rivulatus (Günther 1860) as valid, distributed on the
    Pacific slope of Ecuador and Peru; the genus list of Aequidens holds no rivulatus entry. The
    trade name green terror covers more than one species. A. rivulatus in the strict sense is the
    gold saum (Goldsaum) fish with a broad orange to golden margin on dorsal and caudal fin, from
    western Ecuador to the Tumbes and Zarumilla drainages of northernmost Peru. The silver saum
    (Silbersaum) fish with a white fin margin and a reticulate scale pattern is Andinoacara
    stalsbergi Musilová, Schindler & Staeck 2009 from the Peruvian coast, which part of the older
    aquarium literature treated as the true rivulatus. Fish from the Esmeraldas basin of
    north-western Ecuador belong to Andinoacara blombergi Wijkmark, Kullander & Barriga Salazar
    2012, so range statements that start at the Río Esmeraldas include that species, and it may
    also turn up under the trade name. This profile describes A. rivulatus in the strict sense;
    photos and forum posts of the legacy entry 605 may show A. stalsbergi as well as A. rivulatus.

names:
  trade:
    en: [Green terror, Gold saum, Gold saum green terror]
    de: [Goldsaumbuntbarsch, Goldsaum-Buntbarsch]
    es-419: [Vieja azul, Vieja]

variants:
  - name: Gold saum
    kind: color-morph
    note: >-
      The wild-type colouring of this species with an orange to golden fin margin; it separates
      A. rivulatus from the white-edged A. stalsbergi sold under the same trade name.
  - name: Río Tumbes
    kind: locality
    note: Wild form from the southern end of the range in extreme northern Peru.
  - name: Guayas basin (vieja azul)
    kind: locality
    note: Wild fish of the lowland rivers and wetlands of the Guayas basin, a local food fish.

features:
  origin:
    value:
      continent: South America
      region: Pacific slope of western Ecuador and extreme northern Peru
      waterbody: null
      localities:
        - Guayas basin (Daule, Babahoyo, Vinces, Quevedo and Chimbo rivers)
        - Abras de Mantequilla wetland, Los Ríos
        - Coastal rivers of Manabí and El Oro, Ecuador
        - Río Santa Rosa basin, Ecuador
        - Río Zarumilla and Río Tumbes basins, Ecuador and Peru
    confidence: high
    rationale: >-
      All three runs agree on the Pacific slope of western Ecuador and extreme northern Peru. The
      Catalog of Fishes gives the Pacific slope of Ecuador and Peru, Musilová et al. (2009) place the
      species in Ecuador and the Tumbes and Zarumilla area of Peru, and Fishipedia names the Guayas,
      Santa Rosa, Zarumilla and Tumbes basins. The Freshwater Fishes of Western Ecuador database and
      FishBase still start the range at the Río Esmeraldas, an older concept that includes what is
      A. blombergi; that northern part is left out. Field studies take wild fish in the Quevedo,
      Mocache and Babahoyo areas and in the Abras de Mantequilla wetland of the Guayas basin. The
      species is introduced in Guerrero and Morelos in Mexico (Catalog of Fishes) and in the Zamora
      basin of Amazonian Ecuador (Western Ecuador database after Musilová et al. 2015).

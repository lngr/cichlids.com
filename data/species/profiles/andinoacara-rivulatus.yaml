partners:
  suitable:
    - species: Pterygoplichthys gibbiceps
      reason: Large armoured catfish that the green terror cannot swallow or seriously injure; it uses the bottom at night.
      condition: Tank of at least 600 litres with caves for the catfish.
    - species: Metynnis argenteus
      reason: Fast, deep-bodied schooling characin that is too big to eat and acts as a dither fish.
      condition: Group of six or more in a tank of at least 650 litres; risky while the pair breeds.
    - species: Barbonymus schwanenfeldii
      reason: Large, fast and robust barb that keeps out of the territory and is too big to eat.
      condition: Very large tank, at least 200 cm long.
  unsuitable:
    - species: Andinoacara stalsbergi
      reason: Sister species sold under the same name; fights like a conspecific, and a cross cannot be ruled out although none is documented.
    - species: Andinoacara pulcher
      reason: Smaller, similar-looking relative that is treated as a rival and bullied; crosses are claimed in the hobby but not documented.
    - species: Paracheirodon innesi
      reason: Small tetras fit easily into the mouth of an adult and are eaten.
    - species: Symphysodon aequifasciatus
      reason: Slow, shy feeder that needs warmer, softer water and is harassed and outcompeted.
    - species: Lake Malawi mbuna
      reason: They live in harder, more alkaline lake water and need a plant-based diet; the constant aggression on both sides causes stress and injuries.
    - species: Parachromis dovii
      reason: Much larger, highly aggressive piscivore that injures or kills the green terror.

profile:
  overview:
    text: >-
      The green terror is a large, colourful South American cichlid from the Pacific side of the
      Andes in western Ecuador and the far north of Peru. Adults shine metallic green and
      turquoise, carry blue lines on the cheeks and a broad orange to golden edge on the dorsal
      and tail fins, which gives the species its German name Goldsaum. Mature males grow a fatty
      hump on the forehead and become much larger than females. The trade name green terror is
      also used for the Peruvian sister species Andinoacara stalsbergi, which has a white fin
      edge, and fish from the Esmeraldas basin belong to a third species, A. blombergi; these
      should not be mixed. Green terrors are hardy and intelligent, but they are territorial and
      can be rough with tankmates and partners. They suit keepers who can offer a large tank and
      are ready to plan pairing and companions with care. In Ecuador the species is also a valued
      food fish called vieja azul.
    sources:
      - *cof
      - *musilova
      - *fwe
      - *sf
  habitat:
    text: >-
      The species lives in the coastal lowlands west of the Andes, from the Guayas basin and the
      rivers of Manabí and El Oro in Ecuador to the Tumbes and Zarumilla rivers just across the
      Peruvian border. It is common there in small streams, the main channels and pools of
      larger rivers, and in floodplain wetlands such as Abras de Mantequilla, mostly in slow,
      shallow water near the banks over sand, gravel or mud and near rocks. Spawning takes place
      on large stones near the shore. Water measured in rivers where the fish are caught is
      neutral to slightly alkaline (pH about 6.6 to 8.2) and soft to moderately hard. Its
      temperature varies with altitude, season and time of day: cool foothill rivers stay near
      20 C, while lowland rivers often reach 26 to 28 C. The natural range used for this species
      is 20 to 28 C. Fish from the Esmeraldas basin in the north belong to a separate
      species, A. blombergi. Escaped or released green terrors have settled in Mexico and in the
      Amazonian part of Ecuador.
    sources:
      - *fwe
      - *limno
      - *brycon
      - *gonzalez
      - *ochoa
      - *luz
      - *piesiewicz
      - *cof
      - *crc
  sizeAndGrowth:
    text: >-
      Males usually reach 20 to 25 cm in the aquarium; exceptional fish grow close to 30 cm.
      Females stay clearly smaller at around 18 cm. In wild fisheries in Ecuador most fish caught
      are 15 to 22 cm long. The size gap between the sexes opens early: in one farm cohort,
      eight-month-old males were already about two thirds longer than their sisters. Fish become
      sexually mature at about 10 to 15 cm, and the forehead hump of males becomes visible from
      roughly 10 to 12 cm onwards. The large final size of males determines the tank size, so a
      young pair of small fish in a medium tank will outgrow it within a couple of years.
    sources:
      - *fb
      - *fk
      - *sf
      - *ochoa
      - *mendez
      - *hu
  husbandry:
    text: >-
      A pair needs a tank of at least 150 cm length with a 45 cm wide base, about 300 litres; a
      mixed tank should be considerably bigger. Use soft sand, because green terrors dig a lot,
      and add flat stones as spawning sites plus wood and rock to create visual barriers. Rooted
      plants are dug out, so use epiphytes such as Anubias or Java fern tied to decor and floating
      plants for shade. Water chemistry is not critical: the species stays healthy over years at
      20 to 28 C, pH 6.5 to 8.5 and a general hardness of about 2 to 25 dGH. Clean water matters
      more, since the species is sensitive to deteriorating water quality. Strong biological
      filtration and generous weekly water changes are the basis of good health. A sturdy lid and
      secured heaters help, as large males can be boisterous when they rearrange the tank.
    sources:
      - *sf
      - *fk
      - *fb
      - *fishipedia
  socialBehavior:
    text: >-
      Green terrors live as pairs. Adults of the same species are rivals, and a male placed
      together with a female that is not ready to spawn may chase her to death. The safest way to
      get a pair is to raise five or six juveniles together and let two fish pair off, then move
      the others out. With adult fish, a clear divider for several weeks lets them get used to
      each other before contact. Within a bonded pair, both parents defend the brood; the male
      patrols the border while the female stays close to eggs and young. Towards other species a
      single fish holds a large territory and chases intruders, and a breeding pair can become
      dangerous to anything in a normal-sized tank. Individual temperament varies widely, and some
      gold saums are calmer than their reputation.
    sources:
      - *sf
      - *fk
      - *fishipedia
      - *hu
      - *t29792
  diet:
    text: >-
      In the wild the green terror feeds mainly on invertebrates such as insects and their larvae,
      worms and crustaceans, and it takes small fish when it can. In the aquarium it accepts
      almost everything. A good cichlid pellet or stick makes a sound staple; add frozen foods
      such as mysis, krill and mosquito larvae, chopped prawns, mussel meat and earthworms, and
      some vegetable matter like blanched peas or spinach. Avoid beef heart and other red meat,
      which harm the digestive system and pollute the water, and do not overfeed rich food: the
      species is treated as sensitive to bloat, so tankmates that need a protein-heavy diet are a
      poor match. Feed several small meals rather than one large one. Because green terrors eat
      fast and greedily, slow tankmates may go short. Live feeder fish are unnecessary and bring a
      risk of disease.
    sources:
      - *fbfood
      - *gonzalez
      - *li
      - *fwe
      - *sf
      - *fk
  breeding:
    text: >-
      Breeding is straightforward once a compatible pair exists. Condition the pair with plenty of
      frozen food; a large water change with slightly cooler water often triggers spawning. The
      pair cleans a flat stone, a flowerpot or a pit in the sand, and the female lays rows of eggs
      that the male fertilises, several hundred per clutch. The female fans and guards the eggs
      while the male defends the area. After three to four days the larvae hatch and are moved
      into pits; roughly a week later they swim free and take Artemia nauplii and fine powdered
      food. Leave the fry with the parents for four to six weeks. Removing them early can make the
      male push for a new spawning and turn on an unready female. Remove other fish before
      spawning, as parents attack them.
    sources:
      - *sf
      - *fk
      - *fb
      - *hu
      - *piesiewicz
  sexing:
    text: >-
      Adult males are clearly larger than females and develop a fatty hump on the forehead, which
      in aquarium fish is often permanent and very large. Males also grow longer, pointed tips on
      the dorsal and anal fins, while those of females stay shorter and rounder. Colour is not a
      reliable guide: females can be just as bright, and dominance and mood change the intensity
      in both sexes. Juveniles are hard to sex. In a group of young fish the faster-growing
      individuals are usually males, and the hump becomes visible from roughly 10 to 12 cm.
      During spawning the short, blunt genital papilla of the female and the pointed one of the
      male confirm the sex.
    sources:
      - *sf
      - *fk
      - *fwe
      - *hu
      - &t27742
        kind: archive
        title: cichlids.com forum thread 27742
        url: https://www.cichlids.com/disc/read.php?1,27742
  compatibility:
    text: >-
      Green terrors combine only with fish that are too large to eat and robust enough to take a
      chase. In tanks of 650 litres or more, a single fish or a pair can live with other sturdy
      cichlids of similar size, big armoured catfish, silver dollars or large barbs. Small tetras,
      livebearers and dwarf cichlids are food or victims. Avoid slow, delicate species such as
      discus, and keep Lake Malawi cichlids apart because they need different water and diet.
      Do not mix green terrors with the white-edged Andinoacara stalsbergi or with blue acaras:
      the look-alikes provoke fights, and crosses cannot be ruled out although none is documented.
      Once a pair spawns, even suitable tankmates are at risk in a tank of normal size, so a
      breeding pair is best kept alone.
    sources:
      - *sf
      - *fk
      - *musilova
      - *sfpulcher
      - *t27359
  problems:
    text: >-
      The most common mistake is putting an adult male together with a strange female; he may
      kill her. Raise a group together or use a divider. A second mistake is a tank that is too
      small: a 25 cm male with tankmates in 200 litres leads to constant fighting. Breeding pairs
      in community tanks attack everything around them. Water quality is the main health factor.
      Farmed stocks kept crowded and with poor water suffer outbreaks of bacterial disease with
      loss of appetite, loss of balance, skin ulcers and deaths. Torn fins and wounds after fights
      are entry points for infections, so separate injured fish. Red meat such as beef heart
      upsets digestion and fouls the water. Ask an aquatic vet for diagnosis and treatment of sick
      fish.
    sources:
      - *sf
      - *fk
      - *luo


  husbandry:
    text: "Plan at least 500 litres with a footprint around 180 by 60 cm for one established adult pair.\
      \ This is a provisional planning minimum; additional large fish need extra space. Arrange stable\
      \ wood to break lines of sight and leave swimming room above sand. Provide mature filtration, oxygen\
      \ exchange and regular changes with prepared water. The selected aquarium envelopes are 25 to 30\
      \ C, pH 4.3 to 7, 0 to 10 dGH and 0 to 4 dKH. Their low confidence matters: endpoints are not equally\
      \ desirable daily targets. Warm, moderately acidic, soft water has stronger routine support than\
      \ continuous use of the extremes. KH above 2 has conflicting reports rather than a demonstrated\
      \ universal harm threshold. Prepare changes consistently and monitor chemistry in very low-buffer\
      \ systems."

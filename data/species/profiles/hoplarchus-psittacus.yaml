  habitat:
    text: "The species occurs in the Rio Negro and several other Amazon tributaries, as well as the upper\
      \ Orinoco drainage. Wooded margins, backwaters and connected lakes offer cover and feeding opportunities.\
      \ Rising water connects forest and river habitats; falling water concentrates fish again. Regional\
      \ measurements confirm that native blackwater can contain exceptionally little calcium, magnesium\
      \ and bicarbonate buffering. The natural values here describe sampled waters within the range, not\
      \ tests of the fish's physiological limits. Some surveyed tributaries are more acidic than the selected\
      \ mainstem range. Those extremes should not become automatic aquarium targets. Geographic map material\
      \ provides orientation only and contributes no water measurements. Regional reports include pH 2.9\
      \ to 4.2 in strongly humic Negro waters and Ramsar pH 3.2 to 5.3 with temperatures 28 to 31 C. These\
      \ broad observations do not establish occupied sites or preferred conditions for every population.\
      \ Mixed-water Lake Catalao means span 28.3 to 31.7 C and pH 5.86 to 7.47; they are comparison data,\
      \ not the species baseline."

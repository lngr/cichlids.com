  khDkh:
    value:
      min: 0
      max: 1
    confidence: low
    rationale: "The tally decides 0 to 1 dKH with low confidence. Generator and checker-a proposed 0 to\
      \ 1, checker-b 0 to 0.1 and checker-c 0 to 2 dKH. This is the rounded median of approximately agreeing\
      \ native-water proposals, not a claim of a measured one-degree upper limit. JBL's Negro and Atabapo\
      \ field tests read zero at kit resolution. Leenheer and Santos bicarbonate concentrations imply\
      \ about 0 to 0.00046 dKH, and the Manaus study's less affected stations about 0.056 to 0.28 dKH.\
      \ The wider Mariua 0.10 to 1.37 interval assumes total alkalinity expressed as CaCO3; organic-acid\
      \ contributions prevent equating it directly with carbonate hardness. Catalao bicarbonate equivalents\
      \ of 0.56 to 2.68 dKH describe mixed water. These uncertainties and the absence of a species-specific\
      \ seasonal series explain the practical interval. Low conductivity alone is not a KH measurement.\
      \ Natural KH carries no verification object."

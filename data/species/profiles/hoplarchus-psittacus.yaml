  sexing:
    text: "Colour alone is not a dependable way to buy a pair. Males tend to become larger and develop\
      \ a more prominent forehead; the importer also describes longer pelvic fins in dominant males. Females\
      \ commonly remain smaller and have a flatter head profile. These are tendencies, not an identification\
      \ key for every individual. A subordinate male can resemble a female closely enough to confuse a\
      \ keeper. Young fish are especially difficult to judge. A genuinely proven breeding pair is the\
      \ strongest practical option when reproduction is the goal. When raising juveniles together, arrange\
      \ future homes or additional space for adults that do not form a compatible pair."
    sources:

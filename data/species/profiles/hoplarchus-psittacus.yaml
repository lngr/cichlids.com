  problems:
    text: "Common trouble starts with a juvenile tank becoming an adult permanent home, an incompatible\
      \ pair or unsuitable companions. Persistent hiding, missing meals and repeated chasing deserve attention\
      \ before injuries develop. The importer specifically flags susceptibility to head and lateral-line\
      \ lesions and stresses hygiene. Such lesions are not a diagnosis by themselves: check water quality,\
      \ nutrition and social stress, and seek qualified assessment for persistent illness. Warm water\
      \ increases the importance of oxygen supply. Extremely soft water also needs careful monitoring\
      \ because small changes can alter pH markedly. The physiology literature shows that natural organic\
      \ matter affects acidic-water conditions; simply dosing acid does not recreate a healthy native\
      \ habitat."
    sources:
    - kind: website
      title: "Schaefer, F. Hoplarchus psittacus. Aquarium Glaser."

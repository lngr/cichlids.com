  breeding:
    text: "An established pair places eggs on an exposed firm surface and both parents defend the brood.\
      \ Reports include flat stones and solid substrate uncovered by digging. Soft acidic water and warmth\
      \ around 28 to 30 C are repeatedly associated with spawning. Published hobby accounts disagree about\
      \ clutch size, so no fixed egg count is promised here. Quiet conditions, suitable surfaces and reliable\
      \ water preparation are more useful than abrupt changes. Other inhabitants may need separation when\
      \ brood defense expands. Free-swimming young require small foods and dependable water care."

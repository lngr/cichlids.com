    rationale: "Tally method: qualified-majority. The settled tally retains omnivore with bloatSensitive\
      \ true by qualified majority (four of six) and medium confidence. Generator and checker-a proposed\
      \ invertivore with false; checker-b, checker-c, tiebreaker-1 and tiebreaker-2 proposed omnivore\
      \ with true. Lopez-Fernandez and colleagues directly examined adult wild-fish gut contents and identified\
      \ Hoplarchus as an omnivore consuming substantial detritus. This primary result outweighs the invertebrate-focused\
      \ FishBase and CRC summaries, which also acknowledge seasonal fish prey. No percentages are inferred\
      \ from unreadable table cells. Glaser and husbandry accounts support plant supplementation. AquaInfo\
      \ and Cichlid Atlas explicitly associate a sustained protein-heavy or poorly varied diet with bloat;\
      \ Atlarium describes illness under protein-only feeding without identifying a bloat diagnosis. These\
      \ secondary warnings have uncertain independence and no controlled feeding trial, so the sensitivity\
      \ flag is less secure than omnivory. Silence about bloat in CRC or FishBase establishes neither\
      \ susceptibility nor immunity. Foods follow the exact tally decision."

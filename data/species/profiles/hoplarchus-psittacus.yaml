    tolerance:
      value:
        min: 0
        max: 4
      confidence: low
      rationale: "The tally decides 0 to 4 dKH at low confidence as the median of all six proposals, because
        neither camp reaches a qualified majority: generator, checker-b and checker-c propose 0 to
        2, while checker-a, tiebreaker-1 and tiebreaker-2 propose 0 to 5 dKH. GarnelenTV recommends
        less than 2 dKH; this is a care recommendation, not a demonstrated toxicity threshold. Wider
        source recommendations remain evidence: Atlarium 1 to 5, Lone Star 2 to 8 and
        Cichlidamerique 2 to 12 dKH. A keeper lists seven wild-caught fish at 8 dKH without
        sufficient duration or health outcomes. WetWebMedia reports a sick fish exposed to 14 dKH,
        with several competing stressors, so neither account establishes a healthy chronic limit.
        CRC permits moderate hardness and pH 7 but does not quantify KH; neither GH nor pH may be
        converted into a KH tolerance. The range contains the natural range, keeps the soft
        blackwater character of the species and stays below the wider care-sheet values that lack
        health outcomes."

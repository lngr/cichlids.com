    rationale: "The settled tally selects pH 4.3 to 6 by unanimous approximate agreement, with a one-decimal\
      \ median of the agreeing bounds. Generator proposed 4.4 to 6, checker-a 4.5 to 6, checker-b 4.2\
      \ to 6 and checker-c 4 to 6. Direct native-drainage measurements take precedence over care recommendations:\
      \ Kuchler reports Negro mainstem values 4.42 to 5.8, Leenheer and Santos 4.2 to 4.9, and the Mariua\
      \ study seasonal means 4 to 4.2. FishBase and CRC supply a narrower general species summary of 5.5\
      \ to 6. The wider regional Negro-basin survey of 3.89 to 6.07, Ramsar range 3.2 to 5.3 and FEOW\
      \ range 2.9 to 4.2 are retained without treating their lowest regional observations as identified\
      \ Hoplarchus collection sites. The Catalao range 5.86 to 7.47 comes from mixed blackwater and whitewater,\
      \ not a demonstrated typical habitat for this fish. The tally is a practical typical-habitat representation\
      \ rather than an exhaustive map of native acidity."

  sizeAndGrowth:
    text: "Provide permanent adult housing before buying juveniles. Typical size accounts cluster around\
      \ the low thirties, with larger fish also reported. The planner uses 35 cm for males and a tentative\
      \ 25 cm for females. The female number rests on a retailer estimate and should not be used to restrict\
      \ turning room. Growth-rate records are sparse. The selected longevity estimate is 10 to 15 years,\
      \ with low confidence because sources offer expectations rather than verified lifetime records."

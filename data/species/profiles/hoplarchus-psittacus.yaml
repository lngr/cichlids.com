    rationale: "Generator proposed male 35 and female 25 cm, checker-a 32 and 28, checker-b 35 and 30,\
      \ and checker-c 35 and 25. Component medians are 35 and 26.5 cm. Retain 35 for males and adjust\
      \ the female estimate to 25 because the only explicit sex-specific source, GarnelenTV, gives males\
      \ 30 to 35 and females 20 to 25 cm; the 28 and 30 female proposals are inferences. Glaser confirms\
      \ smaller females without quantifying them. FishBase gives unsexed maxima 32 and 35 cm, while AquaInfo\
      \ and Aqua-Fish place usual adults around 26 to 33 cm and Glaser reports an overall upper size of\
      \ 40 cm. These do not validate a female maximum. The decision is a provisional typical aquarium\
      \ estimate rather than a record or a guarantee that females remain below 25 cm."

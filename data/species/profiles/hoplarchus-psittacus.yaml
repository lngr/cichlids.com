      rationale: "The tally retains 25 to 30 C with unanimous approximate agreement and low confidence.\
        \ Generator proposed 25 to 31, checker-a 25 to 30, checker-b 24 to 30.3 and checker-c 24 to 30\
        \ C; the bounds come from rounded medians of the agreeing proposals. Aqua-Fish and AquaInfo recommend\
        \ 25 to 30 C, whereas Glaser and NCS recommend maintenance at 24 to 28 C. Broader source readings\
        \ remain visible: Guidarium gives 26 to 30 C, GarnelenTV 26 to 30 C and the regional Ramsar account\
        \ 28 to 31 C. Warm spawning recommendations and natural exposure beyond 30 C do not establish\
        \ healthy long-term aquarium maintenance there. The decided interval contains the natural range;\
        \ no controlled chronic-temperature study was found."

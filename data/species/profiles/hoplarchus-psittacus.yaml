      \ medians are 485 L, 180 cm length and 60 cm depth. Adjust 485 to the explicit NCS recommendation\
      \ of 500 L while retaining the median footprint. CRC permits 300 L and 120 by 45 cm for a pair and\
      \ prefers 470 L and 180 cm with companions. Wider requirements remain evidence: Aqua-Fish 600 L\
      \ for a pair, AquaInfo 625 L and 250 cm, GarnelenTV 600 to 800 L and 200 cm, and Lone Star 100 US\
      \ gallons (378.5 L). Sixty centimetres of depth is an adult turning and separation allowance rather\
      \ than a measured minimum. The chosen volume is below the largest source recommendation and is a\
      \ provisional pair planning minimum; extra adults or other large species need more space."

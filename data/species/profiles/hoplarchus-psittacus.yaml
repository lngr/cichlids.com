partners:
  suitable:
  - species: Uaru amphiacanthoides
    reason: "Large, relatively peaceful South American cichlid with compatible warm soft-water maintenance\
      \ needs; PFK recommends Uaru as companions."
    condition: "Adult fish in a tank larger than the pair-only minimum, with separate feeding areas and\
      \ substantial vegetable food for Uaru."
  - species: Heros efasciatus
    reason: A concrete severum candidate within the large peaceful cichlid group recommended by PFK; adults
      have sufficient body size to avoid ordinary prey risk.
    condition: "Adult individuals, generous additional space and a plan to separate territorial breeding\
      \ pairs; species choice is an inference from the genus-level recommendation."
  - species: Satanoperca daemon
    reason: A large warm-water eartheater candidate within the Satanoperca companions suggested by PFK.
    condition: "Only in a much larger aquarium with sand, exceptional water quality and enough room for\
      \ the eartheaters own group; a species-level inference, not a guarantee."
  unsuitable:
  - species: Paracheirodon axelrodi
    reason: Suitable regional water chemistry does not remove the prey risk. Adult cardinals are well
      below the mouth-sized prey threshold for a 35 cm cichlid.
  - species: Maylandia lombardoi
    reason: Its alkaline-water husbandry and forceful territorial behaviour conflict with the soft acidic
      conditions and calmer community planned here.
  - species: Parachromis dovii
    reason: A much larger and highly aggressive piscivore creates an unacceptable attack and injury risk
      for a true parrot in an ordinary home setup.
profile:
  overview:
    text: "A true parrot cichlid is a substantial South American fish with a rounded forehead and green\
      \ to blue sheen. Red may develop around the throat and underside, while dark markings change with\
      \ age and mood. This profile concerns the wild species Hoplarchus psittacus, not the orange domestic\
      \ blood parrot. Its appeal comes with practical commitments: adult space, carefully chosen companions\
      \ and dependable water care. A compatible pair is the planning unit used here. Published accounts\
      \ also describe groups in considerably larger aquariums. No independently established locality or\
      \ colour forms were confirmed from the sources read, so none are listed as formal variants."
    sources:
    - kind: catalog-of-fishes
      title: "Eschmeyer's Catalog of Fishes: species of Hoplarchus"

    rationale: "Tally method: unanimous. The settled tally adopts 27 to 30 C by unanimous agreement within\
      \ the range tolerance, using the rounded median of agreeing bounds. Generator proposed 28 to 31,\
      \ checker-a 27 to 30, checker-b 27 to 30.3 and checker-c 26 to 30 C. FishBase and CRC give 27 to\
      \ 30 C; regional field observations independently support warm blackwater. The wider Ramsar envelope\

  ghDgh:
    value:
      min: 0
      max: 1
    confidence: medium
    rationale: "The tally retains 0 to 1 dGH by unanimous approximate agreement, with the rounded median\
      \ of agreeing bounds. Generator proposed 0 to 0.2, checker-a 0 to 1, checker-b 0 to 0.1 and checker-c\
      \ 0 to 1.5 dGH. Direct calcium and magnesium concentrations are stronger evidence than conductivity-based\
      \ estimates: dGH equals calcium in mg/L divided by 7.14 plus magnesium divided by 4.34. Kuchler\
      \ blackwater component bounds imply about 0.010 to 0.135 dGH, and Leenheer and Santos samples about\
      \ 0.038 to 0.060 dGH. Mariua seasonal mean hardness converts to 0.12 to 0.75 dGH assuming CaCO3\
      \ equivalents; its largest mean plus SD reaches about 1.23 dGH, underlying checker-c's wider 0 to\
      \ 1.5 proposal. The selected range is a practical very-soft-water estimate, not a precise cutoff.\
      \ FishBase's conflicting 5 to 10 dH is preserved but does not override measured blackwater chemistry.\
      \ Catalao values 0.31 to 1.18 dGH refer to a mixed-water lake. Zero denotes practical reporting\
      \ resolution rather than a complete absence of calcium or magnesium."
    sources:
    - kind: literature
      title: "Kuchler, I. L., Miekeley, N. and Forsberg, B. R. (2000). A contribution to the chemical\

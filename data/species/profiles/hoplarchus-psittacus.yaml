  socialBehavior:
    text: "Adult behaviour depends strongly on space and the relationships between individuals. An established\
      \ hierarchy can be fairly quiet, but crowding produces repeated disputes. A pair that has chosen\
      \ to remain together is a better starting point than two unsexed adults placed together abruptly.\
      \ Wood and visual barriers help, yet they cannot repair a consistently incompatible pairing. Observe\
      \ whether either fish is trapped near the surface or prevented from feeding. Keep an accessible\
      \ separation option. Parents can defend a much larger area during reproduction, so apparently settled\
      \ companions may need moving. Larger groups are an option for very large systems, not an alternative\
      \ stocking pattern for this pair-sized minimum."
    sources:
    - kind: website
      title: "Schaefer, F. Hoplarchus psittacus. Aquarium Glaser."

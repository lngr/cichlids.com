  temperatureC:
    value:
      min: 27
      max: 30
    confidence: medium
    rationale: "The settled tally adopts 27 to 30 C by unanimous agreement within the range tolerance,\
      \ using the rounded median of agreeing bounds. Generator proposed 28 to 31, checker-a 27 to 30,\
      \ checker-b 27 to 30.3 and checker-c 26 to 30 C. FishBase and CRC give 27 to 30 C; regional field\
      \ observations independently support warm blackwater. The wider Ramsar envelope of 28 to 31 C, JBL\
      \ surface readings of 30.3 and 30.4 C, and Mariua seasonal means of 26.5 to 29.8 C remain evidence\
      \ rather than reasons to change the tally. Lake Catalao means spanning 28.3 to 31.7 C describe mixed\
      \ water without a confirmed collection of this species. These data are drainage proxies with incomplete\
      \ seasonal coverage, not a measured species-wide thermal limit."

  compatibility:
    text: "Choose companions by adult size and behaviour as well as water chemistry. Practical Fishkeeping\
      \ suggests large peaceful South American cichlids such as Uaru, severums and Satanoperca. The named\
      \ candidates in this profile apply that general advice cautiously and need more space than the minimum\
      \ for the parrot pair alone. Small tetras can become food even when they share the same river system.\
      \ Highly aggressive large predators are a different hazard and may injure the parrots. The cichlids.com\
      \ archive search produced only an indirect discussion distinguishing true parrots from hybrids,\
      \ so it does not prove any particular combination. Breeding can upset an otherwise workable community.\
      \ The empty curated hybrid-group list reflects the settled evidence and does not establish that\
      \ crossing is biologically impossible. One ambiguously labelled retailer listing remains an unresolved\
      \ lead without identified scientific parents or a breeding account."
    sources:

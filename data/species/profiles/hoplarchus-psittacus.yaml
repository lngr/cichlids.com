  diet:
    text: "Use a varied diet containing both plant and animal material. Direct wild-fish gut analysis\
      \ supports omnivory and a substantial detrital component, while ecological summaries describe insects\
      \ and crustaceans with fish taken seasonally. Suitable captive foods include plant-containing cichlid\
      \ pellets, aquatic insects, crustaceans, earthworms and vegetable supplements. Small tankmates remain\
      \ prey even though this is not a fish-specialist diet. The planner flags bloat sensitivity because\
      \ husbandry accounts associate sustained protein-heavy, poorly varied feeding with digestive illness.\
      \ That warning has weaker evidence than the dietary classification and is not the result of a controlled\
      \ nutritional trial. Observe appetite, avoid excessive portions and ensure each fish obtains food."

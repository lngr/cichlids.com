  predation:
    value: 2
    confidence: medium
    verification:
      method: unanimous
      votes: {agree: 3, total: 3}
    rationale: >-
      All three votes give level 2. Feral flowerhorns eat fish: Herder et al. (2012) see in stomach
      contents a threat to the native fauna of Lake Matano through predation, and Hedianto and
      Sentosa (2019) found fish and fish eggs in the stomachs in every sampling month, though as a
      small share of 0.75 to 2.6 percent next to snails, insects and shrimp. Magalhães et al. (2017)
      cite predation on an endemic goby in Sulawesi. The maternal parent A. trimaculatus feeds on
      small fishes besides invertebrates (FishBase, Seriously Fish), and adult Midas cichlids eat
      snails, aufwuchs and fish (Barlow and Munsey 1976). Any fish that fits into the mouth is at
      risk in the tank, but fish are no main part of the diet, so level 3 does not apply.

  - name: Kamfa
    kind: color-morph
    note: Strain with a very large nuchal hump; King Kamfa and Kamfa x Malau crosses derive from it.
  - name: Zhen Zhu
    kind: color-morph
    note: Pearl-scaled strain with a rounded tail, large mouth and red eyes.
  - name: Golden Monkey
    kind: color-morph
    note: Highly priced strain with a golden to red body.
  - name: Golden Base
    kind: color-morph
    note: Group of strains, including faders and the golden trimac, that turn golden as they grow.
  - name: Thai Silk
    kind: color-morph
    note: Strain with a smooth, often white to pink body; barcoded with the other strains as A. trimaculatus lineage.
  - name: Kirin
    kind: color-morph
    note: Strain sampled in the COI barcoding study together with Cencu, Kamfa, Thai Silk, Parrot and Vieja types.

features:
  origin:
    value:
      continent: captive-bred
      region: Captive breeding in Malaysia from the 1990s; parent species from Central America and southern Mexico
      waterbody: null
      localities: []
    confidence: high
    rationale: >-
      The line has no natural range: all sources describe it as bred in captivity from Central
      American cichlids, and it was first seen in the Malaysian trade in the 1990s. The parents live
      in Pacific-slope rivers and lagoons of Mexico, Guatemala and El Salvador (A. trimaculatus), in
      the Nicaraguan Great Lakes and the Atlantic slope of Nicaragua and Costa Rica (A. citrinellus,
      A. labiatus) and on the Atlantic slope of Belize, Guatemala and southern Mexico (V. melanurus).
      Feral populations in Southeast Asia, such as in Lake Matano on Sulawesi, are introductions and
      not an origin.

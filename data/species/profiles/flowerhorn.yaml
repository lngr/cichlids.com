      Eggs are laid on a vertical slate, a flat piece of driftwood or in a rocky cave, the larvae are
      moved to pits dug in the sand, and both parents guard the brood for about six weeks. The
      maternal parent A. trimaculatus spawns on flat stones as well. The occasional use of a cave

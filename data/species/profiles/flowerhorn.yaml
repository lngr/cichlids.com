  aggressionConspecific:
    value: 4
    confidence: high
    rationale: >-
      Fishkeeper calls the flowerhorn exceptionally pugnacious, advises keeping it singly and warns
      that a male may kill a female that is not ready to spawn, so a divider must be at hand.
      Seriously Fish reports the same for the Midas parent, whose males often kill females added
      without a divider, and archive keepers agree that two fish in one tank fight. Pairs form only
      from juveniles raised together, and the surplus fish must then be removed.
    sources:
      - *fishkeeper
      - *sfCitrinellus
      - *fkMidas
      - *archive3537

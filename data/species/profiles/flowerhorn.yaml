legacyIds: [771]
status: domestic-form

taxonomy:
  validName: Flowerhorn
  genus: Amphilophus
  species: null
  author: null
  parents:
    - amphilophus-trimaculatus
    - amphilophus-citrinellus
    - amphilophus-labiatus
    - vieja-melanurus
  legacyNames:
    - Hybrid (man-made) Flowerhorn
  note: >-
    The flowerhorn is a line bred in captivity from crosses of several Central American cichlids.
    It has no scientific name and no natural range, and the Catalog of Fishes lists no name for it.
    The breeders never documented the pedigree. Published works name Amphilophus trimaculatus
    crossed with A. labiatus (Tarkhani et al. 2016, Abe et al. 2020) or with A. citrinellus
    (Magalhães et al. 2017, Manassila et al. 2025), and a COI barcoding study lists A. citrinellus,
    A. labiatus, Vieja melanurus and A. trimaculatus as the species crossed into the strains;
    V. melanurus enters through blood parrot lines, and Fishkeeper reports that Herichthys was
    later crossed in for pearl scales. All six strains barcoded by Sari et al. (2023) carry the
    mitochondrial lineage of A. trimaculatus, so the maternal line traces back to that species.
    The genus field holds Amphilophus as the genus of the main parents, not as a formal placement.
    The Catalog of Fishes lists A. trimaculatus (Günther 1867), A. citrinellus (Günther 1864),
    A. labiatus (Günther 1864) and V. melanurus (Günther 1862) as valid; Cichlasoma synspilum
    (Vieja synspila) is a synonym of V. melanurus. Since the line is selected and propagated in
    captivity, its status is domestic-form, with the reported parent species kept under parents.
  source:
    kind: catalog-of-fishes
    title: "Eschmeyer's Catalog of Fishes: species of Amphilophus"
    url: https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Amphilophus
    accessed: 2026-10-13


      - source: *fkw
        value: 3
        note: calls the flowerhorn semi-aggressive to aggressive and recommends pairs
      - source: *archive3537
        value: 4
        note: keepers advise against two fish in one tank

  aggressionHeterospecific:
    value: 4
    confidence: high
    rationale: >-

        method: conservative
        votes: {agree: 3, total: 6}
      rationale: >-
        The votes did not reach a qualified majority, so the vote count took the intersection of all
        proposals, widened to contain the natural range: generator 3 to 8, checker-a 4 to 16,
        tiebreaker-1 4 to 20, tiebreaker-2 3 to 12, tiebreaker-3 3 to 12 and tiebreaker-4 4 to 12
        dKH; checker-b gave no tolerance. The intersection is 4 to 8 dKH; the natural range 4 to 16
        dKH reaches higher, so the upper bound is widened to 16. The only care sheet that names a
        carbonate hardness, Modest Fish, gives 3 to 12 dKH, a keeper on MonsterFishKeepers advises

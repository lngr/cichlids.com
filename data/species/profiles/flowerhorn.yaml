      rationale: >-
        The task text of the agents named hybrid by mistake; the pipeline instructions and the schema
        name the flowerhorn as the example of domestic-form, a line bred and selected in captivity.
        The generator and checker-a pointed out this conflict themselves. The reported parent
        species are kept under taxonomy.parents.

  temperatureC:
    value: {min: 24, max: 30}
    confidence: low
    verification:
      method: qualified-majority
      votes: {agree: 4, total: 5}
    rationale: >-
      The line has no habitat of its own, so the natural range rests on the habitats of the parent
      species. Measured water temperatures: Tres Palos lagoon on the Mexican Pacific coast, a
      habitat of the maternal species A. trimaculatus, 24.2 to 26.7 C over a year of sampling;
      surface water of Lake Nicaragua 25 to 28 C and of Lake Managua 24.7 to 26 C, the lakes of A.
      citrinellus and A. labiatus (Swain 1966); Lake Petén Itzá in the Usumacinta basin, the
      type locality of V. melanurus, 25.6 to 30 C, and single readings in nearby Petén lowland
      waters up to 30.9 C (Pérez et al. 2010, 2013). The FishBase ranges of the four parents (21 to
      30, 23 to 33, 28 to 33 and 24 to 30 C) go back to aquarium books and only corroborate. Four of
      five votes agree on about 24 to 30 C (generator and checker-b 24 to 30, tiebreaker-1 24 to 31,
      tiebreaker-2 24 to 29); checker-a proposed the union of the FishBase ranges, 21 to 33 C.
      Confidence stays low because no single data set covers all parent habitats and the
      readings from the Rio Tipitapa between the two Nicaraguan lakes reach 32.4 C.

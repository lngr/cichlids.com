    verification:
      method: median
      votes: {agree: 3, total: 5}
    rationale: >-
      The natural range rests on the habitats of the parents. The votes did not reach a qualified
      majority, so the vote count took the median of the bounds of all five proposals: generator 3
      to 8, checker-a 4 to 16, checker-b 5 to 16, tiebreaker-1 4 to 16 and tiebreaker-2 3 to 8 dKH.
      The minima 3, 4, 4, 5 and 3 have the median 4, the maxima 8, 16, 16, 16 and 8 have the median
      16. The measurements fit this span and reach slightly lower: Lake Nicaragua holds 60 to 65
      mg/L CaCO3 total alkalinity (3.4 to 3.6 dKH, Swain 1966) or 80 to 120 mg/L (4.5 to 6.7 dKH)
      in an older fisheries survey, Lake Petén Itzá, home of V. melanurus, 1.9 to 2.2 meq/L
      bicarbonate (5.3 to 6.2 dKH), and the Rio Tipitapa and the saline Lake Managua up to 280 mg/L
      (15.7 dKH). The measured span of about 3.4 to 15.7 dKH is thus a little wider at the lower end
      than the decided 4 to 16 dKH. No alkalinity data exist for the habitats of A. trimaculatus.

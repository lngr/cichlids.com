      and Nicaragua, in the range of A. citrinellus and A. labiatus, holds a mean total hardness of
      about 100 to 137 mg/L CaCO3, which is 5.6 to 7.7 dGH. FishBase gives 9 to 20 dGH for V.
      melanurus, a figure taken from an aquarium reference. Swain (1966) lists calcium and
      magnesium for Lake Nicaragua that give only about 3 to 4 dGH, but the column assignment of
      the scanned table is not fully clear; the generator's lower bound of 3 dGH rests on it, the
      checkers proposed 5 and 6 dGH, and the decided lower bound of 5 dGH is their median. The
      upper bound rests on the V. melanurus figure alone, and no hardness data exist for the
      habitats of A. trimaculatus, hence low confidence.

partners:
  suitable:
    - species: Pterygoplichthys pardalis
      reason: Large armoured catfish that keeps to the bottom, grows too big to be eaten and is protected by its bony plates.
      condition: Only in a very large tank, under close watch and with a means of separating the fish.
    - species: Pterygoplichthys gibbiceps
      reason: Large armoured catfish of similar adult size that ignores the cichlid and withstands its attacks.
      condition: Only in a very large tank with cover for the catfish and a means of separating the fish.
    - species: Parachromis managuensis
      reason: Equally robust Central American cichlid of similar size and temperament that can hold its own.
      condition: Only in tanks of about 1000 litres or more, under close watch and with a divider at hand.
  unsuitable:
    - species: Amphilophus trimaculatus
      reason: Maternal parent species in the same hybrid group; the fish cross readily and fight hard.
    - species: Amphilophus labiatus
      reason: Parent species in the same hybrid group; the fish cross readily and fight hard.
    - species: Amphilophus citrinellus
      reason: Parent species in the same hybrid group; the fish cross readily and fight hard.
    - species: Paracheirodon innesi
      reason: Small fish that the flowerhorn hunts and eats.
    - species: Pterophyllum scalare
      reason: Slow, tall-finned fish that is bullied, injured or eaten.
    - species: Maylandia zebra
      reason: Mid-sized mbuna that is chased and injured by the much larger and more aggressive flowerhorn.

profile:
  overview:
    text: >-
      The flowerhorn is not a species but a line bred in captivity, first sold in Malaysia in the
      1990s and soon popular across Asia. Breeders crossed several Central American cichlids: the
      three-spot cichlid Amphilophus trimaculatus is the main parent, the red devil and the Midas
      cichlid joined it, and the redhead cichlid Vieja melanurus entered some lines through the
      blood parrot. All strains studied so far carry the mitochondrial DNA of A. trimaculatus. The
      fish is prized for its bright colours and the large fatty hump on the forehead, and in parts
      of Asia it is seen as a bringer of luck. Many hobbyists reject it as a hybrid of unclear
      ancestry. Released fish have become invasive in Southeast Asian lakes and reservoirs, so it
      must never be set free.
    sources:
      - *fishkeeper
      - *sari
      - *herder
      - *wikipedia
  habitat:
    text: >-
      There is no natural habitat. The parent species live in Central America and southern Mexico:
      A. trimaculatus in rivers and coastal lagoons of the Pacific slope from Mexico to El
      Salvador, the red devil and the Midas cichlid in the Nicaraguan Great Lakes, and V. melanurus
      on the Atlantic slope of Belize, Guatemala and southern Mexico. These waters are warm, around
      24 to 30 C, and mostly alkaline, with surface values of pH 8.2 to 8.9 in Lake Nicaragua and
      8.2 to 8.5 in Lake Petén Itzá, and range from soft to moderately hard. The natural water values of this
      profile are derived from those parent habitats, which were measured only in part. Feral
      flowerhorns thrive in Lake Matano on Sulawesi, where they dominate the catch along the shore,
      and in several reservoirs on Java.
    sources:
      - *cofAmphilophus
      - *cofVieja
      - *swain
      - *perez2010
      - *tresPalos
      - *herder
      - *hedianto
  sizeAndGrowth:
    text: >-
      Well-fed males reach about 30 cm, show fish even more, while females stay smaller and fuller in
      the body at around 25 cm. The fish grows quickly in its first year when fed generously, and
      the nuchal hump develops with age; it is usually larger in males, but females can show one
      too. The size of the hump depends on strain, food and water quality. Feral fish in Indonesian
      reservoirs stay smaller, with males around 20 cm. Adults are heavy fish, which matters for the
      choice of decor and its fixing.
    sources:
      - *riverpark
      - *fishkeeper
      - *putri
  husbandry:
    text: >-
      Plan a tank of at least 150 cm length and about 400 litres for one adult, with a heavy,
      firmly closed cover because the fish jumps. Use sand or fine, rounded gravel and only a few
      large rocks or roots glued together or set directly on the glass bottom, since the flowerhorn
      digs and moves loose decor. Plants are uprooted. Protect the heater with a guard or use an
      external heater, as the fish attacks equipment. Filtration must be strong and water changes
      large and frequent to keep nitrate low. Keep the water at 24 to 30 C with a pH of 6.5 to
      9, a general hardness of 5 to 25 dGH and a moderate carbonate hardness that
      buffers the pH against the heavy waste load.
    sources:
      - *fishkeeper
      - *sfLabiatus
      - *sfCitrinellus
  socialBehavior:
    text: >-
      The flowerhorn is among the most aggressive aquarium cichlids. It claims the whole tank, and
      most keepers hold it alone as a pet that recognises its owner and follows it along the glass.
      Two adults in one tank usually fight, and a male may kill a female that is not ready to spawn.
      If a pair is wanted, raise several juveniles together, let a pair form, rehome the others and
      keep a divider ready. Tankmates are possible only in very large tanks and only with robust
      cichlids of similar size or large armoured catfish, and even then the keeper must watch
      closely.
    sources:
      - *fishkeeper
      - *sfCitrinellus
      - *archive3537
  diet:
    text: >-
      In the wild the hybrid eats almost anything it finds: snails, insects, shrimp, plant matter and
      small fish, changing its main food with the season. In the tank a quality cichlid pellet or
      stick is the staple, supplemented with frozen shrimp, krill and mussel meat and with vegetables
      such as peas or spinach. A varied diet keeps the colours bright. Live feeder fish are not
      needed and bring a risk of disease. Feed modest amounts once or twice a day, because the fish
      always appears hungry and leftovers quickly spoil the water.
    sources:
      - *hedianto
      - *fishkeeper
      - *sfLabiatus
  breeding:
    text: >-
      Flowerhorns are open-substrate spawners, and both parents care for the brood. After vigorous
      courtship with mouth wrestling and tail slapping, the female lays up to about 1000 eggs on a
      flat stone, a piece of driftwood or in a rocky cave. The larvae hatch after about three days
      and are moved into pits dug in the sand; a few days later they swim freely and take newly
      hatched brine shrimp. The parents guard the young for around six weeks. A large share of the
      males is sterile, and a guarding male may attack his partner or the keeper's hands. A pair can
      spawn often and in large numbers, so plan for the offspring before breeding.
    sources:
      - *fishkeeper
      - *abe
      - *wikipedia
  sexing:
    text: >-
      Adult males are larger, usually have the bigger nuchal hump and the brighter colours, and grow
      longer, pointed dorsal and anal fins. Females stay shorter but look fuller, may also develop a
      small hump, and often show black spots in the dorsal fin. At spawning time the genital papilla
      helps: it is pointed in males and blunt in females. Young fish are hard to sex, which is why
      breeders raise groups and wait for pairs to form.
    sources:
      - *fishkeeper
      - *wikipedia
  compatibility:
    text: >-
      The safest setup is a single flowerhorn. In very large tanks, large armoured catfish such as
      Pterygoplichthys or equally tough Central American cichlids of similar size can work, the
      latter only from about 1000 litres and with a divider at hand. Small or slow fish such as
      tetras and angelfish are hunted or harassed. Never combine it with Midas cichlids, red devils
      or three-spot cichlids: they belong to the same hybrid group, cross readily with the flowerhorn
      and fight hard. The water needs fit most robust Central American cichlids, but temperament, not
      water, decides whether a tankmate survives.
    sources:
      - *fishkeeper
      - *sfCitrinellus
      - *sari
      - *tarkhani
      - *magalhaes
  problems:
    text: >-
      The most common mistake is buying a small, colourful juvenile for a small tank or a community
      aquarium; the fish soon outgrows both and kills or wounds its tankmates. Poor water quality from
      overfeeding and weak filtration stresses the fish and fades its colours, and hole-in-head
      disease can kill valuable fish. A veterinary report describes a kidney tumour that spread to
      the spleen in an older fish, so a fish with a growing abdomen, protruding eyes or breathing
      trouble should be seen by a fish vet. Never release unwanted fish: feral flowerhorns harm
      native fish in Southeast Asia, and Australia bans their import.
    sources:
      - &renal
        kind: literature
        title: >-
          Rahmati-Holasoo, H., Shokrpoor, S., Masoudifard, M., Ebrahimzadeh Mousavi, H., Haddadi, A.
          and Tavakkoli, A. (2017). Renal cystic adenocarcinoma in a flowerhorn cichlid with
          metastatic involvement of the spleen. Journal of Aquatic Animal Health 29(3), 158-164
          (abstract).
        url: https://doi.org/10.1080/08997659.2017.1349008
        accessed: 2026-10-13
      - *fishkeeper
      - *herder
      - *magalhaes
      - *wikipedia


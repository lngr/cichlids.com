  ph:
    value: {min: 7, max: 9}
    confidence: low
    verification:
      method: median
      votes: {agree: 3, total: 5}
    rationale: >-
      The natural range rests on the habitats of the parents. The votes did not reach a qualified
      majority, so the vote count took the median of the bounds of all five proposals: generator
      7.0 to 9.0, checker-a 7.0 to 8.5, checker-b 7.0 to 8.5, tiebreaker-1 7.2 to 9.0 and
      tiebreaker-2 7.3 to 9.3. The minima 7.0, 7.0, 7.0, 7.2 and 7.3 have the median 7.0, the maxima
      8.5, 8.5, 9.0, 9.0 and 9.3 have the median 9.0. The measured data fit this span: Lake
      Nicaragua 8.2 to 8.9 at the surface and 7.4 to 7.8 in deep water (Swain 1966) and 7.2 to 7.7
      in an older fisheries survey; Lake Nicaragua 8.59, Lake Managua 8.69 and seven crater lakes
      with Midas cichlids 7.33 to 8.41 in 2018 (Härer et al. 2021); the Rio Tipitapa between both
      lakes 8.0 to 8.9; Lake Petén Itzá, home of V. melanurus, 8.2 to 8.5 at the surface (Pérez et
      al. 2010) and Petén lowland waters 7.4 to 8.5 (Pérez et al. 2013). Lake Managua reached 8.9
      to 9.3 at the surface in one dry-season survey, which reads as a photosynthetic peak, so the
      measured span of about 7.2 to 9.3 is slightly wider than the decided 7.0 to 9.0. No pH
      measurement from the river and lagoon habitats of A. trimaculatus was found.
    sources:
      - *swain
      - &haerer
        kind: literature
        title: >-
          Härer, A., Ibrahim, A., Torres-Dowdall, J. et al. (2021). Heterogeneity across Neotropical
          aquatic environments affects prokaryotic and eukaryotic biodiversity based on
          environmental DNA. Environmental DNA 4(2), 469-484 (Table 1, abiotic characteristics).
        url: https://doi.org/10.1002/edn3.267
        accessed: 2026-10-13
      - &bolanos
        kind: literature
        title: >-
          Article on the inland fisheries of Nicaragua (Lago de Nicaragua, Lago de Managua, crater
          lakes), reporting a mid-20th-century fisheries survey; digitised in the Biblioteca Enrique
          Bolaños as document 888, title not legible in the scan.
        url: https://sajurin.enriquebolanos.org/docs/888.pdf
        accessed: 2026-10-13
      - *tipitapa
      - *perez2010
      - *perez2013
      - &karst
        kind: literature
        title: >-
          Vega-Cendejas, M. E., Santillana, M. H. and Norris, S. (2013). Habitat characteristics and
          environmental parameters influencing fish assemblages of karstic pools in southern Mexico.
          Neotropical Ichthyology 11(4), 859-870.
        url: https://doi.org/10.1590/s1679-62252013000400014
        accessed: 2026-10-13
      - *fbMelanurus

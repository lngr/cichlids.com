      only Central and South American cichlids of similar size and temperament or large armoured
      catfish, under close watch and with a means of separation. Seriously Fish allows robust
      tankmates for the Midas parent only in tanks above 1000 litres, and a Brazilian trade survey
      classes the flowerhorn as aggressive. A spawning pair turns on every other fish in the tank.

  socialBehavior:
    text: Outside breeding, eye-biters cruise the open water calmly and claim no area. In a group one
      male takes on the blue colour and dominates; other males stay silvery and pale. A male in
      breeding condition builds a bower in the sand and can claim a large part of the tank, and in
      tanks that are too small he drives rival males and low-ranking females without pause, until
      fins are torn and eyes lost. For that reason keep only one male, with about four females and
      never fewer than three, in a tank of at least 150 cm. Towards tankmates too big to eat the
      species is peaceful apart from chasing them from the spawning site, but every small fish is
      food, including the fry of its own and other species.
    sources:

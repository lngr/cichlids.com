  sizeAndGrowth:
    text: Males usually reach about 25 cm in a good aquarium and females about 20 cm. FishBase gives 23
      cm total length as the maximum it lists, care sheets name 25 to 26 cm, and fully grown
      imported males of only about 18 cm have also been described, so the final size varies. Males
      grow faster than females, so in a group of the same age the largest fish are usually males.
      Young fish are sold at a few centimetres as plain silver fish with a stripe, which makes it
      easy to underestimate them. Plan the tank for the adult size from the start; full size and the
      final colour of a dominant male take several years.
    sources:
      - kind: database
        title: "FishBase species summary: Dimidiochromis compressiceps (Malawi eyebiter)"
        url: https://www.fishbase.se/summary/Dimidiochromis-compressiceps.html

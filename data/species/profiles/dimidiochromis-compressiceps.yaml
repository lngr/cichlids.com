  habitat:
    text: The species lives throughout Lake Malawi and also in Lake Malombe and the upper Shire River,
      which drain the lake to the south. It favours shallow, sheltered water where beds of
      Vallisneria and other plants grow on sand. There it hangs motionless with its head tilted down
      between the leaves, its dark stripe blending with the shadows of the stems, and waits for
      schools of young utaka and other small cichlids to come close. Males dig spawning pits in the
      sand between the plants or use a flat stone. Fish around Chizumulu Island are yellowish and
      are also seen over rocks. The lake water is soft but alkaline, with a surface pH of about 7.7
      to 8.6 and temperatures of about 21 to 29 C. A population introduced by people lives in
      Israel. The species is assessed as Least Concern.
    sources:
      - kind: catalog-of-fishes
        title: "Eschmeyer's Catalog of Fishes, species of the genus Dimidiochromis"

  aggressionConspecific:
    value: 3
    confidence: medium
    rationale: The runs split 2 to 2 between levels 2 and 3. Seriously Fish advises one male with three
      to six females because males are hard on single females, and Fishkeeper and an aquarium report
      advise only one male per tank. The detailed aquarium report of Gay (2020) describes dominant
      males that took over 90 and 120 cm tanks, bit rival males again and again and drove
      low-ranking fish so hard that they lost eyes, among them the weakest female; only a 150 cm
      tank with one male and four females worked, and a keeper in the archive had a spawning male
      terrorise his tank. Aquarium Glaser calls the species fairly peaceful towards its own kind.
      Persistent chasing with injuries when space or the sex ratio is wrong is level 3; level 2
      would understate the documented injuries.

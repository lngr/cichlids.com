  hybridGroups:
    value: []
    confidence: medium
    rationale: "Unanimous, 4 of 4 votes. No curated group contains Dimidiochromis, the Catalog of Fishes
      lists four valid species of the genus without any hybrid names, and Seriously Fish, Fishkeeper
      and Tropical Freshwater Fish give no crossing warning. Two facts show that crosses are
      possible but do not define a group: Le Pabic et al. (2016) raised F1 hybrids from a male
      housed only with Copadichromis azureus females, a species of another genus, and Gay (2020)
      describes the Orange Blotch fish of the trade as hybrids or line-bred stock of unclear origin
      and warns that D. strigatus is mixed up with it. Absence of crossing reports is weak evidence,
      hence medium."

partners:
  suitable:
    - species: Nimbochromis venustus
      reason: Calm, large haplochromine of similar size that uses the same sandy, open setup.
      condition: Add both as adults of similar size, in a tank of at least 150 cm.
    - species: Cyrtocara moorii
      reason: Peaceful sand-dwelling haplochromine that grows too large to be prey and does not compete
        aggressively.
    - species: Fossorochromis rostratus
      reason: Large, peaceful sand dweller that uses the same open sand areas.
      condition: Very long tank, since it grows beyond 25 cm.
    - species: Placidochromis phenochilus
      reason: Calm haplochromine of about 17 to 20 cm, well above prey size.
    - species: Synodontis njassae
      reason: Lake Malawi catfish that stays near the bottom and grows too large to swallow.
      condition: Add as adults, not as small juveniles.
  unsuitable:
    - species: Labidochromis caeruleus
      reason: Small mbuna that fits into its mouth and is eaten; also a hasty, hectic feeder.
    - species: Lake Malawi mbuna
      reason: Hectic, aggressive rock dwellers that stress this calm predator; the smaller species are
        eaten.
    - species: Copadichromis azureus
      reason: Juvenile utaka are its natural prey, and a male kept without females of his own crossed with
        C. azureus females in a tank.
    - species: Neolamprologus multifasciatus
      reason: Tiny shell dweller that is plain prey.
    - species: Aulonocara jacobfreibergi
      reason: Females and young stay small enough to be eaten, and the peacocks are timid next to a large
        predator.
profile:
  overview:
    text: "The Malawi eye-biter is a large, slender predator from Lake Malawi. Its head and body are so
      flattened from side to side that the fish almost vanishes when seen from the front, and its
      mouth is huge for its size. Females and young fish are silvery with a dark stripe along the
      flank; a dominant male turns shining blue, often with a green sheen, and carries orange and
      red in the fins. The name goes back to reports that it plucks the eyes of other fish. In the
      lake this is rare, but stressed fish in cramped aquaria have lost eyes to their own kind. What
      the name gets right is that this is a hunter: any fish small enough to fit into its mouth will
      sooner or later be eaten. Towards larger tankmates it is calm. It suits keepers who can offer
      a long tank, a harem and a community of other big haplochromines."
    sources:
      - kind: database
        title: "FishBase species summary: Dimidiochromis compressiceps (Malawi eyebiter)"
        url: https://www.fishbase.se/summary/Dimidiochromis-compressiceps.html
        accessed: 2026-10-13

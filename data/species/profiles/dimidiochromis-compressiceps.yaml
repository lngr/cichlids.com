  temperatureC:
    value:
      min: 21
      max: 29
    confidence: high
    rationale: Natural value decided by the water body Lake Malawi. The lake studies give about 21 C for
      inshore water in the cool, windy season and 27 C in the upper 60 m by May (Eccles 1974),
      winter surface-layer values of 23.5 to 24 C and summer surface water of about 28 C (Vollmer et
      al. 2005), and up to about 29 C at the surface in later measurements, so the range is 21 to 29
      C. The species lives in shallow, plant-grown water of the lake itself, so the surface values
      apply. FishBase gives 22 to 28 C, a figure from aquarium literature that belongs to the
      tolerance.
    sources:
      - kind: literature
        title: "Branchu, P., Bergonzini, L., Ambrosi, J.-P., Cardinal, D., Delalande, M., Pons-Branchu, E.
          et al. (2010). Hydrochemistry (major and trace elements) of Lake Malawi (Nyasa), Tanzanian
          Northern Basin: local versus global considerations. Hydrology and Earth System Sciences
          Discussions 7, 4371-4409"
        url: https://hess.copernicus.org/preprints/7/4371/2010/hessd-7-4371-2010.pdf
        accessed: 2026-10-12

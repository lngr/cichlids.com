  maxSizeCm:
    value:
      male: 25
      female: 20
    confidence: medium
    rationale: Aquarium Glaser gives about 25 cm for males and 20 cm for females, and the German
      Wikipedia the same pair; Seriously Fish gives 25 cm, Tropical Freshwater Fish about 25 cm and
      Fishkeeper 26 cm without separating the sexes. FishBase lists 23 cm total length for males or
      unsexed fish, and an aquarium report describes fully grown imported males of about 18 cm, so

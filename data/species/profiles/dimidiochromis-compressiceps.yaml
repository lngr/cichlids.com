  predation:
    value: 3
    confidence: high
    rationale: Unanimous, 4 of 4 votes. FishBase states that it feeds on small fishes, mainly juvenile
      utaka and other shoaling species, and Le Pabic et al. (2016) describe it as a predator of
      small fishes with a large, fast-closing mouth that ambushes prey from plant beds and swallows
      it whole. Seriously Fish calls it a piscivore that eats fish below about 13 cm, Fishkeeper
      sets the safe size at about 15 cm, and an aquarium report would not trust it with any fish
      half its size or smaller. The Cichlid Room Companion confirms the piscivorous feeding. Fish
      are the main part of its diet, which is level 3. Eye-biting is rare in the wild and not its
      normal way of feeding.

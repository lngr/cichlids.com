        - Lake Malombe
        - upper Shire River
    confidence: high
    rationale: The Catalog of Fishes and FishBase agree that the species is widespread in Lake Malawi
      and also lives in Lake Malombe and the upper Shire River, which drain the lake to the south;
      Seriously Fish calls it a widespread Lake Malawi endemic. The population introduced to Israel
      lies outside the native range and is not listed. All four runs agree on continent, lake and
      localities.

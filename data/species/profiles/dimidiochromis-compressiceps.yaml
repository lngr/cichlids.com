  diet:
    text: In the lake the eye-biter lives mainly on small fish, chiefly young utaka and other schooling
      cichlids, which it seizes in a quick lunge from cover and swallows whole. In the aquarium live
      fish are not needed. Most fish soon learn to take frozen prawn, mysis, krill, mussel, cockle
      and whitebait, and large cichlid pellets or sticks complete the diet; research groups keep it
      on pellets alone. Feeder fish should not be the staple, as they can carry disease. Feed
      several smaller meals rather than one large one and keep the menu varied. Because the species
      needs protein-rich food, tankmates that require a plant-based diet are a poor match.
    sources:
      - kind: database

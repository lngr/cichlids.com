  breeding:
    text: Breeding works in a large tank with a harem. The male colours up, digs a shallow pit in the
      sand or chooses a flat stone and courts passing females. The female lays a few eggs at a time
      and takes them into her mouth at once; the egg spots on the male's anal fin lure her to nibble
      there, and the eggs are fertilised in her mouth. Broods usually hold 40 to 100 eggs, rarely up
      to about 250. The female carries them for about three weeks without eating. Brooding females
      often spit out the brood when stressed, so move them carefully or not at all. In one report a
      large, old dominant male failed to spawn, while a younger male bred within days. The fry are
      large and easy to raise, but adults eat them, so rear them in a separate tank.
    sources:
      - kind: database

      take dead meaty foods such as prawn, mussel, krill, mysis and whitebait as well as large
      cichlid pellets (Seriously Fish, Fishkeeper), and research groups keep it on pellets. No
      source reports bloat on a protein-rich diet, which this carnivore needs, so the flag is false.

  compatibility:
    text: "Choose tankmates that grow to at least 13 to 15 cm and are calm: other large haplochromines
      such as Nimbochromis venustus, Cyrtocara moorii, Fossorochromis rostratus or Placidochromis
      phenochilus, and bottom-living Lake Malawi catfish. Avoid mbuna and other hectic rock
      dwellers, which disturb this calm predator, and every small species, including dwarf
      Tanganyika cichlids and small peacocks, which will be eaten. Keep only one male of the
      species. Juvenile utaka are its natural prey, and a male kept without his own females has
      crossed with Copadichromis azureus, so keep a proper harem. Add new fish only when they are
      already well above mouth size."

  problems:
    text: The most common mistake is buying cute silver juveniles for a mixed tank of small cichlids;
      within months the smaller fish disappear. A tank that is too short or crowded stresses this
      long swimmer, and then the dominant male, and sometimes the females, injure weaker fish badly,
      up to the loss of an eye. A male kept with only one or two females may harass them hard. A
      diet of feeder fish alone can bring in parasites and is one-sided; frozen seafood and good
      pellets are safer. Rich feeding without enough water changes raises nitrate, which favours fin
      damage and the head and lateral line erosion seen in large cichlids. Brooding females spit out
      their eggs when disturbed, and females kept apart for too long may lose their rank in the
      group.

  validName: Dimidiochromis compressiceps
  genus: Dimidiochromis
  species: compressiceps
  author: (Boulenger, 1908)
  source:
    kind: catalog-of-fishes
    title: "Eschmeyer's Catalog of Fishes, species of the genus Dimidiochromis"
    url: https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Dimidiochromis
    accessed: 2026-10-13
  synonyms:
    - name: Paratilapia compressiceps
      note: Original combination of Boulenger (1908); holotype BMNH 1908.10.27.59 from Lake Malawi.
    - name: Haplochromis compressiceps
      note: Former combination of older hobby and scientific literature, used before Dimidiochromis was
        erected (Eccles and Trewavas 1989).
    - name: Cyrtocara compressiceps
      note: Former combination of the 1980s, when many Malawi haplochromines were placed in Cyrtocara.
  legacyNames:
    - Dimidiochromis compressiceps
  note: The Catalog of Fishes lists Paratilapia compressiceps Boulenger 1908 as valid in
    Dimidiochromis, one of four valid species of the genus, with the range Lakes Malawi and Malombe
    and the upper Shire River and an introduced population in Israel. The legacy and the valid genus
    are the same, so one genus query covers both. Altolamprologus compressiceps of Lake Tanganyika
    is an unrelated species with the same epithet.
names:
  trade:
    en:
      - Malawi eye-biter
      - Malawi eyebiter
      - Eye-biter
      - Compressiceps hap
    de:
      - Messerbuntbarsch
variants:
  - name: Albino
    kind: color-morph
    note: Captive-bred albino form.
  - name: OB (Orange Blotch)
    kind: color-morph
    note: Captive-bred blotched form, also sold as Platinum OB; not known from the wild and described in
      the hobby as a hybrid or line-bred stock of unclear origin.
  - name: Chizumulu
    kind: locality
    note: Fish from Chizumulu Island show a yellowish instead of a silvery ground colour and are
      reported over rocks.

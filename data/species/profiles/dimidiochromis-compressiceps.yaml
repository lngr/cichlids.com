  husbandry:
    text: "One male with four females needs a tank of at least 150 cm length, 60 cm front to back and
      about 500 litres; longer is better. Use sand as the ground and plant dense groups of
      Vallisneria or other tough, long-leaved plants along the back and sides, where the fish like
      to hover. Keep the centre open for swimming and add only a few rocks, for example flat stones
      as spawning sites. Gentle water movement suits it better than a strong current. Stable,
      alkaline water matters more than exact numbers: a pH of 7.5 to 8.5 and 24 to 27 C work well,
      and a carbonate substrate or buffer helps where the tap water is soft. Good filtration and
      generous weekly water changes keep nitrate low, since the fish eat meaty food."
    sources:

    tolerance:
      value:
        min: 21
        max: 29
      confidence: medium
      rationale: All four runs agree on 21 to 29 C. Care sheets recommend 22 to 28 C (FishBase after an
        aquarium atlas), 23 to 28 C (Seriously Fish, Tropical Freshwater Fish), 24 to 28 C
        (Fishkeeper, Aquarium Glaser) and 24 to 27 C (Aqua-Fish.Net), with 25 to 27 C as the best
        range for breeding; research groups keep and breed the species at 24 to 28 C. The tolerance
        has to contain the natural lake range, so its bounds are the lake values of 21 and 29 C. No
        source tests long-term keeping at these extremes, which is why the confidence stays medium;
        a keeper in the archive notes that a male starts courting and harassing tankmates at about
        27 C.

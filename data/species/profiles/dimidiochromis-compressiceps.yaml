  sexing:
    text: "Adult males are easy to recognise: the dominant male shows a metallic blue body, often with
      green reflections, orange to red tones in the dorsal and anal fins and clear egg spots on the
      anal fin. Females stay silvery and keep the dark stripe. Subordinate males may look like
      females for a long time, so a group bought as young fish should be watched until the males
      show colour. Males also grow faster, so the largest fish in a group of the same age are
      usually males."

partners:
  suitable:
  - species: Iodotropheus sprengerae
    reason: Different adult coloration and comparatively manageable mbuna behaviour make this a conditional companion.
    condition: A larger aquarium with shelter and space for both appropriate adult groups; reassess individual behaviour.
  - species: Labidochromis caeruleus
    reason: The Practical Fishkeeping account recommends saulosi with calmer Labidochromis; yellow coloration overlaps
      females and warrants observation.
    condition: A larger structured mbuna aquarium with separate refuges and feeding suitable for both species.
  unsuitable:
  - species: Chindongo demasoni
    reason: "Blue, dark-barred fish resemble male saulosi and may trigger rival-directed aggression."
  - species: Maylandia estherae
    reason: Experimental saulosi-estherae offspring are reported; presumed crossing risk makes this unsuitable for
      maintaining a pure breeding line.
  - species: Melanochromis auratus
    reason: Its stronger aggression is a poor match for this small mbuna.
profile:
  overview:
    text: "Saulosi offers a vivid contrast within one species: yellow females and blue, dark-barred dominant males.\
      \ This small Lake Malawi mbuna is native to Taiwan Reef. Its current name is Chindongo saulosi; Pseudotropheus\
      \ saulosi is the older combination still used in shops. Small size does not remove the need for room, refuges\
      \ and several females per male."
    sources:
    - kind: catalog-of-fishes
      title: "Eschmeyer's Catalog of Fishes: species of Chindongo"
      accessed: '2026-10-13'
      url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Chindongo"
      archived: researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp/q-7cb5b2a4/2026-10-14T095033Z
    - kind: database
      title: "John de Lange: Chindongo saulosi. AquaInfo species database"
      accessed: '2026-10-13'
      url: "https://aquainfo.nl/en/article/chindongo-saulosi/"
    - kind: database
      title: "FishBase species summary: Chindongo saulosi"
      accessed: '2026-10-13'
      url: "https://www.fishbase.se/summary/Chindongo-saulosi.html"
      archived: fishbase.se/summary/chindongo-saulosi.html/2026-10-14T095115Z
  habitat:
    text: "The native reef lies northwest of Chizumulu Island. Fish graze among exposed rock surfaces in moving\
      \ water, often at depths around 7 to 15 m. Females and nonterritorial males gather in schools, while dominant\
      \ males defend rocky sites. The natural lake envelope is 21 to 29 C, pH 7.7 to 8.6, 3 to 5 dGH and 5 to 8\
      \ dKH. These are lake-wide ranges rather than a monitoring record from the reef."
    sources:
    - kind: literature
      title: "Oliver. Chindongo saulosi, field observations reproduced from Konings (1990)"
      url: "https://www.malawicichlids.com/mw09007u.htm"
      archived: malawicichlids.com/mw09007u.htm/2026-10-14T095115Z
      accessed: '2026-10-13'
    - kind: literature
      title: "Branchu et al. (2010). Hydrochemistry of Lake Malawi, Tanzanian Northern Basin"
      url: "https://doi.org/10.5194/hessd-7-4371-2010"
      archived: doi.org/10.5194_hessd-7-4371-2010/2026-10-13T071931Z
      accessed: '2026-10-13'
    - kind: literature
      title: "Vanden Bossche and Bernacsek (1990), FAO Source book, Lake Malawi chemistry after Jackson et al. and\
        \ Talling and Talling"
      url: "https://www.fao.org/4/t0473e/T0473E05.htm"
      archived: fao.org/4/t0473e/t0473e05.htm/2026-10-14T094507Z
      accessed: '2026-10-13'
    - kind: literature
      title: "Eccles, D. H. (1974). An outline of the physical limnology of Lake Malawi (Lake Nyasa). Limnology\
        \ and Oceanography 19(5), 730-742 (abstract)."
      url: "https://doi.org/10.4319/lo.1974.19.5.0730"
      accessed: '2026-10-13'
    - kind: literature
      title: "Vollmer et al. (2005). Deep-water warming trend in Lake Malawi, East Africa. Limnology and Oceanography\
        \ 50, 727-732"
      accessed: '2026-10-13'
      url: "https://doi.org/10.4319/lo.2005.50.2.0727"
      archived: doi.org/10.4319_lo.2005.50.2.0727/2026-10-13T071601Z
    - kind: database
      title: "John de Lange: Chindongo saulosi. AquaInfo species database"
      accessed: '2026-10-13'
      url: "https://aquainfo.nl/en/article/chindongo-saulosi/"
  sizeAndGrowth:
    text: "Allow for aquarium males around 10 cm and females around 9 cm. FishBase gives 8.6 cm total length for\
      \ male or unsexed specimens, which is a different reference from typical captive planning size. Young fish\
      \ begin yellow, so colour cannot reliably establish their eventual sex. Five to eight years is a tentative\
      \ husbandry expectation rather than a measured survival distribution."
    sources:

    rationale: "Retain the tally waterbody decision of 21 to 29 C at high confidence. Eccles reports 21 C inshore\
      \ cooling and 27 C in May; Vollmer describes seasonal surface water near 28 C and below 24 C in winter. FAO\
      \ gives a narrower historical 23 to 25 C band. The full envelope covers the lake rather than a Taiwan Reef\
      \ monitoring series; the 29 C boundary comes from the lake synthesis, not from the narrower evidence entries.\
      \ Eccles was read as an abstract because fetch-oa refused the non-open-access full text."

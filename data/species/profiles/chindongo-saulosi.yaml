  compatibility:
    text: "Suitably chosen mbuna can share a larger aquarium. Rusty cichlids and calmer Labidochromis are conditional\
      \ candidates, with refuge and enough room for every adult group. Yellow labs overlap female colour and require\
      \ observation. Blue-barred demasoni can provoke rival-directed attacks; strongly aggressive auratus is also\
      \ a poor match. Keep estherae out of a pure breeding group because experimental hybrids exist, although free\
      \ choice of conspecific mates has not been demonstrated. Companion suggestions do not add capacity to the\
      \ minimum tank."

  problems:
    text: "Common problems include unexpected extra males, sustained pursuit of one female, unstable water and excessive\
      \ feeding. Appetite loss, swelling, abnormal waste or fast breathing need assessment in their water-quality\
      \ and social context. A mouthbrooding female may normally stop eating. Check oxygenation, refuge and access\
      \ to food when behaviour changes, and seek experienced aquatic health advice for persistent illness rather\
      \ than assuming every symptom is bloat."

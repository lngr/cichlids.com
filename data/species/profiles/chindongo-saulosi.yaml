  minTank:
    value:
      volumeL: 300
      lengthCm: 120
      depthCm: 45
    confidence: medium
    rationale: >-
      Generator proposed 300 L, 120 cm length and 50 cm depth; checker-a proposed 200 L, 120 cm
      length and 40 cm depth; checker-b proposed 300 L, 120 cm length and 50 cm depth; checker-c
      proposed 210 L, 120 cm length and 40 cm depth. The component medians are 255 L, 120 cm
      length and 45 cm depth. Malawi-Guru and Einrichtungsbeispiele explicitly give 300 L and
      120 cm for a species aquarium or small group, supporting a volume above the 255 L median
      for one male and four females. FishProfiles gives about 200 L, Fish Laboratory about 190
      to 210 L, and Fishkeeper gives 200 L with a 120 by 40 cm base. The Cichlid Fish Forum
      example is about 208 L with a 122 by 33 cm base. These sources do not establish a 50 cm
      depth requirement for the selected harem. Use the 45 cm depth median as a provisional
      allowance for rockwork and escape routes, together with the source-backed volume and
      length. Mixed communities and additional males need more space.

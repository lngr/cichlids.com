  ghDgh:
    value:
      min: 3
      max: 5
    confidence: high
    rationale: "Retain the tally waterbody decision of 3 to 5 dGH at high confidence. Calcium and magnesium measured\
      \ by Branchu in the upper 50 m convert to approximately 4.2 to 4.6 dGH; the historical measurements compiled\
      \ by FAO span about 3.5 to 4.9 dGH. The exact tally envelope rounds outward from those measurements, including\
      \ the prescribed lower limit of 3. Alkaline Malawi water is not necessarily high in calcium and magnesium."
    sources:
    - kind: literature
      title: "Branchu et al. (2010). Hydrochemistry of Lake Malawi, Tanzanian Northern Basin"

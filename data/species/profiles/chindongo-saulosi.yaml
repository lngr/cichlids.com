  husbandry:
    text: >-
      For one male and four females, start with 300 L, 120 cm length and 45 cm front-to-back
      depth. The depth allows rock cover and escape routes. Secure rocks against digging and
      break up long sightlines between shelters. Maintain biological filtration, good gas
      exchange and regular water changes. Around 24 to 26 C is better supported for routine
      keeping than either tolerance endpoint. Measure pH, GH and KH separately: buffered
      alkaline water can have modest calcium-magnesium hardness.
    sources:
    - kind: literature
      title: "Branchu et al. (2010). Hydrochemistry of Lake Malawi, Tanzanian Northern Basin"
      url: "https://doi.org/10.5194/hessd-7-4371-2010"
      archived: doi.org/10.5194_hessd-7-4371-2010/2026-10-13T071931Z
      accessed: '2026-10-13'
    - kind: database
      title: "Bandhauer and Hoernlimann. Chindongo saulosi, Malawi-Guru species directory"
      url: "https://malawi-guru.de/chindongo-saulosi-verzeichnis-mbuna-arten/"
      archived: malawi-guru.de/chindongo-saulosi-verzeichnis-mbuna-arten/2026-10-14T095131Z
      accessed: '2026-10-13'
    - kind: database
      title: "Einrichtungsbeispiele: Chindongo saulosi, Saulosi Zebra-Maulbrüter"
      accessed: '2026-10-13'
      url: "https://www.einrichtungsbeispiele.de/zierfische/malawisee/pseudotropheus-saulosi-slnk.html"
      archived: einrichtungsbeispiele.de/zierfische/malawisee/pseudotropheus-saulosi-slnk.html/2026-10-14T095119Z
    - kind: database
      title: "John de Lange: Chindongo saulosi. AquaInfo species database"
      accessed: '2026-10-13'
      url: "https://aquainfo.nl/en/article/chindongo-saulosi/"
  socialBehavior:
    text: "A single male with four females spreads courtship attention while limiting male rivalry. It is a practical\
      \ aquarium arrangement, distinct from the roaming schools and mating opportunities in the lake. A male may\
      \ retain a defended site and repeatedly chase rivals or unreceptive females. Quiet refuge matters especially\
      \ for a holding female. Persistent cornering or lost access to food deserves attention before wounds appear.\
      \ Several males need more usable space than this minimum unit."
    sources:
    - kind: database
      title: "Bandhauer and Hoernlimann. Chindongo saulosi, Malawi-Guru species directory"
      url: "https://malawi-guru.de/chindongo-saulosi-verzeichnis-mbuna-arten/"
      archived: malawi-guru.de/chindongo-saulosi-verzeichnis-mbuna-arten/2026-10-14T095131Z
      accessed: '2026-10-13'
    - kind: database
      title: "John de Lange: Chindongo saulosi. AquaInfo species database"
      accessed: '2026-10-13'
      url: "https://aquainfo.nl/en/article/chindongo-saulosi/"
    - kind: database
      title: "Einrichtungsbeispiele: Chindongo saulosi, Saulosi Zebra-Maulbrüter"
      accessed: '2026-10-13'
      url: "https://www.einrichtungsbeispiele.de/zierfische/malawisee/pseudotropheus-saulosi-slnk.html"
      archived: einrichtungsbeispiele.de/zierfische/malawisee/pseudotropheus-saulosi-slnk.html/2026-10-14T095119Z
  diet:
    text: "Make plant-rich mbuna flakes or small pellets the staple, including suitable spirulina-based foods. Rock\
      \ algae and biofilm provide grazing opportunities. Tiny aquatic animals occur in natural biocover, so occasional\
      \ small invertebrate portions can supplement the diet. Keep rich animal foods limited and use modest portions.\
      \ Digestive illness can involve stress and unsuitable feeding; the bloat flag does not identify one cause\
      \ for every swollen fish."
    sources:
    - kind: literature
      title: "Oliver. Chindongo saulosi, field observations reproduced from Konings (1990)"
      url: "https://www.malawicichlids.com/mw09007u.htm"
      archived: malawicichlids.com/mw09007u.htm/2026-10-14T095115Z
      accessed: '2026-10-13'
    - kind: database
      title: "John de Lange: Chindongo saulosi. AquaInfo species database"
      accessed: '2026-10-13'
      url: "https://aquainfo.nl/en/article/chindongo-saulosi/"
    - kind: database
      title: "Einrichtungsbeispiele: Chindongo saulosi, Saulosi Zebra-Maulbrüter"
      accessed: '2026-10-13'
      url: "https://www.einrichtungsbeispiele.de/zierfische/malawisee/pseudotropheus-saulosi-slnk.html"
      archived: einrichtungsbeispiele.de/zierfische/malawisee/pseudotropheus-saulosi-slnk.html/2026-10-14T095119Z
  breeding:
    text: "The female carries eggs and developing young in her mouth. Holding females may eat little and need shelter\
      \ from courtship pressure. Brood size and holding duration vary among accounts, so do not schedule release\
      \ from one exact day count. Protect filter intakes and offer fine food when raising young separately. Preserve\
      \ clear stock identity: experimental offspring of a saulosi female and an estherae male have been reported."
    sources:
    - kind: database
      title: "John de Lange: Chindongo saulosi. AquaInfo species database"
      accessed: '2026-10-13'

    tolerance:
      value:
        min: 3
        max: 16
      confidence: low
      rationale: "The conservative tally decision is 3 to 16 dGH at low confidence, with two of six votes agreeing\
        \ on that range. Generator and checker-b propose 3 to 16; checker-c and tiebreaker-1 propose 3 to 20; checker-a\
        \ and tiebreaker-2 propose 3 to 25. Their intersection gives 3 to 16 and contains the natural 3 to 5 dGH.\
        \ AquaInfo and Tropischevissengids recommend 12 to 16, whereas my-fish and Animallux give 8 to 20, Aquario\
        \ and ExpoAqua give 10 to 25, Fishkeeper specifies only an upper bound of 25, and FishBase and FishProfiles\
        \ give 7 to 30. These wider recommendations lack multi-year boundary tests. Sixteen is a cautious planning\
        \ ceiling, not proof of harm above it; Monitarium was unavailable through curl and its indexed care record\
        \ has limited traceable support."

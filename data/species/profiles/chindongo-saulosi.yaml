  sexing:
    text: "Established dominant males are blue with dark vertical bars; females generally remain yellow. Juveniles\
      \ and socially suppressed males may resemble females, so an apparently female-heavy juvenile group can later\
      \ contain several males. Adult size helps only in combination with other signs. Coral Red is a trade label\
      \ with uncertain pedigree and does not establish another natural locality or verified pure line."
    sources:

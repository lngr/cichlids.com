  compatibility:
    text: "The species need not be kept alone with its own kind. Species accounts and keeper observations support\
      \ a community of similarly sized, mild Malawi cichlids that tolerate the same water and plant-rich feeding\
      \ routine. Strong territorial competitors can prevent it from using shelters or taking food. Large fish\
      \ predators and companions dependent on a protein-rich staple are poor matches. No substantiated crossing\
      \ group was found for this species; the empty hybrid-group list reflects limited evidence rather than proof\
      \ that crossing is impossible."

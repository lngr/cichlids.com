  aggressionConspecific:
    value: 1
    confidence: medium
    rationale: "Generator and checker-c proposed level 2, whereas checker-a and checker-b proposed level 1. Borstein\
      \ reports no aggression in his aquarium group, and Malawi.si and NCS describe a calm species. The proposals\
      \ for regular hierarchy chasing mainly infer it from harem management and general mbuna territoriality.\
      \ The species-specific observations favor level 1, allowing display and brief chasing without assuming persistent\
      \ harassment or injuries. Group membership and a polygynandrous mating label alone do not establish level\
      \ 2."

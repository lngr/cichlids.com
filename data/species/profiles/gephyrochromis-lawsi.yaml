  sizeAndGrowth:
    text: "Plan for a typical adult maximum near 12 cm in males and 9 cm in females. Some accounts give males\
      \ of 13 cm, and larger unsexed maxima are published, while one keeper reports smaller adults. These differences\
      \ do not justify feeding for maximum size. Adult body condition and room to move matter more than rapid\
      \ growth. A lifespan around 6 to 10 years is a provisional planning estimate; the published 10-year figure\
      \ is not a survival study."

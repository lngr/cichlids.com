    tolerance:
      value:
        min: 3
        max: 19
      confidence: low
      rationale: "The tally decides 3 to 19 dGH by a qualified majority of four of six votes and retains low confidence.\
        \ Generator proposed 3 to 10, checker-a 3 to 14, checker-b and tiebreaker-1 3 to 18, and checker-c and\
        \ tiebreaker-2 3 to 20 dGH. The 18 and 20 proposals agree under the two-degree rule; their median upper\
        \ bound is 19, while the natural 3 to 5 range fixes the lower extension. OATA recommends 12 to 18, Malawi.si\
        \ allows 3 to 15 and Coburg gives approximately 9.0 to 15.7 dGH if its ppm hardness is calcium-carbonate\
        \ equivalent. Aquarist Atlas, Cichlid Atlas and Nicks give the wider 10 to 20 dGH recommendation. The\
        \ Atlas accounts incorrectly present that hardness as lake-typical, so their habitat claim is rejected\

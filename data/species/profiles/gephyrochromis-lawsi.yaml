partners:
  suitable:
  - species: Comparatively calm Lake Malawi cichlids
    reason: "Species accounts support a community with similarly sized, mild tankmates sharing alkaline water\
      \ and a vegetable-rich staple."
    condition: "Allow space for every adult group, separate shelters and unobstructed feeding access; assess each\
      \ species and individual."
  unsuitable:
  - species: Highly aggressive Lake Malawi mbuna
    reason: Persistent territorial attacks and feeding competition can suppress this comparatively mild species.
  - species: Large piscivorous cichlids
    reason: Predators can injure or consume this modestly sized fish.
  - species: Fish requiring a protein-rich staple
    reason: Their daily feeding regime conflicts with the conservatively decided aufwuchs diet and bloat precaution.
profile:
  overview:
    text: "Blue flanks and a warm dorsal blaze make adult male Gephyrochromis lawsi distinctive among the cichlids\
      \ of northern Lake Malawi. It uses sand beside rocky shores and is usually described as comparatively mild.\
      \ Its accepted name dates to Fryer in 1957. A calm temperament helps in a planned Malawi community, but\
      \ adults still need a long aquarium and space to retreat. Published feeding accounts disagree, so the care\
      \ recommendation uses a plant-rich staple with modest invertebrate supplements."
    sources:
    - kind: catalog-of-fishes
      title: "Eschmeyer's Catalog of Fishes, species in the genus Gephyrochromis"
      url: "https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Gephyrochromis"

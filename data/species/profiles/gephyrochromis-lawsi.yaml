  diet:
    text: "Use algae-based or vegetable-enriched prepared food as the staple and offer small portions of suitable\
      \ invertebrate food as a supplement. This precautionary menu follows the decided aufwuchs category. It does\
      \ not settle the disputed natural diet: several sources emphasize invertebrates collected from sediment,\
      \ others emphasize loose aufwuchs, and some use an omnivore label. Avoid excessive feeding and a daily menu\
      \ dominated by rich animal foods. The bloat precaution has low confidence because no species-specific feeding\
      \ trial or clinical incidence study was verified."

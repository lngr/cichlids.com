  problems:
    text: "Watch for fish that remain hidden, miss meals or cannot leave a dominant fish behind. Rearrange inadequate\
      \ retreats and review stocking if chasing persists. Excess feeding and unstable water can compromise condition.\
      \ A vegetable-rich staple is a precaution because feeding advice differs substantially between sources;\
      \ a bloated fish does not by itself prove that protein caused the problem. Monitor appetite, body shape\
      \ and water quality together."

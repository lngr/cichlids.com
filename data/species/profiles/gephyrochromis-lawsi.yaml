  socialBehavior:
    text: "One male with three females is the chosen aquarium unit, within the published suggestion of two or\
      \ three females per male. Short displays and chases can occur, especially around spawning, but persistent\
      \ damaging harassment is not characteristic of the direct keeper accounts. Provide visual breaks and quieter\
      \ retreats for subordinate fish. Larger mixed-sex groups are reported as an option only with substantially\
      \ more space. The wild mating-system label describes multiple partners and does not establish a precise\
      \ aquarium ratio."

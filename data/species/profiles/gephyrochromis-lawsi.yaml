  sexing:
    text: "Adult males usually show the strongest blue or violet-blue sides and yellow, gold or orange on the\
      \ upper body and fins. Females are generally smaller and brown-grey with much less vivid colour. Juveniles\
      \ and stressed fish can be hard to assess, so colour alone may not establish the sex of a newly purchased\
      \ group. The profile colours describe mature males and allow for differing lighting and locality appearance."

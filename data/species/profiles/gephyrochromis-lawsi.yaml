  husbandry:
    text: "For one male and three females, use at least 350 litres with about 130 cm of length and 50 cm from\
      \ front to back. The depth is a layout estimate, while the volume and length are explicit specialist recommendations.\
      \ Arrange rock refuges with several exits and preserve open sand. Provide effective filtration, oxygenation\
      \ and a regular water-change routine. Species husbandry accounts commonly recommend 23 to 28 C and pH near\
      \ 7.5 to 8.6. The wider listed tolerances include natural lake conditions and conflicting keeping advice;\
      \ their outer bounds are not preferred targets or experimentally demonstrated health thresholds. Manage\
      \ GH and KH separately."

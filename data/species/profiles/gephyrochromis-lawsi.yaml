      4.2 to 4.6 dGH; the older measurements compiled by FAO give about 3.2 to 4.9 dGH. The rounded lake range
      combines these field results. The aquarium advice of 10 to 20 or 12 to 18 dGH does not describe natural
      lake hardness; total hardness measures calcium and magnesium rather than bicarbonate buffering.

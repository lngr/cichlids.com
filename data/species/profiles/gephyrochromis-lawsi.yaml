  diet:
    value:
      type: aufwuchs
      bloatSensitive: true
    confidence: low
    rationale: "The conservative tally decision is aufwuchs with bloatSensitive true and low confidence. Generator\
      \ proposed invertivore/true; checker-a omnivore/false; checker-b and checker-c aufwuchs/true; tiebreaker-1\
      \ invertivore/false; and tiebreaker-2 aufwuchs/true. No qualified majority resolves those six votes, so\
      \ the rubric selects the strictest proposed feeding category and a true flag if any vote proposes it. Malawi-Guru\
      \ recommends an algae-based, protein-restricted staple, while the Atlas accounts describe aufwuchs feeding\
      \ and Nicks recommends a vegetable-rich staple. NCS, Malawi.si and Borstein instead emphasize substrate\
      \ invertebrates; Aquavisie and Nicks use omnivore labels, Abysse reports plankton feeding and Coburg gives\
      \ conflicting aufwuchs and animal-feeding descriptions on the same page. Loose aufwuchs alone does not establish\
      \ the proportions of plant and animal material. The bloat flag is a precautionary inference, not a documented\
      \ species-specific clinical association. FishBase supplies no measured diet composition, CRC supplies no\
      \ public feeding account and the Genner and Turner review is group-level context. Checker-c attributed direct\
      \ feeding evidence to Fryer (1959), but fetch-oa refuses that work as not open access; its inherited citation\
      \ and evidence remain marked unverified and do not determine this decision."

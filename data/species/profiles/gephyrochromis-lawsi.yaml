  habitat:
    text: "Florence Bay is the type locality, and northern localities include Nkhata Bay, Chitimba Bay and Mbamba\
      \ Bay. Most species accounts place the fish over sand close to rocks, often about 7 to 20 metres deep; FishBase\
      \ gives an average near 20 metres. Genner and Turner also report it from Lake Malombe and the Upper Shire\
      \ River, a broader distribution claim than the northern-lake accounts. For aquarium layout, provide sand\
      \ alongside secure rock shelters. Lake Malawi has alkaline, buffered water with relatively little calcium\
      \ and magnesium; high alkalinity does not imply high total hardness."
    sources:

        \ 5 to 15, and checker-c and tiebreaker-2 5 to 10 dKH. All minima are 5; the ordered maxima are 10, 10,\
        \ 12, 15, 15 and 15, so the median 13.5 rounds to 14. The natural 5 to 8 range remains contained. Abysse\
        \ supplies a KH target of 10, JBL recommends 5 to 10, Malawi.si and Malawi Cichlids recommend 6 to 12\
        \ and OATA gives the wider upper recommendation of 10 to 15 dKH. The decided interval is a plausible synthesis\
        \ of buffering practice, not a species-specific long-term tolerance experiment; the wider source recommendation\
        \ reaching 15 stays visible. GH values cannot establish KH limits."

        \ and Nicks support an upper value of 8.6, which also contains the natural maximum. FishBase gives the\
        \ wider lower extension of 7.0 to 8.5 as environmental data, Trop Aquarium gives 6 to 8, Malawi.si gives\
        \ the broader group range of 7.6 to 8.7 and JBL 7.5 to 9.0. These conflicting recommendations are retained,\
        \ but do not establish species-specific long-term health outside the decided interval. Borstein asks for\
        \ alkaline water without numeric pH limits."

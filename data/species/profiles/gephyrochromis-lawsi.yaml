  breeding:
    text: "Females incubate the brood in the mouth without shared male incubation. Aquarium accounts commonly\
      \ give a holding period near three weeks and broods of about 25 to 40 young. Quiet refuges let a holding\
      \ female avoid persistent attention. After release, the fry require appropriately small food and clean water;\
      \ community adults may take fry opportunistically. Published brood sizes and timing vary with the female\
      \ and conditions."

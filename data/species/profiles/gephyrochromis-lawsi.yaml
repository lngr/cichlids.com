  minTank:
    value:
      volumeL: 350
      lengthCm: 130
      depthCm: 50
    confidence: medium
    rationale: "Generator proposed 350 L/130 cm/45 cm, checker-a 200 L/120 cm/40 cm and checker-b and checker-c\
      \ 350 L/130 cm/50 cm. The component medians are 350 L, 130 cm and 47.5 cm. Malawi-Guru explicitly recommends\
      \ at least 350 L and 130 cm for the species alongside a one-male, two-to-three-female arrangement, so the\
      \ median volume and length have direct husbandry support. NCS and Malawi.si give lower 250 L recommendations,\
      \ Aquavisie specifies 120 cm without volume and Abysse lists 300 L. Coburg gives 140 L while requiring more\
      \ for a group. The depth is rounded from the median estimate to 50 cm to leave sand in front of stable shelters\
      \ and escape routes for four adults; no source establishes a minimum depth. The final volume and length\
      \ stay within the published species recommendations, while the inferred depth remains less certain."

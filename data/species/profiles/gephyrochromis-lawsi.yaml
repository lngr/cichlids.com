    tolerance:
      value:
        min: 21
        max: 30
      confidence: low
      rationale: "The tally decides 21 to 30 C with unanimous agreement under its one-degree comparison rule and\
        \ low confidence. Generator proposed 20 to 30 C, checker-a 21 to 30 C, checker-b 21 to 29 C and checker-c\
        \ 21 to 30 C; the decision uses the agreeing bounds and contains the natural 21 to 29 C interval. NCS\
        \ recommends 23 to 28 C, FishBase 24 to 28 C, Borstein about 24 to 28 C, and Trop Aquarium 25 to 30 C.\
        \ Thus the warm extension has a dealer recommendation, but prolonged healthy maintenance at both extremes\
        \ is untested; a stable value within the central husbandry recommendations is preferable."
      sources:
      - kind: database
        title: "Nordiska Ciklidsällskapet: Gephyrochromis lawsi species register"

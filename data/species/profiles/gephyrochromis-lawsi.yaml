  temperatureC:
    value:
      min: 21
      max: 29
    confidence: high
    rationale: "The settled Lake Malawi decision is 21 to 29 C. This is a synthesis across seasons and study areas,\
      \ not a species-specific preferred aquarium interval. Branchu measured 22.8 to 25.4 C through a northern-basin\
      \ profile; FAO gives surface water of 23 to 25 C, while Vollmer and the lake studies provide seasonal context.\
      \ FishBase gives 24 to 28 C and NCS recommends 23 to 28 C, neither of which replaces the lake-wide decision.\
      \ Some inherited evidence assigns the complete synthesis to one study; those entries remain explicitly qualified."

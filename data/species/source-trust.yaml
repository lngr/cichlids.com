# Trust levels of the sources cited in species profiles.
#
# A source counts with the level of the first entry whose host matches the host of its url or a
# parent domain of it, and whose optional path is a prefix of the url path. Copies on
# web.archive.org and archive.org count like the archived url. A source without a url counts by
# its kind (byKind). Every other source counts as low.
#
# high:   curated by specialists with traceable evidence (scientific catalogs and databases,
#         peer-reviewed literature, theses, books of known authors, reports and measurements of
#         authorities and research institutes)
# medium: serious sources with people and method behind them, without an evidence duty
#         (associations, magazines, large dealers with staff, specialist sites)
# low:    forums, blogs, general care-sheet aggregators, small shops, Wikipedia

default: low

byKind:
  catalog-of-fishes: high
  literature: high
  database: medium
  website: low
  forum: low
  archive: low
  model-knowledge: low


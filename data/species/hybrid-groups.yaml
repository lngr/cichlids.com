        url: https://doi.org/10.1038/s41598-018-34135-x
        accessed: 2026-10-13
        note: Obtains viable, fertile hybrids by isolating male L. trewavasae with female L. fuelleborni from Chidunga Rocks; a forced cross that shows interfertility.

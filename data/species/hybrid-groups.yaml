        accessed: 2026-10-12
  - id: protomelas-taeniolatus-complex
    description: Protomelas taeniolatus and the very similar Protomelas fenestratus, whose plain striped females are hard to tell apart and whose species and colour forms may cross when kept together.
    members:
      - Protomelas taeniolatus
      - Protomelas fenestratus
    sources:
      - kind: database
        title: "Seriously Fish: Protomelas taeniolatus"
        url: https://www.seriouslyfish.com/species/protomelas-taeniolatus/
        accessed: 2026-10-12
      - kind: database
        title: "Seriously Fish: Protomelas fenestratus"
        url: https://www.seriouslyfish.com/species/protomelas-fenestratus/
        accessed: 2026-10-12
  - id: chindongo-elongatus-complex
    description: Chindongo elongatus and its closest elongate, blue-barred relatives C. longior and C. flavus, which the hobby warns not to keep together because the forms of the elongatus complex interbreed in tanks; the group rests on these crossing warnings and the close relationship, and no cross between the three species is documented.
    members:
      - Chindongo elongatus
      - Chindongo longior
      - Chindongo flavus
    sources:
      - kind: database
        title: "Seriously Fish: Pseudotropheus elongatus (Elongate Mbuna)"
        url: https://www.seriouslyfish.com/species/pseudotropheus-elongatus/
        accessed: 2026-10-13
        note: Reports that the more than thirty elongatus forms of Lake Malawi interbreed readily and must not be mixed in the aquarium.
      - kind: database
        title: "Seriously Fish: Pseudotropheus flavus"
        url: https://www.seriouslyfish.com/species/pseudotropheus-flavus/
        accessed: 2026-10-13
        note: Warns against keeping C. flavus with C. elongatus or any member of its complex, because the species interbreed and the males clash heavily.
      - kind: literature
        title: >-
          Seegers, L. (1996). The identity of Pseudotropheus elongatus, with the description of P.
          longior from Mbamba Bay, Tanzania, and notes on Genyochromis mento (Teleostei: Cichlidae).
          Ichthyological Exploration of Freshwaters 7(2), 97-110 (bibliographic record in the
          Catalog of Fishes; diagnosis as quoted by M. K. Oliver).
        url: https://researcharchive.calacademy.org/research/ichthyology/catalog/getref.asp?id=22571
        accessed: 2026-10-13
        note: Restricts C. elongatus to the short, deep-bodied barred form of Mbamba Bay and describes the sympatric, slenderer C. longior from the same elongatus forms.
      - kind: literature
        title: >-
          Li, S., Konings, A. F. and Stauffer, J. R. (2016). A revision of the Pseudotropheus
          elongatus species group (Teleostei: Cichlidae) with description of a new genus and seven
          new species. Zootaxa 4168(2), 353-381 (abstract).
        url: https://doi.org/10.11646/zootaxa.4168.2.9
        accessed: 2026-10-13
        note: Places C. elongatus, C. longior and C. flavus together in Chindongo, the barred core of the former elongatus species group; reports no crosses.
  - id: amatitlania-nigrofasciata-complex
    description: The convict cichlid and the three species described in 2007 from its southern and lake populations, which share one morphological clade and are treated as synonyms by some authors; the group rests on this close relationship and the former single-species concept, and no cross between the four species is documented.
    members:
      - Amatitlania nigrofasciata
      - Amatitlania siquia
      - Amatitlania kanna
      - Amatitlania coatepeque
    sources:
      - kind: literature
        title: >-
          Schmitter-Soto, J. J. (2007). A systematic revision of the genus Archocentrus (Perciformes:
          Cichlidae), with the description of two new genera and six new species. Zootaxa 1603, 1-78
          (abstract only).
        url: https://doi.org/10.11646/zootaxa.1603.1.1
        accessed: 2026-10-12
        note: Erects Amatitlania with A. nigrofasciata as type species and describes A. siquia, A. kanna and A. coatepeque from populations formerly placed in A. nigrofasciata.
      - kind: literature
        title: >-
          Schmitter-Soto, J. J. (2007). Phylogeny of species formerly assigned to the genus
          Archocentrus (Perciformes: Cichlidae). Zootaxa 1618 (abstract only).
        url: https://doi.org/10.11646/zootaxa.1618.1.1
        accessed: 2026-10-12
        note: Resolves the four species as one clade within Amatitlania, with A. coatepeque as sister to A. nigrofasciata plus A. siquia and A. kanna.
      - kind: literature
        title: >-
          Practical Fishkeeping (2007). Convict and Jack Dempsey placed in new genera. News item on
          Schmitter-Soto (2007), Zootaxa 1603 (archived copy).
        url: https://web.archive.org/web/20071228234519/http://www.practicalfishkeeping.co.uk/pfk/pages/item.php?news=1399
        accessed: 2026-10-12
        note: Reports the split of the convict cichlid into four species and the ranges of the new species, with A. siquia from Costa Rica north to Atlantic Honduras.
      - kind: database
        title: "FishBase species summary: Amatitlania nigrofasciata"
        url: https://www.fishbase.se/summary/Amatitlania-nigrofasciata.html
        accessed: 2026-10-12
        note: Separates A. nigrofasciata from A. siquia, A. kanna and A. coatepeque by subtle morphological characters and assigns the southern populations to them.
  - id: placidochromis-electra-complex
    description: Placidochromis phenochilus and its close relative P. electra, blue sand-dwelling followers of sand-sifting cichlids that some authors treated as one variable species; the group rests on a hobby warning that the two hybridise when kept together and on this close relationship, and no cross between the two species is documented.
    members:
      - Placidochromis phenochilus
      - Placidochromis electra
    sources:
      - kind: literature
        title: >-
          Rizzo, D. The Blue Followers: the Placidochromis of Lake Malawi. Conscientious Aquarist
          (WetWebMedia) 6(1).
        url: http://www.wetwebmedia.com/ca/volume_6/volume_6_1/placidochromis.htm
        accessed: 2026-10-13
        note: Treats P. phenochilus and P. electra as a group of close relatives, formerly regarded as one species, and advises against keeping them together because they hybridise.
      - kind: database
        title: "Seriously Fish: Placidochromis electra (Deepwater Hap)"
        url: https://www.seriouslyfish.com/species/placidochromis-electra/
        accessed: 2026-10-13
        note: Warns that the colour forms of P. electra may hybridise and must not be mixed; does not name P. phenochilus.
  - id: labeotropheus
    description: All valid species of the scrapermouth genus Labeotropheus, whose slender and deep-bodied forms are traded as colour forms of L. trewavasae and L. fuelleborni; aquarium crosses of L. fuelleborni and L. trewavasae in both directions are documented (Pauers et al.), and the hobby warns against keeping Labeotropheus forms together.
    members:
      - Labeotropheus fuelleborni
      - Labeotropheus trewavasae
      - Labeotropheus alticodia
      - Labeotropheus artatorostris
      - Labeotropheus aurantinfra
      - Labeotropheus candipygia
      - Labeotropheus chirangali
      - Labeotropheus chlorosiglos
      - Labeotropheus obscurus
      - Labeotropheus rubidorsalis
      - Labeotropheus simoneae
    sources:
      - kind: literature
        title: >-
          Pauers, M. J., Fox, K. R., Hall, R. A. and Patel, K. (2018). Selection, hybridization,
          and the evolution of morphology in the Lake Malawi endemic cichlids of the genus
          Labeotropheus. Scientific Reports 8, 15842.
        url: https://doi.org/10.1038/s41598-018-34135-x
        accessed: 2026-10-13
        note: Produces hybrids in aquaria by isolating male L. trewavasae with female L. fuelleborni from Chidunga Rocks; the hybrids are viable and fertile and gave an inbred F2 generation.
      - kind: literature
        title: >-
          Pauers, M. J., Hoffmann, J. and Ackley, L. J.-B. (2023). Differences among reciprocal
          hybrids of Labeotropheus. Hydrobiologia 850, 2149-2164.
        url: https://doi.org/10.1007/s10750-022-05092-4
        accessed: 2026-10-13
        note: Crosses L. fuelleborni and L. trewavasae in both directions and raises both reciprocal hybrids to adulthood in aquaria.
      - kind: database
        title: "Seriously Fish: Labeotropheus trewavasae"
        url: https://www.seriouslyfish.com/species/labeotropheus-trewavasae/
        accessed: 2026-10-13
        note: Warns that the more than forty colour forms may hybridise and should not be mixed in aquaria.
  - id: heros
    description: The five valid species of the severum genus Heros, which look alike and are mixed up in the trade, where most severums are H. efasciatus or stock of unclear origin; the group rests on this close relationship, the confusion of the species in the trade and hobby reports of mixed captive stock, and no cross between the species is documented.
    members:
      - Heros severus
      - Heros efasciatus
      - Heros liberifer
      - Heros notatus
      - Heros spurius
    sources:
      - kind: catalog-of-fishes
        title: "Eschmeyer's Catalog of Fishes, species of the genus Heros"
        url: https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Heros
        accessed: 2026-10-13
        note: Lists H. severus, H. efasciatus, H. liberifer, H. notatus and H. spurius as the valid species; all other nominal species of the genus are synonyms.
      - kind: literature
        title: >-
          U.S. Fish and Wildlife Service (2026). Banded Cichlid (Heros severus), Ecological Risk
          Screening Summary, web version 2/4/2026, with passages of Staeck, W. and Schindler, I.
          (2015), Bulletin of Fish Biology 15(1/2), 121-136.
        url: https://www.fws.gov/sites/default/files/documents/2026-02/ecological-risk-screening-summary-banded-cichlid-feb-2026.pdf
        accessed: 2026-10-13
        note: Quotes Staeck and Schindler on the unresolved alpha taxonomy of Heros and on imports that fit none of the described species; reports no cross.
      - kind: literature
        title: >-
          Bleher, H. (2016). Heiko Bleher discovers: South American surprises. Practical
          Fishkeeping (online feature).
        url: https://www.practicalfishkeeping.co.uk/features/heiko-bleher-discovers-south-american-surprises
        accessed: 2026-10-13
        note: Describes a Heros from the Inírida basin that fits none of the described species and expects more species and many colour forms in the genus.
      - kind: database
        title: "Seriously Fish: Heros efasciatus (Severum)"
        url: https://www.seriouslyfish.com/species/heros-efasciatus/
        accessed: 2026-10-13
        note: Treats the common green and gold severum of the trade as H. efasciatus; gives no crossing warning.
      - kind: website
        title: >-
          Schäfer, F. (2015). The mouthbrooding Heros from Venezuela: a new species! Heros
          liberifer. Aquarium Glaser fish archive (wholesaler).
        url: https://www.aquariumglaser.de/en/fish-archives/the_mouthbrooding_heros_from_venezuela_a_new_species_heros_liberifer_en/
        accessed: 2026-10-13
        note: Hobby report that attributes the variable bar pattern of captive-bred true H. severus to unwanted hybridisation and notes that H. severus and H. liberifer occur together in Venezuela.

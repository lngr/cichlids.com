# Curated hybrid groups: closely related species that cross in tanks. Every member of a group may
# cross with every other member, and a documented cross of two species without a wider group is a
# group of two members. Members are valid names. Crossability is not transitive, so a species
# belongs to every group whose crosses concern it. When the vote of the species pipeline decides a
# group that is not listed, the adjudicator adds it with its members and the sources that report
# crosses.
#
# Every group has a basis that states the strength of its evidence and sets the conflict level of
# the compatibility check for two species that share the group:
#   documented  at least one cross between named members is reported from the wild or from an
#               aquarium where the fish could choose partners of their own species; shared
#               membership is a hard conflict (warning).
#   presumed    only general warnings exist, such as hobby sources saying that the species of a
#               genus cross and must not share a tank, or a very close relationship; shared
#               membership is a medium conflict (caution).
# A forced laboratory cross, such as females kept without a male of their own species, does not
# make a group documented. A report of a cross between two specific species where free choice of
# partners is not shown gives a group of those two species with the basis presumed.
#
# Every group has a userNote of one or two plain-English sentences for hobbyists, shown next to the
# caution or warning of the stocking planner. It explains the background of the group and gives no
# instructions: what was observed (wild hybrids, a tank report, only a general warning about
# the genus, a forced laboratory cross that does not count), where and by whom where known, and how
# reliable that evidence is, so that a reader understands why the planner shows the caution or
# warning.
groups:
  - id: maylandia
    description: All valid species of the zebra mbuna genus Maylandia (Metriaclima), whose blue, barred or orange forms look alike and which hobby sources warn may cross when several species share a tank; the group rests on these warnings for the genus as a whole and on fertile laboratory crosses within the genus, while documented crosses exist only for M. zebra with M. callainos and with Cynotilapia afra, which have groups of their own.
    basis: presumed
    userNote: >-
      Hobby sources and a wholesaler warn in general terms that the zebra mbuna of this genus
      interbreed in tanks, and researchers have raised fertile hybrids of two species by artificial
      fertilisation. Crosses between named species from the wild are documented only for the pairs
      listed separately, so the caution for the rest of the genus rests on these general warnings.

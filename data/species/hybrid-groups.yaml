  - id: amatitlania-nigrofasciata-complex
    description: The convict cichlid and the three species described in 2007 from its southern and lake populations, which form one clade, are separated only by subtle characters and are partly not recoverable as distinct genetic lineages; the group rests on this very close relationship, and no cross between the four species is documented.
    basis: presumed
    userNote: >-
      The convict cichlid and the three species split from it in 2007 are very closely related, and
      genetic work cannot always tell them apart. No cross between them is documented; the caution
      rests on that close relationship.
    members:

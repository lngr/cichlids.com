        url: https://doi.org/10.1111/j.1365-294x.2004.02240.x
        accessed: 2026-10-12
        note: Finds with microsatellites a high share of hybrids between introduced C. afra and native Metriaclima zebra on the turbid southern coast of Thumbi West Island.
      - kind: literature
        title: >-
          Zidana, H., Turner, G. F., Van Oosterhout, C. and Hänfling, B. (2009). Elevated mtDNA
          diversity in introduced populations of Cynotilapia afra (Günther 1894) in Lake Malawi

# Curated hybrid groups: closely related species that cross in tanks. Every member of a group may
# cross with every other member, and a documented cross of two species without a wider group is a
# group of two members. Members are valid names. Crossability is not transitive, so a species
# belongs to every group whose crosses concern it. When the vote of the species pipeline decides a
# group that is not listed, the adjudicator adds it with its members and the sources that report
# crosses.
#
# Every group has a basis that states the strength of its evidence and sets the conflict level of
# the compatibility check for two species that share the group:
#   documented  at least one cross between named members is reported from the wild or from an
#               aquarium where the fish could choose partners of their own species; shared
#               membership is a hard conflict (warning).
#   presumed    only general warnings exist, such as hobby sources saying that the species of a
#               genus cross and must not share a tank, or a very close relationship; shared
#               membership is a medium conflict (caution).
# A forced laboratory cross, such as females kept without a male of their own species, does not
# make a group documented.
groups:
  - id: maylandia
    description: Species of Maylandia (Metriaclima), which cross readily in tanks, also across colour forms, together with the look-alike Cynotilapia afra, whose blue barred males resemble Maylandia zebra and which forms hybrids with it in the wild where it was introduced to Thumbi West Island in Lake Malawi.
    basis: documented
    members:
      - Maylandia zebra
      - Maylandia estherae
      - Maylandia callainos
      - Maylandia greshakei
      - Maylandia lombardoi
      - Cynotilapia afra
    sources:
      - kind: literature
        title: >-
          Stauffer, J. R., Bowers, N. J., Kocher, T. D. and McKaye, K. R. (1996). Evidence of
          hybridization between Cynotilapia afra and Pseudotropheus zebra (Teleostei: Cichlidae)
          following an intralacustrine translocation in Lake Malawi. Copeia 1996(1), 203-208
          (title and bibliographic record).
        url: https://doi.org/10.2307/1446959
        accessed: 2026-10-12
        note: Reports hybridisation between C. afra and Pseudotropheus (Maylandia) zebra after C. afra was moved within Lake Malawi.
      - kind: literature
        title: >-
          Streelman, J. T., Gmyrek, S. L., Kidd, M. R., Kidd, C., Robinson, R. L., Hert, E.,
          Ambali, A. J. and Kocher, T. D. (2004). Hybridization and contemporary evolution in an

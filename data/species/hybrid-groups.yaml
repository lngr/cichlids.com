  - id: neolamprologus-brichardi-complex
    description: The princess cichlids of the Neolamprologus savoryi complex, small lyre-tailed cave breeders of Lake Tanganyika that live in helper families and form one young clade with repeated gene exchange, which hobby sources warn hybridise freely when mixed in a tank; the group rests on this warning and the very close relationship, while no cross of N. brichardi with a named member under free choice of partners is documented.
    basis: presumed
    userNote: >-
      Hobby databases warn that the princess cichlids of this complex hybridise freely when several
      of them share a tank, and genetic studies show that the species are very young and exchanged
      genes in the lake in the past. No tank cross between two named species with free choice of
      partners is documented, so the caution rests on that general warning and the close relationship.
    members:
      - Neolamprologus brichardi
      - Neolamprologus pulcher
      - Neolamprologus savoryi
      - Neolamprologus splendens
      - Neolamprologus falcicula
      - Neolamprologus gracilis
      - Neolamprologus marunguensis
    sources:
      - kind: database
        title: "Seriously Fish: Neolamprologus brichardi"
        url: https://www.seriouslyfish.com/species/neolamprologus-brichardi/
        accessed: 2026-10-13
        note: Says that the members of the brichardi complex, naming N. pulcher, N. savoryi, N. splendens, N. falcicula, N. gracilis and N. crassus, hybridise freely and must not be mixed in tanks; reports no particular cross.
      - kind: database
        title: "Seriously Fish: Neolamprologus pulcher"
        url: https://www.seriouslyfish.com/species/neolamprologus-pulcher/
        accessed: 2026-10-13
        note: Gives the same warning for the complex and lists N. helianthus among its members.
      - kind: literature
        title: >-
          Sturmbauer, C., Salzburger, W., Duftner, N., Schelly, R. and Koblmüller, S. (2010).

  - id: nimbochromis
    description: The five valid species of the Lake Malawi predator genus Nimbochromis, close relatives with a similar blotched camouflage pattern in females and juveniles, of which a wholesaler and a Malawi specialist directory warn in general terms that they may cross in tanks; no cross between named species with free choice of partners is documented.
    basis: presumed
    userNote: >-
      The German wholesaler Aquarium Glaser and the German Malawi directory Malawi-Guru warn in
      general terms that Nimbochromis species can interbreed when kept together, and a US dealer
      has offered fish sold as a cross of N. venustus and N. livingstonii without saying how it
      arose. No study or keeper report confirms a cross between named species that could choose
      partners of their own kind, so the caution rests on these hobby warnings and the close
      relationship of the five species.
    members:
      - Nimbochromis fuscotaeniatus

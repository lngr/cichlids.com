  - id: melanochromis
    description: All valid species of the mbuna genus Melanochromis, whose striped males and golden or pale females look alike; Seriously Fish (on its M. auratus and M. chipokae pages), TFH Magazine, M. K. Oliver and AquaInfo warn that M. auratus crosses with other Melanochromis and must not share a tank with them, warnings phrased for the whole genus rather than for named pairs, so the group covers every species the Catalog of Fishes lists as valid in Melanochromis and none of the striped species now placed in Pseudotropheus (such as P. johannii), which no source names as crossing partners; no published cross between two named species is documented, and Konings and Stauffer (2012) found no hybrids where M. loriae was introduced among M. heterochromis in Lake Malawi.
    basis: presumed
    members:

  - id: tropheus-brichardi-black
    description: Tropheus brichardi and the undescribed Tropheus sp. 'black' of the northern lake, whose populations along the Ubwari peninsula and the Bujumbura basin carry each other's mitochondrial lineages, including a sympatric pair that points to hybridisation and mitochondrial capture.
    basis: documented
    userNote: >-
      Genetic studies of populations in the north of Lake Tanganyika find that T. brichardi and T.
      sp. 'black' carry each other's mitochondrial lineages, which points to hybridisation in the
      wild. The evidence is genetic rather than a direct observation of crosses.

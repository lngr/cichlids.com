          patterns in the cichlid genus Tropheus. Hydrobiologia 791, 51-68 (published online 2016).
        url: https://doi.org/10.1007/s10750-016-2939-8
        accessed: 2026-10-13
        note: Stresses considerable past gene flow among Tropheus taxa regarded as valid species; notes that T. duboisi co-occurs with T. sp. 'black' and with T. brichardi and reports no hybrids involving it.

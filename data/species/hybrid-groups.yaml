  - id: altolamprologus
    description: The two sister species Altolamprologus calvus and A. compressiceps, which split so recently that neither is genetically monophyletic and which hobbyists advise not to breed together; they live side by side in the south of the lake as distinct forms with little gene flow, and no cross between them is documented.
    basis: presumed
    userNote: >-
      A. calvus and A. compressiceps split so recently that neither is genetically distinct from the
      other, and hobbyists advise against breeding them together. In the lake they live side by side
      as distinct forms with little gene flow, and no cross is documented; a forum keeper's claim
      that they interbreed is unconfirmed.
    members:
      - Altolamprologus calvus
      - Altolamprologus compressiceps
    sources:
      - kind: literature
        title: >-
          Koblmüller, S., Nevado, B., Makasa, L., Van Steenberge, M., Vanhove, M. P. M., Verheyen,
          E., Sturmbauer, C. and Sefc, K. M. (2017). Phylogeny and phylogeography of
          Altolamprologus: ancient introgression and recent divergence in a rock-dwelling Lake
          Tanganyika cichlid genus. Hydrobiologia 791, 35-50 (published online 2016).
        url: https://doi.org/10.1007/s10750-016-2896-2
        accessed: 2026-10-13
        note: Dates the split of the two species to 67,000 to 142,000 years ago and finds neither monophyletic in mitochondrial or nuclear trees; gene flow after the split was low if any, and no hybrids are reported.
      - kind: literature
        title: >-
          Spreitzer, M. L., Mautner, S., Makasa, L. and Sturmbauer, C. (2012). Genetic and
          morphological population differentiation in the rock-dwelling and specialized
          shrimp-feeding cichlid fish species Altolamprologus compressiceps from Lake Tanganyika,
          East Africa. Hydrobiologia 682, 143-154 (published online 2011).
        url: https://doi.org/10.1007/s10750-011-0698-0
        accessed: 2026-10-13
        note: Notes incomplete lineage sorting between the two species and takes their stable coexistence in sympatry as a sign of reproductive isolation.
      - kind: catalog-of-fishes
        title: Eschmeyer's Catalog of Fishes, species of the genus Altolamprologus (online version updated 21 Sep. 2026)
        url: https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Altolamprologus
        accessed: 2026-10-13
        note: Lists A. calvus, A. compressiceps and A. fasciatus as valid; A. fasciatus is no close relative of the other two.
      - kind: archive
        title: cichlids.com forum thread 13809
        url: https://www.cichlids.com/disc/read.php?2,13809
        note: A keeper states that the two species interbreed; unconfirmed.
      - kind: archive
        title: cichlids.com forum thread 41333
        url: https://www.cichlids.com/disc/read.php?2,41333

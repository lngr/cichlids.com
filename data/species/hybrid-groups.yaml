  - id: tropheus
    description: All Tropheus species, the four valid ones and the undescribed species that Konings recognises, which are so closely related that genes have passed between them repeatedly in the lake and which the hobby, selling most of them as T. moorii, warns not to mix; crosses are documented only for the pairs listed as separate groups, T. duboisi and T. annectens have no reported cross, and several sympatric species keep apart in the wild.
    basis: presumed
    userNote: >-
      Tropheus species and forms are so closely related that genes have passed between them
      repeatedly in the lake, and hobby sources report that forms kept together hybridise freely.
      Crosses between named species are documented only for the pairs listed separately, so for the
      other combinations the caution rests on the close relationship and these general warnings.
    members:
      - Tropheus moorii
      - Tropheus duboisi
      - Tropheus brichardi
      - Tropheus annectens
      - "Tropheus sp. 'black'"
      - "Tropheus sp. 'red'"
      - "Tropheus sp. 'Mpimbwe'"
      - "Tropheus sp. 'Ikola'"
    sources:
      - kind: catalog-of-fishes
        title: Eschmeyer's Catalog of Fishes, species of the genus Tropheus (online version updated 21 Sep. 2026)
        url: https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Tropheus
        accessed: 2026-10-13
        note: Lists T. moorii, T. duboisi, T. brichardi and T. annectens as valid; T. polli and T. kasabae are synonyms of T. annectens and T. moorii.
      - kind: literature
        title: Konings, A. (2009). Tropheus - home is where the rocks are. Practical Fishkeeping.
        url: https://www.practicalfishkeeping.co.uk/features/tropheus-home-is-where-the-rocks-are/
        accessed: 2026-10-13
        note: Counts at least eight species including T. sp. 'black', 'red', 'mpimbwe' and 'ikola', notes that the hobby calls almost all of them T. moorii and warns that races or localities kept together often hybridise.
      - kind: literature
        title: >-
          Egger, B., Koblmüller, S., Sturmbauer, C. and Sefc, K. M. (2007). Nuclear and
          mitochondrial data reveal different evolutionary processes in the Lake Tanganyika cichlid
          genus Tropheus. BMC Evolutionary Biology 7, 137.
        url: https://doi.org/10.1186/1471-2148-7-137
        accessed: 2026-10-13
        note: Finds introgression between morphs and species across the genus, while sympatric T. sp. 'black' and T. polli (T. annectens) keep a reproductive barrier.
      - kind: literature
        title: >-
          Sturmbauer, C., Börger, C., Van Steenberge, M. and Koblmüller, S. (2017). A separate

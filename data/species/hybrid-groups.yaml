# Curated hybrid groups: closely related species that cross in tanks. Two species of the same group
# in one tank are a hard conflict of the compatibility check. Members are valid names; a species
# belongs to at most one group. When the vote of the species pipeline decides a group that is not
# listed, the adjudicator adds it with its members and the sources that report crosses.
groups:
  - id: maylandia
    description: Species of Maylandia (Metriaclima); they cross readily in tanks, also across colour forms.
    members:
      - Maylandia zebra
      - Maylandia estherae
      - Maylandia callainos
      - Maylandia greshakei
      - Maylandia lombardoi
  - id: tropheus
    description: All Tropheus species and locality forms; locality forms are kept apart as well to preserve them.
    members:
      - Tropheus moorii
      - Tropheus duboisi
      - Tropheus brichardi
      - Tropheus annectens
  - id: aulonocara
    description: Peacock cichlids of the genus Aulonocara; females look alike and cross easily.
    members:
      - Aulonocara stuartgranti
      - Aulonocara jacobfreibergi
      - Aulonocara baenschi
  - id: amphilophus-citrinellus-complex
    description: Midas and red devil cichlids of the Amphilophus citrinellus complex.
    members:
      - Amphilophus citrinellus
      - Amphilophus labiatus
  - id: symphysodon
    description: All discus species and their aquarium strains.
    members:
      - Symphysodon aequifasciatus
      - Symphysodon discus
      - Symphysodon tarzoo
  - id: cyphotilapia
    description: The two frontosa species of Lake Tanganyika, which look alike, meet in a natural hybrid zone in the middle of the lake and are often mixed up in the trade.
    members:
      - Cyphotilapia frontosa
      - Cyphotilapia gibberosa
    sources:
      - kind: literature
        title: >-
          Jackson, G. D., Standish, T., Cetintas, O., Zinenko, O., Shechonge, A. H. and Yanchukov,
          A. (2024). Population genetics and gene flow in Cyphotilapia frontosa and Cyphotilapia
          gibberosa along the east coast of Lake Tanganyika. Fishes 9(12), 481.
        url: https://doi.org/10.3390/fishes9120481
        accessed: 2026-10-12
      - kind: database
        title: Tanganyika.si, Cyphotilapia frontosa 'Kigoma'
        url: https://tanganyika.si/TanganjikaByLocations/Kigoma/slides/Cyphotilapia%20frontosa%20%27Kigoma%27.html
        accessed: 2026-10-12
  - id: labidochromis
    description: Described Labidochromis species common in the trade, whose slender bodies and pale or yellowish females look alike; the hobby warns that they and the colour forms of L. caeruleus may cross when kept together.
    members:
      - Labidochromis caeruleus
      - Labidochromis chisumulae
      - Labidochromis mbenjii
      - Labidochromis freibergi
      - Labidochromis vellicans
    sources:
      - kind: database
        title: "Seriously Fish: Labidochromis caeruleus"
        url: https://www.seriouslyfish.com/species/labidochromis-caeruleus/
        accessed: 2026-10-12
      - kind: literature
        title: >-
          Tawil, P. (2019). Labidochromis chisumulae, the striped relative of Labidochromis
          caeruleus. Cichlid News Magazine 28(2), 6-10 (abstract only).
        url: https://cichlidae.com/reference.php?id=9305
        accessed: 2026-10-12
      - kind: literature
        title: >-
          Cicek, E., Fricke, R., Sungur, S., Capar, O. B. and Golani, D. (2023). Freshwater fishes
          of Israel; a revised and updated annotated checklist 2023. Zootaxa 5369(4), 451-484,
          treatment of Labidochromis caeruleus (via Plazi).
        url: https://treatment.plazi.org/id/03EC8B3A8F00607595F1D076FE5FB8BD
        accessed: 2026-10-12
      - kind: literature
        title: >-
          DeLorenzo, L. et al. (2021). Genetic basis of body shape variation along the
          benthic-pelagic axis in cichlid fishes. bioRxiv preprint, published 2023 in Molecular
          Ecology 32(14).
        url: https://doi.org/10.1101/2021.10.02.462884
        accessed: 2026-10-12
  - id: protomelas-taeniolatus-complex
    description: Protomelas taeniolatus and the very similar Protomelas fenestratus, whose plain striped females are hard to tell apart and whose species and colour forms may cross when kept together.
    members:
      - Protomelas taeniolatus
      - Protomelas fenestratus
    sources:
      - kind: database
        title: "Seriously Fish: Protomelas taeniolatus"
        url: https://www.seriouslyfish.com/species/protomelas-taeniolatus/
        accessed: 2026-10-12
      - kind: database
        title: "Seriously Fish: Protomelas fenestratus"
        url: https://www.seriouslyfish.com/species/protomelas-fenestratus/
        accessed: 2026-10-12

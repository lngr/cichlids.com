        url: https://tanganyika.si/TanganjikaByLocations/Kigoma/slides/Cyphotilapia%20frontosa%20%27Kigoma%27.html
        accessed: 2026-10-12
  - id: labidochromis
    description: Described Labidochromis species common in the trade, whose slender bodies and pale or yellowish females look alike; the hobby warns that they and the colour forms of L. caeruleus may cross when kept together.
    members:
      - Labidochromis caeruleus
      - Labidochromis chisumulae
      - Labidochromis mbenjii
      - Labidochromis freibergi
      - Labidochromis vellicans
    sources:

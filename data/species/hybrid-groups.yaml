        url: https://doi.org/10.1371/journal.pcbi.1006650
        accessed: 2026-10-13
        note: Remarks, after Konings (2015), that princess cichlids are well known to hybridise when kept in one aquarium; names no pair and no circumstances.
      - kind: catalog-of-fishes
        title: "Eschmeyer's Catalog of Fishes, species of the genus Neolamprologus"
        url: https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Neolamprologus
        accessed: 2026-10-13
        note: Lists the seven members as valid; N. crassus, N. olivaceous and N. daffodil are synonyms of N. pulcher, N. helianthus of N. splendens and N. chitamwebwai of N. falcicula.
  - id: neolamprologus-brichardi-pulcher
    description: Neolamprologus brichardi and N. pulcher, two forms that differ mainly in the bars on the gill cover, are never found side by side and do not separate in mitochondrial DNA, for which a field study names past hybridisation as one possible explanation of an intermediate population and a later genome comparison is summarised as supporting an old hybridisation event, while no hybrid fish is described.
    basis: presumed
    userNote: >-
      These two forms are so closely related that a genetic study of wild populations proposes
      treating them as one species and names past hybridisation as only one possible reason for a
      population with intermediate head markings; a later genome study is reported to support an old
      hybridisation event, but only through a brief summary. No hybrid fish from the wild or from a
      tank is described, so the evidence is indirect and its circumstances are unclear.
    members:
      - Neolamprologus brichardi
      - Neolamprologus pulcher
    sources:
      - kind: literature
        title: >-
          Duftner, N., Sefc, K. M., Koblmüller, S., Salzburger, W., Taborsky, M. and Sturmbauer, C.
          (2007). Parallel evolution of facial stripe patterns in the Neolamprologus
          brichardi/pulcher species complex endemic to Lake Tanganyika. Molecular Phylogenetics and
          Evolution 45, 706-715.
        url: https://doi.org/10.1016/j.ympev.2007.08.001
        accessed: 2026-10-13
        note: Finds that wild N. brichardi and N. pulcher fall into mixed mitochondrial clades, notes that the two never occur together, reads the intermediate fish at Chaitika as either a transitional stripe pattern or the result of past hybridisation, cannot exclude mitochondrial introgression and proposes one species; reports no hybrid fish.
      - kind: literature
        title: >-
          Bouckaert, R., Vaughan, T. G., Barido-Sottani, J., Duchêne, S., Fourment, M.,
          Gavryushkina, A. et al. (2019). BEAST 2.5: An advanced software platform for Bayesian
          evolutionary analysis. PLoS Computational Biology 15, e1006650.
        url: https://doi.org/10.1371/journal.pcbi.1006650
        accessed: 2026-10-13
        note: Summarises in one sentence that genome phylogenies of Gante et al. (2016) supported a past hybridisation event between N. brichardi and N. pulcher; a secondary statement without details on time or place.
      - kind: literature
        title: >-
          Gante, H. F., Matschiner, M., Malmstrøm, M., Jakobsen, K. S., Jentoft, S. and Salzburger,
          W. (2016). Genomics of speciation and introgression in Princess cichlid fishes from Lake
          Tanganyika. Molecular Ecology 25, 6143-6161 (abstract).
        url: https://doi.org/10.1111/mec.13767
        accessed: 2026-10-13
        note: The primary genome study; its full text is not open access and the abstract reports several introgression events without naming the species involved.
      - kind: database
        title: "Seriously Fish: Neolamprologus brichardi"
        url: https://www.seriouslyfish.com/species/neolamprologus-brichardi/
        accessed: 2026-10-13
        note: States that the two hybridise and should not share a tank, without describing a case.
      - kind: catalog-of-fishes
        title: "Eschmeyer's Catalog of Fishes, species of the genus Neolamprologus"
        url: https://researcharchive.calacademy.org/research/ichthyology/catalog/fishcatget.asp?tbl=species&genus=Neolamprologus
        accessed: 2026-10-13
        note: Lists both as valid and records that Konings (2019) treated N. brichardi as a synonym of N. pulcher.
  - id: amphilophus-citrinellus-complex
    description: The Midas cichlids of the Nicaraguan great lakes and crater lakes, which have no known intrinsic barrier to crossing, hybridise in the wild in lakes Masaya, Xiloá and Apoyo and cross readily in the laboratory, together with the flowerhorn, a domestic line bred in part from A. citrinellus and A. labiatus.
    basis: documented
    userNote: >-

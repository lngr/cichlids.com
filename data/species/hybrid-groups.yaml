  - id: amatitlania-nigrofasciata-thorichthys-meeki
    description: The convict cichlid and the firemouth, two Central American cichlids of different genera whose cross is reported only from aquaria, by a 1982 paper describing hybrids of the two species and by a keeper whose female firemouth had no male of her own species; free choice of partners is shown in neither report.
    basis: presumed
    userNote: >-
      The Hungarian aquarist Gabor Horvath reported in Practical Fishkeeping that a female firemouth,
      kept without a firemouth male, paired with a convict cichlid male and raised hybrid young, and a
      1982 paper by James F. Novak describes hybrids of the two species, though only its title could
      be read. Because the female had no partner of her own species, the cross is real but its risk
      in a tank with firemouth pairs is unconfirmed.
    members:
      - Amatitlania nigrofasciata
      - Thorichthys meeki

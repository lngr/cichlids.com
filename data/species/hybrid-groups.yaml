  - id: tropheus-moorii-red
    description: Tropheus moorii and the red Tropheus sp. 'red' of the southwestern shore, which mixed in the wild into the yellow hybrid form of the Lufubu area, interbred after fish of several forms were released together in Mpulungu harbour, and mated across forms in breeding ponds that also held partners of their own form.
    basis: documented
    userNote: >-
      Researchers found a yellow hybrid form of these two species in the wild, recorded a few
      hybrids after fish of several forms were released together in a harbour bay, and observed
      females mating across forms in breeding ponds that also held males of their own form. The
      mixing is well documented, mostly from the wild.
    members:
      - Tropheus moorii
      - "Tropheus sp. 'red'"
    sources:
      - kind: literature
        title: >-
          Van Steenberge, M., Raeymaekers, J. A. M., Hablützel, P. I., Vanhove, M. P. M., Koblmüller,
          S. and Snoeks, J. (2018). Delineating species along shifting shorelines: Tropheus
          (Teleostei, Cichlidae) from the southern subbasin of Lake Tanganyika. Frontiers in Zoology
          15, 42.
        url: https://doi.org/10.1186/s12983-018-0287-4
        accessed: 2026-10-13
        note: Treats the yellow form as a natural hybrid of T. sp. 'red' and southern T. moorii and finds clinal genetic and morphological mixing between the two along shallow shores.
      - kind: literature
        title: >-
          Sefc, K. M., Hermann, C. M., Steinwender, B., Brindl, H., Zimmermann, H., Mattersdorfer,
          K., Postl, L., Makasa, L., Sturmbauer, C. and Koblmüller, S. (2015). Asymmetric dominance and asymmetric mate choice oppose premating
          isolation after allopatric divergence. Ecology and Evolution 5, 1549-1562.
        url: https://doi.org/10.1002/ece3.1372
        accessed: 2026-10-13
        note: In ponds stocked with males and females of both forms, bluish and yellow-blotch T. moorii females mated with red males from Chimba as well as with their own males; red females mated only with red males.
      - kind: literature
        title: >-
          Salzburger, W., Niederstätter, H., Brandstätter, A., Berger, B., Parson, W., Snoeks, J. and
          Sturmbauer, C. (2006). Colour-assortative mating among populations of Tropheus moorii, a
          cichlid fish from Lake Tanganyika, East Africa. Proceedings of the Royal Society B 273,
          257-266.
        url: https://doi.org/10.1098/rspb.2005.3321
        accessed: 2026-10-13
        note: After human release of several forms into one bay, mating was mostly assortative, but three of 180 young were hybrids between olive T. moorii and reddish fish from the Chimba and Chilanga shore.
      - kind: literature
        title: >-
          Sefc, K. M., Mattersdorfer, K., Ziegelbecker, A., Neuhüttler, N., Steiner, O., Goessler, W.
          and Koblmüller, S. (2017). Shifting barriers and phenotypic diversification by
          hybridization. Ecology Letters 20, 651-662.
        url: https://doi.org/10.1111/ele.12766
        accessed: 2026-10-13
        note: Genetic data trace the yellow form to old admixture of the red and bluish forms and show that yellow females do not prefer their own form; the experimental cross in this study used females without own males and is not counted.

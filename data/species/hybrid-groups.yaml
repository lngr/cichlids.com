  - id: copadichromis
    description: All valid species of the utaka genus Copadichromis, whose silvery, dark-spotted females and juveniles look alike; Seriously Fish warns on each of its five Copadichromis profiles that the species of the genus hybridise and must not share a tank, a warning phrased for the whole genus rather than for named pairs, and Anseeuw et al. (2012) explain divergent mtDNA lineages in Copadichromis by past hybridisation in the lake; the group therefore covers every valid species of the genus, and no aquarium cross between two named species is documented.

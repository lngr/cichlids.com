      - "Tropheus sp. 'black'"
    sources:
      - kind: literature
        title: >-
          Sturmbauer, C., Börger, C., Van Steenberge, M. and Koblmüller, S. (2017). A separate
          lowstand lake at the northern edge of Lake Tanganyika? Evidence from phylogeographic
          patterns in the cichlid genus Tropheus. Hydrobiologia 791, 51-68 (published online 2016).
        url: https://doi.org/10.1007/s10750-016-2939-8
        accessed: 2026-10-13
        note: Finds introgressed populations of T. brichardi and T. sp. 'black' in the north and a genetically intermediate T. cf. brichardi 'Ubwari-green' sharing the mitochondrial lineage of the sympatric T. sp. 'black' Caramba.
  - id: tropheus-brichardi-mpimbwe
    description: Tropheus brichardi and the undescribed Tropheus sp. 'Mpimbwe' of the central east coast, which is genetically and morphologically intermediate between T. brichardi and the southern Tropheus lineage and carries brichardi-like mitochondrial haplotypes, a sign of hybridisation with invading T. brichardi.

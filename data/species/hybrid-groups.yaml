  - id: pterophyllum
    description: The three valid angelfish species of the genus Pterophyllum, which are close relatives with the same shape and breeding mode; a captive cross of P. altum and P. scalare is documented (Clarke, 2010), while P. leopoldi belongs to the group because hobby sources consider the farmed angelfish a mixed stock carrying genes of both other species, and no cross involving P. leopoldi is documented.
    basis: documented
    members:
      - Pterophyllum scalare
      - Pterophyllum altum
      - Pterophyllum leopoldi
    sources:
      - kind: literature
        title: "Clarke, M. (2010). Hybrid scalare-altum angel. Practical Fishkeeping (August 2010)."
        url: https://www.practicalfishkeeping.co.uk/features/hybrid-scalare-altum-angel/
        accessed: 2026-10-13
        note: Reports captive-bred hybrids of a P. altum from the Rio Atabapo and a Rio Negro line of P. scalare, shown at a trade fair.
      - kind: literature
        title: "Practical Fishkeeping (2021): What is the Peruvian Altum?"
        url: https://www.practicalfishkeeping.co.uk/features/what-is-the-peruvian-altum/
        accessed: 2026-10-13
        note: Regards the farmed angelfish as mostly P. scalare with some genes of P. altum and P. leopoldi; documents no controlled cross.
      - kind: literature
        title: "Tropical Fish Hobbyist Magazine: Pterophyllum scalare, species profile"
        url: https://www.tfhmagazine.com/articles/freshwater/pterophyllum-scalare
        accessed: 2026-10-13
        note: Considers it very likely that the aquarium angelfish descends from a cross of two or more species.

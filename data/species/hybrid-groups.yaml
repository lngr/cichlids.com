    basis: presumed
    userNote: >-
      A laboratory study (Gerlai 2007) reports that these two species spawned and produced fertile
      young, but it is unclear whether the fish could choose partners of their own species. Because
      the circumstances of the cross are unclear, the risk is plausible but unconfirmed.
    members:

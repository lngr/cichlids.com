# Curated hybrid groups: closely related species that cross in tanks. Two species of the same group
# in one tank are a hard conflict of the compatibility check. Members are valid names; a species
# belongs to at most one group. When the vote of the species pipeline decides a group that is not
# listed, the adjudicator adds it with its members and the sources that report crosses.
groups:
  - id: maylandia
    description: Species of Maylandia (Metriaclima), which cross readily in tanks, also across colour forms, together with the look-alike Cynotilapia afra, whose blue barred males resemble Maylandia zebra and which forms hybrids with it in the wild where it was introduced to Thumbi West Island in Lake Malawi.
    members:
      - Maylandia zebra
      - Maylandia estherae
      - Maylandia callainos
      - Maylandia greshakei
      - Maylandia lombardoi
      - Cynotilapia afra
    sources:
      - kind: literature
        title: >-
          Stauffer, J. R., Bowers, N. J., Kocher, T. D. and McKaye, K. R. (1996). Evidence of
          hybridization between Cynotilapia afra and Pseudotropheus zebra (Teleostei: Cichlidae)
          following an intralacustrine translocation in Lake Malawi. Copeia 1996(1), 203-208
          (title and bibliographic record).
        url: https://doi.org/10.2307/1446959
        accessed: 2026-10-12
        note: Reports hybridisation between C. afra and Pseudotropheus (Maylandia) zebra after C. afra was moved within Lake Malawi.
      - kind: literature
        title: >-
          Streelman, J. T., Gmyrek, S. L., Kidd, M. R., Kidd, C., Robinson, R. L., Hert, E.,
          Ambali, A. J. and Kocher, T. D. (2004). Hybridization and contemporary evolution in an
          introduced cichlid fish from Lake Malawi National Park. Molecular Ecology 13(8),
          2471-2479 (abstract).
        url: https://doi.org/10.1111/j.1365-294x.2004.02240.x
        accessed: 2026-10-12
        note: Finds with microsatellites a high share of hybrids between introduced C. afra and native Metriaclima zebra on the turbid southern coast of Thumbi West Island.
      - kind: literature
        title: >-
          Zidana, H., Turner, G. F., Van Oosterhout, C. and Hänfling, B. (2009). Elevated mtDNA
          diversity in introduced populations of Cynotilapia afra (Günther 1894) in Lake Malawi
          National Park is evidence for multiple source populations and hybridization. Molecular
          Ecology 18(21), 4380-4389 (abstract).
        url: https://doi.org/10.1111/j.1365-294x.2009.04362.x
        accessed: 2026-10-12
        note: Calls C. afra and Pseudotropheus zebra closely related and hybridising and traces part of the mtDNA diversity of introduced C. afra to introgression from P. zebra.
  - id: tropheus
    description: All Tropheus species and locality forms; locality forms are kept apart as well to preserve them.
    members:
      - Tropheus moorii
      - Tropheus duboisi
      - Tropheus brichardi
      - Tropheus annectens
  - id: aulonocara
    description: Peacock cichlids of the genus Aulonocara; females look alike and cross easily.
    members:
      - Aulonocara stuartgranti
      - Aulonocara jacobfreibergi
      - Aulonocara baenschi
  - id: amphilophus-citrinellus-complex
    description: Midas and red devil cichlids of the Amphilophus citrinellus complex, including the crater-lake species of lakes Apoyo and Xiloá, which lack intrinsic barriers to crossing and hybridise in the laboratory, in the trade and in nature, together with the three-spot cichlid Amphilophus trimaculatus, whose crosses with A. citrinellus and A. labiatus gave rise to the flowerhorn.
    members:
      - Amphilophus citrinellus
      - Amphilophus labiatus
      - Amphilophus zaliosus
      - Amphilophus astorquii
      - Amphilophus chancho
      - Amphilophus flaveolus
      - Amphilophus globosus
      - Amphilophus supercilius
      - Amphilophus amarillo
      - Amphilophus sagittae
      - Amphilophus viridis
      - Amphilophus xiloaensis
      - Amphilophus trimaculatus
    sources:
      - kind: literature
        title: >-
          Barlow, G. W. and Munsey, J. W. (1976). The red devil-Midas-arrow cichlid species complex
          in Nicaragua. In: Thorson, T. B. (ed.), Investigations of the Ichthyofauna of Nicaraguan
          Lakes, University of Nebraska-Lincoln, 359-369 (abstract).
        url: https://digitalcommons.unl.edu/ichthynicar/24
        accessed: 2026-10-12
      - kind: literature
        title: >-
          Kautt, A. F., Machado-Schiaffino, G. and Meyer, A. (2016). Multispecies outcomes of
          sympatric speciation after admixture with the source population in two radiations of
          Nicaraguan crater lake cichlids. PLoS Genetics 12(6), e1006157.
        url: https://doi.org/10.1371/journal.pgen.1006157
        accessed: 2026-10-12
      - kind: literature
        title: >-
          Recknagel, H., Elmer, K. R. and Meyer, A. (2013). A hybrid genetic linkage map of two
          ecologically and morphologically divergent Midas cichlid fishes (Amphilophus spp.)
          obtained by massively parallel DNA sequencing (ddRADSeq). G3 Genes|Genomes|Genetics.
        url: https://doi.org/10.1534/g3.112.003897
        accessed: 2026-10-12
      - kind: database
        title: "Fishkeeper (Maidenhead Aquatics): Midas Cichlid, Amphilophus citrinellus, species profile"
        url: https://www.fishkeeper.co.uk/fish/freshwater/cichlids/midas-cichlid
        accessed: 2026-10-12
      - kind: literature
        title: >-
          Tarkhani, R., Imani, A., Jamali, H. and Sarvi Moghanlou, K. (2016). Anaesthetic efficacy
          of eugenol on Flowerhorn (Amphilophus labiatus x Amphilophus trimaculatus). Aquaculture
          Research 48(6), 3207-3215 (abstract).
        url: https://doi.org/10.1111/are.13151
        accessed: 2026-10-13
        note: Studies the flowerhorn as the cross of A. labiatus and A. trimaculatus.
      - kind: literature
        title: >-
          Abe, H. A., Reis, R. G. A., Barros, F. A. L., Paixão, P. E. G., Meneses, J. O., Souza, J.
          C. N. and Fujimoto, R. Y. (2020). Optimal management improves Flowerhorn fish
          larviculture. Aquaculture Research 52(5), 2353-2358.
        url: https://doi.org/10.1111/are.15085
        accessed: 2026-10-13
        note: Rears larvae of the flowerhorn, given as the cross of A. labiatus and A. trimaculatus.
      - kind: literature
        title: >-
          Magalhães, A. L. B., Orsi, M. L., Pelicice, F. M., Azevedo-Santos, V. M., Vitule, J. R. S.,
          Lima-Junior, D. P. and Brito, M. F. G. (2017). Small size today, aquarium dumping
          tomorrow: sales of juvenile non-native large fish as an important threat in Brazil.
          Neotropical Ichthyology 15(4), e170033.
        url: https://doi.org/10.1590/1982-0224-20170033
        accessed: 2026-10-13
        note: Records the flowerhorn in the Brazilian trade as the hybrid A. trimaculatus x A. citrinellus.
      - kind: literature
        title: >-
          Manassila, P., Sangsawad, P., Boonanuntanasarn, S., Kaewda, J., Boonchuen, P., Limkul, S.
          and Nakharuthai, C. (2025). Transcriptomic analysis reveals glycolysis and
          gluconeogenesis pathway activation underlying growth enhancement by duck-blood protein
          hydrolysate in flowerhorn cichlid fish. International Journal of Molecular Sciences
          26(19), 9563.
        url: https://doi.org/10.3390/ijms26199563
        accessed: 2026-10-13
        note: Names the flowerhorn as the cross of A. citrinellus and Cichlasoma trimaculatum, a synonym of A. trimaculatus.
  - id: symphysodon

  - id: maylandia-zebra-callainos
    description: Maylandia zebra and the cobalt zebra M. callainos, of which probable wild hybrids were seen where M. callainos was introduced to Thumbi West Island and of which a mixed stock has reached the trade from Asian farms.
    basis: documented
    userNote: >-
      Probable wild hybrids of these two species were seen at Thumbi West Island in Lake Malawi
      after the cobalt zebra was introduced there, and a wholesaler reports that blue farm-bred fish
      in the trade carry ancestry of both. The evidence rests on sightings and a trade report rather
      than on genetic proof.
    members:
      - Maylandia zebra
      - Maylandia callainos
    sources:
      - kind: literature
        title: >-
          Genner, M. J. and Turner, G. F. (2005). The mbuna cichlids of Lake Malawi: a model for
          rapid speciation and adaptive radiation. Fish and Fisheries 6(1), 1-34.
        url: https://doi.org/10.1111/j.1467-2679.2005.00173.x
        accessed: 2026-10-13
        note: Reports, after Stauffer and Hert (1992), sightings at Thumbi West Island of unusual fish that were probably hybrids of the native P. (Maylandia) zebra and the introduced P. callainos.
      - kind: website
        title: "Schäfer, F. (2021). Bright blue Maylandia from Thailand. Aquarium Glaser fish archive (wholesaler)."
        url: https://www.aquariumglaser.de/en/25-perchlike-fishes/bright-blue-maylandia-from-thailand/
        accessed: 2026-10-13
        note: Identifies blue farm-bred fish imported from Thailand as "M. estherae Blue" as M. callainos carrying some M. zebra ancestry.
      - kind: database
        title: "Seriously Fish: Maylandia callainos (Cobalt Blue Zebra)"
        url: https://www.seriouslyfish.com/species/maylandia-callainos/
        accessed: 2026-10-13
        note: Records that M. callainos was traded as a form of Pseudotropheus zebra and is easily confused with M. estherae and M. benetos; gives no crossing report.
  - id: cynotilapia-afra-maylandia-zebra
    description: Cynotilapia afra and Maylandia zebra, two blue, dark-barred mbuna that formed a hybrid population on the turbid southern shore of Thumbi West Island after C. afra was moved there by an exporter.
    basis: documented
    userNote: >-
      Wild hybrids of these two species were found at Thumbi West Island after Cynotilapia afra was
      introduced there; genetic studies confirm the mixing.
    members:
      - Cynotilapia afra
      - Maylandia zebra
    sources:
      - kind: literature
        title: >-
          Stauffer, J. R., Bowers, N. J., Kocher, T. D. and McKaye, K. R. (1996). Evidence of
          hybridization between Cynotilapia afra and Pseudotropheus zebra (Teleostei: Cichlidae)
          following an intralacustrine translocation in Lake Malawi. Copeia 1996(1), 203-208.
        url: https://doi.org/10.2307/1446959
        accessed: 2026-10-13
        note: Describes nine wild specimens from Mitande Point, Thumbi West Island, with teeth and fin pattern intermediate between the two species and links the crosses to the few C. afra males among many P. zebra males.
      - kind: literature
        title: >-
          Streelman, J. T., Gmyrek, S. L., Kidd, M. R., Kidd, C., Robinson, R. L., Hert, E.,
          Ambali, A. J. and Kocher, T. D. (2004). Hybridization and contemporary evolution in an
          introduced cichlid fish from Lake Malawi National Park. Molecular Ecology 13(8),
          2471-2479 (abstract).
        url: https://doi.org/10.1111/j.1365-294x.2004.02240.x
        accessed: 2026-10-13
        note: Finds with microsatellites a high share of hybrids of introduced C. afra and native Metriaclima zebra at the turbid southern sites of Thumbi West.
      - kind: literature
        title: >-
          Zidana, H., Turner, G. F., Van Oosterhout, C. and Hänfling, B. (2009). Elevated mtDNA
          diversity in introduced populations of Cynotilapia afra (Günther 1894) in Lake Malawi
          National Park is evidence for multiple source populations and hybridization. Molecular
          Ecology 18(21), 4380-4389 (abstract).
        url: https://doi.org/10.1111/j.1365-294x.2009.04362.x
        accessed: 2026-10-13
        note: Calls the two species closely related and hybridising and attributes part of the mtDNA diversity of introduced C. afra to introgression from P. zebra.
      - kind: literature
        title: >-
          Genner, M. J. and Turner, G. F. (2005). The mbuna cichlids of Lake Malawi: a model for
          rapid speciation and adaptive radiation. Fish and Fisheries 6(1), 1-34.
        url: https://doi.org/10.1111/j.1467-2679.2005.00173.x
        accessed: 2026-10-13
        note: Reviews the Thumbi West case and the molecular support for introgression between P. zebra and C. afra.
  - id: labeotropheus
    description: All valid species of the scrapermouth genus Labeotropheus, which hobby sources warn may cross when several of its species or colour forms share a tank and whose two classic species L. fuelleborni and L. trewavasae give viable, fertile hybrids in both directions when females are kept with males of the other species only.
    basis: presumed
    userNote: >-
      Hobby databases warn in general terms that Labeotropheus species and colour forms hybridise in
      tanks. Researchers raised fertile hybrids of L. fuelleborni and L. trewavasae, but only by
      pairing each female with a male of the other species, which does not show what happens in a
      mixed tank, and wild hybrids are reported as very rare.
    members:
      - Labeotropheus fuelleborni
      - Labeotropheus trewavasae
      - Labeotropheus alticodia
      - Labeotropheus artatorostris
      - Labeotropheus aurantinfra

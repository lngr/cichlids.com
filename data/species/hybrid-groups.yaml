          Perciformes) derived from mitochondrial and nuclear DNA data. Molecular Phylogenetics and
          Evolution 57, 266-284.
        url: https://doi.org/10.1016/j.ympev.2010.06.018
        accessed: 2026-10-13
        note: Places the brood-care helper species N. pulcher, N. brichardi, N. gracilis, N. marunguensis, N. savoryi and N. splendens (with N. helianthus) in one subclade and explains mitochondrial paraphyly of N. savoryi, N. gracilis and N. marunguensis by introgression in the wild.
      - kind: literature
        title: >-
          Salzburger, W., Baric, S. and Sturmbauer, C. (2002). Speciation via introgressive
          hybridization in East African cichlids? Molecular Ecology 11, 619-625 (abstract).
        url: https://doi.org/10.1046/j.0962-1083.2001.01438.x
        accessed: 2026-10-13
        note: Describes N. marunguensis as a species of hybrid origin carrying mitochondrial and nuclear alleles of two older lineages; the abstract does not name them.
      - kind: literature
        title: >-
          Gante, H. F., Matschiner, M., Malmstrøm, M., Jakobsen, K. S., Jentoft, S. and Salzburger,
          W. (2016). Genomics of speciation and introgression in Princess cichlid fishes from Lake
          Tanganyika. Molecular Ecology 25, 6143-6161 (abstract).
        url: https://doi.org/10.1111/mec.13767
        accessed: 2026-10-13
        note: Finds incomplete lineage sorting and several introgression events across the savoryi complex from whole genomes; the abstract names no species pair.
      - kind: literature
        title: >-
          Bouckaert, R., Vaughan, T. G., Barido-Sottani, J., Duchêne, S., Fourment, M.,
          Gavryushkina, A. et al. (2019). BEAST 2.5: An advanced software platform for Bayesian

name: ${COMPOSE_PROJECT_NAME:-devcontainer-cichlids}

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HOST_USER: ${HOST_USER:-vscode}
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
        HOST_HOME: ${HOST_HOME:-/home/vscode}
    init: true
    privileged: true
    volumes:
      - ../..:/workspaces
      # .git ist Teil des Workspace-Mounts
      - ~/.gitconfig:${HOST_HOME:-/home/vscode}/.gitconfig:cached
    command: sleep infinity
    # Publish the Backlog.md web UI to the host loopback so it is reachable at
    # http://localhost:6480 regardless of editor. devcontainer.json's forwardPorts
    # only applies when VS Code drives the container; this Docker-level publish also
    # covers plain `docker compose` / exec-devcontainer usage.
    ports:
      - "127.0.0.1:6480:6480"
      # Host access to the app services (Expo web, API, object store, Keycloak). Host port and
      # bind address come from .env, so a taken host port can be retargeted there
      # without editing this file; the defaults publish on the loopback at the native
      # ports. S3_PORT must match ObjectStorage:PublicBaseUrl in the API's
      # appsettings.Development.json, because the image URLs the API returns embed that
      # port. API_PORT stays 5045 unless the generated API clients are rebuilt for a
      # different port.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8081}:8081"
      - "${S3_BIND:-127.0.0.1}:${S3_PORT:-9000}:9000"
      - "${API_BIND:-127.0.0.1}:${API_PORT:-5045}:5045"
      # KEYCLOAK_PORT stays 8180: the app's login redirects and the realm's web origins
      # use that port.
      - "${KEYCLOAK_BIND:-127.0.0.1}:${KEYCLOAK_PORT:-8180}:8180"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - devnet

networks:
  devnet:
    driver: bridge

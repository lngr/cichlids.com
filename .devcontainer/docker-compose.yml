name: ${COMPOSE_PROJECT_NAME:-devcontainer-cichlids}

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HOST_USER: ${HOST_USER:-vscode}
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
        HOST_HOME: ${HOST_HOME:-/home/vscode}
    init: true
    privileged: true
    volumes:
      - ../..:/workspaces
      # .git ist Teil des Workspace-Mounts
      - ~/.gitconfig:${HOST_HOME:-/home/vscode}/.gitconfig:cached
    command: sleep infinity
    # Publish the Backlog.md web UI to the host loopback so it is reachable at
    # http://localhost:6480 regardless of editor. devcontainer.json's forwardPorts
    # only applies when VS Code drives the container; this Docker-level publish also
    # covers plain `docker compose` / exec-devcontainer usage.
    ports:
      - "127.0.0.1:6480:6480"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - devnet

networks:
  devnet:
    driver: bridge

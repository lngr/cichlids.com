#
# HTTPS server configuration
#

proxy_cache_path	/var/cache/nginx	levels=1:2 keys_zone=cache-space:128m max_size=2048m inactive=40960m;

ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
ssl_prefer_server_ciphers on;
ssl_ciphers 'EDH+CAMELLIA:EDH+aRSA:EECDH+aRSA+AESGCM:EECDH+aRSA+SHA384:EECDH+aRSA+SHA256:EECDH:+CAMELLIA256:+AES256:+CAMELLIA128:+AES128:+SSLv3:!aNULL:!eNULL:!EXPORT:!LOW:!3DES:!MD5:!EXP:!PSK:!DSS:!RC4:!SEED:!ECDSA:CAMELLIA256-SHA:AES256-SHA:CAMELLIA128-SHA:AES128-SHA';
ssl_session_cache shared:SSL:10m;
ssl_session_timeout  5m;

server {
	listen       176.9.120.235:443 ssl;
	listen       [2a01:4f8:151:74e2::2]:443 ssl;
    	server_name  api.cichlids.fishauth.net;

    	ssl_certificate      /etc/letsencrypt/live/api.cichlids.fishauth.net/fullchain.pem;
    	ssl_certificate_key  /etc/letsencrypt/live/api.cichlids.fishauth.net/privkey.pem;

	add_header Strict-Transport-Security "max-age=31536000"; 

    	location / {
        	root   /var/www/html/api.cichlids.fishauth.net;
        	index  index.html index.htm;
    	}
}

server {
	listen       176.9.120.235:443 ssl;
	listen       [2a01:4f8:151:74e2::2]:443 ssl;
    	server_name  cichlids.fishauth.net;

    	ssl_certificate      /etc/letsencrypt/live/api.cichlids.fishauth.net/fullchain.pem;
    	ssl_certificate_key  /etc/letsencrypt/live/api.cichlids.fishauth.net/privkey.pem;

    	location / {
        	root   /var/www/html/cichlids.fishauth.net;
        	index  index.html index.htm;
    	}
}

server {
	listen       176.9.120.235:443 ssl default_server;
	listen       [2a01:4f8:151:74e2::2]:443 ssl default_server;
        server_name  www.cichlids.com;
 
    	ssl_certificate      /etc/letsencrypt/live/www.cichlids.com/fullchain.pem;
    	ssl_certificate_key  /etc/letsencrypt/live/www.cichlids.com/privkey.pem;
 
	client_max_body_size 20M;

	# location / {
    	#	root       /var/www/html/maintain;
    	#	try_files  /maintain.html @apache;
	# }

	rewrite /auth0/callback 		/		permanent;
	rewrite	/tank-pictures(.*) 		/pictures$1	permanent;
	rewrite /tank-examples.html 		/tanks		permanent;
	rewrite /tank-examples/ 		/tanks		permanent;
	rewrite /browse/.*			/pictures	permanent;
	rewrite /browse.html			/pictures	permanent;
	rewrite ^/beginner.html			/library/beginner.html	permanent;
	rewrite /imprint.html			/imprint	permanent;
	rewrite /species-list.html 		/pictures	permanent;
	rewrite	/nc/(.*) 			/$1		permanent;
	rewrite /control/login/sign-up.html	/		permanent;

	location /api {
  		proxy_pass        http://127.0.0.1:8081;
		proxy_set_header  Host www.cichlids.com;
  		rewrite /api(.*) /$1  break;
  		proxy_redirect     off;
  		proxy_set_header  X-Real-IP  $remote_addr;
      		proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header  X-Forwarded-Proto https;
	}

	location /api2 {
  		proxy_pass        http://127.0.0.1:8086;
		proxy_set_header  Host www.cichlids.com;
  		rewrite /api2/(.*) /api/$1  break;
  		proxy_redirect     off;
  		proxy_set_header  X-Real-IP  $remote_addr;
      		proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header  X-Forwarded-Proto https;
	}

	location /p/n/ {
  		proxy_pass        	http://127.0.0.1:8082;
		proxy_set_header  	Host www.cichlids.com;
  		proxy_redirect     	off;
  		proxy_set_header  	X-Real-IP  $remote_addr;
      		proxy_set_header  	X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
		proxy_cache 		cache-space;
        	proxy_cache_valid 	200 1y;

                rewrite ^\/p\/n\/100\/(.*)$  /local/small_light(dw=100,da=l,ds=s)/images/user_pics/$1 break;
                rewrite ^\/p\/n\/200\/(.*)$  /local/small_light(dw=200,da=l,ds=s)/images/user_pics/$1 break;
                rewrite ^\/p\/n\/400\/(.*)$  /local/small_light(dw=400,da=l,ds=s)/images/user_pics/$1 break;
                rewrite ^\/p\/n\/800\/(.*)$  /local/small_light(dw=800,da=l,ds=s)/images/user_pics/$1 break;
                rewrite ^\/p\/n\/1600\/(.*)$  /local/small_light(dw=1600,da=l,ds=s)/images/user_pics/$1 break;

                rewrite ^\/p\/n\/400c\/(.*)$  /local/small_light(dw=400,dh=225,cw=400,ch=225,da=s,ds=s)/images/user_pics/$1 break;
	}

	location /p/u/ {
  		proxy_pass        	http://127.0.0.1:8082;
		proxy_set_header  	Host www.cichlids.com;
  		proxy_redirect     	off;
  		proxy_set_header  	X-Real-IP  $remote_addr;
      		proxy_set_header  	X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
		proxy_cache 		cache-space;
        	proxy_cache_valid 	200 1y;

                rewrite ^\/p\/u\/100\/(.*)$  /local/small_light(dw=100,da=l,ds=s)/images/api_uploads/files/$1 break;
                rewrite ^\/p\/u\/200\/(.*)$  /local/small_light(dw=200,da=l,ds=s)/images/api_uploads/files/$1 break;
                rewrite ^\/p\/u\/400\/(.*)$  /local/small_light(dw=400,da=l,ds=s)/images/api_uploads/files/$1 break;
                rewrite ^\/p\/u\/800\/(.*)$  /local/small_light(dw=800,da=l,ds=s)/images/api_uploads/files/$1 break;
                rewrite ^\/p\/u\/1600\/(.*)$  /local/small_light(dw=1600,da=l,ds=s)/images/api_uploads/files/$1 break;
	}

	location /p/ {
		alias /var/www/html/www-cichlids/cichlids.extra/static/pics/;
		rewrite ^\/100x75\/(..)(..)([^\/]*\.jpg)$   /p/100x75/$1/$2/$1$2$3 last;
                rewrite ^\/130x97\/(..)(..)([^\/]*\.jpg)$   /p/130x97/$1/$2/$1$2$3 last;
                rewrite ^\/167x123\/(..)(..)([^\/]*\.jpg)$  /p/167x123/$1/$2/$1$2$3 last;
                rewrite ^\/450x600\/(..)(..)([^\/]*\.jpg)$  /p/450x600/$1/$2/$1$2$3 last;
	}

	location /fileadmin {
		try_files $uri @apache;
	}

	location /typo3temp {
		try_files $uri @apache;
	}

    	location /assets {
		expires max;
    		alias /var/www/html/docker/prod/dist/browser/assets;
    	}

	location ~ \.bundle\.(js|css) {
		expires max;
    		root /var/www/html/docker/prod/dist/browser;
	}

	location / {
        	try_files $uri @nodejs;
	}

	location @nodejs {
		expires 		off;
  		proxy_pass        	http://127.0.0.1:8084;
		proxy_set_header  	Host www.cichlids.com;
  		proxy_redirect    	off;
  		proxy_set_header  	X-Real-IP  $remote_addr;
      		proxy_set_header  	X-Forwarded-For $proxy_add_x_forwarded_for;
	}

	location @apache {
		expires 		off;
  		proxy_pass        	http://127.0.0.1:8080;
		proxy_set_header  	Host www.cichlids.com;
  		proxy_redirect    	off;
  		proxy_set_header  	X-Real-IP  $remote_addr;
      		proxy_set_header  	X-Forwarded-For $proxy_add_x_forwarded_for;
	}

	location /typo3temp/pics/ {
		alias /var/www/html/www-cichlids/cichlids/typo3temp/pics/;
	}
	location /uploads/tx_usercichlids/user_pics/ {
		alias /var/www/html/www-cichlids/cichlids/uploads/tx_usercichlids/user_pics/;
	}

	location /uploads {
		try_files $uri @apache;
	}

	location ~ /\.ht {
            deny  all;
        }
}

server {
	listen       176.9.120.235:443 ssl;
	listen       [2a01:4f8:151:74e2::2]:443 ssl;
        server_name  dev.cichlids.com;
    	ssl_certificate /etc/letsencrypt/live/dev.cichlids.com/fullchain.pem; # managed by Certbot
    	ssl_certificate_key /etc/letsencrypt/live/dev.cichlids.com/privkey.pem; # managed by Certbot

	gzip on;
	gzip_types    text/plain application/javascript application/x-javascript text/javascript text/xml text/css;

    	root /var/www/html/docker/dev/browser;

    	location / {
		expires max;
        	try_files $uri $uri/ @nodejs;
  		add_header X-Robots-Tag	noindex;
    	}

	location @nodejs {
		expires 		off;
  		proxy_pass        	http://127.0.0.1:8083;
		proxy_set_header  	Host dev.cichlids.com;
  		proxy_redirect    	off;
  		proxy_set_header  	X-Real-IP  $remote_addr;
      		proxy_set_header  	X-Forwarded-For $proxy_add_x_forwarded_for;
  		add_header X-Robots-Tag	noindex;
	}

}

appId: com.cichlids.app
tags:
  - TASK-3.21
---
- addMedia:
    - "../fixtures/upload-photo.jpg"
- launchApp:
    clearState: true
- evalScript: ${output.title = 'Maestro upload ' + Date.now()}

# Keycloak runs in the Android browser; its fields use accessible labels.
- tapOn:
    id: "tab-create"
- tapOn:
    id: "create-photo"
- tapOn:
    id: "login-button"
- tapOn:
    text: "Username or email|Benutzername oder E-Mail"
- inputText: "dev-user"
- tapOn:
    text: "Password|Passwort"
- inputText: "dev-password" # gitleaks:allow
- tapOn:
    text: "Sign In|Anmelden"
- assertVisible:
    id: "me-profile-button"

- tapOn:
    id: "tab-discover"
- tapOn:
    id: "discover-gallery"
- tapOn:
    id: "upload-button"
- tapOn:
    id: "upload-pick"
- tapOn:
    id: "com.google.android.providers.media.module:id/icon_thumbnail"
    index: 0
- extendedWaitUntil:
    visible:
      id: "upload-preview"
    timeout: 30000

- tapOn:
    id: "upload-title"
- inputText: ${output.title}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "upload-publish"
    direction: DOWN
- tapOn:
    id: "upload-publish"
- extendedWaitUntil:
    visible:
      id: "picture-title"
    timeout: 30000
- assertVisible:
    id: "picture-title"
    text: ${output.title}

- tapOn:
    id: "tab-discover"
- tapOn:
    id: "discover-gallery"
- assertVisible:
    id: "picture-card"
    index: 0
    text: ".*${output.title}.*"

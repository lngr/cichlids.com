appId: com.cichlids.app
tags:
  - TASK-3.22
---
- runFlow: login-upload.yaml
- evalScript: ${output.comment = 'Maestro comment ' + Date.now()}

- tapOn:
    id: "picture-card"
    text: "Maestro rating target"
- extendedWaitUntil:
    visible:
      id: "picture-title"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "comment-submit"
    direction: DOWN

- tapOn:
    id: "comment-input"
- inputText: ${output.comment}
- hideKeyboard
- tapOn:
    id: "comment-star-4"
- tapOn:
    id: "comment-submit"

- scrollUntilVisible:
    element:
      id: "comment-item-body"
      text: ${output.comment}
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: "comment-item-body"
    text: ${output.comment}
- assertVisible:
    id: "comment-item-stars"
    text: "★★★★"

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: preview
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
  - missingkey=error
  generators:
  - matrix:
      generators:
      - pullRequest:
          github:
            owner: lngr
            repo: cichlids.com
            labels:
            - preview-active
          requeueAfterSeconds: 300
      - git:
          repoURL: https://github.com/lngr/cichlids.com.git
          revision: '{{ .head_sha }}'
          files:
          - path: apps/*/overlays/preview/kustomization.yaml
  syncPolicy:
    applicationsSync: sync
    preserveResourcesOnDeletion: false
  template:
    metadata:
      name: '{{ index .path.segments 1 }}-pr-{{ .number }}'
      namespace: argocd
      finalizers:
      - resources-finalizer.argocd.argoproj.io
      labels:
        cichlids.com/environment: preview
    spec:
      project: cichlids
      source:
        repoURL: https://github.com/lngr/cichlids.com.git
        targetRevision: '{{ .head_sha }}'
        path: '{{ .path.path }}'
        kustomize:
          namespace: pr-{{ .number }}
          images:
          - 'ghcr.io/lngr/cichlids-api:{{ .head_sha }}'
          - 'ghcr.io/lngr/cichlids-migration:{{ .head_sha }}'
          - 'ghcr.io/lngr/cichlids-web:{{ .head_sha }}'
          patches:
          - target:
              kind: Ingress
              name: placeholder
            patch: |
              - op: replace
                path: /spec/rules/0/host
                value: pr-{{ .number }}.dev.cichlids.com
              - op: replace
                path: /spec/tls/0/hosts/0
                value: pr-{{ .number }}.dev.cichlids.com
      destination:
        server: https://kubernetes.default.svc
        namespace: pr-{{ .number }}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - FailOnSharedResource=true

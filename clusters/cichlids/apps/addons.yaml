apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headscale
  namespace: argocd
  labels:
    cichlids.com/stateful: "true"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: cichlids-addons
  source:
    repoURL: https://github.com/lngr/cichlids.com.git
    targetRevision: main
    path: apps/headscale/overlays/cluster
  destination:
    server: https://kubernetes.default.svc
    namespace: headscale
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - ServerSideApply=true
    - Prune=false
    - FailOnSharedResource=true
    - RespectIgnoreDifferences=true

apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cichlids
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
spec:
  sourceRepos:
  - https://github.com/lngr/cichlids.com.git
  destinations:
  - server: https://kubernetes.default.svc
    namespace: cichlids-staging
  - server: https://kubernetes.default.svc
    namespace: cichlids-prod
  - server: https://kubernetes.default.svc
    namespace: pr-*
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
  namespaceResourceBlacklist:
  - group: argoproj.io
    kind: Application
  - group: argoproj.io
    kind: ApplicationSet
  - group: argoproj.io
    kind: AppProject
  orphanedResources:
    warn: true

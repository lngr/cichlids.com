apiVersion: v1
kind: ResourceQuota
metadata:
  name: preview
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  hard:
    requests.cpu: '1'
    requests.memory: 1Gi
    limits.cpu: '2'
    limits.memory: 2Gi
    pods: '10'
    persistentvolumeclaims: '1'
    services.loadbalancers: '0'
    services.nodeports: '0'
    requests.storage: 1Gi

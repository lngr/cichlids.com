# gitleaks configuration for the pre-push hook and the CI secrets-scan job.
# The default rules apply; the allowlists below only remove paths from the scan.

title = "cichlids.com gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Recovered legacy material and lock files"
paths = [
  # Recovered legacy configs with credentials that are treated as compromised, plus PII.
  '''^workspace-legacy/''',
  # Content hashes in lock files resemble tokens.
  '''(^|/)pnpm-lock\.yaml$''',
  '''(^|/)package-lock\.json$''',
  '''(^|/)packages\.lock\.json$''',
  '''\.lock\.hcl$''',
  '''\.lock$''',
]

[[allowlists]]
description = "Env templates hold empty assignments; the generic rule reads the next key name as the value"
targetRules = ["generic-api-key"]
paths = ['''(^|/)[^/]*\.env\.example$''']

[[allowlists]]
description = "Public test-only age key for the CI round-trip fixture"
paths = ['''(^|/)tools/fixtures/secrets/age-test-key\.txt$''']
